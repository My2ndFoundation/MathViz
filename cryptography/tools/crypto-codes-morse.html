                  zh: '明文 —— 字母与数字（摩尔斯两样都有码）' }],
    [ioKwLabel, { en: 'Keyword for the triple table — the only secret on this page',
                  zh: '三元组表的关键词 —— 本页唯一的秘密' }]
  ];
  want.forEach(function (p) {
    if (!p[0]) return;
    const s = E.t(p[1]);
    if (p[0].textContent !== s) p[0].textContent = s;
  });
}

const PRESET_LABEL = {
  'pangram':      { en: 'Pangram',   zh: '全字母句' },
  'attack':       { en: 'Short',     zh: '短句' },
  'caesar-quote': { en: 'Caesar',    zh: '凯撒' }
};
/* 短句排第一：引擎的 buildPresets() 建面板时就选中第一项，而第一眼看到的
   应该是一段**一屏放得下**的报文——第三页的符号带上，'ATTACK AT DAWN' 的
   39 个符号在窄屏上也基本能整条看见，95 个字母的全字母句则要靠窗口滚动。 */
const PRESET_ORDER = ['attack', 'pangram', 'caesar-quote'];
const TEXT_PRESETS = PRESET_ORDER.map(function (id) {
  const p = EX.plaintext(id);
  return {
    key: p.id,
    label: PRESET_LABEL[p.id] || { en: p.id, zh: p.id },
    onSelect: function () { ACTIVE_NOTE = p.note || null; setPlain(E.t(p.text), true); }
  };
});
const PRESETS_LABEL = { en: 'Text', zh: '明文' };

/* ================= 离散时钟 =================
   每页各有一条自己的"第几步"：table 走 26 个字母，encoding-vs-cipher 走四个
   交付阶段，fractionated 走明文的字母。步数随明文变，而 createTimeline 的
   steps 是建表时钉死的（seek 读的是闭包里那个值），所以步数一变就重建一条，
   并把当前 index 夹着搬过去——否则换段明文，动画会从第 0 步重新开始。

   **播放与否**归引擎的 state.running（⏵/⏸ 由引擎自己绑），**走到第几步**归
   时间轴：时间轴一建好就 play() 且永不 pause()，真正的闸门是 advance() 里那个
   state.running 判断。两边各管一件事，不会出现"按钮显示暂停、画面还在动"。 */
const CLOCKS = {};
let CUR_TL = null;

function clockFor(id, steps, dur) {
  const want = Math.max(1, Math.round(steps));
  const old = CLOCKS[id];
  if (old && old.steps === want) return old;
  const tl = CryptoAnim.createTimeline({ steps: want, stepDuration: dur, loop: true, rate: 1 });
  tl.play();
  if (old) tl.seek(Math.min(old.index, want - 1));
  CLOCKS[id] = tl;
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function advance(id, steps, dur) {
  const tl = clockFor(id, steps, dur);
  tl.setRate(E.state.speed > 0 ? E.state.speed : 1);
  if (E.state.running) tl.tick(E.state.dt);
  return tl;
}
function tickClock(id, steps, dur) {
  const tl = advance(id, steps, dur);
  CUR_TL = tl;
  return tl;
}

document.getElementById('btnBack').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing 在本页
   恒为 true（真正的闸门是 advance() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { if (CUR_TL) CUR_TL.seek(0); });

/* ================= 悬停 =================
   第一页的核心动作是"把鼠标停在树的某个节点上"，所以指针位置必须是页面自己
   的状态。这里另挂一对监听器，**不**碰引擎的 bindOrbit()：那一套只在指针按下
   时才动相机，两者互不干扰。触摸屏上 pointermove 只在按住时才来，所以
   pointerdown 也记一次——手指点一下同样能点亮一个节点。 */
const HOVER = { x: -1, y: -1, active: false };
(function () {
  const cv = document.getElementById('c');
  function put(e) {
    const r = cv.getBoundingClientRect();
    HOVER.x = e.clientX - r.left;
    HOVER.y = e.clientY - r.top;
    HOVER.active = true;
  }
  cv.addEventListener('pointermove', put);
  cv.addEventListener('pointerdown', put);
  cv.addEventListener('pointerleave', function () { HOVER.active = false; });
})();

/* 画面与读数必须指着**同一个**东西。命中测试要用 draw() 里那套排版几何，
   readout() 手上没有这些量；在 readout() 里把几何重算一遍是两份真相，迟早
   错开。所以 draw() 把结论留在这儿，readout() 只读。 */
const CURSOR = { letter: 'E', frac: 0 };

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里是 `p.fmt(parseFloat(input.value))`。
     写成数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'k',
    label: { en: 'Caesar shift <i>k</i>', zh: '凯撒位移 <i>k</i>' },
    min: 0, max: 25, step: 1, value: 3,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'speed',
    /* 速度不是数学量，所以不加 <i>；<i>k</i> 才是。 */
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

function currentK() {
  const k = Math.round(E.state.k);
  return (k >= 0 && k <= 25) ? k : 3;      // init() 之前 state.k 还不存在
}

/* ================= 每帧一份、只在输入变了才重算的派生量 =================
   与 crypto-polybius.html 的 derived() 同一手法：不是为了省 CPU，而是为了让
   画面与读数在同一帧里读的是**同一份**结果，不会因为两次独立计算而错半帧。
   凯撒那一列不进缓存——它依赖滑杆 k，而 k 每拖一格都会变，进了缓存就要把 k
   写进缓存键，得不偿失（encrypt 本来就是一趟线性扫描）。 */
const DERIVED = { key: null };

function derived() {
  /* 缓存键用 JSON 拼，不用分隔符拼字符串：明文里什么字符都可能有，
     随便挑一个分隔符就意味着某段输入能伪造出另一段输入的键。 */
  const key = JSON.stringify([PLAIN, KW_RAW]);
  if (DERIVED.key === key) return DERIVED;
  DERIVED.key = key;

  const plain = MO.normalizeText(PLAIN);
  DERIVED.plain = plain;
  DERIVED.letters = plain.replace(/ /g, '');
  DERIVED.n = DERIVED.letters.length;
  DERIVED.morse = MO.toMorse(PLAIN);

  /* 明文里每个**非空格**字符的下标——第三页的时钟走的是字母，不是字符。 */
  const idx = [];
  for (let j = 0; j < plain.length; j++) if (plain.charAt(j) !== ' ') idx.push(j);
  DERIVED.letterIdx = idx;

  const keyAlpha = SB.keyFromKeyword(KW_RAW);
  DERIVED.keyAlpha = keyAlpha;
  DERIVED.tr = MO.fractionatedTrace(PLAIN, keyAlpha);
  DERIVED.cipher = DERIVED.tr.cipher;
  /* 对照组：同一把关键词密钥、同一段明文的**单表代换**。选它而不是随便一把
     密钥，是为了让两条剖面只差一件事——有没有把字母切开。 */
  DERIVED.subst = plain ? SB.encrypt(plain, keyAlpha) : '';

  /* 两个统计量，都是整段报文的性质，不是某一个字母的：
       aligned —— 有多少组**正好是一个完整字母**（三个符号同属一个字母，
                  且恰好是它的全部）。这是"密文字母 = 明文字母"唯一还可能
                  成立的情形，实测它几乎恒为 0，而 0 正是本页要证明的那句话。
       mixed   —— 有多少组混着两个或更多字母的符号。
     为什么要 aligned 而不是只报 mixed：单看某一个字母，它可能恰好整个落在
     一组里（'A' 的 '.-' 加一个分隔符就凑满一组），那时候光看 mixed 会以为
     "分裂没发生"；而"没有哪一组是一个完整字母"对每一段明文都成立。
     分隔符（owner = −1）不算字母：它属于机器，不属于任何人。 */
  let mixed = 0, aligned = 0;
  const tr = DERIVED.tr;
  for (let g = 0; g < tr.groups.length; g++) {
    const seen = {};
    let cnt = 0, sep = 0, only = -1;
    for (let s = 0; s < 3; s++) {
      const o = tr.owner[g * 3 + s];
      if (o < 0) { sep++; continue; }
      if (!seen[o]) { seen[o] = 1; cnt++; only = o; }
    }
    if (cnt >= 2) mixed++;
    if (cnt === 1 && sep === 0 && tr.first[only] === g * 3 && tr.last[only] === g * 3 + 2) aligned++;
  }
  DERIVED.mixedGroups = mixed;
  DERIVED.alignedGroups = aligned;
  DERIVED.groupCount = tr.groups.length;

  DERIVED.freqSub  = AN.letterCounts(DERIVED.subst);
  DERIVED.freqFrac = AN.letterCounts(DERIVED.cipher);
  DERIVED.freqMax  = Math.max(1,
    Math.max.apply(null, DERIVED.freqSub), Math.max.apply(null, DERIVED.freqFrac));
  DERIVED.iocPlain = AN.indexOfCoincidence(plain);
  DERIVED.iocSub   = AN.indexOfCoincidence(DERIVED.subst);
  DERIVED.iocFrac  = AN.indexOfCoincidence(DERIVED.cipher);
  /* 离均匀随机（1/26）还剩多少英文信号。分母可能塌成 0（明文太短），这时候
     比值没有意义，给 null 让画面明说，而不是画一个 NaN。 */
  const RANDOM = 1 / 26;
  const span = DERIVED.iocPlain - RANDOM;
  DERIVED.keptSub  = span > 1e-6 ? (DERIVED.iocSub  - RANDOM) / span : null;
  DERIVED.keptFrac = span > 1e-6 ? (DERIVED.iocFrac - RANDOM) / span : null;

  /* 第一页的歧义演示：取明文头几个字母，把它们的码首尾相连（分隔符全抹掉），
     裸串封到 14 个符号以内——再长，读法数会大到只剩一个"很大"的印象，
     而这一格要的是"你能亲眼数完的那几种"。 */
  let bare = '', used = 0;
  const src = DERIVED.letters || 'SOS';
  for (let i = 0; i < src.length; i++) {
    const code = MO.MORSE_TABLE[src.charAt(i)];
    if (bare.length + code.length > 14) break;
    bare += code; used++;
  }
  if (!bare) { bare = MO.MORSE_TABLE[src.charAt(0)]; used = 1; }
  DERIVED.bare = bare;
  DERIVED.bareWord = src.slice(0, used);
  DERIVED.readings = MO.countReadings(bare);
  DERIVED.readingList = MO.ambiguousReadings(bare, 4);
  return DERIVED;
}

/* ================= 版面 =================
   面板固定占着右边 304px，宽屏时把可用区收窄，让图形不会钻到面板底下。
   top 给 122 而不是更小：左上角那块 brand（h1 + 两行说明，max-width 到 42vw）
   底边大约就在 100px，贴着它画会与它并排、读起来像同一句话。窄屏上 brand 被
   压扁、页签与传输条挪到左上，所以 top 让到 176。 */
function layout() {
  const vi = E.viewInfo();
  /* 面板什么时候贴在右上角，由 CSS 的断点说了算：`@media (max-width:760px)`
     以下它变成贴底的抽屉，以上它是 top:14 right:14 宽 304 的浮层。所以这里
     的界线用 760，不用 crypto-polybius.html 那个 900——它那条界线在
     761–900px 这一段里会让图形整块钻到面板底下（无头驱动在 820px 上量到
     内容右边缘 780，而面板从 502 起就盖住了）。付出的代价是 820px 上可用宽
     只剩 442，窄一点，但看得见。 */
  const rightPad = vi.W > 760 ? 330 : 16;
  return {
    W: vi.W, H: vi.H,
    x0: 24,
    availW: Math.max(240, vi.W - 48 - rightPad),
    top: vi.W > 760 ? 122 : 176,
    bottom: vi.H - 86
  };
}

/* chip 把文字**居中**画，而 fillText 不裁剪：句子比盒子长时它从两头一起漫
   出去，窄屏上左端直接漫出画布。第一道防线是换一句短的： */
function fit(L, wideMsg, narrowMsg) { return L.availW < 470 ? narrowMsg : wideMsg; }

/* 第二道防线：真的按盒子宽度截断。
   "换一句短的"只在**语言与视口都在预料之内**时管用，而这两件事都会跑出预料：
   同一句话的中英文长度能差一倍，而"2758 种读法：…"这类句子里带着一个随明文
   变的列表，长度根本不是写代码时能知道的。实测（本页的无头驱动，三个视口
   各跑一遍）抓到两处：第一页的读法列表在 375px 上从 x=−135 一直画到 494，
   第三页的表头在 1440px 上也漫出左边缘——两处都是"作者以为它够短"。

   VizEngine 不暴露 measureText（它把 ctx 关在闭包里），所以这里用一个**偏保守**
   的字宽估计：西文 0.55em。无衬线与 Georgia 的平均字宽都在 0.5em 上下，取 0.55
   意味着宁可早截一个字，也不让文字漫出盒子——反过来的错误是看不见的。

   中日文是**全角**，一个字差不多是一个 em，比西文的平均字宽宽将近一倍。按
   "数几个字符"去估，会把中文句子系统性地低估到只有实际的一半——同一句话
   英文不溢出、中文溢出，而这正是"换一句短的"最容易漏掉的那一半。所以宽度
   按字符分两档算，不按个数算。 */
const EM_W = 0.55;          // 西文平均字宽（相对字号）
const EM_WIDE = 1.05;       // 东亚全角
/* 东亚全角区间（Unicode 的 East Asian Wide/Fullwidth 的常用子集）。
   写成一个函数而不是一条正则：正则要跨代理对，而这里逐 code unit 判断就够，
   高位代理落在这些区间之外，会被当成半角——那是**偏窄**的估计，方向安全。 */
function isWideChar(c) {
  return (c >= 0x1100 && c <= 0x115F) || (c >= 0x2E80 && c <= 0xA4CF) ||
         (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0xF900 && c <= 0xFAFF) ||
         (c >= 0xFE30 && c <= 0xFE6F) || (c >= 0xFF00 && c <= 0xFF60) ||
         (c >= 0xFFE0 && c <= 0xFFE6);
}
function textW(s, fontSize) {
  let u = 0;
  for (let i = 0; i < s.length; i++) u += isWideChar(s.charCodeAt(i)) ? EM_WIDE : EM_W;
  return u * fontSize;
}
function fitText(s, boxW, fontSize) {
  s = String(s);
  if (textW(s, fontSize) <= boxW) return s;
  const limit = boxW - fontSize * EM_W;      // 给省略号留一个位置
  let w = 0, out = '';
  for (let i = 0; i < s.length; i++) {
    const cw = (isWideChar(s.charCodeAt(i)) ? EM_WIDE : EM_W) * fontSize;
    if (w + cw > limit) break;
    w += cw; out += s.charAt(i);
  }
  return (out || s.charAt(0)) + '…';
}
/* 画一句话用它，画一个字母/符号仍然用 E.chip——单个字形永远装得下，
   过一遍截断只会白费一次字符串操作。 */
function textChip(x, y, w, h, s, o) {
  o = o || {};
  E.chip(x, y, w, h, fitText(s, w - 8, o.fontSize || 12), o);
}

function notice(L, msg, color) {
  textChip(L.x0, L.top + 40, Math.min(460, L.availW), 30, msg,
           { mono: true, color: color || ORANGE, fill: O_SOFT,
             stroke: 'rgba(251,146,60,.38)', fontSize: 12 });
}
function needText(L) {
  notice(L, E.t({ en: 'Nothing encodable in the plaintext yet.',
                  zh: '明文里还没有任何可编码的字符。' }));
}

/* 规范化之后的密文是一整串没有空格的字母，浏览器**无处可断行**，于是它会
   直接从面板右边溢出去。给这几处读数加 word-break，比把长度砍到二三十个
   字母好——砍短了就看不出"密文比明文长"这件事。 */
function longVal(color, s) {
  return '<b style="--c:var(--trace-' + color + ');word-break:break-all">' + esc(s) + '</b>';
}

/* 一条字符带：把一串字符按格宽铺成若干行，装不下就由调用方明说截断。
   用 cellGrid 而不是逐字符 chip：cellGrid 整块只做一次 save/restore，而一段
   95 字母的摩尔斯有三百多个字符，逐个 chip 是每帧三百次 save/roundRect/restore。
   描边给全透明——这一条读起来该像文字，不像表格。 */
function charStrip(x, y, availW, text, cell, maxRows, colorOf, o) {
  o = o || {};
  const per = Math.max(4, Math.floor(availW / cell));
  const rowsFull = Math.max(1, Math.ceil(text.length / per));
  const rows = Math.min(rowsFull, Math.max(1, maxRows));
  const shown = Math.min(text.length, rows * per);
  E.cellGrid(x, y, Math.max(1, Math.min(per, shown)), rows, cell, {
    text: function (c, r) {
      const i = r * per + c;
      return i < shown ? text.charAt(i) : '';
    },
    textColor: function (c, r) {
      const i = r * per + c;
      return i < shown ? colorOf(text.charAt(i), i) : null;
    },
    stroke: 'rgba(0,0,0,0)',
    fontSize: o.fontSize || cell * 0.78,
    mono: !!o.mono
  });
  return { shown: shown, rows: rows, per: per, height: rows * cell };
}

/* 符号的颜色只在这一处定义：点紫、划绿、分隔橙。三个页签都调它，写成一个
   函数免得某一处手抖把点画成绿的——画出来一样好看，意思却是反的。 */
function symColor(ch) {
  if (ch === MO.DOT) return VIOLET;
  if (ch === MO.DASH) return EMERALD;
  if (ch === MO.SEP) return ORANGE;
  return DIM;                             // 摩尔斯抄本里的空格与斜杠
}
function symSoft(ch) {
  if (ch === MO.DOT) return V_SOFT;
  if (ch === MO.DASH) return E_SOFT;
  if (ch === MO.SEP) return O_SOFT;
  return null;
}

/* ================= 页签一：摩尔斯树 =================
   点向左、划向右。一个字母的码就是从根走到它的那条路径，所以**码长就是深度**
   ——这是"变长"这件事在图上的样子。

   真正要看见的是另一件事：字母坐在**内部节点**上。前缀码要求所有码字都在
   叶子上，而 E 在第 1 层、I 在第 2 层、S 在第 3 层、H 在第 4 层，四个字母串在
   同一条全点的枝上。所以在只有点划两种符号的字母表上，摩尔斯是歧义的，
   而字母之间那个停顿是让它可解的第三个符号。 */
const TREE_DEPTH = 4;                     // 字母最深到第 4 层；数字在第 5 层，另画一条

/* 深度 d、下标 i 的节点对应哪个码：i 的二进制从高位到低位，0 是点、1 是划。 */
function nodeCode(d, i) {
  let s = '';
  for (let b = d - 1; b >= 0; b--) s += ((i >> b) & 1) ? MO.DASH : MO.DOT;
  return s;
}
/* 反过来：一个码在它那一层的下标。 */
function codeIndex(code) {
  let i = 0;
  for (let b = 0; b < code.length; b++) i = i * 2 + (code.charAt(b) === MO.DASH ? 1 : 0);
  return i;
}
function nodeX(x0, availW, d, i) { return x0 + availW * (i + 0.5) / Math.pow(2, d); }

const tableScene = {
  label: { en: 'Table', zh: '码表' },
  brand: { en: 'Dot left, dash right: a letter is a path. The letters sit on inner nodes, not leaves — which is exactly why the gap between letters is a symbol, not a typographic habit.',
           zh: '点向左、划向右：一个字母就是一条路径。字母坐在内部节点上，不在叶子上 —— 正因如此，字母之间那个停顿是一个符号，不是排版习惯。' },
  tips: { en: 'Turn on "the all-dot chain": E, I, S, H hang off one branch, each the prefix of the next. A prefix-free code keeps every codeword on a leaf; Morse does not, so with the gaps stripped out the same dots read several ways at once — the strip below counts them. Put the gaps back and the count is exactly one. That third symbol is the whole reason Morse is readable.',
          zh: '打开「全点链」：E、I、S、H 挂在同一条枝上，每一个都是下一个的前缀。前缀码要求所有码字都落在叶子上，摩尔斯不是——所以把停顿抹掉之后，同一串点可以同时读成好几种，下面那一条把它们数出来。把停顿放回去，读法恰好一种。那个第三符号就是摩尔斯之所以可读的全部原因。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['speed'],
  /* 本页图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎双击
     回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'tRead',   label: { en: 'Readings with no gaps', zh: '抹掉停顿后的读法' }, color: ROSE,    checked: true },
    { key: 'tChain',  label: { en: 'The all-dot chain',      zh: '全点链' },           color: VIOLET,  checked: true },
    { key: 'tDigits', label: { en: 'Digits 0–9',             zh: '数字 0–9' },         color: EMERALD, checked: false },
    { key: 'tSep',    label: { en: 'The third symbol',       zh: '第三个符号' },        color: ORANGE,  checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tl = tickClock('table', 26, 0.5);

    /* 底下几条带先把高度预留出来，剩下的才是树的。 */
    let reserve = 0;
    if (E.state.tRead) reserve += 96;
    if (E.state.tDigits) reserve += (L.availW >= 470 ? 48 : 72);   // 窄屏排两行
    const availH = Math.max(150, L.bottom - L.top - reserve);
    const levelH = E.clamp(availH / (TREE_DEPTH + 0.6), 26, 76);

    /* 一个格子放不下 15px 就没法读了。375px 上 availW ≈ 311，第 4 层 16 个槽
       → 19px，正好还够；再窄就**少画一层**，而不是把格子压到看不见——
       "先定格数再把格宽压到下限"正是 crypto-caesar 1.0.2 修掉的那种做法。 */
    let depth = TREE_DEPTH;
    while (depth > 2 && L.availW / Math.pow(2, depth) < 15) depth--;
    const slot = L.availW / Math.pow(2, depth);
    const cell = E.clamp(Math.min(slot * 0.82, levelH * 0.62), 11, 34);
    /* levelH 有上限（76），所以高屏上树只占 300 多像素，剩下的三四百像素会
       空在树和底下那两条带之间。把树在它自己那一格里**竖直居中**，空白就
       平分到上下两边，画面重心不再往上吊。 */
    const top = L.top + 18 + Math.max(0, (availH - (depth * levelH + cell)) / 2);

    /* 悬停优先，没有悬停就跟着时钟走 A→Z。 */
    let hot = null;
    if (HOVER.active) {
      const d = Math.round((HOVER.y - top) / levelH);
      if (d >= 1 && d <= depth) {
        const i = Math.floor((HOVER.x - L.x0) / (L.availW / Math.pow(2, d)));
        if (i >= 0 && i < Math.pow(2, d)) {
          const code = nodeCode(d, i);
          if (MO.CODE_TO_CHAR[code] !== undefined) hot = code;
        }
      }
    }
    if (!hot) hot = MO.MORSE_TABLE[CC.ALPHABET.charAt(tl.index % 26)];
    CURSOR.letter = MO.CODE_TO_CHAR[hot] || 'E';

    /* ---- 枝：从每个节点连到它的两个孩子 ----
       先画全部的淡枝，再把被追踪的那条路径重描一遍——顺序反了会被淡枝盖住。 */
    const chainOn = !!E.state.tChain;
    for (let d = 0; d < depth; d++) {
      const cnt = Math.pow(2, d);
      for (let i = 0; i < cnt; i++) {
        const px = nodeX(L.x0, L.availW, d, i), py = top + d * levelH;
        for (let b = 0; b < 2; b++) {
          const ci = i * 2 + b;
          const cx = nodeX(L.x0, L.availW, d + 1, ci), cy = top + (d + 1) * levelH;
          /* 全点链：'.', '..', '...', '....' 那四条枝。它们是本页的主张，
             所以比别的枝亮、也比别的枝粗。 */
          const isChain = chainOn && nodeCode(d + 1, ci).indexOf(MO.DASH) < 0;
          E.flowArrow(px, py + cell * 0.5, cx, cy - cell * 0.5, {
            color: isChain ? V_EDGE : (b === 0 ? 'rgba(167,139,250,.20)' : 'rgba(52,211,153,.20)'),
            width: isChain ? 1.8 : 1, head: false
          });
        }
      }
    }
    /* 被追踪字母的那条路径，分段画，每一段用它自己那个符号的颜色——
       "码就是路径"这句话因此是看出来的：路径上的紫绿次序就是它的码。 */
    for (let d = 0; d < hot.length && d < depth; d++) {
      const pi = codeIndex(hot.slice(0, d));
      const ci = codeIndex(hot.slice(0, d + 1));
      const px = nodeX(L.x0, L.availW, d, pi), py = top + d * levelH;
      const cx = nodeX(L.x0, L.availW, d + 1, ci), cy = top + (d + 1) * levelH;
      E.flowArrow(px, py + cell * 0.5, cx, cy - cell * 0.5,
                  { color: symColor(hot.charAt(d)), width: 2.6, head: false });
    }

    /* ---- 根 ---- */
    E.chip(nodeX(L.x0, L.availW, 0, 0) - cell / 2, top - cell / 2, cell, cell, '',
           { fill: 'rgba(148,163,184,.10)', stroke: LINE, radius: 4 });

    /* ---- 节点 ---- */
    for (let d = 1; d <= depth; d++) {
      const cnt = Math.pow(2, d);
      for (let i = 0; i < cnt; i++) {
        const code = nodeCode(d, i);
        const ch = MO.CODE_TO_CHAR[code];
        const x = nodeX(L.x0, L.availW, d, i) - cell / 2, y = top + d * levelH - cell / 2;
        if (ch === undefined) {
          /* 空节点：ITU 的 26 字母里没有这条路径。画一个小点而不是留白——
             留白会让人以为树在这里就断了，而它并没有。 */
          E.chip(x + cell * 0.35, y + cell * 0.35, cell * 0.3, cell * 0.3, '',
                 { fill: 'rgba(148,163,184,.16)', radius: 2 });
          continue;
        }
        const on = (code === hot);
        const inChain = chainOn && code.indexOf(MO.DASH) < 0;
        E.chip(x, y, cell, cell, ch, {
          color: on ? BRIGHT : (inChain ? VIOLET : CYAN),
          fill: on ? 'rgba(226,232,240,.20)' : (inChain ? V_SOFT : C_SOFT),
          stroke: on ? 'rgba(226,232,240,.55)' : (inChain ? V_EDGE : C_EDGE),
          fontSize: cell * 0.54, radius: 4
        });
      }
    }

    /* ---- 第三个符号：图例 ---- */
    if (E.state.tSep) {
      textChip(L.x0, L.top - 8, Math.min(470, L.availW), 20,
               E.t(fit(L,
                 { en: '·  dot     −  dash     x  the gap  —  three symbols, not two',
                   zh: '·  点     −  划     x  停顿  ——  三个符号，不是两个' },
                 { en: '·  dot   −  dash   x  gap', zh: '·  点   −  划   x  停顿' })),
               { mono: true, color: ORANGE, fontSize: 11 });
    }

    /* ---- 底下的两条带 ---- */
    let by = L.bottom - reserve + 24;

    if (E.state.tRead) {
      const bare = D.bare, word = D.bareWord;
      const u = E.clamp(Math.floor(L.availW / Math.max(12, bare.length + 2)), 10, 22);
      textChip(L.x0, by - 20, Math.min(520, L.availW), 16,
               E.t(fit(L,
                 { en: 'the first letters of the plaintext, with every gap stripped out',
                   zh: '明文开头几个字母，把所有停顿都抹掉' },
                 { en: 'gaps stripped out', zh: '抹掉全部停顿' })),
               { mono: true, color: ROSE, fontSize: 10.5 });
      for (let i = 0; i < bare.length; i++) {
        E.chip(L.x0 + i * u, by, u, u, bare.charAt(i),
               { color: symColor(bare.charAt(i)), fill: symSoft(bare.charAt(i)),
                 stroke: 'rgba(148,163,184,.18)', fontSize: u * 0.62, radius: 2 });
      }
      /* 读法列表能挤在符号带右边就挤在那儿，挤不下就换到下一行。 */
      const rx = L.x0 + bare.length * u + 12;
      const rw = L.availW - bare.length * u - 12;
      const inline = rw >= 200;
      const boxW = Math.min(inline ? rw : L.availW, 470);
      /* 列表是**按装得下多少条**拼的，不是拼完再截：截断会把最后一条读法砍成
         半截，而每一条读法都是一个完整的答案——半个答案不是更短的答案，
         是一个错的东西。 */
      const head = D.readings + E.t({ en: ' readings:  ', zh: ' 种读法：' });
      const cap = boxW - 8;
      let list = '';
      for (let i = 0; i < D.readingList.length; i++) {
        const next = list ? list + ' / ' + D.readingList[i] : D.readingList[i];
        if (textW(head + next + ' …', 11) > cap) break;
        list = next;
      }
      const more = D.readings > D.readingList.length || list.split(' / ').length < D.readingList.length;
      E.chip(inline ? rx : L.x0, inline ? by - 1 : by + u + 6, boxW, u + 2,
             head + list + (more ? ' …' : ''),
             { mono: true, color: ROSE, fill: R_SOFT, stroke: R_EDGE, fontSize: 11 });
      textChip(L.x0, by + u + (inline ? 8 : 8 + u + 6), Math.min(520, L.availW), 20,
               E.t(fit(L,
                 { en: 'put the gaps back — “' + word + '” — and there is exactly 1',
                   zh: '把停顿放回去 —— 「' + word + '」 —— 读法恰好 1 种' },
                 { en: 'gaps back: exactly 1', zh: '放回停顿：恰好 1 种' })),
               { mono: true, color: CYAN, fontSize: 11 });
      by += 96;
    }

    if (E.state.tDigits) {
      /* 窄屏上排两行五个：十个挤成一行时每格只有 31px，而 "7 --..." 是七个
         字符——把字号压到装得下等于压到看不见。少排几列、多排一行，格子的
         **数量**跟着空间走，格子的**大小**不跟着走。 */
      const cols = L.availW >= 470 ? 10 : 5;
      const rows = 10 / cols;
      const dw = Math.min(L.availW / cols, 92);
      textChip(L.x0, by - 18, Math.min(420, L.availW), 15,
               E.t({ en: 'digits live one level deeper — five symbols each',
                     zh: '数字在更深一层 —— 每个都是五个符号' }),
               { mono: true, color: EMERALD, fontSize: 10.5 });
      for (let i = 0; i < 10; i++) {
        const dch = String(i);
        const r = Math.floor(i / cols), c = i % cols;
        E.chip(L.x0 + c * dw, by + r * 24, dw - 3, rows > 1 ? 21 : 26,
               dch + ' ' + MO.MORSE_TABLE[dch],
               { mono: true, color: EMERALD, fill: E_SOFT, stroke: 'rgba(52,211,153,.24)',
                 fontSize: E.clamp((dw - 8) / (7 * EM_W), 8, 11), radius: 3 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    const ch = CURSOR.letter;
    const code = MO.MORSE_TABLE[ch];
    let s = E.t({ en: 'letter ', zh: '字母 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + esc(ch) + '</i></b>' +
      '<span class="dim"> &#8594; </span>';
    for (let i = 0; i < code.length; i++) {
      s += '<b style="--c:var(--trace-' + (code.charAt(i) === MO.DOT ? 'violet' : 'emerald') +
           ')">' + code.charAt(i) + '</b>';
    }
    s += '<span class="dim">   ' +
      E.t({ en: code.length + (code.length === 1 ? ' symbol · depth ' : ' symbols · depth ') + code.length,
            zh: code.length + ' 个符号 · 第 ' + code.length + ' 层' }) + '</span><br>';

    /* 前缀关系：这个字母的码是谁的前缀、谁又是它的前缀。这一条是本页的主张，
       所以它在读数里是一句具体的话，不是一句形容。 */
    const anc = [], desc = [];
    Object.keys(MO.MORSE_TABLE).forEach(function (c) {
      const other = MO.MORSE_TABLE[c];
      if (c === ch) return;
      if (code.indexOf(other) === 0) anc.push(c);
      else if (other.indexOf(code) === 0) desc.push(c);
    });
    if (anc.length) {
      s += '<span class="dim">' + E.t({ en: 'its own prefixes: ', zh: '它的前缀是：' }) + '</span>' +
        '<b style="--c:var(--trace-orange)">' + esc(anc.join(' ')) + '</b><br>';
    }
    if (desc.length) {
      s += '<span class="dim">' + E.t({ en: 'a prefix of: ', zh: '它是谁的前缀：' }) + '</span>' +
        '<b style="--c:var(--trace-orange)">' + esc(desc.join(' ')) + '</b><br>';
    }
    if (!anc.length && !desc.length) {
      s += '<span class="dim">' +
        E.t({ en: 'no prefix relation here — but E, I, S, H are still one chain',
              zh: '这一个没有前缀关系 —— 但 E、I、S、H 依然串在同一条链上' }) + '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'stripped of gaps, ', zh: '抹掉停顿后，' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(D.bare) + '</b>' +
      '<span class="dim">' + E.t({ en: ' reads ', zh: ' 有 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + D.readings + '</b>' +
      '<span class="dim">' + E.t({ en: ' ways; with them, exactly 1', zh: ' 种读法；放回停顿，恰好 1 种' }) +
      '</span><br>' +
      '<span class="dim">' + E.t({ en: 'morse  ', zh: '摩尔斯 ' }) + '</span>' +
      longVal('violet', clip(D.morse, 72));
    if (ACTIVE_NOTE) s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>';
    return s;
  }
};

/* ================= 页签二：编码 vs 密码 —— 顿悟视角 =================
   左右两列是同一段明文的两种"看不懂"。四个阶段依次把东西交出去：

     ① 什么都不给      两边都是天书
     ② 公开算法        Kerckhoffs：算法可以印在报纸上，两边都还读不出来
     ③ 公开码表        左边当场读通 —— 编码的保密性归零，因为它本来就是零
     ④ 交出密钥 k      右边这才读通

   第 ③ 步是全页的支点：**码本一公开，编码就什么也没剩下**；而算法公开之后
   密码剩下的那一样东西，就是密钥。于是"密码"与"编码"的差别可以量成一个数
   ——密钥空间的大小：摩尔斯 1，凯撒 26，第三页那张有密钥的三元组表 26!。
   一个密钥空间只有一个元素的密码，就是一个编码。 */
const STAGES = [
  { num: '①', label: { en: 'nothing handed over', zh: '什么都不给' } },
  { num: '②', label: { en: 'the algorithm is public', zh: '公开算法' } },
  { num: '③', label: { en: 'the code table is public', zh: '公开码表' } },
  { num: '④', label: { en: 'the key is handed over', zh: '交出密钥' } }
];
function stageText(i) { return STAGES[i].num + ' ' + E.t(STAGES[i].label); }

/* log10(26!)。循环算而不是抄一个常数：抄下来的数字没有任何东西看着它。 */
const LOG_FACT26 = (function () { let s = 0; for (let i = 2; i <= 26; i++) s += Math.log10(i); return s; })();

const vsScene = {
  label: { en: 'Code vs cipher', zh: '编码 vs 密码' },
  brand: { en: 'The same message twice: Morse on the left, Caesar on the right. Both are unreadable to an untrained eye — only one of them is secret.',
           zh: '同一段报文两遍：左边摩尔斯，右边凯撒。对外行人两边都是天书 —— 但只有一边是秘密。' },
  tips: { en: 'This is the epiphany view. Press ⏭ four times. At step ③ the code table is published and the left column becomes readable to everyone — a code hides nothing, it only changes the representation. The right column needs one more thing, and that thing is the key. Publish the codebook and the code is gone; publish the key and the cipher is gone; the algorithm may be public either way — that is Kerckhoffs. Key space: Morse 1, Caesar 26. A code is a cipher whose key space has exactly one element.',
          zh: '这就是顿悟视角。按四次 ⏭。走到第 ③ 步，码表一公开，左边这一列立刻人人可读 —— 编码什么也没藏，它只是换了一种写法。右边还差一样东西，那就是密钥。公开码本，编码就没了；公开密钥，密码就没了；而算法两边都可以公开 —— 这就是 Kerckhoffs 原则。密钥空间：摩尔斯 1，凯撒 26。所谓编码，就是密钥空间只有一个元素的密码。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['k', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'eCipher', label: { en: 'Cipher column (Caesar)', zh: '密码列（凯撒）' },   color: ROSE,    checked: true },
    { key: 'eCode',   label: { en: 'Code column (Morse)',    zh: '编码列（摩尔斯）' }, color: VIOLET,  checked: true },
    { key: 'eKeys',   label: { en: 'Key space',              zh: '密钥空间' },         color: EMERALD, checked: true },
    { key: 'eSecret', label: { en: 'What stays secret',      zh: '什么必须保密' },      color: ORANGE,  checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tl = tickClock('vs', STAGES.length, 1.7);
    const stage = tl.index % STAGES.length;
    if (!D.n) { needText(L); return; }

    const k = currentK();
    const caesar = CS.encrypt(D.plain, k);

    /* ---- 阶段条。宽屏写全名，窄屏只写序号——宽度不够时把四个全名硬塞进去，
       结果是四团互相压住的字，不如只留序号 + 下面一行当前阶段的全名。 */
    const wide = L.availW >= 640;
    const sw = Math.min(210, (L.availW - 3 * 6) / 4);
    for (let i = 0; i < STAGES.length; i++) {
      const on = (i === stage), done = (i < stage);
      textChip(L.x0 + i * (sw + 6), L.top - 8, sw, 22,
             wide ? stageText(i) : STAGES[i].num,
             { mono: true,
               color: on ? BRIGHT : (done ? 'rgba(159,176,200,.85)' : DIM),
               fill: on ? 'rgba(226,232,240,.10)' : (done ? 'rgba(148,163,184,.06)' : null),
               stroke: on ? 'rgba(226,232,240,.4)' : LINE,
               fontSize: wide ? 11 : 12 });
    }
    let y = L.top + (wide ? 24 : 46);
    if (!wide) {
      textChip(L.x0, L.top + 18, Math.min(360, L.availW), 20, stageText(stage),
               { mono: true, color: BRIGHT, fontSize: 11.5 });
    }

    /* ---- 明文（两列共用的输入） ---- */
    const pu = E.clamp(Math.floor(L.availW / 46), 9, 16);
    textChip(L.x0, y, Math.min(300, L.availW), 15,
             E.t({ en: 'the message', zh: '这段报文' }),
             { mono: true, color: CYAN, fontSize: 10.5 });
    const ps = charStrip(L.x0, y + 17, L.availW, D.plain, pu, 2,
                         function () { return CYAN; }, { fontSize: pu * 0.72 });
    y += 17 + ps.height + 12;

    /* ---- 两列。高度由**剩下多少空间**反推行数，不是先定行数再挤——
       挤的后果是两列互相压住，或者压到密钥空间那一块上面去。 ---- */
    const secretH = E.state.eSecret ? 26 : 0;
    const keysH = E.state.eKeys ? 112 : 0;
    const remain = Math.max(90, L.bottom - y - keysH - secretH - 8);
    const twoCol = L.availW >= 620;
    const colW = twoCol ? (L.availW - 16) / 2 : L.availW;
    /* 格宽给 colW/34 而不是 /42：/42 在 1280px 上算出 10px 的格子、7.4px 的
       字，浏览器里点划几乎糊成一条虚线（实测截图确认）。少画几个字符、把
       "看得清"留住——装不下的部分下面那行截断说明会明说，而这一页要比的是
       两列的**性质**，不是把整段摩尔斯读一遍。 */
    const cu = E.clamp(Math.floor(colW / 34), 9, 16);
    const perColH = twoCol ? remain : (remain - 10) / 2;
    const CHROME = 22 + 6 + 16 + 20 + 6;     // 表头 + 间隙 + 截断说明 + "还需要什么" + 间隙
    let rowsTotal = Math.max(2, Math.floor((perColH - CHROME) / cu));
    const revealRows = Math.min(2, Math.max(1, Math.floor(rowsTotal / 3)));
    const bodyRows = E.clamp(rowsTotal - revealRows, 1, 3);
    const colH = CHROME + (bodyRows + revealRows) * cu;

    function column(cx, cy, on, head, headColor, body, bodyColorOf, needs, needsColor, revealAt) {
      if (!on) return;
      textChip(cx, cy, colW, 22, head,
               { mono: true, color: headColor, stroke: LINE, fontSize: 11.5, radius: 6 });
      const st = charStrip(cx, cy + 28, colW, body, cu, bodyRows, bodyColorOf,
                           { fontSize: cu * 0.74 });
      let yy = cy + 28 + bodyRows * cu;
      if (st.shown < body.length) {
        textChip(cx, yy, colW, 14,
                 E.t({ en: '(' + st.shown + ' of ' + body.length + ' shown)',
                       zh: '（' + body.length + ' 个里画了 ' + st.shown + ' 个）' }),
                 { mono: true, color: ORANGE, fontSize: 9.5 });
      }
      yy += 16;
      /* "要读它，你还需要什么" —— 这一行是全页的主语。 */
      textChip(cx, yy, colW, 20, needs, { mono: true, color: needsColor, fontSize: 10.5 });
      yy += 22;
      /* 读通了没有：到了这一列的揭晓阶段才把明文摆出来，之前是一排问号。
         问号不是装饰——它占着同一块位置，所以"什么时候变得可读"这件事是
         同一处的变化，而不是画面上多出来一块新东西。 */
      const revealed = stage >= revealAt;
      const shown = revealed ? D.plain : D.plain.replace(/[^ ]/g, '?');
      charStrip(cx, yy, colW, shown, cu, revealRows,
                function () { return revealed ? BRIGHT : 'rgba(159,176,200,.35)'; },
                { fontSize: cu * 0.72 });
    }

    column(L.x0, y, !!E.state.eCode,
           E.t({ en: 'CODE · Morse', zh: '编码 · 摩尔斯' }), CYAN,
           D.morse, symColor,
           E.t(stage >= 2
             ? { en: 'needs: the code table — you now have it',
                 zh: '需要：码表 —— 你已经拿到了' }
             : { en: 'needs: the code table (a public document)',
                 zh: '需要：码表（一份公开文件）' }),
           stage >= 2 ? CYAN : DIM, 2);
    column(twoCol ? L.x0 + colW + 16 : L.x0, twoCol ? y : y + colH + 10, !!E.state.eCipher,
           E.t({ en: 'CIPHER · Caesar k = ' + k, zh: '密码 · 凯撒 k = ' + k }), ROSE,
           caesar, function () { return ROSE; },
           E.t(stage >= 3
             ? { en: 'needs: the key k — you now have it', zh: '需要：密钥 k —— 你已经拿到了' }
             : (stage >= 1
                ? { en: 'needs: the key k — nobody published it',
                    zh: '需要：密钥 k —— 没有人公开过它' }
                : { en: 'needs: the key k', zh: '需要：密钥 k' })),
           stage >= 3 ? ROSE : ORANGE, 3);

    y += twoCol ? colH + 10 : 2 * colH + 20;

    /* ---- 密钥空间：把差别量成一个数 ---- */
    if (E.state.eKeys) {
      const by = Math.min(y, L.bottom - secretH - 106);
      const bw = Math.min(430, L.availW);
      textChip(L.x0, by, bw, 15,
             E.t(fit(L,
               { en: 'key space, log scale — this single number is the whole difference',
                 zh: '密钥空间（对数刻度）—— 差别就是这一个数' },
               { en: 'key space (log scale)', zh: '密钥空间（对数）' })),
             { mono: true, color: EMERALD, fontSize: 10.5 });
      /* barChart 在动画里必须传显式 max：不传的话每帧的最大值一变，所有柱子
         都会跳。这里量程本来就是固定的（26! 是本页最大的那个），写 27 更诚实。 */
      E.barChart(L.x0, by + 19, bw, 40, [0, Math.log10(26), LOG_FACT26], {
        max: 27, gap: 14,
        colorAt: function (i) { return [ORANGE, ROSE, EMERALD][i]; },
        labels: [E.t({ en: 'Morse |K|=1', zh: '摩尔斯 |K|=1' }),
                 E.t({ en: 'Caesar |K|=26', zh: '凯撒 |K|=26' }),
                 E.t({ en: 'triples |K|=26!', zh: '三元组表 |K|=26!' })],
        labelSize: 10, labelColor: DIM
      });
      /* 第一根柱子的高度是 0——这不是画错了，这就是结论：摩尔斯没有密钥，
         所以"猜密钥"这件事是免费的。把这句话写在柱子旁边，别让人以为是 bug。
         第二根只有几个像素也是真话，而且是同一件事的下一句：26 个密钥挡不住
         任何人。这句子刻意压短——它原来那一版在 1440px 上就被截掉了尾巴。 */
      textChip(L.x0, by + 19 + 40 + 16, Math.min(540, L.availW), 20,
             E.t(fit(L,
               { en: 'zero height means no key at all. 26 is a sliver; 26! is the tower.',
                 zh: '高度为零就是没有密钥。26 只是一道细缝，26! 才是那座塔。' },
               { en: 'zero height = no key at all', zh: '高度为零：没有密钥' })),
             { mono: true, color: BRIGHT, fontSize: 11,
               fill: 'rgba(226,232,240,.06)', stroke: 'rgba(226,232,240,.26)' });
    }

    /* ---- 必须保密的是什么 ---- */
    if (E.state.eSecret) {
      textChip(L.x0, L.bottom - 22, Math.min(560, L.availW), 20,
             E.t(fit(L,
               { en: 'public: the algorithm, the code table, the ciphertext.    secret: k, and only k.',
                 zh: '可以公开：算法、码表、密文。    必须保密：k，只有 k。' },
               { en: 'public: everything but k', zh: '除 k 之外都可以公开' })),
             { mono: true, color: ORANGE, fontSize: 11, fill: O_SOFT, stroke: O_EDGE });
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.n) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'nothing encodable', zh: '没有可编码的字符' }) + '</b>';
    }
    const tl = CLOCKS.vs;
    const stage = tl ? tl.index % STAGES.length : 0;
    const k = currentK();
    return '<b style="--c:var(--trace-cyan)">' + esc(stageText(stage)) + '</b>' +
      '<span class="dim">  ' + (stage + 1) + ' / ' + STAGES.length + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(D.plain, 56)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'morse  ', zh: '摩尔斯 ' }) + '</span>' +
      longVal('violet', clip(D.morse, 56)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'caesar ', zh: '凯撒 ' }) + '</span>' +
      longVal('rose', clip(CS.encrypt(D.plain, k), 56)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'key space  ', zh: '密钥空间 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">1</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-rose)">26</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-emerald)">26! &#8776; 4&#215;10&#178;&#8310;</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'a code is a cipher whose key space has exactly one element',
            zh: '所谓编码，就是密钥空间只有一个元素的密码' }) + '</span>';
  }
};

/* ================= 页签三：分裂式摩尔斯 =================
   同一条符号流，上面挂着字母的括号，下面挂着"三个一组"的框。字母括号宽窄
   不一（摩尔斯是变长的），组框恒等宽——两排边界因此系统性地错开，而错开的
   那一刀就是这个密码本身：一个密文字母的三个符号来自明文的**两三个不同
   字母**，于是密文里再没有任何一个字母对应明文里的任何一个字母。

   底下那对频率柱把这句话量出来：同一段明文、同一把关键词密钥，左边是单表
   代换（字母边界原样保留），右边是分裂式。左边的剖面就是明文的剖面换了个
   名字，右边被抹平。 */
const fracScene = {
  label: { en: 'Fractionated', zh: '分裂式' },
  brand: { en: 'Now use Morse as a substrate. Variable-length re-expression destroys the letter boundaries, and a keyed table over the 26 possible triples turns what is left into a real cipher.',
           zh: '现在把摩尔斯当基底用。变长重写把字母边界拆掉，再给 26 个可能的三元组配一张有密钥的表，剩下的东西就成了一个真正的密码。' },
  tips: { en: 'Watch the two rows of brackets. Above the strip the brackets are letters and they all have different widths; below it every frame is exactly three symbols wide. They do not line up, and they cannot — that mismatch is the cipher. Turn on the frequency profile: the simple substitution keeps every bit of the English signal (its sorted letter counts are identical to the plaintext), while the fractionated ciphertext keeps under a third of it.',
          zh: '盯住上下两排括号。符号带上面那一排是字母，宽窄不一；下面那一排每一个都正好三个符号宽。它们对不齐，也不可能对齐 —— 这个错位就是这个密码。打开频率剖面：单表代换保留了英文信号的每一点（它排序后的字母计数与明文逐项相等），分裂式则只剩下不到三成。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'fCipher',  label: { en: 'Ciphertext row',      zh: '密文行' },      color: ROSE,    checked: true },
    { key: 'fLetters', label: { en: 'Letter row',          zh: '字母行' },      color: VIOLET,  checked: true },
    { key: 'fFreq',    label: { en: 'Frequency profile',   zh: '频率剖面' },     color: EMERALD, checked: true },
    { key: 'fCuts',    label: { en: 'Where the cuts fall', zh: '切口落在哪' },   color: ORANGE,  checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tl = tickClock('frac', Math.max(1, D.n), 0.6);
    if (!D.n) { needText(L); return; }

    const tr = D.tr;
    const total = tr.padded.length;

    /* 格宽先定、每行几格由空间反推——反过来（先定格数再把格宽压到下限）在
       375px 上会把末尾几格画到画布外面（crypto-caesar 1.0.2 修的就是那个）。
       窗口宽度取 3 的倍数：组框恒是三格宽，窗口不对齐 3 的话每滚动一次组框
       都会换个相位，看着像组的宽度在变。 */
    const cell = E.clamp(Math.floor(L.availW / 30), 11, 26);
    let per = Math.max(9, Math.floor(L.availW / cell));
    per -= per % 3;
    const winCount = Math.min(per, total);

    /* 追踪的字母，以及让它留在窗口里的起点。 */
    const cur = D.letterIdx[tl.index % D.letterIdx.length];
    CURSOR.frac = cur;
    let start = tr.first[cur] - Math.floor(per / 3);
    start = Math.round(E.clamp(start, 0, Math.max(0, total - per)));
    start -= start % 3;

    const y0 = L.top + 26;
    const rowH = 22;
    const stripY = y0 + rowH + 6;
    const groupY = stripY + cell + 6;
    const winEnd = Math.min(total, start + winCount);

    function cellX(i) { return L.x0 + (i - start) * cell; }

    /* 表头拆成两块，不塞成一句：一句里带着"第 a–b 个，共 N 个"这种会变长的
       数字，再接一段图例，合起来在 1440px 上也漫出了左边缘（无头驱动实测
       x 从 −1 起）。两块各自有自己的盒子，各自独立截断。 */
    const headW = Math.min(230, L.availW);
    textChip(L.x0, L.top + 2, headW, 18,
             E.t({ en: 'symbols ' + (start + 1) + '–' + winEnd + ' of ' + total,
                   zh: '第 ' + (start + 1) + '–' + winEnd + ' 个符号 / 共 ' + total + ' 个' }),
             { mono: true, color: SLATE, fontSize: 10.5 });
    if (L.availW >= headW + 240) {
      textChip(L.x0 + headW + 10, L.top + 2, L.availW - headW - 10, 18,
               E.t({ en: 'above: letters, each a different width   ·   below: groups of three, all the same',
                     zh: '上：字母，宽窄不一   ·   下：三个一组，恒等宽' }),
               { mono: true, color: SLATE, fontSize: 10.5 });
    }

    /* ---- 上排：字母括号。宽度就是这个字母的码长——变长在这里是看出来的。 ---- */
    if (E.state.fLetters) {
      for (let j = 0; j < D.plain.length; j++) {
        const a = tr.first[j], b = tr.last[j];
        if (a < 0) continue;                          // 空格没有自己的符号
        if (b < start || a >= winEnd) continue;
        const lo = Math.max(a, start), hi = Math.min(b, winEnd - 1);
        const on = (j === cur);
        E.chip(cellX(lo), y0, (hi - lo + 1) * cell - 2, rowH, D.plain.charAt(j),
               { color: on ? BRIGHT : CYAN,
                 fill: on ? 'rgba(226,232,240,.18)' : C_SOFT,
                 stroke: on ? 'rgba(226,232,240,.55)' : C_EDGE,
                 fontSize: Math.min(15, cell * 0.72), radius: 3 });
      }
    }

    /* ---- 中间：符号带 ---- */
    E.cellGrid(L.x0, stripY, winEnd - start, 1, cell, {
      text: function (c) { return tr.padded.charAt(start + c); },
      fill: function (c) {
        const i = start + c;
        if (i >= tr.stream.length) return 'rgba(251,146,60,.24)';   // 补位
        return symSoft(tr.padded.charAt(i));
      },
      textColor: function (c) {
        const i = start + c;
        return i >= tr.stream.length ? ORANGE : symColor(tr.padded.charAt(i));
      },
      stroke: LINE, fontSize: cell * 0.6
    });

    /* ---- 切口：组边界的竖线，穿过上面那一排字母括号 ----
       画在字母行里，不画在别处：要看的正是"这一刀落在某个字母的中间"。 ---- */
    if (E.state.fCuts) {
      for (let i = Math.ceil(start / 3) * 3; i < winEnd; i += 3) {
        E.flowArrow(cellX(i), y0 - 5, cellX(i), stripY + cell + 5,
                    { color: 'rgba(251,146,60,.55)', width: 1, head: false, dash: [3, 3] });
      }
    }

    /* ---- 下排：三个一组，每一组正好一个密文字母 ---- */
    let yy = groupY + rowH + 10;
    if (E.state.fCipher) {
      const g0 = Math.floor(start / 3);
      const gN = Math.ceil(winEnd / 3);
      const curG = [Math.floor(tr.first[cur] / 3), Math.floor(tr.last[cur] / 3)];
      for (let g = g0; g < gN; g++) {
        const on = (g >= curG[0] && g <= curG[1]);
        E.chip(cellX(g * 3), groupY, 3 * cell - 2, rowH, tr.cipher.charAt(g),
               { color: on ? BRIGHT : ROSE,
                 fill: on ? 'rgba(226,232,240,.18)' : R_SOFT,
                 stroke: on ? 'rgba(226,232,240,.5)' : R_EDGE,
                 fontSize: Math.min(15, cell * 0.7), radius: 3 });
      }
      /* 这一句是本页的全部主张，所以它是一句带数字的话。
         两个数一起说：被追踪的那个字母跨了几组（看得见的那一件事），以及
         整段报文里有多少组是**混**的（永远成立的那一件事）。只说前者不够——
         某个字母可能恰好整个落在一组里（'A' 就会），那时候光看它会以为
         "分裂没发生"，而它其实发生在它的邻居身上。 */
      const span = curG[1] - curG[0] + 1;
      const claim = D.alignedGroups === 0
        ? { en: 'not one of the ' + D.groupCount + ' groups is a whole letter',
            zh: D.groupCount + ' 个组里，没有一组正好是一个完整字母' }
        : (D.alignedGroups === 1
          ? { en: 'just 1 of the ' + D.groupCount + ' groups is a whole letter',
              zh: D.groupCount + ' 组里只有 1 组碰巧是一个完整字母' }
          : { en: 'only ' + D.alignedGroups + ' of the ' + D.groupCount +
                  ' groups are whole letters',
              zh: D.groupCount + ' 组里只有 ' + D.alignedGroups + ' 组碰巧是完整字母' });
      textChip(L.x0, yy, Math.min(560, L.availW), 22,
             E.t(fit(L,
               { en: '“' + D.plain.charAt(cur) + '” lands in ' + span +
                     (span === 1 ? ' group' : ' groups') + '  ·  ' + claim.en,
                 zh: '「' + D.plain.charAt(cur) + '」落在 ' + span + ' 个组里  ·  ' + claim.zh },
               { en: D.alignedGroups + '/' + D.groupCount + ' groups are a whole letter',
                 zh: D.groupCount + ' 组里 ' + D.alignedGroups + ' 组是完整字母' })),
             { mono: true, color: BRIGHT, fontSize: 11.5,
               fill: 'rgba(226,232,240,.06)', stroke: 'rgba(226,232,240,.28)' });
      yy += 28;
    }

    textChip(L.x0, yy, Math.min(560, L.availW), 18,
           D.n + E.t({ en: ' letters → ', zh: ' 个字母 → ' }) + tr.stream.length +
           E.t({ en: ' symbols', zh: ' 个符号' }) +
           (tr.pad ? E.t({ en: '  (+' + tr.pad + ' padding)', zh: '（+' + tr.pad + ' 补位）' }) : '') +
           E.t({ en: ' → ', zh: ' → ' }) + tr.groups.length +
           E.t({ en: ' cipher letters', zh: ' 个密文字母' }),
           { mono: true, color: EMERALD, fontSize: 11 });
    yy += 24;

    /* ---- 频率剖面：把"边界没了"量出来 ---- */
    if (E.state.fFreq) {
      const room = L.bottom - yy;
      if (room < 96) {
        textChip(L.x0, L.bottom - 20, Math.min(480, L.availW), 18,
               E.t({ en: 'not enough room for the frequency panel — the readout has the numbers',
                     zh: '这里放不下频率面板 —— 数字在右边读数里' }),
               { mono: true, color: ORANGE, fontSize: 10.5 });
      } else {
        const twoCol = L.availW >= 620;
        const cw = twoCol ? (L.availW - 18) / 2 : L.availW;
        const barW = (cw - 2 * 25) / 26;                 // barChart 的 gap 默认 2
        const labelsOn = barW >= 7;
        /* 柱子的高度吃掉剩下的空间，整块**贴着底边**摆。不贴底的话高屏上
           这一块会吊在画面中间，下面空掉三四百像素；而把 chH 写死成 60 则是
           另一头的浪费——同一份数据，柱子越高越读得出差别，而这一页要读的
           正是两条剖面的高低差。 */
        const CHROME = 15 + 3 + 17 + (labelsOn ? 11 : 1);
        const perPanel = twoCol ? room : (room - 8) / 2;
        const chH = E.clamp(perPanel - CHROME - 4, 22, 170);
        const blockH = CHROME + chH + 4;
        /* 整块在剩下的空间里**竖直居中**：贴底会在符号带和柱子之间留下一大片
           空白，吊在上面又会在底下留同样一片。居中把它平分到两边。 */
        const stackH = twoCol ? blockH : 2 * blockH + 8;
        const topY = yy + Math.max(0, (room - stackH) / 2);
        const panels = [
          { x: L.x0, y: topY, v: D.freqSub, color: CYAN,
            head: E.t(fit(L,
              { en: 'simple substitution — same key, letter boundaries intact',
                zh: '单表代换 —— 同一把钥匙，字母边界原样' },
              { en: 'simple substitution', zh: '单表代换' })),
            ioc: D.iocSub, kept: D.keptSub },
          { x: twoCol ? L.x0 + cw + 18 : L.x0, y: twoCol ? topY : topY + blockH + 8,
            v: D.freqFrac, color: ROSE,
            head: E.t(fit(L,
              { en: 'fractionated Morse — boundaries gone',
                zh: '分裂式摩尔斯 —— 边界没了' },
              { en: 'fractionated Morse', zh: '分裂式摩尔斯' })),
            ioc: D.iocFrac, kept: D.keptFrac }
        ];
        panels.forEach(function (p) {
          if (p.y + chH + 34 > L.bottom + 2) return;
          textChip(p.x, p.y, cw, 15, p.head, { mono: true, color: p.color, fontSize: 10 });
          /* max 显式传：不锁量程的话每帧最高的那根一变，全部柱子都会跳。
             两块共用**同一个** max，否则两张图各自归一化、看着一样高——而
             "右边那张被抹平了"正是要看的东西。 */
          E.barChart(p.x, p.y + 18, cw, chH, p.v, {
            max: D.freqMax, gap: 2, color: p.color,
            labels: labelsOn ? CC.ALPHABET.split('') : null,
            labelSize: 9, labelColor: DIM
          });
          const iocTxt = 'IoC ' + p.ioc.toFixed(4) +
            (p.kept == null ? '' :
              E.t({ en: '    English signal kept ' + Math.round(Math.max(0, p.kept) * 100) + '%',
                    zh: '    保留英文信号 ' + Math.round(Math.max(0, p.kept) * 100) + '%' }));
          textChip(p.x, p.y + 18 + chH + (labelsOn ? 11 : 1), cw, 17, iocTxt,
                 { mono: true, color: p.color, fontSize: 10.5 });
        });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.n) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'nothing encodable', zh: '没有可编码的字符' }) + '</b>';
    }
    const tr = D.tr;
    const i = Math.min(CURSOR.frac, D.plain.length - 1);
    const ch = D.plain.charAt(i);
    const code = tr.codes[i] || '';
    const g0 = Math.floor(tr.first[i] / 3), g1 = Math.floor(tr.last[i] / 3);
    let s = E.t({ en: 'letter ', zh: '字母 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + esc(ch) + '</i></b>' +
      '<span class="dim"> &#8594; </span>';
    for (let q = 0; q < code.length; q++) {
      s += '<b style="--c:var(--trace-' + (code.charAt(q) === MO.DOT ? 'violet' : 'emerald') +
           ')">' + code.charAt(q) + '</b>';
    }
    s += '<span class="dim">  ' + E.t({ en: 'lands in group ', zh: '落在第 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + (g0 + 1) +
      (g1 > g0 ? '&#8211;' + (g1 + 1) : '') + '</b>' +
      '<span class="dim">' + E.t({ en: ' of ' + tr.groups.length,
                                   zh: ' 组，共 ' + tr.groups.length + ' 组' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'groups  ', zh: '分组 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + D.alignedGroups + '</b>' +
      '<span class="dim">' + E.t({ en: ' of ' + D.groupCount + ' are a whole letter · ',
                                   zh: ' / ' + D.groupCount + ' 组正好是一个完整字母 · ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + D.mixedGroups + '</b>' +
      '<span class="dim">' + E.t({ en: ' mix two or more', zh: ' 组混着两个以上字母' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'key alphabet ', zh: '密钥字母表 ' }) + '</span>' +
      longVal('emerald', D.keyAlpha) + '<br>' +
      '<span class="dim">' + E.t({ en: 'stream ', zh: '符号流 ' }) + '</span>' +
      longVal('violet', clip(tr.stream, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(tr.cipher, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'IoC   plain ', zh: '重合指数 明文 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + D.iocPlain.toFixed(4) + '</b>' +
      '<span class="dim"> · ' + E.t({ en: 'substitution ', zh: '单表代换 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + D.iocSub.toFixed(4) + '</b>' +
      '<span class="dim"> · ' + E.t({ en: 'fractionated ', zh: '分裂式 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + D.iocFrac.toFixed(4) + '</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'uniform random is 0.0385 — substitution keeps the plaintext IoC exactly, because it only renames letters',
            zh: '均匀随机是 0.0385 —— 单表代换分毫不差地保留明文的重合指数，因为它只是给字母改名' }) +
      '</span>';
    if (ACTIVE_NOTE) s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>';
    return s;
  }
};

var SCENES = { 'table': tableScene, 'encoding-vs-cipher': vsScene, 'fractionated': fracScene };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个预置并调它的 onSelect，而那个回调要往 textarea 里写字。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
