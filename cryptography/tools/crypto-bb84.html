  return { same: same, n: run.n, qber: core.qber.rate, siftRate: core.siftRate };
}

/* 同种子下换 Eve 档位，Alice 比特 / Alice 基 / Bob 基必须逐位不变。
   这条性质是"抽满 6 个随机数"的全部理由；破了它，页面就分不清多出来的错误
   是 Eve 造成的还是换了一批光子造成的。 */
function chainCheck(a, b) {
  if (!a.photons || !b.photons || a.n !== b.n) return null;
  let same = 0;
  for (let i = 0; i < a.n; i++) {
    const p = a.photons[i], q = b.photons[i];
    if (p.aBit === q.aBit && p.aBas === q.aBas && p.bBas === q.bBas) same++;
  }
  return { same: same, n: a.n };
}

/* 运行缓存：不是为了省 CPU，而是为了让画面与读数在同一帧里读到**同一份**结果。
   两处各跑一次同样的种子当然也会得到同样的数，但每帧重跑 2000 个光子是白烧。 */
const RUNS = Object.create(null);
const RUN_KEYS = [];
function getRun(n, seed, mode, keep) {
  const k = n + '|' + seed + '|' + mode + '|' + (keep ? 1 : 0);
  if (RUNS[k]) return RUNS[k];
  const r = runOnce(n, seed, mode, keep);
  RUNS[k] = r;
  RUN_KEYS.push(k);
  while (RUN_KEYS.length > 10) delete RUNS[RUN_KEYS.shift()];
  return r;
}

/* ================= 面板参数 ================= */
function conf() {
  const n = Math.max(20, Math.round(E.state.nPhotons || 800));
  const idx = Math.min(SEEDS.length - 1, Math.max(0, Math.round(E.state.runIdx || 0)));
  return { n: n, seed: SEEDS[idx], idx: idx, k: Math.max(1, Math.round(E.state.checkBits || 20)) };
}
function visRun(mode) { const c = conf(); return getRun(c.n, c.seed, mode, true); }

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'nPhotons',
    label: { en: 'photons <i>n</i>', zh: '光子数 <i>n</i>' },
    min: 100, max: 2000, step: 100, value: 800,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'runIdx',
    label: { en: 'run · seed', zh: '第几次运行 · 种子' },
    min: 0, max: 9, step: 1, value: 0,
    fmt: function (v) { return SEEDS[Math.min(SEEDS.length - 1, Math.max(0, Math.round(v)))] + ''; } },
  { key: 'checkBits',
    label: { en: 'check bits <i>k</i>', zh: '公开比对的位数 <i>k</i>' },
    min: 1, max: 80, step: 1, value: 20,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 时间轴 =================
   一步 = 一个光子。步数随 n 变、每步的时长随页签变（photons 页要一个一个看，
   sift / eve 页要在几秒内扫完整轮），所以两者任一变化就**重建**时间轴，把当前
   位置按新步数取模带过去。TL 因此必须是 let，传输条上那三个回调也都在**调用
   时**读 TL——写成 TL.step.bind(TL) 会把旧对象钉死在监听器里，重建之后按钮就哑了。 */
let TL = CryptoAnim.createTimeline({ steps: 1, stepDuration: 0.6, loop: true, rate: 1 });
TL.play();
let TL_KEY = '';

function ensureTimeline(steps, dur) {
  const s = Math.max(1, Math.round(steps));
  const key = s + '|' + dur;
  if (TL_KEY === key) return;
  TL_KEY = key;
  const at = TL.index % s;
  TL = CryptoAnim.createTimeline({ steps: s, stepDuration: dur, loop: true, rate: TL.rate });
  TL.seek(at);
  TL.play();
}

/* 使用者动过时间轴没有。
   sift / eve 两页画的是"到播放头为止"的那一段，而时间轴从第 0 步开始——页面
   一载入就会是"已发 1 个光子、留下 1 个、筛选率 100%"。那是个**假的第一印象**：
   这一页要讲的两个数（一半、25%）在一个光子上根本不存在，而屏幕上明晃晃写着
   100.00%。所以在使用者第一次碰传输条之前，这两页显示**整轮**；碰过之后才
   切换成"揭示到播放头"的语义，⏵ 就成了一次重放。photons 页不受影响——它本来
   就是一次看一个光子。 */
let SWEPT = false;

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock(steps, dur) {
  ensureTimeline(steps, dur);
  TL.setRate(E.state.speed || 1);
  if (E.state.running) { SWEPT = true; TL.tick(E.state.dt); }
}
function focusAt(n) { return n ? TL.index % n : 0; }
/* 揭示到第几个光子（含）。没碰过传输条就是整轮。 */
function revealed(n) { return SWEPT ? focusAt(n) + 1 : n; }

document.getElementById('btnBack').addEventListener('click', function () { SWEPT = true; TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { SWEPT = true; TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把位置拨回第 0 个光子。用 seek(0) 而不是
   TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。回到起点是一个**明确的**
   动作，所以它也算"碰过"——⟲ 之后 sift / eve 两页就该显示第一个光子，
   而不是又跳回整轮。 */
document.getElementById('btnReset').addEventListener('click', function () { SWEPT = true; TL.seek(0); });

/* ================= 画布上的排版工具 =================
   canvas 既不裁剪也不报错：放不下的东西就那么越过边缘，而被切掉的半个格子看上去
   仍像内容的一部分。本仓为此在窄屏上栽过五次，所以这一节的每个函数都以"放不下
   时怎么办"为第一职责，而不是以"怎么画好看"。 */

/* 右边那块面板固定 304px 宽；760px 以下它变成贴底的抽屉（默认收起），整幅宽度
   就都能用。上下留白避开顶部的页签/传输条与底部的传输条与提示。 */
function contentBox(vi) {
  const rightPad = vi.W > 760 ? 332 : 14;
  const x = 20;
  const w = Math.max(220, vi.W - rightPad - x - 16);
  const top = vi.W > 760 ? 126 : 152;
  const bot = vi.H - (vi.W > 760 ? 88 : 78);
  return { x: x, y: top, w: w, h: Math.max(150, bot - top) };
}

/* 一段文字大概多宽。**中文字符按一个整 em 算，拉丁字符按 0.58 em**：中文文案
   大约是同长度英文的两倍宽，一个按英文调出来的宽度估计会让中文界面上的标签从
   盒子两头漫出去（E.chip 把文字居中放，盒子太窄时文字向左右同时溢出）。
   引擎不导出 ctx，canvas 侧没有 measureText 可用，只能这样估。 */
function textW(s, px) {
  let u = 0;
  for (let i = 0; i < s.length; i++) u += s.charCodeAt(i) > 0x2e7f ? 1.05 : 0.58;
  return u * px;
}
function isZh() { return E.t({ en: false, zh: true }); }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* 同一句话的长短两版：宽的时候说全，窄的时候说要点。它比 bar() 自己那两级兜底
   （压字号、截断）好，因为兜底只会把一句话砍在半截，而这里换来的是一句**为这个
   宽度写的**完整句子。传进来的顺序是长→短。 */
function pickText(B, list, px) {
  const w = B.w - 14;
  for (let i = 0; i < list.length; i++) if (textW(list[i], px) <= w) return list[i];
  return list[list.length - 1];
}

/* 整行横条。先按文字量试字号，放不下就往下压（最多压到八成），还是放不下就截断
   并**打上省略号**——截断可以，但必须看得出来。 */
function bar(B, y, h, text, o) {
  o = o || {};
  const base = o.fontSize || 11.5;
  const w = B.w - 14;
  let s = String(text);
  let fs = base;
  const need = textW(s, base);
  if (need > w) fs = Math.max(base * 0.8, base * w / need);
  if (textW(s, fs) > w) {
    const keep = Math.max(4, Math.floor(s.length * w / textW(s, fs)) - 1);
    s = s.slice(0, keep) + '…';
  }
  const opts = { fontSize: fs };
  for (const k in o) if (k !== 'fontSize') opts[k] = o[k];
  E.chip(B.x, y, B.w, h, s, opts);
}

/* ---- 换行 ----
   bar() 只有两级兜底：压字号、然后截断。一句为桌面写的解释在 375px 上走完这两级
   之后只剩半句加一个省略号——中文尤其容易，同一句话大约是英文的两倍宽。真正该做
   的是**折行**，可 canvas 的 fillText 不会折，引擎也不导出 ctx.measureText，所以
   自己按 textW() 估。
   断点规则分两种：拉丁文按空格断，CJK 可以在任意字符之间断（它本来就没有空格，
   按空格断等于不断）。所以先把字符串切成"拉丁词 / 空格 / 单个汉字"三种 token，
   再贪心装行。 */
function tokenize(s) {
  const out = [];
  let buf = '';
  for (let i = 0; i < s.length; i++) {
    const ch = s.charAt(i);
    if (s.charCodeAt(i) > 0x2e7f) {
      if (buf) { out.push(buf); buf = ''; }
      out.push(ch);
    } else if (ch === ' ') {
      if (buf) { out.push(buf); buf = ''; }
      out.push(' ');
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  return out;
}
function wrapLines(s, px, w, maxLines) {
  const tk = tokenize(String(s)), lines = [];
  let line = '';
  for (let i = 0; i < tk.length; i++) {
    const cand = line + tk[i];
    if (line && textW(cand, px) > w) {
      lines.push(line.replace(/\s+$/, ''));
      if (maxLines && lines.length >= maxLines) return { lines: lines, cut: true };
      line = (tk[i] === ' ') ? '' : tk[i];
    } else {
      line = cand;
    }
  }
  if (line.replace(/\s+/g, '')) lines.push(line.replace(/\s+$/, ''));
  return { lines: lines.length ? lines : [''], cut: false };
}
function noteHeight(B, text, px, lh) {
  return wrapLines(text, px || 10, B.w - 14, 3).lines.length * (lh || 13);
}
/* 折行的整段文案。截断（超过 maxLines）仍然要**打出省略号**——折行是为了少截断，
   不是为了把截断藏起来。 */
function noteBar(B, y, text, o) {
  o = o || {};
  const px = o.fontSize || 10;
  const lh = o.lineH || 13;
  const r = wrapLines(text, px, B.w - 14, o.maxLines || 3);
  r.lines.forEach(function (ln, k) {
    E.chip(B.x, y + k * lh, B.w, lh,
           ln + (r.cut && k === r.lines.length - 1 ? '…' : ''),
           { mono: o.mono !== false, color: o.color, fontSize: px,
             stroke: o.stroke || null, fill: o.fill || null });
  });
  return r.lines.length * lh;
}

/* 行标签贴在行左端上方，盒子**按文字量宽**，不写一个固定的 300：E.chip 把文字
   居中放在给定的框里，框固定宽而文字长短不一时，几行标签的起点各不相同，看上去
   像没对齐的居中文字。 */
function rowLabel(B, y, text, color, px) {
  const size = px || 10;
  let s = String(text);
  const maxW = B.w - 8;
  if (textW(s, size) > maxW) {
    const keep = Math.max(4, Math.floor(s.length * maxW / textW(s, size)) - 1);
    s = s.slice(0, keep) + '…';
  }
  E.chip(B.x, y, Math.min(B.w, textW(s, size) + 10), 13, s,
         { mono: true, color: color, fontSize: size });
}

/* 引擎的 screen-space 图元层里没有折线，只有 flowArrow。把 head 关掉，它就是
   一条线段。 */
function seg(ax, ay, bx, by, o) {
  o = o || {};
  E.flowArrow(ax, ay, bx, by,
              { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}

/* 一行 chip。E.chip 既不量文字也不裁剪，所以宽度必须在这里算：先按文字量算宽，
   总宽超了就整体压字号（最多压到 0.78），还超就从尾部丢，并把丢掉的件数交回给
   调用方去说出来。 */
function chipRow(x, y, maxW, h, items, o) {
  o = o || {};
  const gap = o.gap == null ? 6 : o.gap;
  const padX = o.padX == null ? 14 : o.padX;
  const minCell = o.minCell == null ? 24 : o.minCell;
  const base = o.fontSize || 12.5;
  function widths(f) {
    return items.map(function (it) {
      return Math.max(minCell, textW(String(it.t), f) + padX);
    });
  }
  function sum(arr, k) {
    let s = 0;
    for (let i = 0; i < k; i++) s += arr[i];
    return s + gap * Math.max(0, k - 1);
  }
  let fs = base;
  let w = widths(fs);
  if (sum(w, w.length) > maxW) {
    /* 求字号要**把不随字号缩放的部分先扣掉**：每格两侧的 padX 与格间的 gap 是
       常数，只有文字本身随 fs 缩。早先按"总宽之比"整体缩，等于把常数也当成可缩的，
       算出来的字号偏大，于是缩完仍然放不下、又从尾部丢掉一格——一次**没人报告**
       的截断。375px 上实测丢掉过筛选页那一行的 QBER。 */
    let unit = 0;
    for (let i = 0; i < items.length; i++) unit += textW(String(items[i].t), 1);
    const target = maxW - gap * Math.max(0, items.length - 1) - padX * items.length;
    if (unit > 0 && target > 0) fs = Math.max(base * 0.7, Math.min(base, target / unit));
    w = widths(fs);
  }
  let n = items.length;
  while (n > 1 && sum(w, n) > maxW) n--;
  let cx = x;
  for (let i = 0; i < n; i++) {
    const it = items[i];
    E.chip(cx, y, w[i], h, it.t,
           { fill: it.fill === undefined ? CARD : it.fill,
             stroke: it.stroke === undefined ? LINE : it.stroke,
             width: it.width || 1,
             color: it.color || BRIGHT,
             fontSize: fs, mono: it.mono });
    cx += w[i] + gap;
  }
  return { used: sum(w, n), shown: n, dropped: items.length - n };
}

/* ================= 放得下多少格 =================
   一律走 E.fitCells：**先用最小可读格宽反推放得下几格**，再让格宽在剩余空间里
   长大到上限。反过来做（先定格数、再把格宽 clamp 到一个下限）会把"放不下"变成
   "画出去"。窗口跟着播放头滚动，放不下的部分由调用方明说——fitCells 自己**不**
   为省略号留位置，所以放不下时两端各让出 ELL 像素再算一次，否则省略号会压在
   最边上那一格上。 */
const GAP = 2;
const ELL = 15;
function windowOf(B, total, focus, o) {
  o = o || {};
  const min = o.min == null ? 13 : o.min;
  const max = o.max == null ? 24 : o.max;
  let fit = E.fitCells(B.w, total, { gap: GAP, min: min, max: max });
  if (fit.truncated) fit = E.fitCells(B.w - 2 * ELL, total, { gap: GAP, min: min, max: max });
  const sx = B.x + (B.w - fit.total) / 2;
  const start = Math.round(E.clamp(focus - Math.floor(fit.n / 2), 0,
                                   Math.max(0, total - fit.n)));
  return {
    n: fit.n, cell: fit.cell, sx: sx, start: start, total: total,
    truncated: fit.truncated,
    xAt: function (i) { return sx + (i - start) * (fit.cell + GAP); },
    right: sx + fit.total
  };
}
/* 一行格子。fn(i) 返回 { t, color, fill, stroke, width, scale }。每个光子一格，
   所以 Alice 行与 Bob 行天然逐列对齐——页面上**没有等宽字体可用**（引擎只给
   serif 与 sans 两个字体栈），"两行逐位对齐"这件事只能靠格子保证，不能靠空格。 */
function cellRow(W, y, fn) {
  for (let i = W.start; i < W.start + W.n && i < W.total; i++) {
    const o = fn(i);
    if (!o) continue;
    E.chip(W.xAt(i), y, W.cell, W.cell, o.t,
           { fill: o.fill || null,
             stroke: o.stroke === undefined ? LINE : o.stroke,
             width: o.width || 1,
             color: o.color || BRIGHT,
             fontSize: W.cell * (o.scale || 0.6) });
  }
}
function ellipses(B, W, y, h) {
  if (W.start > 0) {
    E.chip(Math.max(B.x, W.sx - 14), y, 12, h, '…', { color: DIM, fontSize: 12 });
  }
  if (W.start + W.n < W.total) {
    E.chip(Math.min(W.right + 2, B.x + B.w - 12), y, 12, h, '…', { color: DIM, fontSize: 12 });
  }
}
/* 截断必须被**说出来**，不能交给画布边缘去吃掉。 */
function windowTag(W) {
  if (!W.truncated) return String(W.total) + ' / ' + W.total;
  return (W.start + 1) + '–' + (W.start + W.n) + ' / ' + W.total;
}
/* 内容区底部永远给"已隐藏 ⋯"那一行留一整行。不留的话，最后一段内容会画到
   B.y + B.h 上，而那条状态行是**钉在**底边的——两者当场重叠，报告"我隐藏了
   什么"的那句话自己被压在内容底下（375×600 上实测撞过）。 */
const FOOT = 18;
function room(B, y, h) { return y + h <= B.y + B.h - FOOT + 0.5; }

/* ================= 数值显示 ================= */
function pct(x, d) { return x == null ? '—' : (x * 100).toFixed(d == null ? 2 : d) + '%'; }
function rate(x, d) { return x == null ? '—' : x.toFixed(d == null ? 5 : d); }
/* 指数写法里的负号统一成 U+2212。 */
function expo(x) { return x.toExponential(2).replace('-', '−'); }

/* 筛后密钥的十六进制。fromBits 要求比特数是 8 的整数倍——补零还是丢弃是**调用方
   的决定**，BB84 的筛后长度本来就是随机的，所以这里只取前 8·⌊len/8⌋ 位，并把
   剩下几位说出来，不替使用者选一种补法。 */
function keyHexOf(bits, maxBytes) {
  const whole = Math.floor(bits.length / 8);
  if (!whole) return { hex: null, bytes: 0, tail: bits.length };
  const take = Math.min(whole, maxBytes || whole);
  return { hex: Q.keyHex(bits.slice(0, take * 8)), bytes: take,
           tail: bits.length - whole * 8, more: whole > take };
}

/* ================= n = 20000 的核对表 =================
   这一页的三个统计断言（无 Eve 恰为 0、拦截—重发 ≈ 25%、筛选率 ≈ 50%）在小 n
   上看不出来：n = 800 时筛后只有四百来位，QBER 的一个标准差就有 2 个百分点。
   所以另跑一份大样本，在**浏览器里现算**，把四档并排印出来——包括那个必须为零的
   直通对照。十二次 20000 光子的运行大约几百毫秒，只在第一次进 eve 页时付一次，
   之后缓存。写死一张表当然更快，但那样这张表就成了文案而不是证据。 */
const VERIFY_N = 20000;
const VERIFY_SEEDS = [SEEDS[0], SEEDS[1], SEEDS[2]];
let VERIFY = null;
function verify() {
  if (VERIFY) return VERIFY;
  const rows = MODE_KEYS.map(function (mode) {
    const q = [], s = [];
    VERIFY_SEEDS.forEach(function (seed) {
      const r = runOnce(VERIFY_N, seed, mode, false);
      q.push(r.qber.rate);
      s.push(r.siftRate);
    });
    const mean = function (a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; };
    return { mode: mode, q: q, s: s, qMean: mean(q), sMean: mean(s),
             qMin: Math.min.apply(null, q), qMax: Math.max.apply(null, q) };
  });
  VERIFY = { n: VERIFY_N, seeds: VERIFY_SEEDS, rows: rows };
  return VERIFY;
}

/* ================= 被发现的概率 =================
   Alice 与 Bob 公开比对 k 个筛后比特。每一位上 Eve 造成错误的概率是 q，所以她
   **一位也不被撞见**的概率是 (1−q)^k。q = 0.25 时这就是 0.75^k —— 一个使用者
   自己拧的旋钮，把"她会被抓到"变成一个数。 */
function hideProb(q, k) { return Math.pow(1 - q, k); }
function kFor(q, target) {
  if (!(q > 0) || q >= 1) return null;
  return Math.ceil(Math.log(target) / Math.log(1 - q));
}

/* ================= 偏振指针 =================
   物理偏振角 0° 是水平、90° 是垂直。canvas 的 y 轴朝下，所以画的时候取负角。
   圆偏振没有偏振轴（核心在那里返回 null），BB84 用不到，这里也就不必处理。 */
function polStick(cx, cy, r, deg, color, width) {
  const a = -deg * Math.PI / 180;
  const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
  seg(cx - dx, cy - dy, cx + dx, cy + dy, { color: color, width: width || 2 });
}
function polBadge(x, y, size, deg, color, ringColor) {
  const cx = x + size / 2, cy = y + size / 2, r = size / 2;
  E.chip(x, y, size, size, '', { fill: 'rgba(8,13,24,.6)', stroke: ringColor || LINE, radius: r });
  polStick(cx, cy, r * 0.68, deg, color, 2);
}

        cellRow(Wd, y, function (j) {
          const p = R.photons[j];
          return { t: basisSym(p.bBas), color: p.sifted ? EMERALD : ORANGE,

/* ================= 页签二：筛选 ================= */
const sift = {
  label: { en: 'Sifting', zh: '筛选' },
  brand: { en: 'The whole run. Alice and Bob announce their bases in public, keep the rounds where they agree, and throw the rest away.',
           zh: '完整的一轮。Alice 与 Bob 在公开信道上报出各自的基，同基的留下，其余全部丢掉。' },
  tips: { en: 'Press ⏵ and watch the kept/discarded bar settle on half. Half the photons are thrown away — and that is not a cost, it is the point: the discarded half is what makes the surviving half trustworthy. The bases are announced, never the bits.',
          zh: '按 ⏵，看"保留 / 丢弃"那条分割线停在一半上。一半的光子被扔掉了 — 那不是代价，那正是关键：被丢掉的一半，正是留下那一半可信的原因。公开的只是基，从不是比特。' },
  params: ['nPhotons', 'runIdx', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showRows', label: { en: 'Photon rows', zh: '逐光子的行' }, color: CYAN, checked: true },
    { key: 'showKeyBits', label: { en: 'Sifted key', zh: '筛后密钥' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'sift';
    const R = visRun('off');
    /* 整轮在 8 秒里扫完（1× 速度下），而不是一个光子一步——这一页看的是分布，
       不是单次事件。 */
    tickClock(R.n, 8 / R.n);
    const vi = E.viewInfo(), B = contentBox(vi);
    const upto = revealed(R.n);
    const kept = R.prefix[upto];
    /* 画布上的每一个数都是**到播放头为止**的运行值，读数面板里的才是整轮的终值。
       两边混用同一批数字会让"筛选率随样本量收敛到一半"这件事看不出来。 */
    const runSift = upto ? kept / upto : 0;
    const runQber = kept ? R.cum[kept - 1] : null;
    const dropped = [];
    let y = B.y;

    bar(B, y, 15,
        pickText(B, [
          SWEPT ? E.t({ en: 'sent ' + upto + ' of ' + R.n + ' · seed ' + R.seed,
                        zh: '已发 ' + upto + ' / ' + R.n + ' · 种子 ' + R.seed })
                : E.t({ en: 'the whole run · ' + R.n + ' photons · seed ' + R.seed +
                            ' · press ⏵ to watch it fill up',
                        zh: '整轮 · ' + R.n + ' 个光子 · 种子 ' + R.seed + ' · 按 ⏵ 看它一格格填起来' }),
          E.t({ en: upto + '/' + R.n + ' · seed ' + R.seed, zh: upto + '/' + R.n + ' · 种子 ' + R.seed })
        ], 10.5),
        { mono: true, color: DIM, fontSize: 10.5 });
    y += 19;

    /* ---- 保留 / 丢弃：一条被劈开的横条 ----
       条子里**不写字**：分割线会跟着比例移动，写在里面的两个标签迟早会骑在
       分割线上或者被挤出自己那一段（E.chip 把文字居中放，段太窄时文字向两侧
       同时溢出）。数字放在下面单独一行，位置固定，窄屏上也不会打架。 */
    const barH = 22;
    const wk = Math.max(1, Math.round((B.w - 2) * runSift));
    E.chip(B.x, y, wk, barH, '', { fill: 'rgba(52,211,153,.20)', stroke: 'rgba(52,211,153,.55)' });
    E.chip(B.x + wk + 2, y, Math.max(1, B.w - wk - 2), barH, '',
           { fill: 'rgba(251,146,60,.14)', stroke: 'rgba(251,146,60,.45)' });
    y += barH + 5;
    /* 第四格是可有可无的注解，所以它**按宽度显式取舍**，而不是塞进去让 chipRow
       从尾部丢掉——后者是一次没人报告的截断。 */
    const numItems = [
      { t: E.t({ en: 'kept ', zh: '留下 ' }) + kept + ' · ' + pct(runSift, 2), color: EMERALD },
      { t: E.t({ en: 'discarded ', zh: '丢弃 ' }) + (upto - kept) + ' · ' + pct(1 - runSift, 2), color: ORANGE },
      { t: E.t({ en: 'QBER ', zh: 'QBER ' }) + rate(runQber, 5), color: EMERALD }
    ];
    if (B.w > 560) {
      numItems.push({ t: E.t({ en: 'no Eve on this tab', zh: '本页没有 Eve' }), color: SLATE, mono: true });
    }
    const nr = chipRow(B.x, y, B.w, 24, numItems, { fontSize: 11.5 });
    if (nr.dropped) {
      dropped.push(E.t({ en: nr.dropped + ' of the summary numbers — too narrow',
                         zh: '汇总数字里的 ' + nr.dropped + ' 项 — 宽度不够' }));
    }
    y += 30;

    /* ---- 逐光子的四行 ---- */
    if (E.state.showRows) {
      const Wd = windowOf(B, R.n, focusAt(R.n), { min: 15, max: 22 });
      const need = 4 * (13 + Wd.cell + 5) + 6;
      if (!room(B, y, need)) {
        dropped.push(E.t({ en: 'the photon rows', zh: '逐光子的行' }));
      } else {
        rowLabel(B, y, E.t({ en: 'Alice’s basis · ', zh: 'Alice 的基 · ' }) + windowTag(Wd), CYAN);
        y += 13;
        cellRow(Wd, y, function (j) {
          return { t: basisSym(R.photons[j].aBas), color: j < upto ? CYAN : 'rgba(45,212,234,.22)' };
        });
        y += Wd.cell + 5;

        rowLabel(B, y, E.t({ en: 'Bob’s basis', zh: 'Bob 的基' }), VIOLET);
        y += 13;
        cellRow(Wd, y, function (j) {
          return { t: basisSym(R.photons[j].bBas), color: j < upto ? VIOLET : 'rgba(167,139,250,.22)' };
        });
        y += Wd.cell + 5;

        rowLabel(B, y, E.t({ en: 'agree? — announced in public, this row costs nothing',
                             zh: '同基吗 — 公开报出来的就是这一行，它不泄露任何东西' }), SLATE);
        y += 13;
        cellRow(Wd, y, function (j) {
          const p = R.photons[j];
          const on = j < upto;
          return { t: p.sifted ? '✓' : '✕',
                   color: !on ? 'rgba(159,176,200,.20)' : (p.sifted ? EMERALD : ORANGE),
                   fill: on && p.sifted ? 'rgba(52,211,153,.12)' : null, scale: 0.5 };
        });
        y += Wd.cell + 5;

        rowLabel(B, y, E.t({ en: 'the bit that survives — never announced',
                             zh: '活下来的那个比特 — 从不公开' }), EMERALD);
        y += 13;
        cellRow(Wd, y, function (j) {
          const p = R.photons[j];
          if (!p.sifted || j >= upto) return { t: '', stroke: 'rgba(148,163,184,.10)' };
          return { t: String(p.aBit), color: EMERALD, fill: 'rgba(52,211,153,.10)' };
        });
        ellipses(B, Wd, y, Wd.cell);
        y += Wd.cell + 8;
      }
    }

    /* ---- 筛后密钥 ---- */
    if (E.state.showKeyBits) {
      const bits = R.sifted.alice.slice(0, kept);
      const need = 13 + 16 + 16;
      if (!room(B, y, need)) {
        dropped.push(E.t({ en: 'the sifted key', zh: '筛后密钥' }));
      } else {
        const kh = keyHexOf(bits, 12);
        /* 比特条同样放不下整串。fitCells 给出放得下几位，**说出来**，不让画布
           边缘去吃掉剩下的。 */
        const fit = E.fitCells(B.w, Math.max(1, bits.length), { gap: 1, min: 4, max: 9 });
        rowLabel(B, y, E.t({ en: 'sifted key so far · ', zh: '目前的筛后密钥 · ' }) +
                 bits.length + E.t({ en: ' bits', zh: ' 位' }) +
                 (fit.truncated ? E.t({ en: ' · showing the first ' + fit.n,
                                        zh: ' · 只画得下前 ' + fit.n + ' 位' }) : ''), EMERALD);
        y += 14;
        E.bitBlock(B.x, y, bits.slice(0, fit.n), { cell: fit.cell, gap: 1, on: EMERALD,
                                                   off: 'rgba(52,211,153,.22)' });
        y += fit.cell + 4;
        bar(B, y, 14,
            kh.hex
              ? (kh.hex + (kh.more ? '…' : '') + '  ·  ' +
                 (kh.tail
                   ? E.t({ en: 'the last ' + kh.tail + ' bits do not fill a byte — kept out of the hex, not padded',
                           zh: '最后 ' + kh.tail + ' 位凑不满一个字节 — 留在十六进制之外，不替你补零' })
                   : E.t({ en: kh.bytes * 8 === bits.length ? 'exactly ' + kh.bytes + ' whole bytes'
                                                            : 'first ' + kh.bytes + ' of ' + Math.floor(bits.length / 8) + ' whole bytes',
                           zh: kh.bytes * 8 === bits.length ? '正好 ' + kh.bytes + ' 个整字节'
                                                            : Math.floor(bits.length / 8) + ' 个整字节里的前 ' + kh.bytes + ' 个' })))
              : E.t({ en: 'not one whole byte yet', zh: '还不够一个字节' }),
            { mono: true, color: kh.hex ? EMERALD : DIM, fontSize: 10 });
        y += 18;
      }
    }

    const closing = E.t({ en: 'Half the photons are thrown away — and that is the point, not a cost: the discarded half is what makes the surviving half trustworthy.',
                          zh: '一半的光子被扔掉了 — 那不是代价，那正是关键：被丢掉的一半，正是留下那一半可信的原因。' });
    if (room(B, y, noteHeight(B, closing, 10.5, 13))) {
      noteBar(B, y, closing, { color: EMERALD, fontSize: 10.5, lineH: 13 });
    } else {
      dropped.push(E.t({ en: 'the closing line', zh: '结语那一行' }));
    }

    if (dropped.length) {
      bar(B, B.y + B.h - 15, 14,
          E.t({ en: 'not enough height for: ', zh: '高度不够，已隐藏：' }) + dropped.join(' · '),
          { mono: true, color: ORANGE, fontSize: 10 });
    }
  },
  readout: function () {
    const R = visRun('off');
    const xc = crossCheck(R);
    const bits = R.sifted.alice;
    const kh = keyHexOf(bits, 8);
    return '<span class="dim">' + R.n + E.t({ en: ' photons · seed ', zh: ' 个光子 · 种子 ' }) +
      R.seed + '</span><br>' +
      E.t({ en: 'sift rate ', zh: '筛选率 ' }) +
      '<b style="--c:var(--trace-emerald)">' + rate(R.siftRate, 5) + '</b>' +
      '<span class="dim">  ' + R.sifted.length + '/' + R.n + '</span><br>' +
      E.t({ en: 'QBER ', zh: 'QBER ' }) +
      '<b style="--c:var(--trace-emerald)">' + rate(R.qber.rate, 5) + '</b>' +
      '<span class="dim">  ' + R.qber.errors + '/' + R.qber.compared +
      E.t({ en: ' compared', zh: ' 位比对过' }) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'without sifting the error rate would be ', zh: '不做基对账时错误率是 ' }) +
      '</span><b style="--c:var(--trace-orange)">' + rate(R.rawRate, 5) + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: '← the negative control for that zero', zh: '← 上面那个零的负控' }) +
      '</span><br>' +
      E.t({ en: 'sifted key ', zh: '筛后密钥 ' }) +
      '<b style="--c:var(--trace-emerald)">' + bits.length + E.t({ en: ' bits', zh: ' 位' }) + '</b>' +
      (kh.hex ? '<br><b style="--c:var(--trace-emerald)">' + esc(kh.hex) +
                (kh.more ? '…' : '') + '</b>' : '') +
      '<br><span class="dim">' +
      (xc ? E.t({ en: 'identical to core bb84Run(): ', zh: '与核心 bb84Run() 逐光子一致：' }) +
            xc.same + '/' + xc.n
          : E.t({ en: 'no core counterpart for this mode', zh: '这一档核心里没有对应物' })) +
      '</span>';
  }
};

/* ================= 页签三：Eve（顿悟页） ================= */
const EVE_PRESETS = MODE_KEYS.map(function (id) {
  return { key: id, label: MODES[id].label,
           onSelect: function () { EVE_MODE = id; } };
});

const eve = {
  label: { en: 'Eve', zh: 'Eve' },
  brand: { en: 'Eve has to pick a basis before she can measure. Pick wrong and she re-sends a photon that is wrong half the time — and that shows up as errors on bases that agreed.',
           zh: 'Eve 必须先选一个基才能测。选错了，她重发出去的那个光子有一半机会是错的 — 而这会变成"同基却不同比特"的错误。' },
  tips: { en: 'Start on "No Eve": the QBER curve is a dead flat zero. Switch to Intercept–resend and it climbs to 0.25. Then try Passthrough — Eve is still in the channel and still burns the same random numbers, but the original photon goes through, and the QBER drops back to exactly 0. That control is what makes the 0.25 mean something.',
          zh: '先停在"没有 Eve"：QBER 曲线是一条压在零上的直线。切到"拦截—重发"，它爬到 0.25。再试"直通"— Eve 照样在信道里、照样烧掉同样多的随机数，但原光子过去了，QBER 又回到恰好 0。正是这个对照让那个 0.25 有意义。' },
  params: ['nPhotons', 'runIdx', 'checkBits', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  presets: EVE_PRESETS,
  presetsLabel: { en: 'Eve', zh: '窃听者 Eve' },
  toggles: [
    { key: 'showCurve',  label: { en: 'QBER curve', zh: 'QBER 曲线' }, color: ROSE, checked: true },
    { key: 'showDetect', label: { en: 'Detection', zh: '被发现的概率' }, color: EMERALD, checked: true },
    { key: 'showVerify', label: { en: 'n = 20000 check', zh: 'n = 20000 核对表' }, color: VIOLET, checked: true }
  ],
  draw: function () {
    CUR = 'eve';
    const R = visRun(EVE_MODE);
    tickClock(R.n, 8 / R.n);
    const vi = E.viewInfo(), B = contentBox(vi);
    const upto = revealed(R.n);
    const i = SWEPT ? focusAt(R.n) : 0;
    const shown = R.prefix[upto];                 // 到这里为止比对过多少位
    const ph = R.photons[i];
    const M = MODES[EVE_MODE];
    const dropped = [];
    let y = B.y;

    bar(B, y, 15,
        pickText(B, [
          E.t({ en: 'Eve: ', zh: 'Eve：' }) + E.t(M.label) + ' · ' +
            (SWEPT ? E.t({ en: 'photon ' + upto + '/' + R.n, zh: '光子 ' + upto + '/' + R.n })
                   : E.t({ en: 'the whole run, ' + R.n + ' photons',
                           zh: '整轮 ' + R.n + ' 个光子' })) + ' · ' +
            E.t({ en: 'compared ', zh: '已比对 ' }) + shown + ' · ' +
            E.t({ en: 'seed ', zh: '种子 ' }) + R.seed,
          E.t(M.label) + ' · ' + upto + '/' + R.n + ' · ' + shown
        ], 10.5),
        { mono: true, color: DIM, fontSize: 10.5 });
    y += 19;

    /* ---- 信道上的三个人 ----
       三个人**一个都不能少**：Alice → Eve → Bob 是这一页的骨架。所以"基猜对/
       猜错"那句话只在宽屏上单独成一个 chip，窄屏上收进 Eve 自己那一格的 ✓/✕
       里——把它排在最后交给 chipRow 去丢，丢掉的会是 Bob（chipRow 从尾部丢）。
       375px 上量过：三格 + 两个箭头 ≈ 286px，可用 325px，放得下。 */
    const rowH = 28;
    const wideRow = B.w > 470;
    const items = [
      { t: 'Alice ' + ph.aBit + ' ' + basisSym(ph.aBas), color: CYAN },
      { t: '→', color: DIM, fill: null, stroke: null }
    ];
    if (ph.eve) {
      items.push({ t: 'Eve ' + basisSym(ph.eve.basis) + ' → ' + ph.eve.outcome +
                     (ph.eve.right ? ' ✓' : ' ✕'),
                   color: ROSE, stroke: 'rgba(251,113,133,.5)' });
      if (wideRow) {
        items.push({ t: ph.eve.right ? E.t({ en: 'right basis', zh: '基猜对了' })
                                     : E.t({ en: 'wrong basis', zh: '基猜错了' }),
                     color: ph.eve.right ? SLATE : ROSE, mono: true });
      }
    } else {
      items.push({ t: E.t({ en: 'empty channel', zh: '空信道' }), color: SLATE, mono: true });
    }
    items.push({ t: '→', color: DIM, fill: null, stroke: null });
    items.push({ t: 'Bob ' + basisSym(ph.bBas) + ' → ' + ph.bBit, color: VIOLET });
    const rr = chipRow(B.x, y, B.w, rowH, items, { fontSize: 11.5, gap: 5, padX: 10 });
    /* 宽度不够而丢了格子与高度不够而整段隐藏是两回事，报错时不能用同一句话——
       用户按那句话去做的事（把窗口拉高 / 拉宽）正好相反。 */
    const narrowed = rr.dropped
      ? [E.t({ en: 'the channel row lost ' + rr.dropped + ' chip(s) — too narrow',
               zh: '信道那一行放不下，少了 ' + rr.dropped + ' 格 — 宽度不够' })]
      : [];
    y += rowH + 4;

    /* "只有 Eve 能造成它"在这个无噪声模拟器里成立，在真实链路上不成立——那句话
       必须带上前提，否则这一页就亲手教出了本章最容易讲反的那个结论（"QBER 不为零
       就是有 Eve"）。 */
    const verdict = ph.sifted
      ? (ph.error
          ? E.t({ en: 'same basis, different bit — an error. In this noiseless simulator only Eve can have caused it',
                  zh: '同基却不同比特 — 这一位错了。在这个无噪声的模拟器里，只有 Eve 能造成它' })
          : E.t({ en: 'same basis, same bit — this one is compared and it agrees',
                  zh: '同基同比特 — 这一位比对过，一致' }))
      : E.t({ en: 'different bases — discarded, it never enters the QBER',
              zh: '两人异基 — 丢掉，它根本不进 QBER' });
    y += noteBar(B, y, verdict,
                 { fontSize: 10.5, lineH: 13,
                   color: !ph.sifted ? ORANGE : (ph.error ? ROSE : EMERALD) }) + 7;

    /* ---- 三条必须说出口的话，先把位置**占住** ----
       它们不是装饰，是这一页不许省掉的三条限定：QBER 认不出 Eve 的手法、这个
       模拟器没有器件噪声、这不是能上线的 QKD。所以它们的高度在画任何一张图之前
       就从可用空间里扣掉，并钉在状态行正上方——短屏上该让路的是曲线，不是限定。
       （反过来做过一版：375×600 上三条限定全被挤掉，只剩两张漂亮的图，
       而那正好是这一页最不该留下的印象。） */
    const notes = [
      [E.t({ en: 'A fixed-basis Eve gives exactly 25% too. QBER tells you THAT someone measured, never HOW.',
             zh: '固定基的 Eve 同样给出 25%。QBER 只说得出有人测过，说不出她是怎么测的。' }), ORANGE],
      [E.t({ en: 'This is a teaching simulator: no channel loss, perfect detectors, no dark counts. In a real link most of the QBER is hardware, not Eve.',
             zh: '这是教学模拟器：没有信道损耗、探测器完美、暗计数为零。真实链路里 QBER 的大头来自器件，不是 Eve。' }), ORANGE],
      [E.t({ en: 'Not deployable QKD either: real systems need an authenticated classical channel, error correction and privacy amplification. None of that is on this page.',
             zh: '这也不是能上线的 QKD：真实系统还需要经过认证的经典信道、纠错、以及隐私放大 — 本页一样都没有。' }), ORANGE]
    ];
    const noteH = notes.map(function (nt) { return noteHeight(B, nt[0], 10, 12.5) + 3; });
    const capH = noteH.reduce(function (a, b) { return a + b; }, 0);
    const capTop = B.y + B.h - FOOT - capH;
    /* 连"固定内容 + 三条限定"都装不下的极端窄高（B.h 被 contentBox 夹在 150）时，
       退回顺序绘制并如实报告——但那时该报的是限定被挤掉了，不是它们不存在。 */
    const capPinned = capTop > y;
    /* 图表能用的下界：钉住限定之后剩下的那一段。 */
    function roomChart(yy, h) { return yy + h <= (capPinned ? capTop : B.y + B.h - FOOT) + 0.5; }

    /* ---- QBER 曲线：从噪声里长出来 ---- */
    if (E.state.showCurve) {
      const H = Math.min(150, Math.max(74, B.h * 0.28));
      const need = 13 + H + 16;
      if (!roomChart(y, need)) {
        dropped.push(E.t({ en: 'the QBER curve', zh: 'QBER 曲线' }));
      } else {
        rowLabel(B, y, E.t({ en: 'QBER as compared bits accumulate · 0 to 0.40',
                             zh: '随比对位数累积的 QBER · 0 到 0.40' }), ROSE);
        y += 14;
        const TOP = 0.40;
        const gx = B.x + 30, gw = Math.max(60, B.w - 34), gy = y, gh = H;
        const yOf = function (q) { return gy + gh - E.clamp(q / TOP, 0, 1) * gh; };
        E.chip(gx, gy, gw, gh, '', { fill: 'rgba(8,13,24,.45)', stroke: LINE });
        [[0, EMERALD, '0'], [0.25, ROSE, '0.25']].forEach(function (t) {
          seg(gx, yOf(t[0]), gx + gw, yOf(t[0]),
              { color: t[0] === 0 ? 'rgba(52,211,153,.45)' : 'rgba(251,113,133,.45)', dash: [4, 4] });
          E.chip(B.x - 4, yOf(t[0]) - 7, 32, 14, t[2], { color: t[1], fontSize: 9.5 });
        });
        /* 曲线：每个 x 像素最多一个采样点，2000 个光子也只画几百段。 */
        const cnt = Math.max(1, shown);
        const step = Math.max(1, Math.ceil(cnt / gw));
        let px = null, py = null;
        for (let j = 0; j < cnt; j += step) {
          const cx2 = gx + (j + 1) / Math.max(1, R.qber.compared) * gw;
          const cy2 = yOf(R.cum[j]);
          if (px != null) seg(px, py, cx2, cy2, { color: M.color, width: 1.6 });
          px = cx2; py = cy2;
        }
        if (px != null) E.chip(px - 3, py - 3, 6, 6, '', { fill: M.color, stroke: null, radius: 3 });
        y += gh + 5;
        y += noteBar(B, y,
                     E.t({ en: 'now ', zh: '当前 ' }) +
                       (shown ? rate(R.cum[shown - 1], 5) : '—') +
                       E.t({ en: '  after ' + shown + ' compared bits · whole run ',
                             zh: '  已比对 ' + shown + ' 位 · 整轮 ' }) +
                       rate(R.qber.rate, 5) + ' (' + R.qber.errors + '/' + R.qber.compared + ')',
                     { color: M.color, fontSize: 10, lineH: 13 }) + 5;
      }
    }

    /* ---- 被发现的概率 ---- */
    if (E.state.showDetect) {
      const H = 54;
      const need = 13 + H + 34;
      if (!roomChart(y, need)) {
        dropped.push(E.t({ en: 'the detection panel', zh: '被发现的概率' }));
      } else {
        const k = conf().k;
        const q = 0.25;
        const kNeed = kFor(q, 1e-6);
        rowLabel(B, y, E.t({ en: 'P(Eve hides) = (1−q)^k with q = 0.25 · log scale',
                             zh: 'Eve 一次也没被撞见的概率 (1−q)^k，q = 0.25 · 对数刻度' }), EMERALD);
        y += 14;
        const gx = B.x, gw = B.w, gy = y, gh = H;
        const KMAX = 80, LOGMIN = -12;
        E.chip(gx, gy, gw, gh, '', { fill: 'rgba(8,13,24,.45)', stroke: LINE });
        const xOf = function (kk) { return gx + kk / KMAX * gw; };
        const yOf = function (p) {
          return gy + E.clamp(Math.log10(Math.max(p, 1e-30)) / LOGMIN, 0, 1) * gh;
        };
        seg(gx, yOf(1e-6), gx + gw, yOf(1e-6), { color: 'rgba(52,211,153,.45)', dash: [4, 4] });
        let px = null, py = null;
        for (let kk = 0; kk <= KMAX; kk++) {
          const cx2 = xOf(kk), cy2 = yOf(hideProb(q, kk));
          if (px != null) seg(px, py, cx2, cy2, { color: EMERALD, width: 1.5 });
          px = cx2; py = cy2;
        }
        seg(xOf(k), gy, xOf(k), gy + gh, { color: CYAN, width: 1.4 });
        y += gh + 5;
        bar(B, y, 15,
            pickText(B, [
              E.t({ en: 'k = ' + k + ' check bits → she hides with probability ' + expo(hideProb(q, k)),
                    zh: '公开比对 k = ' + k + ' 位 → 她藏住的概率是 ' + expo(hideProb(q, k)) }),
              'k = ' + k + ' → ' + expo(hideProb(q, k))
            ], 11),
            { mono: true, color: CYAN, fontSize: 11 });
        y += 18;
        bar(B, y, 15,
            pickText(B, [
              E.t({ en: 'k = ' + kNeed + ' is the first k with (1−q)^k below 10⁻⁶ — ' +
                        expo(hideProb(q, kNeed)) + ' · those k bits are then public, so they are discarded too',
                    zh: 'k = ' + kNeed + ' 是第一个让 (1−q)^k 低于 10⁻⁶ 的 k — ' +
                        expo(hideProb(q, kNeed)) + ' · 这 k 位已经公开了，所以它们也要丢掉' }),
              E.t({ en: 'k = ' + kNeed + ' → below 10⁻⁶', zh: 'k = ' + kNeed + ' → 低于 10⁻⁶' })
            ], 10.5),
            { mono: true, color: EMERALD, fontSize: 10.5 });
        y += 18;
      }
    }

    /* ---- n = 20000 的核对表 ---- */
    if (E.state.showVerify) {
      const V = verify();
      const need = 13 + V.rows.length * 15 + 4;
      if (!roomChart(y, need)) {
        dropped.push(E.t({ en: 'the n = 20000 check', zh: 'n = 20000 核对表' }));
      } else {
        rowLabel(B, y, E.t({ en: 'computed in your browser just now · n = ' + V.n + ' × ' +
                                 V.seeds.length + ' seeds',
                             zh: '刚刚在你的浏览器里算出来的 · n = ' + V.n + ' × ' +
                                 V.seeds.length + ' 个种子' }), VIOLET);
        y += 14;
        V.rows.forEach(function (r) {
          const c = MODES[r.mode].color;
          /* 标签列定宽（否则四行的数值列起点各不相同，看上去像没对齐），
             数值列**按文字量宽**并紧跟其后——定宽的数值框会把文字居中放到
             很远的右边，中间留一条空沟。 */
          const lw = Math.min(120, B.w * 0.42);
          E.chip(B.x, y, lw, 14, E.t(MODES[r.mode].label),
                 { mono: true, color: c, fontSize: 9.5, stroke: null });
          const long = 'QBER ' + rate(r.qMean, 5) +
                       (r.qMax > r.qMin ? ' (' + rate(r.qMin, 5) + '–' + rate(r.qMax, 5) + ')' : '') +
                       ' · ' + E.t({ en: 'sift ', zh: '筛 ' }) + rate(r.sMean, 4);
          const short = 'QBER ' + rate(r.qMean, 5);
          const availW = B.w - lw - 4;
          const txt = textW(long, 9.5) <= availW - 8 ? long : short;
          E.chip(B.x + lw + 4, y, Math.min(availW, textW(txt, 9.5) + 10), 14, txt,
                 { mono: true, color: r.mode === 'off' || r.mode === 'pass' ? EMERALD : c,
                   fontSize: 9.5, stroke: null });
          y += 15;
        });
        y += 3;
      }
    }

    /* ---- 三条限定：画在预留好的位置上 ---- */
    let noteLost = 0;
    /* 位置是**预留**出来的，不是钉死的：roomChart 已经保证上面的内容不会越过
       capTop，所以这里直接接着 y 画就行。真钉在 capTop 上的话，高屏幕上三条限定
       会孤零零地贴在底边，和上面的内容之间空出一大块。 */
    let ny = y;
    notes.forEach(function (nt, k) {
      if (!capPinned && ny + noteH[k] > B.y + B.h - FOOT) { noteLost++; return; }
      noteBar(B, ny, nt[0], { color: nt[1], fontSize: 10, lineH: 12.5 });
      ny += noteH[k];
    });
    if (noteLost) {
      dropped.push(E.t({ en: noteLost + ' of the 3 caveats — widen or lengthen the window',
                         zh: '三条限定里的 ' + noteLost + ' 条 — 把窗口放宽或放高' }));
    }

    const gone = narrowed.concat(dropped.length
      ? [E.t({ en: 'not enough height for: ', zh: '高度不够，已隐藏：' }) + dropped.join(' · ')]
      : []);
    if (gone.length) {
      bar(B, B.y + B.h - 15, 14, gone.join(' · '),
          { mono: true, color: ORANGE, fontSize: 10 });
    }
  },
  readout: function () {
    const R = visRun(EVE_MODE);
    const clean = visRun('off');
    const chain = chainCheck(clean, R);
    const xc = crossCheck(R);
    const k = conf().k;
    const q = 0.25;
    const kNeed = kFor(q, 1e-6);
    const M = MODES[EVE_MODE];
    const good = (EVE_MODE === 'off' || EVE_MODE === 'pass');
    let s = '<span class="dim">' + E.t({ en: 'Eve: ', zh: 'Eve：' }) + '</span>' +
      '<b style="--c:var(--trace-' + (good ? 'emerald' : 'rose') + ')">' + E.t(M.label) + '</b><br>' +
      E.t({ en: 'QBER ', zh: 'QBER ' }) +
      '<b style="--c:var(--trace-' + (good ? 'emerald' : 'rose') + ')">' + rate(R.qber.rate, 5) + '</b>' +
      '<span class="dim">  ' + R.qber.errors + '/' + R.qber.compared + '</span><br>' +
      E.t({ en: 'sift rate ', zh: '筛选率 ' }) +
      '<b style="--c:var(--trace-cyan)">' + rate(R.siftRate, 5) + '</b>' +
      '<span class="dim">  ' + R.sifted.length + '/' + R.n + '</span><br>';
    if (R.mode !== 'off') {
      s += '<span class="dim">' + E.t({ en: 'Eve guessed the basis right ', zh: 'Eve 的基猜对了 ' }) +
        R.eveRight + '/' + R.n + ' · ' + pct(R.eveRight / R.n, 1) + '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'same photons as the no-Eve run: ', zh: '与无 Eve 那轮同一批光子：' }) +
      '</span><b style="--c:var(--trace-emerald)">' +
      (chain ? chain.same + '/' + chain.n : '—') + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'Alice’s bits and both bases', zh: 'Alice 的比特与双方的基' }) +
      '</span><br>' +
      '<span class="dim">' +
      (xc ? E.t({ en: 'identical to core bb84Run(): ', zh: '与核心 bb84Run() 逐光子一致：' }) + xc.same + '/' + xc.n
          : E.t({ en: 'this mode has no core counterpart — it is this page’s own variant',
                  zh: '这一档核心里没有对应物 — 是本页自己的变体' })) + '</span><br>' +
      E.t({ en: 'with ', zh: '公开比对 ' }) + '<b style="--c:var(--trace-cyan)"><i>k</i> = ' + k + '</b>' +
      E.t({ en: ' check bits she hides with p = ', zh: ' 位时，她藏住的概率 p = ' }) +
      '<b style="--c:var(--trace-emerald)">' + expo(hideProb(q, k)) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'q = 0.25 · k = ' + kNeed + ' reaches 10⁻⁶',
                                     zh: 'q = 0.25 · k = ' + kNeed + ' 就到 10⁻⁶ 了' }) +
      '</span><br><span class="dim">' +
      E.t({ en: 'Eavesdropping is not a risk of detection — it is a guarantee of it. Measurement is destructive, so there is no passive option.',
            zh: '窃听不是"有被发现的风险"，而是"一定会被发现"。测量是破坏性的，所以根本没有"被动听"这个选项。' }) +
      '</span>';
    return s;
  }
};

var SCENES = { photons: photons, sift: sift, eve: eve };

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
