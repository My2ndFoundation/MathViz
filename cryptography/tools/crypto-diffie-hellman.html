   这些数**是玩具**，页面必须说出这件事：真实的 DH 用 2048 位以上的 p，
   而正因为这里的 p 只有三位数，第三个页签里的伊芙才能在一秒内赢。 */
const PRIMES = [31, 47, 101, 227];
const P_DEFAULT = 101;
let P = P_DEFAULT;

/* ---- 两条时间轴 ----
   两件互不相干的事各配一条，不合成一条：
     TLmix —— 颜料比喻的六个阶段，每段 1.15 秒，慢，是叙事的节奏；
     TLeve —— 伊芙从 x = 0 起逐个试探，每步 0.09 秒，快，是穷举的节奏。
   而且 TLeve 的步数**就是 p**：换素数就得换步数，而 createTimeline 的 steps
   是闭包里的常量（tl.steps 只是一份只读副本，seek 用的是闭包那个），
   所以换 p 时只能整条重建。传输条上的三个按钮读的是 `TLeve` 这个 let 变量，
   重建之后它们自然指向新的那条。 */
const MIX_STEPS = 6;
const TLmix = CryptoAnim.createTimeline({ steps: MIX_STEPS, stepDuration: 1.15, loop: true, rate: 1 });
TLmix.play();
/* 载入时停在最后一格：引擎的 state.running 默认 false（打开 = 静止），
   若时间轴也停在第 0 步，使用者看到的第一屏就只有一桶公共颜料，什么也没发生。
   停在第 ⑥ 步则第一屏就是完整的结论，按 ⏵ 才从头演一遍。 */
TLmix.seek(MIX_STEPS - 1);

function makeEve(p) {
  const t = CryptoAnim.createTimeline({ steps: p, stepDuration: 0.09, loop: true, rate: 1 });
  t.play();
  return t;
}
let TLeve = makeEve(P);

/* g 那根滑杆的读数里写着 ord(g)，而 ord(g) 依赖 p —— 换了素数，那个徽章就
   过期了。引擎只在 'input' 事件与语言切换时重算它，所以换 p 之后必须补发一次
   'input'：值没变，走的是 buildParams() 里那条 upd() → render()。
   不这样做的结果实测过：默认落到 p = 101 之后滑杆仍然写着 p = 31 时算出的
   「ord 5」，而同一屏的读数写着 ord(g) = 100——同一个量在两处给出两个答案，
   而使用者没有任何线索判断该信哪一个。
   引擎没有导出 paramWraps，所以只能按文档顺序取第一根滑杆（PARAMS 的声明
   顺序是 g, a, b, m，querySelectorAll 按文档顺序返回，两者同源）。 */
let gInput = null;
function refreshGBadge() {
  if (gInput) gInput.dispatchEvent(new Event('input'));
}

function setPrime(p) {
  if (P === p) return;
  P = p;
  TLeve = makeEve(p);
  exCache.key = null;
  refreshGBadge();
}

const PRIME_PRESETS = PRIMES.map(function (p) {
  return {
    key: 'p' + p,
    label: { en: 'p = ' + p, zh: 'p = ' + p },
    onSelect: function () { setPrime(p); }
  };
});
const PRIME_LABEL = { en: 'Modulus', zh: '模数' };

/* ---- 传输条 ----
   ⏮ / ⏭ 同时拨两条时间轴：两个页签各看各的那一条，而使用者手里只有一组按钮。
   ⟲ 上已经挂了引擎的 resetSim()，这里再挂一条把两条轴都拨回 0。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing 在本页
   恒为 true（真正的闸门是 tickClock() 里那个 state.running 判断）。 */
document.getElementById('btnBack').addEventListener('click', function () { TLmix.step(-1); TLeve.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TLmix.step(1); TLeve.step(1); });
document.getElementById('btnReset').addEventListener('click', function () { TLmix.seek(0); TLeve.seek(0); });

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock() {
  if (!E.state.running) return;
  TLmix.tick(E.state.dt);
  TLeve.tick(E.state.dt);
}

/* ================= 参数 ================= */
function intFmt(v) { return String(Math.round(v)); }

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里是 `p.fmt(parseFloat(input.value))`。
     写成数字会在建面板时当场 TypeError，页面停在一张空白 canvas 上。 */
  { key: 'g',
    label: { en: 'generator <i>g</i>', zh: '生成元 <i>g</i>' },
    min: 2, max: 30, step: 1, value: 2,
    /* 滑杆自己的读数就标出这个 g 是不是原根，不是的话缀上它真正的阶。
       这不是装饰：g 不是原根时，gˣ 只能走遍一个真子群，密钥空间当场塌陷成
       ord(g) 个值。使用者拖过那些格子的时候必须当场看见，而不是切到第三页
       才发现刚才把 100 缩成了 4。 */
    fmt: function (v) {
      const g = Math.round(v);
      const ord = DH.orderOf(g, P);
      /* 记号摆在**末尾**，不摆在 g 与 ord 之间。第一版写的是 `10 ✕ ord 4`，
         而 ✕ 夹在两个数字中间就被读成乘号——截图上那一行看起来像
         「10 × ord 4」。同样的字符，位置一换就换了意思。 */
      return g + ' · ord ' + ord + (ord === P - 1 ? ' ✓' : ' ✕');
    } },
  { key: 'a', label: { en: "Alice's secret <i>a</i>", zh: '爱丽丝的秘密 <i>a</i>' },
    min: 1, max: 40, step: 1, value: 17, fmt: intFmt },
  { key: 'b', label: { en: "Bob's secret <i>b</i>", zh: '鲍勃的秘密 <i>b</i>' },
    min: 1, max: 40, step: 1, value: 29, fmt: intFmt },
  { key: 'm', label: { en: "Mallory's secret <i>m</i>", zh: '马洛里的秘密 <i>m</i>' },
    min: 1, max: 40, step: 1, value: 9, fmt: intFmt }
];

/* state.g / a / b / m 由引擎的 buildParams() 在建面板时写入；init() 之前它们
   还不存在，而那之前没有任何一帧会画。默认值仍然给一个，免得将来有人在
   init() 之前调 readout() 时拿到 NaN 一路传下去。 */
function curG() { const v = E.state.g; return v == null ? 2 : Math.round(v); }
function curA() { const v = E.state.a; return v == null ? 17 : Math.round(v); }
function curB() { const v = E.state.b; return v == null ? 29 : Math.round(v); }
function curM() { const v = E.state.m; return v == null ? 9 : Math.round(v); }

/* 一帧里 draw() 与 readout() 会各要一次同一批结果。缓存让它们读到的**是同一份
   对象**——两次独立计算哪怕结果相同，也会让"画面上的 15 与读数里的 15"变成
   两个巧合相等的数。缓存键含全部输入，参数一动就整份作废。 */
const exCache = { key: null };
function exOf() {
  const g = curG(), a = curA(), b = curB(), m = curM();
  const key = P + '|' + g + '|' + a + '|' + b + '|' + m;
  if (exCache.key === key) return exCache;
  exCache.key = key;
  exCache.ex = DH.exchange(P, g, a, b);
  exCache.mitm = DH.mitm(P, g, a, b, m);
  exCache.reach = DH.reachable(g, P);
  exCache.powers = DH.powers(g, P);
  /* 伊芙真的跑一遍穷举，步数是数出来的，不是估的。 */
  exCache.dlog = DH.discreteLog(g, P, exCache.ex.A);
  exCache.ladder = DH.ladderSteps(a);
  exCache.isGen = exCache.reach.order === P - 1;
  return exCache;
}

/* ================= 文本宽度与版面 ================= */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Canvas 既不裁剪也不报错：放不下的字就那么越过边缘，而在桌面视口上永远
   看不见（本项目为此在窄屏上连栽五次）。中文每字约等于一个字号宽，拉丁字母
   约 0.55 —— 同一句话中英两版的宽度能差近一倍，所以字号必须按**当前语言的
   那一串**算，不能按其中一版定死。 */
function textW(s, fs) {
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    w += (s.charCodeAt(i) > 0x2E80) ? fs * 1.04 : fs * 0.56;
  }
  return w;
}
function fitFont(s, w, max, min) {
  let fs = max;
  while (fs > min && textW(s, fs) > w) fs -= 0.5;
  return fs;
}

/* 上下两条带子是量出来的，不是估的：骨架的 @media (max-width:760px) 把页签
   压到 top:66、传输条压到 top:110（高约 34），所以窄屏上方要让出约 150px；
   宽屏上标题块两行散文的底边落在 y ≈ 115，页签在 top:16。
   下方：宽屏是传输条（bottom:38，高约 34）加提示行；窄屏面板是贴底抽屉
   （bottom:10，默认收起，头部约 44 高），提示行不显示。 */
function layout(vi) {
  const narrow = vi.W < 760;
  const top = narrow ? 154 : 118;
  /* 窄屏下方那 68px 是量出来的：面板是贴底抽屉（bottom:10），载入时收起，
     只剩标题条——12 + 10 的内边距加 13px 的字，实测占 44px，于是它的上沿在
     667 − 10 − 44 = 613。第一版这里写 62，画面底边落到 619，正好压进抽屉
     6px：在 1280 宽的窗口上完全看不出来，只有 375 宽时那行「只是比喻」
     被吃掉一半。 */
  const bot = narrow ? 68 : 94;
  const rightPad = vi.W > 900 ? 330 : 0;
  const pad = narrow ? 12 : 24;
  const availW = Math.max(220, vi.W - rightPad - pad * 2);
  return {
    narrow: narrow, top: top, bot: bot, pad: pad,
    x0: pad, availW: availW, cx: pad + availW / 2,
    availH: Math.max(170, vi.H - top - bot)
  };
}

/* 缩到最小字号仍然装不下时截断。这是最后一道保险，不是排版手段：真正该做的
   是给窄屏写一条更短的文案（见第三页那两行代价）。但"没人替这一句写短版"这件
   事迟早会发生，而 canvas 对它的默认反应是把字画到屏幕外去——一个只在 375px
   上出现、桌面上永远看不见的错。宁可看见一个省略号。 */
/* 英文的单复数。'1 multiplies' 这种小错在一屏严肃的数字里格外刺眼，而它是
   拼字符串时最容易漏的一处：a = 17 的阶梯恰好只有 1 次乘法。 */
function plu(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

function clipToWidth(s, w, fs) {
  if (textW(s, fs) <= w) return s;
  let out = s;
  while (out.length > 1 && textW(out + '…', fs) > w) out = out.slice(0, -1);
  return out + '…';
}

/* 一句散文占满一条横带。字号先按当前语言那一串收敛到装得下为止。 */
function banner(x, y, w, h, text, o) {
  o = o || {};
  const fs = fitFont(text, w - 16, o.max || 11.5, o.min || 8.5);
  E.chip(x, y, w, h, clipToWidth(text, w - 16, fs), {
    mono: o.mono !== false, color: o.color || SLATE,
    fill: o.fill, stroke: o.stroke,
    fontSize: fs
  });
}

/* ================= 页签一：颜料 =================
   经典的颜料比喻。它对**形状**是诚实的：混合是容易的，分离是难的；而且两边
   把三桶颜料以任意顺序调在一起，得到的是同一种颜色。
   下面的 mixPaint 用**等权平均**而不是逐次对半调和，这一点是必须的：
   逐次对半的话 ((公+A)/2 + B)/2 ≠ ((公+B)/2 + A)/2，两边根本调不出同一种颜色，
   整个比喻当场垮掉。等权平均对应的是"同样三桶颜料，只是倒入的次序不同"，
   那才是与 gᵃᵇ = gᵇᵃ 对得上的那件事。 */
const PAINT_PUB = [226, 191, 78];      // 公共色：芥末黄
const PAINT_A   = [45, 190, 234];      // Alice：青
const PAINT_B   = [244, 96, 122];      // Bob：玫红

function rgbOf(c, alpha) {
  const r = Math.round(c[0]), g = Math.round(c[1]), b = Math.round(c[2]);
  return alpha == null ? 'rgb(' + r + ',' + g + ',' + b + ')'
                       : 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}
function mixPaint(list) {
  let r = 0, g = 0, b = 0;
  for (let i = 0; i < list.length; i++) { r += list[i][0]; g += list[i][1]; b += list[i][2]; }
  return [r / list.length, g / list.length, b / list.length];
}
const PAINT_AB = mixPaint([PAINT_PUB, PAINT_A]);
const PAINT_BB = mixPaint([PAINT_PUB, PAINT_B]);
const PAINT_FINAL = mixPaint([PAINT_PUB, PAINT_A, PAINT_B]);

function blob(cx, cy, d, fill, stroke, width) {
  /* 半径给到边长的一半，roundRect 于是画出一个圆。 */
  E.chip(cx - d / 2, cy - d / 2, d, d, '',
         { fill: fill, stroke: stroke || 'rgba(148,163,184,.35)', width: width || 1, radius: d / 2 });
}

const MIX_CAPTION = [
  { en: '① one public colour, out in the open', zh: '① 一桶公开的颜料，摆在明处' },
  { en: '② each side picks a secret colour', zh: '② 两边各挑一桶秘密颜料' },
  { en: '③ each mixes public + its own secret', zh: '③ 各自把公开色与自己的秘密色调在一起' },
  { en: '④ the two mixtures cross the wire', zh: '④ 两桶混合色在线路上交换' },
  { en: '⑤ each stirs in its own secret again', zh: '⑤ 各自再把自己的秘密色搅进去' },
  { en: '⑥ same colour — and it never crossed the wire', zh: '⑥ 同一种颜色 —— 而它从没上过线' }
];

const mix = {
  label: { en: 'Paint', zh: '颜料' },
  brand: { en: 'Mixing is cheap; un-mixing is not. Both sides end up stirring the same three tins, in different orders.',
           zh: '混合很便宜，分离不是。两边最后搅的是同样三桶颜料，只是次序不同。' },
  tips: { en: 'Press ⏵ and watch the six stages. Eve sees the public tin and both mixtures — and still cannot get the final colour. Honest warning: this is an analogy about shape only. Paint has no arithmetic; the Numbers tab has the real thing.',
          /* tips 是用 textContent 写进面板的纯文本，不要在里面写 Markdown 的
             星号强调——它不会被渲染，只会原样出现在页面上。 */
          zh: '按 ⏵ 看完六个阶段。伊芙看得见公共色和两桶混合色，却仍然拿不到最后那种颜色。要说清楚：这只是一个关于「形状」的比喻，颜料里没有算术；真东西在「数字」页签。' },
  params: [],
  views: {
    /* 本页图元是屏幕坐标的，与相机无关，所以只保留 iso：它是引擎双击回正的
       home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showWire',   label: { en: 'Wire',       zh: '线路' },     color: VIOLET, checked: true },
    { key: 'showEveMix', label: { en: "Eve's view", zh: '伊芙看到的' }, color: ORANGE, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const L = layout(vi);
    const st = TLmix.index;
    const pr = TLmix.progress;

    /* 竖直分带显式写成一张表，不让各处自己加偏移量——crypto-affine 在这一点上
       连出过两次压字事故，两次都是因为没有人在一个地方看着这一列的总账。
         capY        0 … 22     阶段说明
         rows        30 … 30+4h 四行：公共色 / 秘密色 / 混合色 / 结果
         footY       末尾 44    伊芙那一条 + 「只是比喻」 */
    const capH = 22, footH = 46;
    const rowsTop = L.top + capH + 8;
    const rowsH = Math.max(120, L.availH - capH - 8 - footH);
    const rowH = rowsH / 4;

    const colW = Math.min(210, L.availW * 0.32);
    const ax = L.x0 + colW * 0.5;
    const bx = L.x0 + L.availW - colW * 0.5;
    const mxc = (ax + bx) / 2;
    const d = E.clamp(Math.min(rowH * 0.56, colW * 0.60), 18, 56);

    const yPub = rowsTop + rowH * 0.45;
    const ySec = rowsTop + rowH * 1.45;
    const yMix = rowsTop + rowH * 2.45;
    const yFin = rowsTop + rowH * 3.45;

    banner(L.x0, L.top, L.availW, capH, E.t(MIX_CAPTION[st]), { color: BRIGHT, max: 12.5 });

    /* ① 公共色。任何时候都在，因为它任何时候都是公开的。 */
    blob(mxc, yPub, d, rgbOf(PAINT_PUB), 'rgba(226,191,78,.7)', 1.4);
    banner(mxc - colW, yPub + d / 2 + 4, colW * 2, 16,
           E.t({ en: 'public — everyone sees this tin', zh: '公开 —— 这一桶谁都看得见' }),
           { color: DIM, max: 10.5 });

    /* ② 秘密色。左右各一，颜色就是这一页的 Alice 色与 Bob 色。 */
    if (st >= 1) {
      blob(ax, ySec, d, rgbOf(PAINT_A), 'rgba(45,190,234,.75)', 1.4);
      blob(bx, ySec, d, rgbOf(PAINT_B), 'rgba(244,96,122,.75)', 1.4);
      banner(ax - colW / 2, ySec + d / 2 + 3, colW, 15,
             E.t({ en: 'Alice · secret', zh: '爱丽丝 · 秘密' }), { color: CYAN, max: 10.5 });
      banner(bx - colW / 2, ySec + d / 2 + 3, colW, 15,
             E.t({ en: 'Bob · secret', zh: '鲍勃 · 秘密' }), { color: ROSE, max: 10.5 });
    }

    /* ③ 各自混合。 */
    if (st >= 2) {
      blob(ax, yMix, d, rgbOf(PAINT_AB), 'rgba(167,139,250,.6)', 1.4);
      blob(bx, yMix, d, rgbOf(PAINT_BB), 'rgba(167,139,250,.6)', 1.4);
      E.flowArrow(ax, ySec + d / 2 + 18, ax, yMix - d / 2 - 3,
                  { color: 'rgba(159,176,200,.45)', width: 1.2, headLen: 6 });
      E.flowArrow(bx, ySec + d / 2 + 18, bx, yMix - d / 2 - 3,
                  { color: 'rgba(159,176,200,.45)', width: 1.2, headLen: 6 });
    }

    /* ④ 上线交换。两桶混合色沿同一条线路对穿而过。
       在途的那两个小球**只在第 ④ 步画**：到了第 ⑤ 步它们已经被搅进结果里，
       再让它们停在对面只会压在对方的混合球上，看着像多出来两桶颜料。
       虚线本身在第 ④ 步之后仍然留着——线路是一直存在的，走过东西的是它。 */
    if (st >= 3 && E.state.showWire) {
      E.flowArrow(ax + d / 2 + 6, yMix, bx - d / 2 - 6, yMix,
                  { color: 'rgba(167,139,250,.35)', width: 1.1, dash: [5, 4], head: false });
      if (st === 3) {
        const s = d * 0.52;
        blob(ax + (bx - ax) * pr, yMix - d * 0.42, s, rgbOf(PAINT_AB, 0.95), 'rgba(167,139,250,.8)', 1.2);
        blob(bx - (bx - ax) * pr, yMix + d * 0.42, s, rgbOf(PAINT_BB, 0.95), 'rgba(167,139,250,.8)', 1.2);
      }
    }

    /* ⑤⑥ 各自再搅进自己的秘密色 → 同一种颜色。 */
    if (st >= 4) {
      const done = st >= 5;
      const ring = done ? 'rgba(52,211,153,.95)' : 'rgba(167,139,250,.6)';
      blob(ax, yFin, d * (done ? 1.16 : 1), rgbOf(PAINT_FINAL), ring, done ? 2.2 : 1.4);
      blob(bx, yFin, d * (done ? 1.16 : 1), rgbOf(PAINT_FINAL), ring, done ? 2.2 : 1.4);
      if (done) {
        E.glowDot([ax, yFin], d * 1.15, 'rgba(52,211,153,.32)', 'rgba(52,211,153,.10)');
        E.glowDot([bx, yFin], d * 1.15, 'rgba(52,211,153,.32)', 'rgba(52,211,153,.10)');
        banner(mxc - colW * 0.9, yFin - 9, colW * 1.8, 18,
               E.t({ en: 'identical', zh: '完全相同' }), { color: EMERALD, max: 12 });
      }
    }

    /* ⑦ 伊芙那一条：她看得见的三桶，加上一个她拿不到的问号。
       与「只是比喻」那句并排放在最下面一条带子里。
       这一条**贴着下边界排**（vi.H − bot − footH），不是"从上面接着往下排"：
       它是全页唯一必须出现的免责声明，让它跟着上面四行的高度浮动，就等于让
       它成为第一个被挤到抽屉底下的东西。真的挤不下（矮窗口）就整条不画——
       半截被吃掉的免责声明比没有更糟。 */
    const footY = vi.H - L.bot - footH;
    if (footY > yFin + d / 2 + 6) {
      if (E.state.showEveMix) {
        const s = 15;
        const items = [
          { c: PAINT_PUB, t: 'public' },
          { c: PAINT_AB, t: 'A' },
          { c: PAINT_BB, t: 'B' }
        ];
        const gapx = 22;
        const startX = mxc - (items.length * gapx + 34) / 2;
        for (let i = 0; i < items.length; i++) {
          blob(startX + i * gapx, footY + 10, s, rgbOf(items[i].c), 'rgba(251,146,60,.55)', 1);
        }
        E.chip(startX + items.length * gapx - 4, footY + 2, 20, 17, '?',
               { color: UNPAIRED, fill: 'rgba(255,47,208,.10)', stroke: 'rgba(255,47,208,.5)',
                 fontSize: 12, radius: 4 });
        banner(L.x0, footY + 21, L.availW, 15,
               E.t({ en: 'Eve sees three tins and cannot un-mix them',
                     zh: '伊芙看得见三桶颜料，却分不开它们' }),
               { color: ORANGE, max: 10.5 });
      }
      banner(L.x0, footY + 38, L.availW, 16,
             L.narrow
               ? E.t({ en: 'analogy only — the Numbers tab has the real thing',
                       zh: '只是比喻 —— 真东西在「数字」页签' })
               : E.t({ en: 'analogy only — paint has no arithmetic; the Numbers tab has the real thing',
                       zh: '只是比喻 —— 颜料里没有算术；真东西在「数字」页签' }),
             { color: DIM, max: 10.5 });
    }
  },
  readout: function () {
    const st = TLmix.index;
    return E.t({ en: 'stage ', zh: '阶段 ' }) +
      '<b style="--c:var(--trace-violet)">' + (st + 1) + ' / 6</b><br>' +
      '<span class="dim">' + E.t(MIX_CAPTION[st]) + '</span><br>' +
      '<b style="--c:var(--trace-emerald)">' +
      E.t({ en: 'both sides stir the same three tins',
            zh: '两边搅的是同样三桶颜料' }) + '</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'order does not matter — that is exactly g^(ab) = g^(ba)',
            zh: '次序无关紧要 —— 这正是 g^(ab) = g^(ba)' }) + '</span><br>' +
      '<b style="--c:var(--trace-orange)">' +
      E.t({ en: 'analogy only', zh: '这只是比喻' }) + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: 'paint is not arithmetic; open the Numbers tab',
            zh: '颜料不是算术；请打开「数字」页签' }) + '</span>';
  }
};

/* ================= 页签二：数字 =================
   真正的算术，一行不省：p 与 g 公开，a 与 b 各自留在本地，A = gᵃ、B = gᵇ 上线，
   两边各自把收到的那个再乘方一次，落在同一个 gᵃᵇ 上。
   这一页唯一要钉死的一句话是：**gᵃᵇ 一次都没有上过线**。所以画面里"线路"
   那一行是一条独立的横带，它上面写着的东西就是伊芙能抄到的全部。

   Mallory 开关不是彩蛋：DH 给的是保密性，不是身份。未经认证的交换被一个
   **主动**攻击者分成两段之后，两段各自的数学都完全正确，而双方拿到的是两个
   不同的秘密——这件事必须能在同一张画面上被看见，否则"安全"这个词会被读者
   自动补全成"安全"。 */
const real = {
  label: { en: 'Numbers', zh: '数字' },
  brand: { en: 'Everything on this screen except a, b and the green line travels in the clear. The shared secret is computed twice and transmitted never.',
           zh: '这一屏上除了 a、b 与那条绿线，全部是明着传的。共享秘密被算了两次，一次都没有传过。' },
  tips: { en: 'Follow the wire row: it carries p, g, A, B and nothing else. Now switch g to a value the slider marks ✕ — the key space collapses to ord(g) values while every number on screen still looks perfectly normal. Turn on Mallory to see what unauthenticated DH does not promise.',
          zh: '盯住「线路」那一行：它只承载 p、g、A、B，再无别的。再把 g 调到滑杆标着 ✕ 的某一格——密钥空间当场塌陷到 ord(g) 个值，而画面上每个数字看上去仍然完全正常。打开「马洛里」，看未经认证的 DH 没有承诺过什么。' },
  params: ['g', 'a', 'b', 'm'],
  presets: PRIME_PRESETS,
  presetsLabel: PRIME_LABEL,
  views: {
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showEve',     label: { en: "Eve's tape", zh: '伊芙的胶带' }, color: ORANGE,   checked: true },
    /* 中文里人名统一用「马洛里」、攻击名统一用「中间人」——第一版开关叫
       「中间人」而滑杆叫「马洛里的秘密」，同一个角色在同一块面板上有两个名字。 */
    { key: 'showMallory', label: { en: 'Mallory',    zh: '马洛里' },     color: UNPAIRED, checked: false }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const L = layout(vi);
    const S = exOf();
    const g = curG(), a = curA(), b = curB(), m = curM();
    const mal = !!E.state.showMallory;
    const eveOn = !!E.state.showEve;

    /* 竖直分带写成一张表（理由同页签一）：
         0 公开的 p 与 g          6 结论条
         1 名字                   7 伊芙的胶带（可关）
         2 各自的秘密
         3 各自的公开值
         4 线路
         5 各自算出的秘密 */
    const rows = eveOn ? 8 : 7;
    const step = E.clamp(L.availH / (rows + 0.3), 26, 58);
    const y0 = L.top + Math.max(0, (L.availH - step * rows) / 2);
    const yOf = function (i) { return y0 + i * step; };
    const h = step * 0.7;

    const colW = Math.min(238, L.availW * 0.415);
    const ax = L.x0 + colW / 2;
    const bx = L.x0 + L.availW - colW / 2;
    /* 门槛 132 是**算出来的**，不是拍的：最长的那一串 'A = g^a mod p = 75'
       是 18 个拉丁字符，按 fitFont 的 0.56 字宽估，13px 下占 131px。低于这个
       宽度才退回 'A = 75'。第一版写的是 168，于是 375px 上白白丢掉了公式，
       只剩三个孤零零的数字——而这一页的全部内容就是那几个公式。 */
    const wide = colW > 132;

    /* ① 公开的东西。紫色 = 上线的东西，全页统一。 */
    banner(L.x0, yOf(0), L.availW, h,
           E.t({ en: 'public:   p = ' + P + '     g = ' + g + '     · everyone sees this',
                 zh: '公开： p = ' + P + '     g = ' + g + '     · 谁都看得见' }),
           { color: VIOLET, fill: 'rgba(167,139,250,.08)', stroke: 'rgba(167,139,250,.38)', max: 12.5 });

    /* ② 名字 */
    banner(ax - colW / 2, yOf(1), colW, h * 0.8, E.t({ en: 'Alice', zh: '爱丽丝' }),
           { color: CYAN, max: 12 });
    banner(bx - colW / 2, yOf(1), colW, h * 0.8, E.t({ en: 'Bob', zh: '鲍勃' }),
           { color: ROSE, max: 12 });

    /* ③ 各自的秘密。它们**不出现在线路那一行**，这是本页的主语。 */
    const secA = (wide ? E.t({ en: 'secret  ', zh: '秘密  ' }) : '') + 'a = ' + a;
    const secB = (wide ? E.t({ en: 'secret  ', zh: '秘密  ' }) : '') + 'b = ' + b;
    E.chip(ax - colW / 2, yOf(2), colW, h, secA,
           { color: CYAN, fill: 'rgba(45,212,234,.09)', stroke: 'rgba(45,212,234,.38)',
             fontSize: fitFont(secA, colW - 14, 13.5, 9) });
    E.chip(bx - colW / 2, yOf(2), colW, h, secB,
           { color: ROSE, fill: 'rgba(251,113,133,.09)', stroke: 'rgba(251,113,133,.38)',
             fontSize: fitFont(secB, colW - 14, 13.5, 9) });

    /* ④ 各自的公开值。 */
    const pubA = wide ? ('A = g^a mod p = ' + S.ex.A) : ('A = ' + S.ex.A);
    const pubB = wide ? ('B = g^b mod p = ' + S.ex.B) : ('B = ' + S.ex.B);
    E.chip(ax - colW / 2, yOf(3), colW, h, pubA,
           { color: VIOLET, fill: 'rgba(167,139,250,.09)', stroke: 'rgba(167,139,250,.38)',
             fontSize: fitFont(pubA, colW - 14, 13, 9) });
    E.chip(bx - colW / 2, yOf(3), colW, h, pubB,
           { color: VIOLET, fill: 'rgba(167,139,250,.09)', stroke: 'rgba(167,139,250,.38)',
             fontSize: fitFont(pubB, colW - 14, 13, 9) });

    /* ⑤ 线路。诚实模式下 A 与 B 直接对穿；Mallory 模式下线被剪断，中间那个
       盒子对两边各发自己的 M。 */
    const wireY = yOf(4) + h / 2;
    /* 箭头从**列心到列心**，不是从列边到列边。第 4 行里没有别的东西，所以
       两端可以一路拉到 ax / bx；限制在列边之间时，375px 上两列之间只剩 52px，
       而中间那块 92px 的牌子比整段线还宽——箭头于是只剩两个从牌子背后探出来的
       尖，看着像画错了。 */
    const lx = ax, rx = bx;
    if (!mal) {
      E.flowArrow(lx, wireY - 8, rx, wireY - 8, { color: 'rgba(167,139,250,.75)', width: 1.4, headLen: 7 });
      E.flowArrow(rx, wireY + 8, lx, wireY + 8, { color: 'rgba(167,139,250,.75)', width: 1.4, headLen: 7 });
      const tag = 'A = ' + S.ex.A + '   B = ' + S.ex.B;
      /* 牌子必须明显窄于线段，否则它遮住的就不是"中间一段"而是整条线。 */
      const tw = Math.min(104, (rx - lx) - 40);
      if (tw >= 56) {
        E.chip((lx + rx) / 2 - tw / 2, wireY - 9, tw, 18, tag,
               { fill: CARD, color: VIOLET, fontSize: fitFont(tag, tw - 8, 11, 8) });
      }
    } else {
      const midx = (lx + rx) / 2;
      const bw = E.clamp((rx - lx) - 40, 62, 110);
      E.flowArrow(lx, wireY, midx - bw / 2 - 3, wireY, { color: 'rgba(255,47,208,.7)', width: 1.4, headLen: 7 });
      E.flowArrow(midx + bw / 2 + 3, wireY, rx, wireY, { color: 'rgba(255,47,208,.7)', width: 1.4, headLen: 7 });
      E.chip(midx - bw / 2, wireY - 11, bw, 22,
             E.t({ en: 'Mallory  M = ' + S.mitm.M, zh: '马洛里  M = ' + S.mitm.M }),
             { fill: 'rgba(255,47,208,.12)', stroke: 'rgba(255,47,208,.7)', color: UNPAIRED,
               fontSize: fitFont('Mallory  M = ' + S.mitm.M, bw - 10, 11, 8), radius: 5 });
    }

    /* ⑥ 各自算出来的那个数。诚实模式下两边相等（翠绿），中间人模式下不等
       （品红）——而两边都无从察觉。 */
    if (!mal) {
      const cA = (wide ? 'B^a mod p = ' : '= ') + S.ex.sA;
      const cB = (wide ? 'A^b mod p = ' : '= ') + S.ex.sB;
      E.chip(ax - colW / 2, yOf(5), colW, h, cA,
             { color: EMERALD, fill: 'rgba(52,211,153,.10)', stroke: 'rgba(52,211,153,.45)',
               fontSize: fitFont(cA, colW - 14, 13, 9) });
      E.chip(bx - colW / 2, yOf(5), colW, h, cB,
             { color: EMERALD, fill: 'rgba(52,211,153,.10)', stroke: 'rgba(52,211,153,.45)',
               fontSize: fitFont(cB, colW - 14, 13, 9) });
    } else {
      const cA = (wide ? 'M^a mod p = ' : '= ') + S.mitm.aliceSecret;
      const cB = (wide ? 'M^b mod p = ' : '= ') + S.mitm.bobSecret;
      E.chip(ax - colW / 2, yOf(5), colW, h, cA,
             { color: UNPAIRED, fill: 'rgba(255,47,208,.10)', stroke: 'rgba(255,47,208,.5)',
               fontSize: fitFont(cA, colW - 14, 13, 9) });
      E.chip(bx - colW / 2, yOf(5), colW, h, cB,
             { color: UNPAIRED, fill: 'rgba(255,47,208,.10)', stroke: 'rgba(255,47,208,.5)',
               fontSize: fitFont(cB, colW - 14, 13, 9) });
      E.chip((ax + bx) / 2 - 12, yOf(5) + h / 2 - 10, 24, 20, '≠',
             { color: UNPAIRED, fontSize: 15 });
    }

    /* ⑦ 结论条。 */
    if (!mal) {
      const okText = E.t({
        en: 'shared secret  s = ' + S.ex.shared + '   ·  computed twice, transmitted never',
        zh: '共享秘密  s = ' + S.ex.shared + '   ·  算了两次，一次都没传过'
      });
      banner(L.x0, yOf(6), L.availW, h, okText,
             { color: EMERALD, fill: 'rgba(52,211,153,.10)', stroke: 'rgba(52,211,153,.5)', max: 13 });
    } else {
      /* 窄屏短版：完整的英文有 90 个字符，375px 上即便压到 8.5px 也要 428px，
         于是被 clipToWidth 截成 "…DH gives s…"——一条被切断的结论比没有更糟，
         而这一句正是这个开关存在的全部理由。 */
      const badText = L.narrow ? E.t({
        en: 'two secrets (' + S.mitm.aliceSecret + ' / ' + S.mitm.bobSecret +
            ') — DH gives secrecy, not identity',
        zh: '两个不同的秘密（' + S.mitm.aliceSecret + ' / ' + S.mitm.bobSecret +
            '）—— DH 给的是保密性，不是身份'
      }) : E.t({
        en: 'two different secrets (' + S.mitm.aliceSecret + ' / ' + S.mitm.bobSecret +
            ') — both sides verify fine. DH gives secrecy, not identity.',
        zh: '两个不同的秘密（' + S.mitm.aliceSecret + ' / ' + S.mitm.bobSecret +
            '）—— 而双方各自验算都对。DH 给的是保密性，不是身份。'
      });
      banner(L.x0, yOf(6), L.availW, h, badText,
             { color: UNPAIRED, fill: 'rgba(255,47,208,.10)', stroke: 'rgba(255,47,208,.55)', max: 12.5 });
    }

    /* ⑧ 伊芙的胶带：线路上抄得到的全部，外加一个她拿不到的格子。
       用 fitCells 定格数——先按最小可读格宽反推放得下几格，再让格宽长大，
       而不是先定格数再把宽度 clamp 到下限（那会把"放不下"变成"画出去"）。
       放不下的部分必须**说出来**，见下面那行 n / 5。 */
    if (eveOn) {
      const cells = [
        { t: 'p = ' + P, c: VIOLET },
        { t: 'g = ' + g, c: VIOLET },
        { t: 'A = ' + S.ex.A, c: VIOLET },
        { t: 'B = ' + S.ex.B, c: VIOLET },
        { t: 's = ?', c: UNPAIRED }
      ];
      const fit = E.fitCells(L.availW, cells.length, { gap: 6, min: 54, max: 128 });
      const sx = L.x0 + (L.availW - fit.total) / 2;
      const ey = yOf(7);
      for (let i = 0; i < fit.n; i++) {
        const last = cells[i].c === UNPAIRED;
        E.chip(sx + i * (fit.cell + 6), ey, fit.cell, h, cells[i].t,
               { color: cells[i].c, fill: last ? 'rgba(255,47,208,.08)' : 'rgba(8,13,24,.7)',
                 stroke: last ? 'rgba(255,47,208,.55)' : LINE,
                 fontSize: fitFont(cells[i].t, fit.cell - 10, 12.5, 8) });
      }
      const note = fit.truncated
        ? E.t({ en: 'on the wire — showing 1–' + fit.n + ' / ' + cells.length,
                zh: '线路上的全部 —— 只画得下 1–' + fit.n + ' / ' + cells.length })
        : E.t({ en: "everything on the wire — and s is not on it",
                zh: '线路上的全部 —— 而 s 不在其中' });
      banner(L.x0, ey + h + 2, L.availW, 15, note, { color: ORANGE, max: 10.5 });
    }
  },
  readout: function () {
    const S = exOf();
    const g = curG(), a = curA(), b = curB();
    const mal = !!E.state.showMallory;
    let s = '<span class="dim">' + E.t({ en: 'public ', zh: '公开 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)"><i>p</i> = ' + P + '</b>' +
      '<span class="dim">   </span>' +
      '<b style="--c:var(--trace-violet)"><i>g</i> = ' + g + '</b>' +
      '<span class="dim">   ord(<i>g</i>) = ' + S.reach.order +
      (S.isGen ? '' : ' &lt; ' + (P - 1)) + '</span><br>' +
      '<b style="--c:var(--trace-cyan)"><i>a</i> = ' + a + '</b>' +
      '<span class="dim"> &#8594; <i>A</i> = </span>' +
      '<b style="--c:var(--trace-violet)">' + S.ex.A + '</b>' +
      '<span class="dim">    </span>' +
      '<b style="--c:var(--trace-rose)"><i>b</i> = ' + b + '</b>' +
      '<span class="dim"> &#8594; <i>B</i> = </span>' +
      '<b style="--c:var(--trace-violet)">' + S.ex.B + '</b><br>';

    if (!mal) {
      /* agree 是 exchange() 把两侧分开算完之后比出来的，不是这里断言的。 */
      s += (S.ex.agree
        ? '<b style="--c:var(--trace-emerald)">' +
          E.t({ en: 'both sides reached ', zh: '双方都到达了 ' }) + '<i>s</i> = ' + S.ex.shared +
          '</b>'
        : '<b style="--c:var(--trace-unpaired)">' +
          E.t({ en: 'the two sides disagree — that would be a bug',
                zh: '两侧不一致 —— 那会是一个 bug' }) + '</b>') +
        '<br><span class="dim">' +
        E.t({ en: 'B^a = A^b = g^(ab) mod p, and g^(ab) was never sent',
              zh: 'B^a = A^b = g^(ab) mod p，而 g^(ab) 从来没有被发送过' }) +
        '</span><br><span class="dim">' +
        E.t({ en: 'the wire carried only: p, g, ' + S.ex.A + ', ' + S.ex.B,
              zh: '线路上只走过：p、g、' + S.ex.A + '、' + S.ex.B }) + '</span>';
      if (!S.isGen) {
        s += '<br><b style="--c:var(--trace-unpaired)">' +
          E.t({ en: 'g = ' + g + ' is not a primitive root — only ' + S.reach.size +
                    ' of ' + (P - 1) + ' values are reachable',
                zh: 'g = ' + g + ' 不是原根 —— ' + (P - 1) + ' 个值里只有 ' +
                    S.reach.size + ' 个够得着' }) + '</b>';
      }
      return s;
    }

    return s +
      '<b style="--c:var(--trace-unpaired)">' +
      E.t({ en: 'Mallory sits in the middle with m = ' + curM(),
            zh: '马洛里坐在中间，m = ' + curM() }) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'Alice holds ', zh: '爱丽丝拿到 ' }) + '</span>' +
      '<b style="--c:var(--trace-unpaired)">' + S.mitm.aliceSecret + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'Bob holds ', zh: '鲍勃拿到 ' }) + '</span>' +
      '<b style="--c:var(--trace-unpaired)">' + S.mitm.bobSecret + '</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'Mallory shares both — and neither side can tell',
            zh: '两个她都握着 —— 而两边都察觉不到' }) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'undisturbed they would have shared ' + S.mitm.honestShared +
                '; authentication is a separate problem',
            zh: '没被动过手脚时他们本该共享 ' + S.mitm.honestShared +
                '；身份认证是另一个问题' }) + '</span>';
  }
};

/* ================= 页签三：伊芙的难题 —— 顿悟视角 =================
   给定 g、p、A，求 a。整张地形就画在这里：x = 0 … p−1，高度 gˣ mod p。

   为什么这是顿悟视角而不只是"一张图"：教科书通常把"离散对数难"写成一句要
   接受的断言。在这一页上它是一个**看得见的形状**——那条曲线没有单调段可以
   二分，没有斜率可以跟随，相邻两点之间没有任何可利用的关系。伊芙唯一能做的
   就是从左到右一格一格试，而画面上那条橙色的扫描线就是她全部的算法。

   而这一页必须同时把话说完整、不许夸大：**这里的 p 只有三位数，所以扫描线
   一秒钟就赢了**。那不是密码的失败，那正是真实的 p 必须有 2048 位的理由。
   两个数字并排印出来，读者自己就得出了结论。 */
const hard = {
  label: { en: "Eve's Problem", zh: '伊芙的难题' },
  brand: { en: 'g^x mod p, plotted for every x. Forward is a short ladder; backward there is nothing to follow — no slope, no ordering, no shortcut at this size but the sweep.',
           zh: 'gˣ mod p 的每一个 x 都画在这里。正着走是一段很短的阶梯；反着走没有任何可循之物 —— 没有斜率，没有次序，在这个尺寸上除了硬扫别无他法。' },
  tips: { en: 'Press ⏵ and watch the orange sweep — that is Eve\'s entire algorithm. It wins here in under a second, because p has three digits. That is the whole argument for 2048-bit primes. Now drag g onto a value marked ✕: the plot flattens into a few horizontal bands and the key space collapses to ord(g).',
          zh: '按 ⏵ 看那条橙色扫描线 —— 那就是伊芙算法的全部。它在这里不到一秒就赢了，因为 p 只有三位数；这正是真实素数要 2048 位的全部理由。再把 g 拖到标着 ✕ 的某一格：地形立刻塌成几条水平带，密钥空间缩到 ord(g)。' },
  params: ['g', 'a', 'b'],
  presets: PRIME_PRESETS,
  presetsLabel: PRIME_LABEL,
  views: {
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showProbe',   label: { en: "Eve's sweep",  zh: '伊芙的扫描' }, color: ORANGE,  checked: true },
    { key: 'showLanding', label: { en: 'Target A',     zh: '目标 A' },     color: EMERALD, checked: true },
    { key: 'showTable',   label: { en: 'Forward table', zh: '正向表' },    color: VIOLET,  checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const L = layout(vi);
    const S = exOf();
    const g = curG(), a = curA();
    /* TLeve 的 steps 就是 P，取模只是防御：换素数那一瞬间若有一帧用的是旧轴，
       下标也不会越界。 */
    const probe = TLeve.index % P;
    const probeVal = S.powers[probe];
    const tableOn = !!E.state.showTable;

    /* 竖直分带表：
         0   … 22    标题（含可达值计数）
         30  … +ph   地形
         +6  … +14   x 轴刻度
         +8  … +16   正向表标题（可关）
         +4  … +cell 正向表（可关）
         末尾 +40    两行代价 */
    const capH = 22, axisH = 15, costH = 38;
    const fit = E.fitCells(L.availW, P, { gap: 3, min: 26, max: 46 });
    const tableH = tableOn ? (16 + fit.cell * 0.82 + 16) : 0;
    const plotY = L.top + capH + 8;
    /* 上限 420 而不是 300：地形是这一页的主角，剩下的竖直空间该给它，
       而不是变成图与代价行之间的一段空白（1280×800 上量到 170px 的空档）。 */
    const plotH = E.clamp(L.availH - capH - 8 - axisH - tableH - costH - 10, 70, 420);
    const plotX = L.x0 + 26;
    const plotW = L.availW - 26;

    /* ① 标题：可达值的计数。这个数不是文案，是 reachable() 数出来的。 */
    /* 窄屏短版：完整的英文"is NOT a primitive root…"有 74 个字符，375px 上压到
       最小字号也要 352px，正好卡在可用宽度上——差一个字就被截断，而截断掉的
       恰好是那个塌陷后的计数。 */
    const capText = S.isGen
      ? (L.narrow
          ? E.t({ en: 'g = ' + g + ' is a primitive root — reaches all ' + S.reach.size + ' values',
                  zh: 'g = ' + g + ' 是原根 —— 走遍全部 ' + S.reach.size + ' 个值' })
          : E.t({ en: 'g = ' + g + ' is a primitive root — g^x reaches all ' + S.reach.size +
                      ' values of the group',
                  zh: 'g = ' + g + ' 是原根 —— gˣ 走遍群里全部 ' + S.reach.size + ' 个值' }))
      : (L.narrow
          ? E.t({ en: 'g = ' + g + ' not a primitive root — ' + S.reach.size + ' of ' +
                      (P - 1) + ' (ord ' + S.reach.order + ')',
                  zh: 'g = ' + g + ' 不是原根 —— ' + (P - 1) + ' 个里只到 ' + S.reach.size +
                      ' 个（ord ' + S.reach.order + '）' })
          : E.t({ en: 'g = ' + g + ' is NOT a primitive root — g^x reaches only ' + S.reach.size +
                      ' of ' + (P - 1) + ' values (ord = ' + S.reach.order + ')',
                  zh: 'g = ' + g + ' 不是原根 —— gˣ 只走得到 ' + (P - 1) + ' 个值里的 ' +
                      S.reach.size + ' 个（ord = ' + S.reach.order + '）' }));
    banner(L.x0, L.top, L.availW, capH, capText,
           { color: S.isGen ? EMERALD : UNPAIRED,
             fill: S.isGen ? 'rgba(52,211,153,.08)' : 'rgba(255,47,208,.09)',
             stroke: S.isGen ? 'rgba(52,211,153,.4)' : 'rgba(255,47,208,.5)', max: 12 });

    /* ② 地形本身。max 显式锁死在 p−1，不用每帧的最大值——不锁的话换一次 g
       所有柱子会整体跳一次高度，看起来像数据在抖而不是在变。
       p 大时把 gap 收到 0：227 根柱子分 2px 的缝会让缝比柱子还宽，图形从此
       只剩噪点。 */
    const gap = P > 120 ? 0 : 1;
    E.barChart(plotX, plotY, plotW, plotH, S.powers, {
      max: P - 1,
      gap: gap,
      colorAt: function (i) {
        if (E.state.showProbe && i === probe) return ORANGE;
        if (E.state.showLanding && S.powers[i] === S.ex.A) return EMERALD;
        return 'rgba(148,163,184,.42)';
      }
    });
    const bw = (plotW - gap * (P - 1)) / P;

    /* ③ 非原根时，可达的高度只有 ord(g) 个——地形于是塌成几条水平带。
       带子少的时候画出来（那正是"塌陷"的形状），多到 24 条以上就只报数字：
       113 条线画在图上是噪点，不是信息。 */
    if (!S.isGen && S.reach.size <= 24) {
      for (let i = 0; i < S.reach.values.length; i++) {
        const yy = plotY + plotH - (S.reach.values[i] / (P - 1)) * plotH;
        E.chip(plotX, yy, plotW, 1, '', { fill: 'rgba(255,47,208,.35)', radius: 0 });
      }
    }

    /* ④ 目标高度 A：伊芙知道的那个数。它是一条横线，而她要找的是**哪一列**
       碰到了这条线。 */
    if (E.state.showLanding) {
      const ay = plotY + plotH - (S.ex.A / (P - 1)) * plotH;
      E.chip(plotX, ay, plotW, 1, '', { fill: 'rgba(52,211,153,.55)', radius: 0 });
      const trueX = S.dlog.found ? S.dlog.x : -1;
      if (trueX >= 0) {
        const tx = plotX + trueX * (bw + gap) + bw / 2;
        E.glowDot([tx, ay], Math.max(10, bw * 2.2), 'rgba(52,211,153,.5)', 'rgba(52,211,153,.14)');
      }
      E.chip(plotX - 26, ay - 7, 24, 14, 'A', { color: EMERALD, fontSize: 10.5 });
      /* 纵轴的两个端点。不画的话读者无从知道这条竖轴的量程是 1 … p−1，
         而"高度就是 gˣ 的值"正是这张图的读法。挨着 A 那个标记时就不画——
         两个字叠在一起比少一个更糟。 */
      if (Math.abs(ay - plotY) > 15) {
        E.chip(plotX - 30, plotY - 6, 28, 13, String(P - 1), { color: DIM, fontSize: 9.5 });
      }
      if (Math.abs(ay - (plotY + plotH)) > 15) {
        E.chip(plotX - 30, plotY + plotH - 8, 28, 13, '1', { color: DIM, fontSize: 9.5 });
      }
    }

    /* ⑤ 扫描线：伊芙算法的全部。 */
    if (E.state.showProbe) {
      const px = plotX + probe * (bw + gap) + bw / 2;
      E.chip(px - 0.5, plotY, 1, plotH, '', { fill: 'rgba(251,146,60,.55)', radius: 0 });
      const py = plotY + plotH - (probeVal / (P - 1)) * plotH;
      E.glowDot([px, py], Math.max(9, bw * 2), 'rgba(251,146,60,.7)', 'rgba(251,146,60,.18)');
      const tag = 'x = ' + probe + '   g^x = ' + probeVal;
      const tw = Math.min(150, plotW);
      const tx = E.clamp(px - tw / 2, plotX, plotX + plotW - tw);
      E.chip(tx, plotY - 2, tw, 16, tag,
             { fill: CARD, color: ORANGE, fontSize: fitFont(tag, tw - 10, 11, 8), radius: 4 });
    }

    /* ⑥ x 轴刻度：两端与中点，够读出"横轴是 0 到 p−1"就行。 */
    const axY = plotY + plotH + 2;
    E.chip(plotX, axY, 40, axisH, '0', { color: DIM, fontSize: 10 });
    E.chip(plotX + plotW / 2 - 22, axY, 44, axisH, String(Math.floor((P - 1) / 2)),
           { color: DIM, fontSize: 10 });
    E.chip(plotX + plotW - 44, axY, 44, axisH, String(P - 1), { color: DIM, fontSize: 10 });

    /* ⑦ 正向表：一格一格地把 gˣ 摆出来，说明"正着算"根本不需要聪明。
       格数由 fitCells 反推——放不下的部分必须**说出来**，所以下面那行写着
       当前窗口是 x = s–e / p，而不是让画布边缘去吃掉它。
       窗口跟着扫描线翻页：伊芙扫到哪一格，表就翻到含那一格的那一页。 */
    if (tableOn) {
      const tY = axY + axisH + 6;
      const page = Math.floor(probe / fit.n);
      const start = page * fit.n;
      const end = Math.min(P - 1, start + fit.n - 1);
      const label = fit.truncated
        ? E.t({ en: 'forward is trivial:  x = ' + start + '–' + end + '  /  ' + P + '  (one page)',
                zh: '正着走毫无难度： x = ' + start + '–' + end + '  /  ' + P + '（本页窗口）' })
        : E.t({ en: 'forward is trivial:  all ' + P + ' values of g^x',
                zh: '正着走毫无难度：gˣ 的全部 ' + P + ' 个值' });
      banner(L.x0, tY, L.availW, 15, label, { color: VIOLET, max: 10.5 });
      const cy = tY + 17;
      const ch = fit.cell * 0.82;
      const sx = L.x0 + (L.availW - fit.total) / 2;
      for (let i = 0; i < fit.n; i++) {
        const x = start + i;
        if (x >= P) break;
        const on = (x === probe);
        E.chip(sx + i * (fit.cell + 3), cy, fit.cell, ch, String(S.powers[x]),
               { color: on ? ORANGE : (S.powers[x] === S.ex.A ? EMERALD : SLATE),
                 fill: on ? 'rgba(251,146,60,.14)' : 'rgba(8,13,24,.55)',
                 stroke: on ? 'rgba(251,146,60,.6)' : LINE,
                 fontSize: Math.min(12, fit.cell * 0.44) });
      }
    }

    /* ⑧ 两行代价：一行反向、一行正向。这一页的全部内容就是这两个数字的比值，
       以及它在 2048 位上会变成什么。

       两行都有**窄屏专用的短版**。这不是可有可无的润色：完整的中文第二行有
       约 90 个汉字，即便压到 8.5px 也要 796px，而 375px 上只有 351px 可用——
       实测那一行从画面左右两侧同时溢出。中文每字约等于一个字号宽、拉丁字母
       约 0.55，所以同一句话的中英两版宽度能差近一倍，"桌面上看着刚好"从来不是
       窄屏也刚好的证据。 */
    const costY = vi.H - L.bot - costH + 4;
    if (costY > plotY + plotH + 20) {
      let l1;
      if (!S.dlog.found) {
        l1 = E.t({ en: 'backward: Eve swept all ' + S.dlog.steps +
                       ' values and found nothing — with this g, A is not even reachable.',
                   zh: '反向：伊芙扫完全部 ' + S.dlog.steps +
                       ' 个值也没找到 —— 用这个 g，A 根本够不着。' });
      } else if (L.narrow) {
        l1 = E.t({ en: 'backward: up to ' + S.dlog.bound + ' tries · answer at x = ' +
                       S.dlog.x + ' (try ' + S.dlog.steps + ')',
                   zh: '反向：最多 ' + S.dlog.bound + ' 次 · 答案在 x = ' + S.dlog.x +
                       '（第 ' + S.dlog.steps + ' 次）' });
      } else {
        l1 = E.t({ en: 'backward: Eve tries x = 0, 1, 2, … up to p−1 = ' + S.dlog.bound +
                       '.  Here the answer sits at x = ' + S.dlog.x + ', found on try ' + S.dlog.steps + '.',
                   zh: '反着走：伊芙从 x = 0 一格一格试，上限 p−1 = ' + S.dlog.bound +
                       '。这里答案在 x = ' + S.dlog.x + '，第 ' + S.dlog.steps + ' 次试探撞上。' });
      }
      const l2 = L.narrow
        ? E.t({ en: 'forward ' + S.ladder.total + ' ops · 2048-bit: ~3000 forward, record backward 795 bits',
                zh: '正向 ' + S.ladder.total + ' 次运算 · 2048 位约 3000 次；反向纪录 795 位' })
        /* 宽屏这一行也得数着字符写：1280 宽下右侧面板吃掉 330px，可用宽度只有
           902px，而第一版的英文有 185 个字符——连压到最小字号都要 952px，被
           clipToWidth 截在 "…795 bits (2019)…"。英文比中文长得多，所以先按
           英文那一版收敛，中文自然也就装得下。 */
        : E.t({
            en: 'forward: ' + S.ladder.total + ' operations (' + plu(S.ladder.squarings, 'squaring', 'squarings') +
                ' + ' + plu(S.ladder.multiplies, 'multiply', 'multiplies') +
                '). At 2048 bits forward is ~3000 operations; backward, the public record is 795 bits (2019).',
            zh: '正着走：' + S.ladder.total + ' 次运算（' + S.ladder.squarings + ' 次平方 + ' +
                S.ladder.multiplies + ' 次乘）。到 2048 位正向也不过约 3000 次；' +
                '而反向的公开纪录是 795 位（2019 年）。'
          });
      banner(L.x0, costY, L.availW, 17, l1, { color: ORANGE, max: 11 });
      banner(L.x0, costY + 19, L.availW, 17, l2, { color: SLATE, max: 11 });
    }
  },
  readout: function () {
    const S = exOf();
    const g = curG(), a = curA();
    const probe = TLeve.index % P;
    let s = '<span class="dim">' + E.t({ en: 'Eve knows ', zh: '伊芙知道 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)"><i>p</i> = ' + P + ', <i>g</i> = ' + g +
      ', <i>A</i> = ' + S.ex.A + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'she wants ', zh: '她要的是 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)"><i>a</i></b>' +
      '<span class="dim">  ' + E.t({ en: 'with ', zh: '使得 ' }) + 'g^a ≡ A</span><br>' +
      '<span class="dim">' + E.t({ en: 'sweep at ', zh: '扫描线在 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)"><i>x</i> = ' + probe + '</b>' +
      '<span class="dim">   g^x = ' + S.powers[probe] + '</span><br>';

    if (S.dlog.found) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'brute force wins in ' + S.dlog.steps + ' tries',
              zh: '穷举 ' + S.dlog.steps + ' 次试探就赢' }) + '</b>' +
        '<span class="dim">  ' +
        E.t({ en: '(bound: p−1 = ' + S.dlog.bound + ')', zh: '（上限 p−1 = ' + S.dlog.bound + '）' }) +
        '</span><br>';
    } else {
      s += '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'no x at all: A is unreachable from this g',
              zh: '根本没有这个 x：这个 g 够不到 A' }) + '</b><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'forward ', zh: '正向 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + S.ladder.total +
      E.t({ en: ' ops', zh: ' 次运算' }) + '</b>' +
      '<span class="dim">  ' + S.ladder.squarings +
      E.t({ en: '× square, ', zh: ' 次平方、' }) + S.ladder.multiplies +
      E.t({ en: '× multiply', zh: ' 次乘' }) + '</span><br>' +
      '<b style="--c:var(--trace-' + (S.isGen ? 'emerald' : 'unpaired') + ')">' +
      E.t({ en: 'key space ' + S.reach.size + ' of ' + (P - 1),
            zh: '密钥空间 ' + (P - 1) + ' 里的 ' + S.reach.size }) + '</b>' +
      '<span class="dim">   ord(<i>g</i>) = ' + S.reach.order + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'toy p on purpose — that is why real p is 2048 bits',
            zh: '这里的 p 是玩具尺寸，故意的 —— 这正是真实的 p 要 2048 位的理由' }) +
      '</span>';
    return s;
  }
};

var SCENES = { mix: mix, real: real, hard: hard };

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* 引擎的 buildPresets() 建面板时会选中**第一项**（p = 31），而本页想默认落在
   p = 101：31 上 g = 2 的阶只有 5，一开页就是塌陷的那一格，读者会以为那是常态。
   排序不能改（素数升序是使用者预期的顺序），所以在 init() 之后显式改一次，
   再用引擎导出的 syncPresetHighlight 把按钮高亮同步过去——它正是为"调用方
   自己完成了加载、只需要按钮组跟上"这种情形留的出口。
   两个页签共用同一份 presets 数组（同一个对象引用），所以对任意一个调用一次
   就会同步到全部。 */
/* init() 之后滑杆才存在。取**第一根**：PARAMS 的声明顺序是 [g, a, b, m]，
   querySelectorAll 按文档顺序返回，两者同源。不按 key 找是因为引擎没有把
   paramWraps 导出来；真要改成按 key 找，得先改引擎——那是另一件事，不该顺手
   夹带在一个工具页里（crypto-affine 在同一处留过同一句话）。 */
gInput = document.querySelectorAll('#paramsHost input[type=range]')[0] || null;

setPrime(P_DEFAULT);
E.syncPresetHighlight('real', 'p' + P_DEFAULT);
/* setPrime 内部已经补发过一次 'input'；这一行是给"默认值恰好等于 P_DEFAULT、
   setPrime 直接 return"的那条路准备的——徽章仍然得按当前 p 算一次。 */
refreshGBadge();
</script>
</body>
</html>
