<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 本页从 tools/_skeleton.html 复制而来，改掉的四处：<title>、tool-version、
     下面的版本记录、第二个脚本块里的 TOOL（id / title / h1），外加把
     GENERATED:ALGOS 的清单从 `none` 换成 affine.js。

     tool-engine 反映的是 core/ 那几个模块的版本，不是工具自己的版本，
     一般不必跟着改。版本号要在三处同步：注册表 cryptography-tools.json 的
     version、这里的 tool-version meta、面板右上角的徽章——徽章直接读 meta
     （见第二个脚本块里的 VERSION），所以它永远不需要单独改。

     文件里除了两处真正的脚本标签，任何地方——包括注释——都不要再写出
     `&lt;` + `script` + `&gt;` 这个字面量：语法门与 CI 都靠它切分脚本块，注释里
     多出来的一个会让切分从那里开始，把整段 HTML 当成 JS 去检查，报一个跟
     真实代码毫无关系的错。 -->
<meta name="tool-version" content="1.0.1">
<meta name="tool-engine" content="crypto-1.0.0">
<title>Affine Cipher · 仿射密码</title>
<!-- 版本记录（changelog，新→旧）：
     1.0.0  2026-08-10  首发：三页签——转盘（b 转、a 拉伸，凯撒是 a=1 那一格）、
                        塌陷（顿悟视角：gcd(a,26)≠1 时映射当场对折，几个字母
                        砸在同一个像上、其余字母永远够不着，碰撞数实时可读）、
                        312 穷举（12×26 的矩形一次摊开，χ² 获胜格发光；真钥匙
                        描青边，文本一短两格就分开）。不可逆的 a 上全页不调
                        encrypt，改走裸映射，因此永远不会因为一个非法密钥而崩。 -->
<style>
/* 视觉令牌。CryptoViz 与根项目、chess 子项目共用同一套值——它们是同一门
   视觉语言的三个方言，不是三套配色。Canvas 里用到同一个颜色时写**同样的
   字面量**（见第二个脚本块顶部的 CYAN / ROSE / …），这样"一条线一种颜色、
   在多处复用"这条原则在 CSS 与 Canvas 两侧是同一个事实，而不是两份要靠人
   记住去同步的抄写。 */
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  /* 未配对 / 异常态专用色。只在"这一项没有对手、没有解、不该存在"时用，
     不参与 accent 轮换——它刺眼是故意的。 */
  --trace-unpaired:#ff2fd0;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}

/* canvas 是主角：全屏置底，其余一切 UI 以 position:fixed 浮在它之上。
   任何"左边画布右边面板"的分栏都是违规的——画面一旦被切开，字母轮就不再
   是这一页的主体，而变成了一张配图。 */
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 传输条（动画时钟的控件）----
   ⏮ 上一步 · ⏵/⏸ 播放暂停 · ⏭ 下一步 · ⟲ 回到第 0 步。
   密码学工具几乎都是"一轮一轮"的（每次按键、每一轮、每个 block），所以时间
   控件是这一类工具的标配而不是可选件，放在浮层里而不是折进面板：使用者在看
   canvas，手要落在看得见的地方。#btnPlay 与 #btnReset 的文案由引擎写
   （UI.pause / UI.resume / UI.reset，随语言切换），这里的字形只是无 JS 时的
   兜底；⏮ / ⏭ 是本页自己接的，见第二个脚本块。 */
.transport{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:5px;padding:5px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tbtn{min-width:34px;padding:6px 12px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:#c6d2e4;font-size:13px;font-family:var(--font-cn);
  line-height:1.2;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tbtn:hover{color:#e8f2fb;border-color:rgba(45,212,234,.45)}
.tbtn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tbtn.primary{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.5);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:14px;line-height:1;cursor:pointer}
.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:6px 14px 14px}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
/* 数学符号一律 serif italic（设计规范五条原则第 4 条），Canvas 侧对应
   VizEngine.mathFont()。字母轮上的字母、模运算里的数字都算数学符号。 */
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views,.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel,.presets .plabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn,.pbtn{padding:5px 9px;font-size:11.5px}

/* 文本输入槽（#ioHost）。古典密码工具的明文/密钥来自输入框而不是滑杆——
   一个 26 档的滑杆表达不了 "ATTACK AT DAWN"。不需要的工具把 #ioHost 留空。 */
.iorow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px}
.iorow .btn{padding:5px 9px;font-size:11.5px}
.iolabel{font-size:11.5px;color:rgba(159,176,200,.8);margin:10px 0 4px}
.iofield{width:100%;min-height:52px;resize:vertical;padding:7px 9px;border-radius:9px;
  border:1px solid var(--panel-line);background:rgba(8,13,24,.7);color:var(--ui-bright);
  font-family:var(--font-mono);font-size:12px;line-height:1.6}
.iofield:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:1px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
/* 读数里的粗体值用行内 style="--c:var(--trace-xxx)" 指定颜色，与 .tg .dot
   用的是同一个自定义属性——同一条量在图例点与读数值上必须是同一种颜色。 */
.readout b{font-weight:600;color:var(--c, inherit)}
.readout i{font-family:var(--font-math);font-style:italic}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  /* 页签必须让开标题。窄屏上 .brand 从 top:12px 起，eyebrow（10px 字 + 6px
     下边距）之后是 20px 的 h1，整块底边落在约 60px——而这里原来写的是 52px，
     于是标题与页签重叠 8px。它是**继承性**的：这段 CSS 在骨架里，13 个工具
     各存一份逐字节相同的副本，所以一处写错就是十四处一起错，而且只在 ≤760px
     出现，桌面上永远看不见（本项目为此在窄屏上连栽五次）。
     66px 给 60px 的底边留 6px 余量；传输条跟着同幅下移。 */
  .tabs{top:66px;left:14px;transform:none}
  /* 传输条挪到页签下方：手机上面板是贴底的抽屉，底部中央那个位置会被它盖住。 */
  .transport{top:110px;left:14px;bottom:auto;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="brand">
  <div class="eyebrow">CRYPTOVIZ · 密码学可视化</div>
  <h1></h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span id="panelTitle">Parameters &amp; Views</span>
    <span class="ph-right">
      <span class="ver" id="verBadge"></span>
      <button class="lang" id="btnLang" title="切换语言 / Switch language">中</button>
      <button class="fold" id="btnFold" title="收起 / 展开 · Collapse / expand">−</button>
    </span>
  </div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div id="ioHost"></div>
    <div id="togglesHost"></div>
    <div id="presetsHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="tips" id="tips"></div>
  </div>
</aside>

<div class="transport" id="transport">
  <button class="tbtn" id="btnBack" title="上一步 · Step back" aria-label="Step back">⏮</button>
  <button class="tbtn primary" id="btnPlay" title="播放 / 暂停 · Play / pause">⏵</button>
  <button class="tbtn" id="btnStep" title="下一步 · Step forward" aria-label="Step forward">⏭</button>
  <button class="tbtn" id="btnReset" title="回到起点 · Reset">⟲</button>
</div>

<div class="hint"></div>

<script>
/* ================= 生成区间 =================
   本块的全部内容由 cryptography/scripts/inline_core.py 从 core/ 与 examples/
   注入，**禁止手改**：手改的那一行会在下一次跑脚本时被无声地覆盖掉，而
   check.py 的第一道门会先一步把它判红。要改行为就去改编辑源，然后跑

       python3 cryptography/scripts/inline_core.py

   顺序是依赖顺序，不是字母顺序：CRYPTO-CORE 最先（其余都用它的 mod / letters），
   CRYPTANALYSIS 与 ALGOS 次之，EXAMPLES 再次（examples.js 要读分组文件挂上去
   的 CryptoExamplesParts），VIZ-ENGINE / INTERACT / ANIMATION 最后。
   一个工具用不到的块可以整块删掉（除 CRYPTO-CORE 与 VIZ-ENGINE 外都是可选的，
   见 inline_core.py 的 OPTIONAL_TAGS）——留着空标记也行，脚本会照填。 */
/* >>> GENERATED:CRYPTO-CORE */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CryptoCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const N = 26;

  function isAlpha(ch) {
    if (typeof ch !== 'string' || ch.length !== 1) return false;
    const c = ch.charCodeAt(0);
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122);
  }

  /* 只留 A-Z 并大写。刻意**不**做 Unicode 折叠（é → E）：这是古典密码，
     字母表就是 26 个，把 é 悄悄折进 E 会让"密文长度 = 明文字母数"这条
     使用者肉眼在数的关系对不上。丢弃比折叠诚实。 */
  function normalize(text) {
    return String(text).toUpperCase().replace(/[^A-Z]/g, '');
  }

  function letters(text) {
    const s = normalize(text);
    const out = [];
    for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i) - 65);
    return out;
  }

  function fromIndices(idx) {
    let s = '';
    for (let i = 0; i < idx.length; i++) s += ALPHABET.charAt(mod(idx[i], N));
    return s;
  }

  /* JS 的 % 是取余不是取模：(-1) % 26 === -1。整个古典密码部分都建立在
     "落回 [0,n)" 上，所以这一个函数是地基，不许有人图省事直接写 %。 */
  function mod(a, n) {
    /* 模数必须为正，不只是非零。n < 0 时 ((a%n)+n)%n 会给出**负**结果
       （实测 mod(5,-3) === -1），而这个函数对外承诺的是"结果恒 >= 0"，
       整个古典密码部分都建立在那句承诺上。与其让一个负模数悄悄产出负下标、
       在 fromIndices 里变成 charAt(-1) 那种空字符串，不如在入口就拒绝：
       今天没有调用方传负模数，正因为如此，现在把门关上是免费的。 */
    if (!(n > 0)) throw new Error('mod 的模数必须是正数，收到 ' + n);
    return ((a % n) + n) % n;
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a;
  }

  /* 扩展欧几里得：返回 [g, x, y] 满足 a*x + b*y === g === gcd(a,b)。
     modInverse 靠它，Affine 的解密也靠它。 */
  function egcd(a, b) {
    let old_r = a, r = b;
    let old_s = 1, s = 0;
    let old_t = 0, t = 1;
    while (r !== 0) {
      const q = Math.floor(old_r / r);
      let tmp = old_r - q * r; old_r = r; r = tmp;
      tmp = old_s - q * s; old_s = s; s = tmp;
      tmp = old_t - q * t; old_t = t; t = tmp;
    }
    /* gcd 约定非负；a<0 或 b<0 时上面会得到负的 old_r，连同系数一起翻号，
       贝祖等式仍成立。 */
    if (old_r < 0) return [-old_r, -old_s, -old_t];
    return [old_r, old_s, old_t];
  }

  function modInverse(a, n) {
    const r = egcd(mod(a, n), n);
    if (r[0] !== 1) return null;      // 不互素，逆元不存在
    return mod(r[1], n);
  }

  /* ================= ℤ/nℤ 上的矩阵（Hill 密码） =================
     Hill 把每 k 个字母看成 ℤ/nℤ 上的一个列向量，密钥是 k×k 矩阵：c = M·p (mod n)。
     解密要的不是"除以 M"，而是 M 在**模 n 意义下**的逆，它存在的充要条件是
     gcd(det M, n) = 1 —— 不是实数意义上的 det ≠ 0。这一条差别正是 Hill 那一页
     要讲的东西：行列式为 13 的矩阵在实数上完全可逆，模 26 却是死的（13 与 26

  /* window.matchMedia 的结果；只在 init() 里读一次（硬约束：模块顶层不碰 window）。 */
  let REDUCED = false;

  /* state.dt：本帧的时长（秒），由 frame() 每帧写入，已 clamp 到 [0, 0.05]
     以熬过后台标签页的时间跳变。场景在 draw() 里读它来推进自己的动画——
     这是引擎唯一的时钟出口。工具不得自己再用 performance.now() 算一遍：
     同一个量两处计算必然漂移（阶段 1 的两个工具各自造了一份 frameDt()，
     阶段 2 Task 1 一并收口）。running 默认 false（载入即暂停）——不是继承自
     math-viz 引擎的 true——那边的工具天生是一段持续运行的连续模拟，
     「打开就在动」是常态；棋类工具没有连续模拟，running 目前唯一的效果是
     喂给播放按钮的文案，真正的「自动巡回演示」是每个工具自己的
     demoRunning/demoPlaying 在管。默认给 true 会让按钮在打开页面的瞬间就
     显示「暂停」，暗示着有什么正在跑，这正是用户在两个棋类工具上报的体验
     问题的根——用户到达页面时演示已经在切换，第一件事却要去找暂停键。
     默认 false 让「打开 = 静止，播放是你主动要的」对每一个未来要接这份
     引擎的棋类工具都成立，不必每个工具各自记得覆盖它。 */
  const state = { running: false, dt: 0 };
  let curTab = null;
  const RELABEL = [];        // 语言切换时需要重新取文案的回调列表
  const cams = {};           // tabId -> 该页签「首视角」对应的相机参数（启动 / 双击回正用）
  /* cam 是「唯一一份」可变对象：往后任何「换页签因而换相机」都用 Object.assign(cam, ...)
     原地改写，绝不 `cam = 别的对象`——否则导出的 VizEngine.cam 会在换页签后指向一个
     没人再更新的旧对象。默认值给一个通用的三视角，供没有 SCENES 的最小用法直接可用。 */
  let cam = { az: -0.6, el: 0.32, dist: 10, tx: 0, ty: 0, tz: 0 };
  let tween = null;
  const lastView = {};
  /* tabId -> 当前选中的预置内容 key（见「预置内容」一节）。与 lastView 同一手法：
     views 是相机角度的单选记忆，lastPreset 是内容（局面/棋种/……）的单选记忆——
     两者过去被 Task 6 误合并进同一份 views（onSelect 里塞内容加载），这里把它们
     拆成两份独立状态，谁也不再替谁背锅。 */
  const lastPreset = {};

  /* SCENES / PARAMS / TOOL / 版本号：工具专属声明，由 init() 可选注入。
     默认给空容器而不是假定同名全局已存在——这样 require() 或在没提供它们的
     最小页面上调用 init() 都不会在访问处抛 ReferenceError，机制只是安静地不生效。 */
  let SCENES = {};
  let PARAMS = [];
  let TOOL = { id: null, title: { zh: '', en: '' }, h1: { zh: '', en: '' } };
  let VERSION = '0.0.0';

  /* ================= 画布 ================= */
  let canvas = null, ctx = null;
  let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

  function resize() {
    if (!canvas) return;
    DPR = Math.min(2.5, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    FOCAL = 1.2 * Math.min(H, W * 1.1);
    bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
    bgGrad.addColorStop(0, '#0c1526');
    bgGrad.addColorStop(1, '#05070d');
  }

  /* ================= 基础数学 ================= */
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  const fmt = (x, d = 2) => x.toFixed(d);
  const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

  /* ================= 轨道相机与投影 ================= */
  // 仰角安全范围：world up 取的是 (0,1,0)，el 趋近 ±π/2 时 forward 与它共线，
  // 下面 cross(f, [0,1,0]) 会退化成一个接近零的向量——右/上手基就此失定，
  // 不会报错，是整块画面悄悄塌缩成屏幕正中的一个点（norm() 对零向量的
  // 兜底是 0/1=0，不是抛异常）。bindOrbit() 里鼠标拖拽早就把 el 夹在这个
  // 范围内（见下面 pointermove 的 clamp），但那只管交互拖拽——SCENES 里
  // 声明的视角预设（tools/*.html 的 CAM_TOP 之类）是直接把 el 写进
  // tween.to 再原样赋给 cam.el 的，不经过那处 clamp。这里把同一对边界
  // 值搬到相机基本身的计算里，保证不管 cam.el 是被拖出来的还是被某个
  // 视角预设直接赋值出来的，算出来的基永远不会撞上这个奇点——单一出口，
  // 以后任何新工具写一个贴着 ±π/2 的 el 都不会把渲染悄悄弄坏。
  const EL_MIN = -1.45, EL_MAX = 1.53;
  function makeCam() {
    const elC = clamp(cam.el, EL_MIN, EL_MAX);
    const cp = Math.cos(elC), sp = Math.sin(elC);
    const eye = [
      cam.tx + cam.dist * cp * Math.sin(cam.az),
      cam.ty + cam.dist * sp,
      cam.tz + cam.dist * cp * Math.cos(cam.az)
    ];
    const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
    const r = norm(cross(f, [0, 1, 0]));
    const u = cross(r, f);
    return { eye, f, r, u };
  }
  function camPt(C, p) {
    const d = sub(p, C.eye);
    return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
  }
  function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
  function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
  function clipNear(a, b) {
    const tt = (NEAR - a[2]) / (b[2] - a[2]);
    return [a[0] + (b[0]-a[0])*tt, a[1] + (b[1]-a[1])*tt, NEAR];
  }

  /* proj() 的反方向：给一个屏幕点，把「相机 eye 出发经过该像素的那条射线」
     与世界平面 z = planeZ 求交，返回世界坐标 [x, y, planeZ]，射线与平面
     平行（或恰好落在平面内，同样无唯一解）或交点落在相机之后都返回 null。
     推导：scr() 是 cz=1 那层的仿射投影，把它反过来，屏幕点 (sx,sy) 对应
     相机空间方向 (cx, cy, 1)（cx=(sx-CX)/FOCAL, cy=(CY-sy)/FOCAL），
     camPt() 的基是正交的 {r,u,f}，所以世界方向就是 cx·r + cy·u + 1·f——
     和 camPt() 互为逆变换，同一份 FOCAL/CX/CY 用两次，谁都不用再猜一遍。
     这是 BoardRender.pickSquare（点击选子）能成立的唯一依据。 */
  function unproject(C, screenXY, planeZ) {
    if (planeZ == null) planeZ = 0;
    const cx = (screenXY[0] - CX) / FOCAL;
    const cy = (CY - screenXY[1]) / FOCAL;
    const dir = [
      cx * C.r[0] + cy * C.u[0] + C.f[0],
      cx * C.r[1] + cy * C.u[1] + C.f[1],
      cx * C.r[2] + cy * C.u[2] + C.f[2]
    ];
    if (Math.abs(dir[2]) < 1e-9) return null;             // 射线与平面平行（或共面），无唯一交点
    const tt = (planeZ - C.eye[2]) / dir[2];
    if (tt <= 0) return null;                              // 交点在相机之后（或恰在相机上）
    return [C.eye[0] + dir[0]*tt, C.eye[1] + dir[1]*tt, planeZ];
  }

  /* 投影常量的只读访问器——FOCAL/CX/CY/W/H 是模块私有的，之前每个消费方
     只能各自重新推一遍 FOCAL = 1.2·min(H, W·1.1) 的公式；棋子预览页就吃过
     这个亏（算错一次，全部棋子跟着错位）。往后任何要自己做投影相关计算
     的调用方，都从这里取权威值，不再重新推导。 */
  function viewInfo() { return { FOCAL: FOCAL, CX: CX, CY: CY, W: W, H: H }; }

  /* 让「ctx 参数」名副其实：drawBoard/drawPiece 这类跨模块的绘制函数把
     ctx 当参数注入，是为了能在 node 下装载、能给第二块画布画图（如规则
     工具要并排画伪合法/合法两块棋盘）。但 strokePoly/label3 等图元一直画
     在本模块 init() 时钉死的模块私有 ctx 上，从不重新指向别的画布——于是
     drawBoard(someOtherCanvas, …) 的输出会被悄悄劈成两半。withContext()
     在 fn() 执行期间把私有 ctx 换成调用方给的目标画布，结束后原样复原；
     选它而不是给每个图元加 ctx 形参，是因为改动只集中在一处，图元本身、
     调用点都不用逐个改签名。 */
  function withContext(targetCtx, fn) {
    const prev = ctx;
    ctx = targetCtx;
    try { return fn(); }
    finally { ctx = prev; }
  }

  /* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
  function polyPath(C, pts) {
    if (pts.length < 2) return null;
    let head = null, tail = null, contin = false, prev = null;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const P = pts[i];
      if (P === null) { prev = null; contin = false; continue; }
      const cur = camPt(C, P);
      if (prev !== null) {
        let a = prev, b = cur;
        const av = a[2] >= NEAR, bv = b[2] >= NEAR;
        if (av || bv) {
          if (!av) a = clipNear(a, b);
          if (!bv) b = clipNear(b, a);
          const sA = scr(a), sB = scr(b);
          if (!contin) ctx.moveTo(sA[0], sA[1]);
          ctx.lineTo(sB[0], sB[1]);
          if (!head) head = sA;
          tail = sB;
          contin = bv;
        } else {
          contin = false;
        }
      }
      prev = cur;
    }
    return head ? [head, tail] : null;
  }

  function strokePoly(C, pts, o) {
    const ht = polyPath(C, pts);
    if (!ht) return;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = o.width || 2;
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.dash) ctx.setLineDash(o.dash);
    if (o.fade) {
      const h = ht[0], tt = ht[1];
      if (Math.hypot(tt[0]-h[0], tt[1]-h[1]) < 2) {
        ctx.strokeStyle = o.fade[0];
      } else {
        const g = ctx.createLinearGradient(h[0], h[1], tt[0], tt[1]);
        g.addColorStop(0, o.fade[0]);
        g.addColorStop(1, o.fade[1]);
        ctx.strokeStyle = g;
      }
    } else {
      ctx.strokeStyle = o.color;
    }
    ctx.stroke();
    ctx.restore();
  }
  const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

  function glowDot(s, r, core, mid) {
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
    g.addColorStop(0, core);
    g.addColorStop(0.35, mid);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }
  function solidDot(C, p, r, color) {
    const s = proj(C, p);
    if (!s) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }

  function label3(C, p, text, o) {
    const s = proj(C, p);
    if (!s) return;
    ctx.save();
    ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
    ctx.fillStyle = o.color || '#c4d2e6';
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(3,6,12,.85)';
    ctx.shadowBlur = 4;
    ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
    ctx.restore();
  }

  function arrowAt(C, tip3, before3, color) {
    const tp = proj(C, tip3), b = proj(C, before3);
    if (!tp || !b) return;
    const a = Math.atan2(tp[1]-b[1], tp[0]-b[0]);
    const L = 9;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a-0.42), tp[1]-L*Math.sin(a-0.42));
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a+0.42), tp[1]-L*Math.sin(a+0.42));
    ctx.stroke();
    ctx.restore();
  }

  /* ================= 常用场景部件 ================= */
  const AXIS = 'rgba(159,176,200,0.9)';
  const AXIS_DIM = 'rgba(159,176,200,0.5)';

  /* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[] }。
     starter 版本还有个 tAxis（z 轴当连续时间轴用，靠一个「波形可视长度」常量定长、
     按秒打刻度）——棋没有连续时间驱动，这条分支随那个时间长度常量一起删掉了，
     只留平面上的 x/y 两轴。 */
  function drawAxes(C, o) {
    const ex = o.ex, ey = o.ey;
    line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
    label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
    label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    for (const k of (o.yTicks || [])) {
      for (const yv of [k, -k]) {
        line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
    }
    for (const k of (o.xTicks || [])) {
      for (const xv of [k, -k]) {
        line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }

  /* z=0 平面方格网格（几何类场景） */
  function drawGridXY(C, g, step) {
    const n = Math.round(g / step);
    for (let i = -n; i <= n; i++) {
      if (i === 0) continue;
      const u = i * step;
      line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
      line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    }
  }

  /* ================= 主绘制与主循环 ================= */
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    const C = makeCam();
    if (curTab != null && SCENES[curTab] && typeof SCENES[curTab].draw === 'function') {
      SCENES[curTab].draw(C);
    }
  }

  function updateReadout() {
    if (!roEl || curTab == null || !SCENES[curTab] || typeof SCENES[curTab].readout !== 'function') return;
    roEl.innerHTML = SCENES[curTab].readout();
  }

  /* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
     resetSim() 会清空它——用户主动重置后应当允许重新报。 */
  const frameErrSeen = Object.create(null);
  function frameError(err) {
    const k = curTab + '|' + ((err && err.message) || err);
    if (frameErrSeen[k]) return;
    frameErrSeen[k] = 1;
    console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
  }

  function resetSim() {
    Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  }

  let lastTs = 0, lastRO = 0;
  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
      lastTs = ts;

      if (tween) {
        const k = Math.min(1, (ts - tween.t0) / tween.dur);
        const e = ease(k);
        const f = tween.from, o = tween.to;
        cam.az = f.az + wrapPI(o.az - f.az) * e;
        cam.el = f.el + (o.el - f.el) * e;
        cam.dist = f.dist + (o.dist - f.dist) * e;
        cam.tx = f.tx + (o.tx - f.tx) * e;
        cam.ty = f.ty + (o.ty - f.ty) * e;
        cam.tz = f.tz + (o.tz - f.tz) * e;
        if (k >= 1) tween = null;
      }

      state.dt = dt;

      draw();
      if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
    } catch (err) {
      frameError(err);
    } finally {
      requestAnimationFrame(frame);
    }
  }

  /* ================= UI 生成（由消费方通过 init() 提供的 PARAMS / SCENES 声明驱动） ================= */
  const paramWraps = {};   // key -> { wrap, input, val, p }

  function buildParams() {
    const host = document.getElementById('paramsHost');
    if (!host || !PARAMS) return;
    PARAMS.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'ctl';
      wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
      const val = wrap.querySelector('.val');
      const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
      const upd = () => {
        const raw = parseFloat(input.value);
        state[p.key] = p.map ? p.map(raw) : raw;
        render();
      };
      input.addEventListener('input', upd);
      wrap.appendChild(input);
      host.appendChild(wrap);
      paramWraps[p.key] = { wrap, input, val, p };
      upd();                       // 建面板时用默认刻度初始化 state
      const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。 */
  function syncParamVisibility() {
    const list = SCENES[curTab] && SCENES[curTab].params;
    Object.keys(paramWraps).forEach(k => {
      paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
    });
  }

  function buildToggles() {
    const host = document.getElementById('togglesHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const grp = document.createElement('div');
      grp.className = 'toggles';
      grp.dataset.tab = id;
      (SCENES[id].toggles || []).forEach(tg => {
        if (!(tg.key in state)) state[tg.key] = tg.checked;
        const lab = document.createElement('label');
        lab.className = 'tg';
        lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
          '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
        const cb = lab.querySelector('input');
        cb.addEventListener('change', () => {
          state[tg.key] = cb.checked;
          document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
        });
        const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
        RELABEL.push(relabel);
        relabel();
        grp.appendChild(lab);
      });
      host.appendChild(grp);
    });
  }

  function buildViews() {
    const host = document.getElementById('viewsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const row = document.createElement('div');
      row.className = 'views';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'vlabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(UI.views); };
      RELABEL.push(labRelabel);
      labRelabel();
      Object.keys(SCENES[id].views || {}).forEach(name => {
        const b = document.createElement('button');
        b.className = 'btn vbtn';
        b.dataset.view = name;
        b.addEventListener('click', () => applyView(name));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
    });
  }

  /* ================= 预置内容（局面 / 棋种……）================= */
  /* Task 6 的原话是「预置局面（views 的 onSelect 里加载）」——把内容选择塞进
     相机角度控件里。这两件事其实互不相干：相机角度回答「从哪儿看」，预置
     内容回答「看什么」。合并的后果是两头都坏：选了某个局面，相机会跟着
     跳；想从顶视角看某个局面，view 一栏根本没有这个组合按钮。这里补一个
     独立控件——buildParams / buildToggles / buildViews 之外的第四种——
     专门表示「离散的、有名字的内容」：一组按钮，互斥选中，选中的 key 写进
     导出的 state，并调用调用方给的 onSelect（真正去加载那份内容，如
     Interact.create(FEN) 或切换 E.state 里的棋种索引）。

     声明形状：SCENES[id].presets = [{ key, label, onSelect }, ...]，
     可选 SCENES[id].presetsLabel 覆盖分组标签（省略时用通用的 UI.presets——
     「预置/Preset」——见上面的声明）。没有声明 presets 的场景，#presetsHost
     里对应那一行不会出现，与 toggles/views 的既有习惯一致。 */
  function buildPresets() {
    const host = document.getElementById('presetsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const list = SCENES[id].presets;
      if (!list || !list.length) return;
      const row = document.createElement('div');
      row.className = 'presets';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'plabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(SCENES[id].presetsLabel || UI.presets); };
      RELABEL.push(labRelabel);
      labRelabel();
      list.forEach(pr => {
        const b = document.createElement('button');
        b.className = 'btn pbtn';
        b.dataset.preset = pr.key;
        b.addEventListener('click', () => applyPreset(id, pr.key));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(pr.label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
      /* 建面板时就选中第一项——与 buildParams() 对滑杆默认值的处理同一条
         精神：面板刚搭好、用户还没机会点任何按钮之前，就该有一份确定的
         初始内容，而不是留白等第一次点击。传显式 id，不依赖 curTab——
         这时候 switchTab() 还没跑过，curTab 仍是 null，且这里本就是在给
         *每一个* tab（不只是即将成为首个可见 tab 的那个）建立初始状态。 */
      applyPreset(id, list[0].key);
    });
  }

  function buildTabs() {
    const nav = document.getElementById('tabsNav');
    if (!nav) return;
    Object.keys(SCENES).forEach(id => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.tab = id;
      b.addEventListener('click', () => switchTab(id));
      nav.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].label); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* ================= 视角与页签 ================= */
  /* 选择器必须限定在 .views 之内：.vbtn 只是个样式类，工具可能为了复用外观
     把它挂到别处的按钮上。不限定的话 closest('.views') 会返回 null，这里
     当场抛错，视角高亮从此再不更新。 */
  function refreshViewButtons() {
    document.querySelectorAll('.views .vbtn').forEach(b => {
      const row = b.closest('.views');
      b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
    });
  }
  function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
  function applyView(name) {
    const sc = SCENES[curTab];
    const vw = sc && sc.views && sc.views[name];
    if (!vw) return;
    if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
    tween = {
      from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
      to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
      t0: performance.now(),
      dur: REDUCED ? 1 : 750
    };
    lastView[curTab] = name;
    refreshViewButtons();
  }

  /* 选择器同样必须限定在 .presets 之内，理由与 refreshViewButtons() 一致。 */
  function refreshPresetButtons() {
    document.querySelectorAll('.presets .pbtn').forEach(b => {
      const row = b.closest('.presets');
      b.classList.toggle('active', b.dataset.preset === lastPreset[row.dataset.tab]);
    });
  }
  /* 显式接受 tabId，不像 applyView() 那样隐式用 curTab——预置内容的
     初始化（buildPresets() 建面板时、以及工具可能想在页面加载时就把
     几个不可见 tab 都摆到各自的默认局面）必须能在切到那个 tab 之前
     就把它的内容选好，等真正切过去时画面已经是对的，不需要「先切 tab
     再选内容」这道额外的手续。 */
  function applyPreset(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    const pr = list && list.find(p => p.key === key);
    if (!pr) return;
    if (pr.onSelect) pr.onSelect();
    lastPreset[tabId] = key;
    /* 若还有别的 tab 声明的 presets 是同一个数组引用（同一个对象，不是内容碰巧
       相等）——这就是「跨 tab 共享的同一份选择」（例如 chess-moves-geometry.html
       的六种棋子：piece/field/mobility 三个 tab 都读写同一份 E.state.pieceIdx，
       presets 声明也故意用的是同一个数组常量）。这些 tab 的按钮高亮要跟着同步，
       否则切到另一个 tab 会看见按钮组还停在初始项，尽管实际选择早已跟着共享
       状态变了。onSelect 不重复调用——它已经在上面跑过一次，副作用只与
       「选了哪个 key」有关，与是哪个 tab 触发的无关，重复调用不会更对，
       只会更容易踩到调用方自己没预料到的重入。 */
    Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key;
    });
    if (tabId === curTab) state.preset = key;
    refreshPresetButtons();
  }

  /* 只同步高亮，不调用 onSelect：给调用方已经自己完成了加载（例如工具③
     的 PGN 拖入 / FEN 粘贴 / 棋局浏览器直接选中某个 id）、只需要让预置
     按钮组的选中态跟上真实状态的场景。key 传 null/undefined 表示「清空
     高亮」——没有哪个按钮的 dataset.preset 会等于 undefined，所以这就是
     『不让按钮组停在一个已经不成立的选中态』的实现方式。跨 tab 共享同一份
     presets 数组引用时的同步逻辑与 applyPreset() 保持一致（否则切换 tab
     会看见按钮组用另一条路径的陈旧值重新亮起）。 */
  function syncPresetHighlight(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    lastPreset[tabId] = key || undefined;
    if (list) Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key || undefined;
    });
    if (tabId === curTab) state.preset = key || undefined;
    refreshPresetButtons();
  }

  let brandDescEl = null, tipsEl = null, roEl = null;

  function switchTab(id) {
    if (id === curTab) return;
    curTab = id;
    tween = null;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.toggles[data-tab], .views[data-tab], .presets[data-tab]').forEach(el => {
      el.style.display = el.dataset.tab === id ? '' : 'none';
    });
    if (cams[id]) Object.assign(cam, cams[id]);   // 原地改写，VizEngine.cam 引用不变
    const sc = SCENES[id];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    syncParamVisibility();
    refreshViewButtons();
    /* 换 tab 时把导出的 state.preset 同步成这个 tab 自己记住的那一个——
       lastPreset[id] 在 buildPresets() 建面板时已经对每个声明了 presets
       的 tab 都填过一次（选中第一项），没声明 presets 的 tab 这里是
       undefined，state.preset 也就诚实地变成 undefined，不留一份别的
       tab 的陈旧数据。 */
    state.preset = lastPreset[id];
    refreshPresetButtons();
    updateReadout();
  }

  /* ================= 播放 / 重置 / 折叠 ================= */
  let btnPlay = null, btnFold = null, panelEl = null;
  function togglePlay() {
    state.running = !state.running;
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  }

  /* ================= 语言切换 ================= */
  function applyLang() {
    if (typeof document === 'undefined') return;
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = t(TOOL.title);
    const h1 = document.querySelector('.brand h1');
    if (h1) h1.textContent = t(TOOL.h1);
    const panelTitleEl = document.getElementById('panelTitle');
    if (panelTitleEl) panelTitleEl.textContent = t(UI.panelTitle);
    const hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.textContent = t(UI.hint);
    const btnLangEl = document.getElementById('btnLang');
    if (btnLangEl) btnLangEl.textContent = LANG === 'zh' ? 'EN' : '中';
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
    const btnResetEl = document.getElementById('btnReset');
    if (btnResetEl) btnResetEl.textContent = t(UI.reset);
    RELABEL.forEach(f => f());
    const sc = SCENES[curTab];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    updateReadout();
  }
  function setLang(l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    try {
      const u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    } catch (e) {}
    applyLang();
  }

  /* ================= 交互：旋转 / 平移 / 缩放 ================= */
  function pan(dx, dy) {
    const C = makeCam();
    const s = cam.dist / FOCAL;
    cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
    cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
    cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
  }

  /* 绑定拖拽旋转 / 右键或 Shift 拖拽平移 / 滚轮或双指缩放 / 双击回正到给定 canvas。
     只在浏览器里调用才会碰 DOM 事件，模块顶层不会自动执行这段。
     双击回正：若当前页签在 SCENES 里声明了 views，就补间回它的第一个视角
     （规范里「首视角即双击回正的家」）；没有 SCENES 的最小用法里则安静地不做事。 */
  function bindOrbit(canvasEl) {
    const pointers = new Map();
    let pinch = null;

    canvasEl.addEventListener('pointerdown', e => {
      canvasEl.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
      tween = null;
      lastView[curTab] = null;
      refreshViewButtons();
      if (pointers.size === 2) {
        const vs = Array.from(pointers.values());
        pinch = {
          gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
          cx: (vs[0].x + vs[1].x) / 2,
          cy: (vs[0].y + vs[1].y) / 2
        };
      }
      canvasEl.classList.add('dragging');
    });

    canvasEl.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointers.size === 1) {
        const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
        if (panMode) {
          pan(dx, dy);
        } else {
          cam.az -= dx * 0.0055;
          cam.el = clamp(cam.el + dy * 0.0055, EL_MIN, EL_MAX);   // 与 makeCam() 共用同一对边界，见那里的注释
        }
      } else if (pointers.size === 2 && pinch) {
        const vs = Array.from(pointers.values());
        const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
        const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
        if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
        pan(cx - pinch.cx, cy - pinch.cy);
        pinch = { gap: gap, cx: cx, cy: cy };
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvasEl.classList.remove('dragging');
    }
    canvasEl.addEventListener('pointerup', endPointer);
    canvasEl.addEventListener('pointercancel', endPointer);
    canvasEl.addEventListener('contextmenu', e => e.preventDefault());

    canvasEl.addEventListener('wheel', e => {
      e.preventDefault();
      tween = null;
      cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
    }, { passive: false });

    canvasEl.addEventListener('dblclick', () => {
      const sc = SCENES[curTab];
      const names = sc && sc.views && Object.keys(sc.views);
      if (names && names.length) applyView(names[0]);
    });
  }

  /* 全局键盘快捷键：T 切换页签、1–9 选视角。这两组快捷键都只驱动引擎本体
     已经实现、且已经接在按钮上的函数（switchTab / applyView），不需要
     消费方提供任何东西，所以放在这里而不是要求每个工具各自重新接一遍。
     绑在 window 上，不是 canvas 上——这是键盘事件，和 bindOrbit() 的
     canvas 指针事件是两回事，混在一起会把两者都说不清楚。

     Space 与 r 不在这里绑定——它们属于工具，不属于引擎。math-viz 的设计
     规格把 Space 定为所有五个棋类工具的播放/暂停/单步这枚统一的传输键
     （阶段 3 的复盘工具还要用它当「下一步」），r 同理是工具自己的重置键；
     若引擎在这里先用 preventDefault() 抢注，工具将来接自己的处理器时
     只会和引擎打架，而不是真正拿到这个键。resetSim()/togglePlay() 本身
     没有删——它们仍然接在面板的按钮上，只是不再从键盘直接触发。 */
  function bindKeyboard() {
    window.addEventListener('keydown', e => {
      const el = document.activeElement;
      const tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

      if (e.key === 't' || e.key === 'T') {
        const keys = Object.keys(SCENES);
        if (keys.length) switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
      } else if (e.key >= '1' && e.key <= '9') {
        const sc = SCENES[curTab];
        const names = sc && sc.views && Object.keys(sc.views);
        if (!names) return;
        const i = +e.key - 1;
        if (i < names.length) applyView(names[i]);   // 越界就什么也不做，不抛也不落到 undefined
      }
    });
  }

  /* ================= 启动 ================= */
  /* VizEngine.init({ canvas, SCENES, PARAMS, TOOL, VERSION }) ——
     只有 canvas 是必需的。其余都是「工具专属声明」，省略时对应机制安静地不生效，
     这样本模块既可以被最小页面（如棋子预览页）直接用来拿相机与绘图原语，
     也能在将来的算法工具里接上完整的滑杆 / 页签机制。
     没有 ENGINE_VERSION 参数——它唯一的读者是阶段 2 Task 1 删掉的那份录制
     存档函数（下载 JSON 存档时把引擎版本写进文档头），删掉那份骨架后引擎
     自己不再需要这个值。工具仍然在 <meta name="engine-version"> 里声明它、
     给人读（§10 版本规范），只是不用再传进 init()。 */
  function init(opts) {
    opts = opts || {};
    canvas = opts.canvas;
    if (!canvas) throw new Error('VizEngine.init({ canvas }) 需要一个 canvas 元素');
    ctx = canvas.getContext('2d');

    if (opts.SCENES) SCENES = opts.SCENES;
    if (opts.PARAMS) PARAMS = opts.PARAMS;
    if (opts.TOOL) TOOL = opts.TOOL;
    if (opts.VERSION) VERSION = opts.VERSION;

    try {
      REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { REDUCED = false; }
    LANG = resolveLang();   // 惰性求值：只在这里才碰 location / localStorage

    resize();
    window.addEventListener('resize', resize);

    brandDescEl = document.getElementById('brandDesc');
    tipsEl = document.getElementById('tips');
    roEl = document.getElementById('readout');
    btnPlay = document.getElementById('btnPlay');
    panelEl = document.getElementById('panel');
    btnFold = document.getElementById('btnFold');

    if (btnPlay) btnPlay.addEventListener('click', togglePlay);
    const btnResetEl = document.getElementById('btnReset');
    if (btnResetEl) btnResetEl.addEventListener('click', resetSim);
    if (btnFold && panelEl) {
      btnFold.addEventListener('click', () => {
        const c = panelEl.classList.toggle('collapsed');
        btnFold.textContent = c ? '+' : '−';
      });
      if (window.innerWidth < 760) {
        panelEl.classList.add('collapsed');
        btnFold.textContent = '+';
      }
    }
    const btnLangEl = document.getElementById('btnLang');
    if (btnLangEl) btnLangEl.addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
    const verBadge = document.getElementById('verBadge');
    if (verBadge) verBadge.textContent = 'v' + VERSION;

    buildTabs();
    buildParams();
    buildToggles();
    buildViews();
    buildPresets();   // 在 switchTab(firstTab) 之前——它要读 lastPreset[id] 同步 state.preset

    Object.keys(SCENES).forEach(id => {
      const views = SCENES[id].views || {};
      const first = Object.keys(views)[0];
      if (!first) return;
      const v = views[first];
      cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
      lastView[id] = first;
    });
    const firstTab = Object.keys(SCENES)[0];
    if (firstTab) {
      curTab = null;           // 让 switchTab 的 `id === curTab` 短路检查失效，确保首次真正执行
      switchTab(firstTab);
    }

    bindOrbit(canvas);
    bindKeyboard();
    applyLang();
    resetSim();
    /* autoLoop 默认 true——数学可视化工具的动画从一个持续运行的时钟驱动，
       "每个 vsync 都重画" 是它们的常态，引擎自带循环因此默认开启。
       棋类不是这个模型：棋是离散的——重画只该发生在一步棋、一次相机拖拽、
       或一次显式动画之后，从不该有一个"正在跑的时钟"替它决定何时重画。
       task-14 的 32 子帧率探针踩过这个坑：_piece-preview.html 自己起了
       第二条 rAF 循环（drawHarness），engine 的 frame() 同时也在跑——
       两条循环每个 vsync 都各画一次同一块 canvas：engine 先铺一层昂贵的
       径向渐变背景（SCENES 为空，铺完就没别的可画），harness 紧接着用

    /* ① 映射弦画在两个环之间，且**先画**——它们是背景，字母压在上面。
       弦的两端是 p 的槽与 a·p 的槽：a=1 时两端同槽，26 条弦立成笔直的
       辐条，那正是凯撒那一页看到的样子；a 变大，弦开始绕圈，绕出来的
       正是乘法表圆图那族包络。 */
    if (E.state.showChords && E.state.showCipherRing) {
      for (let q = 0; q < CC.N; q++) {
        if (q === p) continue;                    // 焦点那条最后画，压在最上面
        const s0 = slotPt(cx, cy, r - r * 0.13, q);
        const s1 = slotPt(cx, cy, ri + ri * 0.13, targetSlot(a, q));
        E.flowArrow(s0[0], s0[1], s1[0], s1[1],
                    { color: 'rgba(167,139,250,.26)', width: 1, head: false });
      }
    }

    /* ② 外环：明文字母表，静止不动。 */
    E.alphabetWheel(cx, cy, r, {
      color: SLATE, highlight: p, hiColor: CYAN, ticks: true,
      ringColor: LINE, fontSize: E.clamp(r * 0.078, 10, 15)
    });

    /* ③ 内环：密文字母表，整体转 −b。负号与凯撒页同源：转 −b 之后落在外环
       字母 p 正下方的那一个正好是 p+b，也就是 a=1 时 p 的密文。转 +b 得到的
       是反方向的对应关系（解密），画出来一样好看、意思却是反的。 */
    if (E.state.showCipherRing) {
      E.alphabetWheel(cx, cy, ri, {
        rotation: -b / CC.N * TAU, color: 'rgba(159,176,200,.72)',
        highlight: c,
        /* hiColor 会被拼上 'aa' 去做辉光渐变的颜色停靠点，所以它必须是
           6 位十六进制；写成 rgba(...) 或 3 位缩写会当场抛错。 */
        hiColor: ROSE,
        ringColor: 'rgba(251,113,133,.22)', fontSize: E.clamp(r * 0.072, 9, 14)
      });
    }

    /* ④ 焦点那条弦：带箭头，指明方向是 p → c 而不是反过来。 */
    if (E.state.showChords && E.state.showCipherRing) {
      const s0 = slotPt(cx, cy, r - r * 0.13, p);
      const s1 = slotPt(cx, cy, ri + ri * 0.16, targetSlot(a, p));
      E.flowArrow(s0[0], s0[1], s1[0], s1[1],
                  { color: VIOLET, width: 1.8, headLen: 8 });
    }

    /* ⑤ 公式牌。a 与 b 都是活的数字，读起来就是这一帧真正在算的那个式子。 */
    const fw = Math.min(232, ri * 1.9);
    E.chip(cx - fw / 2, cy - 17, fw, 34,
           'c ≡ ' + a + '·p + ' + b + '  (mod 26)',
           { fill: CARD, stroke: LINE, color: BRIGHT,
             fontSize: E.clamp(fw * 0.072, 10, 14) });

    /* ⑥ a=1 这一格要被点名。这一页的全部主张就是"仿射 ⊃ 凯撒"，
       而那句话只有在使用者真的把 a 拨到 1、看到辐条立直的那一刻才成立。 */
    const legY = cy - r - 34;
    if (legY > 92) {
      if (a === 1) {
        E.chip(cx - 130, legY, 260, 24,
               E.t({ en: 'a = 1  →  this is Caesar, with k = b',
                     zh: 'a = 1  →  这就是凯撒，k 就是 b' }),
               { mono: true, color: EMERALD, fill: 'rgba(52,211,153,.10)',
                 stroke: 'rgba(52,211,153,.42)', fontSize: 11.5 });
      } else if (!AF.isValidA(a)) {
        E.chip(cx - 138, legY, 276, 24,
               E.t({ en: 'gcd(a, 26) = ' + CC.gcd(a, CC.N) + '  →  not a bijection',
                     zh: 'gcd(a, 26) = ' + CC.gcd(a, CC.N) + '  →  这不是双射' }),
               { mono: true, color: UNPAIRED, fill: 'rgba(255,47,208,.08)',
                 stroke: 'rgba(255,47,208,.42)', fontSize: 11.5 });
      } else {
        E.chip(cx - 118, legY, 112, 24, E.t({ en: 'plain ring', zh: '明文环' }),
               { mono: true, color: CYAN, fill: 'rgba(45,212,234,.08)',
                 stroke: 'rgba(45,212,234,.35)', fontSize: 11.5 });
        if (E.state.showCipherRing) {
          E.chip(cx + 6, legY, 112, 24, E.t({ en: 'cipher ring', zh: '密文环' }),
                 { mono: true, color: ROSE, fill: 'rgba(251,113,133,.08)',
                   stroke: 'rgba(251,113,133,.35)', fontSize: 11.5 });
        }
      }
    }

    /* ⑦ 报文条：明文字母压着密文字母。用裸映射画而不是 encrypt——不可逆的 a
       上这一条照样要出现，它是"塌陷"最直观的预告：几个不同的上格会指到同一
       个下格。 */
    if (E.state.showStrip) {
      const idx = CC.letters(PLAIN);
      const n = Math.min(idx.length, 26);
      const gap = 3;
      const cell = E.clamp((availW - 120 - gap * (n - 1)) / Math.max(n, 1), 12, 26);
      const sy = cy + r + 32;
      if (n && sy + cell * 2 + 24 < vi.H - 84) {
        const total = n * cell + (n - 1) * gap;
        const sx = cx - total / 2;
        for (let i = 0; i < n; i++) {
          const x = sx + i * (cell + gap);
          E.chip(x, sy, cell, cell, CC.ALPHABET.charAt(idx[i]),
                 { stroke: 'rgba(45,212,234,.30)', color: CYAN, fontSize: cell * 0.56 });
          E.chip(x, sy + cell + 22, cell, cell, CC.ALPHABET.charAt(map[idx[i]]),
                 { fill: 'rgba(251,113,133,.10)', stroke: 'rgba(251,113,133,.34)',
                   color: ROSE, fontSize: cell * 0.56 });
        }
        E.flowArrow(sx + cell / 2, sy + cell + 4, sx + cell / 2, sy + cell + 18,
                    { color: VIOLET, width: 1.3, headLen: 6 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const a = curA(), b = curB();
    const p = focusP();
    const map = AF.mapping(a, b);
    const c = map[p];
    const out = cipherOf(PLAIN, a, b);
    let s = '<b style="--c:var(--trace-rose)"><i>a</i> = ' + a + '</b>' +
      '<span class="dim">   </span>' +
      '<b style="--c:var(--trace-cyan)"><i>b</i> = ' + b + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: '· 12 × 26 = 312 keys', zh: '· 12 × 26 = 312 把钥匙' }) +
      '</span><br>' +
      '<b style="--c:var(--trace-cyan)"><i>' + CC.ALPHABET.charAt(p) + '</i></b>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)"><i>' + CC.ALPHABET.charAt(c) + '</i></b>' +
      '<span class="dim">   ' + a + '·' + p + ' + ' + b + ' ≡ ' + c + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'plain ', zh: '明文 ' }) + '</span>' +
      esc(clip(PLAIN, 72)) + '<br>';
    if (out.ok) {
      s += '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
        '<b style="--c:var(--trace-rose)">' + esc(clip(out.text, 72)) + '</b>';
    } else {
      /* 措辞是有意的：这串东西**不叫密文**。密文的定义里含着"能被解开"，
         而 gcd(a,26) ≠ 1 时没有任何人能解开它——包括写下它的人。 */
      s += '<span class="dim">' + E.t({ en: 'image (not a cipher) ', zh: '像（不是密文） ' }) +
        '</span><b style="--c:var(--trace-unpaired)">' + esc(clip(out.text, 72)) + '</b>';
    }
    return s;
  }
};

/* ================= 页签二：塌陷 —— 顿悟视角 =================
   gcd(a,26) = g > 1 时，x ↦ a·x + b 是 g 对 1 的：g 个明文字母挤到同一个密文
   字母上，同时有 26 − 26/g 个密文字母**一个原像都没有**。这两句话是同一件事
   的两面，画面因此有两个出口：内环上收束成一束的弦，以及外圈那些够不着、
   被涂成 --trace-unpaired 的字母。

   为什么这是顿悟视角而不只是"一个警告"：教科书通常把 gcd(a,26) = 1 写成
   一条要背的条件。在这一页上它不是条件，是**结果**——你先看到 13 条弦砸在
   同一个字母上，然后才明白解密不是"更难"，而是根本没有这个东西：收到那个
   字母的人无从知道它原来是 A 还是 N。 */
const collapse = {
  label: { en: 'Collapse', zh: '塌陷' },
  brand: { en: 'When a shares a factor with 26 the map folds: several letters land on one, and the rest become unreachable. Decryption is not harder — it does not exist.',
           zh: '当 a 与 26 有公因子，映射会对折：几个字母落到同一个上，其余的从此够不着。解密不是更难，是不存在。' },
  tips: { en: 'Epiphany view. Drag a to 13: thirteen chords slam into one letter and 24 letters go magenta — nothing ever maps to them. Whoever receives that letter cannot know whether it was A or N. That is why gcd(a, 26) = 1 is not bookkeeping.',
          zh: '顿悟视角。把 a 拖到 13：十三条弦砸在同一个字母上，24 个字母变成品红——永远不会有东西映到它们。收到那个字母的人无从知道它原来是 A 还是 N。这就是 gcd(a, 26) = 1 不是记账规矩的原因。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: {
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showFold',   label: { en: 'Folded chords', zh: '收束的弦' }, color: ROSE,     checked: true },
    { key: 'showLost',   label: { en: 'Unreachable',   zh: '够不着的' }, color: UNPAIRED, checked: true },
    { key: 'showCounts', label: { en: 'Preimages',     zh: '原像计数' }, color: EMERALD,  checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const a = curA(), b = curB();
    const S = collapseOf(a, b);
    const p = focusP();
    const cFocus = S.image[p];
    const group = S.preimages[cFocus];          // 与 p 撞在一起的那一伙明文字母

    const wide = vi.W > 900;
    const availW = wide ? vi.W - 330 : vi.W;
    const cx = wide ? availW / 2 + 16 : vi.W / 2;
    /* 与第一页同一套竖直预算（理由见那里的注释）。这一页的上带更宽：
       计数牌是**两行**，而它正是 tips 承诺的"实时碰撞数"——它被挤掉，
       这一页就只剩一张好看的图。有柱状图时环再让出一点地方给 26 根柱子。 */
    const barsOn = E.state.showCounts;
    const TOP_BAND = 132;
    const BOT_BAND = 96;
    const vSpace = Math.max(170, vi.H - TOP_BAND - BOT_BAND);
    const r  = E.clamp(Math.min(availW * 0.26, vSpace * (barsOn ? 0.26 : 0.34)), 70, 168);
    const cy = TOP_BAND + vSpace * (barsOn ? 0.36 : 0.44);
    const ri = r * 0.66;

    /* ① 弦。落在"有伙伴"的像上的弦用玫红加粗——一眼看出哪几条是撞在一起的；
       落在独占像上的弦保持暗紫（与第一页同一个"映射"色）。 */
    if (E.state.showFold) {
      for (let q = 0; q < CC.N; q++) {
        const y = S.image[q];
        const folded = S.preimages[y].length > 1;
        const inGroup = folded && y === cFocus;
        if (inGroup) continue;                  // 焦点那一束最后画
        const s0 = slotPt(cx, cy, r - r * 0.14, q);
        const s1 = slotPt(cx, cy, ri + ri * 0.14, targetSlot(a, q));
        E.flowArrow(s0[0], s0[1], s1[0], s1[1],
                    { color: folded ? 'rgba(251,113,133,.34)' : 'rgba(167,139,250,.22)',
                      width: folded ? 1.3 : 1, head: false });
      }
      /* 焦点那一束：g 条弦，全部收敛到同一点。这一束是整页的主语。 */
      for (let i = 0; i < group.length; i++) {
        const q = group[i];
        const s0 = slotPt(cx, cy, r - r * 0.14, q);
        const s1 = slotPt(cx, cy, ri + ri * 0.16, targetSlot(a, q));
        E.flowArrow(s0[0], s0[1], s1[0], s1[1],
                    { color: ROSE, width: group.length > 1 ? 1.9 : 1.6, headLen: 7 });
      }
    }

    /* ② 外环：明文字母。属于焦点那一束的全部标玫红——"这几个从此不可区分"。 */
    const fsOut = E.clamp(r * 0.082, 9, 14);
    for (let q = 0; q < CC.N; q++) {
      const pt = slotPt(cx, cy, r, q);
      const inGroup = group.indexOf(q) >= 0;
      E.chip(pt[0] - fsOut, pt[1] - fsOut, fsOut * 2, fsOut * 2, CC.ALPHABET.charAt(q),
             { color: inGroup ? ROSE : (q === p ? CYAN : SLATE),
               fontSize: fsOut, weight: inGroup ? 700 : 400 });
    }

    /* ③ 内环：密文字母，整体转 −b，逐个上色。这一圈不能用 alphabetWheel——
       它一次只接受一个 highlight，而这里每个字母的颜色由它自己的原像数决定：
         0 个原像 → --trace-unpaired（这一项没有对手，永远不会出现）
         1 个原像 → 石板灰（正常）
         g 个原像 → 玫红（好几个明文字母挤在这里）
       环线仍然画一圈，好让"内环"这件事在没有 alphabetWheel 时也成立。 */
    const fsIn = E.clamp(r * 0.076, 9, 13);
    for (let j = 0; j < CC.N; j++) {
      const y = letterInSlot(b, j);
      const n = S.preimages[y].length;
      const pt = slotPt(cx, cy, ri, j);
      let col = 'rgba(159,176,200,.72)';
      if (n === 0) col = E.state.showLost ? UNPAIRED : 'rgba(159,176,200,.18)';
      else if (n > 1) col = ROSE;
      if (y === cFocus) {
        E.glowDot(pt, fsIn * 1.9, 'rgba(251,113,133,.55)', 'rgba(251,113,133,.16)');
      }
      E.chip(pt[0] - fsIn, pt[1] - fsIn, fsIn * 2, fsIn * 2, CC.ALPHABET.charAt(y),
             { color: col, fontSize: fsIn, weight: n === 1 ? 400 : 700 });
    }

    /* ④ 活的计数牌。这是 tips 里承诺的"实时碰撞数"，三个数字都从
       collapse() 同一份结果里来，不在画面上各算各的。 */
    const cardY = cy - r - 40;
    if (cardY > 88) {
      const ok = S.invertible;
      const head = ok
        ? E.t({ en: 'gcd(a, 26) = 1  ·  bijection  ·  0 collisions',
                zh: 'gcd(a, 26) = 1  ·  双射  ·  0 次碰撞' })
        : E.t({ en: 'gcd(a, 26) = ' + S.g + '  ·  ' + S.g + ' letters per image  ·  ' +
                    S.lost + ' collisions',
                zh: 'gcd(a, 26) = ' + S.g + '  ·  每个像挤着 ' + S.g + ' 个字母  ·  ' +
                    S.lost + ' 次碰撞' });
      E.chip(cx - 186, cardY, 372, 26, head,
             { mono: true, fontSize: 11.5,
               color: ok ? EMERALD : UNPAIRED,
               fill: ok ? 'rgba(52,211,153,.09)' : 'rgba(255,47,208,.09)',
               stroke: ok ? 'rgba(52,211,153,.42)' : 'rgba(255,47,208,.45)' });
      const sub = ok
        ? E.t({ en: '26 letters → 26 images · every letter has exactly one preimage',
                zh: '26 个字母 → 26 个像 · 每个字母恰好一个原像' })
        : E.t({ en: '26 letters → ' + S.distinct + ' images · ' + S.unreachable.length +
                    ' letters can never appear',
                zh: '26 个字母 → ' + S.distinct + ' 个像 · ' + S.unreachable.length +
                    ' 个字母永远不会出现' });
      if (cardY > 116) {
        E.chip(cx - 186, cardY - 24, 372, 22, sub, { mono: true, color: SLATE, fontSize: 11 });
      }
    }

    /* ⑤ 26 根原像计数柱。max 显式锁死，不用每帧的最大值——a 一动 g 就变，
       不锁的话所有柱子会整体跳一次高度，看起来像数据在抖而不是在变。
       锁在 13 而不是当前 g：13 是这条量程能取到的最大值（a=13 时 g=13，
       a=0 不在滑杆范围内），量程从此在整个 a 区间上是同一把尺子，
       "a=2 的柱子只有 a=13 的六分之一高"这个比较才成立。 */
    if (E.state.showCounts) {
      const bw = Math.min(availW - 96, 520);
      const bx = cx - bw / 2;
      const by = cy + r + 46;
      if (by + 92 < vi.H - 78) {
        const counts = [];
        for (let y = 0; y < CC.N; y++) counts.push(S.preimages[y].length);
        E.barChart(bx, by, bw, 74, counts, {
          max: 13,
          labels: CC.ALPHABET.split(''), labelSize: 9,
          labelColor: 'rgba(159,176,200,.55)',
          colorAt: function (i) {
            return counts[i] === 1 ? 'rgba(45,212,234,.62)' : 'rgba(251,113,133,.85)';
          }
        });
        /* 计数为 0 的字母在柱状图里**画不出来**——柱高 = 0/13 × 74 = 0 像素，
           colorAt 给它什么颜色都无所谓，一个字节都不会落在画布上。实测出来的：
           a=13 那一帧上标题写着"品红 = 没有任何东西映到这里"，而整张图里没有
           一点品红。标题于是在撒谎。
           所以零计数由这里单独画：基线上一枚 3px 的品红短桩。它不是"高度接近
           零的柱子"（那会把 0 与 1 混为一谈），它是另一种记号——正因为
           "这里什么都没有"本身就是这一页要给的信息，它必须有形状。 */
        const bwCell = (bw - 2 * (CC.N - 1)) / CC.N;
        for (let i = 0; i < S.unreachable.length; i++) {
          const y = S.unreachable[i];
          E.chip(bx + y * (bwCell + 2), by + 74 - 3, bwCell, 3, '',
                 { fill: 'rgba(255,47,208,.8)', radius: 1 });
        }
        E.chip(bx, by - 26, bw, 22,
               E.t({ en: 'preimages per cipher letter  ·  magenta stub = nothing maps here',
                     zh: '每个密文字母的原像数  ·  品红短桩 = 没有任何东西映到这里' }),
               { mono: true, color: SLATE, fontSize: 11 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const a = curA(), b = curB();
    const S = collapseOf(a, b);
    const p = focusP();
    const cFocus = S.image[p];
    const group = S.preimages[cFocus];

    let s = '<b style="--c:var(--trace-rose)"><i>a</i> = ' + a + '</b>' +
      '<span class="dim">   </span>' +
      '<b style="--c:var(--trace-cyan)"><i>b</i> = ' + b + '</b>' +
      '<span class="dim">   gcd(<i>a</i>, 26) = ' + S.g + '</span><br>';

    if (S.invertible) {
      return s +
        '<b style="--c:var(--trace-emerald)">' +
        E.t({ en: '26 → 26 · a bijection', zh: '26 → 26 · 是双射' }) + '</b><br>' +
        '<span class="dim">' +
        E.t({ en: 'every cipher letter has exactly one preimage, so decryption is a function',
              zh: '每个密文字母恰好一个原像，所以解密是一个函数' }) +
        '</span><br><span class="dim">' +
        E.t({ en: 'try a = 13 or a = 2', zh: '试试 a = 13 或 a = 2' }) + '</span>';
    }

    /* 把碰撞讲成一个具体的句子而不是一个数字：g 个字母全都变成同一个字母，
       所以收信人无从还原——"无从"比"很难"重要，那是这一页的全部内容。 */
    const names = group.map(function (q) { return CC.ALPHABET.charAt(q); }).join(' = ');
    return s +
      '<b style="--c:var(--trace-unpaired)">' + S.lost +
      E.t({ en: ' collisions · ' + S.unreachable.length + ' letters unreachable',
            zh: ' 次碰撞 · ' + S.unreachable.length + ' 个字母够不着' }) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'all of ', zh: '这一伙 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)"><i>' + esc(clip(names, 46)) + '</i></b>' +
      '<span class="dim"> &#8594; </span>' +
      '<b style="--c:var(--trace-unpaired)"><i>' + CC.ALPHABET.charAt(cFocus) + '</i></b><br>' +
      '<span class="dim">' +
      E.t({ en: 'encrypt() refuses this key — there is no inverse to refuse with',
            zh: 'encrypt() 拒绝这把钥匙 —— 根本没有逆元可用' }) + '</span>';
  }
};

/* ================= 页签三：穷举 312 =================
   凯撒是 26 行，摊成一列文本还读得完；仿射是 312，读不完，也不需要读——
   312 的意义不在于逐行阅读，而在于**它是一个小矩形**。12 行 × 26 列，
   整个密钥空间装在屏幕中央一块巴掌大的地方，这就是这一页要给的印象。 */
const bf = { key: null };

function bruteState() {
  const a = curA(), b = curB();
  const key = a + '|' + b + '|' + PLAIN;
  if (bf.key === key) return bf;
  bf.key = key;

  const out = cipherOf(PLAIN, a, b);
  bf.invertible = out.ok;
  bf.cipher = out.text;
  bf.validAs = AF.validAs();

  if (!out.ok) {
    /* 不可逆的 a 做出来的那串东西没有钥匙能解开，312 个候选一个都不对。
       仍然把矩形画出来（它是这一页的主体），但不给任何高亮——与"输入里
       没有字母"那一路同一条纪律：没有信号就不许有获胜者。 */
    bf.cands = []; bf.scores = []; bf.best = null; bf.bestIdx = -1;
    bf.hasSignal = false; bf.minS = Infinity; bf.secondS = Infinity;
    bf.trueRank = 0;
    return bf;
  }

  bf.cands = AF.bruteForce(bf.cipher);
  bf.scores = bf.cands.map(function (cd) { return CA.chiSquare(cd.text); });
  /* 不用 Cryptanalysis.bruteForceBest：它读的是候选的 `.k` 字段（凯撒的形状），
     而仿射的候选是 { a, b, text }，那个 .k 会是 undefined，返回的"最优"里
     带着一个 undefined 密钥。同一份 χ² 打分逻辑照旧用它的 chiSquare。 */
  let bi = -1, bs = Infinity;
  for (let i = 0; i < bf.scores.length; i++) {
    if (bf.scores[i] < bs) { bs = bf.scores[i]; bi = i; }
  }
  const sorted = bf.scores.slice().sort(function (x, y) { return x - y; });
  bf.bestIdx = bi;
  /* 补一个 score 字段再存：候选本身只有 { a, b, text }，而读数要印那个分数。
     现补而不是让读数自己再算一次 chiSquare——同一个量算两遍就会有两个真相。 */
  bf.best = bi >= 0
    ? { a: bf.cands[bi].a, b: bf.cands[bi].b, text: bf.cands[bi].text, score: bs }
    : null;
  bf.minS = sorted[0];
  bf.secondS = sorted[1];
  /* 真钥匙在这 312 个候选里排第几（1 起数）。名次比"选错了"具体：使用者看到
     "第 8 名"才知道 χ² 差多远，而不是只知道它差。
     并列分数按 indexOf 的口径取**最靠前**的那个名次——两个候选分数一模一样
     的情况在短文本上不是空谈，那时候报靠前的名次对 χ² 更有利，也就不会
     把这一页想说的话夸大。 */
  const trueIdx = bf.cands.findIndex(function (cd) { return cd.a === a && cd.b === b; });
  bf.trueRank = trueIdx >= 0 ? sorted.indexOf(bf.scores[trueIdx]) + 1 : 0;
  /* 输入里一个字母都没有时 312 个 χ² **全是 Infinity**，上面的 `<` 一次都
     不成立，bi 停在 −1。这不是要修的边界，这就是"这次没有信号"的正确形状：
     画面与读数都据此不给高亮。 */
  bf.hasSignal = !!(bf.best && isFinite(bs));
  return bf;
}

const brk = {
  label: { en: 'Brute Force', zh: '穷举' },
  brand: { en: 'Twelve multipliers times twenty-six shifts. The entire key space is a rectangle you can see all of at once — and one cell in it glows.',
           zh: '12 个乘数乘 26 个位移。整个密钥空间是一个一眼看得全的矩形 —— 其中一格自己亮起来。' },
  /* 下面这条 tips 里的两个数字（第 8 名、(11,7)）是**实测**出来的，不是估的。
     复现：对 'ATTACK AT DAWN' 用 (a,b) = (5,8) 加密，对 312 个候选各算一次
     Cryptanalysis.chiSquare 后升序排，看真钥匙落在第几名。
       attack   （12 字母）  获胜 (11,7)，真钥匙第 8 名，领先 ×1.16
       pangram  （95 字母）  获胜 (5,8)， 第 1 名，领先 ×2.69
       quote    （91 字母）  获胜 (5,8)， 第 1 名，领先 ×2.98
     值得写进文案的是与凯撒的**对照**：同样这 12 个字母，凯撒那一页的 26 个
     候选里 χ² 仍然把真密钥排在第一（只是领先从 ×4.27 掉到 ×1.31，见
     examples-classical.js 里 'attack' 的 note）。到了 312 个候选，同一段文本
     连名次都保不住了。也就是说，密钥空间乘以 12 并没有让密码变强——真正被
     乘以 12 的是"碰巧比真钥匙更像英文"的那类假钥匙的数量。 */
  tips: { en: 'Affine has 12× the keys Caesar has, and it buys nothing: 312 still fits in one rectangle. Switch the text to "Too short" — the emerald winner jumps to a wrong cell and the cyan true key falls to 8th of 312. On the same twelve letters Caesar still ranked its key first; the extra keys only thinned the evidence.',
          zh: '仿射的密钥是凯撒的 12 倍，而这什么也没买来：312 仍然装得进一个矩形。把明文换成「太短」——翠绿的获胜格跳到了错的一格，青色的真钥匙掉到 312 里的第 8 名。同样这 12 个字母，凯撒那一页还把真钥匙排在第一；多出来的密钥只是把证据摊薄了。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: {
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showFit',  label: { en: 'χ² fit',    zh: 'χ² 适配' },  color: ROSE,    checked: true },
    { key: 'showFreq', label: { en: 'Frequency', zh: '频率对照' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const a = curA(), b = curB();
    const S = bruteState();
    const AS = S.validAs;                       // 12 个可逆的 a，升序

    const rightPad = vi.W > 900 ? 330 : 16;
    const availW = Math.max(240, vi.W - 40 - rightPad);
    /* 格子是正方形：矩形的形状（12 × 26）本身就是那句"密钥空间"，
       格子被拉扁会让 12 与 26 的比例读不出来。 */
    const cell = E.clamp(Math.min(availW / CC.N, (vi.H - 300) / AS.length), 11, 22);
    const gw = cell * CC.N, gh = cell * AS.length;
    const gx = 24 + Math.max(0, (availW - gw) / 2);
    /* 上界要先跟下限取 max 再交给 clamp：矮窗口上 vi.H − gh − 190 会小于下限，
       而 clamp(x, a, b) 的实现是 min(b, max(a, x))——上界比下界还小的时候
       它返回的是**上界**，矩形会被推到画面外去，而且不报任何错。

       下限 140 是量出来的，不是拍的：标题块（.brand）是 position:fixed 的两行
       散文，在 1280 宽下右缘到 42vw ≈ 537px、底缘到 y ≈ 115，而矩形上方 30px
       处那行说明是**居中**的，左端落在 x ≈ 213——两者在 x 与 y 上都相交，
       截图里就是一行字压在另一行字上。140 让说明落到 y ≈ 110 以下，从标题块
       底下让出来。 */
    const GY_MIN = 140;
    const gy = E.clamp(vi.H * 0.30 - gh / 2, GY_MIN, Math.max(GY_MIN, vi.H - gh - 190));

    E.chip(gx, gy - 30, gw, 22,
           E.t({ en: '12 multipliers × 26 shifts = 312 keys — all of them, at once',
                 zh: '12 个乘数 × 26 个位移 = 312 把钥匙 —— 一个不少，一次全在这里' }),
           { mono: true, color: SLATE, fontSize: 11.5 });

    /* ① 矩形本身。每格的颜色是 χ² 适配度 最小χ²/本格χ²：无量纲，最优格恒为 1。
       文本一律不画——312 段候选明文挤在这里只会变成噪声，而这一页要给的
       印象恰恰是"多到不必读，却少到一眼看完"。 */
    E.cellGrid(gx, gy, CC.N, AS.length, cell, {
      stroke: 'rgba(148,163,184,.13)',
      fill: function (col, row) {
        if (!S.hasSignal) return 'rgba(148,163,184,.05)';
        const idx = row * CC.N + col;
        const fit = isFinite(S.scores[idx]) ? S.minS / S.scores[idx] : 0;
        if (idx === S.bestIdx) return 'rgba(52,211,153,.85)';
        if (!E.state.showFit) return 'rgba(148,163,184,.05)';
        /* 三次方把对比度压向高分端：312 格里绝大多数是同一档垃圾，
           线性映射会让整块矩形糊成一片中灰，真正有意义的那几格淹在里面。 */
        return 'rgba(251,113,133,' + (0.06 + 0.72 * fit * fit * fit).toFixed(3) + ')';
      }
    });

    /* ② 轴标。左边是 12 个可逆的 a（它们不连续：1,3,5,7,9,11,15,…，
       中间缺的正是与 26 有公因子的那些），上边是 b，每 5 格标一次。 */
    for (let row = 0; row < AS.length; row++) {
      E.chip(gx - 30, gy + row * cell, 26, cell, String(AS[row]),
             { color: AS[row] === a ? CYAN : DIM, fontSize: Math.min(11, cell * 0.62) });
    }
    for (let col = 0; col < CC.N; col += 5) {
      E.chip(gx + col * cell, gy - 15, cell, 13, String(col),
             { color: DIM, fontSize: Math.min(10, cell * 0.56) });
    }
    E.chip(gx - 34, gy - 15, 30, 13, 'a', { color: SLATE, fontSize: 10.5 });
    /* b 那个轴名只在右边真的还有地方时才画——不加这个判断，窄窗口上它会被
       推到面板底下，变成一个看不见却仍在画的字。 */
    if (gx + gw + 34 < vi.W - rightPad) {
      E.chip(gx + gw + 4, gy - 15, 30, 13, 'b', { color: SLATE, fontSize: 10.5 });
    }

    /* ③ 真钥匙那一格描青边。它与翠绿的获胜格重合时说明 χ² 猜对了；
       文本一短，两格就分开——那一下比任何文字都说得清"排名不是证据"。 */
    const trueRow = AS.indexOf(a);
    if (trueRow >= 0) {
      E.chip(gx + b * cell, gy + trueRow * cell, cell, cell, '',
             { stroke: 'rgba(45,212,234,.95)', width: 1.6, radius: 2 });
    }
    if (S.hasSignal) {
      const br = Math.floor(S.bestIdx / CC.N), bc = S.bestIdx % CC.N;
      const bxp = gx + bc * cell + cell / 2, byp = gy + br * cell + cell / 2;
      E.glowDot([bxp, byp], cell * 1.7, 'rgba(52,211,153,.55)', 'rgba(52,211,153,.14)');
      E.chip(gx + bc * cell - 1, gy + br * cell - 1, cell + 2, cell + 2, '',
             { stroke: 'rgba(52,211,153,.95)', width: 1.8, radius: 3 });
    }

    /* ④ 结论条。三种状态各有各的话，绝不共用一句含糊的措辞。

       矩形以下这一列的纵向分带是**显式写出来**的，不是每处各加一个偏移量：
         infoY      +0  … +22   获胜密钥那一行
         infoY     +22  … +46   获胜的明文
         infoY     +52  … +72   频率图的标题
         infoY     +76  … +142  26 根柱子（含底下的字母标签）
       各处自己加偏移的写法在这一页上连出过两次事故：先是"12 个乘数…"那行
       压在标题块上，改完之后频率图标题又压在获胜明文上——两次都是同一个
       原因，没有人在一个地方看着这一列的总账。把边界摆成一张表，谁压谁一眼
       可查。 */
    const infoY = gy + gh + 26;
    const BAND_TEXT = 22, BAND_CAP = 52, BAND_BARS = 76, BARS_H = 66;
    if (!S.invertible) {
      E.chip(gx - 30, infoY, gw + 60, 26,
             E.t({ en: 'a = ' + a + ' is not invertible — no key in the 312 can undo it',
                   zh: 'a = ' + a + ' 不可逆 —— 312 把钥匙里没有一把能还原它' }),
             { mono: true, color: UNPAIRED, fontSize: 11.5,
               fill: 'rgba(255,47,208,.08)', stroke: 'rgba(255,47,208,.42)' });
    } else if (!S.hasSignal) {
      E.chip(gx - 30, infoY, gw + 60, 26,
             E.t({ en: 'no letters — all 312 cells tie at χ² = ∞, so nothing is highlighted',
                   zh: '没有字母 —— 312 格的 χ² 全是 ∞，所以这里不给任何高亮' }),
             { mono: true, color: ORANGE, fontSize: 11.5,
               fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.38)' });
    } else {
      const fs = Math.min(13, cell * 0.9);
      const maxChars = Math.max(10, Math.floor((gw + 60) / (fs * 0.5)));
      E.chip(gx - 30, infoY, gw + 60, BAND_TEXT,
             E.t({ en: 'winner  a = ', zh: '获胜  a = ' }) + S.best.a + ', b = ' + S.best.b,
             { mono: true, color: EMERALD, fontSize: 11.5 });
      E.chip(gx - 30, infoY + BAND_TEXT, gw + 60, 24, clip(S.best.text, maxChars),
             { color: 'rgba(52,211,153,.88)', fontSize: fs });
    }

    /* ⑤ 打分的依据本身：获胜格的字母分布 vs 英文期望分布。
       量程写死 0.16 而不是每帧的最大值——不锁的话观测频率一变，26 根柱子
       会整体跳一次高度，看起来像是数据在抖。 */
    if (E.state.showFreq && S.hasSignal) {
      const fw = Math.min(gw + 60, availW);
      const fy = infoY + BAND_BARS;
      /* 门槛把字母标签（柱底下再 12px）与底部传输条都算进去了：这张图宁可
         整块不画，也不要压在传输条上——它是"χ² 凭什么这么判"的唯一证据，
         一张被盖住一半的证据比没有证据更糟。 */
      if (fy + BARS_H + 12 < vi.H - 60) {
        E.barChart(gx - 30, fy, fw, BARS_H, CA.ENGLISH_FREQ,
                   { max: 0.16, color: 'rgba(159,176,200,.30)' });
        E.barChart(gx - 30, fy, fw, BARS_H, CA.letterFrequency(S.best.text),
                   { max: 0.16, color: 'rgba(52,211,153,.80)',
                     labels: CC.ALPHABET.split(''), labelSize: 9,
                     labelColor: 'rgba(159,176,200,.55)' });
        E.chip(gx - 30, infoY + BAND_CAP, fw, 20,
               E.t({ en: 'winning key vs English  ·  grey = expected',
                     zh: '获胜密钥 vs 英文频率  ·  灰色 = 期望' }),
               { mono: true, color: EMERALD, fontSize: 11 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const a = curA(), b = curB();
    const S = bruteState();
    let s = E.t({ en: 'cipher = encrypt(plain, ', zh: '密文 = 加密(明文, ' }) +
      '<b style="--c:var(--trace-rose)"><i>a</i> = ' + a + '</b>, ' +
      '<b style="--c:var(--trace-cyan)"><i>b</i> = ' + b + '</b>)<br>';

    if (!S.invertible) {
      return s + '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'a = ' + a + ' has no inverse — nothing to break, and nothing to read',
              zh: 'a = ' + a + ' 没有逆元 —— 无从破解，也无从阅读' }) + '</b>';
    }
    if (!S.hasSignal) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — χ² = ∞ for all 312, no winner',
              zh: '没有字母 —— 312 格 χ² 全是 ∞，不产生获胜者' }) + '</b>';
    }
    const n = CC.letters(PLAIN).length;
    const right = (S.best.a === a && S.best.b === b);
    s += E.t({ en: 'best of 312  ', zh: '312 里最优  ' }) +
      '<b style="--c:var(--trace-emerald)"><i>a</i> = ' + S.best.a +
      ', <i>b</i> = ' + S.best.b + '</b>' +
      '<span class="dim">   χ² = ' + E.fmt(S.best.score) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'lead over runner-up ', zh: '对第二名的领先 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">×' + E.fmt(S.secondS / S.minS) + '</b>' +
      '<span class="dim">   ' + n + E.t({ en: ' letters', zh: ' 个字母' }) + '</span><br>' +
      (right
        ? '<span class="dim">' +
          E.t({ en: 'χ² recovered the true key', zh: 'χ² 找回了真钥匙' }) + '</span>'
        /* 选错的时候要用**警示色**说出来，不能跟"找回了"共用一个灰。这一行是
           这一页最重要的一句话：312 把钥匙没让密码变强，只让错的那些更容易
           冒充对的。真钥匙的名次一起印出来——"第 8 名"比"选错了"具体得多。 */
        : '<b style="--c:var(--trace-orange)">' +
          E.t({ en: 'χ² picked the wrong key', zh: 'χ² 选错了钥匙' }) + '</b>' +
          '<span class="dim">   ' +
          E.t({ en: 'true key ranks #' + S.trueRank + ' of 312',
                zh: '真钥匙排在 312 里的第 ' + S.trueRank + ' 名' }) + '</span>') +
      '<br><span class="dim">' + esc(clip(S.best.text, 72)) + '</span>';
    return s;
  }
};

var SCENES = { dials: dials, collapse: collapse, break: brk };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个预置并调它的 onSelect，而那个回调要往 textarea 里写字。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* init() 之后滑杆才存在。b 那一根要接成时间轴的一个视图：滑杆 → seek，
   时间轴 → 回写滑杆（syncB）。
   取的是**第二根**滑杆：PARAMS 的声明顺序是 [a, b]，而 querySelectorAll
   按文档顺序返回，两者同源。不按 key 找是因为引擎没有把 paramWraps 导出来；
   真要改成按 key 找，得先改引擎——那是另一件事，不该顺手夹带在一个工具页里。 */
const ranges = document.querySelectorAll('#paramsHost input[type=range]');
bInput = ranges[1] || null;
if (bInput) {
  bValEl = bInput.parentNode.querySelector('.val');
  bInput.addEventListener('input', function () {
    TL.seek(parseInt(bInput.value, 10) || 0);
  });
  /* 让时间轴接受滑杆声明的默认值（b=8），而不是反过来把 b 打回 0。 */
  TL.seek(parseInt(bInput.value, 10) || 0);
}
</script>
</body>
