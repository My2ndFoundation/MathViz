<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 占位符，从本骨架复制出新工具时**必须**改掉的四处：
     ① <title>；② 下面 tool-version 的 content（新工具从 1.0.0 起）；
     ③ 下面这段版本记录；④ 第二个脚本块里 TOOL 的 id / title / h1。
     （文件里除了两处真正的脚本标签，任何地方——包括注释——都不要再写出
     `&lt;script&gt;` 这个字符串：语法门与 CI 都靠 `<` + `script` + `>` 这个
     字面量切分脚本块，注释里多出来的一个会让切分从这里开始，把整段 HTML
     当成 JS 去检查，报一个跟真实代码毫无关系的错。）

     tool-engine 反映的是 core/ 那几个模块的版本，不是工具自己的版本，
     一般不必跟着改。版本号要在三处同步：注册表 cryptography-tools.json 的
     version、这里的 tool-version meta、面板右上角的徽章——徽章直接读 meta
     （见第二个脚本块里的 VERSION），所以它永远不需要单独改。 -->
<meta name="tool-version" content="1.0.1">
<meta name="tool-engine" content="crypto-1.2.0">
<title>Solitaire · 纸牌密码</title>
<!-- 版本记录（changelog，新→旧）：
     1.0.0  2026-08-10  首发：Schneier 的手牌流密码。三页——「一副牌」把一轮
                        拆成四步逐帧演示（A 王下移 1、B 王下移 2、三重切牌、
                        计数切牌）；「密钥流」是顿悟视角，两副只差一张牌的牌
                        并排跑，外加一条 53 个位置的实测普查带，把"抽一张放到
                        底会雪崩、与邻牌对调常常什么也不改"这个反差画出来；
                        「发报」演示加解密，并当场证明解密需要一模一样的起始牌。
                        算法模块 core/algos/solitaire.js 对公开测试向量
                        （未加密的新牌 + AAAAAAAAAA → EXKYIZSGEH）有断言。 -->
<style>
/* 视觉令牌。CryptoViz 与根项目、chess 子项目共用同一套值——它们是同一门
   视觉语言的三个方言，不是三套配色。Canvas 里用到同一个颜色时写**同样的
   字面量**（见第二个脚本块顶部的 CYAN / ROSE / …），这样"一条线一种颜色、
   在多处复用"这条原则在 CSS 与 Canvas 两侧是同一个事实，而不是两份要靠人
   记住去同步的抄写。 */
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  /* 未配对 / 异常态专用色。只在"这一项没有对手、没有解、不该存在"时用，
     不参与 accent 轮换——它刺眼是故意的。 */
  --trace-unpaired:#ff2fd0;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}

/* canvas 是主角：全屏置底，其余一切 UI 以 position:fixed 浮在它之上。
   任何"左边画布右边面板"的分栏都是违规的——画面一旦被切开，字母轮就不再
   是这一页的主体，而变成了一张配图。 */
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 传输条（动画时钟的控件）----
   ⏮ 上一步 · ⏵/⏸ 播放暂停 · ⏭ 下一步 · ⟲ 回到第 0 步。
   密码学工具几乎都是"一轮一轮"的（每次按键、每一轮、每个 block），所以时间
   控件是这一类工具的标配而不是可选件，放在浮层里而不是折进面板：使用者在看
   canvas，手要落在看得见的地方。#btnPlay 与 #btnReset 的文案由引擎写
   （UI.pause / UI.resume / UI.reset，随语言切换），这里的字形只是无 JS 时的
   兜底；⏮ / ⏭ 是本页自己接的，见第二个脚本块。 */
.transport{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:5px;padding:5px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tbtn{min-width:34px;padding:6px 12px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:#c6d2e4;font-size:13px;font-family:var(--font-cn);
  line-height:1.2;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tbtn:hover{color:#e8f2fb;border-color:rgba(45,212,234,.45)}
.tbtn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tbtn.primary{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.5);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:14px;line-height:1;cursor:pointer}
.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:6px 14px 14px}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
/* 数学符号一律 serif italic（设计规范五条原则第 4 条），Canvas 侧对应
   VizEngine.mathFont()。字母轮上的字母、模运算里的数字都算数学符号。 */
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views,.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel,.presets .plabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn,.pbtn{padding:5px 9px;font-size:11.5px}

/* 文本输入槽（#ioHost）。古典密码工具的明文/密钥来自输入框而不是滑杆——
   一个 26 档的滑杆表达不了 "ATTACK AT DAWN"。不需要的工具把 #ioHost 留空。 */
.iorow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px}
.iorow .btn{padding:5px 9px;font-size:11.5px}
.iolabel{font-size:11.5px;color:rgba(159,176,200,.8);margin:10px 0 4px}
.iofield{width:100%;min-height:52px;resize:vertical;padding:7px 9px;border-radius:9px;
  border:1px solid var(--panel-line);background:rgba(8,13,24,.7);color:var(--ui-bright);
  font-family:var(--font-mono);font-size:12px;line-height:1.6}
.iofield:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:1px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
/* 读数里的粗体值用行内 style="--c:var(--trace-xxx)" 指定颜色，与 .tg .dot
   用的是同一个自定义属性——同一条量在图例点与读数值上必须是同一种颜色。 */
.readout b{font-weight:600;color:var(--c, inherit)}
.readout i{font-family:var(--font-math);font-style:italic}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  /* 页签必须让开标题。窄屏上 .brand 从 top:12px 起，eyebrow（10px 字 + 6px
     下边距）之后是 20px 的 h1，整块底边落在约 60px——而这里原来写的是 52px，
     于是标题与页签重叠 8px。它是**继承性**的：这段 CSS 在骨架里，13 个工具
     各存一份逐字节相同的副本，所以一处写错就是十四处一起错，而且只在 ≤760px
     出现，桌面上永远看不见（本项目为此在窄屏上连栽五次）。
     66px 给 60px 的底边留 6px 余量；传输条跟着同幅下移。 */
  .tabs{top:66px;left:14px;transform:none}
  /* 传输条挪到页签下方：手机上面板是贴底的抽屉，底部中央那个位置会被它盖住。 */
  .transport{top:110px;left:14px;bottom:auto;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="brand">
  <div class="eyebrow">CRYPTOVIZ · 密码学可视化</div>
  <h1></h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span id="panelTitle">Parameters &amp; Views</span>
    <span class="ph-right">
      <span class="ver" id="verBadge"></span>
      <button class="lang" id="btnLang" title="切换语言 / Switch language">中</button>
      <button class="fold" id="btnFold" title="收起 / 展开 · Collapse / expand">−</button>
    </span>
  </div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div id="ioHost"></div>
    <div id="togglesHost"></div>
    <div id="presetsHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="tips" id="tips"></div>
  </div>
</aside>

<div class="transport" id="transport">
  <button class="tbtn" id="btnBack" title="上一步 · Step back" aria-label="Step back">⏮</button>
  <button class="tbtn primary" id="btnPlay" title="播放 / 暂停 · Play / pause">⏵</button>
  <button class="tbtn" id="btnStep" title="下一步 · Step forward" aria-label="Step forward">⏭</button>
  <button class="tbtn" id="btnReset" title="回到起点 · Reset">⟲</button>
</div>

<div class="hint"></div>

<script>
/* ================= 生成区间 =================
   本块的全部内容由 cryptography/scripts/inline_core.py 从 core/ 与 examples/
   注入，**禁止手改**：手改的那一行会在下一次跑脚本时被无声地覆盖掉，而
   check.py 的第一道门会先一步把它判红。要改行为就去改编辑源，然后跑

       python3 cryptography/scripts/inline_core.py

   顺序是依赖顺序，不是字母顺序：CRYPTO-CORE 最先（其余都用它的 mod / letters），
   CRYPTANALYSIS 与 ALGOS 次之，EXAMPLES 再次（examples.js 要读分组文件挂上去
   的 CryptoExamplesParts），VIZ-ENGINE / INTERACT / ANIMATION 最后。
   一个工具用不到的块可以整块删掉（除 CRYPTO-CORE 与 VIZ-ENGINE 外都是可选的，
   见 inline_core.py 的 OPTIONAL_TAGS）——留着空标记也行，脚本会照填。 */
/* >>> GENERATED:CRYPTO-CORE */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CryptoCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const N = 26;

  function isAlpha(ch) {
    if (typeof ch !== 'string' || ch.length !== 1) return false;
    const c = ch.charCodeAt(0);
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122);
  }

  /* 只留 A-Z 并大写。刻意**不**做 Unicode 折叠（é → E）：这是古典密码，
     字母表就是 26 个，把 é 悄悄折进 E 会让"密文长度 = 明文字母数"这条
     使用者肉眼在数的关系对不上。丢弃比折叠诚实。 */
  function normalize(text) {
    return String(text).toUpperCase().replace(/[^A-Z]/g, '');
  }

  function letters(text) {
    const s = normalize(text);
    const out = [];
    for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i) - 65);
    return out;
  }

  function fromIndices(idx) {
    let s = '';
    for (let i = 0; i < idx.length; i++) s += ALPHABET.charAt(mod(idx[i], N));
    return s;
  }

  /* JS 的 % 是取余不是取模：(-1) % 26 === -1。整个古典密码部分都建立在
     "落回 [0,n)" 上，所以这一个函数是地基，不许有人图省事直接写 %。 */
  function mod(a, n) {
    /* 模数必须为正，不只是非零。n < 0 时 ((a%n)+n)%n 会给出**负**结果
       （实测 mod(5,-3) === -1），而这个函数对外承诺的是"结果恒 >= 0"，
       整个古典密码部分都建立在那句承诺上。与其让一个负模数悄悄产出负下标、
       在 fromIndices 里变成 charAt(-1) 那种空字符串，不如在入口就拒绝：
       今天没有调用方传负模数，正因为如此，现在把门关上是免费的。 */
    if (!(n > 0)) throw new Error('mod 的模数必须是正数，收到 ' + n);
    return ((a % n) + n) % n;
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a;
  }

  /* 扩展欧几里得：返回 [g, x, y] 满足 a*x + b*y === g === gcd(a,b)。
     modInverse 靠它，Affine 的解密也靠它。 */
  function egcd(a, b) {
    let old_r = a, r = b;
    let old_s = 1, s = 0;
    let old_t = 0, t = 1;
    while (r !== 0) {
      const q = Math.floor(old_r / r);
      let tmp = old_r - q * r; old_r = r; r = tmp;
      tmp = old_s - q * s; old_s = s; s = tmp;
      tmp = old_t - q * t; old_t = t; t = tmp;
    }
    /* gcd 约定非负；a<0 或 b<0 时上面会得到负的 old_r，连同系数一起翻号，
       贝祖等式仍成立。 */
    if (old_r < 0) return [-old_r, -old_s, -old_t];
    return [old_r, old_s, old_t];
  }

  function modInverse(a, n) {
    const r = egcd(mod(a, n), n);
    if (r[0] !== 1) return null;      // 不互素，逆元不存在
    return mod(r[1], n);
  }

  /* ================= ℤ/nℤ 上的矩阵（Hill 密码） =================
     Hill 把每 k 个字母看成 ℤ/nℤ 上的一个列向量，密钥是 k×k 矩阵：c = M·p (mod n)。
     解密要的不是"除以 M"，而是 M 在**模 n 意义下**的逆，它存在的充要条件是
     gcd(det M, n) = 1 —— 不是实数意义上的 det ≠ 0。这一条差别正是 Hill 那一页

    arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
    label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
    label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    for (const k of (o.yTicks || [])) {
      for (const yv of [k, -k]) {
        line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
    }
    for (const k of (o.xTicks || [])) {
      for (const xv of [k, -k]) {
        line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }

  /* z=0 平面方格网格（几何类场景） */
  function drawGridXY(C, g, step) {
    const n = Math.round(g / step);
    for (let i = -n; i <= n; i++) {
      if (i === 0) continue;
      const u = i * step;
      line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
      line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    }
  }

  /* ================= 主绘制与主循环 ================= */
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    const C = makeCam();
    if (curTab != null && SCENES[curTab] && typeof SCENES[curTab].draw === 'function') {
      SCENES[curTab].draw(C);
    }
  }

  function updateReadout() {
    if (!roEl || curTab == null || !SCENES[curTab] || typeof SCENES[curTab].readout !== 'function') return;
    roEl.innerHTML = SCENES[curTab].readout();
  }

  /* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
     resetSim() 会清空它——用户主动重置后应当允许重新报。 */
  const frameErrSeen = Object.create(null);
  function frameError(err) {
    const k = curTab + '|' + ((err && err.message) || err);
    if (frameErrSeen[k]) return;
    frameErrSeen[k] = 1;
    console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
  }

  function resetSim() {
    Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  }

  let lastTs = 0, lastRO = 0;
  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
      lastTs = ts;

      if (tween) {
        const k = Math.min(1, (ts - tween.t0) / tween.dur);
        const e = ease(k);
        const f = tween.from, o = tween.to;
        cam.az = f.az + wrapPI(o.az - f.az) * e;
        cam.el = f.el + (o.el - f.el) * e;
        cam.dist = f.dist + (o.dist - f.dist) * e;
        cam.tx = f.tx + (o.tx - f.tx) * e;
        cam.ty = f.ty + (o.ty - f.ty) * e;
        cam.tz = f.tz + (o.tz - f.tz) * e;
        if (k >= 1) tween = null;
      }

      state.dt = dt;

      draw();
      if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
    } catch (err) {
      frameError(err);
    } finally {
      requestAnimationFrame(frame);
    }
  }

  /* ================= UI 生成（由消费方通过 init() 提供的 PARAMS / SCENES 声明驱动） ================= */
  const paramWraps = {};   // key -> { wrap, input, val, p }

  function buildParams() {
    const host = document.getElementById('paramsHost');
    if (!host || !PARAMS) return;
    PARAMS.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'ctl';
      wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
      const val = wrap.querySelector('.val');
      const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
      const upd = () => {
        const raw = parseFloat(input.value);
        state[p.key] = p.map ? p.map(raw) : raw;
        render();
      };
      input.addEventListener('input', upd);
      wrap.appendChild(input);
      host.appendChild(wrap);
      paramWraps[p.key] = { wrap, input, val, p };
      upd();                       // 建面板时用默认刻度初始化 state
      const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。 */
  function syncParamVisibility() {
    const list = SCENES[curTab] && SCENES[curTab].params;
    Object.keys(paramWraps).forEach(k => {
      paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
    });
  }

  function buildToggles() {
    const host = document.getElementById('togglesHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const grp = document.createElement('div');
      grp.className = 'toggles';
      grp.dataset.tab = id;
      (SCENES[id].toggles || []).forEach(tg => {
        if (!(tg.key in state)) state[tg.key] = tg.checked;
        const lab = document.createElement('label');
        lab.className = 'tg';
        lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
          '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
        const cb = lab.querySelector('input');
        cb.addEventListener('change', () => {
          state[tg.key] = cb.checked;
          document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
        });
        const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
        RELABEL.push(relabel);
        relabel();
        grp.appendChild(lab);
      });
      host.appendChild(grp);
    });
  }

  function buildViews() {
    const host = document.getElementById('viewsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const row = document.createElement('div');
      row.className = 'views';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'vlabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(UI.views); };
      RELABEL.push(labRelabel);
      labRelabel();
      Object.keys(SCENES[id].views || {}).forEach(name => {
        const b = document.createElement('button');
        b.className = 'btn vbtn';
        b.dataset.view = name;
        b.addEventListener('click', () => applyView(name));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
    });
  }

  /* ================= 预置内容（局面 / 棋种……）================= */
  /* Task 6 的原话是「预置局面（views 的 onSelect 里加载）」——把内容选择塞进
     相机角度控件里。这两件事其实互不相干：相机角度回答「从哪儿看」，预置
     内容回答「看什么」。合并的后果是两头都坏：选了某个局面，相机会跟着
     跳；想从顶视角看某个局面，view 一栏根本没有这个组合按钮。这里补一个
     独立控件——buildParams / buildToggles / buildViews 之外的第四种——
     专门表示「离散的、有名字的内容」：一组按钮，互斥选中，选中的 key 写进
     导出的 state，并调用调用方给的 onSelect（真正去加载那份内容，如
     Interact.create(FEN) 或切换 E.state 里的棋种索引）。

     声明形状：SCENES[id].presets = [{ key, label, onSelect }, ...]，
     可选 SCENES[id].presetsLabel 覆盖分组标签（省略时用通用的 UI.presets——
     「预置/Preset」——见上面的声明）。没有声明 presets 的场景，#presetsHost
     里对应那一行不会出现，与 toggles/views 的既有习惯一致。 */
  function buildPresets() {
    const host = document.getElementById('presetsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const list = SCENES[id].presets;
      if (!list || !list.length) return;
      const row = document.createElement('div');
      row.className = 'presets';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'plabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(SCENES[id].presetsLabel || UI.presets); };
      RELABEL.push(labRelabel);
      labRelabel();
      list.forEach(pr => {
        const b = document.createElement('button');
        b.className = 'btn pbtn';
        b.dataset.preset = pr.key;
        b.addEventListener('click', () => applyPreset(id, pr.key));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(pr.label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
      /* 建面板时就选中第一项——与 buildParams() 对滑杆默认值的处理同一条
         精神：面板刚搭好、用户还没机会点任何按钮之前，就该有一份确定的
         初始内容，而不是留白等第一次点击。传显式 id，不依赖 curTab——
         这时候 switchTab() 还没跑过，curTab 仍是 null，且这里本就是在给
         *每一个* tab（不只是即将成为首个可见 tab 的那个）建立初始状态。 */
      applyPreset(id, list[0].key);
    });
  }

  function buildTabs() {
    const nav = document.getElementById('tabsNav');
    if (!nav) return;
    Object.keys(SCENES).forEach(id => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.tab = id;
      b.addEventListener('click', () => switchTab(id));
      nav.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].label); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* ================= 视角与页签 ================= */
  /* 选择器必须限定在 .views 之内：.vbtn 只是个样式类，工具可能为了复用外观
     把它挂到别处的按钮上。不限定的话 closest('.views') 会返回 null，这里
     当场抛错，视角高亮从此再不更新。 */
  function refreshViewButtons() {
    document.querySelectorAll('.views .vbtn').forEach(b => {
      const row = b.closest('.views');
      b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
    });
  }
  function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
  function applyView(name) {
    const sc = SCENES[curTab];
    const vw = sc && sc.views && sc.views[name];
    if (!vw) return;
    if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
    tween = {
      from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
      to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
      t0: performance.now(),
      dur: REDUCED ? 1 : 750
    };
    lastView[curTab] = name;
    refreshViewButtons();
  }

  /* 选择器同样必须限定在 .presets 之内，理由与 refreshViewButtons() 一致。 */
  function refreshPresetButtons() {
    document.querySelectorAll('.presets .pbtn').forEach(b => {
      const row = b.closest('.presets');
      b.classList.toggle('active', b.dataset.preset === lastPreset[row.dataset.tab]);
    });
  }
  /* 显式接受 tabId，不像 applyView() 那样隐式用 curTab——预置内容的
     初始化（buildPresets() 建面板时、以及工具可能想在页面加载时就把
     几个不可见 tab 都摆到各自的默认局面）必须能在切到那个 tab 之前
     就把它的内容选好，等真正切过去时画面已经是对的，不需要「先切 tab
     再选内容」这道额外的手续。 */
  function applyPreset(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    const pr = list && list.find(p => p.key === key);
    if (!pr) return;
    if (pr.onSelect) pr.onSelect();
    lastPreset[tabId] = key;
    /* 若还有别的 tab 声明的 presets 是同一个数组引用（同一个对象，不是内容碰巧
       相等）——这就是「跨 tab 共享的同一份选择」（例如 chess-moves-geometry.html
       的六种棋子：piece/field/mobility 三个 tab 都读写同一份 E.state.pieceIdx，
       presets 声明也故意用的是同一个数组常量）。这些 tab 的按钮高亮要跟着同步，
       否则切到另一个 tab 会看见按钮组还停在初始项，尽管实际选择早已跟着共享
       状态变了。onSelect 不重复调用——它已经在上面跑过一次，副作用只与
       「选了哪个 key」有关，与是哪个 tab 触发的无关，重复调用不会更对，
       只会更容易踩到调用方自己没预料到的重入。 */
    Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key;
    });
    if (tabId === curTab) state.preset = key;
    refreshPresetButtons();
  }

  /* 只同步高亮，不调用 onSelect：给调用方已经自己完成了加载（例如工具③
     的 PGN 拖入 / FEN 粘贴 / 棋局浏览器直接选中某个 id）、只需要让预置
     按钮组的选中态跟上真实状态的场景。key 传 null/undefined 表示「清空
     高亮」——没有哪个按钮的 dataset.preset 会等于 undefined，所以这就是
     『不让按钮组停在一个已经不成立的选中态』的实现方式。跨 tab 共享同一份
     presets 数组引用时的同步逻辑与 applyPreset() 保持一致（否则切换 tab
     会看见按钮组用另一条路径的陈旧值重新亮起）。 */
  function syncPresetHighlight(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    lastPreset[tabId] = key || undefined;
    if (list) Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key || undefined;
    });
    if (tabId === curTab) state.preset = key || undefined;
    refreshPresetButtons();
  }

  let brandDescEl = null, tipsEl = null, roEl = null;

  function switchTab(id) {
    if (id === curTab) return;
    curTab = id;
    tween = null;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.toggles[data-tab], .views[data-tab], .presets[data-tab]').forEach(el => {
      el.style.display = el.dataset.tab === id ? '' : 'none';
    });
    if (cams[id]) Object.assign(cam, cams[id]);   // 原地改写，VizEngine.cam 引用不变
    const sc = SCENES[id];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    syncParamVisibility();
    refreshViewButtons();
    /* 换 tab 时把导出的 state.preset 同步成这个 tab 自己记住的那一个——
       lastPreset[id] 在 buildPresets() 建面板时已经对每个声明了 presets
       的 tab 都填过一次（选中第一项），没声明 presets 的 tab 这里是
       undefined，state.preset 也就诚实地变成 undefined，不留一份别的
       tab 的陈旧数据。 */
    state.preset = lastPreset[id];
    refreshPresetButtons();
    updateReadout();
  }

  /* ================= 播放 / 重置 / 折叠 ================= */
  let btnPlay = null, btnFold = null, panelEl = null;
  function togglePlay() {
    state.running = !state.running;
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  }

  /* ================= 语言切换 ================= */
  function applyLang() {
    if (typeof document === 'undefined') return;
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = t(TOOL.title);
    const h1 = document.querySelector('.brand h1');
    if (h1) h1.textContent = t(TOOL.h1);
    const panelTitleEl = document.getElementById('panelTitle');
    if (panelTitleEl) panelTitleEl.textContent = t(UI.panelTitle);
    const hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.textContent = t(UI.hint);
    const btnLangEl = document.getElementById('btnLang');
    if (btnLangEl) btnLangEl.textContent = LANG === 'zh' ? 'EN' : '中';
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
    const btnResetEl = document.getElementById('btnReset');
    if (btnResetEl) btnResetEl.textContent = t(UI.reset);
    RELABEL.forEach(f => f());
    const sc = SCENES[curTab];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    updateReadout();
  }
  function setLang(l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    try {
      const u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    } catch (e) {}
    applyLang();
  }

  /* ================= 交互：旋转 / 平移 / 缩放 ================= */
  function pan(dx, dy) {
    const C = makeCam();
    const s = cam.dist / FOCAL;
    cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
    cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
    cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
  }

  /* 绑定拖拽旋转 / 右键或 Shift 拖拽平移 / 滚轮或双指缩放 / 双击回正到给定 canvas。
     只在浏览器里调用才会碰 DOM 事件，模块顶层不会自动执行这段。
     双击回正：若当前页签在 SCENES 里声明了 views，就补间回它的第一个视角
     （规范里「首视角即双击回正的家」）；没有 SCENES 的最小用法里则安静地不做事。 */
  function bindOrbit(canvasEl) {
    const pointers = new Map();
    let pinch = null;

    canvasEl.addEventListener('pointerdown', e => {
      canvasEl.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
      tween = null;
      lastView[curTab] = null;
      refreshViewButtons();
      if (pointers.size === 2) {
        const vs = Array.from(pointers.values());
        pinch = {
          gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
          cx: (vs[0].x + vs[1].x) / 2,
          cy: (vs[0].y + vs[1].y) / 2
        };
      }
      canvasEl.classList.add('dragging');
    });

    canvasEl.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointers.size === 1) {
        const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
        if (panMode) {
          pan(dx, dy);
        } else {
          cam.az -= dx * 0.0055;
          cam.el = clamp(cam.el + dy * 0.0055, EL_MIN, EL_MAX);   // 与 makeCam() 共用同一对边界，见那里的注释
        }
      } else if (pointers.size === 2 && pinch) {
        const vs = Array.from(pointers.values());
        const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
        const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
        if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
        pan(cx - pinch.cx, cy - pinch.cy);
        pinch = { gap: gap, cx: cx, cy: cy };
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvasEl.classList.remove('dragging');
    }
    canvasEl.addEventListener('pointerup', endPointer);
    canvasEl.addEventListener('pointercancel', endPointer);
    canvasEl.addEventListener('contextmenu', e => e.preventDefault());

    canvasEl.addEventListener('wheel', e => {
      e.preventDefault();
      tween = null;
      cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
    }, { passive: false });

    canvasEl.addEventListener('dblclick', () => {
      const sc = SCENES[curTab];
      const names = sc && sc.views && Object.keys(sc.views);
      if (names && names.length) applyView(names[0]);
    });
  }

  /* 全局键盘快捷键：T 切换页签、1–9 选视角。这两组快捷键都只驱动引擎本体

            zh: '起始牌 = newDeck() —— 未加密的新牌顺序' }));
  msgBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
}

/* ================= 派生量（按 口令 / 报文 / 扰动位置 缓存） =================
   缓存不是为了省 CPU，是为了让画面与读数在同一帧里读到**同一份**结果：
   两处各算一遍，迟早出现半帧错位。 */
const DK = { sig: null };
function decks() {
  if (DK.sig === PHRASE) return DK;
  DK.sig = PHRASE;
  DK.start = SOL.deckFromPassphrase(PHRASE);
  DK.rounds = [DK.start];              // 惰性延长：roundDeck(r) 要到第几轮就算到第几轮
  return DK;
}
function roundDeck(r) {
  const d = decks();
  while (d.rounds.length <= r) d.rounds.push(SOL.step(d.rounds[d.rounds.length - 1]));
  return d.rounds[r];
}
/* ================= 两种"只改一张牌" =================
   这两种改动听上去差不多，实测差得非常远，而这个差别就是第二页真正的内容。
   下面每个数字都是本仓在这份实现上跑出来的（未加密的新牌，前 12 个输出，
   53 个位置各试一遍）：

     move  把第 i 张**抽出来放到最底下**
           53 个位置里 0 个让密钥流保持不变，53 个改掉了 12 个输出中的 9 个
           以上，平均在第 0.0 个输出上就分开了。
     swap  把第 i 张与第 i+1 张**对调**
           53 个位置里 **16 个一个输出都没改**，只有 7 个改掉了 9 个以上，
           平均要到第 4.8 个输出才分开。

   原因不神秘，而且正是第一页画过的东西：三重切牌与计数切牌搬的是**整块**，
   块内相对顺序不变。相邻对调既不动底牌、也不动任何一条块边界，那个"缺陷"
   只是跟着块一起走，直到它偶然落到顶牌、底牌、某张王、或者被数到的那一格
   上才第一次影响输出。抽一张放到底则不同：它把下面所有牌的下标整体挪了一位，
   **并且换掉了底牌**——而底牌恰恰是计数切牌每一轮都要读的那一张。

   所以这一页不印"挪一张牌就雪崩"这句话：那句话对 move 成立、对 swap 不成立，
   而把它印成通则就是在骗人。页面把两种改动都给出来，把 53 个位置的实测结果
   画成一条普查带，让人自己看着切换。 */
const PERTURB = {
  move: {
    label: { en: 'move to bottom', zh: '抽出放到底' },
    /* desc 是**函数**：位置要嵌在句子中间，而中英文的位置不一样，做成
       "先取语言再字符串替换"迟早会替换错一门语言。 */
    desc: function (i) {
      return { en: 'take card #' + i + ' out, put it on the bottom',
               zh: '把第 ' + i + ' 张抽出来放到最底下' };
    },
    apply: function (deck, i) {
      const d = deck.slice();
      const c = d.splice(i, 1)[0];
      d.push(c);
      return d;
    }
  },
  swap: {
    label: { en: 'swap neighbours', zh: '与邻牌对调' },
    desc: function (i) {
      return { en: 'swap card #' + i + ' with card #' + (i + 1),
               zh: '把第 ' + i + ' 张与第 ' + (i + 1) + ' 张对调' };
    },
    apply: function (deck, i) {
      const d = deck.slice();
      const j = i + 1;
      const t = d[i]; d[i] = d[j]; d[j] = t;
      return d;
    }
  }
};
let PERT = 'move';
/* nudge 的上限是 52，两种改动都因此**永远不是恒等变换**：move 的 i=53 会把
   底牌放回底（什么也没做），swap 的 i=53 没有第 54 张可对调。一个悄悄退化成
   "两副一模一样的牌"的滑杆位置，会让整页在那一格上凭空显示"完全一致"。 */
const PERT_PRESETS = Object.keys(PERTURB).map(function (k) {
  return {
    key: k,
    label: PERTURB[k].label,
    onSelect: function () { PERT = k; SS.sig = null; CEN.sig = null; }
  };
});
const PERT_PRESETS_LABEL = { en: 'Change', zh: '改动方式' };

const N_OUT = 12;                      // 第二页并排跑的输出个数
const SS = { sig: null };
function streams() {
  const nudge = Math.round(E.state.nudge || 0);
  const sig = PHRASE + '|' + PERT + '|' + nudge;
  if (SS.sig === sig) return SS;
  SS.sig = sig;
  SS.nudge = nudge;
  SS.a0 = decks().start;
  SS.b0 = PERTURB[PERT].apply(SS.a0, nudge);
  SS.a = []; SS.b = [];
  let da = SS.a0, db = SS.b0;
  for (let i = 0; i < N_OUT; i++) {
    const ra = SOL.keyStreamValue(da); SS.a.push(ra); da = ra.deck;
    const rb = SOL.keyStreamValue(db); SS.b.push(rb); db = rb.deck;
  }
  SS.firstDiff = -1;
  SS.diffs = 0;
  for (let i = 0; i < N_OUT; i++) {
    if (SS.a[i].value !== SS.b[i].value) {
      SS.diffs++;
      if (SS.firstDiff < 0) SS.firstDiff = i;
    }
  }
  return SS;
}

/* 53 个位置各改一次，各数一遍"前 N_OUT 个输出里有几个变了"。
   页面靠它把结论换成证据：使用者切换改动方式时，这条带子从一堵墙变成一把
   缺了很多齿的梳子，而那正是上面那段注释里两组数字的样子。
   实测代价 2.3ms（53 × keyStream(12)），且只在口令或改动方式变化时重算一次。 */
const CEN = { sig: null };
function census() {
  const sig = PHRASE + '|' + PERT;
  if (CEN.sig === sig) return CEN;
  CEN.sig = sig;
  const start = decks().start;
  const base = SOL.keyStream(start, N_OUT);
  CEN.diffs = [];
  CEN.none = 0;
  CEN.strong = 0;
  for (let i = 0; i < 53; i++) {
    const b = SOL.keyStream(PERTURB[PERT].apply(start, i), N_OUT);
    let d = 0;
    for (let k = 0; k < N_OUT; k++) if (base[k] !== b[k]) d++;
    CEN.diffs.push(d);
    if (d === 0) CEN.none++;
    if (d >= N_OUT * 0.7) CEN.strong++;
  }
  return CEN;
}

const US = { sig: null };
function usage() {
  const sig = PHRASE + '|' + MSG;
  if (US.sig === sig) return US;
  US.sig = sig;
  const start = decks().start;
  US.plain = CC.normalize(MSG);
  US.n = US.plain.length;
  US.ks = SOL.keyStream(start, US.n);
  US.cipher = SOL.encrypt(MSG, start);
  US.back = SOL.decrypt(US.cipher, start);
  US.ok = (US.back === US.plain);
  /* 错的那副牌不换口令，只把**最上面那一张抽到最底下**——一次最不起眼的
     切牌，人手上最容易多做或漏做的那一下。
     这里刻意**不**用第二页那个"相邻对调"：实测它在 CRYPTONOMICON + SOLITAIREX
     这条预置上会把明文原样解出来（10/10 全中），那样这一页就会自己拆自己的台。
     抽一张放到底则在四条预置上分别只剩 0 / 1 / 2 / 4 个字母碰巧对上（纯靠
     运气分别约 0.4 / 0.6 / 0.4 / 2.1 个）。选哪种扰动不是修辞，是这一页的
     结论成不成立。 */
  US.wrongDeck = PERTURB.move.apply(start, 0);
  US.wrong = SOL.decrypt(US.cipher, US.wrongDeck);
  US.hits = 0;
  for (let i = 0; i < US.n; i++) if (US.wrong.charAt(i) === US.plain.charAt(i)) US.hits++;
  US.luck = US.n / 26;
  US.vector = vectorFor(PHRASE, US.plain);
  US.vectorOk = !!(US.vector && US.cipher === US.vector.cipher);
  /* 累计跳过的轮数：报文越长，"取到王就不输出"发生得越多。这个数字是第一页
     那条规则在第三页留下的痕迹，不是统计装饰。 */
  US.skips = 0;
  let d = start;
  for (let i = 0; i < US.n; i++) { const r = SOL.keyStreamValue(d); US.skips += r.skips; d = r.deck; }
  return US;
}

/* ================= 时间轴 =================
   三个页签的步长各不相同（四步一轮 / 一个输出一步 / 一个字母一步），而传输条
   只有一条。所以时间轴按 key + 步数**重建**，位置按新步数取模带过去。
   TL 因此必须是 let，而传输条那三个回调都在**调用时**读 TL——写成
   TL.step.bind(TL) 会把旧对象钉死在监听器里，重建之后按钮就哑了。 */
let TL = CryptoAnim.createTimeline({ steps: 4, stepDuration: 0.85, loop: true, rate: 1 });
TL.play();
let TL_KEY = '';
function ensureTimeline(key, steps, dur) {
  steps = Math.max(1, Math.round(steps));
  const id = key + '|' + steps;
  if (TL_KEY === id) return;
  TL_KEY = id;
  const at = TL.index % steps;
  TL = CryptoAnim.createTimeline({ steps: steps, stepDuration: dur, loop: true, rate: TL.rate });
  TL.seek(at);
  TL.play();
}
/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock() {
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
}

document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把位置拨回第 0 步。用 seek(0)
   而不是 TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'nudge',
    label: { en: 'which card <i>i</i>', zh: '改哪一张 <i>i</i>' },
    min: 0, max: 52, step: 1, value: 0,
    fmt: function (v) { return '#' + Math.round(v); } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 画布上的小工具 ================= */
/* 右边那块面板固定 304px 宽；760px 以下它变成贴底的抽屉（默认收起），
   整幅宽度就都能用。上下留白避开顶部的页签/传输条与底部的传输条与提示。 */
function contentBox(vi) {
  const rightPad = vi.W > 760 ? 332 : 14;
  const x = 20;
  const w = Math.max(220, vi.W - rightPad - x - 16);
  const top = vi.W > 760 ? 126 : 146;
  const bot = vi.H - (vi.W > 760 ? 88 : 78);
  return { x: x, y: top, w: w, h: Math.max(150, bot - top) };
}
/* 引擎的 screen-space 图元层里没有折线，只有 flowArrow。把 head 关掉，
   它就是一条线段——不必为一条线再造一套绘图原语。 */
function seg(ax, ay, bx, by, o) {
  E.flowArrow(ax, ay, bx, by, { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}
function ring(x, y, w, h, color, width) {
  E.chip(x, y, w, h, '', { stroke: color, width: width || 1.8, radius: 3 });
}

/* ---- 54 张牌的排布 ----
   一张都不能少：牌堆**就是**密钥，少画一张就是少画了一部分密钥。所以这里调的
   是**布局**（几列几行、格子多大），不是张数：在每一个可能的列数上算出"这个
   列数下格子最大能有多大"，取最大的那个。凯撒页曾经反过来做——先定格数、
   再把格宽 clamp 到一个下限——于是"放不下"变成了"画到画布外面去"，375px 上
   两端各被吃掉 6px。这里没有下限可以踩：地方不够时格子就真的变小，小到写不下
   字就不写字（见 drawDeck 里那条 fs >= 6）。 */
function fitGrid(w, h, n, o) {
  o = o || {};
  const gap = o.gap == null ? 2 : o.gap;
  const ratio = o.ratio || 1.36;        // 牌是竖着的长方形，不是正方形
  const maxW = o.maxW || 54;
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const byW = (w - gap * (cols - 1)) / cols;
    const byH = ((h - gap * (rows - 1)) / rows) / ratio;
    const cw = Math.min(maxW, byW, byH);
    if (!(cw > 0)) continue;
    if (!best || cw > best.cw) best = { cols: cols, rows: rows, cw: cw, ch: cw * ratio, gap: gap };
  }
  return best;
}

/* 画一副牌，返回布局信息（at(i) 给出第 i 张的左上角），调用方拿它加标注。
   放不下（格宽小于 5px）时返回 null，让调用方明说"这里放不下"，而不是画出
   一排肉眼分不开的色条假装画过了。 */
function drawDeck(x, y, w, h, cards, o) {
  o = o || {};
  const g = fitGrid(w, h, cards.length, o);
  if (!g || g.cw < 5) return null;
  const totalW = g.cols * g.cw + g.gap * (g.cols - 1);
  const totalH = g.rows * g.ch + g.gap * (g.rows - 1);
  const x0 = x + (w - totalW) / 2, y0 = y + (h - totalH) / 2;
  const at = function (i) {
    return { x: x0 + (i % g.cols) * (g.cw + g.gap),
             y: y0 + Math.floor(i / g.cols) * (g.ch + g.gap) };
  };
  /* 字号先按格宽定，再按"10D 三个字符要放得下"收一次。收不到 6px 就干脆不
     写字——挤成一团的字比没有字更难读，而位置与颜色已经把牌堆的形状说清楚了。 */
  const fs = Math.min(g.cw * 0.42, (g.cw - 4) / 1.75, 13);
  const showText = fs >= 6 && o.text !== false;
  const rad = Math.min(4, g.cw * 0.16);
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const p = at(i);
    const joker = SOL.isJoker(c);
    const suit = SOL.cardSuit(c);
    const red = (suit === 1 || suit === 2);
    const tint = o.tint ? o.tint(i, c) : null;
    const edge = o.edge ? o.edge(i, c) : null;
    E.chip(p.x, p.y, g.cw, g.ch, showText ? SOL.cardName(c) : '',
           { fill: tint || (joker ? 'rgba(251,146,60,.20)' : (red ? SUIT_RED_BG : SUIT_BLACK_BG)),
             stroke: edge || (joker ? ORANGE : 'rgba(148,163,184,.20)'),
             width: (edge || joker) ? 1.6 : 1,
             color: joker ? ORANGE : (red ? SUIT_RED : SUIT_BLACK),
             fontSize: fs, radius: rad });
  }
  return { g: g, at: at, x: x0, y: y0, w: totalW, h: totalH, fs: fs };
}

/* ================= 页签一：一副牌 ================= */
const ROUNDS_SHOWN = 8;                // 时间轴走 8 轮 × 4 步，走完回到起点重放

const OP_TITLE = {
  jokerA:    { en: 'Joker A down 1',  zh: 'A 王下移 1' },
  jokerB:    { en: 'Joker B down 2',  zh: 'B 王下移 2' },
  tripleCut: { en: 'Triple cut',      zh: '三重切牌' },
  countCut:  { en: 'Count cut',       zh: '计数切牌' }
};
/* 一行小字，不是解释——解释在 tips 与读数里，那两处会自己折行。 */
const OP_NOTE = {
  jokerA:    { en: 'at the bottom it wraps to below the top card',
               zh: '已经在底时绕到第一张的下面，不会成为顶牌' },
  jokerB:    { en: 'two jokers at two speeds — that is the mixing',
               zh: '两张王速度不同，混合就是从这儿来的' },
  tripleCut: { en: 'the block between the jokers does not move',
               zh: '两张王之间那一段原地不动' },
  countCut:  { en: 'the bottom card is read, and it stays put',
               zh: '读底牌，而底牌自己留在原位' }
};

const deckTab = {
  label: { en: 'The Deck', zh: '一副牌' },
  brand: { en: 'Fifty-four cards are the key state. Four fixed operations are the step function. That is the whole cipher.',
           zh: '54 张牌就是密钥状态，四步固定的操作就是状态转移函数。整个密码就这些。' },
  tips: { en: 'Press ⏭ four times: joker A down one, joker B down two, triple cut, count cut. That is one round, done by hand, with no electronics anywhere. Watch the count cut — it reads the bottom card and leaves it in place, so the next round can read it again.',
          zh: '按四次 ⏭：A 王下移 1、B 王下移 2、三重切牌、计数切牌。这就是一轮，全程用手，没有任何电子元件。盯住计数切牌 —— 它读底牌、又把底牌留在原地，下一轮才好再读一次。' },
  params: ['speed'],
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showMove',   label: { en: 'What this step moved', zh: '这一步动了什么' }, color: EMERALD, checked: true },
    { key: 'showOutput', label: { en: 'Output card',          zh: '输出牌' },         color: VIOLET,  checked: true },
    { key: 'showNames',  label: { en: 'Card names',           zh: '牌名' },           color: SLATE,   checked: true }
  ],
  draw: function () {
    ensureTimeline('deck', ROUNDS_SHOWN * 4, 0.85);
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);

    const idx = TL.index;
    const r = Math.floor(idx / 4), k = idx % 4;
    const before = roundDeck(r);
    const stages = SOL.stepStages(before);
    const prev = (k === 0) ? before : stages[k - 1].deck;
    const cur = stages[k].deck;
    const op = SOL.OPS[k];

    const headH = 30, noteH = 22, footH = 26;
    let y = B.y;

    E.chip(B.x, y, B.w, 26,
           E.t({ en: 'round ', zh: '第 ' }) + (r + 1) + E.t({ en: '', zh: ' 轮' }) +
           '  ·  ' + (k + 1) + '/4  ·  ' + E.t(OP_TITLE[op]),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 13 });
    y += headH;
    E.chip(B.x, y, B.w, 18, E.t(OP_NOTE[op]), { mono: true, color: DIM, fontSize: 10.5 });
    y += noteH;

    /* ---- 这一步动了哪些牌 ----
       每一步的标注都从**上一副牌**算出来，不是硬写下标：算出来的标注在牌堆是
       任意排列时同样成立，硬写的那种只在新牌上看着对。 */
    let tint = null, edge = null, moveFrom = -1, moveTo = -1, capt = null;
    if (E.state.showMove) {
      if (op === 'jokerA' || op === 'jokerB') {
        const card = (op === 'jokerA') ? SOL.JOKER_A : SOL.JOKER_B;
        moveFrom = prev.indexOf(card);
        moveTo = cur.indexOf(card);
        capt = { en: 'slot ' + moveFrom + ' → slot ' + moveTo,
                 zh: '第 ' + moveFrom + ' 张 → 第 ' + moveTo + ' 张' };
      } else if (op === 'tripleCut') {
        const ja = prev.indexOf(SOL.JOKER_A), jb = prev.indexOf(SOL.JOKER_B);
        const p = Math.min(ja, jb), q = Math.max(ja, jb);
        const botLen = (SOL.DECK_SIZE - 1) - q, midLen = q - p + 1;
        tint = function (i) {
          return (i < botLen || i >= botLen + midLen) ? 'rgba(52,211,153,.17)' : null;
        };
        edge = function (i, c) {
          if (SOL.isJoker(c)) return null;
          return (i < botLen || i >= botLen + midLen) ? 'rgba(52,211,153,.55)' : null;
        };
        capt = { en: 'green blocks swapped · ' + botLen + ' + ' + midLen + ' + ' + p,
                 zh: '两块绿的整体对调 · ' + botLen + ' + ' + midLen + ' + ' + p + ' 张' };
      } else {
        const n = SOL.cardValue(prev[SOL.DECK_SIZE - 1]);
        const keep = SOL.DECK_SIZE - 1 - n;
        tint = function (i) {
          return (i >= keep && i < SOL.DECK_SIZE - 1) ? 'rgba(52,211,153,.17)' : null;
        };
        edge = function (i, c) {
          if (i === SOL.DECK_SIZE - 1) return STILL;
          if (SOL.isJoker(c)) return null;
          return (i >= keep) ? 'rgba(52,211,153,.55)' : null;
        };
        capt = { en: 'bottom ' + SOL.cardName(prev[SOL.DECK_SIZE - 1]) + ' = ' + n +
                     ' · ' + n + ' cards moved above it',
                 zh: '底牌 ' + SOL.cardName(prev[SOL.DECK_SIZE - 1]) + ' = ' + n +
                     ' · ' + n + ' 张搬到它上面' };
      }
    }

    /* ---- 输出牌：只在第四步之后才成立 ---- */
    let outIdx = -1, outCard = 0, topVal = 0;
    if (k === 3) {
      topVal = SOL.cardValue(cur[0]);
      outIdx = topVal;
      outCard = cur[outIdx];
    }
    const showOut = (outIdx >= 0 && E.state.showOutput);

    const deckH = B.h - (y - B.y) - footH - (capt ? 20 : 0);
    const L = drawDeck(B.x, y, B.w, deckH, cur,
                       { text: E.state.showNames !== false, tint: tint, edge: edge });
    if (!L) {
      E.chip(B.x, y, B.w, 24,
             E.t({ en: 'not enough room for 54 cards', zh: '这里放不下 54 张牌' }),
             { mono: true, color: ORANGE, fontSize: 11 });
      return;
    }

    /* 移动箭头画在牌堆之上：起点是那张王原来的槽位，终点是它现在的槽位。
       两端各套一个环，免得箭头在密集的格子里被读成"两张牌之间有条线"。 */
    if (moveFrom >= 0 && moveFrom !== moveTo) {
      const a = L.at(moveFrom), b = L.at(moveTo);
      const cw = L.g.cw, ch = L.g.ch;
      ring(a.x - 1, a.y - 1, cw + 2, ch + 2, 'rgba(52,211,153,.55)', 1.4);
      ring(b.x - 1, b.y - 1, cw + 2, ch + 2, EMERALD, 2);
      E.flowArrow(a.x + cw / 2, a.y + ch / 2, b.x + cw / 2, b.y + ch / 2,
                  { color: 'rgba(52,211,153,.8)', width: 1.6, headLen: 7 });
    }

    if (showOut) {
      const a = L.at(0), b = L.at(outIdx);
      const cw = L.g.cw, ch = L.g.ch;
      ring(a.x - 1, a.y - 1, cw + 2, ch + 2, VIOLET, 1.6);
      const hot = SOL.isJoker(outCard) ? ORANGE : VIOLET;
      ring(b.x - 2, b.y - 2, cw + 4, ch + 4, hot, 2.2);
      seg(a.x + cw / 2, a.y + ch, b.x + cw / 2, b.y,
          { color: 'rgba(167,139,250,.45)', width: 1, dash: [3, 3] });
    }

    let fy = L.y + L.h + 6;
    if (capt) {
      E.chip(B.x, fy, B.w, 17, E.t(capt), { mono: true, color: EMERALD, fontSize: 10.5 });
      fy += 19;
    }
    if (k === 3) {
      const jokerOut = SOL.isJoker(outCard);
      E.chip(B.x, fy, B.w, 20,
             'top ' + SOL.cardName(cur[0]) + ' = ' + topVal + '  →  #' + outIdx + ' = ' +
             SOL.cardName(outCard) +
             (jokerOut ? E.t({ en: '  —  joker, no output', zh: '  —  是王，不输出' })
                       : '  =  ' + CC.ALPHABET.charAt(CC.mod(outCard - 1, 26))),
             { mono: true, color: jokerOut ? ORANGE : VIOLET, fontSize: 11 });
    } else {
      E.chip(B.x, fy, B.w, 20,
             E.t({ en: 'the output is read after all four steps', zh: '四步全做完才读输出' }),
             { mono: true, color: DIM, fontSize: 10.5 });
    }
  },
  readout: function () {
    syncIoLabels();
    const idx = TL.index;
    const r = Math.floor(idx / 4), k = idx % 4;
    const cur = SOL.stepStages(roundDeck(r))[k].deck;
    let s = '<b style="--c:var(--trace-cyan)">' + E.t({ en: 'round ', zh: '第 ' }) + (r + 1) +
      E.t({ en: '', zh: ' 轮' }) + '</b><span class="dim">  /  ' + ROUNDS_SHOWN + '</span><br>' +
      '<b style="--c:var(--trace-emerald)">' + esc(E.t(OP_TITLE[SOL.OPS[k]])) + '</b>' +
      '<span class="dim">  ' + (k + 1) + '/4</span><br>' +
      '<span class="dim">' + E.t({ en: 'top ', zh: '顶牌 ' }) + '</span>' +
      '<b><i>' + SOL.cardName(cur[0]) + '</i></b>' +
      '<span class="dim">  ' + E.t({ en: 'bottom ', zh: '底牌 ' }) + '</span>' +
      '<b><i>' + SOL.cardName(cur[SOL.DECK_SIZE - 1]) + '</i></b><br>' +
      '<span class="dim">' + E.t({ en: 'jokers at slots ', zh: '两张王在第 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + cur.indexOf(SOL.JOKER_A) + ' · ' +
      cur.indexOf(SOL.JOKER_B) + '</b>' + E.t({ en: '', zh: ' 张' }) + '<br>';
    if (k === 3) {
      const n = SOL.cardValue(cur[0]);
      const c = cur[n];
      s += SOL.isJoker(c)
        ? '<b style="--c:var(--trace-orange)">' +
          E.t({ en: 'drew a joker — no output this round', zh: '取到王 —— 这一轮不输出' }) + '</b>'
        : '<span class="dim">' + E.t({ en: 'output ', zh: '输出 ' }) + '</span>' +
          '<b style="--c:var(--trace-violet)"><i>' +
          CC.ALPHABET.charAt(CC.mod(c - 1, 26)) + '</i></b>' +
          '<span class="dim">  ' + SOL.cardName(c) + ' = ' + c + '</span>';
    } else {
      s += '<span class="dim">' +
        E.t({ en: 'four steps make one round', zh: '四步凑成一轮' }) + '</span>';
    }
    return s;
  }
};

/* ================= 页签二：密钥流 —— 顿悟视角 =================
   两副牌，只差一张：把第 i 张与第 i+1 张对调，别的一模一样。它们各自跑同一套
   四步操作，各自吐出一条密钥流。牌堆与它吐出的字母并排画在一起，于是"牌就是
   密钥"这句话不再是一个说法——你看着两副牌越洗越不像，同时看着两条字母行在
   第几个输出上分开。
   这就是雪崩：一张牌的差别，几个输出之内放大成完全无关的两条流；而它是用
   一副纸牌、在手上跑出来的。 */
const streamTab = {
  label: { en: 'Key Stream', zh: '密钥流' },
  brand: { en: 'The deck IS the key — so change one card and the stream changes. How much depends entirely on which change you make.',
           zh: '牌堆**就是**密钥 —— 所以改一张牌，密钥流就会变。变多少，完全取决于你做的是哪一种改动。' },
  tips: { en: 'The epiphany view, and it is not quite the one you expect. Two decks differ by exactly one card. Switch the Change buttons: taking a card out and putting it on the bottom parts the streams at the very first output, every time — but merely swapping a card with its neighbour leaves 16 of the 53 positions emitting an identical stream for all 12 outputs (measured, unkeyed deck). The bottom strip shows all 53 at once. The reason is on page one: triple cut and count cut move whole blocks and preserve order, so a swap that touches neither the bottom card nor a block edge just rides along until it happens to land somewhere that matters. Moving a card to the bottom re-indexes everything below it AND replaces the card the count cut reads.',
          zh: '顿悟视角，但不完全是你以为的那一个。两副牌只差一张。切换"改动方式"：把一张牌抽出来放到最底下，两条流每次都在第一个输出上就分开；而仅仅与邻牌对调，53 个位置里有 16 个让 12 个输出**一个都没变**（实测，未加密的新牌）。底下那条带子把 53 个位置一次全画出来。原因在第一页就画过：三重切牌与计数切牌搬的是整块、块内顺序不变，所以一次既不碰底牌也不碰块边界的对调只是跟着走，直到偶然落到要紧的位置上。抽一张放到底则不同 —— 它把下面所有牌的下标整体挪了一位，还换掉了计数切牌每轮都要读的那张底牌。' },
  params: ['nudge', 'speed'],
  presets: PERT_PRESETS,
  presetsLabel: PERT_PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showDecks',   label: { en: 'Both decks',  zh: '两副牌' }, color: SLATE,  checked: true },
    { key: 'showStreams', label: { en: 'Key streams', zh: '两条流' }, color: VIOLET, checked: true }
  ],
  draw: function () {
    ensureTimeline('stream', N_OUT, 0.75);
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const S = streams();
    const shown = TL.index + 1;

    const headH = 28;
    let y = B.y;
    E.chip(B.x, y, B.w, 24,
           E.t(PERTURB[PERT].label) + '  #' + S.nudge + '  ·  ' +
           E.t({ en: 'outputs ', zh: '已输出 ' }) + shown + '/' + N_OUT,
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 12.5 });
    y += headH;

    const streamsH = E.state.showStreams ? 236 : 0;
    const decksH = Math.max(60, B.h - headH - streamsH - 6);

    if (E.state.showDecks) {
      const side = B.w >= 560;
      const gp = 14;
      const pw = side ? (B.w - gp) / 2 : B.w;
      const ph = side ? decksH : (decksH - gp) / 2;
      const boxes = [
        { x: B.x, y: y, deck: S.a[shown - 1].deck, color: VIOLET,
          tag: { en: 'deck A', zh: 'A 牌' } },
        { x: side ? B.x + pw + gp : B.x, y: side ? y : y + ph + gp,
          deck: S.b[shown - 1].deck, color: ORANGE,
          /* 已经取过语言的**字符串**，不是 {en,zh}。E.t() 对字符串原样返回，
             所以两种形状可以并存；反过来把 E.t(...) 的结果再塞进一个 {en,zh}
             里，中文界面下 en 字段装的就是中文了。 */
          tag: E.t({ en: 'deck B — ', zh: 'B 牌 —— ' }) + E.t(PERTURB[PERT].desc(S.nudge)) }
      ];
      boxes.forEach(function (bx) {
        E.chip(bx.x, bx.y, pw, 15, E.t(bx.tag), { mono: true, color: bx.color, fontSize: 10.5 });
        drawDeck(bx.x, bx.y + 16, pw, ph - 16, bx.deck, { maxW: 34 });
      });
      y += decksH + 6;
    }

    if (E.state.showStreams) {
      const rows = [
        { r: S.a, color: VIOLET, tag: { en: 'stream A', zh: 'A 的密钥流' } },
        { r: S.b, color: ORANGE, tag: { en: 'stream B', zh: 'B 的密钥流' } }
      ];
      /* 柱子的宽度要收住：912px 上 12 根柱子每根 72px 宽、最高才 46px，画出来
         是一排横板而不是柱状图。按每根约 34px 反算图宽，宽了就居中留白。 */
      const chartW = Math.min(B.w, N_OUT * 34);
      const chartX = B.x + (B.w - chartW) / 2;
      const barH = 40, rowPitch = barH + 28;
      rows.forEach(function (row, ri) {
        const yy = y + 14 + ri * rowPitch;
        E.chip(chartX, yy - 14, chartW, 13, E.t(row.tag),
               { mono: true, color: row.color, fontSize: 10 });
        const vals = [], labs = [];
        for (let i = 0; i < N_OUT; i++) {
          const on = i < shown;
          vals.push(on ? row.r[i].value : 0);
          labs.push(on ? CC.ALPHABET.charAt(row.r[i].value - 1) : '·');
        }
        /* 量程锁死在 26，绝不让它跟着当前最大值走：不锁的话每揭开一个输出所有
           柱子都会跳一次高度，而这一页要人比较的恰恰是"这一根和那一根一样不
           一样"。o.max 在动画里是必需项，不是可选项。 */
        E.barChart(chartX, yy, chartW, barH, vals, {
          max: 26,
          gap: 4,
          labels: labs,
          labelSize: 11,
          labelColor: 'rgba(159,176,200,.75)',
          colorAt: function (i) {
            if (i >= shown) return 'rgba(148,163,184,.10)';
            /* 还一致的位置两条流用同一种暗色（"看不出差别"本身就是信息），
               岔开之后各自回到自己的颜色。 */
            return (S.a[i].value === S.b[i].value) ? 'rgba(148,163,184,.42)' : row.color;
          }
        });
      });
      const revealedDiff = (S.firstDiff >= 0 && S.firstDiff < shown) ? S.firstDiff : -1;
      if (revealedDiff >= 0) {
        const bw = (chartW - 4 * (N_OUT - 1)) / N_OUT;
        const cx = chartX + revealedDiff * (bw + 4) + bw / 2;
        seg(cx, y + 2, cx, y + 14 + rowPitch + barH + 16,
            { color: 'rgba(251,146,60,.55)', width: 1.2, dash: [4, 3] });
      }
      let dShown = 0;
      for (let i = 0; i < shown; i++) if (S.a[i].value !== S.b[i].value) dShown++;
      E.chip(B.x, y + 14 + 2 * rowPitch - 8, B.w, 18,
             revealedDiff >= 0
               ? E.t({ en: 'parted at #', zh: '在第 ' }) + (revealedDiff + 1) +
                 E.t({ en: ' · ', zh: ' 个输出上分开 · ' }) + dShown + '/' + shown +
                 E.t({ en: ' differ', zh: ' 个不同' })
               : E.t({ en: 'identical so far — keep pressing ⏭',
                       zh: '到这里还完全一样 —— 接着按 ⏭' }),
             { mono: true, color: revealedDiff >= 0 ? ORANGE : DIM, fontSize: 10.5 });

      /* ---- 普查带：53 个位置一次全画出来 ----
         一根柱子 = 在那个位置做同一种改动，前 12 个输出里有几个变了。
         量程锁死在 N_OUT（不是当前最大值）：这条带子的全部意义就是"齐不齐"，
         跟着数据缩放的量程会把一堵墙和一把缺齿的梳子画成同一个样子。
         这一条把"挪一张牌就雪崩"从一句断言换成了一张可以自己看的证据图——
         切到"与邻牌对调"，中间那一大片会当场塌下去。 */
      const CEN_TOP = y + 14 + 2 * rowPitch + 18;
      const cen = census();
      E.chip(B.x, CEN_TOP, B.w, 13,
             E.t({ en: 'all 53 positions — how many of the ' + N_OUT + ' outputs change',
                   zh: '53 个位置各自改变了 ' + N_OUT + ' 个输出中的几个' }),
             { mono: true, color: DIM, fontSize: 10 });
      E.barChart(B.x, CEN_TOP + 14, B.w, 30, cen.diffs, {
        max: N_OUT,
        gap: 1,
        colorAt: function (i) {
          if (i === S.nudge) return CYAN;
          return cen.diffs[i] === 0 ? 'rgba(148,163,184,.30)' : 'rgba(251,146,60,.62)';
        }
      });
      /* "你在这儿"的记号必须画在柱子**外面**。靠 colorAt 把当前那根染成青色
         在 diffs[i] === 0 时是不可见的——零高度的柱子没有像素可染，而那恰恰
         是最需要看见自己在哪儿的时候（"我选的这一张改动什么也没做"）。 */
      const cbw = (B.w - (53 - 1)) / 53;
      const ccx = B.x + S.nudge * (cbw + 1) + cbw / 2;
      seg(ccx, CEN_TOP + 44, ccx, CEN_TOP + 50, { color: CYAN, width: 2 });
      E.chip(B.x, CEN_TOP + 46, B.w, 16,
             cen.none + E.t({ en: '/53 change nothing · ', zh: '/53 个什么也没改变 · ' }) +
             cen.strong + E.t({ en: '/53 change most of the stream',
                                zh: '/53 个改掉了大半条流' }),
             { mono: true, color: cen.none ? ORANGE : EMERALD, fontSize: 10.5 });
    }
  },
  readout: function () {
    syncIoLabels();
    const S = streams();
    const shown = TL.index + 1;
    let s = '<b style="--c:var(--trace-cyan)">' +
      esc(E.t(PERTURB[PERT].desc(S.nudge))) + '</b><br>' +
      '<b style="--c:var(--trace-violet)">A </b>';
    for (let i = 0; i < N_OUT; i++) {
      s += (i < shown) ? '<i>' + CC.ALPHABET.charAt(S.a[i].value - 1) + '</i>'
                       : '<span class="dim">·</span>';
    }
    s += '<br><b style="--c:var(--trace-orange)">B </b>';
    for (let i = 0; i < N_OUT; i++) {
      s += (i < shown) ? '<i>' + CC.ALPHABET.charAt(S.b[i].value - 1) + '</i>'
                       : '<span class="dim">·</span>';
    }
    s += '<br>';
    if (S.firstDiff < 0) {
      s += '<b style="--c:var(--trace-emerald)">' +
        E.t({ en: 'identical for all ' + N_OUT + ' outputs', zh: N_OUT + ' 个输出完全相同' }) +
        '</b>';
    } else {
      s += '<span class="dim">' + E.t({ en: 'parted at #', zh: '在第 ' }) + '</span>' +
        '<b style="--c:var(--trace-orange)">' + (S.firstDiff + 1) + '</b>' +
        '<span class="dim">' + E.t({ en: ' · ', zh: ' 个输出上分开 · ' }) +
        S.diffs + '/' + N_OUT + E.t({ en: ' differ', zh: ' 个不同' }) + '</span>';
    }
    const cen = census();
    s += '<br><span class="dim">' +
      E.t({ en: 'across all 53 positions: ', zh: '53 个位置合起来看：' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + cen.none + '</b>' +
      '<span class="dim">' + E.t({ en: ' change nothing · ', zh: ' 个什么也没改 · ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + cen.strong + '</b>' +
      '<span class="dim">' + E.t({ en: ' change most of it', zh: ' 个改掉了大半' }) + '</span>';
    return s;
  }
};

/* ================= 页签三：发报 =================
   加密、解密，然后是这一页真正要证明的那件事：解密要的是**一模一样**的起始牌。
   第二行解密用的牌只是把最上面那一张抽到了最底下——一次最不起眼的切牌——
   出来的就是乱码（四条预置分别只剩 0 / 1 / 2 / 4 个字母碰巧对上）。 */
const useTab = {
  label: { en: 'Send a Message', zh: '发报' },
  brand: { en: 'Add the stream to the message. To read it back you need the identical starting deck — not a similar one.',
           zh: '把密钥流加到报文上。要读回来，你需要一副**一模一样**的起始牌 —— 不是"差不多"的那种。' },
  tips: { en: 'Two decryptions of the same ciphertext: the first uses the identical starting deck, the second has had one card — the top one — cut to the bottom. That single innocuous cut is enough; the count below tells you how many letters still land right, against how many pure luck would give. The green banner re-checks the published test vector on every frame. Page two shows why the choice of "one card" matters: some single-card changes cost you nothing at all.',
          zh: '同一段密文解两次：第一次用一模一样的起始牌，第二次只把**最上面那一张牌抽到最底下**。这一下最不起眼的切牌就够了；下面那行数字告诉你还有几个字母碰巧对上，以及纯靠运气会有几个。绿色横幅每一帧都在重新核对公开测试向量。至于"哪一张牌"为什么要紧 —— 第二页会告诉你，有些单张改动其实什么代价都没有。' },
  params: ['speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showKS',      label: { en: 'Key stream row', zh: '密钥流行' }, color: VIOLET,  checked: true },
    { key: 'showVerify',  label: { en: 'Decrypt check',  zh: '解密核对' }, color: EMERALD, checked: true },
    { key: 'showUseDeck', label: { en: 'Deck',           zh: '牌堆' },     color: SLATE,   checked: true }
  ],
  draw: function () {
    const U = usage();
    ensureTimeline('use', Math.max(1, U.n), 0.32);
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const pos = U.n ? (TL.index % U.n) : 0;

    let y = B.y;
    /* ---- 公开向量核对横幅 ----
       这不是一句标语：真的把当前密文与 Schneier 公布的那一串比一遍，比中了才
       是绿的。两份实现哪天走岔了，这条横幅会自己变色。 */
    if (U.vector) {
      E.chip(B.x, y, B.w, 22,
             E.t(U.vectorOk ? { en: 'test vector verified: ', zh: '公开向量已核对：' }
                            : { en: 'test vector MISMATCH, want ', zh: '公开向量对不上，应为 ' }) +
             (U.vectorOk ? U.vector.cipher : U.vector.cipher),
             { mono: true, fontSize: 11,
               color: U.vectorOk ? EMERALD : ORANGE,
               fill: U.vectorOk ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.12)',
               stroke: U.vectorOk ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.5)' });
      y += 26;
    }

    if (!U.n) {
      E.chip(B.x, y, B.w, 24,
             E.t({ en: 'no letters in the message', zh: '报文里一个字母都没有' }),
             { mono: true, color: ORANGE, fontSize: 11 });
      return;
    }

    const verifyH = E.state.showVerify ? 100 : 0;
    const nRows = 2 + (E.state.showKS ? 1 : 0);
    const gap = 3, CELL_MIN = 13, CELL_MAX = 26, rowGap = 14;
    const nFit = Math.max(1, Math.floor((B.w + gap) / (CELL_MIN + gap)));
    const n = Math.max(1, Math.min(U.n, nFit));
    const cell = E.clamp((B.w - gap * (n - 1)) / n, CELL_MIN, CELL_MAX);
    const stripH = nRows * cell + (nRows - 1) * rowGap + 24;
    const deckH = E.state.showUseDeck
      ? Math.max(0, B.h - (y - B.y) - stripH - verifyH - 10) : 0;

    /* ---- 牌堆：跟着报文走 ----
       第 pos 个字母用掉的是第 pos 次输出，所以这里画的是"吐出这个字母之后"
       的那副牌。它每个字母都在变——状态机的状态本来就该看得见在动。 */
    if (deckH > 40) {
      let d = decks().start;
      for (let i = 0; i <= pos; i++) d = SOL.keyStreamValue(d).deck;
      E.chip(B.x, y, B.w, 15,
             E.t({ en: 'the deck after output #', zh: '吐出第 ' }) + (pos + 1) +
             E.t({ en: '', zh: ' 个字母之后的牌' }),
             { mono: true, color: DIM, fontSize: 10 });
      drawDeck(B.x, y + 16, B.w, deckH - 16, d, { maxW: 40 });
      y += deckH + 4;
    } else {
      /* 牌堆关掉时把剩下的内容垂直居中，别让它贴在横幅底下、下面空一大片。 */
      y += Math.max(0, (B.h - (y - B.y) - stripH - verifyH) / 2);
    }

    /* ---- 三行条：明文 / 密钥流 / 密文 ----
       格数与格宽已经量过（先算"这么宽放得下几格"，再算格子大小）。放不下的
       部分用省略号明说，而不是让它悄悄被画布边缘吃掉。 */
    const total = n * cell + (n - 1) * gap;
    const sx = B.x + (B.w - total) / 2;
    const start = Math.round(E.clamp(pos - Math.floor(n / 2), 0, Math.max(0, U.n - n)));
    let ry = y;
    const yPlain = ry;
    const yKs = E.state.showKS ? (ry += cell + rowGap) : -1;
    const yCipher = (ry += cell + rowGap);
    for (let i = 0; i < n; i++) {
      const gi = start + i;
      const x = sx + i * (cell + gap);
      const on = (gi === pos);
      E.chip(x, yPlain, cell, cell, U.plain.charAt(gi),
             { stroke: on ? CYAN : 'rgba(45,212,234,.30)', width: on ? 1.8 : 1,
               fill: on ? 'rgba(45,212,234,.16)' : null, color: CYAN, fontSize: cell * 0.56 });
      if (yKs >= 0) {
        E.chip(x, yKs, cell, cell, CC.ALPHABET.charAt(U.ks[gi] - 1),
               { fill: 'rgba(167,139,250,.14)',
                 stroke: on ? VIOLET : 'rgba(167,139,250,.34)', width: on ? 1.8 : 1,
                 color: VIOLET, fontSize: cell * 0.56 });
      }
      E.chip(x, yCipher, cell, cell, U.cipher.charAt(gi),
             { fill: 'rgba(251,113,133,.10)',
               stroke: on ? ROSE : 'rgba(251,113,133,.34)', width: on ? 1.8 : 1,
               color: ROSE, fontSize: cell * 0.56 });
    }
    if (start > 0) E.chip(sx - 16, yPlain, 14, cell, '…', { color: DIM, fontSize: cell * 0.56 });
    if (start + n < U.n) E.chip(sx + total + 2, yPlain, 14, cell, '…', { color: DIM, fontSize: cell * 0.56 });
    y = yCipher + cell + 12;

    /* ---- 同一副牌 vs 差一张牌 ----
       标签与结果分两行：一行长句在 375px 上会被 fillText 直接画出画布。 */
    if (E.state.showVerify) {
      E.chip(B.x, y, B.w, 14,
             E.t({ en: 'decrypt with the identical deck', zh: '用一模一样的起始牌解密' }),
             { mono: true, color: DIM, fontSize: 10 });
      E.chip(B.x, y + 15, B.w, 20,
             clip(group5(U.back), 34) + (U.ok ? '   ✓' : '   ✗'),
             { mono: true, fontSize: 11, color: U.ok ? EMERALD : ORANGE,
               fill: U.ok ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.12)',
               stroke: U.ok ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.5)' });
      y += 40;
      E.chip(B.x, y, B.w, 14,
             E.t({ en: 'decrypt with the top card cut to the bottom',
                   zh: '把起始牌最上面那张抽到最底下再解密' }),
             { mono: true, color: DIM, fontSize: 10 });
      E.chip(B.x, y + 15, B.w, 20, clip(group5(U.wrong), 34),
             { mono: true, fontSize: 11, color: ORANGE,
               fill: 'rgba(251,146,60,.10)', stroke: 'rgba(251,146,60,.45)' });
      y += 40;
      /* 报"还剩几个对"就必须同时报"纯靠运气有几个"，否则 45/55 和 2/10 看上去
         都只是一个数字。这一对数字是这一页唯一诚实的说法。 */
      E.chip(B.x, y, B.w, 16,
             E.t({ en: 'one card moved · ', zh: '挪了一张牌 · ' }) +
             U.hits + '/' + U.n + E.t({ en: ' still right · luck ≈ ', zh: ' 个仍然对 · 运气约 ' }) +
             U.luck.toFixed(1),
             { mono: true, color: DIM, fontSize: 10.5 });
    }
  },
  readout: function () {
    syncIoLabels();
    const U = usage();
    let s = '<span class="dim">' + E.t({ en: 'deck ', zh: '起始牌 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' +
      (PHRASE ? esc(clip(PHRASE, 20)) : E.t({ en: 'new deck', zh: '新牌' })) + '</b>' +
      '<span class="dim">  ' + U.n + E.t({ en: ' letters', zh: ' 个字母' }) + '</span><br>';
    if (!U.n) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'nothing to encrypt', zh: '没有字母可加密' }) + '</b>';
    }
    const pos = TL.index % U.n;
    s += '<b style="--c:var(--trace-cyan)"><i>' + U.plain.charAt(pos) + '</i></b>' +
      ' <span class="dim">+</span> ' +
      '<b style="--c:var(--trace-violet)"><i>' + CC.ALPHABET.charAt(U.ks[pos] - 1) + '</i></b>' +
      '<span class="dim"> (' + U.ks[pos] + ')</span>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)"><i>' + U.cipher.charAt(pos) + '</i></b><br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(clip(group5(U.cipher), 48)) + '</b><br>' +
      '<b style="--c:var(--trace-emerald)">' +
      E.t(U.ok ? { en: 'same deck → the message comes back', zh: '同一副牌 → 报文回来了' }
               : { en: 'round trip broken', zh: '往返对不上' }) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'top card cut to the bottom → ',
                                   zh: '顶牌抽到最底下 → ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + esc(clip(U.wrong, 22)) + '</b>' +
      '<span class="dim">  ' + U.hits + '/' + U.n +
      E.t({ en: ' right, luck ≈ ', zh: ' 个对，运气约 ' }) + U.luck.toFixed(1) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'rounds skipped because a joker was drawn: ' + U.skips,
            zh: '因取到王而没有输出的轮数：' + U.skips }) + '</span>';
    return s;
  }
};

var SCENES = { deck: deckTab, stream: streamTab, use: useTab };

/* 输入框必须在 init() 之前搭好：引擎在 init() 里会立刻跑一次 readout()，
   而三个页签的 readout() 都会去同步 #ioHost 里的标签。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
