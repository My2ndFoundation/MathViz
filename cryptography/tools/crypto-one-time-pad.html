/* ================= 时间轴 =================
   一步 = 一个字节。步数随报文长度变，而 createTimeline 的 steps 建好就定死，
   所以长度一变就**重建**，把当前位置按新长度取模带过去。TL 因此必须是 let，
   传输条上那三个回调也都在**调用时**读 TL——写成 TL.step.bind(TL) 会把旧对象
   钉死在监听器里，重建之后按钮就哑了。 */
let TL = CryptoAnim.createTimeline({ steps: 1, stepDuration: 0.45, loop: true, rate: 1 });
TL.play();

function ensureTimeline(n) {
  const steps = Math.max(1, n);
  if (TL.steps === steps) return;
  const at = TL.index % steps;
  TL = CryptoAnim.createTimeline({ steps: steps, stepDuration: 0.45, loop: true, rate: TL.rate });
  TL.seek(at);
  TL.play();
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock(n) {
  ensureTimeline(n);
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
}
function focusAt(n) { return n ? TL.index % n : 0; }

document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把位置拨回第 0 个字节。用 seek(0)
   而不是 TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'flipAt',
    label: { en: 'break the key at byte <i>i</i>', zh: '把密钥第 <i>i</i> 个字节改坏' },
    min: 0, max: 116, step: 1, value: 7,
    fmt: function (v) { return '#' + Math.round(v); } },
  { key: 'rank',
    label: { en: 'candidate <i>#</i>', zh: '第几名候选 <i>#</i>' },
    min: 1, max: 8, step: 1, value: 1,
    fmt: function (v) { return '#' + Math.round(v); } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 画布上的小工具 ================= */
/* 右边那块面板固定 304px 宽；760px 以下它变成贴底的抽屉（默认收起），
   整幅宽度就都能用。上下留白避开顶部的页签/传输条与底部的传输条与提示。 */
function contentBox(vi) {
  const rightPad = vi.W > 760 ? 332 : 14;
  const x = 20;
  const w = Math.max(220, vi.W - rightPad - x - 16);
  /* 窄屏 152 而不是 146：传输条在 ≤760px 上是 top:110px 的浮层，连边框大约
     36px 高，底边正好落在 146——与内容区顶边**贴在一起**。第一屏内容不做垂直
     居中的页签（reuse）会紧挨着它起画，看上去像粘在一起。留 6px。 */
  const top = vi.W > 760 ? 126 : 152;
  const bot = vi.H - (vi.W > 760 ? 88 : 78);
  return { x: x, y: top, w: w, h: Math.max(150, bot - top) };
}
/* 引擎的 screen-space 图元层里没有折线，只有 flowArrow。把 head 关掉，
   它就是一条线段。 */
function seg(ax, ay, bx, by, o) {
  E.flowArrow(ax, ay, bx, by, { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}

/* ================= 放得下多少格 =================
   一律走 E.fitCells：**先用最小可读格宽反推放得下几格**，再让格宽在剩余空间里
   长大到上限。反过来做（先定格数、再把格宽 clamp 到一个下限）会把"放不下"变成
   "画出去"——canvas 不裁剪也不报错，而这个仓库为此在窄屏上栽过五次。
   窗口跟着播放头滚动，放不下的部分由调用方用省略号明说。 */
const GAP = 3;
/* 最小格宽 24 不是随手写的：每格里是**两个**十六进制数字，字号取格宽的 0.48，
   24px 的格子给出 11.5px 的字——再小就只是一排看不清的灰点了。宁可少画几个
   字节（窗口本来就跟着播放头滚动）也不要一排读不出来的格子。 */
const ELL = 16;          // 省略号自己要占的宽度，见下
function windowOf(B, total, focus, o) {
  o = o || {};
  const min = o.min == null ? 24 : o.min;
  const want = o.want == null ? 26 : o.want;
  /* 两次 fitCells：第一次问"全宽放得下吗"。放不下就要画省略号，而省略号是
     内容之外的东西——它得有自己的位置。第二次因此把两端各让出 ELL 像素。
     不让的话省略号会**压在最边上那一格字节上**（实测：桌面 1280 宽下最后一格
     的 hex 被"…"盖掉一半，看上去像半个字节）。 */
  let fit = E.fitCells(B.w, total, { gap: GAP, min: min, max: want });
  if (fit.truncated) fit = E.fitCells(B.w - 2 * ELL, total, { gap: GAP, min: min, max: want });
  const sx = B.x + (B.w - fit.total) / 2;
  const start = Math.round(E.clamp(focus - Math.floor(fit.n / 2), 0,
                                   Math.max(0, total - fit.n)));
  return {
    n: fit.n, cell: fit.cell, sx: sx, start: start, total: total,
    truncated: fit.truncated,
    xAt: function (i) { return sx + (i - start) * (fit.cell + GAP); },
    right: sx + fit.total
  };
}
/* 一行格子。fn(i) 返回 { t, color, fill, stroke, width, scale }。
   scale 是字号相对格宽的比例：十六进制一格两个字符（0.48），单个字符的行
   （reuse 页剥开的那两行）用 0.66，同样一格一个字符，所以两行天然对齐——
   页面上没有等宽字体可用（引擎只给 serif 与 sans 两个栈），"两行文字逐字对齐"
   这件事只能靠格子来保证，不能靠字体。 */
function cellRow(W, y, fn) {
  for (let i = W.start; i < W.start + W.n && i < W.total; i++) {
    const o = fn(i);
    if (!o) continue;
    E.chip(W.xAt(i), y, W.cell, W.cell, o.t,
           { fill: o.fill || null, stroke: o.stroke === undefined ? LINE : o.stroke,
             width: o.width || 1,
             color: o.color || BRIGHT, fontSize: W.cell * (o.scale || 0.48) });
  }
}
/* 这一段还放得下吗。放不下时调用方把这一段的名字记进 dropped，最后印出来——
   截断必须被**说出来**，不能交给画布边缘去吃掉（canvas 不裁剪也不报错，
   被切掉的半个格子看上去仍像内容的一部分）。 */
function room(B, y, h) { return y + h <= B.y + B.h + 0.5; }
/* 省略号夹在可用区内：它是"还有更多"的标记，不是内容，越出去反而像内容被切了
   一半。截断必须被**说出来**，不能交给画布边缘去吃掉。 */
function ellipses(B, W, y, h) {
  if (W.start > 0) {
    E.chip(Math.max(B.x, W.sx - 15), y, 13, h, '…', { color: DIM, fontSize: 12 });
  }
  if (W.start + W.n < W.total) {
    E.chip(Math.min(W.right + 2, B.x + B.w - 13), y, 13, h, '…', { color: DIM, fontSize: 12 });
  }
}
/* 行标签贴在行左端上方。宽度**按文字长度算**，不写一个固定的 300：E.chip 把
   文字居中放在给定的框里，框固定宽而文字长短不一时，几行标签的起点各不相同，
   看上去像没对齐的居中文字。框贴着文字，起点就都落在 B.x 附近。 */
function rowLabel(B, y, text, color) {
  /* 盒子按文字量宽（否则一排定宽盒子里的居中文字看上去参差不齐），但文字比
     整个内容区还宽时必须先截断：E.chip 的文字是**居中**放的，盒子被 B.w 夹住
     而文字更宽时，多出来的部分会从**左右两侧同时**漫出去，左边那一侧直接越过
     内容区的左边界。行标签里带一段明文预览（长度随报文变）时最容易撞上。 */
  let s = String(text);
  const maxW = B.w - 8;
  if (textW(s, 10) > maxW) {
    const keep = Math.max(4, Math.floor(s.length * maxW / textW(s, 10)) - 1);
    s = s.slice(0, keep) + '…';
  }
  E.chip(B.x, y, Math.min(B.w, textW(s, 10) + 10), 13, s,
         { mono: true, color: color, fontSize: 10 });
}

/* ================= 整行横条：宽度是硬约束 =================
   E.chip 既不量文字也不裁剪：一行放不下的文案会从**两头**漫出去（文字是居中
   放的），在窄屏上就是左右两端各被画布边缘吃掉一截。中文尤其容易：同一句话的
   中文大约是英文的两倍宽，一份按英文调好的文案在 375px 的中文界面上必然溢出。
   本仓的 Quagmire 那一页正是这么溢出了 84.5px。

   所以每一条整行横条都走这里：先按文字量宽，放不下就把字号往下压（最多压到
   八成），还是放不下就截断并**打上省略号**——截断可以，但必须看得出来。 */
/* 同一句话的长短两版：宽的时候说全，窄的时候说要点。它比 bar() 自己那两级
   兜底（压字号、截断）好，因为兜底只会把一句话砍在半截或者缩到看不清，而
   这里换来的是一句**为这个宽度写的**完整句子。传进来的顺序是长→短。 */
function pickText(B, list, px) {
  const w = B.w - 14;
  for (let i = 0; i < list.length; i++) {
    if (textW(list[i], px) <= w) return list[i];
  }
  return list[list.length - 1];
}

function bar(B, y, h, text, o) {
  o = o || {};
  const base = o.fontSize || 11.5;
  const w = B.w - 14;                     // 左右各留 7px，别贴着圆角
  let s = String(text);
  let fs = base;
  const need = textW(s, base);
  if (need > w) fs = Math.max(base * 0.8, base * w / need);
  if (textW(s, fs) > w) {
    const keep = Math.max(4, Math.floor(s.length * w / textW(s, fs)) - 1);
    s = s.slice(0, keep) + '…';
  }
  const opts = { fontSize: fs };
  for (const k in o) if (k !== 'fontSize') opts[k] = o[k];
  E.chip(B.x, y, B.w, h, s, opts);
}
/* 当前语言是不是中文。t() 本来就按当前语言取值，喂它一对布尔就得到答案——
   比读 document.documentElement.lang 少一个假设（那是 applyLang 的副产品，
   不是语言状态本身）。 */
function isZh() { return E.t({ en: false, zh: true }); }
/* ================= 派生量（各按自己的输入缓存） =================
   不是为了省 CPU，而是为了让画面与读数在同一帧里读到**同一份**结果：
   两处各算一遍，迟早半帧错位。 */

/* ---- pad 页 ---- */
function padState() {
  const sig = KEYSRC + '|' + MSG;
  if (PD.sig === sig) return PD;
  PD.sig = sig;
  PD.plain = CC.toBytes(MSG);          // MSG 恒合法：setMsg 守着落单代理那一条
  PD.n = PD.plain.length;
  PD.stretch = null;
  PD.fit = null;
  if (KEYSRC === 'short') {
    PD.stretch = OTP.stretchKey(CC.toBytes(SHORT_KEY), PD.n);
    PD.key = PD.stretch.bytes;
  } else if (KEYSRC === 'english') {
    PD.fit = OTP.fitBytes(CC.toBytes(T_NOTE), PD.n);
    PD.key = PD.fit.bytes;
  } else {
    PD.key = OTP.makeKey(OTP.seededRng(SEED_PAD), PD.n);
  }
  PD.cipher = OTP.encrypt(PD.plain, PD.key);
  /* 解密就是再异或一次同一把密钥——同一个函数、同一个运算。往返当场验，
     不写成一句"当然相等"：这一页所有别的断言都建立在它上面。 */
  PD.back = OTP.decrypt(PD.cipher, PD.key);
  PD.cmp = OTP.compare(PD.back, PD.plain);
  PD.stat = OTP.stats(PD.cipher);
  /* fromBytes 在密文上会不会抛？**现场试**，把错误原文摘出来印在页面上。
     这是"为什么密文一律用十六进制显示"的证据，不是一句风格声明。 */
  try { CC.fromBytes(PD.cipher); PD.decodeErr = null; }
  catch (e) { PD.decodeErr = String((e && e.message) || e); }
  /* 文本 → 字节 → 文本 不丢东西，是这一页往返的地基（crypto-core 为此
     刻意让 toBytes 在落单代理上抛，而不是悄悄换成 U+FFFD）。 */
  PD.roundTrip = (CC.fromBytes(CC.toBytes(MSG)) === MSG);
  return PD;
}

/* ---- perfect 页：一份**钉死**的密文 ----
   页面载入时算一次就不再变。使用者换候选明文时变的是密钥，不是密文——
   这正是这一页的全部论点：密文一动不动，而每一段候选都配得上它。 */
const FIXED = (function () {
  const plain = CC.toBytes(T_PANGRAM);
  const key = OTP.makeKey(OTP.seededRng(SEED_FIXED), plain.length);
  return { plain: plain, key: key, cipher: OTP.encrypt(plain, key), n: plain.length };
})();

const CAND_PRESETS = [
  /* 标签**不透露**哪一段是真的：那正是这一页要使用者亲身体会的事——
     密文对此一言不发。想知道答案要自己开"答案"那个开关。 */
  { id: 'quote', text: T_QUOTE,
    label: { en: 'I came I saw…', zh: 'I came I saw…' } },
  { id: 'pangram', text: T_PANGRAM,
    label: { en: 'The quick brown…', zh: 'The quick brown…' } },
  { id: 'aaa', text: new Array(FIXED.n + 1).join('a'),
    label: { en: 'aaaa… (' + FIXED.n + ')', zh: 'aaaa…（' + FIXED.n + '）' } },
  { id: 'meet', text: 'Meet me at the north bridge at midnight and bring the second envelope with you',
    label: { en: 'Meet me at the…', zh: 'Meet me at the…' } }
];

function perfectState() {
  const flip = E.state.showFlip ? Math.round(E.state.flipAt || 0) : -1;
  const sig = CAND + '|' + flip;
  if (PF.sig === sig) return PF;
  PF.sig = sig;
  PF.n = FIXED.n;
  const raw = safeBytes(CAND) || new Uint8Array(0);
  PF.fit = OTP.fitBytes(raw, PF.n);
  PF.cand = PF.fit.bytes;
  /* 构造性完美保密：这一步就是全部。密钥不是"被找到的"，是**被解出来的**——
     任给一段等长候选，k = c XOR p 一定存在，而且唯一。 */
  PF.key = OTP.keyFor(PF.cand, FIXED.cipher);
  PF.flipAt = flip;
  /* 反证控制：把这把密钥改坏一个比特。上面那句"一定吻合"如果是恒真的，
     改坏之后也该吻合——它不吻合，所以那句话是有内容的。
     翻的是该字节的第 3 位（MSB 计数），一个固定但任意的选择。 */
  PF.useKey = (flip >= 0)
    ? OTP.flipBit(PF.key, E.clamp(flip, 0, PF.n - 1) * 8 + 3)
    : PF.key;
  PF.back = OTP.decrypt(FIXED.cipher, PF.useKey);
  PF.cmp = OTP.compare(PF.back, PF.cand);
  PF.isReal = OTP.compare(PF.cand, FIXED.plain).equal;
  return PF;
}

/* ---- reuse 页：同一把密钥，两段报文 ----
   两段明文都取自 examples/，截到同样长度——一次一密的每一条都要求长度对齐，
   而"长度不等就抛"是 xorBytes 的硬约定（见 crypto-core 里那段注释）。 */
const REUSE = (function () {
  const a = CC.toBytes(T_PANGRAM), b = CC.toBytes(T_QUOTE);
  const n = Math.min(a.length, b.length);
  const p1 = a.slice(0, n), p2 = b.slice(0, n);
  const key = OTP.makeKey(OTP.seededRng(SEED_REUSE), n);
  const c1 = OTP.encrypt(p1, key), c2 = OTP.encrypt(p2, key);
  const x = OTP.combine(c1, c2);
  /* 直接算 p1 XOR p2，与 c1 XOR c2 逐字节比。页面上印的"密钥消掉了"因此是一次
     **实测**，不是一句代数推导的转述。 */
  const direct = CC.xorBytes(p1, p2);
  return { n: n, p1: p1, p2: p2, key: key, c1: c1, c2: c2,
           x: x, direct: direct, cmp: OTP.compare(x, direct) };
})();

const CRIB_PRESETS = [
  { id: 'the', text: 'the', label: { en: 'the · 3', zh: 'the · 3' } },
  { id: 'the5', text: ' the ', label: { en: '" the " · 5', zh: '" the " · 5' } },
  { id: 'conq', text: 'conquered', label: { en: 'conquered · 9', zh: 'conquered · 9' } },
  { id: 'fox', text: ' brown fox ', label: { en: '" brown fox " · 11', zh: '" brown fox " · 11' } }
];

function reuseState() {
  const pick = Math.max(1, Math.round(E.state.rank || 1));
  const sig = CRIB + '|' + pick;
  if (RU.sig === sig) return RU;
  RU.sig = sig;
  RU.crib = safeBytes(CRIB) || CC.toBytes('the');
  RU.m = RU.crib.length;
  RU.drags = (RU.m && RU.m <= REUSE.n) ? OTP.cribDrag(REUSE.x, RU.crib) : [];
  RU.ranked = OTP.rankByScore(RU.drags, 8);
  /* 真相：crib 到底出现在哪一段的哪一处。页面拿它给柱子上色——"第一名不是真
     位置"必须一眼可见，而不是使用者事后才发现。攻击者当然没有这一列，
     所以它归在"答案"开关底下。 */
  RU.truth = {};
  if (RU.m) {
    OTP.occurrences(REUSE.p1, RU.crib).forEach(function (o) { RU.truth[o] = 1; });
    OTP.occurrences(REUSE.p2, RU.crib).forEach(function (o) { RU.truth[o] = (RU.truth[o] || 0) + 2; });
  }
  RU.truthCount = Object.keys(RU.truth).length;
  RU.trueRank = -1;
  const all = OTP.rankByScore(RU.drags);
  for (let i = 0; i < all.length; i++) {
    if (RU.truth[RU.drags[all[i]].offset]) { RU.trueRank = i + 1; break; }
  }
  RU.pick = pick;
  /* 并列第一的位置有几个——这是"这次猜测有没有信息"最直接的读数，比名次还
     直接：短 crib 的第一名是和一大群位置并列出来的，而并列本身就是没有信息。
     现算而不是写死一个数字：换一个 crib、换一段报文，它就该跟着变。 */
  RU.topScore = RU.ranked.length ? RU.drags[RU.ranked[0]].score : 0;
  RU.ties = 0;
  for (let i = 0; i < RU.drags.length; i++) {
    if (RU.drags[i].score === RU.topScore) RU.ties++;
  }
  RU.selIdx = RU.ranked.length ? RU.ranked[Math.min(pick, RU.ranked.length) - 1] : -1;
  RU.sel = RU.selIdx >= 0 ? RU.drags[RU.selIdx] : null;
  RU.selTrue = !!(RU.sel && RU.truth[RU.sel.offset]);
  return RU;
}

/* ================= 页签一：机制 ================= */
const pad = {
  label: { en: 'The pad', zh: '密钥本' },
  brand: { en: 'One byte of key per byte of message, XOR, done. The simplest cipher here — and the only unbreakable one.',
           zh: '报文每一个字节配一个字节的密钥，异或，完了。整本合集里最简单的密码 —— 也是唯一不可破的那个。' },
  tips: { en: 'Press ⏭ and watch one byte at a time: plain XOR key = cipher, bit by bit, against the truth table. Then switch the key source. Nothing about the operation changes — only the key does, and that is where all the strength was.',
          zh: '按 ⏭，一个字节一个字节地看：明文 XOR 密钥 = 密文，逐比特对着真值表。然后换一个密钥来源。运算一个字都没变 —— 变的只有密钥，而全部强度都在那儿。' },
  params: ['speed'],
  presets: KEY_PRESETS,
  presetsLabel: KEY_PRESETS_LABEL,
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showKey',   label: { en: 'Key row', zh: '密钥行' }, color: VIOLET, checked: true },
    { key: 'showBits',  label: { en: 'This byte in bits', zh: '这个字节的比特' }, color: CYAN, checked: true },
    { key: 'showTruth', label: { en: 'XOR truth table', zh: 'XOR 真值表' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'pad';
    const A = padState();
    tickClock(A.n);
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const pos = focusAt(A.n);
    const W = windowOf(B, A.n, pos, { want: vi.W > 760 ? 26 : 22 });

    /* ---- 先量，再画：各段高度先算出来，整块在可用区域里垂直居中 ---- */
    const nRows = 2 + (E.state.showKey ? 1 : 0);
    const rowH = 13 + W.cell + 9;
    const bitCell = E.clamp(Math.min(B.w, 320) / 9, 14, 30);
    const bitsH = E.state.showBits ? (16 + 3 * (bitCell + 4)) : 0;
    /* 真值表四条规则：宽了排一行，窄了排两行两列。**不能**只画放得下的那几条
       ——一张少一行的真值表不是"截断"，是错的。 */
    const truthCols = B.w >= 300 ? 4 : 2;
    const truthRows = 4 / truthCols;
    const truthH = E.state.showTruth ? (16 + truthRows * 22 + (truthRows - 1) * 4 + 2) : 0;
    const warnH = (KEYSRC === 'pad') ? 0 : 30;
    const totalH = 30 + warnH + nRows * rowH + 24 + bitsH + truthH + 28;
    let y = B.y + Math.max(0, (B.h - totalH) / 2);
    const dropped = [];

    /* ---- 规则条 ---- */
    bar(B, y, 26, 'c = p ⊕ k   ·   ' + E.t(KS().rule),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 13 });
    y += 30;

    /* ---- 三条使用条件里被违反的那一条 ----
       密钥来源不是"真正的密钥本"时必须**当场说破**。一个悄悄重复短密钥、或者
       悄悄拿英文当密钥的演示，教的正好是这一页的反面。 */
    if (warnH) {
      const msg = (KEYSRC === 'short')
        ? [E.t({ en: 'the key is ' + A.stretch.sourceLen + ' bytes and the message is ' + A.n +
                     ' — it repeats ' + A.stretch.cycles.toFixed(1) + '× · a repeating key, not a pad',
                 zh: '密钥 ' + A.stretch.sourceLen + ' 字节，报文 ' + A.n + ' 字节 —— 重复了 ' +
                     A.stretch.cycles.toFixed(1) + ' 遍 · 这是重复密钥，不是一次一密' }),
           E.t({ en: A.stretch.sourceLen + ' bytes of key, ' + A.n + ' of message — it repeats',
                 zh: '密钥 ' + A.stretch.sourceLen + ' 字节 / 报文 ' + A.n + ' 字节 —— 它在重复' })]
        : [E.t({ en: 'the key is English (' + A.fit.origLen + ' bytes' +
                     (A.fit.action === 'padded' ? ', padded' : '') + ') · ' +
                     A.stat.high + '/' + A.n + ' cipher bytes ≥ 0x80 — ASCII ⊕ ASCII never sets the top bit',
                 zh: '密钥是一段英文（' + A.fit.origLen + ' 字节' +
                     (A.fit.action === 'padded' ? '，补过空格' : '') + '）· 密文里 ' +
                     A.stat.high + '/' + A.n + ' 个字节 ≥ 0x80 —— ASCII ⊕ ASCII 置不起最高位' }),
           E.t({ en: 'English key · ' + A.stat.high + '/' + A.n + ' cipher bytes ≥ 0x80',
                 zh: '英文密钥 · 密文里 ' + A.stat.high + '/' + A.n + ' 个字节 ≥ 0x80' })];
      bar(B, y, 26, pickText(B, msg, 11),
             { mono: true, color: ORANGE, fontSize: 11,
               fill: 'rgba(251,146,60,.12)', stroke: 'rgba(251,146,60,.5)' });
      y += warnH;
    }

    /* ---- 字节行：明文 / 密钥 / 密文 ---- */
    const focus = function (i) { return i === pos; };
    /* 标签里放**文本本身**，格子里放字节。中文报文尤其需要这条分工：它的
        每个字节都 >= 0x80，用 glyphs() 投影出来是一整行 '·'，而那一行既不是
        文本也不是字节，只是一个误导。 */
    rowLabel(B, y, E.t({ en: 'plaintext bytes', zh: '明文字节' }) +
                   '   ' + clip(MSG, fitChars(B.w * 0.55, 10)), CYAN);
    y += 13;
    cellRow(W, y, function (i) {
      return { t: hex2(A.plain[i]), color: CYAN,
               fill: focus(i) ? 'rgba(45,212,234,.18)' : null,
               stroke: focus(i) ? CYAN : 'rgba(45,212,234,.30)', width: focus(i) ? 1.8 : 1 };
    });
    ellipses(B, W, y, W.cell);
    y += W.cell + 9;

    if (E.state.showKey) {
      rowLabel(B, y, E.t({ en: 'key bytes — one per message byte', zh: '密钥字节 —— 报文一个字节配一个' }), VIOLET);
      y += 13;
      cellRow(W, y, function (i) {
        /* 短密钥模式下把"第几轮重复"画出来：同一段密钥第二次出现时底色更淡，
           重复本身因此是看得见的，不是读出来的。 */
        const rep = A.stretch && i >= A.stretch.sourceLen;
        return { t: hex2(A.key[i]), color: rep ? ORANGE : VIOLET,
                 fill: focus(i) ? 'rgba(167,139,250,.22)'
                                : (rep ? 'rgba(251,146,60,.10)' : 'rgba(167,139,250,.07)'),
                 stroke: focus(i) ? VIOLET : (rep ? 'rgba(251,146,60,.45)' : 'rgba(167,139,250,.28)'),
                 width: focus(i) ? 1.8 : 1 };
      });
      y += W.cell + 9;
    }

    rowLabel(B, y, E.t({ en: 'ciphertext bytes — hex, because they are not text',
                         zh: '密文字节 —— 十六进制，因为它们不是文本' }), ROSE);
    y += 13;
    cellRow(W, y, function (i) {
      return { t: hex2(A.cipher[i]), color: ROSE,
               fill: focus(i) ? 'rgba(251,113,133,.20)' : 'rgba(251,113,133,.08)',
               stroke: focus(i) ? ROSE : 'rgba(251,113,133,.32)', width: focus(i) ? 1.8 : 1 };
    });
    y += W.cell + 9;

    /* 截断必须被说出来。窗口跟着播放头滚动，所以"看到的是第几到第几个字节"
       本身就是读数的一部分。 */
    bar(B, y, 18,
           E.t({ en: 'bytes ', zh: '字节 ' }) + (W.start + 1) + '–' +
           Math.min(A.n, W.start + W.n) + ' / ' + A.n +
           (W.truncated ? E.t({ en: '  (window scrolls with ⏵)', zh: '  （窗口跟着 ⏵ 滚动）' }) : ''),
           { mono: true, color: DIM, fontSize: 10 });
    y += 24;

    /* ---- 这个字节的比特 ---- */
    if (bitsH) {
      if (!room(B, y, bitsH)) { dropped.push(E.t({ en: 'bit view', zh: '比特视图' })); }
      else {
        const pb = CC.toBits([A.plain[pos]]);
        const kb = CC.toBits([A.key[pos]]);
        const cb = CC.toBits([A.cipher[pos]]);
        bar(B, y, 14,
               E.t({ en: 'byte #', zh: '第 ' }) + pos + E.t({ en: ' bit by bit — XOR acts on each bit alone',
                                                             zh: ' 个字节，逐比特 —— XOR 只在每一位上各管各的' }),
               { mono: true, color: DIM, fontSize: 10 });
        y += 16;
        const bx = B.x + 26;
        [[pb, CYAN, 'p'], [kb, VIOLET, 'k'], [cb, ROSE, 'c']].forEach(function (row, r) {
          const yy = y + r * (bitCell + 4);
          E.chip(B.x, yy, 22, bitCell, row[2], { color: row[1], fontSize: 12 });
          for (let i = 0; i < 8; i++) {
            const on = row[0][i] === 1;
            E.chip(bx + i * (bitCell + 3), yy, bitCell, bitCell, String(row[0][i]),
                   { color: on ? row[1] : DIM,
                     fill: on ? (r === 0 ? 'rgba(45,212,234,.16)' :
                                 r === 1 ? 'rgba(167,139,250,.16)' : 'rgba(251,113,133,.16)') : null,
                     stroke: on ? row[1] : LINE, fontSize: bitCell * 0.5 });
          }
          E.chip(bx + 8 * (bitCell + 3) + 6, yy, 46, bitCell,
                 '0x' + hex2(r === 0 ? A.plain[pos] : r === 1 ? A.key[pos] : A.cipher[pos]),
                 { color: row[1], fontSize: 11 });
        });
        y += 3 * (bitCell + 4);
      }
    }

    /* ---- XOR 真值表 ----
       四条规则各印一次，并数一数**这个字节**的 8 个比特里每条用了几次。
       真值表因此不是一张贴在旁边的图，而是当前这一步的分解。 */
    if (truthH) {
      if (!room(B, y, truthH)) { dropped.push(E.t({ en: 'truth table', zh: '真值表' })); }
      else {
        const pb = CC.toBits([A.plain[pos]]), kb = CC.toBits([A.key[pos]]);
        const used = [0, 0, 0, 0];
        for (let i = 0; i < 8; i++) used[pb[i] * 2 + kb[i]]++;
        bar(B, y, 14, E.t({ en: 'XOR — different bits give 1, equal bits give 0',
                                      zh: 'XOR —— 两位不同得 1，两位相同得 0' }),
               { mono: true, color: DIM, fontSize: 10 });
        y += 16;
        const tw = E.fitCells(B.w, truthCols, { gap: 6, min: 60, max: 150 });
        for (let i = 0; i < 4; i++) {
          const p = i >> 1, k = i & 1, v = p ^ k;
          const on = used[i] > 0;
          const col = i % truthCols, rw = Math.floor(i / truthCols);
          E.chip(B.x + col * (tw.cell + 6), y + rw * 26, tw.cell, 22,
                 p + ' ⊕ ' + k + ' = ' + v + (on ? '   ×' + used[i] : ''),
                 { color: on ? EMERALD : DIM,
                   fill: on ? 'rgba(52,211,153,.12)' : null,
                   stroke: on ? 'rgba(52,211,153,.45)' : LINE, fontSize: 11.5 });
        }
        y += truthRows * 26;
      }
    }

    /* ---- 往返 ---- */
    if (room(B, y, 26)) {
      const ok = A.cmp.equal && A.roundTrip;
      bar(B, y, 24, pickText(B, [
             E.t({ en: 'decrypt = XOR with the same key again · ' + A.cmp.same + '/' + A.cmp.n +
                       ' bytes back  ·  text→bytes→text is lossless',
                   zh: '解密 = 再异或一次同一把密钥 · ' + A.cmp.same + '/' + A.cmp.n +
                       ' 字节还原 · 文本→字节→文本 不丢东西' }),
             E.t({ en: 'decrypt = XOR again · ' + A.cmp.same + '/' + A.cmp.n + ' bytes back',
                   zh: '解密 = 再异或一次 · ' + A.cmp.same + '/' + A.cmp.n + ' 字节还原' })], 11),
             { mono: true, color: ok ? EMERALD : ORANGE, fontSize: 11,
               fill: ok ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.10)',
               stroke: ok ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.5)' });
      y += 28;
    }

    if (dropped.length) {
      bar(B, B.y + B.h - 16, 14,
             E.t({ en: 'not enough height for: ', zh: '高度不够，已隐藏：' }) + dropped.join(' · '),
             { mono: true, color: ORANGE, fontSize: 10 });
    }
  },
  readout: function () {
    syncIo();
    const A = padState();
    const pos = focusAt(A.n);
    let s = '<b style="--c:var(--trace-violet)">' + esc(E.t(KS().label)) + '</b>' +
      '<span class="dim">  c = p ⊕ k</span><br>' +
      E.t({ en: 'byte ', zh: '第 ' }) + pos + E.t({ en: ' of ', zh: ' 个字节 / 共 ' }) + A.n + '<br>' +
      '<b style="--c:var(--trace-cyan)">' + hex2(A.plain[pos]) + '</b>' +
      ' <span class="dim">⊕</span> ' +
      '<b style="--c:var(--trace-violet)">' + hex2(A.key[pos]) + '</b>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)">' + hex2(A.cipher[pos]) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(clip(CC.toHex(A.cipher), RO_RUN)) + '</b><br>';
    /* 密文不是文本这件事是**当场验的**（padState 里真的调了一次 fromBytes）。
       core 抛出的原文是中文，所以只在中文界面里附上它：英文界面里贴一句中文
       报错，读者只会以为页面坏了。事实本身（抛了没抛）两种语言都是同一个测量。 */
    s += '<span class="dim">' +
      (A.decodeErr
        ? (isZh()
          ? '把密文当文本解码会抛错：' + esc(clip(A.decodeErr, 60))
          : 'decoding the cipher as text throws — CryptoCore.fromBytes rejects invalid UTF-8 rather than emitting U+FFFD, so ciphertext is shown as hex')
        : E.t({ en: 'this cipher happens to be valid UTF-8 — that is luck, not a rule',
                zh: '这份密文碰巧是合法 UTF-8 —— 那是运气，不是规律' })) +
      '</span><br>';
    s += '<span class="dim">' + E.t({ en: 'bytes ≥ 0x80: ', zh: '≥ 0x80 的字节：' }) + '</span>' +
      '<b style="--c:var(--trace-' + (KEYSRC === 'pad' ? 'emerald' : 'orange') + ')">' +
      A.stat.high + '/' + A.n + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: 'a real pad puts it near half; an English key puts it at zero',
            zh: '真密钥本会让它接近一半；英文密钥会让它是 0' }) + '</span><br>';
    if (KEYSRC === 'pad') {
      s += '<b style="--c:var(--trace-emerald)">' +
        E.t({ en: 'as long as the message · random · used once',
              zh: '与报文一样长 · 随机 · 只用一次' }) + '</b><br>';
    } else {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'this is no longer a one-time pad', zh: '这已经不是一次一密了' }) + '</b>' +
        '<span class="dim">  ' + esc(E.t(KS().rule)) + '</span>';
      if (KEYSRC === 'english') {
        s += '<br><span class="dim">' +
          E.t({ en: 'chapter 1 again: the running key fell because the key was English — not because it was short',
                zh: '又回到第 1 章：滚动密钥输在密钥是<b>英文</b>，不是输在密钥短' }) + '</span>';
      }
      s += '<br>';
    }
    /* 这一句**不分支**：不管当前选的是哪一种密钥来源，这个页面用的都是同一个
       带种子的伪随机发生器。原先它只写在"真正的密钥本"那一支里，于是使用者
       切到另外两支之后，页面上就再没有任何一处说过"这不是真随机"——而那正是
       最容易让人误以为"这个工具能生成一次性密码本"的时候。 */
    s += '<span class="dim">' +
      E.t({ en: 'the randomness here is a seeded PRNG, for reproducibility — NOT a cryptographic RNG. This page cannot make real pads.',
            zh: '这里的随机数是一个<b>带种子的伪随机发生器</b>，为了可复现 —— 它不是密码学随机数发生器，这个页面造不出真正的密钥本。' }) +
      '</span>';
    return s;
  }
};
/* ================= 页签二：完美保密 —— 顿悟视角 =================
   钉住一份密文，让使用者随便给一段等长的候选明文。页面倒推出"要得到这份密文，
   密钥必须是什么"，再用那把密钥解密——**正好落回那段候选**，一个字节不差。

   这就是完美保密的全部内容，而且它是**构造性**的：不是"攻击者算不出来"，
   是"每一段等长明文都同样成立"。密文里没有可攻击的东西，因为里面什么都没有。
   Shannon 那句 H(P | C) = H(P) 讲的就是这件事：看过密文之后，关于明文你知道的
   一点也不比看之前多。

   ⚠ 恰恰因为"一定吻合"太顺，这一页必须自带**反证控制**：把倒推出的密钥改坏
   一个比特，匹配立刻断掉。没有那一步，"117/117 吻合"与一个什么都没做的空循环
   长得一模一样——这个项目在测试里为此翻过车。 */
const perfect = {
  label: { en: 'Perfect secrecy', zh: '完美保密' },
  brand: { en: 'One fixed ciphertext. Every plaintext of that length has a key that produces it — so the ciphertext rules out nothing.',
           zh: '一份钉死的密文。每一段等长的明文都有一把密钥能产出它 —— 所以这份密文什么也没排除。' },
  tips: { en: 'The epiphany view. Type ANY candidate plaintext, or click a preset: the key row changes, the ciphertext does not, and the decryption lands exactly on your candidate. Then switch on the counter-control — one broken bit in the key and the match dies, which is how you know the match meant something.',
          zh: '顿悟视角。随便打一段候选明文，或点一个预置：密钥那一行变了，密文一动不动，而解密结果正好落在你的候选上。然后打开反证控制 —— 把密钥改坏一个比特，匹配立刻断掉，这才说明刚才那个吻合是有内容的。' },
  params: ['flipAt', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showKeyRow', label: { en: 'Required key', zh: '所需密钥' }, color: VIOLET, checked: true },
    { key: 'showFlip',   label: { en: 'Counter-control: break one bit', zh: '反证：改坏一个比特' }, color: ORANGE, checked: false },
    { key: 'showAnswer', label: { en: 'Answer key', zh: '答案' }, color: EMERALD, checked: false }
  ],
  draw: function () {
    CUR = 'perfect';
    const F = perfectState();
    tickClock(F.n);
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const pos = focusAt(F.n);
    const W = windowOf(B, F.n, pos, { want: vi.W > 760 ? 30 : 26 });

    const nRows = 3 + (E.state.showKeyRow ? 1 : 0);
    const rowH = 13 + W.cell + 9;
    const totalH = 30 + nRows * rowH + 22 + 30 + 22 + (E.state.showAnswer ? 22 : 0);
    let y = B.y + Math.max(0, (B.h - totalH) / 2);
    const dropped = [];

    bar(B, y, 26, pickText(B, [
           'k = c ⊕ p*      c ⊕ k = p*   ·   ' +
           E.t({ en: 'pick any candidate p*, the key follows', zh: '任给一段候选 p*，密钥自己就定下来了' }),
           'k = c ⊕ p*   ·   c ⊕ k = p*'], 12.5),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 12.5 });
    y += 30;

    /* ---- 密文：一动不动 ---- */
    rowLabel(B, y, E.t({ en: 'the ciphertext — fixed, ' + F.n + ' bytes',
                         zh: '密文 —— 钉死的，' + F.n + ' 字节' }), ROSE);
    y += 13;
    cellRow(W, y, function (i) {
      return { t: hex2(FIXED.cipher[i]), color: ROSE, fill: 'rgba(251,113,133,.08)',
               stroke: i === pos ? ROSE : 'rgba(251,113,133,.32)', width: i === pos ? 1.8 : 1 };
    });
    ellipses(B, W, y, W.cell);
    y += W.cell + 9;

    /* ---- 候选明文 ---- */
    rowLabel(B, y, E.t({ en: 'your candidate plaintext', zh: '你的候选明文' }) +
                   '   ' + clip(CAND, fitChars(B.w * 0.55, 10)), CYAN);
    y += 13;
    cellRow(W, y, function (i) {
      return { t: hex2(F.cand[i]), color: CYAN, fill: i === pos ? 'rgba(45,212,234,.18)' : null,
               stroke: i === pos ? CYAN : 'rgba(45,212,234,.30)', width: i === pos ? 1.8 : 1 };
    });
    y += W.cell + 9;

    /* ---- 所需密钥 ---- */
    if (E.state.showKeyRow) {
      rowLabel(B, y, E.t({ en: 'the key this candidate requires', zh: '这段候选所要求的密钥' }) +
                     (F.flipAt >= 0 ? E.t({ en: '  ·  byte #' + F.flipAt + ' broken on purpose',
                                            zh: '  ·  第 ' + F.flipAt + ' 个字节被故意改坏' }) : ''),
               VIOLET);
      y += 13;
      cellRow(W, y, function (i) {
        const broken = (F.flipAt === i);
        return { t: hex2(F.useKey[i]), color: broken ? ORANGE : VIOLET,
                 fill: broken ? 'rgba(251,146,60,.20)' : 'rgba(167,139,250,.07)',
                 stroke: broken ? ORANGE : (i === pos ? VIOLET : 'rgba(167,139,250,.28)'),
                 width: (broken || i === pos) ? 1.8 : 1 };
      });
      y += W.cell + 9;
    }

    /* ---- 用那把密钥解密 ---- */
    rowLabel(B, y, E.t({ en: 'decrypt with it — byte by byte against your candidate',
                         zh: '用它解密 —— 逐字节与你的候选比对' }), F.cmp.equal ? EMERALD : ORANGE);
    y += 13;
    cellRow(W, y, function (i) {
      const same = F.back[i] === F.cand[i];
      return { t: hex2(F.back[i]), color: same ? EMERALD : ORANGE,
               fill: same ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.22)',
               stroke: same ? 'rgba(52,211,153,.40)' : ORANGE, width: same ? 1 : 1.8 };
    });
    y += W.cell + 9;

    bar(B, y, 18,
           E.t({ en: 'bytes ', zh: '字节 ' }) + (W.start + 1) + '–' +
           Math.min(F.n, W.start + W.n) + ' / ' + F.n +
           (W.truncated ? E.t({ en: '  (window scrolls with ⏵)', zh: '  （窗口跟着 ⏵ 滚动）' }) : ''),
           { mono: true, color: DIM, fontSize: 10 });
    y += 22;

    /* ---- 判词 ---- */
    const ok = F.cmp.equal;
    bar(B, y, 26, pickText(B,
           ok ? [F.cmp.same + '/' + F.cmp.n +
                 E.t({ en: ' bytes match — this candidate is fully consistent with that ciphertext',
                       zh: ' 字节全部吻合 —— 这段候选与那份密文完全相容' }),
                 F.cmp.same + '/' + F.cmp.n + E.t({ en: ' bytes match', zh: ' 字节全部吻合' })]
              : [F.cmp.same + '/' + F.cmp.n +
                 E.t({ en: ' match · first difference at byte #' + F.cmp.firstDiff +
                           ' — one broken bit is all it takes',
                       zh: ' 吻合 · 第一处不同在第 ' + F.cmp.firstDiff +
                           ' 个字节 —— 改坏一个比特就够了' }),
                 F.cmp.same + '/' + F.cmp.n +
                 E.t({ en: ' · broken at #' + F.cmp.firstDiff,
                       zh: ' · 第 ' + F.cmp.firstDiff + ' 个字节起断了' })], 11.5),
           { mono: true, color: ok ? EMERALD : ORANGE, fontSize: 11.5,
             fill: ok ? 'rgba(52,211,153,.12)' : 'rgba(251,146,60,.12)',
             stroke: ok ? 'rgba(52,211,153,.5)' : 'rgba(251,146,60,.5)' });
    y += 30;

    /* 2^(8n) 那个数字现算：它就是"这份密文与多少段明文相容"的答案。 */
    if (room(B, y, 20)) {
      bar(B, y, 18,
             E.t({ en: 'every one of the 2^' + (8 * F.n) + ' byte strings of this length has its own key',
                   zh: '这个长度的 2^' + (8 * F.n) + ' 种字节串，每一种都有自己的一把密钥' }),
             { mono: true, color: DIM, fontSize: 10.5 });
      y += 22;
    }

    /* ---- 答案 ----
       只有开了这个开关才说哪一段是真的。因为这一页的整个论点就是：**密文
       不说**。让页面自己先闭嘴，比让页面讲道理有说服力。 */
    if (E.state.showAnswer && room(B, y, 22)) {
      bar(B, y, 20,
             E.t({ en: 'the plaintext actually used was: ', zh: '真正被加密的那一段是：' }) +
             clip(glyphs(FIXED.plain, 0, fitChars(B.w, 11) - 20), 90),
             { mono: true, color: EMERALD, fontSize: 11 });
      y += 22;
    }
    if (dropped.length) {
      bar(B, B.y + B.h - 16, 14,
             E.t({ en: 'not enough height for: ', zh: '高度不够，已隐藏：' }) + dropped.join(' · '),
             { mono: true, color: ORANGE, fontSize: 10 });
    }
  },
  readout: function () {
    syncIo();
    const F = perfectState();
    let s = '<span class="dim">' + E.t({ en: 'ciphertext ', zh: '密文 ' }) + F.n +
      E.t({ en: ' bytes · fixed', zh: ' 字节 · 钉死的' }) + '</span><br>' +
      '<b style="--c:var(--trace-rose)">' + esc(clip(CC.toHex(FIXED.cipher), RO_RUN)) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'your candidate ', zh: '你的候选 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + esc(clip(CAND, RO_RUN)) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'required key ', zh: '所需密钥 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + esc(clip(CC.toHex(F.key), RO_RUN)) + '</b><br>';
    if (F.cmp.equal) {
      s += '<b style="--c:var(--trace-emerald)">' + F.cmp.same + '/' + F.cmp.n +
        E.t({ en: ' bytes match', zh: ' 字节吻合' }) + '</b><br>' +
        '<span class="dim">' +
        E.t({ en: 'perfect secrecy is not "hard" — it is "no information". The ciphertext is equally consistent with every plaintext of its length.',
              zh: '完美保密不是「难」，是「没有信息」。这份密文与每一段等长明文都同样相容。' }) +
        '</span>';
    } else {
      s += '<b style="--c:var(--trace-orange)">' + F.cmp.same + '/' + F.cmp.n +
        E.t({ en: ' — broken at byte #', zh: ' —— 第 ' }) + F.cmp.firstDiff +
        E.t({ en: '', zh: ' 个字节起断了' }) + '</b><br>' +
        '<span class="dim">' +
        E.t({ en: 'the counter-control: with one bit of the key changed the match dies, so the match was not vacuous.',
              zh: '反证控制：密钥改一个比特，匹配立刻断掉 —— 所以刚才那个吻合不是恒真。' }) +
        '</span>';
    }
    s += '<br><span class="dim">' +
      (E.state.showAnswer
        ? (F.isReal
          ? E.t({ en: 'and this candidate happens to be the one that was used',
                  zh: '而这一段恰好就是被用过的那一段' })
          : E.t({ en: 'this candidate is not the one that was used — and the ciphertext still cannot tell you that',
                  zh: '这一段不是被用过的那一段 —— 而密文照样说不出这句话' }))
        : E.t({ en: 'which candidate was really used? The ciphertext does not say. Neither does this page, until you ask.',
                zh: '到底哪一段是真的？密文不说。这个页面也不说，除非你去问它。' })) +
      '</span>';
    return s;
  }
};

/* ================= 页签三：重用 =================
   同一把密钥加密两段报文。异或两份密文，密钥自己消掉：

       c1 ⊕ c2 = (p1 ⊕ k) ⊕ (p2 ⊕ k) = p1 ⊕ p2

   剩下的东西一点都不神秘，它就是**两段英文加在一起**——也就是第 1 章那个已经
   倒过的滚动密钥。把一个猜测的词沿着它拖过去，猜中一段，另一段自己掉出来。
   真实世界里的 Venona、PS3 的 ECDSA、WEP 的 IV 碰撞，都是这一条。 */
const reuse = {
  label: { en: 'Reuse', zh: '重用' },
  brand: { en: 'Two messages, one key. XOR the two ciphertexts and the key vanishes — what is left is the two plaintexts added together.',
           zh: '两段报文，一把密钥。把两份密文异或，密钥自己消失 —— 剩下的是两段明文加在一起。' },
  tips: { en: 'The key cancels: C1 ⊕ C2 is byte-for-byte equal to P1 ⊕ P2, checked live above. Now drag a crib along it with the candidate slider. Watch the tie count in the readout: "the" ties with 21 other offsets, " brown fox " ties with none — length is what turns a guess into evidence.',
          zh: '密钥消掉了：C1 ⊕ C2 与 P1 ⊕ P2 逐字节相同，上面那条判词是当场验的。然后用候选滑杆把 crib 沿着它拖过去，看读数里那个「并列第一」的数字：the 与另外 21 个位置并列，而 " brown fox " 一个并列都没有 —— 长度才让一次猜测变成证据。' },
  params: ['rank', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showDrag',  label: { en: 'Score per offset', zh: '每个位置的分数' }, color: EMERALD, checked: true },
    { key: 'showPeel',  label: { en: 'What one guess opens', zh: '一次猜对打开了什么' }, color: CYAN, checked: true },
    { key: 'showXrows', label: { en: 'The three byte rows', zh: '三行字节' }, color: ROSE, checked: true }
  ],
  draw: function () {
    CUR = 'reuse';
    const R = reuseState();
    tickClock(REUSE.n);
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const pos = focusAt(REUSE.n);
    const dropped = [];
    let y = B.y;

    bar(B, y, 26, pickText(B, ['c1 ⊕ c2 = (p1 ⊕ k) ⊕ (p2 ⊕ k) = p1 ⊕ p2',
                               'c1 ⊕ c2 = p1 ⊕ p2'], 13),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 13 });
    y += 30;

    /* 密钥真的消掉了吗？逐字节比一次，把结果印出来——不是转述代数，是实测。 */
    const gone = REUSE.cmp.equal;
    bar(B, y, 24, pickText(B, [
           E.t({ en: 'the key is gone: ' + REUSE.cmp.same + '/' + REUSE.cmp.n +
                     ' bytes of C1 ⊕ C2 equal P1 ⊕ P2 exactly',
                 zh: '密钥消掉了：' + REUSE.cmp.same + '/' + REUSE.cmp.n +
                     ' 个字节上 C1 ⊕ C2 与 P1 ⊕ P2 完全相同' }),
           E.t({ en: 'key gone · C1 ⊕ C2 = P1 ⊕ P2 on ' + REUSE.cmp.same + '/' + REUSE.cmp.n,
                 zh: '密钥消掉了 · C1 ⊕ C2 = P1 ⊕ P2 ' + REUSE.cmp.same + '/' + REUSE.cmp.n })], 11.5),
           { mono: true, color: gone ? EMERALD : ORANGE, fontSize: 11.5,
             fill: gone ? 'rgba(52,211,153,.12)' : 'rgba(251,146,60,.12)',
             stroke: gone ? 'rgba(52,211,153,.5)' : 'rgba(251,146,60,.5)' });
    y += 28;

    /* ---- 拖词 ----
       柱子数 = 位置数，横向铺满：这是"整条 C1 ⊕ C2 都被拖过一遍"的直接图像。
       **必须显式给 max**：分数本来就落在 [0,1]，锁成 1 之后柱子高度在动画里
       才不会因为每帧最大值变化而整体跳。 */
    if (E.state.showDrag) {
      const barH = E.clamp(B.h * 0.20, 46, 96);
      if (!R.drags.length) {
        bar(B, y, 26,
               E.t({ en: 'the crib is longer than the message — nothing to drag',
                     zh: 'crib 比报文还长 —— 没得拖' }),
               { mono: true, color: ORANGE, fontSize: 11.5,
                 fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.4)' });
        y += 30;
      } else if (!room(B, y, barH + 40)) {
        dropped.push(E.t({ en: 'the score chart', zh: '分数图' }));
      } else {
        E.chip(B.x, y, Math.min(360, B.w), 14,
               R.drags.length + E.t({ en: ' offsets · taller = more like English text',
                                      zh: ' 个位置 · 越高 = 越像英文' }),
               { mono: true, color: DIM, fontSize: 10 });
        y += 16;
        E.barChart(B.x, y, B.w, barH, R.drags.map(function (d) { return d.score; }), {
          max: 1, gap: 0,
          colorAt: function (i) {
            const off = R.drags[i].offset;
            if (R.sel && off === R.sel.offset) return EMERALD;
            if (R.truth[off]) return 'rgba(45,212,234,.85)';
            return 'rgba(251,113,133,.28)';
          }
        });
        seg(B.x, y + barH, B.x + B.w, y + barH, { color: LINE, width: 1 });
        y += barH + 18;
      }
    }

    /* ---- 排名 ---- */
    if (R.drags.length) {
      const rowH = 17;
      const maxRows = Math.max(0, Math.floor((B.y + B.h - y - 96) / rowH));
      const showN = Math.min(R.ranked.length, Math.max(0, maxRows));
      const chars = fitChars(Math.max(60, B.w - 116), 11.5);
      for (let i = 0; i < showN; i++) {
        const d = R.drags[R.ranked[i]];
        const isSel = (R.sel && d.offset === R.sel.offset);
        const isTrue = !!R.truth[d.offset];
        E.chip(B.x, y + i * rowH, 32, rowH, '#' + (i + 1),
               { color: isSel ? EMERALD : DIM, fontSize: 10.5, mono: true });
        E.chip(B.x + 34, y + i * rowH, 44, rowH, String(d.offset),
               { color: DIM, fontSize: 10.5, mono: true });
        E.chip(B.x + 80, y + i * rowH, 34, rowH, d.score.toFixed(2),
               { color: DIM, fontSize: 10, mono: true });
        /* 高亮条与文字分开画：E.chip 把文字**居中**放在给定的框里，所以一个
           占满整行宽度的框会把这段 derived 甩到行中间去，八行长短不一的结果
           读起来像一堆散落的碎句。框只管高亮，文字自己贴着左边。 */
        if (isSel) {
          E.chip(B.x + 112, y + i * rowH, Math.max(64, B.w - 112), rowH, '',
                 { fill: 'rgba(52,211,153,.10)', stroke: 'rgba(52,211,153,.45)' });
        }
        const txt = clip(glyphs(d.bytes, 0, chars), chars) + (isTrue ? '   ✓' : '');
        E.chip(B.x + 116, y + i * rowH, Math.min(B.w - 116, textW(txt, 12) + 8), rowH, txt,
               { color: isSel ? EMERALD : (isTrue ? CYAN : SLATE), fontSize: 12 });
      }
      if (showN < R.ranked.length) {
        dropped.push(E.t({ en: 'ranks ' + (showN + 1) + '–' + R.ranked.length,
                           zh: '第 ' + (showN + 1) + '–' + R.ranked.length + ' 名' }));
      }
      y += showN * rowH + 8;
    }

    /* ---- 一次猜对打开了什么 ----
       两行：上面一行假设 crib 就在这儿（那是猜测），下面一行是**因此**掉出来的
       另一段明文。两段都是英文，所以读得通就是对，读不通就是错——攻击者手里
       只有这一条判据，页面也只给这一条。 */
    if (E.state.showPeel && R.sel) {
      /* 两行必须**逐字对齐**：这一段的全部意思就是"上面猜的那几个字符，正好
         对着下面掉出来的那几个"。页面上没有等宽字体可用（引擎只给 serif 与
         sans 两个字体栈，都是比例字体），所以这两行走格子而不是走整行文字——
         比例字体下两行同长度的字符串宽度并不相同，肉眼一看就是错位的。 */
      const WC = windowOf(B, REUSE.n, R.sel.offset + Math.floor(R.m / 2),
                          { want: 24, min: 15 });
      const need = 16 + 2 * (WC.cell + 4) + 20;
      if (!room(B, y, need)) {
        dropped.push(E.t({ en: 'the peel rows', zh: '剥开的两行' }));
      } else {
        const charAt = function (i, which) {
          const k = i - R.sel.offset;
          if (k < 0 || k >= R.m) return '·';
          const b = which === 0 ? R.crib[k] : R.sel.bytes[k];
          return (b >= 0x20 && b < 0x7f) ? String.fromCharCode(b) : '·';
        };
        bar(B, y, 14,
               E.t({ en: 'guess: message 1 has your crib at offset ', zh: '猜测：第 1 段报文的第 ' }) +
               R.sel.offset + E.t({ en: '', zh: ' 位是你的 crib' }),
               { mono: true, color: DIM, fontSize: 10 });
        y += 16;
        cellRow(WC, y, function (i) {
          const on = (i >= R.sel.offset && i < R.sel.offset + R.m);
          return { t: charAt(i, 0), color: on ? VIOLET : DIM, scale: 0.62,
                   stroke: on ? 'rgba(167,139,250,.45)' : null,
                   fill: on ? 'rgba(167,139,250,.10)' : null };
        });
        y += WC.cell + 4;
        cellRow(WC, y, function (i) {
          const on = (i >= R.sel.offset && i < R.sel.offset + R.m);
          const col = R.selTrue ? EMERALD : SLATE;
          return { t: charAt(i, 1), color: on ? col : DIM, scale: 0.62,
                   stroke: on ? (R.selTrue ? 'rgba(52,211,153,.45)' : LINE) : null,
                   fill: on && R.selTrue ? 'rgba(52,211,153,.10)' : null };
        });
        y += WC.cell + 4;
        bar(B, y, 16, pickText(B,
               R.selTrue
                 ? [E.t({ en: '↑ message 2 falls out of the guess · this offset is a real occurrence',
                          zh: '↑ 第 2 段报文从这次猜测里掉了出来 · 这个位置是真的' }),
                    E.t({ en: '↑ message 2 falls out · a real occurrence',
                          zh: '↑ 第 2 段报文掉了出来 · 这里是真的' })]
                 : [E.t({ en: '↑ what falls out is not English — that is how you reject this offset',
                          zh: '↑ 掉出来的读不通 —— 你就是靠这个把这个位置排除掉的' }),
                    E.t({ en: '↑ not English — so you reject this offset',
                          zh: '↑ 读不通 —— 于是排除掉这个位置' })], 10),
               { mono: true, color: R.selTrue ? EMERALD : DIM, fontSize: 10 });
        y += 20;
      }
    }

    /* ---- 三行字节：放在最后，空间不够时第一个被让出去 ---- */
    if (E.state.showXrows) {
      const W = windowOf(B, REUSE.n, pos, { want: vi.W > 760 ? 30 : 26 });
      const need = 3 * (13 + W.cell + 6) + 4;
      if (!room(B, y, need)) {
        dropped.push(E.t({ en: 'the three byte rows', zh: '三行字节' }));
      } else {
        [[REUSE.c1, ROSE, { en: 'C1 = P1 ⊕ K', zh: 'C1 = P1 ⊕ K' }],
         [REUSE.c2, ORANGE, { en: 'C2 = P2 ⊕ K   (same K)', zh: 'C2 = P2 ⊕ K（同一把 K）' }],
         [REUSE.x, VIOLET, { en: 'C1 ⊕ C2 = P1 ⊕ P2   (no K left)', zh: 'C1 ⊕ C2 = P1 ⊕ P2（K 没有了）' }]
        ].forEach(function (row) {
          rowLabel(B, y, E.t(row[2]), row[1]);
          y += 13;
          cellRow(W, y, function (i) {
            return { t: hex2(row[0][i]), color: row[1],
                     stroke: i === pos ? row[1] : LINE, width: i === pos ? 1.8 : 1 };
          });
          y += W.cell + 6;
        });
        ellipses(B, W, y - W.cell - 6, W.cell);
      }
    }

    if (dropped.length) {
      bar(B, B.y + B.h - 16, 14,
             E.t({ en: 'not enough height for: ', zh: '高度不够，已隐藏：' }) + dropped.join(' · '),
             { mono: true, color: ORANGE, fontSize: 10 });
    }
  },
  readout: function () {
    syncIo();
    const R = reuseState();
    let s = '<span class="dim">' + REUSE.n +
      E.t({ en: ' bytes each · one key, used twice', zh: ' 字节 · 一把密钥，用了两次' }) +
      '</span><br>' +
      '<b style="--c:var(--trace-emerald)">' + REUSE.cmp.same + '/' + REUSE.cmp.n + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: 'bytes of C1 ⊕ C2 equal P1 ⊕ P2 — the key cancelled',
            zh: ' 个字节上 C1 ⊕ C2 = P1 ⊕ P2 —— 密钥抵消了' }) + '</span><br>';
    if (!R.drags.length) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'the crib is longer than the message', zh: 'crib 比报文还长' }) + '</b>';
    }
    s += E.t({ en: 'crib ', zh: 'crib ' }) +
      '<b style="--c:var(--trace-violet)">' + esc(clip(CRIB, 18)) + '</b>' +
      '<span class="dim">  ' + R.m + E.t({ en: ' bytes · ', zh: ' 字节 · ' }) +
      R.drags.length + E.t({ en: ' offsets', zh: ' 个位置' }) + '</span><br>' +
      E.t({ en: 'a real occurrence ranks ', zh: '真实出现的位置排在第 ' }) +
      '<b style="--c:var(--trace-cyan)">' + (R.trueRank > 0 ? '#' + R.trueRank : '—') + '</b>' +
      '<span class="dim">  ' + R.truthCount +
      E.t({ en: R.truthCount === 1 ? ' real occurrence in the two messages'
                                   : ' real occurrences in the two messages',
            zh: ' 处真实出现' }) + '</span><br>' +
      E.t({ en: 'you are looking at ', zh: '你正在看第 ' }) +
      '<b style="--c:var(--trace-emerald)">#' + Math.min(R.pick, R.ranked.length) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'offset ', zh: '位置 ' }) +
      (R.sel ? R.sel.offset : '—') + ' · ' +
      E.t({ en: 'score ', zh: '分数 ' }) + (R.sel ? R.sel.score.toFixed(3) : '—') + '</span><br>' +
      '<b style="--c:var(--trace-' + (R.selTrue ? 'emerald' : 'slate') + ')">' +
      esc(R.sel ? glyphs(R.sel.bytes, 0, RO_RUN) : '') + '</b>' +
      (R.selTrue ? '<span class="dim">  ' + E.t({ en: '· real', zh: '· 是真的' }) + '</span>' : '') +
      '<br><span class="dim">' + E.t({ en: 'offsets tied for first: ', zh: '并列第一的位置：' }) + '</span>' +
      '<b style="--c:var(--trace-' + (R.ties > 1 ? 'orange' : 'emerald') + ')">' + R.ties + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: R.ties > 1 ? 'a tie is not evidence — use a longer crib'
                           : 'no tie — this crib is long enough to decide',
            zh: R.ties > 1 ? '并列就是没有信息 —— 换一个更长的 crib'
                           : '没有并列 —— 这个 crib 长到足以定案' }) + '</span>' +
      '<br><span class="dim">' +
      E.t({ en: '"one-time" is not advice. It is the entire security argument.',
            zh: '「一次」不是建议。它就是全部的安全性论证。' }) + '</span>';
    return s;
  }
};

var SCENES = { pad: pad, perfect: perfect, reuse: reuse };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中第一个
   密钥来源并调它的 onSelect，而那之后第一帧就会调 padState() 去读 MSG / KEYSRC。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
