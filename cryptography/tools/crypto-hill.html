     画面保持在上一把合法的密钥上，下面那行注记如实写着还差几个字母。 */
  keyInput.value = KEYS[curK()];
  keyInput.addEventListener('input', function () {
    const k = curK();
    const s = CC.normalize(keyInput.value);
    if (s.length >= k * k) KEYS[k] = s;
  });

  const row = document.getElementById('keyBtns');
  [['textbook', { en: 'Textbook', zh: '教科书' }, function () { applyKeyPreset('textbook'); }],
   ['fold2',    { en: 'Fold ×2',  zh: '折叠 ×2' }, function () { applyKeyPreset('fold2'); }],
   ['fold13',   { en: 'Fold ×13', zh: '折叠 ×13' }, function () { applyKeyPreset('fold13'); }],
   ['random',   { en: 'Random',   zh: '随机' },    randomizeKey]
  ].forEach(function (d) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.addEventListener('click', d[2]);
    row.appendChild(b);
    keyBtnDefs.push({ el: b, label: d[1] });
  });
}

/* #ioHost 的文案是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言切换
   不会自动重刷它。引擎在 applyLang() 末尾会调 updateReadout()，所以把这次
   同步挂在 readout() 里搭车——不管语言是怎么变的，readout 都会跟着重算一次。 */
function syncIoLabels() {
  const k = curK();
  if (ioLabel) {
    const s = E.t({ en: 'Plaintext — only letters are encrypted',
                    zh: '明文 —— 只有字母参与加密' });
    if (ioLabel.textContent !== s) ioLabel.textContent = s;
  }
  if (keyLabel) {
    const s = E.t({ en: 'Key — ' + (k * k) + ' letters, read row by row',
                    zh: '密钥 —— ' + (k * k) + ' 个字母，按行读入' });
    if (keyLabel.textContent !== s) keyLabel.textContent = s;
  }
  keyBtnDefs.forEach(function (d) {
    const s = E.t(d.label);
    if (d.el.textContent !== s) d.el.textContent = s;
  });
  if (keyNote) {
    const typed = CC.normalize(keyInput ? keyInput.value : '');
    const M = curM();
    const det = CC.matDet(M, CC.N), g = CC.gcd(det, CC.N);
    let s;
    if (typed.length < k * k) {
      s = E.t({ en: typed.length + '/' + (k * k) + ' letters — still using ' + KEYS[k],
                zh: '已输入 ' + typed.length + '/' + (k * k) + ' 个字母 —— 仍在用 ' + KEYS[k] });
    } else {
      s = 'det ≡ ' + det + ' (mod 26) · gcd = ' + g + ' · ' +
        E.t(g === 1 ? { en: 'usable', zh: '可用' } : { en: 'no inverse', zh: '没有逆' });
    }
    if (keyNote.textContent !== s) keyNote.textContent = s;
  }
}

function curM() { const k = curK(); return HL.keyFromString(KEYS[k], k); }

/* ================= 明文预置 ================= */
const PRESET_LABEL = {
  'pangram':      { en: 'Pangram',   zh: '全字母句' },
  'attack':       { en: 'Short',     zh: '短报文' },
  'caesar-quote': { en: 'Caesar',    zh: '凯撒' }
};

/* 前三条来自 examples/，第四条是本页自己的：'ABABAB…' 的每个分组都是同一个
   向量，任取几组拼出来的 P 都有重复的列，det ≡ 0。它是第三个页签"优雅失败"
   那一支的唯一素材，而这件事只在 Hill 上有意义（凯撒与仿射没有"配对是否
   线性无关"这个问题），所以它留在本页而不是进 examples/。 */
const TEXT_PRESETS = EX.classical.plaintexts.map(function (p) {
  return {
    key: p.id,
    label: PRESET_LABEL[p.id] || { en: p.id, zh: p.id },
    onSelect: function () { setPlain(E.t(p.text), true); }
  };
}).concat([{
  key: 'repeats',
  label: { en: 'Repeats', zh: '重复串' },
  onSelect: function () { setPlain('ABABABABABABABAB', true); }
}]);
const PRESETS_LABEL = { en: 'Text', zh: '明文' };

/* ================= 时间轴 =================
   三个页签各有一条时间轴：它们的"一步"不是同一件事（一格乘法 / 剪切的两端 /
   攻击的五个阶段），共用一条就得让每个页签自己取模，而取模出来的步数与
   ⏮ ⏭ 按钮走的步数不一致，按钮就会时灵时不灵。

   单一真相分两半，互不重叠：**播放与否**归引擎的 state.running（⏵/⏸ 按钮由
   引擎自己绑），**走到第几步**归时间轴。所以时间轴一建好就 play() 并且永不
   pause()——真正的闸门是 tick() 里那个 state.running 判断。

   步数会随 k 与报文长度变，而 createTimeline 的 steps 是建好就定死的，
   所以这里按 steps 缓存：步数变了就换一条新的，并且把当前 index 带过去。 */
const TLS = {};
let CUR = 'transform';

function timelineFor(tab, steps, stepDuration) {
  steps = Math.max(1, Math.round(steps));
  const cur = TLS[tab];
  if (cur && cur.steps === steps) return cur.tl;
  const tl = CryptoAnim.createTimeline({ steps: steps, stepDuration: stepDuration,
                                         loop: true, rate: 1 });
  tl.play();
  if (cur) tl.seek(Math.min(cur.tl.index, steps - 1));
  TLS[tab] = { tl: tl, steps: steps };
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tick(tl) {
  tl.setRate(E.state.speed || 1);
  if (E.state.running) tl.tick(E.state.dt);
}
function activeTL() { const e = TLS[CUR]; return e ? e.tl : null; }

/* CUR 由页签按钮的点击直接写，**不能只靠 draw() 顶上那一行**。draw() 只在下一帧
   才跑，而"点页签、立刻按 ⏭"之间可能一帧都还没来得及渲染——那时 CUR 仍是上一个
   页签，四次 ⏭ 全走到了别人的时间轴上，画面停在第 0 步纹丝不动。实测撞到过。
   draw() 里那一行保留着当兜底（万一有别的路径切了页签）。 */
function bindTabTracking() {
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { CUR = b.dataset.tab; });
  });
}

document.getElementById('btnBack').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(-1); });
document.getElementById('btnStep').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tick() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click',
  function () { const t = activeTL(); if (t) t.seek(0); });

/* ================= 版面预算 =================
   先把上下两条带子留出来，再拿剩下的地方定尺寸。反过来做（先按
   min(宽,高) 定尺寸再摆位置）会让说明性的那几行成为第一个被挤出画布的东西——
   仿射页在 1280×677 上就这样把整个页签的结论牌挤没过。
   窄屏（≤760px）上传输条被 CSS 挪到了页签下方、面板变成贴底的抽屉，
   所以上带更高、下带更矮，两套数各写各的。 */
function layout() {
  const vi = E.viewInfo();
  const wide = vi.W > 900;
  const narrow = vi.W <= 760;
  const availW = wide ? vi.W - 330 : vi.W;
  return {
    vi: vi, W: vi.W, H: vi.H, wide: wide, narrow: narrow,
    availW: availW,
    cx: wide ? availW / 2 + 16 : vi.W / 2,
    top: narrow ? 142 : 118,
    bot: narrow ? 30 : 96,
    vSpace: Math.max(150, vi.H - (narrow ? 142 : 118) - (narrow ? 30 : 96))
  };
}

/* ================= 画矩阵 ================= */
/* 方括号用三段线拼，不用字体里的 '['：字号一变，字形的括号就跟矩阵的高度
   对不齐，而这两样东西必须严丝合缝——括号的作用就是宣布"这一坨是一个整体"。 */
function drawBracket(x, y, w, h, col) {
  const t = Math.min(8, Math.max(4, h * 0.16));
  const seg = function (ax, ay, bx, by) {
    E.flowArrow(ax, ay, bx, by, { color: col, width: 1.3, head: false });
  };
  seg(x - 5, y - 3, x - 5, y + h + 3);
  seg(x - 5, y - 3, x - 5 + t, y - 3);
  seg(x - 5, y + h + 3, x - 5 + t, y + h + 3);
  seg(x + w + 5, y - 3, x + w + 5, y + h + 3);
  seg(x + w + 5, y - 3, x + w + 5 - t, y - 3);
  seg(x + w + 5, y + h + 3, x + w + 5 - t, y + h + 3);
}

/* rows×cols 的数字阵。text/fill/textColor 都可以被调用方接管，
   默认就是"把 M[r][c] 印出来"。 */
function drawMatrix(x, y, cell, rows, cols, o) {
  o = o || {};
  E.cellGrid(x, y, cols, rows, cell, {
    stroke: o.stroke || 'rgba(148,163,184,.14)',
    fill: o.fill || null,
    fontSize: E.clamp(cell * 0.44, 9, 17),
    text: o.text,
    textColor: o.textColor || function () { return o.color || BRIGHT; }
  });
  drawBracket(x, y, cols * cell, rows * cell, o.bracket || DIM);
}

function matText(M) { return function (c, r) { return String(M[r][c]); }; }

/* ================= 报文条 =================
   ⚠ 先用**最小可读格宽**反推放得下几个字母，再把格宽放大到实际可用的宽度；
   绝不"先定字母数、再把格宽 clamp 到一个下限"——那个下限是下限，超出的部分
   会被画布边缘无声地吃掉。凯撒 1.0.2 修的就是这个：375px 视口上 26 格按
   12px 画成 387px，左右各裁掉 6px。放不下的尾巴用省略号明说。
   另一条：只显示整数个分组。半个分组会让"k 个一组"这件事在画面上失效，
   而那正是这一页从头到尾在讲的东西。 */
const STRIP_MIN = 11, STRIP_MAX = 26, STRIP_GAP = 2, BLOCK_GAP = 8;

function stripFit(availW, total, k) {
  /* −52 而不是 −30：两侧各留 26px，其中右侧那一份是给截断省略号的。
     实测 375px 上按 −30 算出来的条子右端落在 360，而省略号画在 363…379——
     最后 4px 在画布外。省略号是"这里还有字没显示"的唯一记号，它自己被裁掉
     等于把截断也藏了起来。宁可格子窄一点。 */
  const w = Math.max(90, availW - 52);
  const extra = (BLOCK_GAP - STRIP_GAP) / k;      // 摊到每个字母头上的块间额外间隙
  let n = Math.floor((w + STRIP_GAP) / (STRIP_MIN + STRIP_GAP + extra));
  n = Math.min(n, total);
  n = n - (n % k);                                // 只显示整块
  if (n < k) n = Math.min(k, total);
  const cell = E.clamp((w + STRIP_GAP) / Math.max(n, 1) - STRIP_GAP - extra,
                       STRIP_MIN, STRIP_MAX);
  const width = n * (cell + STRIP_GAP) - STRIP_GAP +
                (Math.ceil(n / k) - 1) * (BLOCK_GAP - STRIP_GAP);
  return { n: n, cell: cell, width: width, truncated: n < total };
}

function stripX(x0, i, cell, k) {
  return x0 + i * (cell + STRIP_GAP) + Math.floor(i / k) * (BLOCK_GAP - STRIP_GAP);
}

/* ================= 缓存 =================
   同一帧里 draw() 与 readout() 会各要一次同样的东西。缓存让它们读到的**是同一份
   对象**——两次独立计算哪怕结果相同，也会让"图上的 52 与读数里的 52"变成两个
   巧合相等的数。imageCensus 对 k=3 要过 17576 个向量（实测 3ms），
   更是每帧重算不起。 */
const censusCache = { key: null, val: null };
function censusOf(M) {
  const key = HL.keyLetters(M);
  if (censusCache.key !== key) { censusCache.key = key; censusCache.val = HL.imageCensus(M); }
  return censusCache.val;
}

/* k=2 的格点图：676 个源点与它们的像。与 census 分开缓存，因为它只在 k=2 用。 */
const boardCache = { key: null, val: null };
function boardOf(M) {
  const key = HL.keyLetters(M);
  if (boardCache.key === key) return boardCache.val;
  const n = CC.N;
  const src = new Uint8Array(n * n * 2), dst = new Uint8Array(n * n * 2);
  let at = 0;
  for (let x = 0; x < n; x++) {
    for (let y = 0; y < n; y++) {
      const w = CC.matMulVec(M, [x, y], n);
      src[at] = x; src[at + 1] = y;
      dst[at] = w[0]; dst[at + 1] = w[1];
      at += 2;
    }
  }
  boardCache.key = key;
  boardCache.val = { src: src, dst: dst, count: n * n };
  return boardCache.val;
}

const atkCache = { key: null, val: null };
function attackOf() {
  const k = curK(), M = curM();
  const key = k + '|' + HL.keyLetters(M) + '|' + PLAIN;
  if (atkCache.key === key) return atkCache.val;
  /* 密文一律走 applyRaw：不可用的 M 上 encrypt 会抛，而"密钥不可逆"并不妨碍
     已知明文攻击——攻击求的是 **P** 的逆（明文那一侧），不是 M 的逆。
     这一点值得在页面上说出来：折叠过的钥匙一样会被这招还原。 */
  const cipher = HL.applyRaw(PLAIN, M);
  atkCache.key = key;
  atkCache.val = { cipher: cipher, R: HL.solveKey(PLAIN, cipher, k), M: M, k: k };
  return atkCache.val;
}

/* ================= 页签一：变换 ================= */
const TX_BLOCKS = 6;     // 时间轴最多循环走前 6 个分组，免得一圈太长看不到开头

const transform = {
  label: { en: 'Transform', zh: '变换' },
  brand: { en: 'Encryption is a linear map. k letters stand up as a column vector, the key is a matrix, and the cipher block is one matrix–vector product.',
           zh: '加密是一个线性映射。k 个字母立起来就是一个列向量，密钥是一个矩阵，密文分组就是一次矩阵乘向量。' },
  tips: { en: 'Press ⏵ and watch one cell at a time: each product M[i][j]·p[j] drops into the running sum, and the row closes with a mod 26. Turn on "k = 1" — the matrix shrinks to one number and the whole thing is the affine cipher again.',
          zh: '按 ⏵，一次只看一格：每个乘积 M[i][j]·p[j] 落进累加里，一整行算完再模 26。打开「k = 1」——矩阵缩成一个数，整个东西又变回仿射密码。' },
  params: ['k', 'speed'],
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showWork',   label: { en: 'Cell by cell', zh: '逐格计算' }, color: VIOLET,  checked: true },
    { key: 'showStrip',  label: { en: 'Message',      zh: '报文' },     color: CYAN,    checked: true },
    { key: 'showAffine', label: { en: 'k = 1 (affine)', zh: 'k = 1（仿射）' }, color: EMERALD, checked: false }
  ],
  draw: function () {
    CUR = 'transform';
    const L = layout();
    const k = curK(), M = curM();
    const bs = HL.blocks(PLAIN, k);
    const nb = bs.length;
    const shown = Math.max(1, Math.min(nb, TX_BLOCKS));
    const tl = timelineFor('transform', shown * k * k, 0.42);
    tick(tl);

    const bIx = nb ? Math.floor(tl.index / (k * k)) % shown : 0;
    const cellIx = tl.index % (k * k);
    const row = Math.floor(cellIx / k), col = cellIx % k;
    const p = nb ? bs[bIx] : null;
    const c = p ? CC.matMulVec(M, p, CC.N) : null;

    /* 这一行到目前为止的部分和：j ≤ col 的那几项。行走完之前它就是画面上
       结果列那一格里的数字——"逐格算"要看得见中间量，否则只是结果闪一下。 */
    let partial = 0;
    if (p) for (let j = 0; j <= col; j++) partial = CC.mod(partial + M[row][j] * p[j], CC.N);

    const cell = E.clamp(Math.min(46, (L.availW - 170) / (k + 2)), 18, 46);
    const mw = k * cell, mh = k * cell;
    const gA = 24, gB = 22, eqW = 20;
    const totalW = mw + gA + cell + gB + eqW + gB + cell;
    const x0 = L.cx - totalW / 2;
    const xM = x0, xP = xM + mw + gA, xE = xP + cell + gB, xC = xE + eqW + gB;
    const yM = L.top + 52;

    /* ① 公式牌。M 与 k 都是活的，读起来就是这一帧真正在算的式子。 */
    E.chip(L.cx - 120, yM - 40, 240, 24, 'c ≡ M · p  (mod 26)',
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 13.5 });

    /* ② 密钥矩阵。当前那一格用紫色点亮——紫色在全页都表示"映射这个动作"。 */
    drawMatrix(xM, yM, cell, k, k, {
      bracket: VIOLET,
      text: matText(M),
      fill: function (cc, rr) {
        if (!E.state.showWork || !p) return null;
        if (rr === row && cc === col) return 'rgba(167,139,250,.30)';
        if (rr === row) return 'rgba(167,139,250,.10)';
        return null;
      },
      textColor: function (cc, rr) {
        return (E.state.showWork && p && rr === row && cc === col) ? VIOLET : BRIGHT;
      }
    });
    E.chip(xM - 6, yM - 22, mw + 12, 18, 'M = ' + HL.keyLetters(M),
           { color: VIOLET, fontSize: Math.min(11.5, cell * 0.34) });

    /* ③ 明文列向量。参与当前这一格乘法的那一个（下标 col）点亮。 */
    drawMatrix(xP, yM, cell, k, 1, {
      bracket: CYAN,
      text: function (_cc, rr) { return p ? String(p[rr]) : '·'; },
      fill: function (_cc, rr) {
        return (E.state.showWork && p && rr === col) ? 'rgba(45,212,234,.24)' : null;
      },
      textColor: function () { return CYAN; }
    });
    E.chip(xP - 8, yM - 22, cell + 16, 18,
           p ? 'p = ' + CC.fromIndices(p) : 'p',
           { color: CYAN, fontSize: Math.min(11.5, cell * 0.34) });

    E.chip(xE, yM + mh / 2 - 12, eqW, 24, '=', { color: SLATE, fontSize: 16 });

    /* ④ 结果列向量。已算完的行给数字，正在算的那一行给部分和，还没轮到的留空——
       "空"本身是信息：它说的是"这一行还没算"。 */
    drawMatrix(xC, yM, cell, k, 1, {
      bracket: ROSE,
      text: function (_cc, rr) {
        if (!c) return '·';
        if (!E.state.showWork) return String(c[rr]);
        if (rr < row) return String(c[rr]);
        if (rr === row) return String(partial);
        return '';
      },
      fill: function (_cc, rr) {
        return (E.state.showWork && c && rr === row) ? 'rgba(251,113,133,.18)' : null;
      },
      textColor: function () { return ROSE; }
    });
    E.chip(xC - 8, yM - 22, cell + 16, 18,
           c ? 'c = ' + CC.fromIndices(c) : 'c',
           { color: ROSE, fontSize: Math.min(11.5, cell * 0.34) });

    /* ⑤ 当前这一格的算式，一行一个乘积。使用者盯着的是这一行，
       所以它必须写出真实的数字，而不是 "M[i][j]·p[j]" 这样的模板。 */
    let y = yM + mh + 18;
    if (p && E.state.showWork) {
      const w = Math.min(L.availW - 40, 460);
      /* 这一行用 mono 而不是数学衬线体：它是一条**计算轨迹**（带方括号的下标），
         不是一个公式。衬线斜体里的 0 与 o 在这个字号上几乎分不开——实测截图里
         "M[0][0]" 读成了 "M[o][o]"。行列号按数学惯例从 1 起数，与读数里的
         "第 1 组"口径一致。 */
      E.chip(L.cx - w / 2, y, w, 24,
             'M[' + (row + 1) + '][' + (col + 1) + '] · p[' + (col + 1) + ']  =  ' +
             M[row][col] + ' · ' + p[col] + ' = ' + (M[row][col] * p[col]) +
             '     Σ ≡ ' + partial,
             { mono: true, fill: CARD, stroke: 'rgba(167,139,250,.34)',
               color: VIOLET, fontSize: 12.5 });
      y += 32;
    }

    /* ⑥ 报文条：明文分组压着密文分组，当前分组描青边。
       用 applyRaw 而不是 encrypt——不可用的密钥上这一条照样要出现，
       它是第二个页签"塌陷"最直观的预告。 */
    if (E.state.showStrip && nb) {
      const plain = HL.pad(PLAIN, k);
      const cipher = HL.applyRaw(PLAIN, M);
      const f = stripFit(L.availW, plain.length, k);
      const sx = L.cx - f.width / 2;
      if (y + f.cell * 2 + 30 < L.H - L.bot) {
        for (let i = 0; i < f.n; i++) {
          const x = stripX(sx, i, f.cell, k);
          const inBlk = Math.floor(i / k) === bIx;
          E.chip(x, y, f.cell, f.cell, plain.charAt(i),
                 { stroke: inBlk ? 'rgba(45,212,234,.85)' : 'rgba(45,212,234,.26)',
                   width: inBlk ? 1.6 : 1,
                   color: CYAN, fontSize: f.cell * 0.56 });
          E.chip(x, y + f.cell + 6, f.cell, f.cell, cipher.charAt(i),
                 { fill: 'rgba(251,113,133,.10)',
                   stroke: inBlk ? 'rgba(251,113,133,.85)' : 'rgba(251,113,133,.30)',
                   width: inBlk ? 1.6 : 1,
                   color: ROSE, fontSize: f.cell * 0.56 });
        }
        if (f.truncated) {
          E.chip(sx + f.width + 3, y + f.cell / 2, 16, f.cell, '…',
                 { color: DIM, fontSize: 13 });
        }
        y += f.cell * 2 + 16;
      }
    }

    /* ⑦ k = 1 的对照：同一段明文，一边走 Hill 的 1×1，一边走仿射的裸映射。
       两串字符当场比对，相同就打勾——这不是文案在声称"仿射是特例"，
       是页面自己算了两遍然后指着结果说话。 */
    if (E.state.showAffine && nb) {
      const a = M[0][0];
      const viaHill = HL.applyRaw(PLAIN, [[a]]);
      const viaAffine = AF.mapRaw(CC.normalize(PLAIN), a, 0);
      const same = viaHill === viaAffine;
      const f = stripFit(L.availW, viaHill.length, 1);
      const sx = L.cx - f.width / 2;
      if (y + f.cell + 46 < L.H - L.bot) {
        E.chip(L.cx - 200, y, 400, 20,
               'k = 1:  c ≡ ' + a + '·p (mod 26)   ' +
               (same ? '≡ affine(a = ' + a + ', b = 0)  ✓' : '✗'),
               { mono: true, color: same ? EMERALD : UNPAIRED, fontSize: 11.5 });
        y += 24;
        for (let i = 0; i < f.n; i++) {
          E.chip(stripX(sx, i, f.cell, 1), y, f.cell, f.cell, viaHill.charAt(i),
                 { fill: 'rgba(52,211,153,.10)', stroke: 'rgba(52,211,153,.30)',
                   color: EMERALD, fontSize: f.cell * 0.56 });
        }
      }
    }

    if (!nb) {
      E.chip(L.cx - 190, yM + mh + 24, 380, 26,
             E.t({ en: 'no letters in the plaintext — nothing to group',
                   zh: '明文里一个字母都没有 —— 没有东西可以分组' }),
             { mono: true, color: ORANGE, fontSize: 11.5,
               fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.38)' });
    }
  },
  readout: function () {
    syncIoLabels();
    const k = curK(), M = curM();
    const det = CC.matDet(M, CC.N), g = CC.gcd(det, CC.N);
    const bs = HL.blocks(PLAIN, k);
    const cipher = HL.applyRaw(PLAIN, M);
    let s = '<b style="--c:var(--trace-violet)"><i>M</i> = ' + HL.keyLetters(M) + '</b>' +
      '<span class="dim">   ' + k + ' × ' + k + '   det ≡ ' + det +
      '   gcd = ' + g + '</span><br>';
    if (!bs.length) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — nothing to encrypt', zh: '没有字母 —— 无从加密' }) + '</b>';
    }
    const tlEntry = TLS['transform'];
    const shown = Math.max(1, Math.min(bs.length, TX_BLOCKS));
    const bIx = tlEntry ? Math.floor(tlEntry.tl.index / (k * k)) % shown : 0;
    const p = bs[bIx], c = CC.matMulVec(M, p, CC.N);
    s += '<b style="--c:var(--trace-cyan)"><i>' + CC.fromIndices(p) + '</i></b>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)"><i>' + CC.fromIndices(c) + '</i></b>' +
      '<span class="dim">   ' +
      E.t({ en: 'block ', zh: '第 ' }) + (bIx + 1) +
      E.t({ en: ' of ' + bs.length, zh: ' / ' + bs.length + ' 组' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'padded plain ', zh: '补齐后明文 ' }) + '</span>' +
      esc(clip(HL.pad(PLAIN, k), 64)) + '<br>';
    if (g === 1) {
      s += '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
        '<b style="--c:var(--trace-rose)">' + esc(clip(cipher, 64)) + '</b>';
    } else {
      /* 措辞是有意的：这串东西**不叫密文**。密文的定义里含着"能被解开"，
         而 gcd(det,26) ≠ 1 时没有任何人能解开它——包括写下它的人。 */
      s += '<span class="dim">' + E.t({ en: 'image (not a cipher) ', zh: '像（不是密文） ' }) +
        '</span><b style="--c:var(--trace-unpaired)">' + esc(clip(cipher, 64)) + '</b>';
    }
    return s;
  }
};

/* ================= 页签二：几何 —— 顿悟视角 =================
   26×26 个格点就是全部 676 个 digraph；矩阵把这张格点图整个剪切一遍。
   M 可用时剪切是一个**置换**：676 个点换了位置，一个不多一个不少。
   gcd(det,26) = g > 1 时它塌到一个子格上：像只剩 676/|ker| 个位置，每个位置上
   挤着 |ker| 个不同的 digraph，其余位置**一个原像都没有**——那些 digraph
   永远不可能作为密文出现。

   为什么这是顿悟视角而不只是一个警告：教科书通常把 gcd(det,26) = 1 写成一条
   要背的条件。在这一页上它不是条件，是**结果**——你先看见 676 个点落成 52 个，
   然后才明白解密不是"更难"，而是根本没有这个东西：收到那一对字母的人无从
   知道它原来是哪 13 个 digraph 中的哪一个。这正是仿射那一页的塌陷升一维。 */
const geometry = {
  label: { en: 'Geometry', zh: '几何' },
  brand: { en: 'All 676 digraphs, laid out as a 26×26 lattice on a torus. The matrix shears the whole lattice at once — and a bad determinant folds it.',
           zh: '676 个 digraph 摊成 26×26 的格点，铺在一个环面上。矩阵一次剪切整张格点图 —— 而一个坏的行列式会把它折起来。' },
  tips: { en: 'Epiphany view. Press ⏵ with the textbook key: the lattice shears and every cell stays occupied — a permutation. Now hit "Fold ×13": 676 points collapse onto 52 and 624 cells go magenta. Nothing ever lands there, so nothing can be read back. That is what gcd(det, 26) = 1 buys.',
          zh: '顿悟视角。用教科书密钥按 ⏵：格点被剪切，每一格仍然有人 —— 这是一个置换。再点「折叠 ×13」：676 个点塌成 52 个，624 格变成品红。永远不会有东西落到那里，也就永远读不回来。gcd(det, 26) = 1 买的就是这个。' },
  /* k 滑杆在这一页藏起来（进场时也会把 k 拨回 2）：26×26 的格点图是 k=2 的
     故事，k=3 的 17576 个 trigraph 不是这张图能诚实表达的东西。留一个一动
     就被弹回去的滑杆比没有滑杆更糟。 */
  params: ['speed'],
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showLost',  label: { en: 'Unreachable', zh: '够不着的' }, color: UNPAIRED, checked: true },
    { key: 'showBasis', label: { en: 'Basis images', zh: '基向量的像' }, color: VIOLET, checked: true },
    { key: 'showGrid',  label: { en: 'Lattice',      zh: '格线' },     color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'geometry';
    setK(2);
    const L = layout();
    const M = curM();
    const S = censusOf(M);
    const B = boardOf(M);
    const n = CC.N;

    const tl = timelineFor('geometry', 2, 1.9);
    tick(tl);
    /* 三角波：第 0 步剪切过去，第 1 步松回来。⏭ 于是在"原格点"与"像"两端之间
       跳，而播放时是一次来回的呼吸。 */
    const m = tl.index === 0 ? tl.progress : 1 - tl.progress;
    const settled = m > 0.995;

    const side = E.clamp(Math.min(L.availW - 76, L.vSpace - 126), 150, 430);
    const cs = side / n;
    const bx = L.cx - side / 2, by = L.top + 66;
    const px = function (u) { return bx + (u + 0.5) * cs; };
    const py = function (v) { return by + side - (v + 0.5) * cs; };

    /* ① 格线与边框。边框画成虚线是在说"这四条边是粘起来的"——这张图不是
       一块方板，是一个环面，26 之后接回 0。 */
    if (E.state.showGrid) {
      for (let i = 0; i <= n; i += 2) {
        E.flowArrow(bx + i * cs, by, bx + i * cs, by + side, { color: FAINT, width: 1, head: false });
        E.flowArrow(bx, by + i * cs, bx + side, by + i * cs, { color: FAINT, width: 1, head: false });
      }
    }
    [[bx, by, bx + side, by], [bx, by + side, bx + side, by + side],
     [bx, by, bx, by + side], [bx + side, by, bx + side, by + side]].forEach(function (s) {
      E.flowArrow(s[0], s[1], s[2], s[3],
                  { color: 'rgba(148,163,184,.45)', width: 1.2, head: false, dash: [4, 4] });
    });

    /* ② 点。剪切途中画全部 676 个源点（它们正在移动）；停稳之后改画每个像点
       一个（重合的点本来就叠在一起，画 676 个只是把同一个像素涂 13 遍）。
       这不只是省事：停稳那一帧的重点是"还剩几个点"，一个像一个点才数得清。 */
    const r = E.clamp(cs * 0.30, 1.6, 5);
    if (!settled) {
      for (let i = 0; i < B.count; i++) {
        const sx = B.src[i * 2], sy = B.src[i * 2 + 1];
        const tx = B.dst[i * 2], ty = B.dst[i * 2 + 1];
        const cnt = S.counts[tx * n + ty];
        const x = px(sx + (tx - sx) * m), y = py(sy + (ty - sy) * m);
        E.chip(x - r, y - r, r * 2, r * 2, '',
               { fill: cnt > 1 ? 'rgba(251,113,133,.80)' : 'rgba(45,212,234,.72)', radius: r });
      }
    } else {
      for (let u = 0; u < n; u++) {
        for (let v = 0; v < n; v++) {
          const cnt = S.counts[u * n + v];
          if (cnt === 0) {
            if (!E.state.showLost) continue;
            const rr = E.clamp(cs * 0.16, 1, 2.6);
            E.chip(px(u) - rr, py(v) - rr, rr * 2, rr * 2, '',
                   { fill: 'rgba(255,47,208,.55)', radius: rr });
            continue;
          }
          const rr = cnt > 1 ? r * 1.55 : r;
          E.chip(px(u) - rr, py(v) - rr, rr * 2, rr * 2, '',
                 { fill: cnt > 1 ? 'rgba(251,113,133,.88)' : 'rgba(45,212,234,.78)', radius: rr });
        }
      }
    }

    /* ③ 两个基向量的像 —— 也就是 M 的两列。单位正方形被剪成一个平行四边形，
       而那个平行四边形的面积就是 |det M|。这一笔把第一个页签的矩阵和这一页的
       图缝在一起：矩阵的列不是抽象的数，它们就是画面上这两支箭。 */
    if (E.state.showBasis) {
      const e = [[1, 0], [0, 1]];
      const cols = [[M[0][0], M[1][0]], [M[0][1], M[1][1]]];
      const tip = [];
      for (let i = 0; i < 2; i++) {
        const ux = e[i][0] + (cols[i][0] - e[i][0]) * m;
        const uy = e[i][1] + (cols[i][1] - e[i][1]) * m;
        tip.push([px(ux), py(uy)]);
        E.flowArrow(px(0), py(0), px(ux), py(uy),
                    { color: VIOLET, width: 1.8, headLen: 8 });
      }
      /* 平行四边形的另外两条边：从每支箭的端点出发，平行于另一支。 */
      const o = [px(0), py(0)];
      const far = [tip[0][0] + tip[1][0] - o[0], tip[0][1] + tip[1][1] - o[1]];
      E.flowArrow(tip[0][0], tip[0][1], far[0], far[1],
                  { color: 'rgba(167,139,250,.42)', width: 1.2, head: false });
      E.flowArrow(tip[1][0], tip[1][1], far[0], far[1],
                  { color: 'rgba(167,139,250,.42)', width: 1.2, head: false });
    }

    /* ④ 轴标：每 5 格一个字母。 */
    for (let i = 0; i < n; i += 5) {
      E.chip(px(i) - 7, by + side + 3, 14, 13, CC.ALPHABET.charAt(i),
             { color: DIM, fontSize: 9.5 });
      E.chip(bx - 17, py(i) - 7, 14, 14, CC.ALPHABET.charAt(i),
             { color: DIM, fontSize: 9.5 });
    }

    /* ⑤ 活的计数牌。三个数字都从同一份 imageCensus 里来，不在画面上各算各的。 */
    const ok = S.invertible;
    const head = ok
      ? E.t({ en: 'gcd(det, 26) = 1  ·  676 → 676  ·  a permutation of the lattice',
              zh: 'gcd(det, 26) = 1  ·  676 → 676  ·  格点的一个置换' })
      : E.t({ en: 'gcd(det, 26) = ' + CC.gcd(CC.matDet(M, CC.N), CC.N) +
                  '  ·  676 → ' + S.distinct + '  ·  ' + S.fold + ' digraphs share every image',
              zh: 'gcd(det, 26) = ' + CC.gcd(CC.matDet(M, CC.N), CC.N) +
                  '  ·  676 → ' + S.distinct + '  ·  每个像上挤着 ' + S.fold + ' 个 digraph' });
    const cardW = Math.min(L.availW - 30, 430);
    if (by - 30 > L.top - 4) {
      E.chip(L.cx - cardW / 2, by - 30, cardW, 24, head,
             { mono: true, fontSize: 11,
               color: ok ? EMERALD : UNPAIRED,
               fill: ok ? 'rgba(52,211,153,.09)' : 'rgba(255,47,208,.09)',
               stroke: ok ? 'rgba(52,211,153,.42)' : 'rgba(255,47,208,.45)' });
    }
    const foot = ok
      ? E.t({ en: 'every cell still occupied — the map is one-to-one, so it can be undone',
              zh: '每一格仍然有人 —— 映射是一一的，所以它能被还原' })
      : E.t({ en: S.lost + ' cells can never be a cipher block — those digraphs have no preimage',
              zh: S.lost + ' 格永远不会成为密文分组 —— 那些 digraph 没有任何原像' });
    if (by + side + 20 + 20 < L.H - L.bot) {
      E.chip(L.cx - cardW / 2, by + side + 20, cardW, 20, foot,
             { mono: true, color: ok ? SLATE : UNPAIRED, fontSize: 10.5 });
    }
    if (by + side + 42 + 18 < L.H - L.bot) {
      E.chip(L.cx - cardW / 2, by + side + 42, cardW, 18,
             E.t({ en: 'the four edges are glued — this square is a torus',
                   zh: '四条边是粘起来的 —— 这个正方形是一个环面' }),
             { mono: true, color: DIM, fontSize: 10 });
    }
  },
  readout: function () {
    syncIoLabels();
    const M = curM();
    const S = censusOf(M);
    const det = CC.matDet(M, CC.N), g = CC.gcd(det, CC.N);
    let s = '<b style="--c:var(--trace-violet)"><i>M</i> = ' + HL.keyLetters(M) + '</b>' +
      '<span class="dim">   det ≡ ' + det + '   gcd(det, 26) = ' + g + '</span><br>';
    if (S.invertible) {
      return s +
        '<b style="--c:var(--trace-emerald)">676 &#8594; 676</b>' +
        '<span class="dim">   ' +
        E.t({ en: 'the shear is a permutation', zh: '这次剪切是一个置换' }) + '</span><br>' +
        '<span class="dim">' +
        E.t({ en: 'every digraph has exactly one preimage, so decryption is a function',
              zh: '每个 digraph 恰好一个原像，所以解密是一个函数' }) + '</span><br>' +
        '<span class="dim">' +
        E.t({ en: 'try the Fold ×2 or Fold ×13 key', zh: '试试「折叠 ×2」或「折叠 ×13」' }) +
        '</span>';
    }
    /* 把塌陷讲成一个具体的句子而不是一个数字：|ker M| 个 digraph 全部变成
       同一对字母，所以收信人无从还原——"无从"比"很难"重要。 */
    const ex = [];
    for (let x = 0; x < CC.N && ex.length < 3; x++) {
      for (let y = 0; y < CC.N && ex.length < 3; y++) {
        const w = CC.matMulVec(M, [x, y], CC.N);
        if (w[0] === 0 && w[1] === 0) ex.push(CC.ALPHABET.charAt(x) + CC.ALPHABET.charAt(y));
      }
    }
    return s +
      '<b style="--c:var(--trace-unpaired)">676 &#8594; ' + S.distinct + '</b>' +
      '<span class="dim">   ' +
      E.t({ en: S.lost + ' cells unreachable', zh: S.lost + ' 格够不着' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'all of ', zh: '这一伙 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)"><i>' + ex.join(' = ') + ' …</i></b>' +
      '<span class="dim"> &#8594; </span>' +
      '<b style="--c:var(--trace-unpaired)"><i>AA</i></b>' +
      '<span class="dim">   (' + S.fold + E.t({ en: ' of them', zh: ' 个' }) + ')</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'encrypt() refuses this key — there is no inverse to refuse with',
            zh: 'encrypt() 拒绝这把钥匙 —— 根本没有逆矩阵可用' }) + '</span>';
  }
};

/* ================= 页签三：破解 —— 已知明文攻击 =================
   Hill 对频率分析很强：k=2 统计的是 676 个 digraph 而不是 26 个字母，样本被
   摊薄了 26 倍；k=3 更是 17576 个。但它对已知明文一触即溃，理由是一句线性代数：
   **线性映射由它在一组基上的取值唯一确定**。
     Q = M·P  ⟹  M = Q·P⁻¹   (mod 26)
   k 组配对给出 k² 个方程，正好等于未知数的个数。没有搜索、没有 χ²、没有
   "最像英文的那一个"——一次矩阵求逆，得到的就是精确的那一把钥匙。

   会失败的那一半必须被显式处理，因为学习者一定会撞上：选中的 k 组明文分组在
   模 26 下线性相关时（'ABABAB…' 是最容易撞的形状），P 不可逆，方程组欠定，
   **有多把 M 同时满足这些配对**。此时给出"一个答案"是错的。 */
const STAGES = 5;

const brk = {
  label: { en: 'Break', zh: '破解' },
  brand: { en: 'Hill resists frequency analysis and falls instantly to known plaintext: k blocks give k² equations, and one matrix inverse hands over the key exactly.',
           zh: 'Hill 抗频率分析，却对已知明文一触即溃：k 组配对给出 k² 个方程，一次矩阵求逆就精确交出钥匙。' },
  tips: { en: 'Press ⏵ through the five steps. No searching happens anywhere — M = Q·P⁻¹ is a single inversion, and the recovered key is exact, not "most likely". Then switch the text to "Repeats": every block is the same vector, P is singular, and the attack says so instead of inventing a key.',
          zh: '按 ⏵ 走完五步。全程没有任何搜索 —— M = Q·P⁻¹ 只是一次求逆，还原出来的密钥是精确的，不是"最可能的"。再把明文换成「重复串」：每个分组都是同一个向量，P 不可逆，攻击会明说，而不是编一把钥匙出来。' },
  params: ['k', 'speed'],
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showPairs',  label: { en: 'Known pairs', zh: '已知配对' }, color: CYAN,    checked: true },
    { key: 'showSolve',  label: { en: 'Solve',       zh: '求解' },     color: VIOLET,  checked: true },
    { key: 'showCheck',  label: { en: 'Verdict',     zh: '判定' },     color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'break';
    const L = layout();
    const k = curK();
    const A = attackOf();
    const R = A.R, M = A.M;
    const tl = timelineFor('break', STAGES, 0.95);
    tick(tl);
    const stage = tl.index;

    const plain = HL.pad(PLAIN, k);
    const cipher = A.cipher;
    const cols = R.cols || [];

    let y = L.top + 34;

    /* ① 已知的明文 / 密文配对。被选中的那 k 组描边——P 与 Q 的列**就是**
       这几组，把它们单独摆成矩阵之前，先让人看见它们本来长在报文里。 */
    if (E.state.showPairs && plain.length) {
      const f = stripFit(L.availW, plain.length, k);
      const sx = L.cx - f.width / 2;
      E.chip(L.cx - 200, y, 400, 18,
             E.t({ en: 'known plaintext (cyan) and its ciphertext (rose)',
                   zh: '已知明文（青）与它的密文（玫红）' }),
             { mono: true, color: SLATE, fontSize: 10.5 });
      y += 22;
      for (let i = 0; i < f.n; i++) {
        const x = stripX(sx, i, f.cell, k);
        const use = stage >= 1 && cols.indexOf(Math.floor(i / k)) >= 0;
        E.chip(x, y, f.cell, f.cell, plain.charAt(i),
               { stroke: use ? 'rgba(45,212,234,.95)' : 'rgba(45,212,234,.22)',
                 width: use ? 1.7 : 1, color: CYAN, fontSize: f.cell * 0.56 });
        E.chip(x, y + f.cell + 5, f.cell, f.cell, cipher.charAt(i),
               { fill: 'rgba(251,113,133,.09)',
                 stroke: use ? 'rgba(251,113,133,.95)' : 'rgba(251,113,133,.24)',
                 width: use ? 1.7 : 1, color: ROSE, fontSize: f.cell * 0.56 });
      }
      if (f.truncated) {
        E.chip(sx + f.width + 3, y + f.cell / 2 + 2, 16, f.cell, '…',
               { color: DIM, fontSize: 13 });
      }
      y += f.cell * 2 + 18;
    }

    const nBlocks = HL.blocks(PLAIN, k).length;
    const capW = Math.min(L.availW - 30, 470);

    /* ② 第 0 步只说明白账：k² 个未知数、k 组配对。 */
    if (stage === 0 || !E.state.showSolve) {
      E.chip(L.cx - capW / 2, y, capW, 24,
             E.t({ en: (k * k) + ' unknowns in M · each block gives ' + k +
                       ' equations · ' + k + ' blocks are enough',
                   zh: 'M 有 ' + (k * k) + ' 个未知数 · 每组配对给 ' + k +
                       ' 个方程 · ' + k + ' 组就够' }),
             { mono: true, color: SLATE, fontSize: 11,
               fill: CARD, stroke: LINE });
      y += 32;
    }

    /* ③ 失败的两种形状，各说各的话，绝不共用一句含糊的措辞。 */
    if (!R.ok) {
      const msg = R.reason === 'too-few'
        ? { en: 'only ' + R.blocksAvailable + ' block(s) known — need ' + R.need,
            zh: '只有 ' + R.blocksAvailable + ' 组已知配对 —— 需要 ' + R.need + ' 组' }
        : R.reason === 'dependent'
          ? { en: 'every set of ' + k + ' blocks is linearly dependent mod 26 (det ≡ ' +
                  (R.dets[0] != null ? R.dets[0] : '?') + ') — M is underdetermined',
              zh: '任取 ' + k + ' 组配对在模 26 下都线性相关（det ≡ ' +
                  (R.dets[0] != null ? R.dets[0] : '?') + '）—— M 是欠定的' }
          : { en: 'the pairs do not come from one Hill key (block ' + R.failedBlock + ' disagrees)',
              zh: '这些配对不来自同一把密钥（第 ' + R.failedBlock + ' 组对不上）' };
      const tone = R.reason === 'too-few' ? ORANGE : UNPAIRED;
      E.chip(L.cx - capW / 2, y, capW, 28, E.t(msg),
             { mono: true, color: tone, fontSize: 11,
               fill: tone === ORANGE ? 'rgba(251,146,60,.08)' : 'rgba(255,47,208,.08)',
               stroke: tone === ORANGE ? 'rgba(251,146,60,.40)' : 'rgba(255,47,208,.45)' });
      y += 34;
      if (y + 22 < L.H - L.bot) {
        E.chip(L.cx - capW / 2, y, capW, 20,
               E.t({ en: 'no key is returned — several keys fit these pairs equally well',
                     zh: '不给答案 —— 有好几把钥匙同样满足这些配对' }),
               { mono: true, color: SLATE, fontSize: 10.5 });
      }
      return;
    }

    if (stage === 0 || !E.state.showSolve) return;

    /* ④ M = Q · P⁻¹。三个矩阵一行摆开，按阶段逐个揭开。
       P 本身不单独画：它的列就是上面描了边的那 k 组明文分组，
       在报文条上指出来比再画一个矩阵更说明问题。 */
    /* 格宽由**总预算反解**，不是先拍一个上限再指望它够用：三个矩阵之外还有
       4 段间隙、2 个运算符，它们加起来在窄屏上比矩阵本身还宽。
       375px 上按 (availW − 150)/(3k) 算出的 37.5 让整排宽 365，加上方括号正好
       顶到 0 与 375 两条边——截图里 Q 的左括号与 M 的右括号各被切掉一半。
       "把数量放进空间里，别把尺寸压到下限再让它溢出"这条对矩阵排与报文条同样成立。 */
    const gap = L.narrow ? 14 : 26, opW = L.narrow ? 14 : 18;
    const cell = E.clamp((L.availW - 40 - gap * 4 - opW * 2) / (3 * k), 14, 38);
    const mw = k * cell, mh = k * cell;
    const totalW = mw * 3 + gap * 4 + opW * 2;
    const x0 = L.cx - totalW / 2;
    const xQ = x0, xO1 = xQ + mw + gap, xPi = xO1 + opW + gap,
          xO2 = xPi + mw + gap, xMh = xO2 + opW + gap;

    if (y + mh + 78 > L.H - L.bot) return;

    E.chip(L.cx - capW / 2, y, capW, 20,
           'det P ≡ ' + R.det + '  ·  gcd(det P, 26) = ' + CC.gcd(R.det, CC.N) +
           '  ·  ' + E.t({ en: 'blocks ', zh: '用了第 ' }) +
           cols.map(function (i) { return i + 1; }).join(', ') +
           E.t({ en: ' of ' + nBlocks, zh: ' 组 / 共 ' + nBlocks + ' 组' }),
           { mono: true, color: CYAN, fontSize: 10.5 });
    /* +42 而不是 +26：矩阵名（Q / P⁻¹ / M）画在 y − 18 处，只让出 26 会让那三个
       字母与这行说明**竖直重叠 12px**，截图里就是一行字压在另一行字上。
       仿射页在同一类地方栽过两次，教训是把纵向分带显式算清楚，别各处各加一个
       随手的偏移量。 */
    y += 42;

    drawMatrix(xQ, y, cell, k, k, {
      bracket: ROSE, text: matText(R.Q), textColor: function () { return ROSE; }
    });
    E.chip(xQ - 6, y - 18, mw + 12, 16, 'Q', { color: ROSE, fontSize: 11 });
    E.chip(xO1, y + mh / 2 - 10, opW, 20, '·', { color: SLATE, fontSize: 16 });

    if (stage >= 2) {
      drawMatrix(xPi, y, cell, k, k, {
        bracket: CYAN, text: matText(R.Pinv), textColor: function () { return CYAN; }
      });
      E.chip(xPi - 6, y - 18, mw + 12, 16, 'P⁻¹', { color: CYAN, fontSize: 11 });
    } else {
      E.chip(xPi, y, mw, mh, '?', { stroke: 'rgba(45,212,234,.30)', color: DIM,
                                    fontSize: cell * 0.6, radius: 4 });
      E.chip(xPi - 6, y - 18, mw + 12, 16, 'P⁻¹', { color: DIM, fontSize: 11 });
    }
    E.chip(xO2, y + mh / 2 - 10, opW, 20, '=', { color: SLATE, fontSize: 16 });

    if (stage >= 3) {
      const right = stage >= 4 && HL.keyLetters(R.M) === HL.keyLetters(M);
      drawMatrix(xMh, y, cell, k, k, {
        bracket: right ? EMERALD : VIOLET,
        text: matText(R.M),
        fill: right ? function () { return 'rgba(52,211,153,.14)'; } : null,
        textColor: function () { return right ? EMERALD : VIOLET; }
      });
      E.chip(xMh - 6, y - 18, mw + 12, 16, 'M', { color: right ? EMERALD : VIOLET, fontSize: 11 });
    } else {
      E.chip(xMh, y, mw, mh, '?', { stroke: 'rgba(167,139,250,.30)', color: DIM,
                                    fontSize: cell * 0.6, radius: 4 });
      E.chip(xMh - 6, y - 18, mw + 12, 16, 'M', { color: DIM, fontSize: 11 });
    }
    y += mh + 20;

    /* ⑤ 判定。还原出来的密钥与真钥匙逐字母比对——相等这件事是当场算的，
       不是文案里声称的。 */
    if (stage >= 4 && E.state.showCheck && y + 26 < L.H - L.bot) {
      const same = HL.keyLetters(R.M) === HL.keyLetters(M);
      E.chip(L.cx - capW / 2, y, capW, 26,
             same
               ? E.t({ en: 'recovered ' + HL.keyLetters(R.M) + '  =  the real key, exactly',
                       zh: '还原出 ' + HL.keyLetters(R.M) + '  =  真钥匙，一字不差' })
               : E.t({ en: 'recovered ' + HL.keyLetters(R.M) + '  ≠  ' + HL.keyLetters(M),
                       zh: '还原出 ' + HL.keyLetters(R.M) + '  ≠  ' + HL.keyLetters(M) }),
             { mono: true, color: same ? EMERALD : UNPAIRED, fontSize: 11.5,
               fill: same ? 'rgba(52,211,153,.10)' : 'rgba(255,47,208,.10)',
               stroke: same ? 'rgba(52,211,153,.45)' : 'rgba(255,47,208,.45)' });
      y += 32;
      if (y + 20 < L.H - L.bot) {
        E.chip(L.cx - capW / 2, y, capW, 20,
               E.t({ en: 'no search, no statistics — one matrix inverse',
                     zh: '没有搜索，没有统计 —— 只有一次矩阵求逆' }),
               { mono: true, color: SLATE, fontSize: 10.5 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const k = curK();
    const A = attackOf();
    const R = A.R;
    const det = CC.matDet(A.M, CC.N);
    let s = E.t({ en: 'known plaintext attack · ', zh: '已知明文攻击 · ' }) +
      '<b style="--c:var(--trace-violet)">' + (k * k) +
      E.t({ en: ' unknowns', zh: ' 个未知数' }) + '</b>' +
      '<span class="dim">   ' +
      E.t({ en: R.blocksAvailable + ' blocks known', zh: '已知 ' + R.blocksAvailable + ' 组配对' }) +
      '</span><br>';

    if (!R.ok) {
      const line = R.reason === 'too-few'
        ? { en: 'need ' + R.need + ' blocks, have ' + R.blocksAvailable,
            zh: '需要 ' + R.need + ' 组，只有 ' + R.blocksAvailable + ' 组' }
        : R.reason === 'dependent'
          ? { en: 'all ' + R.tried + ' candidate sets are dependent mod 26',
              zh: '试过的 ' + R.tried + ' 组组合在模 26 下全都线性相关' }
          : { en: 'pairs disagree at block ' + R.failedBlock,
              zh: '第 ' + R.failedBlock + ' 组配对对不上' };
      return s +
        '<b style="--c:var(--trace-unpaired)">' + E.t(line) + '</b><br>' +
        '<span class="dim">' +
        E.t({ en: 'the attack returns no key rather than a wrong one',
              zh: '攻击不给答案，而不是给一把错的' }) + '</span>';
    }

    const same = HL.keyLetters(R.M) === HL.keyLetters(A.M);
    return s +
      '<b style="--c:var(--trace-emerald)"><i>M</i> = ' + HL.keyLetters(R.M) + '</b>' +
      '<span class="dim">   ' +
      E.t({ en: 'from blocks ', zh: '用第 ' }) +
      R.cols.map(function (i) { return i + 1; }).join(', ') +
      E.t({ en: '', zh: ' 组' }) + '</span><br>' +
      '<span class="dim">det P ≡ ' + R.det + ' · gcd = ' + CC.gcd(R.det, CC.N) +
      ' · ' + E.t({ en: 'verified on all ' + R.checked + ' blocks',
                    zh: '在全部 ' + R.checked + ' 组上验证通过' }) + '</span><br>' +
      (same
        ? '<span class="dim">' +
          E.t({ en: 'exact — not "most likely"', zh: '精确 —— 不是"最可能的"' }) + '</span>'
        : '<b style="--c:var(--trace-unpaired)">' +
          E.t({ en: 'does not match the real key', zh: '与真钥匙不一致' }) + '</b>') +
      '<br><span class="dim">' +
      E.t({ en: 'the attack inverts P, not M — det M ≡ ' + det + ' does not protect it',
            zh: '攻击求的是 P 的逆而不是 M 的逆 —— det M ≡ ' + det + ' 保护不了它' }) +
      '</span>';
  }
};

var SCENES = { transform: transform, geometry: geometry, break: brk };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个预置并调它的 onSelect，而那个回调要往 textarea 里写字。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* init() 之后滑杆才存在。k 那一根要能被 geometry 页签写回去（它进场时把 k 拨回
   2），所以这里把 DOM 抓住。取的是**第一根**：PARAMS 的声明顺序是 [k, speed]，
   而 querySelectorAll 按文档顺序返回，两者同源。不按 key 找是因为引擎没有把
   paramWraps 导出来；真要改成按 key 找得先改引擎，那是另一件事，不该顺手夹带
   在一个工具页里。 */
const ranges = document.querySelectorAll('#paramsHost input[type=range]');
kInput = ranges[0] || null;
if (kInput) {
  kValEl = kInput.parentNode.querySelector('.val');
  kInput.addEventListener('input', function () {
    if (keyInput) keyInput.value = KEYS[curK()];
  });
}

/* 页签按钮是引擎在 init() 里建的，所以这条绑定必须排在 init() 之后。 */
bindTabTracking();

/* 三条时间轴在这里一次建齐，而不是各自等页签第一次 draw 时懒建。懒建有一条
   真实的缝：切到某个页签之后、它的第一帧画出来之前，⏭ 找不到时间轴，那一次
   点击被静默丢掉。实测撞到过——「点页签、连按四次 ⏭」只走了三步。
   步数与各自 draw() 里那次 timelineFor 必须用同一个式子，否则第一帧会因为
   步数不同而换掉时间轴，等于白建。 */
(function primeTimelines() {
  const k = curK();
  const nb = HL.blocks(PLAIN, k).length;
  timelineFor('transform', Math.max(1, Math.min(nb, TX_BLOCKS)) * k * k, 0.42);
  timelineFor('geometry', 2, 1.9);
  timelineFor('break', STAGES, 0.95);
})();
</script>
</body>
</html>
