}
/* 第一道防线是**换一句短的**，不是截断。界线 470 与
   crypto-hash-functions.html / crypto-codes-morse.html 一致。 */
function nar(L, wideMsg, narrowMsg) {
  return E.t(L.availW < 470 ? narrowMsg : wideMsg);
}

/* ================= 物理层 =================
   全部建立在 core/quantum-sim.js 上，本页一行量子力学都不自己实现——
   贝尔态、分析器、联合概率、关联函数 E、CHSH 与抽样测量都在那里。
   本页只多做三件核心刻意不做的事（核心文件开头写着为什么："E91 的协议级
   流程属于 crypto-e91 那一页"）：把两个单比特态张成一个可分离双比特态、
   一个**定域隐变量**模型、以及拦截—重发之后那个混合态的联合概率。

   为什么这三件放在页面里而不是塞回核心：它们都是**这一页的论证**，不是
   共享原语。可分离态是这一页的负对照，隐变量模型是这一页要反驳的对象，
   拦截—重发的混合是这一页的 Eve。核心此刻是冻结的（第 5 章五个页面在
   同时开工），而这三件东西没有第二个消费者。 */

const SINGLET = Q.bellState('psi-');          // |ψ⁻⟩：E91 用的那一个
const CH = Q.CHSH_ANGLES;                     // {a:0, aP:π/2, b:π/4, bP:3π/4}
const TSIRELSON = 2 * Math.SQRT2;             // 2√2 = 2.8284271247461903
const CLASSICAL = 2;

/* 张量积：|u⟩⊗|v⟩ 的四个振幅，下标 = 2·a + b（与核心的双比特约定一致）。
   模长自动是 1（两个单位向量的积），所以 assertPair 那道断言过得去。 */
function productPair(u, v) {
  return [Q.cMul(u.a, v.a), Q.cMul(u.a, v.b), Q.cMul(u.b, v.a), Q.cMul(u.b, v.b)];
}
/* 结果下标与 ±1 的对应：0 ↦ +1、1 ↦ −1，于是
   E = p00 + p11 − p01 − p10 恰好是 ⟨A·B⟩——与核心 correlation() 同一个约定。 */
function valOf(i) { return i === 0 ? 1 : -1; }

/* 纯态模型：关联、联合概率、单次测量全部直接落到核心。 */
function pureModel(pair) {
  return {
    kind: 'quantum',
    corr: function (ta, tb) { return Q.correlation(pair, ta, tb); },
    joint: function (ta, tb) { return Q.jointProbabilities(pair, ta, tb); },
    sample: function (ta, tb, rng) {
      const m = Q.measurePair(pair, ta, tb, rng);
      return [m.a, m.b];
    }
  };
}

/* 把角度差折进 [0, π]。关联只依赖差，且对差取偶。 */
function foldPi(d) {
  let x = ((d % TAU) + TAU) % TAU;
  if (x > Math.PI) x = TAU - x;
  return x;
}

/* 定域隐变量模型 —— 这一页要反驳的那个对象，写成代码而不是写成一句话。
   每一对粒子出厂时带一个共享的隐变量 λ（平面上的一个方向），两边各自
   **只看自己的分析器角度和 λ**：
       A(θa, λ) = sign cos(θa − λ)          爱丽丝手里的那张卡
       B(θb, λ) = −sign cos(θb − λ)         鲍勃手里的那张（相反的）卡
   这就是"结果早就定好了"的字面意思：没有任何一边需要知道另一边选了什么。
   它的关联是三角波 E = −1 + 2Δ/π，在 Δ = 0、π/2、π 三处与量子预言**完全
   重合**——包括"同角度必然相反"这条 E91 用来生成密钥的性质。这正是它
   危险的地方，也是这一页第三个页签的全部内容。 */
const LHV = {
  kind: 'classical',
  corr: function (ta, tb) { return -1 + 2 * foldPi(ta - tb) / Math.PI; },
  joint: function (ta, tb) {
    /* 两边的边缘分布都是公平硬币（λ 均匀），所以四个联合概率由 E 唯一决定。 */
    const e = LHV.corr(ta, tb);
    return [(1 + e) / 4, (1 - e) / 4, (1 - e) / 4, (1 + e) / 4];
  },
  sample: function (ta, tb, rng) {
    const lam = rng() * TAU;
    const A = Math.cos(ta - lam) >= 0 ? 1 : -1;
    const B = Math.cos(tb - lam) >= 0 ? -1 : 1;
    return [A > 0 ? 0 : 1, B > 0 ? 0 : 1];
  }
};

/* 拦截—重发：Eve 在方向 θe 上把两个粒子都测了，再把塌缩后的态发出去。
   单态在**任何**同一方向上都完全反关联，所以她拿到的只可能是两种结果，
   各一半概率；信道里流的于是是两个可分离态的等权混合。
   混合态核心不表示（它只吃纯态），所以这里按两支各算一遍再取平均——
   这与"先按 1/2 抽一支、再在那一支上测量"是同一个分布，sample() 就是
   那条抽样路径，两条路径在本页的浏览器探针里比对过（20 万次抽样，最大
   偏差 2.2e-3，而 2/√N = 4.5e-3）。 */
function resendModel(thetaE) {
  const u = Q.analyser(thetaE);
  const br = [productPair(u[0], u[1]), productPair(u[1], u[0])];
  return {
    kind: 'resend',
    corr: function (ta, tb) {
      return 0.5 * (Q.correlation(br[0], ta, tb) + Q.correlation(br[1], ta, tb));
    },
    joint: function (ta, tb) {
      const p = Q.jointProbabilities(br[0], ta, tb);
      const q = Q.jointProbabilities(br[1], ta, tb);
      return [0.5 * (p[0] + q[0]), 0.5 * (p[1] + q[1]),
              0.5 * (p[2] + q[2]), 0.5 * (p[3] + q[3])];
    },
    sample: function (ta, tb, rng) {
      const m = Q.measurePair(br[rng() < 0.5 ? 0 : 1], ta, tb, rng);
      return [m.a, m.b];
    }
  };
}

/* CHSH：S = E(a,b) − E(a,b′) + E(a′,b) + E(a′,b′)。四项的符号写成数据而不是
   写死在表达式里——页面要把这四项连同它们的符号一根一根画出来，两处各写
   一遍迟早会有一处漏掉那个负号。 */
const CHSH_TERMS = [
  { A: 'a',  B: 'b',  sign: 1  },
  { A: 'a',  B: 'bP', sign: -1 },
  { A: 'aP', B: 'b',  sign: 1  },
  { A: 'aP', B: 'bP', sign: 1  }
];
function termAngles(k, g) {
  g = g || CH;
  return [g[CHSH_TERMS[k].A], g[CHSH_TERMS[k].B]];
}
function chshOf(model, g) {
  let S = 0;
  for (let k = 0; k < 4; k++) {
    const ab = termAngles(k, g);
    S += CHSH_TERMS[k].sign * model.corr(ab[0], ab[1]);
  }
  return S;
}
function sampleE(model, ta, tb, N, seed) {
  const rng = Q.rng32(seed);
  let acc = 0;
  for (let i = 0; i < N; i++) {
    const o = model.sample(ta, tb, rng);
    acc += valOf(o[0]) * valOf(o[1]);
  }
  return acc / N;
}
/* 抽样版。每一项**各用各的种子**（seed + k·7919），这样改 N 时四项各自
   独立收敛，不会因为共用一条流而彼此相关。种子写死 ⇒ 屏幕上的 S 每次
   打开都一样，这是本页的硬要求。 */
function chshSampled(model, N, seed, g) {
  const terms = [];
  let S = 0;
  for (let k = 0; k < 4; k++) {
    const ab = termAngles(k, g);
    const e = sampleE(model, ab[0], ab[1], N, seed + k * 7919);
    terms.push(e);
    S += CHSH_TERMS[k].sign * e;
  }
  return { S: S, terms: terms };
}
/* 误差带。每一项的标准误是 √((1−E²)/N) ≤ 1/√N，四项各用各的种子、互相
   独立，所以 S 的标准误 ≤ 2/√N；页面上画的是**两个**标准误，即 4/√N。
   两条都要说清楚，因为都被踩过：
     · 分母是从方差推出来的，不是拍出来的常数。魔数在 N 变大时会莫名变松、
       在 N 变小时会莫名变紧。
     · 画一个标准误的带子会让读者以为"真值应该落在带内"，而单标准误的带子
       本来就有三分之一的时候不含真值——实测：N=1000、源取预定清单时，
       抽样 |S| = 1.898 而真值 2.000，偏差 1.86 个标准误。那不是 bug，
       是带子的含义被画窄了。两个标准误约 95%，读者读到的和看到的才一致。
   屏幕上的文案因此写明"±2 s.e."，不写成一个没有单位的 ±。 */
function sTolerance(N) { return 4 / Math.sqrt(N); }

/* 密钥错误率：双方把分析器摆到**同一个**方向 θ 时，"结果没有相反"的概率。
   E91 的筛后密钥就是从这些同角度的对里来的，所以这个数就是 BB84 里那个
   QBER 的对应物。夹进 [0,1]：单态的 E(θ,θ) 是 −1 减去一个 ulp，不夹的话
   屏幕上会印出 "−0.00%"，一个负的错误率会让读者以为哪里算错了。 */
function keyError(model, theta) {
  const p = (1 + model.corr(theta, theta)) / 2;
  return p < 0 ? 0 : (p > 1 ? 1 : p);
}

/* 记忆化。抽样是纯函数（模型 + 角度 + N + 种子），但一帧要算好几次，
   而 N 可以到 10⁴——不缓存的话每帧四万次 measurePair，页面会卡住。
   缓存有上限：角度是连续滑杆，键的数量原则上无界。 */
const CACHE = Object.create(null);
let cacheKeys = 0;
function cached(key, fn) {
  if (!(key in CACHE)) {
    if (cacheKeys > 360) {
      Object.keys(CACHE).forEach(function (k) { delete CACHE[k]; });
      cacheKeys = 0;
    }
    CACHE[key] = fn();
    cacheKeys++;
  }
  return CACHE[key];
}

/* ================= 状态 ================= */
/* 屏幕上那串结果的种子，写死——屏幕上印的每一个数都必须每次打开都一样。
   为什么是这个数而不是随手一个：窄屏只放得下 17 列，而在默认的 Δ = 45°
   下（p(同号) = 0.146）17 列里期望有 2.5 个同号。第一个试的种子
   （20260810）前 17 列**恰好一个同号都没有**——概率 6.7%，不是 bug，
   但窄屏用户看到的是一条全绿的 AB 行，与 Δ = 0 那张图长得一模一样，
   于是这一页最要紧的对比在小屏上消失了。20260817 的前 17 列有 3 个同号、
   前 40 列有 6 个（期望 2.5 / 5.9）。挑一个前缀有代表性的种子是刻意的，
   写在这里免得下一个人以为它是随手敲的。 */
const STREAM_SEED = 20260817;
const CHSH_SEED   = 424242;        // S 抽样的种子，写死
const STREAM_LEN  = 40;            // 结果条最多这么多列（放不下时如实说明）

function thetaA() { return (E.state.thetaA || 0) * DEG; }
function thetaB() { return ((E.state.thetaA || 0) + (E.state.delta || 0)) * DEG; }
function thetaE() { return (E.state.eveAngle || 0) * DEG; }
function trials() { return E.state.trials || 1000; }

/* ---- 动画时钟 ----
   单一真相分两半：**播放与否**归引擎的 state.running，**走到第几步**归时间轴。
   时间轴一建好就 play() 并且永不 pause()——真正的闸门是 tickClock() 里那个
   state.running 判断。本页的时间轴只驱动"哪一对正在飞"这一个高亮游标：
   页面**暂停时内容是完整的**（所有结果都画着），动起来只是多一根游标。
   这条选择是刻意的——一个必须先按播放才看得懂的静态截图是坏截图。 */
const TL = CryptoAnim.createTimeline({ steps: STREAM_LEN, stepDuration: 0.5,
                                       loop: true, rate: 1 });
TL.play();
function tickClock() {
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
}
document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把时间轴也拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true，置 false 之后 tick 就永久哑火了。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

/* ================= 源（bell 页签的预置） ================= */
let SOURCE = 'psi-';
const SOURCE_LABEL = {
  'psi-': { en: 'singlet |ψ⁻⟩', zh: '单态 |ψ⁻⟩' },
  'phi+': { en: 'Bell |φ⁺⟩', zh: '贝尔态 |φ⁺⟩' },
  'prod': { en: 'product |0⟩⊗|0⟩', zh: '可分离态 |0⟩⊗|0⟩' },
  'lhv':  { en: 'pre-decided list', zh: '预先定好的清单' }
};
const PROD_STATE = productPair(Q.KET.zero, Q.KET.zero);
function sourceModel(key) {
  if (key === 'phi+') return pureModel(Q.bellState('phi+'));
  if (key === 'prod') return pureModel(PROD_STATE);
  if (key === 'lhv') return LHV;
  return pureModel(SINGLET);
}
const SOURCE_PRESETS = ['psi-', 'phi+', 'prod', 'lhv'].map(function (k) {
  return { key: k, label: SOURCE_LABEL[k], onSelect: function () { SOURCE = k; } };
});
const SOURCE_PRESETS_LABEL = { en: 'Source', zh: '源' };

/* ================= Eve 的策略（eavesdrop 页签的预置） ================= */
let EVE = 'none';
const EVE_KEYS = ['none', 'resend', 'lhv'];
const EVE_LABEL = {
  none:   { en: 'No Eve', zh: '没有伊芙' },
  resend: { en: 'Intercept–resend', zh: '拦截—重发' },
  lhv:    { en: 'Pre-decided source', zh: '预定结果的源' }
};
const EVE_NARROW = {
  none:   { en: 'No Eve', zh: '无伊芙' },
  resend: { en: 'Resend', zh: '重发' },
  lhv:    { en: 'Pre-decided', zh: '预定' }
};
function eveModel(key) {
  if (key === 'resend') return resendModel(thetaE());
  if (key === 'lhv') return LHV;
  return pureModel(SINGLET);
}
const EVE_PRESETS = EVE_KEYS.map(function (k) {
  return { key: k, label: EVE_LABEL[k], onSelect: function () { EVE = k; } };
});
const EVE_PRESETS_LABEL = { en: 'Eve', zh: '伊芙' };

/* ================= 图元 ================= */

/* 分析器刻度盘。θ 是 Bloch 角（核心 analyser() 的约定）：屏幕上 0° 指向
   正上方，逆时针为正。分析器是一根**轴**不是一个箭头——两端是 + 和 −，
   所以画整条直径，不画箭头。 */
function dial(cx, cy, r, theta, color, outcome) {
  ring(cx, cy, r, LINE, 1);
  const a = -Math.PI / 2 + theta;
  const dx = Math.cos(a) * r, dy = Math.sin(a) * r;
  seg(cx - dx, cy - dy, cx + dx, cy + dy, { color: color, width: 2 });
  dot(cx + dx, cy + dy, 3, color);
  dot(cx - dx, cy - dy, 2.5, 'rgba(159,176,200,.6)');
  if (outcome != null) {
    /* 结果落在被选中的那一端：0 ↦ +（轴的正头），1 ↦ −（另一头）。 */
    const s = outcome === 0 ? 1 : -1;
    dot(cx + dx * s, cy + dy * s, 6, color);
  }
}

/* 折线画的 E(Δ) 曲线。fn 是弧度进、[−1,1] 出的关联函数。 */
function curveOf(fn, x, w, yMid, hHalf, dMax) {
  const pts = [];
  const steps = 60;
  for (let i = 0; i <= steps; i++) {
    const d = dMax * i / steps;
    pts.push([x + w * i / steps, yMid - fn(d) * hHalf]);
  }
  return pts;
}

/* 关联图。curves 是 [{ corr, color, dash }]；marks 是要在当前 Δ 上标出来
   的点（带可选误差带）。 */
function corrPlot(L, y, h, curves, deltaRad, marks) {
  const x = L.x0 + 26, w = L.availW - 26;
  const yTop = y + 6, hHalf = (h - 26) / 2, yMid = yTop + hHalf;

  seg(x, yTop, x, yTop + hHalf * 2, { color: LINE });
  seg(x, yMid, x + w, yMid, { color: 'rgba(148,163,184,.30)', dash: [3, 3] });
  text(x - 5, yTop - 8, '+1', { size: 10, color: DIM, math: true, align: 'right' });
  text(x - 5, yMid - 8, '0',  { size: 10, color: DIM, math: true, align: 'right' });
  text(x - 5, yTop + hHalf * 2 - 8, '−1', { size: 10, color: DIM, math: true, align: 'right' });

  /* Δ 刻度。最外侧两根刻度线正好压在可用区两端，所以标签必须夹回来。 */
  const ticks = [0, 45, 90, 135, 180];
  for (let i = 0; i < ticks.length; i++) {
    const tx = x + w * ticks[i] / 180;
    seg(tx, yTop + hHalf * 2, tx, yTop + hHalf * 2 + 4, { color: LINE });
    text(tx, yTop + hHalf * 2 + 5, ticks[i] + '°',
         { size: 10, color: DIM, math: true, align: 'center', lh: 14,
           lo: L.x0, hi: L.x0 + L.availW });
  }

  for (let i = 0; i < curves.length; i++) {
    poly(curveOf(curves[i].corr, x, w, yMid, hHalf, Math.PI),
         curves[i].color, curves[i].width || 1.8, curves[i].dash);
  }

  const mx = x + w * (foldPi(deltaRad) / Math.PI);
  if (marks && marks.length) {
    seg(mx, yTop, mx, yTop + hHalf * 2, { color: 'rgba(148,163,184,.30)', dash: [2, 4] });
  }
  (marks || []).forEach(function (m) {
    const my = yMid - m.value * hHalf;
    if (m.band) {
      const bh = Math.max(3, m.band * hHalf);
      seg(mx, my - bh, mx, my + bh, { color: m.color, width: 1.2 });
      seg(mx - 4, my - bh, mx + 4, my - bh, { color: m.color, width: 1.2 });
      seg(mx - 4, my + bh, mx + 4, my + bh, { color: m.color, width: 1.2 });
    }
    dot(mx, my, m.r || 4, m.color);
  });
  return h + 12;
}

/* |S| 量表：0 … 经典上界 2 … Tsirelson 2√2 … 3。
   两条界线的位置是画面上唯一重要的两个刻度，所以它们**压在柱子之上**画。
   经典上界 2 不做成开关：它是这一页的全部论点，能关掉的论点不是论点。 */
function sMeter(L, y, entries, opts) {
  opts = opts || {};
  const x = L.x0, w = L.availW, sMax = 3;
  const barY = y + 2, barH = 15, gap = 5;
  const px = function (v) { return x + w * Math.max(0, Math.min(sMax, v)) / sMax; };
  const hTot = barH * entries.length + gap * (entries.length - 1);

  pill(x, barY, w, hTot, { fill: 'rgba(8,13,24,.4)' });
  let yy = barY;
  for (let i = 0; i < entries.length; i++) {
    const en = entries[i];
    const v = Math.abs(en.value);
    const over = v > CLASSICAL + 1e-9;
    if (en.outline) {
      pill(x, yy, Math.max(3, px(v) - x), barH,
           { stroke: over ? V_EDGE : O_EDGE, fill: over ? 'rgba(167,139,250,.16)' : 'rgba(251,146,60,.14)' });
    } else {
      pill(x, yy, Math.max(3, px(v) - x), barH,
           { fill: over ? 'rgba(167,139,250,.55)' : 'rgba(251,146,60,.45)' });
    }
    if (en.band) {
      seg(px(v - en.band), yy + barH / 2, px(v + en.band), yy + barH / 2,
          { color: EMERALD, width: 1.4 });
    }
    if (en.label) {
      text(x + 7, yy, fitText(en.label, w - 20, 10.5, false),
           { size: 10.5, color: en.labelColor || BRIGHT, lh: barH });
    }
    yy += barH + gap;
  }

  seg(px(CLASSICAL), barY - 5, px(CLASSICAL), barY + hTot + 5, { color: ORANGE, width: 2 });
  if (opts.tsirelson !== false) {
    seg(px(TSIRELSON), barY - 5, px(TSIRELSON), barY + hTot + 5,
        { color: VIOLET, width: 1.5, dash: [4, 3] });
  }

  const labY = barY + hTot + 7;
  text(px(0) + 2, labY, '0', { size: 10, color: DIM, math: true, lh: 14 });
  text(px(CLASSICAL), labY,
       nar(L, { en: '2  classical bound', zh: '2  经典上界' },
              { en: '2 classical', zh: '2 经典界' }),
       { size: 10.5, color: ORANGE, align: 'center', lh: 14, lo: x, hi: x + w });
  if (opts.tsirelson !== false) {
    text(px(TSIRELSON), labY + 15,
         nar(L, { en: '2√2  Tsirelson bound', zh: '2√2  Tsirelson 上界' },
                { en: '2√2 Tsirelson', zh: '2√2 上界' }),
         { size: 10.5, color: VIOLET, align: 'center', lh: 14, lo: x, hi: x + w });
  }
  return (labY + (opts.tsirelson === false ? 16 : 31)) - y;
}

/* ================= 页签一：纠缠对 ================= */

/* 屏幕上那串结果。纯函数（模型 + 两个角度 + 种子），所以每次打开都一样。 */
function streamOf(model, ta, tb, key) {
  return cached('stream|' + key + '|' + ta.toFixed(6) + '|' + tb.toFixed(6), function () {
    const rng = Q.rng32(STREAM_SEED);
    const out = [];
    for (let i = 0; i < STREAM_LEN; i++) out.push(model.sample(ta, tb, rng));
    return out;
  });
}

function channelRow(L, y, ta, tb, evePresent, cur) {
  const h = L.wide ? 136 : 122;
  const r = Math.max(20, Math.min(34, L.availW * 0.10));
  const cy = y + h * 0.40;
  const ax = L.x0 + r + 4, bx = L.x0 + L.availW - r - 4;
  const cx = (ax + bx) / 2;

  seg(ax + r, cy, bx - r, cy, { color: 'rgba(148,163,184,.28)', dash: [3, 4] });

  /* 飞行中的两个光子：从源出发向两侧。progress 只在播放时前进。 */
  const p = 0.15 + 0.85 * TL.progress;
  E.glowDot([cx - (cx - ax - r) * p, cy], 9, 'rgba(167,139,250,.85)', 'rgba(167,139,250,.25)');
  E.glowDot([cx + (bx - r - cx) * p, cy], 9, 'rgba(167,139,250,.85)', 'rgba(167,139,250,.25)');

  if (evePresent) {
    const ex = cx + (bx - r - cx) * 0.55;
    pill(ex - 17, cy - 13, 34, 26, { fill: O_SOFT, stroke: O_EDGE });
    cellText(ex - 17, cy - 13, 34, 26, 'E', ORANGE, 13);
  }

  E.glowDot([cx, cy], 20, 'rgba(167,139,250,.55)', 'rgba(167,139,250,.16)');
  dot(cx, cy, 5, VIOLET);
  text(cx, cy + 14, nar(L, { en: 'entangled source', zh: '纠缠源' },
                           { en: 'source', zh: '源' }),
       { size: 10.5, color: VIOLET, align: 'center', lh: 15, lo: L.x0, hi: L.x0 + L.availW });

  dial(ax, cy, r, ta, CYAN, cur ? cur[0] : null);
  dial(bx, cy, r, tb, ROSE, cur ? cur[1] : null);

  const lo = L.x0, hi = L.x0 + L.availW;
  text(ax, cy + r + 6, E.t({ en: 'Alice', zh: '爱丽丝' }),
       { size: 11.5, color: CYAN, align: 'center', lh: 15, lo: lo, hi: hi });
  text(bx, cy + r + 6, E.t({ en: 'Bob', zh: '鲍勃' }),
       { size: 11.5, color: ROSE, align: 'center', lh: 15, lo: lo, hi: hi });
  text(ax, cy + r + 21, 'θa = ' + Math.round(ta / DEG) + '°',
       { size: 11, color: CYAN, math: true, align: 'center', lh: 15, lo: lo, hi: hi });
  text(bx, cy + r + 21, 'θb = ' + Math.round(tb / DEG) + '°',
       { size: 11, color: ROSE, math: true, align: 'center', lh: 15, lo: lo, hi: hi });
  return h;
}

function outcomeRows(L, y, stream) {
  const gut = 30;
  const av = L.availW - gut;
  const f = E.fitCells(av, STREAM_LEN, { gap: 3, min: 13, max: 20 });
  const x = L.x0 + gut, cell = f.cell;
  const rows = [
    { lab: 'A',  color: CYAN, soft: C_SOFT, edge: C_EDGE, val: function (o) { return valOf(o[0]); } },
    { lab: 'B',  color: ROSE, soft: R_SOFT, edge: R_EDGE, val: function (o) { return valOf(o[1]); } },
    { lab: 'AB', color: null, soft: null,   edge: null,
      val: function (o) { return valOf(o[0]) * valOf(o[1]); } }
  ];
  let yy = y;
  for (let ri = 0; ri < rows.length; ri++) {
    const row = rows[ri];
    text(L.x0, yy + (cell - 15) / 2, row.lab,
         { size: 10.5, color: row.color || SLATE, math: true, lh: 15 });
    for (let i = 0; i < f.n; i++) {
      const v = row.val(stream[i]);
      /* 第三行按"是否反关联"上色：−1（相反）是单态的常态，用 emerald；
         +1（相同）在 Δ=0 时**一次都不该出现**，用 orange 让它自己跳出来。 */
      const col  = row.color || (v < 0 ? EMERALD : ORANGE);
      const soft = row.soft  || (v < 0 ? E_SOFT : O_SOFT);
      const edge = row.edge  || (v < 0 ? E_EDGE : O_EDGE);
      const on = (i === TL.index % f.n);
      const cxx = x + i * (cell + 3);
      pill(cxx, yy, cell, cell, { fill: soft, stroke: on ? col : edge, width: on ? 1.8 : 1 });
      cellText(cxx, yy, cell, cell, v > 0 ? '+' : '−', col, Math.max(9, cell * 0.6));
    }
    yy += cell + 4;
  }
  /* 截断必须**说出来**，不能交给画布边缘去吃掉。后面那半句是看得见的
     那一段里有多少对是反关联的——没有它，"AB 行几乎全绿"只是一个印象。 */
  let anti = 0;
  for (let i = 0; i < f.n; i++) if (stream[i][0] !== stream[i][1]) anti++;
  const line = (f.truncated ? '1–' + f.n + ' / ' + STREAM_LEN : f.n + ' / ' + STREAM_LEN) +
    ' ' + E.t({ en: 'pairs shown', zh: '对已显示' }) + '  ·  ' + anti + '/' + f.n + ' ' +
    E.t({ en: 'opposite', zh: '反关联' });
  text(L.x0 + gut, yy, fitText(line, L.availW - gut, 10, true),
       { size: 10, color: DIM, math: true, lh: 15 });
  return (yy + 17) - y;
}

function drawPairs() {
  const L = layout();
  frameStart(L);
  tickClock();
  const ta = thetaA(), tb = thetaB();
  const model = pureModel(SINGLET);
  const stream = streamOf(model, ta, tb, 'psi-');
  const cur = stream[TL.index % STREAM_LEN];
  let y = L.top;

  y += tag(L.x0, y, L.availW,
           nar(L, { en: 'ONE PAIR, TWO DISTANT MEASUREMENTS',
                    zh: '一个纠缠对，两次相隔遥远的测量' },
                  { en: 'ONE PAIR, TWO MEASUREMENTS', zh: '一对，两次测量' }),
           VIOLET, 11.5) + 4;

  y += channelRow(L, y, ta, tb, false, cur) + 4;
  y += outcomeRows(L, y, stream) + 2;

  y += tag(L.x0, y, L.availW,
           nar(L, { en: 'CORRELATION E VS ANGLE GAP Δ', zh: '关联 E 随角度差 Δ 变化' },
                  { en: 'E VS Δ', zh: 'E 随 Δ 变化' }), EMERALD, 11.5) + 2;

  const N = trials();
  const eTh = model.corr(ta, tb);
  const eSm = cached('E|psi-|' + ta.toFixed(6) + '|' + tb.toFixed(6) + '|' + N,
                     function () { return sampleE(model, ta, tb, N, CHSH_SEED); });

  const curves = [{ corr: function (d) { return -Math.cos(d); }, color: VIOLET, width: 1.9 }];
  if (E.state.tClassical) {
    curves.push({ corr: function (d) { return LHV.corr(d, 0); }, color: ORANGE,
                  width: 1.5, dash: [5, 4] });
  }
  const marks = [{ value: eTh, color: VIOLET, r: 4 }];
  if (E.state.tSampled) {
    marks.push({ value: eSm, color: EMERALD, r: 3.5, band: 1 / Math.sqrt(N) });
  }
  const noteH = 68;
  const plotH = Math.max(70, Math.min(154, L.bottom - y - noteH - 8));
  y += corrPlot(L, y, plotH, curves, tb - ta, marks);

  note(L, y, nar(L,
    { en: 'The correlation only becomes visible after Alice and Bob compare notes over an ordinary classical channel — nothing here travels faster than light. Angles are Bloch-sphere directions; a physical polariser sits at half of them.',
      zh: '这些关联只有在爱丽丝和鲍勃通过普通的经典信道对照记录之后才看得见——这里没有任何东西超光速。角度是 Bloch 球上的方向，实际偏振片摆的是它的一半。' },
    { en: 'Visible only after both sides compare notes over a classical channel. Nothing travels faster than light.',
      zh: '只有双方经经典信道对照之后才看得见。这里没有任何东西超光速。' }), DIM, { maxLines: 4 });
}

/* ================= 页签二：贝尔不等式（顿悟视角） ================= */

/* 一项 E(x, y)：左边是带符号的名字，中间是一根从零位向左或向右长出去的
   柱子，右边是数值。柱子的颜色只表示**这个源最后有没有越过 2**，不表示
   E 的正负——正负已经由柱子朝哪边长说清楚了，再用颜色说一遍会把"越界"
   这个唯一重要的信号淹掉。 */
function termRow(L, y, k, e, over) {
  const labW = Math.min(112, L.availW * 0.33);
  const valW = Math.min(60, L.availW * 0.19);
  const barW = Math.max(40, L.availW - labW - valW - 12);
  const mid = L.x0 + labW + 6 + barW / 2;
  const T = CHSH_TERMS[k];
  const nameA = T.A === 'a' ? 'a' : 'a′', nameB = T.B === 'b' ? 'b' : 'b′';
  const fill = over ? 'rgba(167,139,250,.55)' : 'rgba(251,146,60,.5)';

  text(L.x0, y, (T.sign > 0 ? '+' : '−') + ' E(' + nameA + ', ' + nameB + ')',
       { size: 11.5, color: T.sign > 0 ? BRIGHT : ORANGE, math: true, lh: 20 });
  seg(mid, y + 1, mid, y + 19, { color: 'rgba(148,163,184,.30)' });
  const len = Math.max(1.5, Math.abs(e) * barW / 2);
  pill(e >= 0 ? mid : mid - len, y + 4, len, 12, { fill: fill, radius: 2 });
  text(L.x0 + L.availW, y, E.fmtS(e, 3),
       { size: 11, color: over ? VIOLET : ORANGE, math: true, align: 'right', lh: 20 });
  return 24;
}

function drawBell() {
  const L = layout();
  frameStart(L);
  tickClock();
  const model = sourceModel(SOURCE);
  const N = trials();
  let y = L.top;

  y += tag(L.x0, y, L.availW,
           nar(L, { en: 'CHSH AT THE CANONICAL ANGLES', zh: 'CHSH 在教科书那组角度上' },
                  { en: 'CHSH · CANONICAL ANGLES', zh: 'CHSH · 那组角度' }), VIOLET, 11.5) + 2;

  const angW = Math.min(78, (L.availW - 18) / 4);
  const angs = [['a', CH.a], ['a′', CH.aP], ['b', CH.b], ['b′', CH.bP]];
  for (let i = 0; i < 4; i++) {
    const xx = L.x0 + i * (angW + 6);
    pill(xx, y, angW, 22, { fill: i < 2 ? C_SOFT : R_SOFT, stroke: i < 2 ? C_EDGE : R_EDGE });
    cellText(xx, y, angW, 22, angs[i][0] + ' = ' + Math.round(angs[i][1] / DEG) + '°',
             i < 2 ? CYAN : ROSE, 11);
  }
  y += 28;

  const S = chshOf(model);
  const over = Math.abs(S) > CLASSICAL + 1e-9;
  for (let k = 0; k < 4; k++) {
    const ab = termAngles(k);
    y += termRow(L, y, k, model.corr(ab[0], ab[1]), over);
  }
  y += 6;

  const entries = [{ value: S,
                     label: E.t({ en: 'theory', zh: '理论' }),
                     labelColor: BRIGHT }];
  if (E.state.tSampledS) {
    const smp = cached('S|' + SOURCE + '|' + N,
                       function () { return chshSampled(model, N, CHSH_SEED); });
    entries.push({ value: smp.S, band: sTolerance(N), outline: true,
                   label: E.t({ en: 'sampled', zh: '抽样' }) +
                          ' N = ' + N.toLocaleString('en-US') +
                          E.t({ en: ' · bar = ±2 s.e.', zh: ' · 横杠 = ±2 个标准误' }),
                   labelColor: EMERALD });
  }
  y += sMeter(L, y, entries, { tsirelson: E.state.tTsirelson !== false }) + 4;

  /* |S| 与结论分成两块：数学符号走 serif italic，结论是散文走无衬线。 */
  const sw = Math.min(148, L.availW * 0.45);
  tag(L.x0, y, sw, '|S| = ' + Math.abs(S).toFixed(6), over ? VIOLET : ORANGE, 12,
      { fill: over ? V_SOFT : O_SOFT, stroke: over ? V_EDGE : O_EDGE, h: 20, math: true });
  tag(L.x0 + sw + 8, y, L.availW - sw - 8,
      over ? nar(L, { en: 'above 2 — no pre-decided outcomes can do this',
                      zh: '超过 2 —— 任何预先定好的结果都做不到' },
                    { en: 'above 2 — nothing pre-decided does this',
                      zh: '超过 2 —— 预定结果做不到' })
           : nar(L, { en: 'not above 2 — a pre-decided list explains it',
                      zh: '没超过 2 —— 一份预先定好的清单就能解释' },
                    { en: 'not above 2 — pre-decided explains it',
                      zh: '没超过 2 —— 预定就能解释' }),
      over ? VIOLET : ORANGE, 11.5, { h: 20 });
  y += 26;

  note(L, y, nar(L,
    { en: 'This page simulates the quantum prediction — it is not a Bell test. A real experiment must close the detection and locality loopholes, which a simulator cannot even represent.',
      zh: '本页模拟的是量子力学的预言，不是在做一次贝尔实验。真实实验必须堵住探测漏洞与定域性漏洞，而模拟器连它们都表示不了。' },
    { en: 'Simulated prediction, not a Bell test: a simulator cannot represent the detection and locality loopholes.',
      zh: '这是模拟的预言，不是贝尔实验：模拟器表示不了探测漏洞与定域性漏洞。' }),
    ORANGE, { maxLines: 4 });
}

/* ================= 页签三：窃听 ================= */

/* 三种策略摞在同一张图上：名字、同角度密钥错误率、|S| 数值，以及一根
   共用的柱子——那根竖着的橙线（经典上界 2）从三行中间穿过去，于是
   "谁越过了、谁没有"是一眼的事，不需要读数字。 */
function strategyTable(L, y, ta) {
  const nameW = Math.min(150, L.availW * 0.36);
  const errW  = Math.min(74, L.availW * 0.20);
  const valW  = Math.min(58, L.availW * 0.16);
  const barX  = L.x0 + nameW + errW + valW + 18;
  const barW  = Math.max(36, L.x0 + L.availW - barX);
  const sMax  = 3;
  const px = function (v) { return barX + barW * Math.max(0, Math.min(sMax, v)) / sMax; };

  text(L.x0, y, E.t({ en: 'strategy', zh: '策略' }), { size: 10, color: DIM, lh: 15 });
  text(L.x0 + nameW + 6, y,
       nar(L, { en: 'key errors', zh: '密钥错误率' }, { en: 'errors', zh: '错误' }),
       { size: 10, color: DIM, lh: 15 });
  text(L.x0 + nameW + errW + 12, y, '|S|', { size: 10, color: DIM, math: true, lh: 15 });
  const rowTop = y + 17;

  const rows = [];
  for (let i = 0; i < EVE_KEYS.length; i++) {
    const k = EVE_KEYS[i];
    const m = eveModel(k);
    const err = keyError(m, ta), S = chshOf(m);
    const over = Math.abs(S) > CLASSICAL + 1e-9;
    const live = (k === EVE);
    const yy = rowTop + i * 26;
    rows.push({ key: k, err: err, S: S });

    pill(L.x0, yy, nameW, 22,
         { fill: live ? (over ? V_SOFT : O_SOFT) : 'rgba(8,13,24,.35)',
           stroke: live ? (over ? V_EDGE : O_EDGE) : LINE });
    cellText(L.x0, yy, nameW, 22, nar(L, EVE_LABEL[k], EVE_NARROW[k]),
             live ? (over ? VIOLET : ORANGE) : SLATE, 11.5, { math: false });
    text(L.x0 + nameW + 6, yy, (err * 100).toFixed(1) + '%',
         { size: 11.5, color: err < 1e-12 ? EMERALD : ORANGE, math: true, lh: 22 });
    text(L.x0 + nameW + errW + 12, yy, Math.abs(S).toFixed(3),
         { size: 11.5, color: over ? VIOLET : ORANGE, math: true, lh: 22 });
    pill(barX, yy + 4, Math.max(3, px(Math.abs(S)) - barX), 14,
         { fill: over ? 'rgba(167,139,250,.55)' : 'rgba(251,146,60,.45)' });
  }
  const hTot = EVE_KEYS.length * 26 - 4;
  pill(barX, rowTop + 2, barW, hTot, { stroke: 'rgba(148,163,184,.16)' });
  seg(px(CLASSICAL), rowTop, px(CLASSICAL), rowTop + hTot + 4, { color: ORANGE, width: 2 });
  text(px(CLASSICAL), rowTop + hTot + 5, E.t({ en: '2', zh: '2' }),
       { size: 10, color: ORANGE, math: true, align: 'center', lh: 14,
         lo: L.x0, hi: L.x0 + L.availW });
  return rowTop + hTot + 22 - y;
}

function drawEavesdrop() {
  const L = layout();
  frameStart(L);
  tickClock();
  const ta = thetaA(), N = trials();
  let y = L.top;

  y += tag(L.x0, y, L.availW,
           nar(L, { en: 'EVE CANNOT FAKE A VIOLATION', zh: '伊芙伪造不出一次违反' },
                  { en: 'EVE CANNOT FAKE IT', zh: '伊芙伪造不出来' }), ORANGE, 11.5) + 2;

  y += channelRow(L, y, ta, ta, EVE !== 'none', null) + 4;
  y += strategyTable(L, y, ta) + 2;

  if (E.state.tSampledS) {
    const m = eveModel(EVE);
    const s = cached('S|eve|' + EVE + '|' + N + '|' + thetaE().toFixed(6),
                     function () { return chshSampled(m, N, CHSH_SEED); });
    y += tag(L.x0, y, L.availW,
             E.t({ en: 'sampled ', zh: '抽样 ' }) + '|S| = ' + Math.abs(s.S).toFixed(4) +
             ' ± ' + sTolerance(N).toFixed(4) +
             E.t({ en: ' (2 s.e., N = ', zh: '（2 个标准误，N = ' }) +
             N.toLocaleString('en-US') + E.t({ en: ')', zh: '）' }),
             EMERALD, 11, { math: true, h: 17 }) + 2;
  }

  if (E.state.tCurves) {
    /* 三条 E(Δ) 摞在一起。它们在 Δ = 0 处**汇成一点**（都等于 −1）——
       那正是密钥来的地方，也正是"错误率什么都看不见"的原因。 */
    const rm = resendModel(thetaE());
    const curves = [
      { corr: function (d) { return -Math.cos(d); }, color: VIOLET, width: 1.9 },
      { corr: function (d) { return LHV.corr(d, 0); }, color: ORANGE, width: 1.5, dash: [5, 4] },
      { corr: function (d) { return rm.corr(ta, ta + d); }, color: ROSE, width: 1.5, dash: [2, 3] }
    ];
    const noteH = 68;
    const plotH = Math.min(132, L.bottom - y - noteH - 6);
    if (plotH >= 66) y += corrPlot(L, y, plotH, curves, 0, []);
  }

  note(L, y, nar(L,
    { en: 'Look at the second column: the pre-decided source makes zero key errors — it reproduces perfect anticorrelation exactly, so the error-rate alarm that protects BB84 stays silent. Only S sees it.',
      zh: '看第二列：预定结果的源一个密钥错误都不产生——它把"同角度必然相反"完美复制了，于是 BB84 里那道靠错误率报警的门一声不吭。只有 S 看得见它。' },
    { en: 'Pre-decided source: zero key errors, so an error-rate alarm stays silent. Only S sees it.',
      zh: '预定结果的源：零密钥错误，靠错误率报警的门一声不吭。只有 S 看得见它。' }),
    ORANGE, { maxLines: 4 });
}

/* ================= 读数 ================= */
function b(color, s) { return '<b style="--c:var(--trace-' + color + ')">' + s + '</b>'; }
function dimSpan(s) { return '<span class="dim">' + s + '</span>'; }

/* ================= 场景 ================= */

const ISO = { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } };

var SCENES = {
  pairs: {
    label: { en: 'Pairs', zh: '纠缠对' },
    brand: { en: 'One source, two distant analysers. Match the angles and the two outcomes always disagree — yet neither was decided before the measurement.',
             zh: '一个源，两台相隔遥远的分析器。角度一致时两个结果必然相反——可是谁也没有在测量之前定下来。' },
    tips: { en: 'Drag Δ to 0°. Every pair in the AB row goes green: opposite, every single time. The key is not transmitted — it appears at both ends at once.',
            zh: '把 Δ 拖到 0°。AB 那一行整条变绿：每一对都相反，一次不落。密钥不是被传送的——它在两端同时出现。' },
    params: ['thetaA', 'delta', 'trials', 'speed'],
    views: ISO,
    /* 开关颜色按固定启用次序里的相对顺序排：emerald 在 orange 之前。 */
    toggles: [
      { key: 'tSampled', label: { en: 'sampled E', zh: '抽样的 E' }, color: EMERALD, checked: true },
      { key: 'tClassical', label: { en: 'pre-decided curve', zh: '预定清单的曲线' }, color: ORANGE, checked: false }
    ],
    draw: drawPairs,
    readout: function () {
      const ta = thetaA(), tb = thetaB(), N = trials();
      const model = pureModel(SINGLET);
      const eTh = model.corr(ta, tb);
      const eSm = cached('E|psi-|' + ta.toFixed(6) + '|' + tb.toFixed(6) + '|' + N,
                         function () { return sampleE(model, ta, tb, N, CHSH_SEED); });
      const dev = Math.abs(eSm - eTh);
      return '<i>θ</i><sub>a</sub> = ' + b('cyan', Math.round(ta / DEG) + '°') +
        ' · <i>θ</i><sub>b</sub> = ' + b('rose', Math.round(tb / DEG) + '°') +
        ' · <i>Δ</i> = ' + Math.round((tb - ta) / DEG) + '°<br>' +
        dimSpan(E.t({ en: 'theory  −cos Δ = ', zh: '理论  −cos Δ = ' })) +
        b('violet', E.fmtS(eTh, 4)) + '<br>' +
        dimSpan(E.t({ en: 'sampled ', zh: '抽样 ' }) + '(N = ' + N.toLocaleString('en-US') + ') = ') +
        b('emerald', E.fmtS(eSm, 4)) + '<br>' +
        dimSpan(E.t({ en: 'deviation ', zh: '偏差 ' }) + dev.toFixed(4) + ' = ' +
                (dev * Math.sqrt(N)).toFixed(2) + ' / √N');
    }
  },

  bell: {
    label: { en: 'Bell', zh: '贝尔' },
    brand: { en: 'S measured at the canonical angles, against the classical bound 2 and the Tsirelson bound 2√2. The gap between them is what you can measure.',
             zh: 'S 在教科书那组角度上量出来，对照经典上界 2 与 Tsirelson 上界 2√2。这两者之间的缝，正是可以被测量的东西。' },
    tips: { en: 'Switch the source to the product state or the pre-decided list. Same code, same angles — S stops at 2 and will not budge. That ceiling is arithmetic, not engineering.',
            zh: '把源换成可分离态或预先定好的清单。同一段代码、同一组角度——S 停在 2 上纹丝不动。那道天花板是算术，不是工艺。' },
    params: ['trials'],
    views: ISO,
    presets: SOURCE_PRESETS,
    presetsLabel: SOURCE_PRESETS_LABEL,
    /* 经典上界 2 不做成开关：它是这一页的全部论点。可关掉的只有 2√2 那条。 */
    toggles: [
      { key: 'tTsirelson', label: { en: 'Tsirelson 2√2', zh: 'Tsirelson 2√2' }, color: VIOLET, checked: true },
      { key: 'tSampledS', label: { en: 'sampled S', zh: '抽样的 S' }, color: EMERALD, checked: true }
    ],
    draw: drawBell,
    readout: function () {
      const model = sourceModel(SOURCE);
      const N = trials();
      const S = chshOf(model);
      const smp = cached('S|' + SOURCE + '|' + N,
                         function () { return chshSampled(model, N, CHSH_SEED); });
      const over = Math.abs(S) > CLASSICAL + 1e-9;
      let out = dimSpan(E.t({ en: 'source ', zh: '源 ' })) +
        b(over ? 'violet' : 'orange', E.t(SOURCE_LABEL[SOURCE])) + '<br>' +
        '<i>S</i> = ' + b(over ? 'violet' : 'orange', E.fmtS(S, 6)) +
        ' · |<i>S</i>| = ' + b(over ? 'violet' : 'orange', Math.abs(S).toFixed(6)) + '<br>' +
        dimSpan(E.t({ en: 'sampled ', zh: '抽样 ' }) + '(N = ' + N.toLocaleString('en-US') + ') |S| = ') +
        b('emerald', Math.abs(smp.S).toFixed(4)) +
        dimSpan(' ± ' + sTolerance(N).toFixed(4) + E.t({ en: ' (2 s.e.)', zh: '（2 个标准误）' })) + '<br>' +
        dimSpan(E.t({ en: 'classical 2 · Tsirelson 2√2 = ', zh: '经典 2 · Tsirelson 2√2 = ' })) +
        TSIRELSON.toFixed(6);
      if (!over) {
        out += '<br>' + dimSpan(E.t({
          en: 'this source is explained by outcomes fixed in advance',
          zh: '这个源可以用「结果早就定好了」解释' }));
      }
      return out;
    }
  },

  eavesdrop: {
    label: { en: 'Eavesdrop', zh: '窃听' },
    brand: { en: 'Eve wants the key. Every strategy that decides the outcomes in advance drives S back under 2 — and one of them makes no key errors at all.',
             zh: '伊芙想要密钥。每一种预先定好结果的策略都把 S 压回 2 以下——而其中一种一个密钥错误都不产生。' },
    tips: { en: 'Select the pre-decided source. Key errors stay at 0.0% — the alarm BB84 relies on never fires. |S| falls to exactly 2, and that is the only thing that gives her away.',
            zh: '选「预定结果的源」。密钥错误率停在 0.0%——BB84 赖以报警的那道门根本不响。|S| 掉到恰好 2，而那是唯一暴露她的东西。' },
    params: ['thetaA', 'eveAngle', 'trials'],
    views: ISO,
    presets: EVE_PRESETS,
    presetsLabel: EVE_PRESETS_LABEL,
    toggles: [
      { key: 'tCurves', label: { en: 'correlation shapes', zh: '关联曲线形状' }, color: VIOLET, checked: true },
      { key: 'tSampledS', label: { en: 'sampled S', zh: '抽样的 S' }, color: EMERALD, checked: true }
    ],
    draw: drawEavesdrop,
    readout: function () {
      const ta = thetaA(), N = trials();
      const m = eveModel(EVE);
      const S = chshOf(m), err = keyError(m, ta);
      const over = Math.abs(S) > CLASSICAL + 1e-9;
      const smp = cached('S|eve|' + EVE + '|' + N + '|' + thetaE().toFixed(6),
                         function () { return chshSampled(m, N, CHSH_SEED); });
      return dimSpan(E.t({ en: 'strategy ', zh: '策略 ' })) +
        b(EVE === 'none' ? 'violet' : 'orange', E.t(EVE_LABEL[EVE])) + '<br>' +
        dimSpan(E.t({ en: 'key errors at ', zh: '同角度密钥错误率 ' }) + '<i>θ</i> = ' +
                Math.round(ta / DEG) + '° : ') +
        b(err < 1e-12 ? 'emerald' : 'orange', (err * 100).toFixed(2) + '%') + '<br>' +
        '|<i>S</i>| = ' + b(over ? 'violet' : 'orange', Math.abs(S).toFixed(6)) +
        dimSpan(over ? E.t({ en: '  (above 2)', zh: '  （超过 2）' })
                     : E.t({ en: '  (not above 2)', zh: '  （没超过 2）' })) + '<br>' +
        dimSpan(E.t({ en: 'sampled ', zh: '抽样 ' }) + '|S| = ') +
        b('emerald', Math.abs(smp.S).toFixed(4)) +
        dimSpan(' ± ' + sTolerance(N).toFixed(4) + E.t({ en: ' (2 s.e.)', zh: '（2 个标准误）' }));
    }
  }
};

var PARAMS = [
  { key: 'thetaA',
    label: { en: "Alice's analyser <i>θ</i><sub>a</sub>", zh: '爱丽丝的分析器 <i>θ</i><sub>a</sub>' },
    min: 0, max: 180, step: 5, value: 0,
    fmt: function (v) { return v.toFixed(0) + '°'; } },
  { key: 'delta',
    label: { en: 'angle gap <i>Δ</i>', zh: '角度差 <i>Δ</i>' },
    min: 0, max: 180, step: 5, value: 45,
    fmt: function (v) { return v.toFixed(0) + '°'; } },
  /* 默认 30° 而不是 0°：θe = θa 时拦截—重发那条关联曲线**恰好与量子预言
     重合**（E = −cos(θa−θe)·cos(θb−θe) 退化成 −cos Δ），三条曲线摞成两条，
     画面上看不出 Eve 做了什么——尽管 S 已经掉到 √2。默认值不该落在唯一
     那个看不出差别的点上。 */
  { key: 'eveAngle',
    label: { en: "Eve's angle <i>θ</i><sub>e</sub>", zh: '伊芙的角度 <i>θ</i><sub>e</sub>' },
    min: 0, max: 180, step: 5, value: 30,
    fmt: function (v) { return v.toFixed(0) + '°'; } },
  { key: 'trials',
    label: { en: 'trials per correlation <i>N</i>', zh: '每个关联的抽样数 <i>N</i>' },
    min: 2, max: 4, step: 1, value: 3,
    /* map 作用在 state 上，fmt 拿到的是**滑杆原值**（引擎的 buildParams 就是
       这么调的），所以两边都要自己做那次 10^v。 */
    map: function (v) { return Math.round(Math.pow(10, v)); },
    fmt: function (v) { return Math.round(Math.pow(10, v)).toLocaleString('en-US'); } },
  { key: 'speed',
    label: { en: 'cursor speed', zh: '游标速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* 浏览器探针的入口。页面里所有的物理都从这里能拿到，于是"屏幕上印的
   2.828427"与"探针量到的 2.828427"走的是同一段代码，而不是两份实现。
   ink() 交出上一整帧每一段文字的真实包围盒——那让"窄屏上没有任何字漫出
   内容区"变成一条可以自动判定的断言，而不是一句盯着截图说的话。 */
var PHYS = {
  Q: Q, SINGLET: SINGLET, CH: CH, TSIRELSON: TSIRELSON,
  productPair: productPair, pureModel: pureModel, resendModel: resendModel,
  LHV: LHV, foldPi: foldPi, sourceModel: sourceModel, eveModel: eveModel,
  chshOf: chshOf, chshSampled: chshSampled, sampleE: sampleE,
  sTolerance: sTolerance, keyError: keyError, valOf: valOf,
  ink: function () { return { boxes: INK.slice(), area: INK_BOX }; }
};

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
