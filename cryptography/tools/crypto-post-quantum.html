    for (let i = 0; i < PARAMS.length && i < ctls.length; i++) {
      paramEls[PARAMS[i].key] = {
        input: ctls[i].querySelector('input[type=range]'),
        val: ctls[i].querySelector('.val'),
        p: PARAMS[i]
      };
    }
  }
  return paramEls[key];
}
function setParam(key, v) {
  const el = paramEl(key);
  if (!el || !el.input) return;
  const p = el.p;
  const nv = E.clamp(v, p.min, p.max);
  E.state[key] = nv;
  el.input.value = String(nv);
  if (el.val) el.val.textContent = p.fmt(nv);
}

/* ================= 预置按钮的高亮要跟着滑杆走 =================
   三个页签的 presets 都是**同一个量的几个刻度**（u / n / a），不是独立的动作。
   拖滑杆离开那个刻度之后，按钮还亮着就是在说谎——面板会显示 "n = 4" 高亮
   而滑杆写着 6 × 8（实测截到过）。引擎导出了 syncPresetHighlight 正是为此。
   只在值真的变了的时候调，它内部会 refreshPresetButtons()，每帧调是浪费。 */
const presetShown = {};
function syncPreset(tab, key) {
  if (presetShown[tab] === key) return;
  presetShown[tab] = key;
  E.syncPresetHighlight(tab, key);
}

function curSkew()   { const v = E.state.skew;  return v == null ? 0 : Math.round(v); }
function curN()      { const v = E.state.nSec;  return v == null ? 4 : Math.round(v); }
function curA()      { const v = E.state.aBase; return v == null ? 2 : Math.round(v); }
function curTarget() {
  return [E.state.tgtX == null ? 4.5 : E.state.tgtX,
          E.state.tgtY == null ? 2.75 : E.state.tgtY];
}
function curB() { return LT.matMulInt(BASE, LT.shearU(curSkew())); }

/* ================= 随机源 =================
   种子写死的 LCG，一次 Math.random 都不碰：同一次会话里连按几次"换一个"
   会得到不同的实例，而重新打开页面又从同一串开始。截图与复现因此是可能的，
   而页面上印着的成功率也不会每次刷新都变一个数。 */
function makeRng(seed) {
  let s = seed >>> 0;
  /* 取高位（除以 2³²）而不是低位取模：LCG 的低位周期极短。 */
  return function () { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

/* ================= 时间轴 =================
   三个页签各有一条：它们的"一步"不是同一件事（取整的四个阶段 / LWE 的 m 行 /
   周期上的一格），共用一条就得让每个页签自己取模，而取模出来的步数与 ⏮ ⏭
   按钮走的步数不一致，按钮就会时灵时不灵。

   单一真相分两半，互不重叠：**播放与否**归引擎的 state.running（⏵/⏸ 由引擎
   自己绑），**走到第几步**归时间轴。所以时间轴一建好就 play() 并且永不
   pause()——真正的闸门是 tick() 里那个 state.running 判断。 */
const TLS = {};
let CUR = 'lattice';

/* startAt：新建时停在第几步。**默认停在最后一步**，不是第 0 步。
   理由是一次实测：格页签的时间轴分四步累进地把取整这件事画出来，而页面
   载入时引擎的 state.running 是 false，于是它停在第 0 步——画面上只有格点
   与两支箭头，而底下的判决牌已经在说"取整正好落在真正的最近点上"。
   牌子讲完了故事，图还没开始讲，两者当场打架。静止态必须是**完整的画面**；
   四步拆解留给 ⏭ 与 ⏵ 去走。 */
function timelineFor(tab, steps, stepDuration, startAt) {
  steps = Math.max(1, Math.round(steps));
  const cur = TLS[tab];
  if (cur && cur.steps === steps) return cur.tl;
  const tl = CryptoAnim.createTimeline({ steps: steps, stepDuration: stepDuration,
                                         loop: true, rate: 1 });
  tl.play();
  tl.seek(cur ? Math.min(cur.tl.index, steps - 1)
              : Math.min(startAt == null ? steps - 1 : startAt, steps - 1));
  TLS[tab] = { tl: tl, steps: steps };
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tick(tl) {
  tl.setRate(E.state.speed || 1);
  if (E.state.running) tl.tick(E.state.dt);
}
function activeTL() { const e = TLS[CUR]; return e ? e.tl : null; }

/* CUR 由页签按钮的点击直接写，**不能只靠 draw() 顶上那一行**。draw() 只在下一帧
   才跑，而"点页签、立刻按 ⏭"之间可能一帧都还没来得及渲染——那时 CUR 仍是上一个
   页签，⏭ 全走到了别人的时间轴上，画面停在第 0 步纹丝不动。
   ⚠ 这次绑定必须在 E.init() **之后**跑：页签按钮是 buildTabs() 建的，
   在 init 之前 .tab 一个都不存在，这里 querySelectorAll 会拿到空集合而
   不报任何错——一个静默失效的绑定。见文件末尾的调用点。 */
function bindTabTracking() {
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      CUR = b.dataset.tab;
      /* 紧接着刷一次 #ioHost。本页的监听器是在引擎之后挂上的，所以引擎的
         switchTab() → updateReadout() 已经先跑过一轮了，那一轮里 CUR 还是
         上一个页签——两个动作按钮于是慢一拍。下一次 readout（引擎每 120ms
         一次）会自己纠正，但"慢 120ms 才对"和"当场就对"之间没有理由选前者。 */
      syncIo();
    });
  });
}
document.getElementById('btnBack').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(-1); });
document.getElementById('btnStep').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tick() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click',
  function () { const t = activeTL(); if (t) t.seek(0); });

/* ================= 版面预算 =================
   先把上下两条带子留出来，再拿剩下的地方定尺寸。反过来做（先按 min(宽,高)
   定尺寸再摆位置）会让说明性的那几行成为第一个被挤出画布的东西。
   窄屏（≤760px）上传输条被 CSS 挪到了页签下方、面板变成贴底的抽屉，
   所以上带更高、下带更矮，两套数各写各的。 */
function layout() {
  const vi = E.viewInfo();
  const wide = vi.W > 900;
  const narrow = vi.W <= 760;
  const availW = wide ? vi.W - 330 : vi.W;
  /* 窄屏的上带是 160，不是继承来的 142。142 是错的，而且是**量出来**才发现的：
     ≤760px 上 CSS 把传输条挪到 .transport{top:110px}，它的实际底边落在
     151.6px（5px padding + 一排 ~31px 的按钮 + 边框），142 因此让内容区的
     第一行钻到传输条底下去。why 页签那个小标题当场被切掉上半。
     160 = 151.6 + 8 的余量。 */
  const top = narrow ? 160 : 118;
  /* 窄屏的下带是 62 而不是 26：面板在 ≤760px 上变成**贴底的抽屉**
     （CSS 里 .panel{left:10;right:10;bottom:10}），收起状态下那条标题栏
     仍占着大约 44px。按 26 算出来的下带把 why 页签底部那两行——包括
     "这不是一个安全性证明"——正好画到抽屉底下去了：它们**画出来了**，
     只是被一个 DOM 元素盖住，所以 cardLine 的越界判定一声不吭。
     10 + 44 + 8 的余量 = 62。 */
  const bot = narrow ? 62 : 92;
  return {
    vi: vi, W: vi.W, H: vi.H, wide: wide, narrow: narrow,
    availW: availW,
    cx: wide ? availW / 2 + 16 : vi.W / 2,
    top: top, bot: bot,
    vSpace: Math.max(150, vi.H - top - bot)
  };
}

/* ================= 文字要量过才画 =================
   E.chip 既不量文字也不裁剪，而且是**居中**画的：一句放不下的话会从卡片
   两头同时溢出去，看上去像被裁掉了开头和结尾——比单侧溢出更难认出是 bug。
   375px 上实测撞到过：格页签那句判决牌（"rounding landed on the true
   nearest point · this basis: 100.0% of random targets"）在 349px 宽的卡片
   里两端各被吃掉十几个字符。中文文案更宽（每字约两个拉丁字符），所以
   "桌面上看着没事"在这里一点都不能当数。

   规矩：**本页每一段长度会变的文字都先过 fitText**。先把字号往下压到可读
   下限，还放不下就截断并明写省略号——截断必须是看得见的，不能交给画布边缘
   去吃掉。canvas 的 2d 上下文就是引擎在用的那一个，measureText 量到的
   因此与真正画出来的是同一份字形。 */
const RAWCTX = document.getElementById('c').getContext('2d');
const TEXT_MIN_PX = 8.5;

function textW(s, size, mono) {
  RAWCTX.save();
  RAWCTX.font = mono ? E.uiFont(size) : E.mathFont(size);
  const w = RAWCTX.measureText(String(s)).width;
  RAWCTX.restore();
  return w;
}

function fitText(s, maxW, size, mono) {
  const str = String(s);
  if (str === '' || maxW <= 0) return { text: str, size: size };
  let sz = size;
  while (sz > TEXT_MIN_PX && textW(str, sz, mono) > maxW) sz -= 0.5;
  if (textW(str, sz, mono) <= maxW) return { text: str, size: sz };
  let cut = str;
  while (cut.length > 1 && textW(cut + '…', sz, mono) > maxW) cut = cut.slice(0, -1);
  return { text: cut + '…', size: sz, truncated: true };
}

/* 量过字之后再画的 chip。padding 留 12px（左右各 6），有描边时它正好落在
   圆角里侧。 */
function chipFit(x, y, w, h, text, o) {
  o = o || {};
  if (text == null || text === '') { E.chip(x, y, w, h, text, o); return; }
  const f = fitText(text, w - 12, o.fontSize || 12, o.mono);
  const oo = {};
  for (const k in o) oo[k] = o[k];
  oo.fontSize = f.size;
  E.chip(x, y, w, h, f.text, oo);
}

/* 一行卡片，放不下（竖直方向）就整行不画，而不是画到画布外面去；
   横向由 chipFit 负责。canvas 既不裁剪也不报错：放不下的东西会安静地越过
   边缘，而首尾几个像素看上去仍像内容的一部分。本仓为此在窄屏上连栽五次。

   maxY 是**这一段内容自己的**下界，默认是画布内容区的下沿。why 页签必须传
   它：那一页的底部横幅是先扣好的一条带子，而上面两块内容如果只按画布下沿
   判定，就会正好压到横幅上——740×380 上实测撞到过，三段文字叠成一团。
   "画布还有地方"与"这一段还有地方"是两件事。 */
function cardLine(L, x, y, w, h, text, o, maxY) {
  const lo = maxY == null ? L.H - L.bot + 6 : maxY;
  if (y < L.top - 6 || y + h > lo) return false;
  chipFit(x, y, w, h, text, o);
  return true;
}

/* ================= 线段裁到方框内 =================
   歪基的第二支基向量会长到画面外去（u = 8 时 |b₂| = 25.5，而画面只到 11）。
   把它画出去是错的（canvas 不裁剪，它会盖住卡片），整支不画也是错的——
   "你连它都看不见"正是这一页要给的感受。所以裁到边框，并在断口处标一记。

   两个函数，别混用：
     clipSeg   起点保证在框内（本页所有从原点出发的箭头），只裁远端。
     clipBoth  两端都可能在框外，Liang–Barsky，整段在框外时返回 null。

   ⚠ 只有 clipSeg 的那一版是不够的，实测撞到过：基本胞的四条边里，
   (b₁+b₂) → b₂ 那一条的**起点**在框外，clipSeg 从起点往终点裁，t 被夹在
   [0,1] 里，于是那条虚线仍然从框外开始画——u = 8 时它一路划到画布右边缘。
   起点在框外这件事 clipSeg 结构上就表达不了，必须换成两端都裁的版本。 */
function clipSeg(ax, ay, bx, by, rc) {
  let t = 1;
  const dx = bx - ax, dy = by - ay;
  if (dx < -1e-9) t = Math.min(t, (rc.x - ax) / dx);
  if (dx > 1e-9)  t = Math.min(t, (rc.x2 - ax) / dx);
  if (dy < -1e-9) t = Math.min(t, (rc.y - ay) / dy);
  if (dy > 1e-9)  t = Math.min(t, (rc.y2 - ay) / dy);
  t = Math.max(0, Math.min(1, t));
  return { x: ax + dx * t, y: ay + dy * t, clipped: t < 0.999 };
}

function clipBoth(ax, ay, bx, by, rc) {
  let t0 = 0, t1 = 1;
  const dx = bx - ax, dy = by - ay;
  const p = [-dx, dx, -dy, dy];
  const q = [ax - rc.x, rc.x2 - ax, ay - rc.y, rc.y2 - ay];
  for (let i = 0; i < 4; i++) {
    if (Math.abs(p[i]) < 1e-9) { if (q[i] < 0) return null; continue; }
    const r = q[i] / p[i];
    if (p[i] < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
    else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return { x0: ax + dx * t0, y0: ay + dy * t0, x1: ax + dx * t1, y1: ay + dy * t1,
           clipped: t0 > 0.001 || t1 < 0.999 };
}

/* 画一段两端都裁过的线；整段在框外就什么都不画。 */
function segIn(rc, ax, ay, bx, by, o) {
  const c = clipBoth(ax, ay, bx, by, rc);
  if (!c) return null;
  const oo = {};
  for (const k in o) oo[k] = o[k];
  if (c.clipped) oo.head = false;
  E.flowArrow(c.x0, c.y0, c.x1, c.y1, oo);
  return c;
}

/* ================= 格点缓存 =================
   ⚠ 这里**故意**按当前的基重新枚举，而不是"反正是同一个格、算一次就够了"。
   "点集与 u 无关"是这一页要证明的东西，不是可以拿来抄近路的前提：让它每次
   都从当前的基算出来，画面上那些点纹丝不动才是一个**观察结果**。
   （lattice.test.js 里那一排 sameLattice 断言是同一件事的离线版本。） */
const ptsCache = { key: null, val: null };
function latticePoints() {
  const B = curB();
  const key = B[0][0] + ',' + B[0][1] + ',' + B[1][0] + ',' + B[1][1];
  if (ptsCache.key === key) return ptsCache.val;
  const raw = LT.pointsInBox(B, R_VIEW);
  const out = raw.map(function (s) {
    const p = s.split(',');
    return [parseInt(p[0], 10), parseInt(p[1], 10)];
  });
  ptsCache.key = key;
  ptsCache.val = out;
  return out;
}

/* 取整法在这组基下的命中率。按 skew 缓存——它是一条要印在画面上的测量，
   每帧重算既浪费又会让数字在同一屏上抖。 */
const rateCache = {};
function hitRate(skew) {
  if (rateCache[skew] != null) return rateCache[skew];
  const r = LT.cvpTrials({ B: LT.matMulInt(BASE, LT.shearU(skew)),
                           rng: makeRng(20260810 + skew), count: TRIALS, span: 10 });
  rateCache[skew] = r.rate;
  return r.rate;
}

/* ================= LWE 实例 =================
   "换一个"按钮只把 nonce 加一，实例本身仍由种子决定：同一个 nonce 永远给出
   同一个实例，截图可复现。 */
let LWE_NONCE = 0;
const lweCache = { key: null, val: null };
function lweOf() {
  const n = curN(), m = n + 2;
  const noise = E.state.noise !== false;
  const key = n + '|' + noise + '|' + LWE_NONCE;
  if (lweCache.key === key) return lweCache.val;
  const inst = LT.instance({ n: n, m: m, q: LWE_Q, bound: 1, noise: noise,
                             rng: makeRng(970001 + LWE_NONCE * 7919) });
  const atk = LT.attack(inst);
  lweCache.key = key;
  lweCache.val = { inst: inst, atk: atk };
  return lweCache.val;
}

/* 两侧的成功率。这是页面自己做的对照实验，不是抄来的数字：同一组参数、
   同一个求解器，唯一的差别是 e。缓存按 n 走。 */
const statCache = {};
function lweStats(n) {
  if (statCache[n]) return statCache[n];
  const m = n + 2;
  const clean = LT.trials({ n: n, m: m, q: LWE_Q, rng: makeRng(31337),
                            noise: false, count: TRIALS });
  const noisy = LT.trials({ n: n, m: m, q: LWE_Q, rng: makeRng(31337),
                            noise: true, bound: 1, count: TRIALS });
  statCache[n] = { clean: clean, noisy: noisy };
  return statCache[n];
}

/* ================= 输入槽 =================
   两个动作按钮。它们不是"选项"（那是 presets 的事），是**动作**，所以放在
   #ioHost 里；按页签显示，免得在别的页签上摆一个点了没反应的按钮。 */
let ioRandTarget = null, ioNewInst = null, ioNote = null;
function buildIO() {
  const host = document.getElementById('ioHost');
  if (!host) return;
  host.innerHTML = '<div class="iorow" id="pqActs"></div>' +
                   '<div class="iolabel" id="pqNote" style="margin-top:2px"></div>';
  const row = document.getElementById('pqActs');
  ioRandTarget = document.createElement('button');
  ioRandTarget.className = 'btn';
  ioRandTarget.addEventListener('click', randomTarget);
  row.appendChild(ioRandTarget);
  ioNewInst = document.createElement('button');
  ioNewInst.className = 'btn';
  ioNewInst.addEventListener('click', function () { LWE_NONCE++; });
  row.appendChild(ioNewInst);
  ioNote = document.getElementById('pqNote');
}

const targetRng = makeRng(424242);
function randomTarget() {
  setParam('tgtX', Math.round(targetRng() * 80 - 40) / 4);
  setParam('tgtY', Math.round(targetRng() * 80 - 40) / 4);
}

/* #ioHost 的文案是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言切换
   不会自动重刷它。引擎在 applyLang() 末尾会调 updateReadout()，所以把这次
   同步挂在 readout() 里搭车——不管语言是怎么变的，readout 都会跟着重算一次。 */
function syncIo() {
  if (ioRandTarget) {
    ioRandTarget.textContent = E.t({ en: 'Random target', zh: '随机目标' });
    ioRandTarget.style.display = CUR === 'lattice' ? '' : 'none';
  }
  if (ioNewInst) {
    ioNewInst.textContent = E.t({ en: 'New instance', zh: '换一个实例' });
    ioNewInst.style.display = CUR === 'lwe' ? '' : 'none';
  }
  if (ioNote) {
    let s = '';
    if (CUR === 'lattice') {
      s = E.t({ en: 'or click anywhere on the lattice',
                zh: '也可以直接点格点图上的任意位置' });
    } else if (CUR === 'lwe') {
      s = E.t({ en: 'q = ' + LWE_Q + ' (prime), errors in {−1, 0, +1}',
                zh: 'q = ' + LWE_Q + '（素数），误差取自 {−1, 0, +1}' });
    } else {
      s = E.t({ en: 'N = ' + N_RSA + ' = 7 × 13 — a toy modulus',
                zh: 'N = ' + N_RSA + ' = 7 × 13 —— 玩具规模的模数' });
    }
    if (ioNote.textContent !== s) ioNote.textContent = s;
  }
}

/* ================= 画布点击：直接摆目标点 =================
   滑杆是真相的来源，点击只是往它里面写值（setParam 同时改 state 与滑杆
   显示）——两个控件写同一个量时，必须有一个是唯一的入口，否则拖滑杆与点
   画布会互相覆盖，而"到底哪个是当前值"没人答得出来。
   引擎自己也在 canvas 上绑了轨道相机的 pointer 事件；本页的图元全是屏幕
   坐标的，相机转不转都不影响画面，所以两者互不干扰。移动超过 5px 的按下
   算拖拽，不当点击。 */
(function bindPick() {
  const canvas = document.getElementById('c');
  let down = null;
  canvas.addEventListener('pointerdown', function (e) {
    down = { x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointerup', function (e) {
    const d = down; down = null;
    if (!d || CUR !== 'lattice' || !BOARD) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 5) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x < BOARD.x || x > BOARD.x + BOARD.side ||
        y < BOARD.y || y > BOARD.y + BOARD.side) return;
    setParam('tgtX', Math.round(BOARD.ux(x) * 4) / 4);
    setParam('tgtY', Math.round(BOARD.uy(y) * 4) / 4);
  });
})();

/* 供点击反查的板面映射，由 lattice 页签的 draw() 每帧写。 */
let BOARD = null;

/* ================= 画格点图 =================
   一个正方形的取景框，格坐标 [−R, R]²。返回映射函数，让调用方接着往上画。 */
function drawBoard(L, bx, by, side, o) {
  o = o || {};
  const R = R_VIEW;
  const px = function (u) { return bx + (u + R) / (2 * R) * side; };
  const py = function (v) { return by + side - (v + R) / (2 * R) * side; };
  const rc = { x: bx, y: by, x2: bx + side, y2: by + side };

  /* 取景框。四条边是实的：这一次它**不是**环面（Hill 那一页才是），
     它是 ℝ² 的一个窗口，格向四面八方无限延伸。 */
  [[rc.x, rc.y, rc.x2, rc.y], [rc.x, rc.y2, rc.x2, rc.y2],
   [rc.x, rc.y, rc.x, rc.y2], [rc.x2, rc.y, rc.x2, rc.y2]].forEach(function (s) {
    E.flowArrow(s[0], s[1], s[2], s[3], { color: FAINT, width: 1, head: false });
  });
  /* 坐标轴 */
  E.flowArrow(rc.x, py(0), rc.x2, py(0), { color: 'rgba(148,163,184,.16)', width: 1, head: false });
  E.flowArrow(px(0), rc.y, px(0), rc.y2, { color: 'rgba(148,163,184,.16)', width: 1, head: false });

  /* 格点。半径随格距走，但有下限——点小到看不见时这张图就什么都没说。 */
  const step = side / (2 * R);
  const r = E.clamp(step * 0.22, 1.6, 4);
  latticePoints().forEach(function (p) {
    const x = px(p[0]), y = py(p[1]);
    E.chip(x - r, y - r, r * 2, r * 2, '', { fill: 'rgba(45,212,234,.72)', radius: r });
  });

  return { px: px, py: py, rc: rc, step: step, R: R, side: side, x: bx, y: by,
           ux: function (X) { return (X - bx) / side * 2 * R - R; },
           uy: function (Y) { return R - (Y - by) / side * 2 * R; } };
}

/* 一支基向量：从原点出发，裁到框内，端点带箭头；被裁掉时在断口处留一记，
   并把它真实的长度写在旁边——"它有多长"是这一页的论点，不能因为画不下就没了。 */
function drawBasisArrow(bd, v, color, label) {
  const ax = bd.px(0), ay = bd.py(0);
  const tx = bd.px(v[0]), ty = bd.py(v[1]);
  const c = clipSeg(ax, ay, tx, ty, bd.rc);
  E.flowArrow(ax, ay, c.x, c.y, { color: color, width: 1.9, headLen: c.clipped ? 0.001 : 9,
                                  head: !c.clipped });
  if (c.clipped) {
    /* 断口：一小段垂直于方向的横杠，外加一个写着真实长度的标签。 */
    const a = Math.atan2(c.y - ay, c.x - ax);
    E.flowArrow(c.x - Math.cos(a + Math.PI / 2) * 5, c.y - Math.sin(a + Math.PI / 2) * 5,
                c.x + Math.cos(a + Math.PI / 2) * 5, c.y + Math.sin(a + Math.PI / 2) * 5,
                { color: color, width: 1.6, head: false });
  }
  if (label) {
    const lx = E.clamp(c.x + Math.cos(Math.atan2(c.y - ay, c.x - ax)) * -18, bd.rc.x + 22, bd.rc.x2 - 22);
    const ly = E.clamp(c.y + Math.sin(Math.atan2(c.y - ay, c.x - ax)) * -18, bd.rc.y + 10, bd.rc.y2 - 10);
    chipFit(lx - 22, ly - 8, 44, 16, label, { color: color, fontSize: 11 });
  }
  return c.clipped;
}

function drawTarget(bd, t) {
  const x = bd.px(t[0]), y = bd.py(t[1]);
  E.flowArrow(x - 8, y, x + 8, y, { color: ORANGE, width: 1.4, head: false });
  E.flowArrow(x, y - 8, x, y + 8, { color: ORANGE, width: 1.4, head: false });
  E.chip(x - 6, y - 6, 12, 12, '', { stroke: ORANGE, radius: 6, width: 1.4 });
}

/* 落在取景框外的点一律不画。歪基下取整的落点可以跑得很远（u = 8 上实测
   见过 (−14, −5)），画出去就是一个浮在卡片上的孤点，看不出它属于哪张图。
   框外的事实由判决牌上的距离数字负责说，不靠一个越界的圆点去暗示。 */
function inBoard(bd, x, y, pad) {
  pad = pad || 0;
  return x >= bd.rc.x - pad && x <= bd.rc.x2 + pad &&
         y >= bd.rc.y - pad && y <= bd.rc.y2 + pad;
}
function drawRing(bd, p, color, r) {
  const x = bd.px(p[0]), y = bd.py(p[1]);
  if (!inBoard(bd, x, y)) return;
  E.chip(x - r, y - r, r * 2, r * 2, '', { stroke: color, radius: r, width: 1.8 });
}
function drawDisc(bd, p, fill, r) {
  const x = bd.px(p[0]), y = bd.py(p[1]);
  if (!inBoard(bd, x, y)) return;
  E.chip(x - r, y - r, r * 2, r * 2, '', { fill: fill, radius: r });
}

/* ================= 页签一：同一个格，两种描述 ================= */
const LAT_STEPS = 4;

const lattice = {
  label: { en: 'Lattice', zh: '格' },
  brand: { en: 'One lattice, two descriptions. A unimodular change of basis moves no point at all — but it decides whether you can see the nearest one.',
           zh: '一个格，两种描述。幺模换基一个点都没有动 —— 却决定了你能不能看见离目标最近的那一个。' },
  tips: { en: 'Drag "basis skew". Every dot stays exactly where it was — same lattice — while the two violet arrows swing apart. Now watch the verdict: rounding in the orthogonal basis is exact every single time; by u = 8 it is wrong more often than right. The gap between those two numbers is the whole trapdoor.',
          zh: '拖「基的歪斜」。每一个点都待在原地 —— 同一个格 —— 而两支紫色箭头越张越开。再看下面那行判决：正交基下取整每一次都对，到 u = 8 已经错多于对。这两个数字之间的落差，就是陷门的全部。' },
  params: ['skew', 'tgtX', 'tgtY', 'speed'],
  presetsLabel: { en: 'Basis', zh: '基' },
  presets: [
    { key: 'ortho', label: { en: 'Orthogonal', zh: '正交' }, onSelect: function () { setParam('skew', 0); } },
    { key: 'skewed', label: { en: 'Skewed', zh: '歪斜' },    onSelect: function () { setParam('skew', 3); } },
    { key: 'awful', label: { en: 'Awful', zh: '糟糕' },      onSelect: function () { setParam('skew', 8); } }
  ],
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showGuess', label: { en: 'Rounded guess', zh: '取整的猜测' }, color: ROSE, checked: true },
    { key: 'showCell',  label: { en: 'Basis cell', zh: '基本胞' },        color: VIOLET, checked: true },
    { key: 'showTrue',  label: { en: 'True nearest', zh: '真正的最近点' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'lattice';
    const sk = curSkew();
    syncPreset('lattice', sk === 0 ? 'ortho' : (sk === 3 ? 'skewed' : (sk === 8 ? 'awful' : null)));
    const L = layout();
    const tl = timelineFor('lattice', LAT_STEPS, 1.05);
    tick(tl);
    const stage = tl.index;

    const B = curB();
    const t = curTarget();
    const bab = LT.babai(B, t);
    const best = LT.closest(B, t);
    const hit = bab.point[0] === best.point[0] && bab.point[1] === best.point[1];

    /* 板子下方要放四行（基向量 / 判决 / 命中率 / 玩具规模），共约 96px；
       上方一张卡 40px。−150 就是这两头加余量。
       ⚠ 下限写 60 而不是 150：150 会在矮视口上把"放不下"变成"画到面板抽屉
       底下"（740×380 上实测板子越过内容区 40px）。放不下就画小，小到看不出
       是格点图（<60）就整块不画——那时判决牌与统计行仍然成立，它们才是结论。 */
    const side = E.clamp(Math.min(L.availW - 56, L.vSpace - 150), 60, 400);
    const bx = L.cx - side / 2, by = L.top + 48;
    const bd = side >= 60 ? drawBoard(L, bx, by, side) : null;
    BOARD = bd;

    const b1 = [B[0][0], B[1][0]], b2 = [B[0][1], B[1][1]];

    if (bd) {
    /* ① 基本胞：0 → b₁ → b₁+b₂ → b₂ → 0。它的面积恒等于 |det B| = 10，
       换基一点都不变——歪斜只是把同一块面积拉成一条又长又细的斜条。 */
    if (E.state.showCell) {
      const corners = [[0, 0], b1, [b1[0] + b2[0], b1[1] + b2[1]], b2, [0, 0]];
      for (let i = 0; i < 4; i++) {
        const a = corners[i], b = corners[i + 1];
        /* 两端都要裁：(b₁+b₂) → b₂ 那条边的起点在框外（见 clipBoth 的注释）。 */
        segIn(bd.rc, bd.px(a[0]), bd.py(a[1]), bd.px(b[0]), bd.py(b[1]),
              { color: 'rgba(167,139,250,.30)', width: 1.1, head: false, dash: [3, 3] });
      }
    }

    /* ② 取整的四个阶段。第 1 步给出实数坐标（虚线折线），第 2 步把它们各自
       取整（实线折线），第 3 步落子并判决。把这一步拆开画，是因为"你在
       **哪一组基**上取整"正是全部差别所在——同一个 t，坐标完全不同。 */
    if (stage >= 1) {
      const c = bab.coords;
      const mid = [b1[0] * c[0], b1[1] * c[0]];
      const dash = { color: 'rgba(45,212,234,.60)', width: 1.3, head: false, dash: [4, 3] };
      segIn(bd.rc, bd.px(0), bd.py(0), bd.px(mid[0]), bd.py(mid[1]), dash);
      segIn(bd.rc, bd.px(mid[0]), bd.py(mid[1]), bd.px(t[0]), bd.py(t[1]), dash);
    }
    if (stage >= 2 && E.state.showGuess) {
      const ci = bab.c;
      const mid = [b1[0] * ci[0], b1[1] * ci[0]];
      const col = hit ? 'rgba(52,211,153,.75)' : 'rgba(251,113,133,.75)';
      segIn(bd.rc, bd.px(0), bd.py(0), bd.px(mid[0]), bd.py(mid[1]),
            { color: col, width: 1.5, head: false });
      segIn(bd.rc, bd.px(mid[0]), bd.py(mid[1]), bd.px(bab.point[0]), bd.py(bab.point[1]),
            { color: col, width: 1.5, head: false });
    }

    /* ③ 两支基向量。 */
    drawBasisArrow(bd, b1, VIOLET, 'b₁');
    drawBasisArrow(bd, b2, VIOLET, 'b₂');

    /* ④ 三个点：真正的最近点（绿圈）、取整的落点（对了是绿、错了是玫瑰）、
       目标（橙十字）。顺序是最后画目标——它是使用者正在拖的那一个。 */
    if (stage >= 3 && E.state.showTrue) drawRing(bd, best.point, EMERALD, 7);
    if (stage >= 2 && E.state.showGuess) {
      drawDisc(bd, bab.point, hit ? 'rgba(52,211,153,.9)' : 'rgba(251,113,133,.9)', 4.5);
      if (!hit) {
        segIn(bd.rc, bd.px(bab.point[0]), bd.py(bab.point[1]), bd.px(t[0]), bd.py(t[1]),
              { color: 'rgba(251,113,133,.55)', width: 1.1, head: false, dash: [2, 3] });
      }
    }
    drawTarget(bd, t);
    }

    /* ⑤ 卡片。每一行都是一个可以自己验的数字。 */
    const cw = Math.min(L.availW - 26, 460);
    const cxL = L.cx - cw / 2;
    const nPts = latticePoints().length;
    cardLine(L, cxL, by - 40, cw, 22,
      E.t({ en: 'det U = 1  ·  same lattice  ·  ' + nPts + ' points in view, unchanged by u',
            zh: 'det U = 1  ·  同一个格  ·  视野内 ' + nPts + ' 个点，与 u 无关' }),
      { mono: true, fontSize: 11, color: EMERALD, fill: F.emerald.fill, stroke: F.emerald.stroke });

    const ang = angleBetween(b1, b2);
    cardLine(L, cxL, by + side + 10, cw, 20,
      'b₁ = ' + vecStr(b1) + '  |b₁| = ' + Math.sqrt(LT.norm2(b1)).toFixed(2) +
      '   ·   b₂ = ' + vecStr(b2) + '  |b₂| = ' + Math.sqrt(LT.norm2(b2)).toFixed(2) +
      '   ·   ' + ang.toFixed(1) + '°',
      { mono: true, fontSize: 10.5, color: VIOLET });

    const rate = hitRate(curSkew());
    const excess = Math.max(0, LT.dist(bab.point, t) - best.dist).toFixed(2);
    const verdict = hit
      ? E.t({ en: 'rounding landed on the true nearest point',
              zh: '取整正好落在真正的最近点上' })
      : E.t({ en: 'rounding missed — it is ' + excess + ' further away',
              zh: '取整偏了 —— 比最近点远 ' + excess });
    /* ⚠ 判决与命中率**分两行**，不合成一句。合成的那一版在 375px 上被
       fitText 一路压到 8.5px 的下限（这是本页最要紧的一行，压到那个字号
       等于没写）。放不下的时候先拆行，拆不动再压字号，最后才是截断。 */
    cardLine(L, cxL, by + side + 34, cw, 22, verdict,
      { mono: true, fontSize: 10.5,
        color: hit ? EMERALD : ROSE,
        fill: hit ? F.emerald.fill : F.rose.fill,
        stroke: hit ? F.emerald.stroke : F.rose.stroke });

    cardLine(L, cxL, by + side + 58, cw, 18,
      E.t({ en: 'this basis rounds ' + (rate * 100).toFixed(1) + '% of ' + TRIALS + ' random targets right',
            zh: '这组基在 ' + TRIALS + ' 个随机目标上的命中率 ' + (rate * 100).toFixed(1) + '%' }),
      { mono: true, fontSize: 10.5, color: hit ? EMERALD : ROSE });

    cardLine(L, cxL, by + side + 78, cw, 18,
      E.t({ en: 'toy scale: a 2-D lattice. Real schemes use hundreds of dimensions.',
            zh: '玩具规模：二维格。真实方案的维数在几百。' }),
      { mono: true, fontSize: 10, color: DIM });
  },
  readout: function () {
    syncIo();
    const B = curB(), t = curTarget();
    const bab = LT.babai(B, t), best = LT.closest(B, t);
    const hit = bab.point[0] === best.point[0] && bab.point[1] === best.point[1];
    const rate = hitRate(curSkew());
    let s = '<b style="--c:var(--trace-violet)"><i>u</i> = ' + curSkew() + '</b>' +
      '<span class="dim">   |det| = ' + Math.abs(LT.detInt(B)) +
      '   ' + E.t({ en: 'same lattice', zh: '同一个格' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'target ', zh: '目标 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)"><i>t</i> = ' +
      E.fmtS(t[0], 2) + ', ' + E.fmtS(t[1], 2) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'rounding → ', zh: '取整 → ' }) + '</span>' +
      '<b style="--c:var(--trace-' + (hit ? 'emerald' : 'rose') + ')"><i>' +
      vecStr(bab.point) + '</i></b>' +
      '<span class="dim">   d = ' + LT.dist(bab.point, t).toFixed(2) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'true nearest ', zh: '真正的最近点 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)"><i>' + vecStr(best.point) + '</i></b>' +
      '<span class="dim">   d = ' + best.dist.toFixed(2) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'over ' + TRIALS + ' random targets this basis rounds correctly ',
            zh: TRIALS + ' 个随机目标里，这组基取整正确 ' }) + '</span>' +
      '<b style="--c:var(--trace-' + (rate > 0.9 ? 'emerald' : 'rose') + ')">' +
      (rate * 100).toFixed(1) + '%</b><br>';
    if (curSkew() === 0) {
      s += '<span class="dim">' +
        E.t({ en: 'this basis is exactly orthogonal, so rounding is provably exact — ' +
                  'real reduced bases are only nearly orthogonal, and then it is only usually right',
              zh: '这组基恰好正交，所以取整是可证精确的 —— 真实的约化基只是近正交，' +
                  '那时取整只是"通常对"' }) + '</span>';
    } else {
      s += '<span class="dim">' +
        E.t({ en: 'the lattice never moved; only your description of it did',
              zh: '格一个点都没动，动的只是你对它的描述' }) + '</span>';
    }
    return s;
  }
};

function angleBetween(a, b) {
  const c = (a[0] * b[0] + a[1] * b[1]) / Math.sqrt(LT.norm2(a) * LT.norm2(b));
  return Math.acos(E.clamp(c, -1, 1)) * 180 / Math.PI;
}

/* ================= 页签二：LWE ================= */
const lwe = {
  label: { en: 'LWE', zh: 'LWE' },
  brand: { en: 'b = A·s + e (mod q). Take the error away and first-year linear algebra hands over the secret; put it back and the same solver dies.',
           zh: 'b = A·s + e (mod q)。把误差拿掉，一年级线性代数当场交出秘密；放回去，同一个求解器立刻失效。' },
  tips: { en: 'Turn "error term e" off. Gaussian elimination recovers s exactly, every time — that is the control experiment, and it has to succeed or the solver is what is broken. Turn it back on: the errors are only ±1, the system becomes inconsistent, and the honest answer is "no s explains this data".',
          zh: '把「误差项 e」关掉。高斯消元每一次都精确还原 s —— 这是对照组，它必须成功，否则坏掉的是求解器而不是别的。再打开：误差只有 ±1，方程组就变得不相容，诚实的答案是「没有任何 s 能解释这组数据」。' },
  params: ['nSec', 'speed'],
  presetsLabel: { en: 'Size', zh: '规模' },
  presets: [
    { key: 'demo', label: { en: 'n = 4', zh: 'n = 4' }, onSelect: function () { setParam('nSec', 4); } },
    { key: 'tiny', label: { en: 'n = 2', zh: 'n = 2' }, onSelect: function () { setParam('nSec', 2); } },
    { key: 'wide', label: { en: 'n = 6', zh: 'n = 6' }, onSelect: function () { setParam('nSec', 6); } }
  ],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'noise',     label: { en: 'error term <i>e</i>', zh: '误差项 <i>e</i>' }, color: ROSE, checked: true },
    { key: 'showRow',   label: { en: 'one row', zh: '逐行' },      color: VIOLET, checked: true },
    { key: 'showSolve', label: { en: 'attack', zh: '攻击' },       color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'lwe';
    syncPreset('lwe', { 2: 'tiny', 4: 'demo', 6: 'wide' }[curN()] || null);
    const L = layout();
    const got = lweOf();
    const inst = got.inst, atk = got.atk;
    const n = inst.n, m = inst.m, q = inst.q;

    const tl = timelineFor('lwe', m, 0.85, 0);
    tick(tl);
    const row = tl.index % m;

    /* ---- 版面：[A] · [s] + [e] = [b]，三个运算符各占一格宽 ----
       ⚠ 先用最小可读格宽反推放得下几格，再让格宽在剩余空间里长大——
       绝不"先定格数、再把格宽 clamp 到一个下限"，那个下限会把"放不下"
       变成"画出去"，而 canvas 既不裁剪也不报错。 */
    const wanted = n + 3 + 3;                 // A 的 n 列 + s/e/b 三列 + 三个运算符位
    const fit = E.fitCells(L.availW - 28, wanted, { gap: 3, min: 12, max: 26 });
    /* 高度也要参与定格宽。fitCells 只回答"这么宽放得下几格"，答不了"这么矮
       画得下 m 行吗"——740×380 上按纯宽度算出的 26px 格子把 8 行矩阵画到了
       内容区下沿以外 74px。两头都收，取小的那个。 */
    const gap = 3;
    const cell = Math.min(fit.cell, (L.vSpace - 140) / m);
    const gridFits = cell >= 11;
    let aCols = n, truncated = false;
    if (fit.truncated) {
      aCols = Math.max(1, fit.n - 6);
      truncated = aCols < n;
    }
    const shown = aCols + 3 + 3;
    const totalW = shown * cell + (shown - 1) * gap;
    const x0 = L.cx - totalW / 2;

    /* 24 不是随手取的下限：矩阵上方那一排字母标签画在 blockY(m) − 18 处，
       低于 24 它就爬到 L.top 之上去了——窄屏上那里是页签条。 */
    const rowsH = m * cell;
    const top = L.top + E.clamp((L.vSpace - rowsH - 150) / 2, 24, 60);
    const midY = top + rowsH / 2;

    function blockY(rows) { return midY - rows * cell / 2; }
    function label(x, w, text, color) {
      chipFit(x, blockY(m) - 18, w, 16, text, { color: color, fontSize: 11 });
    }

    let x = x0;
    if (gridFits) {
    /* A */
    const aW = aCols * cell;
    E.cellGrid(x, blockY(m), aCols, m, cell, {
      stroke: 'rgba(148,163,184,.16)',
      fontSize: E.clamp(cell * 0.42, 9, 14),
      fill: function (c, r) { return (E.state.showRow && r === row) ? F.violet.fill : null; },
      text: function (c, r) { return String(inst.A[r][c]); },
      textColor: function (c, r) { return (E.state.showRow && r === row) ? BRIGHT : CYAN; }
    });
    label(x, aW, truncated ? 'A  1–' + aCols + ' / ' + n : 'A  ' + m + '×' + n, CYAN);
    x += aW + gap;
    E.chip(x, midY - 10, cell, 20, '·', { color: DIM, fontSize: 15 });
    x += cell + gap;
    /* s */
    E.cellGrid(x, blockY(n), 1, n, cell, {
      stroke: F.emerald.stroke,
      fontSize: E.clamp(cell * 0.42, 9, 14),
      fill: function () { return F.emerald.fill; },
      text: function (c, r) { return String(inst.s[r]); },
      textColor: function () { return EMERALD; }
    });
    label(x, cell, 's', EMERALD);
    x += cell + gap;
    E.chip(x, midY - 10, cell, 20, '+', { color: DIM, fontSize: 15 });
    x += cell + gap;
    /* e */
    const eOn = inst.noise;
    E.cellGrid(x, blockY(m), 1, m, cell, {
      stroke: eOn ? F.rose.stroke : LINE,
      fontSize: E.clamp(cell * 0.42, 9, 14),
      fill: function (c, r) { return (E.state.showRow && r === row) ? F.rose.fill : null; },
      text: function (c, r) { return sgn(inst.e[r]); },
      textColor: function () { return eOn ? ROSE : DIM; }
    });
    label(x, cell, 'e', eOn ? ROSE : DIM);
    x += cell + gap;
    E.chip(x, midY - 10, cell, 20, '=', { color: DIM, fontSize: 15 });
    x += cell + gap;
    /* b */
    E.cellGrid(x, blockY(m), 1, m, cell, {
      stroke: 'rgba(148,163,184,.16)',
      fontSize: E.clamp(cell * 0.42, 9, 14),
      fill: function (c, r) { return (E.state.showRow && r === row) ? F.orange.fill : null; },
      text: function (c, r) { return String(inst.b[r]); },
      textColor: function (c, r) { return (E.state.showRow && r === row) ? BRIGHT : ORANGE; }
    });
    label(x, cell, 'b', ORANGE);
    }

    /* ---- 那一行的算术 ---- */
    const cw = Math.min(L.availW - 26, 470);
    const cxL = L.cx - cw / 2;
    let y = gridFits ? blockY(m) + rowsH + 14 : L.top + 8;
    if (!gridFits) {
      /* 明说，而不是留一片空白：矩阵没画出来是因为屏幕太矮，不是因为没有矩阵。 */
      cardLine(L, cxL, y, cw, 20,
        E.t({ en: 'screen too short to draw the ' + m + '×' + n + ' matrices — the verdict below still holds',
              zh: '屏幕太矮，' + m + '×' + n + ' 的矩阵画不下 —— 下面的判决仍然成立' }),
        { mono: true, fontSize: 10.5, color: ORANGE });
      y += 24;
    }
    if (gridFits && E.state.showRow) {
      cardLine(L, cxL, y, cw, 22,
        '⟨a' + (row + 1) + ', s⟩ = ' + inst.as[row] +
        '   +   e = ' + sgn(inst.e[row]) +
        '   →   b = ' + inst.b[row] + '   (mod ' + q + ')',
        { mono: true, fontSize: 11, color: BRIGHT, fill: CARD, stroke: LINE });
      y += 26;
    }
    if (truncated) {
      cardLine(L, cxL, y, cw, 18,
        E.t({ en: 'A is truncated to its first ' + aCols + ' of ' + n + ' columns at this width',
              zh: '这个宽度下 A 只画出了 ' + n + ' 列中的前 ' + aCols + ' 列' }),
        { mono: true, fontSize: 10, color: ORANGE });
      y += 22;
    }

    /* ---- 攻击的判决 ---- */
    if (E.state.showSolve) {
      const r = atk.full;
      let text, color, fill, stroke;
      if (atk.fullExact) {
        text = E.t({ en: 'Gaussian elimination recovered s exactly — ('
                         + inst.s.join(', ') + ')',
                     zh: '高斯消元精确还原了 s —— (' + inst.s.join(', ') + ')' });
        color = EMERALD; fill = F.emerald.fill; stroke = F.emerald.stroke;
      } else if (r.reason === 'inconsistent') {
        /* 品红是"这一项没有对手、没有解、不该存在"专用色。求解器报的正是
           这件事：**没有任何 s 满足这组方程**。它不是"算不出来"，是"不存在"。 */
        text = E.t({ en: 'no s satisfies these equations — the system is inconsistent',
                     zh: '没有任何 s 满足这组方程 —— 方程组不相容' });
        color = UNPAIRED; fill = F.unpair.fill; stroke = F.unpair.stroke;
      } else if (r.reason === 'underdetermined') {
        text = E.t({ en: 'A is rank-deficient here — many s fit equally well',
                     zh: '这次的 A 秩不足 —— 有多个 s 同样满足全部方程' });
        color = ORANGE; fill = F.orange.fill; stroke = F.orange.stroke;
      } else {
        text = E.t({ en: 'solved — but for the wrong s: (' + r.s.join(', ') + ')',
                     zh: '解出来了 —— 但不是那个 s：(' + r.s.join(', ') + ')' });
        color = ROSE; fill = F.rose.fill; stroke = F.rose.stroke;
      }
      cardLine(L, cxL, y, cw, 24, text,
               { mono: true, fontSize: 10.5, color: color, fill: fill, stroke: stroke });
      y += 28;

      const st = lweStats(n);
      cardLine(L, cxL, y, cw, 20,
        E.t({ en: TRIALS + ' random instances · without e: ' + st.clean.fullExact + '/' +
                  TRIALS + ' recovered · with e: ' + st.noisy.fullExact + '/' + TRIALS,
              zh: TRIALS + ' 个随机实例 · 没有 e：还原 ' + st.clean.fullExact + '/' +
                  TRIALS + ' · 有 e：还原 ' + st.noisy.fullExact + '/' + TRIALS }),
        { mono: true, fontSize: 10.5, color: SLATE });
      y += 24;
    }
    cardLine(L, cxL, y, cw, 18,
      E.t({ en: 'toy scale: n = ' + n + ', q = ' + q + ' · real schemes: hundreds / thousands',
            zh: '玩具规模：n = ' + n + '、q = ' + q + ' · 真实方案：几百 / 几千' }),
      { mono: true, fontSize: 10, color: DIM });
  },
  readout: function () {
    syncIo();
    const got = lweOf();
    const inst = got.inst, atk = got.atk;
    const st = lweStats(inst.n);
    let s = '<b style="--c:var(--trace-cyan)"><i>b</i> = <i>A</i>·<i>s</i>' +
      (inst.noise ? ' + <i>e</i>' : '') + ' (mod ' + inst.q + ')</b><br>' +
      '<span class="dim"><i>n</i> = ' + inst.n + '   <i>m</i> = ' + inst.m +
      '   <i>q</i> = ' + inst.q + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'secret ', zh: '秘密 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)"><i>s</i> = (' + inst.s.join(', ') + ')</b><br>';
    if (atk.fullExact) {
      s += '<b style="--c:var(--trace-emerald)">' +
        E.t({ en: 'recovered exactly', zh: '精确还原' }) + '</b>';
    } else if (atk.full.reason === 'inconsistent') {
      s += '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'no solution exists', zh: '无解' }) + '</b>' +
        '<span class="dim">   ' + E.t({ en: 'inconsistent', zh: '不相容' }) + '</span>';
    } else if (atk.full.reason === 'underdetermined') {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'rank-deficient A', zh: 'A 秩不足' }) + '</b>';
    } else {
      s += '<b style="--c:var(--trace-rose)">' +
        E.t({ en: 'wrong s: (' + atk.full.s.join(', ') + ')',
              zh: '错的 s：(' + atk.full.s.join(', ') + ')' }) + '</b>';
    }
    s += '<br><span class="dim">' +
      E.t({ en: 'control: e = 0 recovers ' + st.clean.fullExact + '/' + TRIALS,
            zh: '对照组：e = 0 时还原 ' + st.clean.fullExact + '/' + TRIALS }) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'with e: ' + st.noisy.fullExact + '/' + TRIALS +
                ' — and those are exactly the draws where e came out all-zero',
            zh: '有 e 时：' + st.noisy.fullExact + '/' + TRIALS +
                ' —— 而那几次恰好就是 e 整条抽成零的那几次' }) + '</span>';
    return s;
  }
};

/* ================= 页签三：为什么 —— 顿悟视角 =================
   这一页要修正一个常见的、也很好听的说法："格问题没有周期，所以 Shor
   抓不到它。" 前半句是**错的**，而错的那一半正好藏着更好的答案。

   格当然有周期——格本身就是它的周期：把任何函数沿格向量平移，一切照旧。
   区别在别处：
     RSA / DH  周期 r 是**藏起来的**。给你 N 与 a，找 r 与分解 N 一样难；
               而 Shor 的量子傅立叶变换恰好是一台找隐藏周期的机器。
               找到 r，因子由一次 gcd 交出来——本页把这条链路真的算出来。
     格         周期**就印在公钥里**。基是格的一份完整描述，没有什么藏着
               等人找。难的是在一个完全已知的周期结构里做几何最优化
               （最近向量 / 最短向量），而周期查找对此没有着力点。

   所以诚实的一句话不是"格没有周期"，而是：**Shor 解决的是隐藏子群问题，
   而格问题不是那个形状。** 已知的归约把唯一最短向量问题送到**二面体**
   隐藏子群问题上——一个非交换群上的 HSP，至今没有已知的高效量子算法。
   （这一句是文献事实，本页无法自己验证，所以它以"已知的归约"出现，
   而不是当成本页算出来的结论。） */
const why = {
  label: { en: 'Why', zh: '为什么' },
  brand: { en: 'RSA falls to Shor because its hardness hides a period. A lattice hides nothing — its period is the public key.',
           zh: 'RSA 倒在 Shor 手里，是因为它的困难藏着一个周期。格什么也没藏 —— 它的周期就是公钥本身。' },
  tips: { en: 'Epiphany view. Left: aˣ mod N repeats every r steps, and the green bars mark the repeat. Find r and one gcd hands over the factors — that is all Shor adds. Right: the lattice repeats too, but its period is the basis, printed in the key. Nothing is hidden, so there is nothing for a period-finder to find; the hard part is geometry inside a fully known structure.',
          zh: '顿悟视角。左边：aˣ mod N 每 r 步重复一次，绿色的柱子就是重复点。找到 r，一次 gcd 就交出因子 —— Shor 添加的全部内容就是找 r。右边：格也重复，但它的周期就是那组基，印在公钥里。什么都没藏，也就没有什么好找的；难的是在一个完全已知的结构里做几何。' },
  params: ['aBase', 'skew', 'speed'],
  /* ⚠ 纯文本，不能带标签：引擎 buildPresets() 是 lab.textContent = t(...)，
     不是 innerHTML —— 写 <i>a</i> 会在面板上原样显示成 '底数 <i>a</i>'。
     （PARAMS 的 label 走的是 innerHTML，那边才可以带标签。） */
  presetsLabel: { en: 'Base a', zh: '底数 a' },
  presets: [
    { key: 'a2',  label: { en: 'a = 2', zh: 'a = 2' },   onSelect: function () { setParam('aBase', 2); } },
    { key: 'a8',  label: { en: 'a = 8', zh: 'a = 8' },   onSelect: function () { setParam('aBase', 8); } },
    { key: 'a9',  label: { en: 'a = 9', zh: 'a = 9' },   onSelect: function () { setParam('aBase', 9); } },
    { key: 'a10', label: { en: 'a = 10', zh: 'a = 10' }, onSelect: function () { setParam('aBase', 10); } }
  ],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showPayload', label: { en: 'gcd payload', zh: 'gcd 那一步' }, color: ROSE, checked: true },
    { key: 'showBasisW',  label: { en: 'basis', zh: '基' },               color: VIOLET, checked: true }
  ],
  draw: function () {
    CUR = 'why';
    syncPreset('why', { 2: 'a2', 8: 'a8', 9: 'a9', 10: 'a10' }[curA()] || null);
    const L = layout();
    const a = curA(), N = N_RSA;
    const r = LT.periodOf(a, N);
    const pay = LT.shorPayload(a, N);

    const tl = timelineFor('why', r ? r * 3 : 24, 0.35, 0);
    tick(tl);

    /* 两栏（宽屏）或上下两块（窄屏）。**先把底部横幅那一条带子扣掉**，再拿
       剩下的地方分给两块内容——反过来做（先按内容定尺寸再摆横幅）会让那句
       "这不是安全性证明"的诚实话成为第一个被挤出画布的东西，而它恰恰是
       整页最不能省的一行。 */
    const twoCol = L.availW > 720;
    const colW = twoCol ? Math.min((L.availW - 60) / 2, 400) : Math.min(L.availW - 26, 460);
    const leftX = twoCol ? L.cx - colW - 14 : L.cx - colW / 2;
    const rightX = twoCol ? L.cx + 14 : L.cx - colW / 2;
    /* ⚠ 小标题画在 topY 上，正文从 topY + HEAD 起——**不要**把标题画到
       topY − 24 去。窄屏上 L.top = 142 是内容区的上沿，而传输条被 CSS 挪到了
       top:110、底边约 150，标题一旦跑到 L.top 之上就正好钻进传输条底下。
       实测撞到过：那行 "RSA / DH · the period is HIDDEN" 被传输条切掉了上半。 */
    const HEAD = 22;
    const bannerH = 50;
    const topY = L.top + 2;
    const contentBottom = L.H - L.bot - bannerH;
    /* ⚠ 这里**不设下限**。第一版写的是 Math.max(120, …)，那个 120 的本意是
       "至少给这块 120px"，实际效果是把"放不下"变成"画到横幅上"——740×380 上
       实测三段文字叠成一团。这正是本仓反复记账的那个形状（先定尺寸、再
       clamp 到一个下限）。放不下就是放不下：尺寸如实缩小，缩不动的那几行由
       cardLine 的 maxY 整行丢掉，而不是画上去。 */
    const blockH = twoCol ? (contentBottom - topY - 8)
                          : (contentBottom - topY - 30) / 2;
    const leftBottom = twoCol ? contentBottom : topY + blockH;
    const rightBottom = contentBottom;

    /* ---- 左：藏起来的周期 ---- */
    cardLine(L, leftX, topY, colW, 18,
      E.t({ en: 'RSA / DH · the period is HIDDEN', zh: 'RSA / DH · 周期是藏着的' }),
      { color: CYAN, fontSize: 11.5, weight: 600 }, leftBottom);

    const barsWanted = r ? Math.min(r * 3 + 1, 30) : 24;
    const bf = E.fitCells(colW - 8, barsWanted, { gap: 2, min: 7, max: 20 });
    const orb = LT.orbit(a, N, bf.n);
    const barsH = Math.min(130, blockH - HEAD - 108);
    const barsY = topY + HEAD;
    const head = Math.min(bf.n - 1, tl.index);
    if (barsH >= 26) E.barChart(leftX + 4, barsY, bf.total, barsH, orb, {
      /* ⚠ 动画期间必须给 o.max：不给的话每一帧都按当前最大值自适应，
         柱子会在原地呼吸，而"它在重复"这件事恰恰要靠高度不变来看见。 */
      max: N, gap: 2,
      colorAt: function (i) {
        if (r && i % r === 0) return EMERALD;             // 回到 1 的那些格
        return i === head ? BRIGHT : 'rgba(45,212,234,.62)';
      }
    });
    /* 周期括号：从 0 到 r，再从 r 到 2r。两段一样长，这就是"重复"的画面形式。 */
    if (r && r < bf.n && barsH >= 26) {
      const bw = (bf.total - 2 * (bf.n - 1)) / bf.n;
      const bx = function (i) { return leftX + 4 + i * (bw + 2); };
      const braceY = barsY + barsH + 12;
      for (let k = 0; k * r + r <= bf.n - 1 && k < 2; k++) {
        E.flowArrow(bx(k * r), braceY, bx(k * r + r), braceY,
                    { color: k === 0 ? EMERALD : 'rgba(52,211,153,.45)', width: 1.3, head: false });
        chipFit(bx(k * r), braceY + 2, bx(k * r + r) - bx(k * r), 14,
                'r = ' + r, { color: k === 0 ? EMERALD : 'rgba(52,211,153,.55)', fontSize: 9.5 });
      }
    }
    let ly = barsY + barsH + (r && r < bf.n ? 32 : 12);
    cardLine(L, leftX, ly, colW, 18,
             'f(x) = ' + a + 'ˣ mod ' + N + (r ? '   ·   r = ' + r
               : '   ·   gcd(' + a + ', ' + N + ') = ' + CC.gcd(a, N)),
             { mono: true, fontSize: 10.5, color: CYAN }, leftBottom);
    ly += 22;
    if (E.state.showPayload) {
      let txt, col, fl, st;
      if (pay.reason === 'not-coprime') {
        txt = E.t({ en: 'gcd(' + a + ', ' + N + ') = ' + pay.gcd + ' already — free factor, no quantum needed',
                    zh: 'gcd(' + a + ', ' + N + ') = ' + pay.gcd + ' —— 白捡一个因子，用不着量子计算机' });
        col = ORANGE; fl = F.orange.fill; st = F.orange.stroke;
      } else if (pay.reason === 'odd-period') {
        txt = E.t({ en: 'r = ' + pay.r + ' is odd — this a fails, pick another (Shor retries)',
                    zh: 'r = ' + pay.r + ' 是奇数 —— 这个 a 走不通，换一个（Shor 本来就要重试）' });
        col = ROSE; fl = F.rose.fill; st = F.rose.stroke;
      } else if (pay.reason === 'minus-one') {
        txt = E.t({ en: 'a^(r/2) ≡ −1 (mod N) — this a fails too, and that is normal',
                    zh: 'a^(r/2) ≡ −1 (mod N) —— 这个 a 同样走不通，而这是正常的' });
        col = ROSE; fl = F.rose.fill; st = F.rose.stroke;
      } else {
        txt = a + '^' + (pay.r / 2) + ' = ' + pay.x + '  →  gcd(' + (pay.x - 1) + ', ' + N +
              ') = ' + pay.factors[0] + '   gcd(' + (pay.x + 1) + ', ' + N + ') = ' + pay.factors[1];
        col = EMERALD; fl = F.emerald.fill; st = F.emerald.stroke;
      }
      cardLine(L, leftX, ly, colW, 26, txt,
               { mono: true, fontSize: 10, color: col, fill: fl, stroke: st }, leftBottom);
      ly += 28;
    }
    cardLine(L, leftX, ly, colW, 26,
      E.t({ en: 'Finding r classically is as hard as factoring. Shor’s QFT finds hidden periods.',
            zh: '经典地找 r 与分解 N 一样难。Shor 的量子傅立叶变换正是一台找隐藏周期的机器。' }),
      { mono: true, fontSize: 9.5, color: DIM }, leftBottom);

    /* ---- 右：印在公钥里的周期 ---- */
    const rTop = twoCol ? topY : topY + blockH + 8;
    cardLine(L, rightX, rTop, colW, 18,
      E.t({ en: 'Lattice · the period is PUBLISHED', zh: '格 · 周期是公开的' }),
      { color: VIOLET, fontSize: 11.5, weight: 600 }, rightBottom);

    /* 板子的边长同时受"这一栏有多宽"与"这一块还剩多少高"两头夹住，
       并且给下面那两行说明各留一份。少了后一半，窄屏上棋盘会直接坐到
       底部横幅上——canvas 不会拦它。 */
    const bdTop = rTop + HEAD;
    /* 同样不设下限：放不下就把板子整块省掉，绝不让它压到横幅上。
       60px 是"还能看出这是一片格点"的下限，低于它画出来也没有信息。 */
    const side = Math.min(colW - 20, rightBottom - bdTop - 50, 300);
    if (side >= 60) {
      const bd = drawBoard(L, rightX + (colW - side) / 2, bdTop, side);
      const B = curB(), t = curTarget();
      if (E.state.showBasisW) {
        drawBasisArrow(bd, [B[0][0], B[1][0]], VIOLET, null);
        drawBasisArrow(bd, [B[0][1], B[1][1]], VIOLET, null);
      }
      const best = LT.closest(B, t);
      drawRing(bd, best.point, EMERALD, 6);
      drawTarget(bd, t);
    }

    let ry = bdTop + Math.max(side, 0) + 8;
    cardLine(L, rightX, ry, colW, 16,
      E.t({ en: 'the basis IS the period — shift by a lattice vector, nothing changes',
            zh: '那组基就是周期 —— 沿任何格向量平移，一切照旧' }),
      { mono: true, fontSize: 10, color: VIOLET }, rightBottom);
    ry += 20;
    cardLine(L, rightX, ry, colW, 26,
      E.t({ en: 'Nothing is hidden, so a period-finder has nothing to find.',
            zh: '什么都没藏，所以找周期的机器无从下手。' }),
      { mono: true, fontSize: 9.5, color: DIM }, rightBottom);

    /* ---- 底部：论点与那句不能省的诚实话 ---- */
    const bw = Math.min(L.availW - 26, 700);
    const bxx = L.cx - bw / 2;
    const byy = contentBottom + 2;
    /* ⚠ 这两行的文案是**照着量出来的宽度改短的**，不是随手写的。
       第一版（"Post-quantum is not stronger cryptography — it is cryptography
       on a different shape of hard problem."）在 375px 上被 fitText 截成了
       "…on a different sh…"。截断本身没错——错的是把整页的论点交给省略号。
       放不下的时候要改的是文案，不是让机制去背锅。 */
    cardLine(L, bxx, byy, bw, 24,
      E.t({ en: 'Not stronger crypto — a different shape of hard problem.',
            zh: '不是"更强的"密码 —— 是另一种形状的困难问题。' }),
      { mono: true, fontSize: 10.5, color: EMERALD, fill: F.emerald.fill, stroke: F.emerald.stroke });
    cardLine(L, bxx, byy + 26, bw, 18,
      E.t({ en: 'No efficient quantum algorithm is KNOWN for lattices — not a proof.',
            zh: '目前没有已知的高效量子算法能解格问题 —— 这不是一个证明。' }),
      { mono: true, fontSize: 9.5, color: ORANGE });
  },
  readout: function () {
    syncIo();
    const a = curA(), N = N_RSA;
    const r = LT.periodOf(a, N);
    const pay = LT.shorPayload(a, N);
    let s = '<b style="--c:var(--trace-cyan)"><i>f</i>(<i>x</i>) = ' + a +
      '<sup><i>x</i></sup> mod ' + N + '</b><br>';
    if (r == null) {
      s += '<b style="--c:var(--trace-orange)">gcd(' + a + ', ' + N + ') = ' +
        CC.gcd(a, N) + '</b><span class="dim">   ' +
        E.t({ en: 'a free factor — no period needed', zh: '白捡一个因子 —— 用不着周期' }) +
        '</span><br>';
    } else {
      s += '<span class="dim">' + E.t({ en: 'hidden period ', zh: '隐藏周期 ' }) + '</span>' +
        '<b style="--c:var(--trace-emerald)"><i>r</i> = ' + r + '</b><br>';
      if (pay.ok) {
        s += '<span class="dim">' + a + '<sup>' + (pay.r / 2) + '</sup> = ' + pay.x +
          '</span><br><b style="--c:var(--trace-emerald)">' + N + ' = ' +
          pay.factors[0] + ' × ' + pay.factors[1] + '</b><br>';
      } else {
        s += '<b style="--c:var(--trace-rose)">' +
          E.t({ en: 'this a fails (' + pay.reason + ') — Shor retries with another',
                zh: '这个 a 走不通（' + pay.reason + '）—— Shor 换一个再来' }) +
          '</b><br>';
      }
    }
    s += '<span class="dim">' +
      E.t({ en: 'Shor finds r. A lattice hands you its period in the key — there is nothing hidden to find.',
            zh: 'Shor 找的是 r。而格把周期直接写在公钥里 —— 没有什么藏着等人找。' }) +
      '</span><br><span class="dim">' +
      /* ⚠ readout 是 innerHTML，不是 Markdown：** 会原样显示成星号。
         要强调就用标签。 */
      E.t({ en: 'Known reductions send unique-SVP to the <b>dihedral</b> hidden subgroup problem — non-abelian, and no efficient quantum algorithm is known for it.',
            zh: '已知的归约把唯一最短向量问题送到<b>二面体</b>隐藏子群问题上 —— 非交换群，至今没有已知的高效量子算法。' }) +
      '</span>';
    return s;
  }
};

var SCENES = { lattice: lattice, lwe: lwe, why: why };

buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* 两件必须在 init 之后做的事：页签按钮此刻才存在（见 bindTabTracking 的注释），
   而 #ioHost 的文案要按当前语言与当前页签刷一次。 */
bindTabTracking();
syncIo();
</script>
</body>
</html>
