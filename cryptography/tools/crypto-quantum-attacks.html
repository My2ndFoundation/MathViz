              zh: 'gcd(a, N) ≠ 1 —— 根本没用到周期' }) + '</b><br>' +
        '<span class="dim">N = </span>' + rec.p + ' · ' + rec.q;
      return s + rateLine(st) + disclaimer();
    }
    s += '<span class="dim">' + E.t({ en: 'period ', zh: '周期 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)"><i>r</i> = ' + rec.r + '</b><br>' +
      '<span class="dim">' + E.t({
        en: 'the scan took ' + commas(rec.steps) + ' modular multiplications',
        zh: '这次扫描走了 ' + commas(rec.steps) + ' 次模乘'
      }) + '</span><br>';
    if (rec.reason === 'odd-order') {
      s += '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'r is odd — a^(r/2) is not defined, this a gives nothing',
              zh: 'r 是奇数 —— a^(r/2) 没有定义，这个 a 什么也给不了' }) + '</b>';
      return s + rateLine(st) + disclaimer();
    }
    s += '<span class="dim">a^(r/2) mod <i>N</i> = </span>' +
      '<b style="--c:var(--trace-' + (rec.reason === 'minus-one' ? 'unpaired' : 'violet') + ')">' +
      rec.half + '</b><br>';
    if (rec.reason === 'minus-one') {
      s += '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'that is N−1 ≡ −1, so gcd(a^(r/2)−1, N) is trivial — nothing comes out',
              zh: '它就是 N−1 ≡ −1，于是 gcd(a^(r/2)−1, N) 是平凡的 —— 什么也掉不出来' }) + '</b>';
      return s + rateLine(st) + disclaimer();
    }
    s += '<span class="dim">gcd(a^(r/2)−1, N) = </span>' +
      '<b style="--c:var(--trace-emerald)">' + rec.gcdMinus + '</b>' +
      '<span class="dim">   gcd(·+1, N) = </span>' +
      '<b style="--c:var(--trace-emerald)">' + rec.gcdPlus + '</b><br>' +
      '<b style="--c:var(--trace-emerald)"><i>N</i> = ' + rec.p + ' · ' + rec.q + '</b>';
    return s + rateLine(st) + disclaimer();
  }
};

function rateLine(st) {
  if (!st || !st.tried) return '';
  const pct = ((st.factored / st.tried) * 100).toFixed(1);
  return '<br><span class="dim">' + E.t({
    en: (st.done ? 'over all ' : 'so far ') + st.tried + ' bases: ' + pct +
        '% give a factor (theory floor 50%)',
    zh: (st.done ? '全部 ' : '目前 ') + st.tried + ' 个底数里：' + pct +
        '% 能给出因子（定理下界 50%）'
  }) + '</span>';
}

/* ================= 页签二：speedup ================= */

/* 四步流水线。三步是刚才那一页真的跑过的经典算术，只有第 2 步是量子的。
   这张图存在的唯一理由：把"Shor 一次试遍所有因子"这个最常见的误解摁死。 */
function pipeSteps() {
  return [
    { n: '1', t: { en: 'pick a, take gcd(a, N)', zh: '取 a，算 gcd(a, N)' }, q: false },
    { n: '2', t: { en: 'find the period r of aˣ mod N', zh: '求 aˣ mod N 的周期 r' }, q: true },
    { n: '3', t: { en: 'r even? a^(r/2) ≢ −1?', zh: 'r 是偶吗？a^(r/2) ≢ −1？' }, q: false },
    { n: '4', t: { en: 'gcd(a^(r/2) ± 1, N) → p, q', zh: 'gcd(a^(r/2) ± 1, N) → p, q' }, q: false }
  ];
}

function drawPipeline(x, y, w, narrow) {
  const steps = pipeSteps();
  const rh = narrow ? 26 : 28;
  let yy = y;
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    const txt = s.n + '.  ' + E.t(s.t);
    E.chip(x, yy, w, rh, txt, {
      color: s.q ? VIOLET : CYAN,
      fill: s.q ? 'rgba(167,139,250,.13)' : 'rgba(45,212,234,.05)',
      stroke: s.q ? 'rgba(167,139,250,.65)' : LINE,
      width: s.q ? 1.4 : 1,
      fontSize: fitFont(txt, w, 12.5, 8), radius: 8
    });
    yy += rh + 4;
  }
  const note = E.t({
    en: 'steps 1, 3 and 4 are the classical arithmetic you just ran. Only step 2 is quantum.',
    zh: '第 1、3、4 步就是你刚才跑过的经典算术。只有第 2 步是量子的。'
  });
  yy += caption(x, yy, w, note, { fontSize: 10.5, color: VIOLET, maxLines: 2 });
  return yy - y;
}

/* 代价曲线。**画的是指数**（log₂ 运算次数），不是运算次数本身——后者在
   2048 比特上是一个 35 位的十进制数，画不出来也读不出来。指数是线性涨还是
   次指数涨，在这张图上一眼看得出来，而那正是"多项式 vs 次指数"的全部内容。

   四条曲线的含义各不相同（见算法模块里那段），所以颜色绑含义：
     slate   朴素周期扫描 2ⁿ —— 上一页签真正在跑的那条
     orange  试除 2^(n/2) —— crypto-rsa 的 factor 页签真正在跑的那条
     rose    GNFS —— 目前已知最好的经典分解算法，次指数
     violet  Shor 的 n³ 规模模型 —— 与流水线第 2 步同色，因为它就是那一步

   y 轴封顶在 YMAX：前两条指数曲线很快就冲出图外，而那**正是要看见的事**。
   冲出去的地方画一个 ↑，不让曲线悄悄消失在边框上。 */
const YMAX = 320;
const CURVES = [
  { model: 'naive-period',   color: 'rgba(159,176,200,.65)', dash: [2, 3],
    label: { en: 'naive period scan  2ⁿ', zh: '朴素周期扫描  2ⁿ' } },
  { model: 'trial-division', color: ORANGE, dash: null,
    label: { en: 'trial division  2^(n/2)', zh: '试除  2^(n/2)' } },
  { model: 'gnfs',           color: ROSE, dash: null,
    label: { en: 'GNFS — best known classical', zh: 'GNFS —— 已知最好的经典算法' } },
  { model: 'shor',           color: VIOLET, dash: null,
    label: { en: 'Shor — n³ scaling model', zh: 'Shor —— n³ 规模模型' } }
];

function drawCostChart(x, y, w, h, bits) {
  const LX0 = Math.log(BITS[0]) / Math.LN2, LX1 = Math.log(BITS[BITS.length - 1]) / Math.LN2;
  function px(b) { return x + w * (Math.log(b) / Math.LN2 - LX0) / (LX1 - LX0); }
  function py(v) { return y + h - h * E.clamp(v, 0, YMAX) / YMAX; }

  E.chip(x, y, w, h, '', { fill: 'rgba(8,13,24,.55)', stroke: LINE, radius: 6 });
  /* y 轴刻度。只标四条，标密了在 375px 上会糊成一片。 */
  for (let v = 64; v <= YMAX; v += 64) {
    E.flowArrow(x, py(v), x + w, py(v), { color: 'rgba(148,163,184,.12)', width: 1, head: false });
    E.chip(x + 2, py(v) - 7, 42, 14, exp2(v), { color: FAINT, fontSize: 9.5 });
  }
  /* x 轴刻度。刻度**线**落在真实位置，刻度**标签**要夹回图框内：
     首尾两个刻度正好压在图框左右边上，一个居中的标签有一半在框外——375px 上
     实测左右各溢出 4px。这类溢出在截图上几乎看不出来（"8"和"4096"看着只是
     贴边），是画布不裁剪不报错的那个老毛病，所以这里按 fitCells 的同一条
     纪律处理：宁可让首尾标签相对刻度线偏一点，也不让它画到画布外面。 */
  const XT = [8, 64, 256, 1024, 4096];
  const tw = 34;
  for (let i = 0; i < XT.length; i++) {
    const bx = px(XT[i]);
    E.flowArrow(bx, y, bx, y + h, { color: 'rgba(148,163,184,.10)', width: 1, head: false });
    E.chip(E.clamp(bx - tw / 2, x, x + w - tw), y + h + 1, tw, 13, String(XT[i]),
           { mono: true, color: FAINT, fontSize: 9.5 });
  }

  for (let ci = 0; ci < CURVES.length; ci++) {
    const cv = CURVES[ci];
    let prev = null, escaped = false;
    for (let i = 0; i < BITS.length; i++) {
      const b = BITS[i];
      const v = SP.log2Cost(cv.model, b);
      const pt = { bx: px(b), v: v };
      if (prev) {
        if (prev.v <= YMAX && v <= YMAX) {
          E.flowArrow(prev.bx, py(prev.v), pt.bx, py(v),
                      { color: cv.color, width: 1.6, dash: cv.dash, head: false });
        } else if (prev.v <= YMAX && v > YMAX) {
          /* 冲出顶边：插值到交点为止，再在那里画一个 ↑。曲线不许悄悄消失。 */
          const k = (YMAX - prev.v) / (v - prev.v);
          const cxp = prev.bx + (pt.bx - prev.bx) * k;
          E.flowArrow(prev.bx, py(prev.v), cxp, py(YMAX),
                      { color: cv.color, width: 1.6, dash: cv.dash, head: false });
          E.flowArrow(cxp, py(YMAX) + 10, cxp, py(YMAX) + 1, { color: cv.color, width: 1.4, headLen: 5 });
          escaped = true;
        }
      }
      prev = pt;
      if (escaped) break;
    }
  }

  /* 当前位长那根竖线，以及四个值。 */
  const mx = px(bits);
  E.flowArrow(mx, y, mx, y + h, { color: 'rgba(226,232,240,.55)', width: 1.2, dash: [4, 3], head: false });
  return h;
}

const speedup = {
  label: { en: 'Speedup', zh: '加速' },
  brand: { en: 'Shor does not try all factors at once. It replaces exactly one subroutine.',
           zh: 'Shor 不是「一次试遍所有因子」。它只替换掉一个子程序。' },
  tips: { en: 'The pipeline has four steps and three of them are the classical arithmetic you just ran on the previous tab. Only step 2 — finding the period — is quantum. The chart plots the exponent, not the number: the best known classical factoring is still sub-exponential, the quantum step is polynomial. Nothing here simulates a quantum computer.',
          zh: '流水线有四步，其中三步就是你在上一页签跑过的经典算术。只有第 2 步——求周期——是量子的。图上画的是指数而不是那个数本身：已知最好的经典分解仍然是次指数的，而量子那一步是多项式的。本页没有任何一处在模拟量子计算机。' },
  params: ['bits', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'sPipe',  label: { en: 'The one step', zh: '被换掉的那一步' }, color: VIOLET, checked: true },
    { key: 'sChart', label: { en: 'Cost curves', zh: '代价曲线' }, color: ORANGE, checked: true },
    { key: 'sLegend', label: { en: 'Legend', zh: '图例' }, color: ROSE, checked: true }
  ],
  draw: function () {
    tickClock();
    const L = layout();
    const bits = curBits();
    const w = Math.min(L.availW, 560);
    const x = L.cx - w / 2;
    let y = L.top;

    if (E.state.sPipe && y + 60 < L.bottomY) {
      y += drawPipeline(x, y, w, L.narrow) + 8;
    }

    if (E.state.sChart && y + 90 < L.bottomY) {
      /* 图高吃掉剩下的空间，但要给 x 轴刻度、图例与结论句留出预算——
         吃光了下面那三样就永远没有位置，而结论才是这一页的落点。 */
      const reserve = 18 + (E.state.sLegend ? CURVES.length * 15 + 6 : 0) + 34;
      const ch = E.clamp(L.bottomY - y - reserve, 60, 190);
      if (ch >= 60) {
        y += drawCostChart(x, y, w, ch, bits) + 16;
      }
    }

    if (E.state.sLegend && y + 16 < L.bottomY) {
      for (let i = 0; i < CURVES.length && y + 15 <= L.bottomY; i++) {
        const cv = CURVES[i];
        const v = SP.log2Cost(cv.model, bits);
        E.chip(x, y + 5, 16, 4, '', { fill: cv.color, radius: 2 });
        const lab = E.t(cv.label);
        E.chip(x + 20, y, w * 0.60, 15, lab,
               { mono: true, color: cv.color, fontSize: fitFont(lab, w * 0.60, 10.5, 8) });
        const val = exp2(v);
        E.chip(x + w * 0.62 + 20, y, w * 0.38 - 20, 15, val,
               { color: cv.color, fontSize: fitFont(val, w * 0.38 - 20, 12, 8) });
        y += 15;
      }
      y += 5;
    }

    /* 结论 + 那句必须说出口的诚实话。 */
    if (y + 16 < L.bottomY) {
      const g = SP.log2Cost('gnfs', bits), s = SP.log2Cost('shor', bits);
      const line = E.t({
        en: 'at ' + bits + ' bits: best classical ≈ ' + exp2(g) + ', the quantum step ≈ ' +
            exp2(s) + '. The GNFS curve is the L[1/3] asymptotic with the o(1) dropped — published estimates for 2048-bit sit nearer 2¹¹².',
        zh: bits + ' 比特上：最好的经典约 ' + exp2(g) + '，量子那一步约 ' +
            exp2(s) + '。GNFS 那条是 L[1/3] 渐近式、丢掉了 o(1) —— 2048 比特的公开估计更接近 2¹¹²。'
      });
      caption(x, y, w, line, { fontSize: 10.5, color: DIM, maxLines: 3 });
    }
  },
  readout: function () {
    const bits = curBits();
    const g = SP.log2Cost('gnfs', bits), s = SP.log2Cost('shor', bits);
    const t = SP.log2Cost('trial-division', bits);
    let out = '<span class="dim">' + E.t({ en: 'modulus ', zh: '模数 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)"><i>n</i> = ' + bits + ' bit</b><br>' +
      '<span class="dim">' + E.t({ en: 'trial division ', zh: '试除 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + expFine(t) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'GNFS (best known classical) ', zh: 'GNFS（已知最好的经典） ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + expFine(g) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'the quantum step (n³ model) ', zh: '量子那一步（n³ 模型） ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + expFine(s) + '</b><br>' +
      '<span class="dim">' + E.t({
        en: 'sub-exponential → polynomial. Not "all factors at once" — one subroutine, replaced.',
        zh: '次指数 → 多项式。不是「一次试遍所有因子」——只是一个子程序被换掉了。'
      }) + '</span><br>' +
      '<span class="dim">' + E.t({
        en: 'no date is claimed here, and no qubit count: those numbers move, and a confidently wrong one is worse than none.',
        zh: '这里不给时间表，也不给量子比特数：那些数字会变，而一个自信的错数比没有数更坏。'
      }) + '</span>';
    return out + disclaimer();
  }
};

/* ================= 页签三：whatfalls —— 顿悟视角 =================
   第 1–4 章的算法逐条对上量子计算机。伤害**不均匀**，这一整页就是为了这件事。

   每一行的两个指数都由算法模块现算，不写死：一张手抄的表会在有人改了代价
   模型之后继续自信地报旧数。 */
const FALLS = [
  { name: { en: 'RSA-2048', zh: 'RSA-2048' },
    hard: { en: 'integer factoring', zh: '整数分解' },
    cls: SP.log2Cost('gnfs', 2048), q: SP.log2Cost('shor', 2048), verdict: 'falls' },
  { name: { en: 'Diffie–Hellman 3072', zh: 'Diffie–Hellman 3072' },
    hard: { en: 'finite-field discrete log', zh: '有限域离散对数' },
    cls: SP.log2Cost('gnfs', 3072), q: SP.log2Cost('shor', 3072), verdict: 'falls' },
  { name: { en: 'ECDH / ECDSA P-256', zh: 'ECDH / ECDSA P-256' },
    hard: { en: 'elliptic-curve discrete log', zh: '椭圆曲线离散对数' },
    cls: SP.log2Cost('rho', 256), q: SP.log2Cost('shor', 256), verdict: 'falls' },
  { name: { en: 'AES-128', zh: 'AES-128' },
    hard: { en: 'key search', zh: '密钥穷举' },
    cls: SP.groverCost(128).classicalLog2, q: SP.groverCost(128).quantumLog2, verdict: 'halved' },
  { name: { en: 'AES-256', zh: 'AES-256' },
    hard: { en: 'key search', zh: '密钥穷举' },
    cls: SP.groverCost(256).classicalLog2, q: SP.groverCost(256).quantumLog2, verdict: 'holds' },
  { name: { en: 'SHA-256 preimage', zh: 'SHA-256 原像' },
    hard: { en: 'preimage search', zh: '原像搜索' },
    cls: SP.groverCost(256).classicalLog2, q: SP.groverCost(256).quantumLog2, verdict: 'holds' },
  { name: { en: 'SHA-256 collision', zh: 'SHA-256 碰撞' },
    hard: { en: 'birthday collision', zh: '生日碰撞' },
    cls: 128, q: 128, verdict: 'holds', caveat: true }
];

const VERDICT = {
  falls:  { color: ROSE,    label: { en: 'falls', zh: '垮掉' } },
  halved: { color: ORANGE,  label: { en: 'half the bits', zh: '丢一半比特' } },
  holds:  { color: EMERALD, label: { en: 'holds', zh: '扛住' } }
};

const BAR_MAX = 256;

/* 一行四栏：名字 · 两条长度条 · 两个指数 · 判决。

   ⚠ 指数必须**自己占一栏**，不能压在长度条上面。第一版把它画在条的右端，
   桌面上实测：AES-256 与 SHA-256 原像的经典值正好等于量程上限 BAR_MAX，
   灰条铺满整栏，"2²⁵⁶ → 2¹²⁸"就压在条上——那两行恰恰是这一页最要紧的
   两行（"扛住"的证据）。四栏之后每一栏都有自己的宽度，谁也压不到谁。 */
function drawFallRow(x, y, w, h, row, narrow) {
  const V = VERDICT[row.verdict];
  const nameW = narrow ? w * 0.52 : w * 0.30;
  const verW  = narrow ? w * 0.48 : w * 0.16;
  const numW  = narrow ? w * 0.36 : w * 0.17;
  const barW  = narrow ? w - numW - 6 : w - nameW - numW - verW - 12;
  const nm = E.t(row.name);
  E.chip(x, y, nameW, narrow ? 15 : h, nm,
         { color: BRIGHT, fontSize: fitFont(nm, nameW, narrow ? 11.5 : 12.5, 8) });
  const vl = E.t(V.label) + (row.caveat ? ' *' : '');
  E.chip(x + (narrow ? nameW : w - verW), y, verW, narrow ? 15 : h, vl,
         { color: V.color, fontSize: fitFont(vl, verW, narrow ? 11 : 12, 8),
           fill: narrow ? null : 'rgba(148,163,184,.06)', radius: 6 });

  const by = narrow ? y + 16 : y + (h - 12) / 2;
  const bx = narrow ? x : x + nameW + 4;
  /* 两条：经典（暗）与量子（亮）。同一个量程 BAR_MAX，所以行与行之间可比——
     每行各自归一化的话，RSA 那条和 AES-256 那条会一样长，而这一页的
     全部内容就是它们**不**一样长。 */
  const cw = barW * E.clamp(row.cls, 0, BAR_MAX) / BAR_MAX;
  const qw = barW * E.clamp(row.q, 0, BAR_MAX) / BAR_MAX;
  E.chip(bx, by, Math.max(2, cw), 5, '', { fill: 'rgba(148,163,184,.42)', radius: 2 });
  E.chip(bx, by + 6, Math.max(2, qw), 6, '', { fill: V.color, radius: 3 });
  const lab = exp2(row.cls) + ' → ' + exp2(row.q);
  E.chip(bx + barW + 4, by - 2, numW, 15, lab,
         { color: DIM, fontSize: fitFont(lab, numW, 10.5, 8) });
  return narrow ? 34 : h;
}

const whatfalls = {
  label: { en: 'What falls', zh: '什么会垮' },
  brand: { en: 'The damage is not uniform. Some things fall completely; others only lose half their key bits.',
           zh: '伤害并不均匀。有些东西彻底垮掉，另一些只是丢掉一半密钥比特。' },
  tips: { en: 'Epiphany view. RSA, Diffie–Hellman and elliptic curves fall because their hardness IS a period-finding problem — the same box highlighted on the previous tab. AES and SHA-256 do not: Grover only square-roots the search, which costs half the key bits. AES-128 drops to 2⁶⁴; AES-256 stays at 2¹²⁸. "Quantum breaks all encryption" dies here.',
          zh: '顿悟视角。RSA、Diffie–Hellman 与椭圆曲线垮掉，是因为它们的困难性**本身就是**一个周期查找问题——正是上一页签里高亮的那个框。AES 与 SHA-256 不是：Grover 只把搜索开了平方根，代价是一半密钥比特。AES-128 掉到 2⁶⁴，AES-256 仍在 2¹²⁸。「量子计算机破解一切加密」这句话死在这一页。' },
  params: [],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'wTable',   label: { en: 'The table', zh: '对照表' }, color: ROSE, checked: true },
    { key: 'wWhy',     label: { en: 'Why', zh: '为什么' }, color: VIOLET, checked: true },
    { key: 'wHarvest', label: { en: 'Harvest now', zh: '先收割后解密' }, color: ORANGE, checked: true }
  ],
  draw: function () {
    tickClock();
    const L = layout();
    const w = Math.min(L.availW, 580);
    const x = L.cx - w / 2;
    let y = L.top;

    if (E.state.wTable) {
      const head = E.t({ en: 'classical → with a quantum computer',
                         zh: '经典 → 有了量子计算机之后' });
      E.chip(x, y, w, 16, head, { mono: true, color: DIM, fontSize: fitFont(head, w, 10.5, 8) });
      y += 19;
      const rh = L.narrow ? 34 : E.clamp(L.vSpace * 0.062, 22, 30);
      let shown = 0;
      for (let i = 0; i < FALLS.length && y + rh <= L.bottomY - 4; i++) {
        y += drawFallRow(x, y, w, rh, FALLS[i], L.narrow) + 2;
        shown++;
      }
      if (shown < FALLS.length) {
        const cut = E.t({ en: shown + ' of ' + FALLS.length + ' rows shown',
                          zh: '共 ' + FALLS.length + ' 行，这里显示了 ' + shown + ' 行' });
        E.chip(x, y, w, 15, cut, { mono: true, color: ORANGE, fontSize: fitFont(cut, w, 10, 8) });
        y += 17;
      }
      y += 4;
    }

    if (E.state.wWhy && y + 18 < L.bottomY) {
      const why = E.t({
        en: 'The top three fall for one reason: their hardness IS period-finding. The rest only face Grover, which square-roots the search — half the key bits, not all of them.',
        zh: '上面三行垮掉只有一个原因：它们的困难性就是周期查找。其余的只面对 Grover，而它只把搜索开了平方根——丢的是一半密钥比特，不是全部。'
      });
      /* maxLines 给 4 而不是 3：375px 的中文这句要占 4 行，给 3 行会在
         "不是全部" 之前截断——而那半句正是这一页的结论。截断标记本身是对的
         （放不下必须说出来），但对**结论句**该做的是给它位置，不是给它省略号。 */
      y += caption(x, y, w, why, { fontSize: 10.5, color: VIOLET, maxLines: 4 }) + 4;
    }

    if (E.state.wHarvest && y + 18 < L.bottomY) {
      /* "先收割、后解密"是这一页唯一一条**可核查**的紧迫性论证——它不需要
         任何关于日期的预测。这一页刻意不给时间表、不给量子比特数。 */
      const hv = E.t({
        en: 'Harvest now, decrypt later: traffic protected by RSA or ECDH can be recorded today and opened whenever such a machine exists. That is checkable now and cannot be fixed retroactively — which is the argument for migrating, without predicting any date.',
        zh: '先收割、后解密：用 RSA 或 ECDH 保护的流量今天就可以被录下来，等那样的机器出现再打开。这件事现在就可核查，且事后无法补救——这才是要迁移的理由，而不需要预测任何日期。'
      });
      y += caption(x, y, w, hv, { fontSize: 10.5, color: ORANGE, maxLines: 4 }) + 3;
    }

    if (y + 14 < L.bottomY) {
      const star = E.t({
        en: '* collisions: the quantum 2^(n/3) result needs comparable quantum memory, and at equal cost classical parallel collision search does no worse — so it is not treated as a practical improvement.',
        zh: '* 碰撞：常被引用的量子 2^(n/3) 需要相当量的量子存储，普遍不被认为优于经典并行搜索。'
      });
      caption(x, y, w, star, { fontSize: 10, color: FAINT, maxLines: 3 });
    }
  },
  readout: function () {
    const g128 = SP.groverCost(128), g256 = SP.groverCost(256);
    let out = '<b style="--c:var(--trace-rose)">' +
      E.t({ en: 'falls completely', zh: '彻底垮掉' }) + '</b>' +
      '<span class="dim">   ' + E.t({
        en: 'RSA · Diffie–Hellman · elliptic curves',
        zh: 'RSA · Diffie–Hellman · 椭圆曲线'
      }) + '</span><br>' +
      '<span class="dim">' + E.t({
        en: 'their hardness is a period-finding problem — the same subroutine',
        zh: '它们的困难性就是一个周期查找问题 —— 同一个子程序'
      }) + '</span><br>' +
      '<b style="--c:var(--trace-orange)">AES-128</b>' +
      '<span class="dim">   ' + exp2(g128.classicalLog2) + ' → </span>' +
      '<b style="--c:var(--trace-orange)">' + exp2(g128.quantumLog2) + '</b><br>' +
      '<b style="--c:var(--trace-emerald)">AES-256</b>' +
      '<span class="dim">   ' + exp2(g256.classicalLog2) + ' → </span>' +
      '<b style="--c:var(--trace-emerald)">' + exp2(g256.quantumLog2) + '</b><br>' +
      '<span class="dim">' + E.t({
        en: 'Grover square-roots the search: √(2¹²⁸) = 2⁶⁴. Half the key bits, not all of them.',
        zh: 'Grover 把搜索开了平方根：√(2¹²⁸) = 2⁶⁴。丢的是一半密钥比特，不是全部。'
      }) + '</span><br>' +
      '<span class="dim">' + E.t({
        en: 'and 2⁶⁴ is 2⁶⁴ SEQUENTIAL Grover iterations — it parallelises badly (S machines buy only √S), so it is not the same thing as 2⁶⁴ classical operations being feasible.',
        zh: '而 2⁶⁴ 是 2⁶⁴ 次**串行**的 Grover 迭代 —— 它并行得很差（S 台机器只换来 √S），所以它与「2⁶⁴ 次经典运算今天可行」完全不是一回事。'
      }) + '</span>';
    return out + disclaimer();
  }
};

var SCENES = { period: period, speedup: speedup, whatfalls: whatfalls };

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
