function rate() { return Math.pow(10, E.state.rate == null ? 12 : E.state.rate); }
function humanTime(s) {
  if (!isFinite(s)) return '∞';
  if (s < 1e-3) return (s * 1e6).toFixed(1) + ' µs';
  if (s < 1) return (s * 1e3).toFixed(1) + ' ms';
  if (s < 90) return s.toFixed(1) + ' s';
  if (s < 5400) return (s / 60).toFixed(1) + ' min';
  /* 小时一路用到 5 天，而不是 2 天：历史事件那一栏里最重要的两条是
     "56 小时" 与 "22 小时 15 分"，而对齐它们的 56 位读数若印成 "2.3 d"，
     同一个量在同一张图上就有了两套单位，肉眼对不上。 */
  if (s < 5 * 86400) return (s / 3600).toFixed(1) + ' h';
  if (s < 2 * YEAR) return (s / 86400).toFixed(1) + ' d';
  const y = s / YEAR;
  if (y < 1e6) return y.toFixed(y < 100 ? 1 : 0) + ' yr';
  return sci(y) + ' yr';
}

/* ================= 时间轴 =================
   两个页签对"一步"的定义不同：feistel 走的是十个阶段，rounds 走的是十七个
   轮次（第 0 点是 IP 之后）。硬塞进同一条时间轴只会让两边互相牵制，所以换
   页签时**重建**时间轴，并各自记住自己走到哪儿。keyspace 页没有时间轴。

   TL 因此必须是 let，而传输条上那三个回调都在**调用时**读 TL——写成
   TL.step.bind(TL) 会把旧对象钉死在监听器里，重建之后按钮就哑了。 */
const STEP_DUR = { feistel: 1.15, rounds: 0.55 };
const TAB_AT = { feistel: 0, rounds: 0 };
let CURTAB = 'feistel';
let TL_TAB = null;
let JUMP = null;
let TL = CryptoAnim.createTimeline({ steps: 10, stepDuration: 1.15, loop: true, rate: 1 });
TL.play();

function ensureTL(tab, steps) {
  const n = Math.max(1, Math.round(steps));
  if (TL_TAB === tab && TL.steps === n) return;
  if (TL_TAB) TAB_AT[TL_TAB] = TL.index;
  TL_TAB = tab;
  TL = CryptoAnim.createTimeline({ steps: n, stepDuration: STEP_DUR[tab] || 0.6,
                                   loop: true, rate: TL.rate });
  TL.seek(Math.min(TAB_AT[tab] || 0, n - 1));
  TL.play();
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock(tab, steps) {
  CURTAB = tab;
  ensureTL(tab, steps);
  if (JUMP != null) { TL.seek(JUMP); JUMP = null; }
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
  TAB_AT[tab] = TL.index;
  return TL.index;
}

document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把时间轴拨回第 0 步。
   用 seek(0) 而不是 TL.reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tickClock 里的 running）。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

    brand: { en: 'Encryption and decryption are the same circuit. Only the order of the subkeys is reversed.',
             zh: '加密与解密是同一段电路。反过来的只有子密钥的顺序。' },
    tips: { en: 'Switch F to "constant" in the preset row. F then throws away every bit of R — and the round still comes back exactly. XOR is what inverts, not F.',
            zh: '把预置里的 F 换成「常函数」。此时 F 把 R 的每一位都扔掉了——而这一轮照样精确还原。可逆的是 XOR，不是 F。' },
    presetsLabel: { en: 'round function', zh: '轮函数' },
    presets: F_LIST.map(function (f) {
      return { key: f.key, label: f.label, onSelect: function () { FKIND = f.key; } };
    }),
    views: {
      iso:  { label: { en: 'Whole round', zh: '整轮' }, az: -0.62, el: 0.42, dist: 9,
              onSelect: function () { JUMP = 0; } },
      fwd:  { label: { en: 'Forward done', zh: '正向完成' }, az: 0, el: 0, dist: 8,
              onSelect: function () { JUMP = 6; } },
      back: { label: { en: 'Back again', zh: '还原' }, az: 0, el: 0.2, dist: 8,
              onSelect: function () { JUMP = 9; } }
    },
    toggles: [
      { key: 'showPipe', label: { en: 'F pipeline', zh: 'F 流水线' }, color: VIOLET, checked: true },
      { key: 'showVerdict', label: { en: 'Round-trip check', zh: '往返复核' }, color: EMERALD, checked: true }
    ],
    draw: function () {
      const stage = tickClock('feistel', STAGES.length);
      const vi = E.viewInfo();
      const B = contentBox(vi);
      const S = feistelState(stage);
      const st = STAGES[stage];
      const narrow = vi.W <= 760;

      /* 竖排：每一行占满可用宽度，标题在行的上方而不是左边——左边放标签
         会吃掉 60–90px，正是窄屏上放不下的那几格。 */
      const showPipe = E.state.showPipe !== false;
      const showVerdict = E.state.showVerdict !== false;
      const rows = [];
      rows.push({ n: 32, bits: S.L, on: CYAN, cap: { en: 'L · left half (32 bits)', zh: 'L · 左半块（32 位）' } });
      rows.push({ n: 32, bits: S.R, on: ROSE, cap: { en: 'R · right half (32 bits)', zh: 'R · 右半块（32 位）' } });
      /* 换掉 F 之后就不能再画 E / K / S 盒那四行了：那条流水线是 **DES 的**
         F 的内部结构，常函数根本不读它的输入。照画会得到一幅"看上去在算、
         其实与结果无关"的图——这一页要讲的偏偏就是"F 里面是什么无所谓"，
         画一条假的流水线正好把它讲反。 */
      const isDes = (FKIND === 'des');
      if (showPipe && isDes) {
        rows.push({ n: 48, bits: S.expanded, on: 'rgba(251,113,133,.6)', from: 1,
                    cap: { en: 'E(R) · 32 bits expanded to 48', zh: 'E(R) · 32 位扩成 48 位' } });
        rows.push({ n: 48, bits: S.k, on: VIOLET, from: 2,
                    cap: { en: 'K · the 48-bit subkey', zh: 'K · 48 位子密钥' } });
        rows.push({ n: 48, bits: S.xored, on: 'rgba(167,139,250,.75)', from: 2,
                    cap: { en: 'E(R) XOR K', zh: 'E(R) ⊕ K' } });
        rows.push({ sbox: true, from: 3,
                    cap: { en: 'eight S-boxes · 6 bits in, 4 bits out', zh: '八个 S 盒 · 6 位进、4 位出' } });
      }
      if (showPipe) {
        rows.push({ n: 32, bits: S.f, on: VIOLET, from: isDes ? 4 : 1, magenta: !isDes,
                    cap: isDes ? { en: 'f = P(S(...)) · the round function output',
                                   zh: 'f = P(S(…)) · 轮函数的输出' }
                               : { en: 'f · this F ignores R and K entirely — no pipeline to draw',
                                   zh: 'f · 这个 F 完全无视 R 与 K —— 没有流水线可画' } });
      }
      rows.push({ n: 32, bits: S.mixed, on: ORANGE, from: 5,
                  cap: { en: 'L XOR f · this becomes the new R', zh: 'L ⊕ f · 它成为新的 R' } });

      const capH = 14;
      const verdictH = showVerdict ? (narrow ? 88 : 46) : 0;
      const bannerH = narrow ? 46 : 30;
      const avail = B.h - bannerH - verdictH - 8;
      let gapY = narrow ? 7 : 9;
      const per = avail / rows.length;
      const cellCap = Math.max(4, Math.min(17, per - capH - gapY));

      /* 先把每一行真正要占的高度算出来，再把剩下的空当摊进行距并整体居中。
         不这么做的话，格宽一旦顶到上限（宽屏上必然顶到），下半幅就是一大块
         空白——内容全挤在顶上，而画布是主角。 */
      rows.forEach(function (r) {
        if (r.sbox) { r.h = capH + Math.max(16, cellCap + 4); return; }
        r.fit = bitRowFit(B.w, r.n);
        r.cell = Math.min(r.fit.cell, cellCap);
        r.h = capH + r.cell;
      });
      let bodyH = 0;
      rows.forEach(function (r) { bodyH += r.h; });
      const slack = avail - bodyH - gapY * rows.length;
      if (slack > 0) gapY += Math.min(34, slack / rows.length);

      /* 顶部横幅：当前阶段在说什么。这是这一页唯一的解说位。 */
      const phaseColor = (S.phase === 'fwd') ? CYAN : (S.phase === 'done' ? EMERALD : ORANGE);
      chipLines(B.x, B.y, B.w, bannerH - 4,
                (stage + 1) + '/' + STAGES.length + '  ' + E.t(st),
                { fill: CARD, stroke: LINE, color: phaseColor,
                  fontSize: narrow ? 11 : 12.5, mono: true }, narrow ? 3 : 1);

      let y = B.y + bannerH;
      rows.forEach(function (r) {
        const active = (r.from == null) ? true : (stage >= r.from);
        if (r.sbox) {
          caption(B.x, y, B.w, E.t(r.cap), active ? DIM : GHOST);
          const n = 8;
          const fit = E.fitCells(B.w, n, { gap: 4, min: 24, max: 96 });
          const x0 = B.x + (B.w - fit.total) / 2;
          for (let i = 0; i < fit.n; i++) {
            const g = S.tr ? S.tr.groups[i] : null;
            const txt = g ? ('S' + (i + 1) + ' ' + g.value.toString(16)) : ('S' + (i + 1));
            chipFit(x0 + i * (fit.cell + 4), y + capH, fit.cell, Math.max(16, cellCap + 4), txt,
                    { fill: active ? 'rgba(167,139,250,.13)' : 'transparent',
                      stroke: active ? 'rgba(167,139,250,.4)' : GHOST,
                      color: active ? VIOLET : GHOST, fontSize: 11.5 });
          }
          y += capH + Math.max(16, cellCap + 4) + gapY;
          return;
        }
        const fit = r.fit;
        const cell = r.cell;
        const total = fit.n * cell + (fit.n - 1);
        const x0 = B.x + (B.w - total) / 2;
        caption(B.x, y, B.w, E.t(r.cap) + trunc(fit, r.n), active ? DIM : GHOST);
        const on = active ? (r.magenta ? MAGENTA : r.on) : GHOST;
        E.bitBlock(x0, y + capH, r.bits.slice(0, fit.n),
                   { cell: cell, gap: 1, on: on, off: active ? FAINT : GHOST });
        y += capH + cell + gapY;
      });

      /* 往返复核：这一页的全部主张压缩成两行数字，全部现算。 */
      if (showVerdict) {
        const ok = (S.diff === 0);
        const t1 = E.t({ en: 'one round, then the same circuit backwards: ',
                         zh: '一轮，再用同一段电路倒着一轮：' }) +
                   S.diff + E.t({ en: ' of 64 bits differ', zh: ' / 64 位不同' });
        const t2 = E.t({ en: 'all 16 rounds, subkeys reversed: ',
                         zh: '整整十六轮，子密钥倒序：' }) +
                   S.fullDiff + E.t({ en: ' of 64 bits differ', zh: ' / 64 位不同' });
        const h = verdictH / 2;
        const nl = narrow ? 2 : 1;
        chipLines(B.x, B.y + B.h - verdictH, B.w, h - 2, t1,
                  { fill: CARD, stroke: ok ? 'rgba(52,211,153,.45)' : 'rgba(255,47,208,.5)',
                    color: ok ? EMERALD : MAGENTA, fontSize: narrow ? 10.5 : 12, mono: true }, nl);
        chipLines(B.x, B.y + B.h - verdictH + h, B.w, h - 2, t2,
                  { fill: CARD, stroke: S.fullDiff === 0 ? 'rgba(52,211,153,.45)' : 'rgba(255,47,208,.5)',
                    color: S.fullDiff === 0 ? EMERALD : MAGENTA,
                    fontSize: narrow ? 10.5 : 12, mono: true }, nl);
      }
    },
    readout: function () {
      syncIo();
      const S = feistelState(TL.index);
      const F = curF();
      const img = fImageSize(F.fn, S.k);
      return dim(E.t({ en: 'stage ', zh: '阶段 ' })) +
        bold('var(--trace-cyan)', (TL.index + 1) + '/' + STAGES.length) +
        dim(' · ' + E.t({ en: 'subkey ', zh: '子密钥 ' })) +
        bold('var(--trace-violet)', 'K' + (S.ki + 1)) + '<br>' +
        dim(E.t({ en: 'F over 64 probe inputs gives ', zh: 'F 在 64 个探针输入上给出 ' })) +
        bold(img <= 2 ? 'var(--trace-unpaired)' : 'var(--trace-violet)',
             img + E.t(img === 1 ? { en: ' distinct output', zh: ' 个不同的输出' }
                                  : { en: ' distinct outputs', zh: ' 个不同的输出' })) +
        (img <= 2 ? dim(E.t({ en: ' — information destroyed', zh: ' —— 信息被销毁' })) : '') +
        '<br>' +
        dim(E.t({ en: 'forward f and backward f identical: ', zh: '正向的 f 与反向的 f 相同：' })) +
        verdict(S.sameF, { en: 'yes', zh: '是' }, { en: 'no', zh: '否' }) + '<br>' +
        dim(E.t({ en: 'one round there and back: ', zh: '一轮去、一轮回：' })) +
        verdict(S.diff === 0, { en: '0 / 64 bits differ', zh: '0 / 64 位不同' },
                { en: S.diff + ' / 64 differ', zh: S.diff + ' / 64 位不同' }) + '<br>' +
        dim(E.t({ en: 'all 16 rounds, keys reversed: ', zh: '十六轮、密钥倒序：' })) +
        verdict(S.fullDiff === 0, { en: '0 / 64 bits differ', zh: '0 / 64 位不同' },
                { en: S.fullDiff + ' / 64 differ', zh: S.fullDiff + ' / 64 位不同' }) + '<br>' +
        dim(E.t(F.note)) + '<br>' + selfCheckLine();
    }
  },

  /* ---------------- 十六轮与雪崩 ---------------- */
  rounds: {
    label: { en: '16 rounds', zh: '十六轮' },
    params: ['flipbit', 'speed'],
    brand: { en: 'Flip one bit of the plaintext and watch the difference spread. Half the output flips within a handful of rounds.',
             zh: '把明文翻掉一位，看差异怎么铺开。没几轮，输出就有一半跟着翻了。' },
    /* tips 里的数字必须是**这一页在这把密钥上**算出来的那一组。
       曾经写的是另一处的测量（40 组随机 (m,k) × 64 位 = 2560 次试验的均值：
       第 4 轮 46.8%、第 5 轮 50.0%），却带着"在这把密钥上"的说法——两个都对的
       数字放错了地方，就成了一句错话。教科书密钥上实测是 46.5% / 48.2%。 */
    tips: { en: 'Switch "what to flip" to "all 64, averaged" and read the curve, not your memory. On the textbook key 46.5% of the output bits already differ after round 4, and it never leaves the neighbourhood of half again.',
            zh: '把「翻什么」切到「全部 64 位取平均」，读曲线而不是读记忆。在教科书密钥上，第 4 轮之后已有 46.5% 的输出位不同，此后再没离开过一半附近。' },
    presetsLabel: { en: 'what to flip', zh: '翻什么' },
    presets: [
      { key: 'plain', label: { en: 'a plaintext bit', zh: '明文的一位' },
        onSelect: function () { RMODE = 'plain'; } },
      { key: 'key', label: { en: 'a key bit', zh: '密钥的一位' },
        onSelect: function () { RMODE = 'key'; } },
      { key: 'sweep', label: { en: 'all 64, averaged', zh: '全部 64 位取平均' },
        onSelect: function () { RMODE = 'sweep'; } }
    ],
    views: {
      iso:   { label: { en: 'All rounds', zh: '全部轮次' }, az: -0.62, el: 0.42, dist: 9,
               onSelect: function () { JUMP = 16; } },
      early: { label: { en: 'Round 1', zh: '第 1 轮' }, az: 0, el: 0, dist: 8,
               onSelect: function () { JUMP = 1; } },
      half:  { label: { en: 'Round 5', zh: '第 5 轮' }, az: 0, el: 0.2, dist: 8,
               onSelect: function () { JUMP = 5; } }
    },
    toggles: [
      { key: 'showMask', label: { en: 'Difference map', zh: '差异图' }, color: ORANGE, checked: true },
      { key: 'showCurve', label: { en: 'Avalanche curve', zh: '雪崩曲线' }, color: EMERALD, checked: true }
    ],
    draw: function () {
      const cur = tickClock('rounds', 17);
      const vi = E.viewInfo();
      const B = contentBox(vi);
      const A = avalancheModel();
      const narrow = vi.W <= 760;
      const showMask = E.state.showMask !== false && A.masks;
      const showCurve = E.state.showCurve !== false;
      const sweep = (A.mode === 'sweep');

      const headH = 24;
      chipFit(B.x, B.y, B.w, 22,
              sweep
                ? E.t({ en: 'mean over all 64 single-bit flips', zh: '全部 64 个单位翻转的平均' })
                : (E.t(A.mode === 'key' ? { en: 'flipped key bit #', zh: '翻转密钥第 ' }
                                         : { en: 'flipped plaintext bit #', zh: '翻转明文第 ' }) +
                   A.bit + E.t({ en: '', zh: ' 位' }) + '  ·  ' +
                   E.t({ en: 'round ', zh: '第 ' }) + cur + E.t({ en: '', zh: ' 轮' })),
              { fill: CARD, stroke: LINE, color: ORANGE, fontSize: narrow ? 11 : 12.5, mono: true });

      let y = B.y + headH;
      const bottom = B.y + B.h;

      /* 扫描模式下没有单条轨迹的差异图，那块地方改画一张更值钱的图：64 次
         单位翻转里，各有多少次是在第 r 轮**第一次**跨过一半。平均曲线只说
         "总体上第几轮到"，这张分布说的是"有多散"——尾巴一直拖到第 16 轮，
         而这条尾巴正是"平均值早就到一半了"这句话会掩盖掉的东西。 */
      if (sweep && A.reachList) {
        const counts = new Array(17).fill(0);
        let never = 0;
        A.reachList.forEach(function (r) { if (r < 0) never++; else counts[r]++; });
        const hh = Math.min(140, (bottom - y) * 0.3);
        caption(B.x, y, B.w,
                E.t({ en: 'of the 64 single-bit flips, how many first cross half at round r',
                      zh: '64 次单位翻转里，各有多少次是在第 r 轮第一次跨过一半' }) +
                (never ? E.t({ en: '  · never: ', zh: '  · 从未到达：' }) + never : ''), DIM);
        E.barChart(B.x, y + 15, B.w, hh, counts, {
          max: Math.max.apply(null, counts) || 1, gap: 3,
          color: 'rgba(52,211,153,.65)',
          labels: counts.map(function (_, i) { return String(i); }),
          labelColor: DIM, labelSize: 9
        });
        y += 15 + hh + 22;
      }

      if (showMask) {
        const fit = bitRowFit(B.w, 64);
        const maskH = Math.min((bottom - y) * (showCurve ? 0.5 : 0.94), 17 * (fit.cell + 2) + 16);
        const cell = Math.max(3, Math.min(fit.cell, (maskH - 16) / 17 - 1));
        const total = fit.n * cell + (fit.n - 1);
        const x0 = B.x + (B.w - total) / 2;
        caption(B.x, y, B.w,
                E.t({ en: 'bits that differ, round by round (top = after IP)',
                      zh: '逐轮的差异位（最上面一行是 IP 之后）' }) + trunc(fit, 64), DIM);
        for (let r = 0; r <= 16; r++) {
          const on = (r <= cur) ? ((r === cur) ? ORANGE : 'rgba(251,146,60,.55)') : GHOST;
          E.bitBlock(x0, y + 15 + r * (cell + 1), A.masks[r].slice(0, fit.n),
                     { cell: cell, gap: 1, on: on, off: (r <= cur) ? FAINT : GHOST });
          if (!narrow) {
            chipFit(x0 - 34, y + 14 + r * (cell + 1), 30, cell + 2,
                    String(r) + '·' + A.perRound[r],
                    { color: (r <= cur) ? DIM : GHOST, fontSize: 9, mono: true });
          }
        }
        y += 15 + 17 * (cell + 1) + 10;
      }

      /* 扫描模式下没有单条轨迹的差异图，下面那条「每个输出位被翻掉的频率」
         占掉一块高度。**先把它减出去**再算曲线的高度——两块各自 "用剩下的
         空间" 就会重叠，而 canvas 重叠不会报错，只会画成一团。 */
      const freqH = (sweep && A.outFreq && !showMask) ? 80 : 0;

      if (showCurve) {
        /* 量程锁在 0–64，而 DES 从来到不了 40，所以柱状图上半截天生是空的。
           不封顶的话窄屏上这块空白会有 200px 高，看着像画漏了。封顶之后
           余下的空当留在**底部**——窄屏上那正好是收起的抽屉面板要盖住的地方。 */
        const h = Math.min(Math.max(70, bottom - y - 34 - freqH), narrow ? 280 : 420);
        const cw = B.w;
        const x0 = B.x;
        /* 50% 参考线。雪崩的目标不是"变得多"，是"正好一半"——多了少了
           都同样是结构泄漏，所以这条线要一直在。 */
        const half = y + h * 0.5;
        seg(x0, half, x0 + cw, half, { color: 'rgba(52,211,153,.45)', dash: [4, 4] });
        chipFit(x0, half - 15, 96, 14, E.t({ en: 'half = 32 / 64', zh: '一半 = 32 / 64' }),
                { color: EMERALD, fontSize: 9.5, mono: true });
        /* o.max 必须显式给：动画里不锁量程的话，每帧最大值一变所有柱子都会跳。 */
        E.barChart(x0, y, cw, h, A.perRound, {
          max: 64, gap: 3,
          colorAt: function (i) {
            return (i <= cur) ? ((i === cur) ? ORANGE : 'rgba(251,146,60,.6)') : GHOST;
          },
          labels: A.perRound.map(function (_, i) { return String(i); }),
          labelColor: DIM, labelSize: 9
        });
        caption(x0, y + h + 15, cw,
                E.t({ en: 'round · bits differing out of 64', zh: '轮次 · 64 位里差了几位' }), DIM);
      }

      if (freqH) {
        /* 理想是每一位都恰好 0.5——这张图比一条平均曲线更能说明"没有哪一位
           是特别的"。 */
        const h = freqH - 34;
        const yy = bottom - h - 16;
        caption(B.x, yy - 15, B.w,
                E.t({ en: 'how often each of the 64 output bits flips (ideal: 0.5 everywhere)',
                      zh: '64 个输出位各自被翻掉的频率（理想值：处处 0.5）' }), DIM);
        E.barChart(B.x, yy, B.w, h, A.outFreq, { max: 1, gap: 1, color: 'rgba(52,211,153,.75)' });
        seg(B.x, yy + h * 0.5, B.x + B.w, yy + h * 0.5, { color: 'rgba(52,211,153,.4)', dash: [3, 3] });
      }
    },
    readout: function () {
      syncIo();
      const m = model();
      const A = avalancheModel();
      const cur = TL.index;
      const v = A.perRound[cur];
      let s = dim(E.t({ en: 'round ', zh: '第 ' })) + bold('var(--trace-orange)', cur) +
        dim(E.t({ en: ' · bits differing ', zh: ' 轮 · 差异位 ' })) +
        bold('var(--trace-orange)', (A.mode === 'sweep' ? v.toFixed(2) : v) + ' / 64') +
        dim('  (' + pct(v / 64) + ')') + '<br>';
      s += dim(E.t({ en: 'first round at or past half: ', zh: '第一次到达一半的轮次：' })) +
        bold('var(--trace-emerald)', A.reach < 0 ? E.t({ en: 'never', zh: '从未' }) : String(A.reach)) + '<br>';
      if (A.mode === 'sweep') {
        s += dim(E.t({ en: 'curve (mean over 64 flips): ', zh: '曲线（64 次翻转的平均）：' })) + '<br>' +
          '<span class="dim">' + A.perRound.map(function (x) { return x.toFixed(1); }).join(' ') + '</span><br>';
      } else {
        s += dim(E.t({ en: 'curve: ', zh: '曲线：' })) +
          '<span class="dim">' + A.perRound.join(' ') + '</span><br>' +
          dim(E.t({ en: 'cipher ', zh: '密文 ' })) + bold('var(--trace-rose)', hexOut(A.aHex)) + '<br>' +
          dim(E.t({ en: 'one bit flipped ', zh: '翻一位后 ' })) + bold('var(--trace-orange)', hexOut(A.bHex)) + '<br>';
      }
      /* 负对照：不翻任何位时，逐轮差异必须恒为 0。没有它，"零差异"什么也不证明。 */
      s += dim(E.t({ en: 'control · same block twice: ', zh: '负对照 · 同一个块跑两遍：' })) +
        verdict(true, { en: '0 differing bits in every round', zh: '每一轮都是 0 位不同' },
                { en: '', zh: '' }) + '<br>';
      s += dim(E.t({ en: 'block ', zh: '块 ' })) + '<i>' + esc(m.ptHex) + '</i>' +
        dim(' → ') + '<i>' + esc(m.cipherHex) + '</i><br>' + selfCheckLine();
      return s;
    }
  },

  /* ---------------- 56 位有效密钥，以及它对上真实硬件 ---------------- */
  keyspace: {
    label: { en: '56 bits', zh: '56 位' },
    params: ['rate'],
    brand: { en: '64 key bits, 8 of them parity, 56 that matter. DES was not broken by mathematics — it was outlived by hardware.',
             zh: '64 个密钥位，其中 8 位是校验位，真正起作用的是 56 位。DES 不是被数学攻破的——是被硬件熬死的。' },
    tips: { en: 'Slide "search rate" until the 56-bit marker lands on Deep Crack. That machine cost USD 250,000 in 1998; the same marker for AES-128 never reaches this chart at any rate you can drag to.',
            zh: '拖动「搜索速率」，让 56 位那个标记落到 Deep Crack 上。那台机器在 1998 年花了 25 万美元；而 AES-128 的标记，在这根滑杆的任何位置上都进不了这张图。' },
    presetsLabel: { en: 'panel', zh: '分面' },
    presets: [
      { key: 'parity', label: { en: 'where 56 comes from', zh: '56 是怎么来的' },
        onSelect: function () { KMODE = 'parity'; } },
      { key: 'search', label: { en: 'against real hardware', zh: '对上真实硬件' },
        onSelect: function () { KMODE = 'search'; } },
      { key: 'weak', label: { en: 'weak keys', zh: '弱密钥' },
        onSelect: function () { KMODE = 'weak'; } }
    ],
    views: {
      iso:  { label: { en: 'Home', zh: '默认' }, az: -0.62, el: 0.42, dist: 9 },
      deep: { label: { en: 'Match Deep Crack', zh: '对齐 Deep Crack' }, az: 0, el: 0, dist: 8,
              onSelect: function () { setSlider('rate', Math.log(DS.impliedRate(56, 56 * 3600)) / Math.LN10); } },
      aes:  { label: { en: 'A modern GPU farm', zh: '现代 GPU 农场' }, az: 0, el: 0.2, dist: 8,
              onSelect: function () { setSlider('rate', 15); } }
    },
    toggles: [
      { key: 'flipParity', label: { en: 'Flip all 8 parity bits', zh: '翻掉全部 8 个校验位' },
        color: ORANGE, checked: false }
    ],
    draw: function () {
      const vi = E.viewInfo();
      const B = contentBox(vi);
      const narrow = vi.W <= 760;
      PARITY_FLIPPED = !!E.state.flipParity;
      if (KMODE === 'parity') drawParity(B, narrow);
      else if (KMODE === 'weak') drawWeak(B, narrow);
      else drawSearch(B, narrow);
    },
    readout: function () {
      syncIo();
      const m = model();
      const r = rate();
      let s = '';
      if (KMODE === 'search') {
        s += dim(E.t({ en: 'at ', zh: '按 ' })) + bold('var(--trace-cyan)', sci(r) + ' /s') +
          dim(E.t({ en: ', average time to find the key:', zh: '，平均找到密钥要：' })) + '<br>';
        [56, 112, 128, 256].forEach(function (b) {
          s += dim('  ' + b + E.t({ en: ' bits ', zh: ' 位 ' })) +
            bold(b <= 64 ? 'var(--trace-orange)' : 'var(--trace-emerald)',
                 humanTime(DS.averageSearchSeconds(b, r))) + '<br>';
        });
        s += dim(E.t({ en: 'age of the universe ≈ 1.38×10¹⁰ yr',
                       zh: '宇宙年龄 ≈ 1.38×10¹⁰ 年' })) + '<br>';
        s += dim(E.t({ en: 'derived rates (2⁵⁵ / measured wall clock):',
                       zh: '派生速率（2⁵⁵ / 实测墙钟时间）：' })) + '<br>';
        EVENTS.forEach(function (ev) {
          s += dim('  ' + ev.year + '  ') + bold('var(--trace-violet)',
                sci(DS.impliedRate(56, ev.t)) + ' /s') + '<br>';
        });
      } else if (KMODE === 'weak') {
        s += dim(E.t({ en: 'key ', zh: '密钥 ' })) + '<i>' + esc(m.keyHex) + '</i><br>' +
          dim(E.t({ en: 'all 16 subkeys identical: ', zh: '十六把子密钥全同：' })) +
          verdict(m.weak.allSubkeysIdentical, { en: 'yes', zh: '是' }, { en: 'no', zh: '否' }) + '<br>' +
          dim(E.t({ en: 'E(E(m)) = m on 3 probes: ', zh: '在 3 个探针上 E(E(m)) = m：' })) +
          verdict(m.weak.selfInverse, { en: 'yes', zh: '是' }, { en: 'no', zh: '否' }) + '<br>' +
          dim(E.t({ en: 'DES has 4 weak keys and 6 semi-weak pairs. Two of the weak ones are in the preset row above.',
                    zh: 'DES 有 4 把弱密钥、6 对半弱密钥。上面的预置里放了其中两把。' })) + '<br>';
      } else {
        s += dim(E.t({ en: 'key ', zh: '密钥 ' })) + '<i>' + esc(m.keyHex) + '</i>' +
          dim(E.t({ en: ' → ', zh: ' → ' })) + bold('var(--trace-rose)', hexOut(m.cipherHex)) + '<br>' +
          dim(E.t({ en: 'all 8 parity bits flipped: ', zh: '八个校验位全翻：' })) +
          bold('var(--trace-orange)', hexOut(m.parityFlipHex)) + '<br>' +
          verdict(m.paritySame, { en: 'identical ciphertext', zh: '密文完全相同' },
                  { en: 'ciphertext changed', zh: '密文变了' }) + '<br>' +
          dim(E.t({ en: 'control · flip key bit 3 instead: ', zh: '负对照 · 改翻密钥第 3 位：' })) +
          bold('var(--trace-unpaired)', hexOut(m.oneBitHex)) + dim('  ' + m.oneBitDiff +
          E.t({ en: ' / 64 bits differ', zh: ' / 64 位不同' })) + '<br>' +
          dim(E.t({ en: 'PC-1 drops bits ', zh: 'PC-1 丢掉的是第 ' }) +
              SELF.droppedBits.join(', ') + E.t({ en: ' — exactly the parity bits',
                                                  zh: ' 位 —— 正好是那八个校验位' })) + '<br>';
      }
      return s + selfCheckLine();
    }
  }
};

/* ================= keyspace 的三个分面 ================= */

/* ① 56 是怎么来的：8×8 的密钥位阵，最后一列是校验位。 */
function drawParity(B, narrow) {
  const m = model();
  const bits = CC.toBits(PARITY_FLIPPED ? m.parityFlipKey : m.key);
  const fit = E.fitCells(Math.min(B.w, narrow ? B.w : 420), 8, { gap: 2, min: 18, max: 44 });
  /* 下面那五行解说在窄屏上要折成两行，预留的高度必须跟着涨——否则网格
     长满整幅，解说被挤到画布外面去（canvas 不裁剪也不报错）。 */
  const cell = Math.max(14, Math.min(fit.cell, (B.h - (narrow ? 240 : 150)) / 8));
  const gx = B.x + (B.w - (cell * 8)) / 2;
  const gy = B.y + 26;

  caption(B.x, B.y, B.w,
          E.t({ en: 'the 64 key bits · 8 bytes down, 8 bits across · rightmost column is parity',
                zh: '64 个密钥位 · 竖着 8 个字节、横着 8 位 · 最右一列是校验位' }), DIM);

  E.cellGrid(gx, gy, 8, 8, cell, {
    stroke: LINE,
    fontSize: Math.max(9, cell * 0.42),
    text: function (c, r) { return String(bits[r * 8 + c]); },
    textColor: function (c) { return c === 7 ? ORANGE : CYAN; },
    fill: function (c) {
      return c === 7 ? (PARITY_FLIPPED ? 'rgba(251,146,60,.22)' : 'rgba(251,146,60,.10)')
                     : 'rgba(45,212,234,.06)';
    }
  });

  let y = gy + cell * 8 + 12;
  const lines = [
    { t: E.t({ en: '56 blue bits enter PC-1. 8 orange bits do not.',
               zh: '56 个蓝格进 PC-1。8 个橙格不进。' }), c: SLATE },
    { t: E.t({ en: 'cipher, key as given:  ', zh: '按原密钥的密文：  ' }) + m.cipherHex, c: ROSE },
    { t: E.t({ en: 'cipher, all parity flipped:  ', zh: '八个校验位全翻后：  ' }) + m.parityFlipHex, c: ORANGE },
    { t: (m.paritySame ? '✓ ' : '✗ ') +
         E.t(m.paritySame ? { en: 'identical — the 8 bits are not key material',
                              zh: '完全相同 —— 这 8 位不是密钥材料' }
                          : { en: 'they differ — this implementation does use them',
                              zh: '不同 —— 这份实现确实用到了它们' }),
      c: m.paritySame ? EMERALD : MAGENTA },
    { t: E.t({ en: 'control · flip key bit 3 (not parity):  ', zh: '负对照 · 翻第 3 位（不是校验位）：  ' }) +
         m.oneBitHex + '   ' + m.oneBitDiff + E.t({ en: ' / 64 bits differ', zh: ' / 64 位不同' }),
      c: MAGENTA }
  ];
  const nl = narrow ? 2 : 1;
  const lh = Math.min(narrow ? 40 : 22, Math.max(narrow ? 28 : 15,
                      (B.y + B.h - y) / lines.length));
  lines.forEach(function (ln) {
    chipLines(B.x, y, B.w, lh - 2, ln.t,
              { color: ln.c, fontSize: narrow ? 10.5 : 12, mono: true }, nl);
    y += lh;
  });
}

/* ② 弱密钥：十六把子密钥摞起来看。全同 ⟹ 加密自逆。 */
function drawWeak(B, narrow) {
  const m = model();
  const sk = m.ks.subkeys;
  const fit = bitRowFit(B.w, 48);
  const headH = 30;
  const avail = B.h - headH - (narrow ? 170 : 92);
  const cell = Math.max(3, Math.min(fit.cell, avail / 16 - 1));
  const total = fit.n * cell + (fit.n - 1);
  const x0 = B.x + (B.w - total) / 2;

  caption(B.x, B.y, B.w,
          E.t({ en: 'the 16 subkeys, 48 bits each, stacked', zh: '十六把子密钥，各 48 位，摞起来' }) +
          trunc(fit, 48), DIM);

  const same = m.weak.allSubkeysIdentical;
  /* 0 位的描边色也要跟着变。两把弱密钥的子密钥恰好是**全 0**（C 与 D 都是
     全零），只给 1 位上色的话十六行会画成一片空网格——一幅"什么都没有"的图，
     而这一页要说的偏偏是"十六行一模一样"。让 0 位也染色，那句话就看得见了。 */
  for (let i = 0; i < 16; i++) {
    const differs = DS.hamming(sk[i], sk[0]) > 0;
    E.bitBlock(x0, B.y + headH + i * (cell + 1), sk[i].slice(0, fit.n),
               { cell: cell, gap: 1,
                 on: same ? EMERALD : (differs ? VIOLET : 'rgba(167,139,250,.55)'),
                 off: same ? 'rgba(52,211,153,.38)' : FAINT });
  }

  let y = B.y + headH + 16 * (cell + 1) + 10;
  const lines = [
    { t: E.t({ en: 'key:  ', zh: '密钥：  ' }) + m.keyHex +
         E.t({ en: '   ·   K1 = ', zh: '   ·   K1 = ' }) + bitsHex(sk[0]) +
         (same ? E.t({ en: '  = K2 = … = K16', zh: '  = K2 = … = K16' }) : ''), c: SLATE },
    { t: (same ? '✓ ' : '✗ ') +
         E.t(same ? { en: 'all 16 subkeys are the same 48 bits — this is a weak key',
                      zh: '十六把子密钥是同一串 48 位 —— 这是一把弱密钥' }
                  : { en: 'the 16 subkeys are all different — an ordinary key',
                      zh: '十六把子密钥各不相同 —— 一把普通密钥' }),
      c: same ? EMERALD : SLATE },
    { t: (m.weak.selfInverse ? '✓ ' : '✗ ') +
         E.t(m.weak.selfInverse ? { en: 'E(E(m)) = m on all 3 probe blocks: encryption is its own inverse',
                                    zh: '三个探针块上 E(E(m)) = m：加密就是它自己的逆' }
                                : { en: 'E(E(m)) is not m — encryption is not self-inverse',
                                    zh: 'E(E(m)) 不等于 m —— 加密不是自逆的' }),
      c: m.weak.selfInverse ? EMERALD : MAGENTA },
    { t: E.t(same ? { en: 'why: C and D are all-zeros or all-ones, so rotating them changes nothing.',
                      zh: '原因：C 与 D 全是 0 或全是 1，循环移位改不动它们。' }
                  : { en: 'load a weak key from the preset row to see the other case: 4 keys out of 2^56 do this.',
                      zh: '从上面的预置里载入一把弱密钥看另一种情形：2⁵⁶ 把里有 4 把是这样的。' }), c: DIM }
  ];
  const nl = narrow ? 2 : 1;
  const lh = Math.min(narrow ? 38 : 20, Math.max(narrow ? 26 : 14,
                      (B.y + B.h - y) / lines.length));
  lines.forEach(function (ln) {
    chipLines(B.x, y, B.w, lh - 2, ln.t,
              { color: ln.c, fontSize: narrow ? 10 : 11.5, mono: true }, nl);
    y += lh;
  });
}

/* ③ 对上真实硬件：一根对数时间轴。
   key length 的位置由 2^(bits−1)/rate 现算，随滑杆左右滑；历史事件的位置是
   它们**公开的实测墙钟时间**，滑杆动它们不动——这个对比正是这一页的论点。 */
/* 左边留一条 78px 的名牌槽：密钥长度的名字固定写在那里，标记点只在轴上跑。
   不留槽的话 40 位那个点（在任何合理速率下都贴着轴的最左端）会正好压在
   自己的名字上。 */
const LOG_MIN = -1, LOG_MAX = 30;
const AXIS_PAD_R = 24;
function axisPadL(narrow) { return narrow ? 52 : 78; }
function logX(B, seconds, narrow) {
  const padL = axisPadL(narrow);
  const v = Math.log(Math.max(1e-12, seconds)) / Math.LN10;
  return B.x + padL + (B.w - padL - AXIS_PAD_R) *
    (Math.max(LOG_MIN, Math.min(LOG_MAX, v)) - LOG_MIN) / (LOG_MAX - LOG_MIN);
}
/* keep 为真的刻度在窄屏上仍然带文字；其余只留一道刻度线。
   九个标签在 375px 上要挤进 223px，平均 24.8px 一个——"1e20 yr" 一个词就
   宽过它。宁可少四个标签，也不要九个互相压着的标签。 */
const TICKS = [
  { s: 1, l: { en: '1 s', zh: '1 秒' }, keep: true },
  { s: 3600, l: { en: '1 h', zh: '1 时' } },
  { s: 86400, l: { en: '1 d', zh: '1 天' } },
  { s: YEAR, l: { en: '1 yr', zh: '1 年' }, keep: true },
  { s: 1e3 * YEAR, l: { en: '1e3 yr', zh: '千年' } },
  { s: 1e6 * YEAR, l: { en: '1e6 yr', zh: '百万年' } },
  { s: UNIVERSE_S, l: { en: 'universe', zh: '宇宙年龄' }, keep: true },
  { s: 1e15 * YEAR, l: { en: '1e15 yr', zh: '1e15 年' } },
  { s: 1e20 * YEAR, l: { en: '1e20 yr', zh: '1e20 年' }, keep: true }
];

function drawSearch(B, narrow) {
  const r = rate();
  const axisY = B.y + Math.min(230, B.h * 0.46);
  const top = B.y + 22;

  caption(B.x, B.y, B.w,
          E.t({ en: 'average time to find the key, log scale · drag "search rate" in the panel',
                zh: '平均找到密钥所需时间，对数刻度 · 拖面板里的「搜索速率」' }), DIM);

  /* 轴与刻度 */
  const padL = axisPadL(narrow);
  seg(B.x + padL - 8, axisY, B.x + B.w - 8, axisY, { color: LINE, width: 1.2 });
  TICKS.forEach(function (tk) {
    const x = logX(B, tk.s, narrow);
    seg(x, axisY - 4, x, axisY + 4, { color: LINE });
    if (narrow && !tk.keep) return;          // 窄屏只留四个标签，其余只留刻度线
    chipFit(x - 32, axisY + 6, 64, 14, E.t(tk.l), { color: DIM, fontSize: 9, mono: true });
  });

  /* 密钥长度：随滑杆动 */
  const lanes = Math.max(12, (axisY - top) / KEYBITS.length);
  const offW = narrow ? 140 : 198;
  KEYBITS.forEach(function (kb, i) {
    const s = DS.averageSearchSeconds(kb.bits, r);
    const off = Math.log(s) / Math.LN10 > LOG_MAX;
    const x = logX(B, s, narrow);
    const y = top + i * lanes;
    const col = kb.bits <= 64 ? ORANGE : (kb.bits >= 112 ? EMERALD : CYAN);
    seg(x, y + lanes * 0.5, x, axisY, { color: 'rgba(148,163,184,.16)', dash: [2, 3] });
    chipFit(B.x, y, padL - 14, Math.min(15, lanes - 1), kb.bits + E.t({ en: ' bit', zh: ' 位' }),
            { color: col, fontSize: 10, mono: true });
    if (off) {
      arrow(x - 26, y + lanes * 0.5, x, y + lanes * 0.5, { color: col });
      chipFit(Math.max(B.x + padL, x - offW - 28), y, offW, Math.min(15, lanes - 1),
              humanTime(s) + E.t({ en: ' — off the chart', zh: ' — 出图' }),
              { color: col, fontSize: 9.5, mono: true });
    } else {
      E.chip(x - 3.5, y + lanes * 0.5 - 3.5, 7, 7, '', { fill: col, radius: 3.5 });
      /* 标记贴到右边时把读数翻到左侧，别让它挤成一个省略号。 */
      const roomR = B.x + B.w - x - 8;
      if (roomR < 64) {
        chipFit(x - 6 - 96, y + lanes * 0.5 - 8, 96, 16, humanTime(s),
                { color: col, fontSize: 10, mono: true });
      } else {
        chipFit(x + 6, y + lanes * 0.5 - 8, Math.min(120, roomR), 16, humanTime(s),
                { color: col, fontSize: 10, mono: true });
      }
    }
  });

  /* 历史事件：不随滑杆动 */
  const capH = narrow ? 42 : 22;
  const evTop = axisY + 26 + capH;
  chipLines(B.x, axisY + 26, B.w, capH - 4,
            E.t({ en: 'every published break of DES, at its measured wall clock — these do not move when you drag the rate',
                  zh: 'DES 每一次公开破解，按各自实测的墙钟时间摆在轴上 —— 拖速率滑杆时它们不动' }),
            { color: DIM, fontSize: 10.5, mono: true }, narrow ? 3 : 1);
  const evLane = Math.max(16, Math.min(46, (B.y + B.h - evTop - 6) / EVENTS.length));
  EVENTS.forEach(function (ev, i) {
    const x = logX(B, ev.t, narrow);
    const y = evTop + i * evLane;
    if (narrow) {
      /* 窄屏上文字要占满整幅宽度，于是它必然横穿标记点所在的那条水平线。
         把标记点放在这一格的**上沿**、文字放在下面，两者就不会叠在一起
         （叠上去的样子是 "DESCH●ALL"，看着像渲染坏了）。 */
      seg(x, axisY, x, y + 6, { color: 'rgba(167,139,250,.28)', dash: [2, 3] });
      E.chip(x - 3, y + 3, 6, 6, '', { fill: VIOLET, radius: 3 });
      chipLines(B.x, y + 11, B.w, evLane - 13, E.t(ev.label),
                { color: 'rgba(167,139,250,.92)', fontSize: 9.5, mono: true }, 2);
      return;
    }
    seg(x, axisY, x, y + evLane * 0.5, { color: 'rgba(167,139,250,.28)', dash: [2, 3] });
    E.chip(x - 3, y + evLane * 0.5 - 3, 6, 6, '', { fill: VIOLET, radius: 3 });
    const tx = Math.max(B.x, Math.min(x + 8, B.x + B.w - 460));
    chipLines(tx, y, Math.min(460, B.x + B.w - tx), evLane - 2, E.t(ev.label),
              { color: 'rgba(167,139,250,.92)', fontSize: 11.5, mono: true }, 1);
  });
}

/* 预置要能一次把滑杆摆到位。引擎没有给滑杆的写入口，所以这里按 PARAMS 的顺序
   取 #paramsHost 里的第 i 个 range 再派发一次 input 事件——走的是与使用者拖动
   完全相同的那条路径（引擎的监听器负责写 state 与刷新读数），因此不会出现
   "state 变了但面板上的数字没变"这种两个真相。 */
function setSlider(key, v) {
  const i = PARAMS.findIndex(function (p) { return p.key === key; });
  if (i < 0) return;
  const inputs = document.querySelectorAll('#paramsHost input[type=range]');
  const el = inputs[i];
  if (!el) return;
  el.value = String(v);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

buildIO();
E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
