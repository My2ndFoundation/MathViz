const SPEC_BY_KEY = {};
SPECIMENS.forEach(function (s) { SPEC_BY_KEY[s.key] = s; });

let CUR_KEY = 'caesar';
let PASTED = '';
function curSpec() { return SPEC_BY_KEY[CUR_KEY] || SPECIMENS[0]; }
function rawCipher() {
  return CUR_KEY === 'pasted' ? CC.normalize(PASTED) : curSpec().cipher;
}
/* crop 是这一页最重要的一根滑杆：把同一段密文截短，看着结论在 200 个字母
   那条线上消失。它把 evidence 页的统计结论变成一件用手就能做出来的事。 */
function cropPct() {
  const v = E.state.crop;
  return v == null ? 100 : Math.max(5, Math.min(100, Math.round(v)));
}
function curCipher() {
  const full = rawCipher();
  const pct = cropPct();
  if (pct >= 100) return full;
  return full.slice(0, Math.max(0, Math.round(full.length * pct / 100)));
}

/* ================= 分类结果缓存 =================
   按 标本 + 截断比例 缓存。不是为了省 CPU（classify 只扫两遍文本），
   是为了让画面与读数在同一帧里读到**同一份**结果——两处各算一遍，
   迟早出现半帧错位。 */
const AN = { sig: null };
function analysis() {
  const ct = curCipher();
  const sig = CUR_KEY + '|' + cropPct() + '|' + ct.length + '|' + ct.slice(0, 24);
  if (AN.sig === sig) return AN;
  AN.sig = sig;
  AN.cipher = ct;
  AN.r = CA.classify(ct);
  AN.weapon = ARSENAL[AN.r.family] || ARSENAL.unknown;
  AN.solved = null;              // 换标本就作废：上一次的明文属于上一段密文
  /* 多表那一支下面还有一个岔路口：有没有周期。它决定树上点亮的是
     "维吉尼亚族"还是"Hill / 转轮 / 一次一密"，所以这里顺手算出来——
     它同时也是"动手用武器"那颗按钮要用的那个 p，两处必须是同一个数。
     取的是阈值以上**最小**的那个高点；这条启发式的命中率见 autoSolve 的注释。 */
  AN.period = null;
  if (AN.r.confident && AN.r.family === 'polyalphabetic') {
    const ic = CA.icByPeriod(ct, 20);
    for (let i = 0; i < ic.length; i++) {
      if (ic[i].period >= 2 && ic[i].ic >= 0.06) { AN.period = ic[i].period; break; }
    }
  }
  return AN;
}

/* ================= 动手用武器 =================
   只有两处真的能自动跑完，而且**两处都会失败**，失败时如实说。 */
function autoSolve(ct, family) {
  const n = CC.letters(ct).length;
  if (!n) return { ok: false, why: 'empty' };
  if (family === 'monoalphabetic') {
    const c = CA.bruteForceBest(CAESAR.bruteForce(ct));
    if (c && c.score / n < CA.CHI2_PER_LETTER) {
      return { ok: true, how: 'caesar', keyText: 'k = ' + c.k, plain: c.text, per: c.score / n };
    }
    const list = AFFINE.bruteForce(ct).map(function (x) {
      return { k: x.a + ' , ' + x.b, text: x.text };
    });
    const a = CA.bruteForceBest(list);
    if (a && a.score / n < CA.CHI2_PER_LETTER) {
      return { ok: true, how: 'affine', keyText: '(a, b) = (' + a.k + ')', plain: a.text, per: a.score / n };
    }
    return { ok: false, why: 'not-caesar-or-affine',
             per: Math.min(c ? c.score / n : Infinity, a ? a.score / n : Infinity) };
  }
  if (family === 'polyalphabetic') {
    /* 周期取"阈值以上**最小**的那个高点"。这条启发式的命中率是本仓实测的，
       不是抄来的：语料 854 字母、密钥长度 3–9 字母互异、每个长度 200 次，
       周期猜对 n=100 → 64%、n=200 → 94%、n=300 → 97%、n≥500 → 100%；
       连带把整段明文还原对的比例更低：31% / 61% / 89% / 100%。
       所以这颗按钮在短密文上会给出一段胡话，而它**应该**给出胡话。 */
    const ic = CA.icByPeriod(ct, 20);
    let p = null;
    for (let i = 0; i < ic.length; i++) {
      if (ic[i].period >= 2 && ic[i].ic >= 0.06) { p = ic[i].period; break; }
    }
    if (p === null) return { ok: false, why: 'no-period' };
    const cols = CA.columnsForPeriod(ct, p);
    let key = '';
    for (let j = 0; j < cols.length; j++) {
      let bs = Infinity, bk = 0;
      for (let k = 0; k < CC.N; k++) {
        const s = CA.chiSquare(CAESAR.decrypt(cols[j], k));
        if (s < bs) { bs = s; bk = k; }
      }
      key += CC.ALPHABET.charAt(bk);
    }
    const plain = VIG.decrypt(ct, key);
    return { ok: true, how: 'vigenere', keyText: 'p = ' + p + ' , key = ' + key,
             plain: plain, per: CA.chiSquare(plain) / n };
  }
  return { ok: false, why: 'no-auto' };
}

/* 判定 → 树上的哪一支。'unknown' 有两种成因（太短 / 不是 26 字母表），
   由 reasons 的第一条区分——把这件事写成查表而不是散在画图代码里。 */
function branchOf(r) {
  if (r.family === 'unknown') {
    const k = r.reasons.length ? r.reasons[0].key : '';
    return k === 'alphabet-too-small' ? 'symbols' : 'short';
  }
  if (r.family === 'polygraphic-playfair') return 'playfair';
  if (r.family === 'polyalphabetic') return 'many';
  return 'single';
}

/* ================= 判错率扫描 =================
   **载入时算一次**，之后每帧只读。640 次加密 + 640 次 IoC 放进 draw() 里
   就是每秒六万次——页面会当场变成幻灯片。种子写死在 cryptanalysis.js 里，
   所以每次载入画的是同一张图，也正是 cryptanalysis.test.js 钉住的那张。 */
const SWEEP = CA.icSweep({ source: EX.classical.sweepSource,
                           substitution: SUBST, vigenere: VIG });
const SWEEP_IC_LO = 0.020, SWEEP_IC_HI = 0.105;

/* ================= 时间轴 =================
   三个页签走的步数不同（四条判别量 / 八个长度 / 一棵树的行），所以每个页签
   一条时间轴。CUR 由页签按钮**直接**写，不能只靠 draw() 顶上那一行：
   "点页签、立刻按 ⏭"之间可能一帧都没渲染过，那时 CUR 还是上一个页签，
   ⏭ 会走到别人的时间轴上（crypto-hill 实测撞到过）。 */
const TLS = {};
let CUR = 'identify';
function timelineFor(tab, steps, stepDuration) {
  steps = Math.max(1, Math.round(steps));
  const cur = TLS[tab];
  if (cur && cur.steps === steps) return cur.tl;
  const tl = CryptoAnim.createTimeline({ steps: steps, stepDuration: stepDuration,
                                         loop: true, rate: 1 });
  tl.play();
  if (cur) tl.seek(Math.min(cur.tl.index, steps - 1));
  TLS[tab] = { tl: tl, steps: steps };
  return tl;
}
/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]）。tick() 刻意没有
   内部步长上限，后台标签页回来那一下的时间跳变会让它真的补上几千步。 */
function tick(tl) {
  tl.setRate(E.state.speed || 1);
  if (E.state.running) tl.tick(E.state.dt);
}
function activeTL() { const e = TLS[CUR]; return e ? e.tl : null; }
function bindTabTracking() {
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { CUR = b.dataset.tab; });
  });
}
document.getElementById('btnBack').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(-1); });
document.getElementById('btnStep').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tick() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click',
  function () { const t = activeTL(); if (t) t.seek(0); });

/* ================= 参数 ================= */
var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'crop',
    label: { en: 'sample <i>n</i>', zh: '样本 <i>n</i>' },
    min: 5, max: 100, step: 5, value: 100,
    fmt: function (v) { return Math.round(v) + '%'; } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 版面 =================
   先把上下两条带子留出来，再拿剩下的地方定尺寸。反过来做会让说明性的
   那几行成为第一个被挤出画布的东西。窄屏（≤760px）上传输条被 CSS 挪到了
   页签下方、面板变成贴底的抽屉，所以上带更高、下带更矮。 */
function layout() {
  const vi = E.viewInfo();
  const narrow = vi.W <= 760;
  const x = narrow ? 12 : 20;
  const rightPad = narrow ? 12 : 332;
  const w = Math.max(230, vi.W - rightPad - x);
  /* 窄屏上边距 162 与本页样式块里那段修正配套：传输条被挪到了 top:116，
     它自己 34px 高，所以内容最早只能从 162 开始。 */
  const top = narrow ? 162 : 124;
  const bot = vi.H - (narrow ? 72 : 86);
  return { vi: vi, narrow: narrow, x: x, y: top, w: w,
           h: Math.max(180, bot - top) };
}

/* ================= 画布小工具 ================= */
function seg(ax, ay, bx, by, o) {
  E.flowArrow(ax, ay, bx, by,
    { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}
function dot(x, y, r, c) { E.chip(x - r, y - r, r * 2, r * 2, '', { fill: c, radius: r }); }
function ring(x, y, r, c, w) { E.chip(x - r, y - r, r * 2, r * 2, '', { stroke: c, width: w || 1.4, radius: r }); }
function box(x, y, w, h, o) {
  E.chip(x, y, w, h, '', { fill: o.fill, stroke: o.stroke, width: o.width, radius: o.radius == null ? 6 : o.radius });
}

/* Canvas 既不裁剪也不报警：一段比盒子宽的文字直接从两侧漫出去，而漫出去的
   字看上去仍然像内容的一部分。本仓为这个形状栽过五次（都在窄屏上）。
   这里对**文字**做与 fitCells 对格子同样的事：先按可用宽度反推能放下的字号，
   到下限还放不下就截断，并且截断一定带省略号——截断必须说出来。

   ⚠ 宽度估算必须按**字**算，不能按 length 算。汉字是全角，一个字占约 1 em，
   拉丁字母大约 0.55 em。用一个统一系数会让中文界面的估算差出将近一倍——
   本仓的 Quagmire 页就是这么让中文文案漫出 84.5px 的，而英文界面上一切正常。
   实测：这一页的中文"武器"那一行在修好之前正好从判定框两侧各漫出去一截。 */
const CHAR_W = 0.55;
function charUnits(ch) {
  const c = ch.charCodeAt(0);
  /* CJK、假名、全角标点、中文引号书名号：一个字一个 em。 */
  if (c >= 0x2E80 && c <= 0xFFEF) return 1.0;
  if (c === 0x2014 || c === 0x2015) return 1.0;      // 破折号
  return CHAR_W;
}
function textUnits(s) {
  let u = 0;
  for (let i = 0; i < s.length; i++) u += charUnits(s.charAt(i));
  return u;
}
function tchip(x, y, w, h, s, o) {
  o = o || {};
  const txt = String(s == null ? '' : s);
  const want = o.fontSize || 12;
  const minPx = o.minFontSize || 8.5;
  const units = textUnits(txt);
  let px = want;
  if (units * want > w) px = Math.max(minPx, w / Math.max(0.001, units));
  let shown = txt, cut = false;
  if (units * px > w) {
    const cap = w / px - 1;                          // 给省略号留一个全角位
    let acc = 0, upto = 0;
    for (let i = 0; i < txt.length; i++) {
      const u = charUnits(txt.charAt(i));
      if (acc + u > cap) break;
      acc += u; upto = i + 1;
    }
    shown = txt.slice(0, Math.max(1, upto)) + '…';
    cut = true;
  }
  E.chip(x, y, w, h, shown, {
    fill: o.fill, stroke: o.stroke, width: o.width, radius: o.radius,
    color: o.color, mono: o.mono, weight: o.weight, fontSize: px
  });
  return cut;
}

/* ================= 页签一：identify ================= */
/* 一条判别量 = 一条量表：参考带在底下，指针在上面。参考带用的是它指向的那片
   叶子的颜色——所以"指针落在哪条带里"与"结论是什么颜色"在画面上是同一件事。 */
function gauge(x, y, w, h, o) {
  const trackH = 9;
  const titleH = 17;
  const ty = y + titleH + 3;
  const labY = ty + trackH + 4;
  const span = o.max - o.min;
  const at = function (v) {
    return x + Math.max(0, Math.min(1, (v - o.min) / span)) * w;
  };
  /* 刻度文字占多少地方要看给了多高。三段门槛，各自对应一件放弃的东西——
     放弃什么由 identify 的表头一句话说出来，绝不悄悄少画。
       h ≥ 74  三条刻度文字，奇偶行错开（375px 上三条同一行必然重叠）
       h ≥ 60  只留阈值那一条（它是唯一影响结论的刻度）
       h ≥ 48  还留得下底下那句"落在哪条带里" */
  const roomStagger = h >= 74, roomTicks = h >= 60, roomBand = h >= 48;

  /* ⏮ / ⏭ 沿着四条判别量走一遍：被走到的那一条框起来。只换文字颜色不够——
     四条量表长得一样，读者需要知道"现在说的是哪一条"。 */
  if (o.hot) box(x - 7, y - 3, w + 14, h - 2, { fill: 'rgba(226,232,240,.045)', stroke: alpha(BRIGHT, 0.22), radius: 8 });

  tchip(x, y, w * 0.66, titleH, E.t(o.title), { mono: true, color: o.color, fontSize: 12 });
  tchip(x + w * 0.66, y, w * 0.34, titleH, o.value, { color: BRIGHT, fontSize: 12.5, weight: 600 });

  if (E.state.showBands !== false) {
    (o.bands || []).forEach(function (b) {
      const bx = at(b.from), bw = Math.max(1, at(b.to) - at(b.from));
      E.chip(bx, ty, bw, trackH, '', { fill: alpha(b.color, 0.30), radius: 2 });
    });
  }
  E.chip(x, ty, w, trackH, '', { stroke: LINE, radius: 2 });

  const lw = Math.min(122, w * 0.40);
  (o.ticks || []).forEach(function (t, i) {
    const tx = at(t.at);
    /* 刻度**线**永远画：它不占横向空间，而它标的正是判据的分界。 */
    seg(tx, ty - 2, tx, ty + trackH + 2, { color: t.color || DIM, width: 1, dash: [3, 3] });
    if (!roomTicks) return;
    if (!roomStagger && !t.key) return;
    const row = roomStagger ? (i % 2) : 0;
    tchip(E.clamp(tx - lw / 2, x, x + w - lw), labY + row * 12, lw, 12, E.t(t.label),
      { mono: true, color: t.color || DIM, fontSize: 9.5 });
  });

  const mx = at(o.at);
  seg(mx, ty - 7, mx, ty + trackH + 7, { color: o.color, width: 2 });
  dot(mx, ty + trackH / 2, 4.2, o.color);
  if (roomBand && o.bandLabel) {
    /* 贴着刻度文字走，不贴盒子底：量表高的时候底部锚定会把这句话推到
       下一条量表的标题旁边，看上去像在给下一条做注解。 */
    const bandY = Math.min(y + h - 13, labY + (roomTicks ? (roomStagger ? 25 : 13) : 0) + 2);
    tchip(x, bandY, w, 13, E.t(o.bandLabel), { mono: true, color: o.color, fontSize: 10 });
  }
}

const identify = {
  label: { en: 'Identify', zh: '认出来' },
  brand: { en: 'You do not know which cipher this is. Four numbers computed from the ciphertext alone will name the family — and below 200 letters they will not.',
           zh: '你不知道这是什么密码。四个只从密文本身算出来的数字能说出它的家族 —— 而在 200 个字母以下，它们说不出。' },
  tips: { en: 'Drag the sample slider down. Somewhere near 200 letters the verdict disappears — the ciphertext did not change, the evidence did. The evidence tab measures exactly where that happens.',
          zh: '把样本滑杆往下拖。到 200 个字母附近结论会消失 —— 密文没变，变的是证据。evidence 页签量的就是它消失在哪里。' },
  params: ['crop', 'speed'],
  presets: null,                 // 载入时填成共享的 SPECIMEN_PRESETS
  presetsLabel: { en: 'Specimen', zh: '标本' },
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showBands', label: { en: 'Reference bands', zh: '参考带' }, color: CYAN, checked: true },
    { key: 'reveal',    label: { en: 'Reveal the answer', zh: '揭晓答案' }, color: ORANGE, checked: false }
  ],
  draw: function () {
    const TL = timelineFor('identify', 5, 1.1);
    tick(TL);
    const B = layout();
    const A = analysis();
    const m = A.r.measurements;
    const n = A.r.n;
    const fam = FAMILY[A.r.family] || FAMILY.unknown;
    const hot = TL.index;            // 0..3 = 四条判别量，4 = 判定

    /* 空标本（自己粘的那一条还没粘东西）不画量表：四条判别量在 n = 0 上
       全是 Infinity 或 0，画出来是四条指针钉在左端的假图。 */
    if (n === 0) {
      box(B.x, B.y, B.w, 74, { fill: CARD, stroke: LINE, radius: 10 });
      tchip(B.x + 10, B.y + 14, B.w - 20, 20,
        E.t({ en: 'Nothing to measure yet.', zh: '还没有东西可量。' }),
        { mono: true, color: SLATE, fontSize: 13 });
      tchip(B.x + 10, B.y + 38, B.w - 20, 22,
        E.t({ en: 'Paste a ciphertext in the panel, or pick a specimen.',
              zh: '在右侧面板里粘一段密文，或者挑一个标本。' }),
        { mono: true, color: DIM, fontSize: 11 });
      return;
    }

    const headerH = 24, structH = 42, verdictH = 88, gap = 9;
    const rest = B.h - headerH - structH - verdictH - gap * 5;
    const gh = E.clamp(rest / 3, 42, 80);
    const used = headerH + structH + verdictH + gap * 5 + gh * 3;
    let y = B.y + Math.max(0, (B.h - used) / 2);

    /* ---- 标本头 ----
       量表在矮窗口里会省掉一部分刻度文字（见 gauge()），省了就要说。 */
    const pct = cropPct();
    tchip(B.x, y, B.w, headerH,
      E.t(curSpec().label).toUpperCase() + '   ·   ' + n +
      E.t({ en: ' letters', zh: ' 个字母' }) +
      (pct < 100 ? '   ·   ' + pct + '%' : '') +
      (gh < 74 ? E.t({ en: '   ·   short window: reference labels trimmed',
                       zh: '   ·   窗口偏矮：参考刻度文字已省' }) : ''),
      { mono: true, color: gh < 74 ? ORANGE : SLATE, fontSize: 12.5,
        fill: CARD, stroke: LINE, radius: 8 });
    y += headerH + gap;

    /* ---- ① 重合指数 ---- */
    gauge(B.x, y, B.w, gh, {
      title: { en: '① IoC — one alphabet or many', zh: '① 重合指数 —— 一张表还是很多张' },
      value: m.ic.toFixed(4),
      min: 0.030, max: 0.085, at: m.ic,
      hot: hot === 0,
      color: m.ic >= CA.IC_SINGLE ? SLATE : VIOLET,
      bands: [{ from: 0.030, to: CA.IC_SINGLE, color: VIOLET },
              { from: CA.IC_SINGLE, to: 0.085, color: SLATE }],
      /* 0.0385 那条**必须**标成理论值：实测的多表密文在教学长度上落在
         0.042–0.048（本仓 656 字母：p=7 0.0439、p=6 0.0453、p=3 0.0481），
         肉眼可见地高于 1/26。把它画成"随机基线"而不注明是理论值，
         会让人以为量出来的东西没落在该落的地方。 */
      ticks: [{ at: 1 / 26, label: { en: '.0385 uniform (theory)', zh: '.0385 均匀（理论值）' } },
              { at: CA.IC_SINGLE, key: 'threshold', label: { en: '.055 threshold', zh: '.055 阈值' }, color: ORANGE },
              { at: 0.0667, label: { en: '.0667 English', zh: '.0667 英文' } }],
      bandLabel: m.ic >= CA.IC_SINGLE
        ? { en: 'one alphabet', zh: '一张表' }
        : { en: 'many alphabets', zh: '很多张表' }
    });
    y += gh + gap;

    /* ---- ② χ² ---- */
    const cpl = Math.min(m.chi2PerLetter, 10);
    gauge(B.x, y, B.w, gh, {
      title: { en: '② χ² per letter — vs English', zh: '② 每字母 χ² —— 与英文比' },
      value: m.chi2.toFixed(0) + '  ·  ' + m.chi2PerLetter.toFixed(3) + '/n',
      min: 0, max: 10, at: cpl,
      hot: hot === 1,
      color: m.chi2PerLetter < CA.CHI2_PER_LETTER ? EMERALD : ROSE,
      bands: [{ from: 0, to: CA.CHI2_PER_LETTER, color: EMERALD },
              { from: CA.CHI2_PER_LETTER, to: 10, color: ROSE }],
      ticks: [{ at: CA.CHI2_PER_LETTER, key: 'threshold', label: { en: '1.0 threshold', zh: '1.0 阈值' }, color: ORANGE }],
      bandLabel: m.chi2PerLetter < CA.CHI2_PER_LETTER
        ? { en: 'the letters are still English', zh: '字母还是英文的' }
        : { en: 'the letters were renamed', zh: '字母被改了名' }
    });
    y += gh + gap;

    /* ---- ③ 重复二元组 ---- */
    const dMax = Math.max(4, m.expectedDoubles * 2, m.doubles * 1.25);
    gauge(B.x, y, B.w, gh, {
      title: { en: '③ doubled digraphs', zh: '③ 重复二元组' },
      value: m.doubles + '  /  ' + m.expectedDoubles.toFixed(1),
      min: 0, max: dMax, at: m.doubles,
      hot: hot === 2,
      color: m.doubles === 0 ? CYAN : SLATE,
      bands: [{ from: 0, to: dMax * 0.02, color: CYAN }],
      /* 期望值的公式写在刻度上，而不是标题里：它是这条判据里唯一容易被
         算错的地方（pairs/26 会系统性偏低），值得占一行字。 */
      ticks: [{ at: m.expectedDoubles, key: 'threshold',
                label: { en: 'expected = pairs × IoC', zh: '期望 = 对数 × IoC' }, color: ORANGE }],
      bandLabel: m.expectedDoubles < CA.DOUBLES_MIN_EXPECTED
        ? { en: 'expected count too small — this test says nothing here', zh: '期望太小 —— 这条判据在这里什么也说明不了' }
        : (m.doubles === 0
            ? { en: 'zero — impossible for anything but a Playfair-type square', zh: '零 —— 除了 Playfair 那类方阵，没有密码做得到' }
            : { en: 'Playfair is out — it can never emit one', zh: 'Playfair 出局 —— 它一个都不会产出' })
    });
    y += gh + gap;

    /* ---- ④ 结构 ---- */
    const alphaN = 26 - m.absent.length;
    const cells = E.fitCells(B.w, 3, { gap: 8, min: 64, max: 260 });
    const facts = [
      [E.t({ en: 'length', zh: '长度' }) + ' ' + n + ' · ' +
       (m.evenLength ? E.t({ en: 'even', zh: '偶数' }) : E.t({ en: 'odd', zh: '奇数' })),
       m.evenLength ? CYAN : SLATE],
      [E.t({ en: 'alphabet', zh: '字母表' }) + ' ' + alphaN + '/26',
       alphaN <= 25 ? CYAN : SLATE],
      [E.t({ en: 'absent', zh: '缺席' }) + ' ' + (m.absent.join('') || '—'),
       m.absent.indexOf('J') >= 0 ? CYAN : SLATE]
    ];
    if (hot === 3) box(B.x - 7, y - 3, B.w + 14, structH - 2, { fill: 'rgba(226,232,240,.045)', stroke: alpha(BRIGHT, 0.22), radius: 8 });
    tchip(B.x, y, B.w, 16,
      E.t({ en: '④ structure — parity · alphabet size · absent letters',
            zh: '④ 结构 —— 奇偶 · 字母表大小 · 缺席字母' }),
      { mono: true, color: hot === 3 ? BRIGHT : ORANGE, fontSize: 12 });
    for (let i = 0; i < cells.n; i++) {
      tchip(B.x + i * (cells.cell + 8), y + 19, cells.cell, 21, facts[i][0],
        { mono: true, color: facts[i][1], fontSize: 11, fill: CARD, stroke: LINE, radius: 6 });
    }
    if (cells.truncated) {
      tchip(B.x, y + 19, B.w, 21, E.t({ en: '(structure facts in the readout)', zh: '（结构三项见右侧读数）' }),
        { mono: true, color: DIM, fontSize: 10 });
    }
    y += structH + gap;

    /* ---- 判定 ---- */
    const vcol = fam.color;
    box(B.x, y, B.w, verdictH, { fill: alpha(vcol, A.r.confident ? 0.10 : 0.06),
                                stroke: alpha(vcol, hot === 4 ? 0.95 : 0.55),
                                width: hot === 4 ? 1.8 : 1, radius: 10 });
    tchip(B.x + 8, y + 6, B.w - 16, 15,
      A.r.confident ? E.t({ en: 'VERDICT', zh: '判定' })
                    : E.t({ en: 'NO VERDICT · n < ' + CA.MIN_SAMPLE, zh: '不给结论 · n < ' + CA.MIN_SAMPLE }),
      { mono: true, color: DIM, fontSize: 10 });
    tchip(B.x + 8, y + 21, B.w - 16, 26, E.t(fam.name),
      { color: vcol, fontSize: 20, weight: 600 });
    tchip(B.x + 8, y + 48, B.w - 16, 15,
      E.t({ en: 'weapon', zh: '武器' }) + ' · ' + E.t(A.weapon.short),
      { mono: true, color: SLATE, fontSize: 10.5 });
    tchip(B.x + 8, y + 64, B.w - 16, 17,
      A.weapon.tool
        ? (E.t({ en: 'taught in ', zh: '这件武器住在 ' }) + A.weapon.tool)
        : E.t({ en: 'no tool holds this — the answer is "get more ciphertext"', zh: '没有哪一页装得下它 —— 答案是"去要更多密文"' }),
      { mono: true, color: A.weapon.tool ? EMERALD : ORANGE, fontSize: 11 });
  },
  readout: function () { syncIoLabels(); return readoutIdentify(); }
};

/* ================= 页签二：evidence ================= */
const evidence = {
  label: { en: 'Evidence', zh: '证据' },
  brand: { en: 'The same threshold, 0.055, at eight sample sizes. Forty monoalphabetic and forty polyalphabetic specimens each. Seeded, so this picture is the same on every load.',
           zh: '同一条阈值 0.055，八个样本长度。每档各 40 段单表密文与 40 段多表密文。种子固定，所以每次打开都是同一张图。' },
  tips: { en: 'At n = 40 the two clouds overlap and the verdict is a coin flip wearing a decimal point. By n = 300 they are separated by a clear gap — and the threshold never moved. The evidence did.',
          zh: 'n = 40 时两团点重叠，所谓判定不过是一枚硬币戴了个小数点。到 n = 300 两团之间已经有一条干净的空隙 —— 而阈值从头到尾没动过。动的是证据。' },
  params: ['speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showMono',  label: { en: 'One alphabet', zh: '单表' },   color: CYAN,    checked: true },
    { key: 'showPoly',  label: { en: 'Many alphabets', zh: '多表' }, color: VIOLET,  checked: true },
    { key: 'showRange', label: { en: 'Ranges', zh: '极差' },         color: EMERALD, checked: true }
  ],
  draw: function () {
    const TL = timelineFor('evidence', SWEEP.rows.length, 1.3);
    tick(TL);
    const B = layout();
    const hot = TL.index % SWEEP.rows.length;

    const axH = 30, capH = 34;
    const plotY = B.y + capH, plotH = Math.max(120, B.h - capH - axH);
    const cells = E.fitCells(B.w, SWEEP.rows.length, { gap: 7, min: 26, max: 150 });
    /* 放不下就开一个跟着高亮列走的窗口，并把窗口写在画面上——
       被画布边缘吃掉的列看上去和"没有这一列"一模一样。 */
    let start = 0;
    if (cells.truncated) start = E.clamp(hot - Math.floor(cells.n / 2), 0, SWEEP.rows.length - cells.n);
    const yOf = function (ic) {
      return plotY + plotH * (1 - (ic - SWEEP_IC_LO) / (SWEEP_IC_HI - SWEEP_IC_LO));
    };

    tchip(B.x, B.y, B.w, 16,
      E.t({ en: 'index of coincidence of each specimen · threshold 0.055 · 40 per side',
            zh: '每段密文的重合指数 · 阈值 0.055 · 每侧 40 段' }),
      { mono: true, color: SLATE, fontSize: 11 });
    tchip(B.x, B.y + 17, B.w, 15,
      cells.truncated
        ? E.t({ en: 'columns ', zh: '第 ' }) + (start + 1) + '–' + (start + cells.n) +
          ' / ' + SWEEP.rows.length + E.t({ en: ' — narrow view', zh: ' 列（窄屏窗口）' })
        : E.t({ en: 'seed ' + SWEEP.seed + ' · keys of ' + SWEEP.keyMin + '–' + SWEEP.keyMax + ' distinct letters · corpus ' + SWEEP.sourceLength + ' letters',
                zh: '种子 ' + SWEEP.seed + ' · 密钥 ' + SWEEP.keyMin + '–' + SWEEP.keyMax + ' 个互异字母 · 语料 ' + SWEEP.sourceLength + ' 字母' }),
      { mono: true, color: cells.truncated ? ORANGE : DIM, fontSize: 10 });

    /* 参考横线：阈值、英文、均匀随机（理论） */
    [[CA.IC_SINGLE, ORANGE, { en: '0.055', zh: '0.055' }, [5, 4]],
     [0.0667, SLATE, { en: 'English 0.0667', zh: '英文 0.0667' }, [2, 5]],
     [1 / 26, SLATE, { en: 'uniform 0.0385 (theory)', zh: '均匀 0.0385（理论）' }, [2, 5]]].forEach(function (g) {
      const gy = yOf(g[0]);
      seg(B.x, gy, B.x + B.w, gy, { color: g[1], width: g[0] === CA.IC_SINGLE ? 1.6 : 1, dash: g[3] });
      tchip(B.x + B.w - 118, gy - 13, 118, 12, E.t(g[2]), { mono: true, color: g[1], fontSize: 9.5 });
    });

    for (let i = 0; i < cells.n; i++) {
      const r = SWEEP.rows[start + i];
      const cx = B.x + i * (cells.cell + 7);
      const on = (start + i) === hot;
      if (on) box(cx - 2, plotY - 6, cells.cell + 4, plotH + 12, { fill: 'rgba(226,232,240,.05)', stroke: alpha(BRIGHT, 0.25), radius: 6 });

      const half = cells.cell / 2;
      const drawSide = function (list, color, x0, show) {
        if (!show) return;
        if (E.state.showRange !== false) {
          const lo = Math.min.apply(null, list), hi = Math.max.apply(null, list);
          seg(x0 + half / 2, yOf(hi), x0 + half / 2, yOf(lo),
              { color: alpha(color, 0.30), width: Math.min(half * 0.7, 20) });
        }
        for (let k = 0; k < list.length; k++) {
          const px = x0 + 2 + ((k % 8) + 0.5) * (half - 4) / 8;
          dot(px, yOf(list[k]), on ? 1.9 : 1.5, alpha(color, on ? 0.95 : 0.65));
        }
      };
      drawSide(r.monoIc, CYAN, cx, E.state.showMono !== false);
      drawSide(r.polyIc, VIOLET, cx + half, E.state.showPoly !== false);

      tchip(cx, plotY + plotH + 4, cells.cell, 14, String(r.n),
        { color: on ? BRIGHT : SLATE, fontSize: 11.5 });
      tchip(cx, plotY + plotH + 18, cells.cell, 12,
        r.monoErr + '/' + r.polyErr,
        { mono: true, color: (r.monoErr + r.polyErr) ? ORANGE : EMERALD, fontSize: 9.5 });
    }
  },
  readout: function () { return readoutEvidence(); }
};

/* ================= 页签三：tree（顿悟视角） ================= */
const tree = {
  label: { en: 'Tree', zh: '判别树' },
  brand: { en: 'Every edge is something you can measure on the ciphertext. Every leaf is a cipher from chapters 1 and 2, with the weapon that opens it and the page that teaches it.',
           zh: '每一条边都是一个能在密文上量出来的东西。每一片叶子都是第一、二章的一个密码，带着打开它的武器和讲那件武器的那一页。' },
  tips: { en: 'The branch your specimen fell into is lit. Cryptanalysis is not a bag of tricks — it is one tree, and all fifteen earlier tools are leaves on it.',
          zh: '当前标本落进的那一支是亮着的。密码分析不是一袋子技巧 —— 它是一棵树，前面十五个工具全都是它的叶子。' },
  params: ['crop', 'speed'],
  presets: null,                 // 与 identify 共享同一个数组对象
  presetsLabel: { en: 'Specimen', zh: '标本' },
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showTools', label: { en: 'Tool names', zh: '工具名' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    const TL = timelineFor('tree', TREE.length, 0.9);
    tick(TL);
    const B = layout();
    const A = analysis();
    const live = branchOf(A.r);
    const hot = TL.index % TREE.length;

    const capH = 18;
    const fit = E.fitCells(B.h - capH, TREE.length, { gap: 2, min: 15, max: 27 });
    let start = 0;
    if (fit.truncated) start = E.clamp(hot - Math.floor(fit.n / 2), 0, TREE.length - fit.n);

    const showTool = E.state.showTools !== false && B.w >= 430;
    const toolW = showTool ? Math.min(160, B.w * 0.32) : 0;
    const rowH = fit.cell;
    const fs = E.clamp(rowH * 0.52, 9, 13);

    tchip(B.x, B.y, B.w, capH,
      fit.truncated
        ? E.t({ en: 'rows ', zh: '第 ' }) + (start + 1) + '–' + (start + fit.n) + ' / ' + TREE.length +
          E.t({ en: ' — ⏭ scrolls', zh: ' 行 —— ⏭ 滚动' }) +
          (showTool ? '' : E.t({ en: ' · tool names hidden at this width', zh: ' · 此宽度下工具名已隐藏' }))
        : (showTool ? E.t({ en: 'one tree · fifteen leaves · fifteen tools', zh: '一棵树 · 十五片叶子 · 十五个工具' })
                    : E.t({ en: 'tool names hidden at this width — see the readout', zh: '此宽度下工具名已隐藏 —— 见右侧读数' })),
      { mono: true, color: fit.truncated || !showTool ? ORANGE : DIM, fontSize: 10 });

    const indent = Math.min(20, Math.max(10, B.w * 0.035));
    for (let i = 0; i < fit.n; i++) {
      const node = TREE[start + i];
      const y = B.y + capH + i * (rowH + 2);
      const ix = B.x + node.d * indent;
      const lw = Math.max(60, B.w - node.d * indent - toolW - (toolW ? 6 : 0));
      const onBranch = node.branch === null || node.branch === live;
      const col = node.branch === null ? BRIGHT : (BRANCH_COLOR[node.branch] || SLATE);
      /* 多表那一支下面还分"有周期 / 没周期"。不分开的话，一段维吉尼亚会把
         Hill、恩尼格玛、一次一密一起点亮，而那正是这一页最不该含糊的地方。 */
      const subOK = !node.sub || ((node.sub === 'period') === (A.period !== null));
      const isLeafHit = node.kind === 'leaf' && node.leafFamily === A.r.family && onBranch && subOK;
      const a = onBranch ? 1 : 0.34;

      /* 缩进的折线：竖线 + 一小段横线。没有它，缩进只是空白，读不出父子。 */
      if (node.d > 0) {
        seg(ix - indent * 0.55, y - 2, ix - indent * 0.55, y + rowH / 2,
            { color: alpha(SLATE, 0.30 * a + 0.05), width: 1 });
        seg(ix - indent * 0.55, y + rowH / 2, ix - 3, y + rowH / 2,
            { color: alpha(SLATE, 0.30 * a + 0.05), width: 1 });
      }
      const isCursor = (start + i) === hot;
      const fill = node.kind === 'leaf'
        ? alpha(col, onBranch ? 0.14 : 0.05)
        : (node.kind === 'root' ? alpha(BRIGHT, 0.10) : null);
      const stroke = isCursor ? alpha(BRIGHT, 0.55)
        : (isLeafHit ? alpha(col, 0.9) : (node.kind === 'leaf' ? alpha(col, onBranch ? 0.42 : 0.14) : null));
      tchip(ix, y, lw, rowH, (node.kind === 'test' ? '· ' : '') + E.t(node.label), {
        mono: node.kind !== 'root',
        color: node.kind === 'test' ? alpha(SLATE, a) : alpha(col, a),
        fontSize: node.kind === 'root' ? fs + 1 : fs,
        fill: fill, stroke: stroke, radius: 5, width: isLeafHit ? 1.6 : 1
      });
      if (showTool && node.tool) {
        tchip(B.x + B.w - toolW, y, toolW, rowH, node.tool.replace('crypto-', ''),
          { mono: true, color: alpha(EMERALD, a), fontSize: Math.min(fs, 11) });
      }
    }
  },
  readout: function () { return readoutTree(); }
};

/* ================= 标本按钮（引擎的 presets，两个页签共享同一个数组） ================= */
const SPECIMEN_PRESETS = SPECIMENS.map(function (s) {
  return {
    key: s.key, label: s.label,
    onSelect: function () { CUR_KEY = s.key; AN.sig = null; }
  };
});
identify.presets = SPECIMEN_PRESETS;
tree.presets = SPECIMEN_PRESETS;

var SCENES = { identify: identify, evidence: evidence, tree: tree };

/* ================= 输入槽 ================= */
let ioText = null, ioLabel = null, ioNote = null, btnUse = null, btnWeapon = null;

function buildIO() {
  const host = document.getElementById('ioHost');
  if (!host) return;
  host.innerHTML =
    '<div class="iolabel" id="ioLabel"></div>' +
    '<textarea class="iofield" id="ioText" spellcheck="false" autocomplete="off"></textarea>' +
    '<div class="iorow"><button class="btn" id="btnUse"></button>' +
    '<button class="btn" id="btnWeapon"></button></div>' +
    '<div class="iolabel" id="ioNote"></div>';
  ioText = document.getElementById('ioText');
  ioLabel = document.getElementById('ioLabel');
  ioNote = document.getElementById('ioNote');
  btnUse = document.getElementById('btnUse');
  btnWeapon = document.getElementById('btnWeapon');

  ioText.addEventListener('input', function () {
    PASTED = ioText.value;
    if (CUR_KEY === 'pasted') AN.sig = null;
  });
  btnUse.addEventListener('click', function () {
    PASTED = ioText.value;
    CUR_KEY = 'pasted';
    AN.sig = null;
    E.syncPresetHighlight('identify', 'pasted');
  });
  /* 动手用武器。只有分类结果说"这里确实存在一条自动路径"时才真的跑；
     其余情况按钮照样能按，但它给出的是"武器是什么、在哪一页"，不是假破解。 */
  btnWeapon.addEventListener('click', function () {
    const A = analysis();
    A.solved = A.r.confident ? autoSolve(A.cipher, A.r.family) : { ok: false, why: 'too-short' };
  });
}

function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }
/* #ioHost 里的文案是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里。引擎在
   applyLang() 末尾会调 updateReadout()，所以把这次同步挂在 readout() 里搭车——
   不管语言是怎么变的，readout 都会跟着重算一次。 */
function syncIoLabels() {
  setText(ioLabel, E.t({ en: 'Paste a ciphertext of your own', zh: '粘一段你自己的密文' }));
  setText(btnUse, E.t({ en: 'Analyse it', zh: '分析这一段' }));
  setText(btnWeapon, E.t({ en: 'Apply the weapon', zh: '动手用武器' }));
  const A = analysis();
  setText(ioNote, A.r.confident
    ? (ARSENAL[A.r.family].auto
        ? E.t({ en: 'An automatic attack exists for this family.', zh: '这一族确实有一条自动攻击路径。' })
        : E.t({ en: 'No honest auto-solve for this family — the button will say where the weapon lives.',
                zh: '这一族没有诚实的自动破解 —— 按钮只会告诉你武器住在哪一页。' }))
    : E.t({ en: 'Below 200 letters there is nothing to apply.', zh: '200 个字母以下，没有什么可动手的。' }));
}

/* ================= 读数 ================= */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function b(color, s) { return '<b style="--c:var(--trace-' + color + ')">' + s + '</b>'; }
function dim(s) { return '<span class="dim">' + s + '</span>'; }
/* HTML 会把连续空格折叠成一个，所以对齐只能用 &nbsp;。 */
function padN(s, n) {
  s = String(s);
  let out = '';
  for (let i = s.length; i < n; i++) out += '&nbsp;';
  return out + s;
}
function fmtPer(v) { return (v == null || !isFinite(v)) ? '∞' : v.toFixed(2); }

function readoutIdentify() {
  const A = analysis();
  const m = A.r.measurements;
  const fam = FAMILY[A.r.family] || FAMILY.unknown;
  const famCss = { '#2dd4ea': 'cyan', '#fb7185': 'rose', '#a78bfa': 'violet',
                   '#34d399': 'emerald', '#fb923c': 'orange' }[fam.color] || 'cyan';
  let s = '';
  s += dim(E.t({ en: 'specimen ', zh: '标本 ' })) + esc(E.t(curSpec().label)) +
       ' · <i>n</i> = ' + b('cyan', A.r.n) + '<br>';
  s += dim('IoC ') + b('violet', m.ic.toFixed(4)) + ' &nbsp; ' +
       dim('χ²/n ') + b('rose', m.chi2PerLetter.toFixed(3)) + '<br>' +
       dim(E.t({ en: 'doubles ', zh: '重复对 ' })) + b('cyan', m.doubles) +
       dim(' / ' + m.expectedDoubles.toFixed(1)) + ' &nbsp; ' +
       dim(E.t({ en: 'alphabet ', zh: '字母表 ' })) + b('orange', (26 - m.absent.length) + '/26') +
       dim(' · ' + (m.evenLength ? E.t({ en: 'even', zh: '偶数' }) : E.t({ en: 'odd', zh: '奇数' }))) +
       (m.absent.length ? dim(' · ' + E.t({ en: 'absent ', zh: '缺 ' }) + m.absent.join('')) : '') +
       '<br>';
  s += '<br>' + dim(E.t({ en: 'VERDICT', zh: '判定' })) + '<br>' +
       b(famCss, esc(E.t(fam.name))) +
       (A.r.confident ? '' : dim(' · ' + E.t({ en: 'not confident', zh: '不可信' }))) + '<br>';
  A.r.reasons.forEach(function (r, i) {
    s += dim((i + 1) + '. ') + esc(E.t(r)) + '<br>';
  });
  s += '<br>' + dim(E.t({ en: 'WEAPON', zh: '武器' })) + '<br>' + esc(E.t(A.weapon.weapon)) + '<br>';
  if (A.weapon.tool) s += dim(E.t({ en: 'taught in ', zh: '住在 ' })) + b('emerald', esc(A.weapon.tool)) + '<br>';

  if (A.solved) {
    s += '<br>' + dim(E.t({ en: 'THE WEAPON, APPLIED', zh: '武器，动手之后' })) + '<br>';
    if (A.solved.ok) {
      s += b('emerald', esc(A.solved.keyText)) + dim(' · χ²/n ' + A.solved.per.toFixed(3)) + '<br>' +
           esc(A.solved.plain.slice(0, 160)) + (A.solved.plain.length > 160 ? '…' : '') + '<br>';
    } else {
      const why = {
        'too-short': { en: 'Nothing to apply: below 200 letters this page refuses to name a family, so it has no weapon to reach for.',
                       zh: '没什么可动手的：200 个字母以下这一页不给家族，也就没有武器可拿。' },
        'no-auto': { en: 'No auto-solve here, and this page will not fake one. Open the tool named above.',
                     zh: '这里没有自动破解，而这一页不假装有。去上面那一页。' },
        'not-caesar-or-affine': { en: 'Tried all 26 Caesar keys and all 312 affine keys; the best is still χ²/n = ' +
                                      fmtPer(A.solved.per) +
                                      ', nowhere near English. So it is a general substitution — 26! keys, hill-climbing, crypto-substitution.',
                                  zh: '26 个凯撒密钥与 312 个仿射密钥都试过了，最好的一个 χ²/n 还有 ' +
                                      fmtPer(A.solved.per) +
                                      '，离英文远得很。所以它是一般的单表代换 —— 26! 个密钥，爬山，去 crypto-substitution。' },
        'no-period': { en: 'IoC by period never rose above 0.06, so the period heuristic declines to guess. Measured here: it gets the period right 94% of the time at n = 200 and 100% at n ≥ 500 — but it needs a peak to point at.',
                       zh: '逐周期重合指数没有任何一点超过 0.06，周期启发式因此拒绝猜。本仓实测：n = 200 时它 94% 猜对周期、n ≥ 500 时 100% —— 但它得有个峰可指。' },
        'empty': { en: 'Empty specimen.', zh: '标本是空的。' }
      }[A.solved.why] || { en: 'No result.', zh: '没有结果。' };
      s += esc(E.t(why)) + '<br>';
    }
  }
  s += '<br>' + dim(E.t({ en: 'ANSWER ', zh: '答案 ' }));
  s += E.state.reveal ? b('orange', esc(E.t(curSpec().answer)))
                      : dim(E.t({ en: '(hidden — tick "Reveal the answer")', zh: '（藏着 —— 勾"揭晓答案"）' }));
  return s;
}

function readoutEvidence() {
  let s = dim(E.t({ en: 'threshold ', zh: '阈值 ' })) + b('orange', SWEEP.threshold) + ' · ' +
          dim(E.t({ en: 'seed ', zh: '种子 ' })) + SWEEP.seed + '<br>' +
          dim(E.t({ en: 'misclassified, per 40 specimens', zh: '每 40 段里判错几段' })) + '<br>';
  const tl = TLS.evidence;
  const hot = tl ? tl.tl.index % SWEEP.rows.length : -1;
  s += dim('&nbsp;&nbsp;<i>n</i>&nbsp;&nbsp;&nbsp;' +
           E.t({ en: 'one→many', zh: '单判成多' }) + '&nbsp;&nbsp;' +
           E.t({ en: 'many→one', zh: '多判成单' })) + '<br>';
  SWEEP.rows.forEach(function (r, i) {
    const mark = i === hot ? '▸' : '&nbsp;';
    s += mark + padN(r.n, 4) + '&nbsp;&nbsp;&nbsp;&nbsp;' +
      (r.monoErr ? b('cyan', padN(r.monoErr, 2) + '/40') : dim(padN(0, 2) + '/40')) +
      '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' +
      (r.polyErr ? b('violet', padN(r.polyErr, 2) + '/40') : dim(padN(0, 2) + '/40')) + '<br>';
  });
  s += '<br>' + dim(E.t({
    en: 'The two clouds overlap up to n = 100 and are cleanly apart from n = 150. That gap, not the error count, is why MIN_SAMPLE is 200.',
    zh: '两团点在 n ≤ 100 时重叠，从 n = 150 起完全分开。让 MIN_SAMPLE 定在 200 的是那条空隙，不是判错的条数。' }));
  s += '<br><br>' + dim(E.t({
    en: 'Honest small print: the specimens are cyclic slices of one 854-letter passage, so the long ones overlap each other — the n = 500 row is a weaker measurement than the n = 40 row, not a stronger one. Vigenère keys are drawn with distinct letters on purpose: a key like XBX is length 3 but only two alphabets, and it reads as single-alphabet at every length. With unrestricted keys, 7 of 600 polyalphabetic specimens at n ≥ 200 still read as single-alphabet here, and all 7 had a repeated letter in the key.',
    zh: '几句必须说的小字：样本是同一段 854 字母文本的循环切片，长样本彼此重叠——n = 500 那一行是更弱的证据，不是更强的。维吉尼亚密钥刻意取字母互异的：像 XBX 这种长度 3 却只有两张表的密钥，在任何长度上都会被判成单表。不限制密钥时，本仓量到 n ≥ 200 的 600 段里仍有 7 段被判成单表，而那 7 段的密钥全部有重复字母。' }));
  return s;
}

function readoutTree() {
  const A = analysis();
  const live = branchOf(A.r);
  const tl = TLS.tree;
  const node = TREE[(tl ? tl.tl.index : 0) % TREE.length];
  let s = dim(E.t({ en: 'specimen ', zh: '标本 ' })) + esc(E.t(curSpec().label)) +
          ' · <i>n</i> = ' + A.r.n + '<br>' +
          dim(E.t({ en: 'lit branch ', zh: '点亮的一支 ' })) +
          b('cyan', esc(E.t((FAMILY[A.r.family] || FAMILY.unknown).name))) + '<br><br>';
  if (A.r.family === 'polyalphabetic' && A.r.confident) {
    s += dim(E.t({ en: 'next fork · period test ', zh: '下一个岔路口 · 周期检验 ' })) +
      (A.period === null
        ? b('orange', E.t({ en: 'no peak — Hill / rotor / OTP side', zh: '没有峰 —— 走 Hill / 转轮 / 一次一密那一侧' }))
        : b('violet', 'p = ' + A.period)) + '<br>' +
      dim(E.t({ en: 'measured here: the smallest IoC peak above 0.06 names the true period 94% of the time at n = 200, 97% at 300, 100% at n ≥ 500 (200 trials each).',
                zh: '本仓实测：取 0.06 以上最小的那个高点，n = 200 时 94% 猜中真周期、300 时 97%、n ≥ 500 时 100%（每档 200 次）。' })) + '<br>';
  }
  s += '<br>' + dim(E.t({ en: 'CURSOR (⏮ ⏭)', zh: '游标（⏮ ⏭）' })) + '<br>' + esc(E.t(node.label)) + '<br>';
  if (node.weapon) s += dim(E.t({ en: 'weapon · ', zh: '武器 · ' })) + esc(E.t(node.weapon)) + '<br>';
  if (node.tool) s += dim(E.t({ en: 'tool · ', zh: '工具 · ' })) + b('emerald', esc(node.tool)) + '<br>';
  s += '<br>' + dim(E.t({
    en: 'Every test on an edge is measurable on the ciphertext alone. Note what is NOT on the tree: nothing here tries a key.',
    zh: '每条边上的检验都只用密文就能量出来。也请注意树上没有的东西：这里没有任何一步在试密钥。' }));
  s += '<br><br>' + dim(E.t({
    en: 'One honest gap: IoC alone cannot separate Playfair from a short-period Vigenère — measured on the 656-letter specimen, Playfair 0.0504 and Vigenère p=3 0.0481. Only the doubled-digraph test tells them apart, and it is structural rather than statistical.',
    zh: '一条必须承认的缝：单靠 IoC 分不开 Playfair 与短周期维吉尼亚 —— 在 656 字母的标本上实测 Playfair 0.0504、维吉尼亚 p=3 0.0481。把它们分开的只有重复二元组那条判据，而那一条是结构性的，不是统计性的。' }));
  return s;
}

/* ================= 启动 =================
   #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一项并调用它的 onSelect，而那条回调会让分析缓存作废。 */
buildIO();
E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
bindTabTracking();
/* 引擎的 buildPresets() 会把每个页签的 presets 都选到第一项（'plain'）。
   这一页想从"凯撒"开门——第一屏就该是一段真正的密文，而不是一段没加密的
   英文；'plain' 那一条是留给"注意，单字母统计分不开明文与换位"这个反例的。 */
CUR_KEY = 'caesar';
AN.sig = null;
E.syncPresetHighlight('identify', 'caesar');
</script>
