<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 密码分析工作台。第一、二章的每一个工具都是"已经知道这是什么密码"之后的事；
     这一页在它们**之前**：手里只有一段密文，连它属于哪一族都不知道。
     （文件里除了两处真正的脚本标签，任何地方——包括注释——都不要再写出
     `&lt;script&gt;` 这个字符串：语法门与 CI 都靠 `<` + `script` + `>` 这个
     字面量切分脚本块，注释里多出来的一个会让切分从这里开始，把整段 HTML
     当成 JS 去检查，报一个跟真实代码毫无关系的错。）

     tool-engine 反映的是 core/ 那几个模块的版本，不是工具自己的版本，
     一般不必跟着改。版本号要在三处同步：注册表 cryptography-tools.json 的
     version、这里的 tool-version meta、面板右上角的徽章——徽章直接读 meta
     （见第二个脚本块里的 VERSION），所以它永远不需要单独改。 -->
<meta name="tool-version" content="1.0.0">
<meta name="tool-engine" content="crypto-1.2.0">
<title>Cryptanalysis Workbench · 密码分析工作台</title>
<!-- 版本记录（changelog，新→旧）：
     1.0.0  2026-08-10  首发：从密文本身认出密码家族。identify（四条判别量的
                        量表 + 判定与它走过的每一步）、evidence（阈值 0.055 在
                        八个长度上的判错率扫描，种子化、可复现）、tree（顿悟视角：
                        整棵判别树，每条边是一个可测的量，每片叶子是第一、二章的
                        一个工具）。 -->
<style>
/* 视觉令牌。CryptoViz 与根项目、chess 子项目共用同一套值——它们是同一门
   视觉语言的三个方言，不是三套配色。Canvas 里用到同一个颜色时写**同样的
   字面量**（见第二个脚本块顶部的 CYAN / ROSE / …），这样"一条线一种颜色、
   在多处复用"这条原则在 CSS 与 Canvas 两侧是同一个事实，而不是两份要靠人
   记住去同步的抄写。 */
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  /* 未配对 / 异常态专用色。只在"这一项没有对手、没有解、不该存在"时用，
     不参与 accent 轮换——它刺眼是故意的。 */
  --trace-unpaired:#ff2fd0;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}

/* canvas 是主角：全屏置底，其余一切 UI 以 position:fixed 浮在它之上。
   任何"左边画布右边面板"的分栏都是违规的——画面一旦被切开，字母轮就不再
   是这一页的主体，而变成了一张配图。 */
#c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 传输条（动画时钟的控件）----
   ⏮ 上一步 · ⏵/⏸ 播放暂停 · ⏭ 下一步 · ⟲ 回到第 0 步。
   密码学工具几乎都是"一轮一轮"的（每次按键、每一轮、每个 block），所以时间
   控件是这一类工具的标配而不是可选件，放在浮层里而不是折进面板：使用者在看
   canvas，手要落在看得见的地方。#btnPlay 与 #btnReset 的文案由引擎写
   （UI.pause / UI.resume / UI.reset，随语言切换），这里的字形只是无 JS 时的
   兜底；⏮ / ⏭ 是本页自己接的，见第二个脚本块。 */
.transport{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:5px;padding:5px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tbtn{min-width:34px;padding:6px 12px;border-radius:999px;border:1px solid transparent;
  background:transparent;color:#c6d2e4;font-size:13px;font-family:var(--font-cn);
  line-height:1.2;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.tbtn:hover{color:#e8f2fb;border-color:rgba(45,212,234,.45)}
.tbtn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tbtn.primary{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.5);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:14px;line-height:1;cursor:pointer}
.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:6px 14px 14px}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
/* 数学符号一律 serif italic（设计规范五条原则第 4 条），Canvas 侧对应
   VizEngine.mathFont()。字母轮上的字母、模运算里的数字都算数学符号。 */
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views,.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel,.presets .plabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn,.pbtn{padding:5px 9px;font-size:11.5px}

/* 文本输入槽（#ioHost）。古典密码工具的明文/密钥来自输入框而不是滑杆——
   一个 26 档的滑杆表达不了 "ATTACK AT DAWN"。不需要的工具把 #ioHost 留空。 */
.iorow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px}
.iorow .btn{padding:5px 9px;font-size:11.5px}
.iolabel{font-size:11.5px;color:rgba(159,176,200,.8);margin:10px 0 4px}
.iofield{width:100%;min-height:52px;resize:vertical;padding:7px 9px;border-radius:9px;
  border:1px solid var(--panel-line);background:rgba(8,13,24,.7);color:var(--ui-bright);
  font-family:var(--font-mono);font-size:12px;line-height:1.6}
.iofield:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:1px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
/* 读数里的粗体值用行内 style="--c:var(--trace-xxx)" 指定颜色，与 .tg .dot
   用的是同一个自定义属性——同一条量在图例点与读数值上必须是同一种颜色。 */
.readout b{font-weight:600;color:var(--c, inherit)}
.readout i{font-family:var(--font-math);font-style:italic}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  /* 页签必须让开标题。窄屏上 .brand 从 top:12px 起，eyebrow（10px 字 + 6px
     下边距）之后是 20px 的 h1，整块底边落在约 60px——而这里原来写的是 52px，
     于是标题与页签重叠 8px。它是**继承性**的：这段 CSS 在骨架里，13 个工具
     各存一份逐字节相同的副本，所以一处写错就是十四处一起错，而且只在 ≤760px
     出现，桌面上永远看不见（本项目为此在窄屏上连栽五次）。
     66px 给 60px 的底边留 6px 余量；传输条跟着同幅下移。 */
  .tabs{top:66px;left:14px;transform:none}
  /* 传输条挪到页签下方：手机上面板是贴底的抽屉，底部中央那个位置会被它盖住。 */
  .transport{top:110px;left:14px;bottom:auto;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}

  /* ---- 本页专属的窄屏修正 ----
     骨架那两行（.tabs{top:66px} / .transport{top:110px}）是按**单行标题**算出来的：
     10px 的 eyebrow + 6px 边距 + 20px 的 h1，底边落在 60px 上下。
     这一页的英文标题 "Cryptanalysis Workbench" 有 23 个字符，20px 时超过
     .brand 的 max-width:70vw（375px 屏上是 262px），于是折成两行、把页签顶掉
     26px —— 实测 375×812 上"Workbench"那一行正压在页签上。

     两手一起做，而不是只缩字号：缩到 16px 让它在 375px 上回到一行（约 213px），
     同时把页签与传输条各下移一档，这样即便在更窄的屏上（≤320px）它又折成两行，
     顶上去的也只是空白而不是控件。本页 layout() 的 narrow 上边距跟着改成 162。 */
  .brand h1{font-size:16px;line-height:1.25}
  .tabs{top:72px}
  .transport{top:116px}
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="brand">
  <div class="eyebrow">CRYPTOVIZ · 密码学可视化</div>
  <h1></h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span id="panelTitle">Parameters &amp; Views</span>
    <span class="ph-right">
      <span class="ver" id="verBadge"></span>
      <button class="lang" id="btnLang" title="切换语言 / Switch language">中</button>
      <button class="fold" id="btnFold" title="收起 / 展开 · Collapse / expand">−</button>
    </span>
  </div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div id="ioHost"></div>
    <div id="togglesHost"></div>
    <div id="presetsHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="tips" id="tips"></div>
  </div>
</aside>

<div class="transport" id="transport">
  <button class="tbtn" id="btnBack" title="上一步 · Step back" aria-label="Step back">⏮</button>
  <button class="tbtn primary" id="btnPlay" title="播放 / 暂停 · Play / pause">⏵</button>
  <button class="tbtn" id="btnStep" title="下一步 · Step forward" aria-label="Step forward">⏭</button>
  <button class="tbtn" id="btnReset" title="回到起点 · Reset">⟲</button>
</div>

<div class="hint"></div>

<script>
/* ================= 生成区间 =================
   本块的全部内容由 cryptography/scripts/inline_core.py 从 core/ 与 examples/
   注入，**禁止手改**：手改的那一行会在下一次跑脚本时被无声地覆盖掉，而
   check.py 的第一道门会先一步把它判红。要改行为就去改编辑源，然后跑

       python3 cryptography/scripts/inline_core.py

   顺序是依赖顺序，不是字母顺序：CRYPTO-CORE 最先（其余都用它的 mod / letters），
   CRYPTANALYSIS 与 ALGOS 次之，EXAMPLES 再次（examples.js 要读分组文件挂上去
   的 CryptoExamplesParts），VIZ-ENGINE / INTERACT / ANIMATION 最后。
   一个工具用不到的块可以整块删掉（除 CRYPTO-CORE 与 VIZ-ENGINE 外都是可选的，
   见 inline_core.py 的 OPTIONAL_TAGS）——留着空标记也行，脚本会照填。 */
/* >>> GENERATED:CRYPTO-CORE */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.CryptoCore = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const N = 26;

  function isAlpha(ch) {
    if (typeof ch !== 'string' || ch.length !== 1) return false;
    const c = ch.charCodeAt(0);
    return (c >= 65 && c <= 90) || (c >= 97 && c <= 122);
  }

  /* 只留 A-Z 并大写。刻意**不**做 Unicode 折叠（é → E）：这是古典密码，
     字母表就是 26 个，把 é 悄悄折进 E 会让"密文长度 = 明文字母数"这条
     使用者肉眼在数的关系对不上。丢弃比折叠诚实。 */
  function normalize(text) {
    return String(text).toUpperCase().replace(/[^A-Z]/g, '');
  }

  function letters(text) {
    const s = normalize(text);
    const out = [];
    for (let i = 0; i < s.length; i++) out.push(s.charCodeAt(i) - 65);
    return out;
  }

  function fromIndices(idx) {
    let s = '';
    for (let i = 0; i < idx.length; i++) s += ALPHABET.charAt(mod(idx[i], N));
    return s;
  }

  /* JS 的 % 是取余不是取模：(-1) % 26 === -1。整个古典密码部分都建立在
     "落回 [0,n)" 上，所以这一个函数是地基，不许有人图省事直接写 %。 */
  function mod(a, n) {
    /* 模数必须为正，不只是非零。n < 0 时 ((a%n)+n)%n 会给出**负**结果
       （实测 mod(5,-3) === -1），而这个函数对外承诺的是"结果恒 >= 0"，
       整个古典密码部分都建立在那句承诺上。与其让一个负模数悄悄产出负下标、
       在 fromIndices 里变成 charAt(-1) 那种空字符串，不如在入口就拒绝：
       今天没有调用方传负模数，正因为如此，现在把门关上是免费的。 */
    if (!(n > 0)) throw new Error('mod 的模数必须是正数，收到 ' + n);
    /* 只在需要时加 n。旧写法是 ((a % n) + n) % n——它**无条件**加一次 n，
       于是当 a % n 已经非负时，中间值可以逼近 2n。n > 2⁵² 时 2n 越过
       2⁵³−1，浮点在那里开始按 2 取整，结果静静地差 1：
           mod(4400303820297978, 4785675681196153) 旧值 …979，正确 …978
       随机普查（逐点与 BigInt 比对）：n ∈ [2⁵², 1.3·2⁵²] 错 1902/30000，
       n 逼近 2⁵³ 时错 4482/30000；n ≤ 2⁵¹ 一个都不错——所以这个 bug 在
       第 1–3 章（全部在模 26 上）完全看不见，是 RSA 那一页把它逼出来的。

       改成条件加之后没有任何取值上界：a % n 落在 (−n, n)，负时加一次 n 得
       (0, n)，两个分支的中间值都不超过 n 本身。只要 a 与 n 是安全整数，
       结果就是精确的。

       r 可能是 −0（a 是 n 的负整数倍时，JS 的 % 保留被除数的符号）。
       −0 === 0 为真，下标与显示都不受影响，但 Object.is(−0, 0) 为假，而旧
       写法给的是 +0。末尾加 0 把它归一化回 +0——这次修的是溢出，不该顺手
       改掉一个没人要求改的语义。 */
    const r = a % n;
    return r < 0 ? r + n : r + 0;
  }

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { const t = a % b; a = b; b = t; }
    return a;
  }

  /* 扩展欧几里得：返回 [g, x, y] 满足 a*x + b*y === g === gcd(a,b)。
     modInverse 靠它，Affine 的解密也靠它。 */
  function egcd(a, b) {
    let old_r = a, r = b;
    let old_s = 1, s = 0;
    let old_t = 0, t = 1;
    while (r !== 0) {
      const q = Math.floor(old_r / r);
      let tmp = old_r - q * r; old_r = r; r = tmp;
      tmp = old_s - q * s; old_s = s; s = tmp;
      tmp = old_t - q * t; old_t = t; t = tmp;
    }
    /* gcd 约定非负；a<0 或 b<0 时上面会得到负的 old_r，连同系数一起翻号，
       贝祖等式仍成立。 */
    if (old_r < 0) return [-old_r, -old_s, -old_t];
    return [old_r, old_s, old_t];
  }

  function modInverse(a, n) {
    const r = egcd(mod(a, n), n);
    if (r[0] !== 1) return null;      // 不互素，逆元不存在
    return mod(r[1], n);
  }

  /* ================= ℤ/nℤ 上的矩阵（Hill 密码） =================
     Hill 把每 k 个字母看成 ℤ/nℤ 上的一个列向量，密钥是 k×k 矩阵：c = M·p (mod n)。
     解密要的不是"除以 M"，而是 M 在**模 n 意义下**的逆，它存在的充要条件是
     gcd(det M, n) = 1 —— 不是实数意义上的 det ≠ 0。这一条差别正是 Hill 那一页
     要讲的东西：行列式为 13 的矩阵在实数上完全可逆，模 26 却是死的（13 与 26
     不互素）。所以下面的逆元一律走 modInverse，绝不新写第二份模逆实现——
     两份模逆实现总有一天会给出两个答案，而那天没人知道该信哪个。 */

  /* 行列式按 Laplace 展开，代价是 k!：k=8 是 4 万次乘法、还在一帧之内；
     k=12 是 4.8 亿次，页面当场假死。Hill 页面只用 2×2 / 3×3，把门开在 8
     是免费的，而"用户手滑贴进一个 12 阶方阵就整页无响应"不是。 */
  const MAT_MAX_DIM = 8;

  /* 形状检查集中在一处。矩阵参数只有三种坏法：不是数组、行长不齐、元素不是整数。
     整数这一条不是洁癖——M[i][j] = 2.5 时 mod(2.5, 26) 老老实实返回 2.5，
     一路传到 fromIndices 就成了 charAt(2.5) === ''，密文凭空少一个字母，
     而中间没有任何一步报错。在入口拒绝，比在输出端反查便宜得多。 */
  function matShape(M, name) {
    if (!Array.isArray(M) || M.length === 0) throw new Error(name + ' 需要非空的二维数组');
    const rows = M.length;
    if (!Array.isArray(M[0]) || M[0].length === 0) throw new Error(name + ' 的行必须是非空数组');
    const cols = M[0].length;
    for (let i = 0; i < rows; i++) {
      const r = M[i];
      if (!Array.isArray(r) || r.length !== cols) {
        throw new Error(name + ' 第 ' + i + ' 行的长度与第 0 行不齐（应为 ' + cols + '）');
      }
      for (let j = 0; j < cols; j++) {
        if (!Number.isInteger(r[j])) {
          throw new Error(name + ' 的元素 [' + i + '][' + j + '] 不是整数：' + r[j]);
        }
      }
    }
    return [rows, cols];
  }

  function matSquareDim(M, name) {
    const s = matShape(M, name);
    if (s[0] !== s[1]) throw new Error(name + ' 需要方阵，收到 ' + s[0] + '×' + s[1]);
    if (s[0] > MAT_MAX_DIM) {
      throw new Error(name + ' 只支持 ' + MAT_MAX_DIM + ' 阶以内的方阵（行列式按 Laplace 展开，代价是 k!），收到 ' + s[0]);
    }
    return s[0];
  }

  /* 划去第 r 行第 c 列，返回 (k−1)×(k−1) 的子阵。k=1 时会得到空数组，
     所以调用方必须自己拦住 k=1（matInverse 里那一支）。 */
  function matMinor(M, r, c) {
    const k = M.length;
    const out = [];
    for (let i = 0; i < k; i++) {
      if (i === r) continue;
      const row = [];
      for (let j = 0; j < k; j++) if (j !== c) row.push(M[i][j]);
      out.push(row);
    }
    return out;
  }

  /* 沿第 0 行的 Laplace 展开。每个因子进乘法前先规约到 [0,n)，于是任何中间量
     都小于 n²——传进来一个 1e10 的元素也不会让乘积溜出 2^53 变成错的整数。 */
  function detRec(M, n) {
    const k = M.length;
    if (k === 1) return mod(M[0][0], n);
    if (k === 2) return mod(mod(M[0][0], n) * mod(M[1][1], n) - mod(M[0][1], n) * mod(M[1][0], n), n);
    let d = 0;
    for (let j = 0; j < k; j++) {
      const term = mod(M[0][j], n) * detRec(matMinor(M, 0, j), n);
      d = mod(j % 2 === 0 ? d + term : d - term, n);
    }
    return d;
  }

  function matDet(M, n) {
    matSquareDim(M, 'matDet');
    return detRec(M, n);
  }

  /* c = M·v (mod n)。M 行主序 k×k，v 长度 k，返回长度 k 的新数组。 */
  function matMulVec(M, v, n) {
    const k = matSquareDim(M, 'matMulVec');
    if (!Array.isArray(v) || v.length !== k) {
      throw new Error('matMulVec 的向量长度应为 ' + k + '，收到 ' + (Array.isArray(v) ? v.length : typeof v));
    }
    for (let j = 0; j < k; j++) {
      if (!Number.isInteger(v[j])) throw new Error('matMulVec 的向量元素 [' + j + '] 不是整数：' + v[j]);
    }
    const out = [];
    for (let i = 0; i < k; i++) {
      let s = 0;
      for (let j = 0; j < k; j++) s = mod(s + mod(M[i][j], n) * mod(v[j], n), n);
      out.push(s);
    }
    return out;
  }

  /* A·B (mod n)。不限方阵：r×m 乘 m×c 都收，因为 Hill 页面要用它验证
     M·M⁻¹ = I，也要用它把明文按列拼成矩阵一次乘完。 */
  function matMul(A, B, n) {
    const sa = matShape(A, 'matMul 的左矩阵');
    const sb = matShape(B, 'matMul 的右矩阵');
    if (sa[1] !== sb[0]) {
      throw new Error('matMul 维度不匹配：' + sa[0] + '×' + sa[1] + ' 乘 ' + sb[0] + '×' + sb[1]);
    }
    const out = [];
    for (let i = 0; i < sa[0]; i++) {
      const row = [];
      for (let j = 0; j < sb[1]; j++) {
        let s = 0;
        for (let t = 0; t < sa[1]; t++) s = mod(s + mod(A[i][t], n) * mod(B[t][j], n), n);
        row.push(s);
      }
      out.push(row);
    }
    return out;
  }

  /* M⁻¹ = (det M)⁻¹ · adj M (mod n)；adj 是代数余子式矩阵的**转置**。
     用伴随矩阵而不是高斯消元：ℤ/26ℤ 不是域（2·13 ≡ 0），消元里"用主元去除"
     这一步随时会撞上一个不可逆的主元，得再写一套换行换列的启发式，而且那套
     启发式失败时给不出干净的"不可逆"结论。伴随法只需要一次模逆，
     而那一次模逆恰好就是可逆性判据本身。
     不可逆时返回 null（不是抛异常）：模 n 下不可逆是一个**正常的数学事实**，
     Hill 页面要靠它把"这个密钥不能用"画出来，不是要靠它中断。 */
  function matInverse(M, n) {
    const k = matSquareDim(M, 'matInverse');
    const dInv = modInverse(matDet(M, n), n);
    if (dInv === null) return null;          // gcd(det, n) ≠ 1
    const out = [];
    for (let i = 0; i < k; i++) {
      const row = [];
      for (let j = 0; j < k; j++) {
        /* adj[i][j] = C_ji = (−1)^(i+j) · （划去第 j 行第 i 列的余子式）。
           下标是 (j, i) 而不是 (i, j)——伴随矩阵是代数余子式矩阵的转置。
           漏掉这次转置，在对称矩阵上照样测得过，非对称矩阵才露馅，
           所以测试里必须有非对称的用例。
           k=1 时 matMinor 会给出空数组，1×1 的伴随矩阵按定义就是 [[1]]。 */
        const c = (k === 1) ? 1 : detRec(matMinor(M, j, i), n);
        row.push(mod(dInv * ((i + j) % 2 === 0 ? c : -c), n));
      }
      out.push(row);
    }
    return out;
  }

  /* 判据直接写成 gcd(det, n) === 1，而不是 matInverse(...) !== null：
     两者等价，但这一行把"为什么可逆"印在了代码上，页面上要显示的也正是这句。 */
  function matIsInvertible(M, n) {
    return gcd(matDet(M, n), n) === 1;
  }

  /* ================= 字节 · 比特 · 模幂（第 4 章：现代密码学的地基） =================
     古典密码在 26 个字母上做算术；DES / AES / RSA / 哈希在**字节和比特**上做。
     所以第 4 章的每一页第一步都是同一件事：把"密码"这样一串文本变成字节。

     收录判据只有一句：换一个算法还用得上吗？用得上才进这里。
     DES 的 S 盒与 Feistel 轮、AES 的状态矩阵与 GF(2⁸) 乘法、MD5/SHA 的压缩
     函数一律答"否"，它们属于各自的 core/algos/*.js。这个文件被每一个工具页
     内联，多一个算法专属的函数，就多一份"改它会动到谁"的不确定。 */

  /* Uint8Array 的判定用 Object.prototype.toString，**不用 instanceof**。
     instanceof 比的是构造函数身份，跨 realm 一律为假——实测：把 node realm 的
     Uint8Array 传进 vm 沙箱，沙箱里 `x instanceof Uint8Array` 是 false，而
     Object.prototype.toString.call(x) 仍然是 '[object Uint8Array]'。
     本仓的浏览器分支测试与 check.py 的 ALGOS 求值门都跑在 vm 沙箱里，用
     instanceof 会让"最该被测的那条分支"在测试里走进"这不是字节数组"的错误
     路径，而浏览器里一切正常——又一次"门测的字节和用户跑的字节不是同一份"。 */
  function isU8(v) {
    return Object.prototype.toString.call(v) === '[object Uint8Array]';
  }

  function typeName(v) {
    if (v === null) return 'null';
    if (typeof v === 'object') return Object.prototype.toString.call(v);
    return typeof v;
  }

  /* 字节入参集中在这里检查，理由与 matShape 那一处相同：坏法就那么几种，
     散在各处迟早漏掉一处。Uint8Array 原样返回（元素天然就在 0–255），
     普通数组逐个验——一个 [0, 256, -1] 直接塞进 Uint8Array 会**静默取模**
     变成 [0, 0, 255]，不抛不报，只是数据从此不是调用方给的那份。 */
  function asBytes(v, name) {
    if (isU8(v)) return v;
    if (Array.isArray(v)) {
      const out = new Uint8Array(v.length);
      for (let i = 0; i < v.length; i++) {
        const b = v[i];
        if (!Number.isInteger(b) || b < 0 || b > 255) {
          throw new Error(name + '：第 ' + i + ' 个元素不是 0–255 的整数（收到 ' + String(b) + '）');
        }
        out[i] = b;
      }
      return out;
    }
    throw new Error(name + ' 需要 Uint8Array 或 0–255 的整数数组，收到 ' + typeName(v));
  }

  /* ---- UTF-8 ----
     手写编解码，**刻意不用 TextEncoder / TextDecoder**。理由是实测出来的：
     本仓的浏览器分支测试（examples.test.js 的写法）与 check.py 的 ALGOS 求值门
     都用 node 的 vm 建一个只有 self 的裸上下文，而那种上下文里
     `typeof TextEncoder === 'undefined'`（node v25 实测）——它是 node / 浏览器
     各自的 global，不是 ECMAScript 内建。于是：
       · 直接用 TextEncoder → 这两道门当场炸；
       · "有就用、没有就退回手写" → 更坏：浏览器跑 TextEncoder 那条、两道门跑
         手写那条，被覆盖的永远是**用户跑不到的那一条**。这正是本项目反复吃亏
         的形状（UMD 的 node 分支 vs 浏览器分支）。
     一份实现、两条分支跑同一批字节，是这里唯一诚实的选择。测试用一个把
     TextEncoder/TextDecoder 换成"一调用就抛"的沙箱把这条纪律钉住。 */

  /* 落单代理（unpaired surrogate）抛错，不学 TextEncoder 悄悄换成 U+FFFD。
     替换掉之后 fromBytes(toBytes(s)) 就不再等于 s，而这个恒等式是第 4 章
     一切演示的地基：一次一密的往返、哈希的"改一个字符看雪崩"，靠的都是
     "文本 → 字节 → 文本"不丢东西。 */
  function toBytes(str) {
    const s = String(str);
    const out = [];
    for (let i = 0; i < s.length; i++) {
      let cp = s.charCodeAt(i);
      if (cp >= 0xD800 && cp <= 0xDBFF) {
        const lo = s.charCodeAt(i + 1);
        if (!(lo >= 0xDC00 && lo <= 0xDFFF)) {
          throw new Error('toBytes：第 ' + i + ' 个码元是落单的高位代理 U+' +
                          cp.toString(16).toUpperCase() + '，这不是合法文本');
        }
        /* 代理对还原成码点：JS 字符串是 UTF-16，一个 emoji 占**两个**码元，
           按 charCodeAt 逐个编码会得到 CESU-8（两段 3 字节），那既不是 UTF-8
           也过不了本文件自己的解码器。 */
        cp = 0x10000 + ((cp - 0xD800) << 10) + (lo - 0xDC00);
        i++;
      } else if (cp >= 0xDC00 && cp <= 0xDFFF) {
        throw new Error('toBytes：第 ' + i + ' 个码元是落单的低位代理 U+' +
                        cp.toString(16).toUpperCase() + '，这不是合法文本');
      }
      if (cp < 0x80) {
        out.push(cp);
      } else if (cp < 0x800) {
        out.push(0xC0 | (cp >> 6), 0x80 | (cp & 0x3F));
      } else if (cp < 0x10000) {
        out.push(0xE0 | (cp >> 12), 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
      } else {
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3F),
                 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
      }
    }
    return new Uint8Array(out);
  }

  /* 非法 UTF-8 一律抛，不产出 U+FFFD。
     第 4 章的工具会拿**解密结果**调它，而"用错密钥"得到的就是随机字节；
     那时该看到的是一声错误或者十六进制，不是一屏问号——更不是碰巧解码成功的
     一串乱码汉字，那种"看着像结果的结果"才是最难被发现的。
     要显示任意字节请用 toHex()。 */
  function fromBytes(bytes) {
    const b = asBytes(bytes, 'fromBytes');
    let s = '';
    let i = 0;
    while (i < b.length) {
      const b0 = b[i];
      let cp, len;
      if (b0 < 0x80) { cp = b0; len = 1; }
      /* 起始字节从 0xC2 起，不是 0xC0：0xC0 / 0xC1 开头的两字节序列编出来的
         码点必然 < 0x80，是"过长编码"，历史上是绕过安全过滤的经典手法。
         同理 0xF5–0xFF 编出来必然 > 0x10FFFF。 */
      else if (b0 >= 0xC2 && b0 <= 0xDF) { cp = b0 & 0x1F; len = 2; }
      else if (b0 >= 0xE0 && b0 <= 0xEF) { cp = b0 & 0x0F; len = 3; }
      else if (b0 >= 0xF0 && b0 <= 0xF4) { cp = b0 & 0x07; len = 4; }
      else {
        throw new Error('fromBytes：第 ' + i + ' 个字节 0x' +
                        b0.toString(16).toUpperCase() + ' 不能作为 UTF-8 起始字节');
      }
      if (i + len > b.length) {
        throw new Error('fromBytes：第 ' + i + ' 个字节声明了 ' + len +
                        ' 字节的序列，但只剩 ' + (b.length - i) + ' 字节（被截断了）');
      }
      for (let k = 1; k < len; k++) {
        const c = b[i + k];
        if ((c & 0xC0) !== 0x80) {
          throw new Error('fromBytes：第 ' + (i + k) + ' 个字节 0x' +
                          c.toString(16).toUpperCase() + ' 不是合法的续字节（应形如 10xxxxxx）');
        }
        cp = (cp << 6) | (c & 0x3F);
      }
      if ((len === 3 && cp < 0x800) || (len === 4 && cp < 0x10000)) {
        throw new Error('fromBytes：第 ' + i + ' 处是过长编码（U+' +
                        cp.toString(16).toUpperCase() + ' 用了 ' + len + ' 个字节）');
      }
      if (cp >= 0xD800 && cp <= 0xDFFF) {
        throw new Error('fromBytes：第 ' + i + ' 处编码了代理码点 U+' +
                        cp.toString(16).toUpperCase() + '（那是 CESU-8，不是 UTF-8）');
      }
      if (cp > 0x10FFFF) {
        throw new Error('fromBytes：第 ' + i + ' 处的码点 U+' +
                        cp.toString(16).toUpperCase() + ' 超出 Unicode 上界 U+10FFFF');
      }
      if (cp < 0x10000) {
        s += String.fromCharCode(cp);
      } else {
        const v = cp - 0x10000;
        s += String.fromCharCode(0xD800 + (v >> 10), 0xDC00 + (v & 0x3FF));
      }
      i += len;
    }
    return s;
  }

  const HEX = '0123456789abcdef';

  /* 小写、无分隔符。小写是因为它要能原样喂回 fromHex，也因为整个仓库的
     readout 字体里小写十六进制的字形宽度更齐；无分隔符是因为"哪里断"是显示
     层的决定，不该烧进数据层。 */
  function toHex(bytes) {
    const b = asBytes(bytes, 'toHex');
    let s = '';
    for (let i = 0; i < b.length; i++) s += HEX.charAt(b[i] >> 4) + HEX.charAt(b[i] & 15);
    return s;
  }

  function hexVal(c) {
    if (c >= 48 && c <= 57) return c - 48;        // 0-9
    if (c >= 97 && c <= 102) return c - 87;       // a-f
    if (c >= 65 && c <= 70) return c - 55;        // A-F
    return -1;
  }

  /* 大小写都收（十六进制没有大小写之分），但空白与分隔符**不收**：
     "de ad be ef" 该由输入框去清洗，不该由解析器猜。奇数长度同理——
     少打一位时"丢掉最后半个字节"和"前面补个 0"都能编出来，两种猜法都会
     悄悄改掉使用者的数据，而它们给出的字节还不一样。 */
  function fromHex(hex) {
    const s = String(hex);
    if (s.length % 2 !== 0) {
      throw new Error('fromHex：十六进制串长度必须是偶数，收到 ' + s.length +
                      ' 个字符（一个字节两位）');
    }
    const out = new Uint8Array(s.length / 2);
    for (let i = 0; i < out.length; i++) {
      const hi = hexVal(s.charCodeAt(2 * i));
      const lo = hexVal(s.charCodeAt(2 * i + 1));
      if (hi < 0 || lo < 0) {
        const bad = hi < 0 ? 2 * i : 2 * i + 1;
        throw new Error('fromHex：第 ' + bad + ' 个字符 ' + JSON.stringify(s.charAt(bad)) +
                        ' 不是十六进制数字（0-9 a-f A-F，不接受空白与分隔符）');
      }
      out[i] = (hi << 4) | lo;
    }
    return out;
  }

  /* 长度不等必须抛，不许截到短的那一串。
     一次一密那一页正是靠"密钥必须和明文一样长"讲安全性的：悄悄截断会让页面
     画出一个成功的加密，而后半段明文根本没被动过——一个**看上去完全正常**的
     假象，恰好把那一页要讲的唯一一件事讲反了。 */
  function xorBytes(a, b) {
    const x = asBytes(a, 'xorBytes 的第一个参数');

      for (let j = 0; j < seqs[i].gaps.length; j++) gaps.push(seqs[i].gaps[j]);
    }
    if (gaps.length === 0) return [];
    const out = [];
    for (let p = minPeriod; p <= maxPeriod; p++) {
      let hits = 0;
      for (let i = 0; i < gaps.length; i++) if (gaps[i] % p === 0) hits++;
      out.push({ period: p, score: hits / gaps.length - 1 / p, hits: hits, total: gaps.length });
    }
    out.sort(function (a, b) { return (b.score - a.score) || (a.period - b.period); });
    return out;
  }

  /* 把文本按周期 p 拆成 p 列（第 k 列是下标 ≡ k (mod p) 的那些字母）。
     恒返回 p 个元素，哪怕文本比 p 还短——调用方是按下标取"第 5 列"的，
     一个长度随文本变化的返回值会让那句取值时灵时不灵。 */
  function columnsForPeriod(text, p) {
    if (!Number.isInteger(p) || p < 1) {
      throw new Error('columnsForPeriod 的周期必须是 >= 1 的整数，收到 ' + p);
    }
    const s = C.normalize(text);
    const cols = [];
    for (let i = 0; i < p; i++) cols.push('');
    for (let i = 0; i < s.length; i++) cols[i % p] += s.charAt(i);
    return cols;
  }

  /* 逐周期的平均重合指数。
     周期猜对时，每一列都是同一个凯撒位移的产物；单表代换保持 IoC，于是每列的
     IoC 都回到英文的 0.066。猜错时列里混着若干个不同位移，IoC 塌向 0.0385。
     这比 Kasiski 稳：它不要求文本里恰好出现重复片段，任何一段够长的密文都能算。

     p 的倍数同样会出现高峰（周期 7 的密文按 14 分列，每列仍是同一个位移），
     所以读峰值时要取**最小**的那个高点。这条不写进代码里当"聪明的后处理"——
     哪个高点是真周期需要人看着曲线判断，替使用者判断掉就把这一页的顿悟点删了。
     从 p=1 开始：p=1 就是整段文本的 IoC，那根柱子是"多表代换把 IoC 压低了"
     这句话的直接证据，没有它，后面的高峰无从对比。 */
  function icByPeriod(text, maxPeriod) {
    const mp = (maxPeriod === undefined) ? 20 : maxPeriod;
    if (!Number.isInteger(mp) || mp < 1) {
      throw new Error('icByPeriod 的 maxPeriod 必须是 >= 1 的整数，收到 ' + maxPeriod);
    }
    const s = C.normalize(text);
    const out = [];
    for (let p = 1; p <= mp; p++) {
      const cols = columnsForPeriod(s, p);
      let sum = 0;
      for (let i = 0; i < cols.length; i++) sum += indexOfCoincidence(cols[i]);
      out.push({ period: p, ic: sum / cols.length });
    }
    return out;
  }

  /* ================= 密文分类：四条判别量 =================
     以下这一段服务的是"还不知道这是什么密码"那一步——它排在本文件已有的
     全部工具之前，因为 Kasiski、逐周期重合指数、χ² 穷举都已经预设了答案：
     你得先认定这是多表代换才会去找周期。分类只用密文本身，不试任何一把密钥。 */

  /* 相邻重复二元组。切法是**不重叠**的（0-1、2-3、4-5……），不是逐位置滑窗。

     这不是随手选的。Playfair 是二元组密码，它的密文天然以偶数位对齐；
     "永远不会输出一对相同字母"这条结构性事实只在**它自己的对齐**上成立。
     换成滑窗，Playfair 密文里照样能撞出重复对（那是跨两个密文对的边界），
     于是这条判据从"结构上不可能"退化成"统计上少见"，而这一页的整个 Playfair
     分支正是建立在前者上的。

     expected 用 pairs × IoC，**不是** pairs / 26。pairs/26 假设密文字母是均匀的，
     而它们不是——即便多表代换也只把 IoC 从 0.066 压到 0.043 左右，离 1/26 = 0.0385
     还差一截（本仓实测 656 字母：维吉尼亚 p=7 得 0.0439、p=3 得 0.0481）。
     IoC 的定义就是"随手抽两个字母相同的概率"，而一个二元组正是两个字母，
     所以 pairs × IoC 是这个计数的正确期望；pairs/26 系统性偏低。
     实测同一段 656 字母的文本：维吉尼亚 p=7 观测 14、pairs×IoC 预测 14.40、
     pairs/26 预测 12.62；p=3 观测 16、预测 15.76 与 12.62。 */
  function digraphDoubles(text) {
    const s = C.normalize(text);
    const pairs = Math.floor(s.length / 2);
    let doubles = 0;
    for (let i = 0; i < pairs; i++) {
      if (s.charAt(2 * i) === s.charAt(2 * i + 1)) doubles++;
    }
    return { pairs: pairs, doubles: doubles, expected: pairs * indexOfCoincidence(s) };
  }

  /* 一次都没出现过的字母，按字母序。Playfair 的 25 格方阵里没有 J，
     所以它的密文**必然**缺 J；仿射在 gcd(a,26) > 1 时也会留下大片空位。
     反过来不成立——一段普通英文短文缺几个字母是常事（本仓那条 656 字母的
     教学明文就缺 Z），所以"缺字母"只能当佐证，不能单独定案。 */
  function absentLetters(text) {
    const counts = letterCounts(text);
    const out = [];
    for (let i = 0; i < 26; i++) if (counts[i] === 0) out.push(C.ALPHABET.charAt(i));
    return out;
  }

  /* 分类需要的最小样本量。200 不是拍脑袋的整数，是量出来的——见下面 icSweep
     的注释与 cryptanalysis.test.js 里钉住的那张表：40 个字母时单表与多表两条
     重合指数分布重叠得看不出边界，判错率两侧合计能到 17/80；到 200 时同一条
     阈值几乎不再犯错。阈值一直没动，动的是证据。 */
  const MIN_SAMPLE = 200;

  /* 单表 / 多表的重合指数分界。0.055 落在英文的 0.0667 与均匀随机的 0.0385
     之间偏英文一侧——因为多表代换的**实测**值并不落在 1/26 上，而在 0.042–0.048
     （本仓 656 字母实测：p=7 → 0.0439、p=6 → 0.0453、p=3 → 0.0481）。
     把分界摆在两个理论值的正中间（0.0526）会让 p=3 那一档时不时越线。 */
  const IC_SINGLE = 0.055;

  /* 每字母 χ²。为什么要除以 n：模型对时 χ² 大致是自由度量级的常数（这里 25），
     模型错时它随 n 线性增长——所以固定阈值在长文本上必然失效，比值不会。
     阈值 1.0 的余量是量出来的：本仓 2000 次抽样，n=200 时英文切片的
     χ²/n 最大 0.413，随机单表代换最小 1.013；n≥500 时 2/2000 把近似恒等的
     代换密钥压到 1.0 以下（0.762、0.840）——那是"密钥几乎什么都没换"的真实
     退化情形，不是判据的毛病，但值得知道。 */
  const CHI2_PER_LETTER = 1.0;

  /* "一个重复对都没有"要能当证据，先得让偶然出现的期望值够大。
     期望 0.4 时观测到 0 毫无信息量；期望 8.7 时观测到 0 的概率约 e^−8.7 ≈ 1.7e−4。 */
  const DOUBLES_MIN_EXPECTED = 3;

  /* 互异字母数不超过这个值时，"这是 26 字母表上的密码"这条前提就不成立了。 */
  const ALPHABET_MIN_DISTINCT = 10;

  function reason(key, zh, en) { return { key: key, zh: zh, en: en }; }

  /* 只看密文的家族判定。返回的 family 只有五个取值，reasons 按**实际走过的
     判据顺序**排列——页面要把这条路径原样画出来，所以顺序是结果的一部分。

     判据顺序不是随意的：Playfair 那条排在最前，因为它是**结构性**的（方阵
     里两个相同字母永远换不出一对相同字母，本仓穷举 6 把密钥 × 600 对
     = 3600 次，行/列/矩形三条规则分别命中 600/600/2400，重复输出 0 次），
     而后面两条都是统计性的。统计判据会随样本抖，结构判据不会，所以先问
     不会抖的那个。实测也支持这个顺序：Playfair 密文的 IoC（本仓 0.0504）
     与维吉尼亚 p=3（0.0481）落在同一档，单靠 IoC 分不开它们。

     n < MIN_SAMPLE 时**不给家族**：family 是 'unknown'、confident 是 false。
     这不是保守，是这一页的主张——低于 200 个字母，同一条阈值的判错率高到
     说出口就是误导。 */
  function classify(text) {
    const s = C.normalize(text);
    const n = s.length;
    const ic = indexOfCoincidence(s);
    const chi2 = chiSquare(s);
    const dg = digraphDoubles(s);
    const absent = absentLetters(s);
    const measurements = {
      ic: ic, chi2: chi2,
      doubles: dg.doubles, expectedDoubles: dg.expected, pairs: dg.pairs,
      absent: absent, evenLength: n > 0 && n % 2 === 0,
      chi2PerLetter: n > 0 ? chi2 / n : Infinity
    };
    const reasons = [];

    if (n < MIN_SAMPLE) {
      reasons.push(reason('sample-too-small',
        '只有 ' + n + ' 个字母，低于 ' + MIN_SAMPLE + '。这四个量都是平均值，' +
        '在这个长度上它们的抖动比它们要区分的差别还大——本页不给结论。',
        'Only ' + n + ' letters, below ' + MIN_SAMPLE + '. All four numbers are averages, ' +
        'and at this length they wobble by more than the differences they are meant to ' +
        'resolve. This page will not name a family.'));
      return { n: n, confident: false, family: 'unknown',
               measurements: measurements, reasons: reasons };
    }

    /* ① 结构判据之前的那一步：这**是不是**一个 26 字母表上的密码。
       ADFGVX 只用 6 个字母、波利比乌斯只用 5 个、摩尔斯只有点和划。它们的
       IoC 天生就在 1/6 = 0.167 那一档，比英文还高——不拦住的话会被下面
       "IoC ≥ 0.055 ⇒ 单表"直接判成单表代换，而那是彻底错的。
       门槛放在 10：n ≥ 200 的英文与它的各种代换/换位密文，互异字母数实测
       都在 24 以上；分裂类密码则在 6 以下，中间那一大段空着。 */
    const distinct = 26 - absent.length;
    if (distinct <= ALPHABET_MIN_DISTINCT) {
      reasons.push(reason('alphabet-too-small',
        '整段密文只用了 ' + distinct + ' 个不同的字母。这不是 26 字母表上的代换，' +
        '而是一个分裂类密码或一套编码（ADFGVX、波利比乌斯方阵、摩尔斯）：' +
        '一个明文字母被拆成了两个或更多符号。往下的三条判据都假设字母表是 26 个，' +
        '在这里全都不成立。',
        'The whole ciphertext uses only ' + distinct + ' distinct letters. This is not a ' +
        'substitution on a 26-letter alphabet but a fractionating cipher or a code ' +
        '(ADFGVX, a Polybius square, Morse): one plaintext letter has been split into two ' +
        'or more symbols. Every test below assumes 26 letters and none of them applies here.'));
      return { n: n, confident: false, family: 'unknown',
               measurements: measurements, reasons: reasons };
    }

    /* ② 结构判据：Playfair */
    const noJ = absent.indexOf('J') >= 0;
    const usableDoubleTest = dg.expected >= DOUBLES_MIN_EXPECTED;
    if (measurements.evenLength && noJ && usableDoubleTest && dg.doubles === 0) {
      reasons.push(reason('even-length',
        '长度 ' + n + ' 是偶数——密文以二元组为单位产出。',
        'Length ' + n + ' is even — the ciphertext was emitted two letters at a time.'));
      reasons.push(reason('no-j',
        '整段密文里没有 J：25 格方阵把 J 并进了 I，它没有格子可站。',
        'Not one J in the whole ciphertext: a 25-cell square folds J into I, so J has no square to stand on.'));
      reasons.push(reason('no-doubles',
        '重复二元组 0 个，偶然出现的期望是 ' + dg.expected.toFixed(1) +
        '（' + dg.pairs + ' 对 × IoC ' + ic.toFixed(4) + '）。这不是"少见"，是规则上不可能：' +
        '同行、同列、矩形三条规则换出来的两个字母必然不同。',
        'Zero doubled digraphs against ' + dg.expected.toFixed(1) + ' expected by chance (' +
        dg.pairs + ' pairs x IoC ' + ic.toFixed(4) + '). Not "rare" — impossible by rule: ' +
        'row, column and rectangle all map a distinct pair to a distinct pair.'));
      return { n: n, confident: true, family: 'polygraphic-playfair',
               measurements: measurements, reasons: reasons };
    }

    /* ② 统计判据：一张表还是很多张表 */
    if (ic >= IC_SINGLE) {
      reasons.push(reason('ic-single',
        'IoC = ' + ic.toFixed(4) + ' ≥ ' + IC_SINGLE +
        '：随手抽两个字母相同的概率还停在英文那一档，说明整段密文自始至终只用了一张表。',
        'IoC = ' + ic.toFixed(4) + ' >= ' + IC_SINGLE +
        ': two letters drawn at random still match as often as in English, so one alphabet was used throughout.'));
      if (measurements.chi2PerLetter < CHI2_PER_LETTER) {
        reasons.push(reason('chi2-english',
          'χ²/n = ' + measurements.chi2PerLetter.toFixed(3) + ' < ' + CHI2_PER_LETTER.toFixed(1) +
          '：字母表本身还是英文的那张——E 还是最多的那个。字母没被改名，只有位置动了。',
          'chi2/n = ' + measurements.chi2PerLetter.toFixed(3) + ' < ' + CHI2_PER_LETTER.toFixed(1) +
          ': the letter counts are still English — E is still the commonest. Nothing was renamed; only the order moved.'));
        /* 这条旁证是量出来的，也**只**是旁证——它没有参与分支，理由写在文案里。 */
        const ratio = dg.expected > 0 ? dg.doubles / dg.expected : 0;
        reasons.push(reason('transposition-caveat',
          '注意：单字母统计分不开"换位"与"根本没加密"——两者的 IoC 与 χ² 逐位相同。' +
          '一条旁证：重复二元组 ' + dg.doubles + ' 个 / 期望 ' + dg.expected.toFixed(1) +
          ' = ' + ratio.toFixed(2) + '。英文压制相邻重复（本仓 300 次抽样均值 0.41），' +
          '彻底打散的列换位把它抬回偶然水平（1.14）。但栅栏换位只在局部打散，均值 0.83，' +
          '约三分之一会落在明文那一侧——所以这是旁证，不是分支。',
          'Caveat: single-letter statistics cannot separate a transposition from plain English — ' +
          'both have exactly the same IoC and the same chi-square. One side hint: ' +
          dg.doubles + ' doubled digraphs / ' + dg.expected.toFixed(1) + ' expected = ' +
          ratio.toFixed(2) + '. English suppresses adjacent repeats (0.41 mean over 300 draws here); ' +
          'a thorough columnar transposition restores them to the chance level (1.14). ' +
          'A rail fence only scrambles locally (0.83 mean) and lands on the plaintext side about a ' +
          'third of the time — so this is a hint, not a branch.'));
        return { n: n, confident: true, family: 'transposition',
                 measurements: measurements, reasons: reasons };
      }
      reasons.push(reason('chi2-scrambled',
        'χ²/n = ' + measurements.chi2PerLetter.toFixed(3) + ' ≥ ' + CHI2_PER_LETTER.toFixed(1) +
        '：字母被改了名。次数的多重集合没变（所以 IoC 没变），只是贴错了标签。',
        'chi2/n = ' + measurements.chi2PerLetter.toFixed(3) + ' >= ' + CHI2_PER_LETTER.toFixed(1) +
        ': the letters were renamed. The multiset of counts is untouched (hence the IoC), only the labels moved.'));
      return { n: n, confident: true, family: 'monoalphabetic',
               measurements: measurements, reasons: reasons };
    }

    reasons.push(reason('ic-flat',
      'IoC = ' + ic.toFixed(4) + ' < ' + IC_SINGLE +
      '：重合指数被压平了。几张不同的表被平均在了一起。',
      'IoC = ' + ic.toFixed(4) + ' < ' + IC_SINGLE +
      ': the coincidence rate has been flattened. Several different alphabets have been averaged together.'));
    if (usableDoubleTest && dg.doubles > 0) {
      reasons.push(reason('doubles-present',
        '重复二元组 ' + dg.doubles + ' 个（期望 ' + dg.expected.toFixed(1) + '）——' +
        'Playfair 一个都不会有，所以它出局了。',
        dg.doubles + ' doubled digraphs against ' + dg.expected.toFixed(1) +
        ' expected — Playfair would have none at all, so Playfair is out.'));
    } else if (!usableDoubleTest) {
      reasons.push(reason('doubles-untestable',
        '偶然重复对的期望只有 ' + dg.expected.toFixed(1) + '，太小——这段文本上' +
        '"零重复对"根本不构成证据，Playfair 既排除不了也确认不了。',
        'Only ' + dg.expected.toFixed(1) + ' doubled digraphs expected by chance — too few for ' +
        '"zero doubles" to mean anything here, so Playfair can be neither ruled in nor out.'));
    }
    reasons.push(reason('next-fork-period',
      '下一个岔路口是周期：逐周期重合指数若在某个 p 处见顶，就是重复密钥一族' +
      '（维吉尼亚 / 博福特 / 波尔塔 / Quagmire）；若没有峰，才轮到 Hill、转轮机与一次一密。',
      'The next fork is period: if the IoC-by-period curve peaks at some p, it is the repeating-key ' +
      'family (Vigenere / Beaufort / Porta / Quagmire); only if no peak shows do Hill, rotor machines and the one-time pad come up.'));
    return { n: n, confident: true, family: 'polyalphabetic',
             measurements: measurements, reasons: reasons };
  }

  /* ================= 可复现的随机数 =================
     mulberry32。本仓的门对 Math.random 零容忍：一个只在某些运行里变红的测试
     比没有测试更糟。页面每次载入必须画出**同一张**扫描图，测试也必须能钉住
     它的每一个数字，所以随机性只能来自一个显式的种子。 */
  function rng32(seed) {
    let a = seed | 0;
    return function () {
      a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ================= 阈值 0.055 的判错率扫描 =================
     这道实验回答的是"MIN_SAMPLE 为什么是 200"。做法：对每个长度 n 各造
     40 段单表密文与 40 段多表密文，算各自的 IoC，数有多少段被 0.055 判反。

     三处刻意的设计，都是为了让这道实验只测一件事——样本量：

     ① 样本取自同一段英文的**循环切片**（随机起点、可绕回开头）。切片之间
        因此互相重叠，n=500 时尤其严重（源文只有几百个字母）。这不是被忽略的
        缺陷而是必须说出来的限制：n 大的那几行，40 次抽样的独立性比 n 小的那几行
        差，所以它们是**更弱**的证据，不是更强的。

     ② 多表那一侧的密钥**字母互不相同**。一把随手抽的密钥可能是 'XBX'——
        它长度 3 却只用了两张表，IoC 会抬到 0.06 上下，在**任何**长度上都被
        判成单表。那是密钥的毛病，不是样本量的毛病，混进来只会把两件事搅在
        一起。本仓量过这个混杂项：不限制密钥时，n ≥ 200 的 600 次抽样里有 7 段
        多表密文被判成单表，**七段的密钥全部有重复字母**。

     ③ 单表那一侧的 IoC 恒等于明文切片的 IoC（单表代换是字母上的双射，
        f_i 的多重集合不变）。所以这一侧量的其实是"一段 n 个字母的英文，
        它的重合指数有多不稳"——密钥在这里完全不起作用，这本身就是第二条判据。 */
  const SWEEP_LENGTHS = [40, 60, 80, 100, 150, 200, 300, 500];
  const SWEEP_TRIALS = 40;
  const SWEEP_SEED = 20260810;
  const SWEEP_KEY_MIN = 3, SWEEP_KEY_MAX = 9;

  function cyclicSlice(src, start, n) {
    let out = '';
    for (let i = 0; i < n; i++) out += src.charAt((start + i) % src.length);
    return out;
  }

  /* 抽一把字母互不相同的密钥：对字母表做部分 Fisher–Yates，取前 L 个。
     和 substitution.randomKey 一样自后向前洗，好让两处消耗 rng 的方式一致。 */
  function distinctKey(rngFn, len) {
    const pool = C.ALPHABET.split('');

  function polyPath(C, pts) {
    if (pts.length < 2) return null;
    let head = null, tail = null, contin = false, prev = null;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const P = pts[i];
      if (P === null) { prev = null; contin = false; continue; }
      const cur = camPt(C, P);
      if (prev !== null) {
        let a = prev, b = cur;
        const av = a[2] >= NEAR, bv = b[2] >= NEAR;
        if (av || bv) {
          if (!av) a = clipNear(a, b);
          if (!bv) b = clipNear(b, a);
          const sA = scr(a), sB = scr(b);
          if (!contin) ctx.moveTo(sA[0], sA[1]);
          ctx.lineTo(sB[0], sB[1]);
          if (!head) head = sA;
          tail = sB;
          contin = bv;
        } else {
          contin = false;
        }
      }
      prev = cur;
    }
    return head ? [head, tail] : null;
  }

  function strokePoly(C, pts, o) {
    const ht = polyPath(C, pts);
    if (!ht) return;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = o.width || 2;
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.dash) ctx.setLineDash(o.dash);
    if (o.fade) {
      const h = ht[0], tt = ht[1];
      if (Math.hypot(tt[0]-h[0], tt[1]-h[1]) < 2) {
        ctx.strokeStyle = o.fade[0];
      } else {
        const g = ctx.createLinearGradient(h[0], h[1], tt[0], tt[1]);
        g.addColorStop(0, o.fade[0]);
        g.addColorStop(1, o.fade[1]);
        ctx.strokeStyle = g;
      }
    } else {
      ctx.strokeStyle = o.color;
    }
    ctx.stroke();
    ctx.restore();
  }
  const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

  function glowDot(s, r, core, mid) {
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
    g.addColorStop(0, core);
    g.addColorStop(0.35, mid);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }
  function solidDot(C, p, r, color) {
    const s = proj(C, p);
    if (!s) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }

  function label3(C, p, text, o) {
    const s = proj(C, p);
    if (!s) return;
    ctx.save();
    ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
    ctx.fillStyle = o.color || '#c4d2e6';
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(3,6,12,.85)';
    ctx.shadowBlur = 4;
    ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
    ctx.restore();
  }

  function arrowAt(C, tip3, before3, color) {
    const tp = proj(C, tip3), b = proj(C, before3);
    if (!tp || !b) return;
    const a = Math.atan2(tp[1]-b[1], tp[0]-b[0]);
    const L = 9;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a-0.42), tp[1]-L*Math.sin(a-0.42));
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a+0.42), tp[1]-L*Math.sin(a+0.42));
    ctx.stroke();
    ctx.restore();
  }

  /* ================= 常用场景部件 ================= */
  const AXIS = 'rgba(159,176,200,0.9)';
  const AXIS_DIM = 'rgba(159,176,200,0.5)';

  /* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[] }。
     starter 版本还有个 tAxis（z 轴当连续时间轴用，靠一个「波形可视长度」常量定长、
     按秒打刻度）——棋没有连续时间驱动，这条分支随那个时间长度常量一起删掉了，
     只留平面上的 x/y 两轴。 */
  function drawAxes(C, o) {
    const ex = o.ex, ey = o.ey;
    line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
    label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
    label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    for (const k of (o.yTicks || [])) {
      for (const yv of [k, -k]) {
        line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
    }
    for (const k of (o.xTicks || [])) {
      for (const xv of [k, -k]) {
        line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }

  /* z=0 平面方格网格（几何类场景） */
  function drawGridXY(C, g, step) {
    const n = Math.round(g / step);
    for (let i = -n; i <= n; i++) {
      if (i === 0) continue;
      const u = i * step;
      line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
      line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    }
  }

  /* ================= 主绘制与主循环 ================= */
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    const C = makeCam();
    if (curTab != null && SCENES[curTab] && typeof SCENES[curTab].draw === 'function') {
      SCENES[curTab].draw(C);
    }
  }

  function updateReadout() {
    if (!roEl || curTab == null || !SCENES[curTab] || typeof SCENES[curTab].readout !== 'function') return;
    roEl.innerHTML = SCENES[curTab].readout();
  }

  /* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
     resetSim() 会清空它——用户主动重置后应当允许重新报。 */
  const frameErrSeen = Object.create(null);
  function frameError(err) {
    const k = curTab + '|' + ((err && err.message) || err);
    if (frameErrSeen[k]) return;
    frameErrSeen[k] = 1;
    console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
  }

  function resetSim() {
    Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  }

  let lastTs = 0, lastRO = 0;
  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
      lastTs = ts;

      if (tween) {
        const k = Math.min(1, (ts - tween.t0) / tween.dur);
        const e = ease(k);
        const f = tween.from, o = tween.to;
        cam.az = f.az + wrapPI(o.az - f.az) * e;
        cam.el = f.el + (o.el - f.el) * e;
        cam.dist = f.dist + (o.dist - f.dist) * e;
        cam.tx = f.tx + (o.tx - f.tx) * e;
        cam.ty = f.ty + (o.ty - f.ty) * e;
        cam.tz = f.tz + (o.tz - f.tz) * e;
        if (k >= 1) tween = null;
      }

      state.dt = dt;

      draw();
      if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
    } catch (err) {
      frameError(err);
    } finally {
      requestAnimationFrame(frame);
    }
  }

  /* ================= UI 生成（由消费方通过 init() 提供的 PARAMS / SCENES 声明驱动） ================= */
  const paramWraps = {};   // key -> { wrap, input, val, p }

  function buildParams() {
    const host = document.getElementById('paramsHost');
    if (!host || !PARAMS) return;
    PARAMS.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'ctl';
      wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
      const val = wrap.querySelector('.val');
      const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
      const upd = () => {
        const raw = parseFloat(input.value);
        state[p.key] = p.map ? p.map(raw) : raw;
        render();
      };
      input.addEventListener('input', upd);
      wrap.appendChild(input);
      host.appendChild(wrap);
      paramWraps[p.key] = { wrap, input, val, p };
      upd();                       // 建面板时用默认刻度初始化 state
      const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。 */
  function syncParamVisibility() {
    const list = SCENES[curTab] && SCENES[curTab].params;
    Object.keys(paramWraps).forEach(k => {
      paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
    });
  }

  function buildToggles() {
    const host = document.getElementById('togglesHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const grp = document.createElement('div');
      grp.className = 'toggles';
      grp.dataset.tab = id;
      (SCENES[id].toggles || []).forEach(tg => {
        if (!(tg.key in state)) state[tg.key] = tg.checked;
        const lab = document.createElement('label');
        lab.className = 'tg';
        lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
          '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
        const cb = lab.querySelector('input');
        cb.addEventListener('change', () => {
          state[tg.key] = cb.checked;
          document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
        });
        const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
        RELABEL.push(relabel);
        relabel();
        grp.appendChild(lab);
      });
      host.appendChild(grp);
    });
  }

  function buildViews() {
    const host = document.getElementById('viewsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const row = document.createElement('div');
      row.className = 'views';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'vlabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(UI.views); };
      RELABEL.push(labRelabel);
      labRelabel();
      Object.keys(SCENES[id].views || {}).forEach(name => {
        const b = document.createElement('button');
        b.className = 'btn vbtn';
        b.dataset.view = name;
        b.addEventListener('click', () => applyView(name));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
    });
  }

  /* ================= 预置内容（局面 / 棋种……）================= */
  /* Task 6 的原话是「预置局面（views 的 onSelect 里加载）」——把内容选择塞进
     相机角度控件里。这两件事其实互不相干：相机角度回答「从哪儿看」，预置
     内容回答「看什么」。合并的后果是两头都坏：选了某个局面，相机会跟着
     跳；想从顶视角看某个局面，view 一栏根本没有这个组合按钮。这里补一个
     独立控件——buildParams / buildToggles / buildViews 之外的第四种——
     专门表示「离散的、有名字的内容」：一组按钮，互斥选中，选中的 key 写进
     导出的 state，并调用调用方给的 onSelect（真正去加载那份内容，如
     Interact.create(FEN) 或切换 E.state 里的棋种索引）。

     声明形状：SCENES[id].presets = [{ key, label, onSelect }, ...]，
     可选 SCENES[id].presetsLabel 覆盖分组标签（省略时用通用的 UI.presets——
     「预置/Preset」——见上面的声明）。没有声明 presets 的场景，#presetsHost
     里对应那一行不会出现，与 toggles/views 的既有习惯一致。 */
  function buildPresets() {
    const host = document.getElementById('presetsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const list = SCENES[id].presets;
      if (!list || !list.length) return;
      const row = document.createElement('div');
      row.className = 'presets';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'plabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(SCENES[id].presetsLabel || UI.presets); };
      RELABEL.push(labRelabel);
      labRelabel();
      list.forEach(pr => {
        const b = document.createElement('button');
        b.className = 'btn pbtn';
        b.dataset.preset = pr.key;
        b.addEventListener('click', () => applyPreset(id, pr.key));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(pr.label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
      /* 建面板时就选中第一项——与 buildParams() 对滑杆默认值的处理同一条
         精神：面板刚搭好、用户还没机会点任何按钮之前，就该有一份确定的
         初始内容，而不是留白等第一次点击。传显式 id，不依赖 curTab——
         这时候 switchTab() 还没跑过，curTab 仍是 null，且这里本就是在给
         *每一个* tab（不只是即将成为首个可见 tab 的那个）建立初始状态。 */
      applyPreset(id, list[0].key);
    });
  }

  function buildTabs() {
    const nav = document.getElementById('tabsNav');
    if (!nav) return;
    Object.keys(SCENES).forEach(id => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.tab = id;
      b.addEventListener('click', () => switchTab(id));
      nav.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].label); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* ================= 视角与页签 ================= */
  /* 选择器必须限定在 .views 之内：.vbtn 只是个样式类，工具可能为了复用外观
     把它挂到别处的按钮上。不限定的话 closest('.views') 会返回 null，这里
     当场抛错，视角高亮从此再不更新。 */
  function refreshViewButtons() {
    document.querySelectorAll('.views .vbtn').forEach(b => {
      const row = b.closest('.views');
      b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
    });
  }
  function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
  function applyView(name) {
    const sc = SCENES[curTab];
    const vw = sc && sc.views && sc.views[name];
    if (!vw) return;
    if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
    tween = {
      from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
      to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
      t0: performance.now(),
      dur: REDUCED ? 1 : 750
    };
    lastView[curTab] = name;
    refreshViewButtons();
  }

  /* 选择器同样必须限定在 .presets 之内，理由与 refreshViewButtons() 一致。 */
  function refreshPresetButtons() {
    document.querySelectorAll('.presets .pbtn').forEach(b => {
      const row = b.closest('.presets');
      b.classList.toggle('active', b.dataset.preset === lastPreset[row.dataset.tab]);
    });
  }
  /* 显式接受 tabId，不像 applyView() 那样隐式用 curTab——预置内容的
     初始化（buildPresets() 建面板时、以及工具可能想在页面加载时就把
     几个不可见 tab 都摆到各自的默认局面）必须能在切到那个 tab 之前
     就把它的内容选好，等真正切过去时画面已经是对的，不需要「先切 tab
     再选内容」这道额外的手续。 */
  function applyPreset(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    const pr = list && list.find(p => p.key === key);
    if (!pr) return;
    if (pr.onSelect) pr.onSelect();
    lastPreset[tabId] = key;
    /* 若还有别的 tab 声明的 presets 是同一个数组引用（同一个对象，不是内容碰巧
       相等）——这就是「跨 tab 共享的同一份选择」（例如 chess-moves-geometry.html
       的六种棋子：piece/field/mobility 三个 tab 都读写同一份 E.state.pieceIdx，
       presets 声明也故意用的是同一个数组常量）。这些 tab 的按钮高亮要跟着同步，
       否则切到另一个 tab 会看见按钮组还停在初始项，尽管实际选择早已跟着共享
       状态变了。onSelect 不重复调用——它已经在上面跑过一次，副作用只与
       「选了哪个 key」有关，与是哪个 tab 触发的无关，重复调用不会更对，
       只会更容易踩到调用方自己没预料到的重入。 */
    Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key;
    });
    if (tabId === curTab) state.preset = key;
    refreshPresetButtons();
  }

  /* 只同步高亮，不调用 onSelect：给调用方已经自己完成了加载（例如工具③
     的 PGN 拖入 / FEN 粘贴 / 棋局浏览器直接选中某个 id）、只需要让预置
     按钮组的选中态跟上真实状态的场景。key 传 null/undefined 表示「清空
     高亮」——没有哪个按钮的 dataset.preset 会等于 undefined，所以这就是
     『不让按钮组停在一个已经不成立的选中态』的实现方式。跨 tab 共享同一份
     presets 数组引用时的同步逻辑与 applyPreset() 保持一致（否则切换 tab
     会看见按钮组用另一条路径的陈旧值重新亮起）。 */
  function syncPresetHighlight(tabId, key) {
    const sc = SCENES[tabId];
    const list = sc && sc.presets;
    lastPreset[tabId] = key || undefined;
    if (list) Object.keys(SCENES).forEach(otherId => {
      if (otherId !== tabId && SCENES[otherId].presets === list) lastPreset[otherId] = key || undefined;
    });
    if (tabId === curTab) state.preset = key || undefined;
    refreshPresetButtons();
  }

  let brandDescEl = null, tipsEl = null, roEl = null;

  function switchTab(id) {
    if (id === curTab) return;
    curTab = id;
    tween = null;
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
    document.querySelectorAll('.toggles[data-tab], .views[data-tab], .presets[data-tab]').forEach(el => {
      el.style.display = el.dataset.tab === id ? '' : 'none';
    });
    if (cams[id]) Object.assign(cam, cams[id]);   // 原地改写，VizEngine.cam 引用不变
    const sc = SCENES[id];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    syncParamVisibility();
    refreshViewButtons();
    /* 换 tab 时把导出的 state.preset 同步成这个 tab 自己记住的那一个——
       lastPreset[id] 在 buildPresets() 建面板时已经对每个声明了 presets
       的 tab 都填过一次（选中第一项），没声明 presets 的 tab 这里是
       undefined，state.preset 也就诚实地变成 undefined，不留一份别的
       tab 的陈旧数据。 */
    state.preset = lastPreset[id];
    refreshPresetButtons();
    updateReadout();
  }

  /* ================= 播放 / 重置 / 折叠 ================= */
  let btnPlay = null, btnFold = null, panelEl = null;
  function togglePlay() {
    state.running = !state.running;
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  }

  /* ================= 语言切换 ================= */
  function applyLang() {
    if (typeof document === 'undefined') return;
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.title = t(TOOL.title);
    const h1 = document.querySelector('.brand h1');
    if (h1) h1.textContent = t(TOOL.h1);
    const panelTitleEl = document.getElementById('panelTitle');
    if (panelTitleEl) panelTitleEl.textContent = t(UI.panelTitle);
    const hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.textContent = t(UI.hint);
    const btnLangEl = document.getElementById('btnLang');
    if (btnLangEl) btnLangEl.textContent = LANG === 'zh' ? 'EN' : '中';
    if (btnPlay) btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
    const btnResetEl = document.getElementById('btnReset');
    if (btnResetEl) btnResetEl.textContent = t(UI.reset);
    RELABEL.forEach(f => f());
    const sc = SCENES[curTab];
    if (brandDescEl && sc) brandDescEl.textContent = t(sc.brand);
    if (tipsEl && sc) tipsEl.textContent = t(sc.tips);
    updateReadout();
  }
  function setLang(l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    try {
      const u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    } catch (e) {}
    applyLang();
  }

  /* ================= 交互：旋转 / 平移 / 缩放 ================= */
  function pan(dx, dy) {
    const C = makeCam();
    const s = cam.dist / FOCAL;
    cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
    cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
    cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
  }

  /* 绑定拖拽旋转 / 右键或 Shift 拖拽平移 / 滚轮或双指缩放 / 双击回正到给定 canvas。
     只在浏览器里调用才会碰 DOM 事件，模块顶层不会自动执行这段。
     双击回正：若当前页签在 SCENES 里声明了 views，就补间回它的第一个视角
     （规范里「首视角即双击回正的家」）；没有 SCENES 的最小用法里则安静地不做事。 */
  function bindOrbit(canvasEl) {
    const pointers = new Map();
    let pinch = null;

    canvasEl.addEventListener('pointerdown', e => {
      canvasEl.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
      tween = null;
      lastView[curTab] = null;
      refreshViewButtons();
      if (pointers.size === 2) {
        const vs = Array.from(pointers.values());
        pinch = {
          gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
          cx: (vs[0].x + vs[1].x) / 2,
          cy: (vs[0].y + vs[1].y) / 2
        };
      }
      canvasEl.classList.add('dragging');
    });

    canvasEl.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX;
      p.y = e.clientY;
      if (pointers.size === 1) {
        const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
        if (panMode) {
          pan(dx, dy);
        } else {
          cam.az -= dx * 0.0055;
          cam.el = clamp(cam.el + dy * 0.0055, EL_MIN, EL_MAX);   // 与 makeCam() 共用同一对边界，见那里的注释
        }
      } else if (pointers.size === 2 && pinch) {
        const vs = Array.from(pointers.values());
        const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
        const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
        if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
        pan(cx - pinch.cx, cy - pinch.cy);
        pinch = { gap: gap, cx: cx, cy: cy };
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) canvasEl.classList.remove('dragging');
    }
    canvasEl.addEventListener('pointerup', endPointer);
    canvasEl.addEventListener('pointercancel', endPointer);
    canvasEl.addEventListener('contextmenu', e => e.preventDefault());

    canvasEl.addEventListener('wheel', e => {
      e.preventDefault();
      tween = null;
      cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
    }, { passive: false });

    canvasEl.addEventListener('dblclick', () => {
      const sc = SCENES[curTab];
      const names = sc && sc.views && Object.keys(sc.views);
      if (names && names.length) applyView(names[0]);
    });
  }

  /* 全局键盘快捷键：T 切换页签、1–9 选视角。这两组快捷键都只驱动引擎本体
     已经实现、且已经接在按钮上的函数（switchTab / applyView），不需要
     消费方提供任何东西，所以放在这里而不是要求每个工具各自重新接一遍。
     绑在 window 上，不是 canvas 上——这是键盘事件，和 bindOrbit() 的
     canvas 指针事件是两回事，混在一起会把两者都说不清楚。

     Space 与 r 不在这里绑定——它们属于工具，不属于引擎。math-viz 的设计
     规格把 Space 定为所有五个棋类工具的播放/暂停/单步这枚统一的传输键
     （阶段 3 的复盘工具还要用它当「下一步」），r 同理是工具自己的重置键；
     若引擎在这里先用 preventDefault() 抢注，工具将来接自己的处理器时
     只会和引擎打架，而不是真正拿到这个键。resetSim()/togglePlay() 本身
     没有删——它们仍然接在面板的按钮上，只是不再从键盘直接触发。 */
  function bindKeyboard() {
    window.addEventListener('keydown', e => {
      const el = document.activeElement;
      const tag = el && el.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;

      if (e.key === 't' || e.key === 'T') {
        const keys = Object.keys(SCENES);
        if (keys.length) switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
      } else if (e.key >= '1' && e.key <= '9') {
        const sc = SCENES[curTab];
        const names = sc && sc.views && Object.keys(sc.views);
        if (!names) return;
        const i = +e.key - 1;
        if (i < names.length) applyView(names[i]);   // 越界就什么也不做，不抛也不落到 undefined
      }
    });
  }

  /* ================= 启动 ================= */
  /* VizEngine.init({ canvas, SCENES, PARAMS, TOOL, VERSION }) ——
     只有 canvas 是必需的。其余都是「工具专属声明」，省略时对应机制安静地不生效，
     这样本模块既可以被最小页面（如棋子预览页）直接用来拿相机与绘图原语，
     也能在将来的算法工具里接上完整的滑杆 / 页签机制。
     没有 ENGINE_VERSION 参数——它唯一的读者是阶段 2 Task 1 删掉的那份录制
     存档函数（下载 JSON 存档时把引擎版本写进文档头），删掉那份骨架后引擎
     自己不再需要这个值。工具仍然在 <meta name="engine-version"> 里声明它、
     给人读（§10 版本规范），只是不用再传进 init()。 */
  function init(opts) {
    opts = opts || {};
    canvas = opts.canvas;
    if (!canvas) throw new Error('VizEngine.init({ canvas }) 需要一个 canvas 元素');
    ctx = canvas.getContext('2d');

    if (opts.SCENES) SCENES = opts.SCENES;
    if (opts.PARAMS) PARAMS = opts.PARAMS;
    if (opts.TOOL) TOOL = opts.TOOL;
    if (opts.VERSION) VERSION = opts.VERSION;

    try {
      REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    } catch (e) { REDUCED = false; }
    LANG = resolveLang();   // 惰性求值：只在这里才碰 location / localStorage

    resize();
    window.addEventListener('resize', resize);

    brandDescEl = document.getElementById('brandDesc');
    tipsEl = document.getElementById('tips');
    roEl = document.getElementById('readout');
    btnPlay = document.getElementById('btnPlay');
    panelEl = document.getElementById('panel');
    btnFold = document.getElementById('btnFold');

    if (btnPlay) btnPlay.addEventListener('click', togglePlay);
    const btnResetEl = document.getElementById('btnReset');
    if (btnResetEl) btnResetEl.addEventListener('click', resetSim);
    if (btnFold && panelEl) {
      btnFold.addEventListener('click', () => {
        const c = panelEl.classList.toggle('collapsed');
        btnFold.textContent = c ? '+' : '−';
      });
      if (window.innerWidth < 760) {
        panelEl.classList.add('collapsed');
        btnFold.textContent = '+';
      }
    }
    const btnLangEl = document.getElementById('btnLang');
    if (btnLangEl) btnLangEl.addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
    const verBadge = document.getElementById('verBadge');
    if (verBadge) verBadge.textContent = 'v' + VERSION;

    buildTabs();
    buildParams();
    buildToggles();
    buildViews();
    buildPresets();   // 在 switchTab(firstTab) 之前——它要读 lastPreset[id] 同步 state.preset

    Object.keys(SCENES).forEach(id => {
      const views = SCENES[id].views || {};
      const first = Object.keys(views)[0];
      if (!first) return;
      const v = views[first];
      cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
      lastView[id] = first;
    });
    const firstTab = Object.keys(SCENES)[0];
    if (firstTab) {
      curTab = null;           // 让 switchTab 的 `id === curTab` 短路检查失效，确保首次真正执行
      switchTab(firstTab);
    }

    bindOrbit(canvas);
    bindKeyboard();
    applyLang();
    resetSim();
    /* autoLoop 默认 true——数学可视化工具的动画从一个持续运行的时钟驱动，
       "每个 vsync 都重画" 是它们的常态，引擎自带循环因此默认开启。
       棋类不是这个模型：棋是离散的——重画只该发生在一步棋、一次相机拖拽、
       或一次显式动画之后，从不该有一个"正在跑的时钟"替它决定何时重画。
       task-14 的 32 子帧率探针踩过这个坑：_piece-preview.html 自己起了
       第二条 rAF 循环（drawHarness），engine 的 frame() 同时也在跑——
       两条循环每个 vsync 都各画一次同一块 canvas：engine 先铺一层昂贵的
       径向渐变背景（SCENES 为空，铺完就没别的可画），harness 紧接着用
       一次纯色 fill 把它整个盖掉再画棋盘和棋子。径向渐变因此是纯浪费
       （量过：1.03ms vs 纯色 fill 的 0.07ms，15 倍开销，且立刻被覆盖）。
       给 init() 加这个开关，让像 _piece-preview.html 这样自己驱动循环的
       调用方能关掉引擎自己的循环——以后棋类工具大概率都要这个开关，
       所以放在引擎里而不是让每个工具各自想办法绕开它。 */
    if (opts.autoLoop !== false) requestAnimationFrame(frame);
  }

  /* ================= screen-space 2D 图元层 =================
     密码学工具的大多数画面是 2D：字母轮、字母网格、矩阵、比特块、频率柱。
     它们与上面那套相机/投影无关——直接在屏幕坐标里画。3D 那半边留着不是
     摆设：Bloch 球、Hill 矩阵变换、以及 Caesar 自己把模 26 抬成螺旋的顿悟
     视角都要用它。两套并存，各画各的。

     颜色一律由调用方显式传入，这一层不内嵌调色板——"一条曲线一种颜色、
     在六处复用"那条原则要求颜色的唯一真相在工具页的 SCENES 里。

     这些图元画在模块私有的 ctx 上，与 strokePoly/label3 等 3D 图元同一个出口，
     因此 withContext(targetCtx, fn) 对它们同样有效。 */

  /* 数学符号一律 serif italic（五条原则第 4 条），Canvas 与 HTML 两侧同款。
     给它一个函数而不是让每处自己拼字符串：拼错一次就会有一个字母突然变
     无衬线，而那种差异在截图里几乎看不出来、在页面上却很刺眼。
     字体栈直接复用上面已有的 FONT_MATH / FONT_CN 常量——同一份字符串在同一个
     闭包里存两遍，早晚会有人只改其中一遍。 */
  /* 顺序是 `italic <weight> <size>px <stack>`，即 CSS font 简写的规范顺序
     （font-style → font-variant → font-weight → font-size → font-family）。
     规范其实允许前三者任意排列，把 weight 写在 italic 之前浏览器多半也认；
     这里不赌那件事，因为**赌输了没有任何信号**：ctx.font 拿到不能解析的值时
     既不抛错也不警告，只是静默保留旧值——页面上的表现是某几个字母莫名其妙
     不是斜体，而这在截图里几乎看不出来。这个函数存在的全部意义就是消灭那类
     静默偏差，它自己更不该建立在一个需要实测才敢确认的写法上。 */
  function mathFont(px, weight) { return 'italic ' + (weight ? weight + ' ' : '') + px + 'px ' + FONT_MATH; }
  function uiFont(px, weight) { return (weight ? weight + ' ' : '') + px + 'px ' + FONT_CN; }

  /* 字母环。letters 默认 A–Z；rotation 是整环旋转的弧度（Caesar 的 k 就是
     k/26 * 2π）；highlight 传下标时那一个字母用 hiColor 并加一圈辉光。 */
  /* ================= 放得下多少格 =================
     本项目在窄屏上连栽五次，五次是同一个形状：

         const cell = clamp((availW - gap*(n-1)) / n, MIN, MAX);

     先定**格数**、再把格宽 clamp 到一个下限。那个下限本意是保住可读性，
     实际效果是把「放不下」变成「画出去」——canvas 不会裁剪也不会报错，
     内容就那么越过边缘，而首尾几个格子看上去仍像内容的一部分。桌面上
     永远看不见，于是每次都是发货之后才被发现（Caesar 报文条、Hill 的
     break 页、Quagmire 的中文文案 84.5px、摩尔斯的读法列表、骨架的
     标题与页签重叠）。

     正确的次序是反过来的：**先用最小可读格宽反推放得下几格**，再让格宽
     在剩余空间里长大到上限为止。放不下的部分由调用方明说（省略号、
     「1–24 / 26」这样的窗口提示），而不是交给画布边缘去吃掉。

     返回 { n, cell, total, truncated }。调用方只需照 n 画、并在
     truncated 为真时给出提示。 */
  function fitCells(availW, wanted, o) {
    o = o || {};
    const gap = o.gap == null ? 3 : o.gap;
    const min = o.min == null ? 12 : o.min;
    const max = o.max == null ? 26 : o.max;
    const fit = Math.max(1, Math.floor((availW + gap) / (min + gap)));
    const n = Math.max(1, Math.min(wanted, fit));
    const cell = clamp((availW - gap * (n - 1)) / n, min, max);
    return { n: n, cell: cell, total: n * cell + (n - 1) * gap, truncated: n < wanted };
  }

  function alphabetWheel(cx, cy, r, o) {
    o = o || {};
    const letters = o.letters || 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const n = letters.length;
    const rot = o.rotation || 0;
    const color = o.color || '#9fb0c8';
    const size = o.fontSize || 13;

    if (o.ring !== false) {
      ctx.save();
      ctx.strokeStyle = o.ringColor || 'rgba(148,163,184,.22)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = mathFont(size, o.weight);
    for (let i = 0; i < n; i++) {
      /* -π/2 让下标 0 落在正上方（12 点钟），这样 k 的旋转在视觉上
         就是钟面的旋转，跟使用者转滑杆的方向一致。 */
      const a = -Math.PI / 2 + rot + i * TAU / n;
      const px = cx + Math.cos(a) * r;
      const py = cy + Math.sin(a) * r;
      const on = (o.highlight === i);
      if (on && o.hiGlow !== false) {
        const g = ctx.createRadialGradient(px, py, 0, px, py, size * 1.6);
        g.addColorStop(0, (o.hiColor || color) + 'aa');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, size * 1.6, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = on ? (o.hiColor || color) : color;
      ctx.fillText(letters.charAt(i), px, py);
      if (o.ticks) {
        ctx.save();
        ctx.strokeStyle = o.ringColor || 'rgba(148,163,184,.22)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * (r - size * 0.75), cy + Math.sin(a) * (r - size * 0.75));
        ctx.lineTo(cx + Math.cos(a) * (r - size * 1.25), cy + Math.sin(a) * (r - size * 1.25));
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();
  }

  /* 网格。text(col,row) 与 fill(col,row) 都是回调，返回 null / '' 表示这一格
     不画内容 / 不填色。x,y 是左上角，cell 是每格边长（px）。 */
  function cellGrid(x, y, cols, rows, cell, o) {
    o = o || {};
    const color = o.color || '#e2e8f0';
    const stroke = o.stroke || 'rgba(148,163,184,.20)';
    const size = o.fontSize || Math.round(cell * 0.5);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = o.mono ? uiFont(size) : mathFont(size, o.weight);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const px = x + c * cell, py = y + r * cell;
        const f = o.fill ? o.fill(c, r) : null;
        if (f) { ctx.fillStyle = f; ctx.fillRect(px, py, cell, cell); }
        if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.strokeRect(px + .5, py + .5, cell - 1, cell - 1); }
        const s = o.text ? o.text(c, r) : null;
        if (s != null && s !== '') {
          ctx.fillStyle = (o.textColor && o.textColor(c, r)) || color;
          ctx.fillText(String(s), px + cell / 2, py + cell / 2);
        }
      }
    }
    ctx.restore();
  }

  /* 比特块：bits 是 0/1 数组，1 用 on 色实心、0 用 off 色描边。 */
  function bitBlock(x, y, bits, o) {
    o = o || {};
    const cell = o.cell || 14, gap = o.gap == null ? 2 : o.gap;
    const on = o.on || '#2dd4ea', off = o.off || 'rgba(148,163,184,.28)';
    ctx.save();
    for (let i = 0; i < bits.length; i++) {
      const px = x + i * (cell + gap);
      if (bits[i]) { ctx.fillStyle = on; ctx.fillRect(px, y, cell, cell); }
      else { ctx.strokeStyle = off; ctx.lineWidth = 1; ctx.strokeRect(px + .5, y + .5, cell - 1, cell - 1); }
    }
    ctx.restore();
  }

  /* 频率柱。values 按传入顺序画；内部按 max 归一化（传 o.max 可锁定量程，
     这在动画里很重要——不锁的话每帧最大值一变，所有柱子都会跳）。 */
  function barChart(x, y, w, h, values, o) {
    o = o || {};
    const n = values.length;
    if (!n) return;
    const max = o.max != null ? o.max : Math.max.apply(null, values) || 1;
    const gap = o.gap == null ? 2 : o.gap;
    const bw = (w - gap * (n - 1)) / n;
    ctx.save();
    for (let i = 0; i < n; i++) {
      const bh = Math.max(0, Math.min(1, values[i] / max)) * h;
      ctx.fillStyle = (o.colorAt && o.colorAt(i)) || o.color || '#2dd4ea';
      ctx.fillRect(x + i * (bw + gap), y + h - bh, bw, bh);
    }
    if (o.labels) {
      ctx.fillStyle = o.labelColor || 'rgba(159,176,200,.75)';
      ctx.font = mathFont(o.labelSize || 10);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      for (let i = 0; i < n; i++) {
        ctx.fillText(o.labels[i], x + i * (bw + gap) + bw / 2, y + h + 3);
      }
    }
    ctx.restore();
  }

  function flowArrow(ax, ay, bx, by, o) {
    o = o || {};
    ctx.save();
    ctx.strokeStyle = o.color || 'rgba(159,176,200,.6)';
    ctx.lineWidth = o.width || 1.4;
    if (o.dash) ctx.setLineDash(o.dash);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    if (o.head !== false) {
      const a = Math.atan2(by - ay, bx - ax), L = o.headLen || 8;
      ctx.fillStyle = o.color || 'rgba(159,176,200,.6)';
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx - Math.cos(a - 0.4) * L, by - Math.sin(a - 0.4) * L);
      ctx.lineTo(bx - Math.cos(a + 0.4) * L, by - Math.sin(a + 0.4) * L);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function chip(x, y, w, h, text, o) {
    o = o || {};
    const rad = o.radius == null ? 5 : o.radius;

   讲的正是"只看密文能读出什么"。 */
const BASE = CC.normalize(EX.plaintext('cryptanalysis-note').text.en);
const SUB_KEY = SUBST.randomKey(CA.rng32(20260810));
const HILL_KEY = [[3, 3], [2, 5]];

const SPECIMENS = [
