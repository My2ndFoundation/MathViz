  ST.pairsNS = PF.digraphsOf(ST.preppedNS);
  ST.fourPairs = PF.digraphsOf(ST.fourCipher);
  ST.twoPairs = PF.digraphsOf(ST.twoCipher);
  ST.n = ST.pairs.length;
  ST.hasText = ST.n > 0;

  /* 每一对命中了哪条规则、四个坐标是什么，一次算好。让页面自己再判一遍
     行列相等，就会出现"画的是一条规则、算的是另一条"这种只有截图能发现的错。 */
  ST.info = [];
  ST.ruleCount = { row: 0, col: 0, rect: 0 };
  for (let i = 0; i < ST.n; i++) {
    const g = ST.pairs[i];
    const r = (g.length === 2) ? PF.mapPair(ST.square, g.charAt(0), g.charAt(1), 1) : null;
    ST.info.push(r);
    if (r) ST.ruleCount[r.rule]++;
  }

  ST.fPlain = CA.letterFrequency(ST.prepped);
  ST.fSub = CA.letterFrequency(ST.subCipher);
  ST.fPF = CA.letterFrequency(ST.cipher);
  ST.fFour = CA.letterFrequency(ST.fourCipher);
  ST.fTwo = CA.letterFrequency(ST.twoCipher);
  /* 五条分布共用同一个量程。各按各的最大值归一化会让"塌了一半"这句话在画面上
     变成一句谎——两组差着一倍的数，量程不同就画得一样高。动画期间尤其要锁死：
     barChart 不传 o.max 就按当帧最大值归一化，柱子会在帧与帧之间跳。 */
  let mx = 0.09;
  for (let i = 0; i < 26; i++) {
    mx = Math.max(mx, ST.fPlain[i], ST.fSub[i], ST.fPF[i], ST.fFour[i], ST.fTwo[i]);
  }
  ST.maxF = mx;

  ST.chiPlain = flatChi(ST.prepped);
  ST.chiSub = flatChi(ST.subCipher);
  ST.chiPF = flatChi(ST.cipher);
  ST.chiFour = flatChi(ST.fourCipher);
  ST.chiTwo = flatChi(ST.twoCipher);
  ST.chiFloor = flatFloor(ST.prepped.length);
  ST.iocPlain = CA.indexOfCoincidence(ST.prepped);
  ST.iocSub = CA.indexOfCoincidence(ST.subCipher);
  ST.iocPF = CA.indexOfCoincidence(ST.cipher);
  ST.iocFour = CA.indexOfCoincidence(ST.fourCipher);
  ST.iocTwo = CA.indexOfCoincidence(ST.twoCipher);

  ST.dgPlain = digraphTable(ST.prepped);
  ST.dgPF = digraphTable(ST.cipher);
  ST.dgPlainNS = digraphTable(ST.preppedNS);
  ST.dgFour = digraphTable(ST.fourCipher);
  ST.dgTwo = digraphTable(ST.twoCipher);
  ST.dgDeltaPF = profileDelta(ST.dgPlain, ST.dgPF);
  ST.dgDeltaFour = profileDelta(ST.dgPlainNS, ST.dgFour);
  ST.dgDeltaTwo = profileDelta(ST.dgPlainNS, ST.dgTwo);
  ST.maxDG = Math.max(1, ST.dgPlain.rows.length ? ST.dgPlain.rows[0].c : 1,
                         ST.dgPF.rows.length ? ST.dgPF.rows[0].c : 1,
                         ST.dgFour.rows.length ? ST.dgFour.rows[0].c : 1,
                         ST.dgTwo.rows.length ? ST.dgTwo.rows[0].c : 1);

  /* 二方阵的"同列透明"：两个字母同列时通式给出的就是明文本身，明文照抄进
     密文。随机情形下的概率是 1/5。这一条不需要特判，是通式自己的推论——
     数出来给人看，比在页面上写一句"据说大约五分之一"强。 */
  let same = 0;
  for (let i = 0; i < ST.pairsNS.length; i++) {
    if (ST.pairsNS[i] === ST.twoPairs[i]) same++;
  }
  ST.twoSame = same;
  ST.twoRate = ST.pairsNS.length ? same / ST.pairsNS.length : 0;

  /* Playfair 密文里永远没有重复对（同行同列换出来的两个字母必然不同，矩形
     换出来的两个行号不同因而也必然不同）；四方阵允许。数出来是为了让这条
     结构性差别在页面上是一个计数，不是一句断言。 */
  function doubles(pairs) {
    let d = 0;
    for (let i = 0; i < pairs.length; i++) {
      if (pairs[i].length === 2 && pairs[i].charAt(0) === pairs[i].charAt(1)) d++;
    }
    return d;
  }
  ST.doublesPF = doubles(ST.cpairs);
  ST.doublesFour = doubles(ST.fourPairs);
  ST.doublesPlain = doubles(ST.pairsNS);
  return ST;
}

/* 当前变体的那一份数据。四方阵 / 二方阵的明文基准是"不拆重复对"的那一份，
   所以连明文侧的二元组表一起取，免得某一页拿 Playfair 的基准去比四方阵的密文。 */
function variantInfo() {
  const S = scene();
  if (VARIANT === 'four') {
    return { key: 'four', label: { en: 'Four-square', zh: '四方阵' },
             cipher: S.fourCipher, pairs: S.fourPairs, freq: S.fFour,
             chi: S.chiFour, ioc: S.iocFour, dg: S.dgFour,
             plainDg: S.dgPlainNS, plainPairs: S.pairsNS, delta: S.dgDeltaFour };
  }
  if (VARIANT === 'two') {
    return { key: 'two', label: { en: 'Two-square', zh: '二方阵' },
             cipher: S.twoCipher, pairs: S.twoPairs, freq: S.fTwo,
             chi: S.chiTwo, ioc: S.iocTwo, dg: S.dgTwo,
             plainDg: S.dgPlainNS, plainPairs: S.pairsNS, delta: S.dgDeltaTwo };
  }
  return { key: 'playfair', label: { en: 'Playfair', zh: 'Playfair' },
           cipher: S.cipher, pairs: S.cpairs, freq: S.fPF,
           chi: S.chiPF, ioc: S.iocPF, dg: S.dgPF,
           plainDg: S.dgPlain, plainPairs: S.pairs, delta: S.dgDeltaPF };
}

/* ================= 焦点二元组的唯一真相 =================
   走到第几对有两个控件：面板上的滑杆，和底部传输条（⏮ ⏵/⏸ ⏭ ⟲）。两个控件
   写同一个量会互相覆盖，所以这里不让它们各存一份：**时间轴的 index 就是当前
   二元组**，滑杆只是它的一个视图。

   步数随明文长度变，而 createTimeline 的 steps 是建好就固定的，所以这里在步数
   变了的时候重建一条并把 index 带过去。TL 是 let（不是 const），传输条的三个
   回调都从闭包里读它，因此永远读到的是当前那一条，不会抓着一条被换掉的旧的。 */
let TL = null;
function ensureTL(n) {
  const steps = Math.max(1, n);
  if (TL && TL.steps === steps) return TL;
  const keep = TL ? TL.index : 0;
  TL = CryptoAnim.createTimeline({ steps: steps, stepDuration: 0.85, loop: true, rate: 1 });
  TL.play();
  TL.seek(Math.min(keep, steps - 1));
  return TL;
}
function curPair() {
  const S = scene();
  if (!S.hasText) return 0;
  return Math.min(TL ? TL.index : 0, S.n - 1);
}

let pairInput = null, pairValEl = null, lastPairStr = '';

/* 滑杆右边显示的是**这一对的映射**（"HI → BM"），不只是一个下标。所以它不能
   只在 index 变的时候刷新：换一把关键词、index 没动，那行字会停在旧映射上。
   用一个字符串缓存挡住无谓的 DOM 写入。 */
function pairFmt(v) {
  const S = scene();
  if (!S.hasText) return '—';
  const i = Math.max(0, Math.min(S.n - 1, Math.round(v)));
  const V = variantInfo();
  return (i + 1) + '/' + S.n + '  ' + (S.pairs[i] || '') + ' → ' + (V.pairs[i] || '');
}

function syncPair() {
  const S = scene();
  const i = curPair();
  /* 滑杆的 max 跟着明文长度走。引擎按 PARAMS 里声明的 min/max 建好滑杆之后
     就不再管它了，而这一页的步数是随文本变的——不同步的话，一段短文本上滑杆
     还能拖到第 63 格，拖过去只会停在最后一对上，看着像卡住了。 */
  if (pairInput) {
    const mx = String(Math.max(0, S.n - 1));
    if (pairInput.max !== mx) pairInput.max = mx;
    if (String(i) !== pairInput.value) pairInput.value = String(i);
  }
  if (E.state.pair !== i) E.state.pair = i;
  if (pairValEl) {
    const s = pairFmt(i);
    if (s !== lastPairStr) { lastPairStr = s; pairValEl.textContent = s; }
  }
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock() {
  const S = scene();
  ensureTL(S.n);
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
  syncPair();
}

document.getElementById('btnBack').addEventListener('click', function () { if (TL) TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { if (TL) TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把时间轴也拨回第 0 对。用 seek(0)
   而不是 TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { if (TL) TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'pair',
    label: { en: 'digraph', zh: '第几对' },
    min: 0, max: 63, step: 1, value: 0,      // max 由 syncPair() 按文本长度改写
    fmt: pairFmt },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 版面 ================= */
function layout() {
  const vi = E.viewInfo();
  const wide = vi.W > 900;
  const availW = wide ? vi.W - 330 : vi.W;
  return { vi: vi, W: vi.W, H: vi.H, wide: wide, availW: availW,
           cx: wide ? availW / 2 + 16 : vi.W / 2 };
}

/* 三个页签的画面都是**满宽**的（两列柱子、三块并排的方阵），而 canvas 是铺满
   整页的底层，浮在它上面的 UI 会挡住左上角那一块。所以每一页的内容起始高度
   都得让开当前真正挡在上面的东西。

   不写一个"上面那堆大概 130px 高"的常数，两条都会让它失效：
     · .brand p 的行数随文案与宽度变（窄屏 CSS 直接把它隐藏；实测 900px 宽时
       变体那一页的 brand 要占三行）；
     · **窄屏下页签条与传输条会从居中/贴底改成钉在左上角**（见样式表末尾那段
       媒体查询：.tabs 移到 top:52，.transport 移到 top:96、bottom:auto）。
       第一版只让开了 .brand，于是 375px 上 Playfair 那块方阵整个躲在传输条
       背后——画出来了，看不见，而"画到画布外"的探针一个都抓不到它。
   所以直接问 DOM 要这三个盒子的下沿。传输条只在它确实待在上半屏时才算数，
   否则宽屏上它贴在底部，会把内容一路推到画布外面去。
   按「宽高 + 文案长度」缓存，一帧最多读一次。 */
const topCache = { key: '', v: 0 };
function contentTop(L, minTop) {
  const brand = document.querySelector('.brand');
  const k = L.W + 'x' + L.H + '|' + (brand ? brand.textContent.length : 0);
  if (topCache.key !== k) {
    let b = 0;
    ['.brand', '.tabs', '.transport'].forEach(function (sel) {
      const el = document.querySelector(sel);
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.bottom > L.H / 2) return;         // 贴底的传输条不参与
      b = Math.max(b, r.bottom);
    });
    topCache.key = k;
    topCache.v = b;
  }
  return Math.max(topCache.v + 12, minTop);
}

const RULE_NAME = {
  row:  { en: 'same row → shift right',    zh: '同行 → 各自右移一格' },
  col:  { en: 'same column → shift down',  zh: '同列 → 各自下移一格' },
  rect: { en: 'rectangle → swap columns',  zh: '矩形 → 各取对方那一列' }
};
const RULE_SHORT = {
  row:  { en: 'same row',    zh: '同行' },
  col:  { en: 'same column', zh: '同列' },
  rect: { en: 'rectangle',   zh: '矩形' }
};

function cellCenter(sx, sy, cs, r, c) { return [sx + (c + 0.5) * cs, sy + (r + 0.5) * cs]; }

/* 5×5 方阵。fill / textColor 由调用方按"这一格是不是当前二元组的一员"决定。 */
function drawSquare(sx, sy, cs, sq, o) {
  o = o || {};
  E.cellGrid(sx, sy, 5, 5, cs, {
    text: function (c, r) { return sq.charAt(r * 5 + c); },
    textColor: o.textColor || function () { return 'rgba(159,176,200,.72)'; },
    fill: o.fill || null,
    stroke: o.stroke || LINE,
    fontSize: cs * 0.5
  });
}

/* 同行 / 同列的一步移动。绕过边界时画成"出边 + 入边"两截短箭头，而不是一条
   从最右一格指回最左一格的长箭头——那条长箭头在画面上说的是"往左走四格"，
   而规则说的是"往右走一格，走到头绕回来"。绕回这一处正是三条规则里唯一需要
   取模的地方，也是唯一会被写成 +1 而忘了绕回的地方。 */
function stepArrow(sx, sy, cs, from, to, horizontal, color) {
  const a = cellCenter(sx, sy, cs, from[0], from[1]);
  const b = cellCenter(sx, sy, cs, to[0], to[1]);
  const wrapped = horizontal ? (from[1] === 4) : (from[0] === 4);
  if (!wrapped) {
    E.flowArrow(a[0], a[1], b[0], b[1], { color: color, width: 2, headLen: 8 });
    return;
  }
  const out = horizontal ? [sx + 5 * cs + 15, a[1]] : [a[0], sy + 5 * cs + 15];
  const inn = horizontal ? [sx - 15, b[1]] : [b[0], sy - 15];
  E.flowArrow(a[0], a[1], out[0], out[1], { color: color, width: 2, headLen: 8 });
  E.flowArrow(inn[0], inn[1], b[0], b[1], { color: color, width: 2, headLen: 8, dash: [4, 3] });
  const lx = horizontal ? sx + 5 * cs + 6 : sx + 5 * cs - 34;
  const ly = horizontal ? a[1] - 26 : sy + 5 * cs + 6;
  E.chip(lx, ly, 42, 17, 'mod 5', { mono: true, color: color, fill: CARD,
                                    stroke: color, fontSize: 9.5 });
}

/* ================= 页签一：方阵 —— 三条规则 ================= */
const squareTab = {
  label: { en: 'Square', zh: '方阵' },
  brand: { en: 'Not arithmetic. Two letters, one 5×5 grid, and the only thing that matters is where they sit relative to each other.',
           zh: '这里没有算术。两个字母、一个 5×5 方阵，唯一起作用的是它们彼此的相对位置。' },
  tips: { en: 'Step with ⏭ and watch the rule name change. Every earlier cipher in this chapter computed c ≡ f(p) mod 26; nothing here is added to anything. Then open the Digraph tab — that one is the epiphany.',
          zh: '按 ⏭ 单步，看规则名字在变。本章前面每一个密码都在算 c ≡ f(p) (mod 26)，这一页从头到尾没有一次加法。看完去「二元组」那一页——顿悟视角在那里。' },
  params: ['pair', 'speed'],
  presets: VARIANTS,
  presetsLabel: VARIANTS_LABEL,
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎双击
     回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showRule',   label: { en: 'Rule geometry',  zh: '规则几何' },   color: VIOLET,   checked: true },
    { key: 'showStrip',  label: { en: 'Digraph strip',  zh: '二元组条' },   color: CYAN,     checked: true },
    { key: 'showFiller', label: { en: 'Inserted X',     zh: '插入的 X' },   color: UNPAIRED, checked: true }
  ],
  draw: function () {
    tickClock();
    const L = layout();
    const S = scene();
    const bottom = L.H - 78;
    let y = contentTop(L, 60);

    if (!S.hasText) {
      E.chip(L.cx - 150, y + 40, 300, 26,
             E.t({ en: 'no letters — nothing to pair up', zh: '没有字母 —— 没有可以配对的东西' }),
             { mono: true, color: ORANGE, fill: 'rgba(251,146,60,.08)',
               stroke: 'rgba(251,146,60,.38)', fontSize: 11.5 });
      return;
    }

    const idx = curPair();
    const info = S.info[idx];
    const stripH = E.state.showStrip ? 104 : 0;
    const cs = E.clamp(Math.min((L.availW - 72) / 5, (bottom - y - 118 - stripH) / 5), 20, 58);
    const sw = cs * 5;
    const sx = L.cx - sw / 2;

    /* ① 标题两行：先说这幅画是什么，再给当前那一对。 */
    E.chip(L.cx - 170, y, 340, 18,
           E.t({ en: 'keyword ' + CC.normalize(KW1).slice(0, 16), zh: '关键词 ' + CC.normalize(KW1).slice(0, 16) }),
           { mono: true, color: VIOLET, fontSize: 11 });
    y += 22;
    E.chip(L.cx - 116, y, 232, 32,
           info ? (info.a + info.b + '  →  ' + info.out) : '—',
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 15 });
    y += 40;

    const sy = y;
    /* ② 方阵本体。当前二元组的两个明文格子给青色、两个密文格子给玫红；
       规则命中的那一整行 / 一整列先铺一层淡紫底，让"这条规则响了"先于箭头
       被看见。 */
    const pa = info.pa, pb = info.pb, qa = info.qa, qb = info.qb;
    function same(p, r, c) { return p[0] === r && p[1] === c; }
    if (E.state.showRule) {
      if (info.rule === 'row') {
        E.chip(sx, sy + pa[0] * cs, sw, cs, '', { fill: 'rgba(167,139,250,.10)', radius: 0 });
      } else if (info.rule === 'col') {
        E.chip(sx + pa[1] * cs, sy, cs, sw, '', { fill: 'rgba(167,139,250,.10)', radius: 0 });
      }
    }
    drawSquare(sx, sy, cs, S.square, {
      fill: function (c, r) {
        if (same(pa, r, c) || same(pb, r, c)) return 'rgba(45,212,234,.18)';
        if (same(qa, r, c) || same(qb, r, c)) return 'rgba(251,113,133,.18)';
        return null;
      },
      textColor: function (c, r) {
        if (same(pa, r, c) || same(pb, r, c)) return CYAN;
        if (same(qa, r, c) || same(qb, r, c)) return ROSE;
        return 'rgba(159,176,200,.62)';
      }
    });

    /* ③ 规则几何。矩形那一条画成一个真的矩形（四个角就是四个格子的中心），
       另外两条画成沿行 / 沿列的一步移动。 */
    if (E.state.showRule) {
      if (info.rule === 'rect') {
        const r0 = Math.min(pa[0], pb[0]), r1 = Math.max(pa[0], pb[0]);
        const c0 = Math.min(pa[1], pb[1]), c1 = Math.max(pa[1], pb[1]);
        E.chip(sx + (c0 + 0.5) * cs, sy + (r0 + 0.5) * cs, (c1 - c0) * cs, (r1 - r0) * cs, '',
               { stroke: VIOLET, width: 1.6, radius: 3 });
        const A = cellCenter(sx, sy, cs, pa[0], pa[1]), QA = cellCenter(sx, sy, cs, qa[0], qa[1]);
        const B = cellCenter(sx, sy, cs, pb[0], pb[1]), QB = cellCenter(sx, sy, cs, qb[0], qb[1]);
        E.flowArrow(A[0], A[1], QA[0], QA[1], { color: VIOLET, width: 2, headLen: 8 });
        E.flowArrow(B[0], B[1], QB[0], QB[1], { color: VIOLET, width: 2, headLen: 8 });
      } else {
        const horiz = (info.rule === 'row');
        stepArrow(sx, sy, cs, pa, qa, horiz, VIOLET);
        stepArrow(sx, sy, cs, pb, qb, horiz, VIOLET);
      }
    }
    y = sy + sw + 16;

    /* ④ 规则判词 + 三条规则各响了多少次。后者说明这不是三选一的特例，
       而是一段真文本里三条规则都在不停地轮流响。 */
    E.chip(L.cx - 160, y, 320, 22, E.t(RULE_NAME[info.rule]),
           { mono: true, color: VIOLET, fill: 'rgba(167,139,250,.08)',
             stroke: 'rgba(167,139,250,.42)', fontSize: 11.5 });
    y += 26;
    E.chip(L.cx - 170, y, 340, 18,
           E.t(RULE_SHORT.row) + ' ' + S.ruleCount.row + '  ·  ' +
           E.t(RULE_SHORT.col) + ' ' + S.ruleCount.col + '  ·  ' +
           E.t(RULE_SHORT.rect) + ' ' + S.ruleCount.rect,
           { mono: true, color: DIM, fontSize: 10.5 });
    y += 24;

    /* ⑤ 二元组条：预处理后的明文压着密文。窗口以当前那一对为中心。
       先算这块画布**装得下几对**，再决定显示哪几对——不能先定一个对数再把
       格子夹到下限，那个下限一旦生效就会从两边淌出画布（crypto-caesar 1.0.2
       修的就是这个）。 */
    if (E.state.showStrip && y + 80 < bottom) {
      const gap = 2, pairGap = 9, MIN_CELL = 12, MAX_PAIRS = 18;
      const usable = L.availW - 36;
      const fit = Math.max(1, Math.floor((usable + pairGap) / (2 * MIN_CELL + gap + pairGap)));
      /* 再压一道 MAX_PAIRS：宽屏上光按最小格宽算能塞进 27 对，格子只有 11px、
         字号 6px，谁也读不出来。这一条不是"装得下几对"，是"看得清几对"——
         二元组条要人读的是**字母**，不是一条纹理。 */
      const m = Math.min(S.n, fit, MAX_PAIRS);
      let start = idx - Math.floor(m / 2);
      start = Math.max(0, Math.min(S.n - m, start));
      const cell = E.clamp((usable - (m - 1) * pairGap - m * gap) / (2 * m), MIN_CELL, 26);
      const total = m * (2 * cell + gap) + (m - 1) * pairGap;
      const x0 = L.cx - total / 2;
      const yb = y + cell + 20;

      E.chip(x0, y - 17, 120, 15, E.t({ en: 'prepared plaintext', zh: '预处理后的明文' }),
             { mono: true, color: CYAN, fontSize: 9.5 });
      for (let k = 0; k < m; k++) {
        const i = start + k;
        const px = x0 + k * (2 * cell + gap + pairGap);
        const on = (i === idx);
        for (let t = 0; t < 2; t++) {
          const j = i * 2 + t;
          const isFill = E.state.showFiller && S.flags[j];
          const col = isFill ? UNPAIRED : (on ? CYAN : 'rgba(45,212,234,.62)');
          E.chip(px + t * (cell + gap), y, cell, cell, S.prepped.charAt(j),
                 { fill: on ? 'rgba(45,212,234,.14)' : (isFill ? 'rgba(255,47,208,.12)' : null),
                   stroke: isFill ? UNPAIRED : (on ? CYAN : 'rgba(45,212,234,.26)'),
                   color: col, fontSize: cell * 0.58, radius: 3 });
          E.chip(px + t * (cell + gap), yb, cell, cell, S.cipher.charAt(j),
                 { fill: on ? 'rgba(251,113,133,.16)' : null,
                   stroke: on ? ROSE : 'rgba(251,113,133,.24)',
                   color: on ? ROSE : 'rgba(251,113,133,.6)',
                   fontSize: cell * 0.58, radius: 3 });
        }
        if (on) {
          E.flowArrow(px + cell + gap / 2, y + cell + 3, px + cell + gap / 2, yb - 4,
                      { color: VIOLET, width: 1.4, headLen: 6 });
        }
      }
      E.chip(x0, yb + cell + 4, 120, 15, E.t({ en: 'ciphertext', zh: '密文' }),
             { mono: true, color: ROSE, fontSize: 9.5 });
    }
  },
  readout: function () {
    syncIoLabels();
    const S = scene();
    if (!S.hasText) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters to pair up', zh: '没有可以配对的字母' }) + '</b>';
    }
    const i = curPair(), info = S.info[i];
    const fill = S.flags[i * 2] || S.flags[i * 2 + 1];
    return '<span class="dim">' + E.t({ en: 'digraph ', zh: '第 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + (i + 1) + '</b>' +
      '<span class="dim">/' + S.n + E.t({ en: '', zh: ' 对' }) + '</span><br>' +
      '<b style="--c:var(--trace-cyan)"><i>' + info.a + info.b + '</i></b>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)"><i>' + info.out + '</i></b>' +
      '<span class="dim">   ' + E.t(RULE_SHORT[info.rule]) + '</span><br>' +
      '<span class="dim">' + E.t(RULE_NAME[info.rule]) + '</span><br>' +
      (fill ? '<b style="--c:var(--trace-unpaired)">' +
              E.t({ en: 'one letter here was inserted by the preparation rule',
                    zh: '这一对里有一个字母是预处理插进去的' }) + '</b><br>' : '') +
      /* 解密结果是一整串没有空格的字母，面板不换行——截短到 26 个字符，
         否则它会从 304px 宽的面板右边直接淌出去。 */
      '<span class="dim">' + E.t({ en: 'decrypts back to ', zh: '解密回来是 ' }) + '</span>' +
      esc(clip(S.back, 26)) + '<br>' +
      '<span class="dim">' +
      E.t({ en: 'the inserted letters stay — Playfair cannot give the spelling back',
            zh: '插进去的字母还在 —— Playfair 还不回原来的拼写' }) + '</span>';
  }
};

/* ================= 页签二：二元组 —— 顿悟视角 =================
   左边一列是单字母，右边一列是二元组。

   左边三排柱子喂的是**同一段**预处理后的明文：
     ① 明文本身          英文那张脸，E 一根独高
     ② 单表代换密文      与①逐根等高，只是换了标签（页面把两个 χ² 并排印出来
                        核对；它们**完全相等**，因为代换换的是标签不是计数）
     ③ Playfair 密文     塌了一半
   右边两排喂的是同样这两段文本的**二元组**计数，按高度降序排：
     ④ 明文的二元组
     ⑤ Playfair 密文的二元组   —— 与④逐根等高，最大差恒为 0

   这就是这一页的全部：指纹没有消失，它上移了一层。Playfair 是**二元组上的
   单表代换**，所以在二元组这一层，它与上一页那个已经被打穿的单表代换是同一
   种东西——只不过字母表从 26 个符号变成了 600 个二元组。

   诚实的一句：③ 并没有真的变平。页面把"完全平坦时 χ² 大约是多少"也画出来，
   实测 Playfair 落在那个下界的四五倍上，抹掉的大约是超出随机那部分的六成。
   "几乎平坦"是夸张，这一页不这么说。 */
const digraphTab = {
  label: { en: 'Digraph', zh: '二元组' },
  brand: { en: 'The single-letter fingerprint collapses. Count pairs instead and it is back, untouched.',
           zh: '单字母指纹塌下去了。改成数「对」，它原封不动地回来。' },
  tips: { en: 'This tab is the epiphany, and its default view already shows it. Left column: the same text as plain, as monoalphabetic substitution, as Playfair — only the last one collapses. Right column: the same two texts counted by digraph — max Δ = 0. The fingerprint did not vanish, it moved up one level.',
          zh: '这一页就是顿悟视角，它的首视角已经是那个视角。左边一列是同一段文本的三种样子：明文、单表代换、Playfair —— 只有最后一排塌了。右边一列是同样两段文本按「对」去数 —— 最大差 = 0。指纹没有消失，它上移了一层。' },
  params: ['pair', 'speed'],
  presets: VARIANTS,
  presetsLabel: VARIANTS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showPlainBars', label: { en: 'Plaintext row', zh: '明文那一排' }, color: CYAN,    checked: true },
    { key: 'showFloor',     label: { en: 'Flat floor',    zh: '完全平坦线' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    tickClock();
    const L = layout();
    const S = scene();
    const V = variantInfo();
    const bottom = L.H - 74;

    if (!S.hasText) {
      E.chip(L.cx - 170, L.H * 0.4, 340, 26,
             E.t({ en: 'no letters — nothing to count', zh: '没有字母 —— 没有可数的东西' }),
             { mono: true, color: ORANGE, fill: 'rgba(251,146,60,.08)',
               stroke: 'rgba(251,146,60,.38)', fontSize: 11.5 });
      return;
    }

    /* 宽屏两列（左单字母、右二元组），窄屏改成上下叠：两列各只剩 170px 时
       26 根柱子会挤成一堵墙，而这一页要人看的正是柱子的**形状**。 */
    const twoCol = L.availW > 700;
    const colW = twoCol ? (L.availW - 60) / 2 : L.availW - 32;
    const lx = twoCol ? L.cx - (L.availW - 60) / 2 - 14 : L.cx - colW / 2;
    const rx = twoCol ? L.cx + 14 : L.cx - colW / 2;

    const rowsLeft = E.state.showPlainBars ? 3 : 2;
    /* 这一页每排柱子的标题画在 y − 17 处（另外两页的第一件东西就画在 y 上），
       所以让开浮层之后还要再让出这 17px —— 否则第一排的标题正好蹭到窄屏那条
       传输条的下沿（实测中文界面上重叠 2px）。 */
    const top = contentTop(L, 74) + 17;
    const avail = bottom - top - 40;
    /* 竖排时五排柱子加上**两条判词**要一起塞进 avail，所以先把两条判词的高度
       （2 × 26 加上两处间距，取 34）从预算里扣掉再均分。第一版没扣，于是
       375px 上右列那条「排完序完全重合：Δ = 0」被挤到 bottom 之外——而它正是
       这一页的落点，宁可柱子矮一点也不能丢。 */
    const chartH = twoCol
      ? E.clamp(avail / rowsLeft - 46, 30, 128)
      : E.clamp((avail - 34) / (rowsLeft + 2) - 46, 22, 74);
    const rowH = chartH + 46;

    const gap = 1.5;
    const bw = (colW - gap * 25) / 26;
    const labels = CC.ALPHABET.split('');
    const showLabels = bw >= 7;

    /* 一排字母柱。o.max 恒为 S.maxF —— 五条分布共用一个量程，不共用的话
       "塌了一半"这句话在画面上就是假的。 */
    function letterRow(x, y, freq, color, title, chi, ioc) {
      E.chip(x, y - 17, colW, 15, E.t(title), { mono: true, color: color, fontSize: 10.5 });
      E.barChart(x, y, colW, chartH, freq, {
        max: S.maxF, gap: gap, color: color,
        labels: showLabels ? labels : null,
        labelSize: Math.min(9, Math.max(6.5, bw * 0.72)),
        labelColor: 'rgba(159,176,200,.45)'
      });
      /* 完全平坦时每根柱子的高度：n/26 除以量程。它是"平"这件事的刻度线——
         没有它，人只能凭感觉说"看起来比较平"。 */
      if (E.state.showFloor) {
        const flat = (1 / 26) / S.maxF * chartH;
        E.chip(x, y + chartH - flat - 0.5, colW, 1, '',
               { fill: 'rgba(52,211,153,.55)', radius: 0 });
      }
      E.chip(x, y + chartH + (showLabels ? 12 : 2), colW, 15,
             'χ² ' + chi.toFixed(0) + '   ·   IoC ' + ioc.toFixed(4),
             { mono: true, color: DIM, fontSize: 10 });
    }

    let y = top;
    if (E.state.showPlainBars) {
      letterRow(lx, y, S.fPlain, CYAN,
                { en: 'plaintext — letters', zh: '明文 —— 单字母' }, S.chiPlain, S.iocPlain);
      y += rowH;
    }
    letterRow(lx, y, S.fSub, ORANGE,
              { en: 'monoalphabetic substitution — letters', zh: '单表代换 —— 单字母' },
              S.chiSub, S.iocSub);
    y += rowH;
    letterRow(lx, y, V.freq, ROSE,
              { en: E.t(V.label) + ' — letters', zh: E.t(V.label) + ' —— 单字母' },
              V.chi, V.ioc);
    y += rowH;

    /* 左列底部的判词：把三个 χ² 与"完全平坦时大约是多少"摆在一起。
       不写"几乎平坦"——实测不是。 */
    if (y + 34 < bottom) {
      E.chip(lx, y - 8, colW, 18,
             E.t({ en: 'flat would be about ', zh: '完全平坦时大约是 ' }) + S.chiFloor.toFixed(0) +
             E.t({ en: '  ·  substitution ', zh: '  ·  单表代换 ' }) + S.chiSub.toFixed(0) +
             E.t({ en: '  ·  this ', zh: '  ·  这一个 ' }) + V.chi.toFixed(0),
             { mono: true, color: EMERALD, fontSize: 10.5 });
    }

    /* 右列：同样两段文本，按**对**去数。降序排，只画得下的那几根。 */
    /* 竖排时右列接在左列判词下面，留 34px：判词那块 chip 高 22、从 y−8 起画，
       给 26 只够两者贴在一起，标题会压在判词的下边框上。 */
    const dgTop = twoCol ? top : y + 34;
    const dgH = twoCol ? chartH : E.clamp(chartH, 24, 64);
    const dgRowH = dgH + 46;
    /* 根数按"柱子要宽到放得下一个二元组标签"来定，不是按"最多能塞几根"。
       这一页的punch line 恰恰是那两排标签：高度一模一样，名字全不一样
       （明文 IN·TH·HE，密文 RK·ZB·BP）。柱子挤到 13.9px 时标签整排消失，
       画面就只剩"两排一样的柱子"，说不出它们是不同的二元组。 */
    const dgap = 2;
    const LABEL_BW = 15;
    const nBars = Math.max(4, Math.min(24, Math.floor((colW + dgap) / (LABEL_BW + dgap))));
    const dbw = (colW - dgap * (nBars - 1)) / nBars;
    const dgMax = Math.max(1, S.maxDG);

    function digraphRow(x, y2, tab, color, title) {
      const vals = [], labs = [];
      for (let i = 0; i < nBars; i++) {
        vals.push(i < tab.rows.length ? tab.rows[i].c : 0);
        labs.push(i < tab.rows.length ? tab.rows[i].g : '');
      }
      E.chip(x, y2 - 17, colW, 15, E.t(title), { mono: true, color: color, fontSize: 10.5 });
      E.barChart(x, y2, colW, dgH, vals, {
        max: dgMax, gap: dgap, color: color,
        labels: dbw >= 14 ? labs : null,
        labelSize: Math.min(9, Math.max(6.5, dbw * 0.42)),
        labelColor: 'rgba(159,176,200,.45)'
      });
      E.chip(x, y2 + dgH + (dbw >= 14 ? 12 : 2), colW, 15,
             tab.total + E.t({ en: ' digraphs · ', zh: ' 对 · ' }) +
             tab.rows.length + E.t({ en: ' distinct · top ', zh: ' 种 · 最高 ' }) +
             (tab.rows.length ? tab.rows[0].c : 0),
             { mono: true, color: DIM, fontSize: 10 });
    }

    let dy = dgTop;
    digraphRow(rx, dy, V.plainDg, CYAN,
               { en: 'plaintext — digraphs', zh: '明文 —— 二元组' });
    dy += dgRowH;
    digraphRow(rx, dy, V.dg, ROSE,
               { en: E.t(V.label) + ' — digraphs', zh: E.t(V.label) + ' —— 二元组' });
    dy += dgRowH;

    /* 右列的判词。delta 是页面自己算出来的数，不是一句形容词——排完序两排的
       最大计数差，恒为 0，而且是精确的 0。 */
    if (dy - 8 + 26 < bottom) {
      /* 长句在 11px 无衬线下量到 363px；chip 既不换行也不裁切，所以列宽不到
         400px 时换短句，而不是让它从两边淌出去。 */
      E.chip(rx, dy - 8, colW, 24,
             (colW < 400
               ? E.t({ en: 'sorted, they coincide: Δ = ', zh: '排完序完全重合：差 = ' })
               : E.t({ en: 'same counts, permuted — sorted, the two profiles coincide: max Δ = ',
                       zh: '同一组计数，只是换了标签 —— 排完序两排完全重合：最大差 = ' })) +
             V.delta,
             { mono: true, color: EMERALD, fill: 'rgba(52,211,153,.07)',
               stroke: 'rgba(52,211,153,.36)', fontSize: 11 });
    }
  },
  readout: function () {
    syncIoLabels();
    const S = scene();
    const V = variantInfo();
    if (!S.hasText) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — every distribution is empty',
              zh: '没有字母 —— 每一条分布都是空的' }) + '</b>';
    }
    const ratio = V.chi > 0 ? (S.chiSub / V.chi) : 0;
    const killed = (S.iocPlain > 0.04)
      ? ((S.iocPlain - V.ioc) / (S.iocPlain - 0.04)) : 0;
    return '<span class="dim">' + E.t({ en: 'letters, χ² to flat', zh: '单字母，对均匀的 χ²' }) +
      '</span><br>' +
      '<b style="--c:var(--trace-orange)">' + S.chiSub.toFixed(0) + '</b>' +
      '<span class="dim"> ' + E.t({ en: 'substitution', zh: '单表代换' }) + '</span>' +
      '  &#8594;  ' +
      '<b style="--c:var(--trace-rose)">' + V.chi.toFixed(0) + '</b>' +
      '<span class="dim"> ' + E.t(V.label) + '   (' + ratio.toFixed(2) + '×)</span><br>' +
      '<span class="dim">' + E.t({ en: 'flat would be ', zh: '完全平坦是 ' }) +
      S.chiFloor.toFixed(0) + E.t({ en: ' — so it is flatter, not flat',
                                    zh: ' —— 所以是更平，不是平' }) + '</span><br>' +
      '<span class="dim">IoC ' + S.iocPlain.toFixed(4) + ' &#8594; ' + V.ioc.toFixed(4) +
      E.t({ en: '   ' + pct(killed) + ' of the excess gone',
            zh: '   超出随机的部分抹掉了 ' + pct(killed) }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'digraphs, sorted profiles differ by ',
                                   zh: '二元组，排序后两排相差 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + V.delta + '</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'a monoalphabetic substitution on 600 digraphs',
            zh: '这是 600 个二元组上的一次单表代换' }) + '</span>';
  }
};

/* ================= 页签三：变体 =================
   ⚠ 这一页的结论与"多加几个方阵可以把二元组统计压得更平"这个直觉**相反**，
   而页面自己会把反例算给你看：

   四方阵与二方阵同样是"一个二元组确定地映到另一个二元组"的双射，也就是说
   它们与 Playfair 一样，都是**二元组上的单表代换**。于是三者的密文二元组
   计数与明文的二元组计数是同一个多重集，三条 Δ 全部恒为 0。多两个方阵一点
   也没有压平二元组统计——playfair.test.js 里有三条断言钉着这件事。

   多出来的方阵买到的是别的东西，而且都是**结构性**的：
     · 四方阵：两个字母取自不同方阵，(a,a) 不再退化（重复对不必拆），并且
       打掉了 Playfair 那条 AB→XY 蕴含 BA→YX 的对称性。
     · 二方阵：加密与解密是同一个函数（对合），代价是**同列的二元组原样透出**
       ——大约五分之一的明文直接印在密文里。页面把这个数真的数出来。
   所以这一族是同一个想法的三个版本，差别在漏洞，不在统计。 */
const variantsTab = {
  label: { en: 'Variants', zh: '变体' },
  brand: { en: 'One idea, three constructions. What the extra squares remove is structure — not the digraph statistics.',
           zh: '同一个想法的三种造法。多出来的方阵拿走的是结构性的漏洞，不是二元组统计。' },
  tips: { en: 'Read the three Δ numbers along the bottom: all zero. Every member of the family is a monoalphabetic substitution on digraphs, so none of them flattens the digraph counts at all. Two-square pays for its self-inverse property by printing about one digraph in five in the clear.',
          zh: '看底下那三个 Δ：全是 0。这一族的每一位都是二元组上的单表代换，所以谁也没有把二元组计数压平哪怕一点。二方阵换来"加密即解密"的代价，是大约每五个二元组就有一个明文照抄在密文里。' },
  params: ['pair', 'speed'],
  presets: VARIANTS,
  presetsLabel: VARIANTS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showSquares', label: { en: 'Squares',      zh: '方阵' },     color: VIOLET,  checked: true },
    { key: 'showLeaks',   label: { en: 'What leaks',   zh: '漏了什么' }, color: ORANGE,  checked: true }
  ],
  draw: function () {
    tickClock();
    const L = layout();
    const S = scene();
    const bottom = L.H - 74;

    if (!S.hasText) {
      E.chip(L.cx - 170, L.H * 0.4, 340, 26,
             E.t({ en: 'no letters — nothing to compare', zh: '没有字母 —— 没有可比的东西' }),
             { mono: true, color: ORANGE, fill: 'rgba(251,146,60,.08)',
               stroke: 'rgba(251,146,60,.38)', fontSize: 11.5 });
      return;
    }

    const idx = curPair();
    const three = L.availW > 660;
    const colW = three ? (L.availW - 72) / 3 : Math.min(L.availW - 32, 420);
    const x0 = three ? L.cx - (L.availW - 72) / 2 - 12 : L.cx - colW / 2;
    const colGap = 12;
    const top = contentTop(L, 62);

    /* 三块的高度必须**先算出来再画**，不能画到哪算哪。第一版是"每块开画前
       判断 y + 90 是否越界"，而一块最高能到 340px——于是第三块在 y = bottom−100
       处照常开画，两个方阵直接淌出画布下沿（实测在 1079×904 的窗口上，二方阵
       的下半个方阵整个落在传输条外面）。守卫用的高度必须是真实高度。

       每块的固定部分（标题 / 去向 / 统计 / 漏洞行）是常数 baseH；变的是方阵：
       Playfair 一个方阵占 5 格高，四方阵与二方阵各占 10 格高再加一条缝。
       所以竖排时三块合计 25*cell + 常数，反解出 cell 即可。 */
    const leakLines = E.state.showLeaks ? 3 : 0;
    const baseH = 26 + 30 + 18 + leakLines * 15 + 6;
    let cell, showSq = E.state.showSquares;
    if (three) {
      cell = E.clamp(Math.min(colW / 11.5, (bottom - top - baseH - 16) / 10), 9, 22);
    } else {
      cell = Math.min(colW / 11.5, ((bottom - top) - 3 * baseH - 66) / 25);
      if (cell > 22) cell = 22;
    }
    /* 小于 9px 的格子里那个 4px 的字母谁也读不出来，画出来只是一片噪点，
       还把三块统计挤出画布。这种时候整块方阵不画——少一样东西，好过三样
       东西都看不清。 */
    if (!(cell >= 9)) showSq = false;

    const pairNS = S.pairsNS[Math.min(idx, S.pairsNS.length - 1)] || '';
    function outAt(pairs) { return pairs[Math.min(idx, pairs.length - 1)] || ''; }

    /* 一块 = 标题 + 方阵 + 当前二元组的去向 + 三四行统计。返回它用掉的高度，
       窄屏上下一块从这里接着往下排。 */
    function block(x, y, o) {
      let yy = y;
      E.chip(x, yy, colW, 20, E.t(o.title),
             { mono: true, color: o.color, fill: o.fill, stroke: o.stroke,
               fontSize: 11.5, radius: 8 });
      yy += 26;
      if (showSq) {
        yy = o.squares(x, yy, cell);
        yy += 10;
      }
      E.chip(x, yy, colW, 26, o.pairIn + '  →  ' + o.pairOut,
             { fill: CARD, stroke: LINE, color: o.same ? ORANGE : BRIGHT, fontSize: 13 });
      yy += 30;
      E.chip(x, yy, colW, 15,
             'χ² ' + o.chi.toFixed(0) + '  ·  IoC ' + o.ioc.toFixed(4) +
             '  ·  Δ ' + o.delta,
             { mono: true, color: DIM, fontSize: 10 });
      yy += 18;
      if (E.state.showLeaks) {
        for (let i = 0; i < o.lines.length; i++) {
          if (yy + 15 > bottom) break;
          E.chip(x, yy, colW, 15, E.t(o.lines[i][0]),
                 { mono: true, color: o.lines[i][1], fontSize: 10 });
          yy += 15;
        }
      }
      return yy - y;
    }

    /* 每一族的方阵画法不同——这正是"变体"要看的东西：一个、四个、还是两个。 */
    function oneSquare(x, y, cs) {
      drawSquare(x + (colW - cs * 5) / 2, y, cs, S.square, {});
      return y + cs * 5;
    }
    function fourSq(x, y, cs) {
      const w = cs * 10 + 6;
      const bx = x + (colW - w) / 2;
      drawSquare(bx, y, cs, S.four.tl, {});
      drawSquare(bx + cs * 5 + 6, y, cs, S.four.tr,
                 { textColor: function () { return 'rgba(167,139,250,.85)'; } });
      drawSquare(bx, y + cs * 5 + 6, cs, S.four.bl,
                 { textColor: function () { return 'rgba(167,139,250,.85)'; } });
      drawSquare(bx + cs * 5 + 6, y + cs * 5 + 6, cs, S.four.br, {});
      return y + cs * 10 + 6;
    }
    function twoSq(x, y, cs) {
      const bx = x + (colW - cs * 5) / 2;
      drawSquare(bx, y, cs, S.two.top, { textColor: function () { return 'rgba(167,139,250,.85)'; } });
      drawSquare(bx, y + cs * 5 + 6, cs, S.two.bottom,
                 { textColor: function () { return 'rgba(167,139,250,.85)'; } });
      return y + cs * 10 + 6;
    }

    const blocks = [
      { title: { en: 'Playfair · one square', zh: 'Playfair · 一个方阵' },
        color: ROSE, fill: 'rgba(251,113,133,.07)', stroke: 'rgba(251,113,133,.36)',
        squares: oneSquare, chi: S.chiPF, ioc: S.iocPF, delta: S.dgDeltaPF,
        pairIn: S.pairs[Math.min(idx, S.pairs.length - 1)] || '', pairOut: outAt(S.cpairs),
        same: false,
        lines: [
          [{ en: 'doubled pairs must be split (X)', zh: '重复对必须拆开（插 X）' }, 'rgba(255,47,208,.85)'],
          [{ en: 'no doubled digraph in the output: ' + S.doublesPF,
             zh: '密文里的重复对个数：' + S.doublesPF }, DIM],
          [{ en: 'AB → XY implies BA → YX', zh: 'AB → XY 蕴含 BA → YX' }, ORANGE]
        ] },
      { title: { en: 'Four-square · four squares', zh: '四方阵 · 四个方阵' },
        color: VIOLET, fill: 'rgba(167,139,250,.07)', stroke: 'rgba(167,139,250,.36)',
        squares: fourSq, chi: S.chiFour, ioc: S.iocFour, delta: S.dgDeltaFour,
        pairIn: pairNS, pairOut: outAt(S.fourPairs), same: false,
        lines: [
          [{ en: 'doubled pairs pass straight through', zh: '重复对不必拆，直接过' }, EMERALD],
          [{ en: 'doubled digraphs in the output: ' + S.doublesFour,
             zh: '密文里的重复对个数：' + S.doublesFour }, DIM],
          [{ en: 'the AB / BA symmetry is broken', zh: 'AB / BA 那条对称性被打掉了' }, EMERALD]
        ] },
      { title: { en: 'Two-square · two squares', zh: '二方阵 · 两个方阵' },
        color: EMERALD, fill: 'rgba(52,211,153,.07)', stroke: 'rgba(52,211,153,.36)',
        squares: twoSq, chi: S.chiTwo, ioc: S.iocTwo, delta: S.dgDeltaTwo,
        pairIn: pairNS, pairOut: outAt(S.twoPairs),
        same: pairNS === outAt(S.twoPairs),
        lines: [
          [{ en: 'encryption is its own inverse', zh: '加密函数自己就是解密函数' }, EMERALD],
          [{ en: 'same column → printed in the clear', zh: '同列 → 明文原样印在密文里' }, ORANGE],
          [{ en: S.twoSame + ' of ' + S.pairsNS.length + ' digraphs = ' + pct(S.twoRate),
             zh: S.pairsNS.length + ' 对里有 ' + S.twoSame + ' 对 = ' + pct(S.twoRate) }, ORANGE]
        ] }
    ];

    let y = top;
    if (three) {
      let h = 0;
      for (let i = 0; i < 3; i++) {
        h = Math.max(h, block(x0 + i * (colW + colGap), y, blocks[i]));
      }
      y += h + 14;
    } else {
      /* cell 已经是"三块一定放得下"反解出来的，所以这里不需要再判越界；
         留一条 break 只是防止将来有人改了 baseH 却忘了改这条反解式——
         画不下时宁可少一块，也不要淌出画布。 */
      for (let i = 0; i < 3; i++) {
        const h = baseH + (showSq ? (i === 0 ? cell * 5 : cell * 10 + 6) + 10 : 0);
        if (y + h > bottom) break;
        y += block(x0, y, blocks[i]) + 12;
      }
    }

    /* 判词。三个 Δ 都在上面每一块里印过了，这里说的是它们**合起来**的意思。 */
    if (y + 30 < bottom) {
      const w = Math.min(L.availW - 32, 520);
      E.chip(L.cx - w / 2, y, w, 30,
             (w < 380
               ? E.t({ en: 'all three: digraph Δ = 0', zh: '三者的二元组 Δ 都是 0' })
               : E.t({ en: 'every member is a monoalphabetic substitution on digraphs — all three Δ are 0',
                       zh: '每一位都是二元组上的单表代换 —— 三个 Δ 全是 0' })),
             { fill: 'rgba(45,212,234,.08)', stroke: 'rgba(45,212,234,.45)',
               color: CYAN, fontSize: w < 380 ? 12 : 13.5 });
    }
  },
  readout: function () {
    syncIoLabels();
    const S = scene();
    if (!S.hasText) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — nothing to compare', zh: '没有字母 —— 没有可比的东西' }) + '</b>';
    }
    return '<span class="dim">' + E.t({ en: 'digraph Δ vs plaintext', zh: '二元组 Δ（对明文）' }) +
      '</span><br>' +
      '<b style="--c:var(--trace-rose)">Playfair ' + S.dgDeltaPF + '</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-violet)">' + E.t({ en: '4-sq ', zh: '四方阵 ' }) + S.dgDeltaFour + '</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-emerald)">' + E.t({ en: '2-sq ', zh: '二方阵 ' }) + S.dgDeltaTwo + '</b><br>' +
      '<span class="dim">' +
      E.t({ en: 'more squares do not flatten digraph statistics',
            zh: '多加方阵并不会把二元组统计压平' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'letters χ²  ', zh: '单字母 χ²  ' }) + '</span>' +
      S.chiPF.toFixed(0) + ' · ' + S.chiFour.toFixed(0) + ' · ' + S.chiTwo.toFixed(0) +
      '<span class="dim">   ' + E.t({ en: 'flat ≈ ', zh: '平坦 ≈ ' }) +
      S.chiFloor.toFixed(0) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'two-square prints ', zh: '二方阵原样印出 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + S.twoSame + '/' + S.pairsNS.length + '</b>' +
      '<span class="dim"> ' + E.t({ en: 'digraphs in the clear', zh: '对明文二元组' }) +
      ' · ' + pct(S.twoRate) + '</span>' +
      (ACTIVE_NOTE ? '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>' : '');
  }
};

var SCENES = { square: squareTab, digraph: digraphTab, variants: variantsTab };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个变体并调它的 onSelect，而 readout / draw 随后立刻要读明文。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* init() 之后滑杆才存在。把「第几对」那一根接成时间轴的一个视图：
   滑杆 → seek，时间轴 → 回写滑杆（syncPair）。引擎自己的 input 监听先跑
   （buildParams 里就挂上了），把 state.pair 写成滑杆值；随后这一条把时间轴
   seek 到同一个数，于是下一次 syncPair 看到两边相等、什么也不做——不会打架。
   两根滑杆按 PARAMS 的顺序出现，所以取第 0 根；speed 那根不需要接线。 */
const ranges = document.querySelectorAll('#paramsHost input[type=range]');
pairInput = ranges[0] || null;
if (pairInput) {
  pairValEl = pairInput.parentNode.querySelector('.val');
  pairInput.addEventListener('input', function () {
    ensureTL(scene().n);
    TL.seek(parseInt(pairInput.value, 10) || 0);
  });
}
ensureTL(scene().n);
</script>
</body>
