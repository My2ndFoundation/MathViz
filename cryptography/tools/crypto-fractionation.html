const PRESET_LABEL = {
  'pangram':      { en: 'Pangram',   zh: '全字母句' },
  'attack':       { en: 'Short',     zh: '短句' },
  'caesar-quote': { en: 'Caesar',    zh: '凯撒' }
};

/* 三个页签共用**同一个数组对象**——引擎里"跨页签共享的同一份选择"那条分支
   要的就是这个形状：在任意一页换了明文，另外两页的按钮高亮跟着走。 */
const TEXT_PRESETS = EX.classical.plaintexts.map(function (p) {
  return {
    key: p.id,
    label: PRESET_LABEL[p.id] || { en: p.id, zh: p.id },
    onSelect: function () { ACTIVE_NOTE = p.note || null; setPlain(E.t(p.text), true); }
  };
});
const PRESETS_LABEL = { en: 'Text', zh: '明文' };

/* ================= 离散时钟 =================
   每页各有一条自己的"第几步"，步数随明文长度变，而 createTimeline 的 steps 是
   建表时钉死的（seek 读的是闭包里那个值，不是 tl.steps），所以步数一变就重建
   一条，并把当前 index 夹着搬过去——否则换段明文，动画会从第 0 步重新开始，
   正在看的那个字母就丢了。

   **播放与否**归引擎的 state.running（⏵/⏸ 由引擎自己绑），**走到第几步**归
   时间轴：时间轴一建好就 play() 且永不 pause()，真正的闸门是 advance() 里那个
   state.running 判断。两边各管一件事，不会出现"按钮显示暂停、画面还在动"。 */
const CLOCKS = {};
let CUR_TL = null;

function clockFor(id, steps, dur) {
  const want = Math.max(1, Math.round(steps));
  const old = CLOCKS[id];
  if (old && old.steps === want) return old;
  const tl = CryptoAnim.createTimeline({ steps: want, stepDuration: dur, loop: true, rate: 1 });
  tl.play();
  if (old) tl.seek(Math.min(old.index, want - 1));
  CLOCKS[id] = tl;
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function advance(id, steps, dur) {
  const tl = clockFor(id, steps, dur);
  tl.setRate(E.state.speed > 0 ? E.state.speed : 1);
  if (E.state.running) tl.tick(E.state.dt);
  return tl;
}

function tickClock(id, steps, dur) {
  const tl = advance(id, steps, dur);
  CUR_TL = tl;
  return tl;
}

document.getElementById('btnBack').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing 在本页
   恒为 true（真正的闸门是 advance() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { if (CUR_TL) CUR_TL.seek(0); });

/* ================= 悬停 =================
   "把鼠标停在一个字母上，看它的两半落到哪儿"是周期页的核心动作，所以指针
   位置必须是页面自己的状态。这里另挂一对监听器，**不**碰引擎的 bindOrbit()：
   那一套只在指针按下时才动相机，两者互不干扰。触摸屏上 pointermove 只在按住
   时才来，所以 pointerdown 也记一次——手指点一下同样能点亮一个格子。 */
const HOVER = { x: -1, y: -1, active: false };
(function () {
  const cv = document.getElementById('c');
  function put(e) {
    const r = cv.getBoundingClientRect();
    HOVER.x = e.clientX - r.left;
    HOVER.y = e.clientY - r.top;
    HOVER.active = true;
  }
  cv.addEventListener('pointermove', put);
  cv.addEventListener('pointerdown', put);
  cv.addEventListener('pointerleave', function () { HOVER.active = false; });
})();

/* 画面与读数必须指着**同一个**格子。命中测试要用 draw() 里那套排版几何
   （格宽、每行几个、起点在哪），readout() 手上没有这些量；在 readout() 里把
   几何重算一遍是两份真相，迟早错开。所以 draw() 把结论留在这儿，readout() 只读。 */
const CURSOR = { bifid: 0, period: 0, trifid: 0 };

/* 命中测试：一条横排的等距格子。返回列号或 −1。 */
function hitCol(x0, y0, w, h, count) {
  if (!HOVER.active) return -1;
  if (HOVER.y < y0 || HOVER.y > y0 + h) return -1;
  const c = Math.floor((HOVER.x - x0) / w);
  return (c >= 0 && c < count) ? c : -1;
}

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里是 `p.fmt(parseFloat(input.value))`。
     写成数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'period',
    label: { en: 'period <i>p</i>', zh: '周期 <i>p</i>' },
    min: 0, max: 12, step: 1, value: 5,
    /* 0 是"整段一个块"，也就是 Delastelle 的古典形态；它不是"没有周期"，
       而是"周期等于全文长度"，所以刻度上它排在 1 的左边而不是被排除。 */
    fmt: function (v) {
      const p = Math.round(v);
      return p === 0 ? E.t({ en: 'whole text', zh: '整段' }) : String(p);
    } },
  { key: 'speed',
    /* 速度不是数学量，所以不加 <i>；<i>p</i> 才是。 */
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

function currentPeriod() {
  const p = Math.round(E.state.period);
  return (p >= 0 && p <= 12) ? p : 5;      // init() 之前 state.period 还不存在
}

/* ================= 每帧一份、只在输入变了才重算的派生量 =================
   与 crypto-polybius.html 的 derived() 同一手法：不是为了省 CPU，而是为了让
   画面与读数在同一帧里读的是**同一份**结果，不会因为两次独立计算而错半帧。 */
const DERIVED = { key: null };
const PMAX = 12;                            // 锯齿柱图画到第几周期

function derived() {
  const period = currentPeriod();
  /* 缓存键用 JSON 拼，不用分隔符拼字符串：明文里什么字符都可能有，随便挑一个
     分隔符就意味着某段输入能伪造出另一段输入的键。 */
  const key = JSON.stringify([PLAIN, KEY_RAW, period]);
  if (DERIVED.key === key) return DERIVED;
  DERIVED.key = key;

  const square = PB.makeSquare(KEY_RAW);
  const cube = FR.makeCube(KEY_RAW);
  DERIVED.square = square;
  DERIVED.cube = cube;
  DERIVED.period = period;

  DERIVED.bt = FR.bifidTrace(PLAIN, square, period);
  DERIVED.tt = FR.trifidTrace(PLAIN, cube, period);
  DERIVED.plain = DERIVED.bt.plain;
  DERIVED.n = DERIVED.bt.n;

  /* 5×5 把 I 与 J 挤进同一格，J 在加密的第一步就没了（这笔账是 polybius.js 的，
     本页只是把它继续说出来）。trifid 那一页没有这笔账：27 格装得下 26 个字母。 */
  DERIVED.lostJ = (String(PLAIN).toUpperCase().match(/J/g) || []).length;

  /* period = 1 到底退没退化，**现算**，不写死：如果哪天算法改了，画面上这句
     结论会跟着变，而不是继续印一句已经不成立的话。 */
  DERIVED.degenerate = DERIVED.n > 0 && FR.bifidEncrypt(PLAIN, square, 1) === DERIVED.plain;

  /* 锯齿：第 1…12 周期各自的纠缠分量大小（首块）。structure() 只看形状、
     不跑密码，所以这 12 次调用很便宜。 */
  const saw = [];
  for (let p = 1; p <= PMAX; p++) {
    saw.push(DERIVED.n ? FR.structure(DERIVED.n, p, 2).comp[0] : 0);
  }
  DERIVED.saw = saw;
  return DERIVED;
}

/* ================= 版面 =================
   面板固定占着右边 304px，宽屏时把可用区收窄，让图形不会钻到面板底下。
   top 给 122 而不是更小：左上角那块 brand（h1 + 两行说明，max-width 到 42vw）
   底边大约就在 100px。窄屏上 brand 被压扁、页签与传输条挪到左上，所以 top 让到 176。 */
function layout() {
  const vi = E.viewInfo();
  const rightPad = vi.W > 900 ? 330 : 16;
  return {
    W: vi.W, H: vi.H,
    x0: 24,
    availW: Math.max(240, vi.W - 48 - rightPad),
    top: vi.W > 760 ? 122 : 176,
    bottom: vi.H - 86
  };
}

/* chip 把文字**居中**画，而 fillText 不裁剪：句子比盒子长时它从两头一起漫
   出去，窄屏上左端直接漫出画布。给盒子设宽度挡不住这件事——挡得住的只有换一
   句短的。 */
function fit(L, wideMsg, narrowMsg) { return L.availW < 470 ? narrowMsg : wideMsg; }

function notice(L, msg, color) {
  const c = color || ORANGE;
  E.chip(L.x0, L.top + 40, Math.min(460, L.availW), 30, msg,
         { mono: true, color: c, fill: 'rgba(251,146,60,.08)',
           stroke: 'rgba(251,146,60,.38)', fontSize: 12 });
}
function needText(L) {
  notice(L, E.t({ en: 'No letters in the plaintext yet.', zh: '明文里还没有任何字母。' }));
}

/* 规范化之后的明文/密文是一整串没有空格的字母，浏览器**无处可断行**，于是它
   会直接从面板右边溢出去。 */
function longVal(color, s) {
  return '<b style="--c:var(--trace-' + color + ');word-break:break-all">' + esc(s) + '</b>';
}

/* 找出第 i 个字母属于哪个块。blocks 是等长的（末块可短），但 period = 0 时
   只有一个块，除法会给出 0/0——所以老老实实扫一遍，块数最多也就几十个。 */
function blockAt(tr, i) {
  for (let b = 0; b < tr.blocks.length; b++) {
    const bl = tr.blocks[b];
    if (i >= bl.start && i < bl.start + bl.len) return bl;
  }
  return tr.blocks.length ? tr.blocks[0] : { start: 0, len: 0 };
}

/* 一块**上下 dims+1 行**的坐标网格要多宽：先定格宽再由空间反推一行放得下
   几列，而不是先定列数再把格宽 clamp 到下限——后者在 375px 上会把末尾几格
   画到画布外面（crypto-caesar 1.0.2 修的就是那个）。
   列数装不下整块时开一扇**窗**，窗口跟着当前列走：两行坐标那个结构是本页
   的主体，把它折行会让"上面一整行、下面一整行"这件事当场消失。 */
function bandFit(availW, count, uMax, uMin) {
  let u = Math.floor(availW / Math.max(1, count));
  u = E.clamp(u, uMin, uMax);
  const cols = Math.max(1, Math.min(count, Math.floor(availW / u)));
  return { u: u, cols: cols };
}

function windowStart(cols, count, focus) {
  if (cols >= count) return 0;
  return E.clamp(focus - Math.floor(cols / 2), 0, count - cols);
}

/* ================= 页签一：Bifid ================= */
const bifidScene = {
  label: { en: 'Bifid', zh: 'Bifid' },
  brand: { en: 'Write the coordinates in two rows, then read them off row by row. The re-pairing alone is the cipher — there is no second key.',
           zh: '把坐标写成上下两行，再一行一行地读回来。仅仅是重新配对这一步就构成了密码——没有第二把钥匙。' },
  tips: { en: 'Press ⏭ and watch one ciphertext letter at a time. The two digits it swallows are usually taken from two different plaintext letters, and often one is a row while the other is a column. ADFGX needed a whole second key (a columnar transposition) to pull the halves apart; bifid gets it out of the reading order.',
          zh: '按 ⏭ 一次看一个密文字母。它吞下的那两个数字通常取自两个不同的明文字母，而且常常一个是"行"、另一个是"列"。ADFGX 要靠第二把钥匙（一次列换位）才把两半拉开；bifid 从读取顺序里就把它拿到了。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['period', 'speed'],
  /* 本页图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎双击
     回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'bStream',  label: { en: 'Re-paired stream', zh: '重新配对' }, color: VIOLET,  checked: true },
    { key: 'bCipher',  label: { en: 'Ciphertext',       zh: '密文' },     color: ROSE,    checked: true },
    { key: 'bThreads', label: { en: 'All the threads',  zh: '全部连线' }, color: ORANGE,  checked: false }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tr = D.bt;
    const tl = tickClock('bifid', Math.max(1, D.n), 0.6);
    if (!D.n) { needText(L); return; }

    const k = tl.index % D.n;                   // 当前在做第几个密文字母
    const b = blockAt(tr, k);
    const Lb = b.len, kk = k - b.start;
    CURSOR.bifid = k;

    /* 两个数字的来源：q = 2·kk 与 2·kk+1，q < Lb 时来自"行"那一行，否则来自
       "列"那一行。colOf 把它换算成网格上的列号。 */
    const q1 = 2 * kk, q2 = 2 * kk + 1;
    function rowOfDigit(q) { return q < Lb ? 0 : 1; }
    function colOfDigit(q) { return q < Lb ? q : q - Lb; }
    function digitVal(q) {
      const c = tr.coords[b.start + colOfDigit(q)];
      return q < Lb ? c.row + 1 : c.col + 1;
    }

    const bf = bandFit(L.availW, Lb, 52, 13);
    const u = bf.u;
    const focusCol = Math.min(colOfDigit(q1), colOfDigit(q2));
    const from = windowStart(bf.cols, Lb, focusCol);
    const cols = bf.cols;
    /* 所有说明条与结论条都用**同一个宽度**：chip 把文字居中画，宽度各写各的
       就会让每一行的中心线落在不同位置，读起来像三段互不相干的东西。
       下限 360 是为了短块（周期 3 时只有三格）也不至于把句子挤成两截。 */
    const CW = Math.min(L.availW, Math.max(360, cols * u));
    /* 内容列在可用区里**居中**：宽屏上 5 列格子只占 260px，靠左吊着看起来像
       画面没画完。窄屏上 CW 就是 availW，这一项等于 0，行为不变。 */
    const gx = L.x0 + Math.max(0, (L.availW - CW) / 2);

    /* ---- 上半：明文字母 + 两行坐标 ---- */
    const yTitle = L.top - 2;
    E.chip(gx, yTitle, CW, 20,
           E.t(fit(L,
             { en: 'block ' + (Math.floor(b.start / Math.max(1, tr.len)) + 1) + ' · ' + Lb +
                   ' letters · rows on top, columns below',
               zh: '第 ' + (Math.floor(b.start / Math.max(1, tr.len)) + 1) + ' 块 · ' + Lb +
                   ' 个字母 · 上面一行是行、下面一行是列' },
             { en: Lb + ' letters · rows then columns',
               zh: Lb + ' 个字母 · 先行后列' })),
           { mono: true, color: CYAN, fontSize: 11 });

    const yL = L.top + 22;                       // 字母行
    const yR = yL + u * 1.15;                    // 行坐标
    /* 两行坐标之间留 8px 的缝：那道缝是"读完上面一整行才轮到下面一整行"这件事
       的落脚点，读取方向的箭头就画在里面。贴着画省下的 8px 换来的是箭头压在
       格子上——实测过，那条线看起来像把某一格划掉了。 */
    const yC = yR + u + 8;                       // 列坐标
    for (let c = 0; c < cols; c++) {
      const i = from + c;
      if (i >= Lb) break;
      const x = gx + c * u;
      const on = (i === colOfDigit(q1) || i === colOfDigit(q2));
      E.chip(x, yL, u, u * 1.15, tr.plain.charAt(b.start + i),
             { color: on ? BRIGHT : CYAN, fill: on ? 'rgba(226,232,240,.16)' : null,
               stroke: on ? 'rgba(45,212,234,.5)' : null, fontSize: u * 0.72, radius: 3 });
      for (let h = 0; h < 2; h++) {
        const q = h * Lb + i;
        const hot = (q === q1 || q === q2);
        E.chip(x, h === 0 ? yR : yC, u, u, String(digitVal(q)),
               { color: hot ? BRIGHT : halfColor(h),
                 fill: hot ? halfEdge(h) : halfSoft(h),
                 stroke: hot ? halfEdge(h) : 'rgba(148,163,184,.18)',
                 fontSize: u * 0.56, radius: 2 });
      }
    }
    /* 读取方向：两条箭头，一行一条。"按行读"这三个字是本页的全部机关，
       画出来比写出来管用。上面那条落在两行之间的缝里，下面那条落在网格之外。 */
    const arrowW = Math.min(cols, Lb) * u;
    E.flowArrow(gx + 2, yR + u + 4, gx + arrowW - 2, yR + u + 4,
                { color: 'rgba(167,139,250,.5)', width: 1, headLen: 6 });
    E.flowArrow(gx + 2, yC + u + 5, gx + arrowW - 2, yC + u + 5,
                { color: 'rgba(52,211,153,.5)', width: 1, headLen: 6 });
    if (cols < Lb) {
      E.chip(gx, yC + u + 10, CW, 16,
             E.t({ en: 'columns ' + (from + 1) + '–' + (from + cols) + ' of ' + Lb,
                   zh: '第 ' + (from + 1) + '–' + (from + cols) + ' 列，共 ' + Lb + ' 列' }),
             { mono: true, color: ORANGE, fontSize: 10.5 });
    }

    /* ---- 下半：重新配对出来的密文 ---- */
    const pf = bandFit(L.availW, Lb, 44, 12);
    const pu = pf.u, pcols = pf.cols;
    const pfrom = windowStart(pcols, Lb, kk);
    /* 配对带**不贴着字母带**摆：中间那一段空白正是"两个数字被读到别处去了"
       这件事本身，连线要有地方走。落点按剩下的高度按比例取，而不是写死一个
       像素数——写死的那一版在 820px 高的窗口上把下半屏整个空着。 */
    const needBelow = pu * 0.9 + pu * 1.15 + 26 + 24;
    const yPairMax = Math.max(yC + u + 60, L.bottom - needBelow);
    const yPair = E.clamp(yC + u + 12 + Math.max(90, (yPairMax - (yC + u + 12)) * 0.55),
                          yC + u + 60, yPairMax);
    const yOut = yPair + pu * 0.9;

    for (let c = 0; c < pcols; c++) {
      const kx = pfrom + c;
      if (kx >= Lb) break;
      const x = gx + c * pu;
      const on = (kx === kk);
      if (E.state.bStream) {
        for (let s = 0; s < 2; s++) {
          const q = 2 * kx + s;
          E.chip(x + s * pu / 2, yPair, pu / 2, pu * 0.9, String(digitVal(q)),
                 { color: on ? BRIGHT : halfColor(rowOfDigit(q)),
                   fill: on ? halfEdge(rowOfDigit(q)) : halfSoft(rowOfDigit(q)),
                   stroke: 'rgba(148,163,184,.16)', fontSize: pu * 0.4, radius: 2 });
        }
      }
      if (E.state.bCipher) {
        E.chip(x, yOut, pu, pu * 1.15, tr.cipher.charAt(b.start + kx),
               { color: on ? BRIGHT : ROSE,
                 fill: on ? 'rgba(251,113,133,.26)' : 'rgba(251,113,133,.09)',
                 stroke: on ? 'rgba(251,113,133,.6)' : 'rgba(251,113,133,.28)',
                 fontSize: pu * 0.68, radius: 3 });
      }
    }
    if (pcols < Lb) {
      E.chip(gx, yOut + pu * 1.15 + 2, CW, 16,
             E.t({ en: 'ciphertext ' + (pfrom + 1) + '–' + (pfrom + pcols) + ' of ' + Lb,
                   zh: '密文第 ' + (pfrom + 1) + '–' + (pfrom + pcols) + ' 个，共 ' + Lb + ' 个' }),
             { mono: true, color: ORANGE, fontSize: 10.5 });
    }

    /* ---- 连线：两个数字从上面的哪一格来 ----
       走两段：先竖直落到网格下方的同一条水平线上，再斜着奔向落点。一段直连
       会从起点就开始斜穿，把下面那行数字划掉。

       竖直那一段从**整块网格的底边**起，不从各自那一格的底边起：上面一行的
       数字若从自己格子底下出发，那条线会纵穿它正下方的列坐标格——看起来像
       把那一格划掉了，而那一格跟这条线毫无关系。哪一格是源头由格子自己的
       高亮说了算，不靠线的起点。 */
    const gridBot = yC + u + 12;
    const fanY = gridBot + 18;
    function thread(q, color, width, dash) {
      const gc = colOfDigit(q) - from;
      const pc = Math.floor(q / 2) - pfrom;
      if (gc < 0 || gc >= cols || pc < 0 || pc >= pcols) return;
      /* 同一列的行、列两个数字若同时被追，两条线会完全重合——错开 u/8，
         让"两条"看得出是两条。 */
      const ax = gx + gc * u + u / 2 + (rowOfDigit(q) === 0 ? -u / 8 : u / 8);
      const ay = gridBot;
      const bx = gx + pc * pu + (q % 2) * pu / 2 + pu / 4;
      E.flowArrow(ax, ay, ax, fanY, { color: color, width: width, head: false });
      E.flowArrow(ax, fanY, bx, yPair, { color: color, width: width, headLen: 7,
                                         dash: dash, head: !!dash });
    }
    if (E.state.bStream && E.state.bThreads) {
      /* 全部连线画的是"碎纸机"本身；字母一多就是一团噪声，而噪声证明不了
         任何事，所以只画窗口里的前 20 个。 */
      const cap = Math.min(pcols, 20);
      for (let c = 0; c < cap; c++) {
        const kx = pfrom + c;
        if (kx === kk || kx >= Lb) continue;
        thread(2 * kx, 'rgba(167,139,250,.18)', 1, null);
        thread(2 * kx + 1, 'rgba(52,211,153,.18)', 1, null);
      }
    }
    if (E.state.bStream) {
      thread(q1, halfColor(rowOfDigit(q1)), 1.8, [5, 4]);
      thread(q2, halfColor(rowOfDigit(q2)), 1.8, [5, 4]);
    }

    /* 这条说明**最后**画：它横跨整个内容列，而连线正从它左半边穿过去。
       先画的那一版实测是虚线从字上划过，像把这句话划掉了。 */
    if (E.state.bStream || E.state.bCipher) {
      E.chip(gx, yPair - 21, CW, 18,
             E.t(fit(L,
               { en: 'read row by row, then re-pair: digits 2k and 2k+1 become one letter',
                 zh: '按行读出来，再两两重新配对：第 2k 与第 2k+1 个数字合成一个字母' },
               { en: 're-paired two by two', zh: '两两重新配对' })),
             { mono: true, color: ROSE, fontSize: 11,
               fill: 'rgba(5,7,13,.82)', stroke: null });
    }

    /* ---- 结论 ---- */
    const s1 = tr.srcOf[k][0], s2 = tr.srcOf[k][1];
    const msg = (Lb === 1)
      ? fit(L,
          { en: 'block of one: the two digits are this letter own row and column — the cipher hands the plaintext straight back',
            zh: '块长为 1：那两个数字就是这个字母自己的行与列 —— 密文原样把明文还了回来' },
          { en: 'block of one — cipher = plain', zh: '块长 1 —— 密文就是明文' })
      : (s1 === s2
          ? fit(L,
              { en: 'both digits came from letter ' + (s1 + 1) + ' — the two halves stayed together this time',
                zh: '两个数字都来自第 ' + (s1 + 1) + ' 个字母 —— 这一次两半没有被拆开' },
              { en: 'both halves from letter ' + (s1 + 1), zh: '两半都来自第 ' + (s1 + 1) + ' 个' })
          : fit(L,
              { en: 'this one letter is built from letters ' + (s1 + 1) + ' and ' + (s2 + 1) +
                    ' — ' + Math.abs(s2 - s1) + ' apart in the plaintext',
                zh: '这一个密文字母由第 ' + (s1 + 1) + ' 与第 ' + (s2 + 1) +
                    ' 个明文字母合成 —— 它们在明文里相距 ' + Math.abs(s2 - s1) },
              { en: 'letters ' + (s1 + 1) + ' + ' + (s2 + 1) + ' → one',
                zh: '第 ' + (s1 + 1) + ' + 第 ' + (s2 + 1) + ' → 一个' }));
    E.chip(gx, Math.min(yOut + pu * 1.15 + 20, L.bottom - 26), CW, 24,
           E.t(msg),
           { mono: true, color: Lb === 1 ? ORANGE : BRIGHT, fontSize: 11.5,
             fill: Lb === 1 ? 'rgba(251,146,60,.08)' : 'rgba(226,232,240,.06)',
             stroke: Lb === 1 ? 'rgba(251,146,60,.38)' : 'rgba(226,232,240,.28)' });
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.n) return '<span class="dim">' + E.t({ en: 'no letters', zh: '没有字母' }) + '</span>';
    const tr = D.bt;
    const k = Math.min(CURSOR.bifid, D.n - 1);
    const s1 = tr.srcOf[k][0], s2 = tr.srcOf[k][1];
    let s = E.t({ en: 'keyword ', zh: '关键词 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + (esc(D.square.keyword) || '—') + '</i></b>' +
      '<span class="dim">  5 × 5  ·  ' + E.t({ en: 'period ', zh: '周期 ' }) +
      (D.period === 0 ? E.t({ en: 'whole text', zh: '整段' }) : D.period) +
      '  (' + tr.len + ')</span><br>' +
      E.t({ en: 'cipher letter ', zh: '密文第 ' }) +
      '<b style="--c:var(--trace-rose)"><i>' + esc(tr.cipher.charAt(k)) + '</i></b>' +
      '<span class="dim"> #' + (k + 1) + ' &#8592; </span>' +
      '<b style="--c:var(--trace-violet)"><i>' + esc(tr.plain.charAt(s1)) + '</i></b>' +
      '<span class="dim"> #' + (s1 + 1) + ' ' + E.t({ en: 'and ', zh: '与 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)"><i>' + esc(tr.plain.charAt(s2)) + '</i></b>' +
      '<span class="dim"> #' + (s2 + 1) + '</span><br>';
    if (D.lostJ) {
      s += '<b style="--c:var(--trace-orange)">' + D.lostJ +
        E.t({ en: ' J became I', zh: ' 个 J 变成了 I' }) + '</b>' +
        '<span class="dim"> — ' +
        E.t({ en: '5×5 has 25 cells; that cost is inherited from the Polybius square',
              zh: '5×5 只有 25 格，这笔账是从波利比乌斯方阵那里继承来的' }) + '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(tr.plain, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(tr.cipher, 60));
    if (ACTIVE_NOTE) s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>';
    return s;
  }
};

/* ================= 页签二：周期 —— 顿悟视角 =================
   一个字母只有两个坐标，所以它**最多**碰到两个密文字母——这个数不会随周期
   长大，工具页上的话必须照实说。真正随周期长大的是另外两个量：
     ① 两个落点之间的距离（span，等于 floor(p/2)）；
     ② 跟它纠缠在一起的明文字母数（comp）——密文字母把它的两个来源连成一条边，
        取连通分量。奇数周期把整块 p 个字母连成一体，**偶数周期恒为 2**。
   下面那张柱图画的就是 ②，锯齿一眼就看得见。period = 1 时三个量同时塌到底：
   影响集 1 个、距离 0、分量 1，而密文与明文逐字符相同。 */
const periodScene = {
  label: { en: 'Period', zh: '周期' },
  brand: { en: 'The period is the diffusion knob. At period 1 the ciphertext is the plaintext — bifid collapses into the Polybius substitution you already know is breakable.',
           zh: '周期就是扩散旋钮。周期为 1 时密文就是明文 —— bifid 塌回成那次你已经知道可破的波利比乌斯代换。' },
  tips: { en: 'Drag the period to 1 and read the ciphertext: it is the plaintext, letter for letter. Nothing was bought. Now drag it up — the two halves of one letter land further and further apart, and the bar chart shows how many plaintext letters end up entangled. Watch the sawtooth: an even period entangles only two letters no matter how big it gets, which is why the period is always taken odd.',
          zh: '把周期拖到 1，读一读密文：它就是明文，一个字母都不差。什么也没买到。再往上拖 —— 一个字母的两半落得越来越远，柱图画的是有多少个明文字母因此纠缠成一团。盯住那道锯齿：偶数周期无论多大都只纠缠两个字母，这正是周期总取奇数的原因。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['period', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'pInfluence', label: { en: 'Influence set', zh: '影响集' },   color: ROSE,    checked: true },
    { key: 'pSaw',       label: { en: 'Entanglement',  zh: '纠缠分量' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tr = D.bt;
    const tl = tickClock('period', Math.max(1, D.n), 0.75);
    if (!D.n) { needText(L); return; }

    const b0 = blockAt(tr, tl.index % D.n);
    const Lb = b0.len;
    const bf = bandFit(L.availW, Lb, 50, 14);
    const u = bf.u, cols = bf.cols;
    /* 与 bifid 页同一条纪律：说明条、柱图、结论条共用一个宽度，中心线才对得齐。
       柱图那一条另有下限（12 根柱子挤不下就没法读），所以 CW 的下限取 430。 */
    const CW = Math.min(L.availW, Math.max(430, cols * u));
    /* 内容列在可用区里**居中**：宽屏上 5 列格子只占 260px，靠左吊着看起来像
       画面没画完。窄屏上 CW 就是 availW，这一项等于 0，行为不变。 */
    const gx = L.x0 + Math.max(0, (L.availW - CW) / 2);
    const yL = L.top + 24;

    /* 悬停优先，没有悬停就跟着时钟走。 */
    const hov = hitCol(gx, yL, u, u * 3.15, cols);
    const autoJ = (tl.index % D.n) - b0.start;
    const from0 = windowStart(cols, Lb, autoJ);
    const j = hov >= 0 ? Math.min(from0 + hov, Lb - 1) : autoJ;
    const i = b0.start + j;
    CURSOR.period = i;
    const from = windowStart(cols, Lb, j);

    E.chip(gx, L.top - 2, CW, 20,
           E.t(fit(L,
             { en: 'one plaintext letter, and the ciphertext letters it can reach',
               zh: '一个明文字母，以及它能碰到的密文字母' },
             { en: 'one letter and what it reaches', zh: '一个字母能碰到什么' })),
           { mono: true, color: CYAN, fontSize: 11 });

    /* ---- 明文行 + 两行坐标 ---- */
    const yR = yL + u * 1.15, yC2 = yR + u;
    for (let c = 0; c < cols; c++) {
      const jj = from + c;
      if (jj >= Lb) break;
      const x = gx + c * u, on = (jj === j);
      E.chip(x, yL, u, u * 1.15, tr.plain.charAt(b0.start + jj),
             { color: on ? BRIGHT : CYAN, fill: on ? 'rgba(226,232,240,.18)' : null,
               stroke: on ? 'rgba(45,212,234,.55)' : null, fontSize: u * 0.7, radius: 3 });
      const co = tr.coords[b0.start + jj];
      for (let h = 0; h < 2; h++) {
        E.chip(x, h === 0 ? yR : yC2, u, u, String((h === 0 ? co.row : co.col) + 1),
               { color: halfColor(h), fill: on ? halfEdge(h) : halfSoft(h),
                 stroke: on ? halfEdge(h) : 'rgba(148,163,184,.18)',
                 fontSize: u * 0.55, radius: 2 });
      }
    }

    /* ---- 密文行 ---- */
    const yOut = yC2 + u + 96;
    const touch = tr.touch[i];
    for (let c = 0; c < cols; c++) {
      const kk = from + c;
      if (kk >= Lb) break;
      const gk = b0.start + kk;
      const lit = E.state.pInfluence && touch.indexOf(gk) >= 0;
      E.chip(gx + c * u, yOut, u, u * 1.15, tr.cipher.charAt(gk),
             { color: lit ? BRIGHT : ROSE,
               fill: lit ? 'rgba(226,232,240,.22)' : 'rgba(251,113,133,.08)',
               stroke: lit ? 'rgba(226,232,240,.55)' : 'rgba(251,113,133,.26)',
               fontSize: u * 0.7, radius: 3 });
    }

    /* ---- 两条线：这个字母的两半落到哪儿 ---- */
    if (E.state.pInfluence) {
      const fanY = yC2 + u + 26;
      for (let h = 0; h < 2; h++) {
        const dst = tr.dest[i * 2 + h];
        const gc = j - from, pc = dst - b0.start - from;
        if (gc < 0 || gc >= cols || pc < 0 || pc >= cols) continue;
        const ax = gx + gc * u + u / 2;
        const ay = (h === 0 ? yR : yC2) + u;
        E.flowArrow(ax, ay, ax, fanY, { color: halfColor(h), width: 1.8, head: false });
        E.flowArrow(ax, fanY, gx + pc * u + u / 2, yOut,
                    { color: halfColor(h), width: 1.8, headLen: 8, dash: [5, 4] });
      }
    }
    /* 说明条最后画，且带一层底：两条连线正落在它身上（三个页签同一处教训）。 */
    E.chip(gx, yOut - 21, CW, 18,
           E.t({ en: 'ciphertext of this block', zh: '这一块的密文' }),
           { mono: true, color: ROSE, fontSize: 11,
             fill: 'rgba(5,7,13,.82)', stroke: null });

    /* ---- 锯齿柱图：纠缠分量随周期 ----
       动画期间 o.max 必须显式给：不给的话每帧按当前最大值归一，柱子会集体跳。
       量程锁在 PMAX（周期最大值），奇数周期的柱高正好等于周期本身。 */
    let yy = yOut + u * 1.15 + 26;
    if (E.state.pSaw && yy + 120 < L.bottom) {
      const cw = CW;
      E.chip(gx, yy - 18, cw, 16,
             E.t(fit(L,
               { en: 'how many plaintext letters end up entangled, per period',
                 zh: '每个周期下，有多少个明文字母纠缠在一起' },
               { en: 'entangled letters per period', zh: '各周期的纠缠字母数' })),
             { mono: true, color: EMERALD, fontSize: 10.5 });
      const labels = [];
      for (let p = 1; p <= PMAX; p++) labels.push(String(p));
      E.barChart(gx, yy, cw, 76, D.saw, {
        max: PMAX, gap: 4, labels: labels, labelSize: 10,
        labelColor: 'rgba(159,176,200,.7)',
        colorAt: function (idx) {
          const p = idx + 1;
          if (p === D.period) return CYAN;
          return (p % 2 === 1) ? 'rgba(52,211,153,.62)' : 'rgba(251,146,60,.45)';
        }
      });
      yy += 76 + 20;
    }

    /* ---- 结论 ---- */
    const one = D.period === 1;
    const msg = one
      ? fit(L,
          { en: 'period 1: the ciphertext IS the plaintext — the square did nothing',
            zh: '周期 1：密文**就是**明文 —— 方阵什么也没做' },
          { en: 'period 1 — cipher = plain', zh: '周期 1 —— 密文就是明文' })
      : fit(L,
          { en: touch.length + (touch.length === 1 ? ' ciphertext letter, ' : ' ciphertext letters, ') +
                tr.span[i] + ' apart · ' +
                tr.comp[i] + ' letters entangled' +
                (tr.len % 2 === 0 ? ' — an even period entangles only 2' : ''),
            zh: '碰到 ' + touch.length + ' 个密文字母，相距 ' + tr.span[i] + ' · ' +
                tr.comp[i] + ' 个字母纠缠在一起' +
                (tr.len % 2 === 0 ? ' —— 偶数周期只纠缠 2 个' : '') },
          { en: touch.length + ' letters · span ' + tr.span[i] + ' · ' + tr.comp[i] + ' entangled',
            zh: touch.length + ' 个 · 距离 ' + tr.span[i] + ' · 纠缠 ' + tr.comp[i] });
    E.chip(gx, Math.min(yy, L.bottom - 26), CW, 24, E.t(msg),
           { mono: true, color: one ? ORANGE : BRIGHT, fontSize: 11.5,
             fill: one ? 'rgba(251,146,60,.10)' : 'rgba(226,232,240,.06)',
             stroke: one ? 'rgba(251,146,60,.45)' : 'rgba(226,232,240,.28)' });
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.n) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — nothing to diffuse', zh: '没有字母 —— 无从扩散' }) + '</b>';
    }
    const tr = D.bt;
    const i = Math.min(CURSOR.period, D.n - 1);
    let s = E.t({ en: 'period ', zh: '周期 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>p</i> = ' +
      (D.period === 0 ? E.t({ en: 'whole text', zh: '整段' }) : D.period) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'block ', zh: '块长 ' }) + tr.len + '</span><br>' +
      E.t({ en: 'letter ', zh: '第 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + esc(tr.plain.charAt(i)) + '</i></b>' +
      '<span class="dim"> #' + (i + 1) + ' &#8594; ' +
      E.t({ en: 'cipher ', zh: '密文第 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + (tr.dest[i * 2] + 1) + '</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-emerald)">' + (tr.dest[i * 2 + 1] + 1) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'reaches ', zh: '碰到 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + tr.touch[i].length + '</b>' +
      /* period 1 时这两个数都是 1，英文写 letters 就是错的。中文没有这个问题，
         所以只在 en 那一支上分单复数。 */
      '<span class="dim">' + E.t({ en: tr.touch[i].length === 1 ? ' ciphertext letter, ' : ' ciphertext letters, ',
                                   zh: ' 个密文字母，相距 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + tr.span[i] + '</b>' +
      '<span class="dim">' + E.t({ en: ' apart', zh: '' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'entangled with ', zh: '与它纠缠的共 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + tr.comp[i] + '</b>' +
      '<span class="dim">' + E.t({ en: tr.comp[i] === 1 ? ' plaintext letter' : ' plaintext letters',
                                   zh: ' 个明文字母' }) + '</span><br>';
    if (D.period === 1) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'cipher === plain', zh: '密文 === 明文' }) + '</b>' +
        '<span class="dim"> — ' +
        E.t({ en: D.degenerate ? 'verified on this text, character by character'
                               : 'NOT equal on this text — check the algorithm, not the copy',
              zh: D.degenerate ? '在这段明文上逐字符验证过'
                               : '在这段明文上并不相等 —— 该查的是算法，不是文案' }) +
        '</span><br>';
    } else if (tr.len % 2 === 0 && tr.len > 2) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'even period', zh: '偶数周期' }) + '</b>' +
        '<span class="dim"> — ' +
        E.t({ en: 'rows and columns line up again, so only 2 letters entangle',
              zh: '行段与列段重新对齐，于是只有 2 个字母纠缠' }) + '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(tr.plain, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(tr.cipher, 60));
    return s;
  }
};

/* ================= 页签三：Trifid ================= */
const trifidScene = {
  label: { en: 'Trifid', zh: 'Trifid' },
  brand: { en: 'Three coordinates instead of two: a 3×3×3 cube holds 27 cells, so every letter splits three ways and reaches three ciphertext letters.',
           zh: '三个坐标而不是两个：3×3×3 装得下 27 格，于是每个字母裂成三份，能碰到三个密文字母。' },
  tips: { en: 'Same machine, one dimension up. Each letter now writes three rows instead of two, and its thirds land on up to three different ciphertext letters spread over two thirds of the block instead of one half. The cube also has 27 cells for 26 letters, so unlike the 5×5 square nothing is merged and no J is lost.',
          zh: '同一台机器升一维。每个字母现在写三行而不是两行，三份分别落到最多三个不同的密文字母上，散布范围从半个块涨到三分之二个块。立方体有 27 格装 26 个字母，所以不像 5×5 那样要合并谁，J 也不会丢。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['period', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'tCube',   label: { en: 'The cube',   zh: '立方体' }, color: VIOLET,  checked: true },
    { key: 'tCipher', label: { en: 'Ciphertext', zh: '密文' },   color: ROSE,    checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tr = D.tt;
    const tl = tickClock('trifid', Math.max(1, tr.n), 0.75);
    if (!tr.n) { needText(L); return; }

    const i = tl.index % tr.n;
    CURSOR.trifid = i;
    const b0 = blockAt(tr, i);
    const Lb = b0.len, j = i - b0.start;
    const co = tr.coords[i];

    /* 版面宽度先算：说明条、坐标网格、密文条、结论条共用一个宽度，中心线才
       对得齐（与另外两页同一条纪律）。字母带因此要在立方体之前算出来。 */
    const bf = bandFit(L.availW, Lb, 46, 13);
    const u = bf.u, cols = bf.cols;
    const from = windowStart(cols, Lb, j);
    const CW = Math.min(L.availW, Math.max(360, cols * u));
    /* 内容列在可用区里**居中**：宽屏上 5 列格子只占 260px，靠左吊着看起来像
       画面没画完。窄屏上 CW 就是 availW，这一项等于 0，行为不变。 */
    const gx = L.x0 + Math.max(0, (L.availW - CW) / 2);

    /* ---- 立方体：三层 3×3 并排 ----
       三层并排而不是画一个透视的立方体：透视图好看，但"这个字母在第几层"
       要靠转视角才数得清，而这一页要的恰恰是当场读出三个坐标。 */
    let yy = L.top - 2;
    if (E.state.tCube) {
      const cell = E.clamp(Math.floor((CW - 2 * 18) / 9), 14, 34);
      const layerW = cell * 3;
      const cubeX = gx + Math.max(0, (CW - (3 * layerW + 2 * 18)) / 2);
      E.chip(gx, yy, CW, 18,
             E.t(fit(L,
               { en: '27 cells: layer, row, column — three numbers for one letter',
                 zh: '27 格：层、行、列 —— 一个字母三个数字' },
               { en: '27 cells · layer / row / column', zh: '27 格 · 层 / 行 / 列' })),
             { mono: true, color: VIOLET, fontSize: 11 });
      /* +36 而不是 +22：层号（cy − 15）要落在说明条**下面**，两者都只有十几像素高，
         贴太近就是两行字叠在一起。 */
      const cy = yy + 36;
      for (let a = 0; a < 3; a++) {
        const cx = cubeX + a * (layerW + 18);
        E.chip(cx, cy - 15, layerW, 14, String(a + 1),
               { mono: true, color: a === co.a ? VIOLET : DIM, fontSize: 10 });
        E.cellGrid(cx, cy, 3, 3, cell, {
          text: function (c, r) { return D.cube.cells[a * 9 + r * 3 + c]; },
          fill: function (c, r) {
            if (a === co.a && r === co.b && c === co.c) return 'rgba(226,232,240,.24)';
            if (a === co.a) return SOFT[0];
            return null;
          },
          textColor: function (c, r) {
            if (a === co.a && r === co.b && c === co.c) return BRIGHT;
            return a === co.a ? 'rgba(226,232,240,.8)' : SLATE;
          },
          stroke: LINE, fontSize: Math.max(9, cell * 0.46)
        });
      }
      yy = cy + cell * 3 + 14;
    } else {
      yy = L.top + 18;
    }

    /* ---- 明文行 + 三行坐标 ---- */
    const yL = yy + 4;
    for (let c = 0; c < cols; c++) {
      const jj = from + c;
      if (jj >= Lb) break;
      const x = gx + c * u, on = (jj === j);
      E.chip(x, yL, u, u * 1.1, tr.plain.charAt(b0.start + jj),
             { color: on ? BRIGHT : CYAN, fill: on ? 'rgba(226,232,240,.18)' : null,
               stroke: on ? 'rgba(45,212,234,.55)' : null, fontSize: u * 0.66, radius: 3 });
      const cc = tr.coords[b0.start + jj];
      const three = [cc.a, cc.b, cc.c];
      for (let h = 0; h < 3; h++) {
        E.chip(x, yL + u * 1.1 + h * u * 0.82, u, u * 0.82, String(three[h] + 1),
               { color: halfColor(h), fill: on ? halfEdge(h) : halfSoft(h),
                 stroke: on ? halfEdge(h) : 'rgba(148,163,184,.18)',
                 fontSize: u * 0.46, radius: 2 });
      }
    }
    const yGridBot = yL + u * 1.1 + 3 * u * 0.82;
    if (cols < Lb) {
      /* 这一页的 orange 归第三个坐标，所以截断提示改用中性的 slate——
         两条含义抢同一个颜色，画面就不再自证。 */
      E.chip(gx, yGridBot + 2, CW, 16,
             E.t({ en: 'columns ' + (from + 1) + '–' + (from + cols) + ' of ' + Lb,
                   zh: '第 ' + (from + 1) + '–' + (from + cols) + ' 列，共 ' + Lb + ' 列' }),
             { mono: true, color: SLATE, fontSize: 10.5 });
    }

    /* ---- 密文行 + 三条线 ---- */
    const yOut = E.clamp(yGridBot + 92, yGridBot + 52, L.bottom - u * 1.1 - 34);
    if (E.state.tCipher) {
      const touch = tr.touch[i];
      for (let c = 0; c < cols; c++) {
        const kk = from + c;
        if (kk >= Lb) break;
        const gk = b0.start + kk;
        const lit = touch.indexOf(gk) >= 0;
        E.chip(gx + c * u, yOut, u, u * 1.1, tr.cipher.charAt(gk),
               { color: lit ? BRIGHT : ROSE,
                 fill: lit ? 'rgba(226,232,240,.22)' : 'rgba(251,113,133,.08)',
                 stroke: lit ? 'rgba(226,232,240,.55)' : 'rgba(251,113,133,.26)',
                 fontSize: u * 0.66, radius: 3 });
      }
      const fanY = yGridBot + 24;
      for (let h = 0; h < 3; h++) {
        const dst = tr.dest[i * 3 + h];
        const gc = j - from, pc = dst - b0.start - from;
        if (gc < 0 || gc >= cols || pc < 0 || pc >= cols) continue;
        const ax = gx + gc * u + u / 2;
        const ay = yL + u * 1.1 + (h + 1) * u * 0.82;
        E.flowArrow(ax, ay, ax, fanY, { color: halfColor(h), width: 1.6, head: false });
        E.flowArrow(ax, fanY, gx + pc * u + u / 2, yOut,
                    { color: halfColor(h), width: 1.6, headLen: 8, dash: [5, 4] });
      }
      /* 说明条**最后**画：三条连线正从它身上横穿过去（与 bifid 页同一处教训）。 */
      E.chip(gx, yOut - 21, CW, 18,
             E.t({ en: 'ciphertext — the 27th cell can show up here',
                   zh: '密文 —— 第 27 个符号可能出现在这里' }),
             { mono: true, color: ROSE, fontSize: 11,
               fill: 'rgba(5,7,13,.82)', stroke: null });
    }

    /* ---- 结论：与 bifid 的对照 ---- */
    const bi = D.bt.n ? D.bt.touch[Math.min(i, D.bt.n - 1)].length : 0;
    E.chip(gx, Math.min(yOut + u * 1.1 + 16, L.bottom - 26), CW, 24,
           E.t(fit(L,
             { en: '3 coordinates reach ' + tr.touch[i].length + ' ciphertext letters (span ' +
                   tr.span[i] + ') · bifid reaches ' + bi + ' with the same period',
               zh: '三个坐标碰到 ' + tr.touch[i].length + ' 个密文字母（跨度 ' +
                   tr.span[i] + ') · 同样周期下 bifid 只碰到 ' + bi + ' 个' },
             { en: '3 coords → ' + tr.touch[i].length + ' letters · bifid → ' + bi,
               zh: '三坐标 → ' + tr.touch[i].length + ' 个 · bifid → ' + bi })),
           { mono: true, color: BRIGHT, fontSize: 11.5,
             fill: 'rgba(226,232,240,.06)', stroke: 'rgba(226,232,240,.28)' });
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    const tr = D.tt;
    if (!tr.n) return '<span class="dim">' + E.t({ en: 'no letters', zh: '没有字母' }) + '</span>';
    const i = Math.min(CURSOR.trifid, tr.n - 1);
    const co = tr.coords[i];
    return E.t({ en: 'keyword ', zh: '关键词 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + (esc(D.cube.keyword) || '—') + '</i></b>' +
      '<span class="dim">  3 × 3 × 3  ·  ' + E.t({ en: 'block ', zh: '块长 ' }) + tr.len + '</span><br>' +
      '<b style="--c:var(--trace-cyan)"><i>' + esc(tr.plain.charAt(i)) + '</i></b>' +
      '<span class="dim"> &#8594; </span>' +
      '<b style="--c:var(--trace-violet)">' + (co.a + 1) + '</b>' +
      '<b style="--c:var(--trace-emerald)">' + (co.b + 1) + '</b>' +
      '<b style="--c:var(--trace-orange)">' + (co.c + 1) + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'layer, row, column', zh: '层、行、列' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'thirds land at ', zh: '三份落在密文第 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + (tr.dest[i * 3] + 1) + '</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-emerald)">' + (tr.dest[i * 3 + 1] + 1) + '</b>' +
      '<span class="dim"> · </span>' +
      '<b style="--c:var(--trace-orange)">' + (tr.dest[i * 3 + 2] + 1) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'reaches ', zh: '碰到 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + tr.touch[i].length + '</b>' +
      '<span class="dim">' + E.t({ en: tr.touch[i].length === 1 ? ' letter, span ' : ' letters, span ',
                                   zh: ' 个密文字母，跨度 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + tr.span[i] + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'no I/J merge here — 27 cells hold all 26 letters',
                                   zh: '这里没有 I/J 合并 —— 27 格装得下全部 26 个字母' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(tr.plain, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(tr.cipher, 60));
  }
};

var SCENES = { bifid: bifidScene, period: periodScene, trifid: trifidScene };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个预置并调它的 onSelect，而那个回调要往 textarea 里写字。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
