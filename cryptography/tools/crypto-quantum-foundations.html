        tagChip(L.x0, yy, 15,
                E.t(r.note) + (f.truncated ? '   ' + f.n + ' / ' + REPEATS : ''),
                { mono: true, color: r.color, maxW: L.availW, fontSize: 10.5 });
        for (let i = 0; i < f.n; i++) {
          const b = r.list[i];
          E.chip(L.x0 + i * (f.cell + 3), yy + 17, f.cell, f.cell, String(b),
                 { color: b === 0 ? CYAN : ROSE,
                   fill: b === 0 ? 'rgba(45,212,234,.10)' : 'rgba(251,113,133,.10)',
                   stroke: r.ring, fontSize: f.cell * 0.6, radius: 3 });
        }
      });
      y += 82;
    }

    /* ④ 模型的诚实声明。这是教学模拟器，不是在假装实现真实硬件：理想投影测量、
       无噪声、无损耗、探测效率 100%。核心文件开头写着这句话必须由页面讲出来，
       否则使用者会带走一个"现实里也这么干净"的印象。 */
    if (y + 22 < L.bottom) {
      bandChip(L, L.bottom - 20, 18,
               E.t({ en: 'ideal projective measurement: no noise, no loss, 100% detection',
                     zh: '理想投影测量：无噪声、无损耗、探测效率 100%' }),
               { mono: true, color: 'rgba(159,176,200,.55)', fontSize: 10 });
    }
  },
  readout: function () {
    syncIo('measure');
    const S = runState();
    const n = TL.index;
    const c = counts(S, n);
    const p0 = S.p[0];
    let s = E.t({ en: 'trials ', zh: '试验 ' }) +
      '<b style="--c:var(--trace-cyan)">' + n + '</b>' +
      '<span class="dim"> / ' + TRIALS + '   ' + E.t({ en: 'seed #', zh: '种子 #' }) +
      (E.state.seed | 0) + '</span><br>';
    if (n === 0) {
      return s + '<span class="dim">' +
        E.t({ en: 'nothing measured yet — press ⏵, or step once with ⏭',
              zh: '还没测过 —— 按 ⏵，或者用 ⏭ 单步一次' }) + '</span>';
    }
    const hat = c[0] / n;
    const sd = Math.sqrt(p0 * (1 - p0) / n);
    const sig = sd > 0 ? Math.abs(hat - p0) / sd : 0;
    s += '<b style="--c:var(--trace-cyan)">' + c[0] + '</b>' +
      '<span class="dim"> : </span><b style="--c:var(--trace-rose)">' + c[1] + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'observed ', zh: '实测 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + hat.toFixed(4) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'Born ', zh: '玻恩 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + p0.toFixed(4) + '</b>' +
      '<span class="dim">   Δ = ' + (hat - p0 >= 0 ? '+' : '−') +
      Math.abs(hat - p0).toFixed(4) + '   ' + sig.toFixed(2) + 'σ</span><br>' +
      '<span class="dim">σ = √(p(1−p)/n) = ' + sd.toFixed(4) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'collapsed to ', zh: '塌缩到 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' +
      (S.first.outcome === 0 ? AXES[S.basis].pos : AXES[S.basis].neg) + '</b>' +
      '<span class="dim">   ' + E.t({ en: 're-measured in ', zh: '同基重测 ' }) +
      Q.basis(S.basis).symbol + ': </span><b style="--c:var(--trace-violet)">' +
      (S.againStuck ? E.t({ en: 'all ' + REPEATS + ' identical', zh: REPEATS + ' 次全同' })
                    : E.t({ en: 'NOT idempotent', zh: '竟然不幂等' })) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'control, basis ', zh: '负控，基 ' }) +
      Q.basis(S.other).symbol + ': </span><b style="--c:var(--trace-orange)">' +
      S.crossFlips + ' / ' + REPEATS + E.t({ en: ' flipped', zh: ' 次翻转' }) + '</b>';
    return s;
  }
};

/* ================= 页签三：偏振片 =================
   物理偏振角 θ 与 Bloch 角是 2:1 的关系（核心里 fromPolarisation 那一段写着
   这件事）：|θ⟩ = cosθ|H⟩ + sinθ|V⟩，在 Bloch 球上落在 (sin2θ, 0, cos2θ)。
   所以"两片差 90°"在 Bloch 球上是差 180°、正对着——那才是"完全挡住"的几何
   理由，也是这一页与第一页看的是同一个平面的原因。 */
const POL_SLOTS = 5;                   // 光源 + 三片 + 出射

function polState() {
  const a = [E.state.polA, E.state.polB, E.state.polC];
  const mid = !!E.state.showMid;
  const i1 = 0.5;                      // 未偏振光过第一片：恒为一半，与角度无关
  const i2 = mid ? i1 * Q.malus(a[1] - a[0]) : i1;
  const i3 = i2 * Q.malus(a[2] - (mid ? a[1] : a[0]));
  return { a: a, mid: mid, I: [1, i1, i2, i3] };
}

/* 一片偏振片：圆框 + 一道透光轴。角度按屏幕坐标画（y 向下，所以取负号），
   0° 是水平——与 fromPolarisation(0) = |H⟩ 对得上。 */
function drawFilter(cx, cy, r, deg, color) {
  E.chip(cx - r, cy - r, 2 * r, 2 * r, '',
         { radius: r, stroke: color, fill: 'rgba(167,139,250,.06)', width: 1.6 });
  const t = -deg * DEG, ux = Math.cos(t), uy = Math.sin(t);
  E.flowArrow(cx - ux * r * 0.82, cy - uy * r * 0.82,
              cx + ux * r * 0.82, cy + uy * r * 0.82,
              { head: false, color: color, width: 2.4 });
}

const polarise = {
  label: { en: 'Polarisers', zh: '偏振片' },
  brand: { en: 'Two crossed filters pass nothing. Put a third one between them and light comes through — the extra filter did not let light past, it changed what the light was.',
           zh: '两片正交的偏振片什么也不透。在它们中间再加一片，光反而过来了——第三片不是放光过去，它改变了光本身。' },
  tips: { en: 'Start on "Crossed": 0° then 90°, output zero. Now tick "middle filter" — one more obstacle at 45°, and a quarter of the first filter\'s light gets out. Each filter is a measurement: it re-prepares the photon along its own axis, and the next filter only ever sees that new state.',
          zh: '先看"正交"：0° 接 90°，出射是 0。现在勾上"中间那片"——多了一个 45° 的障碍物，第一片透过的光反而有四分之一跑了出来。每一片都是一次测量：它把光子重新制备到自己的轴上，下一片看见的只有这个新的态。' },
  params: ['polA', 'polB', 'polC', 'speed'],
  presets: [
    { key: 'crossed', label: { en: 'Crossed', zh: '正交' },
      onSelect: function () {
        setParam('polA', 0); setParam('polB', 45); setParam('polC', 90);
        setToggle('showMid', false);
      } },
    { key: 'three', label: { en: 'Insert 45°', zh: '插入 45°' },
      onSelect: function () {
        setParam('polA', 0); setParam('polB', 45); setParam('polC', 90);
        setToggle('showMid', true);
      } },
    { key: 'aligned', label: { en: 'Aligned', zh: '同向' },
      onSelect: function () {
        setParam('polA', 0); setParam('polB', 0); setParam('polC', 0);
        setToggle('showMid', true);
      } }
  ],
  presetsLabel: { en: 'Setup', zh: '配置' },
  views: {
    iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 }
  },
  toggles: [
    { key: 'showMid',   label: { en: 'Middle filter', zh: '中间那片' }, color: ORANGE, checked: false },
    { key: 'showBeam',  label: { en: 'Photon flow', zh: '光子流' }, color: CYAN, checked: true },
    { key: 'showMalus', label: { en: 'Malus cos²', zh: '马吕斯 cos²' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const L = layout(vi);
    const P = polState();

    const f = E.fitCells(L.availW, POL_SLOTS, { gap: 12, min: 42, max: 132 });
    if (f.n < POL_SLOTS) {
      /* 放不下就明说，而不是让画布边缘去吃掉最后一片滤光片。 */
      bandChip(L, L.top + 20, 26,
               E.t({ en: 'viewport too narrow for the bench — turn the device sideways',
                     zh: '视口太窄，放不下这条光路 —— 请把设备横过来' }),
               { mono: true, color: ORANGE, fill: 'rgba(251,146,60,.08)',
                 stroke: 'rgba(251,146,60,.38)', fontSize: 11 });
      return;
    }
    const startX = L.x0 + (L.availW - f.total) / 2;
    const slotX = function (i) { return startX + i * (f.cell + 12) + f.cell / 2; };
    const beamY = L.top + Math.min(150, L.h * 0.30);
    const rad = Math.min(f.cell * 0.40, 44);

    /* ① 光路。每一段的粗细与亮度按这一段的强度走——"少了多少光"是看出来的，
       不是读出来的。 */
    for (let i = 0; i < POL_SLOTS - 1; i++) {
      const I = P.I[i];
      const xa = slotX(i) + (i === 0 ? f.cell * 0.28 : rad);
      const xb = slotX(i + 1) - (i + 1 === POL_SLOTS - 1 ? f.cell * 0.28 : rad);
      if (xb <= xa) continue;
      const alpha = (0.12 + 0.62 * I).toFixed(3);
      E.flowArrow(xa, beamY, xb, beamY, {
        head: false, width: Math.max(1.2, 1.2 + 6 * I),
        color: i === 0 ? 'rgba(159,176,200,' + alpha + ')' : 'rgba(45,212,234,' + alpha + ')'
      });
      /* 光子流：位置由累计相位决定，没有一处随机——同一时刻的画面可复现。 */
      if (E.state.showBeam) {
        const k = Math.round(9 * I);
        for (let j = 0; j < k; j++) {
          const x = xa + (xb - xa) * ((BEAM + j / k) % 1);
          E.chip(x - 2, beamY - 2, 4, 4, '',
                 { radius: 2, fill: i === 0 ? 'rgba(159,176,200,.85)' : CYAN });
        }
      }
    }

    /* ② 光源 */
    E.chip(slotX(0) - f.cell * 0.30, beamY - 16, f.cell * 0.60, 32, '',
           { radius: 6, stroke: LINE, fill: 'rgba(148,163,184,.10)' });
    tagChip(slotX(0) - f.cell * 0.5, beamY + 26, 16,
            E.t({ en: 'unpolarised', zh: '未偏振' }),
            { mono: true, color: SLATE, maxW: f.cell + 30, fontSize: 10 });

    /* ③ 三片滤光片。中间那片没插上时画成空的虚框——版面不跳，"少了一片"这件事
       才看得出来。 */
    for (let k = 0; k < 3; k++) {
      const i = k + 1;
      const on = (k !== 1) || P.mid;
      const col = k === 1 ? ORANGE : VIOLET;
      if (on) {
        drawFilter(slotX(i), beamY, rad, P.a[k], col);
      } else {
        E.chip(slotX(i) - rad, beamY - rad, 2 * rad, 2 * rad, '',
               { radius: rad, stroke: 'rgba(148,163,184,.28)', width: 1 });
        E.chip(slotX(i) - rad, beamY - 9, 2 * rad, 18, E.t({ en: 'out', zh: '未插' }),
               { mono: true, color: 'rgba(159,176,200,.45)', fontSize: 10 });
      }
      E.chip(slotX(i) - rad, beamY + rad + 4, 2 * rad, 18,
             Math.round(P.a[k]) + '°',
             { color: on ? col : 'rgba(159,176,200,.45)', fontSize: Math.min(14, rad * 0.42) });
      /* 与上一片的夹角：马吕斯定律吃的就是这个差。 */
      if (on && i > 1) {
        const prev = (k === 2 && !P.mid) ? P.a[0] : P.a[k - 1];
        let d = Math.abs(((P.a[k] - prev) % 180 + 180) % 180);
        if (d > 90) d = 180 - d;
        E.chip(slotX(i) - rad, beamY + rad + 22, 2 * rad, 16, 'Δ ' + Math.round(d) + '°',
               { mono: true, color: EMERALD, fontSize: 10 });
      }
    }

    /* ④ 每一段的强度。**按缝隙数**，不是按槽位数：5 个槽之间有 4 条缝，
       第 g 条缝上的强度是 P.I[g]（P.I 只有 4 项：出源、过 F1、过 F2、过 F3）。
       第一版这里写的是 for (i = 1; i < POL_SLOTS; i++) 取 P.I[i]，于是最后一次
       读到 P.I[4] = undefined，`undefined.toFixed` 当场抛——而引擎的帧级兜底
       把它吞成一行 console.warn，画面上的表现只是"下面两块内容不见了"，
       完全不像一个异常。检查控制台，不要只看画面。 */
    for (let g = 0; g < POL_SLOTS - 1; g++) {
      const I = P.I[g];
      const x = (slotX(g) + slotX(g + 1)) / 2;
      const w = Math.min(f.cell + 10, 76);
      E.chip(x - w / 2, beamY - rad - 26, w, 18, I.toFixed(4),
             { mono: true, fontSize: 10.5,
               color: g === 0 ? SLATE : (I > 1e-9 ? EMERALD : ROSE) });
    }
    E.chip(slotX(POL_SLOTS - 1) - f.cell * 0.30, beamY - 16, f.cell * 0.60, 32, '',
           { radius: 6, stroke: P.I[3] > 1e-9 ? 'rgba(52,211,153,.45)' : 'rgba(251,113,133,.45)',
             fill: P.I[3] > 1e-9 ? 'rgba(52,211,153,.10)' : 'rgba(251,113,133,.08)' });
    tagChip(slotX(POL_SLOTS - 1) - f.cell * 0.5, beamY + 26, 16,
            E.t({ en: 'out', zh: '出射' }),
            { mono: true, color: P.I[3] > 1e-9 ? EMERALD : ROSE,
              maxW: f.cell + 30, fontSize: 10 });

    /* ⑤ 结论那一行：出射相对第一片透过量的比。经典的 ¼ 就在这里。 */
    const ratio = P.I[1] > 0 ? P.I[3] / P.I[1] : 0;
    bandChip(L, beamY + rad + 48, 24,
             E.t({ en: 'out / after filter 1 = ', zh: '出射 / 第一片之后 = ' }) + ratio.toFixed(4) +
             (P.mid ? E.t({ en: '   (three filters)', zh: '   （三片）' })
                    : E.t({ en: '   (middle one removed)', zh: '   （中间那片拿掉了）' })),
             { mono: true, fill: CARD, stroke: LINE, fontSize: 12,
               color: ratio > 1e-9 ? EMERALD : ROSE });

    /* ⑥ 马吕斯曲线 cos²Δ：实际用到的每个 Δ 各钉一个点，"为什么 45° 那么特别"
       因此是读出来的，不是背下来的。 */
    if (E.state.showMalus) {
      const cw = Math.min(320, L.availW);
      const cx0 = L.cx - cw / 2, cy0 = beamY + rad + 84;
      const ch = Math.min(84, Math.max(52, L.bottom - cy0 - 20));
      if (cy0 + ch + 18 < L.bottom) {
        E.chip(cx0, cy0, cw, ch, '', { stroke: LINE, fill: 'rgba(8,13,24,.45)', radius: 6 });
        const pts = [];
        for (let d = 0; d <= 90; d += 2) pts.push([cx0 + cw * (d / 90), cy0 + ch * (1 - Q.malus(d))]);
        polyline2(pts, { color: EMERALD, width: 1.8, maxSeg: 46 });
        const marks = P.mid ? [[P.a[1] - P.a[0], ORANGE], [P.a[2] - P.a[1], VIOLET]]
                            : [[P.a[2] - P.a[0], VIOLET]];
        marks.forEach(function (m) {
          let d = Math.abs(((m[0] % 180) + 180) % 180);
          if (d > 90) d = 180 - d;
          const mx = cx0 + cw * (d / 90), my = cy0 + ch * (1 - Q.malus(d));
          E.flowArrow(mx, cy0 + ch, mx, my, { head: false, color: m[1], width: 1.2, dash: [3, 3] });
          E.glowDot([mx, my], 9, m[1], 'rgba(0,0,0,0)');
        });
        E.chip(cx0, cy0 + ch + 1, cw, 15, 'cos²Δ     0°  →  90°',
               { mono: true, color: DIM, fontSize: 10 });
      }
    }
  },
  readout: function () {
    syncIo('polarise');
    const P = polState();
    /* 同一个数，两条完全独立的路：经典光学的 cos²Δ 与量子力学的玻恩规则。
       把它们并排印出来，是因为一旦哪天不相等了，页面自己会说出来——这是
       第 5 章第一页那座桥，核心的测试里也有一条断言把两边钉在一起。 */
    const prevAngle = P.mid ? P.a[1] : P.a[0];
    const d = P.a[2] - prevAngle;
    const born = Q.probabilityOf(Q.fromPolarisation(P.a[2]), Q.fromPolarisation(prevAngle));
    const ratio = P.I[1] > 0 ? P.I[3] / P.I[1] : 0;
    let s = '<span class="dim">' + E.t({ en: 'unpolarised in ', zh: '入射未偏振 ' }) + '</span>' +
      '<b>1.0000</b><br>' +
      '<b style="--c:var(--trace-cyan)">' + P.I[1].toFixed(4) + '</b>' +
      '<span class="dim"> → </span>' +
      '<b style="--c:var(--trace-orange)">' + P.I[2].toFixed(4) + '</b>' +
      '<span class="dim"> → </span>' +
      '<b style="--c:var(--trace-emerald)">' + P.I[3].toFixed(4) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'out / after filter 1 = ', zh: '出射 / 第一片后 = ' }) +
      '</span><b style="--c:var(--trace-emerald)">' + ratio.toFixed(4) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'last step Δ = ', zh: '最后一步 Δ = ' }) +
      Math.round(d) + '°</span><br>' +
      '<span class="dim">cos²Δ = </span>' +
      '<b style="--c:var(--trace-emerald)">' + Q.malus(d).toFixed(6) + '</b><br>' +
      '<span class="dim">|⟨φ₂|φ₁⟩|² = </span>' +
      '<b style="--c:var(--trace-emerald)">' + born.toFixed(6) + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'Born rule, same number', zh: '玻恩规则，同一个数' }) +
      '</span>';
    if (!P.mid) {
      s += '<br><span class="dim">' +
        E.t({ en: 'middle filter removed', zh: '中间那片没插上' }) + '</span>';
    }
    return s;
  }
};

var SCENES = { bloch: bloch, measure: measure, polarise: polarise };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中第一个
   预置并调它的 onSelect。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

/* init() 之后滑杆才存在。把它们收进 SLIDERS，好让门与预置按钮能把值写回去——
   面板上的数字与画面必须是同一个真相。PARAMS 的顺序与 buildParams() 生成的
   .ctl 顺序一一对应（引擎就是照着 PARAMS.forEach 建的）。 */
(function bindSliders() {
  const wraps = document.querySelectorAll('#paramsHost .ctl');
  PARAMS.forEach(function (p, i) {
    const wrap = wraps[i];
    if (!wrap) return;
    SLIDERS[p.key] = { input: wrap.querySelector('input[type=range]'),
                       val: wrap.querySelector('.val'), p: p };
  });
  /* buildPresets() 在 init() 里已经跑过一轮（偏振页的"正交"），那时 SLIDERS
     还是空的，只写进了 E.state。这里把模型推回滑杆，两边就对上了。 */
  syncAllSliders();
  /* 手动拖 θ / φ 等于重新制备一个态，上一次门的轴与弧不再成立。 */
  ['theta', 'phi'].forEach(function (k) {
    const s = SLIDERS[k];
    if (s) s.input.addEventListener('input', clearGate);
  });
})();
</script>
