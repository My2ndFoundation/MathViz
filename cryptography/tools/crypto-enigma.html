/* #ioHost 里的标签是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言
   切换不会自动重刷它们。引擎在 applyLang() 末尾会调 updateReadout()，所以把
   这次同步挂在 readout() 里搭车——不管语言是怎么变的，readout 都会跟着重算。
   顺带在这里做按页签的显隐：crib 输入框只在第三页有意义。 */
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }
function syncIo() {
  const mc = machines();
  setText(ioMsgLabel, E.t({ en: 'Message — only letters reach the keyboard',
                            zh: '报文 —— 只有字母能上键盘' }));
  setText(ioPlugLabel, E.t({ en: 'Steckerbrett — pairs, e.g. AV BS CG',
                             zh: '插线板 —— 成对写，如 AV BS CG' }));
  setText(ioCribLabel, E.t({ en: 'Crib — a guess at the plaintext',
                             zh: 'Crib —— 对明文的一段猜测' }));
  const showCrib = (CURTAB === 'weakness');
  if (ioCribWrap) ioCribWrap.style.display = showCrib ? '' : 'none';
  if (ioScanWrap) ioScanWrap.style.display = showCrib ? '' : 'none';
  const btnScan = document.getElementById('btnScanAll');
  if (btnScan) setText(btnScan, E.t({ en: 'judge every position at once',
                                      zh: '一次判完所有位置' }));

  const bits = [];
  bits.push(E.t({ en: 'plugs ', zh: '插线 ' }) + mc.plugs.length + '/13');
  if (mc.dropped.length) {
    bits.push(E.t({ en: 'ignored: ', zh: '未采纳：' }) +
              mc.dropped.map(function (d) { return d.token; }).join(' '));
  }
  if (mc.fixed) {
    bits.push(E.t({ en: 'two slots picked ' + mc.fixed.from + ' — one box holds one of each, so the second became ' + mc.fixed.to,
                    zh: '两个槽都选了 ' + mc.fixed.from + '，箱子里每种只有一个，第二个已换成 ' + mc.fixed.to }));
  }
  const a = msgAnalysis();
  if (a.truncated) {
    bits.push(E.t({ en: 'message cut to ' + MSG_CAP + ' letters',
                    zh: '报文已截到 ' + MSG_CAP + ' 个字母' }));
  }
  setText(ioNote, bits.join(' · '));
  textBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
  plugBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
}

/* ================= 第一页：一次按键的电流回路 ================= */
/* 六条竖直触点轨。rail 0 是键盘/灯泡那一侧，rail 4 是反射器那一侧；
   两条相邻轨之间夹着一个部件：
     rail0–rail1  插线板      rail1–rail2  右转子
     rail2–rail3  中转子      rail3–rail4  左转子     rail4 右侧  反射器
   转子 slot s（0=左）占的是 rail(3−s) → rail(4−s)。 */
function railGeom(B, top) {
  const lx = B.x + 26;
  const rx = B.x + B.w - 54;
  return { lx: lx, rx: rx, top: top,
           x: function (k) { return lx + (rx - lx) * k / 4; } };
}

function drawPath() {
  const a0 = msgAnalysis();
  const i = tickClock('path', Math.max(1, a0.plain.length));
  const vi = E.viewInfo();
  const B = contentBox(vi);
  const a = msgAnalysis();
  if (!a.plain.length) {
    emptyCard(B, { en: 'Type a message, then press ⏵ or ⏭.', zh: '先输入一段报文，再按 ⏵ 或 ⏭。' });
    return;
  }
  const idx = Math.min(i, a.plain.length - 1);
  const m = machineAt(idx + 1);
  const tr = a.traces[idx];

  /* ---- 报文条：明文一行、密文一行 ---- */
  const f = E.fitCells(B.w, a.plain.length, { gap: 2, min: 11, max: 20 });
  const s0 = E.clamp(idx - Math.floor(f.n / 2), 0, Math.max(0, a.plain.length - f.n));
  const stripY = B.y;
  for (let k = 0; k < f.n; k++) {
    const j = s0 + k;
    const x = B.x + k * (f.cell + 2);
    const on = (j === idx);
    chipFit(x, stripY, f.cell, f.cell, a.plain.charAt(j),
            { stroke: on ? CYAN : LINE, fill: on ? 'rgba(45,212,234,.16)' : null,
              color: on ? CYAN : DIM, fontSize: f.cell * 0.56 });
    chipFit(x, stripY + f.cell + 3, f.cell, f.cell, a.cipher.charAt(j),
            { stroke: on ? ROSE : LINE, fill: on ? 'rgba(251,113,133,.16)' : null,
              color: on ? ROSE : DIM, fontSize: f.cell * 0.56 });
  }
  /* 截断必须**说出来**，不能交给画布边缘去吃掉。
     这里不再重复窗口字母（BLB 那三个）——每个转子的标签上已经印着它自己那
     一个，而在 375px 上这条说明放不下，chipFit 会把末尾截成省略号，被截掉的
     恰好就是那三个字母。同一件事只说一遍，窄屏上就不必挑该牺牲哪一半。 */
  caption(B.x, stripY + 2 * f.cell + 6, B.w,
          E.t({ en: 'letters ', zh: '字母 ' }) + (s0 + 1) + '–' + (s0 + f.n) +
          ' / ' + a.plain.length +
          (f.truncated ? E.t({ en: ' (windowed)', zh: '（窗口显示）' }) : '') +
          '   ·   ' + E.t({ en: 'keypress ', zh: '第 ' }) + (idx + 1) +
          E.t({ en: '', zh: ' 次按键' }));

  /* ---- 触点轨 ----
     底部要给"按下 X → 点亮 Y"那张卡片让出 34px：不让的话最后一行触点会被
     卡片压住，而画面上看起来像是字母表少了一个 Z。 */
  const railTop = stripY + 2 * f.cell + 30;
  const railBot = B.y + B.h - 34;
  const rf = E.fitCells(railBot - railTop - 22, CC.N, { gap: 2, min: 8, max: 19 });
  const G = railGeom(B, railTop + 20);
  const pitch = rf.cell + 2;
  const yOf = function (r) { return G.top + r * pitch + rf.cell / 2; };
  const visible = function (r) { return r >= 0 && r < rf.n; };

  /* 部件名（含窗口字母：转子上写着它此刻转到哪儿了） */
  const names = [
    { x: (G.x(0) + G.x(1)) / 2, s: E.t({ en: 'plugboard', zh: '插线板' }), c: ORANGE },
    { x: (G.x(1) + G.x(2)) / 2, s: m.rotors[2] + ' · ' + tr.windows.charAt(2), c: VIOLET },
    { x: (G.x(2) + G.x(3)) / 2, s: m.rotors[1] + ' · ' + tr.windows.charAt(1), c: VIOLET },
    { x: (G.x(3) + G.x(4)) / 2, s: m.rotors[0] + ' · ' + tr.windows.charAt(0), c: VIOLET },
    { x: G.rx + 30, s: 'UKW-' + m.reflector, c: VIOLET }
  ];
  const nw = Math.min(88, (G.rx - G.lx) / 4 - 4);
  names.forEach(function (n) {
    /* 最右那个反射器标签的中心在 rx + 30，在 375px 上会伸出内容区右沿——
       夹回来，宁可紧贴边也不画出去。 */
    const nx = E.clamp(n.x - nw / 2, B.x, B.x + B.w - nw);
    chipFit(nx, railTop, nw, 17, n.s, { color: n.c, fontSize: 11, mono: true });
  });

  /* 触点：每条轨 26 个（放不下时如实少画几行并在下面说明） */
  for (let k = 0; k <= 4; k++) {
    for (let r = 0; r < rf.n; r++) dot(G.x(k), yOf(r), 1.4, 'rgba(148,163,184,.30)');
  }
  /* 左侧字母表 */
  for (let r = 0; r < rf.n; r++) {
    const isIn = (r === tr.in), isOut = (r === tr.out);
    chipFit(B.x, yOf(r) - rf.cell / 2, 20, rf.cell, CC.ALPHABET.charAt(r),
            { color: isIn ? CYAN : (isOut ? ROSE : FAINT),
              fontSize: Math.min(13, rf.cell * 0.82), weight: (isIn || isOut) ? 600 : null });
  }

  /* ---- 可选的"全部接线" ---- */
  if (E.state.showWiring) {
    for (let s = 2; s >= 0; s--) {
      const map = EN.rotorMap(m, s, 'fwd');
      for (let c = 0; c < CC.N; c++) {
        if (!visible(c) || !visible(map[c])) continue;
        seg(G.x(3 - s), yOf(c), G.x(4 - s), yOf(map[c]),
            { color: 'rgba(167,139,250,.16)', width: 1 });
      }
    }
  }
  if (E.state.showPlugs) {
    for (let c = 0; c < CC.N; c++) {
      const d = m.plugs[c];
      if (d === c || d < c) continue;
      if (!visible(c) || !visible(d)) continue;
      seg(G.x(0), yOf(c), G.x(1), yOf(d), { color: 'rgba(251,146,60,.45)', width: 1.3 });
      seg(G.x(0), yOf(d), G.x(1), yOf(c), { color: 'rgba(251,146,60,.45)', width: 1.3 });
    }
  }
  if (E.state.showRefl) {
    const rmap = EN.REFLECTORS[m.reflector].map;
    for (let c = 0; c < CC.N; c++) {
      const d = rmap[c];
      if (d < c || !visible(c) || !visible(d)) continue;
      const bow = 16 + Math.abs(d - c) * pitch * 0.28;
      curve(G.rx, yOf(c), G.rx + bow, (yOf(c) + yOf(d)) / 2, G.rx, yOf(d),
            { color: 'rgba(167,139,250,.22)', width: 1, steps: 8 });
    }
  }

  /* ---- 去程 / 回程 ---- */
  const fwdPts = [], backPts = [];
  for (let k = 0; k <= 4; k++) {
    if (visible(tr.railsFwd[k])) fwdPts.push([G.x(k), yOf(tr.railsFwd[k])]);
    if (visible(tr.railsBack[k])) backPts.push([G.x(k), yOf(tr.railsBack[k])]);
  }
  poly(fwdPts, { color: CYAN, width: 2.4 });
  fwdPts.forEach(function (p) { dot(p[0], p[1], 3.2, CYAN); });

  /* 反射器那一道折返：整条路径唯一"掉头"的地方，也是"没有字母映到自己"的
     全部来源——两端的触点必然不同，因为 UKW 没有不动点。 */
  if (visible(tr.railsFwd[4]) && visible(tr.railsBack[4])) {
    const y1 = yOf(tr.railsFwd[4]), y2 = yOf(tr.railsBack[4]);
    const bow = 26 + Math.abs(tr.railsFwd[4] - tr.railsBack[4]) * pitch * 0.30;
    curve(G.rx, y1, G.rx + bow, (y1 + y2) / 2, G.rx, y2,
          { color: VIOLET, width: 2.4, steps: 14 });
    dot(G.rx, y2, 3.2, VIOLET);
  }
  if (E.state.showBack) {
    poly(backPts.slice().reverse(), { color: ROSE, width: 2.4 });
    backPts.forEach(function (p) { dot(p[0], p[1], 3.0, ROSE); });
  }

  /* ---- 键与灯 ---- */
  const cardY = B.y + B.h - 26;
  const cw = Math.min(300, B.w);
  chipFit(B.x, cardY, cw, 24,
          E.t({ en: 'key ', zh: '按下 ' }) + tr.inLetter + '   →   ' +
          E.t({ en: 'lamp ', zh: '点亮 ' }) + tr.outLetter + '    ·    ' +
          tr.inLetter + ' → ' + tr.inLetter + ' ' + E.t({ en: 'impossible', zh: '不可能' }),
          { fill: CARD, stroke: 'rgba(255,47,208,.35)', color: BRIGHT, fontSize: 12 });
  if (rf.truncated) {
    caption(B.x + cw + 10, cardY + 4, Math.max(60, B.w - cw - 10),
            E.t({ en: 'rows A–' + CC.ALPHABET.charAt(rf.n - 1) + ' / 26 (short viewport)',
                  zh: '只画得下 A–' + CC.ALPHABET.charAt(rf.n - 1) + ' / 26 行（窗口太矮）' }),
            ORANGE);
  }
}

/* ================= 第二页：进位机构 ================= */
function drawStepping() {
  const i = tickClock('stepping', STEP_MAX);
  const vi = E.viewInfo();
  const B = contentBox(vi);
  const mc = machines();
  const m = machineAt(i);
  const plan = EN.stepPlan(m);
  const w = EN.windows(m);

  /* ---- 三个窗口 ---- */
  const wf = E.fitCells(Math.min(B.w, 430), 3, { gap: 16, min: 46, max: 112 });
  const wx = B.x + (B.w - wf.total) / 2;
  const wy = B.y + 18;
  const willMove = [plan.left, plan.middle, plan.right];
  for (let s = 0; s < 3; s++) {
    const x = wx + s * (wf.cell + 16);
    const R = EN.ROTORS[mc.rotors[s]];
    const atNotch = (m.pos[s] === R.notchIndex);
    caption(x, wy - 16, wf.cell, mc.rotors[s] + ['  L', '  M', '  R'][s], SLATE, 11);
    chipFit(x, wy, wf.cell, wf.cell, w.charAt(s),
            { fill: willMove[s] ? 'rgba(45,212,234,.12)' : CARD,
              stroke: atNotch ? ORANGE : (willMove[s] ? CYAN : LINE),
              width: atNotch ? 2 : 1,
              color: atNotch ? ORANGE : BRIGHT, fontSize: wf.cell * 0.52 });
    caption(x, wy + wf.cell + 4, wf.cell,
            E.t({ en: 'notch ', zh: '缺口 ' }) + R.notch, atNotch ? ORANGE : DIM, 10.5);
    if (willMove[s]) {
      E.flowArrow(x + wf.cell / 2, wy + wf.cell + 22, x + wf.cell / 2, wy + wf.cell + 36,
                  { color: plan.doubleStep && s <= 1 ? ORANGE : CYAN, width: 1.6 });
    }
  }
  const verdict = plan.doubleStep
    ? E.t({ en: 'double step — the middle rotor sits on its own notch, so it is carried a second time and drags the left rotor with it',
            zh: '双步进 —— 中转子正停在自己的缺口上，于是被再推一格，同时把左转子一起带走' })
    : (plan.rightAtNotch
        ? E.t({ en: 'the right rotor is on its notch: this keypress carries the middle rotor',
                zh: '右转子正在缺口上：这一次按键会把中转子推一格' })
        : E.t({ en: 'only the right rotor moves on this keypress',
                zh: '这一次按键只有右转子动' }));
  chipFit(B.x, wy + wf.cell + 40, B.w, 22, verdict,
          { fill: CARD, stroke: plan.doubleStep ? ORANGE : LINE,
            color: plan.doubleStep ? ORANGE : SLATE, fontSize: 11.5 });

  /* ---- 进位磁带 ---- */
  /* 行高吃掉可用空间（上限 46）而不是钉死 24，整块再在剩下的带子里居中：
     原来磁带贴着上沿、与底部的周期卡片之间空着两百多像素，看上去像少画了
     什么东西。窗口越高，格子越大，而不是空白越大。 */
  const bandTop = wy + wf.cell + 74;
  const bandBot = B.y + B.h - 60;
  const band = Math.max(70, bandBot - bandTop);
  if (E.state.showTape) {
    const want = 21;
    const tf = E.fitCells(B.w, want, { gap: 3, min: 15, max: 34 });
    const half = Math.floor(tf.n / 2);
    const t0 = E.clamp(i - half, 0, Math.max(0, STEP_MAX - tf.n));
    const rowH = E.clamp(band / 4.4, 15, 46);
    const blockH = 3 * (rowH + 2) + 32;
    const tapeY = bandTop + Math.max(0, (band - blockH) / 2);
    const tx = B.x + (B.w - tf.total) / 2;
    caption(B.x, tapeY - 15, B.w,
            E.t({ en: 'keypress ', zh: '按键 ' }) + (t0 + 1) + '–' + (t0 + tf.n) +
            ' / ' + STEP_MAX +
            (tf.truncated ? E.t({ en: ' (windowed)', zh: '（窗口显示）' }) : ''), DIM);
    for (let k = 0; k < tf.n; k++) {
      const st = t0 + k;
      const x = tx + k * (tf.cell + 3);
      /* 第 st 列画的是**按下 st 次之后**的窗口，与上方那三个大窗口在 st === i
         时是同一份状态。曾经这里画的是 machineAt(st + 1)，于是"当前列"比大
         窗口超前一步——两个都对，但同屏出现两种含义就是错的。
         "这一格动了没有"因此要跟前一列比；"这一步是不是双步进"要问的是**产生
         这一列的那次按键**的进位计划，也就是 stepPlan(machineAt(st − 1))。 */
      const now = machineAt(st);
      const prev = machineAt(Math.max(0, st - 1));
      const pl = EN.stepPlan(prev);
      const hotStep = (st > 0) && pl.doubleStep;
      const cur = (st === i);
      for (let s = 0; s < 3; s++) {
        const moved = (st > 0) && (prev.pos[s] !== now.pos[s]);
        const hot = hotStep && s <= 1;
        chipFit(x, tapeY + s * (rowH + 2), tf.cell, rowH,
                CC.ALPHABET.charAt(now.pos[s]),
                { fill: moved ? (hot ? 'rgba(251,146,60,.20)' : 'rgba(45,212,234,.13)') : null,
                  stroke: cur ? CYAN : (moved ? (hot ? ORANGE : 'rgba(45,212,234,.35)') : LINE),
                  width: cur ? 1.8 : 1,
                  color: moved ? (hot ? ORANGE : CYAN) : DIM,
                  fontSize: Math.min(rowH * 0.6, tf.cell * 0.56) });
      }
      if (hotStep) {
        chipFit(x, tapeY + 3 * (rowH + 2) + 2, tf.cell, 13, '▲',
                { color: ORANGE, fontSize: 9 });
      }
    }
    caption(B.x, tapeY + 3 * (rowH + 2) + 17, B.w,
            E.t({ en: '▲ = double step · a cell lights up on the keypress that moved that rotor',
                  zh: '▲ = 双步进 · 某一格亮起，表示这一次按键推动了那个转子' }), DIM);
  }

  /* ---- 周期卡片 ---- */
  if (E.state.showPeriod) {
    const cyc = cycleLength();
    const ds = doubleSteps();
    const py = B.y + B.h - 44;
    const stuck = (cyc >= CYCLE_CAP);
    const msg = stuck
      ? E.t({ en: 'from this start the windows never come back: the middle rotor sits on its notch, one of the 676 states that cannot be entered',
              zh: '从这个起点回不到原地：中转子正停在缺口上，那是 676 个进不去的状态之一' })
      /* 措辞按 375px 定长：这条卡片在窄屏上原本会被 chipFit 截成省略号，而被
         截掉的恰好是"不是 26³"那半句——整条卡片的重点。短句在宽屏上一样成立，
         所以不做分档，直接写短的。 */
      : '26 × 25 × 26 = 16900  ·  ' +
        E.t({ en: 'measured ', zh: '实测 ' }) + cyc +
        E.t({ en: '  ·  not 26³ = 17576', zh: '  ·  而不是 26³ = 17576' });
    chipFit(B.x, py, B.w, 22, msg,
            { fill: CARD, stroke: stuck ? ORANGE : EMERALD,
              color: stuck ? ORANGE : EMERALD, fontSize: 11.5 });
    caption(B.x, py + 24, B.w,
            E.t({ en: 'double steps at keypress ', zh: '双步进在第 ' }) +
            (ds.length ? ds.map(function (d) { return d + 1; }).join(' · ') : '—') +
            E.t({ en: '  (every 676)', zh: ' 次按键（每 676 次）' }), DIM);
  }
}

/* ================= 第三页：顿悟视角 ================= */
let WK_PITCH = 16;              // 上一帧的密文格距，拖拽换算成"移动几个位置"要用
let WK_TOTAL = 1;

function drawWeakness() {
  const cr0 = cribAnalysis();
  const off = tickClock('weakness', Math.max(1, cr0.rows.length));
  const vi = E.viewInfo();
  const B = contentBox(vi);
  const a = msgAnalysis();
  const cr = cribAnalysis();

  if (!a.cipher.length) {
    emptyCard(B, { en: 'Type a message first.', zh: '先输入一段报文。' });
    return;
  }
  if (!cr.ok) {
    emptyCard(B, { en: 'The crib must have at least one letter and be no longer than the ciphertext.',
                   zh: 'crib 至少要有一个字母，且不能比密文还长。' });
    return;
  }
  const row = cr.rows[Math.min(off, cr.rows.length - 1)];
  cr.scanned[row.offset] = 1;
  WK_TOTAL = cr.rows.length;

  /* ---- 标题 ----
     结论一行、理由一行，而不是挤成一句：挤成一句时 375px 上 chipFit 会把
     末尾截成省略号，被截掉的正好是"没有字母加密成它自己"这句结论本身。
     拆成两行之后两截都放得下，排版上也更像它本来的样子——一句断言加一个理由。 */
  chipFit(B.x, B.y, B.w, 22,
          E.t({ en: 'no letter is ever enciphered as itself',
                zh: '没有任何字母会加密成它自己' }),
          { fill: CARD, stroke: 'rgba(255,47,208,.40)', color: MAGENTA, fontSize: 12 });
  caption(B.x, B.y + 22, B.w,
          E.t({ en: 'because the reflector has no fixed point',
                zh: '因为反射器没有不动点' }), DIM, 10.5);

  /* ---- 密文条 + crib 条 ---- */
  const f = E.fitCells(B.w, a.cipher.length, { gap: 2, min: 12, max: 24 });
  WK_PITCH = f.cell + 2;
  /* 窗口以 crib 为中心，但**绝不把 crib 的第一个字母推到窗外**：crib 比窗口
     宽时（375px 上窗口只有 23 格、crib 有 25 个字母）居中会同时切掉头和尾，
     而使用者是从头读起的。宁可只露出前半截。 */
  const centre = row.offset + Math.floor(cr.crib.length / 2);
  const s0 = Math.min(row.offset,
                      E.clamp(centre - Math.floor(f.n / 2), 0,
                              Math.max(0, a.cipher.length - f.n)));
  /* 42 而不是 34：标题下面那行理由（B.y + 22 起、16 高）到 B.y + 38 才收尾，
     34 会让密文的第一行字母压在它上面。 */
  const cy = B.y + 42;
  for (let k = 0; k < f.n; k++) {
    const j = s0 + k;
    const x = B.x + k * (f.cell + 2);
    const inCrib = (j >= row.offset && j < row.offset + cr.crib.length);
    const cj = j - row.offset;
    const clash = inCrib && (a.cipher.charCodeAt(j) === cr.crib.charCodeAt(cj));
    chipFit(x, cy, f.cell, f.cell, a.cipher.charAt(j),
            { stroke: clash ? MAGENTA : (inCrib ? 'rgba(251,113,133,.55)' : LINE),
              fill: clash ? 'rgba(255,47,208,.18)' : null,
              color: clash ? MAGENTA : ROSE, fontSize: f.cell * 0.56 });
    if (inCrib) {
      chipFit(x, cy + f.cell + 4, f.cell, f.cell, cr.crib.charAt(cj),
              { stroke: clash ? MAGENTA : 'rgba(45,212,234,.55)',
                fill: clash ? 'rgba(255,47,208,.18)' : 'rgba(45,212,234,.10)',
                color: clash ? MAGENTA : CYAN, fontSize: f.cell * 0.56 });
      if (clash && E.state.showClash) {
        /* 撞车的那一位：一道贯穿两格的斜杠。这是全页唯一用 --trace-unpaired
           的地方——"这一位没有对手、这个位置不该存在"。 */
        seg(x + 1, cy + 1, x + f.cell - 1, cy + 2 * f.cell + 3, { color: MAGENTA, width: 1.6 });
      }
    }
  }
  caption(B.x, cy + 2 * f.cell + 8, B.w,
          E.t({ en: 'cipher ', zh: '密文 ' }) + (s0 + 1) + '–' + (s0 + f.n) +
          ' / ' + a.cipher.length +
          (f.truncated ? E.t({ en: ' · drag to slide', zh: ' · 可拖动' }) : '') +
          ' · ' + E.t({ en: 'crib at ', zh: 'crib 在 ' }) + row.offset);

  /* ---- 判决 ----
     同样是结论一行、理由一行。合成一句时最长的那一条（"位置 N 存活，而这里
     我们恰好握着明文……"）在 375px 上会被截掉后半截，而后半截才是理由。 */
  const vy = cy + 2 * f.cell + 26;
  const isTrue = (row.offset === cr.trueOffset);
  const verdict = row.possible
    ? (isTrue
        ? E.t({ en: 'position ' + row.offset + ' survives — and it is the true one',
                zh: '位置 ' + row.offset + ' 存活 —— 而它就是真实位置' })
        : E.t({ en: 'position ' + row.offset + ' is not ruled out',
                zh: '位置 ' + row.offset + ' 没有被排除' }))
    : E.t({ en: 'position ' + row.offset + ' is impossible — ' + row.clashes.length +
                (row.clashes.length === 1 ? ' self-match' : ' self-matches'),
            zh: '位置 ' + row.offset + ' 不可能 —— ' + row.clashes.length + ' 处撞车' });
  const why = row.possible
    ? (isTrue
        ? E.t({ en: 'we happen to hold the plaintext here — the correct alignment can never clash',
                zh: '我们在这里恰好握着明文 —— 正确的对齐永远不会撞车' })
        : E.t({ en: 'it survives this test; ruling it out takes another one',
                zh: '它扛住了这一关；要排除它得靠别的手段' }))
    : E.t({ en: 'crib index ' + row.clashes[0] + ': ' +
                cr.crib.charAt(row.clashes[0]) + ' would have to encipher as itself',
            zh: 'crib 第 ' + row.clashes[0] + ' 位：' +
                cr.crib.charAt(row.clashes[0]) + ' 得加密成它自己才行' });
  chipFit(B.x, vy, B.w, 24, verdict,
          { fill: CARD,
            stroke: row.possible ? (isTrue ? EMERALD : 'rgba(52,211,153,.45)') : MAGENTA,
            color: row.possible ? EMERALD : MAGENTA, fontSize: 12 });
  caption(B.x, vy + 25, B.w, why, row.possible ? 'rgba(52,211,153,.75)' : 'rgba(255,47,208,.72)', 10.5);

  /* ---- 位置判定条 ---- */
  /* 这一条占满剩下的高度：它是这一页的主体。一格 = 一个位置，播放时逐格判定，
     品红的那些在不知道任何设置的情况下就已经死了。 */
  if (E.state.showLedger) {
    const ly = vy + 60;
    const lh = E.clamp(B.y + B.h - ly - 74, 30, 340);
    const lf = E.fitCells(B.w, cr.rows.length, { gap: 0, min: 2, max: 9 });
    /* 图例写短：这一行在 375px 上原本会被 chipFit 截掉末尾的位置总数。 */
    caption(B.x, ly - 16, B.w,
            E.t({ en: 'green = possible · magenta = struck out · ',
                  zh: '绿 = 尚可能 · 品红 = 已划掉 · ' }) +
            (lf.truncated ? E.t({ en: 'showing 1–' + lf.n + ' / ' + cr.rows.length,
                                  zh: '只画得下 1–' + lf.n + ' / ' + cr.rows.length })
                          : cr.rows.length + E.t({ en: ' positions', zh: ' 个位置' })), DIM);
    seg(B.x, ly + lh + 0.5, B.x + lf.total, ly + lh + 0.5, { color: LINE, width: 1 });
    for (let k = 0; k < lf.n; k++) {
      const r = cr.rows[k];
      const x = B.x + k * lf.cell;
      const done = cr.scanned[k];
      const col = !done ? 'rgba(148,163,184,.16)' : (r.possible ? EMERALD : MAGENTA);
      const h = !done ? lh * 0.20 : (r.possible ? lh : lh * 0.42);
      E.chip(x, ly + lh - h, Math.max(1.2, lf.cell - 0.6), h, '',
             { fill: col, radius: 0.8 });
    }
    if (row.offset < lf.n) {
      seg(B.x + row.offset * lf.cell + lf.cell / 2, ly - 7,
          B.x + row.offset * lf.cell + lf.cell / 2, ly + lh + 5, { color: CYAN, width: 1.6 });
    }
    if (E.state.showTrue && cr.trueOffset >= 0 && cr.trueOffset < lf.n) {
      ring(B.x + cr.trueOffset * lf.cell + lf.cell / 2, ly + lh + 10, 4, EMERALD, 1.6);
      caption(B.x, ly + lh + 18, B.w,
              E.t({ en: '○ the true position — it survives, and it had to',
                    zh: '○ 真实位置 —— 它活着，而且必然活着' }), EMERALD);
    }
  }

  /* ---- 统计 ----
     故意放在 showLedger 之外：关掉判定条是为了看清上面那两行字母，不是为了
     把结论也一起藏起来。 */
  const s = cr.stats;
  let scanned = 0;
  for (let k = 0; k < cr.scanned.length; k++) scanned += cr.scanned[k];
  /* 两行，不是一行：一行在 375px 上会被截掉尾巴，而尾巴上挂着的正是理论值
     ——实测与理论并排才是这一页要给的证据，少了哪一半都不成立。 */
  chipFit(B.x, B.y + B.h - 46, B.w, 22,
          E.t({ en: 'struck out ', zh: '已划掉 ' }) + s.eliminated + ' / ' + s.total +
          ' = ' + pct(s.eliminatedFraction) + '   ·   ' +
          E.t({ en: 'survivors ', zh: '存活 ' }) + s.survivors +
          ' = ' + pct(s.survivors / s.total),
          { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 11 });
  chipFit(B.x, B.y + B.h - 22, B.w, 20,
          E.t({ en: 'theory (25/26)^', zh: '理论 (25/26)^' }) + cr.crib.length +
          ' = ' + pct(s.expectedSurvivorRate) + '   ·   ' +
          E.t({ en: 'judged ', zh: '已判定 ' }) + scanned + ' / ' + s.total,
          { color: DIM, fontSize: 10.5, mono: true });
}

/* ================= 拖拽 =================
   引擎的 bindOrbit(canvas) 也绑在同一块画布上，它会把拖拽解释成转相机——
   本页三个页签全是屏幕坐标的 2D 图元，相机转了画面一个像素都不变，所以两者
   并存是安全的，不需要再叠一层透明覆盖元素。这里只在第三页把水平位移换算
   成"crib 滑过几个位置"。 */
let DRAG_ACC = 0;
IX.bind(document.getElementById('c'), {
  onDrag: function (info) {
    if (CURTAB !== 'weakness') return;
    DRAG_ACC += info.dx;
    const pitch = Math.max(4, WK_PITCH);
    while (Math.abs(DRAG_ACC) >= pitch) {
      TL.step(DRAG_ACC > 0 ? 1 : -1);
      DRAG_ACC -= (DRAG_ACC > 0 ? pitch : -pitch);
    }
  },
  onDragEnd: function () { DRAG_ACC = 0; }
});

/* 引擎的 bindKeyboard() 占了 T 与 1–9，刻意把 Space 与方向键留给工具。 */
IX.bindKeys({
  ' ': function () { const b = document.getElementById('btnPlay'); if (b) b.click(); },
  ArrowLeft: function () { TL.step(-1); },
  ArrowRight: function () { TL.step(1); }
});

/* ================= 页签 ================= */
const VIEW_ISO = { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } };

var SCENES = {
  path: {
    label: { en: 'Path', zh: '电流路径' },
    brand: { en: 'One keypress, the whole machine: plugboard, three rotors, the reflector, and all the way back.',
             zh: '一次按键就是整台机器：插线板、三个转子、反射器，再原路折回来。' },
    tips: { en: 'Watch the violet turn at the far right. The reflector never sends a contact back to itself — that single fact is what the third tab is about.',
            zh: '看最右边那道紫色折返。反射器绝不会把一个触点送回它自己——第三页讲的就是这一件事。' },
    params: ['r0', 'r1', 'r2', 'refl', 'g0', 'g1', 'g2', 'p0', 'p1', 'p2', 'speed'],
    views: VIEW_ISO,
    toggles: [
      { key: 'showBack', label: { en: 'Return current', zh: '回程电流' }, color: ROSE, checked: true },
      { key: 'showRefl', label: { en: 'Reflector pairing', zh: '反射器配对' }, color: VIOLET, checked: false },
      { key: 'showWiring', label: { en: 'All rotor wiring', zh: '转子全部接线' }, color: EMERALD, checked: false },
      { key: 'showPlugs', label: { en: 'Plugboard wires', zh: '插线板连线' }, color: ORANGE, checked: true }
    ],
    draw: drawPath,
    readout: function () {
      syncIo();
      const a = msgAnalysis();
      if (!a.plain.length) return '<span class="dim">' + E.t({ en: 'no message', zh: '还没有报文' }) + '</span>';
      const idx = Math.min(TL.index, a.plain.length - 1);
      const tr = a.traces[idx];
      const mc = machines();
      const rows = [];
      rows.push('<span class="dim">' + E.t({ en: 'key ', zh: '按下 ' }) + '</span>' +
                '<b style="--c:var(--trace-cyan)"><i>' + tr.inLetter + '</i></b>' +
                ' &#8594; <span class="dim">' + E.t({ en: 'lamp ', zh: '点亮 ' }) + '</span>' +
                '<b style="--c:var(--trace-rose)"><i>' + tr.outLetter + '</i></b>');
      rows.push('<span class="dim">' + E.t({ en: 'windows ', zh: '窗口 ' }) + '</span>' +
                '<b style="--c:var(--trace-violet)">' + tr.windows + '</b>' +
                ' <span class="dim">' + mc.rotors.join(' ') + ' · UKW-' + mc.reflector + '</span>');
      const st = tr.stages;
      rows.push('<span class="dim">' + E.t({ en: 'via ', zh: '经过 ' }) + '</span>' +
                st.map(function (s) { return CC.ALPHABET.charAt(s.out); }).join('&#8202;'));
      rows.push('<b style="--c:var(--trace-unpaired)">' + tr.inLetter + ' &#8800; ' +
                tr.outLetter + '</b> <span class="dim">' +
                E.t({ en: 'always — no letter is its own cipher', zh: '恒成立 —— 没有字母是自己的密文' }) +
                '</span>');
      rows.push('<span class="dim">' + E.t({ en: 'self-hits over the whole message: ',
                                             zh: '整段报文里自己撞自己的次数：' }) + '</span>' +
                '<b style="--c:var(--trace-emerald)">' + a.selfHits + '</b>' +
                ' <span class="dim">/ ' + a.plain.length + '</span>');
      rows.push('<span class="dim">' + (a.check
        ? E.t({ en: '✓ path and encrypt() agree letter for letter', zh: '✓ 路径与 encrypt() 逐字节一致' })
        : E.t({ en: '✗ path and encrypt() disagree', zh: '✗ 路径与 encrypt() 不一致' })) + '</span>');
      return rows.join('<br>');
    }
  },

  stepping: {
    label: { en: 'Stepping', zh: '进位' },
    brand: { en: 'The right rotor turns every keypress. The notches do the rest — and the middle rotor pays for it twice.',
             zh: '右转子每次按键都转。剩下的交给缺口——而中转子要为此多付一次。' },
    tips: { en: 'Press "1st double step". The middle rotor advances on two consecutive keypresses, so it can only rest on 25 of its 26 positions: 26 × 25 × 26 = 16900, not 26³.',
            zh: '按「第一次双步进」。中转子在连续两次按键里都进了位，于是 26 格里只停得住 25 格：26 × 25 × 26 = 16900，不是 26³。' },
    params: ['r0', 'r1', 'r2', 'p0', 'p1', 'p2', 'speed'],
    views: VIEW_ISO,
    presets: JUMP_PRESETS,
    presetsLabel: { en: 'Jump to', zh: '跳到' },
    toggles: [
      { key: 'showTape', label: { en: 'Stepping tape', zh: '进位磁带' }, color: ROSE, checked: true },
      { key: 'showPeriod', label: { en: 'Period card', zh: '周期卡片' }, color: VIOLET, checked: true }
    ],
    draw: drawStepping,
    readout: function () {
      syncIo();
      const i = TL.index;
      const mc = machines();
      const m = machineAt(i);
      const plan = EN.stepPlan(m);
      const cyc = cycleLength();
      const rows = [];
      rows.push('<span class="dim">' + E.t({ en: 'keypresses so far ', zh: '已按下 ' }) + '</span>' +
                '<b style="--c:var(--trace-cyan)">' + i + '</b>' +
                ' <span class="dim">' + E.t({ en: '· windows ', zh: '· 窗口 ' }) + '</span>' +
                '<b style="--c:var(--trace-violet)">' + EN.windows(m) + '</b>');
      rows.push('<span class="dim">' + E.t({ en: 'next keypress moves ', zh: '下一次按键会推动 ' }) + '</span>' +
                '<b style="--c:var(--trace-cyan)">' +
                [plan.left ? mc.rotors[0] : null, plan.middle ? mc.rotors[1] : null,
                 mc.rotors[2]].filter(Boolean).join(' + ') + '</b>');
      if (plan.doubleStep) {
        rows.push('<b style="--c:var(--trace-orange)">' +
                  E.t({ en: 'double step', zh: '双步进' }) + '</b> <span class="dim">' +
                  E.t({ en: 'the middle rotor is on its own notch ' + EN.ROTORS[mc.rotors[1]].notch,
                        zh: '中转子停在自己的缺口 ' + EN.ROTORS[mc.rotors[1]].notch + ' 上' }) + '</span>');
      }
      rows.push('<span class="dim">' + E.t({ en: 'position period ', zh: '位置周期 ' }) + '</span>' +
                (cyc >= CYCLE_CAP
                  ? '<b style="--c:var(--trace-orange)">' + E.t({ en: 'never returns', zh: '回不去' }) + '</b>'
                  : '<b style="--c:var(--trace-emerald)">' + cyc + '</b>') +
                ' <span class="dim">= 26 × 25 × 26 &#8800; 26³ = 17576</span>');
      rows.push('<span class="dim">' + E.t({ en: 'rotor orders 5·4·3 = 60 · ring settings 26³ · start 26³',
                                             zh: '转子排列 5·4·3 = 60 · 环位 26³ · 起始位置 26³' }) + '</span>');
      return rows.join('<br>');
    }
  },

  weakness: {
    label: { en: 'Weakness', zh: '弱点' },
    brand: { en: 'Nothing about the key space fell. What fell was a structural property that leaked at every single position.',
             zh: '倒下的不是密钥空间。倒下的是一条在每一个位置上都漏信息的结构性质。' },
    tips: { en: 'Press ⏵ and watch the ledger fill with magenta — 88.6% of positions die without knowing one single setting. Then walk down the crib row: the kill rate is exactly 1 − (25/26)^L, so it depends only on how long your guess is.',
            zh: '按 ⏵，看判定条一格格变成品红 —— 88.6% 的位置在不知道任何一项设置的情况下就死了。再顺着 crib 那一行按下去：命中率恰好是 1 − (25/26)^L，只取决于猜测有多长。' },
    params: ['r0', 'r1', 'r2', 'refl', 'g0', 'g1', 'g2', 'p0', 'p1', 'p2', 'speed'],
    views: VIEW_ISO,
    presets: CRIB_PRESETS.map(function (c) {
      return { key: c.key, label: c.label,
               onSelect: function () { setCrib(c.crib, true); if (CR.scanned) CR.scanned.fill(0); } };
    }),
    presetsLabel: { en: 'Crib', zh: '猜测明文' },
    toggles: [
      { key: 'showClash', label: { en: 'Clash marks', zh: '撞车标记' }, color: ROSE, checked: true },
      { key: 'showLedger', label: { en: 'Position ledger', zh: '位置判定条' }, color: VIOLET, checked: true },
      { key: 'showTrue', label: { en: 'True position', zh: '真实位置' }, color: EMERALD, checked: true }
    ],
    draw: drawWeakness,
    readout: function () {
      syncIo();
      const cr = cribAnalysis();
      if (!cr.ok) {
        return '<span class="dim">' + E.t({ en: 'crib too long, or empty', zh: 'crib 为空或比密文还长' }) + '</span>';
      }
      const s = cr.stats;
      const row = cr.rows[Math.min(TL.index, cr.rows.length - 1)];
      const rows = [];
      rows.push('<span class="dim">' + E.t({ en: 'crib ', zh: 'crib ' }) + '</span>' +
                '<b style="--c:var(--trace-cyan)">' + esc(cr.crib.slice(0, 22)) +
                (cr.crib.length > 22 ? '…' : '') + '</b>' +
                ' <span class="dim">(' + cr.crib.length + ')</span>');
      rows.push('<span class="dim">' + E.t({ en: 'position ', zh: '位置 ' }) + '</span>' +
                '<b style="--c:var(--trace-cyan)">' + row.offset + '</b> ' +
                (row.possible
                  ? '<b style="--c:var(--trace-emerald)">' + E.t({ en: 'possible', zh: '尚可能' }) + '</b>'
                  : '<b style="--c:var(--trace-unpaired)">' + E.t({ en: 'impossible', zh: '不可能' }) +
                    '</b> <span class="dim">(' + row.clashes.length +
                    E.t({ en: ' clash', zh: ' 处撞车' }) + ')</span>'));
      rows.push('<span class="dim">' + E.t({ en: 'struck out ', zh: '划掉 ' }) + '</span>' +
                '<b style="--c:var(--trace-unpaired)">' + s.eliminated + '</b>' +
                '<span class="dim"> / ' + s.total + ' = ' + pct(s.eliminatedFraction) + '</span>');
      rows.push('<span class="dim">' + E.t({ en: 'survivors ', zh: '存活 ' }) + '</span>' +
                '<b style="--c:var(--trace-emerald)">' + s.survivors + '</b>' +
                '<span class="dim"> = ' + pct(s.survivors / s.total) +
                E.t({ en: ' · theory (25/26)^', zh: ' · 理论 (25/26)^' }) + cr.crib.length +
                ' = ' + pct(s.expectedSurvivorRate) + '</span>');
      rows.push('<span class="dim">' +
                (cr.trueOffset >= 0
                  ? E.t({ en: 'the true position is ' + cr.trueOffset + ' — and it survives, as it must',
                          zh: '真实位置是 ' + cr.trueOffset + ' —— 它活着，而且必然活着' })
                  : E.t({ en: 'this crib does not occur in the message: every position is a genuine candidate to eliminate',
                          zh: '这段 crib 不在报文里：每个位置都是货真价实的待排除项' })) + '</span>');
      return rows.join('<br>');
    }
  }
};

buildIO();
E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
/* buildIO() 在 init() 之前跑（它要建好 #ioHost 里那几个输入框），但
   applySetting() 要写的滑杆是 init() 里的 buildParams() 才建出来的——所以
   预置的机器设置在这里再落一次。顺序不能反：init() 之前没有滑杆可写，
   init() 之后 buildIO() 又会把已经写好的报文覆盖回去。 */
applySetting(TEXTS[1].set);
</script>
</body>
</html>
