  ioKey = document.getElementById('ioKey');
  ioKeyLabel = document.getElementById('ioKeyLabel');
  ioKey.value = KEYWORD_RAW;
  ioText.addEventListener('input', function () {
    ACTIVE_NOTE = null;
    setPlain(ioText.value, false);
    /* 一动手打字，预置按钮的选中态就不再成立了。三个页签共享同一份 presets
       数组（同一个对象引用），所以对任意一个页签调用一次就会同步到全部。 */
    E.syncPresetHighlight('grid', null);
  });
  ioKey.addEventListener('input', function () {
    KEYWORD_RAW = ioKey.value;
    DERIVED.key = null;
  });
  const row = document.getElementById('ioKeyRow');
  KEY_PRESETS.forEach(function (kw) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = kw;
    b.addEventListener('click', function () {
      KEYWORD_RAW = kw;
      ioKey.value = kw;
      DERIVED.key = null;
    });
    row.appendChild(b);
  });
}

/* #ioHost 的标签是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言切换
   不会自动重刷它。引擎在 applyLang() 末尾会调 updateReadout()，所以把这次
   同步挂在 readout() 里搭车——不管语言是怎么变的，readout 都会跟着重算一次。 */
function syncIoLabels() {
  if (ioLabel) {
    const s = E.t({ en: 'Plaintext — letters only, nothing is padded',
                    zh: '明文 —— 只留字母，不做任何填充' });
    if (ioLabel.textContent !== s) ioLabel.textContent = s;
  }
  if (ioKeyLabel) {
    const s = E.t({ en: 'Keyword — its letter order is the column order',
                    zh: '关键词 —— 它的字母顺序就是列的读出顺序' });
    if (ioKeyLabel.textContent !== s) ioKeyLabel.textContent = s;
  }
}

const PRESET_LABEL = {
  'pangram':      { en: 'Pangram',   zh: '全字母句' },
  'attack':       { en: 'Short',     zh: '短句' },
  'caesar-quote': { en: 'Caesar',    zh: '凯撒' }
};

/* 三个页签共用**同一个数组对象**——引擎里"跨页签共享的同一份选择"那条分支
   要的就是这个形状：在任意一页换了明文，另外两页的按钮高亮跟着走。 */
const TEXT_PRESETS = EX.classical.plaintexts.map(function (p) {
  return {
    key: p.id,
    label: PRESET_LABEL[p.id] || { en: p.id, zh: p.id },
    onSelect: function () { ACTIVE_NOTE = p.note || null; setPlain(E.t(p.text), true); }
  };
});
const PRESETS_LABEL = { en: 'Text', zh: '明文' };

/* ================= 三个离散时钟 =================
   三页各有一条自己的"第几步"：grid 走列（steps = 列数）、rails 走字母
   （steps = 字母数）、frequency 走字母表（steps = 26）。步数随明文与关键词
   变，而 createTimeline 的 steps 是建表时钉死的（seek 读的是闭包里那个值，
   不是 tl.steps），所以步数一变就重建一条，并把当前 index 夹着搬过去——
   否则换个关键词，动画会从第 0 列重新开始，正在看的那一列就丢了。

   **播放与否**归引擎的 state.running（⏵/⏸ 由引擎自己绑），**走到第几步**
   归时间轴：时间轴一建好就 play() 且永不 pause()，真正的闸门是 tickClock()
   里那个 state.running 判断。两边各管一件事，不会出现"按钮显示暂停、画面
   还在动"。 */
const CLOCKS = {};
let CUR_TL = null;

function clockFor(id, steps, dur) {
  const want = Math.max(1, Math.round(steps));
  const old = CLOCKS[id];
  if (old && old.steps === want) return old;
  const tl = CryptoAnim.createTimeline({ steps: want, stepDuration: dur, loop: true, rate: 1 });
  tl.play();
  if (old) tl.seek(Math.min(old.index, want - 1));
  CLOCKS[id] = tl;
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock(id, steps, dur) {
  const tl = clockFor(id, steps, dur);
  tl.setRate(E.state.speed > 0 ? E.state.speed : 1);
  if (E.state.running) tl.tick(E.state.dt);
  CUR_TL = tl;
  return tl;
}

document.getElementById('btnBack').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { if (CUR_TL) CUR_TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { if (CUR_TL) CUR_TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里是 `p.fmt(parseFloat(input.value))`。
     写成数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'rails',
    label: { en: 'rails <i>r</i>', zh: '栅栏数 <i>r</i>' },
    min: 1, max: 8, step: 1, value: 3,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'speed',
    /* 速度不是数学量，所以不加 <i>；<i>r</i> 才是。 */
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

function currentRails() {
  const r = Math.round(E.state.rails);
  return r >= 1 ? r : 3;                 // init() 之前 state.rails 还不存在
}

/* ================= 每帧一份、只在输入变了才重算的派生量 =================
   与 crypto-caesar.html 的 bruteState() 同一手法：不是为了省 CPU，而是为了
   让画面与读数在同一帧里读的是**同一份**结果，不会因为两次独立计算而错半帧。 */
const DERIVED = { key: null };

function derived() {
  const rails = currentRails();
  const kw = keyword();
  /* 缓存键用 JSON 拼，不用分隔符拼字符串：明文里什么字符都可能有，
     随便挑一个分隔符就意味着某段输入能伪造出另一段输入的键。 */
  const key = JSON.stringify([PLAIN, kw, rails]);
  if (DERIVED.key === key) return DERIVED;
  const plain = CC.normalize(PLAIN);
  const n = plain.length;

  DERIVED.key = key;
  DERIVED.plain = plain;
  DERIVED.n = n;
  DERIVED.rails = rails;
  DERIVED.kw = kw;
  DERIVED.hasKey = kw.length > 0;

  /* ---- 列换位 ---- */
  if (DERIVED.hasKey) {
    const order = TR.columnOrder(kw);
    const cols = order.length;
    const rank = new Array(cols);
    for (let j = 0; j < cols; j++) rank[order[j]] = j;
    const colText = [];
    for (let c = 0; c < cols; c++) {
      let s = '';
      for (let i = c; i < n; i += cols) s += plain.charAt(i);
      colText.push(s);
    }
    DERIVED.order = order;
    DERIVED.cols = cols;
    DERIVED.rank = rank;
    DERIVED.colText = colText;
    DERIVED.rows = Math.max(1, Math.ceil(n / cols));
    DERIVED.colCipher = TR.columnarEncrypt(plain, kw);
  } else {
    DERIVED.order = [];
    DERIVED.cols = 0;
    DERIVED.rank = [];
    DERIVED.colText = [];
    DERIVED.rows = 0;
    DERIVED.colCipher = '';
  }

  /* ---- 栅栏 ---- */
  DERIVED.pattern = TR.railPattern(n, rails);
  DERIVED.railCipher = TR.railFenceEncrypt(plain, rails);
  /* 密文第 q 个字母来自明文第几位。加密本身在 algos 里，这里只是把同一条
     锯齿再走一遍拿到对应关系——**不重推锯齿**，两处各推一遍早晚差一格。 */
  const src = [], dest = new Array(n);
  for (let row = 0; row < rails; row++) {
    for (let i = 0; i < n; i++) if (DERIVED.pattern[i] === row) { dest[i] = src.length; src.push(i); }
  }
  DERIVED.railSrc = src;
  DERIVED.railDest = dest;

  /* ---- 对照组：一次代换 ---- */
  DERIVED.subCipher = CAESAR.encrypt(plain, SUB_K);

  /* ---- 三份字母计数。本工具的全部论点就在这三行的比较里 ---- */
  DERIVED.countPlain = CA.letterCounts(plain);
  DERIVED.countCol = CA.letterCounts(DERIVED.colCipher);
  DERIVED.countRail = CA.letterCounts(DERIVED.railCipher);
  DERIVED.countSub = CA.letterCounts(DERIVED.subCipher);
  return DERIVED;
}

function maxAbsDelta(a, b) {
  let m = 0;
  for (let i = 0; i < 26; i++) m = Math.max(m, Math.abs(a[i] - b[i]));
  return m;
}

/* 版面：面板固定占着右边 304px，宽屏时把可用区收窄，让图形不会钻到面板底下。
   top 给 122 而不是更小：左上角那块 brand（h1 + 两行说明，max-width 到 42vw）
   底边大约就在 100px，每一页的第一行标题贴着它画会与它并排、读起来像同一句话。
   实测过 96：三页的首行都紧挨着"…nothing is replaced."，不重叠但难分。 */
function layout() {
  const vi = E.viewInfo();
  const rightPad = vi.W > 900 ? 330 : 16;
  return {
    W: vi.W, H: vi.H,
    x0: 24,
    availW: Math.max(240, vi.W - 48 - rightPad),
    top: vi.W > 760 ? 122 : 176,
    bottom: vi.H - 86
  };
}

/* 规范化之后的明文/密文是一整串没有空格的字母，浏览器**无处可断行**，
   于是它会直接从面板右边溢出去（实测：60 个字母的密文横穿出面板）。
   给这两处读数加 word-break，比把长度砍到二三十个字母好——砍短了就看不出
   "密文和明文一样长"这件事，而那正是"不填充"这条政策的可见证据。 */
function longVal(color, s) {
  return '<b style="--c:var(--trace-' + color + ');word-break:break-all">' + esc(s) + '</b>';
}

function notice(L, msg, color) {
  E.chip(L.x0, L.top + 40, Math.min(460, L.availW), 30, msg,
         { mono: true, color: color || ORANGE, fill: 'rgba(251,146,60,.08)',
           stroke: 'rgba(251,146,60,.38)', fontSize: 12 });
}

function needKeyword(L) {
  notice(L, E.t({ en: 'Type a keyword in the panel — its letters are the column order.',
                  zh: '在右边面板里输入关键词 —— 它的字母顺序就是列的读出顺序。' }));
}

function needText(L) {
  notice(L, E.t({ en: 'No letters in the plaintext yet.',
                  zh: '明文里还没有任何字母。' }));
}

/* ================= 页签一：列换位网格 ================= */
const gridScene = {
  label: { en: 'Columnar', zh: '列换位' },
  brand: { en: 'Write across the rows, read down the columns — in the order the keyword sorts them. Nothing is added, nothing is replaced.',
           zh: '横着一行行写进去，竖着一列列读出来 —— 次序由关键词的字母序决定。没有添东西，也没有换东西。' },
  tips: { en: 'Press ⏵ and watch one column at a time leave the grid and land in the block on the right. The right block is the same six columns, re-sorted — that re-sorting is the entire cipher.',
          zh: '按 ⏵，看着列一根一根离开网格、落到右边那一块里。右边就是同样的那几列换了个次序 —— 那次重排就是这个密码的全部内容。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['speed'],
  /* 本页图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎双击
     回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'gCipher', label: { en: 'Cipher block', zh: '密文块' }, color: ROSE,   checked: true },
    { key: 'gRanks',  label: { en: 'Read order',   zh: '读出次序' }, color: VIOLET, checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    /* 时钟的步数是列数；没有关键词时先给它 1 步，免得 createTimeline 拿到 0。 */
    const tl = tickClock('grid', Math.max(1, D.cols), 0.62);
    if (!D.hasKey) { needKeyword(L); return; }
    if (!D.n) { needText(L); return; }

    const cols = D.cols, rows = D.rows;
    const availH = L.bottom - L.top;
    let cell = E.clamp(Math.min((L.availW - 76) / (cols * 2), (availH - 84) / (rows + 1)), 9, 34);
    let side = cell >= 13;                       // 并排放得下吗
    if (!side) cell = E.clamp(Math.min(L.availW / cols, (availH - 108) / (rows * 2 + 2)), 9, 34);

    const blockW = cols * cell;
    /* gap 的上限是 76 而不是"随便多大"：cell 的算式已经给两块之间预留了
       76px（(availW − 76) / (cols·2)），上限取同一个数，两块加间隙才恰好
       不超出可用区——上限给大了会往右溢出到面板底下。 */
    const gap = side ? Math.max(34, Math.min(76, L.availW - blockW * 2)) : 0;
    const gx = side ? L.x0 + (L.availW - blockW * 2 - gap) / 2 : L.x0 + (L.availW - blockW) / 2;
    const rx = side ? gx + blockW + gap : gx;
    const gy = L.top + 30;
    const ry = side ? gy : gy + (rows + 1) * cell + 46;
    /* 超长明文（粘贴进来的整段文章）会让行数超出屏幕。这时**两块一起**只画
       前 showRows 行并明说截断了——两块用同一条截断规则，画面内部仍然自洽
       （看到的是两块各自的上半部），而不是让一块完整、另一块被裁。 */
    const bodyY = gy + cell + 6;
    const showRows = Math.max(2, Math.min(rows, Math.floor((L.bottom - bodyY) / cell)));

    const j = tl.index;                          // 正在读第 j 根（读出次序）
    const curCol = D.order[j];

    /* ---- 表头：关键词字母 + 它的名次 ---- */
    function header(x, y, letterAt, rankAt, hot) {
      E.cellGrid(x, y, cols, 1, cell, {
        text: function (c) { return letterAt(c); },
        fill: function (c) { return hot(c) ? 'rgba(167,139,250,.20)' : 'rgba(45,212,234,.05)'; },
        textColor: function (c) { return hot(c) ? VIOLET : SLATE; },
        stroke: LINE, weight: 700, fontSize: Math.max(9, cell * 0.5)
      });
      if (E.state.gRanks) {
        for (let c = 0; c < cols; c++) {
          E.chip(x + c * cell, y - 17, cell, 15, String(rankAt(c)),
                 { mono: true, color: hot(c) ? VIOLET : DIM, fontSize: Math.min(10.5, cell * 0.42) });
        }
      }
    }
    header(gx, gy, function (c) { return D.kw.charAt(c); },
           function (c) { return D.rank[c] + 1; },
           function (c) { return c === curCol; });

    /* ---- 明文网格：一列一列画，最后一行因此天然是**参差**的 ----
       参差不是瑕疵，是这条政策的样子：不填充，所以前 n mod cols 列比别的
       列多一个字母，解密时列长得按这条规则算回来。整块矩形画法会把这件事
       藏起来，还会让人以为末尾补了空格。 */
    for (let c = 0; c < cols; c++) {
      const txt = D.colText[c];
      const done = D.rank[c] < j, hot = (c === curCol);
      E.cellGrid(gx + c * cell, bodyY, 1, Math.min(txt.length, showRows), cell, {
        text: function (_c, r) { return txt.charAt(r); },
        fill: function () {
          return hot ? 'rgba(167,139,250,.16)' : (done ? 'rgba(251,113,133,.09)' : null);
        },
        textColor: function () { return hot ? BRIGHT : (done ? 'rgba(159,176,200,.45)' : CYAN); },
        stroke: LINE, fontSize: Math.max(8, cell * 0.52)
      });
    }
    E.chip(gx, gy - 40, blockW, 20, E.t({ en: 'written across', zh: '横着写进去' }),
           { mono: true, color: CYAN, fontSize: 11 });
    if (showRows < rows) {
      E.chip(L.x0, L.bottom - 22, Math.min(430, L.availW), 20,
             E.t({ en: 'showing the first ' + showRows + ' of ' + rows + ' rows',
                   zh: '只画了 ' + rows + ' 行里的前 ' + showRows + ' 行' }),
             { mono: true, color: ORANGE, fontSize: 11 });
    }

    /* ---- 搬运：从当前列指向它在密文块里的落点 ---- */
    if (E.state.gCipher) {
      const bodyY = gy + cell + 6;
      if (side) {
        const my = bodyY + Math.min(showRows, 6) * cell * 0.5;
        E.flowArrow(gx + blockW + 10, my, rx - 10, my,
                    { color: VIOLET, width: 1.6, headLen: 8, dash: [5, 4] });
      } else {
        const mx = gx + blockW / 2;
        E.flowArrow(mx, bodyY + showRows * cell + 8, mx, ry - 30,
                    { color: VIOLET, width: 1.6, headLen: 8, dash: [5, 4] });
      }

      /* ---- 密文块：同样这几列，按读出次序从左到右重新排 ---- */
      header(rx, ry, function (c) { return D.kw.charAt(D.order[c]); },
             function (c) { return c + 1; },
             function (c) { return c === j; });
      for (let jj = 0; jj < cols; jj++) {
        const c = D.order[jj];
        const txt = D.colText[c];
        const shown = jj <= j, hot = (jj === j);
        E.cellGrid(rx + jj * cell, ry + cell + 6, 1, Math.min(txt.length, showRows), cell, {
          text: function (_c, r) { return shown ? txt.charAt(r) : ''; },
          fill: function () {
            return hot ? 'rgba(167,139,250,.16)' : (shown ? 'rgba(251,113,133,.09)' : null);
          },
          textColor: function () { return hot ? BRIGHT : ROSE; },
          stroke: shown ? 'rgba(251,113,133,.26)' : LINE,
          fontSize: Math.max(8, cell * 0.52)
        });
      }
      E.chip(rx, ry - 40, blockW, 20,
             E.t({ en: 'read down, in keyword order', zh: '按关键词次序竖着读' }),
             { mono: true, color: ROSE, fontSize: 11 });
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.hasKey) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'keyword is empty', zh: '关键词是空的' }) + '</b>';
    }
    const tl = CLOCKS.grid;
    const j = tl ? Math.min(tl.index, D.cols - 1) : 0;
    const c = D.order[j];
    return E.t({ en: 'keyword ', zh: '关键词 ' }) +
      '<b style="--c:var(--trace-violet)"><i>' + esc(D.kw) + '</i></b>' +
      '<span class="dim">  ' + D.cols + E.t({ en: ' columns × ', zh: ' 列 × ' }) +
      D.rows + E.t({ en: ' rows', zh: ' 行' }) + '</span><br>' +
      E.t({ en: 'reading column ', zh: '正在读第 ' }) +
      '<b style="--c:var(--trace-violet)">' + (j + 1) + '</b>' +
      '<span class="dim"> / ' + D.cols + ' — <i>' + esc(D.kw.charAt(c)) + '</i>, ' +
      D.colText[c].length + E.t({ en: ' letters', zh: ' 个字母' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(D.plain, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(D.colCipher, 60)) + '<br>' +
      '<span class="dim">' + D.n + E.t({ en: ' letters in, ', zh: ' 个字母进，' }) +
      D.colCipher.length + E.t({ en: ' letters out — nothing padded',
                                 zh: ' 个字母出 —— 没有填充' }) + '</span>';
  }
};

/* ================= 页签二：栅栏 ================= */
/* 栅栏的行是**序数**（第 0 条、第 1 条……），不是几个互不相干的类别，所以
   它们的编码是同一支紫（排列的颜色）上的一条明度阶梯，而不是 r 种色相。
   这条阶梯在三处复用：锯齿路径、行导引线、密文块里每个格子的边框——
   于是"明文里颜色在锯齿，密文里颜色排成了整段"这句话是看出来的，不是读出来的。 */
function railColor(r, R, a) {
  const t = R > 1 ? r / (R - 1) : 0;
  return 'rgba(167,139,250,' + (a * (1 - 0.6 * t)).toFixed(3) + ')';
}

const railScene = {
  label: { en: 'Rail Fence', zh: '栅栏' },
  brand: { en: 'A different permutation, the same idea: let the letters zigzag down and up, then read the rows off flat.',
           zh: '另一个排列，同一个想法：让字母沿锯齿上下走，再把每一行压平读下来。' },
  tips: { en: 'Watch one letter at a time: the violet line shows where it sits in the plaintext and where it lands in the cipher. In the zigzag the shades alternate; in the cipher block they arrive sorted into runs — that is the whole operation. Set r = 1 and the cipher equals the plaintext: one rail has nowhere to fold.',
          zh: '一次盯住一个字母：紫色连线一头是它在明文里的位置，一头是它在密文里的落点。锯齿里深浅是交替的，密文块里却排成了一段一段 —— 这就是全部操作。把 r 调到 1，密文与明文完全相同：一条栅栏无处可折。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['rails', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'rCipher', label: { en: 'Cipher block', zh: '密文块' }, color: ROSE,   checked: true },
    { key: 'rLink',   label: { en: 'Same letter',  zh: '同一个字母' }, color: VIOLET, checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tl = tickClock('rails', Math.max(1, D.n), 0.2);
    if (!D.n) { needText(L); return; }

    const R = D.rails, n = D.n;
    const availH = L.bottom - L.top;

    /* 锯齿按「谱表」折行：一行装不下就换到下一段，行号（第几条栅栏）在段与段
       之间保持一致。长文本因此不必被截断——截断会让画面上的密文与面板里的
       密文是两串不同的东西，那比折行难看得多。 */
    /* 字距（lw）从大往小试，取**装得下的最大值**，而不是"一行摊完全部字母"。
       一行摊完的后果实测过：95 个字母铺满 1150px 宽只用掉 90px 高，字母被压到
       7px、屏幕下面三分之二全空。锯齿像谱表一样折行反而两头都赚——字母大了，
       竖直方向也用上了。试算里连密文块的高度一起算，否则它会被顶到屏幕外。 */
    let lw = 26, perStave = 4, staves = 1, rowH = 30, staveH = 120;
    for (; lw >= 9; lw--) {
      perStave = Math.max(4, Math.floor(L.availW / lw));
      staves = Math.max(1, Math.ceil(n / perStave));
      rowH = Math.min(lw * 1.15, 30);
      staveH = R * rowH + rowH;
      const lines = Math.ceil(n / perStave);
      if (staves * staveH + 34 + lines * lw + 30 <= availH) break;
    }
    lw = Math.max(9, lw);
    const zx = L.x0, zy = L.top + 26;
    /* 锯齿画得下几段。粘进来一整篇文章时 rowH 已经压到下限还是装不下，
       这时只画装得下的那几段并明说——但**下面那块密文是完整的**
       （它会自己折行），所以面板里的密文与画面上的密文始终是同一串。
       截断可见的那一半，好过让画面上出现一串"另一个明文的密文"。 */
    const shownStaves = Math.max(1, Math.min(staves, Math.floor((availH * 0.56) / staveH)));
    const zn = Math.min(n, shownStaves * perStave);

    function ptOf(i) {
      const s = Math.floor(i / perStave);
      return [zx + (i % perStave) * lw + lw / 2, zy + s * staveH + D.pattern[i] * rowH + rowH / 2];
    }

    /* ---- 行导引线：每条栅栏一条，颜色就是这条栅栏的那一级 ---- */
    for (let s = 0; s < shownStaves; s++) {
      const cnt = Math.min(perStave, n - s * perStave);
      for (let r = 0; r < R; r++) {
        const y = zy + s * staveH + r * rowH + rowH / 2;
        E.flowArrow(zx, y, zx + cnt * lw, y,
                    { color: railColor(r, R, 0.18), width: 1, head: false });
      }
    }

    /* ---- 锯齿本身。分段画，段与段之间不连线（那条线在纸上不存在）---- */
    for (let s = 0; s < shownStaves; s++) {
      const from = s * perStave, to = Math.min(zn, from + perStave);
      for (let i = from; i + 1 < to; i++) {
        const a = ptOf(i), b = ptOf(i + 1);
        E.flowArrow(a[0], a[1], b[0], b[1],
                    { color: railColor(D.pattern[i], R, 0.55), width: 1.4, head: false });
      }
    }

    /* ---- 明文字母，坐在它们的锯齿位置上 ---- */
    const cur = Math.min(tl.index, n - 1);
    const fs = Math.max(8, Math.min(lw, rowH) * 0.62);
    for (let i = 0; i < zn; i++) {
      const p = ptOf(i), hot = (i === cur);
      /* 每个字母底下垫一块**它所在栅栏那一级**的底色，与下面密文块里同一个
         字母用的是同一个 railColor(…, .3)——于是 tips 里"锯齿里深浅是交替的，
         密文块里排成了一段一段"这句话在画面上是逐字成立的，而不是要人脑补。
         深浅只有三四级、又都很淡，不会盖过字母本身。 */
      E.chip(p[0] - lw / 2, p[1] - rowH / 2, lw, rowH, D.plain.charAt(i),
             { fontSize: fs, color: hot ? BRIGHT : CYAN,
               fill: hot ? 'rgba(167,139,250,.30)' : railColor(D.pattern[i], R, 0.30),
               stroke: hot ? VIOLET : null, radius: 3 });
    }
    E.chip(zx, L.top - 6, Math.min(320, L.availW), 20,
           E.t({ en: 'plaintext — zigzagging', zh: '明文 —— 走锯齿' }),
           { mono: true, color: CYAN, fontSize: 11 });
    if (zn < n) {
      E.chip(zx + Math.min(324, L.availW), L.top - 6, Math.min(300, L.availW), 20,
             E.t({ en: 'zigzag shows the first ' + zn + ' of ' + n + ' letters',
                   zh: '锯齿只画了 ' + n + ' 个字母里的前 ' + zn + ' 个' }),
             { mono: true, color: ORANGE, fontSize: 11 });
    }

    /* ---- 密文块：一行一行读下来，折成整齐的段落 ---- */
    if (E.state.rCipher) {
      const cw = E.clamp(lw, 9, 22);
      const per = Math.max(6, Math.floor(L.availW / cw));
      const lines = Math.ceil(n / per);
      const cy = zy + shownStaves * staveH + 34;
      const curDest = D.railDest[cur];
      E.cellGrid(zx, cy, per, lines, cw, {
        text: function (c, r) {
          const q = r * per + c;
          return q < n ? D.railCipher.charAt(q) : '';
        },
        fill: function (c, r) {
          const q = r * per + c;
          if (q >= n) return null;
          if (q === curDest) return 'rgba(167,139,250,.30)';
          return railColor(D.pattern[D.railSrc[q]], R, 0.30);
        },
        textColor: function (c, r) {
          const q = r * per + c;
          return q === curDest ? BRIGHT : ROSE;
        },
        stroke: LINE, fontSize: Math.max(8, cw * 0.52)
      });
      E.chip(zx, cy - 24, Math.min(420, L.availW), 20,
             E.t({ en: 'ciphertext — row 0, then row 1, then row 2 …',
                   zh: '密文 —— 先第 0 行，再第 1 行，再第 2 行……' }),
             { mono: true, color: ROSE, fontSize: 11 });

      /* ---- 同一个字母，两处位置。这条连线就是"换位改变的是位置"那句话。
         游标跑到被截断的那一半时画不出起点，就只留密文那一头的高亮。 ---- */
      if (E.state.rLink && cur < zn) {
        const a = ptOf(cur);
        const b = [zx + (curDest % per) * cw + cw / 2,
                   cy + Math.floor(curDest / per) * cw + cw / 2];
        E.flowArrow(a[0], a[1] + rowH * 0.45, b[0], b[1] - cw * 0.45,
                    { color: VIOLET, width: 1.5, headLen: 7, dash: [4, 4] });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    const tl = CLOCKS.rails;
    const i = (tl && D.n) ? Math.min(tl.index, D.n - 1) : 0;
    let s = E.t({ en: 'rails ', zh: '栅栏数 ' }) +
      '<b style="--c:var(--trace-violet)"><i>r</i> = ' + D.rails + '</b>';
    if (D.rails === 1) {
      s += '<span class="dim">  ' +
        E.t({ en: '· identity — nothing moves', zh: '· 恒等 —— 什么都没动' }) + '</span>';
    }
    s += '<br>';
    if (!D.n) return s + '<span class="dim">' + E.t({ en: 'no letters', zh: '没有字母' }) + '</span>';
    s += E.t({ en: 'letter ', zh: '第 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>' + esc(D.plain.charAt(i)) + '</i></b>' +
      '<span class="dim">  ' + E.t({ en: 'position ', zh: '位置 ' }) + (i + 1) +
      E.t({ en: ' → ', zh: ' → ' }) + (D.railDest[i] + 1) +
      E.t({ en: '  on rail ', zh: '  在第 ' }) + (D.pattern[i] + 1) +
      E.t({ en: '', zh: ' 条栅栏' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'plain  ', zh: '明文 ' }) + '</span>' +
      longVal('cyan', clip(D.plain, 60)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      longVal('rose', clip(D.railCipher, 60));
    return s;
  }
};

/* ================= 页签三：频率对照 —— 顿悟视角 =================
   两块图，同一个明文，同一个量程：
     上：换位（列换位或栅栏）。两条柱子逐个等高，Δ 行 26 个 0。
     下：代换（凯撒 +3）。同样读不懂，但剖面整条平移了 3 格，Δ 行不是 0。
   这就是把古典密码劈成两半的那把刀：**代换改变哪些字母，换位改变字母在哪儿**。
   剖面全等而文本读不懂 ⇒ 你面对的是换位，而频率分析——那把打穿所有代换的
   刀——在这里一个字节的密钥都告诉不了你。

   量程必须显式锁死（barChart 的 o.max）：不锁的话每帧的最大值一变，
   四组柱子会各自跳一次，而这一页的全部主张恰恰是"这两组一模一样"。
   四组共用同一个 max 才让"等高"这件事是可比的。 */
function currentFreqCipher(D) {
  /* 关键词为空时列换位无从谈起，自动退回栅栏——这一页的论点对两种换位
     都成立，没必要为了一个空输入框把整页空着。 */
  const useRail = E.state.fRail || !D.hasKey;
  return useRail
    ? { text: D.railCipher, counts: D.countRail,
        name: { en: 'rail fence, r = ' + D.rails, zh: '栅栏，r = ' + D.rails } }
    : { text: D.colCipher, counts: D.countCol,
        name: { en: 'columnar, key ' + D.kw, zh: '列换位，关键词 ' + D.kw } };
}

const freqScene = {
  label: { en: 'Frequency', zh: '频率' },
  brand: { en: 'The diagnostic that splits classical cryptography in two: substitution changes which letters, transposition changes where they are.',
           zh: '把古典密码劈成两半的那把刀：代换改变的是哪些字母，换位改变的是字母在哪儿。' },
  tips: { en: 'This is the epiphany view. Every pair of bars in the top chart is exactly equal and every cell of its Δ row reads 0 — the ciphertext is unreadable yet its letter profile is untouched. The bottom chart is a substitution on the same text: the profile slides three places and Δ is no longer zero. So a flat-matching profile with unreadable text means transposition — and frequency analysis, which breaks every substitution, tells you nothing about the key.',
          zh: '这就是顿悟视角。上面那张图里每一对柱子严格等高，Δ 行 26 个格子全是 0 —— 密文已经读不懂了，字母剖面却一点没动。下面是同一段文本的一次代换：剖面整条挪了三格，Δ 不再是 0。所以「剖面全等 + 文本读不懂」＝ 换位；而频率分析——那把打穿所有代换的刀——在这里关于密钥一个字都说不出来。' },
  presets: TEXT_PRESETS,
  presetsLabel: PRESETS_LABEL,
  params: ['rails', 'speed'],
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'fRail',  label: { en: 'Use rail fence', zh: '改用栅栏' },   color: VIOLET,  checked: false },
    { key: 'fDelta', label: { en: 'Δ row',          zh: 'Δ 行' },       color: EMERALD, checked: true },
    { key: 'fSub',   label: { en: 'Substitution',   zh: '代换对照' },   color: ORANGE,  checked: true }
  ],
  draw: function () {
    const D = derived();
    const L = layout();
    const tl = tickClock('freq', 26, 0.5);
    if (!D.n) { needText(L); return; }

    const cursor = tl.index % 26;
    const cip = currentFreqCipher(D);
    /* 四组柱子共用同一个量程。换位是明文计数的一个重排、代换是它的一次
       循环移位，所以三者的最大值本来就相等——显式传同一个 max 让这件事
       在代码里也是**一个**事实，而不是三次巧合。 */
    let cap = 1;
    for (let i = 0; i < 26; i++) cap = Math.max(cap, D.countPlain[i], cip.counts[i], D.countSub[i]);

    const showSub = !!E.state.fSub;
    const availH = L.bottom - L.top;
    const panelH = showSub ? (availH - 20) / 2 : availH;
    const chartW = Math.min(L.availW, 900);
    const cx = L.x0 + (L.availW - chartW) / 2;
    const dcell = chartW / 26;
    /* 一块面板除柱子外还要放：标题 26 + 字母标签与间隔 32 + Δ 说明与 Δ 行
       （dcell 见方）+ 结论 24 + 密文样本 45。留够 176，柱子才不会把下面那块
       顶出去；上限 240 是为了两块能各占屏幕一半而不是挤在上半屏。 */
    const barH = E.clamp(panelH - (E.state.fDelta ? 176 : 140), 46, 240);

    function panel(y, cipherText, counts, tone, toneSoft, title, msgDiffer, msgSame) {
      const d = [];
      let mx = 0;
      for (let i = 0; i < 26; i++) { d.push(counts[i] - D.countPlain[i]); mx = Math.max(mx, Math.abs(d[i])); }

      E.chip(cx, y, chartW, 20, E.t(title), { mono: true, color: tone, fontSize: 11.5 });

      /* 成对的柱子：每个字母左青（明文）右彩（密文）。等高就是等高，
         叠画只能看出"够到了顶"，并排才看得出"一样高"。 */
      const vals = [], labels = [];
      for (let i = 0; i < 26; i++) {
        vals.push(D.countPlain[i]); vals.push(counts[i]);
        labels.push(CC.ALPHABET.charAt(i)); labels.push('');
      }
      const by = y + 26;
      E.barChart(cx, by, chartW, barH, vals, {
        max: cap, gap: 1,
        colorAt: function (i) {
          const li = i >> 1;
          const on = (li === cursor);
          if (i % 2 === 0) return on ? CYAN : 'rgba(45,212,234,.42)';
          return on ? tone : toneSoft;
        },
        labels: labels, labelSize: 9,
        labelColor: 'rgba(159,176,200,.55)'
      });
      /* 游标：把当前字母那一对框出来，让"这一对相等"可以一个一个数过去。 */
      E.chip(cx + cursor * dcell, by - 3, dcell, barH + 6, '',
             { stroke: 'rgba(226,232,240,.34)', radius: 3 });

      /* +32 而不是 +16：barChart 把 A–Z 的字母标签画在柱子下面 3px 处，
         Δ 行的说明文字压在 +16 会正好骑在那排字母上（实测：C 与 D 被
         "Δ = cipher − plain" 盖住）。让开那排标签。 */
      let yy = by + barH + 32;
      if (E.state.fDelta) {
        E.cellGrid(cx, yy, 26, 1, dcell, {
          /* 负号用 U+2212（−）而不是 ASCII 连字符（规范里的文本约定）。 */
          text: function (c) { return d[c] < 0 ? '−' + (-d[c]) : String(d[c]); },
          fill: function (c) { return d[c] === 0 ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.14)'; },
          textColor: function (c) { return d[c] === 0 ? EMERALD : ORANGE; },
          stroke: LINE, fontSize: Math.max(8, Math.min(12, dcell * 0.44))
        });
        E.chip(cx, yy - 16, 190, 14, E.t({ en: 'Δ = cipher − plain', zh: 'Δ = 密文 − 明文' }),
               { mono: true, color: DIM, fontSize: 10 });
        yy += dcell + 8;
      }

      const vc = mx === 0 ? EMERALD : ORANGE;
      const pw = Math.min(chartW, 560);
      E.chip(cx, yy, pw, 24,
             E.t(mx === 0 ? msgSame : msgDiffer) + '  ·  max |Δ| = ' + mx,
             { mono: true, color: vc, fontSize: 11.5,
               fill: mx === 0 ? 'rgba(52,211,153,.08)' : 'rgba(251,146,60,.08)',
               stroke: mx === 0 ? 'rgba(52,211,153,.42)' : 'rgba(251,146,60,.42)' });
      /* 密文样本按**这个盒子**的宽度截，不是按整张图的宽度：chip 把文字居中，
         截长了就会从盒子两头一起漫出去，左边直接漫出屏幕（实测 93 个字母时
         开头几个被裁掉）。11px 的 Georgia 斜体约 8px 一个字母。 */
      E.chip(cx, yy + 27, pw, 18,
             clip(cipherText, Math.max(12, Math.floor(pw / 8))),
             { color: tone, fontSize: 11 });
    }

    panel(L.top, cip.text, cip.counts, EMERALD, 'rgba(52,211,153,.42)',
          { en: 'TRANSPOSITION — ' + E.t(cip.name), zh: '换位 —— ' + E.t(cip.name) },
          { en: 'profiles differ', zh: '剖面不同' },
          { en: 'every bar identical — the letters never changed',
            zh: '每一对柱子都相等 —— 字母一个都没变' });

    if (showSub) {
      panel(L.top + panelH + 20, D.subCipher, D.countSub, ORANGE, 'rgba(251,146,60,.42)',
            { en: 'SUBSTITUTION — Caesar, k = ' + SUB_K, zh: '代换 —— 凯撒，k = ' + SUB_K },
            { en: 'profile displaced — the letters were replaced',
              zh: '剖面整条挪走了 —— 字母被换掉了' },
            { en: 'identical', zh: '完全相同' });
    }
  },
  readout: function () {
    syncIoLabels();
    const D = derived();
    if (!D.n) {
      return '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — nothing to count', zh: '没有字母 —— 无从统计' }) + '</b>';
    }
    const tl = CLOCKS.freq;
    const i = tl ? tl.index % 26 : 0;
    const cip = currentFreqCipher(D);
    const dT = maxAbsDelta(cip.counts, D.countPlain);
    const dS = maxAbsDelta(D.countSub, D.countPlain);
    const ch = CC.ALPHABET.charAt(i);
    let s = '<b style="--c:var(--trace-cyan)"><i>' + ch + '</i></b>' +
      '<span class="dim">  ' + E.t({ en: 'plain ', zh: '明文 ' }) + '</span>' +
      '<b style="--c:var(--trace-cyan)">' + D.countPlain[i] + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + cip.counts[i] + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'sub ', zh: '代换 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + D.countSub[i] + '</b><br>' +
      E.t({ en: 'transposition ', zh: '换位 ' }) +
      '<b style="--c:var(--trace-emerald)">max |Δ| = ' + dT + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'substitution ', zh: '代换 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">max |Δ| = ' + dS + '</b><br>' +
      '<span class="dim">' + D.n + E.t({ en: ' letters · ', zh: ' 个字母 · ' }) +
      E.t(cip.name) + '</span><br>' +
      '<span class="dim">' +
      E.t({ en: 'unreadable, yet the profile is untouched — frequency analysis has nothing to say about the key.',
            zh: '读不懂了，剖面却一点没动 —— 频率分析关于密钥说不出任何话。' }) +
      '</span>';
    if (ACTIVE_NOTE) s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>';
    return s;
  }
};

var SCENES = { grid: gridScene, rails: railScene, frequency: freqScene };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个预置并调它的 onSelect，而那个回调要往 textarea 里写字。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
