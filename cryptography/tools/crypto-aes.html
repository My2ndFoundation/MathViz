  { key: 'bit',
    label: { en: 'flipped input bit <i>b</i>', zh: '翻转的输入比特 <i>b</i>' },
    min: 0, max: 127, step: 1, value: 0, fmt: fmtBit },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + String.fromCharCode(0xd7); } }
];

function curBit() { const v = E.state.bit; return v == null ? 0 : Math.round(v); }

/* ================= 缓存 =================
   同一帧里 draw() 与 readout() 会各要一次同样的东西。缓存让它们读到的**是
   同一份对象**——两次独立计算哪怕结果相同，也会让"图上的 0 与读数里的 0"
   变成两个巧合相等的数。影响图要跑 129 次 roundStates、雪崩曲线要跑 257 次，
   更是每帧重算不起（实测各 3ms / 7ms，60fps 下都是不可接受的）。 */
function dataKey() { return CC.toHex(PT) + '|' + CC.toHex(KEY) + '|' + stepsKey(); }

function memo1(fn) {
  const c = { k: null, v: null };
  return function () {
    const k = dataKey();
    if (c.k !== k) { c.k = k; c.v = fn(); }
    return c.v;
  };
}

const traceNow = memo1(function () { return AES.trace(PT, KEY, { steps: steps() }); });
const roundsNow = memo1(function () { return AES.roundStates(PT, KEY, { steps: steps() }); });
const curveNow = memo1(function () { return AES.avalancheCurve(PT, KEY, { steps: steps() }); });
function cipherNow() { const r = roundsNow(); return r[r.length - 1]; }

/* 影响图：dep[r][i*16+j] = 1 表示"跑到第 r 轮时，输入字节 i 影响了输出字节 j"。
   探针把每个输入字节的 8 个比特**逐位**翻一遍再取并集，而不是只翻 0xff 一次：
   单一掩码有可能碰巧在某一步互相抵消，那会让一条真实存在的依赖被漏报成 0，
   而这一页的整个论证都建立在"0 就是真的 0"上。 */
const cubeNow = memo1(function () {
  const o = { steps: steps() };
  const base = AES.roundStates(PT, KEY, o);
  const R = base.length;
  const dep = [];
  for (let r = 0; r < R; r++) dep.push(new Uint8Array(256));
  for (let i = 0; i < 16; i++) {
    for (let b = 0; b < 8; b++) {
      const rs = AES.roundStates(AES.flipBit(PT, i * 8 + b), KEY, o);
      for (let r = 0; r < R; r++) {
        const x = base[r], y = rs[r];
        for (let j = 0; j < 16; j++) if (x[j] !== y[j]) dep[r][i * 16 + j] = 1;
      }
    }
  }
  return { dep: dep, rounds: R };
});

/* 状态是列主序的：字节 i 落在第 (i >> 2) 列。跨列 = 两端的列号不同。 */
function colOf(i) { return i >> 2; }
function crossCount(dep) {
  let n = 0;
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 16; j++) if (dep[i * 16 + j] && colOf(i) !== colOf(j)) n++;
  }
  return n;
}
function sameCount(dep) {
  let n = 0;
  for (let i = 0; i < 16; i++) {
    for (let j = 0; j < 16; j++) if (dep[i * 16 + j] && colOf(i) === colOf(j)) n++;
  }
  return n;
}
const CROSS_TOTAL = 192;    // 16 × 16 减去四个 4×4 对角块 = 256 − 64
const SAME_TOTAL = 64;

/* 单比特的逐轮列扩散。与 bit 有关，所以另立一份缓存。 */
const spreadCache = { k: null, v: null };
function spreadNow() {
  const k = dataKey() + '|' + curBit();
  if (spreadCache.k !== k) {
    spreadCache.k = k;
    spreadCache.v = AES.columnSpread(PT, KEY, curBit(), { steps: steps() });
  }
  return spreadCache.v;
}

/* 单比特的逐轮比特差。 */
const avCache = { k: null, v: null };
function avNow() {
  const k = dataKey() + '|' + curBit();
  if (avCache.k !== k) {
    avCache.k = k;
    avCache.v = AES.avalanche(PT, KEY, curBit(), { steps: steps() });
  }
  return avCache.v;
}

/* 第一次达到 45% 的轮次。45 而不是 50：50% 是期望值，实测曲线在它两侧摆动，
   拿等号去问"哪一轮达到 50%"只会得到一个由噪声决定的答案。 */
function firstRoundAt(curve, frac) {
  for (let r = 0; r < curve.length; r++) if (curve[r].fraction >= frac) return r;
  return -1;
}

/* ================= 时间轴 =================
   三个页签各有一条：它们的"一步"不是同一件事（一个步骤 / 一轮 / 一轮），
   共用一条就得让每个页签自己取模，而取模出来的步数与 ⏮ ⏭ 按钮走的步数
   不一致，按钮就会时灵时不灵。 */
const TLS = {};
let CUR = 'state';

function timelineFor(tab, count, stepDuration) {
  count = Math.max(1, Math.round(count));
  const cur = TLS[tab];
  if (cur && cur.steps === count) return cur.tl;
  const tl = CryptoAnim.createTimeline({ steps: count, stepDuration: stepDuration,
                                         loop: true, rate: 1 });
  tl.play();
  if (cur) tl.seek(Math.min(cur.tl.index, count - 1));
  TLS[tab] = { tl: tl, steps: count };
  return tl;
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页
   回来那一下的时间跳变会让它真的补上几千步。 */
function tick(tl) {
  tl.setRate(E.state.speed || 1);
  if (E.state.running) tl.tick(E.state.dt);
}
function activeTL() { const e = TLS[CUR]; return e ? e.tl : null; }

/* CUR 由页签按钮的点击直接写，**不能只靠 draw() 顶上那一行**：draw() 只在
   下一帧才跑，而"点页签、立刻按 ⏭"之间可能一帧都还没渲染，那时 CUR 仍是
   上一个页签，⏭ 全走到了别人的时间轴上。draw() 里那一行保留着当兜底。 */
function bindTabTracking() {
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { CUR = b.dataset.tab; });
  });
}

document.getElementById('btnBack').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(-1); });
document.getElementById('btnStep').addEventListener('click',
  function () { const t = activeTL(); if (t) t.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把当前页签的时间轴拨回第 0 步。
   用 seek(0) 而不是 reset()：reset() 会把 playing 置 false，而 playing
   在本页恒为 true（真正的闸门是 tick() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click',
  function () { const t = activeTL(); if (t) t.seek(0); });

/* ================= 版面预算 =================
   先把上下两条带子留出来，再拿剩下的地方定尺寸。反过来做（先按 min(宽,高)
   定尺寸再摆位置）会让说明性的那几行成为第一个被挤出画布的东西。
   窄屏（≤760px）上传输条被 CSS 挪到了页签下方、面板变成贴底的抽屉，
   所以上带更高、下带更矮，两套数各写各的。 */
function layout() {
  const vi = E.viewInfo();
  const wide = vi.W > 900;
  const narrow = vi.W <= 760;
  const availW = wide ? vi.W - 330 : vi.W;
  /* 窄屏的上带 164 而不是 142。≤760px 时 CSS 把传输条挪到了页签下方
     （.transport{top:110px}），那一条连边框带内边距实测约 42px 高，底边落在
     152 —— 142 会让第一条画布内容被传输条压住，而这正是骨架注释里记着的
     那一类"只在窄屏出现、桌面上永远看不见"的重叠。164 给它 12px 余量。 */
  const top = narrow ? 164 : 118;
  /* 窄屏的下带 62 而不是 30：≤760px 时面板变成贴底的抽屉
     （.panel{bottom:10px}），收起状态下只剩标题行，实测约 40px 高，顶边落在
     视口底部往上 50px 处。30 会让最后一条画布内容藏到抽屉后面——它不会报错，
     只是看不见了。 */
  const bot = narrow ? 62 : 96;
  return {
    vi: vi, W: vi.W, H: vi.H, wide: wide, narrow: narrow,
    availW: availW,
    cx: wide ? availW / 2 + 16 : vi.W / 2,
    top: top, bot: bot,
    vSpace: Math.max(140, vi.H - top - bot)
  };
}

/* ================= 画状态矩阵 =================
   ⚠ 先用**最小可读格宽**反推放得下几列，再让格宽在剩余空间里长大到上限；
   绝不"先定列数、再把格宽 clamp 到一个下限"——那个下限是下限，超出的部分
   会被画布边缘无声地吃掉。放不下的列由调用方明说，不交给边缘去吃。

   十六进制字节用等宽体而不是数学衬线体：它们是**数据**不是公式，而衬线
   斜体在这个字号上的 0 与 o、1 与 l 几乎分不开（Hill 的计算轨迹为同样的
   理由做过同样的决定）。公式与标签仍然走 E.chip 默认的 mathFont()。 */
function stateGrid(x, y, cell, cols, st, o) {
  o = o || {};
  E.cellGrid(x, y, cols, 4, cell, {
    stroke: o.stroke || 'rgba(148,163,184,.18)',
    fill: o.fill || null,
    mono: true,
    fontSize: E.clamp(cell * 0.40, 7.5, 15),
    text: function (c, r) { return hex2(st[c * 4 + r]); },
    textColor: o.textColor || function () { return o.color || BRIGHT; }
  });
}

/* 方括号用三段线拼，不用字体里的 '['：字号一变，字形的括号就跟矩阵的高度
   对不齐，而这两样东西必须严丝合缝。 */
function drawBracket(x, y, w, h, col) {
  const t = Math.min(8, Math.max(4, h * 0.16));
  const seg = function (ax, ay, bx, by) {
    E.flowArrow(ax, ay, bx, by, { color: col, width: 1.2, head: false });
  };
  seg(x - 5, y - 3, x - 5, y + h + 3);
  seg(x - 5, y - 3, x - 5 + t, y - 3);
  seg(x - 5, y + h + 3, x - 5 + t, y + h + 3);
  seg(x + w + 5, y - 3, x + w + 5, y + h + 3);
  seg(x + w + 5, y - 3, x + w + 5 - t, y - 3);
  seg(x + w + 5, y + h + 3, x + w + 5 - t, y + h + 3);
}

/* 底部的步骤轨：四个步骤一字排开，当前那个点亮，被关掉的那个划一道杠。
   "关掉"必须在画面上看得见，否则 ablation 页签调过的开关会在别的页签上
   变成一个无声的隐藏状态——同一份 state 被三个页签共享是引擎的既有语义，
   隐藏它才是错的。 */
function stepRail(L, y, active) {
  const gap = 6;
  const fc = E.fitCells(L.availW - 24, 4, { gap: gap, min: 52, max: 150 });
  const x0 = L.cx - fc.total / 2;
  const f = E.clamp(fc.cell / 6.4, 7.5, 11.5);
  for (let i = 0; i < fc.n; i++) {
    const k = STEP_ORDER[i];
    const on = stepOn(k);
    const cur = (k === active);
    const x = x0 + i * (fc.cell + gap);
    E.chip(x, y, fc.cell, 22, STEP_NAME[k], {
      mono: true,
      fill: cur ? 'rgba(255,255,255,.06)' : CARD,
      stroke: on ? (cur ? STEP_COLOR[k] : 'rgba(148,163,184,.26)') : UNPAIRED,
      width: cur ? 1.6 : 1,
      color: on ? (cur ? STEP_COLOR[k] : DIM) : UNPAIRED,
      fontSize: f
    });
    if (!on) {
      E.flowArrow(x + 6, y + 11, x + fc.cell - 6, y + 11,
                  { color: UNPAIRED, width: 1.2, head: false });
    }
  }
  return fc.truncated;
}

/* 轮次轨：0–10 一字排开，当前那一轮点亮。第 0 格是"初始 AddRoundKey 之后"，
   不是"第 0 轮"——AES 的十轮之前先有一次白化异或，把它画成一格才对得上
   42 帧的账（1 输入 + 1 白化 + 10 轮 × 4 步）。 */
function roundRail(L, y, round) {
  const gap = 4;
  const fc = E.fitCells(Math.min(L.availW - 24, 470), 11, { gap: gap, min: 18, max: 38 });
  const x0 = L.cx - fc.total / 2;
  /* 标签只在轨左边真的空得下时才画。挤不下就不画——一个盖在数字上的
     "round" 比没有标签坏得多。 */
  if (x0 - 46 >= 8) {
    E.chip(x0 - 46, y, 42, 18, E.t({ en: 'round', zh: '轮次' }),
           { color: DIM, fontSize: 10 });
  }
  for (let i = 0; i < fc.n; i++) {
    const on = i === round;
    E.chip(x0 + i * (fc.cell + gap), y, fc.cell, 18, String(i), {
      mono: true,
      fill: on ? 'rgba(45,212,234,.16)' : CARD,
      stroke: on ? CYAN : 'rgba(148,163,184,.18)',
      color: on ? CYAN : DIM,
      fontSize: Math.min(10, fc.cell * 0.46), radius: 3
    });
  }
  return fc.truncated;
}

/* ================= 页签一：状态与四步 ================= */
const stateTab = {
  label: { en: 'State', zh: '状态' },
  brand: { en: 'AES works on a 4x4 grid of bytes. One round is four steps, and each step has exactly one job.',
           zh: 'AES 作用在一个 4×4 的字节方阵上。一轮是四个步骤，每一步只干一件事。' },
  tips: { en: 'Press the transport buttons and watch the two grids: SubBytes changes every value and moves nothing, ShiftRows moves every byte and changes no value. Turn off "MixColumns" and step through round 1 — the middle step now does nothing, and its frame says so.',
          zh: '按传输条一步步走，盯住两张方阵：SubBytes 改掉每个数值、一个都不挪；ShiftRows 挪动每个字节、一个数值都不改。关掉「MixColumns」再走一遍第 1 轮 —— 中间那一步什么也不做了，那一帧会自己说出来。' },
  params: ['speed'],
  presets: STEP_PRESETS,
  presetsLabel: PRESETS_LABEL,
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'sSub', label: { en: 'SubBytes', zh: 'SubBytes' }, color: ROSE, checked: true },
    { key: 'sShift', label: { en: 'ShiftRows', zh: 'ShiftRows' }, color: VIOLET, checked: true },
    { key: 'sMix', label: { en: 'MixColumns', zh: 'MixColumns' }, color: EMERALD, checked: true },
    { key: 'sArk', label: { en: 'AddRoundKey', zh: 'AddRoundKey' }, color: ORANGE, checked: true },
    { key: 'stDelta', label: { en: 'Mark what changed', zh: '标出变了的格' }, color: CYAN, checked: true }
  ],
  draw: function () {
    CUR = 'state';
    const L = layout();
    const fr = traceNow();
    const tl = timelineFor('state', fr.length, 0.5);
    tick(tl);
    const i = tl.index % fr.length;
    const cur = fr[i];
    const prev = fr[Math.max(0, i - 1)];
    const stepKey = cur.step === 'in' ? 'in' : cur.step;

    let y = L.top;

    /* ① 这一帧在算什么。轮次从 1 起数（规范惯例），第 0 帧是输入。 */
    const head = cur.step === 'in'
      ? E.t({ en: 'input block', zh: '输入分组' })
      : (E.t({ en: 'round ', zh: '第 ' }) + cur.round +
         E.t({ en: ' / 10', zh: ' / 10 轮' }) + '   ·   ' + STEP_NAME[cur.step]);
    bandChip(L, y, 24, head, {
      fill: CARD, stroke: LINE,
      color: cur.step === 'in' ? CYAN : STEP_COLOR[cur.step], fontSize: 13
    });
    y += 30;

    /* ② 这一步的差事，一句话。 */
    bandChip(L, y, 22, E.t(STEP_JOB[stepKey]), { color: SLATE, fontSize: 11.5 });
    y += 26;

    if (cur.skipped) {
      bandChip(L, y, 22, E.t({ en: 'switched off — this step did nothing',
                               zh: '被关掉了 —— 这一步什么也没做' }),
               { fill: 'rgba(255,47,208,.08)', stroke: UNPAIRED, color: UNPAIRED, fontSize: 11.5 });
      y += 26;
    } else if (cur.absent) {
      bandChip(L, y, 22, E.t({ en: 'the last round has no MixColumns — FIPS-197 says so',
                               zh: '最后一轮本来就没有 MixColumns —— FIPS-197 如此规定' }),
               { fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.45)', color: ORANGE, fontSize: 11.5 });
      y += 26;
    }

    /* ③ 两张方阵：之前 → 之后。AddRoundKey 那一步若宽度够，中间再插一张
       轮密钥；不够就把轮密钥写成一行十六进制——**说出来**，而不是让它
       溢出画布。 */
    /* 轮密钥的第三张方阵只在**真的塞得下**时才出现，否则退成一行十六进制。
       窄屏上两张方阵改成上下叠：375px 横排每格只有 40px，竖排能到 58px，
       而这一页要人盯着的正是这些两位十六进制数。 */
    const showKey = (cur.step === 'ark' && !cur.skipped && cur.roundKey && L.availW > 560);
    const stack = L.narrow && !showKey;
    const opW = 30;
    const marks = E.state.stDelta !== false;

    let fc, cell, gw, ax, bx, ay, by;
    if (stack) {
      fc = E.fitCells(L.availW - 26, 4, { gap: 0, min: 15, max: 66 });
      /* 预算写成一份账，不是拍一个数：16 标签 + 46 箭头 + 12 收尾 +
         30 步骤轨 + 22 轮次轨 = 126。两张方阵各 4 行，所以除以 8。
         漏算任何一项，最后一条内容就会被压在抽屉后面。 */
      const cell8 = Math.floor((L.vSpace - (y - L.top) - 126) / 8);
      cell = Math.max(15, Math.min(fc.cell, cell8));
      gw = fc.n * cell;
      ax = bx = L.cx - gw / 2;
      ay = y + 16;
      by = ay + cell * 4 + 46;
    } else {
      const grids = showKey ? 3 : 2;
      const per = (L.availW - 24 - opW * (grids - 1)) / grids;
      fc = E.fitCells(per, 4, { gap: 0, min: 15, max: L.wide ? 54 : 42 });
      const vBudget = L.vSpace - (y - L.top) - 74;
      cell = Math.max(15, Math.min(fc.cell, Math.floor(vBudget / 4)));
      gw = fc.n * cell;
      const totalW = grids * gw + (grids - 1) * opW;
      ax = L.cx - totalW / 2;
      bx = ax + (grids - 1) * (gw + opW);
      ay = by = y + 16;
    }

    /* 之前：暗一档，它是对照不是主角。 */
    stateGrid(ax, ay, cell, fc.n, prev.state, { color: DIM, stroke: FAINT });
    drawBracket(ax, ay, gw, cell * 4, 'rgba(148,163,184,.3)');
    E.chip(ax, ay - 16, gw, 14, E.t({ en: 'before', zh: '之前' }),
           { color: DIM, fontSize: 10.5 });

    if (showKey) {
      const kx = ax + gw + opW;
      stateGrid(kx, ay, cell, fc.n, cur.roundKey, { color: ORANGE, stroke: 'rgba(251,146,60,.22)' });
      drawBracket(kx, ay, gw, cell * 4, 'rgba(251,146,60,.45)');
      E.chip(kx, ay - 16, gw, 14, 'round key ' + cur.round, { color: ORANGE, fontSize: 10.5 });
      E.chip(kx - opW, ay + cell * 2 - 11, opW, 22, String.fromCharCode(0x2295),
             { color: ORANGE, fontSize: 15 });
      E.chip(bx - opW, ay + cell * 2 - 11, opW, 22, '=', { color: SLATE, fontSize: 15 });
    } else if (stack) {
      /* 箭头收在 by − 24，不是 by − 9：“之后”那个标签就画在 by − 16 起
         的 14px 高的框里，箭头再往下伸就会**穿过标签文字**（实测撞到过）。 */
      E.flowArrow(L.cx, ay + cell * 4 + 8, L.cx, by - 24,
                  { color: SLATE, width: 1.4, headLen: 7 });
    } else {
      E.chip(bx - opW, ay + cell * 2 - 11, opW, 22, String.fromCharCode(0x2192),
             { color: SLATE, fontSize: 15 });
    }

    /* 之后：主角。变了的格按当前步骤的颜色着色（stDelta 开关）。 */
    stateGrid(bx, by, cell, fc.n, cur.state, {
      color: BRIGHT,
      fill: function (c, r) {
        if (!marks) return null;
        const idx = c * 4 + r;
        if (prev.state[idx] === cur.state[idx]) return null;
        const col = STEP_COLOR[cur.step] || CYAN;
        return col === ROSE ? 'rgba(251,113,133,.16)'
             : col === VIOLET ? 'rgba(167,139,250,.16)'
             : col === EMERALD ? 'rgba(52,211,153,.16)'
             : 'rgba(251,146,60,.16)';
      },
      textColor: function (c, r) {
        const idx = c * 4 + r;
        if (!marks || prev.state[idx] === cur.state[idx]) return BRIGHT;
        return STEP_COLOR[cur.step] || CYAN;
      }
    });
    drawBracket(bx, by, gw, cell * 4, STEP_COLOR[cur.step] || CYAN);
    E.chip(bx, by - 16, gw, 14, E.t({ en: 'after', zh: '之后' }),
           { color: STEP_COLOR[cur.step] || CYAN, fontSize: 10.5 });

    y = by + cell * 4 + 12;

    if (fc.truncated) {
      bandChip(L, y, 16, E.t({ en: 'columns 1–' + fc.n + ' / 4 shown — window too narrow',
                               zh: '只画出第 1–' + fc.n + ' 列 / 共 4 列 —— 窗口太窄' }),
               { color: ORANGE, fontSize: 10.5 });
      y += 20;
    }

    /* ④ 轮密钥放不下方阵时的退路：一行十六进制。 */
    if (cur.step === 'ark' && !cur.skipped && cur.roundKey && !showKey &&
        y + 20 < L.H - L.bot - 34) {
      bandChip(L, y, 18, 'round key ' + cur.round + ' = ' + CC.toHex(cur.roundKey),
               { mono: true, color: ORANGE, fontSize: 10 });
      y += 22;
    }

    /* ⑤ 步骤轨。**跟着内容走、不钉在画布底边**：钉底在 979px 高的桌面上会
       在方阵与轨之间留下半屏空白，而这一页的主体是方阵，轨只是它的注脚。
       只有内容真的长到快撞上底带时才让位。 */
    const railY = Math.min(L.H - L.bot - 52, y + 16);
    stepRail(L, railY, cur.step === 'in' ? null : cur.step);

    /* ⑥ 轮次轨：42 帧走到哪一轮了。 */
    if (railY + 50 < L.H - L.bot) roundRail(L, railY + 30, cur.round);
  },
  readout: function () {
    syncIoLabels();
    const fr = traceNow();
    const e = TLS['state'];
    const i = e ? (e.tl.index % fr.length) : 0;
    const cur = fr[i];
    let s = '<b style="--c:var(--trace-cyan)">' +
      (cur.step === 'in' ? E.t({ en: 'input', zh: '输入' })
                         : E.t({ en: 'round ', zh: '第 ' }) + cur.round + ' / 10') +
      '</b><span class="dim">   ' + (i + 1) + ' / ' + fr.length +
      E.t({ en: ' frames', zh: ' 帧' }) + '</span><br>';
    if (cur.step !== 'in') {
      s += '<b style="--c:var(--trace-' +
        (cur.step === 'sub' ? 'rose' : cur.step === 'shift' ? 'violet'
         : cur.step === 'mix' ? 'emerald' : 'orange') + ')">' +
        STEP_NAME[cur.step] + '</b>';
      if (cur.skipped) {
        s += ' <b style="--c:var(--trace-unpaired)">' +
          E.t({ en: 'OFF', zh: '已关闭' }) + '</b>';
      } else if (cur.absent) {
        s += ' <span class="dim">' +
          E.t({ en: 'not in the last round', zh: '最后一轮没有这一步' }) + '</span>';
      }
      s += '<br>';
    }
    s += '<span class="dim">' + E.t({ en: 'state ', zh: '状态 ' }) + '</span>' +
      esc(CC.toHex(cur.state)) + '<br>' +
      '<span class="dim">' + E.t({ en: 'ciphertext ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(CC.toHex(cipherNow())) + '</b>';
    if (!allOn()) {
      s += '<br><b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'off: ', zh: '已关闭：' }) + offNames().join(', ') + '</b>';
    }
    return s;
  }
};

/* ================= 页签二：ablation —— 顿悟视角 =================
   16×16 的影响图：第 i 行第 j 列点亮，表示"改动输入字节 i 会改动输出字节 j"。
   完整 AES 跑到第 2 轮，这张图全满——每个输入字节影响每个输出字节。

   关掉 ShiftRows 之后它塌成四个 4×4 的对角块，而且**再多轮也不会变**：
   MixColumns 只在列内混合，SubBytes 与 AddRoundKey 都是逐字节的，于是没有
   任何一条路径能让字节跨过列的边界。AES 于是不再是一个 128 位的密码，
   而是四个各自独立的 32 位密码并排跑——每一个的密钥空间小到可以穷举。

   为什么这是顿悟视角而不只是一条警告：ShiftRows 单看是最不起眼的一步
   （它连数值都不改），MixColumns 单看也只是"在一列里搅一搅"。两个看上去
   都可有可无的步骤，合起来才是扩散。这张图让"合作"这件事变成一次塌陷。 */
const ablationTab = {
  label: { en: 'Ablation', zh: '消融' },
  brand: { en: 'Switch one step off and watch what breaks. Diffusion is not one step doing the work — it is two steps that each look redundant on their own.',
           zh: '关掉一步，看它坏在哪里。扩散不是某一步的功劳 —— 那是两个单看都像多余的步骤合作出来的。' },
  tips: { en: 'Epiphany view. Hit "No ShiftRows": the 16x16 influence map collapses into four 4x4 blocks and the cross-column count drops to 0 of 192 — AES has fallen apart into four independent 32-bit ciphers. Let it play: more rounds never fill those cells in.',
          zh: '顿悟视角。点「关 ShiftRows」：16×16 的影响图当场塌成四个 4×4 的方块，跨列依赖从 192 掉到 0 —— AES 散成了四个互不相干的 32 位密码。让它自己播：轮数再多，那些格子也永远填不上。' },
  params: ['bit', 'speed'],
  presets: STEP_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'sSub', label: { en: 'SubBytes', zh: 'SubBytes' }, color: ROSE, checked: true },
    { key: 'sShift', label: { en: 'ShiftRows', zh: 'ShiftRows' }, color: VIOLET, checked: true },
    { key: 'sMix', label: { en: 'MixColumns', zh: 'MixColumns' }, color: EMERALD, checked: true },
    { key: 'sArk', label: { en: 'AddRoundKey', zh: 'AddRoundKey' }, color: ORANGE, checked: true },
    { key: 'abSpread', label: { en: 'Per-round column spread', zh: '逐轮列扩散' }, color: CYAN, checked: true }
  ],
  draw: function () {
    CUR = 'ablation';
    const L = layout();
    const cube = cubeNow();
    const tl = timelineFor('ablation', cube.rounds, 0.7);
    tick(tl);
    const r = tl.index % cube.rounds;
    const dep = cube.dep[r];
    const cross = crossCount(dep), same = sameCount(dep);
    const spreadOn = E.state.abSpread === true;

    let y = L.top;

    /* ① 结论牌。数字是这一帧真算出来的，不是文案里写死的。
       ⚠ "跨列为 0" 单独**不足以**说明"散成四个密码"：第 0 轮（白化异或之后、
       任何一轮之前）跨列本来就是 0，那时每个字节还只等于它自己。结构性的
       那句话只有在 ShiftRows 真被关掉时才成立，所以判据看的是开关，不是计数。 */
    const shiftOff = !stepOn('shift');
    const verdict = shiftOff
      ? E.t({ en: 'four independent 32-bit ciphers', zh: '四个互不相干的 32 位密码' })
      : (cross === CROSS_TOTAL
         ? E.t({ en: 'every input byte reaches every output byte', zh: '每个输入字节都够得到每个输出字节' })
         : (r === 0
            ? E.t({ en: 'before any round: every byte is still only itself',
                    zh: '任何一轮之前：每个字节还只等于它自己' })
            : E.t({ en: 'diffusion still spreading', zh: '扩散还在铺开' })));
    bandChip(L, y, 24, verdict, {
      fill: CARD, stroke: shiftOff ? UNPAIRED : LINE,
      color: shiftOff ? UNPAIRED : (cross === CROSS_TOTAL ? EMERALD : SLATE),
      fontSize: 13
    });
    y += 28;

    /* ② 两个计数与轮次。 */
    bandChip(L, y, 20,
      E.t({ en: 'after round ', zh: '第 ' }) + r + E.t({ en: '', zh: ' 轮之后' }) +
      '   ·   ' + E.t({ en: 'cross-column ', zh: '跨列 ' }) + cross + ' / ' + CROSS_TOTAL +
      '   ·   ' + E.t({ en: 'within-column ', zh: '列内 ' }) + same + ' / ' + SAME_TOTAL,
      { mono: true, color: shiftOff ? UNPAIRED : SLATE, fontSize: 10.5 });
    /* +38 而不是 +24：下面那张图的"output byte →"轴标签画在 y − 16 处，
       两者相隔太近时会**压在这一行上**（实测就是这样撞的）。 */
    y += 38;

    /* ③ 影响图。16 列先按最小可读格宽反推能画几列，再按垂直预算封顶。 */
    const spreadH = spreadOn ? 150 : 0;
    const vBudget = L.vSpace - (y - L.top) - 34 - spreadH;
    const fc = E.fitCells(L.availW - 40, 16, { gap: 0, min: 7, max: 26 });
    const cell = Math.min(fc.cell, Math.floor(vBudget / 16));
    if (cell < 7) {
      bandChip(L, y, 22, E.t({ en: 'window too short for the influence map',
                               zh: '窗口太矮，影响图画不下' }),
               { color: ORANGE, fontSize: 11 });
    } else {
      const gw = fc.n * cell;
      const gx = L.cx - gw / 2;
      E.cellGrid(gx, y, fc.n, 16, cell, {
        stroke: 'rgba(148,163,184,.12)',
        fill: function (c, rr) {
          /* c = 输出字节下标、rr = 输入字节下标。列内 emerald、跨列 rose；
             关掉 ShiftRows 时那些**永远填不上**的跨列格给一层极淡的品红——
             --trace-unpaired 的定义原文就是"没有对手、不该存在"。 */
          const on = dep[rr * 16 + c];
          const crossCell = colOf(rr) !== colOf(c);
          if (on) return crossCell ? 'rgba(251,113,133,.72)' : 'rgba(52,211,153,.72)';
          if (crossCell && !stepOn('shift')) return 'rgba(255,47,208,.07)';
          return null;
        },
        text: function () { return null; }
      });
      /* 列的边界画粗一点：四个 4×4 的块是这张图的语法。 */
      for (let b = 0; b <= 4; b++) {
        const p = b * 4 * cell;
        if (p <= gw) {
          E.flowArrow(gx + p, y, gx + p, y + 16 * cell,
                      { color: 'rgba(148,163,184,.40)', width: 1, head: false });
          E.flowArrow(gx, y + p, gx + gw, y + p,
                      { color: 'rgba(148,163,184,.40)', width: 1, head: false });
        }
      }
      E.chip(gx, y - 16, gw, 13,
             E.t({ en: 'output byte →', zh: '输出字节 →' }),
             { color: DIM, fontSize: 10 });
      bandChip(L, y + 16 * cell + 2, 13,
               E.t({ en: '\u2191 input byte    green = same column    pink = crosses columns',
                     zh: '\u2191 输入字节    绿 = 同一列    粉 = 跨了列' }),
               { color: DIM, fontSize: 9.5, minFont: 7.5 });
      y += 16 * cell + 20;
      if (fc.truncated) {
        bandChip(L, y, 16,
          E.t({ en: 'columns 1–' + fc.n + ' / 16 shown — window too narrow',
                zh: '只画出第 1–' + fc.n + ' 列 / 共 16 列 —— 窗口太窄' }),
          { color: ORANGE, fontSize: 10 });
        y += 20;
      }
    }

    /* ④ 逐轮列扩散：翻一个比特，看它在每一轮里波及了哪几列。
       这是上面那张图的原始测量——影响图是它的汇总。 */
    if (spreadOn && y + 130 < L.H - L.bot) {
      const sp = spreadNow();
      const bitCol = colOf(curBit() >> 3);
      const sc = E.fitCells(Math.min(220, L.availW - 90), 4, { gap: 0, min: 14, max: 34 });
      const rowsFit = Math.min(sp.length, Math.max(3, Math.floor((L.H - L.bot - y - 20) / 11)));
      const ch = Math.max(8, Math.min(11, (L.H - L.bot - y - 20) / sp.length));
      const gx = L.cx - sc.total / 2;
      bandChip(L, y, 12,
               E.t({ en: 'bytes changed per column, round 0\u201310',
                     zh: '各列变了几个字节（第 0\u201310 轮）' }),
               { color: DIM, fontSize: 9.5, minFont: 7.5 });
      const gy = y + 14;
      for (let rr = 0; rr < rowsFit; rr++) {
        for (let c = 0; c < sc.n; c++) {
          const v = sp[rr][c];
          const hot = c === bitCol;
          E.chip(gx + c * sc.cell, gy + rr * ch, sc.cell - 1, ch - 1,
                 v ? String(v) : '',
                 { fill: v ? (hot ? 'rgba(52,211,153,.55)' : 'rgba(251,113,133,.55)') : null,
                   stroke: 'rgba(148,163,184,.14)', color: BRIGHT,
                   mono: true, fontSize: Math.min(9, ch * 0.7), radius: 1 });
        }
        E.chip(gx - 26, gy + rr * ch, 24, ch - 1, 'r' + rr,
               { color: DIM, mono: true, fontSize: Math.min(8.5, ch * 0.66) });
      }
      if (rowsFit < sp.length) {
        E.chip(gx - 4, gy + rowsFit * ch, sc.total, 12,
               E.t({ en: 'rounds 0–' + (rowsFit - 1) + ' / 10 shown',
                     zh: '只画出第 0–' + (rowsFit - 1) + ' 轮 / 共 10 轮' }),
               { color: ORANGE, fontSize: 9 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const cube = cubeNow();
    const e = TLS['ablation'];
    const r = e ? (e.tl.index % cube.rounds) : 0;
    const dep = cube.dep[r];
    const cross = crossCount(dep);
    const last = cube.dep[cube.rounds - 1];
    let s = '<span class="dim">' + E.t({ en: 'after round ', zh: '第 ' }) + r +
      E.t({ en: '', zh: ' 轮之后' }) + '</span><br>' +
      '<b style="--c:var(--trace-rose)">' + E.t({ en: 'cross-column ', zh: '跨列依赖 ' }) +
      cross + ' / ' + CROSS_TOTAL + '</b>   ' +
      '<b style="--c:var(--trace-emerald)">' + E.t({ en: 'within ', zh: '列内 ' }) +
      sameCount(dep) + ' / ' + SAME_TOTAL + '</b><br>';
    if (!stepOn('shift')) {
      s += '<b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'ShiftRows off — ' + crossCount(last) +
                  ' cross-column links after all 10 rounds',
              zh: 'ShiftRows 已关 —— 十轮跑完仍然只有 ' + crossCount(last) +
                  ' 条跨列依赖' }) + '</b><br>' +
        '<span class="dim">' +
        E.t({ en: 'MixColumns only ever mixes inside a column, so no byte can reach another column. Four 32-bit ciphers.',
              zh: 'MixColumns 只在列内混合，于是没有字节到得了别的列。四个 32 位密码。' }) +
        '</span>';
    } else {
      const full = (function () {
        for (let i = 0; i < cube.rounds; i++) if (crossCount(cube.dep[i]) === CROSS_TOTAL) return i;
        return -1;
      })();
      s += '<span class="dim">' +
        (full >= 0
          ? E.t({ en: 'full dependency first reached at round ', zh: '首次全依赖出现在第 ' }) +
            full + E.t({ en: '', zh: ' 轮' })
          : E.t({ en: 'never reaches full dependency', zh: '始终没有达成全依赖' })) +
        '</span><br>' +
        '<span class="dim">' + E.t({ en: 'ciphertext ', zh: '密文 ' }) + '</span>' +
        esc(CC.toHex(cipherNow()));
    }
    if (!allOn()) {
      s += '<br><span class="dim">' + E.t({ en: 'off: ', zh: '已关闭：' }) +
        offNames().join(', ') + '</span>';
    }
    return s;
  }
};

/* ================= 页签三：雪崩 =================
   翻一个输入比特，逐轮数 128 个输出比特里变了几个。理想的分组密码在这条
   曲线上应该很快走到 50% 并且再不离开——"很快"到底是几轮，这一页是量出来的。 */
const avalancheTab = {
  label: { en: 'Avalanche', zh: '雪崩' },
  brand: { en: 'Flip one input bit. Count how many of the 128 output bits move, round by round.',
           zh: '翻转一个输入比特，逐轮数一数 128 个输出比特里动了几个。' },
  tips: { en: 'Drag the bit slider anywhere: the shape does not change. Round 0 is always exactly 1 bit — XOR spreads nothing. Two rounds later the mean is already at half of 128, and every one of the 16 bytes has moved.',
          zh: '把比特滑杆拖到任何位置：形状都不变。第 0 格恒为 1 个比特 —— 异或什么也扩散不了。再过两轮，均值就已经到了 128 的一半，而且 16 个字节无一幸免。' },
  params: ['bit', 'speed'],
  presets: STEP_PRESETS,
  presetsLabel: PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'sSub', label: { en: 'SubBytes', zh: 'SubBytes' }, color: ROSE, checked: true },
    { key: 'sShift', label: { en: 'ShiftRows', zh: 'ShiftRows' }, color: VIOLET, checked: true },
    { key: 'sMix', label: { en: 'MixColumns', zh: 'MixColumns' }, color: EMERALD, checked: true },
    { key: 'sArk', label: { en: 'AddRoundKey', zh: 'AddRoundKey' }, color: ORANGE, checked: true },
    { key: 'avSingle', label: { en: 'This bit alone', zh: '只看这一位' }, color: CYAN, checked: true }
  ],
  draw: function () {
    CUR = 'avalanche';
    const L = layout();
    const curve = curveNow();
    const single = avNow();
    const tl = timelineFor('avalanche', curve.length, 0.7);
    tick(tl);
    const r = tl.index % curve.length;

    let y = L.top;

    /* ① 结论牌：多少轮达到一半。45% 而不是 50%——50 是期望值，实测曲线
       在它两侧摆动，用等号去问只会得到一个由噪声决定的答案。 */
    const hit = firstRoundAt(curve, 0.45);
    bandChip(L, y, 24,
      hit >= 0
        ? (E.t({ en: 'half the output bits move from round ', zh: '从第 ' }) + hit +
           E.t({ en: ' onward', zh: ' 轮起，一半的输出比特都在动' }))
        : E.t({ en: 'never reaches half — diffusion is broken',
                zh: '始终到不了一半 —— 扩散坏掉了' }),
      { fill: CARD, stroke: LINE, color: hit >= 0 ? EMERALD : UNPAIRED, fontSize: 13 });
    /* +38：下面那张图的 100% 刻度线画在 y 上，离结论牌太近时会读成它的下划线。 */
    y += 38;

    /* ② 柱状图。**必须锁 max**：不锁的话每帧最大值一变，所有柱子都会跳。 */
    const chartH = Math.min(260, Math.max(90, L.vSpace * 0.38));
    const chartW = Math.min(L.availW - 60, 520);
    const cx0 = L.cx - chartW / 2;
    const gap = 4;
    const values = curve.map(function (c) { return c.fraction; });
    E.barChart(cx0, y, chartW, chartH, values, {
      max: 1, gap: gap,
      colorAt: function (i) {
        return i === r ? CYAN : (curve[i].fraction >= 0.45 ? 'rgba(52,211,153,.72)'
                                                           : 'rgba(251,113,133,.72)');
      },
      labels: curve.map(function (c) { return String(c.round); }),
      labelColor: DIM, labelSize: 9.5
    });

    /* 0 / 50 / 100 三条刻度线。量程锁死在 100%（o.max = 1），所以 50% 的柱子
       只占图高的一半——上半张是**刻度的其余部分**，不是空掉的画布。没有那条
       100% 线时它读起来就像图画歪了，所以三条一起画，把"到一半就饱和"这件事
       说成一个可以量的事实。 */
    [[0, '100%', .28], [0.5, '50%', .40], [1, '', .22]].forEach(function (d) {
      const ly = y + chartH * d[0];
      E.flowArrow(cx0 - 6, ly, cx0 + chartW + 6, ly,
                  { color: 'rgba(226,232,240,' + d[2] + ')', width: 1, head: false,
                    dash: d[0] === 0.5 ? [4, 4] : null });
      /* 基线不写字：那一行的正上方就是最高的柱子，标签会压在柱身上。
         一条 0 刻度线本来也不需要被说出来。 */
      if (d[1]) {
        E.chip(cx0 + chartW - 40, ly - 14, 46, 13, d[1],
               { mono: true, color: 'rgba(226,232,240,.55)', fontSize: 9.5 });
      }
    });

    /* ③ 单比特那条曲线，画成柱顶的小横杠。几何与 barChart 内部一致：
       bw = (w − gap·(n−1)) / n，柱 i 的左沿在 x + i·(bw + gap)。 */
    if (E.state.avSingle !== false) {
      const n = values.length;
      const bw = (chartW - gap * (n - 1)) / n;
      for (let i = 0; i < n; i++) {
        const f = single[i] / 128;
        const by = y + chartH - Math.max(0, Math.min(1, f)) * chartH;
        const bx = cx0 + i * (bw + gap);
        E.flowArrow(bx, by, bx + bw, by, { color: CYAN, width: 1.8, head: false });
      }
    }
    y += chartH + 26;

    /* ④ 当前轮的差分方阵：每格写这一个字节里变了几个比特（0–8）。 */
    const rs = roundsNow();
    const alt = AES.roundStates(AES.flipBit(PT, curBit()), KEY, { steps: steps() });
    const a = rs[r], b = alt[r];
    const vBudget = L.vSpace - (y - L.top) - 26;
    const fc = E.fitCells(Math.min(L.wide ? 300 : 230, L.availW - 40), 4,
                          { gap: 0, min: 16, max: L.wide ? 56 : 52 });
    const cell = Math.max(14, Math.min(fc.cell, Math.floor(vBudget / 4)));
    if (cell >= 14 && y + cell * 4 + 20 < L.H - L.bot) {
      const gw = fc.n * cell;
      const gx = L.cx - gw / 2;
      bandChip(L, y, 13,
               E.t({ en: 'bits changed per byte, round ', zh: '每个字节变了几位 · 第 ' }) + r +
               E.t({ en: '', zh: ' 轮' }),
               { color: DIM, fontSize: 9.5, minFont: 7.5 });
      const gy = y + 15;
      E.cellGrid(gx, gy, fc.n, 4, cell, {
        stroke: 'rgba(148,163,184,.18)',
        mono: true,
        fontSize: E.clamp(cell * 0.40, 8, 14),
        fill: function (c, rr) {
          const i = c * 4 + rr;
          let v = a[i] ^ b[i], n = 0;
          while (v) { n += v & 1; v >>= 1; }
          return n ? 'rgba(251,113,133,' + (0.10 + n * 0.075).toFixed(3) + ')' : null;
        },
        text: function (c, rr) {
          const i = c * 4 + rr;
          let v = a[i] ^ b[i], n = 0;
          while (v) { n += v & 1; v >>= 1; }
          return n ? String(n) : String.fromCharCode(0xb7);
        },
        textColor: function (c, rr) {
          const i = c * 4 + rr;
          return a[i] === b[i] ? 'rgba(159,176,200,.45)' : ROSE;
        }
      });
      drawBracket(gx, gy, gw, cell * 4, 'rgba(251,113,133,.45)');
      if (fc.truncated) {
        E.chip(gx, gy + cell * 4 + 2, gw, 13,
               E.t({ en: 'columns 1–' + fc.n + ' / 4 shown', zh: '只画出第 1–' + fc.n + ' 列 / 共 4 列' }),
               { color: ORANGE, fontSize: 9 });
      }
    }
  },
  readout: function () {
    syncIoLabels();
    const curve = curveNow();
    const single = avNow();
    const e = TLS['avalanche'];
    const r = e ? (e.tl.index % curve.length) : 0;
    const c = curve[r];
    let s = '<span class="dim">' + E.t({ en: 'round ', zh: '第 ' }) + r +
      E.t({ en: '', zh: ' 轮' }) + '</span><br>' +
      '<b style="--c:var(--trace-rose)">' + c.mean.toFixed(2) + ' / 128</b> ' +
      '<span class="dim">= ' + (c.fraction * 100).toFixed(1) + '%   ' +
      E.t({ en: 'mean over all 128 flips', zh: '128 个比特位置的均值' }) + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'range ', zh: '区间 ' }) + c.min +
      String.fromCharCode(0x2013) + c.max + '</span><br>' +
      '<b style="--c:var(--trace-cyan)"><i>b</i> = ' + curBit() + ' : ' + single[r] +
      ' / 128</b><br>' +
      '<span class="dim">' + E.t({ en: 'ciphertext ', zh: '密文 ' }) + '</span>' +
      esc(CC.toHex(cipherNow()));
    if (!allOn()) {
      s += '<br><b style="--c:var(--trace-unpaired)">' +
        E.t({ en: 'off: ', zh: '已关闭：' }) + offNames().join(', ') + '</b>';
    }
    return s;
  }
};

var SCENES = { state: stateTab, ablation: ablationTab, avalanche: avalancheTab };

buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });

bindTabTracking();

/* 手动拨动某个步骤开关之后，预置按钮组的高亮要跟着走：拨成"正好等于某个
   预置"的组合就亮起那一个，否则清空。不清空的话按钮组会停在一个已经不
   成立的选中态上，而那是页面在撒谎。引擎为此专门留了 syncPresetHighlight
   （只同步高亮、不调用 onSelect）。三个页签共用同一个 presets 数组引用，
   所以调一次就够。 */
(function () {
  STEP_ORDER.forEach(function (k) {
    document.querySelectorAll('input[data-key="' + STEP_STATE_KEY[k] + '"]')
      .forEach(function (cb) {
        cb.addEventListener('change', function () {
          E.syncPresetHighlight('state', PRESET_BY_STEPS[stepsKey()] || null);
        });
      });
  });
})();
</script>
