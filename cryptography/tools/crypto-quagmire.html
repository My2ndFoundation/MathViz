   还有一条不在画面上、但值得记下来的观察（336 组配对）：**非**真周期倍数的
   那些 p 上，维吉尼亚的重合指数系统性地高于 Quagmire（0.04457 对 0.04259，
   68.2% 的配对里维吉尼亚更高）。道理是错位的列里，维吉尼亚混的是同一张英文
   分布的几次**平移**（相加之后仍留着一点起伏），Quagmire 混的是几张互不相干的
   置换（相加之后更接近平的）。后果是峰/底噪的对比度 Quagmire 反而更好：
   1.516× 对 1.445×，也解释了"阈值以上最小高点 == 真周期"这条判据上
   Quagmire 的命中率 69.1% 略高于维吉尼亚的 62.5%。
   即：编钥匙不但没削弱第一步，还把它衬得清楚了一点点。 */

const E   = VizEngine;
const CC  = CryptoCore;
const CA  = Cryptanalysis;
const QG  = CryptoAlgos.quagmire;
const VIG = CryptoAlgos.vigenere;
const SUB = CryptoAlgos.substitution;
const EX  = CryptoExamples;

/* 配色：与 :root 里的 CSS 变量**同一批字面量**。与 crypto-vigenere-family.html
   一样，这一页把颜色绑在**含义**上而不是按 rose → violet → emerald → orange
   逐页轮换——三个页签讲的是同一把指示词的三种看法，让"明文永远是青色、
   密文永远是玫红"跨页签成立，比在每一页内部重新轮一遍更贴近设计规范第 3 条
   要的那件事（同一条量在图例点、曲线本体、峰值标记、读数粗体值上同色）：
     cyan    明文；以及使用者自己提出的那个周期假设 p
     rose    密文；以及每一列的字母频率剖面
     violet  **被编了钥匙的那部分** —— 两张字母表、指示词、Quagmire 的重合指数
     emerald **对照与复核** —— 维吉尼亚那条孪生曲线、英文频率参照、已知两张表
             之后复活的那个攻击、所有"当场验过了"的绿色横幅
     orange  Kasiski，以及所有警告与失效 */
const CYAN = '#2dd4ea', ROSE = '#fb7185', VIOLET = '#a78bfa',
      EMERALD = '#34d399', ORANGE = '#fb923c',
      SLATE = '#9fb0c8', BRIGHT = '#e2e8f0';
const DIM  = 'rgba(159,176,200,.55)';
const LINE = 'rgba(148,163,184,.22)';
const CARD = 'rgba(8,13,24,.78)';

/* 版本徽章直接读 <meta name="tool-version">，不在脚本里再抄一遍数字。 */
const VERSION = (function () {
  const m = document.querySelector('meta[name="tool-version"]');
  return (m && m.getAttribute('content')) || '0.0.0';
})();

var TOOL = {
  id: 'crypto-quagmire',
  title: { en: 'Quagmire I–IV', zh: 'Quagmire I–IV' },
  h1: { en: 'Quagmire I–IV', zh: 'Quagmire I–IV' }
};

/* ================= 分析用的锚点 ================= */
const MAXP = 20;                     // 与 CA.icByPeriod / kasiskiPeriods 的默认上限一致
const IC_RANDOM  = 1 / 26;
/* 英文的重合指数**从模块自己的频率表算出来**（Σ f_i²，得 0.0665），不另抄一个
   0.066 的字面量：同一个数在两处各写一遍，迟早有一处忘了跟着改，而画面上那条
   基准线一旦错了没有任何东西会报警。 */
const IC_ENGLISH = CA.ENGLISH_FREQ.reduce(function (s, f) { return s + f * f; }, 0);
/* 降序排好的英文频率——第三页那条"指纹"参照线。单表代换只给字母换名字，
   排序之后的剖面形状原样保留，这条线就是它的参照物。 */
const ENG_SORTED = CA.ENGLISH_FREQ.slice().sort(function (a, b) { return b - a; });

/* ================= 四个变体 =================
   结构事实（哪一侧编了钥匙）全部来自算法模块的 variants()，本页一个都不重抄——
   重抄一遍就会有两个真相，而"III 到底用不用 ctKey"这种问题只能有一个答案。
   这里只补界面文案。 */
const VMETA = QG.variants();
const VCOPY = {
  1: { rule: { en: 'keyed plaintext alphabet · straight ciphertext alphabet',
               zh: '明文表编钥匙 · 密文表是顺序表 A–Z' },
       note: { en: 'The header row is scrambled; every body row is still a plain rotation of A–Z. One keyword.',
               zh: '表头被打乱了；每一行仍然只是 A–Z 的一次旋转。一把关键词。' } },
  2: { rule: { en: 'straight plaintext alphabet · keyed ciphertext alphabet',
               zh: '明文表顺序 A–Z · 密文表编钥匙' },
       note: { en: 'The header row is A–Z; the body rows are rotations of a scrambled alphabet. One keyword.',
               zh: '表头是 A–Z；表身是一张被打乱的字母表的各次旋转。一把关键词。' } },
  3: { rule: { en: 'one keyed alphabet on both sides (the Keyed Vigenère)',
               zh: '两侧共用同一张编了钥匙的表（历史上叫 Keyed Vigenère）' },
       note: { en: 'Header and body come from the same keyword. Unkey it and this IS Vigenere — that is the identity this page checks live.',
               zh: '表头与表身来自同一把关键词。把钥匙去掉，它**就是**维吉尼亚 —— 这一页当场复核的正是这条恒等式。' } },
  4: { rule: { en: 'two different keyed alphabets',
               zh: '两张各自编钥匙、互不相同的表' },
       note: { en: 'Two keywords, two scrambles. The most general of the four — I, II and III are all IV with one or both keywords empty or shared.',
               zh: '两把关键词、两次打乱。四者中最一般的一个 —— I、II、III 都是 IV 把某一把关键词清空或令两把相同的特例。' } }
};
/* 初值必须与 VARIANT_PRESETS 的**第一项**一致。引擎的 buildPresets() 在建面板时
   就会选中第一个预置并调它的 onSelect，也就是说这个变量在 init() 之后必定被写成
   预置表的第一项；两边写不一样，只会得到一个"第一帧是 III、第二帧变成 I"的
   闪烁，而不是一个真的默认值。落地在 I 也合适：它的表身仍然是 A–Z 的旋转，
   只有表头被打乱，是四个变体里最容易一眼看懂的那个。 */
let VAR = 1;
function VM() { return VMETA[VAR - 1]; }
function VC() { return VCOPY[VAR]; }
function romanOf(id) { return VMETA[id - 1].roman; }

/* 三个页签共用**同一个数组对象**——这正是引擎里"跨页签共享的同一份选择"那条
   分支要的形状：在任意一页换了变体，另外两页的按钮高亮跟着走。 */
const VARIANT_PRESETS = VMETA.map(function (m) {
  return {
    key: String(m.id),
    label: { en: m.roman, zh: m.roman },
    onSelect: function () { VAR = m.id; AN.sig = null; BR.sig = null; syncFieldState(); }
  };
});
const VARIANT_PRESETS_LABEL = { en: 'Quagmire', zh: 'Quagmire' };

/* ================= 教学文本 =================
   两条长文本与 crypto-vigenere-family.html 里的**逐字节相同**，这是刻意的：
   那一页的 note 里记着它们在维吉尼亚下的实测数字（386 字母 / HORIZON：
   Kasiski 第一名 7、分 0.841，重合指数峰 7、值 0.073），这一页要说的正是
   "换成 Quagmire，这些数字不变"。换一段文本，那句话就没法当场对照了。 */
const LONG_EN = 'A repeating key does not invent a new cipher. It interleaves several old ones, and every column of the message still belongs to a single shifted alphabet. Counting letters over the whole message averages those alphabets together, which is exactly why the count stops looking like English. Find the period and the average comes apart again, one column at a time, each of them nothing more than a shift that a single table of frequencies will read straight off the page for you.';
const MID_EN = 'The strength of a repeating key lies entirely in how long it is, because the moment a reader knows that length the message falls apart into that many separate shifts, and every one of them is small enough to solve by counting letters alone.';

const TEXTS = [
  { id: 'long', ind: 'HORIZON',
    label: { en: '386 letters', zh: '386 字母' },
    text: { en: LONG_EN, zh: LONG_EN },
    note: { en: 'Measured over 28 keyword/variant combinations: the IoC peak sits at 7 every time, at 0.072582972583 — the plain Vigenere value to twelve decimals. Kasiski ranks 7 first in all 28 too (score 0.739–0.857 against Vigenere’s 0.841: the noise differs, the verdict does not).',
            zh: '在 28 组关键词 × 变体上实测：重合指数峰**每一组**都在 7，值 0.072582972583 —— 与纯维吉尼亚到小数点后十二位完全一样。Kasiski 也是 28 组全把 7 排第一（分数 0.739–0.857，维吉尼亚是 0.841：噪声不同，结论相同）。' } },
  { id: 'mid', ind: 'LEMON',
    label: { en: '194 letters', zh: '194 字母' },
    text: { en: MID_EN, zh: MID_EN },
    note: { en: 'The IoC curve peaks at 15 — three times 5 — on both ciphers alike. Take the smallest high point, not the tallest. This trap is inherited from Vigenere unchanged, which is itself the point.',
            zh: '两边的重合指数都在 15 处见顶 —— 5 的三倍。要取最小的那个高点，不是最高的。这个坑原封不动地从维吉尼亚继承过来，而这件事本身就是重点。' } },
  { id: 'pangram', ind: 'CRYPTO',
    label: { en: '95 letters', zh: '95 字母' },
    text: EX.plaintext('pangram').text,
    note: { en: 'Ninety-five letters is not enough evidence for either cipher. Curiously Kasiski does better here on Quagmire — its first place is a multiple of 6 in 26 of 28 combinations (9 or 18) — than on Vigenere, which ranks 3 first, a divisor. Coincidence, not a property: it is the noise that moved, not the signal.',
            zh: '95 个字母对两个密码都不构成证据。有趣的是这里 Kasiski 在 Quagmire 上反而更准 —— 28 组里有 26 组的第一名是 6 的倍数（9 或 18），而维吉尼亚把 3 排第一（一个因数）。这是巧合不是性质：动的是噪声，不是信号。' } },
  { id: 'attack', ind: 'KEY',
    label: { en: '12 letters', zh: '12 字母' },
    text: EX.plaintext('attack').text,
    note: { en: 'Not one repeated sequence, so kasiskiPeriods returns an empty list on both sides. The page says so rather than inventing a first place.',
            zh: '一条重复片段都没有，两边的 kasiskiPeriods 都返回空数组。页面明说这件事，而不是凭空造一个第一名。' } }
];

const IND_PRESETS = [
  { k: 'LEMON',   label: { en: 'LEMON · 5', zh: 'LEMON · 5' } },
  { k: 'CRYPTO',  label: { en: 'CRYPTO · 6', zh: 'CRYPTO · 6' } },
  { k: 'HORIZON', label: { en: 'HORIZON · 7', zh: 'HORIZON · 7' } }
];

/* 第一条不是凑数：两张表都不编钥匙时四个变体**逐字节等于维吉尼亚**，第一页
   会当场调 vigenere.encrypt 复核并把结论画在屏幕上。一次点击就能到那个状态，
   比要求使用者自己去两个输入框里删字更值钱。 */
const ALPHA_PRESETS = [
  { pt: '', ct: '', label: { en: 'unkeyed → Vigenère', zh: '不编钥匙 → 维吉尼亚' } },
  { pt: 'SPRINGFEVER', ct: 'AUTUMNLEAVES', label: { en: 'SPRINGFEVER / AUTUMNLEAVES', zh: 'SPRINGFEVER / AUTUMNLEAVES' } },
  { pt: 'PAULBRANDT', ct: 'HORIZON', label: { en: 'PAULBRANDT / HORIZON', zh: 'PAULBRANDT / HORIZON' } }
];

/* ================= 明文 / 两把关键词 / 指示词 ================= */
let PLAIN = '';
let PTKEY = 'SPRINGFEVER';
let CTKEY = 'AUTUMNLEAVES';
let IND = 'HORIZON';
let IND_OK = true;                 // 指示词输入框里至少有一个字母
let ACTIVE_NOTE = null;            // 当前明文预置自带的解说；一打字就作废
let ioPlain = null, ioInd = null, ioPt = null, ioCt = null;
let ioPlainLabel = null, ioIndLabel = null, ioPtLabel = null, ioCtLabel = null, ioNote = null;
const textBtns = [], indBtns = [], alphaBtns = [];

/* 派生量的缓存。放在这里（而不是靠近使用点）是因为 setXxx 要作废它们，
   而那些函数在 buildIO() 里就会被调到。 */
const AN = { sig: null };
const BR = { sig: null };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function clip(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }

function setPlain(s, writeBack) {
  PLAIN = String(s);
  if (writeBack && ioPlain) ioPlain.value = PLAIN;
  AN.sig = null; BR.sig = null;
}

/* IND **必须恒为合法指示词**。draw() 每帧都在调 encrypt()，而算法模块对"一个
   字母都没有的指示词"是当场抛的——那不是一个更弱的密码，是没有密码。用户打字
   打到一半、或者整行都是标点时退化成 'A'，而不是让非法值流进去：一帧非法就是
   整页停在空白 canvas 上。下面 ioNote 那行说明会把这次退化讲明白。 */
function setInd(raw, writeBack) {
  const n = CC.normalize(raw);
  IND_OK = n.length > 0;
  IND = IND_OK ? n : 'A';
  if (writeBack && ioInd) ioInd.value = raw;
  AN.sig = null; BR.sig = null;
}
/* 两把字母表关键词相反：空是**合法且重要**的输入（空 → 顺序表 A–Z → 退化成
   维吉尼亚），所以这里不做任何兜底，原样收下。 */
function setPtKey(raw, writeBack) {
  PTKEY = String(raw);
  if (writeBack && ioPt) ioPt.value = PTKEY;
  AN.sig = null; BR.sig = null;
}
function setCtKey(raw, writeBack) {
  CTKEY = String(raw);
  if (writeBack && ioCt) ioCt.value = CTKEY;
  AN.sig = null; BR.sig = null;
}

/* 当前变体用不上的那个关键词框要**看得出来用不上**。算法模块对"变体收不下的
   非空关键词"是当场抛的（不许悄悄丢掉使用者的输入），而 qopts() 只会把变体
   真正接受的那些键传下去，所以那个异常永远不会从这一页发出来——代价是使用者
   会对着一个自己填了却毫无反应的输入框发呆。禁用它，把这件事说在明处。 */
function syncFieldState() {
  const m = VM();
  const ptLive = m.ptKeyed;
  const ctLive = m.ctKeyed && !m.shared;
  if (ioPt) { ioPt.disabled = !ptLive; ioPt.style.opacity = ptLive ? '1' : '.4'; }
  if (ioCt) { ioCt.disabled = !ctLive; ioCt.style.opacity = ctLive ? '1' : '.4'; }
}

function buildIO() {
  const host = document.getElementById('ioHost');
  if (!host) return;
  host.innerHTML =
    '<div class="iolabel" id="ioPlainLabel"></div>' +
    '<textarea class="iofield" id="ioPlain" spellcheck="false" autocomplete="off"></textarea>' +
    '<div class="iorow" id="ioTexts"></div>' +
    '<div class="iolabel" id="ioIndLabel"></div>' +
    '<textarea class="iofield" id="ioInd" spellcheck="false" autocomplete="off" ' +
    'style="min-height:34px"></textarea>' +
    '<div class="iorow" id="ioInds"></div>' +
    '<div class="iolabel" id="ioPtLabel"></div>' +
    '<textarea class="iofield" id="ioPt" spellcheck="false" autocomplete="off" ' +
    'style="min-height:34px"></textarea>' +
    '<div class="iolabel" id="ioCtLabel"></div>' +
    '<textarea class="iofield" id="ioCt" spellcheck="false" autocomplete="off" ' +
    'style="min-height:34px"></textarea>' +
    '<div class="iorow" id="ioAlphas"></div>' +
    '<div class="iolabel" id="ioNote"></div>';

  ioPlain = document.getElementById('ioPlain');
  ioInd = document.getElementById('ioInd');
  ioPt = document.getElementById('ioPt');
  ioCt = document.getElementById('ioCt');
  ioPlainLabel = document.getElementById('ioPlainLabel');
  ioIndLabel = document.getElementById('ioIndLabel');
  ioPtLabel = document.getElementById('ioPtLabel');
  ioCtLabel = document.getElementById('ioCtLabel');
  ioNote = document.getElementById('ioNote');

  ioPlain.addEventListener('input', function () {
    ACTIVE_NOTE = null;
    setPlain(ioPlain.value, false);
    syncBtns(textBtns, null);
  });
  ioInd.addEventListener('input', function () {
    setInd(ioInd.value, false);
    syncBtns(indBtns, null);
  });
  ioPt.addEventListener('input', function () {
    setPtKey(ioPt.value, false);
    syncBtns(alphaBtns, null);
  });
  ioCt.addEventListener('input', function () {
    setCtKey(ioCt.value, false);
    syncBtns(alphaBtns, null);
  });

  /* 明文、指示词、字母表关键词这三组按钮由本页自己搭：引擎那一行 presets
     已经给了**变体**，而四组回答的是四个不同的问题（加密什么 / 用哪把指示词 /
     用哪两张表 / 用哪个变体），挤进同一行控件里只会让人以为它们互斥。 */
  const trow = document.getElementById('ioTexts');
  TEXTS.forEach(function (p) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.addEventListener('click', function () {
      ACTIVE_NOTE = p.note || null;
      setPlain(E.t(p.text), true);
      /* 预置连指示词一起给：note 里那些实测数字只有在**这一对**文本与指示词下
         才成立，只换文本会让解说与画面对不上。 */
      setInd(p.ind, true);
      syncBtns(textBtns, p.id);
      syncBtns(indBtns, p.ind);
    });
    trow.appendChild(b);
    textBtns.push({ el: b, id: p.id, label: p.label });
  });

  const irow = document.getElementById('ioInds');
  IND_PRESETS.forEach(function (kp) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.addEventListener('click', function () { setInd(kp.k, true); syncBtns(indBtns, kp.k); });
    irow.appendChild(b);
    indBtns.push({ el: b, id: kp.k, label: kp.label });
  });

  const arow = document.getElementById('ioAlphas');
  ALPHA_PRESETS.forEach(function (ap) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.addEventListener('click', function () {
      setPtKey(ap.pt, true); setCtKey(ap.ct, true);
      syncBtns(alphaBtns, ap.pt + '|' + ap.ct);
    });
    arow.appendChild(b);
    alphaBtns.push({ el: b, id: ap.pt + '|' + ap.ct, label: ap.label });
  });

  ACTIVE_NOTE = TEXTS[0].note || null;
  setPlain(E.t(TEXTS[0].text), true);
  setInd(TEXTS[0].ind, true);
  setPtKey(PTKEY, true);
  setCtKey(CTKEY, true);
  syncBtns(textBtns, TEXTS[0].id);
  syncBtns(indBtns, TEXTS[0].ind);
  syncBtns(alphaBtns, PTKEY + '|' + CTKEY);
  syncFieldState();
}

function syncBtns(list, activeId) {
  list.forEach(function (b) { b.el.classList.toggle('active', b.id === activeId); });
}

/* #ioHost 里的标签是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言切换
   不会自动重刷它们。引擎在 applyLang() 末尾会调 updateReadout()，所以把这次
   同步挂在 readout() 里搭车——比自己去监听语言按钮可靠：不管语言是怎么变的，
   readout 都会跟着重算一次。 */
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }
function syncIoLabels() {
  const m = VM();
  setText(ioPlainLabel, E.t({ en: 'Plaintext — only letters consume the indicator',
                              zh: '明文 —— 只有字母会消耗指示词' }));
  setText(ioIndLabel, E.t({ en: 'Indicator — its length is the period',
                            zh: '指示词 —— 它的长度就是周期' }));
  setText(ioPtLabel, m.ptKeyed
    ? E.t({ en: 'Plaintext-alphabet keyword', zh: '明文表关键词' })
    : E.t({ en: 'Plaintext-alphabet keyword — unused by this variant (header is A–Z)',
            zh: '明文表关键词 —— 本变体用不上（表头就是 A–Z）' }));
  setText(ioCtLabel, (m.ctKeyed && !m.shared)
    ? E.t({ en: 'Ciphertext-alphabet keyword', zh: '密文表关键词' })
    : (m.shared
        ? E.t({ en: 'Ciphertext-alphabet keyword — III shares one alphabet, so the one above is used',
                zh: '密文表关键词 —— III 两侧共用一张表，用的是上面那把' })
        : E.t({ en: 'Ciphertext-alphabet keyword — unused by this variant (rows rotate A–Z)',
                zh: '密文表关键词 —— 本变体用不上（表身是 A–Z 的旋转）' })));
  setText(ioNote, IND_OK
    ? E.t({ en: 'period ', zh: '周期 ' }) + IND.length + ' · ' + IND
    : E.t({ en: 'no letters in the indicator — falling back to A',
            zh: '指示词里没有字母 —— 退化成 A' }));
  textBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
  indBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
  alphaBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
}

/* ================= 时间轴 =================
   第一页要沿着报文一个字母一个字母走，所以时间轴的步数 = 明文的字母数，
   而那个数会随使用者换预置、打字而变。createTimeline 的 steps 建好就定死，
   所以这里在长度变化时**重建**时间轴，把当前位置按新长度取模带过去。
   TL 因此必须是 let，而传输条上那三个回调都在**调用时**读 TL——写成
   TL.step.bind(TL) 之类会把旧对象钉死在监听器里，重建之后按钮就哑了。 */
let TL = CryptoAnim.createTimeline({ steps: 1, stepDuration: 0.30, loop: true, rate: 1 });
TL.play();

function ensureTimeline(n) {
  const steps = Math.max(1, n);
  if (TL.steps === steps) return;
  const at = TL.index % steps;
  TL = CryptoAnim.createTimeline({ steps: steps, stepDuration: 0.30, loop: true, rate: TL.rate });
  TL.seek(at);
  TL.play();
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock() {
  ensureTimeline(CC.letters(PLAIN).length);
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
}

document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把位置拨回第 0 个字母。用 seek(0)
   而不是 TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'p',
    label: { en: 'period <i>p</i>', zh: '周期 <i>p</i>' },
    min: 1, max: MAXP, step: 1, value: 7,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 画布上的小工具 ================= */
/* 右边那块面板固定 304px 宽；760px 以下它变成贴底的抽屉（默认收起），
   整幅宽度就都能用。上下留白避开顶部的页签/传输条与底部的传输条与提示。 */
function contentBox(vi) {
  const rightPad = vi.W > 760 ? 332 : 14;
  const x = 20;
  const w = Math.max(220, vi.W - rightPad - x - 16);
  const top = vi.W > 760 ? 126 : 146;
  const bot = vi.H - (vi.W > 760 ? 88 : 78);
  return { x: x, y: top, w: w, h: Math.max(150, bot - top) };
}
/* 引擎的 screen-space 图元层里没有折线，只有 flowArrow。把 head 关掉，
   它就是一条线段——曲线因此是一串线段，而不是另造一套绘图原语。 */
function poly(pts, o) {
  for (let i = 1; i < pts.length; i++) {
    E.flowArrow(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1],
                { color: o.color, width: o.width || 1.8, head: false, dash: o.dash });
  }
}
function seg(ax, ay, bx, by, o) {
  E.flowArrow(ax, ay, bx, by, { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}
/* chip 的 roundRect 半径给到边长的一半就是个圆——不必为两种点再引一套图元。 */
function dot(x, y, r, color) { E.chip(x - r, y - r, r * 2, r * 2, '', { fill: color, radius: r }); }
function ring(x, y, r, color, w) {
  E.chip(x - r, y - r, r * 2, r * 2, '', { stroke: color, width: w || 1.6, radius: r });
}

/* ================= 文字必须自己管住宽度 =================
   引擎的 chip() 既不换行也不裁剪：fillText 会老老实实把字画到框外面去，而
   canvas 是全屏的，于是超出的部分直接画到画布边缘之外，看上去像被"切掉了"。
   这不是推测——无头探针（2880 帧 × 4 种视口）量到 375px 上最宽的一条说明文字
   左右各溢出 84.5 / 74.5 px，768px 上左溢出 47 px；1280 与 1920 上是 0，
   所以只在窄屏上出现、只在中文那几条长句上出现，肉眼在开发机上根本撞不到。

   规范里"让**格数**去凑空间"那条讲的是格子，这里是同一件事的文字版：
   先缩号，缩到下限还塞不下就截断加省略号，绝不让它画出框。

   估宽而不是量宽：这一层拿不到 ctx，measureText 够不着。取值刻意取**上界**而不是
   平均值——估窄了就会溢出（正是这段代码要防的事），估宽了只是字号小半档：
     · 等宽栈（SF Mono / Menlo / Consolas）的 ASCII 步进 ≈ 0.60em
     · 衬线栈（Georgia）的 ASCII 平均 ≈ 0.50em，数字 0.50em
     · CJK 与全角标点 = 1em
   所以 ASCII 一律按 0.62em 记，比两种字体都宽一点。 */
const ASCII_EM = 0.62;
function textW(s, px) {
  let u = 0;
  for (let i = 0; i < s.length; i++) u += (s.charCodeAt(i) > 0x2000) ? 1 : ASCII_EM;
  return u * px;
}
const FIT_MIN = 8.5;                 // 再小就不该指望有人读得清了，改截断
function chipFit(x, y, w, h, text, o) {
  const s = (text == null) ? '' : String(text);
  if (!s) { chipFit(x, y, w, h, s, o); return; }
  const opt = o || {};
  const base = opt.fontSize || 12;
  /* 内边距按比例给，不是一个固定的 px：表格里那些格子只有 11px 宽，
     减掉一个固定的 8px 之后连一个字母都"放不下"，于是每一格都会被截成省略号。 */
  const inner = Math.max(2, w - Math.max(4, w * 0.06));
  let size = base;
  while (size > FIT_MIN && textW(s, size) > inner) size -= 0.5;
  let t = s;
  if (textW(t, size) > inner) {
    while (t.length > 1 && textW(t + '…', size) > inner) t = t.slice(0, -1);
    t += '…';
  }
  const oo = Object.assign({}, opt);
  oo.fontSize = size;
  E.chip(x, y, w, h, t, oo);
}
/* 把一个宽 w 的标签框夹回可用区里。峰值标签画在数据点正上方，而数据点可以
   贴在横轴两端——不夹的话 p=20 处那个标签会伸出画布右边缘。 */
function clampX(x, w, B) { return E.clamp(x, B.x, B.x + B.w - w); }

/* ================= 派生量（按 变体 + 两把关键词 + 指示词 + 明文 缓存） =================
   密文、孪生的维吉尼亚密文、两条分析曲线只在这五者变了之后重算一次。这不是为了
   省 CPU，而是为了让画面与读数在同一帧里读到**同一份**结果：两处各算一遍，
   迟早出现半帧错位。 */

/* 只把当前变体**真正接受**的那几把关键词传下去。算法模块对"变体收不下的非空
   关键词"是当场抛的（拒绝悄悄丢掉使用者的输入），而 draw() 每帧都在调它——
   一帧异常就是整页停在空白 canvas 上。所以过滤发生在这里，那条异常永远不会
   从这一页发出来，而模块那道守卫仍然守着别的调用方。 */
function qopts(overrideInd) {
  const m = VM();
  const o = { variant: VAR, indicator: overrideInd || IND };
  if (m.ptKeyed) o.ptKey = PTKEY;
  if (m.ctKeyed && !m.shared) o.ctKey = CTKEY;
  return o;
}

function posTable(alpha) {
  const out = new Array(CC.N);
  for (let i = 0; i < CC.N; i++) out[alpha.charCodeAt(i) - 65] = i;
  return out;
}

function analysis() {
  const sig = VAR + '|' + PTKEY + '|' + CTKEY + '|' + IND + '|' + PLAIN;
  if (AN.sig === sig) return AN;
  AN.sig = sig;
  AN.T = QG.tableau(qopts());
  AN.L = AN.T.rows.length;
  AN.ptCol = posTable(AN.T.pt);        // 字母 → 它在表头的列号
  AN.ctPos = posTable(AN.T.ct);        // 字母 → 它在密文表里的位置
  AN.ptKeyedNow = AN.T.pt !== CC.ALPHABET;
  AN.ctKeyedNow = AN.T.ct !== CC.ALPHABET;
  AN.unkeyed = !AN.ptKeyedNow && !AN.ctKeyedNow;

  AN.plainIdx = CC.letters(PLAIN);
  AN.cipher = QG.encrypt(PLAIN, qopts());
  AN.cipherIdx = CC.letters(AN.cipher);
  AN.n = AN.cipherIdx.length;

  /* 孪生对照：同一段明文、同一个指示词的**纯维吉尼亚**密文。
     这条对照是给使用者看的，**不是攻击手段**——真正的分析者手里没有指示词，
     也就画不出这条曲线。页面在第二页的提示里明说了这一点。 */
  AN.vig = VIG.encrypt(PLAIN, IND);
  /* 两张表都不编钥匙时，四个变体都应当**逐字节等于**维吉尼亚。不写成一句标语，
     真的比一遍：两份实现哪天走岔了，第一页那条横幅会自己变色，而不是继续印着
     一句不再成立的话。 */
  AN.matchesVig = (AN.cipher === AN.vig);

  AN.ic = CA.icByPeriod(AN.cipher, MAXP);
  AN.icVig = CA.icByPeriod(AN.vig, MAXP);
  /* kasiskiPeriods 在密文里一条重复片段都没有时返回**空数组**，不是一串并列
     0 分。所以绝不能闭着眼读 [0]——'ATTACK AT DAWN' 那条预置恰好就是空的，
     而一个被当成 [0] 读的空数组会让页面凭空印出一个"最可能的周期"。 */
  AN.kas = CA.kasiskiPeriods(AN.cipher, { maxPeriod: MAXP });
  AN.kasTop = AN.kas.length ? AN.kas[0] : null;
  AN.kasByP = {};
  AN.kas.forEach(function (e) { AN.kasByP[e.period] = e; });

  AN.icPeak = AN.ic.reduce(function (a, b) { return b.ic > a.ic ? b : a; });
  /* "高点"的门槛取在**均匀随机与本次峰值的正中间**，与 crypto-vigenere-family
     用的是同一条规则（那边的注释里记着它的实测命中率：56 组里只对 39 次）。
     所以页面标出**所有**高点让人看，不挑一个印成结论。 */
  AN.icThr = IC_RANDOM + 0.5 * (AN.icPeak.ic - IC_RANDOM);
  AN.icHighs = [];
  for (let i = 0; i < AN.ic.length; i++) {
    if (AN.ic[i].ic < AN.icThr) continue;
    const l = i > 0 ? AN.ic[i - 1].ic : -1;
    const r = i < AN.ic.length - 1 ? AN.ic[i + 1].ic : -1;
    if (AN.ic[i].ic >= l && AN.ic[i].ic >= r) AN.icHighs.push(AN.ic[i].period);
  }
  AN.disagree = !!(AN.kasTop && AN.kasTop.period !== AN.icPeak.period);

  /* 两条重合指数曲线的全局最大差。它**不是** 0：在不是真周期倍数的那些 p 上，
     两边各自混着不同的表，多重集合于是不同。真正等于 0 的是下面 icGap(p)
     算的那一半——只看 p 与它的倍数。 */
  AN.dAll = 0;
  for (let i = 0; i < AN.ic.length; i++) {
    AN.dAll = Math.max(AN.dAll, Math.abs(AN.ic[i].ic - AN.icVig[i].ic));
  }
  return AN;
}

/* 在 p、2p、3p… 这些候选周期上，两条曲线差多少。

   **真周期 L 整除 p 时这个值恒为 0**，而且是结构上的恒为 0，不是"统计上很小"：
   那些候选周期上，第 j 列装的是同一批明文字母（下标 ≡ j 的那些），维吉尼亚给
   它们套了一个位移、Quagmire 套了一张单表，两者都是双射；而重合指数只看
   "每个字母出现几次"这个多重集合，双射不改变它。实测 3472 个取值，反例 0 个。

   ⚠ **反过来不成立，页面上的措辞必须是单向的。** 实测 Δ = 0 的 6532 个取值里
   只有 53.2% 真的满足 L | p；按文本长度拆开是 386 字母 96.4%、194 字母 95.2%、
   95 字母 90.0%、12 字母 23.1%。假阳性的机理很直白：p 大、文本短时每列只剩
   两三个字母，两边的重合指数**同时**退化成 0，差自然也是 0。
   所以这个函数的返回值只有一个方向能当结论用：
       Δ > 0  ⟹  真周期**不**整除 p     （上面那条定理的逆否，是证明）
       Δ = 0  ⟹  与"整除"相容，但**不是**证明（短文本上经常只是两边一起退化）
   把它当充要条件写进画面，会在 12 字母那条预置上骗人四次里的三次。 */
function icGap(p) {
  const A = analysis();
  let d = 0;
  for (let m = p; m <= MAXP; m += p) {
    d = Math.max(d, Math.abs(A.ic[m - 1].ic - A.icVig[m - 1].ic));
  }
  return d;
}

/* ================= 破解态（再按 周期假设 p 缓存） ================= */
function breakState() {
  const A = analysis();
  const hyp = Math.max(1, Math.round(E.state.p || 1));
  const sig = A.sig + '|' + hyp;
  if (BR.sig === sig) return BR;
  BR.sig = sig;
  BR.p = hyp;
  BR.cols = CA.columnsForPeriod(A.cipher, hyp);
  /* 每一列**真正的**明文。用它来判定一次攻击成功与否，而不是拿恢复出的位移去
     和"真密钥"比——Quagmire 的列根本不是位移，那里没有一个"正确的 k"可比。
     问"这一列解出来的东西是不是就是明文"，对两种攻击、对所有变体都成立。 */
  BR.plainCols = CA.columnsForPeriod(PLAIN, hyp);
  /* p 是真周期的**整数倍**时每一列仍然只用一行（下标 j mod hyp 再 mod L 是常数），
     所以这里承认倍数，而不是只认 hyp === L。 */
  BR.pure = (hyp % A.L === 0);
  BR.rows = [];
  let blindOK = 0, alphaOK = 0, scored = 0;
  let blindKey = '', alphaInd = '';
  for (let j = 0; j < hyp; j++) {
    const col = BR.cols[j];
    const want = BR.plainCols[j];
    const has = col.length > 0;

    /* 攻击一：**盲位移**。把这一列当成凯撒，26 个位移各解一次，χ² 最小者胜。
       这就是 crypto-vigenere-family 第三页的最后一步，一行没改地搬过来。
       实测（>=194 字母的两段文本）：维吉尼亚 96/98 = 98.0%，
       Quagmire 181/2744 = 6.6%，而瞎猜是 3.8%。 */
    let bs = Infinity, bk = 0, bTxt = '';
    for (let k = 0; k < CC.N; k++) {
      const d = VIG.decrypt(col, CC.ALPHABET.charAt(k));
      const s = CA.chiSquare(d);
      if (s < bs) { bs = s; bk = k; bTxt = d; }
    }

    /* 攻击二：**已知两张字母表之后的 26 个旋转**。同一个 χ²、同样 26 个候选，
       只是解密时走 Quagmire 自己的表：密文字母在 ct 里的位置减去旋转量得列号，
       列号在 pt 上取字母。实测 2718/2744 = 99.1%。
       两条摆在一起，这一页要说的话就完整了：编钥匙没有让候选变多，
       它只是**把未知量从 L 个位移换成了两张字母表**。 */
    let as = Infinity, ak = 0, aTxt = '';
    for (let s2 = 0; s2 < CC.N; s2++) {
      let d = '';
      for (let i = 0; i < col.length; i++) {
        d += A.T.pt.charAt(CC.mod(A.ctPos[col.charCodeAt(i) - 65] - s2, CC.N));
      }
      const s = CA.chiSquare(d);
      if (s < as) { as = s; ak = s2; aTxt = d; }
    }

    const counts = CA.letterCounts(col);
    const sorted = counts.slice().sort(function (a, b) { return b - a; });
    if (has) scored++;
    const bOK = has && bTxt === want;
    const aOK = has && aTxt === want;
    if (bOK) blindOK++;
    if (aOK) alphaOK++;
    blindKey += CC.ALPHABET.charAt(bk);
    /* 旋转量反推指示字母：shift = ctPos(x) − aCol，所以 x = ct[(shift + aCol) mod 26]。 */
    alphaInd += A.T.ct.charAt(CC.mod(ak + A.T.aCol, CC.N));

    BR.rows.push({
      j: j, n: col.length, has: has,
      ic: CA.indexOfCoincidence(col),
      sorted: sorted,
      blindK: bk, blindChi: bs, blindOK: bOK,
      alphaShift: ak, alphaChi: as, alphaOK: aOK,
      trueShift: BR.pure ? A.T.rows[j % A.L].shift : null,
      trueKey: BR.pure ? A.T.rows[j % A.L].key : null
    });
  }
  BR.blindKey = blindKey;
  BR.alphaInd = alphaInd;
  BR.blindOK = blindOK;
  BR.alphaOK = alphaOK;
  BR.scored = scored;
  BR.hasSignal = scored > 0;
  /* 两条恢复出来的明文都走既有模块，不在这里手工拼字符串：盲攻击当成维吉尼亚
     解、表攻击把恢复出的指示词交回 quagmire.decrypt。这样屏幕上那两行字确实是
     "用这把恢复出来的钥匙解出来的东西"，而不是页面另算的一份近似。 */
  BR.blindPlain = BR.hasSignal ? VIG.decrypt(A.cipher, blindKey) : '';
  BR.alphaPlain = BR.hasSignal ? QG.decrypt(A.cipher, qopts(alphaInd)) : '';

  /* "每一列就是一张单表代换"是这一页的全部前提，所以当场跑一遍，而不是写成一句
     旁白：向算法模块要出第 j 列的那张 26 字母排列密钥，用 substitution.encrypt
     把真明文列加密一遍，看它是不是逐字节等于密文列。两份实现哪天走岔了，屏幕上
     那条横幅会自己变色，而不是继续印着一句不再成立的话——第一页那条"不编钥匙
     就是维吉尼亚"的复核用的是同一手法。 */
  BR.subCheck = null;
  if (BR.pure && BR.hasSignal) {
    const keys = QG.cosetKeys(qopts());
    let ok = true;
    for (let j = 0; j < hyp && ok; j++) {
      if (!BR.plainCols[j].length) continue;
      ok = SUB.encrypt(BR.plainCols[j], keys[j % A.L]) === BR.cols[j];
    }
    BR.subCheck = ok;
  }
  return BR;
}

/* ================= 页签一：表格 ================= */

  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showStrip', label: { en: 'Message strip', zh: '报文条' }, color: CYAN, checked: true },
    { key: 'showAcol', label: { en: 'A-column', zh: 'A 列' }, color: VIOLET, checked: true },
    { key: 'showVigCheck', label: { en: 'Vigenère check', zh: '维吉尼亚复核' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const pos = A.n ? TL.index % A.n : 0;
    const jRow = A.L ? pos % A.L : 0;
    const actCol = A.n ? A.ptCol[A.plainIdx[pos]] : -1;

    /* ---- 先量，再画 ----
       四段（规则条 / 复核条 / 报文条 / 表格）的高度全部先算出来，再把整块在可用
       区域里**垂直居中**。不这么做画面会一律堆在上半部、下半部空着一大片，而
       "canvas 是主角"这条原则的意思正是这块地要被用起来。 */
    const ruleH = 32;
    const bannerH = E.state.showVigCheck ? 28 : 0;
    const gap = 1;

    /* 报文条：格**数**去凑空间，不是把格子压到一个下限了事。凯撒页在 375px 上
       被裁掉过两端的字母，就是因为反过来做：先定个数、再把尺寸 clamp 到一个
       下限，于是"放不下"变成了"画出去"。

       凑的目标 S_FIT 取 17 而不是可读下限 14：拿下限去算个数，宽屏上会排出
       八十多格 12px 的字母——每一格都"没画出界"，合起来却是一条读不出字的
       噪声带（1280px 上实测就是这样，字母挤成一片）。下限只用来夹最终的格宽，
       决定**画几个**的那个数应该是"舒服的大小"，不是"还能忍的大小"。 */
    const sGap = 3, S_FIT = 17, S_MIN = 14, S_MAX = 24, sRowGap = 12;
    let sCell = 0, sn = 0, stripH = 0;
    if (E.state.showStrip && A.n) {
      sn = Math.max(1, Math.min(A.n, Math.floor((B.w + sGap) / (S_FIT + sGap))));
      sCell = E.clamp((B.w - sGap * (sn - 1)) / sn, S_MIN, S_MAX);
      stripH = 3 * sCell + 2 * sRowGap + 18;
    }

    /* 表格：先按宽度定列数与格宽，再按剩下的高度定能画几行；两者一起夹住格子
       大小。放不下的列与行都用省略号明说，而不是让它们悄悄被画布边缘吃掉——
       被裁掉的字母看上去仍像内容的一部分。 */
    const labW = Math.min(30, Math.max(20, B.w * 0.07));
    const availW = B.w - labW - 4;
    const C_MIN = 11, C_MAX = 26;
    const nc = Math.max(6, Math.min(CC.N, Math.floor((availW + gap) / (C_MIN + gap))));
    /* 列宽只由宽度决定；行高单独算。
       表格的格子**不必是正方形**：26 列在 375px 上本来就只能给到 11 点几，
       硬要正方形等于把行高也钉死在 11px，于是竖直方向白白空掉大半屏——
       实测 375×812 上表格只占 92px，而可用高度有 588px，"canvas 是主角"
       这条原则要的正是那块地被用起来。所以列宽管"放得下几列"，行高去吃掉
       多余的竖直空间，最多拉到列宽的 1.9 倍（再高就不像一张表了）。
       字号取两者里**小**的那个，否则字会从左右溢出格子。 */
    const cw = Math.max(9, Math.min(C_MAX, (availW - gap * (nc - 1)) / nc));
    /* 竖直预算里**每一段都要记账**：表格下面还有那行"列 1–24 / 26"的说明
       （连同它上下的留白共 capH）和最底下那条当前步骤（stepH）。
       漏记它们的后果不是"挤一挤"，而是 totalH 超过 B.h 之后垂直居中那一步
       退化成 y = B.y，整块内容原样往下顶——1280×720 上实测顶出 contentBox
       底边 16px，正好压在传输条上。canvas 是全屏的，越界不会被裁掉，只会
       盖到浮层下面去。 */
    const capH = 22, stepH = 26;
    const tabAvail = Math.max(60, B.h - ruleH - bannerH - stripH - capH - stepH);
    const nr = Math.max(1, Math.min(A.L, Math.floor((tabAvail + gap) / (cw + gap)) - 1));
    /* ch 的下界是 cw，而 nr 正是按 cw 算出来的，所以 (nr+1)*ch + nr*gap 永远
       不会超过 tabAvail —— 夹到下界时两者恰好相等。 */
    const ch = E.clamp((tabAvail - gap * nr) / (nr + 1), cw, cw * 1.9);
    const cellFS = Math.min(cw, ch) * 0.54;
    const tabH = (nr + 1) * ch + nr * gap;

    const totalH = ruleH + bannerH + stripH + tabH + capH + stepH;
    let y = B.y + Math.max(0, (B.h - totalH) / 2);

    /* ---- 规则条 ---- */
    chipFit(B.x, y, B.w, 26,
           'Quagmire ' + romanOf(VAR) + '   ·   ' + E.t(VC().rule),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 12.5 });
    y += ruleH;

    /* ---- 复核条：两张表都不编钥匙时，当场比一遍"它就是维吉尼亚" ---- */
    if (E.state.showVigCheck) {
      if (A.unkeyed) {
        chipFit(B.x, y, B.w, 24,
               E.t(A.matchesVig
                   ? { en: 'both alphabets unkeyed — verified byte-identical to vigenere.encrypt(text, ',
                       zh: '两张表都不编钥匙 —— 已当场复核，与 vigenere.encrypt(text, ' }
                   : { en: 'both alphabets unkeyed but the two implementations disagree — ',
                       zh: '两张表都不编钥匙，但两份实现对不上 —— ' }) + IND + ')',
               { mono: true, color: A.matchesVig ? EMERALD : ORANGE, fontSize: 11,
                 fill: A.matchesVig ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.12)',
                 stroke: A.matchesVig ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.5)' });
      } else {
        chipFit(B.x, y, B.w, 24,
               E.t({ en: 'keyed: pt ', zh: '编了钥匙：明文表 ' }) +
               (A.ptKeyedNow ? clip(A.T.pt, 26) : 'A–Z') +
               E.t({ en: '  ·  ct ', zh: '  ·  密文表 ' }) +
               (A.ctKeyedNow ? clip(A.T.ct, 26) : 'A–Z'),
               { mono: true, color: VIOLET, fontSize: 10,
                 fill: 'rgba(167,139,250,.08)', stroke: 'rgba(167,139,250,.4)' });
      }
      y += bannerH;
    }

    /* ---- 报文条：明文 / 指示词 / 密文 ---- */
    if (E.state.showStrip && A.n) {
      const total = sn * sCell + (sn - 1) * sGap;
      const sx = B.x + (B.w - total) / 2;
      const start = Math.round(E.clamp(pos - Math.floor(sn / 2), 0, Math.max(0, A.n - sn)));
      const y0 = y, y1 = y0 + sCell + sRowGap, y2 = y1 + sCell + sRowGap;
      for (let i = 0; i < sn; i++) {
        const gi = start + i;
        const x = sx + i * (sCell + sGap);
        const on = (gi === pos);
        const rep = Math.floor(gi / A.L);
        chipFit(x, y0, sCell, sCell, CC.ALPHABET.charAt(A.plainIdx[gi]),
               { stroke: on ? CYAN : 'rgba(45,212,234,.30)', width: on ? 1.8 : 1,
                 fill: on ? 'rgba(45,212,234,.16)' : null, color: CYAN, fontSize: sCell * 0.56 });
        /* 指示词格按"第几遍重复"深浅交替：重复本身才是周期的来源，一条颜色
           均匀的指示词行看不出它在循环。 */
        chipFit(x, y1, sCell, sCell, A.T.rows[gi % A.L].key,
               { fill: rep % 2 === 0 ? 'rgba(167,139,250,.20)' : 'rgba(167,139,250,.08)',
                 stroke: on ? VIOLET : 'rgba(167,139,250,.34)', width: on ? 1.8 : 1,
                 color: VIOLET, fontSize: sCell * 0.56 });
        chipFit(x, y2, sCell, sCell, CC.ALPHABET.charAt(A.cipherIdx[gi]),
               { fill: 'rgba(251,113,133,.10)',
                 stroke: on ? ROSE : 'rgba(251,113,133,.34)', width: on ? 1.8 : 1,
                 color: ROSE, fontSize: sCell * 0.56 });
      }
      if (start > 0) chipFit(sx - 15, y0, 13, sCell, '…', { color: DIM, fontSize: sCell * 0.5 });
      if (start + sn < A.n) chipFit(sx + total + 2, y0, 13, sCell, '…', { color: DIM, fontSize: sCell * 0.5 });
      y += stripH;
    }

    /* ---- 表格本体 ---- */
    const tw = labW + nc * cw + (nc - 1) * gap;
    const tx = B.x + Math.max(0, (B.w - tw) / 2);
    /* 列窗口要**同时**框住 A 列与当前列。只居中在当前列的话，窄屏上 A 列会
       时不时滑出窗口——而"每一行的指示字母都站在 A 列"正是这一页唯一要讲的
       那件事，让它间歇性消失等于把这一页的主张藏起来。两列离得太远（超过窗口
       宽度）时没得选，退回居中在当前列，下面那行说明会写出显示的是哪几列。 */
    const aC = A.T.aCol;
    const actC = (actCol >= 0) ? actCol : aC;
    const lo = Math.min(aC, actC), hi = Math.max(aC, actC);
    const cStart = Math.round(E.clamp(
      (hi - lo + 1 <= nc) ? lo - (nc - (hi - lo + 1)) / 2 : actC - Math.floor(nc / 2),
      0, Math.max(0, CC.N - nc)));
    const rStart = Math.round(E.clamp(jRow - Math.floor(nr / 2), 0, Math.max(0, A.L - nr)));

    /* 表头：明文表。这一行就是"一个明文字母落在第几列"的全部定义。 */
    for (let i = 0; i < nc; i++) {
      const col = cStart + i;
      const x = tx + labW + i * (cw + gap);
      const isA = (col === aC);
      const isAct = (col === actCol);
      chipFit(x, y, cw, ch, A.T.pt.charAt(col),
             { fill: isAct ? 'rgba(45,212,234,.18)' : (isA && E.state.showAcol ? 'rgba(167,139,250,.14)' : null),
               stroke: isAct ? CYAN : (isA && E.state.showAcol ? VIOLET : 'rgba(45,212,234,.22)'),
               width: (isAct || (isA && E.state.showAcol)) ? 1.6 : 1,
               color: CYAN, fontSize: cellFS });
    }
    chipFit(tx, y, labW, ch, 'pt', { mono: true, color: DIM, fontSize: Math.min(10, ch * 0.44) });

    for (let r = 0; r < nr; r++) {
      const jr = rStart + r;
      const row = A.T.rows[jr];
      const ry = y + (r + 1) * (ch + gap);
      const onRow = (jr === jRow);
      chipFit(tx, ry, labW, ch, row.key,
             { fill: onRow ? 'rgba(167,139,250,.22)' : 'rgba(167,139,250,.07)',
               stroke: onRow ? VIOLET : 'rgba(167,139,250,.3)', width: onRow ? 1.6 : 1,
               color: VIOLET, fontSize: Math.min(ch * 0.56, 15) });
      for (let i = 0; i < nc; i++) {
        const col = cStart + i;
        const x = tx + labW + i * (cw + gap);
        const isA = (col === aC);
        const hit = onRow && col === actCol;
        chipFit(x, ry, cw, ch, row.letters.charAt(col),
               { fill: hit ? 'rgba(251,113,133,.28)'
                           : (isA && E.state.showAcol ? 'rgba(167,139,250,.12)'
                                                      : (onRow ? 'rgba(251,113,133,.06)' : null)),
                 stroke: hit ? ROSE : (isA && E.state.showAcol ? 'rgba(167,139,250,.5)' : LINE),
                 width: hit ? 1.8 : 1,
                 color: hit ? ROSE : (onRow ? 'rgba(251,113,133,.85)' : 'rgba(226,232,240,.55)'),
                 fontSize: cellFS });
      }
    }
    y += (nr + 1) * ch + nr * gap + 6;

    /* 被窗口切掉的部分明说 */
    const cut = [];
    if (nc < CC.N) cut.push(E.t({ en: 'columns ', zh: '列 ' }) + (cStart + 1) + '–' + (cStart + nc) +
                            E.t({ en: ' of 26', zh: ' / 26' }));
    if (nr < A.L) cut.push(E.t({ en: 'rows ', zh: '行 ' }) + (rStart + 1) + '–' + (rStart + nr) +
                           E.t({ en: ' of ', zh: ' / ' }) + A.L);
    if (cut.length) {
      chipFit(B.x, y, B.w, 14, cut.join('  ·  '), { mono: true, color: DIM, fontSize: 9.5 });
    }
    y += 16;

    /* ---- 当前这一步 ---- */
    if (A.n) {
      chipFit(B.x, y, B.w, 24,
             E.t({ en: 'plain ', zh: '明文 ' }) + CC.ALPHABET.charAt(A.plainIdx[pos]) +
             E.t({ en: ' → column ', zh: ' → 第 ' }) + actCol + E.t({ en: '', zh: ' 列' }) +
             E.t({ en: '  ·  row ', zh: '  ·  行 ' }) + A.T.rows[jRow].key +
             ' (rot ' + A.T.rows[jRow].shift + ')' +
             E.t({ en: '  →  cipher ', zh: '  →  密文 ' }) + CC.ALPHABET.charAt(A.cipherIdx[pos]),
             { mono: true, fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 11 });
    } else {
      chipFit(B.x, y, B.w, 24,
             E.t({ en: 'no letters in the plaintext', zh: '明文里一个字母都没有' }),
             { mono: true, color: ORANGE, fontSize: 11 });
    }
  },
  readout: function () {
    syncIoLabels();
    const A = analysis();
    let s = '<b style="--c:var(--trace-violet)">Quagmire ' + romanOf(VAR) + '</b>' +
      '<span class="dim">  ' + esc(E.t(VC().rule)) + '</span><br>' +
      '<span class="dim">pt </span><b style="--c:var(--trace-cyan)">' + esc(A.T.pt) + '</b><br>' +
      '<span class="dim">ct </span><b style="--c:var(--trace-rose)">' + esc(A.T.ct) + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'indicator ', zh: '指示词 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + esc(clip(IND, 26)) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'period ', zh: '周期 ' }) + A.L +
      ' · A ' + E.t({ en: 'at column ', zh: '在第 ' }) + A.T.aCol + E.t({ en: '', zh: ' 列' }) +
      '</span><br>';
    if (!A.n) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters to encrypt', zh: '没有字母可加密' }) + '</b>';
    }
    const pos = TL.index % A.n;
    s += E.t({ en: 'position ', zh: '第 ' }) + pos +
      E.t({ en: ' · row ', zh: ' 个字母 · 第 ' }) + (pos % A.L) + E.t({ en: '', zh: ' 行' }) + '<br>' +
      '<b style="--c:var(--trace-cyan)"><i>' + CC.ALPHABET.charAt(A.plainIdx[pos]) + '</i></b>' +
      ' <span class="dim">→</span> ' +
      '<b style="--c:var(--trace-rose)"><i>' + CC.ALPHABET.charAt(A.cipherIdx[pos]) + '</i></b><br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(clip(A.cipher, 60)) + '</b><br>';
    if (A.unkeyed) {
      s += '<b style="--c:var(--trace-emerald)">' +
        E.t(A.matchesVig ? { en: 'unkeyed → identical to Vigenère (checked)',
                             zh: '不编钥匙 → 与维吉尼亚相同（已复核）' }
                         : { en: 'unkeyed but NOT identical — implementations disagree',
                             zh: '不编钥匙却**不**相同 —— 两份实现对不上' }) + '</b><br>';
    }
    return s + '<span class="dim">' + esc(E.t(VC().note)) + '</span>';
  }
};

/* ================= 页签二：找周期 —— 顿悟视角 =================
   两条重合指数曲线画在同一根横轴上：紫色是 Quagmire，翠绿是同明文同指示词的
   纯维吉尼亚。它们在真周期以及它的每一个倍数上**逐位相同**，差 0；在别的 p 上
   两边都塌在随机档里、各自抖各自的。下面那一格是 Kasiski。 */
const periodTab = {
  label: { en: 'Find the Period', zh: '找周期' },
  brand: { en: 'The keyed alphabets change what each column is, not how many columns there are. The period attack does not notice.',
           zh: '编了钥匙的字母表改变的是「每一列是什么」，不是「有几列」。周期这一步根本察觉不到。' },
  tips: { en: 'The epiphany view. Drag p onto the true period: the two IoC curves coincide exactly on p, 2p, 3p… and Δ snaps to zero. Measured over 896 ciphertexts × 20 candidate periods, Δ is exactly 0 on every multiple of the true period — 3472 values, no exception. Read it one way only: Δ > 0 proves the period does not divide p, while Δ = 0 is merely consistent with it (on the 12-letter text that reading is right just 23% of the time, because both curves degenerate together). The emerald twin is a teaching comparison, not an attack — a real analyst has no Vigenère curve to lay beside it.',
          zh: '顿悟视角。把 p 拖到真周期上：两条重合指数曲线在 p、2p、3p…… 处**完全重合**，Δ 当场归零。实测 896 段密文 × 20 个候选周期，凡是真周期的倍数 Δ 恒为 0 —— 3472 个取值，一个例外都没有。但只能单向地读：Δ > 0 **证明**真周期不整除 p；Δ = 0 只说明"没被证伪"（12 字母那条预置上这样读只有 23% 是对的 —— 列太短，两条曲线一起退化成 0）。翠绿那条是给你看的对照，不是攻击手段：真正的分析者手里没有一条维吉尼亚曲线可以摆在旁边。' },
  params: ['p'],
  presets: VARIANT_PRESETS,
  presetsLabel: VARIANT_PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showIC', label: { en: 'Quagmire IoC', zh: 'Quagmire 重合指数' }, color: VIOLET, checked: true },
    { key: 'showTwin', label: { en: 'Vigenère twin', zh: '维吉尼亚孪生曲线' }, color: EMERALD, checked: true },
    { key: 'showKasiski', label: { en: 'Kasiski score', zh: 'Kasiski 分数' }, color: ORANGE, checked: true },
    { key: 'showMultiples', label: { en: 'p and multiples', zh: 'p 与它的倍数' }, color: CYAN, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const hyp = Math.max(1, Math.round(E.state.p || 1));
    const gap = icGap(hyp);

    const padL = 46, padR = 12;
    const px0 = B.x + padL, pw = Math.max(120, B.w - padL - padR);
    const xOf = function (p) { return px0 + (p - 1) * pw / (MAXP - 1); };

    /* 顶上一条图例，把三条量的颜色与含义钉在一起（规范第 3 条：同一条量在图例
       点、曲线本体、峰值标记、读数粗体值上是同一个颜色）。 */
    let y = B.y;
    const legW = Math.min(132, B.w / 4 - 5);
    const legs = [
      [E.t({ en: 'Quagmire', zh: 'Quagmire' }), VIOLET, 'rgba(167,139,250,.10)', 'rgba(167,139,250,.4)'],
      [E.t({ en: 'Vigenère', zh: '维吉尼亚' }), EMERALD, 'rgba(52,211,153,.10)', 'rgba(52,211,153,.4)'],
      ['Kasiski', ORANGE, 'rgba(251,146,60,.10)', 'rgba(251,146,60,.4)'],
      ['p = ' + hyp, CYAN, 'rgba(45,212,234,.10)', 'rgba(45,212,234,.4)']
    ];
    legs.forEach(function (L, i) {
      chipFit(B.x + (legW + 5) * i, y, legW, 22, L[0],
             { mono: true, color: L[1], fill: L[2], stroke: L[3], fontSize: 10.5 });
    });
    y += 28;

    /* Δ 牌：p 与它的倍数上两条曲线的最大差。措辞是**单向**的，见 icGap() 上面
       那段实测——Δ > 0 是"真周期不整除 p"的证明，Δ = 0 只是没被证伪。 */
    const zero = gap < 1e-12;
    chipFit(B.x, y, B.w, 24,
           E.t({ en: 'max |ΔIoC| on p, 2p, 3p… = ', zh: 'p、2p、3p…… 上两条曲线的最大差 = ' }) +
           (zero ? '0.000000' : gap.toFixed(6)) +
           (zero ? E.t({ en: '   → consistent with the period dividing p (not proof)',
                         zh: '   → 与「真周期整除 p」相容（不是证明）' })
                 : E.t({ en: '   → proof that it does not', zh: '   → 证明真周期不整除 p' })),
           { mono: true, fontSize: 10.5, color: zero ? EMERALD : ORANGE,
             fill: zero ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.08)',
             stroke: zero ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.4)' });
    y += 32;

    /* 底下要留出横轴：刻度画在 kB+4 起的 14px 里，横轴标题画在 kB+22 起的 16px
       里，也就是 kB 之下还有 38px。留 26 会让标题的底边正好落在 contentBox
       之外 12px——无头探针在四种视口上量到的都是这个 12。 */
    const AXIS_H = 40;
    const avail = B.y + B.h - y - AXIS_H;
    const panelH = Math.max(58, (avail - 34) / 2);

    /* ---------- 上：逐周期重合指数，两条 ---------- */
    const icY = y, icB = icY + panelH;
    let icLo = Math.min(IC_RANDOM * 0.82, IC_ENGLISH * 0.9);
    let icHi = IC_ENGLISH * 1.10;
    A.ic.forEach(function (e) { icLo = Math.min(icLo, e.ic); icHi = Math.max(icHi, e.ic); });
    A.icVig.forEach(function (e) { icLo = Math.min(icLo, e.ic); icHi = Math.max(icHi, e.ic); });
    const icAt = function (v) { return icB - (v - icLo) / (icHi - icLo || 1) * panelH; };

    seg(px0 - 6, icB, px0 + pw + 4, icB, { color: LINE, width: 1 });
    /* 两条基准线：英文 0.0665 与均匀随机 1/26。整段密文那一点（p=1）落在随机线
       附近，正是"多表把重合指数压低了"的直接证据——没有它，后面的高峰无从对比。 */
    [[IC_ENGLISH, 'rgba(226,232,240,.55)', E.t({ en: 'English', zh: '英文' })],
     [IC_RANDOM, 'rgba(159,176,200,.55)', E.t({ en: 'random', zh: '随机' })]].forEach(function (rl) {
      const ry = icAt(rl[0]);
      if (ry < icY - 2 || ry > icB + 2) return;
      seg(px0 - 6, ry, px0 + pw + 4, ry, { color: rl[1], width: 1, dash: [4, 5] });
      chipFit(B.x - 6, ry - 8, padL, 16, rl[2], { mono: true, color: rl[1], fontSize: 9.5 });
    });

    if (E.state.showMultiples) {
      for (let m = hyp; m <= MAXP; m += hyp) {
        seg(xOf(m), icY - 4, xOf(m), icB, {
          color: m === hyp ? 'rgba(45,212,234,.75)' : 'rgba(45,212,234,.28)',
          width: m === hyp ? 1.6 : 1, dash: m === hyp ? null : [3, 4] });
      }
    }

    /* 孪生曲线先画、画得粗：紫色那条压在它上面，两条重合时看到的是紫色描在
       一条更宽的翠绿带子上——"完全重合"这件事因此是**看得见的**，而不是要靠
       读数字才知道。两条各画各的话，重合时后画的那条会把前一条整个盖住，
       画面上就只剩一条线，反而像是有一条没画出来。 */
    if (E.state.showTwin) {
      const pts = A.icVig.map(function (e) { return [xOf(e.period), icAt(e.ic)]; });
      poly(pts, { color: 'rgba(52,211,153,.85)', width: 5 });
    }
    if (E.state.showIC) {
      const pts = A.ic.map(function (e) { return [xOf(e.period), icAt(e.ic)]; });
      poly(pts, { color: VIOLET, width: 2 });
      for (let i = 0; i < pts.length; i++) {
        const p = A.ic[i].period;
        const high = A.icHighs.indexOf(p) >= 0;
        dot(pts[i][0], pts[i][1], high ? 3.4 : 2.2, high ? VIOLET : 'rgba(167,139,250,.55)');
        if (high) ring(pts[i][0], pts[i][1], 6.5, 'rgba(167,139,250,.75)', 1.2);
      }
      /* 标峰：只说"峰在这里"，不说"周期就是这个"。标签默认画在点的上方，但峰值
         往往正好顶在面板顶（量程就是按峰值定的），那时改画在点的下方——一个越界
         的标签会把上面那行图例挡掉，而那一行是"哪条曲线是哪条"的唯一说明。 */
      const pk = A.icPeak;
      const pky = icAt(pk.ic);
      ring(xOf(pk.period), pky, 9.5, VIOLET, 1.8);
      chipFit(clampX(xOf(pk.period) - 34, 68, B), pky - 26 >= icY ? pky - 26 : pky + 11, 68, 17,
             E.t({ en: 'peak ', zh: '峰 ' }) + pk.period,
             { mono: true, color: VIOLET, fill: CARD, stroke: 'rgba(167,139,250,.45)', fontSize: 10 });
    }
    chipFit(B.x - 6, icY - 2, padL, 14, E.fmt(icHi, 3), { mono: true, color: DIM, fontSize: 9 });

    /* ---------- 下：Kasiski ---------- */
    const kY = icB + 34, kB = kY + panelH;
    seg(px0 - 6, kB, px0 + pw + 4, kB, { color: LINE, width: 1 });

    if (E.state.showMultiples) {
      for (let m = hyp; m <= MAXP; m += hyp) {
        seg(xOf(m), kY - 4, xOf(m), kB, {
          color: m === hyp ? 'rgba(45,212,234,.75)' : 'rgba(45,212,234,.28)',
          width: m === hyp ? 1.6 : 1, dash: m === hyp ? null : [3, 4] });
      }
    }

    if (E.state.showKasiski) {
      if (!A.kas.length) {
        /* 空数组必须**明说**。把它当 [0] 读，页面就会印出一个凭空捏造的
           "最可能的周期"——这是这一族分析工具最容易犯的那个错。 */
        const noteW = Math.min(pw, 420);
        chipFit(px0 + (pw - noteW) / 2, kY + panelH / 2 - 14, noteW, 28,
               E.t({ en: 'no repeated sequences — Kasiski has nothing to say here',
                     zh: '没有任何重复片段 —— Kasiski 在这里无话可说' }),
               { mono: true, color: ORANGE, fontSize: 11,
                 fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.4)' });
      } else {
        let kLo = 0, kHi = 0.08;
        A.kas.forEach(function (e) { kLo = Math.min(kLo, e.score); kHi = Math.max(kHi, e.score); });
        const kAt = function (v) { return kB - (v - kLo) / (kHi - kLo || 1) * panelH; };
        const pts = [];
        for (let p = 2; p <= MAXP; p++) {
          const e = A.kasByP[p];
          if (e) pts.push([xOf(p), kAt(e.score)]);
        }
        if (kLo < 0) seg(px0 - 6, kAt(0), px0 + pw + 4, kAt(0), { color: LINE, width: 1, dash: [3, 4] });
        poly(pts, { color: ORANGE, width: 2 });
        for (let p = 2; p <= MAXP; p++) {
          const e = A.kasByP[p];
          if (e) dot(xOf(p), kAt(e.score), 2.4, 'rgba(251,146,60,.75)');
        }
        const top = A.kasTop;
        const tky = kAt(top.score);
        ring(xOf(top.period), tky, 9.5, ORANGE, 1.8);
        chipFit(clampX(xOf(top.period) - 44, 88, B), tky - 26 >= kY ? tky - 26 : tky + 11, 88, 17,
               E.t({ en: 'rank 1 ', zh: '第一名 ' }) + top.period + ' · ' + E.fmt(top.score),
               { mono: true, color: ORANGE, fill: CARD, stroke: 'rgba(251,146,60,.45)', fontSize: 10 });
        chipFit(B.x - 6, kY - 2, padL, 14, E.fmt(kHi), { mono: true, color: DIM, fontSize: 9 });
      }
    }

    /* ---------- 横轴刻度 ---------- */
    const step = (pw / (MAXP - 1)) >= 15 ? 1 : 2;
    for (let p = 1; p <= MAXP; p += step) {
      chipFit(xOf(p) - 9, kB + 4, 18, 14, String(p),
             { color: (p % hyp === 0) ? CYAN : DIM, fontSize: 9.5 });
    }
    chipFit(B.x, kB + 22, B.w, 16, E.t({ en: 'candidate period p', zh: '候选周期 p' }),
           { mono: true, color: DIM, fontSize: 10 });
  },
  readout: function () {
    syncIoLabels();
    const A = analysis();
    const hyp = Math.max(1, Math.round(E.state.p || 1));
    const gap = icGap(hyp);
    let s = '<span class="dim">' + A.n + E.t({ en: ' cipher letters · Quagmire ', zh: ' 个密文字母 · Quagmire ' }) +
      romanOf(VAR) + '</span><br>';
    if (!A.kas.length) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'Kasiski: no repeated sequences', zh: 'Kasiski：没有重复片段' }) + '</b><br>';
    } else {
      s += '<span class="dim">Kasiski </span>' +
        A.kas.slice(0, 3).map(function (e) {
          return '<b style="--c:var(--trace-orange)">' + e.period + '</b>' +
            '<span class="dim">(' + E.fmt(e.score) + ')</span>';
        }).join('<span class="dim"> · </span>') + '<br>' +
        '<span class="dim">' +
        E.t({ en: 'resolves the period or a multiple of it', zh: '只能定到周期或它的倍数' }) +
        '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'IoC peak ', zh: '重合指数峰 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + A.icPeak.period + '</b>' +
      '<span class="dim"> (' + E.fmt(A.icPeak.ic, 4) + ')</span>' +
      '<span class="dim">   ' + E.t({ en: 'Vigenère ', zh: '维吉尼亚 ' }) + '</span>' +
      '<b style="--c:var(--trace-emerald)">' + A.icVig.reduce(function (a, b) { return b.ic > a.ic ? b : a; }).period +
      '</b><br>' +
      '<span class="dim">' + E.t({ en: 'high points ', zh: '高点 ' }) +
      (A.icHighs.length ? A.icHighs.join(', ') : '—') + '</span><br>';
    if (A.disagree) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'the two witnesses disagree', zh: '两个证人不一致' }) + '</b>' +
        '<span class="dim">  ' + E.t({ en: 'common on short text', zh: '短文本上很常见' }) + '</span><br>';
    }
    s += E.t({ en: 'your hypothesis ', zh: '你的假设 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>p</i> = ' + hyp + '</b>' +
      '<span class="dim">   Δ' + E.t({ en: ' on multiples ', zh: ' 在倍数上 ' }) + '</span>' +
      '<b style="--c:var(--trace-' + (gap < 1e-12 ? 'emerald' : 'orange') + ')">' +
      (gap < 1e-12 ? '0.000000' : gap.toFixed(6)) + '</b><br>' +
      '<span class="dim">' +
      E.t(gap < 1e-12
          ? { en: 'consistent with the period dividing p — not proof',
              zh: '与「真周期整除 p」相容 —— 但不是证明' }
          : { en: 'proof the period does not divide p', zh: '证明真周期不整除 p' }) +
      '</span><br>' +
      '<span class="dim">' + E.t({ en: 'over all p: max Δ = ', zh: '全部 p 上：最大 Δ = ' }) +
      A.dAll.toFixed(6) + '</span>';
    if (ACTIVE_NOTE) s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE)) + '</span>';
    return s;
  }
};

/* ================= 页签三：破解 =================
   周期定下来之后，密文按 p 分列。每一列都还是**单表**——列的重合指数弹回英文
   档位、把字母计数降序排一排仍然贴着英文的剖面。变的是那张表：维吉尼亚下它是
   一次位移（26 个候选），Quagmire 下它是 26! 里的一张。
   页面把两种攻击并排跑：凯撒那一步原样搬来（橙，当场失效），以及同一个 χ²
   换成"已知两张表之后的 26 个旋转"（翠绿，立刻复活）。 */
const solveTab = {
  label: { en: 'Solve', zh: '破解' },
  brand: { en: 'Split by p and every coset is still monoalphabetic — but a substitution now, not a shift. The fingerprint survives; the 26-candidate shortcut does not.',
           zh: '按 p 分列，每一列仍然是单表 —— 只是变成了代换，不再是位移。频率指纹还在；26 个候选那条捷径没了。' },
  tips: { en: 'The orange column is the Caesar step from the Vigenère tool, run unchanged: 6.6% of cosets over 2744 measured trials, against 3.8% for guessing. The emerald column is the same chi-square with the two alphabets supplied — 99.1%. Keying the alphabet moved the unknown; it did not add a step.',
          zh: '橙色那一列是维吉尼亚工具里的凯撒步骤，一行没改地跑：2744 次实测里只对 6.6%，而瞎猜是 3.8%。翠绿那一列是同一个 χ²，只是把两张字母表交给它 —— 99.1%。给字母表编钥匙是把未知量搬了个地方，不是多加了一道工序。' },
  params: ['p'],
  presets: VARIANT_PRESETS,
  presetsLabel: VARIANT_PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showProfile', label: { en: 'Sorted profile', zh: '排序后的频率剖面' }, color: ROSE, checked: true },
    { key: 'showBlind', label: { en: 'Blind shift attack', zh: '盲位移攻击' }, color: ORANGE, checked: true },
    { key: 'showAlpha', label: { en: 'Attack knowing the alphabets', zh: '已知两张表的攻击' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const S = breakState();

    let y = B.y;
    chipFit(B.x, y, B.w, 26,
           E.t({ en: 'split into ', zh: '按 ' }) + S.p +
           E.t({ en: ' cosets · each is one monoalphabetic substitution, not a shift',
                 zh: ' 分成的列 · 每一列是一张单表代换，不是一次位移' }),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 12 });
    y += 30;
    /* 上面那句话不是断言，是刚刚跑过的一次复核 —— 见 breakState() 里的 subCheck。 */
    if (S.subCheck !== null) {
      chipFit(B.x, y, B.w, 22,
             E.t(S.subCheck
                 ? { en: 'verified: substitution.encrypt(plain coset j, quagmire.cosetKeys()[j]) === cipher coset j',
                     zh: '已当场复核：substitution.encrypt(第 j 列明文, quagmire.cosetKeys()[j]) === 第 j 列密文' }
                 : { en: 'the coset keys do NOT reproduce the ciphertext — two implementations disagree',
                     zh: '那些列密钥**重现不出**密文 —— 两份实现对不上' }),
             { mono: true, fontSize: 10, color: S.subCheck ? EMERALD : ORANGE,
               fill: S.subCheck ? 'rgba(52,211,153,.08)' : 'rgba(251,146,60,.12)',
               stroke: S.subCheck ? 'rgba(52,211,153,.4)' : 'rgba(251,146,60,.5)' });
    }
    y += 28;

    /* 行块在可用区域里**垂直居中**，脚注紧跟在它下面（而不是钉死在画布底端）。
       p 小的时候行块只有一百来像素高，钉死脚注会在两者之间留出半屏空白，
       看起来像是页面加载了一半。 */
    const footH = 84;
    const rowsAvail = Math.max(60, B.y + B.h - y - footH);
    /* 上限给到 40 而不是 26：p 小的时候（3–5 列）26 会让整块只占一百多像素、
       在四百多像素的可用高度里缩成一小条，而那几行正是这一页要人看的东西。
       下限 11 仍然是"再矮就读不出柱子了"的那条线，p=20 时会撞到它。 */
    const rowH = E.clamp(rowsAvail / S.p, 11, 40);
    const blockH = 15 + S.p * rowH;
    const blockTop = y + Math.max(0, (rowsAvail - blockH) / 2);
    y = blockTop;

    /* 右侧那几列的**个数**随开关与 p 变，所以宽度是算出来的，不是写死的：
       写死一个"够宽"的常数，关掉两个开关之后柱子就白白短了一截。 */
    /* letW 给到 34 而不是 30：30 放不下表头那个 'shift'（9px 下要 28px，减掉
       内边距只剩 26），chipFit 会老老实实把它截成 'shi…'——一个被截断的**表头**
       比被截断的数据更糟，它是读懂这一列的唯一说明。 */
    const jW = 20, icW = 42, letW = 34, g = 7;
    const nSide = (E.state.showBlind ? 1 : 0) + (E.state.showAlpha ? 1 : 0) + (S.pure ? 1 : 0);
    const sideW = icW + nSide * (g + letW);
    const barW = E.state.showProfile
      ? Math.max(70, Math.min(420, B.w - jW - sideW - g * 2)) : 0;
    const rowW = jW + g + barW + g + sideW;
    const x0 = B.x + Math.max(0, (B.w - rowW) / 2);
    const bx = x0 + jW + g;
    let hx = bx + barW + g;
    const icX = hx; hx += icW + g;
    const blindX = E.state.showBlind ? hx : -1; if (E.state.showBlind) hx += letW + g;
    const alphaX = E.state.showAlpha ? hx : -1; if (E.state.showAlpha) hx += letW + g;
    const trueX = S.pure ? hx : -1;

    chipFit(x0, y - 3, jW, 14, 'j', { color: DIM, fontSize: 9.5 });
    chipFit(icX, y - 3, icW, 14, 'IoC', { mono: true, color: VIOLET, fontSize: 9.5 });
    if (blindX >= 0) chipFit(blindX, y - 3, letW, 14, E.t({ en: 'shift', zh: '位移' }), { mono: true, color: ORANGE, fontSize: 8.5 });
    if (alphaX >= 0) chipFit(alphaX, y - 3, letW, 14, E.t({ en: 'table', zh: '查表' }), { mono: true, color: EMERALD, fontSize: 8.5 });
    if (trueX >= 0) chipFit(trueX, y - 3, letW, 14, E.t({ en: 'true', zh: '真钥' }), { mono: true, color: VIOLET, fontSize: 8.5 });
    y += 15;

    for (let j = 0; j < S.p; j++) {
      const R = S.rows[j];
      const ry = y + j * rowH;
      if (ry + rowH > B.y + B.h - footH + 6) break;        // 放不下的行不画出界
      const fs = Math.min(12, rowH * 0.6);
      chipFit(x0, ry, jW, rowH, String(j), { color: DIM, fontSize: Math.min(10, rowH * 0.55) });

      if (E.state.showProfile && barW > 0) {
        /* 26 根柱子 = 这一列的字母计数，**降序排列**。单表代换只给字母换名字，
           排序之后的形状原样保留，所以这一排柱子应当贴着英文的剖面走——那条
           翠绿折线就是英文的期望值，按同一个量程画。
           **必须显式给 max**：不锁量程的话每帧的最大值一变，所有柱子会整体跳
           一次高度，看起来像数据在抖。这里锁在"观测峰"与"英文期望峰"的较大者，
           两条曲线因此共用同一把尺子。 */
        const scale = Math.max(R.sorted[0] || 1, ENG_SORTED[0] * (R.n || 1));
        const bh = Math.max(3, rowH - 4);
        E.barChart(bx, ry + 2, barW, bh, R.sorted, {
          max: scale, gap: 1,
          colorAt: function () { return R.has ? 'rgba(251,113,133,.55)' : 'rgba(148,163,184,.18)'; }
        });
        /* 参照线只在行够高时画。p=20 时每行只有 11px，26 段折线挤在里面既看不清，
           又要每帧多画 500 条线段（poly 拆成 flowArrow，每条各 save/restore 一次）。
           看不清的东西不值得那个开销。 */
        if (R.has && rowH >= 13) {
          const bw = (barW - 25) / 26;
          const pts = [];
          for (let i = 0; i < 26; i++) {
            const v = ENG_SORTED[i] * R.n;
            pts.push([bx + i * (bw + 1) + bw / 2, ry + 2 + bh - Math.min(1, v / scale) * bh]);
          }
          poly(pts, { color: 'rgba(52,211,153,.8)', width: 1.2 });
        }
      }

      /* 列的重合指数。它是"这一列还是不是单表"的直接读数：真周期的倍数上它弹回
         英文的 0.066 附近，别的 p 上塌向 1/26。 */
      const icOK = R.ic >= (IC_RANDOM + IC_ENGLISH) / 2;
      chipFit(icX, ry, icW, rowH, R.has ? R.ic.toFixed(3) : '—',
             { mono: true, color: R.has ? (icOK ? VIOLET : ORANGE) : DIM,
               fontSize: Math.min(10, rowH * 0.52) });

      if (blindX >= 0) {
        chipFit(blindX, ry, letW, rowH, R.has ? CC.ALPHABET.charAt(R.blindK) : '—',
               { fill: R.blindOK ? 'rgba(52,211,153,.16)' : null,
                 stroke: R.blindOK ? 'rgba(52,211,153,.5)' : 'rgba(251,146,60,.28)',
                 color: R.blindOK ? EMERALD : ORANGE, fontSize: fs });
      }
      if (alphaX >= 0) {
        chipFit(alphaX, ry, letW, rowH,
               R.has ? A.T.ct.charAt(CC.mod(R.alphaShift + A.T.aCol, CC.N)) : '—',
               { fill: R.alphaOK ? 'rgba(52,211,153,.16)' : null,
                 stroke: R.alphaOK ? 'rgba(52,211,153,.5)' : 'rgba(251,146,60,.28)',
                 color: R.alphaOK ? EMERALD : ORANGE, fontSize: fs });
      }
      if (trueX >= 0) {
        chipFit(trueX, ry, letW, rowH, R.trueKey,
               { color: VIOLET, fontSize: fs });
      }
    }

    /* ---------- 脚注：两种攻击各拿回几列 ---------- */
    const fy = Math.min(blockTop + blockH + 18, B.y + B.h - footH + 8);
    if (!S.hasSignal) {
      chipFit(B.x, fy, B.w, 26,
             E.t({ en: 'no letters in the cosets — nothing to score',
                   zh: '列里一个字母都没有 —— 无从打分' }),
             { mono: true, color: ORANGE, fontSize: 11,
               fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.4)' });
      return;
    }
    if (!S.pure) {
      /* p 不是真周期的倍数时，每一列里混着几张表——两种攻击打出来的"获胜者"
         都没有含义。页面明说这件事，而不是让几乎等长的柱子替它含糊过去。 */
      chipFit(B.x, fy, B.w, 24,
             E.t({ en: 'p is not a multiple of the period — the cosets still mix rows',
                   zh: 'p 不是周期的倍数 —— 列里仍然混着不同的行' }),
             { mono: true, color: ORANGE, fontSize: 11,
               fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.4)' });
    } else {
      const bAll = S.blindOK === S.scored;
      chipFit(B.x, fy, B.w / 2 - 4, 24,
             E.t({ en: 'blind shift  ', zh: '盲位移  ' }) + S.blindOK + '/' + S.scored,
             { mono: true, fontSize: 11, color: bAll ? EMERALD : ORANGE,
               fill: bAll ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.08)',
               stroke: bAll ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.4)' });
      const aAll = S.alphaOK === S.scored;
      chipFit(B.x + B.w / 2 + 4, fy, B.w / 2 - 4, 24,
             E.t({ en: 'knowing the alphabets  ', zh: '已知两张表  ' }) + S.alphaOK + '/' + S.scored +
             '  ' + clip(S.alphaInd, 12),
             { mono: true, fontSize: 11, color: aAll ? EMERALD : ORANGE,
               fill: aAll ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.08)',
               stroke: aAll ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.4)' });
    }
    const maxChars = Math.max(12, Math.floor(B.w / 6.4));
    chipFit(B.x, fy + 28, B.w, 22, clip(S.blindPlain, maxChars),
           { mono: true, color: 'rgba(251,146,60,.75)', fontSize: 10.5 });
    chipFit(B.x, fy + 52, B.w, 22, clip(S.alphaPlain, maxChars),
           { mono: true, color: S.pure ? CYAN : 'rgba(159,176,200,.6)', fontSize: 10.5 });
  },
  readout: function () {
    syncIoLabels();
    const A = analysis();
    const S = breakState();
    let s = E.t({ en: 'hypothesis ', zh: '假设 ' }) +
      '<b style="--c:var(--trace-cyan)"><i>p</i> = ' + S.p + '</b>' +
      '<span class="dim">   ' + E.t({ en: 'true period ', zh: '真实周期 ' }) + A.L + '</span><br>';
    if (!S.hasSignal) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters — every coset scores χ² = ∞', zh: '没有字母 —— 每一列的 χ² 都是 ∞' }) +
        '</b>';
    }
    if (!S.pure) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'p is not a multiple of the period', zh: 'p 不是周期的倍数' }) +
        '</b><br><span class="dim">' +
        E.t({ en: 'the cosets still mix rows, so both attacks are meaningless here',
              zh: '列里仍然混着不同的行，所以两种攻击在这里都没有含义' }) + '</span><br>';
    }
    s += '<span class="dim">' + E.t({ en: 'blind shift (the Caesar step) ', zh: '盲位移（凯撒那一步） ' }) +
      '</span><b style="--c:var(--trace-orange)">' + S.blindOK + '/' + S.scored + '</b><br>' +
      '<span class="dim">' + E.t({ en: 'knowing both alphabets ', zh: '已知两张字母表 ' }) +
      '</span><b style="--c:var(--trace-emerald)">' + S.alphaOK + '/' + S.scored + '</b>' +
      '<span class="dim">   ' + esc(clip(S.alphaInd, 20)) + '</span><br>';
    if (A.unkeyed) {
      s += '<span class="dim">' +
        E.t({ en: 'unkeyed alphabets — the blind shift is the same attack, so it works',
              zh: '两张表都不编钥匙 —— 盲位移与查表是同一个攻击，所以它管用' }) + '</span><br>';
    } else {
      s += '<span class="dim">' +
        E.t({ en: '26 candidates per coset became 26! — but only if you insist on solving each coset alone',
              zh: '每列的候选从 26 变成 26! —— 但那是在你坚持一列一列单独解的前提下' }) + '</span><br>';
    }
    return s + '<span class="dim">' + esc(clip(S.alphaPlain, 68)) + '</span>';
  }
};

var SCENES = { tableau: tableauTab, period: periodTab, solve: solveTab };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中第一个
   变体并调它的 onSelect，而那之后第一帧就会调 analysis() 去读 PLAIN / IND。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
