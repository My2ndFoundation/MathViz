  syncBtns(textBtns, first.id);
  syncBtns(primerBtns, first.primer);
  syncBtns(cribBtns, CRIB);
}

function syncBtns(list, activeId) {
  list.forEach(function (b) { b.el.classList.toggle('active', b.id === activeId); });
}

/* #ioHost 里的标签是本页自己写进 DOM 的，不在引擎的 RELABEL 名单里，语言切换
   不会自动重刷它们。引擎在 applyLang() 末尾会调 updateReadout()，所以把这次
   同步挂在 readout() 里搭车——比自己去监听语言按钮可靠：不管语言是怎么变的，
   readout 都会跟着重算一次。顺便按当前页签与模式收起用不上的输入框：
   四个文本框全摊开会把面板顶得很长，而每个页签真正要动的只有其中一两个。 */
function setText(el, s) { if (el && el.textContent !== s) el.textContent = s; }
function show(el, on) { if (el) el.style.display = on ? '' : 'none'; }

function syncIo() {
  setText(elPlainLabel, E.t({ en: 'Plaintext — only letters consume the key',
                              zh: '明文 —— 只有字母会消耗密钥' }));
  setText(elPrimerLabel, E.t({ en: 'Primer — the only thing you have to send',
                               zh: '引钥 —— 唯一需要另外传的东西' }));
  setText(elKeyLabel, E.t({ en: 'Key text — must outlast the message',
                            zh: '密钥文本 —— 必须比报文更长' }));
  setText(elCribLabel, E.t({ en: 'Crib — a guess at some of the plaintext',
                             zh: 'Crib —— 对某处明文的一个猜测' }));
  show(boxPrimer, isAuto());
  show(boxKey, !isAuto());
  show(boxCrib, CUR === 'weakness');

  let note;
  if (isAuto() && !PRIMER_OK) {
    note = { en: 'no letters in the primer — falling back to A', zh: '引钥里没有字母 —— 退化成 A' };
  } else if (!isAuto() && !KEYTEXT_OK) {
    note = { en: 'no letters in the key text — falling back to A', zh: '密钥文本里没有字母 —— 退化成 A' };
  } else if (CUR === 'weakness' && !CRIB_OK) {
    note = { en: 'no letters in the crib — falling back to THE', zh: 'crib 里没有字母 —— 退化成 THE' };
  } else {
    const A = analysis();
    note = isAuto()
      ? { en: 'primer length L = ' + A.L + ' · key stream ' + A.n + ' letters, none of it repeating',
          zh: '引钥长度 L = ' + A.L + ' · 密钥流 ' + A.n + ' 个字母，没有一段重复' }
      : { en: 'key text ' + A.L + ' letters · message ' + A.n + (A.wrapped ? ' — the key wraps' : ' — the key holds'),
          zh: '密钥文本 ' + A.L + ' 个字母 · 报文 ' + A.n + (A.wrapped ? ' —— 密钥绕回去了' : ' —— 密钥够用') };
  }
  setText(elNote, E.t(note));
  textBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
  primerBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
  cribBtns.forEach(function (b) { setText(b.el, E.t(b.label)); });
}

/* ================= 模式：走引擎的 presets =================
   三个页签共用**同一个数组对象**——这正是引擎里"跨页签共享的同一份选择"
   那条分支要的形状：在任意一页换了模式，另外两页的按钮高亮跟着走。 */
const MODE_PRESETS = Object.keys(MODES).map(function (id) {
  return { key: id, label: MODES[id].label,
           onSelect: function () { MODE = id; invalidate(); } };
});
const MODE_PRESETS_LABEL = { en: 'Key stream', zh: '密钥流' };

/* ================= 时间轴 =================
   第一页要沿着报文一个字母一个字母走，所以步数 = 明文的字母数，而那个数会随
   使用者换预置、打字而变。createTimeline 的 steps 建好就定死，所以这里在长度
   变化时**重建**时间轴，把当前位置按新长度取模带过去。TL 因此必须是 let，
   而传输条上那三个回调都在**调用时**读 TL——写成 TL.step.bind(TL) 会把旧对象
   钉死在监听器里，重建之后按钮就哑了。 */
let TL = CryptoAnim.createTimeline({ steps: 1, stepDuration: 0.30, loop: true, rate: 1 });
TL.play();

function ensureTimeline(n) {
  const steps = Math.max(1, n);
  if (TL.steps === steps) return;
  const at = TL.index % steps;
  TL = CryptoAnim.createTimeline({ steps: steps, stepDuration: 0.30, loop: true, rate: TL.rate });
  TL.seek(at);
  TL.play();
}

/* 喂给时间轴的必须是引擎已经夹过的 state.dt（[0, 0.05]），不能是自己用
   performance.now() 算的差值——tick() 刻意没有内部步长上限，后台标签页回来
   那一下的时间跳变会让它真的补上几千步。 */
function tickClock() {
  ensureTimeline(CC.letters(PLAIN).length);
  TL.setRate(E.state.speed || 1);
  if (E.state.running) TL.tick(E.state.dt);
}

document.getElementById('btnBack').addEventListener('click', function () { TL.step(-1); });
document.getElementById('btnStep').addEventListener('click', function () { TL.step(1); });
/* ⟲ 上已经挂了引擎的 resetSim()；再挂一条把位置拨回第 0 个字母。用 seek(0)
   而不是 TL.reset()：reset() 会把 playing 置 false，而 playing 在本页恒为 true
   （真正的闸门是 tickClock() 里的 state.running）。 */
document.getElementById('btnReset').addEventListener('click', function () { TL.seek(0); });

var PARAMS = [
  /* fmt 必须是**函数**：引擎 buildParams() 里写的是 p.fmt(parseFloat(input.value))。
     给一个数字会在建面板时当场 TypeError，整个页面停在空白 canvas 上。 */
  { key: 'vigLen',
    label: { en: 'comparison key length <i>L</i>', zh: '对照密钥长度 <i>L</i>' },
    min: 2, max: 12, step: 1, value: 7,
    fmt: function (v) { return String(Math.round(v)); } },
  { key: 'rank',
    label: { en: 'candidate <i>#</i>', zh: '第几名候选 <i>#</i>' },
    min: 1, max: 8, step: 1, value: 1,
    fmt: function (v) { return '#' + Math.round(v); } },
  { key: 'speed',
    label: { en: 'speed', zh: '速度' },
    min: 0.25, max: 4, step: 0.25, value: 1,
    fmt: function (v) { return v.toFixed(2) + '×'; } }
];

/* ================= 画布上的小工具 ================= */
/* 右边那块面板固定 304px 宽；760px 以下它变成贴底的抽屉（默认收起），
   整幅宽度就都能用。上下留白避开顶部的页签/传输条与底部的传输条与提示。 */
function contentBox(vi) {
  const rightPad = vi.W > 760 ? 332 : 14;
  const x = 20;
  const w = Math.max(220, vi.W - rightPad - x - 16);
  const top = vi.W > 760 ? 126 : 146;
  const bot = vi.H - (vi.W > 760 ? 88 : 78);
  return { x: x, y: top, w: w, h: Math.max(150, bot - top) };
}
/* 引擎的 screen-space 图元层里没有折线，只有 flowArrow。把 head 关掉，
   它就是一条线段——曲线因此是一串线段，而不是另造一套绘图原语。 */
function poly(pts, o) {
  for (let i = 1; i < pts.length; i++) {
    E.flowArrow(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1],
                { color: o.color, width: o.width || 1.8, head: false, dash: o.dash });
  }
}
function seg(ax, ay, bx, by, o) {
  E.flowArrow(ax, ay, bx, by, { color: o.color, width: o.width || 1, head: false, dash: o.dash });
}
/* chip 的 roundRect 半径给到边长的一半就是个圆——不必为两种点再引一套图元。 */
function dot(x, y, r, color) { E.chip(x - r, y - r, r * 2, r * 2, '', { fill: color, radius: r }); }
function ring(x, y, r, color, w) {
  E.chip(x - r, y - r, r * 2, r * 2, '', { stroke: color, width: w || 1.6, radius: r });
}

/* ================= 派生量（按 模式 + 明文 + 密钥 缓存） =================
   密文与两条分析曲线只在这三者变了之后重算一次。这不是为了省 CPU，而是为了
   让画面与读数在同一帧里读到**同一份**结果：两处各算一遍，迟早半帧错位。 */
function analysis() {
  const key = activeKey();
  const sig = MODE + '|' + key + '|' + PLAIN;
  if (AN.sig === sig) return AN;
  AN.sig = sig;
  AN.plainIdx = CC.letters(PLAIN);
  AN.stream = SC.keyStreamOf(MODE, PLAIN, key);
  AN.n = AN.stream.n;
  AN.L = AN.stream.sourceLen;
  AN.wrapped = AN.stream.wrapped;
  AN.cipher = SC.encryptWith(MODE, PLAIN, key);
  AN.cipherIdx = CC.letters(AN.cipher);
  AN.keyIdx = CC.letters(key);

  AN.ic = CA.icByPeriod(AN.cipher, MAXP);
  /* kasiskiPeriods 在密文里一条重复片段都没有时返回**空数组**，不是一串并列
     0 分。绝不能闭着眼读 [0]——这一页的 95 字母预置恰好就是空的，而一个被
     当成 [0] 读的空数组会让页面凭空印出一个"最可能的密钥长度"。 */
  AN.kas = CA.kasiskiPeriods(AN.cipher, { maxPeriod: MAXP });
  AN.kasTop = AN.kas.length ? AN.kas[0] : null;
  AN.kasByP = {};
  AN.kas.forEach(function (e) { AN.kasByP[e.period] = e; });
  AN.icPeak = AN.ic.reduce(function (a, b) { return b.ic > a.ic ? b : a; });
  AN.icMin = AN.ic.reduce(function (a, b) { return b.ic < a.ic ? b : a; });
  /* **量程差**（最高点减最低点）是这一页唯一诚实的标量。"峰在哪儿"对一条
     平曲线毫无意义——它总会有一个最高点，而那个点纯粹是噪声。曲线动了多少
     才是"有没有周期"的直接读数。 */
  AN.span = AN.icPeak.ic - AN.icMin.ic;
  return AN;
}

/* ================= 对照组：同一段明文 + 一把重复的密钥 =================
   密钥取当前密钥材料的前 vigLen 个字母；不够长时接上字母表补齐（而不是把
   它自己循环——那样"长度 7 的密钥"可能实际周期是 1，对照就假了）。 */
function vigKeyOf(len) {
  let pool = CC.normalize(activeKey());
  if (pool.length < len) pool += CC.ALPHABET;
  return pool.slice(0, len);
}
function comparison() {
  const len = Math.max(2, Math.round(E.state.vigLen || 2));
  const key = vigKeyOf(len);
  const sig = key + '|' + PLAIN;
  if (VG.sig === sig) return VG;
  VG.sig = sig;
  VG.key = key;
  VG.len = len;
  VG.cipher = VIG.encrypt(PLAIN, key);
  VG.ic = CA.icByPeriod(VG.cipher, MAXP);
  VG.kas = CA.kasiskiPeriods(VG.cipher, { maxPeriod: MAXP });
  VG.kasTop = VG.kas.length ? VG.kas[0] : null;
  VG.kasByP = {};
  VG.kas.forEach(function (e) { VG.kasByP[e.period] = e; });
  VG.icPeak = VG.ic.reduce(function (a, b) { return b.ic > a.ic ? b : a; });
  VG.icMin = VG.ic.reduce(function (a, b) { return b.ic < a.ic ? b : a; });
  VG.span = VG.icPeak.ic - VG.icMin.ic;
  return VG;
}

/* ================= 拖词攻击（再按 crib + 名次 缓存） =================
   打分用的是 cryptanalysis.js 的 χ²——凯撒那一页、维吉尼亚那一页用的同一个
   函数，不为这一页另造一把尺。实测（444 字母的长文本）：7–8 个字母的 crib
   能把真位置排进前两名，3 个字母的排到第 13–24 名。所以页面把前 8 名全列
   出来让人读，而不是把第一名印成答案。 */
function attack() {
  const A = analysis();
  const pick = Math.max(1, Math.round(E.state.rank || 1));
  const sig = A.sig + '|' + CRIB + '|' + pick;
  if (WK.sig === sig) return WK;
  WK.sig = sig;
  WK.crib = CRIB;
  WK.cribIdx = CC.letters(CRIB);
  WK.m = WK.cribIdx.length;
  WK.drags = (WK.m && WK.m <= A.n) ? SC.cribDrag(A.cipher, CRIB) : [];
  WK.scores = WK.drags.map(function (d) { return CA.chiSquare(d.derived); });
  WK.min = WK.scores.length ? Math.min.apply(null, WK.scores) : Infinity;
  /* 适配度 = 最小 χ² / 本项 χ²：无量纲，获胜项恒为 1，其余按比例缩短。
     barChart 在动画里必须显式给 max，否则每帧最大值一变所有柱子会整体跳。 */
  WK.fit = WK.scores.map(function (s) {
    return (isFinite(WK.min) && isFinite(s) && s > 0) ? WK.min / s : 0;
  });
  const order = WK.drags.map(function (d, i) { return i; });
  order.sort(function (a, b) { return (WK.scores[a] - WK.scores[b]) || (a - b); });
  WK.ranked = order.slice(0, 8);
  /* 真相：crib 真正出现在明文里的那些位置。页面拿它给柱子上色，是为了让
     "第一名不是真位置"这件事一眼可见——这才是拖词攻击真实的样子。 */
  const P = CC.normalize(PLAIN), Wd = CC.normalize(CRIB);
  WK.truth = {};
  if (Wd.length) {
    for (let i = 0; i + Wd.length <= P.length; i++) {
      if (P.slice(i, i + Wd.length) === Wd) WK.truth[i] = 1;
    }
  }
  WK.truthCount = Object.keys(WK.truth).length;
  WK.pick = pick;
  /* 名次 → 数组下标要留在手里。cribDrag 恰好是按 offset 升序推的，所以
     drags[i].offset === i，拿 offset 当下标现在是对的——但那是它的实现细节，
     不是它的承诺。存下标，别赌那条巧合。 */
  WK.selIdx = WK.ranked.length ? WK.ranked[Math.min(pick, WK.ranked.length) - 1] : -1;
  WK.sel = WK.selIdx >= 0 ? WK.drags[WK.selIdx] : null;
  WK.selScore = WK.selIdx >= 0 ? WK.scores[WK.selIdx] : Infinity;
  WK.selTrue = !!(WK.sel && WK.truth[WK.sel.offset]);
  WK.trueRank = -1;
  for (let i = 0; i < order.length; i++) {
    if (WK.truth[WK.drags[order[i]].offset]) { WK.trueRank = i + 1; break; }
  }
  /* 传播只属于自动密钥：已知 p_i 就同时知道 k_{i+L} 与 p_{i-L}，一条步长 L
     的链把猜中的那一段向两头拉开。滚动密钥没有这条链——各位置互不相干。 */
  WK.prop = (isAuto() && WK.sel && A.L >= 1)
    ? SC.autokeyPropagate(A.cipher, A.L, WK.sel.offset, WK.cribIdx) : null;
  if (WK.prop) {
    let right = 0;
    for (let i = 0; i < WK.prop.n; i++) {
      if (WK.prop.known[i] >= 0 && WK.prop.known[i] === A.plainIdx[i]) right++;
    }
    WK.propRight = right;
    WK.classes = {};
    for (let i = 0; i < WK.m; i++) WK.classes[(WK.sel.offset + i) % A.L] = 1;
  }
  return WK;
}

/* ================= 页签一：密钥流 ================= */
const autokey = {
  label: { en: 'Key stream', zh: '密钥流' },
  brand: { en: 'The key is not a short word going round and round. It is the plaintext itself, slid L places to the right — or a second book, read once.',
           zh: '密钥不是一个短词在那儿转圈。它是明文自己右移 L 格 —— 或者另一本书，只读一遍。' },
  tips: { en: 'Press ⏭ and watch the violet row. After position L every key letter is a plaintext letter you have already seen — the key row IS the plain row, slid right by L. Turn on the ribbon to see where each one came from.',
          zh: '按 ⏭，看紫色那一行。过了第 L 位，每一个密钥字母都是你已经见过的明文字母 —— 密钥行「就是」明文行右移 L 格。打开丝带看每一个是从哪儿来的。' },
  params: ['speed'],
  presets: MODE_PRESETS,
  presetsLabel: MODE_PRESETS_LABEL,
  /* 本页的图元是屏幕坐标的，与相机无关，所以只保留 iso 这一项：它是引擎
     双击回正的 home，也是页面载入时的机位（规范要求 views 的第一项是它）。 */
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showKeyRow',  label: { en: 'Key row', zh: '密钥行' },   color: VIOLET, checked: true },
    { key: 'showCipher',  label: { en: 'Cipher row', zh: '密文行' }, color: ROSE,   checked: true },
    { key: 'showRibbon',  label: { en: 'Where the key comes from', zh: '密钥从哪儿来' }, color: CYAN, checked: true }
  ],
  draw: function () {
    CUR = 'autokey';
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const pos = A.n ? TL.index % A.n : 0;

    /* ---- 先量，再画 ----
       三段（规则条 / 警告条 / 三行条）的高度先算出来，再把整块在可用区域里
       垂直居中。**格数去凑空间**，不是把格宽压到一个下限了事：反过来做的话
       "放不下"就变成了"画出去"，375px 上两端的字母会被画布边缘吃掉。 */
    const gap = 3, CELL_MIN = 13, CELL_MAX = 26;
    const ruleH = 34;
    const warnH = (!isAuto() && A.wrapped) ? 30 : 0;
    /* 先定**想要多大的格子**，再算这么宽能放几个——不是先定格数、再把格宽
       压到一个下限了事。反过来做的话"放不下"就变成了"画出去"，凯撒页在
       375px 上被裁掉过两端的字母就是这么来的。窗口本来就跟着播放头滚动，
       少画几个格子不损失任何东西，字母小到看不清才损失。 */
    const cellWant = vi.W > 760 ? 24 : 19;
    const nFit = Math.max(1, Math.floor((B.w + gap) / (cellWant + gap)));
    const n = Math.max(1, Math.min(A.n, nFit));
    const cell = E.clamp((B.w - gap * (n - 1)) / n, CELL_MIN, CELL_MAX);
    /* 行距跟着格子走：丝带是一条斜线，行距太小它就压成一条横线，斜度
       （也就是"往回退了 L 格"这件事）看不出来了。 */
    const rowGap = E.clamp(cell * 1.4, 18, 44);
    const nRows = 1 + (E.state.showKeyRow ? 1 : 0) + (E.state.showCipher ? 1 : 0);
    const stripH = A.n ? (nRows * cell + (nRows - 1) * rowGap + 30) : 34;
    const totalH = ruleH + warnH + stripH;
    let y = B.y + Math.max(0, (B.h - totalH) / 2);

    /* ---- 规则条 ---- */
    E.chip(B.x, y, B.w, 26, CM().rule + '   ·   ' + E.t(CM().keyRule),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 13 });
    y += ruleH;

    /* ---- 密钥用完了没有 ----
       滚动密钥的全部前提是"密钥文本比报文长"。绕回去之后它**就是**维吉尼亚，
       周期原样回来——这件事不能静悄悄发生。 */
    if (warnH) {
      E.chip(B.x, y, B.w, 24,
             E.t({ en: 'the key text ran out after ', zh: '密钥文本在第 ' }) + A.L +
             E.t({ en: ' letters and wrapped — this is a repeating key again',
                   zh: ' 个字母处用完并绕了回去 —— 它又是一把重复的密钥了' }),
             { mono: true, color: ORANGE, fontSize: 11.5,
               fill: 'rgba(251,146,60,.12)', stroke: 'rgba(251,146,60,.5)' });
      y += warnH;
    }

    if (!A.n) {
      E.chip(B.x, y, B.w, 26,
             E.t({ en: 'no letters in the plaintext', zh: '明文里一个字母都没有' }),
             { mono: true, color: ORANGE, fontSize: 11.5 });
      return;
    }

    /* ---- 三行条：明文 / 密钥流 / 密文 ----
       窗口跟着播放头走，让长报文也能一路看下去。放不下的部分用省略号明说，
       而不是让它悄悄被画布边缘吃掉——被裁掉的字母看上去仍像内容的一部分。 */
    const total = n * cell + (n - 1) * gap;
    const sx = B.x + (B.w - total) / 2;
    const start = Math.round(E.clamp(pos - Math.floor(n / 2), 0, Math.max(0, A.n - n)));
    const xAt = function (gi) { return sx + (gi - start) * (cell + gap); };
    const inWin = function (gi) { return gi >= start && gi < start + n; };

    let ry = y;
    const yPlain = ry;
    const yKey = E.state.showKeyRow ? (ry += cell + rowGap) : -1;
    const yCipher = E.state.showCipher ? (ry += cell + rowGap) : -1;

    /* ---- 丝带：每一个密钥字母是从哪儿来的 ----
       自动密钥下是一条斜线，从明文第 i−L 格拉到密钥第 i 格；滚动密钥下密钥
       字母来自另一段文本，画成一根短竖线（"从外面来的"）。先画丝带再画格子，
       线头就被格子盖住，不会戳在字母上。 */
    if (E.state.showRibbon && yKey >= 0) {
      for (let gi = start; gi < start + n && gi < A.n; gi++) {
        const on = (gi === pos);
        if (A.stream.from[gi] === 'plain') {
          const src = A.stream.at[gi];
          if (!inWin(src)) continue;
          seg(xAt(src) + cell / 2, yPlain + cell + 2, xAt(gi) + cell / 2, yKey - 2,
              { color: on ? 'rgba(45,212,234,.85)' : 'rgba(45,212,234,.20)',
                width: on ? 1.8 : 1 });
        } else {
          seg(xAt(gi) + cell / 2, yKey - 12, xAt(gi) + cell / 2, yKey - 2,
              { color: on ? 'rgba(167,139,250,.85)' : 'rgba(167,139,250,.28)',
                width: on ? 1.8 : 1 });
        }
      }
    }

    for (let i = 0; i < n; i++) {
      const gi = start + i;
      if (gi >= A.n) break;
      const x = xAt(gi);
      const on = (gi === pos);
      E.chip(x, yPlain, cell, cell, CC.ALPHABET.charAt(A.plainIdx[gi]),
             { stroke: on ? CYAN : 'rgba(45,212,234,.30)', width: on ? 1.8 : 1,
               fill: on ? 'rgba(45,212,234,.16)' : null, color: CYAN, fontSize: cell * 0.56 });
      if (yKey >= 0) {
        /* 引钥那 L 格与"从明文长出来"的格子用不同的填充：这一页的主角正是
           这条分界——过了它，密钥就不再需要传了。 */
        const fromPrimer = (A.stream.from[gi] === 'primer');
        E.chip(x, yKey, cell, cell, CC.ALPHABET.charAt(A.stream.ks[gi]),
               { fill: fromPrimer ? 'rgba(167,139,250,.26)' : 'rgba(167,139,250,.08)',
                 stroke: on ? VIOLET : (fromPrimer ? 'rgba(167,139,250,.55)' : 'rgba(167,139,250,.28)'),
                 width: on ? 1.8 : 1, color: VIOLET, fontSize: cell * 0.56 });
      }
      if (yCipher >= 0) {
        E.chip(x, yCipher, cell, cell, CC.ALPHABET.charAt(A.cipherIdx[gi]),
               { fill: 'rgba(251,113,133,.10)',
                 stroke: on ? ROSE : 'rgba(251,113,133,.34)', width: on ? 1.8 : 1,
                 color: ROSE, fontSize: cell * 0.56 });
      }
    }
    /* 省略号夹在可用区内：它是"还有更多"的标记，不是内容，越出去反而像
       内容被切了一半。 */
    if (start > 0) {
      E.chip(Math.max(B.x, sx - 16), yPlain, 14, cell, '…',
             { color: DIM, fontSize: cell * 0.56 });
    }
    if (start + n < A.n) {
      E.chip(Math.min(sx + total + 2, B.x + B.w - 14), yPlain, 14, cell, '…',
             { color: DIM, fontSize: cell * 0.56 });
    }

    /* 行标签贴在每行左端上方，窄屏或上方没有余地时就省掉——它是注释，
       不是内容，宁可不画也不能压在规则条上。 */
    if (B.w > 420 && (B.h - totalH) / 2 > 18) {
      E.chip(B.x, yPlain - 15, 150, 13, E.t({ en: 'plaintext', zh: '明文' }),
             { mono: true, color: CYAN, fontSize: 10 });
      if (yKey >= 0) {
        E.chip(B.x, yKey - 15, 220, 13,
               isAuto()
                 ? E.t({ en: 'key = primer, then plain shifted right by ', zh: '密钥 = 引钥，然后是明文右移 ' }) + A.L
                 : E.t({ en: 'key = the second text', zh: '密钥 = 另一段文本' }),
               { mono: true, color: VIOLET, fontSize: 10 });
      }
      if (yCipher >= 0) {
        E.chip(B.x, yCipher - 15, 150, 13, E.t({ en: 'ciphertext', zh: '密文' }),
               { mono: true, color: ROSE, fontSize: 10 });
      }
    }
  },
  readout: function () {
    syncIo();
    const A = analysis();
    let s = '<b style="--c:var(--trace-violet)">' + esc(E.t(CM().label)) + '</b>' +
      '<span class="dim">  ' + CM().rule + '</span><br>';
    if (!A.n) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'no letters to encrypt', zh: '没有字母可加密' }) + '</b>';
    }
    const pos = A.n ? TL.index % A.n : 0;
    const src = A.stream.from[pos];
    s += E.t({ en: 'position ', zh: '第 ' }) + pos +
      E.t({ en: '', zh: ' 个字母' }) + '<br>' +
      '<b style="--c:var(--trace-cyan)"><i>' + CC.ALPHABET.charAt(A.plainIdx[pos]) + '</i></b>' +
      ' <span class="dim">+</span> ' +
      '<b style="--c:var(--trace-violet)"><i>' + CC.ALPHABET.charAt(A.stream.ks[pos]) + '</i></b>' +
      ' &#8594; ' +
      '<b style="--c:var(--trace-rose)"><i>' + CC.ALPHABET.charAt(A.cipherIdx[pos]) + '</i></b><br>' +
      '<span class="dim">' +
      E.t(src === 'primer' ? { en: 'this key letter is primer letter ', zh: '这个密钥字母是引钥的第 ' }
        : src === 'plain' ? { en: 'this key letter is plaintext letter ', zh: '这个密钥字母是明文的第 ' }
        : { en: 'this key letter is key-text letter ', zh: '这个密钥字母是密钥文本的第 ' }) +
      A.stream.at[pos] + '</span><br>' +
      '<span class="dim">' + E.t({ en: 'cipher ', zh: '密文 ' }) + '</span>' +
      '<b style="--c:var(--trace-rose)">' + esc(clip(A.cipher, 60)) + '</b><br>' +
      '<span class="dim">' + esc(E.t(CM().note)) + '</span>';
    if (!isAuto() && A.wrapped) {
      s += '<br><b style="--c:var(--trace-orange)">' +
        E.t({ en: 'the key text wrapped — the period is back', zh: '密钥文本绕回去了 —— 周期回来了' }) +
        '</b>';
    }
    return s;
  }
};

/* ================= 页签二：找周期 —— 顿悟视角 =================
   把维吉尼亚那一页的整套机器原样搬过来，对着这两份密文跑，然后看它什么都
   找不到。两条曲线同一根横轴：
     violet  这个密码（自动密钥 / 滚动密钥）
     orange  同一段明文 + 一把长度 L 的**重复**密钥
   紫色那条趴在 1/26 上不动，橙色那条在 L 处立着一根尖峰。周期没有了，所以
   周期分析没有对象——但**冗余还在**，那是第三页的事。 */
const period = {
  label: { en: 'No period', zh: '没有周期' },
  brand: { en: 'The same machinery that broke the repeating key, pointed at these. It finds nothing — there is no period to find.',
           zh: '把打垮重复密钥的那套机器原样对准它们。什么也找不到 —— 根本没有周期可找。' },
  tips: { en: 'The epiphany view. Violet is this cipher, orange is the same plaintext under a repeating key of length L. Drag L: the orange peak walks to wherever you put it, and the violet line never moves. Read the span, not the peak — a flat curve still has a highest point, and it means nothing.',
          zh: '顿悟视角。紫色是这个密码，橙色是同一段明文配一把长度 L 的重复密钥。拖 L：橙色的峰会跟着走到你放的位置，紫色那条纹丝不动。要读「量程差」而不是峰 —— 平曲线也有最高点，而那个点没有含义。' },
  params: ['vigLen'],
  presets: MODE_PRESETS,
  presetsLabel: MODE_PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showThis',    label: { en: 'This cipher', zh: '这个密码' }, color: VIOLET, checked: true },
    { key: 'showVig',     label: { en: 'Repeating key', zh: '重复密钥' }, color: ORANGE, checked: true },
    { key: 'showKasiski', label: { en: 'Kasiski panel', zh: 'Kasiski 面板' }, color: EMERALD, checked: true }
  ],
  draw: function () {
    CUR = 'period';
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const V = comparison();

    const padL = 46, padR = 12;
    const px0 = B.x + padL, pw = Math.max(120, B.w - padL - padR);
    const xOf = function (p) { return px0 + (p - 1) * pw / (MAXP - 1); };

    /* 顶上一条图例，把两条曲线的颜色与含义钉在一起（规范第 3 条）。 */
    let y = B.y;
    const legW = Math.min(170, B.w / 3 - 6);
    E.chip(B.x, y, legW, 22, E.t(CM().label),
           { mono: true, color: VIOLET, fill: 'rgba(167,139,250,.10)',
             stroke: 'rgba(167,139,250,.4)', fontSize: 11 });
    E.chip(B.x + legW + 6, y, legW, 22,
           E.t({ en: 'repeating ', zh: '重复密钥 ' }) + V.key,
           { mono: true, color: ORANGE, fill: 'rgba(251,146,60,.10)',
             stroke: 'rgba(251,146,60,.4)', fontSize: 11 });
    E.chip(B.x + (legW + 6) * 2, y, legW, 22,
           E.t({ en: 'span ', zh: '量程差 ' }) + E.fmt(A.span, 4) +
           ' / ' + E.fmt(V.span, 4),
           { mono: true, color: BRIGHT, fill: CARD, stroke: LINE, fontSize: 11 });
    y += 26;
    /* 面板标题另起一行，不塞进 icY − 16：那个位置正好是图例那一排，两块会
       叠在一起，而图例是"哪条曲线是哪条"的唯一说明。 */
    E.chip(px0, y, Math.min(300, B.w - padL), 14,
           E.t({ en: 'index of coincidence, by assumed period', zh: '逐周期重合指数' }),
           { mono: true, color: DIM, fontSize: 10 });
    y += 18;

    const twoPanels = E.state.showKasiski;
    /* 底下留 44 而不是 26：横轴刻度（kB+4）与那行"候选周期 p"（kB+22，高 16）
       都画在最后一条基线**下面**，留 26 时那行标题会掉出可用区、在 375px 上
       正好被贴底的面板抽屉切掉一半。 */
    const avail = B.y + B.h - y - 44;
    const panelH = twoPanels ? Math.max(64, (avail - 34) / 2) : Math.max(80, avail);

    /* ---------- 上：逐周期重合指数 ----------
       两条曲线共用一套量程，否则"平"与"尖"这件事会被各自的归一化抹平——
       那正是这一页唯一要展示的差别。 */
    const icY = y, icB = icY + panelH;
    let icLo = Math.min(IC_RANDOM * 0.82, A.icMin.ic, V.icMin.ic);
    let icHi = Math.max(IC_ENGLISH * 1.10, A.icPeak.ic, V.icPeak.ic);
    const icAt = function (v) { return icB - (v - icLo) / (icHi - icLo || 1) * panelH; };

    seg(px0 - 6, icB, px0 + pw + 4, icB, { color: LINE, width: 1 });
    /* 两条基准线：英文 0.0655（emerald）与均匀随机 1/26（灰）。紫色那条曲线
       整条贴在随机线上，正是"密钥流没有周期"的直接读数。 */
    [[IC_ENGLISH, EMERALD, E.t({ en: 'English', zh: '英文' })],
     [IC_RANDOM, 'rgba(159,176,200,.7)', E.t({ en: 'random', zh: '随机' })]].forEach(function (rl) {
      const ry = icAt(rl[0]);
      if (ry < icY - 2 || ry > icB + 2) return;
      seg(px0 - 6, ry, px0 + pw + 4, ry, { color: rl[1], width: 1, dash: [4, 5] });
      E.chip(B.x - 6, ry - 8, padL, 16, rl[2], { mono: true, color: rl[1], fontSize: 9.5 });
    });

    /* L 与它的倍数：橙色的峰应当落在这些线上，紫色的不应当落在任何地方。 */
    if (E.state.showVig) {
      for (let m = V.len; m <= MAXP; m += V.len) {
        seg(xOf(m), icY - 4, xOf(m), icB, {
          color: m === V.len ? 'rgba(251,146,60,.55)' : 'rgba(251,146,60,.22)',
          width: m === V.len ? 1.4 : 1, dash: m === V.len ? null : [3, 4] });
      }
    }

    if (E.state.showVig) {
      const pts = V.ic.map(function (e) { return [xOf(e.period), icAt(e.ic)]; });
      poly(pts, { color: ORANGE, width: 2 });
      for (let i = 0; i < pts.length; i++) dot(pts[i][0], pts[i][1], 2.2, 'rgba(251,146,60,.7)');
      const pky = icAt(V.icPeak.ic);
      ring(xOf(V.icPeak.period), pky, 9.5, ORANGE, 1.8);
      /* 标签默认画在点上方，顶不住时改画在下方——峰值往往正好顶在面板顶
         （量程就是按它定的），越界的标签会把上面那行图例挡掉，而那一行是
         "哪条曲线是哪条"的唯一说明。 */
      E.chip(xOf(V.icPeak.period) - 36, pky - 26 >= icY ? pky - 26 : pky + 11, 72, 17,
             E.t({ en: 'peak ', zh: '峰 ' }) + V.icPeak.period,
             { mono: true, color: ORANGE, fill: CARD, stroke: 'rgba(251,146,60,.45)', fontSize: 10 });
    }
    if (E.state.showThis) {
      const pts = A.ic.map(function (e) { return [xOf(e.period), icAt(e.ic)]; });
      poly(pts, { color: VIOLET, width: 2 });
      for (let i = 0; i < pts.length; i++) dot(pts[i][0], pts[i][1], 2.2, 'rgba(167,139,250,.8)');
      /* 这条曲线**不标峰**——标了就等于替它宣称"这里有个周期"。它的读数是
         量程差，印在图例那一格里。 */
    }
    E.chip(B.x - 6, icY - 2, padL, 14, E.fmt(icHi, 3), { mono: true, color: DIM, fontSize: 9 });

    /* ---------- 下：Kasiski ---------- */
    let kB = icB;
    if (twoPanels) {
      const kY = icB + 34;
      kB = kY + panelH;
      seg(px0 - 6, kB, px0 + pw + 4, kB, { color: LINE, width: 1 });
      E.chip(px0, kY - 18, Math.min(300, B.w - padL), 14,
             E.t({ en: 'Kasiski score = hit rate − 1/p', zh: 'Kasiski 分数 = 命中率 − 1/p' }),
             { mono: true, color: DIM, fontSize: 10 });

      let kLo = 0, kHi = 0.08;
      A.kas.forEach(function (e) { kLo = Math.min(kLo, e.score); kHi = Math.max(kHi, e.score); });
      if (E.state.showVig) {
        V.kas.forEach(function (e) { kLo = Math.min(kLo, e.score); kHi = Math.max(kHi, e.score); });
      }
      const kAt = function (v) { return kB - (v - kLo) / (kHi - kLo || 1) * panelH; };
      if (kLo < 0) seg(px0 - 6, kAt(0), px0 + pw + 4, kAt(0), { color: LINE, width: 1, dash: [3, 4] });

      if (E.state.showVig && V.kas.length) {
        const pts = [];
        for (let p = 2; p <= MAXP; p++) if (V.kasByP[p]) pts.push([xOf(p), kAt(V.kasByP[p].score)]);
        poly(pts, { color: ORANGE, width: 2 });
        const tky = kAt(V.kasTop.score);
        ring(xOf(V.kasTop.period), tky, 9.5, ORANGE, 1.8);
        E.chip(xOf(V.kasTop.period) - 48, tky - 26 >= kY ? tky - 26 : tky + 11, 96, 17,
               E.t({ en: 'rank 1 ', zh: '第一名 ' }) + V.kasTop.period + ' · ' + E.fmt(V.kasTop.score),
               { mono: true, color: ORANGE, fill: CARD, stroke: 'rgba(251,146,60,.45)', fontSize: 10 });
      }
      if (E.state.showThis) {
        if (!A.kas.length) {
          /* 空数组必须**明说**。把它当 [0] 读，页面就会印出一个凭空捏造的
             "最可能的密钥长度"——这是这一族分析工具最容易犯的那个错。 */
          const noteW = Math.min(pw, 440);
          E.chip(px0 + (pw - noteW) / 2, kY + panelH / 2 - 14, noteW, 28,
                 E.t({ en: 'not one repeated sequence — Kasiski has nothing to say at all',
                       zh: '一条重复片段都没有 —— Kasiski 在这里完全无话可说' }),
                 { mono: true, color: VIOLET, fontSize: 11,
                   fill: 'rgba(167,139,250,.08)', stroke: 'rgba(167,139,250,.4)' });
        } else {
          const pts = [];
          for (let p = 2; p <= MAXP; p++) if (A.kasByP[p]) pts.push([xOf(p), kAt(A.kasByP[p].score)]);
          poly(pts, { color: VIOLET, width: 2 });
          const tky = kAt(A.kasTop.score);
          ring(xOf(A.kasTop.period), tky, 9.5, VIOLET, 1.8);
          /* 命中数/间距总数一起印出来：这一页最容易骗人的正是"分数 0.889"
             这种数字——它的证据可能只有**一条**间距。 */
          E.chip(xOf(A.kasTop.period) - 56, tky - 26 >= kY ? tky - 26 : tky + 11, 112, 17,
                 A.kasTop.period + ' · ' + E.fmt(A.kasTop.score) +
                 ' (' + A.kasTop.hits + '/' + A.kasTop.total + ')',
                 { mono: true, color: VIOLET, fill: CARD, stroke: 'rgba(167,139,250,.45)', fontSize: 10 });
        }
      }
      E.chip(B.x - 6, kY - 2, padL, 14, E.fmt(kHi), { mono: true, color: DIM, fontSize: 9 });
    }

    /* ---------- 横轴刻度 ---------- */
    const step = (pw / (MAXP - 1)) >= 15 ? 1 : 2;
    for (let p = 1; p <= MAXP; p += step) {
      const on = (p % V.len === 0);
      E.chip(xOf(p) - 9, kB + 4, 18, 14, String(p),
             { color: on ? ORANGE : DIM, fontSize: 9.5 });
    }
    E.chip(B.x, kB + 22, B.w, 16,
           E.t({ en: 'candidate period p', zh: '候选周期 p' }),
           { mono: true, color: DIM, fontSize: 10 });
  },
  readout: function () {
    syncIo();
    const A = analysis();
    const V = comparison();
    let s = '<span class="dim">' + A.n + E.t({ en: ' cipher letters', zh: ' 个密文字母' }) +
      '</span><br>' +
      '<b style="--c:var(--trace-violet)">' + esc(E.t(CM().label)) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'IoC span ', zh: '重合指数量程差 ' }) + '</span>' +
      '<b style="--c:var(--trace-violet)">' + E.fmt(A.span, 4) + '</b><br>' +
      '<b style="--c:var(--trace-orange)">' + E.t({ en: 'repeating key ', zh: '重复密钥 ' }) +
      esc(V.key) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'span ', zh: '量程差 ' }) + '</span>' +
      '<b style="--c:var(--trace-orange)">' + E.fmt(V.span, 4) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'peak ', zh: '峰 ' }) + V.icPeak.period + '</span><br>';
    if (!A.kas.length) {
      s += '<b style="--c:var(--trace-violet)">' +
        E.t({ en: 'Kasiski: no repeated sequences at all', zh: 'Kasiski：一条重复片段都没有' }) +
        '</b><br>';
    } else {
      s += '<span class="dim">Kasiski </span>' +
        '<b style="--c:var(--trace-violet)">' + A.kasTop.period + '</b>' +
        '<span class="dim">(' + E.fmt(A.kasTop.score) + ' · ' +
        A.kasTop.hits + '/' + A.kasTop.total +
        E.t({ en: ' gaps', zh: ' 条间距' }) + ')</span><br>' +
        '<span class="dim">' +
        E.t({ en: 'a score off one or two gaps is arithmetic, not evidence',
              zh: '一两条间距撑起来的分数是算术，不是证据' }) + '</span><br>';
    }
    /* 判词分三种，按**原因**分，不按分数分。三种原因不同，能说的话也不同：
       ① 密钥绕回去了 —— 周期真的回来了，这条曲线该有峰；
       ② 平 —— 相对对照组平得足够多；
       ③ 两条都在抖 —— 文本太短，对照组自己也是噪声。这一条最容易被写成
          "曲线不平，可能是密钥绕回去了"，而在自动密钥下那句话根本不成立
          （明文不会用完）。把"我说不出来"说出来，比给一个错误的方向好。 */
    if (!isAuto() && A.wrapped) {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'the key text wrapped — that IS a period, and here it is',
              zh: '密钥文本绕回去了 —— 那就是一个周期，它就在这儿' }) + '</b>';
    } else if (A.span < V.span * 0.4) {
      s += '<b style="--c:var(--trace-emerald)">' +
        E.t({ en: 'flat — no period to find', zh: '平的 —— 没有周期可找' }) + '</b>';
    } else {
      s += '<b style="--c:var(--trace-orange)">' +
        E.t({ en: 'too little text — the comparison curve is noise here too',
              zh: '文本太短 —— 对照组那条曲线在这里同样是噪声' }) + '</b>' +
        '<span class="dim">  ' +
        E.t({ en: 'read this on a longer message', zh: '换一段更长的报文再看' }) + '</span>';
    }
    if (ACTIVE_NOTE) {
      s += '<br><span class="dim">' + esc(E.t(ACTIVE_NOTE[MODE])) + '</span>';
    }
    return s;
  }
};

/* ================= 页签三：还是会倒 =================
   周期没有了，冗余还在。密钥是英文，所以把一段猜测的明文沿密文拖过去，
   算 derived = c − crib，再问"哪一段最像英文"——这就是拖词。
   自动密钥更糟：猜中一处会沿着步长 L 的链条向两头传播。 */
const weakness = {
  label: { en: 'Still falls', zh: '还是会倒' },
  brand: { en: 'The period is gone; the redundancy is not. Subtract a guessed word from the ciphertext and read what falls out — because the key is English too.',
           zh: '周期没有了，冗余还在。把猜的那个词从密文里减掉，看掉出来什么 —— 因为密钥也是英文。' },
  tips: { en: 'Drag the candidate slider through the ranked offsets. With a 7-letter crib on the long text the true offset lands in the top two; with THE it lands around 13th. In autokey mode one correct guess of length m opens m of the L columns — set the crib length to L and the whole message falls out at once.',
          zh: '用滑杆在排好序的候选里翻。长文本上 7 个字母的 crib 能把真位置排进前两名，THE 只能排到第 13 名左右。自动密钥下猜对长度 m 的一段就打开 L 列里的 m 列 —— 把 crib 长度设成 L，整篇报文一次全掉出来。' },
  params: ['rank'],
  presets: MODE_PRESETS,
  presetsLabel: MODE_PRESETS_LABEL,
  views: { iso: { label: { en: 'Iso', zh: '等距' }, az: -0.62, el: 0.42, dist: 9 } },
  toggles: [
    { key: 'showDrag',  label: { en: 'χ² per offset', zh: '每个位置的 χ²' }, color: EMERALD, checked: true },
    { key: 'showTruth', label: { en: 'Where the crib really is', zh: 'crib 真正的位置' }, color: CYAN, checked: true },
    { key: 'showProp',  label: { en: 'What one guess opens', zh: '一次猜对打开了什么' }, color: ROSE, checked: true }
  ],
  draw: function () {
    CUR = 'weakness';
    tickClock();
    const vi = E.viewInfo();
    const B = contentBox(vi);
    const A = analysis();
    const K = attack();

    let y = B.y;
    E.chip(B.x, y, B.w, 26,
           'derived ≡ c − crib  (mod 26)   ·   ' +
           E.t({ en: 'the key is English, so the right offset reads like English',
                 zh: '密钥是英文，所以猜对的位置读起来像英文' }),
           { fill: CARD, stroke: LINE, color: BRIGHT, fontSize: 12.5 });
    y += 34;

    if (!K.drags.length) {
      E.chip(B.x, y, B.w, 26,
             E.t(A.n === 0
                 ? { en: 'no letters in the plaintext — there is nothing to drag along',
                     zh: '明文里一个字母都没有 —— 没有东西可以拖' }
                 : { en: 'the crib is longer than the ciphertext — nothing to drag',
                     zh: 'crib 比密文还长 —— 没得拖' }),
             { mono: true, color: ORANGE, fontSize: 11.5,
               fill: 'rgba(251,146,60,.08)', stroke: 'rgba(251,146,60,.4)' });
      return;
    }

    /* ---------- 每个位置一根柱子 ----------
       柱子数 = 位置数（几百根），横向铺满可用宽度：这是"整篇密文都被拖过一遍"
       的直接图像。**必须显式给 max**——获胜项恒为 1，所以 max 就是 1；不锁量程
       的话每帧最大值一变，所有柱子会整体跳一次高度，看起来像数据在抖。 */
    const barH = E.clamp(B.h * 0.28, 50, 116);
    if (E.state.showDrag) {
      E.chip(B.x, y, Math.min(340, B.w), 14,
             K.drags.length + E.t({ en: ' offsets · taller = smaller χ² = more like English',
                                    zh: ' 个位置 · 越高 = χ² 越小 = 越像英文' }),
             { mono: true, color: DIM, fontSize: 10 });
      y += 18;
      E.barChart(B.x, y, B.w, barH, K.fit, {
        max: 1, gap: 0,
        colorAt: function (i) {
          const off = K.drags[i].offset;
          if (K.sel && off === K.sel.offset) return EMERALD;
          if (E.state.showTruth && K.truth[off]) return 'rgba(45,212,234,.85)';
          return 'rgba(251,113,133,.30)';
        }
      });
      seg(B.x, y + barH, B.x + B.w, y + barH, { color: LINE, width: 1 });
      y += barH + 20;
    }

    /* ---------- 排名前几位 ---------- */
    const rowH = 18;
    const showN = Math.max(1, Math.min(K.ranked.length, Math.floor((B.h - (y - B.y) - 96) / rowH)));
    const maxChars = Math.max(6, Math.floor(B.w / 9));
    for (let i = 0; i < showN; i++) {
      const d = K.drags[K.ranked[i]];
      const isSel = (K.sel && d.offset === K.sel.offset);
      const isTrue = !!K.truth[d.offset];
      const col = isSel ? EMERALD : (isTrue ? CYAN : SLATE);
      E.chip(B.x, y + i * rowH, 44, rowH, '#' + (i + 1),
             { color: isSel ? EMERALD : DIM, fontSize: 10.5, mono: true });
      E.chip(B.x + 46, y + i * rowH, 60, rowH, String(d.offset),
             { color: DIM, fontSize: 10.5, mono: true });
      E.chip(B.x + 108, y + i * rowH, Math.max(80, B.w - 108), rowH,
             clip(d.derived, maxChars) + (isTrue ? '   ✓' : ''),
             { color: col, fontSize: 12,
               fill: isSel ? 'rgba(52,211,153,.10)' : null,
               stroke: isSel ? 'rgba(52,211,153,.45)' : null });
    }
    y += showN * rowH + 12;

    /* ---------- 一次猜对打开了什么 ---------- */
    if (!E.state.showProp || !K.sel) return;
    if (K.prop) {
      /* 同余类带：L 个格子，一格一条 i mod L。猜中长度 m 的一段就点亮 m 格，
         m >= L 时全亮——整篇明文一次掉出来。这条带子就是传播的机制本身。 */
      const cw = E.clamp(B.w / Math.max(A.L, 1), 8, 26);
      const bandW = A.L * cw;
      const bx = B.x + Math.max(0, (B.w - bandW) / 2);
      E.chip(B.x, y, B.w, 14,
             E.t({ en: 'columns mod L opened by this guess', zh: '这次猜测打开的同余类（mod L）' }),
             { mono: true, color: DIM, fontSize: 10 });
      y += 16;
      for (let j = 0; j < A.L; j++) {
        const on = !!(K.classes && K.classes[j]);
        E.chip(bx + j * cw, y, cw - 2, 16, String(j),
               { fill: on ? 'rgba(52,211,153,.28)' : 'rgba(148,163,184,.08)',
                 stroke: on ? 'rgba(52,211,153,.6)' : LINE,
                 color: on ? EMERALD : DIM, fontSize: Math.min(10, cw * 0.5) });
      }
      y += 24;

      const pct = A.n ? (100 * K.prop.count / A.n) : 0;
      const ok = (K.propRight === K.prop.count);
      E.chip(B.x, y, B.w, 24,
             E.t({ en: 'recovered ', zh: '恢复出 ' }) + K.prop.count + '/' + A.n +
             ' (' + pct.toFixed(1) + '%)   ' +
             E.t({ en: 'crib covers ', zh: 'crib 覆盖 ' }) + Math.min(K.m, A.L) +
             '/' + A.L + E.t({ en: ' columns', zh: ' 列' }) +
             (ok ? E.t({ en: '   · every recovered letter is correct',
                         zh: '   · 恢复出的每一个字母都对' })
                 : E.t({ en: '   · wrong guess — the letters are garbage',
                         zh: '   · 猜错了 —— 那些字母是垃圾' })),
             { mono: true, color: ok ? EMERALD : ORANGE, fontSize: 11.5,
               fill: ok ? 'rgba(52,211,153,.10)' : 'rgba(251,146,60,.08)',
               stroke: ok ? 'rgba(52,211,153,.45)' : 'rgba(251,146,60,.4)' });
      y += 30;

      /* 恢复出来的明文，未知位置写 '·'。窗口对准 crib 那一段，因为那里是
         这次猜测的起点。 */
      const chars = Math.max(10, Math.floor(B.w / 7.4));
      const from = Math.round(E.clamp(K.sel.offset - Math.floor(chars / 3), 0,
                                      Math.max(0, A.n - chars)));
      let txt = '';
      for (let i = from; i < Math.min(A.n, from + chars); i++) {
        txt += K.prop.known[i] >= 0 ? CC.ALPHABET.charAt(K.prop.known[i]) : '·';
      }
      E.chip(B.x, y, B.w, 22, txt, { mono: true, color: CYAN, fontSize: 11.5 });
      y += 26;
      const gotPrimer = K.prop.primer.every(function (v) { return v >= 0; });
      E.chip(B.x, y, B.w, 20,
             E.t({ en: 'primer ', zh: '引钥 ' }) +
             K.prop.primer.map(function (v) {
               return v >= 0 ? CC.ALPHABET.charAt(v) : '·';
             }).join('') +
             (gotPrimer ? E.t({ en: '   · fully recovered', zh: '   · 全部恢复' })
                        : E.t({ en: '   · partly recovered', zh: '   · 部分恢复' })),
             { mono: true, color: gotPrimer ? EMERALD : DIM, fontSize: 11 });
    } else {
      /* 滚动密钥没有传播链：位置之间互不相干，猜中一段只换来另一段文本的
         那几个字母。代价是攻击者要一段一段爬，好处（对防守方）也仅止于此
         ——两段都是英文，爬起来一点都不慢。 */
      const trueKey = CC.normalize(KEYTEXT);
      const at = K.sel.offset;
      const want = trueKey.slice(at, at + K.m);
      const hit = (K.sel.derived === want);
      E.chip(B.x, y, B.w, 24,
             E.t({ en: 'derived here = key text at ', zh: '这里的 derived = 密钥文本第 ' }) + at +
             '   ' + K.sel.derived + '   ' +
             (hit ? E.t({ en: '· matches the real key text', zh: '· 与真实密钥文本吻合' })
                  : E.t({ en: '· real key text there is ', zh: '· 真实密钥文本那一段是 ' }) + want),
             { mono: true, color: hit ? EMERALD : DIM, fontSize: 11.5,
               fill: hit ? 'rgba(52,211,153,.10)' : null,
               stroke: hit ? 'rgba(52,211,153,.45)' : null });
      y += 30;
      E.chip(B.x, y, B.w, 40,
             E.t({ en: 'no propagation here — each offset stands alone. Two English texts added together, and either one can be guessed at.',
                   zh: '这里没有传播 —— 每个位置各自独立。两段英文加在一起，随便猜哪一段都行。' }),
             { mono: true, color: DIM, fontSize: 11 });
    }
  },
  readout: function () {
    syncIo();
    const A = analysis();
    const K = attack();
    let s = E.t({ en: 'crib ', zh: 'crib ' }) +
      '<b style="--c:var(--trace-emerald)">' + esc(clip(CRIB, 20)) + '</b>' +
      '<span class="dim">  ' + K.m + E.t({ en: ' letters', zh: ' 个字母' }) + '</span><br>';
    if (!K.drags.length) {
      return s + '<b style="--c:var(--trace-orange)">' +
        E.t(A.n === 0 ? { en: 'no letters in the plaintext', zh: '明文里一个字母都没有' }
                      : { en: 'the crib is longer than the ciphertext', zh: 'crib 比密文还长' }) + '</b>';
    }
    s += '<span class="dim">' + K.drags.length +
      E.t({ en: ' offsets · it really occurs ', zh: ' 个位置 · 它真正出现了 ' }) +
      K.truthCount + E.t({ en: ' times', zh: ' 次' }) + '</span><br>' +
      E.t({ en: 'true offset ranks ', zh: '真位置排在第 ' }) +
      '<b style="--c:var(--trace-cyan)">' +
      (K.trueRank > 0 ? '#' + K.trueRank : '—') + '</b>' +
      '<span class="dim">  ' +
      E.t({ en: 'longer cribs rank higher', zh: 'crib 越长排得越前' }) + '</span><br>' +
      E.t({ en: 'you are looking at ', zh: '你正在看第 ' }) +
      '<b style="--c:var(--trace-emerald)">#' + Math.min(K.pick, K.ranked.length) + '</b>' +
      '<span class="dim">  ' + E.t({ en: 'offset ', zh: '位置 ' }) +
      (K.sel ? K.sel.offset : '—') + ' · χ² ' + E.fmt(K.selScore, 1) + '</span><br>' +
      '<b style="--c:var(--trace-emerald)">' + esc(K.sel ? K.sel.derived : '') + '</b>' +
      (K.selTrue ? '<span class="dim">  ' + E.t({ en: '· this one is real', zh: '· 这个是真的' }) + '</span>' : '') +
      '<br>';
    if (K.prop) {
      const pct = A.n ? (100 * K.prop.count / A.n) : 0;
      s += '<span class="dim">' + E.t({ en: 'this guess opens ', zh: '这次猜测打开了 ' }) + '</span>' +
        '<b style="--c:var(--trace-rose)">' + pct.toFixed(1) + '%</b>' +
        '<span class="dim">  ' + Math.min(K.m, A.L) + '/' + A.L +
        E.t({ en: ' of the columns', zh: ' 列' }) + '</span><br>';
      /* "打开 100%" 对一个**猜错**的位置同样成立——链条照样铺满整篇，只是
         每一位都是错的。不把这句挑明，读数就会替一个错误答案背书。 */
      if (!K.selTrue) {
        s += '<b style="--c:var(--trace-orange)">' +
          E.t({ en: 'but this candidate is not a real occurrence', zh: '但这个候选不是真的出现位置' }) +
          '</b><span class="dim">  ' +
          E.t({ en: 'what comes out is garbage — that is how you reject it',
                zh: '掉出来的是垃圾 —— 你就是靠这个把它排除掉的' }) + '</span><br>';
      }
      s += '<span class="dim">' +
        E.t({ en: 'autokey: knowing p opens p at ±L, and that opens ±2L …',
              zh: '自动密钥：知道 p 就知道 ±L 处的 p，再知道 ±2L 处的……' }) + '</span>';
    } else {
      s += '<span class="dim">' +
        E.t({ en: 'running key: offsets are independent — you climb, but both texts are English',
              zh: '滚动密钥：各位置独立 —— 得一段一段爬，但两段都是英文' }) + '</span>';
    }
    s += '<br><span class="dim">' +
      E.t({ en: 'a one-time pad closes exactly this: a key that is random, as long as the message, and used once.',
            zh: '一次性密码本关掉的正是这一条：密钥均匀随机、与报文一样长、只用一次。' }) + '</span>';
    return s;
  }
};

var SCENES = { autokey: autokey, period: period, weakness: weakness };

/* #ioHost 必须在 init() 之前搭好：引擎的 buildPresets() 会在建面板时就选中
   第一个模式并调它的 onSelect，而那之后第一帧就会调 analysis() 去读
   PLAIN / PRIMER / KEYTEXT。 */
buildIO();

E.init({ canvas: document.getElementById('c'), SCENES: SCENES, PARAMS: PARAMS,
         TOOL: TOOL, VERSION: VERSION });
</script>
</body>
</html>
