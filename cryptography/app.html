   cryptography-lang，两处兜底都是 en 不是 zh——否则缺 key 时英文页面会突然
   冒出中文。存储键绝不能沿用别的子项目的：两个子项目的语言状态各自独立，
   共用一个键会让在那边切成中文的动作把这边也一起切了。 */
var LANG_KEY = 'cryptography-lang';
var NAV_KEY = 'cryptography-nav';
function resolveLang() {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') return q;
    var s = localStorage.getItem(LANG_KEY);
    if (s === 'en' || s === 'zh') return s;
  } catch (e) { /* file:// 下 localStorage 可能不可用 */ }
  return 'en';
}
var LANG = resolveLang();
function t(s) { return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.en) : s; }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================= 唯一的出站引用 =================
   这是整个 cryptography 子树里唯一一处指向父目录的路径。它的存在是为了
   「返回 MathViz」这一个按钮；除它之外，core、tools、examples 三个目录里不许
   出现任何父目录形式的相对路径——check.py 的 outbound_ref_check() 逐文件
   数着这件事。

   为什么要数：设计约束是「把 cryptography 整个目录复制到任何别处仍可用」。
   一条随手写下的越界相对路径会在**别人搬走目录的那一刻**才失效，而那时没有
   任何东西会报警。把它变成一条提交前就会响的断言。

   自愈：http(s) 下对这个 URL 发一次 HEAD 探测，404/网络失败就把按钮藏掉。
   file:// 下 fetch 探测本来就会失败（同源限制），无法区分「文件不在」与
   「协议不让探」，所以那种情况保持显示——file:// 的使用者基本都在仓库里。 */
var PARENT_HOME = '../app.html';
/* 目的地是 MathViz 的**导航壳** app.html，不是它的扁平画廊 index.html。
   去程已经是「壳 → 壳」（根 index.html 的子项目卡片带 target="_top" 直接进
   cryptography/app.html），回程就该对称：落在 MathViz 自己的壳上，侧边栏是
   数学工具那一条。指向 index.html 会把人扔在一张没有侧边栏的画廊上——那正是
   这一轮修的两个 bug 的同一个形状，只是换了个方向。 */

function wireParentLink(el) {
  if (!el) return;
  el.href = PARENT_HOME + '?lang=' + LANG;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    fetch(PARENT_HOME, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) el.style.display = 'none';
    })['catch'](function () { el.style.display = 'none'; });
  } catch (e) { el.style.display = 'none'; }
}

   五章是固定的，不像 chess 的阶段那样会往后长，所以 chapterLabel 末尾那个
   兜底分支**不是**扩展机制：越界的 chapter 该被 check.py 的 chapter ∈ 1–5
   那道门在提交前拦住，而不是靠页面长出一个叫「第 7 章」的无名栏目。留着它
   只是为了在真漏过去时给出「第 7 章」而不是 undefined —— 一个看得出是错的
   标题，好过一个看起来像正常空白的标题。 */
var CHAPTER_LABELS = {
  1: { en: 'Chapter 1 · Classical Cryptography', zh: '第 1 章 · 古典密码' },
  2: { en: 'Chapter 2 · Mechanical Cryptography', zh: '第 2 章 · 机械密码' },
  3: { en: 'Chapter 3 · Cryptanalysis', zh: '第 3 章 · 密码分析' },
  4: { en: 'Chapter 4 · Modern Cryptography', zh: '第 4 章 · 现代密码学' },
  5: { en: 'Chapter 5 · Quantum-Era Cryptography', zh: '第 5 章 · 量子时代密码学' }
};
function chapterLabel(n) { return CHAPTER_LABELS[n] || { en: 'Chapter ' + n, zh: '第 ' + n + ' 章' }; }

var L = {
  title: { en: 'Cryptography Teaching Tools · MathViz', zh: '密码学教学工具 · MathViz' },
  brand: { en: 'Cryptography', zh: '密码学' },
  home: { en: 'All tools · Gallery', zh: '全部工具 · 画廊' },
  hide: { en: 'Hide sidebar', zh: '收起侧栏' },
  show: { en: 'Show sidebar', zh: '展开侧栏' },
  alone: { en: 'Open current tool in a new tab', zh: '在新标签页单独打开当前工具' },
  back: { en: 'Back to MathViz', zh: '返回 MathViz' }
};

/* ================= DOM 引用与状态 ================= */
var shell = document.getElementById('shell');
var navList = document.getElementById('navList');
var frame = document.getElementById('frame');
var curId = null;      // null = home（iframe 里装画廊）
var syncing = false;   // 区分「壳驱动的换页」与「使用者在画廊里点了卡片」

/* ================= 查表 ================= */
function byId(id) {
  for (var i = 0; i < TOOLS.length; i++) { if (TOOLS[i].id === id) return TOOLS[i]; }
  return null;
}
function fileOf(id) { var d = byId(id); return d ? d.file : null; }

/* accent 白名单——不能靠 esc() 兜底：accent 被拼进 style="" 属性值内部
   （--c:var(--trace-<accent>)），esc() 只转义 & < > "，一个像
   `x); background:url(//evil/leak?` 这样的 CSS 层面 payload 一个都不含，
   会原样穿透进 style 并被当成任意 CSS 声明执行。 cryptography-tools.json 今天是
   仓库自控内容，但它是运行时 fetch 进来的，所以必须在插值点就收紧成闭集。

   ⚠ 退路选 unpaired 而不是某个调色板颜色，是上游 chess 子项目上真出过的事故
   换来的，原样记在这里：那边的退路曾经是 cyan，理由是「四个真实工具都不用这个
   色，退回它时一眼能看出这项没配对」。阶段 5 的工具⑤ 用掉了 cyan（五工具五色），
   那个哨兵当场失效——一个拼错了 accent 的条目会显示成跟工具⑤ 一样的青色，看上去
   完全正常。本子项目从第一个工具起就用掉了 cyan（Caesar），那条退路在这里连一天
   都不成立。
   新的不变量因此不再依赖「哪个调色板颜色恰好没人用」——退路换成调色板之外的
   `--trace-unpaired`，一块刺眼的洋红，取的是三维渲染里 missing texture 的老规矩：
   它**永远**不会是任何工具的品牌色，无论以后加多少个工具、用掉多少种颜色。
   要维持这条不变量只需一件事：给新工具选 accent 时只能从 ACCENTS 的五个键里选，
   不许把 unpaired 加进这张表。

   ⚠ 作用域：这条不变量在 cryptography/index.html 上同样成立——那一页有一份逐字
   同源的 ACCENTS/safeAccent，`--trace-unpaired` 也在它自己的 `:root` 里定义（本文件
   是第 33 行；这个 token 是 per-file 的，两页各定义一次，不共享）。两页要一起改：
   只在一页收紧白名单，另一页照样把 accent 原样插进 style。
   但两页**没有白名单时的失效模式**并不相同：本页有 unpaired 兜底、所以失效时是
   「悄悄套错颜色」，而 index.html 那页拼错的 accent 指向一个未定义的变量，卡片是
   没有颜色。要照抄结论时先读 cryptography/index.html 里同名注释的第二段。 */
var ACCENTS = { cyan: 1, rose: 1, violet: 1, emerald: 1, orange: 1 };
function safeAccent(a) { return ACCENTS.hasOwnProperty(a) ? a : 'unpaired'; }

/* ================= 侧边栏渲染 =================
   分组依据是 chapter（主站 app.html 用的是 cat）。章节顺序按数值升序，
   只画注册表里真出现过的章节——没有工具的章节不留空组，也不占位。 */
function renderNav() {
  var html = '<button class="item home' + (curId === null ? ' on' : '') + '" data-id="">' +
             '<span class="dot"></span><span class="tx">' + esc(t(L.home)) + '</span></button>';

  var chapters = [];
  for (var i = 0; i < TOOLS.length; i++) {
    var p = TOOLS[i].chapter || 1;
    if (chapters.indexOf(p) < 0) chapters.push(p);
  }
  chapters.sort(function (a, b) { return a - b; });

  for (var k = 0; k < chapters.length; k++) {
    var ch = chapters[k];
    html += '<div class="grp">' + esc(t(chapterLabel(ch))) + '</div>';
    for (var j = 0; j < TOOLS.length; j++) {
      var d = TOOLS[j];
      if ((d.chapter || 1) !== ch) continue;
      html += '<button class="item' + (d.id === curId ? ' on' : '') + '"' +
              ' data-id="' + esc(d.id) + '"' +
              ' style="--c:var(--trace-' + safeAccent(d.accent) + ')"' +
              ' title="' + esc(t(d.tag)) + '">' +
              '<span class="dot"></span><span class="tx">' + esc(t(d.title)) + '</span></button>';
    }
  }
  navList.innerHTML = html;
}

/* ================= 从 iframe 的路径反推 id =================
   使用者在画廊（home）里点了一张卡片时，导航不是壳发起的——iframe 自己换了
   页面。载入回调里靠文件名反查 id，才能把侧边栏高亮与地址栏同步过去。 */
function idFromPath(path) {
  var f = String(path).split('/').pop();
  for (var i = 0; i < TOOLS.length; i++) {
    if (TOOLS[i].file.split('/').pop() === f) return TOOLS[i].id;
  }
  return null;
}

function srcFor(id) {
  var f = id ? fileOf(id) : 'index.html';
  return (f || 'index.html') + '?lang=' + LANG;
}

/* 换页面用 location.replace 而不是赋值 frame.src——这一条抄自主站 app.html，
   理由也照抄：赋值 src 会往「联合会话历史」里塞一条 iframe 记录，与壳自己的
   pushState 交错，后退键就会出现「地址与侧栏都退了、画面还停在上一个工具」的
   错位。replace 不产生历史记录，历史完全由壳掌握。
   try/catch 不是防跨源——location.replace 本身就是少数几个跨源仍可访问的
   成员，file:// 下一样调用得通，不会抛。catch 兜的是 contentWindow 本身
   为假值这种边缘情形（iframe 尚未挂好窗口对象），此时才退回赋值 src。 */
function setFrame(url) {
  try {
    if (frame.contentWindow) { frame.contentWindow.location.replace(url); return; }
  } catch (e) { /* 理论上的边缘情形，见上 */ }
  frame.src = url;
}

function renderChrome() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('brandName').textContent = t(L.brand);
  wireParentLink(document.getElementById('brandLink'));
  document.getElementById('brandLink').title = t(L.back);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  document.getElementById('btnHide').title = t(L.hide) + ' (Ctrl+B)';
  document.getElementById('btnShow').title = t(L.show) + ' (Ctrl+B)';
  var d = curId ? byId(curId) : null;
  document.title = d ? t(d.title) + ' · MathViz' : t(L.title);
  var alone = document.getElementById('btnAlone');
  alone.title = t(L.alone);
  alone.href = (d ? d.file : 'index.html') + '?lang=' + LANG;
}

/* ================= 地址栏同步 =================
   换工具、iframe 自己换页后的回同步、切语言、别处切语言——四条路径都要把
   当前的 curId 与 LANG 写回地址栏，所以只留这一份实现：地址栏在任何时刻都是
   一条完整可复制的链接（tool 与 lang 同时在），不会因为某一条路径漏写一个
   参数而退化。push 只在「换工具」时为真——那才算一次导航；切语言与回同步
   都用 replaceState，否则后退键会退到「同一页只是语言不同」这种空档上。 */
function syncUrl(push) {
  try {
    var u = new URL(location.href);
    if (curId) u.searchParams.set('tool', curId); else u.searchParams.delete('tool');
    u.searchParams.set('lang', LANG);
    history[push ? 'pushState' : 'replaceState']({ tool: curId }, '', u);
  } catch (e) {}
}

function go(id, push) {
  if (id && !byId(id)) id = null;      // 未知 id 一律落回 home，不留 undefined
  curId = id || null;
  syncing = true;
  setFrame(srcFor(curId));
  renderNav();
  renderChrome();
  if (push !== false) syncUrl(true);
  if (window.innerWidth <= 760) setSidebarOpen(false, false);
}

/* 侧边栏点击：事件委托到容器上，renderNav() 每次重画都不必重新绑。
   点已经是当前项的那一个——不出手：go() 无条件会重推一条历史（地址不变
   但 history.length 白长一条）并重新 setFrame() 同一个 URL（iframe 硬重
   载，工具内部状态——回放进度、相机、当前 tab——全丢）。这个判断只放在
   点击这一条路径：boot() 首次调用 go(id,false) 时 curId 还是 null，若把
   守卫塞进 go() 本身，无 query 的首次加载会被当成「已经在这」而提前返回，
   iframe 就永远不会被指向画廊；popstate 同理也不能加这层判断。「点到已经
   在的那项就不动」只在使用者主动点击时才成立。 */
navList.addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('.item') : null;
  if (!btn) return;
  var id = btn.dataset.id || null;
  if (id === curId) return;
  go(id, true);
});

/* 后退/前进 */
window.addEventListener('popstate', function (e) {
  var id = (e.state && e.state.tool) || null;
  if (!id) {
    try { id = new URLSearchParams(location.search).get('tool'); } catch (err) { id = null; }
  }
  go(id, false);
});

/* iframe 载入后回同步：使用者在画廊里点卡片时，导航不是壳发起的 */
frame.addEventListener('load', function () {
  if (syncing) { syncing = false; return; }
  var id = null;
  try { id = idFromPath(frame.contentWindow.location.pathname); } catch (e) { return; }
  if (id === curId) return;
  curId = id;
  renderNav();
  renderChrome();
  syncUrl(false);
});

/* ================= 侧边栏显隐 =================
   remember 默认 true，由调用方按语义传 false：窄屏（≤760px）上的自动收起
   是布局行为，不是「使用者选择了收起」，不该被记进 NAV_KEY——go() 换页后的
   那次、以及 .scrim 上的那次（遮罩只在 ≤760px 存在）都属于这一类。
   折叠按钮、快捷键与「恢复上次状态」都在下面几段里调用它。 */
function setSidebarOpen(open, remember) {
  shell.classList.toggle('hid', !open);
  if (remember !== false) {
    try { localStorage.setItem(NAV_KEY, open ? 'open' : 'hid'); } catch (e) {}
  }
}

function boot() {
  var id = null;
  try { id = new URLSearchParams(location.search).get('tool'); } catch (e) {}
  go(id, false);
  try { history.replaceState({ tool: curId }, '', location.href); } catch (e) {}
}
boot();

function toggleSidebar() { setSidebarOpen(shell.classList.contains('hid')); }

document.getElementById('btnHide').addEventListener('click', function () { setSidebarOpen(false); });
document.getElementById('btnShow').addEventListener('click', function () { setSidebarOpen(true); });
/* 遮罩只在 ≤760px 存在，点它收起属于布局行为，不记进 NAV_KEY——与 go() 一致 */
document.getElementById('scrim').addEventListener('click', function () { setSidebarOpen(false, false); });

/* ================= 键盘 =================
   只认两枚：Ctrl/Cmd+B 与 [。工具页那边已经占了数字键（视角预设）、T（切页签）、
   Space（播放/暂停）、← →（时间轴单步）、r（重置）——壳不许碰这些。
   isTyping() 挡住在明文输入框里敲 [ 的情形：密码学工具几乎每一个都有一个
   可编辑的明文/密钥输入框，这不是边缘情形，是常态。 */
function isTyping(el) {
  if (!el) return false;
  var tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
function hotkey(e) {
  if (isTyping(e.target)) return;
  var mod = e.ctrlKey || e.metaKey;
  if ((mod && (e.key === 'b' || e.key === 'B')) || (!mod && !e.altKey && e.key === '[')) {
    e.preventDefault();
    toggleSidebar();
  }
}
document.addEventListener('keydown', hotkey);

/* 工具在 iframe 里，键盘事件落在它的文档上，壳收不到——载入后把同一个
   handler 也挂进去（同源才行，跨源会抛，try/catch 兜住）。 */
frame.addEventListener('load', function () {
  try { frame.contentDocument.addEventListener('keydown', hotkey); } catch (e) {}
});

/* 恢复上次的折叠状态。不 remember，否则「恢复」这件事本身会写一次存储。 */
try {
  if (localStorage.getItem(NAV_KEY) === 'hid') setSidebarOpen(false, false);
} catch (e) {}

/* ================= 语言 =================
   切换要同时做两件事：① 重渲壳自己的文案 ② 重设 iframe 的 ?lang=。
   只做①会得到「壳是中文、工具是英文」。 */
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  renderNav();
  renderChrome();
  syncing = true;
  setFrame(srcFor(curId));
  syncUrl(false);
}
document.getElementById('btnLang').addEventListener('click', function () {
  setLang(LANG === 'zh' ? 'en' : 'zh');
});

/* 工具页（cryptography/core/viz-engine.js 造的那个）与画廊自己都有一枚 #btnLang，
   iframe 里点的是它们的，不是壳的——两枚同时可见。同源写 localStorage 会在
   其它 window 触发 storage 事件（规范只排除发起写入的那个 window），所以壳
   收得到自家 iframe 的那次写入。收到就跟着改 LANG、重渲侧栏与 chrome、把
   地址栏的 lang 带上，但绝不 setFrame()。
   事件里读不出写入者是谁，而写入者有两种：可能是我们自己的 iframe，也可能是
   另一个标签页里独立打开的 cryptography 工具（它写的是同一个 cryptography-lang
   键）。前者
   下不重指 iframe 是必须的——触发事件的正是它那次自我重渲染，再 setFrame()
   等于重载工具、扔掉它刚刚的状态；后者下 iframe 里那一页确实还停在旧语言上，
   代价是它要等到下次换页才跟上，仍比无条件重载丢状态划算。
   newValue 要挡 null（storage 被清空）和非 en/zh（别的 key、别的写入）。 */
window.addEventListener('storage', function (e) {
  if (e.key !== LANG_KEY) return;
  if (e.newValue !== 'en' && e.newValue !== 'zh') return;
  if (e.newValue === LANG) return;
  LANG = e.newValue;
  renderNav();
  renderChrome();
  syncUrl(false);
});

/* 优先取 cryptography-tools.json（有服务器时永远最新）；file:// 或离线时 fetch
   失败，静默沿用内嵌的 FALLBACK，不弹错误、不阻塞渲染（boot() 已经先渲染过一次）。
   覆盖之后要重渲侧边栏——注册表里可能多出 FALLBACK 还没有的工具。curId 不动：
   它此刻装的那一页是有效的，重新 go() 会白白重载一次 iframe。 */
(function () {
  try {
    fetch('cryptography-tools.json', { cache: 'no-cache' }).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (j) {
      if (j && j.tools && j.tools.length) {
        TOOLS = j.tools;
        /* 新注册表可能不再含 curId 指向的工具（下架、编辑）。只纠正内存里的 id，
           不动 iframe——它此刻装的那一页依然是有效画面，frame 不该跟着重载。 */
        if (curId && !byId(curId)) curId = null;
        renderNav();
        renderChrome();
        /* 反方向的同一件事：内嵌的 FALLBACK 落后于注册表时（部署错位——
           check.py 只在提交时把两者钉在一起），boot() 会把一个它还不认识的
           ?tool= 判成未知 id 落回画廊。此刻新注册表认得它，就把这条深链补上。
           只在还没装任何工具时才补——已经装上工具的情形归上面那条「不动
           iframe」管，不能因为注册表到货就把使用者正在看的一页重载掉。 */
        if (!curId) {
          var want = null;
          try { want = new URLSearchParams(location.search).get('tool'); } catch (e2) {}
          if (want && byId(want)) { go(want, false); syncUrl(false); }
        }
      }
    })['catch'](function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
