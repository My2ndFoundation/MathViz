  三个页签共享同一份运动（同一个信号、不同的测量）：
    谐波叠加 —— 奇次谐波各居一个频率平面，其和即方波（傅立叶级数）
                顿悟视角：「频谱 x·y」正视 = 频谱图
    旋转向量 —— 首尾相接的旋转向量（本轮），链尖画出方波
                顿悟视角：「方波 y·t」侧视 = 圆盘消失、方波显形
    频率缠绕 —— 信号绕原点缠绕，质心模长随缠绕频率的扫描即频谱
                顿悟视角：「全景」正视 = 缠绕 + 频谱同屏

  信号约定：g(θ) = Σ (4A/nπ)·sin(nθ)，n ∈ {1,3,5,7}（方波奇次谐波）
  采样原则：记录当时的真实值（谐波开关 / 参数中途改变，历史不重算）

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'fourier-essence-3d',
  title: { zh: '傅立叶变换的本质 · Fourier Essence', en: 'The Essence of the Fourier Transform' },
  h1:    { zh: '傅立叶变换的本质', en: 'The Essence of the Fourier Transform' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'omega',     label: { zh: '基频 <i>ω</i>', en: 'Base frequency <i>ω</i>' },      min: 0.3, max: 3,   step: 0.05, value: 1,   fmt: v => fmt(v) + ' rad/s' },
  { key: 'amp',       label: { zh: '振幅 <i>A</i>', en: 'Amplitude <i>A</i>' },           min: 0.2, max: 1.4, step: 0.05, value: 1,   fmt: v => fmt(v) },
  { key: 'wind',      label: { zh: '缠绕频率 <i>f</i>', en: 'Winding frequency <i>f</i>' }, min: 0,   max: 8,   step: 0.02, value: 1,   fmt: v => fmt(v) + ' × f₀' },
  { key: 'waveSpeed', label: { zh: '波形展开速度', en: 'Wave unroll speed' },              min: 0.5, max: 2.5, step: 0.05, value: 1.2, fmt: v => fmt(v) + t({ zh: ' 单位/s', en: ' units/s' }) }
];

/* ── 傅立叶工具常量与辅助（曲线按 rose→violet→emerald→orange 启用） ── */
const HN   = [1, 3, 5, 7];                                    /* 奇次谐波序号 */
const HCOL = ['#fb7185', '#a78bfa', '#34d399', '#fb923c'];    /* 谐波语义色 */
const HXP  = [1.3, 2.6, 3.9, 5.2];                            /* 谐波所在频率平面的 x 位置 */
const FLAB = ['f₀', '3f₀', '5f₀', '7f₀'];
const SUBL = ['a₁', 'a₃', 'a₅', 'a₇'];
const WIND_M = 3;            /* 缠绕/质心统计窗口 = 最近 3 个基频周期 */
const KMAX = 8.2, KSTEP = 0.05;                    /* 频谱扫描范围与步长 */
const FX0 = 2.4, KSC = 0.6, BY = -1.0, MSC = 1.7;  /* 频谱图：原点 / 横向比例 / 基线 / 纵向比例 */

const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1, 3), 16) + ',' + parseInt(h.slice(3, 5), 16) + ',' +
  parseInt(h.slice(5, 7), 16) + ',' + a + ')';

function ampN(n) { return state.amp * 4 / (HN[n] * Math.PI); }

/* 当前时刻各谐波与合成信号的实时值（暂停时也用它显示"当前点"） */
function liveVals() {
  const th = state.theta, h = [], out = { h: h, g: 0 };
  for (let n = 0; n < 4; n++) {
    if (state['h' + (n + 1)]) {
      const v = ampN(n) * Math.sin(HN[n] * th);
      h.push(v); out.g += v;
    } else h.push(null);
  }
  return out;
}

/* 缠绕统计窗口：θ 空间上最近 WIND_M 个整周期（不足则用全部） */
function windRange() {
  const n = samples.length;
  if (n < 2) return null;
  const thLo = samples[n - 1].th - WIND_M * TAU;
  let lo = n - 1;
  while (lo > 0 && samples[lo - 1].th >= thLo) lo--;
  return lo < n - 1 ? [lo, n - 1] : null;
}

/* 质心 X(k) = ∫ g·e^(−ikθ) dθ / ∫ dθ（按 Δθ 加权，ω 中途改变亦精确） */
function comAt(k, lo, hi, stride) {
  let sx = 0, sy = 0, sw = 0;
  for (let i = lo; i < hi; i += stride) {
    const s = samples[i], j = Math.min(i + stride, hi);
    const w = samples[j].th - s.th;
    if (w <= 0) continue;
    const a = k * s.th;
    sx += s.g * Math.cos(a) * w;
    sy -= s.g * Math.sin(a) * w;
    sw += w;
  }
  return sw < 1e-9 ? [0, 0] : [sx / sw, sy / sw];
}

/* 频谱缓存：|X(k)| 曲线，节流 160ms 重算 */
let specPts = null, specT = -1e9;
function updateSpectrum(lo, hi) {
  const stride = Math.max(1, Math.ceil((hi - lo) / 420));
  const pts = [];
  for (let k = 0; k <= KMAX + 1e-9; k += KSTEP) {
    const c = comAt(k, lo, hi, stride);
    pts.push([k, Math.hypot(c[0], c[1])]);
  }
  specPts = pts;
}

/* 谐波叠加页专用坐标轴（x 轴即频率轴） */
function synthAxes(C) {
  line3(C, [-0.7, 0, 0], [5.9, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [5.9, 0, 0], [5.7, 0, 0], AXIS);
  label3(C, [6.2, 0, 0], 'f', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -1.8, 0], [0, 1.8, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 1.8, 0], [0, 1.6, 0], AXIS);
  label3(C, [0, 1.98, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
  label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const v = state.waveSpeed, every = v < 0.8 ? 2 : 1;
  for (let k = 1; k * v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -0.06, k * v], [0, 0.06, k * v], { width: 1.2, color: AXIS_DIM });
    if (k % every === 0) {
      label3(C, [0, -0.25, k * v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
  for (const yv of [1, -1]) {
    line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + 1, { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
}

/* 频率缠绕页专用坐标轴（复平面 Re / Im） */
function windAxes(C) {
  line3(C, [-1.75, 0, 0], [1.75, 0, 0], { width: 1.3, color: AXIS });
  arrowAt(C, [1.75, 0, 0], [1.6, 0, 0], AXIS);
  label3(C, [1.98, 0, 0], 'Re', { font: 'italic 13px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -1.75, 0], [0, 1.75, 0], { width: 1.3, color: AXIS });
  arrowAt(C, [0, 1.75, 0], [0, 1.6, 0], AXIS);
  label3(C, [0, 1.92, 0], 'Im', { font: 'italic 13px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const s of [1, -1]) {
    line3(C, [s, -0.05, 0], [s, 0.05, 0], { width: 1.2, color: AXIS_DIM });
    line3(C, [-0.05, s, 0], [0.05, s, 0], { width: 1.2, color: AXIS_DIM });
  }
  label3(C, [1, -0.2, 0], '1', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 页签一：谐波叠加（傅立叶级数） ────── */
  synth: {
    label: { zh: '谐波叠加', en: 'Harmonic sum' },
    params: ['omega', 'amp', 'waveSpeed'],
    brand: { zh: '任何周期信号都能拆成一组正弦谐波：方波的四个奇次谐波各自在自己的频率平面上振动，它们的和在最左侧平面随时间流出——这就是傅立叶级数。逐个开关谐波，看方波被一点点搭出来。',
             en: 'Any periodic signal can be split into a set of sine harmonics: the square wave\'s four odd harmonics each oscillate on their own frequency plane, and their sum flows out over time on the leftmost plane — that is the Fourier series. Toggle the harmonics one by one and watch the square wave get built up piece by piece.' },
    tips: { zh: '提示：切到「频谱 x·y」——每条谐波塌缩成一根振幅竖线，横轴化作频率轴，这幅正视图本身就是频谱。留意方波跳变处约 9% 的过冲：这是吉布斯（Gibbs）现象，增加谐波也不会消失。',
            en: 'Tip: switch to "Spectrum x·y" — each harmonic collapses into a single amplitude bar, the horizontal axis becomes the frequency axis, and this front view is itself the spectrum. Notice the roughly 9% overshoot at the square wave\'s jumps: this is the Gibbs phenomenon, and adding more harmonics never makes it go away.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },          az: -0.9,        el: 0.33,  dist: 15,   tx: 2.1,  ty: 0.1,   tz: 2.4 },
      front: { label: { zh: '频谱 x·y', en: 'Spectrum x·y' }, az: 0.001,       el: 0.02,  dist: 12,   tx: 2.45, ty: -0.05, tz: 0 },
      side:  { label: { zh: '叠加 y·t', en: 'Sum y·t' },  az: -Math.PI/2,  el: 0.001, dist: 12.5, tx: 0,    ty: 0,     tz: 3.3 }
    },
    toggles: [
      { key: 'h1', label: { zh: '谐波 <i>ω</i>', en: 'Harmonic <i>ω</i>' },   color: '#fb7185', checked: true },
      { key: 'h2', label: { zh: '谐波 3<i>ω</i>', en: 'Harmonic 3<i>ω</i>' }, color: '#a78bfa', checked: true },
      { key: 'h3', label: { zh: '谐波 5<i>ω</i>', en: 'Harmonic 5<i>ω</i>' }, color: '#34d399', checked: true },
      { key: 'h4', label: { zh: '谐波 7<i>ω</i>', en: 'Harmonic 7<i>ω</i>' }, color: '#fb923c', checked: true },
      { key: 'showGuides', label: { zh: '投影辅助线', en: 'Projection guides' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => Math.max(WAVE_LEN / state.waveSpeed + 0.5, WIND_M * TAU / state.omega + 1),
    draw(C) {
      const v = state.waveSpeed, tnow = state.t, lv = liveVals(), A = state.amp;
      if (state.showGrid) drawTimeGrid(C, { yMax: 1.5, v: v });

      /* ±A：方波的目标电平（合成平面的参考虚线） */
      line3(C, [0, A, 0], [0, A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(226,232,240,0.22)' });
      line3(C, [0, -A, 0], [0, -A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(226,232,240,0.22)' });
      label3(C, [0, A, 0], 'A', { font: 'italic 11px ' + FONT_MATH, color: 'rgba(226,232,240,0.5)', align: 'right', dx: -9 });
      label3(C, [0, -A, 0], '−A', { font: 'italic 11px ' + FONT_MATH, color: 'rgba(226,232,240,0.5)', align: 'right', dx: -9 });

      synthAxes(C);

      /* 各频率平面：刻度、频率标注（谐波色）、±aₙ 振幅竖线 */
      for (let n = 0; n < 4; n++) {
        const X = HXP[n], on = state['h' + (n + 1)], a = ampN(n);
        line3(C, [X, -0.06, 0], [X, 0.06, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [X, -0.3, 0], FLAB[n],
          { font: 'italic 11px ' + FONT_MATH, color: on ? hexA(HCOL[n], 0.95) : 'rgba(159,176,200,0.4)', align: 'center' });
        if (on) {
          line3(C, [X, -a, 0], [X, a, 0], { width: 1, dash: [5, 6], color: hexA(HCOL[n], 0.5) });
          line3(C, [X - 0.08, a, 0], [X + 0.08, a, 0], { width: 1.2, color: hexA(HCOL[n], 0.6) });
          line3(C, [X - 0.08, -a, 0], [X + 0.08, -a, 0], { width: 1.2, color: hexA(HCOL[n], 0.6) });
        }
      }

      if (state.showGuides) {
        drawPeriodBracket(C, TAU / state.omega, v, 0, -1.75, 'T = ' + fmt(TAU / state.omega) + ' s');
      }

      /* 历史曲线（记录的是当时的真实值；谐波关闭期间以断点呈现） */
      const zLim = WAVE_LEN + 0.4, ptsSum = [], ptsH = [[], [], [], []];
      for (let i = samples.length - 1; i >= 0; i--) {
        const s = samples[i], z = (tnow - s.t) * v;
        if (z > zLim) break;
        ptsSum.push([0, s.g, z]);
        for (let n = 0; n < 4; n++) {
          const hv = s.h[n];
          ptsH[n].push(hv == null ? null : [HXP[n], hv, z]);
        }
      }
      for (let n = 3; n >= 0; n--) {
        strokePoly(C, ptsH[n], { width: 5.5, color: hexA(HCOL[n], 0.13) });
        strokePoly(C, ptsH[n], { width: 2.2, fade: [hexA(HCOL[n], 1), hexA(HCOL[n], 0.04)] });
      }
      strokePoly(C, ptsSum, { width: 6, color: 'rgba(226,232,240,0.12)' });
      strokePoly(C, ptsSum, { width: 2.4, fade: ['rgba(240,245,250,1)', 'rgba(240,245,250,0.05)'] });

      /* 辅助：谐波头 → 合成平面的投影虚线 + 合成平面上的堆叠加法条 */
      if (state.showGuides) {
        let cum = 0;
        for (let n = 0; n < 4; n++) {
          const hv = lv.h[n];
          if (hv == null) continue;
          line3(C, [HXP[n], hv, 0], [0, hv, 0], { width: 1.4, dash: [7, 7], color: hexA(HCOL[n], 0.7) });
          line3(C, [0, cum, 0], [0, cum + hv, 0], { width: 4, color: hexA(HCOL[n], 0.95) });
          cum += hv;
        }
      }

      /* 头部光点 */
      for (let n = 0; n < 4; n++) {
        const hv = lv.h[n];
        if (hv == null) continue;
        const p = proj(C, [HXP[n], hv, 0]);
        if (p) glowDot(p, 8, '#ffffff', hexA(HCOL[n], 0.85));
      }
      const sp = proj(C, [0, lv.g, 0]);
      if (sp) glowDot(sp, 12, '#ffffff', 'rgba(186,240,255,0.9)');

      label3(C, [1.15, 1.92, 0], 'g(t) = (4A/π)·Σ sin(nωt)/n,  ' + t({ zh: 'n 为奇数', en: 'n odd' }),
        { font: 'italic 13px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const lv = liveVals();
      const NM = ['(4A/π)·sin ωt', '(4A/3π)·sin 3ωt', '(4A/5π)·sin 5ωt', '(4A/7π)·sin 7ωt'];
      let rows = '';
      for (let n = 0; n < 4; n++) {
        if (lv.h[n] == null) continue;
        rows += '<div class="h' + (n + 1) + 'C">' + NM[n] + ' = <b>' + fmtS(lv.h[n]) + '</b></div>';
      }
      return readoutHead() + rows +
        '<div>g = Σ' + t({ zh: '谐波', en: 'harmonics' }) + ' = <b>' + fmtS(lv.g) + '</b></div>' +
        '<div class="dim">f₀ = ω/2π = ' + (state.omega / TAU).toFixed(3) + ' Hz&ensp;·&ensp;T = ' + fmt(TAU / state.omega) + ' s</div>';
    }
  },

  /* ────── 页签二：旋转向量（本轮 · 圆周运动的叠加） ────── */
  cycle: {
    label: { zh: '旋转向量', en: 'Rotating vectors' },
    params: ['omega', 'amp', 'waveSpeed'],
    brand: { zh: '把每个谐波看成一支匀速旋转的向量，按频率首尾相接：链条末端的高度就是所有谐波之和。拖拽旋转，看几个圆周运动如何联手画出方波。',
             en: 'Think of each harmonic as a vector spinning at constant speed, chained tip-to-tail by frequency: the height of the chain\'s end is the sum of all the harmonics. Drag to rotate and watch several circular motions team up to draw the square wave.' },
    tips: { zh: '提示：切到「方波 y·t」侧视——所有圆盘侧立消失，链尖流出的正是方波。这种首尾相接的圆叫「本轮」(epicycle)，托勒密曾用它描述行星轨道，傅立叶级数让它重获新生。',
            en: 'Tip: switch to "Square wave y·t" side view — all the discs edge-on disappear, and what flows out from the chain tip is exactly the square wave. This chain of circles is called an "epicycle" — Ptolemy once used it to describe planetary orbits, and the Fourier series gave it new life.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },                   az: -0.85,      el: 0.3,   dist: 11.5, tx: 0, ty: 0, tz: 2.6 },
      front: { label: { zh: '本轮 x·y', en: 'Epicycles x·y' },    az: 0.001,      el: 0.02,  dist: 8,    tx: 0, ty: 0, tz: 0.4 },
      side:  { label: { zh: '方波 y·t', en: 'Square wave y·t' },  az: -Math.PI/2, el: 0.001, dist: 11.5, tx: 0, ty: 0, tz: 3.4 }
    },
    toggles: [
      { key: 'h1', label: { zh: '谐波 <i>ω</i>', en: 'Harmonic <i>ω</i>' },   color: '#fb7185', checked: true },
      { key: 'h2', label: { zh: '谐波 3<i>ω</i>', en: 'Harmonic 3<i>ω</i>' }, color: '#a78bfa', checked: true },
      { key: 'h3', label: { zh: '谐波 5<i>ω</i>', en: 'Harmonic 5<i>ω</i>' }, color: '#34d399', checked: true },
      { key: 'h4', label: { zh: '谐波 7<i>ω</i>', en: 'Harmonic 7<i>ω</i>' }, color: '#fb923c', checked: true },
      { key: 'showGuides', label: { zh: '投影辅助线', en: 'Projection guides' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => Math.max(WAVE_LEN / state.waveSpeed + 0.5, WIND_M * TAU / state.omega + 1),
    draw(C) {
      const v = state.waveSpeed, tnow = state.t, lv = liveVals(), th = state.theta;
      if (state.showGrid) drawTimeGrid(C, { yMax: 1.5, v: v });
      drawAxes(C, { ex: 2.7, ey: 1.9, yTicks: [1], xTicks: [], tAxis: true, v: v });
      if (state.showGuides) {
        drawPeriodBracket(C, TAU / state.omega, v, 0, -1.75, 'T = ' + fmt(TAU / state.omega) + ' s');
      }

      /* 幽灵轨道：链尖在一个周期内画出的闭合曲线 */
      if (state.showGuides) {
        const gp = [];
        for (let j = 0; j <= 240; j++) {
          const a = j / 240 * TAU;
          let x = 0, y = 0;
          for (let n = 0; n < 4; n++) {
            if (state['h' + (n + 1)]) { x += ampN(n) * Math.cos(HN[n] * a); y += ampN(n) * Math.sin(HN[n] * a); }
          }
          gp.push([x, y, 0]);
        }
        strokePoly(C, gp, { width: 1.4, color: 'rgba(226,232,240,0.18)' });
      }

      /* 合成波形（白系 = 第五曲线补位），沿 t 轴流出 */
      const zLim = WAVE_LEN + 0.4, ptsSum = [];
      for (let i = samples.length - 1; i >= 0; i--) {
        const s = samples[i], z = (tnow - s.t) * v;
        if (z > zLim) break;
        ptsSum.push([0, s.g, z]);
      }
      strokePoly(C, ptsSum, { width: 6, color: 'rgba(226,232,240,0.12)' });
      strokePoly(C, ptsSum, { width: 2.4, fade: ['rgba(240,245,250,1)', 'rgba(240,245,250,0.05)'] });

      /* 向量链：圆（结构）→ 向量 → 关节点 */
      let cx = 0, cy = 0, tip = null;
      for (let n = 0; n < 4; n++) {
        if (!state['h' + (n + 1)]) continue;
        const a = ampN(n), ang = HN[n] * th;
        const nx = cx + a * Math.cos(ang), ny = cy + a * Math.sin(ang);
        const cp = [];
        for (let j = 0; j <= 48; j++) {
          const b = j / 48 * TAU;
          cp.push([cx + a * Math.cos(b), cy + a * Math.sin(b), 0]);
        }
        strokePoly(C, cp, { width: 1.2, color: hexA(HCOL[n], 0.45) });
        line3(C, [cx, cy, 0], [nx, ny, 0], { width: 2, color: hexA(HCOL[n], 0.95) });
        solidDot(C, [cx, cy, 0], 2.2, hexA(HCOL[n], 0.9));
        cx = nx; cy = ny; tip = [nx, ny];
      }

      /* 链尖 → 波形头的水平投影（高度即信号值） */
      if (state.showGuides && tip) {
        line3(C, [tip[0], tip[1], 0], [0, lv.g, 0], { width: 1.4, dash: [7, 7], color: 'rgba(226,232,240,0.7)' });
      }
      const hp = proj(C, [0, lv.g, 0]);
      if (hp) glowDot(hp, 9, '#ffffff', 'rgba(237,242,248,0.85)');
      if (tip) {
        const tp = proj(C, [tip[0], tip[1], 0]);
        if (tp) glowDot(tp, 14, '#ffffff', 'rgba(186,240,255,0.9)');
      }

      label3(C, [0.2, 1.78, 0.3], 'y = Σ (4A/nπ)·sin(nωt)',
        { font: 'italic 13px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const lv = liveVals(), th = state.theta;
      let rows = '';
      for (let n = 0; n < 4; n++) {
        if (lv.h[n] == null) continue;
        const deg = (mod2pi(HN[n] * th) * 180 / Math.PI).toFixed(0);
        const den = HN[n] === 1 ? 'π' : HN[n] + 'π';
        rows += '<div class="h' + (n + 1) + 'C">' + SUBL[n] + ' = 4A/' + den + ' = <b>' + fmt(ampN(n)) + '</b>&ensp;·&ensp;∠ = ' + deg + '°</div>';
      }
      return readoutHead() +
        '<div>' + t({ zh: '链尖高度', en: 'Chain tip height' }) + ' y = Σ = <b>' + fmtS(lv.g) + '</b></div>' + rows +
        '<div class="dim">' + t({ zh: '向量长度', en: 'Vector length' }) + ' ∝ 1/n&ensp;·&ensp;T = ' + fmt(TAU / state.omega) + ' s</div>';
    }
  },

  /* ────── 页签三：频率缠绕（几乎就是傅立叶变换） ────── */
  wind: {
    label: { zh: '频率缠绕', en: 'Frequency winding' },
    params: ['omega', 'amp', 'wind', 'waveSpeed'],
    brand: { zh: '把信号 g(t) 以频率 f 缠绕到原点四周，再取所有点的质心：当 f 恰好命中信号所含的频率时，质心猛然偏离原点。把每个 f 的质心模长记下来，就得到频谱——这就是傅立叶变换的做法。',
             en: 'Wind the signal g(t) around the origin at frequency f, then take the centroid of all the points: when f exactly matches a frequency contained in the signal, the centroid suddenly jumps away from the origin. Record the centroid\'s magnitude for every f, and you get the spectrum — that is exactly what the Fourier transform does.' },
    tips: { zh: '提示：缓慢拖动缠绕频率 f 扫过 1、3、5、7 倍基频，质心（琥珀点）的每次跳动都对应频谱上的一个尖峰；停在偶数倍上质心缩回原点——方波里没有偶次谐波。也可先按空格暂停，再细细扫频。',
            en: 'Tip: slowly drag the winding frequency f across 1, 3, 5, and 7 times the base frequency — every jump of the centroid (amber dot) corresponds to a peak on the spectrum; stop on an even multiple and the centroid snaps back to the origin, since the square wave has no even harmonics. You can also pause with the space bar first, then sweep the frequency carefully.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' },          az: -0.5,  el: 0.45, dist: 13.5, tx: 2.4, ty: -0.1,  tz: 0 },
      pano: { label: { zh: '全景', en: 'Panorama' },     az: 0.001, el: 0.02, dist: 11.8, tx: 2.5, ty: -0.1,  tz: 0 },
      whl:  { label: { zh: '缠绕 x·y', en: 'Winding x·y' }, az: 0.001, el: 0.02, dist: 6.8,  tx: 0,   ty: 0.05,  tz: 0 },
      spec: { label: { zh: '频谱 f', en: 'Spectrum f' }, az: 0.001, el: 0.02, dist: 8.2,  tx: 4.8, ty: -0.15, tz: 0,
        onSelect: () => {
          state.showSpec = true;
          document.querySelectorAll('input[data-key="showSpec"]').forEach(o => { o.checked = true; });
        } }
    },
    toggles: [
      { key: 'h1', label: { zh: '谐波 <i>ω</i>', en: 'Harmonic <i>ω</i>' },   color: '#fb7185', checked: true },
      { key: 'h2', label: { zh: '谐波 3<i>ω</i>', en: 'Harmonic 3<i>ω</i>' }, color: '#a78bfa', checked: true },
      { key: 'h3', label: { zh: '谐波 5<i>ω</i>', en: 'Harmonic 5<i>ω</i>' }, color: '#34d399', checked: true },
      { key: 'h4', label: { zh: '谐波 7<i>ω</i>', en: 'Harmonic 7<i>ω</i>' }, color: '#fb923c', checked: true },
      { key: 'showSpec', label: { zh: '频谱 <i>|X(f)|</i>', en: 'Spectrum <i>|X(f)|</i>' }, color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' },                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => Math.max(WAVE_LEN / state.waveSpeed + 0.5, WIND_M * TAU / state.omega + 1),
    draw(C) {
      const k = state.wind, A = state.amp, lv = liveVals(), th = state.theta;
      if (state.showGrid) drawGridXY(C, 1.5, 0.5);

      /* 参考圆：半径 A（方波电平），缠绕曲线会贴着它 */
      const rc = [];
      for (let j = 0; j <= 64; j++) {
        const a = j / 64 * TAU;
        rc.push([A * Math.cos(a), A * Math.sin(a), 0]);
      }
      strokePoly(C, rc, { width: 1, dash: [5, 6], color: 'rgba(45,212,234,0.4)' });
      windAxes(C);
      solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');

      const range = windRange();
      let com = [0, 0];
      if (range) {
        const lo = range[0], hi = range[1], count = hi - lo + 1;

        /* 缠绕曲线：分段递增透明度（旧暗新亮） */
        const stride = Math.max(1, Math.ceil(count / 1400)), CH = 10;
        for (let c = 0; c < CH; c++) {
          const i0 = lo + Math.floor(count * c / CH);
          const i1 = Math.min(hi, lo + Math.floor(count * (c + 1) / CH));
          const pts = [];
          for (let i = i0; i <= i1; i += stride) {
            const s = samples[i], a = k * s.th;
            pts.push([s.g * Math.cos(a), -s.g * Math.sin(a), 0]);
          }
          const tt = (c + 1) / CH;
          strokePoly(C, pts, { width: 1.7, color: 'rgba(226,232,240,' + (0.05 + 0.8 * tt * tt).toFixed(3) + ')' });
        }

        /* 质心（琥珀 = 度量结果） */
        com = comAt(k, lo, hi, Math.max(1, Math.ceil(count / 700)));
        line3(C, [0, 0, 0], [com[0], com[1], 0], { width: 2, color: 'rgba(251,191,36,0.9)' });
        const cp = proj(C, [com[0], com[1], 0]);
        if (cp) glowDot(cp, 9, '#ffffff', 'rgba(251,191,36,0.9)');
        label3(C, [com[0], com[1], 0], t({ zh: '质心', en: 'Centroid' }), { size: 11, color: 'rgba(251,191,36,0.9)', align: 'left', dx: 12, dy: -2 });

        /* 频谱 |X(f)|：质心模长随缠绕频率的曲线 */
        if (state.showSpec) {
          const now = performance.now();
          if (now - specT > 160) { specT = now; updateSpectrum(lo, hi); }

          line3(C, [FX0, BY, 0], [FX0 + (KMAX + 0.3) * KSC, BY, 0], { width: 1.3, color: AXIS });
          arrowAt(C, [FX0 + (KMAX + 0.3) * KSC, BY, 0], [FX0 + (KMAX + 0.1) * KSC, BY, 0], AXIS);
          label3(C, [FX0 + (KMAX + 0.85) * KSC, BY, 0], 'f / f₀',
            { font: 'italic 13px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
          line3(C, [FX0, BY, 0], [FX0, BY + 1.75, 0], { width: 1, color: AXIS_DIM });
          label3(C, [FX0 + 0.04, BY + 1.9, 0], '|X(f)|',
            { font: 'italic 12px ' + FONT_MATH, color: 'rgba(159,176,200,0.8)', align: 'left' });
          for (let q = 1; q <= 8; q++) {
            const x = FX0 + q * KSC;
            line3(C, [x, BY - 0.05, 0], [x, BY + 0.05, 0], { width: 1.2, color: AXIS_DIM });
            const idx = HN.indexOf(q);
            const on = idx >= 0 && state['h' + (idx + 1)];
            label3(C, [x, BY - 0.22, 0], '' + q,
              { size: 10, color: on ? hexA(HCOL[idx], 0.95) : 'rgba(159,176,200,0.5)', align: 'center' });
          }

          if (specPts) {
            const sp = [];
            for (const p of specPts) sp.push([FX0 + p[0] * KSC, BY + p[1] * MSC, 0]);
            strokePoly(C, sp, { width: 4.5, color: 'rgba(251,191,36,0.14)' });
            strokePoly(C, sp, { width: 2, color: 'rgba(251,191,36,0.92)' });
            /* 谐波位置上的同源色点（与谐波叠加页联动） */
            for (let n = 0; n < 4; n++) {
              if (!state['h' + (n + 1)]) continue;
              const idx = Math.round(HN[n] / KSTEP);
              if (specPts[idx]) {
                solidDot(C, [FX0 + specPts[idx][0] * KSC, BY + specPts[idx][1] * MSC, 0], 3, hexA(HCOL[n], 0.95));
              }
            }
          }

          /* 当前缠绕频率标记：虚线高度 = 当前质心模长 */
          const mag = Math.hypot(com[0], com[1]), mx = FX0 + k * KSC;
          line3(C, [mx, BY, 0], [mx, BY + mag * MSC, 0], { width: 1, dash: [4, 5], color: 'rgba(251,191,36,0.5)' });
          const mp = proj(C, [mx, BY + mag * MSC, 0]);
          if (mp) glowDot(mp, 7, '#ffffff', 'rgba(251,191,36,0.85)');
        }
      }

      /* 缠绕头部（实时点，暂停时随 f 滑杆移动） */
      const a0 = k * th, hx = lv.g * Math.cos(a0), hy = -lv.g * Math.sin(a0);
      const hp = proj(C, [hx, hy, 0]);
      if (hp) glowDot(hp, 10, '#ffffff', 'rgba(186,240,255,0.9)');

      label3(C, [-1.7, 1.5, 0], 'g(t)·e^(−ikθ)',
        { font: 'italic 13px ' + FONT_MATH, color: 'rgba(226,232,240,0.85)', align: 'left' });
    },
    readout() {
      const k = state.wind, range = windRange();
      let com = [0, 0], m = 0;
      if (range) {
        const lo = range[0], hi = range[1];
        com = comAt(k, lo, hi, Math.max(1, Math.ceil((hi - lo) / 300)));
        m = Math.min(WIND_M, (samples[hi].th - samples[lo].th) / TAU);
      }
      const mag = Math.hypot(com[0], com[1]);
      return readoutHead() +
        '<div class="amC">' + t({ zh: '缠绕频率', en: 'Winding frequency' }) + ' f = <b>' + fmt(k) + '</b> × f₀ = ' + (k * state.omega / TAU).toFixed(3) + ' Hz</div>' +
        '<div class="amC">' + t({ zh: '质心', en: 'Centroid' }) + ' |X| = <b>' + fmt(mag) + '</b>&ensp;(Re ' + fmtS(com[0]) + ' · Im ' + fmtS(com[1]) + ')</div>' +
        '<div class="dim">' + t({ zh: '窗口 = 最近 ' + fmt(m, 1) + ' 个周期', en: 'Window = last ' + fmt(m, 1) + ' periods' }) + '&ensp;·&ensp;' + t({ zh: '理论峰值', en: 'Theoretical peak' }) + ' |X(nf₀)| = 2A/nπ</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录"当时的真实值"                              ║
   ║  谐波关闭时该项存 null（曲线断点），g 为当时被勾选各项之和    ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const lv = liveVals();
  samples.push({ t: state.t, th: state.theta, h: lv.h, g: lv.g });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  document.body.dataset.tab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
