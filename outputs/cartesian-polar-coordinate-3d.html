<title>直角坐标 × 极坐标 · 变换可视化</title>
<!-- ============================================================
  直角坐标 ⇄ 极坐标 变换可视化
  基于 math-viz-design-system.md 与 math-viz-starter.html 构建

  场景一「弯折变换」：把 r = f(θ) 的直角图像（θ 水平、r 竖直的带状图）
    连续"卷"成极坐标曲线。水平线弯成同心圆、竖直线收成射线、θ 轴缩成极点。
    第三维 z 存放变换进度 k 的幽灵切片（变换全景）。
  场景二「坐标换算」：点 P 沿曲线运动，同屏展示极坐标读法 (r, θ)
    与直角坐标读法 (x, y)，x = r·cosθ、y = r·sinθ。
  场景三「雅可比」：参数平面上的 dr×dθ 小矩形与 x·y 平面上的扇形细胞
    并排对照——径向边恒为 dr，切向边 r·dθ 随 r 线性变宽，
    dA = r·dr·dθ，即 |∂(x,y)/∂(r,θ)| = r 是局部面积放大率。

  版本记录（新→旧）：
    1.2.0  2026-08-09  接入金光闪（§4.7）：「弯折变换」页 k 走到 1 —— 整条 θ 轴缩成极点的
                       那一瞬全屏一闪（判据借 readout 自己的 k > 0.98 分级阈值，
                       默认 11.42 s 一次）。「坐标换算」「雅可比」两页有意不加，
                       理由写在各自场景注释里（恒等式；后者闪了会把「放大率随 r 变」讲反）。
                       Added the gold flash (§4.7): on the "Bending morph" tab, the instant
                       k reaches 1 — the whole θ axis collapsing to the pole — lights the
                       screen. The other two tabs deliberately opt out; reasons are in
                       their scene comments.
    1.1.2  2026-08-01  帧级异常兜底：单帧抛出不再杀死渲染循环
    1.1.1  2026-07-31  参数面板按页签显示：各场景声明 params，只列出对当前页签有效的滑块
    1.1.0  2026-07-12  新增「雅可比」页签：dr×dθ 参数细胞 ⇄ 扇形细胞并排对照，
                       面积热度网格直观展示 |∂(x,y)/∂(r,θ)| = r
                       Added "Jacobian" tab: paired dr×dθ parameter cell vs
                       fan cell; area-factor shading shows |∂(x,y)/∂(r,θ)| = r
    1.0.0  2026-07-11  首个版本（含双语）
============================================================ -->
<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);

.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl label sub{font-size:9px;letter-spacing:0}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn{padding:5px 9px;font-size:11.5px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 驱动控制行 */
.drive{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 2px}
.drive .dmode{display:flex;gap:4px;margin-left:auto}
.drive .dmode .btn{padding:4px 8px;font-size:11px}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
.readout b{font-weight:600;color:#e8eef7}
.readout .cR b{color:var(--trace-rose)}
.readout .cV b{color:var(--trace-violet)}
.readout .cE b{color:var(--trace-emerald)}
.readout .cA b{color:var(--angle-amber)}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  .tabs{top:52px;left:14px;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}
}
</style>

<body>

<canvas id="scene"></canvas>

<div class="brand">
  <div class="eyebrow">INTERACTIVE MATH · 交互式数学</div>
  <h1>直角坐标 × 极坐标</h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<aside class="panel" id="panel">
  <div class="panel-head"><span id="panelTitle">参数与视角</span>
    <span class="ph-right"><span class="ver" id="verBadge"></span><button class="lang" id="btnLang" title="切换语言 / Switch language">EN</button><button class="fold" id="btnFold" title="收起 / 展开">−</button></span></div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div class="row">
      <button class="btn wide" id="btnPlay">⏸ 暂停</button>
      <button class="btn" id="btnReset">↺ 重置</button>
    </div>
    <div class="views" id="presetsHost"><span class="vlabel" id="presetLabel">函数</span></div>
    <div id="driveHost"></div>
    <div id="togglesHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="tips" id="tips"></div>
  </div>

<div class="hint">拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签</div>

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'cartesian-polar-coordinate-3d',
  title: { zh: '直角坐标 × 极坐标 · 变换可视化', en: 'Cartesian × Polar · A Bending Morph' },
  h1:    { zh: '直角坐标 × 极坐标', en: 'Cartesian × Polar' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  functionGroup: { zh: '函数', en: 'Function' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  函数预设 —— 每个键就是「函数」一栏中的一个按钮               ║
   ║  f(th) 读取 state.p1 / state.p2 · thetaMax 单位为 π         ║
   ║  p1 / p2 为该预设下两根滑杆的配置（p2 可为 null → 隐藏）      ║
   ╚══════════════════════════════════════════════════════════╝ */
const DEFAULT_PRESET = 'rose';
let curPreset = DEFAULT_PRESET;

const PRESETS = {
  linear: {
    btn: { zh: '一次函数', en: 'Linear' }, formula: 'r = aθ + b',
    f: th => state.p1 * th + state.p2,
    name: () => t({ zh: '阿基米德螺线', en: 'Archimedean spiral' }),
    thetaMax: 4, negR: false,
    p1: { label: { zh: '斜率 <i>a</i>', en: 'Slope <i>a</i>' }, sym: 'a', min: 0.03, max: 0.22, step: 0.005, value: 0.12, fmt: v => fmt(v) },
    p2: { label: { zh: '截距 <i>b</i>', en: 'Intercept <i>b</i>' }, sym: 'b', min: 0, max: 0.8, step: 0.05, value: 0.15, fmt: v => fmt(v) },
    tip: { zh: '一次函数读作极坐标便是阿基米德螺线：每多转一圈（θ 增加 2π），半径恰好均匀增加 2πa。',
           en: 'Read in polar form, a linear function becomes an Archimedean spiral: every extra turn (θ up by 2π) adds exactly 2πa to the radius.' }
  },
  quad: {
    btn: { zh: '二次函数', en: 'Quadratic' }, formula: 'r = aθ²',
    f: th => state.p1 * th * th,
    name: () => t({ zh: '抛物型螺线', en: 'Parabolic spiral' }),
    thetaMax: 3, negR: false,
    p1: { label: { zh: '系数 <i>a</i>', en: 'Coefficient <i>a</i>' }, sym: 'a', min: 0.006, max: 0.05, step: 0.002, value: 0.022, fmt: v => fmt(v, 3) },
    p2: null,
    tip: { zh: '抛物线卷成螺线后圈距不再均匀——半径随 θ² 增长，越向外转扩张越快。',
           en: 'Rolled into a spiral, the parabola loses even turn spacing — the radius grows with θ², so each outward turn expands faster than the last.' }
  },
  rose: {
    btn: { zh: '玫瑰线', en: 'Rose' }, formula: 'r = A·cos(nθ)',
    f: th => state.p1 * Math.cos(state.p2 * th),
    name: () => {
      const n = Math.round(state.p2);
      if (n === 1) return t({ zh: '过极点的圆', en: 'Circle through the pole' });
      const petals = n % 2 ? n : 2 * n;
      return LANG === 'zh' ? (petals + ' 瓣玫瑰线') : (petals + '-petal rose');
    },
    thetaMax: 2, negR: true,
    p1: { label: { zh: '振幅 <i>A</i>', en: 'Amplitude <i>A</i>' }, sym: 'A', min: 0.4, max: 2, step: 0.05, value: 1.35, fmt: v => fmt(v) },
    p2: { label: { zh: '花瓣参数 <i>n</i>', en: 'Petal count <i>n</i>' }, sym: 'n', min: 1, max: 8, step: 1, value: 3, fmt: v => v.toFixed(0) },
    tip: { zh: '余弦的波峰波谷卷成花瓣：n 为奇数开 n 瓣、偶数开 2n 瓣；r<0 的波谷穿过极点开到对侧。把 n 调到 1——它竟是一个圆。',
           en: 'The peaks and troughs of cosine curl into petals: odd n opens n petals, even n opens 2n; the negative troughs pass through the pole to the opposite side. Set n to 1 — it turns out to be a circle.' }
  },
  cardioid: {
    btn: { zh: '心形线', en: 'Cardioid' }, formula: 'r = a(1 + cos θ)',
    f: th => state.p1 * (1 + Math.cos(th)),
    name: () => t({ zh: '心形线', en: 'Cardioid' }),
    thetaMax: 2, negR: false,
    p1: { label: { zh: '尺寸 <i>a</i>', en: 'Size <i>a</i>' }, sym: 'a', min: 0.3, max: 1.2, step: 0.05, value: 0.85, fmt: v => fmt(v) },
    p2: null,
    tip: { zh: 'r = a(1+cosθ) 处处非负，θ 扫过一整圈后曲线在极点处轻轻合拢，得名心形线。',
           en: 'r = a(1+cosθ) is never negative; as θ sweeps a full turn the curve pinches gently shut at the pole — hence the name cardioid.' }
  },
  circle: {
    btn: { zh: '圆', en: 'Circle' }, formula: 'r = R',
    f: () => state.p1,
    name: () => t({ zh: '圆（圆心在极点）', en: 'Circle (centered at the pole)' }),
    thetaMax: 2, negR: false,
    p1: { label: { zh: '半径 <i>R</i>', en: 'Radius <i>R</i>' }, sym: 'R', min: 0.3, max: 2.2, step: 0.05, value: 1.3, fmt: v => fmt(v) },
    p2: null,
    tip: { zh: '常数函数是最朴素的极坐标方程：到极点距离恒为 R，一条水平直线弯成等距的圆。',
           en: 'A constant function is the simplest polar equation: the distance to the pole stays R, so a horizontal line bends into a circle of equal radius everywhere.' }
  },
  conic: {
    btn: { zh: '椭圆', en: 'Ellipse' }, formula: 'r = p / (1 − e·cos θ)',
    f: th => state.p1 / (1 - state.p2 * Math.cos(th)),
    name: () => (state.p2 < 0.02 ? t({ zh: '圆（e = 0）', en: 'Circle (e = 0)' }) : t({ zh: '椭圆 · 焦点在极点', en: 'Ellipse · focus at the pole' })),
    thetaMax: 2, negR: false,
    p1: { label: { zh: '半通径 <i>p</i>', en: 'Semi-latus rectum <i>p</i>' }, sym: 'p', min: 0.25, max: 1.2, step: 0.05, value: 0.7, fmt: v => fmt(v) },
    p2: { label: { zh: '离心率 <i>e</i>', en: 'Eccentricity <i>e</i>' }, sym: 'e', min: 0, max: 0.9, step: 0.05, value: 0.55, fmt: v => fmt(v) },
    tip: { zh: '椭圆的极坐标方程把极点放在焦点上——开普勒描述行星轨道用的正是它。把 e 拖向 0.9，椭圆被急剧拉长。',
           en: 'The polar equation of an ellipse places the pole at a focus — the very form Kepler used to describe planetary orbits. Drag e toward 0.9 and the ellipse stretches dramatically.' }
  }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆（p1 / p2 由预设动态重配置）      ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'morphK', label: { zh: '变换进度 <i>k</i>', en: 'Morph progress <i>k</i>' }, min: 0, max: 1, step: 0.002, value: 0, fmt: v => fmt(v) },

    value: PRESETS[DEFAULT_PRESET].thetaMax, fmt: v => fmt(v) + ' π' },

/* ================= 常量与状态 ================= */
const TAU = Math.PI * 2;
const NEAR = 0.15;        // 近裁剪面
const XSPAN = 3.8;        // 直角形态下 θ 轴带宽（世界单位）
const ZSPAN = 5.5;        // 变换全景切片的纵深
const CLIP = 2.6;         // |r| 超过此值时断线（设计规范 §6）

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0, kPhase: 0 };  // 参数键与开关键自动注入
const samples = [];
let curTab = null;
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const paramRefs = {};
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 变换核心 =================
   把直角图像上的点 (θ, r) 连续弯折到极坐标位置：
   · k = 0：世界坐标 (Sθ·θ + x0, r)，即带状直角图像
   · k = 1：世界坐标 (r·cosθ, −r·sinθ)，与教科书极坐标图形一致
             （所有内置预设均为 θ 的偶函数，最终点集与标准图完全相同）
   · 中间态：θ 轴弯成曲率中心位于下方的圆弧，同时整体旋转 −kπ/2
   r < 0 的部分在弯折后穿过极点出现在反方向——这正是极坐标的负半径规则 */
function morphPoint(th, r, k, S, z) {
  const x0 = -XSPAN / 2 * (1 - k);
  if (k < 1e-4) return [S * th + x0, r, z || 0];
  const d = S * (1 - k) / k;
  const R = d + r;
  const a = k * th;
  const u = R * Math.sin(a);
  const v = R * Math.cos(a) - d;
  const rho = -k * Math.PI / 2;
  const c = Math.cos(rho), s = Math.sin(rho);
  return [c * u - s * v + x0, s * u + c * v, z || 0];
}

function curF(th) { return PRESETS[curPreset].f(th); }
function curThetaMax() { return state.thetaMax * Math.PI; }
function curScale() { return XSPAN / curThetaMax(); }
function curRMin() { return PRESETS[curPreset].negR ? -2 : 0; }

/* 场景二的当前运动点（θ 折回定义域内） */
function pointNow() {
  const tm = curThetaMaxSafe();
  let a = state.theta % tm;
  if (a < 0) a += tm;
  const r = curF(a);
  return { th: a, r: r, x: r * Math.cos(a), y: r * Math.sin(a) };
}
function curThetaMaxSafe() { const tm = curThetaMax(); return tm > 1e-6 ? tm : TAU; }

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录"当时的真实值"，参数中途改变时历史不重算       ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const p = pointNow();
  samples.push({ t: state.t, x: p.x, y: p.y });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  if (Math.hypot(t[0]-b[0], t[1]-b[1]) < 1.5) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 直角 x·y 坐标轴（场景二用）：o = { ex, ey, yTicks:[], xTicks:[] } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* ================= 场景一：弯折变换的绘制部件 ================= */

/* 当前曲线在变换进度 k 下的采样折线（|r|>CLIP 处断线） */
function buildCurvePts(k, S, tm, z) {
  const N = 320;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const th = tm * i / N;
    const r = curF(th);
    if (!isFinite(r) || Math.abs(r) > CLIP) { pts.push(null); continue; }
    pts.push(morphPoint(th, r, k, S, z));
  }
  return pts;
}

/* 变形网格：水平线 r = c 弯成同心圆，竖直线 θ = c 保持直线收成射线 */
function drawMorphGrid(C, k, S, tm, rMin) {
  const gcol = 'rgba(148,163,184,0.10)';
  for (const r of [-2, -1.5, -1, -0.5, 0.5, 1.5, 2]) {
    if (r < rMin - 1e-9 || r > 2.001) continue;
    const pts = [];
    for (let j = 0; j <= 64; j++) pts.push(morphPoint(tm * j / 64, r, k, S, 0));
    strokePoly(C, pts, { width: 1, color: gcol });
  }
  const stepT = Math.PI / 4;
  for (let i = 1; i * stepT <= tm + 1e-6; i++) {
    const th = i * stepT;
    line3(C, morphPoint(th, rMin, k, S, 0), morphPoint(th, 2, k, S, 0),
      { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* r = 1 基准线（琥珀虚线）：直线弯成单位圆 */
function drawRef1(C, k, S, tm) {
  const pts = [];
  for (let j = 0; j <= 64; j++) pts.push(morphPoint(tm * j / 64, 1, k, S, 0));
  strokePoly(C, pts, { width: 1.2, dash: [5, 6], color: 'rgba(251,191,36,0.75)' });
  label3(C, morphPoint(tm * 0.52, 1, k, S, 0), 'r = 1',
    { font: 'italic 11px ' + FONT_MATH, color: 'rgba(251,191,36,.9)', align: 'center', dy: -10 });
}

/* 变形中的 θ 轴与 r 轴；θ 轴随 k→1 收缩为极点 */
function drawMorphAxes(C, k, S, tm, rMin) {
  /* θ 轴（r = 0 的整条水平线，弯折后缩向极点） */
  const axPts = [];
  const tEnd = tm + 0.3;
  for (let j = 0; j <= 64; j++) axPts.push(morphPoint(tEnd * j / 64, 0, k, S, 0));
  strokePoly(C, axPts, { width: 1.4, color: AXIS });
  const fade = clamp(1 - k * 1.12, 0, 1);
  if (fade > 0.04) {
    const col = 'rgba(159,176,200,' + fmt(0.9 * fade) + ')';
    arrowAt(C, morphPoint(tEnd, 0, k, S, 0), morphPoint(tEnd - 0.12, 0, k, S, 0), col);
    label3(C, morphPoint(tEnd + 0.32, 0, k, S, 0), 'θ',
      { font: 'italic 15px ' + FONT_MATH, color: 'rgba(196,210,230,' + fmt(fade) + ')', align: 'center' });
  }
  /* r 轴（θ = 0 的竖直线，弯折后成为极轴，沿 +x 方向） */
  line3(C, morphPoint(0, Math.min(rMin, 0) - 0.15, k, S, 0), morphPoint(0, 2.3, k, S, 0),
    { width: 1.4, color: AXIS });
  arrowAt(C, morphPoint(0, 2.3, k, S, 0), morphPoint(0, 2.18, k, S, 0), AXIS);
  label3(C, morphPoint(0, 2.52, k, S, 0), 'r',
    { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  /* r 轴刻度 1、2 */
  const dth = 0.045 / S;
  for (const rv of [1, 2]) {
    line3(C, morphPoint(-dth, rv, k, S, 0), morphPoint(dth, rv, k, S, 0), { width: 1.2, color: AXIS_DIM });
    label3(C, morphPoint(-dth * 3.2, rv, k, S, 0), String(rv),
      { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
  /* 极点浮现 */
  const pf = clamp((k - 0.55) / 0.45, 0, 1);
  if (pf > 0.03) {
    solidDot(C, [0, 0, 0], 2.2, 'rgba(251,191,36,' + fmt(0.9 * pf) + ')');
    label3(C, [0, 0, 0], t({ zh: '极点 O', en: 'Pole O' }), { size: 10.5, color: 'rgba(251,191,36,' + fmt(0.85 * pf) + ')', dx: 9, dy: 12 });
  }
}

/* 变换全景：k = 0…1 的幽灵切片沿 z 排开（紫），并附各自的 θ 轴弧 */
function drawGhosts(C, S, tm) {
  for (let i = 0; i <= 8; i++) {
    const k = i / 8;
    const z = (1 - k) * ZSPAN;
    const ax = [];
    for (let j = 0; j <= 48; j++) ax.push(morphPoint(tm * j / 48, 0, k, S, z));
    strokePoly(C, ax, { width: 1, color: 'rgba(148,163,184,0.14)' });
    strokePoly(C, buildCurvePts(k, S, tm, z),
      { width: 1.6, color: 'rgba(167,139,250,' + fmt(0.10 + 0.10 * k) + ')' });
  }
  label3(C, [0, 2.55, ZSPAN], 'k = 0 · ' + t({ zh: '直角坐标形态', en: 'Cartesian form' }), { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });
  label3(C, [2.1, -2.45, 0], 'k = 1 · ' + t({ zh: '极坐标形态', en: 'Polar form' }), { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });
}

/* 点的迁移线（翠）：固定 θ 的曲线点在整个变换中的三维轨迹 */
function drawThreads(C, S, tm) {
  for (let j = 0; j < 10; j++) {
    const th = (j + 0.5) / 10 * tm;
    const r = curF(th);
    if (!isFinite(r) || Math.abs(r) > CLIP) continue;
    const pts = [];
    for (let m = 0; m <= 36; m++) {
      const k = m / 36;
      pts.push(morphPoint(th, r, k, S, (1 - k) * ZSPAN));
    }
    strokePoly(C, pts, { width: 1.3, color: 'rgba(52,211,153,0.38)' });
  }
}

/* ================= 场景二：坐标换算的绘制部件 ================= */

/* 极坐标网格：同心圆 + 每 π/6 一条射线 */
function drawPolarGrid(C) {
  for (const r of [0.5, 1, 1.5, 2]) {
    const pts = [];
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * TAU;
      pts.push([r * Math.cos(a), r * Math.sin(a), 0]);
    }
    strokePoly(C, pts, { width: 1, color: 'rgba(148,163,184,' + (r === 1 ? '0.13' : '0.08') + ')' });
  }
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    line3(C, [0.14 * Math.cos(a), 0.14 * Math.sin(a), 0],
             [2.2 * Math.cos(a), 2.2 * Math.sin(a), 0],
             { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 角度弧（琥珀）：θ 可超过 2π，弧半径随角度缓慢外扩成小螺旋 */
function drawThetaArc(C, a1) {
  if (a1 < 0.05) return;
  const n = Math.min(500, Math.max(2, Math.ceil(a1 / 0.05)));
  const pts = [];
  for (let j = 0; j <= n; j++) {
    const a = a1 * j / n;
    const rad = 0.3 + 0.045 * a;
    pts.push([rad * Math.cos(a), rad * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  arrowAt(C, pts[pts.length - 1], pts[pts.length - 2], 'rgba(251,191,36,0.9)');
  const radL = 0.3 + 0.045 * a1 + 0.2;
  label3(C, [radL * Math.cos(a1 * 0.82), radL * Math.sin(a1 * 0.82), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* ================= 场景三：雅可比的绘制部件 =================
   左侧：参数平面 (θ, r) 的平铺矩形（θ 水平、r 竖直）；
   右侧：x·y 平面的极坐标网格。同一个 dr×dθ 细胞在两边同时高亮——
   参数矩形永远一样大，扇形细胞的切向边 r·dθ 却随 r 线性变宽，
   面积恰为 r·dr·dθ：雅可比 |∂(x,y)/∂(r,θ)| = r 就是局部面积放大率。 */
const JAC = {
  PX0: -6.4,          // 参数平面左缘（世界 x）
  PY0: -1,            // 参数平面 r=0 基线（世界 y）
  S: 3.4 / TAU,       // θ → 世界 x 的显示比例
  DR: 0.4,            // 细胞径向尺寸 dr
  DTH: Math.PI / 8,   // 细胞角向尺寸 dθ
  RMAX: 2             // 网格最大半径
};

function jacParamPt(th, r) { return [JAC.PX0 + JAC.S * th, JAC.PY0 + r, 0]; }
function jacPolarPt(th, r) { return [r * Math.cos(th), r * Math.sin(th), 0]; }

/* 细胞当前位置：「细胞巡游」开启时由共享时钟沿螺旋扫描（θ 匀速转、r 缓慢进出），
   关闭时由 r₀ / θ₀ 滑杆摆放 */
function jacCellNow() {
  if (state.showCruise) {
    return { th0: mod2pi(state.theta), r0: 0.2 + 0.7 * (1 - Math.cos(state.theta / 3.3)) };
  }
  return { th0: state.cellTh, r0: state.cellR };
}

/* 凸小多边形填充（任一顶点被近裁剪则整体跳过——细胞尺度下可接受） */
function fillPoly3(C, pts, style) {
  const sp = [];
  for (const p of pts) {
    const s = proj(C, p);
    if (!s) return;
    sp.push(s);
  }
  ctx.save();
  ctx.fillStyle = style;
  ctx.beginPath();
  ctx.moveTo(sp[0][0], sp[0][1]);
  for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i][0], sp[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* 细胞多边形（内弧 → 外弧回程；mapFn = jacParamPt / jacPolarPt） */
function jacCellPoly(mapFn, th0, r0) {
  const n = 6, pts = [];
  for (let i = 0; i <= n; i++) pts.push(mapFn(th0 + JAC.DTH * i / n, r0));
  for (let i = 0; i <= n; i++) pts.push(mapFn(th0 + JAC.DTH * (1 - i / n), r0 + JAC.DR));
  return pts;
}

/* 面积热度：两侧网格逐格填色，透明度 ∝ 该格的面积放大率 r̄（橙） */
function jacShadePanels(C) {
  const dth = Math.PI / 6;
  for (let j = 0; j < 4; j++) {
    const r1 = j * 0.5, rm = r1 + 0.25;
    const col = 'rgba(251,146,60,' + fmt(0.05 + 0.075 * rm, 3) + ')';
    for (let i = 0; i < 12; i++) {
      const t1 = i * dth;
      fillPoly3(C, [jacParamPt(t1, r1), jacParamPt(t1 + dth, r1),
                    jacParamPt(t1 + dth, r1 + 0.5), jacParamPt(t1, r1 + 0.5)], col);
      const pts = [];
      for (let m = 0; m <= 4; m++) pts.push(jacPolarPt(t1 + dth * m / 4, r1));
      for (let m = 0; m <= 4; m++) pts.push(jacPolarPt(t1 + dth * (1 - m / 4), r1 + 0.5));
      fillPoly3(C, pts, col);
    }
  }
}

/* 参数平面网格（与极坐标网格同规格：Δθ = π/6、Δr = 0.5） */
function jacParamGrid(C) {
  for (let i = 0; i <= 12; i++) {
    const th = i * Math.PI / 6;
    line3(C, jacParamPt(th, 0), jacParamPt(th, JAC.RMAX), { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
  for (let j = 1; j <= 4; j++) {
    const r = j * 0.5;
    line3(C, jacParamPt(0, r), jacParamPt(TAU, r), { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
}

/* 参数平面坐标轴（θ 水平、r 竖直）与标题 */
function drawJacParamAxes(C) {
  const X0 = JAC.PX0, Y0 = JAC.PY0, xEnd = X0 + JAC.S * TAU + 0.4;
  line3(C, [X0 - 0.15, Y0, 0], [xEnd, Y0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [xEnd, Y0, 0], [xEnd - 0.2, Y0, 0], AXIS);
  label3(C, [xEnd + 0.28, Y0, 0], 'θ', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [X0, Y0 - 0.15, 0], [X0, Y0 + 2.3, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [X0, Y0 + 2.3, 0], [X0, Y0 + 2.15, 0], AXIS);
  label3(C, [X0, Y0 + 2.52, 0], 'r', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const tk of [[Math.PI, 'π'], [TAU, '2π']]) {
    line3(C, [X0 + JAC.S * tk[0], Y0 - 0.05, 0], [X0 + JAC.S * tk[0], Y0 + 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [X0 + JAC.S * tk[0], Y0 - 0.24, 0], tk[1],
      { font: 'italic 10px ' + FONT_MATH, color: 'rgba(159,176,200,.7)', align: 'center' });
  }
  for (const rv of [1, 2]) {
    line3(C, [X0 - 0.05, Y0 + rv, 0], [X0 + 0.05, Y0 + rv, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [X0 - 0.13, Y0 + rv, 0], String(rv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
  label3(C, [X0 + JAC.S * Math.PI, Y0 + 2.75, 0], t({ zh: '参数平面 (θ, r)', en: 'Parameter plane (θ, r)' }),
    { size: 11, color: 'rgba(159,176,200,.8)', align: 'center' });
}

/* 配对连线（玫红，与细胞同色）：细胞四角从参数矩形跃迁到扇形细胞，弧线穿出 z 维 */
function jacThreads(C, th0, r0) {
  const corners = [[th0, r0], [th0 + JAC.DTH, r0], [th0 + JAC.DTH, r0 + JAC.DR], [th0, r0 + JAC.DR]];
  for (const c of corners) {
    const A = jacParamPt(c[0], c[1]), B = jacPolarPt(c[0], c[1]);
    const pts = [];
    for (let i = 0; i <= 14; i++) {
      const s = i / 14;
      pts.push([A[0] + (B[0] - A[0]) * s, A[1] + (B[1] - A[1]) * s, Math.sin(s * Math.PI) * 1.15]);
    }
    strokePoly(C, pts, { width: 1.1, color: 'rgba(251,113,133,0.30)' });
  }
}

/* θ₀ 角度弧（琥珀度量） */
function jacThetaArc(C, th0) {
  if (th0 < 0.06) return;
  const n = Math.max(2, Math.ceil(th0 / 0.07));
  const pts = [];
  for (let j = 0; j <= n; j++) {
    const a = th0 * j / n;
    pts.push([0.34 * Math.cos(a), 0.34 * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  arrowAt(C, pts[n], pts[n - 1], 'rgba(251,191,36,0.9)');
  label3(C, [0.56 * Math.cos(th0 * 0.6), 0.56 * Math.sin(th0 * 0.6), 0], 'θ₀',
    { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 径向边 dr（紫）：从细胞内角沿 r 方向 */
function jacEdgeR(C, mapFn, th0, r0) {
  const a = mapFn(th0, r0), b = mapFn(th0, r0 + JAC.DR);
  line3(C, a, b, { width: 2.2, color: 'rgba(167,139,250,0.95)' });
  arrowAt(C, b, a, 'rgba(167,139,250,0.95)');
}

/* 切向边（翠）：参数侧长 dθ 恒定，极坐标侧弧长 r·dθ 随 r 变宽 */
function jacEdgeT(C, mapFn, th0, r0) {
  const n = 8, pts = [];
  for (let i = 0; i <= n; i++) pts.push(mapFn(th0 + JAC.DTH * i / n, r0));
  strokePoly(C, pts, { width: 2.2, color: 'rgba(52,211,153,0.95)' });
  arrowAt(C, pts[n], pts[n - 1], 'rgba(52,211,153,0.95)');
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册                                                ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 场景一：弯折变换 ────── */
  morph: {
    label: { zh: '弯折变换', en: 'Bending morph' },
    /* speed 经引擎时钟（state.theta / state.kPhase）驱动本场景，场景体内不出现 state.speed —— 勿据 grep 判定无用而删 */
    params: ['morphK', 'p1', 'p2', 'thetaMax', 'speed'],
    /* 无 drive：本页已由引擎时钟驱动，不是静止页签。frame() 每帧执行
       state.kPhase += speed·0.55·dt; state.morphK = 0.5 − 0.5cos(kPhase)，
       而 morphK 就是本页的被演示量「变换进度 k」——它在 0 ⇄ 1 之间往复（端点因余弦自然减速），
       读数随之在「直角坐标形态 → 弯折中 → 极坐标形态」之间切换，速度由 speed 滑杆控制，

       容易把这一页误判为静止，故在此留痕。 */
    brand: { zh: '同一个函数 r = f(θ)：按直角坐标读，是熟悉的函数图像；按极坐标读，则是螺线、玫瑰线与椭圆。拖动进度 k，看整张平面如何弯折。',
             en: 'The same function r = f(θ): read as Cartesian, it is a familiar function graph; read as polar, it becomes a spiral, a rose, or an ellipse. Drag progress k to watch the whole plane bend.' },
    tipsBase: { zh: '提示：拖动「变换进度 k」或按空格自动演示——水平线 r=c 弯成同心圆，竖直线 θ=c 收成射线，整条 θ 轴缩成极点。',
                en: 'Tip: drag "morph progress k" or press space to auto-demo — horizontal lines r=c bend into concentric circles, vertical lines θ=c collapse into rays, and the whole θ axis shrinks to the pole.' },
    tips: '',
    views: {
      iso:   { label: { zh: '立体',      en: '3D' },       az: -0.8,  el: 0.30, dist: 11,  tx: 0, ty: 0.1,  tz: 1.8 },
      front: { label: { zh: '正视 x·y',  en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 7.6, tx: 0, ty: 0.15, tz: 0 },
      pano:  { label: { zh: '纵览 全景', en: 'Overview' },  az: -1.25, el: 0.33, dist: 13,  tx: 0, ty: 0.1,  tz: 2.6,
        onSelect() { setToggle('showGhost', true); setToggle('showThreads', true); } }
    },
    toggles: [
      { key: 'showCurve',   label: { zh: '函数曲线',        en: 'Function curve' },       color: '#fb7185', checked: true },
      { key: 'showGhost',   label: { zh: '变换全景（切片）', en: 'Morph panorama (slices)' }, color: '#a78bfa', checked: true },
      { key: 'showThreads', label: { zh: '点的迁移线',      en: 'Migration threads' },    color: '#34d399', checked: false },
      { key: 'showRef1',    label: { zh: 'r = 1 基准线',    en: 'r = 1 reference' },      color: '#fbbf24', checked: true },
      { key: 'showGrid',    label: { zh: '网格',            en: 'Grid' },                 color: '#64748b', checked: true }
    ],
    sampleWindow: () => 0.6,
    draw(C) {
      const P = PRESETS[curPreset];
      const k = state.morphK;
      const tm = curThetaMax();
      const S = curScale();
      const rMin = curRMin();

      if (state.showGhost) drawGhosts(C, S, tm);
      if (state.showThreads) drawThreads(C, S, tm);
      if (state.showGrid) drawMorphGrid(C, k, S, tm, rMin);
      if (state.showRef1) drawRef1(C, k, S, tm);
      drawMorphAxes(C, k, S, tm, rMin);

      if (state.showCurve) {
        const pts = buildCurvePts(k, S, tm, 0);
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, pts, { width: 2.2, color: 'rgba(251,113,133,0.95)' });
        const rEnd = curF(tm);
        if (isFinite(rEnd) && Math.abs(rEnd) <= CLIP) {
          const sp = proj(C, morphPoint(tm, rEnd, k, S, 0));
          if (sp) glowDot(sp, 9, '#ffffff', 'rgba(251,113,133,0.85)');
        }
        label3(C, [-2.6, 2.5, 0], P.formula,
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
        label3(C, [-2.6, 2.22, 0], P.name(),
          { size: 11, color: 'rgba(159,176,200,.8)', align: 'left' });
      }
      /* 金光闪（§4.7）：弯折进度 k 走到 1 —— 整张带状图卷成极坐标平面，
         那条水平的 θ 轴在这一刻收成一个点（tips 的最后半句：「整条 θ 轴缩成极点」）。
         这不是「动画播完了」：k = 1 是数学上被挑出来的那个值 —— morphPoint 在 k = 1 处
         退化成 (x, y) = (r·cosθ, −r·sinθ)，即极坐标本身；把它换成 0.9 或 1.1，
         这一页的结论就跟着变（不再是极坐标）。k 的两端都是有名字的坐标系，
         只闪极坐标端，是因为直角端是出发点不是到达。
         判据 state.morphK > 0.98 **一字不改**借 readout 自己的分级阈值
         （k > 0.98 印「极坐标形态」）—— 屏幕上文字翻成「极坐标形态」的同一瞬间闪，
         不另立一个只有代码知道的窗口。
         窗口宽度：k > 0.98 ⟺ |kPhase − π| < acos(0.96) = 0.284 rad，
         kPhase 每秒走 speed·0.55 = 0.55 rad ⇒ 持续 1.03 s ≈ 62 帧，远宽于一帧；
         speed 拉满 2.4 时仍有 0.24 s ≈ 14 帧。
         实测（默认参数、确定性推帧 60 s）：**5 次**，首次 t = 5.20 s
         （k = 0.9803，kPhase = 2.860 ≈ π − 0.282），此后每 11.42 s 一次
         —— kPhase 走满 2π 才回到极坐标端，即 2π/0.55 = 11.42 s。frameErrors 空。
         锚点 [0, 0, 0]：k = 1 时 morphPoint 把极点送到世界原点（x0 = 0、d = 0），
         那正是 θ 轴缩成的那个点，也是这一闪要人看的地方。命中瞬间 k = 0.98 而非 1，
         极点被 x0 = −XSPAN/2·(1−k) 推开 0.038 世界单位 —— 在 dist ≈ 7.6…13 的取景下
         不到一个像素，不值得为它算一遍精确极点。
         已知代价：manualK() 会在用户拖 k 滑杆时把 state.running 置 false，
         而这一闪的衰减走 state.t（§4.7 硬规矩 3：暂停即冻结）。所以若正闪着的时候
         去拖 k，画面会停在闪的中途不再回落，直到按空格续播。这是既有语义的正确表现，
         不是 bug —— 不为它改引擎。 */
      goldHit('morph', state.morphK > 0.98);
      drawGoldFlash(C, [0, 0, 0]);
    },
    readout() {
      const P = PRESETS[curPreset];
      const k = state.morphK;
      const stage = k < 0.02 ? t({ zh: '直角坐标形态', en: 'Cartesian form' })
                  : k > 0.98 ? t({ zh: '极坐标形态', en: 'Polar form' })
                  : t({ zh: '弯折中', en: 'Morphing' });
      const parts = [];
      if (P.p1) parts.push(P.p1.sym + ' = ' + paramRefs.p1.cfg.fmt(state.p1));
      if (P.p2) parts.push(P.p2.sym + ' = ' + paramRefs.p2.cfg.fmt(state.p2));
      parts.push('θ ∈ [0, ' + fmt(state.thetaMax) + 'π]');
      return '<div>' + t({ zh: '变换进度 k = ', en: 'Morph progress k = ' }) + '<b>' + fmt(k) + '</b>&ensp;·&ensp;' + stage + '</div>' +
        '<div class="cR">' + P.formula + '&ensp;·&ensp;<b>' + P.name() + '</b></div>' +
        '<div class="dim">' + parts.join(' · ') + '</div>' +
        '<div class="dim">t = ' + fmt(state.t) + ' s · k: 0 ' + t({ zh: '直角', en: 'Cartesian' }) + ' ⇄ 1 ' + t({ zh: '极坐标', en: 'polar' }) + '</div>';
    }
  },

  /* ────── 场景二：坐标换算 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 属「恒等式」。本页画的是同一个点的两套读数：
     白色半径 + θ 弧给出 (r, θ)，紫、翠两段虚线给出 (x, y)，readout 第三行印正算
     x = r·cosθ / y = r·sinθ，第四行印反算 √(x²+y²) 与 atan2(y, x)。这两组数字
     **每一帧都对得上** —— 它们是同一个 pointNow() 里的同一对 (x, y) 换个写法印两遍，
     没有哪一刻它们「终于」相等。换算公式的正确性不是运动的终点，是运动的前提。
     唯一像「到达」的候选是点穿过极点（r = 0）与掠过坐标轴（x = 0 或 y = 0），
     但那是过零，不是到达，而且频率过密：默认预设 rose（A = 1.35, n = 3, θ ∈ [0, 2π]），
     θ 以 speed·0.75 = 0.75 rad/s 走完一圈需 2π/0.75 = 8.38 s，其间 cos(3θ) = 0
     出现 6 次 ⇒ **每 1.40 s 一次**；把 n 拨到上限 8 则一圈 16 次 ⇒ 0.52 s 一次。
     §4.7 的频闪线是「每一两秒真一次」，默认档就已经压在线上，n 一拨就穿过去。 */
  convert: {
    label: { zh: '坐标换算', en: 'Coordinate conversion' },
    /* speed 经引擎时钟（state.theta / state.kPhase）驱动本场景，场景体内不出现 state.speed —— 勿据 grep 判定无用而删 */
    params: ['p1', 'p2', 'thetaMax', 'speed'],
    brand: { zh: '同一个点的两套坐标：(x, y) 用两段垂直投影定位，(r, θ) 用一段距离和一个角度定位。换算桥梁：x = r·cosθ，y = r·sinθ。',
             en: 'Two coordinate systems for the same point: (x, y) locates it with two perpendicular projections, (r, θ) with one distance and one angle. The bridge between them: x = r·cosθ, y = r·sinθ.' },
    tips: { zh: '提示：同一个点，直角坐标用 (x, y) 两段投影描述，极坐标用 (r, θ) 一段距离一个角度描述。反向换算 r = √(x²+y²)，θ 由 atan2(y, x) 按象限确定。',
            en: 'Tip: the same point is described by (x, y) as two projections in Cartesian, and by (r, θ) as one distance and one angle in polar. To convert back, r = √(x²+y²), and θ is fixed by atan2(y, x) according to the quadrant.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },       az: -0.55, el: 0.38, dist: 8.2, tx: 0, ty: 0, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 6.4, tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 'showCurve', label: { zh: '函数曲线',   en: 'Function curve' }, color: '#fb7185', checked: true },
      { key: 'showPolar', label: { zh: 'r 与 θ',     en: 'r and θ' },        color: '#fbbf24', checked: true },
      { key: 'showXProj', label: { zh: 'x 投影',     en: 'x projection' },   color: '#a78bfa', checked: true },
      { key: 'showYProj', label: { zh: 'y 投影',     en: 'y projection' },   color: '#34d399', checked: true },
      { key: 'showTrail', label: { zh: '运动轨迹',   en: 'Trail' },          color: '#e2e8f0', checked: true },
      { key: 'showGrid',  label: { zh: '极坐标网格', en: 'Polar grid' },     color: '#64748b', checked: true }
    ],
    sampleWindow: () => 7,
    draw(C) {
      const tm = curThetaMaxSafe();

      if (state.showGrid) drawPolarGrid(C);
      drawAxes(C, { ex: 2.45, ey: 2.35, xTicks: [1, 2], yTicks: [1, 2] });

      /* 曲线（标准极坐标绘制） */
      if (state.showCurve) {
        const pts = [];
        for (let i = 0; i <= 360; i++) {
          const th = tm * i / 360;
          const r = curF(th);
          if (!isFinite(r) || Math.abs(r) > CLIP) { pts.push(null); continue; }
          pts.push([r * Math.cos(th), r * Math.sin(th), 0]);
        }
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.12)' });
        strokePoly(C, pts, { width: 2, color: 'rgba(251,113,133,0.9)' });
      }

      /* 运动轨迹（由新到旧渐隐；θ 折返处断线） */
      if (state.showTrail && samples.length > 1) {
        const pts = [];
        let prev = null;
        for (let i = samples.length - 1; i >= 0; i--) {
          const sm = samples[i];
          if (prev && Math.hypot(sm.x - prev.x, sm.y - prev.y) > 0.9) pts.push(null);
          pts.push([sm.x, sm.y, 0]);
          prev = sm;
        }
        strokePoly(C, pts, { width: 1.6, fade: ['rgba(226,232,240,.85)', 'rgba(226,232,240,0)'] });
      }

      const pn = pointNow();
      const rr = Math.hypot(pn.x, pn.y);
      let dx = pn.x, dy = pn.y;
      if (rr > CLIP) { dx *= CLIP / rr; dy *= CLIP / rr; }

      /* 极坐标读法：半径 + 角度弧 */
      if (state.showPolar) {
        line3(C, [0, 0, 0], [dx, dy, 0], { width: 2, color: 'rgba(241,245,249,0.92)' });

      /* x 投影（紫） */
      if (state.showXProj) {
        line3(C, [dx, dy, 0], [dx, 0, 0], { width: 1.5, dash: [7, 7], color: 'rgba(167,139,250,0.8)' });
        const fx = proj(C, [dx, 0, 0]);
        if (fx) glowDot(fx, 8, '#ffffff', 'rgba(167,139,250,0.85)');

        { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'left' });
    },
    readout() {
      const pn = pointNow();
      const deg = (pn.th * 180 / Math.PI).toFixed(0);
      let degBack = Math.atan2(pn.y, pn.x) * 180 / Math.PI;
      if (degBack < 0) degBack += 360;
      const negNote = pn.r < 0 ? (' · ' + t({ zh: 'r<0：点位于 θ+π 方向', en: 'r<0: point lies along θ+π' })) : '';
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = <b>' + fmt(pn.th) + '</b> rad ≡ ' + deg + '°</div>' +

  /* ────── 场景三：雅可比 ────── */

      }

      label3(C, [1.15, 2.95, 0], 'dA = r · dr · dθ',
        { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      label3(C, [1.15, 2.67, 0], '|∂(x,y)/∂(r,θ)| = r',

    },
    readout() {

    }

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  state.kPhase = 0;
  state.morphK = 0;
  syncKSlider();
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

/* 播放时 k 由余弦相位往复驱动（端点自然减速）；手动拖 k 时自动暂停并反解相位续播 */
function syncKSlider() {
  const ref = paramRefs.morphK;
  if (!ref) return;
  ref.input.value = state.morphK;
  ref.val.textContent = ref.cfg.fmt(state.morphK);
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.speed * 0.75 * dt;
      state.kPhase += state.speed * 0.55 * dt;
      state.morphK = 0.5 - 0.5 * Math.cos(state.kPhase);
      syncKSlider();
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { if (curTab) roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成 ================= */
const RELABEL = [];
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const ref = { cfg: p, wrap: wrap, labelEl: wrap.querySelector('label'), input: input, val: val };
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    ref.render = () => { val.textContent = ref.cfg.fmt(parseFloat(input.value)); };
    ref.upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = ref.cfg.map ? ref.cfg.map(raw) : raw;
      ref.render();
    };
    input.addEventListener('input', () => {
      ref.upd();
      if (p.key === 'morphK') manualK();
      updateReadout();
    });
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramRefs[p.key] = ref;
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    ref.relabel = () => { ref.labelEl.innerHTML = t(ref.cfg.label); ref.render(); };
    RELABEL.push(ref.relabel);
    ref.relabel();
    ref.upd();
  });
}

/* 用户手动拖动 k：暂停演示，并把余弦相位对齐到当前 k，续播无跳变 */
function manualK() {
  if (state.running) {
    state.running = false;
    btnPlay.textContent = t(UI.resume);
  }
  state.kPhase = Math.acos(clamp(1 - 2 * state.morphK, -1, 1));
}

/* 按预设动态重配置 p1 / p2 滑杆（p2 缺省则隐藏该行）；label 双语，随语言切换重渲染 */
function configParam(key, cfg) {
  const ref = paramRefs[key];
  ref.suppressed = !cfg;   // 预设无此参数：与页签可见性取交集
  /* 显隐一律交给 syncParamVisibility()：预设按钮不分页签，若在此直接写 display
     会绕过当前页签的 params 声明，把该页签用不到的滑杆重新放出来。 */
  if (!cfg) { syncParamVisibility(); return; }
  ref.cfg = Object.assign({}, ref.cfg, cfg);
  ref.relabel();
  ref.input.min = cfg.min;
  ref.input.max = cfg.max;
  ref.input.step = cfg.step;
  ref.input.value = cfg.value;
  ref.upd();
  syncParamVisibility();
}
function setParamValue(key, v) {
  const ref = paramRefs[key];
  ref.input.value = v;
  ref.upd();
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}
function setToggle(key, v) {
  state[key] = v;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = v; });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildPresets() {
  const host = document.getElementById('presetsHost');
  Object.keys(PRESETS).forEach(id => {
    const b = document.createElement('button');
    b.className = 'btn vbtn pbtn';
    b.dataset.preset = id;
    b.addEventListener('click', () => applyPreset(id));
    host.appendChild(b);
    const relabel = () => { b.textContent = t(PRESETS[id].btn); };
    RELABEL.push(relabel);
    relabel();
  });
}

function applyPreset(id) {
  curPreset = id;
  document.querySelectorAll('.pbtn').forEach(b => b.classList.toggle('active', b.dataset.preset === id));
  const P = PRESETS[id];
  configParam('p1', P.p1);
  configParam('p2', P.p2);
  setParamValue('thetaMax', P.thetaMax);
  refreshTips();
  updateReadout();
}

function refreshTips() {
  if (!curTab) return;
  if (curTab === 'morph') {
    tipsEl.textContent = t(SCENES.morph.tipsBase) + ' ' + t(PRESETS[curPreset].tip);
  } else {
    tipsEl.textContent = t(SCENES[curTab].tips);
  }
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn:not(.pbtn)').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。
   本工具复用既有的 paramRefs 登记表（与 starter 的 paramWraps 等价），并尊重
   configParam() 在预设无 p2 时打的 suppressed 标记——两个条件取交集。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramRefs).forEach(k => {
    const inScene = !list || list.indexOf(k) >= 0;
    paramRefs[k].wrap.style.display = (inScene && !paramRefs[k].suppressed) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramRefs[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.cfg.map && !e.cfg.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.cfg.map && e.cfg.invMap) ? e.cfg.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.cfg.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  refreshTips();
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.getElementById('presetLabel').textContent = t(UI.functionGroup);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  refreshTips();
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
buildPresets();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyPreset(DEFAULT_PRESET);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
