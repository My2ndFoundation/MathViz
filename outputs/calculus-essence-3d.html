<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;

.ph-right{display:flex;align-items:center;gap:7px}

    <span class="ph-right"><span class="ver" id="verBadge"></span><button class="lang" id="btnLang" title="切换语言 / Switch language">EN</button><button class="fold" id="btnFold" title="收起 / 展开">−</button></span></div>

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'calculus-essence-3d',
  title: { zh: '微积分的本质 · 从一重到三重', en: 'The Essence of Calculus · Single to Triple' },
  h1:    { zh: '微积分的本质', en: 'The Essence of Calculus' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'amp',   label: { zh: '起伏幅度 <i>A</i>', en: 'Ripple amplitude <i>A</i>' }, min: 0,   max: 0.9, step: 0.05, value: 0.6, fmt: v => fmt(v) },
  { key: 'k',     label: { zh: '起伏频率 <i>k</i>', en: 'Ripple frequency <i>k</i>' }, min: 0.8, max: 3,   step: 0.05, value: 1.2, fmt: v => fmt(v) },
  { key: 'omega', label: { zh: '扫描速度 <i>ω</i>', en: 'Sweep speed <i>ω</i>' },      min: 0.2, max: 3,   step: 0.05, value: 0.8, fmt: v => fmt(v) + ' rad/s' },
  /* —— 旋转体页签专属 —— */
  { key: 'fam',   label: { zh: '母线形状 <i>f</i>(<i>x</i>)', en: 'Profile curve <i>f</i>(<i>x</i>)' }, min: 0, max: 1, step: 1, value: 0,
    fmt: v => t({ zh: ['√x 喇叭', '正弦鼓'][Math.round(v)], en: ['√x horn', 'sine drum'][Math.round(v)] }) }
];

/* 每个滑杆归属的页签（未列出者在所有页签显示）——用于按页签隐藏无关滑杆。
   这是场景级 UI 辅助（不改引擎函数）：一个独立的 rAF 轮询在页签切换时更新 .ctl 行的显隐，
   与 PARAMS 顺序一一对应（paramsHost 的第 i 个子节点即 PARAMS[i]）。 */
const PARAM_TABS = {
  fam: ['rev']
};
let _paramSyncTab = null;
function syncParamRows() {
  if (curTab === _paramSyncTab) return;
  const host = document.getElementById('paramsHost');
  if (!host || host.children.length < PARAMS.length) return;
  _paramSyncTab = curTab;
  PARAMS.forEach((p, i) => {
    const row = host.children[i];
    if (!row) return;
    const tabs = PARAM_TABS[p.key];
    row.style.display = (!tabs || tabs.indexOf(curTab) !== -1) ? '' : 'none';
  });
}
/* 首帧后启动（此时引擎已完成同步初始化，curTab 已就绪，避免 TDZ） */
requestAnimationFrame(function _paramSyncLoop() { syncParamRows(); requestAnimationFrame(_paramSyncLoop); });

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：微积分数学与绘图助手（引擎之上，引擎零改动） ────── */
const SWEEP = 6;         // 一次扫描占 θ 的长度
const SWEEP_PAUSE = 1.2; // 扫到头停一拍再回卷

/* 扫描进度 p ∈ [0,1]：三个页签共用同一时钟（同一扫描，不同测量） */
function sweepP() {
  const m = state.theta % (SWEEP + SWEEP_PAUSE);
  return clamp(m / SWEEP, 0, 1);
}

/* 三个维度的被积对象（起伏由共享滑杆 A、k 控制） */
const f1 = x => 0.5 + 0.35 * state.amp * Math.sin(state.k * x);                                   // 一重：f(x)，x∈[0,6]
const f2 = (x, y) => 0.8 + 0.35 * state.amp * Math.sin(state.k * (x + 2)) * Math.cos(state.k * y)
                         + 0.25 * state.amp * Math.cos(state.k * y);                               // 二重：z=f(x,y)，[−2,2]²
const rho = (x, y, z) => (1 + state.amp * Math.sin(state.k * x) * Math.cos(state.k * y))
                       * (1 - 0.2 * z + 0.3 * state.amp * Math.sin(state.k * z * 2));             // 三重：ρ，[0,2]³

/* 切片值的数值积分（记录当时的真实值） */
function intS(y0) {           // S(y₀) = ∫₋₂² f₂(x, y₀) dx
  let s = 0; const n = 40, dx = 4 / n;
  for (let i = 0; i < n; i++) s += f2(-2 + (i + 0.5) * dx, y0) * dx;
  return s;
}
function intM(z0) {           // M(z₀) = ∬ ρ(x, y, z₀) dx dy
  let s = 0; const n = 22, d = 2 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    s += rho((i + 0.5) * d, (j + 0.5) * d, z0) * d * d;
  return s;
}

/* ────── 旋转体（rev 页签）：母线与圆环部件 ────── */
const REV_X1 = 2;             // 旋转体的定义区间 x ∈ [0, 2]
function fRev(x) {            // 母线 f(x) > 0：由 fam 滑杆选族，起伏仍由共享的 A、k 塑形
  if (state.fam < 0.5) {      // √x 喇叭（喇叭壁的起伏随 A、k，f(0) = 0）
    return 0.85 * Math.sqrt(x / REV_X1) + 0.15 * state.amp * Math.sin(2 * state.k * x) * (x / REV_X1);
  }
  return 0.62 + 0.28 * state.amp * Math.sin(2 * state.k * x);   // 正弦鼓（A = 0 时是圆柱）
}
/* 圆环折线：绕 x 轴（圆心在世界 x = cx、半径 r）/ 绕 y 轴（高度 cy、半径 r） */
function ringPtsX(cx, r, n = 48) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU; pts.push([cx, r * Math.cos(a), r * Math.sin(a)]); }
  return pts;
}
function ringPtsY(cy, r, n = 48) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const a = i / n * TAU; pts.push([r * Math.cos(a), cy, r * Math.sin(a)]); }
  return pts;
}
/* 视角联动：设置开关状态并同步复选框（场景级，不改引擎） */
function setRevToggle(key, val) {
  state[key] = val;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = val; });
}

/* 场景级坐标轴：正半轴 + 自定义刻度 */
function drawCalcAxes(C, o) {
  line3(C, [o.x0 - 0.2, 0, 0], [o.x1 + 0.4, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [o.x1 + 0.4, 0, 0], [o.x1 + 0.2, 0, 0], AXIS);
  label3(C, [o.x1 + 0.68, 0, 0], o.xName, { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const tk of o.xTicks) {
    line3(C, [tk[1], -0.05, 0], [tk[1], 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [tk[1], -0.24, 0], tk[0], { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
  line3(C, [o.yAt || 0, -0.1, 0], [o.yAt || 0, o.y1 + 0.3, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [o.yAt || 0, o.y1 + 0.3, 0], [o.yAt || 0, o.y1 + 0.1, 0], AXIS);
  label3(C, [o.yAt || 0, o.y1 + 0.55, 0], o.yName, { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const tk of (o.yTicks || [])) {
    line3(C, [(o.yAt || 0) - 0.05, tk[1], 0], [(o.yAt || 0) + 0.05, tk[1], 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [(o.yAt || 0) - 0.13, tk[1], 0], tk[0], { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
}

const ROSE_A = 'rgba(251,113,133,';
const VIO_A = 'rgba(167,139,250,';
const CYAN_A = 'rgba(45,212,234,';
const AMB_A = 'rgba(251,191,36,';

const SCENES = {

  /* ────── 一重：斜率与面积（微积分基本定理） ────── */
  d1: {
    label: { zh: '一重 · 斜率与面积', en: 'Single · Slope & area' },
    params: ['amp', 'k', 'omega'],
    brand: { zh: '扫描点掠过 f(x)，脚下的面积一格格记入紫色累积曲线 A(x)。看清一件事：A 的斜率处处等于 f 的高度——微分是积分的逆。',
             en: 'As the sweep crosses f(x), the area underfoot accumulates into the violet curve A(x). Watch one thing: the slope of A always equals the height of f — differentiation undoes integration.' },
    tips: { zh: '提示：切「正视 x·y」盯住琥珀切线——f 高的地方 A 爬得陡，f 低的地方 A 爬得缓，f 是多少 A 的斜率就是多少：dA/dx = f(x)，这就是微积分基本定理。',
            en: 'Tip: in "Front x·y" watch the amber tangent — where f is tall A climbs steeply, where f is low A flattens; the slope of A is exactly f: dA/dx = f(x). That is the fundamental theorem of calculus.' },
    views: {

    sampleWindow: () => 10,
    draw(C) {
      const p = sweepP(), x0 = 6 * p, W = x => x - 3;   // 数学 x → 世界 x
      if (state.showGrid) drawGridXY(C, 3, 1);
      drawCalcAxes(C, { x0: W(0), x1: W(6), xName: 'x', yName: 'y', yAt: W(0),
        xTicks: [['2', W(2)], ['4', W(4)], ['6', W(6)]], y1: 3.4, yTicks: [['1', 1], ['2', 2], ['3', 3]] });

      /* 面积条带 + f 曲线（玫红家族） */
      if (state.showF) {
        for (let x = 0.05; x < x0; x += 0.1) {
          line3(C, [W(x), 0, 0], [W(x), f1(x), 0], { width: 2, color: ROSE_A + '0.20)' });
        }
        const fp = [];
        for (let i = 0; i <= 180; i++) { const x = 6 * i / 180; fp.push([W(x), f1(x), 0]); }
        strokePoly(C, fp, { width: 5, color: ROSE_A + '0.14)' });

      /* 累积曲线 A(x)（紫）：扫描的真实记录 */
      if (state.showAcc && sim.tr1.length > 1) {
        const ap = sim.tr1.map(q => [W(q[0]), q[1], 0]);
        strokePoly(C, ap, { width: 5, color: VIO_A + '0.15)' });
        strokePoly(C, ap, { width: 2.2, color: VIO_A + '0.95)' });
        label3(C, ap[ap.length - 1], 'A(x) = ∫₀ˣ f(u) du', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 10, dy: -6 });
      }
      /* 扫描线 + 斜率标注（琥珀）：A 在 x₀ 处的切线斜率 = f(x₀) */
      const fv = f1(x0);
      line3(C, [W(x0), 0, 0], [W(x0), Math.max(fv, sim.A) + 0.25, 0], { width: 1.3, dash: [5, 5], color: AMB_A + '0.7)' });
      const pf = proj(C, [W(x0), fv, 0]);
      if (pf) glowDot(pf, 9, '#ffffff', ROSE_A + '0.9)');
      if (state.showAcc) {
        const pa = proj(C, [W(x0), sim.A, 0]);
        if (pa) glowDot(pa, 11, '#ffffff', VIO_A + '0.9)');
      }
      if (state.showTan && state.showAcc) {
        const L = 0.7;
        line3(C, [W(x0) - L, sim.A - fv * L, 0], [W(x0) + L, sim.A + fv * L, 0], { width: 1.6, color: AMB_A + '0.9)' });
        label3(C, [W(x0) + L, sim.A + fv * L, 0], 'dA/dx = f(x₀)', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 8 });
      }
    },
    readout() {
      const p = sweepP(), x0 = 6 * p;
      return '<div>x₀ = <b>' + fmt(x0) + '</b>&ensp;·&ensp;' + t({ zh: '扫描', en: 'sweep' }) + ' ' + (p * 100).toFixed(0) + '%</div>' +
        '<div class="sinC">f(x₀) = <b>' + fmt(f1(x0)) + '</b></div>' +
        '<div class="cosC">A(x₀) = ∫₀ˣ f = <b>' + fmt(sim.A) + '</b></div>' +
        '<div class="dim">' + t({ zh: '基本定理：A 的斜率 = f 的高度', en: 'FTC: slope of A = height of f' }) + '</div>';
    }
  },

            en: 'Tip: switch to "Front slice" — the surface collapses into a curve and the slice becomes "area under a curve": you are looking at the previous tab again. Then try "Side S·y" to watch S(y) grow: the volume is the area under it (Fubini).' },

      /* 曲面线框（青，源几何） */
      if (state.showSurf) {

            const xx = -2 + 4 * j / 24;

          strokePoly(C, xl, { width: 1, color: CYAN_A + '0.22)' });

        label3(C, [2, f2(2, -2), -2], 'z = f(x, y)', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'left', dx: 8, dy: -8 });

      if (state.showSlice) {

        label3(C, spts[spts.length - 1], 'S(y) = ∫ f dx', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 10 });

        if (hp) glowDot(hp, 9, '#ffffff', VIO_A + '0.9)');
      }
    },
    readout() {
      const p = sweepP(), y0 = -2 + 4 * p;
      return '<div>y₀ = <b>' + fmtS(y0) + '</b>&ensp;·&ensp;' + t({ zh: '扫描', en: 'sweep' }) + ' ' + (p * 100).toFixed(0) + '%</div>' +
        '<div class="sinC">S(y₀) = ∫ f dx = <b>' + fmt(sim.curS) + '</b></div>' +
        '<div class="cosC">V = ∬ f = ∫ S dy = <b>' + fmt(sim.V) + '</b></div>' +
        '<div class="dim">' + t({ zh: 'Fubini：先积 x，再积 y', en: 'Fubini: integrate x, then y' }) + '</div>';
    }

  /* ────── 三重：逐层成质 ────── */
  d3: {
    label: { zh: '三重 · 逐层成质', en: 'Triple · Layers to mass' },
    params: ['amp', 'k', 'omega'],
    brand: { zh: '盒子里装着变化的密度 ρ(x,y,z)。琥珀平面逐层上扫，每层的二重积分是这一层的质量 M(z)；把 M 沿高度再积一次，就是总质量。',
             en: 'A box holds a varying density ρ(x,y,z). The amber plane sweeps upward layer by layer; each layer’s double integral is its mass M(z), and integrating M over height gives the total mass.' },
    tips: { zh: '提示：切「正视 剖面」看紫色 M(z) 剖面随扫描层上升而生长——三重积分不过是「二重积分的一重积分」。三个页签连起来读：切片、求值、堆叠，一路递归到底。',
            en: 'Tip: in "Front profile" watch the violet M(z) profile grow as the layer rises — a triple integral is just a single integral of double integrals. Read the three tabs together: slice, evaluate, stack — recursion all the way down.' },
    views: {

    sampleWindow: () => 10,
    draw(C) {

      if (state.showGrid) drawGridXY(C, 2, 0.5);

      /* 盒子线框（青，源几何）+ 高度轴 */
      if (state.showBox) {
        const E = [[0,0],[2,0],[2,2],[0,2]];
        for (let i = 0; i < 4; i++) {
          const a = E[i], b = E[(i + 1) % 4];
          line3(C, [Wx(a[0]), 0, Wz(a[1])], [Wx(b[0]), 0, Wz(b[1])], { width: 1.2, color: CYAN_A + '0.5)' });
          line3(C, [Wx(a[0]), 2, Wz(a[1])], [Wx(b[0]), 2, Wz(b[1])], { width: 1.2, color: CYAN_A + '0.5)' });
          line3(C, [Wx(a[0]), 0, Wz(a[1])], [Wx(a[0]), 2, Wz(a[1])], { width: 1.2, color: CYAN_A + '0.5)' });
        }
        label3(C, [Wx(0), 2, Wz(0)], 'ρ(x, y, z)', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'right', dx: -8, dy: -8 });
      }
      line3(C, [-1.4, 0, -1], [-1.4, 2.5, -1], { width: 1.4, color: AXIS });
      arrowAt(C, [-1.4, 2.5, -1], [-1.4, 2.3, -1], AXIS);
      label3(C, [-1.4, 2.72, -1], 'z', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (const zv of [1, 2]) {
        line3(C, [-1.45, zv, -1], [-1.35, zv, -1], { width: 1.2, color: AXIS_DIM });
        label3(C, [-1.52, zv, -1], '' + zv, { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }

      /* 当前切层：琥珀边框 + 密度点阵（点亮度 = ρ 的真值） */
      if (state.showLayer) {
        strokePoly(C, [[Wx(0), z0, Wz(0)], [Wx(2), z0, Wz(0)], [Wx(2), z0, Wz(2)], [Wx(0), z0, Wz(2)], [Wx(0), z0, Wz(0)]],

        if (hp) glowDot(hp, 9, '#ffffff', VIO_A + '0.9)');

        '<div class="sinC">M(z₀) = ∬ ρ = <b>' + fmt(sim.curM) + '</b></div>' +
        '<div class="cosC">' + t({ zh: '质量', en: 'mass' }) + ' = ∭ ρ = ∫ M dz = <b>' + fmt(sim.Mass) + '</b></div>' +
        '<div class="dim">' + t({ zh: '切片 → 求值 → 堆叠，一路递归', en: 'slice → evaluate → stack, recursively' }) + '</div>';
    }
  },

          xTicks: [['1', 1], ['2', 2]], y1: 1.25, yTicks: [['1', 1]] });
        /* 累积体积 V(x) 投到后墙 z = −2.6（紫）：与二三重页签的侧墙曲线同语法 */
        if (state.showVR && sim.trR.length > 1) {
          line3(C, [0, 0, -2.6], [REV_X1, 0, -2.6], { width: 1, color: 'rgba(148,163,184,0.35)' });
          const vp = sim.trR.map(q => [q[0], 0.17 * q[2], -2.6]);
          strokePoly(C, vp, { width: 5, color: VIO_A + '0.15)' });
          strokePoly(C, vp, { width: 2.2, color: VIO_A + '0.95)' });
          label3(C, vp[vp.length - 1], 'V(x₀) = ∫ 2πx·f dx', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 10 });
          const hp = proj(C, [xr, 0.17 * sim.Vs, -2.6]);
          if (hp) glowDot(hp, 9, '#ffffff', VIO_A + '0.9)');
        }
        /* 旋转面线框（青，源几何）：纬线圈 + 母线经线 + 底缘 */
        if (state.showSurfR) {
          for (let i = 1; i <= 12; i++) {
            const x = REV_X1 * i / 12;
            strokePoly(C, ringPtsY(fRev(x), x), { width: 1, color: CYAN_A + '0.22)' });
          }
          strokePoly(C, ringPtsY(0, REV_X1), { width: 1, color: CYAN_A + '0.30)' });
          for (let a = 0; a < 8; a++) {
            const ca = Math.cos(a / 8 * TAU), sa = Math.sin(a / 8 * TAU), lp = [];
            for (let i = 0; i <= 36; i++) { const x = REV_X1 * i / 36; lp.push([x * ca, fRev(x), x * sa]); }
            strokePoly(C, lp, { width: 1, color: CYAN_A + '0.22)' });
          }
          label3(C, [-REV_X1, fRev(REV_X1), 0], 'y = f(x)', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'right', dx: -8, dy: -8 });
        }
        /* 琥珀扫描进度（沿半径方向推进到 x₀） */
        line3(C, [0, 0, 0], [xr, 0, 0], { width: 2, color: AMB_A + '0.55)' });
        line3(C, [xr, -0.07, 0], [xr, 0.07, 0], { width: 1.4, color: AMB_A + '0.9)' });
        label3(C, [xr, -0.32, 0], 'x₀', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        /* 当前圆柱壳（玫红）：半径 x₀、高 f(x₀) */
        if (state.showSliceR && xr > 0.02) {
          strokePoly(C, ringPtsY(fr, xr), { width: 4.5, color: ROSE_A + '0.18)' });
          strokePoly(C, ringPtsY(fr, xr), { width: 2.2, color: ROSE_A + '0.95)' });
          strokePoly(C, ringPtsY(0, xr), { width: 2, color: ROSE_A + '0.6)' });
          for (let a = 0; a < 10; a++) {
            const ca = Math.cos(a / 10 * TAU), sa = Math.sin(a / 10 * TAU);
            line3(C, [xr * ca, 0, xr * sa], [xr * ca, fr, xr * sa], { width: 1.2, color: ROSE_A + '0.45)' });
          }
          line3(C, [xr, fr, 0], [xr, 0, 0], { width: 1.5, dash: [7, 7], color: ROSE_A + '0.8)' });
          const hd = proj(C, [xr, fr, 0]);
          if (hd) glowDot(hd, 10, '#ffffff', ROSE_A + '0.9)');
          label3(C, [xr, fr + 0.22, 0], 'dV = 2π·x₀·f(x₀) dx', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'left', dx: 6 });
        }
      } else {
        /* ── 圆盘法：绕 x 轴 ── */
        const Wd = x => x - 1;   // 数学 x ∈ [0,2] → 世界 x ∈ [−1,1]
        if (state.showGrid) drawGridXY(C, 2.5, 0.5);
        drawCalcAxes(C, { x0: Wd(0), x1: Wd(REV_X1) + 0.15, xName: 'x', yName: 'y', yAt: Wd(0),
          xTicks: [['1', Wd(1)], ['2', Wd(2)]], y1: 1.25, yTicks: [['1', 1]] });
        /* 累积体积 V(x) 投到后墙 z = −1.5（紫） */
        if (state.showVR && sim.trR.length > 1) {
          line3(C, [Wd(0), 0, -1.5], [Wd(REV_X1), 0, -1.5], { width: 1, color: 'rgba(148,163,184,0.35)' });
          const vp = sim.trR.map(q => [Wd(q[0]), 0.3 * q[1], -1.5]);
          strokePoly(C, vp, { width: 5, color: VIO_A + '0.15)' });
          strokePoly(C, vp, { width: 2.2, color: VIO_A + '0.95)' });
          label3(C, vp[vp.length - 1], 'V(x₀) = ∫ π·f² dx', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 10 });
          const hp = proj(C, [Wd(xr), 0.3 * sim.Vd, -1.5]);
          if (hp) glowDot(hp, 9, '#ffffff', VIO_A + '0.9)');
        }
        /* 旋转面线框（青，源几何）：纬线圈 + 母线经线 */
        if (state.showSurfR) {
          for (let i = 0; i <= 12; i++) {
            const x = REV_X1 * i / 12, r = fRev(x);
            if (r > 0.02) strokePoly(C, ringPtsX(Wd(x), r), { width: 1, color: CYAN_A + '0.22)' });
          }
          for (let a = 0; a < 8; a++) {
            const ca = Math.cos(a / 8 * TAU), sa = Math.sin(a / 8 * TAU), lp = [];
            for (let i = 0; i <= 36; i++) { const x = REV_X1 * i / 36, r = fRev(x); lp.push([Wd(x), r * ca, r * sa]); }
            strokePoly(C, lp, { width: 1, color: CYAN_A + '0.22)' });
          }
          label3(C, [Wd(REV_X1), fRev(REV_X1), 0], 'y = f(x)', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'left', dx: 8, dy: -8 });
        }
        /* 琥珀扫描进度（沿旋转轴推进到 x₀） */
        line3(C, [Wd(0), 0, 0], [Wd(xr), 0, 0], { width: 2, color: AMB_A + '0.55)' });
        line3(C, [Wd(xr), -0.07, 0], [Wd(xr), 0.07, 0], { width: 1.4, color: AMB_A + '0.9)' });
        label3(C, [Wd(xr), -0.32, 0], 'x₀', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        /* 当前圆盘（玫红）：半径 f(x₀)、厚 dx 的薄片 */
        if (state.showSliceR && fr > 0.02) {
          const h = 0.05;
          strokePoly(C, ringPtsX(Wd(xr - h), fr), { width: 2, color: ROSE_A + '0.55)' });
          for (let a = 0; a < 8; a++) {
            const ca = Math.cos(a / 8 * TAU), sa = Math.sin(a / 8 * TAU);
            line3(C, [Wd(xr - h), fr * ca, fr * sa], [Wd(xr + h), fr * ca, fr * sa], { width: 1.2, color: ROSE_A + '0.5)' });
          }
          for (const kf of [0.33, 0.66]) strokePoly(C, ringPtsX(Wd(xr), fr * kf), { width: 1, color: ROSE_A + '0.25)' });
          strokePoly(C, ringPtsX(Wd(xr + h), fr), { width: 4.5, color: ROSE_A + '0.18)' });
          strokePoly(C, ringPtsX(Wd(xr + h), fr), { width: 2.2, color: ROSE_A + '0.95)' });
          line3(C, [Wd(xr), fr, 0], [Wd(xr), 0, 0], { width: 1.5, dash: [7, 7], color: ROSE_A + '0.8)' });
          const hd = proj(C, [Wd(xr), fr, 0]);
          if (hd) glowDot(hd, 10, '#ffffff', ROSE_A + '0.9)');
          label3(C, [Wd(xr), fr + 0.22, 0], 'dV = π·f(x₀)² dx', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'left', dx: 6 });
        }
      }
    },
    readout() {
      const p = sweepP(), xr = REV_X1 * p, shell = state.shellMode;
      const dv = shell ? sim.curGs : sim.curGd, V = shell ? sim.Vs : sim.Vd;
      return '<div>x₀ = <b>' + fmt(xr) + '</b>&ensp;·&ensp;f(x₀) = <b>' + fmt(sim.curR) + '</b>&ensp;·&ensp;' + t({ zh: '扫描', en: 'sweep' }) + ' ' + (p * 100).toFixed(0) + '%</div>' +
        '<div class="sinC">' + (shell ? 'dV/dx = 2π·x₀·f(x₀) = ' : 'dV/dx = π·f(x₀)² = ') + '<b>' + fmt(dv) + '</b></div>' +
        '<div class="cosC">V(x₀) = ' + (shell ? '∫ 2πx·f dx' : '∫ π·f² dx') + ' = <b>' + fmt(V) + '</b></div>' +
        '<div class="dim">' + t(shell
          ? { zh: '同一游戏：换绕 x 轴，切片即圆盘 π f² dx', en: 'same game: about x, the slice is a disk π f² dx' }
          : { zh: '同一游戏：换绕 y 轴，切片即圆柱壳 2πx·f dx', en: 'same game: about y, the slice is a shell 2πx·f dx' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 扫描状态：三个页签共用同一次扫描（同一运动，不同测量）。
   记录的是「当时的真实值」——中途改滑杆，已扫过的曲线不重算；回卷时清空重扫 */
const sim = {
  lastP: 2, lastPt: -1,
  A: 0, V: 0, Mass: 0, Vd: 0, Vs: 0,
  curF: 0, curS: 0, curM: 0, curR: 0, curGd: 0, curGs: 0,
  lastF: null, lastS: null, lastM: null, lastGd: null, lastGs: null,
  tr1: [], tr2: [], tr3: [], trR: []
};
function resetSweep() {
  sim.A = sim.V = sim.Mass = 0;
  sim.Vd = sim.Vs = 0;
  sim.lastF = sim.lastS = sim.lastM = null;
  sim.lastGd = sim.lastGs = null;
  sim.tr1.length = 0; sim.tr2.length = 0; sim.tr3.length = 0; sim.trR.length = 0;
  sim.lastPt = -1;
}

function pushSample() {
  const p = sweepP();
  if (p < sim.lastP - 1e-9) resetSweep();          // 回卷：重扫一遍
  const dp = p - Math.min(sim.lastP, p);
  sim.lastP = p;

  const x0 = 6 * p, y0 = -2 + 4 * p, z0 = 2 * p, xr = REV_X1 * p;
  const fv = f1(x0), Sv = intS(y0), Mv = intM(z0);
  const fr = fRev(xr), gd = Math.PI * fr * fr, gs = TAU * xr * fr;   // 旋转体：盘 πf² · 壳 2πxf
  sim.curF = fv; sim.curS = Sv; sim.curM = Mv;
  sim.curR = fr; sim.curGd = gd; sim.curGs = gs;

  if (sim.lastF != null && dp > 0) {               // 梯形法累积（真实增量）
    sim.A    += (fv + sim.lastF) / 2 * 6 * dp;
    sim.V    += (Sv + sim.lastS) / 2 * 4 * dp;
    sim.Mass += (Mv + sim.lastM) / 2 * 2 * dp;
    sim.Vd   += (gd + sim.lastGd) / 2 * REV_X1 * dp;
    sim.Vs   += (gs + sim.lastGs) / 2 * REV_X1 * dp;
  }
  sim.lastF = fv; sim.lastS = Sv; sim.lastM = Mv;
  sim.lastGd = gd; sim.lastGs = gs;

  if (p - sim.lastPt >= 1 / 300 || sim.lastPt < 0) {  // 记录扫描轨迹（抽稀）
    sim.tr1.push([x0, sim.A]);
    sim.tr2.push([y0, Sv]);
    sim.tr3.push([z0, Mv]);
    sim.trR.push([xr, sim.Vd, sim.Vs]);
    sim.lastPt = p;
  }
  samples.push({ t: state.t, p: p });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
