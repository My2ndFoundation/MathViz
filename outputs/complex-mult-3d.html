<!-- ============================================================
  复数乘法的本质 · 交互式数学可视化
  基于 math-viz-starter.html v1.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）

  核心「顿悟」：两个复数 z₁·z₂ 相乘 = 幅角相加 + 模长相乘 = 「旋转 + 伸缩」。
  三个页签共享同一份运动（z₁ 匀速旋转、z₂ 为固定「算子」）：
    旋转伸缩 —— 复平面上三支向量 z₁·z₂·z₁z₂，乘积恒领先 φ₂、恒为 r₂ 倍
                顿悟视角：「正视 复平面」看清锁定的夹角 φ₂ 与长度比 r₂
    螺旋展开 —— 旋转沿时间轴展开为两条螺旋，乘 z₂ = 放大半径 + 沿时平移
                顿悟视角：「侧视 y·t」两条正弦：相位差 = φ₂、振幅比 = r₂
    反复相乘 —— 反复乘 z₂，各次幂 z₂ⁿ 排成对数螺旋（等角 + 等比）
                顿悟视角：「正视 复平面」；把 r₂ 调到 1 即得单位根

  制作新工具只需修改三处（均在脚本区顶部，以 ①②③ 标记）：
    ① PARAMS      —— 声明滑杆参数（自动生成 UI）
    ② SCENES      —— 注册场景页签（brand / tips / views / toggles / draw / readout）
    ③ pushSample  —— 按需扩展采样字段（原则：记录当时的真实值）
  引擎区（相机 / 投影 / 绘制部件 / 交互 / 主循环）一般无需改动。

  版本记录（新→旧）：
    1.3.0  2026-07-31  静止页签接入时间驱动：自动播放可开关，往返/循环可切换
    1.2.1  2026-07-31  参数面板按页签显示：各场景声明 params，只列出对当前页签有效的滑块
    1.2.0  2026-07-12  新增三个页签：棣莫弗定理（幅角 ×n）、n 次方根（正 n 边形）、复数轨迹（阿甘图几何约束）

'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){

            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'r1',        label: { zh: '输入模长 |<i>z</i>₁|', en: 'Input modulus |<i>z</i>₁|' },   min: 0.3, max: 1.5, step: 0.05, value: 1,    fmt: v => fmt(v) },

  { key: 'phi2',      label: { zh: '乘数幅角 <i>φ</i>₂',   en: 'Multiplier argument <i>φ</i>₂' }, min: 0,   max: 2,   step: 0.02, value: 0.34, fmt: v => fmt(v) + ' π (' + (v * 180).toFixed(0) + '°)', map: v => v * Math.PI },
  { key: 'omega',     label: { zh: '旋转速度 <i>ω</i>',    en: 'Rotation speed <i>ω</i>' },     min: 0.2, max: 3,   step: 0.05, value: 0.8,  fmt: v => fmt(v) + ' rad/s' },

  { key: 'nPow',      label: { zh: '幂 / 根次数 <i>n</i>',   en: 'Power / root order <i>n</i>' }, min: 1,   max: 6,   step: 1,    value: 3,    fmt: v => v.toFixed(0) },

  { key: 'wArg',      label: { zh: '目标幅角 arg <i>w</i>',  en: 'Target argument arg <i>w</i>' }, min: 0,  max: 2,   step: 0.02, value: 0.5,  fmt: v => fmt(v) + ' π (' + (v * 180).toFixed(0) + '°)', map: v => v * Math.PI },

  { key: 'locusType', label: { zh: '轨迹类型',               en: 'Locus type' },                  min: 0,   max: 3,   step: 1,    value: 0,    fmt: v => t({ zh: ['|z−a| = r（圆）','|z−a| = |z−b|（中垂线）','arg(z−a) = θ（射线）','|(z−a)/(z−b)| = k（阿波罗尼斯圆）'][v], en: ['|z−a| = r (circle)','|z−a| = |z−b| (bisector)','arg(z−a) = θ (ray)','|(z−a)/(z−b)| = k (Apollonius)'][v] }) },
  { key: 'aRe',       label: { zh: '定点 <i>a</i> 实部',      en: 'Point <i>a</i> · Re' },          min: -2,  max: 2,   step: 0.1,  value: -0.6, fmt: v => fmtS(v) },

/* ── 复数乘法工具：颜色语义与场景小部件 ──
   z₁ 玫红（输入·第一主曲线）· z₂ 紫（乘数/算子·第二曲线）· 乘积 z₁z₂ 翠绿（第三曲线）
   三支主角在所有页签保持同一身份色，实现「一对象一色·六处同源」的跨页签一致性 */
const C_Z1 = '#fb7185';
const C_Z2 = '#a78bfa';
const C_W  = '#34d399';
const C_O  = '#fb923c';                       /* 橙（第四曲线：轨迹页的第二定点 b） */
const AMB  = 'rgba(251,191,36,0.9)';
const SUP  = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup  = n => String(n).split('').map(d => SUP[+d]).join('');
const SBS  = '₀₁₂₃₄₅₆₇₈₉';
const sbs  = n => String(n).split('').map(d => SBS[+d]).join('');
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')';

/* 复数写作 a + b i（实部负号用 U+2212） */
function cfmt(x, y) { return fmtS(x) + ' ' + (y < 0 ? '−' : '+') + ' ' + fmt(Math.abs(y)) + ' i'; }

/* 复平面坐标轴（Re / Im，可选时间轴 t）：o = { ex, ey, tAxis, v } */
function cplxAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex,0,0], [ex,0,0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex,0,0], [ex-0.2,0,0], AXIS);
  label3(C, [ex+0.3,0,0], 'Re', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0,-ey,0], [0,ey,0], { width: 1.4, color: AXIS });
  arrowAt(C, [0,ey,0], [0,ey-0.2,0], AXIS);
  label3(C, [0,ey+0.22,0], 'Im', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const xv of [1,-1]) {
    line3(C, [xv,-0.05,0], [xv,0.05,0], { width: 1.2, color: AXIS_DIM });
    label3(C, [xv,-0.24,0], xv < 0 ? '−1' : '1', { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  }
  for (const yv of [1,-1]) {
    line3(C, [-0.05,yv,0], [0.05,yv,0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.16,yv,0], yv < 0 ? '−i' : 'i', { font: 'italic 12px ' + FONT_MATH, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
  if (o.tAxis) {
    line3(C, [0,0,0], [0,0,WAVE_LEN+0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0,0,WAVE_LEN+0.5], [0,0,WAVE_LEN+0.3], AXIS);
    label3(C, [0,0,WAVE_LEN+0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1, every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0,-0.06,k*v], [0,0.06,k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) label3(C, [0,-0.25,k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* 从原点出发的向量（主体线 + 箭头） */
function vec(C, x, y, color, o) {
  o = o || {};
  line3(C, [0,0,0], [x,y,0], { width: o.width || 2, color: color });
  arrowAt(C, [x,y,0], [x*0.86, y*0.86, 0], color);
}

/* 半径 R 的圆（z=0 平面，可虚线） */
function ring(C, R, color, dash) {
  const p = [];
  for (let i = 0; i <= 72; i++) { const a = i/72*TAU; p.push([R*Math.cos(a), R*Math.sin(a), 0]); }
  strokePoly(C, p, { width: 1.2, color: color, dash: dash });
}

/* 角度扇弧 a1→a2（半径 r0，琥珀度量），标注置于中点外侧 */
function arcSpan(C, a1, a2, r0, label, color) {
  const d = a2 - a1;
  if (Math.abs(d) < 0.02) return;
  const n = Math.max(2, Math.ceil(Math.abs(d)/0.06));
  const p = [];
  for (let j = 0; j <= n; j++) { const a = a1 + d*j/n; p.push([r0*Math.cos(a), r0*Math.sin(a), 0]); }
  strokePoly(C, p, { width: 1.6, color: color });
  if (label) {
    const am = a1 + d/2;
    label3(C, [(r0+0.16)*Math.cos(am), (r0+0.16)*Math.sin(am), 0], label,
      { font: 'italic 12px ' + FONT_MATH, color: color, align: 'center' });
  }
}

/* 乘方页：在界内的整数幂个数 N（模长落在 [0.03, 2.6]，上限 8） */
function powCount() {
  const r2 = state.r2; let N = 0;
  for (let k = 1; k <= 8; k++) { const R = Math.pow(r2, k); if (R > 2.6 || R < 0.03) break; N = k; }
  return Math.max(1, N);
}
/* 随主时钟沿对数螺旋往返走动的连续幂次 p（主时钟每转一圈 = 再乘一次 z₂） */
function powShow() {
  const N = powCount(), per = 2*N;
  let pp = (state.theta / TAU) % per; if (pp < 0) pp += per;
  return pp <= N ? pp : per - pp;
}

      cplxAxes(C, { ex: 2.7, ey: 2.5, tAxis: false });
      drawCircle(C, 1);                                    /* 单位圆参考 */
      const N = powCount();

      /* 对数螺旋 z₂^p, p ∈ [0, N] */
      if (state.showSpiral) {
        const sp = [], steps = Math.max(24, N * 24);
        for (let j = 0; j <= steps; j++) {
          const p = N * j / steps, R = Math.pow(r2, p), a = p * p2;
          sp.push([R*Math.cos(a), R*Math.sin(a), 0]);
        }
        strokePoly(C, sp, { width: 5,   color: hexA(C_W, 0.13) });
        strokePoly(C, sp, { width: 2.2, color: hexA(C_W, 0.9) });
      }

      /* 各整数次幂 z₂ⁿ：半径线 + 点 + 每步 +φ₂ 弧 */
      if (state.showSteps) {
        for (let k = 0; k <= N; k++) {
          const R = Math.pow(r2, k), a = k * p2;
          const x = R*Math.cos(a), y = R*Math.sin(a);
          line3(C, [0,0,0], [x,y,0], { width: 1.4, color: hexA(C_Z2, 0.5) });
          if (state.showGuides && k >= 1) arcSpan(C, (k-1)*p2, k*p2, 0.28 + 0.06*k, k === 1 ? '+φ₂' : '', 'rgba(251,191,36,0.8)');
          solidDot(C, [x,y,0], 3, hexA(C_Z2, 0.95));
          label3(C, [x,y,0], 'z₂' + sup(k), { font: 'italic 12px ' + FONT_MATH, color: C_Z2, align: 'left', dx: 8, dy: -6 });
        }
      }

      /* 随主时钟往返走动的当前点 z₂^p（体现「不断再乘一次」） */
      const p = powShow(), R = Math.pow(r2, p), a = p * p2;
      const mp = proj(C, [R*Math.cos(a), R*Math.sin(a), 0]);
      if (mp) glowDot(mp, 12, '#ffffff', 'rgba(186,240,255,0.9)');

      label3(C, [-2.6, 2.35, 0], 'zⁿ = rⁿ·e^(i n φ)  ' + t({ zh: '（角 ×n、模 ^n）', en: '(angle ×n, modulus ^n)' }),
        { font: 'italic 13px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const r2 = state.r2, p2 = state.phi2;
      const p = powShow(), R = Math.pow(r2, p);
      const dp = (mod2pi(p2) * 180 / Math.PI).toFixed(0);
      const isRoot = Math.abs(r2 - 1) < 0.03;
      return readoutHead() +
        '<div class="wC">' + t({ zh: '当前 z₂^p，p = ', en: 'Current z₂^p, p = ' }) + '<b>' + fmt(p) + '</b>&ensp;·&ensp;|z₂^p| = r₂^p = <b>' + fmt(R) + '</b></div>' +
        '<div class="z2C">z₂ = ' + fmt(r2) + ' ∠ ' + dp + '°&ensp;·&ensp;' + t({ zh: '每乘一次：角', en: 'Each multiply: angle' }) + ' <b>+' + dp + '°</b>' + t({ zh: '、模', en: ', modulus' }) + ' <b>×' + fmt(r2) + '</b></div>' +
        '<div class="dim">' + t({ zh: '第 n 次幂：模长 r₂ⁿ、幅角 nφ₂', en: 'nth power: modulus r₂ⁿ, argument nφ₂' }) + (isRoot ? ('&ensp;·&ensp;' + t({ zh: 'r₂ = 1 → 各幂落在单位圆、等角分布（单位根）', en: 'r₂ = 1 → all powers land on the unit circle, equally spaced (roots of unity)' })) : '') + '</div>';
    }
  },

  /* ────── 页签四：棣莫弗定理（幅角 ×n、模长恒为 1） ────── */
  demoivre: {
    label: { zh: '棣莫弗', en: 'De Moivre' },
    params: ['omega', 'nPow'],
    brand: { zh: '棣莫弗定理：(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ。让输入点（玫红）在单位圆上转一圈，输出点（翠绿）就转 n 圈——幅角被乘以 n、模长恒为 1。',
             en: 'De Moivre: (cos θ + i sin θ)ⁿ = cos nθ + i sin nθ. As the input point (rose) circles the unit circle once, the output (emerald) circles n times — the argument is multiplied by n while the modulus stays 1.' },
    tips: { zh: '提示：切到「正视 复平面」——琥珀螺旋扇形把 nθ 拆成 n 段相等的 θ 叠加而成，这就是「幅角 ×n」。调大 n，看输出点转得越来越快。',
            en: 'Tip: switch to "Front: complex plane" — the amber spiral fan splits nθ into n equal copies of θ stacked together: that\'s "argument ×n". Increase n and watch the output point race around faster.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },                   az: -0.7,  el: 0.35, dist: 5.6, tx: 0, ty: 0.05, tz: 0 },
      front: { label: { zh: '正视 复平面', en: 'Front: complex plane' }, az: 0.001, el: 0.02, dist: 4.9, tx: 0, ty: 0,    tz: 0 }
    },
    toggles: [
      { key: 'showInput',  label: { zh: '输入 <i>z</i> = e^(iθ)', en: 'Input <i>z</i> = e^(iθ)' },  color: '#fb7185', checked: true },
      { key: 'showOutput', label: { zh: '输出 <i>z</i>ⁿ = e^(inθ)', en: 'Output <i>z</i>ⁿ = e^(inθ)' }, color: '#34d399', checked: true },
      { key: 'showGuides', label: { zh: '角度叠加辅助', en: 'Angle-stack guides' },                  color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                                        color: '#64748b', checked: true }
    ],
    draw(C) {
      const n = Math.round(state.nPow), th = state.theta, thd = mod2pi(th);
      const inA = thd, outA = n * thd;
      const zin  = [Math.cos(inA),  Math.sin(inA)];
      const zout = [Math.cos(outA), Math.sin(outA)];
      if (state.showGrid) drawGridXY(C, 1.6, 0.5);
      cplxAxes(C, { ex: 1.8, ey: 1.7 });
      drawCircle(C, 1);

      /* 螺旋扇形：nθ = θ + θ + … + θ（n 段等角，半径逐步外扩以免重叠） */
      if (state.showGuides && inA > 0.02) {
        for (let k = 0; k < n; k++) {
          arcSpan(C, k * inA, (k + 1) * inA, 0.34 + 0.075 * k, k === 0 ? 'θ' : '',
            'rgba(251,191,36,' + (0.45 + 0.45 * (k + 1) / n).toFixed(2) + ')');
        }
        const rr = 0.34 + 0.075 * n;
        label3(C, [rr * Math.cos(outA), rr * Math.sin(outA), 0], 'nθ',
          { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 6, dy: -4 });
      }

      if (state.showOutput) { vec(C, zout[0], zout[1], C_W, { width: 2.4 }); const p = proj(C, [zout[0],zout[1],0]); if (p) glowDot(p, 11, '#ffffff', hexA(C_W, 0.9)); }
      if (state.showInput)  { vec(C, zin[0],  zin[1],  C_Z1, { width: 2 });   const p = proj(C, [zin[0], zin[1], 0]); if (p) glowDot(p, 9,  '#ffffff', hexA(C_Z1, 0.85)); }
      solidDot(C, [0,0,0], 2.4, 'rgba(159,176,200,0.9)');
      if (state.showInput)  label3(C, [zin[0],  zin[1],  0], 'z',  { font: 'italic 13px ' + FONT_MATH, color: C_Z1, align: 'left', dx: 9, dy: -6 });
      if (state.showOutput) label3(C, [zout[0], zout[1], 0], 'zⁿ', { font: 'italic 13px ' + FONT_MATH, color: C_W,  align: 'left', dx: 9, dy: -6 });

      label3(C, [-1.75, 1.55, 0], '(cos θ + i sin θ)ⁿ = cos nθ + i sin nθ',
        { font: 'italic 12px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const n = Math.round(state.nPow), thd = mod2pi(state.theta);
      const di = (thd * 180 / Math.PI).toFixed(0);
      const doo = (mod2pi(n * thd) * 180 / Math.PI).toFixed(0);
      return readoutHead() +
        '<div class="z1C">' + t({ zh: '输入', en: 'Input' }) + ' z = e^(iθ)&ensp;·&ensp;θ = <b>' + di + '°</b>&ensp;·&ensp;|z| = 1</div>' +
        '<div class="wC">' + t({ zh: '输出', en: 'Output' }) + ' zⁿ = e^(inθ)&ensp;·&ensp;nθ = <b>' + doo + '°</b>&ensp;·&ensp;|zⁿ| = 1</div>' +
        '<div>n = ' + n + '&ensp;·&ensp;' + t({ zh: '输入转一圈，输出转 n 圈', en: 'input circles once, output circles n times' }) + '</div>' +
        '<div class="dim">' + t({ zh: '幅角 ×n，模长恒为 1', en: 'argument ×n, modulus stays 1' }) + '</div>';
    }
  },

  /* ────── 页签五：n 次方根（解 zⁿ = w，n 个根排成正 n 边形） ────── */
  roots: {
    label: { zh: 'n 次方根', en: 'nth roots' },
    params: ['omega', 'nPow', 'wMod', 'wArg'],
    /* tips 的顿悟点是「n 个根均匀分布、相邻夹角恒为 2π/n，正好是一个正 n 边形」——
       让 n 自己从 1 长到 6：点、线段、三角、四边、五边、六边逐个长出来，
       而「相邻夹角 = 2π/n」的琥珀弧全程自洽。值域 = nPow 的完整 [1, 6]；
       draw 与 readout 都已 Math.round，连续驱动值落到整数上。
       6 跳回 1 会突变，故 linear（往返）。10 秒：六档各约 0.8 秒，够数清顶点。
       目标 w 的模长与幅角留给用户——它们控制的是「整体朝向与大小」这另一维。
       注：本页下方那个「随主时钟依次高亮的当前根」只是一枚随 θ 巡游的光点——
       实测关掉「各根」开关后 θ 对画面再无影响，正 n 边形本身并不随时钟演进，
       所以这一页按判据仍属静止页签。 */
    drive: { key: 'nPow', from: 1, to: 6, period: 10, kind: 'linear' },
    brand: { zh: '解 zⁿ = w：模长取 n 次方根、幅角除以 n；又因幅角有 2π 周期，得到 n 个等间隔的根（翠绿），在半径 |w|^(1/n) 的圆上排成正 n 边形。',
             en: 'Solving zⁿ = w: take the n-th root of the modulus and divide the argument by n; because the argument is 2π-periodic there are n equally spaced roots (emerald), forming a regular n-gon on a circle of radius |w|^(1/n).' },
    tips: { zh: '提示：切到「正视 复平面」——n 个根均匀分布、相邻夹角恒为 2π/n，正好是一个正 n 边形。改变 n 或目标 w，看根的个数与整体朝向随之变化。',
            en: 'Tip: switch to "Front: complex plane" — the n roots are evenly spaced, adjacent ones 2π/n apart, exactly a regular n-gon. Change n or the target w to see the count and overall orientation update.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },                   az: -0.7,  el: 0.35, dist: 7.6, tx: 0, ty: 0.05, tz: 0 },
      front: { label: { zh: '正视 复平面', en: 'Front: complex plane' }, az: 0.001, el: 0.02, dist: 6.8, tx: 0, ty: 0,    tz: 0 }
    },
    toggles: [
      { key: 'showTarget', label: { zh: '目标 <i>w</i>', en: 'Target <i>w</i>' },                    color: '#a78bfa', checked: true },
      { key: 'showRoots',  label: { zh: '各根 <i>z</i>ₖ（正 n 边形）', en: 'Roots <i>z</i>ₖ (n-gon)' }, color: '#34d399', checked: true },
      { key: 'showGuides', label: { zh: '幅角/间隔辅助', en: 'Arg / spacing guides' },                color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                                        color: '#64748b', checked: true }
    ],
    draw(C) {
      const n = Math.round(state.nPow), wm = state.wMod, wa = state.wArg;
      const R = Math.pow(wm, 1 / n);
      const w = [wm * Math.cos(wa), wm * Math.sin(wa)];
      if (state.showGrid) drawGridXY(C, 2.5, 0.5);
      cplxAxes(C, { ex: 2.7, ey: 2.5 });
      drawCircle(C, 1);

      if (state.showRoots) ring(C, R, hexA(C_W, 0.4), [5,6]);

      /* 幅角 arg w（琥珀弧）与「除以 n」 */
      if (state.showGuides) {
        arcSpan(C, 0, wa, 0.6, 'arg w', 'rgba(251,191,36,0.9)');
        arcSpan(C, 0, wa / n, 0.34, 'arg w /n', 'rgba(251,191,36,0.7)');
      }

      if (state.showRoots) {
        /* 正 n 边形边 */
        const poly = [];
        for (let k = 0; k <= n; k++) { const ak = (wa + TAU * k) / n; poly.push([R*Math.cos(ak), R*Math.sin(ak), 0]); }
        strokePoly(C, poly, { width: 5,   color: hexA(C_W, 0.12) });
        strokePoly(C, poly, { width: 1.8, color: hexA(C_W, 0.7) });
        /* 各根半径线 + 点 + 标注 */
        for (let k = 0; k < n; k++) {
          const ak = (wa + TAU * k) / n, x = R*Math.cos(ak), y = R*Math.sin(ak);
          line3(C, [0,0,0], [x,y,0], { width: 1.3, color: hexA(C_W, 0.5) });
          solidDot(C, [x,y,0], 3.2, hexA(C_W, 0.95));
          label3(C, [x,y,0], 'z' + sbs(k), { font: 'italic 12px ' + FONT_MATH, color: C_W, align: 'left', dx: 8, dy: -6 });
        }
        /* 相邻根夹角 2π/n */
        if (state.showGuides && n >= 2) {
          const a0 = wa / n;
          arcSpan(C, a0, a0 + TAU / n, R * 0.9, '2π/n', 'rgba(251,191,36,0.85)');
        }
      }

      if (state.showTarget) {
        vec(C, w[0], w[1], C_Z2, { width: 2 });
        const p = proj(C, [w[0],w[1],0]); if (p) glowDot(p, 10, '#ffffff', hexA(C_Z2, 0.85));
        label3(C, [w[0],w[1],0], 'w', { font: 'italic 13px ' + FONT_MATH, color: C_Z2, align: 'left', dx: 9, dy: -6 });
      }

      /* 随主时钟依次高亮的当前根 */
      if (state.showRoots) {
        const kAct = ((Math.floor(state.theta / (TAU / n)) % n) + n) % n;
        const ka = (wa + TAU * kAct) / n;
        const mp = proj(C, [R*Math.cos(ka), R*Math.sin(ka), 0]);
        if (mp) glowDot(mp, 13, '#ffffff', 'rgba(186,240,255,0.9)');
      }

      label3(C, [-2.6, 2.3, 0], 'zⁿ = w  ⇒  |z| = |w|^(1/n),  arg z = (arg w + 2πk)/n',
        { font: 'italic 12px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const n = Math.round(state.nPow), wm = state.wMod, wa = state.wArg, R = Math.pow(wm, 1 / n);
      const dw = (mod2pi(wa) * 180 / Math.PI).toFixed(0);
      return readoutHead() +
        '<div class="z2C">' + t({ zh: '目标', en: 'Target' }) + ' w = <b>' + fmt(wm) + '</b> ∠ ' + dw + '°</div>' +
        '<div class="wC">' + t({ zh: '根半径', en: 'Root radius' }) + ' |z| = |w|^(1/n) = <b>' + fmt(R) + '</b>&ensp;·&ensp;' + t({ zh: '共 ', en: '' }) + '<b>' + n + '</b>' + t({ zh: ' 个根', en: ' roots' }) + '</div>' +
        '<div class="dim">' + t({ zh: '相邻根夹角 2π/n = ' + (360 / n).toFixed(0) + '°，构成正 ' + n + ' 边形', en: 'adjacent roots 2π/n = ' + (360 / n).toFixed(0) + '°, forming a regular ' + n + '-gon' }) + '</div>';
    }
  },

  /* ────── 页签六：复数轨迹（阿甘图中的距离/角度/旋转约束） ────── */
  loci: {
    label: { zh: '复数轨迹', en: 'Complex loci' },
    params: ['omega', 'locusType', 'aRe', 'aIm', 'bRe', 'bIm', 'rLoc', 'thLoc', 'kLoc'],
    brand: { zh: '阿甘图中的复数方程：|z−a|=r 是圆、|z−a|=|z−b| 是中垂线、arg(z−a)=θ 是射线、|(z−a)/(z−b)|=k 是阿波罗尼斯圆。拖动 a、b、r、θ、k，看代数条件如何雕出几何图形。',
             en: 'Complex equations on the Argand diagram: |z−a|=r is a circle, |z−a|=|z−b| a perpendicular bisector, arg(z−a)=θ a ray, |(z−a)/(z−b)|=k an Apollonius circle. Drag a, b, r, θ, k and watch the algebra carve out geometry.' },
    tips: { zh: '提示：切换「轨迹类型」并切到「正视 复平面」——复数方程不是纯代数条件，而是在平面中施加距离、角度和旋转约束；把 k 调到 1，阿波罗尼斯圆退化为中垂线。',
            en: 'Tip: switch "Locus type" and view "Front: complex plane" — a complex equation is not a purely algebraic condition but a distance / angle / rotation constraint imposed on the plane; set k to 1 and the Apollonius circle degenerates into the perpendicular bisector.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },                   az: -0.7,  el: 0.35, dist: 8.6, tx: 0, ty: 0.05, tz: 0 },
      front: { label: { zh: '正视 复平面', en: 'Front: complex plane' }, az: 0.001, el: 0.02, dist: 7.6, tx: 0, ty: 0,    tz: 0 }
    },
    toggles: [
      { key: 'showLocus',  label: { zh: '轨迹曲线', en: 'Locus' },        color: '#34d399', checked: true },
      { key: 'showA',      label: { zh: '定点 <i>a</i>', en: 'Point <i>a</i>' }, color: '#a78bfa', checked: true },
      { key: 'showB',      label: { zh: '定点 <i>b</i>', en: 'Point <i>b</i>' }, color: '#fb923c', checked: true },
      { key: 'showGuides', label: { zh: '约束度量辅助', en: 'Constraint guides' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },            color: '#64748b', checked: true }
    ],
    draw(C) {
      const lt = Math.round(state.locusType);
      const a = [state.aRe, state.aIm], b = [state.bRe, state.bIm];
      const r = state.rLoc, th = state.thLoc, k = state.kLoc, ph = state.theta;
      if (state.showGrid) drawGridXY(C, 3, 0.5);
      cplxAxes(C, { ex: 3.1, ey: 2.8 });

      const drawPt = (P, color, name, show) => {
        if (!show) return;
        solidDot(C, [P[0],P[1],0], 4, color);
        const p = proj(C, [P[0],P[1],0]); if (p) glowDot(p, 8, '#ffffff', hexA(color, 0.8));
        label3(C, [P[0],P[1],0], name, { font: 'italic 13px ' + FONT_MATH, color: color, align: 'left', dx: 9, dy: -6 });
      };
      const circlePts = (cx, cy, rad) => { const c = []; for (let i = 0; i <= 72; i++) { const g = i/72*TAU; c.push([cx+rad*Math.cos(g), cy+rad*Math.sin(g), 0]); } return c; };
      const strokeLocus = pts => { strokePoly(C, pts, { width: 5, color: hexA(C_W, 0.13) }); strokePoly(C, pts, { width: 2.2, color: hexA(C_W, 0.9) }); };
      let z = null;

      if (lt === 0) {                                   /* |z−a| = r：圆 */
        if (state.showLocus) strokeLocus(circlePts(a[0], a[1], r));
        z = [a[0] + r*Math.cos(ph), a[1] + r*Math.sin(ph)];
        drawPt(a, C_Z2, 'a', state.showA);
        if (state.showGuides && z) {
          line3(C, [a[0],a[1],0], [z[0],z[1],0], { width: 1.5, dash: [6,6], color: 'rgba(251,191,36,0.9)' });
          label3(C, [(a[0]+z[0])/2, (a[1]+z[1])/2, 0], 'r', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 4, dy: -4 });
        }
      } else if (lt === 1) {                            /* |z−a| = |z−b|：中垂线 */
        const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
        const dir = [b[0]-a[0], b[1]-a[1]], len = Math.hypot(dir[0],dir[1]) || 1;
        const perp = [-dir[1]/len, dir[0]/len], L = 7;
        if (state.showLocus) strokeLocus([[mid[0]-perp[0]*L, mid[1]-perp[1]*L, 0], [mid[0]+perp[0]*L, mid[1]+perp[1]*L, 0]]);
        line3(C, [a[0],a[1],0], [b[0],b[1],0], { width: 1.3, dash: [5,6], color: 'rgba(159,176,200,0.5)' });
        z = [mid[0] + perp[0]*2*Math.sin(ph), mid[1] + perp[1]*2*Math.sin(ph)];
        drawPt(a, C_Z2, 'a', state.showA); drawPt(b, C_O, 'b', state.showB);
        if (state.showGuides && z) {
          line3(C, [a[0],a[1],0], [z[0],z[1],0], { width: 1.5, dash: [6,6], color: hexA(C_Z2, 0.8) });
          line3(C, [b[0],b[1],0], [z[0],z[1],0], { width: 1.5, dash: [6,6], color: hexA(C_O, 0.8) });
        }
      } else if (lt === 2) {                            /* arg(z−a) = θ：射线 */
        const dir = [Math.cos(th), Math.sin(th)], L = 7;
        if (state.showLocus) {
          strokePoly(C, [[a[0],a[1],0], [a[0]+dir[0]*L, a[1]+dir[1]*L, 0]], { width: 5, color: hexA(C_W, 0.13) });
          strokePoly(C, [[a[0],a[1],0], [a[0]+dir[0]*L, a[1]+dir[1]*L, 0]], { width: 2.2, color: hexA(C_W, 0.9) });
        }
        const tt = 1.4 + 1.1 * (0.5 + 0.5 * Math.sin(ph));
        z = [a[0] + dir[0]*tt, a[1] + dir[1]*tt];
        drawPt(a, C_Z2, 'a', state.showA);
        if (state.showGuides) {
          const thm = mod2pi(th), n2 = Math.max(2, Math.ceil(thm / 0.06)), arc = [];
          for (let j = 0; j <= n2; j++) { const g = thm * j / n2; arc.push([a[0]+0.5*Math.cos(g), a[1]+0.5*Math.sin(g), 0]); }
          strokePoly(C, arc, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
          line3(C, [a[0],a[1],0], [a[0]+0.9, a[1], 0], { width: 1, dash: [4,5], color: 'rgba(159,176,200,0.5)' });
          label3(C, [a[0]+0.64*Math.cos(thm/2), a[1]+0.64*Math.sin(thm/2), 0], 'θ', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        }
      } else {                                          /* |(z−a)/(z−b)| = k：阿波罗尼斯圆 */
        drawPt(a, C_Z2, 'a', state.showA); drawPt(b, C_O, 'b', state.showB);
        if (Math.abs(k - 1) < 0.02) {                   /* k=1 退化为中垂线 */
          const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
          const dir = [b[0]-a[0], b[1]-a[1]], len = Math.hypot(dir[0],dir[1]) || 1;
          const perp = [-dir[1]/len, dir[0]/len], L = 7;
          if (state.showLocus) strokeLocus([[mid[0]-perp[0]*L, mid[1]-perp[1]*L, 0], [mid[0]+perp[0]*L, mid[1]+perp[1]*L, 0]]);
          z = [mid[0] + perp[0]*2*Math.sin(ph), mid[1] + perp[1]*2*Math.sin(ph)];
        } else {
          const k2 = k*k;
          const cen = [(a[0]-k2*b[0])/(1-k2), (a[1]-k2*b[1])/(1-k2)];
          const rad = k * Math.hypot(a[0]-b[0], a[1]-b[1]) / Math.abs(1-k2);
          if (state.showLocus) strokeLocus(circlePts(cen[0], cen[1], rad));
          z = [cen[0] + rad*Math.cos(ph), cen[1] + rad*Math.sin(ph)];
        }
        if (state.showGuides && z) {
          line3(C, [a[0],a[1],0], [z[0],z[1],0], { width: 1.5, dash: [6,6], color: hexA(C_Z2, 0.8) });
          line3(C, [b[0],b[1],0], [z[0],z[1],0], { width: 1.5, dash: [6,6], color: hexA(C_O, 0.8) });
        }
      }

      if (z) {
        const p = proj(C, [z[0],z[1],0]);
        if (p) glowDot(p, 10, '#ffffff', hexA(C_W, 0.9));
        solidDot(C, [z[0],z[1],0], 3, '#ffffff');
        label3(C, [z[0],z[1],0], 'z', { font: 'italic 12px ' + FONT_MATH, color: C_W, align: 'left', dx: 8, dy: -6 });
      }
      solidDot(C, [0,0,0], 2.2, 'rgba(159,176,200,0.9)');

      const flabel = ['|z − a| = r', '|z − a| = |z − b|', 'arg(z − a) = θ', '|(z − a)/(z − b)| = k'][lt];
      label3(C, [-3.0, 2.55, 0], flabel, { font: 'italic 13px ' + FONT_MATH, color: '#e8eef7', align: 'left' });
    },
    readout() {
      const lt = Math.round(state.locusType);
      const a = [state.aRe, state.aIm], b = [state.bRe, state.bIm];
      const names = [
        { zh: '圆：到定点 a 的距离恒为 r', en: 'Circle: distance to a is constant r' },
        { zh: '中垂线：到 a、b 距离相等', en: 'Bisector: equal distance to a and b' },
        { zh: '射线：从 a 出发方向角恒为 θ', en: 'Ray: fixed direction angle θ from a' },
        { zh: '阿波罗尼斯圆：到 a、b 距离比恒为 k', en: 'Apollonius: distance ratio to a, b is constant k' }
      ];
      let extra;
      if (lt === 0) extra = 'r = <b>' + fmt(state.rLoc) + '</b>';
      else if (lt === 2) extra = 'θ = <b>' + (state.thLoc * 180 / Math.PI).toFixed(0) + '°</b>';
      else if (lt === 3) extra = 'k = <b>' + fmt(state.kLoc) + '</b>' + (Math.abs(state.kLoc - 1) < 0.02 ? t({ zh: '（→ 退化为中垂线）', en: ' (→ bisector)' }) : '');
      else extra = '|ab| = <b>' + fmt(Math.hypot(a[0]-b[0], a[1]-b[1])) + '</b>';
      return readoutHead() +
        '<div class="wC">' + t(names[lt]) + '</div>' +
        '<div class="z2C">a = <b>' + cfmt(a[0], a[1]) + '</b></div>' +
        ((lt === 1 || lt === 3) ? '<div class="oC">b = <b>' + cfmt(b[0], b[1]) + '</b></div>' : '') +
        '<div class="dim">' + extra + '&ensp;·&ensp;' + t({ zh: '代数条件 → 平面几何轨迹', en: 'algebraic condition → geometric locus' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const r1 = state.r1, r2 = state.r2, p2 = state.phi2, th = state.theta;
  const rw = r1 * r2, aw = th + p2;
  samples.push({
    t: state.t, th: th,
    x1: r1 * Math.cos(th), y1: r1 * Math.sin(th),   /* 输入 z₁ 的当时真实坐标 */
    xw: rw * Math.cos(aw), yw: rw * Math.sin(aw)    /* 乘积 z₁z₂ 的当时真实坐标 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
