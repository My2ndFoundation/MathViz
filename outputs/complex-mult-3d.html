<!-- ============================================================
  复数乘法的本质 · 交互式数学可视化
  基于 math-viz-starter.html v1.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）

  核心「顿悟」：两个复数 z₁·z₂ 相乘 = 幅角相加 + 模长相乘 = 「旋转 + 伸缩」。
  三个页签共享同一份运动（z₁ 匀速旋转、z₂ 为固定「算子」）：
    旋转伸缩 —— 复平面上三支向量 z₁·z₂·z₁z₂，乘积恒领先 φ₂、恒为 r₂ 倍
                顿悟视角：「正视 复平面」看清锁定的夹角 φ₂ 与长度比 r₂
    螺旋展开 —— 旋转沿时间轴展开为两条螺旋，乘 z₂ = 放大半径 + 沿时平移
                顿悟视角：「侧视 y·t」两条正弦：相位差 = φ₂、振幅比 = r₂
    反复相乘 —— 反复乘 z₂，各次幂 z₂ⁿ 排成对数螺旋（等角 + 等比）
                顿悟视角：「正视 复平面」；把 r₂ 调到 1 即得单位根

  制作新工具只需修改三处（均在脚本区顶部，以 ①②③ 标记）：
    ① PARAMS      —— 声明滑杆参数（自动生成 UI）
    ② SCENES      —— 注册场景页签（brand / tips / views / toggles / draw / readout）
    ③ pushSample  —— 按需扩展采样字段（原则：记录当时的真实值）
  引擎区（相机 / 投影 / 绘制部件 / 交互 / 主循环）一般无需改动。
============================================================ -->

  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}

/* 按钮 */

  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;

<body>

<canvas id="scene"></canvas>

<div class="brand">
  <div class="eyebrow">INTERACTIVE MATH · 交互式数学</div>
  <h1>复数乘法的本质</h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<aside class="panel" id="panel">
  <div class="panel-head"><span>参数与视角</span><button class="fold" id="btnFold" title="收起 / 展开">−</button></div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div class="row">
      <button class="btn wide" id="btnPlay">⏸ 暂停</button>
      <button class="btn" id="btnReset">↺ 重置</button>
    </div>
    <div id="togglesHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="tips" id="tips"></div>
  </div>
</aside>

<div class="hint">拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签</div>

<script>
'use strict';
/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'r1',        label: '输入模长 |<i>z</i>₁|', min: 0.3, max: 1.5, step: 0.05, value: 1,    fmt: v => fmt(v) },
  { key: 'r2',        label: '乘数模长 |<i>z</i>₂|', min: 0.4, max: 1.6, step: 0.05, value: 1.2,  fmt: v => fmt(v) },
  { key: 'phi2',      label: '乘数幅角 <i>φ</i>₂',   min: 0,   max: 2,   step: 0.02, value: 0.33, fmt: v => fmt(v) + ' π (' + (v * 180).toFixed(0) + '°)', map: v => v * Math.PI },
  { key: 'omega',     label: '旋转速度 <i>ω</i>',    min: 0.2, max: 3,   step: 0.05, value: 0.8,  fmt: v => fmt(v) + ' rad/s' },
  { key: 'waveSpeed', label: '螺旋展开速度',          min: 0.5, max: 2.5, step: 0.05, value: 1.2,  fmt: v => fmt(v) + ' 单位/s' }
];

/* ── 复数乘法工具：颜色语义与场景小部件 ──
   z₁ 玫红（输入·第一主曲线）· z₂ 紫（乘数/算子·第二曲线）· 乘积 z₁z₂ 翠绿（第三曲线）
   三支主角在所有页签保持同一身份色，实现「一对象一色·六处同源」的跨页签一致性 */
const C_Z1 = '#fb7185';
const C_Z2 = '#a78bfa';
const C_W  = '#34d399';
const AMB  = 'rgba(251,191,36,0.9)';
const SUP  = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup  = n => String(n).split('').map(d => SUP[+d]).join('');
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')';

/* 复数写作 a + b i（实部负号用 U+2212） */
function cfmt(x, y) { return fmtS(x) + ' ' + (y < 0 ? '−' : '+') + ' ' + fmt(Math.abs(y)) + ' i'; }

/* 复平面坐标轴（Re / Im，可选时间轴 t）：o = { ex, ey, tAxis, v } */
function cplxAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex,0,0], [ex,0,0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex,0,0], [ex-0.2,0,0], AXIS);
  label3(C, [ex+0.3,0,0], 'Re', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0,-ey,0], [0,ey,0], { width: 1.4, color: AXIS });
  arrowAt(C, [0,ey,0], [0,ey-0.2,0], AXIS);
  label3(C, [0,ey+0.22,0], 'Im', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const xv of [1,-1]) {
    line3(C, [xv,-0.05,0], [xv,0.05,0], { width: 1.2, color: AXIS_DIM });
    label3(C, [xv,-0.24,0], xv < 0 ? '−1' : '1', { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  }
  for (const yv of [1,-1]) {
    line3(C, [-0.05,yv,0], [0.05,yv,0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.16,yv,0], yv < 0 ? '−i' : 'i', { font: 'italic 12px ' + FONT_MATH, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
  if (o.tAxis) {
    line3(C, [0,0,0], [0,0,WAVE_LEN+0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0,0,WAVE_LEN+0.5], [0,0,WAVE_LEN+0.3], AXIS);
    label3(C, [0,0,WAVE_LEN+0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1, every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0,-0.06,k*v], [0,0.06,k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) label3(C, [0,-0.25,k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* 从原点出发的向量（主体线 + 箭头） */
function vec(C, x, y, color, o) {
  o = o || {};
  line3(C, [0,0,0], [x,y,0], { width: o.width || 2, color: color });
  arrowAt(C, [x,y,0], [x*0.86, y*0.86, 0], color);
}

/* 半径 R 的圆（z=0 平面，可虚线） */
function ring(C, R, color, dash) {
  const p = [];
  for (let i = 0; i <= 72; i++) { const a = i/72*TAU; p.push([R*Math.cos(a), R*Math.sin(a), 0]); }
  strokePoly(C, p, { width: 1.2, color: color, dash: dash });
}

/* 角度扇弧 a1→a2（半径 r0，琥珀度量），标注置于中点外侧 */
function arcSpan(C, a1, a2, r0, label, color) {
  const d = a2 - a1;
  if (Math.abs(d) < 0.02) return;
  const n = Math.max(2, Math.ceil(Math.abs(d)/0.06));
  const p = [];
  for (let j = 0; j <= n; j++) { const a = a1 + d*j/n; p.push([r0*Math.cos(a), r0*Math.sin(a), 0]); }
  strokePoly(C, p, { width: 1.6, color: color });
  if (label) {
    const am = a1 + d/2;
    label3(C, [(r0+0.16)*Math.cos(am), (r0+0.16)*Math.sin(am), 0], label,
      { font: 'italic 12px ' + FONT_MATH, color: color, align: 'center' });
  }
}

/* 乘方页：在界内的整数幂个数 N（模长落在 [0.03, 2.6]，上限 8） */
function powCount() {
  const r2 = state.r2; let N = 0;
  for (let k = 1; k <= 8; k++) { const R = Math.pow(r2, k); if (R > 2.6 || R < 0.03) break; N = k; }
  return Math.max(1, N);
}
/* 随主时钟沿对数螺旋往返走动的连续幂次 p（主时钟每转一圈 = 再乘一次 z₂） */
function powShow() {
  const N = powCount(), per = 2*N;
  let pp = (state.theta / TAU) % per; if (pp < 0) pp += per;
  return pp <= N ? pp : per - pp;
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 页签一：旋转伸缩（复数乘法的本质） ────── */
  mult: {
    label: '旋转伸缩',
    brand: '两个复数相乘 z₁·z₂：乘积的幅角是两者幅角之和、模长是两者模长之积——等价于把 z₁ 旋转 φ₂、再伸缩 r₂ 倍。让 z₁ 匀速转动，看乘积（翠绿）始终领先 φ₂、长度恒为 r₂ 倍。',
    tips: '提示：切到「正视 复平面」——无论 z₁（玫红）转到哪，乘积 z₁z₂（翠绿）与它始终锁定同一夹角 φ₂、长度比恒为 r₂。两段琥珀弧演示幅角如何「叠加」：从 z₁ 的角再加 φ₂，正好落到乘积上。',
    views: {
      iso:   { label: '立体',       az: -0.7,  el: 0.35, dist: 7.2, tx: 0, ty: 0.1, tz: 0 },
      front: { label: '正视 复平面', az: 0.001, el: 0.02, dist: 6.2, tx: 0, ty: 0,   tz: 0 }
    },
    toggles: [
      { key: 'showZ1',     label: '输入 <i>z</i>₁',        color: '#fb7185', checked: true },
      { key: 'showZ2',     label: '乘数 <i>z</i>₂',        color: '#a78bfa', checked: true },
      { key: 'showW',      label: '乘积 <i>z</i>₁<i>z</i>₂', color: '#34d399', checked: true },
      { key: 'showGuides', label: '幅角/投影辅助',          color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: '网格',                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.waveSpeed + 0.5,
    draw(C) {
      const r1 = state.r1, r2 = state.r2, p2 = state.phi2, th = state.theta;
      const rw = r1 * r2, aw = th + p2;
      const z1 = [r1*Math.cos(th), r1*Math.sin(th)];
      const z2 = [r2*Math.cos(p2), r2*Math.sin(p2)];
      const w  = [rw*Math.cos(aw), rw*Math.sin(aw)];

      if (state.showGrid) drawGridXY(C, 2, 0.5);
      cplxAxes(C, { ex: 2.6, ey: 2.2, tAxis: false });
      drawCircle(C, 1);                                    /* 青色单位圆（源几何） */
      if (state.showZ1) ring(C, r1, hexA(C_Z1, 0.32), [5,6]);  /* z₁ 轨迹圆 */
      if (state.showW)  ring(C, rw, hexA(C_W, 0.32), [5,6]);   /* 乘积轨迹圆（半径 r₁r₂） */

      /* 幅角叠加：0→θ（arg z₁），再 θ→θ+φ₂（加上 arg z₂，正好落到乘积）
         用 mod2pi 归一，避免 θ 累积后弧线绕圈、点数无界 */
      if (state.showGuides) {
        const thm = mod2pi(th);
        arcSpan(C, 0, thm, 0.5, 'φ₁', 'rgba(251,191,36,0.85)');
        arcSpan(C, thm, thm + p2, 0.68, '+φ₂', 'rgba(251,191,36,0.95)');
      }

      /* 乘积分量投影虚线（六处同源之一：翠绿） */
      if (state.showGuides && state.showW) {
        line3(C, [w[0],w[1],0], [w[0],0,0], { width: 1.4, dash: [7,7], color: hexA(C_W, 0.6) });
        line3(C, [w[0],w[1],0], [0,w[1],0], { width: 1.4, dash: [7,7], color: hexA(C_W, 0.6) });
      }

      /* 三支向量 */

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const r1 = state.r1, r2 = state.r2, p2 = state.phi2, th = state.theta;
  const rw = r1 * r2, aw = th + p2;
  samples.push({
    t: state.t, th: th,
    x1: r1 * Math.cos(th), y1: r1 * Math.sin(th),   /* 输入 z₁ 的当时真实坐标 */
    xw: rw * Math.cos(aw), yw: rw * Math.sin(aw)    /* 乘积 z₁z₂ 的当时真实坐标 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">≡ ' + (mod2pi(th) * 180 / Math.PI).toFixed(0) + '°（第 ' + fmt(th / TAU) + ' 圈）</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label>' + p.label + '</label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    upd();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i>' + tg.label;
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    lab.textContent = '视角';
    row.appendChild(lab);
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.textContent = SCENES[id].views[name].label;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.textContent = SCENES[id].label;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = SCENES[id].brand;
  tipsEl.textContent = SCENES[id].tips;
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? '⏸ 暂停' : '▶ 继续';
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
