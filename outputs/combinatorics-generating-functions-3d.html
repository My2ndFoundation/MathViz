<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'combinatorics-generating-functions-3d',
  title: { zh: '组合计数与生成函数', en: 'Combinatorics & Generating Functions' },
  h1:    { zh: '组合计数与生成函数', en: 'Generating Functions' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'mA',      label: { zh: '集合 A 大小 <i>m</i>', en: 'Set A size <i>m</i>' },     min: 1,   max: 5,  step: 1,    value: 3,   fmt: v => v.toFixed(0) },
  { key: 'nB',      label: { zh: '集合 B 大小 <i>n</i>', en: 'Set B size <i>n</i>' },     min: 1,   max: 5,  step: 1,    value: 4,   fmt: v => v.toFixed(0) },
  { key: 'preset',  label: { zh: '多项式预设',           en: 'Polynomial preset' },       min: 1,   max: 3,  step: 1,    value: 1,   fmt: v => PRESETS[Math.round(v) - 1].str },
  { key: 'kTarget', label: { zh: '目标次数 <i>k</i>',    en: 'Target degree <i>k</i>' },  min: 0,   max: 5,  step: 1,    value: 3,   fmt: v => 'x' + SUP[Math.round(v)] },
  { key: 'shift',   label: { zh: '滑动位置 <i>s</i>',    en: 'Slide position <i>s</i>' }, min: 0,   max: 5,  step: 0.05, value: 2,   fmt: v => fmt(v) },
  { key: 'nLen',    label: { zh: '展示项数 <i>N</i>',    en: 'Terms shown <i>N</i>' },    min: 4,   max: 12, step: 1,    value: 9,   fmt: v => v.toFixed(0) },
  { key: 'omega',   label: { zh: '演示速度 <i>ω</i>',    en: 'Demo speed <i>ω</i>' },     min: 0.2, max: 4,  step: 0.05, value: 1.2, fmt: v => fmt(v) + ' rad/s' }
];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：生成函数与绘图助手（引擎之上，引擎零改动） ────── */
const SUP = ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹', '¹⁰', '¹¹', '¹²'];
const SUBD = ['₀', '₁', '₂', '₃', '₄', '₅', '₆', '₇', '₈', '₉'];
const subN = n => String(n).split('').map(d => SUBD[+d]).join('');
const ROSE_A = 'rgba(251,113,133,';
const VIO_A  = 'rgba(167,139,250,';
const EME_A  = 'rgba(52,211,153,';
const CYAN_A = 'rgba(45,212,234,';
const AMB_A  = 'rgba(251,191,36,';

function xPow(k) { return k === 0 ? '1' : (k === 1 ? 'x' : 'x' + SUP[k]); }
/* 系数数组 → '1+2x+3x²' 显示串 */
function polyStr(c) {
  const parts = [];
  for (let k = 0; k < c.length; k++) {
    if (!c[k]) continue;
    parts.push(k === 0 ? String(c[k]) : (c[k] === 1 ? xPow(k) : c[k] + xPow(k)));
  }
  return parts.length ? parts.join('+') : '0';
}
/* 多项式乘法 = 系数卷积：c[k] = Σ a[i]·b[k−i]（本工具全部数学的核心） */
function polyMul(a, b) {
  const c = new Array(a.length + b.length - 1).fill(0);
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) c[i + j] += a[i] * b[j];
  return c;
}
/* 多项式预设：A(x)·B(x) —— 两个独立选择集合的编码 */
const PRESETS = [
  { a: [1, 1, 1],    b: [1, 0, 0, 1], str: '(1+x+x²)(1+x³)' },
  { a: [1, 1, 1, 1], b: [1, 1, 1],    str: '(1+x+x²+x³)(1+x+x²)' },
  { a: [1, 2, 1],    b: [1, 2, 1],    str: '(1+x)²·(1+x)²' }
];
const curPreset = () => PRESETS[Math.round(state.preset) - 1];
const sumArr = a => a.reduce((s, v) => s + v, 0);

/* Fibonacci：F₀=0, F₁=1 —— 生成函数 F(x)=x/(1−x−x²) 的系数 */
const FIB = [0, 1];
for (let i = 2; i <= 14; i++) FIB[i] = FIB[i - 1] + FIB[i - 2];

/* 投影填充四边形（场景级部件；任一顶点越过近裁剪面则整体放弃） */
function fillQuad(C, pts, color) {
  const s = [];
  for (const p of pts) { const q = proj(C, p); if (!q) return; s.push(q); }
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s[0][0], s[0][1]);
  for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
/* 竖直条：中心 x、底 y0、高 h、半宽 hw、深 z */
function drawBar(C, x, y0, h, hw, z, fill, edge) {
  const q = [[x - hw, y0, z], [x + hw, y0, z], [x + hw, y0 + h, z], [x - hw, y0 + h, z]];
  fillQuad(C, q, fill);
  strokePoly(C, q.concat([q[0]]), { width: 1.3, color: edge });
}
/* 视角联动：选中某视角时自动开启其内容开关（同步全部页签的同名 checkbox） */
function forceToggle(key) {
  if (state[key]) return;
  state[key] = true;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = true; });
}

const SCENES = {

  /* ────── 一：计数原则 —— 相加是合并，相乘是配对 ────── */
  rules: {
    label: { zh: '计数原则', en: 'Counting rules' },
    params: ['mA', 'nB', 'omega'],
    brand: { zh: '一切计数从两条原则出发：互斥的选择相加，独立的先后选择相乘。左边看两个集合怎样合并接龙，右边看配对怎样铺成 m×n 的点阵。',
             en: 'All counting rests on two principles: exclusive choices add, independent successive choices multiply. Watch two sets merge end-to-end on the left, and pairs tile an m×n lattice on the right.' },
    tips: { zh: '提示：切「正视 x·y」直接数——点阵恰有 m×n 个交点，每个交点就是一种 (aᵢ, bⱼ) 配对。这就是乘法原则，也是多项式相乘时每一对单项式相乘的原型。',
            en: 'Tip: switch to "Front x·y" and just count — the lattice has exactly m×n dots, one per pair (aᵢ, bⱼ). That is the multiplication principle, and it is precisely what each pair of monomials does when polynomials multiply.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.65, el: 0.32, dist: 11, tx: -0.8, ty: 0.5, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 9,  tx: -0.8, ty: 0.5, tz: 0 }
    },
    toggles: [
      { key: 'showPairs', label: { zh: '配对点阵 m×n', en: 'Pair lattice m×n' }, color: '#fb7185', checked: true },
      { key: 'showMerge', label: { zh: '集合合并 m+n', en: 'Merged set m+n' },   color: '#a78bfa', checked: true },
      { key: 'showWalk',  label: { zh: '遍历配对动画', en: 'Pair walker' },      color: '#34d399', checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' },                     color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const m = Math.round(state.mA), n = Math.round(state.nB), tot = m * n;
      const gap = 0.62, gx0 = 0.9, gy0 = 0.1;
      const ax = i => gx0 + i * gap, by = j => gy0 + j * gap;
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* — 右：乘法原则 —— 笛卡尔积点阵 — */
      if (state.showPairs) {
        for (let i = 0; i < m; i++) {
          line3(C, [ax(i), gy0 - 0.55, 0], [ax(i), by(n - 1) + 0.25, 0], { width: 1, color: VIO_A + '0.18)' });
          const s = proj(C, [ax(i), gy0 - 0.8, 0]);
          if (s) glowDot(s, 7, '#ffffff', VIO_A + '0.85)');
          label3(C, [ax(i), gy0 - 1.05, 0], 'a' + subN(i + 1), { font: 'italic 11px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
        }
        for (let j = 0; j < n; j++) {
          line3(C, [gx0 - 0.55, by(j), 0], [ax(m - 1) + 0.25, by(j), 0], { width: 1, color: EME_A + '0.18)' });
          const s = proj(C, [gx0 - 0.8, by(j), 0]);
          if (s) glowDot(s, 7, '#ffffff', EME_A + '0.85)');
          label3(C, [gx0 - 1.05, by(j), 0], 'b' + subN(j + 1), { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'right' });
        }
        for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) solidDot(C, [ax(i), by(j), 0], 2.4, ROSE_A + '0.85)');
        label3(C, [(ax(0) + ax(m - 1)) / 2, by(n - 1) + 0.62, 0],
          t({ zh: '乘法原则 · 笛卡尔积 A × B', en: 'Multiplication · Cartesian product A × B' }),
          { size: 11, color: 'rgba(159,176,200,.75)', align: 'center' });
        label3(C, [(ax(0) + ax(m - 1)) / 2, gy0 - 1.48, 0],
          t({ zh: '先 A 再 B：m × n = ' + tot + ' 种', en: 'A then B: m × n = ' + tot + ' ways' }),
          { size: 11, color: AMB_A + '0.9)', align: 'center' });
      }

      /* — 左：加法原则 —— 两个互斥集合并排接龙 — */
      if (state.showMerge) {
        const xA = -5.1, xM = -3.4, step = 0.4, yTopA = 1.9;
        const yTopB = yTopA - m * step - 0.35;
        for (let i = 0; i < m; i++) {
          const y = yTopA - i * step;
          line3(C, [xA + 0.12, y, 0], [xM - 0.12, yTopA - i * step, 0], { width: 1, color: 'rgba(148,163,184,0.25)' });
          const s = proj(C, [xA, y, 0]);
          if (s) glowDot(s, 6.5, '#ffffff', VIO_A + '0.85)');
        }
        for (let j = 0; j < n; j++) {
          const y = yTopB - j * step;
          line3(C, [xA + 0.12, y, 0], [xM - 0.12, yTopA - (m + j) * step, 0], { width: 1, color: 'rgba(148,163,184,0.25)' });
          const s = proj(C, [xA, y, 0]);
          if (s) glowDot(s, 6.5, '#ffffff', EME_A + '0.85)');
        }
        for (let k = 0; k < m + n; k++) solidDot(C, [xM, yTopA - k * step, 0], 2.4, ROSE_A + '0.85)');
        label3(C, [xA + 0.35, yTopA + 0.42, 0],
          t({ zh: '加法原则 · 互斥合并 A ∪ B', en: 'Addition · disjoint union A ∪ B' }),
          { size: 11, color: 'rgba(159,176,200,.75)', align: 'center' });
        label3(C, [xM + 0.28, yTopA - (m + n - 1) * step / 2, 0],
          t({ zh: 'A 或 B：m + n = ' + (m + n) + ' 种', en: 'A or B: m + n = ' + (m + n) + ' ways' }),
          { size: 11, color: AMB_A + '0.9)', align: 'left' });
        label3(C, [xA, yTopA - m * step - 0.12, 0], 'A', { font: 'italic 11px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
        label3(C, [xA, yTopB - n * step - 0.02, 0], 'B', { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'center' });
      }

      /* — 遍历动画：主点逐一走过每个配对（θ 驱动，暂停即冻结） — */
      if (state.showWalk && state.showPairs) {
        const idx = Math.floor(state.theta / Math.PI) % tot;
        const i = idx % m, j = Math.floor(idx / m);
        line3(C, [ax(i), by(j), 0], [ax(i), gy0 - 0.8, 0], { width: 1.5, dash: [7, 7], color: VIO_A + '0.8)' });
        line3(C, [ax(i), by(j), 0], [gx0 - 0.8, by(j), 0], { width: 1.5, dash: [7, 7], color: EME_A + '0.8)' });
        const s = proj(C, [ax(i), by(j), 0]);
        if (s) glowDot(s, 14, '#ffffff', 'rgba(186,240,255,0.9)');
        label3(C, [ax(i) + 0.18, by(j) + 0.22, 0], '(a' + subN(i + 1) + ', b' + subN(j + 1) + ')',
          { font: 'italic 11px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      }
    },
    readout() {
      const m = Math.round(state.mA), n = Math.round(state.nB), tot = m * n;
      const idx = Math.floor(state.theta / Math.PI) % tot;
      const i = idx % m, j = Math.floor(idx / m);
      return '<div>|A| = <b>' + m + '</b>&ensp;·&ensp;|B| = <b>' + n + '</b></div>' +
        '<div class="cosC">' + t({ zh: '加法（二选一）', en: 'addition (either/or)' }) + '：m + n = <b>' + (m + n) + '</b></div>' +
        '<div class="sinC">' + t({ zh: '乘法（先后各选）', en: 'multiplication (both, in turn)' }) + '：m × n = <b>' + tot + '</b></div>' +
        '<div class="tanC">' + t({ zh: '当前配对', en: 'current pair' }) + ' #<b>' + (idx + 1) + '</b>/' + tot + ' · (a' + subN(i + 1) + ', b' + subN(j + 1) + ')</div>' +
        '<div class="dim">' + t({ zh: '点阵的每个交点 = 一种组合方案', en: 'each lattice point = one combined choice' }) + '</div>';
    }
  },

  /* ────── 二：系数即计数 —— xᵏ 记总量，系数记方法数 ────── */
  coeff: {
    label: { zh: '系数即计数', en: 'Coefficients count' },
    params: ['preset', 'kTarget'],
    brand: { zh: '把每种选择编码成 xᵏ——指数 k 是它贡献的总量；多项式一相乘，系数 cₖ 自动数出「总量恰为 k」的方案数。拖动 k 高亮全部来源。',
             en: 'Encode each choice as xᵏ, where the exponent k is the amount it contributes; multiply the polynomials and the coefficient cₖ automatically counts the ways to reach total k. Drag k to highlight every source.' },
    tips: { zh: '提示：切「正视 k·y」拖动目标次数 k——所有满足 i+j=k 的连线汇聚到同一根玫红柱上：系数不是别的，就是方法数。换预设 3 看 (1+x)²·(1+x)² 如何长出 Pascal 行 1 4 6 4 1。',
            en: 'Tip: in "Front k·y" drag the target degree k — every link with i+j=k converges on the same rose bar: the coefficient is nothing but a count of ways. Try preset 3 to watch (1+x)²·(1+x)² grow the Pascal row 1 4 6 4 1.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.6,        el: 0.3,  dist: 10.5, tx: 0, ty: 1, tz: 1.2 },
      front: { label: { zh: '正视 k·y', en: 'Front k·y' },   az: 0.001,       el: 0.02, dist: 8.5,  tx: 0, ty: 1, tz: 0,
               onSelect: () => forceToggle('showSources') },
      side:  { label: { zh: '侧视 层级', en: 'Side layers' }, az: -Math.PI / 2, el: 0.02, dist: 9.5,  tx: 0, ty: 1, tz: 1.2 }
    },
    toggles: [
      { key: 'showProd',    label: { zh: '乘积系数 cₖ', en: 'Product cₖ' },        color: '#fb7185', checked: true },
      { key: 'showFactorA', label: { zh: 'A(x) 系数', en: 'A(x) coefficients' },   color: '#a78bfa', checked: true },
      { key: 'showFactorB', label: { zh: 'B(x) 系数', en: 'B(x) coefficients' },   color: '#34d399', checked: true },
      { key: 'showSources', label: { zh: '来源连线 i+j=k', en: 'Sources i+j=k' },  color: '#fbbf24', checked: true },
      { key: 'showGrid',    label: { zh: '网格', en: 'Grid' },                     color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const P = curPreset(), a = P.a, b = P.b, c = polyMul(a, b);
      const degC = c.length - 1, dx = 0.78, hu = 0.42;
      const xk = k => (k - degC / 2) * dx;
      const hw = Math.min(0.17, dx * 0.3);
      const kk = Math.min(Math.round(state.kTarget), degC);
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 两个因子行（由远到近：A 紫 → B 翠绿） */
      const rows = [
        { z: 2.6, co: a, col: VIO_A, hex: '#a78bfa', show: state.showFactorA, name: 'A(x) = ' + polyStr(a) },
        { z: 1.3, co: b, col: EME_A, hex: '#34d399', show: state.showFactorB, name: 'B(x) = ' + polyStr(b) }
      ];
      for (const r of rows) {
        if (!r.show) continue;
        line3(C, [xk(0) - 0.45, 0, r.z], [xk(degC) + 0.45, 0, r.z], { width: 1.1, color: AXIS_DIM });
        for (let k = 0; k < r.co.length; k++) {
          if (!r.co[k]) { solidDot(C, [xk(k), 0, r.z], 1.6, r.col + '0.35)'); continue; }
          drawBar(C, xk(k), 0, r.co[k] * hu, hw, r.z, r.col + '0.16)', r.col + '0.8)');
        }
        label3(C, [xk(0) - 0.7, 0.62, r.z], r.name, { font: 'italic 11px ' + FONT_MATH, color: r.hex, align: 'right' });
      }

      /* 乘积行（玫红主角）+ k 轴 */
      if (state.showProd) {
        line3(C, [xk(0) - 0.45, 0, 0], [xk(degC) + 0.62, 0, 0], { width: 1.4, color: AXIS });
        arrowAt(C, [xk(degC) + 0.62, 0, 0], [xk(degC) + 0.42, 0, 0], AXIS);
        label3(C, [xk(degC) + 0.95, 0, 0], 'k', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
        for (let k = 0; k <= degC; k++) {
          const hl = k === kk && state.showSources;
          drawBar(C, xk(k), 0, c[k] * hu, hw, 0, ROSE_A + (hl ? '0.30)' : '0.14)'), ROSE_A + (hl ? '0.95)' : '0.55)'));
          label3(C, [xk(k), -0.28, 0], xPow(k), { font: 'italic 10.5px ' + FONT_MATH, color: 'rgba(226,232,240,.65)', align: 'center' });
          label3(C, [xk(k), c[k] * hu + 0.24, 0], String(c[k]),
            { size: 10, color: hl ? 'rgba(251,113,133,.95)' : 'rgba(226,232,240,.75)', align: 'center' });
        }
        label3(C, [xk(degC / 2), 3.1, 0], 'cₖ = Σ aᵢ·bₖ₋ᵢ', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }

      /* 目标次数 k 的全部来源（i + j = k，琥珀度量语义由标签给出） */
      if (state.showSources) {
        const tgt = [xk(kk), c[kk] * hu, 0];
        for (let i = 0; i < a.length; i++) {
          const j = kk - i;
          if (j < 0 || j >= b.length || !a[i] || !b[j]) continue;
          const Ap = [xk(i), a[i] * hu, 2.6], Bp = [xk(j), b[j] * hu, 1.3];
          if (state.showFactorA) {
            line3(C, Ap, tgt, { width: 1.4, color: VIO_A + '0.55)' });
            const sA = proj(C, Ap); if (sA) glowDot(sA, 7, '#ffffff', VIO_A + '0.9)');
          }
          if (state.showFactorB) {
            line3(C, Bp, tgt, { width: 1.4, color: EME_A + '0.55)' });
            const sB = proj(C, Bp); if (sB) glowDot(sB, 7, '#ffffff', EME_A + '0.9)');
          }
        }
        const s = proj(C, tgt);
        if (s) glowDot(s, 10, '#ffffff', ROSE_A + '0.9)');
        label3(C, [xk(kk), -0.6, 0], t({ zh: '目标次数 k = ' + kk, en: 'target degree k = ' + kk }),
          { size: 10.5, color: AMB_A + '0.9)', align: 'center' });
      }
    },
    readout() {
      const P = curPreset(), a = P.a, b = P.b, c = polyMul(a, b);
      const degC = c.length - 1, kk = Math.min(Math.round(state.kTarget), degC);
      const parts = [];
      for (let i = 0; i < a.length; i++) {
        const j = kk - i;
        if (j < 0 || j >= b.length || !a[i] || !b[j]) continue;
        parts.push(a[i] + '·' + b[j]);
      }
      const sA = sumArr(a), sB = sumArr(b);
      const clampNote = Math.round(state.kTarget) > degC
        ? '<div class="dim">' + t({ zh: 'k 超出最高次数，已取 k = ' + degC, en: 'k exceeds the top degree — clamped to k = ' + degC }) + '</div>' : '';
      return '<div>' + P.str + ' = ' + polyStr(c) + '</div>' +
        '<div class="sinC">c' + subN(kk) + ' = ' + (parts.join(' + ') || '0') + ' = <b>' + c[kk] + '</b></div>' +
        '<div><span style="color:#fbbf24">Σ cₖ = A(1)·B(1) = ' + sA + '×' + sB + ' = <b>' + (sA * sB) + '</b></span></div>' +
        '<div class="dim">' + t({ zh: 'cₖ = 总量恰为 k 的方案数', en: 'cₖ counts the ways to total exactly k' }) + '</div>' + clampNote;
    }
  },

  /* ────── 三：卷积 —— 反转滑动、重叠相乘再相加 ────── */
  conv: {
    label: { zh: '卷积', en: 'Convolution' },
    params: ['preset', 'shift'],
    brand: { zh: '多项式相乘时，系数序列做的事叫卷积：把 b 反转后滑过 a，重叠处相乘再相加，就得到乘积的一个系数。拖动 s 亲手滑一遍。',
             en: 'When polynomials multiply, their coefficient sequences convolve: flip b, slide it across a, multiply the overlaps and add — that sum is one coefficient of the product. Drag s and slide it yourself.' },
    tips: { zh: '提示：切「正视 k·y」（顿悟视角）——滑动层正好压在结果柱上方：重叠列对齐的正是它点亮的那个系数 cₛ。从此卷积图与系数乘法是同一幅图。',
            en: 'Tip: switch to "Front k·y" (the epiphany view) — the sliding layer lands exactly on top of the result bars: the aligned overlap column is the very coefficient cₛ it lights up. Convolution and coefficient multiplication become one picture.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.6,        el: 0.3,  dist: 10.5, tx: 0, ty: -0.1, tz: 0.8 },
      front: { label: { zh: '正视 k·y', en: 'Front k·y' },   az: 0.001,       el: 0.02, dist: 8.5,  tx: 0, ty: -0.1, tz: 0,
               onSelect: () => forceToggle('showOv') },
      side:  { label: { zh: '侧视 层级', en: 'Side layers' }, az: -Math.PI / 2, el: 0.02, dist: 9.5,  tx: 0, ty: -0.1, tz: 0.8 }
    },
    toggles: [
      { key: 'showC',  label: { zh: '结果系数 cₖ', en: 'Result cₖ' },     color: '#fb7185', checked: true },
      { key: 'showA2', label: { zh: '序列 a（固定）', en: 'Sequence a' }, color: '#a78bfa', checked: true },
      { key: 'showB2', label: { zh: '反转序列 b', en: 'Reversed b' },     color: '#34d399', checked: true },
      { key: 'showOv', label: { zh: '重叠乘积', en: 'Overlap products' }, color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' },               color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const P = curPreset(), a = P.a, b = P.b, c = polyMul(a, b);
      const degC = c.length - 1, dx = 0.78, huC = 0.42, hu2 = 0.5;
      const xk = k => (k - degC / 2) * dx;
      const hw = Math.min(0.17, dx * 0.3);
      const s = clamp(state.shift, 0, degC), si = Math.round(s);
      const w = Math.max(0, 1 - 2.4 * Math.abs(s - si));
      const zL = 1.5, yA = 0.35, yB = -0.35, yC = -2.05;
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 结果行 cₖ（玫红）+ k 轴 */
      if (state.showC) {
        line3(C, [xk(0) - 0.45, yC, 0], [xk(degC) + 0.62, yC, 0], { width: 1.4, color: AXIS });
        arrowAt(C, [xk(degC) + 0.62, yC, 0], [xk(degC) + 0.42, yC, 0], AXIS);
        label3(C, [xk(degC) + 0.95, yC, 0], 'k', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
        for (let k = 0; k <= degC; k++) {
          const hl = k === si;
          const eA = hl ? 0.55 + 0.4 * w : 0.55, fA = hl ? 0.14 + 0.16 * w : 0.14;
          drawBar(C, xk(k), yC, c[k] * huC, hw, 0, ROSE_A + fA.toFixed(2) + ')', ROSE_A + eA.toFixed(2) + ')');
          label3(C, [xk(k), yC - 0.26, 0], k.toFixed(0), { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
          label3(C, [xk(k), yC + c[k] * huC + 0.22, 0], String(c[k]), { size: 10, color: 'rgba(226,232,240,.75)', align: 'center' });
        }
        if (w > 0.02) {
          const sp = proj(C, [xk(si), yC + c[si] * huC, 0]);
          if (sp) glowDot(sp, 6 + 5 * w, '#ffffff', ROSE_A + (0.85 * w).toFixed(2) + ')');
        }
        label3(C, [xk(0) - 0.75, yC + 0.6, 0], 'A(x)·B(x)', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'right' });
      }

      /* 滑动层：a 固定向上（紫）· 反转的 b 向下（翠绿）——两条序列下标方向相反 */
      if (state.showA2) {
        line3(C, [xk(0) - 0.45, yA, zL], [xk(degC) + 0.45, yA, zL], { width: 1.1, color: AXIS_DIM });
        for (let i = 0; i < a.length; i++) {
          if (!a[i]) { solidDot(C, [xk(i), yA, zL], 1.6, VIO_A + '0.35)'); continue; }
          drawBar(C, xk(i), yA, a[i] * hu2, hw, zL, VIO_A + '0.16)', VIO_A + '0.8)');
          label3(C, [xk(i), yA + a[i] * hu2 + 0.2, zL], 'a' + subN(i),
            { font: 'italic 10.5px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
        }
      }
      if (state.showB2) {
        for (let j = 0; j < b.length; j++) {
          const x = xk(s - j);
          if (!b[j]) { solidDot(C, [x, yB, zL], 1.6, EME_A + '0.35)'); continue; }
          drawBar(C, x, yB - b[j] * hu2, b[j] * hu2, hw, zL, EME_A + '0.16)', EME_A + '0.8)');
          label3(C, [x, yB - b[j] * hu2 - 0.2, zL], 'b' + subN(j),
            { font: 'italic 10.5px ' + FONT_MATH, color: '#34d399', align: 'center' });
        }
        /* 滑动方向（翠绿箭头）：s 增大，b 整体右移 */
        const xArr = xk(s) + 0.55;
        line3(C, [xArr - 0.45, yB - 1.15, zL], [xArr, yB - 1.15, zL], { width: 1.3, color: EME_A + '0.7)' });
        arrowAt(C, [xArr, yB - 1.15, zL], [xArr - 0.2, yB - 1.15, zL], EME_A + '0.9)');
        label3(C, [xArr + 0.15, yB - 1.15, zL], 's = ' + fmt(s), { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'left' });
      }

      /* 重叠乘积（琥珀度量）：对齐时相乘再相加 */
      if (state.showOv && w > 0.02) {
        let cnt = 0;
        for (let i = 0; i < a.length; i++) {
          const j = si - i;
          if (j < 0 || j >= b.length || !a[i] || !b[j]) continue;
          cnt++;
          line3(C, [xk(i), yB, zL], [xk(i), yA, zL], { width: 1.5, color: AMB_A + (0.25 + 0.6 * w).toFixed(2) + ')' });
          label3(C, [xk(i) + 0.12, 0, zL], a[i] + '·' + b[j], { size: 10, color: AMB_A + (0.9 * w).toFixed(2) + ')', align: 'left' });
        }
        if (cnt) {
          label3(C, [xk(si), yA + 1.05, zL], 'Σ = c' + subN(si) + ' = ' + c[si],
            { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
          line3(C, [xk(si), yB - 1.45, zL], [xk(si), yC + c[si] * huC + 0.3, 0],
            { width: 1.2, dash: [4, 5], color: AMB_A + (0.55 * w).toFixed(2) + ')' });
        }
      }
      label3(C, [xk(degC / 2), yA + 1.6, zL], 'cₖ = Σ aᵢ·bₖ₋ᵢ', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
    },
    readout() {
      const P = curPreset(), a = P.a, b = P.b, c = polyMul(a, b);
      const degC = c.length - 1;
      const s = clamp(state.shift, 0, degC), si = Math.round(s);
      const parts = [];
      for (let i = 0; i < a.length; i++) {
        const j = si - i;
        if (j < 0 || j >= b.length || !a[i] || !b[j]) continue;
        parts.push(a[i] + '·' + b[j]);
      }
      const clampNote = state.shift > degC + 0.001
        ? '<div class="dim">' + t({ zh: 's 超出最高次数，已取 s = ' + degC, en: 's exceeds the top degree — clamped to s = ' + degC }) + '</div>' : '';
      return '<div>' + t({ zh: '对齐位置', en: 'alignment' }) + ' s = <b>' + si + '</b>&ensp;·&ensp;' + t({ zh: '重叠项', en: 'overlap terms' }) + ' = ' + parts.length + '</div>' +
        '<div class="sinC">c' + subN(si) + ' = ' + (parts.join(' + ') || '0') + ' = <b>' + c[si] + '</b></div>' +
        '<div class="cosC">' + t({ zh: 'a 的下标向右增，反转 b 的下标向左增', en: 'a’s index grows rightward; flipped b’s grows leftward' }) + '</div>' +
        '<div class="dim">' + t({ zh: '卷积 = 多项式乘法在系数上的样子', en: 'convolution is what polynomial multiplication looks like to coefficients' }) + '</div>' + clampNote;
    }
  },

  /* ────── 四：递推 → 生成函数 —— 乘 x 即右移，三行相减只剩 x ────── */
  fib: {
    label: { zh: '递推 · 生成函数', en: 'Recurrence → GF' },
    params: ['nLen', 'omega'],
    brand: { zh: '把 Fibonacci 递推 Fₙ=Fₙ₋₁+Fₙ₋₂ 搬进生成函数：乘一个 x 就是整列系数右移一格。三行对齐相减，逐列抵消，只剩一个 x——于是 F(x)=x/(1−x−x²)。',
             en: 'Move the Fibonacci recurrence Fₙ=Fₙ₋₁+Fₙ₋₂ into the generating function: multiplying by x shifts the whole coefficient row one slot right. Align the three rows, subtract, and everything cancels except a single x — hence F(x)=x/(1−x−x²).' },
    tips: { zh: '提示：切「正视 n·y」——每根玫红柱恰好等于同列紫柱加翠绿柱（递推逐列成立），所以 F−xF−x²F 逐列归零，只剩琥珀色孤柱 x。这一切都是形式幂级数运算，无须谈收敛。',
            en: 'Tip: switch to "Front n·y" — each rose bar equals the violet plus emerald bars in its own column (the recurrence, column by column), so F−xF−x²F cancels everywhere except the lone amber bar x. All of this is formal power series arithmetic — no convergence needed.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.6,        el: 0.3,  dist: 12, tx: 0, ty: 0.4, tz: 0.9 },
      front: { label: { zh: '正视 n·y', en: 'Front n·y' },   az: 0.001,       el: 0.02, dist: 10, tx: 0, ty: 0.4, tz: 0,
               onSelect: () => forceToggle('showRes') },
      side:  { label: { zh: '侧视 层级', en: 'Side layers' }, az: -Math.PI / 2, el: 0.02, dist: 10, tx: 0, ty: 0.4, tz: 0.9 }
    },
    toggles: [
      { key: 'showF',   label: { zh: 'F(x) 系数', en: 'F(x) coefficients' },     color: '#fb7185', checked: true },
      { key: 'showXF',  label: { zh: 'x·F(x) 右移一格', en: 'x·F(x), shift 1' }, color: '#a78bfa', checked: true },
      { key: 'showX2F', label: { zh: 'x²·F(x) 右移两格', en: 'x²·F(x), shift 2' }, color: '#34d399', checked: true },
      { key: 'showRes', label: { zh: '相减余项 = x', en: 'Residual = x' },       color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' },                      color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const N = Math.round(state.nLen), dx = 0.62, H = 2.6;
      const Fmax = FIB[N] || 1;
      const xk = n => (n - N / 2) * dx;
      const hw = Math.min(0.16, dx * 0.3);
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 三行系数（由远到近：x²F 翠绿 → xF 紫 → F 玫红） */
      const rows = [
        { z: 1.8, show: state.showX2F, col: EME_A,  hex: '#34d399', name: 'x²·F(x)', coef: n => n >= 2 ? FIB[n - 2] : 0 },
        { z: 0.9, show: state.showXF,  col: VIO_A,  hex: '#a78bfa', name: 'x·F(x)',  coef: n => n >= 1 ? FIB[n - 1] : 0 },
        { z: 0,   show: state.showF,   col: ROSE_A, hex: '#fb7185', name: 'F(x)',    coef: n => FIB[n] }
      ];
      for (const r of rows) {
        if (!r.show) continue;
        line3(C, [xk(0) - 0.4, 0, r.z], [xk(N) + 0.4, 0, r.z], { width: r.z === 0 ? 1.4 : 1.1, color: r.z === 0 ? AXIS : AXIS_DIM });
        for (let n = 0; n <= N; n++) {
          const v = r.coef(n);
          if (!v) { solidDot(C, [xk(n), 0, r.z], 1.6, r.col + '0.35)'); continue; }
          drawBar(C, xk(n), 0, v / Fmax * H, hw, r.z, r.col + '0.16)', r.col + '0.8)');
          if (N <= 10 || n % 2 === 0) label3(C, [xk(n), v / Fmax * H + 0.2, r.z], String(v),
            { size: 9.5, color: r.col + '0.85)', align: 'center' });
        }
        label3(C, [xk(0) - 0.65, 0.5, r.z], r.name, { font: 'italic 12px ' + FONT_MATH, color: r.hex, align: 'right' });
      }
      /* n 刻度（贴前排） */
      for (let n = 0; n <= N; n++) label3(C, [xk(n), -0.24, 0], n.toFixed(0), { size: 9.5, color: 'rgba(159,176,200,.55)', align: 'center' });
      label3(C, [xk(N) + 0.75, 0, 0], 'n', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });

      /* 递推列高亮（θ 驱动逐列巡游，暂停即冻结；琥珀列线贯穿三行） */
      const nHi = N >= 2 ? 2 + (Math.floor(state.theta / TAU) % (N - 1)) : 2;
      line3(C, [xk(nHi), -0.14, -0.25], [xk(nHi), -0.14, 2.2], { width: 1.2, dash: [5, 6], color: AMB_A + '0.7)' });
      if (state.showF && nHi >= 2) {
        const h1 = FIB[nHi - 1] / Fmax * H, h2 = FIB[nHi - 2] / Fmax * H;
        const xoff = xk(nHi) + hw * 2.6, hw2 = hw * 0.62;
        drawBar(C, xoff, 0, h1, hw2, 0, VIO_A + '0.3)', VIO_A + '0.9)');
        if (h2 > 0) drawBar(C, xoff, h1, h2, hw2, 0, EME_A + '0.3)', EME_A + '0.9)');
        const sp = proj(C, [xk(nHi), FIB[nHi] / Fmax * H, 0]);
        if (sp) glowDot(sp, 10, '#ffffff', ROSE_A + '0.9)');
        label3(C, [xk(nHi), -0.52, 0], 'F' + subN(nHi) + ' = F' + subN(nHi - 1) + '+F' + subN(nHi - 2),
          { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
      }

      /* 相减余项：(1−x−x²)·F(x) = x（琥珀孤柱，形式幂级数逐列相减的结果） */
      if (state.showRes) {
        const yR = -1.75;
        line3(C, [xk(0) - 0.4, yR, 0], [xk(N) + 0.4, yR, 0], { width: 1.1, color: AXIS_DIM });
        for (let n = 0; n <= N; n++) {
          if (n === 1) drawBar(C, xk(1), yR, 0.7, hw, 0, AMB_A + '0.25)', AMB_A + '0.9)');
          else solidDot(C, [xk(n), yR, 0], 1.6, AMB_A + '0.35)');
        }
        label3(C, [xk(1), yR - 0.26, 0], 'x', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        label3(C, [xk(0) - 0.65, yR + 0.4, 0], '(1−x−x²)·F(x)', { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'right' });
      }
      label3(C, [xk(N / 2), H + 0.75, 0], 'F(x) = x/(1−x−x²)', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
    },
    readout() {
      const N = Math.round(state.nLen);
      const nHi = N >= 2 ? 2 + (Math.floor(state.theta / TAU) % (N - 1)) : 2;
      return '<div class="sinC">F' + subN(nHi) + ' = F' + subN(nHi - 1) + ' + F' + subN(nHi - 2) + ' = ' +
          FIB[nHi - 1] + ' + ' + FIB[nHi - 2] + ' = <b>' + FIB[nHi] + '</b></div>' +
        '<div class="cosC">F' + subN(N) + '/F' + subN(N - 1) + ' = <b>' + fmt(FIB[N] / FIB[N - 1], 4) + '</b> → φ = 1.6180…</div>' +
        '<div><span style="color:#fbbf24">(1 − x − x²)·F(x) = x</span></div>' +
        '<div class="dim">' + t({ zh: '形式幂级数：只对齐系数，无须收敛', en: 'formal power series — align coefficients, no convergence needed' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 本工具的遍历/巡游动画由 θ 直接驱动（确定可复现，暂停即冻结）；
   历史仅记录当时真实的乘积系数 c_s（参数中途改变，已记录样本不重算） */
function pushSample() {
  const P = PRESETS[Math.round(state.preset) - 1];
  const c = polyMul(P.a, P.b);
  const si = Math.round(clamp(state.shift, 0, c.length - 1));
  samples.push({ t: state.t, cS: c[si] });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
