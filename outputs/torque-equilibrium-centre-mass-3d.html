<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'torque-equilibrium-centre-mass-3d',
  title: { zh: '力矩、平衡与质心', en: 'Moments, Equilibrium & Centre of Mass' },
  h1:    { zh: '力矩 · 平衡 · 质心', en: 'Moments · Equilibrium · Centre of Mass' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'omega', label: { zh: '力矩 · 力的旋转 <i>ω</i>', en: 'Moment · force spin <i>ω</i>' },  min: 0.2, max: 3,    step: 0.05, value: 0.9,  fmt: v => fmt(v) + ' rad/s' },
  { key: 'r',     label: { zh: '力矩 · 作用点 <i>r</i>',   en: 'Moment · point <i>r</i>' },       min: 0.2, max: 1.8,  step: 0.05, value: 1.2,  fmt: v => fmt(v) },
  { key: 'F',     label: { zh: '力矩 · 力大小 <i>F</i>',   en: 'Moment · force <i>F</i>' },       min: 0.2, max: 2,    step: 0.05, value: 1.2,  fmt: v => fmt(v) },
  { key: 'm1',    label: { zh: '杆 · 质量 <i>m₁</i>',      en: 'Rod · mass <i>m₁</i>' },          min: 0.2, max: 3,    step: 0.05, value: 1.2,  fmt: v => fmt(v) },
  { key: 'x1',    label: { zh: '杆 · 位置 <i>x₁</i>',      en: 'Rod · position <i>x₁</i>' },      min: -2,  max: -0.2, step: 0.05, value: -1.2, fmt: v => fmtS(v) },
  { key: 'm2',    label: { zh: '杆 · 质量 <i>m₂</i>',      en: 'Rod · mass <i>m₂</i>' },          min: 0.2, max: 3,    step: 0.05, value: 1.6,  fmt: v => fmt(v) },
  { key: 'x2',    label: { zh: '杆 · 位置 <i>x₂</i>',      en: 'Rod · position <i>x₂</i>' },      min: 0.2, max: 2,    step: 0.05, value: 1.1,  fmt: v => fmt(v) },
  { key: 'm3',    label: { zh: '质心 · 附加质量 <i>m₃</i>', en: 'CoM · extra mass <i>m₃</i>' },    min: 0,   max: 2.5,  step: 0.05, value: 0,    fmt: v => fmt(v) },
  /* tilt 被「倾倒」页的 drive 驱动：滑杆刻度是度、state 存的是弧度，
     §8 硬约束要求 map 必须配 invMap，否则滑杆回显不出被驱动的角度 */
  { key: 'tilt',  label: { zh: '倾倒 · 倾角 <i>β</i>',     en: 'Toppling · tilt <i>β</i>' },      min: 0,   max: 40,   step: 0.5,  value: 10,   fmt: v => fmt(v, 0) + '°', map: v => v * Math.PI / 180, invMap: v => v * 180 / Math.PI },
  { key: 'baseW', label: { zh: '倾倒 · 底宽 <i>b</i>',     en: 'Toppling · base <i>b</i>' },      min: 0.4, max: 1.6,  step: 0.02, value: 0.9,  fmt: v => fmt(v) }
];

/* ---------- 场景级常量与辅助（只用引擎部件拼装，不触碰引擎） ---------- */
const TSPD = 1.2;                    // 时间轴展开速度（世界单位 / 秒）
const HB = 1.2;                      // 倾倒方块高度 h
const P3 = [0.2, 1.3];               // 附加质点 m₃ 的固定位置
const KT = 0.45;                     // τ → 世界 y 的显示比例（力矩页）
const KM = 0.26;                     // 力矩 → 世界 y 的显示比例（平衡页）
const KG = 1.15;                     // 稳定裕度 → 世界 y 的显示比例（倾倒页）
const KF = 0.55;                     // 力矢量显示比例（世界单位 / 力单位）
const KW = 0.35;                     // 重量箭头显示比例（g = 1）
const ROSE = '251,113,133', VIOLET = '167,139,250', EMER = '52,211,153', ORANGE = '251,146,60';

function setToggle(key, on) {
  state[key] = on;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = on; });
}
function zOf(ts) { return (state.t - ts) * TSPD; }

/* 历史折线：由新到旧取样（记录的都是当时真实值，绝不重算） */
function histPts(get) {
  const pts = [];
  for (let i = samples.length - 1; i >= 0; i--) {
    const sm = samples[i], z = zOf(sm.t);
    if (z > WAVE_LEN + 0.3) break;
    pts.push(get(sm, z));
  }
  return pts;
}

/* 双描历史曲线：外层辉光 + 内核头亮尾隐渐变（§4.2 线型词汇） */
function glowPoly(C, pts, rgb) {
  strokePoly(C, pts, { width: 5.5, color: 'rgba(' + rgb + ',0.13)' });
  strokePoly(C, pts, { width: 2.2, fade: ['rgba(' + rgb + ',1)', 'rgba(' + rgb + ',0.04)'] });
}

/* 任意圆心的平面圆弧（z=0） */
function arcAt(C, cx, cy, r0, a0, a1, color, width) {
  const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 0.07));
  const pts = [];
  for (let j = 0; j <= n; j++) {
    const a = a0 + (a1 - a0) * j / n;
    pts.push([cx + r0 * Math.cos(a), cy + r0 * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: width || 1.6, color: color });
}

/* 直角小方块标记：q 为直角顶点，u / n 为两条边的单位方向 */
function rightAngle(C, q, u, n) {
  const s = 0.09;
  const a = [q[0] + s * u[0], q[1] + s * u[1], 0];
  const b = [q[0] + s * (u[0] + n[0]), q[1] + s * (u[1] + n[1]), 0];
  const c = [q[0] + s * n[0], q[1] + s * n[1], 0];
  strokePoly(C, [a, b, c], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
}

/* 当前物理量（g = 1，纯静力学） */
function momentsNow() { return { M1: state.m1 * Math.abs(state.x1), M2: state.m2 * state.x2 }; }
function comNow() {
  const M = state.m1 + state.m2 + state.m3;
  return { M: M,
    xc: (state.m1 * state.x1 + state.m2 * state.x2 + state.m3 * P3[0]) / M,
    yc: (state.m3 * P3[1]) / M };
}
function marginNow() {
  return (state.baseW / 2) * Math.cos(state.tilt) - (HB / 2) * Math.sin(state.tilt);
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 场景一：力矩与垂直距离 —— τ = rF sin θ = F·d ────── */
  /* 金光闪（§4.7）：本页有意**不加**——频率过密（频闪）。
     本页画的 τ = rF·sin θ 由引擎时钟直接驱动（θ 每帧积分 ω·dt），过零点不是被
     调出来的一个解，而是正弦波每半圈复发一次的周期事件：默认 ω = 0.9 rad/s ⇒
     π/ω = 3.49 s 一次，滑杆推到 ω = 3 ⇒ 1.05 s 一次，恰好等于 FLASH_DUR，
     上一闪还没衰完下一闪就起来，连成常亮的琥珀底色。
     窗口本身是有得借的（第 374 行 |sin θ| > 0.03 才画垂距 d、否则改印
     「d = 0 → τ = 0」，判据现成），借不得的是频率：金光闪是「终于到达」的
     标点，一秒一个标点就不是标点了。这一页要人看的是 τ = F·d 这个恒等分解，
     那行「d = 0 → τ = 0」的说明文字已经把过零点标出来了，不需要再闪一次。 */
  moment: {
    label: { zh: '力矩', en: 'Moment' },
    params: ['omega', 'r', 'F'],
    brand: { zh: '力对支点的力矩 τ = rF·sin θ = F × 垂距。让力的方向随时钟旋转，力矩便以正弦波流出——作用线扫过支点的瞬间，力矩恰好归零。拖拽旋转，从不同角度观察。',
             en: 'The moment of a force about a pivot is τ = rF·sin θ = F × perpendicular distance. Let the force direction spin with the clock and the torque streams out as a sine wave — the instant the line of action sweeps through the pivot, the moment is exactly zero. Drag to rotate.' },
    tips: { zh: '顿悟点：按 2 正视 x·y——位置向量 r、力 F 与琥珀色垂距 d 构成直角三角形，τ = F·d；作用线穿过支点时 d = 0，力矩瞬间归零。再按 3 看 τ·t 正弦波。',
            en: 'Epiphany: press 2 to face x·y — the position vector r, the force F and the amber perpendicular distance d form a right triangle, so τ = F·d; when the line of action passes through the pivot, d = 0 and the moment vanishes. Then press 3 for the τ·t sine wave.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.95,      el: 0.30,  dist: 10.5, tx: 0.3, ty: 0.3,  tz: 2.6 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001,      el: 0.02,  dist: 6.5,  tx: 0.4, ty: 0.15, tz: 0 },
      side:  { label: { zh: '侧视 τ·t', en: 'Side τ·t' },  az: -Math.PI/2, el: 0.001, dist: 11.5, tx: 0,   ty: 0,    tz: 3.4,
               onSelect: () => setToggle('showTau', true) }
    },
    toggles: [
      { key: 'showTau',  label: { zh: '力矩波形 τ·t',   en: 'Torque wave τ·t' },    color: '#fb7185', checked: true },
      { key: 'showLoA',  label: { zh: '力的作用线',     en: 'Line of action' },      color: '#a78bfa', checked: true },
      { key: 'showPerp', label: { zh: '分量 F⊥ / F∥',   en: 'Components F⊥ / F∥' },  color: '#34d399', checked: false },
      { key: 'showD',    label: { zh: '垂距 d 与角 θ',  en: 'Perp. distance d & θ' },color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格',           en: 'Grid' },                color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / TSPD + 0.5,
    draw(C) {
      const thF = state.theta, c = Math.cos(thF), s = Math.sin(thF);
      const r = state.r, F = state.F;
      const tau = r * F * s;
      const A = [r, 0, 0];

      if (state.showGrid) { drawTimeGrid(C, { yMax: 1.5, v: TSPD }); drawGridXY(C, 2, 0.5); }
      drawAxes(C, { ex: 2.3, ey: 1.6, yTicks: [1], xTicks: [1, 2], tAxis: true, v: TSPD });

      /* 青色刚性杆（源几何）：从支点沿 +x */
      strokePoly(C, [[0, 0, 0], [2.0, 0, 0]], { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, [[0, 0, 0], [2.0, 0, 0]], { width: 2, color: 'rgba(45,212,234,0.85)' });
      solidDot(C, [0, 0, 0], 3, 'rgba(45,212,234,0.95)');
      label3(C, [-0.12, -0.2, 0], t({ zh: '支点 O', en: 'pivot O' }),
        { size: 10, color: 'rgba(45,212,234,.85)', align: 'right' });

      /* 力矩历史波形（玫红，沿 t 轴流出） */
      if (state.showTau) {
        glowPoly(C, histPts((sm, z) => [0, KT * sm.tau, z]), ROSE);
        const hd = proj(C, [0, KT * tau, 0]);
        if (hd) glowDot(hd, 9, '#ffffff', 'rgba(251,113,133,0.85)');
        label3(C, [0, 1.38, 2.0], 'τ = rF·sin θ',
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      }

      /* 作用线（紫，参考虚线）：过 A、方向 (cos θ, sin θ) */
      if (state.showLoA) {
        line3(C, [A[0] - 2.4*c, A[1] - 2.4*s, 0], [A[0] + 2.4*c, A[1] + 2.4*s, 0],
          { width: 1, dash: [5, 6], color: 'rgba(167,139,250,0.55)' });
        label3(C, [A[0] + 1.5*c, A[1] + 1.5*s + 0.16, 0], t({ zh: '作用线', en: 'line of action' }),
          { size: 10, color: 'rgba(167,139,250,.8)', align: 'center' });
      }

      /* 垂距 d（琥珀度量）：支点到作用线的垂足 Q = (r sin²θ, −r sinθ cosθ) */
      if (state.showD) {
        arcAt(C, A[0], A[1], 0.26, 0, mod2pi(thF), 'rgba(251,191,36,0.9)');
        label3(C, [A[0] + 0.42 * Math.cos(mod2pi(thF)/2), A[1] + 0.42 * Math.sin(mod2pi(thF)/2), 0], 'θ',
          { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        if (Math.abs(s) > 0.03) {
          const Q = [r * s * s, -r * c * s];
          line3(C, [0, 0, 0], [Q[0], Q[1], 0], { width: 1.6, color: 'rgba(251,191,36,0.85)' });
          rightAngle(C, Q, [c, s], [(0 - Q[0]) / (r * Math.abs(s)), (0 - Q[1]) / (r * Math.abs(s))]);
          label3(C, [Q[0] / 2 - 0.14 * s, Q[1] / 2 + 0.14 * c, 0], 'd = r·sin θ',
            { font: 'italic 11px ' + FONT_MATH, color: 'rgba(251,191,36,.9)', align: 'center' });
        } else {
          label3(C, [r / 2, -0.32, 0], t({ zh: 'd = 0 → τ = 0（作用线过支点）', en: 'd = 0 → τ = 0 (line hits pivot)' }),
            { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
        }
      }

      /* 力的分解（翠绿 F⊥ + 暗 F∥）：只有垂直分量产生力矩 */
      if (state.showPerp) {
        const tipY = [A[0], A[1] + KF * F * s, 0];
        const tipX = [A[0] + KF * F * c, A[1], 0];
        line3(C, A, tipY, { width: 1.6, alpha: 0.9, color: '#34d399' });
        arrowAt(C, tipY, A, '#34d399');
        label3(C, [tipY[0] - 0.14, tipY[1] + (s >= 0 ? 0.16 : -0.16), 0], 'F⊥',
          { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'center' });
        line3(C, A, tipX, { width: 1.4, alpha: 0.5, color: 'rgba(159,176,200,0.8)' });
        arrowAt(C, tipX, A, 'rgba(159,176,200,0.5)');
        label3(C, [tipX[0] + (c >= 0 ? 0.16 : -0.16), tipX[1] - 0.16, 0],
          t({ zh: 'F∥（无力矩）', en: 'F∥ (no moment)' }),
          { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
      }

      /* 力矢量 F（白，主体）与作用点 A */
      const tip = [A[0] + KF * F * c, A[1] + KF * F * s, 0];
      line3(C, A, tip, { width: 2, color: 'rgba(241,245,249,0.92)' });
      arrowAt(C, tip, A, 'rgba(241,245,249,0.92)');
      label3(C, [tip[0] + 0.18 * c, tip[1] + 0.18 * s, 0], 'F',
        { font: 'italic 13px ' + FONT_MATH, color: '#e2e8f0', align: 'center' });
      const sp = proj(C, A);
      if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const s = Math.sin(state.theta);
      const tau = state.r * state.F * s;
      return readoutHead() +
        '<div class="sinC">τ = rF·sin θ = <b>' + fmtS(tau) + '</b></div>' +
        '<div class="tanC">F⊥ = F·sin θ = <b>' + fmtS(state.F * s) + '</b></div>' +
        '<div class="dim">d = r·|sin θ| = ' + fmt(state.r * Math.abs(s)) + '&ensp;·&ensp;τ = F·d' + t({ zh: '（带转向符号）', en: ' (with sense sign)' }) + '</div>';
    }
  },

  /* ────── 场景二：刚体平衡 —— Στ = 0 且 ΣF = 0 ────── */
  equil: {
    label: { zh: '平衡', en: 'Equilibrium' },
    params: ['m1', 'x1', 'm2', 'x2'],
    /* 本页确为静止页签：被演示量 M↺ / M↻ / R 三个数在 30 s 内十进制展开逐位不变
       （恒为 1.44 / 1.76 / 2.80），画面上那点残余差异是 dt 抖动的亚像素重采样，不是内容。
       tips 直接点名了自变量：「调 x₂ 或 m₂，让玫红（逆时针）与紫（顺时针）两条力矩曲线完全重合」。
       两者里选 x₂：力臂在画面上是看得见的一段长度，载荷沿杆滑过去时两条力矩曲线交叉的那一刻
       就是 Στ = 0，而调 m₂ 只改变一个数值标注。
       满量程 [0.2, 2]，两端都不退化：默认 m₁g|x₁| = 1.44、m₂g = 1.6，平衡点落在 x₂ = 0.9，
       正好在量程内侧，一个来回穿过 Στ = 0 两次——顿悟点每 8 s 出现两回。
       x₂ = 2 直接跳回 0.2 载荷会沿杆瞬移 ⇒ linear（往返）；构型简单，取房规默认 8 s。 */
    drive: { key: 'x2', from: 0.2, to: 2, period: 8, kind: 'linear' },
    brand: { zh: '杆上两个载荷绕支点各产生一个力矩：逆时针 m₁g|x₁| 与顺时针 m₂gx₂。刚体平衡要求合力矩为零、合力也为零——支点反力 R 始终托住全部重量。移动滑杆寻找平衡。',
             en: 'Two loads on a rod each take a moment about the pivot: anticlockwise m₁g|x₁| and clockwise m₂gx₂. Rigid-body equilibrium demands zero net moment and zero net force — the pivot reaction R always carries the whole weight. Move the sliders to find balance.' },
    tips: { zh: '顿悟点：调 x₂ 或 m₂，让玫红（逆时针）与紫（顺时针）两条力矩曲线完全重合——按 3 侧视 τ·t，重合的那一刻杆归于水平，这就是 Στ = 0；而 R = (m₁+m₂)g 只由合力条件决定，与力矩无关。',
            en: 'Epiphany: adjust x₂ or m₂ until the rose (anticlockwise) and violet (clockwise) moment traces coincide — press 3 for the τ·t side view; the instant they merge the rod levels out: that is Στ = 0. Meanwhile R = (m₁+m₂)g comes from the force condition alone.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.95,      el: 0.30,  dist: 11,   tx: 0, ty: 0.2, tz: 2.8 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001,      el: 0.02,  dist: 7,    tx: 0, ty: -0.1, tz: 0 },
      side:  { label: { zh: '侧视 τ·t', en: 'Side τ·t' },  az: -Math.PI/2, el: 0.001, dist: 11.5, tx: 0, ty: 0.8, tz: 3.4,
               onSelect: () => { setToggle('showM1', true); setToggle('showM2', true); } }
    },
    toggles: [
      { key: 'showM1',   label: { zh: 'm₁ 力矩（逆时针）', en: 'm₁ moment (ccw)' },  color: '#fb7185', checked: true },
      { key: 'showM2',   label: { zh: 'm₂ 力矩（顺时针）', en: 'm₂ moment (cw)' },   color: '#a78bfa', checked: true },
      { key: 'showR',    label: { zh: '支点反力 R',        en: 'Pivot reaction R' }, color: '#34d399', checked: true },
      { key: 'showArm',  label: { zh: '力臂标注',          en: 'Moment arms' },       color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格',              en: 'Grid' },              color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / TSPD + 0.5,
    draw(C) {
      const Mo = momentsNow();
      const net = Mo.M1 - Mo.M2;                       // 逆时针为正
      const phi = clamp(net * 0.12, -0.15, 0.15);      // 示意倾角（非动力学）
      const cf = Math.cos(phi), sf = Math.sin(phi);
      const p1 = [state.x1 * cf, state.x1 * sf], p2 = [state.x2 * cf, state.x2 * sf];

      if (state.showGrid) drawTimeGrid(C, { yMax: 1.6, v: TSPD });
      drawAxes(C, { ex: 2.6, ey: 1.8, yTicks: [1], xTicks: [1, 2], tAxis: true, v: TSPD });

      /* 力矩历史曲线：玫红 M↺ 与紫 M↻，平衡时两条重合 */
      if (state.showM1) {
        glowPoly(C, histPts((sm, z) => [0, KM * sm.M1, z]), ROSE);
        const h1 = proj(C, [0, KM * Mo.M1, 0]); if (h1) glowDot(h1, 9, '#ffffff', 'rgba(251,113,133,0.85)');
        label3(C, [0, KM * Mo.M1 + 0.18, 2.6], 'M↺ = m₁g·|x₁|',
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      }
      if (state.showM2) {
        glowPoly(C, histPts((sm, z) => [0, KM * sm.M2, z]), VIOLET);
        const h2 = proj(C, [0, KM * Mo.M2, 0]); if (h2) glowDot(h2, 8, '#ffffff', 'rgba(167,139,250,0.85)');
        label3(C, [0, KM * Mo.M2 - 0.22, 2.6], 'M↻ = m₂g·x₂',
          { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'left' });
      }

      /* 青色杆与支点三棱（源几何；净力矩以小倾角示意） */
      strokePoly(C, [[-2.2 * cf, -2.2 * sf, 0], [2.2 * cf, 2.2 * sf, 0]], { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, [[-2.2 * cf, -2.2 * sf, 0], [2.2 * cf, 2.2 * sf, 0]], { width: 2, color: 'rgba(45,212,234,0.85)' });
      strokePoly(C, [[0, -0.02, 0], [-0.16, -0.3, 0], [0.16, -0.3, 0], [0, -0.02, 0]], { width: 1.6, color: 'rgba(45,212,234,0.7)' });

      /* 力臂标注（琥珀度量） */
      if (state.showArm) {
        for (const [px, py, txt] of [[p1[0], p1[1], '|x₁|'], [p2[0], p2[1], 'x₂']]) {
          line3(C, [px, py, 0], [px, -0.58, 0], { width: 1, dash: [5, 6], color: 'rgba(251,191,36,0.4)' });
          line3(C, [0, -0.58, 0], [px, -0.58, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
          line3(C, [px, -0.64, 0], [px, -0.52, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
          label3(C, [px / 2, -0.78, 0], txt, { font: 'italic 11px ' + FONT_MATH, color: 'rgba(251,191,36,.9)', align: 'center' });
        }
        line3(C, [0, -0.64, 0], [0, -0.52, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
        if (Math.abs(net) < 0.03)
          label3(C, [0, 0.42, 0], t({ zh: '平衡 Στ = 0', en: 'balanced Στ = 0' }),
            { size: 11, color: 'rgba(251,191,36,.95)', align: 'center' });
      }

      /* 载荷与重量箭头：m₁ 玫红 · m₂ 紫（与各自力矩曲线同色，六处同源） */
      solidDot(C, [p1[0], p1[1], 0], 3 + 1.2 * state.m1, 'rgba(251,113,133,0.92)');
      line3(C, [p1[0], p1[1], 0], [p1[0], p1[1] - KW * state.m1, 0], { width: 1.8, color: '#fb7185' });
      arrowAt(C, [p1[0], p1[1] - KW * state.m1, 0], [p1[0], p1[1], 0], '#fb7185');
      label3(C, [p1[0], p1[1] + 0.22, 0], 'm₁', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      solidDot(C, [p2[0], p2[1], 0], 3 + 1.2 * state.m2, 'rgba(167,139,250,0.92)');
      line3(C, [p2[0], p2[1], 0], [p2[0], p2[1] - KW * state.m2, 0], { width: 1.8, color: '#a78bfa' });
      arrowAt(C, [p2[0], p2[1] - KW * state.m2, 0], [p2[0], p2[1], 0], '#a78bfa');
      label3(C, [p2[0], p2[1] + 0.22, 0], 'm₂', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });

      /* 支点反力（翠绿，合力条件 ΣF = 0） */
      if (state.showR) {
        const Rlen = KW * (state.m1 + state.m2);
        line3(C, [0, 0, 0], [0, Rlen, 0], { width: 1.8, color: '#34d399' });
        arrowAt(C, [0, Rlen, 0], [0, 0, 0], '#34d399');
        label3(C, [0.12, Rlen + 0.14, 0], 'R = (m₁+m₂)g',
          { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'left' });
      }
      const sp = proj(C, [0, 0, 0]);
      if (sp) glowDot(sp, 12, '#ffffff', 'rgba(186,240,255,0.9)');

      /* 金光闪（§4.7）——「两条力矩曲线终于重合」的那一帧
         1. 什么量走到了哪：净力矩 Στ = M↺ − M↻（玫红减紫）在载荷 x₂ 沿杆滑过去的
            途中穿过零；那一刻杆归于水平，tips 要人看的正是这一刻。
         2. 窗口从哪借：0.03 不是新取的数，就是本页第 489 行画「平衡 Στ = 0」标签、
            第 518 行 readout 印「平衡」用的同一个阈值。判据与页面自己宣称平衡的
            条件逐字相同——闪与那行字必然同时出现，不会各说各话。
         3. 实测（默认参数，60 s 确定性推帧）：15 次，周期 8 s 的 pingpong 一趟两回，
            首次命中 t = 1.52（此时 x₂ = 0.88 刚进窗口；精确解 x₂* = m₁|x₁|/m₂ =
            1.44/1.6 = 0.90），此后 t = 6.42 / 9.52 / 14.42 / 17.52…，
            最近的两次间隔 3.10 s > FLASH_DUR = 1.05，不重影。
            窗口 0.06 宽 / 每帧 Στ 走 0.0120 ≈ 5 帧，跨不过去。
         4. 锚点 [0, KM·M↺, 0]：两条力矩曲线的头亮点在命中时重合于此，
            光就从「重合点」本身泛开。
         5. 拨不到就不闪，这是要讲的话：平衡点 x₂* = m₁|x₁|/m₂ 必须落在滑杆量程
            [0.2, 2] 内。默认 m₁|x₁| = 1.44，于是 m₂ < 0.72 时 x₂* > 2 —— 载荷再往外
            滑到头也压不平，一趟 0 次（实测 m₂ = 0.50 ⇒ x₂* = 2.88 → 60 s 内 0 次；
            m₂ = 0.75 ⇒ x₂* = 1.92 刚回到量程内 → 15 次，首次 t = 3.73）。
            这与最小二乘「直线拟合」页同一个道理：金光闪认的是数学上那个解，
            不是滑杆到头。 */
      goldHit('equil', Math.abs(net) < 0.03);
      drawGoldFlash(C, [0, KM * Mo.M1, 0]);
    },
    readout() {
      const Mo = momentsNow();
      const net = Mo.M1 - Mo.M2;
      const st = Math.abs(net) < 0.03 ? { zh: '平衡 Στ = 0', en: 'balanced Στ = 0' }
        : (net > 0 ? { zh: '左侧下沉（逆时针）', en: 'left dips (ccw)' } : { zh: '右侧下沉（顺时针）', en: 'right dips (cw)' });
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' + t(st) + '</div>' +
        '<div class="sinC">M↺ = m₁g|x₁| = <b>' + fmt(Mo.M1) + '</b></div>' +
        '<div class="cosC">M↻ = m₂g·x₂ = <b>' + fmt(Mo.M2) + '</b></div>' +
        '<div class="tanC">R = (m₁+m₂)g = <b>' + fmt(state.m1 + state.m2) + '</b></div>' +
        '<div class="dim">Στ = ' + fmtS(net) + '&ensp;·&ensp;' + t({ zh: '取 g = 1，杆为轻杆', en: 'g = 1, light rod' }) + '</div>';
    }
  },

  /* ────── 场景三：质心 —— 加权平均 x̄ = Σmᵢxᵢ/Σmᵢ ────── */
  /* 金光闪（§4.7）：本页有意**不加**——恒等式（处处成立）。
     本页画的两条紫色悬挂铅垂线，每一帧都由质心 (x̄, ȳ) 反算出来（第 590 行：
     方向取 cm − S），所以「两线交于质心」是构造出来的恒等式，每一帧都为真，
     没有哪一刻它们「终于」相交——把 m₃ 拨到任意值，交点照样在质心上。
     次候选是 tips 点名的 m₃ = 0（质心落回杆上），也不合格，两条理由：
     它是 drive 区间 [0, 2.5] 的端点，首帧即真、没有上升沿（按主控口径，
     「展示进度参数走到端点」不算到达）；而且 m₃ = 0 是那颗质点连同两条连杆
     一起消失（第 565/572 行 m₃ > 0.01 才画），闪的会是消失而不是到达。
     真正该为「支点放在 x̄ 处即 Στ = 0」发的那一闪，由「平衡」页承担。 */
  com: {
    label: { zh: '质心', en: 'Centre of mass' },
    params: ['m1', 'x1', 'm2', 'x2', 'm3'],
    /* tips 的顿悟点点名了 m₃：「当 m₃ = 0 时质心落回杆上」。驱动附加质量 m₃，
       质心就被它从杆上拉起来、又放回去，两条紫色悬挂铅垂线随之转动却始终交于
       同一点，玫红质心轨迹沿时间轴画出这条上下往返的曲线——brand 说的
       「质心随之滑动并留下轨迹」正是这个动作。
       满量程 [0, 2.5]：起点 m₃ = 0 恰是 tips 要的那一帧（此时 m₃ 连同两条
       连杆一起隐去，质心落回杆上），另一端是质心被拉得最高，都不退化。
       linear：2.5 直接跳回 0 会让质心与两条连杆瞬间塌回杆上 → 默认 pingpong。
       构型简单（一根杆三个点），取房规默认 8 s。 */
    drive: { key: 'm3', from: 0, to: 2.5, period: 8, kind: 'linear' },
    brand: { zh: '质心是质量的加权平均位置：x̄ = Σmᵢxᵢ/Σmᵢ。改变质量与位置，质心随之滑动并留下轨迹；无论从哪一点悬挂，重力铅垂线都必经质心。',
             en: 'The centre of mass is the mass-weighted average position: x̄ = Σmᵢxᵢ/Σmᵢ. Change the masses and positions and the centre glides along, leaving a trail; hang the body from any point and the plumb line always passes through it.' },
    tips: { zh: '顿悟点：按 2 正视 x·y——两条紫色悬挂铅垂线永远交于质心一点。当 m₃ = 0 时质心落回杆上：把支点放在 x̄ 处，正是「平衡」页签里 Στ = 0 的位置。',
            en: 'Epiphany: press 2 to face x·y — the two violet suspension plumb lines always cross at the centre of mass. With m₃ = 0 the centre falls back on the rod: put the pivot at x̄ and you get exactly the Στ = 0 balance of the Equilibrium tab.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.7,  el: 0.35, dist: 8.5, tx: 0, ty: 0.4, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 6.5, tx: 0, ty: 0.4, tz: 0 }
    },
    toggles: [
      { key: 'showTrailC', label: { zh: '质心轨迹',       en: 'CoM trail' },        color: '#fb7185', checked: true },
      { key: 'showPlumb',  label: { zh: '悬挂铅垂线',     en: 'Plumb lines' },      color: '#a78bfa', checked: true },
      { key: 'showLever',  label: { zh: '重力线与 x̄',    en: 'Gravity line & x̄' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格',           en: 'Grid' },             color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / TSPD + 0.5,
    draw(C) {
      const cm = comNow();

      if (state.showGrid) drawGridXY(C, 2, 0.5);
      drawAxes(C, { ex: 2.6, ey: 1.9, yTicks: [1], xTicks: [1, 2], tAxis: false });

      /* 青色杆（源几何）与刚性连杆 */
      strokePoly(C, [[-2.2, 0, 0], [2.2, 0, 0]], { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, [[-2.2, 0, 0], [2.2, 0, 0]], { width: 2, color: 'rgba(45,212,234,0.85)' });
      if (state.m3 > 0.01) {
        line3(C, [state.x1, 0, 0], [P3[0], P3[1], 0], { width: 1, alpha: 0.35, color: 'rgba(159,176,200,0.8)' });
        line3(C, [state.x2, 0, 0], [P3[0], P3[1], 0], { width: 1, alpha: 0.35, color: 'rgba(159,176,200,0.8)' });
      }

      /* 质点与各自重量小箭头（骨架灰白，避免与曲线色混淆） */
      const pts = [[state.x1, 0, state.m1, 'm₁'], [state.x2, 0, state.m2, 'm₂']];
      if (state.m3 > 0.01) pts.push([P3[0], P3[1], state.m3, 'm₃']);
      for (const [px, py, m, txt] of pts) {
        solidDot(C, [px, py, 0], 3 + 1.3 * m, 'rgba(226,232,240,0.92)');
        line3(C, [px, py, 0], [px, py - KW * m * 0.7, 0], { width: 1.3, alpha: 0.5, color: 'rgba(226,232,240,0.8)' });
        arrowAt(C, [px, py - KW * m * 0.7, 0], [px, py, 0], 'rgba(226,232,240,0.5)');
        label3(C, [px, py + 0.24, 0], txt, { font: 'italic 12px ' + FONT_MATH, color: '#e2e8f0', align: 'center' });
      }

      /* 质心轨迹（玫红，历史真实值） */
      if (state.showTrailC && samples.length > 1) {
        const tr = histPts(sm => [sm.xc, sm.yc, 0]);
        strokePoly(C, tr, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, tr, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
      }

      /* 悬挂铅垂线（紫）：从两个悬挂点各引一条，必过质心 */
      if (state.showPlumb) {
        for (const S of [[-1.5, 1.7], [1.4, 1.7]]) {
          const d = [cm.xc - S[0], cm.yc - S[1]];
          const L = Math.hypot(d[0], d[1]) || 1;
          const e = [cm.xc + d[0] / L * 0.9, cm.yc + d[1] / L * 0.9];
          line3(C, [S[0], S[1], 0], [e[0], e[1], 0], { width: 1, dash: [5, 6], color: 'rgba(167,139,250,0.7)' });
          solidDot(C, [S[0], S[1], 0], 2.6, 'rgba(167,139,250,0.9)');
        }
        label3(C, [-1.5, 1.88, 0], t({ zh: '悬挂点', en: 'hang points' }),
          { size: 10, color: 'rgba(167,139,250,.85)', align: 'center' });
      }

      /* 重力合力线与 x̄ 刻度（琥珀度量） */
      if (state.showLever) {
        line3(C, [cm.xc, cm.yc, 0], [cm.xc, -0.9, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.7)' });
        line3(C, [cm.xc, -0.07, 0], [cm.xc, 0.07, 0], { width: 1.4, color: 'rgba(251,191,36,0.9)' });
        label3(C, [cm.xc, -0.28, 0], 'x̄', { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        label3(C, [cm.xc + 0.1, -0.72, 0], t({ zh: '支点放在这里即平衡', en: 'pivot here → balance' }),
          { size: 10, color: 'rgba(251,191,36,.8)', align: 'left' });
      }

      label3(C, [-2.15, 1.75, 0], 'x̄ = Σmᵢxᵢ / Σmᵢ',
        { font: 'italic 13px ' + FONT_MATH, color: '#e2e8f0', align: 'left' });

      const sp = proj(C, [cm.xc, cm.yc, 0]);
      if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const cm = comNow();
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;M = Σmᵢ = <b>' + fmt(cm.M) + '</b></div>' +
        '<div class="sinC">x̄ = Σmᵢxᵢ/M = <b>' + fmtS(cm.xc) + '</b></div>' +
        '<div class="cosC">ȳ = Σmᵢyᵢ/M = <b>' + fmtS(cm.yc) + '</b></div>' +
        '<div class="dim">' + t({ zh: 'm₃ = 0 时质心在杆上 · 支点在 x̄ 即 Στ = 0', en: 'with m₃ = 0 the CoM sits on the rod · pivot at x̄ ⇔ Στ = 0' }) + '</div>';
    }
  },

  /* ────── 场景四：倾倒与支撑区域 —— tan βc = b/h ────── */
  topple: {
    label: { zh: '倾倒', en: 'Toppling' },
    params: ['tilt', 'baseW'],
    /* 同「平衡」页：β、βc、margin 三个数 30 s 内逐位不变，是静止页签。
       tips 就是一句驱动说明：「缓缓增大 β——紫色重力作用线扫向琥珀色支点棱边，恰好压线时
       β = βc = atan(b/h)」。自变量是倾角 β，另一根滑杆 b 的作用是移动这个临界值。
       满量程 [0°, 40°]，两端都不退化：默认 b = 0.90、h = 1.20 ⇒ βc = 36.9°，落在量程内侧，
       所以一趟扫掠必然穿过临界角——稳定裕度曲线过零、指示器翻面，正是这一页要人看见的那一刻。
       from/to 写成弧度：tilt 带 map（度 → 弧度），而 drive 写的是 state 值，不再过 map。
       同一条 §8 硬约束要求补 invMap，见 PARAMS 里 tilt 那一行。
       40° 直接跳回 0° 方块会瞬间弹正 ⇒ linear（往返）；tips 说「缓缓」，取 10 s 而非默认 8 s。 */
    drive: { key: 'tilt', from: 0, to: 40 * Math.PI / 180, period: 10, kind: 'linear' },
    brand: { zh: '方块是否倾倒只看一件事：质心的重力作用线是否落在支撑区域内。落在里面，重力矩把它压回去；越过支点棱边，同一个重力就变成倾倒力矩。临界角满足 tan βc = b/h。',
             en: 'Whether the block topples comes down to one thing: does the line of action of gravity through the centre of mass fall inside the base of support? Inside, gravity restores the block; past the pivot edge, the same weight becomes a toppling moment. The critical angle satisfies tan βc = b/h.' },
    tips: { zh: '顿悟点：按 2 正视 x·y，缓缓增大 β——紫色重力作用线扫向琥珀色支点棱边，恰好压线时 β = βc = atan(b/h)，玫红稳定裕度曲线同时穿过零。加宽底座 b，临界角随之增大。',
            en: 'Epiphany: press 2 to face x·y and slowly raise β — the violet gravity line sweeps toward the amber pivot edge; it touches exactly at β = βc = atan(b/h), just as the rose stability-margin trace crosses zero. Widen the base b and the critical angle grows.' },
    views: {
      iso:   { label: { zh: '立体',      en: '3D' },          az: -0.95,      el: 0.30,  dist: 10.5, tx: 0, ty: 0.5, tz: 2.6 },
      front: { label: { zh: '正视 x·y',  en: 'Front x·y' },   az: 0.001,      el: 0.02,  dist: 6.5,  tx: 0, ty: 0.6, tz: 0 },
      side:  { label: { zh: '侧视 裕度·t', en: 'Side margin·t' }, az: -Math.PI/2, el: 0.001, dist: 11,   tx: 0, ty: 0.4, tz: 3.4,
               onSelect: () => setToggle('showMargin', true) }
    },
    toggles: [
      { key: 'showMargin', label: { zh: '稳定裕度曲线', en: 'Stability margin' },  color: '#fb7185', checked: true },
      { key: 'showGline',  label: { zh: '重力作用线',   en: 'Gravity line' },       color: '#a78bfa', checked: true },
      { key: 'showBase',   label: { zh: '支撑区域',     en: 'Base of support' },    color: '#34d399', checked: true },
      { key: 'showTip',    label: { zh: '倾倒力矩指示', en: 'Toppling indicator' }, color: '#fb923c', checked: true },
      { key: 'showGrid',   label: { zh: '网格',         en: 'Grid' },               color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / TSPD + 0.5,
    draw(C) {
      const b = state.baseW, be = state.tilt;
      const cb = Math.cos(be), sb = Math.sin(be);
      const marg = marginNow();
      const bc = Math.atan2(b, HB);
      /* 方块四角：支点棱在原点，沿斜面向上铺 b、垂直斜面立 h */
      const k0 = [0, 0], k1 = [b * cb, b * sb], k2 = [b * cb - HB * sb, b * sb + HB * cb], k3 = [-HB * sb, HB * cb];
      const cx = (b / 2) * cb - (HB / 2) * sb, cy = (b / 2) * sb + (HB / 2) * cb;

      if (state.showGrid) { drawTimeGrid(C, { yMax: 1.5, v: TSPD }); drawGridXY(C, 2, 0.5); }
      drawAxes(C, { ex: 2.1, ey: 1.9, yTicks: [1], xTicks: [1, 2], tAxis: true, v: TSPD });

      /* 稳定裕度历史（玫红）：过零即临界 */
      if (state.showMargin) {
        glowPoly(C, histPts((sm, z) => [0, KG * sm.marg, z]), ROSE);
        const hd = proj(C, [0, KG * marg, 0]); if (hd) glowDot(hd, 9, '#ffffff', 'rgba(251,113,133,0.85)');
        label3(C, [0, KG * marg + 0.22, 2.4], t({ zh: '裕度 = 重力线到棱边的水平距离', en: 'margin = gravity line to edge' }),
          { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      }

      /* 青色斜面（源几何）与倾角 β */
      strokePoly(C, [[-2.2 * cb, -2.2 * sb, 0], [2.2 * cb, 2.2 * sb, 0]], { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, [[-2.2 * cb, -2.2 * sb, 0], [2.2 * cb, 2.2 * sb, 0]], { width: 2, color: 'rgba(45,212,234,0.85)' });
      if (be > 0.02) {
        arcAt(C, 0, 0, 0.55, 0, be, 'rgba(251,191,36,0.9)');
        label3(C, [0.72 * Math.cos(be / 2), 0.72 * Math.sin(be / 2), 0], 'β',
          { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
      }

      /* 支撑区域（翠绿）：方块与斜面的接触段 */
      if (state.showBase) {
        strokePoly(C, [[k0[0], k0[1], 0], [k1[0], k1[1], 0]], { width: 6, color: 'rgba(52,211,153,0.20)' });
        strokePoly(C, [[k0[0], k0[1], 0], [k1[0], k1[1], 0]], { width: 2.4, color: 'rgba(52,211,153,0.8)' });
        label3(C, [(k0[0] + k1[0]) / 2 + 0.1, (k0[1] + k1[1]) / 2 - 0.24, 0],
          t({ zh: '支撑区域 b', en: 'base of support b' }),
          { size: 10.5, color: 'rgba(52,211,153,.9)', align: 'center' });
      }

      /* 方块轮廓（亮白结构） */
      strokePoly(C, [[k0[0], k0[1], 0], [k1[0], k1[1], 0], [k2[0], k2[1], 0], [k3[0], k3[1], 0], [k0[0], k0[1], 0]],
        { width: 1.6, color: 'rgba(226,232,240,0.85)' });

      /* 支点棱（琥珀）与临界角 */
      solidDot(C, [0, 0, 0], 3, 'rgba(251,191,36,0.95)');
      label3(C, [-0.12, -0.22, 0], t({ zh: '支点棱', en: 'pivot edge' }),
        { size: 10, color: 'rgba(251,191,36,.9)', align: 'right' });
      label3(C, [0.9, 1.86, 0], 'βc = atan(b/h) = ' + fmt(bc * 180 / Math.PI, 0) + '°',
        { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left' });

      /* 重力：白色 mg 箭头 + 紫色作用线（延长虚线） */
      line3(C, [cx, cy, 0], [cx, cy - 0.55, 0], { width: 2, color: 'rgba(241,245,249,0.92)' });
      arrowAt(C, [cx, cy - 0.55, 0], [cx, cy, 0], 'rgba(241,245,249,0.92)');
      label3(C, [cx + 0.14, cy - 0.42, 0], 'mg', { font: 'italic 12px ' + FONT_MATH, color: '#e2e8f0', align: 'left' });
      if (state.showGline) {
        line3(C, [cx, cy, 0], [cx, cy - 2.1, 0], { width: 1.5, dash: [7, 7], color: 'rgba(167,139,250,0.8)' });
        solidDot(C, [cx, cx * sb / cb, 0], 2.6, 'rgba(167,139,250,0.95)');
        /* 裕度（琥珀水平标尺）：支点棱到重力线 */
        line3(C, [0, -0.42, 0], [cx, -0.42, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
        line3(C, [cx, -0.48, 0], [cx, -0.36, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
        line3(C, [0, -0.48, 0], [0, -0.36, 0], { width: 1.2, color: 'rgba(251,191,36,0.75)' });
        label3(C, [cx / 2, -0.62, 0], t({ zh: '裕度', en: 'margin' }),
          { size: 10, color: 'rgba(251,191,36,.9)', align: 'center' });
      }

      /* 倾倒 / 临界 / 稳定 指示（橙） */
      if (state.showTip) {
        if (marg < -0.03) {
          arcAt(C, 0, 0, 0.34, be + 1.1, be + 2.3, 'rgba(251,146,60,0.95)', 2);
          arrowAt(C, [0.34 * Math.cos(be + 2.3), 0.34 * Math.sin(be + 2.3), 0],
                     [0.34 * Math.cos(be + 2.1), 0.34 * Math.sin(be + 2.1), 0], 'rgba(251,146,60,0.95)');
          label3(C, [-0.55, 0.6, 0], t({ zh: '倾倒！重力矩越过棱边', en: 'topples! gravity past the edge' }),
            { size: 11, color: '#fb923c', align: 'right' });
        } else if (Math.abs(marg) <= 0.03) {
          label3(C, [-0.4, 0.72, 0], t({ zh: '临界：重力线压在棱边上', en: 'critical: gravity line on the edge' }),
            { size: 11, color: '#fbbf24', align: 'right' });
        }
      }

      const sp = proj(C, [cx, cy, 0]);
      if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');

      /* 金光闪（§4.7）——「重力线越过棱边」的那一帧
         1. 什么量走到了哪：稳定裕度 marg（支点棱到重力作用线的水平距离）在倾角 β
            缓缓增大的过程中由正变负；跨过零的那一刻 β = βc = atan(b/h)，
            玫红裕度曲线穿零、橙色指示器翻面，正是 tips 点名要看的一刻。
         2. 窗口从哪借：这里**不借 ±0.03**（第 721/727 行画「倾倒 / 临界」用的那个），
            改用半平面 marg < 0。理由是几何逼出来的：默认 b = 0.90、h = 1.20 ⇒
            βc = 36.87°，离滑杆量程上限 40° 只有 3.13°。tilt 以 8°/s 上行，
            t = 4.61 穿过 βc，5.00 撞上量程顶折返，t = 5.39 又穿回来 ——
            相隔 0.78 s < FLASH_DUR = 1.05，用 ±0.03 的窗口会在折返处叠成一次重影。
            半平面只在「进入倾倒区」的上升沿打点，回到稳定区不算到达，
            语义也更准：闪的是越线，不是压线。
         3. 实测（默认参数，60 s 确定性推帧）：6 次，drive 周期 10 s 每趟一次，
            首次命中 t = 4.62（tilt = 36.93°，刚过 βc = 36.87°），
            此后 t = 14.62 / 24.62 / 34.62 / 44.62，间隔 10 s。
            裕度在 βc 附近每帧走 0.00175 —— 这正是不能借 1e-3 级细窗口的原因；
            半平面没有宽度可言，跨不过去。
         4. 锚点 [0, 0, 0]：支点棱本身。命中的定义就是重力线压到这条棱上，
            光从棱边泛开。
         5. 拨不到就不闪，这是要讲的话：βc = atan(b/h) 必须落在量程 40° 以内，
            即 b < h·tan40° = 1.007。把底宽拨到 b ≥ 1.01，临界角出了量程，
            方块在整个 β 行程里都稳，一趟 0 次（实测 b = 1.01 与 b = 1.20 ⇒ βc = 45°，
            60 s 内均 0 次；反向 b = 0.60 ⇒ βc = 26.57° → 6 次，首次提前到 t = 3.33）。
            加宽底座本来就是这一页要教的抗倾倒办法，闪的消失即是结论。 */
      goldHit('topple', marg < 0);
      drawGoldFlash(C, [0, 0, 0]);
    },
    readout() {
      const marg = marginNow();
      const bc = Math.atan2(state.baseW, HB) * 180 / Math.PI;
      const st = marg < -0.03 ? { zh: '倾倒（重力线越出支撑区域）', en: 'topples (gravity line outside base)' }
        : (Math.abs(marg) <= 0.03 ? { zh: '临界 impending topple', en: 'critical — impending topple' }
                                  : { zh: '稳定（重力矩为回复力矩）', en: 'stable (gravity moment restores)' });
      return '<div>β = <b>' + fmt(state.tilt * 180 / Math.PI, 0) + '°</b>&ensp;·&ensp;βc = atan(b/h) = <b>' + fmt(bc, 0) + '°</b></div>' +
        '<div class="sinC">' + t({ zh: '稳定裕度', en: 'margin' }) + ' = <b>' + fmtS(marg) + '</b></div>' +
        '<div class="dim">b = ' + fmt(state.baseW) + '&ensp;·&ensp;h = ' + fmt(HB) + '&ensp;·&ensp;' + t(st) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录"当时的真实值"，参数中途改变时历史不重算       ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const Mo = momentsNow(), cm = comNow();
  samples.push({
    t: state.t,
    tau: state.r * state.F * Math.sin(state.theta),  /* 力矩页：τ = rF sin θ */
    M1: Mo.M1, M2: Mo.M2,                            /* 平衡页：逆 / 顺时针力矩 */
    xc: cm.xc, yc: cm.yc,                            /* 质心页：质心真实位置 */
    marg: marginNow()                                /* 倾倒页：稳定裕度 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
