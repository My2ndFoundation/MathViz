<style>

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'derivative-essence-3d',
  title: { zh: '导数与微分的本质 · 以直代曲', en: 'The Essence of Derivatives' },
  h1:    { zh: '导数与微分的本质', en: 'Derivatives' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'x0',    label: { zh: '切点 <i>x</i>₀', en: 'Point <i>x</i>₀' },       min: -2.4, max: 2.4, step: 0.05, value: 0.6, fmt: v => fmtS(v) },
  { key: 'dx',    label: { zh: '增量 Δ<i>x</i>', en: 'Increment Δ<i>x</i>' },   min: 0.02, max: 1.5, step: 0.01, value: 0.8, fmt: v => fmt(v) },
  { key: 'lam',   label: { zh: '显微倍率 <i>λ</i>', en: 'Zoom <i>λ</i>' },      min: 1,    max: 20,  step: 0.5,  value: 1,   fmt: v => fmt(v, 1) + '×' },
  { key: 'y0',    label: { zh: '切点 <i>y</i>₀', en: 'Point <i>y</i>₀' },       min: -1.8, max: 1.8, step: 0.05, value: 0.4, fmt: v => fmtS(v) },
  { key: 'omega', label: { zh: '探针速度 <i>ω</i>', en: 'Probe speed <i>ω</i>' }, min: 0.2, max: 3,  step: 0.05, value: 0.8, fmt: v => fmt(v) + ' rad/s' },
  /* —— 链式法则页专用 —— */
  { key: 'pairSel', label: { zh: '函数组合 <i>f</i>∘<i>g</i>', en: 'Function pair <i>f</i>∘<i>g</i>' }, min: 0, max: 1, step: 1, value: 0,
    fmt: v => t({ zh: ['y = sin(x²/2)', 'y = sin²x'][v], en: ['y = sin(x²/2)', 'y = sin²x'][v] }) },
  { key: 'hStep', label: { zh: '小步长 <i>h</i>', en: 'Small step <i>h</i>' }, min: 0.05, max: 1, step: 0.01, value: 0.5, fmt: v => fmt(v) }
];

/* 每个滑杆归属的页签（未列出者在所有页签显示，如 x₀、ω）——用于按页签隐藏无关滑杆。
   这是场景级 UI 辅助（不改引擎函数）：一个独立的 rAF 轮询在页签切换时更新 .ctl 行的显隐，
   与 PARAMS 顺序一一对应（paramsHost 的第 i 个子节点即 PARAMS[i]）。 */
const PARAM_TABS = {
  dx:  ['secant', 'diff', 'partial'],
  lam: ['secant', 'diff', 'partial'],
  y0:  ['secant', 'diff', 'partial'],
  pairSel: ['chain'],
  hStep:   ['chain']
};
let _paramSyncTab = null;
function syncParamRows() {
  if (curTab === _paramSyncTab) return;
  const host = document.getElementById('paramsHost');
  if (!host || host.children.length < PARAMS.length) return;
  _paramSyncTab = curTab;
  PARAMS.forEach((p, i) => {
    const row = host.children[i];
    if (!row) return;
    const tabs = PARAM_TABS[p.key];
    row.style.display = (!tabs || tabs.indexOf(curTab) !== -1) ? '' : 'none';
  });
}
/* 首帧后启动（此时引擎已完成同步初始化，curTab 已就绪，避免 TDZ） */
requestAnimationFrame(function _paramSyncLoop() { syncParamRows(); requestAnimationFrame(_paramSyncLoop); });

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：微分学绘图助手（引擎之上，引擎零改动） ────── */
const ROSE_A = 'rgba(251,113,133,';
const VIO_A = 'rgba(167,139,250,';
const EME_A = 'rgba(52,211,153,';
const CYAN_A = 'rgba(45,212,234,';
const AMB_A = 'rgba(251,191,36,';

/* 一维主角函数与其导数（页签一/二） */
const F = x => 0.5 * Math.sin(1.2 * x) + 0.15 * x * x;
const dF = x => 0.6 * Math.cos(1.2 * x) + 0.3 * x;
/* 二维曲面与偏导（页签三） */
const G = (x, y) => 0.8 * Math.sin(x) * Math.cos(y);
const Gx = (x, y) => 0.8 * Math.cos(x) * Math.cos(y);
const Gy = (x, y) => -0.8 * Math.sin(x) * Math.sin(y);

/* 公式清单（dim 参考区，不参与交互） */
function formulaList(title, lines) {
  return '<div class="dim" style="margin-top:8px;border-top:1px dashed rgba(148,163,184,.2);padding-top:6px">' +
    t(title) + '</div>' +
    lines.map(s => '<div class="dim" style="font-family:var(--font-math);font-style:italic">' + s + '</div>').join('');
}
function drawCurveF(C, x0, x1, fn, z, w, col) {
  const pts = [];
  for (let i = 0; i <= 180; i++) { const x = x0 + (x1 - x0) * i / 180; pts.push([x, fn(x), z]); }
  strokePoly(C, pts, { width: w + 3.5, color: col + '0.13)' });
  strokePoly(C, pts, { width: w, color: col + '0.95)' });
}

/* ── 链式法则（页签三）：函数组合库与三级映射站台 ──
   区间一律用线性化（微分）端点：|du| = |g′|·h、|dy| = |f′·g′|·h，
   长度之比就是缩放倍数——倍数连乘可被「看见」。 */
const ORA_A = 'rgba(251,146,60,';
const CHAIN_PAIRS = [
  { g: x => x * x / 2, dg: x => x, f: u => Math.sin(u), df: u => Math.cos(u), uOff: -1, yOff: 0,
    uLab: 'u = g(x) = x²/2', yLab: 'y = f(u) = sin u', cLab: 'y = sin(x²/2)',
    dLab: '(sin(x²/2))′ = cos(x²/2)·x' },
  { g: x => Math.sin(x), dg: x => Math.cos(x), f: u => u * u, df: u => 2 * u, uOff: 0, yOff: -0.5,
    uLab: 'u = g(x) = sin x', yLab: 'y = f(u) = u²', cLab: 'y = sin²x',
    dLab: '(sin²x)′ = 2 sin x·cos x = sin 2x' }
];
const chainPair = () => CHAIN_PAIRS[Math.round(state.pairSel || 0)];
/* x₀：滑杆摆位；开「时钟扫描」时由共享时钟带着扫过定义域（含 g′ 变号处） */
function chainX0() { return state.chainSweep ? 1.95 * Math.sin(state.theta) : clamp(state.x0, -2, 2); }
/* 站台：z=0 平面上高度 y 处的一条水平数轴；off = 站台读数 → 世界坐标的平移 */
function chainStation(C, y, off, axLab, labCol) {
  line3(C, [-2.8, y, 0], [2.85, y, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [2.85, y, 0], [2.65, y, 0], AXIS);
  for (let w = -2; w <= 2; w++) {
    line3(C, [w, y - 0.05, 0], [w, y + 0.05, 0], { width: 1.2, color: AXIS_DIM });
    const val = w - off;
    label3(C, [w, y - 0.22, 0], (val < 0 ? '−' : '') + Math.abs(val), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
  label3(C, [-2.9, y, 0], axLab, { font: 'italic 13px ' + FONT_MATH, color: labCol, align: 'right', dx: -6 });
}
/* 站台上的有向区间：a 锚点 → b 动端（g′ < 0 时箭头自动调头） */
function chainInterval(C, y, a, b, colA, hex) {
  line3(C, [a, y, 0], [b, y, 0], { width: 4, color: colA + '0.9)' });
  if (Math.abs(b - a) > 0.02) arrowAt(C, [b, y, 0], [a, y, 0], hex);
  solidDot(C, [a, y, 0], 3, hex);
  const s = proj(C, [b, y, 0]);
  if (s) glowDot(s, 8, '#ffffff', colA + '0.9)');
}

const SCENES = {

  /* ────── 一：导数 · 割线到切线 ────── */
  secant: {
    label: { zh: '导数 · 割线到切线', en: 'Derivative · Secant' },
    brand: { zh: '导数不是公式，是一个吸附过程：让琥珀割线的第二个脚 Δx 越靠越近，它便一路吸附到翠绿切线上——那个逃不掉的极限斜率，就是 f′(x₀)。',
             en: 'A derivative is not a formula but a snapping process: slide the amber secant’s second foot Δx closer and closer, and it locks onto the emerald tangent — that inescapable limiting slope is f′(x₀).' },
    tips: { zh: '提示：切「正视 x·y」把 Δx 从 1.5 拖到 0.02——盯着读数区：割线斜率一位一位逼近 f′(x₀)。再打开「导函数 f′(x)」：每一点的切线斜率连成紫色曲线，导数从一个数升格为一个函数。',
            en: 'Tip: in "Front x·y" drag Δx from 1.5 to 0.02 — watch the readout: the secant slope closes in on f′(x₀) digit by digit. Then enable "Derivative f′(x)": tangent slopes at every point join into the violet curve — the derivative graduates from a number to a function.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.55, el: 0.3, dist: 9.5, tx: 0, ty: 0.6, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 7.5, tx: 0, ty: 0.6, tz: 0 }
    },
    toggles: [
      { key: 'showDeriv', label: { zh: '导函数 <i>f</i>′(<i>x</i>)', en: 'Derivative <i>f</i>′(<i>x</i>)' }, color: '#a78bfa', checked: false },
      { key: 'showTan',   label: { zh: '切线', en: 'Tangent' }, color: '#34d399', checked: true },
      { key: 'showSec',   label: { zh: '割线', en: 'Secant' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const x0 = state.x0, dx = state.dx, y0 = F(x0), k = dF(x0);
      if (state.showGrid) drawGridXY(C, 3, 1);
      drawAxes(C, { ex: 3.1, ey: 2.1, yTicks: [1], xTicks: [1, 2], tAxis: false });
      /* 导函数（紫，虚线） */
      if (state.showDeriv) {
        const dp = [];
        for (let i = 0; i <= 160; i++) { const x = -3 + 6 * i / 160; dp.push([x, dF(x), 0]); }
        strokePoly(C, dp, { width: 1.6, dash: [6, 5], color: VIO_A + '0.85)' });
        label3(C, [2.6, dF(2.6), 0], "f′(x)", { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 8 });
        const sd = proj(C, [x0, k, 0]);
        if (sd) glowDot(sd, 7, '#ffffff', VIO_A + '0.85)');
        line3(C, [x0, y0, 0], [x0, k, 0], { width: 1, dash: [3, 5], color: VIO_A + '0.35)' });
      }
      /* 主角 f（玫红） */
      drawCurveF(C, -3, 3, F, 0, 2.4, ROSE_A);
      label3(C, [-2.9, F(-2.9), 0], 'f(x)', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'right', dx: -8, dy: -8 });
      /* 切线（翠绿） */
      if (state.showTan) {
        const L = 1.6;
        line3(C, [x0 - L, y0 - k * L, 0], [x0 + L, y0 + k * L, 0], { width: 2, color: EME_A + '0.9)' });
        label3(C, [x0 + L, y0 + k * L, 0], t({ zh: '切线', en: 'tangent' }), { size: 11, color: '#34d399', align: 'left', dx: 8 });
      }
      /* 割线（琥珀）：两脚分别在 x₀ 与 x₀+Δx */
      const x1 = x0 + dx, y1 = F(x1), ks = (y1 - y0) / dx;
      if (state.showSec) {
        line3(C, [x0 - 0.9, y0 - ks * 0.9, 0], [x1 + 0.9, y1 + ks * 0.9, 0], { width: 1.6, dash: [7, 5], color: AMB_A + '0.85)' });
        const s1 = proj(C, [x1, y1, 0]);
        if (s1) glowDot(s1, 8, '#ffffff', AMB_A + '0.9)');
        line3(C, [x0, -1.15, 0], [x1, -1.15, 0], { width: 1.2, color: AMB_A + '0.7)' });
        line3(C, [x0, -1.21, 0], [x0, -1.09, 0], { width: 1.2, color: AMB_A + '0.7)' });
        line3(C, [x1, -1.21, 0], [x1, -1.09, 0], { width: 1.2, color: AMB_A + '0.7)' });
        label3(C, [(x0 + x1) / 2, -1.35, 0], 'Δx', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
      }
      const sp = proj(C, [x0, y0, 0]);
      if (sp) glowDot(sp, 11, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const x0 = state.x0, dx = state.dx;
      const ks = (F(x0 + dx) - F(x0)) / dx, k = dF(x0);
      let out = '<div>x₀ = <b>' + fmtS(x0) + '</b>&ensp;·&ensp;Δx = <b>' + fmt(dx) + '</b></div>' +
        '<div><span style="color:#fbbf24">' + t({ zh: '割线斜率', en: 'secant slope' }) + ' = Δy/Δx = <b>' + fmtS(ks, 4) + '</b></span></div>' +
        '<div class="tanC">' + t({ zh: '切线斜率', en: 'tangent slope' }) + ' f′(x₀) = <b>' + fmtS(k, 4) + '</b></div>' +
        '<div class="dim">' + t({ zh: '差距', en: 'gap' }) + ' = ' + Math.abs(ks - k).toFixed(4) + '&ensp;·&ensp;Δx → 0 ' + t({ zh: '时割线 → 切线', en: ': secant → tangent' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（斜率的极限）', en: 'Formulas this tab generates (limits of slope)' }, [
        "f′(x) = lim (Δx→0) [f(x+Δx) − f(x)] / Δx",
        "(xⁿ)′ = n·xⁿ⁻¹ · (eˣ)′ = eˣ · (ln x)′ = 1/x",
        "(sin x)′ = cos x · (cos x)′ = −sin x",
        "(u±v)′ = u′±v′ · (uv)′ = u′v + uv′",
        "(u/v)′ = (u′v − uv′)/v²",
        t({ zh: '链式法则', en: 'chain rule' }) + ": [f(g(x))]′ = f′(g(x))·g′(x)"
      ]);
      return out;
    }
  },

  /* ────── 二：微分 · 以直代曲 ────── */
  diff: {
    label: { zh: '微分 · 以直代曲', en: 'Differential · dy' },
    brand: { zh: '从切点走出 Δx：曲线爬了 Δy，切线爬了 dy = f′·Δx，差出来的小尾巴是高阶无穷小 o(Δx)。微分就是增量里「直的那部分」——这就是 dy 能当 Δy 用的全部理由。',
             en: 'Step Δx from the tangent point: the curve climbs Δy, the tangent climbs dy = f′·Δx, and the little leftover tail is o(Δx). The differential is the straight part of the increment — the whole reason dy can stand in for Δy.' },
    tips: { zh: '提示：切「正视 x·y」把显微倍率 λ 拖大——窗口里曲线越来越直，玫红 Δy 与翠绿 dy 越贴越紧，琥珀尾巴 o(Δx) 占比归零；再把 Δx 缩小，看读数区「误差/Δx」一路趋 0。',
            en: 'Tip: in "Front x·y" crank the zoom λ — the curve straightens in the window, rose Δy and emerald dy hug tighter, and the amber tail o(Δx) shrinks to nothing; then shrink Δx and watch "error/Δx" in the readout run to 0.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.55, el: 0.3, dist: 9, tx: 0.3, ty: 0.4, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 7, tx: 0.3, ty: 0.4, tz: 0 }
    },
    toggles: [
      { key: 'showTan2',   label: { zh: '切线（线性部分）', en: 'Tangent (linear part)' }, color: '#34d399', checked: true },
      { key: 'showDecomp', label: { zh: '增量分解 Δ<i>y</i> = d<i>y</i> + <i>o</i>(Δ<i>x</i>)', en: 'Split Δ<i>y</i> = d<i>y</i> + <i>o</i>(Δ<i>x</i>)' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const x0 = state.x0, L = state.lam, k = dF(x0);
      if (state.showGrid) drawGridXY(C, 2.5, 0.5);
      /* 显微窗口坐标：u = (x−x₀)·λ，v = (f(x)−f(x₀))·λ（横纵同倍率，斜率保真） */
      drawAxes(C, { ex: 2.5, ey: 2.1, yTicks: [], xTicks: [], tAxis: false });
      label3(C, [2.7, -0.22, 0], 'λ·(x−x₀)', { font: 'italic 11px ' + FONT_MATH, color: 'rgba(159,176,200,.6)', align: 'center' });
      /* 曲线（玫红，显微下） */
      const pts = [];
      for (let i = 0; i <= 200; i++) {
        const u = -2.4 + 4.8 * i / 200;
        const v = (F(x0 + u / L) - F(x0)) * L;
        if (Math.abs(v) > 2.1) { pts.push(null); continue; }
        pts.push([u, v, 0]);
      }
      strokePoly(C, pts, { width: 5.5, color: ROSE_A + '0.13)' });
      strokePoly(C, pts, { width: 2.4, color: ROSE_A + '0.95)' });
      label3(C, [-2.35, (F(x0 - 2.35 / L) - F(x0)) * L, 0], 'f', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'right', dx: -8 });
      /* 切线（翠绿，过原点斜率 f′——显微下不变） */
      if (state.showTan2) {
        line3(C, [-2.4, -2.4 * k, 0], [2.4, 2.4 * k, 0], { width: 2, color: EME_A + '0.9)' });
        label3(C, [2.1, 2.1 * k, 0], 'dy = f′·dx', { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'left', dx: 8, dy: -8 });
      }
      /* 增量分解：u₁ = Δx·λ 处的三根竖段 */
      if (state.showDecomp) {
        const u1 = Math.min(state.dx * L, 2.2);
        const dyv = k * u1;                                    // 切线爬升（显微坐标）
        const Dyv = (F(x0 + u1 / L) - F(x0)) * L;              // 曲线爬升（显微坐标）
        line3(C, [u1, Math.min(0, Math.min(dyv, Dyv)) - 0.2, 0], [u1, Math.max(dyv, Dyv) + 0.2, 0], { width: 1, dash: [3, 5], color: 'rgba(148,163,184,0.35)' });
        line3(C, [u1 - 0.05, 0, 0], [u1 - 0.05, Dyv, 0], { width: 4, color: ROSE_A + '0.85)' });
        label3(C, [u1 - 0.05, Dyv / 2, 0], 'Δy', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'right', dx: -10 });
        line3(C, [u1 + 0.05, 0, 0], [u1 + 0.05, dyv, 0], { width: 4, color: EME_A + '0.9)' });
        label3(C, [u1 + 0.05, dyv / 2, 0], 'dy', { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'left', dx: 10 });
        line3(C, [u1 + 0.05, dyv, 0], [u1 + 0.05, Dyv, 0], { width: 4, color: AMB_A + '0.95)' });
        label3(C, [u1 + 0.05, (dyv + Dyv) / 2, 0], 'o(Δx)', { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 10 });
        const pe = proj(C, [u1, Dyv, 0]);
        if (pe) glowDot(pe, 8, '#ffffff', ROSE_A + '0.9)');
      }
      const so = proj(C, [0, 0, 0]);
      if (so) glowDot(so, 10, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const x0 = state.x0, dx = state.dx, k = dF(x0);
      const Dy = F(x0 + dx) - F(x0), dy = k * dx, err = Dy - dy;
      let out = '<div>x₀ = <b>' + fmtS(x0) + '</b>&ensp;·&ensp;Δx = <b>' + fmt(dx) + '</b>&ensp;·&ensp;λ = <b>' + fmt(state.lam, 1) + '×</b></div>' +
        '<div class="sinC">Δy = <b>' + fmtS(Dy, 4) + '</b></div>' +
        '<div class="tanC">dy = f′(x₀)·Δx = <b>' + fmtS(dy, 4) + '</b></div>' +
        '<div><span style="color:#fbbf24">o(Δx) = Δy − dy = <b>' + fmtS(err, 4) + '</b>&ensp;·&ensp;' + t({ zh: '误差', en: 'error' }) + '/Δx = <b>' + (err / dx).toFixed(4) + '</b> → 0</span></div>';
      out += formulaList({ zh: '本页生成的公式（增量的分解）', en: 'Formulas this tab generates (splitting the increment)' }, [
        'dy = f′(x)·dx',
        'Δy = dy + o(Δx)',
        t({ zh: '一阶近似', en: 'linear approx' }) + ': f(x+Δx) ≈ f(x) + f′(x)·Δx',
        'd(u±v) = du±dv · d(uv) = u·dv + v·du',
        'd(u/v) = (v·du − u·dv)/v²',
        t({ zh: '形式不变性', en: 'form invariance' }) + ': dy = f′(u)·du' + t({ zh: '（u 是中间变量也成立）', en: ' (holds for intermediate u)' })
      ]);
      return out;
    }
  },

  /* ────── 三：链式法则 · 两次缩放 ────── */
  chain: {
    label: { zh: '链式法则 · 两次缩放', en: 'Chain rule · Two scalings' },
    brand: { zh: '链式法则不是公式咒语，而是两次局部缩放的连乘：玫红小步 h 先被 g′(x₀) 缩放成紫色中间增量 du，再被 f′(u₀) 缩放成翠绿输出增量 dy——两个倍数一乘，正是橙色复合曲线的斜率 dy/dx。',
             en: 'The chain rule is no incantation but two local scalings composed: the rose step h is scaled by g′(x₀) into the violet middle increment du, then by f′(u₀) into the emerald output dy — multiply the two factors and you have the slope dy/dx of the orange composite curve.' },
    tips: { zh: '提示：切「三级映射 x·y」看小步 h 被拉伸两次；把 x₀ 拖过 g′ 变号处（sin(x²/2) 在 x₀ = 0，sin²x 在 x₀ = ±1.57）——紫色区间当场调头，负导数的复合从此不再神秘。读数区里 f′·g′ 与差商 [f(g(x₀+h))−f(g(x₀))]/h 正在两位小数上咬合，h 越小咬得越紧。',
            en: 'Tip: in "Pipeline x·y" watch the little step h get stretched twice; drag x₀ across a sign flip of g′ (x₀ = 0 for sin(x²/2), x₀ = ±1.57 for sin²x) — the violet interval reverses on the spot, and composing negative derivatives stops being mysterious. In the readout, f′·g′ and the quotient [f(g(x₀+h))−f(g(x₀))]/h agree to two decimals — the smaller h, the tighter the lock.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.5, el: 0.28, dist: 10.5, tx: 0, ty: -0.7, tz: 0 },
      map:   { label: { zh: '三级映射 x·y', en: 'Pipeline x·y' }, az: 0.001, el: 0.02, dist: 9, tx: 0, ty: -0.7, tz: 0 },
      curve: { label: { zh: '复合曲线 x·y', en: 'Composite x·y' }, az: 0.001, el: 0.02, dist: 6, tx: 0, ty: -2.5, tz: 0,
               onSelect() { if (!state.showComp) { state.showComp = true; document.querySelectorAll('input[data-key="showComp"]').forEach(o => { o.checked = true; }); } } }
    },
    toggles: [
      { key: 'showIntX',    label: { zh: '输入小步 <i>h</i>', en: 'Input step <i>h</i>' }, color: '#fb7185', checked: true },
      { key: 'showIntU',    label: { zh: '中间增量 d<i>u</i> = <i>g</i>′·<i>h</i>', en: 'Middle d<i>u</i> = <i>g</i>′·<i>h</i>' }, color: '#a78bfa', checked: true },
      { key: 'showIntY',    label: { zh: '输出增量 d<i>y</i> = <i>f</i>′·d<i>u</i>', en: 'Output d<i>y</i> = <i>f</i>′·d<i>u</i>' }, color: '#34d399', checked: true },
      { key: 'showComp',    label: { zh: '复合曲线与切线', en: 'Composite & tangent' }, color: '#fb923c', checked: true },
      { key: 'showThreads', label: { zh: '映射连线', en: 'Mapping threads' }, color: '#fbbf24', checked: true },
      { key: 'chainSweep',  label: { zh: '时钟扫描 <i>x</i>₀', en: 'Clock sweep <i>x</i>₀' }, color: '#2dd4ea', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const P = chainPair();
      const x0 = chainX0(), h = state.hStep;
      const u0 = P.g(x0), gp = P.dg(x0), fp = P.df(u0);
      const y0v = P.f(u0), k = fp * gp;
      const yX = 2.1, yU = 0.9, yY = -0.3, yC = -2.5;
      const wu0 = u0 + P.uOff, wu1 = wu0 + gp * h;
      const wy0 = y0v + P.yOff, wy1 = wy0 + fp * gp * h;

      /* 三级站台（x → u → y 流水线） */
      chainStation(C, yX, 0, 'x', '#c4d2e6');
      chainStation(C, yU, P.uOff, P.uLab, '#a78bfa');
      chainStation(C, yY, P.yOff, P.yLab, '#34d399');

      /* 映射连线（暗色引导虚线，端点对端点）+ 琥珀缩放倍数 */
      if (state.showThreads) {
        line3(C, [x0, yX, 0], [wu0, yU, 0], { width: 1.5, dash: [7, 7], color: VIO_A + '0.45)' });
        line3(C, [x0 + h, yX, 0], [wu1, yU, 0], { width: 1.5, dash: [7, 7], color: VIO_A + '0.45)' });
        line3(C, [wu0, yU, 0], [wy0, yY, 0], { width: 1.5, dash: [7, 7], color: EME_A + '0.45)' });
        line3(C, [wu1, yU, 0], [wy1, yY, 0], { width: 1.5, dash: [7, 7], color: EME_A + '0.45)' });
        label3(C, [(x0 + h / 2 + wu0 + gp * h / 2) / 2, (yX + yU) / 2, 0], '× g′(x₀) = ' + fmtS(gp), { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 10 });
        label3(C, [(wu0 + gp * h / 2 + wy0 + fp * gp * h / 2) / 2, (yU + yY) / 2, 0], '× f′(u₀) = ' + fmtS(fp), { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left', dx: 10 });
      }

      /* 复合曲线面板（橙）：y = f(g(x)) 与切线，斜率恰为 f′·g′ */
      if (state.showComp) {
        line3(C, [-2.8, yC, 0], [2.85, yC, 0], { width: 1.4, color: AXIS });
        arrowAt(C, [2.85, yC, 0], [2.65, yC, 0], AXIS);
        label3(C, [3.0, yC, 0], 'x', { font: 'italic 13px ' + FONT_MATH, color: '#c4d2e6', align: 'left', dx: 4 });
        line3(C, [0, yC - 1.3, 0], [0, yC + 1.3, 0], { width: 1.4, color: AXIS });
        const pts = [];
        for (let i = 0; i <= 220; i++) { const x = -2.7 + 5.4 * i / 220; pts.push([x, yC + P.f(P.g(x)), 0]); }
        strokePoly(C, pts, { width: 5.5, color: ORA_A + '0.13)' });
        strokePoly(C, pts, { width: 2.2, color: ORA_A + '0.95)' });
        label3(C, [-2.9, yC + P.f(P.g(-2.7)), 0], P.cLab, { font: 'italic 13px ' + FONT_MATH, color: '#fb923c', align: 'right', dx: -6 });
        const Lt = 1.0;
        line3(C, [x0 - Lt, yC + y0v - k * Lt, 0], [x0 + Lt, yC + y0v + k * Lt, 0], { width: 1.6, color: ORA_A + '0.55)' });
        label3(C, [x0 + Lt, yC + y0v + k * Lt, 0], 'dy/dx = f′·g′', { font: 'italic 12px ' + FONT_MATH, color: '#fb923c', align: 'left', dx: 8 });
        /* h 步长标尺（琥珀）与曲线上的两点 */
        line3(C, [x0, yC - 1.42, 0], [x0 + h, yC - 1.42, 0], { width: 1.2, color: AMB_A + '0.7)' });
        line3(C, [x0, yC - 1.48, 0], [x0, yC - 1.36, 0], { width: 1.2, color: AMB_A + '0.7)' });
        line3(C, [x0 + h, yC - 1.48, 0], [x0 + h, yC - 1.36, 0], { width: 1.2, color: AMB_A + '0.7)' });
        label3(C, [x0 + h / 2, yC - 1.62, 0], 'h', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        const s2 = proj(C, [x0 + h, yC + P.f(P.g(x0 + h)), 0]);
        if (s2) glowDot(s2, 6, '#ffffff', ORA_A + '0.75)');
        const s1 = proj(C, [x0, yC + y0v, 0]);
        if (s1) glowDot(s1, 9, '#ffffff', ORA_A + '0.9)');
      }

      /* 三段区间（玫红 → 紫 → 翠绿）：长度连乘可被看见 */
      if (state.showIntX) {
        chainInterval(C, yX, x0, x0 + h, ROSE_A, '#fb7185');
        label3(C, [x0 + h / 2, yX + 0.24, 0], 'h', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }
      if (state.showIntU) {
        chainInterval(C, yU, wu0, wu1, VIO_A, '#a78bfa');
        label3(C, [wu0 + gp * h / 2, yU + 0.24, 0], 'du = g′·h', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
      }
      if (state.showIntY) {
        chainInterval(C, yY, wy0, wy1, EME_A, '#34d399');
        label3(C, [wy0 + fp * gp * h / 2, yY + 0.24, 0], 'dy = f′·du', { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'center' });
      }

      /* 主点：输入站台上的 x₀ */
      const sp = proj(C, [x0, yX, 0]);
      if (sp) glowDot(sp, 11, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const P = chainPair();
      const x0 = chainX0(), h = state.hStep;
      const u0 = P.g(x0), gp = P.dg(x0), fp = P.df(u0);
      const k = fp * gp;
      const ks = (P.f(P.g(x0 + h)) - P.f(u0)) / h;
      let out = '<div>x₀ = <b>' + fmtS(x0) + '</b>&ensp;·&ensp;u₀ = g(x₀) = <b>' + fmtS(u0) + '</b></div>' +
        '<div class="sinC">' + t({ zh: '输入小步', en: 'input step' }) + ' h = <b>' + fmt(h) + '</b></div>' +
        '<div class="cosC">du/dx = g′(x₀) = <b>' + fmtS(gp, 4) + '</b></div>' +
        '<div class="tanC">dy/du = f′(u₀) = <b>' + fmtS(fp, 4) + '</b></div>' +
        '<div class="cotC">dy/dx = f′(u₀)·g′(x₀) = <b>' + fmtS(k, 4) + '</b></div>' +
        '<div><span style="color:#fbbf24">[f(g(x₀+h)) − f(g(x₀))]/h = <b>' + fmtS(ks, 4) + '</b></span></div>' +
        '<div class="dim">' + t({ zh: '差距', en: 'gap' }) + ' = ' + Math.abs(ks - k).toFixed(4) + '&ensp;·&ensp;h → 0 ' + t({ zh: '时差商 → 乘积', en: ': quotient → product' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（缩放倍数的连乘）', en: 'Formulas this tab generates (composing scale factors)' }, [
        "[f(g(x))]′ = f′(g(x))·g′(x)",
        'dy/dx = (dy/du)·(du/dx)',
        'du = g′(x)·dx · dy = f′(u)·du',
        P.dLab,
        t({ zh: '负 × 负 = 正：两次反向 = 同向', en: 'neg × neg = pos: two reversals restore direction' })
      ]);
      return out;
    }
  },

  /* ────── 四：偏微分 · 切平面 ────── */
  partial: {
    label: { zh: '偏微分 · 切平面', en: 'Partial · Tangent plane' },
    brand: { zh: '偏导数没有新东西：固定 y 只动 x，曲面塌成一条曲线，∂f/∂x 就是普通切线的斜率。两根切线撑起一块翠绿切平面——全微分 dz = f_x·dx + f_y dy，二维的「以直代曲」。',
             en: 'Partial derivatives contain nothing new: freeze y, move only x, and the surface collapses to a curve whose ordinary tangent slope is ∂f/∂x. Two such tangents span the emerald tangent plane — the total differential dz = f_x·dx + f_y dy, "replace curved with flat" in 2D.' },
    tips: { zh: '提示：切「正视 ∂f/∂x」——曲面塌成玫红切片，画面瞬间变回页签一；转 90° 看「侧视 ∂f/∂y」是另一条。回到立体看琥珀探针绕切点转圈：半径 Δx 缩小，曲面值与切平面值的误差读数一路归零——全微分成立。',
            en: 'Tip: switch to "Front ∂f/∂x" — the surface collapses into the rose slice and you are back at tab one; turn 90° for "Side ∂f/∂y". Back in 3D, watch the amber probe circle the point: shrink the radius Δx and the surface-vs-plane error in the readout runs to zero — the total differential holds.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.7, el: 0.38, dist: 9.5, tx: 0, ty: 0.3, tz: 0 },
      frontX: { label: { zh: '正视 ∂f/∂x', en: 'Front ∂f/∂x' }, az: 0.001, el: 0.02, dist: 7.5, tx: 0, ty: 0.3, tz: 0 },
      sideY:  { label: { zh: '侧视 ∂f/∂y', en: 'Side ∂f/∂y' }, az: -Math.PI / 2, el: 0.02, dist: 7.5, tx: 0, ty: 0.3, tz: 0 }
    },
    toggles: [
      { key: 'showSliceX', label: { zh: '<i>x</i> 切片与 ∂f/∂x', en: '<i>x</i> slice & ∂f/∂x' }, color: '#fb7185', checked: true },
      { key: 'showSliceY', label: { zh: '<i>y</i> 切片与 ∂f/∂y', en: '<i>y</i> slice & ∂f/∂y' }, color: '#a78bfa', checked: true },
      { key: 'showPlane',  label: { zh: '切平面', en: 'Tangent plane' }, color: '#34d399', checked: true },
      { key: 'showProbe',  label: { zh: '误差探针', en: 'Error probe' }, color: '#fbbf24', checked: true },
      { key: 'showSurf',   label: { zh: '曲面', en: 'Surface' }, color: '#2dd4ea', checked: true }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const x0 = clamp(state.x0, -2, 2), y0 = state.y0;
      const z0 = G(x0, y0), gx = Gx(x0, y0), gy = Gy(x0, y0);
      /* 地面轴 */
      line3(C, [-2.4, 0, 0], [2.6, 0, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [2.6, 0, 0], [2.4, 0, 0], AXIS);
      label3(C, [2.85, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      line3(C, [0, 0, -2.4], [0, 0, 2.6], { width: 1.4, color: AXIS });
      label3(C, [0, 0, 2.85], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      line3(C, [0, -0.1, 0], [0, 1.5, 0], { width: 1.4, color: AXIS });
      label3(C, [0, 1.72, 0], 'z', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });

      /* 曲面线框（青，源几何）：世界 (x, G, y) */
      if (state.showSurf) {
        for (let i = 0; i <= 12; i++) {
          const c = -2.2 + 4.4 * i / 12, l1 = [], l2 = [];
          for (let j = 0; j <= 24; j++) {
            const s = -2.2 + 4.4 * j / 24;
            l1.push([c, G(c, s), s]);
            l2.push([s, G(s, c), c]);
          }
          strokePoly(C, l1, { width: 1, color: CYAN_A + '0.2)' });
          strokePoly(C, l2, { width: 1, color: CYAN_A + '0.2)' });
        }
        label3(C, [-2.2, G(-2.2, -2.2), -2.2], 'z = f(x, y)', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'right', dx: -8, dy: -8 });
      }
      /* 切平面（翠绿小网格）：z = z₀ + f_x·du + f_y·dv */
      if (state.showPlane) {
        const R = 0.95;
        for (let i = -2; i <= 2; i++) {
          const d = i * R / 2, p1 = [], p2 = [];
          for (let j = -2; j <= 2; j++) {
            const e = j * R / 2;
            p1.push([x0 + d, z0 + gx * d + gy * e, y0 + e]);
            p2.push([x0 + e, z0 + gx * e + gy * d, y0 + d]);
          }
          strokePoly(C, p1, { width: 1.2, color: EME_A + '0.5)' });
          strokePoly(C, p2, { width: 1.2, color: EME_A + '0.5)' });
        }
        label3(C, [x0 + R, z0 + gx * R + gy * R, y0 + R], 'dz = f_x·dx + f_y dy',
          { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'left', dx: 8, dy: -8 });
      }
      /* x 方向切片（玫红）与其切线 */
      if (state.showSliceX) {
        const sp = [];
        for (let i = 0; i <= 100; i++) { const x = -2.2 + 4.4 * i / 100; sp.push([x, G(x, y0), y0]); }
        strokePoly(C, sp, { width: 4.5, color: ROSE_A + '0.13)' });
        strokePoly(C, sp, { width: 2.2, color: ROSE_A + '0.9)' });
        line3(C, [x0 - 1.1, z0 - gx * 1.1, y0], [x0 + 1.1, z0 + gx * 1.1, y0], { width: 1.6, dash: [6, 5], color: ROSE_A + '0.8)' });
        label3(C, [x0 + 1.1, z0 + gx * 1.1, y0], '∂f/∂x', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'left', dx: 8 });
      }
      /* y 方向切片（紫）与其切线 */
      if (state.showSliceY) {
        const sp = [];
        for (let i = 0; i <= 100; i++) { const y = -2.2 + 4.4 * i / 100; sp.push([x0, G(x0, y), y]); }
        strokePoly(C, sp, { width: 4.5, color: VIO_A + '0.13)' });
        strokePoly(C, sp, { width: 2.2, color: VIO_A + '0.9)' });
        line3(C, [x0, z0 - gy * 1.1, y0 - 1.1], [x0, z0 + gy * 1.1, y0 + 1.1], { width: 1.6, dash: [6, 5], color: VIO_A + '0.8)' });
        label3(C, [x0, z0 + gy * 1.1, y0 + 1.1], '∂f/∂y', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 8 });
      }
      /* 切点 */
      const pp = proj(C, [x0, z0, y0]);
      if (pp) glowDot(pp, 11, '#ffffff', 'rgba(186,240,255,0.9)');
      /* 误差探针（琥珀）：绕切点转圈，半径 = Δx */
      if (state.showProbe) {
        const r = Math.min(state.dx, 1.2), th = state.theta;
        const px = x0 + r * Math.cos(th), py = y0 + r * Math.sin(th);
        const zs = G(px, py), zp = z0 + gx * (px - x0) + gy * (py - y0);
        line3(C, [px, zs, py], [px, zp, py], { width: 1.6, dash: [4, 4], color: AMB_A + '0.85)' });
        const p1 = proj(C, [px, zs, py]);
        if (p1) glowDot(p1, 8, '#ffffff', AMB_A + '0.9)');
        const p2 = proj(C, [px, zp, py]);
        if (p2) glowDot(p2, 6, '#ffffff', EME_A + '0.8)');
      }
    },
    readout() {
      const x0 = clamp(state.x0, -2, 2), y0 = state.y0;
      const gx = Gx(x0, y0), gy = Gy(x0, y0);
      const r = Math.min(state.dx, 1.2), th = state.theta;
      const px = x0 + r * Math.cos(th), py = y0 + r * Math.sin(th);
      const err = Math.abs(G(px, py) - (G(x0, y0) + gx * (px - x0) + gy * (py - y0)));
      let out = '<div>P = (<b>' + fmtS(x0) + '</b>, <b>' + fmtS(y0) + '</b>)&ensp;·&ensp;' + t({ zh: '探针半径', en: 'probe radius' }) + ' = <b>' + fmt(r) + '</b></div>' +
        '<div class="sinC">∂f/∂x = <b>' + fmtS(gx, 3) + '</b></div>' +
        '<div class="cosC">∂f/∂y = <b>' + fmtS(gy, 3) + '</b></div>' +
        '<div><span style="color:#fbbf24">' + t({ zh: '曲面 − 切平面', en: 'surface − plane' }) + ' = <b>' + err.toFixed(4) + '</b>' + t({ zh: '（缩小 Δx 看它归零）', en: ' (shrink Δx and watch it vanish)' }) + '</span></div>';
      out += formulaList({ zh: '本页生成的公式（二维以直代曲）', en: 'Formulas this tab generates (flat replaces curved, 2D)' }, [
        '∂f/∂x = lim (Δx→0) [f(x+Δx, y) − f(x, y)]/Δx',
        t({ zh: '全微分', en: 'total differential' }) + ': dz = (∂f/∂x)dx + (∂f/∂y)dy',
        t({ zh: '切平面', en: 'tangent plane' }) + ': z = z₀ + f_x·(x−x₀) + f_y·(y−y₀)',
        t({ zh: '梯度', en: 'gradient' }) + ': ∇f = (∂f/∂x, ∂f/∂y)',
        t({ zh: '链式法则', en: 'chain rule' }) + ': dz/dt = f_x·dx/dt + f_y·dy/dt',
        t({ zh: '混合偏导', en: 'mixed partials' }) + ': ∂²f/∂x∂y = ∂²f/∂y∂x'
      ]);
      return out;
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 页签三的误差探针：记录当时的真实误差（曲面值 − 切平面值，用当下的参数算） */
  const x0 = clamp(state.x0, -2, 2), y0 = state.y0;
  const r = Math.min(state.dx, 1.2), th = state.theta;
  const px = x0 + r * Math.cos(th), py = y0 + r * Math.sin(th);
  const err = G(px, py) - (G(x0, y0) + Gx(x0, y0) * (px - x0) + Gy(x0, y0) * (py - y0));
  samples.push({ t: state.t, err: err });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
