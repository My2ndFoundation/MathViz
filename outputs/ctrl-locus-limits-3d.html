<!-- ============================================================
  从根轨迹到守恒律 · 反馈的深层结构 —— ctrl-locus-limits-3d
  From Root Locus to Conservation Laws · The Deep Structure of Feedback

  被控对象自始至终是倒立摆（§0.1）：θ̈ = (g/L)·θ + u/(mL²)，开环极点 ±√(g/L)。
  四个页签问它四个问题：极点去哪了 · 要消掉什么 · 代价是多少 · 一只手能管几件事。

  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）
  引擎来源：math-viz-starter.html · STARTER_VERSION 1.1.0（引擎区一行未改）

  制作新工具只需修改三处（均在脚本区顶部，以 ①②③ 标记）：
    ① PARAMS      —— 声明滑杆参数（自动生成 UI）
    ② SCENES      —— 注册场景页签（brand / tips / views / toggles / draw / readout）
    ③ pushSample  —— 按需扩展采样字段（原则：记录当时的真实值）

  版本记录（changelog，新→旧）：
    1.0.0  2026-08-02  首版：增益轴上的三维根轨迹束 · 内模原理与误差谱打洞 ·
                       波德水床效应（∫ln|S|dω = π·p 实测守恒）· 小车-摆的必要多样性
                       v1.0.0 initial release: 3-D root-locus bundle along the gain
                       axis, internal model principle with a notched error spectrum,
                       Bode's waterbed (∫ln|S|dω = π·p verified numerically), and
                       requisite variety on a cart-pole
============================================================ -->

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.1.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;
const ENGINE_VERSION = document.querySelector('meta[name="engine-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'ctrl-locus-limits-3d',
  title: { zh: '从根轨迹到守恒律 · 反馈的深层结构',
           en: 'From Root Locus to Conservation Laws · The Deep Structure of Feedback' },
  h1:    { zh: '从根轨迹到守恒律', en: 'Root Locus to Conservation Laws' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  /* 演算记录与回放（§11）。仅当场景在 RECORD 里声明了钩子时才出现。 */
  recRec:    { zh: '● 记录',   en: '● Record' },
  recStop:   { zh: '■ 停止',   en: '■ Stop' },
  recSave:   { zh: '⬇ 保存',   en: '⬇ Save' },
  recLoad:   { zh: '⬆ 载入',   en: '⬆ Load' },
  recExit:   { zh: '✕ 退出回放', en: '✕ Exit replay' },
  recPlay:   { zh: '▶',        en: '▶' },
  recPause:  { zh: '⏸',        en: '⏸' },
  recRewind: { zh: '⏮',        en: '⏮' },
  recRows:   { zh: ' 行',      en: ' rows' },
  recFull:   { zh: '已达行数上限，录制停止（数据完整，未截断）',
               en: 'Row limit reached, recording stopped (data complete, not truncated)' },
  recRoundEnd: { zh: '本轮结束，录制自动停止', en: 'Round complete, recording stopped' },
  recReplay: { zh: '回放中', en: 'Replaying' },
  recVerifyOK: { zh: '种子比对：本机复现（δ = ', en: 'Seed check: reproduced here (δ = ' },
  recVerifyNo: { zh: '种子比对：本机复现不了（δ = ', en: 'Seed check: not reproducible here (δ = ' },
  recVerifyTail: { zh: '）—— 这不是 bug，见提示', en: ') — not a bug, see the tip' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* TAU 提到 PARAMS/SCENES 之前声明：SCENES.lissa.drive 在对象字面量里直接引用它
   （非惰性函数体内），若仍留在原「常量与状态」区（SCENES 之后）会触发 TDZ 报错。 */
const TAU = Math.PI * 2;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ║  invMap: 状态值→原始值。声明了 map 就必须给（规范 §8 硬约束） ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'L',      label: { zh: '摆长 <i>L</i>',          en: 'Pendulum length <i>L</i>' },   min: 0.4, max: 1.3,  step: 0.05, value: 1.0,  fmt: v => fmt(v) + ' m' },
  { key: 'mass',   label: { zh: '摆质量 <i>m</i>',        en: 'Pendulum mass <i>m</i>' },     min: 0.4, max: 1.3,  step: 0.05, value: 1.0,  fmt: v => fmt(v) + ' kg' },
  { key: 'K',      label: { zh: '比例增益 <i>K</i>',      en: 'Proportional gain <i>K</i>' }, min: 0,   max: 40,   step: 0.2,  value: 20,   fmt: v => fmt(v) + ' N·m/rad' },
  { key: 'Td',     label: { zh: '微分时间 <i>T<sub>d</sub></i>', en: 'Derivative time <i>T<sub>d</sub></i>' }, min: 0.05, max: 0.5, step: 0.01, value: 0.18, fmt: v => fmt(v) + ' s' },
  { key: 'tauF',   label: { zh: '微分滤波 <i>τ<sub>f</sub></i>', en: 'Derivative filter <i>τ<sub>f</sub></i>' }, min: 0.05, max: 0.35, step: 0.01, value: 0.12, fmt: v => fmt(v) + ' s' },
  { key: 'Ti',     label: { zh: '积分时间 <i>T<sub>i</sub></i>', en: 'Integral time <i>T<sub>i</sub></i>' },   min: 1.0, max: 6.0,  step: 0.1,  value: 2.0,  fmt: v => fmt(v) + ' s' },
  { key: 'wDist',  label: { zh: '扰动频率 <i>ω<sub>d</sub></i>', en: 'Disturbance frequency <i>ω<sub>d</sub></i>' }, min: 1.0, max: 12, step: 0.1, value: 5.0, fmt: v => fmt(v) + ' rad/s' },
  { key: 'dAmp',   label: { zh: '扰动幅度 <i>d</i>',      en: 'Disturbance amplitude <i>d</i>' }, min: 0, max: 2.5, step: 0.05, value: 1.2, fmt: v => fmt(v) + ' N·m' },
  { key: 'rhoRes', label: { zh: '谐振器收敛率 <i>ρ</i>',  en: 'Resonator learning rate <i>ρ</i>' }, min: 0.05, max: 1.0, step: 0.05, value: 0.70, fmt: v => fmt(v) + ' /s' },
  { key: 'wProbe', label: { zh: '探测频率 <i>ω</i>',      en: 'Probe frequency <i>ω</i>' },   min: 0.3, max: 16,   step: 0.1,  value: 3.0,  fmt: v => fmt(v) + ' rad/s' },
  { key: 'woFrac', label: { zh: '位置环带宽 <i>ω<sub>o</sub></i> ÷ <i>z</i>', en: 'Position-loop bandwidth <i>ω<sub>o</sub></i> ÷ <i>z</i>' }, min: 0.05, max: 0.45, step: 0.01, value: 0.30, fmt: v => fmt(v) }
];

/* ═══════════════ 被控对象与控制器：全工具共用的数学 ═══════════════
   §0.1 的锚 —— 倒立摆的线性化模型自始至终是被控对象：

       θ̈ = (g/L)·θ + u/(mL²)        ⇒   开环极点 s = ±√(g/L)

   记 a = g/L、b = 1/(mL²)，则 P(s) = b/(s² − a)，
   右半平面那个极点 p = +√a 就是「必倒」的数学，三个页签的读数区都显示它。

   控制器是「带滤波微分」的 PID：

       C(s) = K·(1 + (τf+Td)s)/(1 + τf s)   [ + K/(Ti·s) ]

   微分必须滤波，这不是装饰：不滤波时 L(s) 的相对阶只有 1，波德灵敏度积分
   会多出 −(π/2)·lim s·L(s) 一项，页签③ 要演示的守恒律当场不成立。
   滤波之后相对阶为 2、无右半平面零点，∫₀^∞ ln|S| dω = π·p 才是干净的。 */
const G = 9.81;
const TS = 1 / 500;        // 控制器采样周期：零阶保持离散更新（§0.3）
const SUBN = 4;            // 每个控制周期内被控对象的 RK4 子步数
const HH = TS / SUBN;      // 定步长 h = 1/2000 s（§0.3 要求，不拿帧 dt 直接积）
const MAX_TICK = 800;      // 后台切回时的子步上限，防一帧卡死
const WAVE_V = 1.0;        // 时间轴世界速度（世界单位 / 秒）
const K_MAX = 40;          // 增益轴量程：页签① 的世界 z 轴就是 K ∈ [0, K_MAX]
/* 增益轴的世界长度刻意短于 WAVE_LEN：引擎只有透视投影，物体在深度方向铺得越长，
   「沿增益轴俯视」时近端（大 K）被放得越大，那张教科书根轨迹图就越不像。
   K_LEN = 4.6 配 dist = 15，首尾放大比 ≈ 1.36，已足够接近正交投影；而虚轴
   Re s = 0 恒落在屏幕中线上（与深度无关），所以「穿越虚轴」这件事始终是准的。 */
const K_LEN = 4.6;
const CART_M = 1.0;        // 小车质量：教学参数，固定 1 kg（页签④）
const RESP_T = 3.5;        // 页签① 响应小窗的一轮时长（够 7 个时间常数，瞬态填满小窗）
const EPI_T = 8;           // 页签④ 一次「实验」的时长
const SPEC_N = 512;        // 误差谱 DFT 点数
const SPEC_FS = 32;        // 误差谱采样率 Hz ⇒ 窗长 16 s，Δω = 0.393 rad/s
const SPEC_BINS = 41;      // 画到 ω ≈ 16 rad/s

/* 被控对象的当前系数（滑杆一动即变，控制器是活的，不重算历史） */
function plantA() { return G / state.L; }
function plantB() { return 1 / (state.mass * state.L * state.L); }
function omega0() { return Math.sqrt(G / state.L); }          // p = +√(g/L)
function Kcrit()  { return state.mass * G * state.L; }        // 劳斯判据：K > mgL
function loopPar(useI) {
  return { a: plantA(), b: plantB(), K: state.K, Td: state.Td, tf: state.tauF, Ti: state.Ti, useI: !!useI };
}

/* ---- 复数（只够本工具用） ---- */
const zAdd = (x, y) => [x[0] + y[0], x[1] + y[1]];
const zMul = (x, y) => [x[0]*y[0] - x[1]*y[1], x[0]*y[1] + x[1]*y[0]];
const zDiv = (x, y) => { const d = y[0]*y[0] + y[1]*y[1] || 1e-300; return [(x[0]*y[0] + x[1]*y[1])/d, (x[1]*y[0] - x[0]*y[1])/d]; };
const zAbs = x => Math.hypot(x[0], x[1]);

/* 开环频率响应 L(jω) = C(jω)·P(jω) */
function loopL(w, P) {
  let C = zMul([P.K, 0], zDiv(zAdd([1, 0], [0, (P.tf + P.Td) * w]), zAdd([1, 0], [0, P.tf * w])));
  if (P.useI) C = zAdd(C, zDiv([P.K / P.Ti, 0], [0, w]));
  return zMul(C, [P.b / (-w*w - P.a), 0]);      // P(jω) = b/((jω)² − a) 恒为实负数
}
/* ln|S(jω)| = −½·ln|1+L|²。用 log1p 而不是 Math.log(|1+L|)：尾部 |L| ~ 1e-31 时
   1+L 会舍成 1、对数塌成 0，而那一段乘上换元因子 sec²u 后恰恰是有限贡献。 */
function lnS(w, P) {
  const L = loopL(w, P);
  const v = -0.5 * Math.log1p(2*L[0] + L[0]*L[0] + L[1]*L[1]);
  return isFinite(v) ? clamp(v, -40, 40) : (v < 0 ? -40 : 40);
}
function lnT(w, P) {
  const L = loopL(w, P);
  const T = zDiv(L, zAdd([1, 0], L));
  const v = Math.log(zAbs(T) + 1e-300);
  return isFinite(v) ? clamp(v, -40, 40) : -40;
}

/* 闭环稳定性：劳斯–赫尔维茨。
   PD（三次）：τf s³ + s² + (Kb(τf+Td) − aτf)s + (Kb − a)
     全正 + a2a1 > a3a0  ⇔  K > a/b = mgL（解析结论，页签① 的临界增益）
   PID（四次）：τf·Ti s⁴ + Ti s³ + (bK·Ti(τf+Td) − a·τf·Ti)s² + (bK(Ti+τf) − a·Ti)s + bK
     I 项不是免费的：它把稳定下界从 mgL 抬高了。 */
function pdPoly(P)  { return [P.tf, 1, P.K*P.b*(P.tf + P.Td) - P.a*P.tf, P.K*P.b - P.a]; }
function pidPoly(P) {
  return [P.tf*P.Ti, P.Ti,
          P.b*P.K*P.Ti*(P.tf + P.Td) - P.a*P.tf*P.Ti,
          P.b*P.K*(P.Ti + P.tf) - P.a*P.Ti,
          P.b*P.K];
}
function routhStable(c) {
  if (c.some(v => !(v > 0))) return false;
  if (c.length === 4) return c[1]*c[2] > c[0]*c[3];
  if (c.length === 5) return c[1]*c[2]*c[3] > c[3]*c[3]*c[0] + c[1]*c[1]*c[4];
  return true;
}
function loopStable(P) { return routhStable(P.useI ? pidPoly(P) : pdPoly(P)); }

/* 谐振器（页签② 的「正弦的模型」）：R(s) = Kr(cosφ·s − sinφ·ωd)/(s² + ωd²)。
   阻尼取 0 —— 内模原理要的就是虚轴上那一对极点，稳态误差才是**准确**的零。
   相位 φ = −∠(P·S)(jωd) 让新引入的那对极点直着往左半平面走；
   增益 Kr = 2ρ/|P·S| 把左移速率定成 ρ（于是滑杆读数就是「多快学会」）。 */
function resTune(P, wd, rho) {
  const PS = zDiv([P.b / (-wd*wd - P.a), 0], zAdd([1, 0], loopL(wd, P)));
  const mag = zAbs(PS);
  return mag > 1e-12 ? { Kr: 2 * rho / mag, phi: -Math.atan2(PS[1], PS[0]) } : { Kr: 0, phi: 0 };
}

/* ---- 三次实系数方程求根（页签① 的闭环极点） ---- */
function cubicRoots(A) {
  const b = A[1]/A[0], c = A[2]/A[0], d = A[3]/A[0];
  const p = c - b*b/3, q = 2*b*b*b/27 - b*c/3 + d, sh = -b/3;
  const disc = q*q/4 + p*p*p/27;
  if (disc > 0) {
    const sq = Math.sqrt(disc);
    const u = Math.cbrt(-q/2 + sq), v = Math.cbrt(-q/2 - sq);
    return [[u + v + sh, 0], [-(u+v)/2 + sh, Math.sqrt(3)/2*(u - v)], [-(u+v)/2 + sh, -Math.sqrt(3)/2*(u - v)]];
  }
  const r0 = 2 * Math.sqrt(-p/3);
  const ph = Math.acos(clamp(3*q/(p*r0), -1, 1)) / 3;
  return [0, 1, 2].map(k => [r0 * Math.cos(ph - TAU*k/3) + sh, 0]);
}
function clPoles(K) { const P = loopPar(false); P.K = K; return cubicRoots(pdPoly(P)); }

/* ---- 页签① 的三维曲线束：按 K 连续追踪三条支 ---- */
const LOC_N = 181;
const locusCache = { sig: '', br: null };
function locusData() {
  const sig = [state.L, state.mass, state.Td, state.tauF].join('|');
  if (locusCache.sig === sig) return locusCache;
  const br = [[], [], []];
  let prev = null;
  for (let i = 0; i < LOC_N; i++) {
    const K = i / (LOC_N - 1) * K_MAX;
    let r = clPoles(K);
    if (prev) {                              /* 连续性追踪：贪心最近邻配对，
                                                否则三条支会在分离点上互相串色 */
      const used = [false, false, false], ord = [];
      for (let j = 0; j < 3; j++) {
        let bi = -1, bd = Infinity;
        for (let k = 0; k < 3; k++) {
          if (used[k]) continue;
          const d = Math.hypot(r[k][0] - prev[j][0], r[k][1] - prev[j][1]);
          if (d < bd) { bd = d; bi = k; }
        }
        used[bi] = true; ord.push(r[bi]);
      }
      r = ord;
    } else {                                  /* K = 0：按 +√a、−√a、−1/τf 定序 */
      r.sort((u, v) => v[0] - u[0]);
    }
    for (let j = 0; j < 3; j++) br[j].push({ K: K, re: r[j][0], im: r[j][1] });
    prev = r;
  }
  locusCache.sig = sig; locusCache.br = br;
  return locusCache;
}

/* ---- 页签③ 的波德灵敏度积分 ----
   ∫₀^∞ ln|S(jω)| dω：ω = tan u 换元把无穷区间压进 [0, π/2)，被积函数
   f(tan u)·sec²u 在端点有界（尾部 ln|S| ~ A/ω²，乘 sec²u 恰好收敛到 A），
   于是复合辛普森就够。实测 N = 4000 时相对误差 ~0.1%，N = 2·10⁵ 时 ~0.001%。 */
const BODE_N = 4000, SP_W = 20;
const bodeCache = { sig: '', I: 0, aPlus: 0, aMinus: 0, vis: 0, stable: true, curve: null, tcurve: null, peak: 0 };
function bodeData() {
  const P = loopPar(true);
  const sig = [P.a, P.b, P.K, P.Td, P.tf, P.Ti].join('|');
  if (bodeCache.sig === sig) return bodeCache;
  const h = (Math.PI / 2) / BODE_N;
  let sAll = 0, sPos = 0, sNeg = 0;
  for (let i = 0; i <= BODE_N; i++) {
    const u = i * h, w = Math.tan(u), sec2 = 1 + w*w;
    let f;
    if (i === 0) f = lnS(1e-9, P);
    else if (!isFinite(w) || w > 1e15) f = 0;
    else f = lnS(w, P) * sec2;
    const wt = (i === 0 || i === BODE_N) ? 1 : (i % 2 ? 4 : 2);
    sAll += wt * f;
    if (f > 0) sPos += wt * f; else sNeg += wt * (-f);
  }
  const k = h / 3;
  bodeCache.I = sAll * k; bodeCache.aPlus = sPos * k; bodeCache.aMinus = sNeg * k;
  /* 可见区间 [0, SP_W] 的面积，另算一份 —— 画面上填色的就是它，
     不能拿全区间的数字冒充画面上的那块（尾部真的在框外）。 */
  let vis = 0;
  const M = 2000, hv = SP_W / M;
  for (let i = 0; i <= M; i++) {
    const w = i * hv;
    const f = lnS(i === 0 ? 1e-9 : w, P);
    vis += ((i === 0 || i === M) ? 1 : (i % 2 ? 4 : 2)) * f;
  }
  bodeCache.vis = vis * hv / 3;
  bodeCache.stable = loopStable(P);
  const cur = [], tcur = [];
  let peak = 0;
  for (let i = 0; i <= 300; i++) {
    const w = i / 300 * SP_W;
    const v = lnS(i === 0 ? 1e-6 : w, P);
    cur.push([w, v]); peak = Math.max(peak, Math.abs(v));
    tcur.push([w, lnT(i === 0 ? 1e-6 : w, P)]);
  }
  bodeCache.curve = cur; bodeCache.tcurve = tcur; bodeCache.peak = peak;
  bodeCache.sig = sig;
  return bodeCache;
}

/* ---- 误差谱（页签②）：定速率环形缓冲 + 汉宁窗 DFT ---- */
const specBuf = new Float64Array(SPEC_N);
let specHead = 0, specAcc = 0, specFilled = 0;
const specOut = { at: -1, mag: null };
function specPush(v) {
  specAcc += TS;
  if (specAcc < 1 / SPEC_FS) return;
  specAcc -= 1 / SPEC_FS;
  specBuf[specHead] = v;
  specHead = (specHead + 1) % SPEC_N;
  if (specFilled < SPEC_N) specFilled++;
}
function specData() {
  if (specOut.at === specHead) return specOut.mag;      // 每格只算一次
  const mag = new Float64Array(SPEC_BINS);
  for (let k = 0; k < SPEC_BINS; k++) {
    let re = 0, im = 0;
    for (let n = 0; n < SPEC_N; n++) {
      const x = specBuf[(specHead + n) % SPEC_N] * (0.5 - 0.5 * Math.cos(TAU * n / (SPEC_N - 1)));
      const ang = -TAU * k * n / SPEC_N;
      re += x * Math.cos(ang); im += x * Math.sin(ang);
    }
    mag[k] = Math.hypot(re, im) * 2 / SPEC_N;
  }
  specOut.at = specHead; specOut.mag = mag;
  return mag;
}
const specOmega = k => TAU * k * SPEC_FS / SPEC_N;
/* 误差谱的纵轴用**绝对** dB（参考 1 rad），不按峰值归一。
   归一化会在残差被消掉后把剩下的舍入噪声重新拉满量程 —— 洞看上去反而还在。 */
const SPEC_FLOOR = 100;                                  // 触底 −100 dB
function specY(mag) { return clamp((20 * Math.log10(Math.max(mag, 1e-18)) + SPEC_FLOOR) / SPEC_FLOOR * 2.3, 0, 2.3); }

/* 扰动里的一小撮宽带背景（确定性线性同余 + 一阶低通，转折 ≈ 10 rad/s）。
   没有它，正弦被谐振器消干净后整条谱一起塌到底 —— 那是「关灯」，不是「打洞」。
   有了它，只有 ωd 那一根掉进底噪里，谱上真的出现一个洞。 */
let nzSeed = 20260802, nzVal = 0;
function nzTick(amp) {
  nzSeed = (Math.imul(nzSeed, 1664525) + 1013904223) >>> 0;
  nzVal += ((nzSeed / 4294967296 * 2 - 1) * amp - nzVal) * 0.02;
  return nzVal;
}

/* ═══════════════ 四路仿真（都是同一根杆子，只是问法不同） ═══════════════
   每个页签一路，全部在 pushSample() 里以定步长推进（③ 编辑点）。
   控制器按 TS 零阶保持更新，被控对象在两次更新之间用 RK4 走 SUBN 个 h 子步。 */
const SIM = { clock: 0, acc: 0, A: null, B: null, C: null, D: null, dMode: null };

function seedPen(th0) { return { th: th0, om: 0, xi: 0, w: 0, r1: 0, r2: 0, u: 0, uP: 0, uI: 0, uR: 0, d: 0, t0: SIM.clock }; }
function seedCart() {
  const pos = !!state.posCtrl;
  return { x: 0, v: 0, th: pos ? 0.0 : 0.15, om: 0, F: 0, minx: 0, t0: SIM.clock, pos: pos };
}
function seedAll() {
  SIM.A = seedPen(0.10);
  SIM.B = seedPen(0.03);
  SIM.C = seedPen(0.0);
  SIM.D = seedCart();
  SIM.acc = 0;
  specBuf.fill(0); specHead = 0; specFilled = 0; specAcc = 0; specOut.at = -1;
  nzSeed = 20260802; nzVal = 0;
}

/* 一个控制周期：先按采样值更新控制器状态，再把被控对象积过去 */
function penTick(S, P, o) {
  const e = -S.th;                                   // 参考角度恒为 0（把杆立住）
  const beta = (P.tf + P.Td) / P.tf;
  S.uP = P.K * (beta * e + (1 - beta) * S.w);
  S.uI = o.useI ? (P.K / P.Ti) * S.xi : 0;
  S.uR = o.useRes ? o.Kr * (Math.cos(o.phi) * S.r2 - Math.sin(o.phi) * o.wd * S.r1) : 0;
  S.u = clamp(S.uP + S.uI + S.uR, -o.umax, o.umax);
  S.sat = Math.abs(S.uP + S.uI + S.uR) > o.umax;
  S.xi += e * TS;
  const kf = Math.exp(-TS / P.tf);                   // D 滤波器的一阶精确解
  S.w = kf * S.w + (1 - kf) * e;
  if (o.wd > 0) {                                    /* 谐振器用零阶保持的精确旋转推进：
                                                        前向欧拉在无阻尼振子上会指数发散 */
    const c = Math.cos(o.wd * TS), s = Math.sin(o.wd * TS), w2 = o.wd * o.wd;
    const r1 = c * S.r1 + s / o.wd * S.r2 + (1 - c) / w2 * e;
    const r2 = -o.wd * s * S.r1 + c * S.r2 + s / o.wd * e;
    S.r1 = r1; S.r2 = r2;
  }
  const f = (th) => P.a * th + P.b * (S.u + S.d);    // θ̈ = aθ + b(u+d)
  for (let i = 0; i < SUBN; i++) {
    const k1t = S.om,                    k1o = f(S.th);
    const k2t = S.om + HH/2 * k1o,       k2o = f(S.th + HH/2 * k1t);
    const k3t = S.om + HH/2 * k2o,       k3o = f(S.th + HH/2 * k2t);
    const k4t = S.om + HH * k3o,         k4o = f(S.th + HH * k3t);
    S.th += HH/6 * (k1t + 2*k2t + 2*k3t + k4t);
    S.om += HH/6 * (k1o + 2*k2o + 2*k3o + k4o);
  }
}

/* 小车-摆（页签④，线性化）：一个作动器 F，两个要管的量 θ 与 x
     θ̈ = [(M+m)gθ − F]/(lM)      ẍ = (F − mgθ)/M
   内环把 θ 拉到 θref（带宽 6 rad/s），外环用 θref 去挪 x。
   准静态下 ẍ = c·θref，c = g·kp/(kp − (M+m)g) —— 想往前走，先得倾过去。 */
function cartGains() {
  const M = CART_M, m = state.mass, l = state.L;
  const wi = 6, zi = 0.8;
  const kp = (M + m) * G + wi*wi*l*M, kd = 2*zi*wi*l*M;
  const c = G * kp / (kp - (M + m) * G);
  const z = Math.sqrt(G / l);                     // X/F 的右半平面零点
  const wo = state.woFrac * z, zo = 0.9;
  return { M: M, m: m, l: l, kp: kp, kd: kd, c: c, z: z, wo: wo, kx: wo*wo/c, kv: 2*zo*wo/c };
}
function cartTick(S, g) {
  const xr = S.pos ? 1.5 : 0;
  const f = s => {
    const thref = S.pos ? -(g.kx * (s.x - xr) + g.kv * s.v) : 0;
    const F = g.kp * (s.th - thref) + g.kd * s.om;
    return [s.v, (F - g.m * G * s.th) / g.M, s.om, ((g.M + g.m) * G * s.th - F) / (g.l * g.M), F];
  };
  for (let i = 0; i < SUBN; i++) {
    const a = f(S);
    const s2 = { x: S.x + HH/2*a[0], v: S.v + HH/2*a[1], th: S.th + HH/2*a[2], om: S.om + HH/2*a[3], pos: S.pos };
    const b = f(s2);
    const s3 = { x: S.x + HH/2*b[0], v: S.v + HH/2*b[1], th: S.th + HH/2*b[2], om: S.om + HH/2*b[3], pos: S.pos };
    const c = f(s3);
    const s4 = { x: S.x + HH*c[0], v: S.v + HH*c[1], th: S.th + HH*c[2], om: S.om + HH*c[3], pos: S.pos };
    const d = f(s4);
    S.x  += HH/6*(a[0] + 2*b[0] + 2*c[0] + d[0]);
    S.v  += HH/6*(a[1] + 2*b[1] + 2*c[1] + d[1]);
    S.th += HH/6*(a[2] + 2*b[2] + 2*c[2] + d[2]);
    S.om += HH/6*(a[3] + 2*b[3] + 2*c[3] + d[3]);
    S.F = a[4];
  }
  S.minx = Math.min(S.minx, S.x);
}

function advanceSim(dt) {
  SIM.acc += dt;
  let n = 0;
  while (SIM.acc >= TS && n++ < MAX_TICK) {
    SIM.acc -= TS;
    SIM.clock += TS;
    const Ppd = loopPar(false), Ppid = loopPar(true);

    /* ① 响应小窗：每 RESP_T 秒重新给一个初始倾角，瞬态循环重演 */
    if (SIM.clock - SIM.A.t0 >= RESP_T || Math.abs(SIM.A.th) > 3) SIM.A = seedPen(0.10);
    SIM.A.d = 0;
    penTick(SIM.A, Ppd, { useI: false, useRes: false, wd: 0, umax: 1e9 });

    /* ② 内模：常值扰动 + 正弦扰动，控制器可选 I 与谐振器 */
    const wd = state.wDist;
    const tune = state.useRes ? resTune(loopPar(state.useI), wd, state.rhoRes) : { Kr: 0, phi: 0 };
    const anyD = state.dConst || state.dSin;
    SIM.B.d = (state.dConst ? state.dAmp : 0) + (state.dSin ? state.dAmp * Math.sin(wd * SIM.clock) : 0)
            + (anyD ? nzTick(3.0 * state.dAmp) : 0);
    penTick(SIM.B, loopPar(state.useI), { useI: state.useI, useRes: state.useRes, Kr: tune.Kr, phi: tune.phi, wd: wd, umax: 1e9 });
    if (!isFinite(SIM.B.th) || Math.abs(SIM.B.th) > 1.4) SIM.B = seedPen(0.03);
    specPush(-SIM.B.th);

    /* ③ 探测：单频正弦扰动，量出闭环真把它放大还是压小 */
    SIM.C.d = 1.0 * Math.sin(state.wProbe * SIM.clock);
    penTick(SIM.C, Ppid, { useI: true, useRes: false, wd: 0, umax: 1e9 });
    if (!isFinite(SIM.C.th) || Math.abs(SIM.C.th) > 1.4) SIM.C = seedPen(0);

    /* ④ 小车-摆：每 EPI_T 秒重来一次；换控制模式立即重来 */
    if (SIM.D.pos !== !!state.posCtrl || SIM.clock - SIM.D.t0 >= EPI_T ||
        !isFinite(SIM.D.x) || Math.abs(SIM.D.x) > 30 || Math.abs(SIM.D.th) > 1.2) SIM.D = seedCart();
    cartTick(SIM.D, cartGains());
  }
}

/* ═══════════════ 场景级绘制部件 ═══════════════
   本工具的三条轴不是 x / y / t 而是 Re / Im / K、ω / ln|S| …，
   所以自备带标注的轴与面填充，引擎的 drawAxes / drawGridXY 一行不动（§8）。 */
function axisSeg(C, p0, p1, text, o) {
  o = o || {};
  line3(C, p0, p1, { width: 1.4, color: AXIS });
  const back = [p1[0] + (p0[0]-p1[0])*0.04, p1[1] + (p0[1]-p1[1])*0.04, p1[2] + (p0[2]-p1[2])*0.04];
  arrowAt(C, p1, back, AXIS);
  if (text) label3(C, [p1[0] + (o.dx || 0), p1[1] + (o.dy || 0), p1[2] + (o.dz || 0)], text,
    { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: o.align || 'center' });
}
function tickMark(C, p, d, text, o) {
  o = o || {};
  line3(C, [p[0]-d[0], p[1]-d[1], p[2]-d[2]], [p[0]+d[0], p[1]+d[1], p[2]+d[2]], { width: 1.2, color: AXIS_DIM });
  if (text) label3(C, [p[0] + (o.dx || 0), p[1] + (o.dy || 0), p[2] + (o.dz || 0)], text,
    { size: 10, color: 'rgba(159,176,200,.6)', align: o.align || 'center' });
}
/* 任意平面上的方格网（i 为常量轴：0=x, 1=y, 2=z） */
function planeGrid(C, axis, at, u0, u1, du, v0, v1, dv, color) {
  const mk = (u, v) => axis === 0 ? [at, u, v] : axis === 1 ? [u, at, v] : [u, v, at];
  for (let u = Math.ceil(u0/du)*du; u <= u1 + 1e-9; u += du) line3(C, mk(u, v0), mk(u, v1), { width: 1, color: color });
  for (let v = Math.ceil(v0/dv)*dv; v <= v1 + 1e-9; v += dv) line3(C, mk(u0, v), mk(u1, v), { width: 1, color: color });
}
/* 折线与基线之间填色（页签③ 的水床面积；引擎没有面填充部件） */
function fillBand(C, pts, baseY, color) {
  if (pts.length < 2) return;
  const sp = [];
  for (const p of pts) { const s = proj(C, p); if (!s) return; sp.push(s); }
  const b0 = proj(C, [pts[0][0], baseY, pts[0][2]]);
  const b1 = proj(C, [pts[pts.length-1][0], baseY, pts[pts.length-1][2]]);
  if (!b0 || !b1) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(b0[0], b0[1]);
  for (const s of sp) ctx.lineTo(s[0], s[1]);
  ctx.lineTo(b1[0], b1[1]);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
/* 历史曲线的标准双描（辉光 + 头亮尾隐），全工具复用 */
function traceCurve(C, pts, rgb) {
  if (pts.length < 2) return;
  strokePoly(C, pts, { width: 5.5, color: 'rgba(' + rgb + ',0.13)' });
  strokePoly(C, pts, { width: 2.2, fade: ['rgba(' + rgb + ',1)', 'rgba(' + rgb + ',0.04)'] });
}
const RGB = { rose: '251,113,133', violet: '167,139,250', emerald: '52,211,153', orange: '251,146,60', amber: '251,191,36', cyan: '45,212,234' };

/* 从 samples 取一条「沿时间轴流出」的曲线：最新样本贴在 z = 0 */
function timePoly(C, key, sc, xPlane, y0, clip) {
  const pts = [];
  for (let i = samples.length - 1; i >= 0; i--) {
    const s = samples[i];
    const z = (state.t - s.t) * WAVE_V;
    if (z > WAVE_LEN + 0.2) break;
    const v = s[key];
    if (v == null || !isFinite(v)) { pts.push(null); continue; }
    pts.push([xPlane, y0 + clamp(v * sc, -clip, clip), z]);
  }
  return pts;
}

/* 页签① 的世界映射：复平面在 x·y（按 ω₀ 归一），增益 K 沿 z */
const LOC_S = 0.95, LOC_RE0 = -4.0, LOC_RE1 = 1.75, LOC_IM = 2.9;
const zOfK  = K  => K / K_MAX * K_LEN;
const xOfRe = re => clamp(re, LOC_RE0, LOC_RE1) * LOC_S;
const yOfIm = im => clamp(im, -LOC_IM, LOC_IM) * LOC_S;
const inBox = (re, im) => re >= LOC_RE0 && re <= LOC_RE1 && Math.abs(im) <= LOC_IM;
/* 极点跑出画框时折线**断开**（§6 奇点处理），而不是贴着边界画一条假的直线 */
function locusPoly(br, w0) {
  const pts = [];
  for (const q of br) {
    const re = q.re / w0, im = q.im / w0;
    if (!inBox(re, im)) { if (pts.length && pts[pts.length - 1] !== null) pts.push(null); continue; }
    pts.push([re * LOC_S, im * LOC_S, zOfK(q.K)]);
  }
  return pts;
}
/* 页签① 响应小窗：贴在当前 K 的高度上，摆在复平面**下方**（放右边会被参数面板盖住） */
const RSP_X0 = -3.7, RSP_X1 = 1.5, RSP_Y = -4.7, RSP_SC = 4.2, RSP_CLIP = 0.78;
/* 页签②③ 的频率轴 */
const FRQ_X0 = 0.35, FRQ_LEN = 4.15;
const xOfW = (w, wmax) => FRQ_X0 + clamp(w / wmax, 0, 1) * FRQ_LEN;

function roHead(extra) {
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' + extra + '</div>';
}
function poleText(r) {
  if (Math.abs(r[1]) < 1e-9) return fmtS(r[0]);
  return fmtS(r[0]) + (r[1] < 0 ? ' − ' : ' + ') + fmt(Math.abs(r[1])) + 'j';
}

      for (let k = 1; k * WAVE_V <= WAVE_LEN + 1e-6; k++)
        tickMark(C, [TX, 0, k * WAVE_V], [0, 0.06, 0], k + 's', { dy: -0.22 });
      axisSeg(C, [XA - 0.4, 0, 0], [XB + 0.3, 0, 0], 'ω', { dx: 0.3, dy: 0.2 });
      axisSeg(C, [XA - 0.4, 0, 0], [XA - 0.4, 2.6, 0], null);
      label3(C, [XA - 0.5, 2.72, 0], '|E(ω)|', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      for (const k of [4, 8, 12, 16]) tickMark(C, [xOfW(k, WMAX), 0, 0], [0, 0.06, 0], '' + k, { dy: -0.22 });

      /* 时域：误差、两个控制器分项、扰动，同一块玻璃上四条荧光迹 */
      if (state.showErr) traceCurve(C, timePoly(C, 'e', 4.0, TX, 0, 1.45), RGB.rose);
      if (state.useI)    traceCurve(C, timePoly(C, 'uI', 0.05, TX, 0, 1.45), RGB.violet);
      if (state.useRes)  traceCurve(C, timePoly(C, 'uR', 0.05, TX, 0, 1.45), RGB.emerald);
      if (state.dConst || state.dSin) traceCurve(C, timePoly(C, 'bd', 0.4, TX, 0, 1.45), RGB.orange);
      label3(C, [TX, 1.75, 0.2], t({ zh: 'e ×4 · u_I,u_R ×0.05 · d ×0.4', en: 'e ×4 · u_I,u_R ×0.05 · d ×0.4' }),
        { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });

      /* 频域：最近 16 s 误差的滑动 DFT，按峰值归一到 dB */
      if (state.showErr) {
        const mag = specData();
        const pts = [];
        for (let k = 1; k < SPEC_BINS; k++) pts.push([xOfW(specOmega(k), WMAX), specY(mag[k]), 0]);
        strokePoly(C, pts, { width: 5.5, color: 'rgba(' + RGB.rose + ',0.13)' });
        strokePoly(C, pts, { width: 2.2, color: 'rgba(' + RGB.rose + ',0.95)' });
        const kd = Math.round(wd * SPEC_N / (TAU * SPEC_FS));
        if (kd >= 1 && kd < SPEC_BINS) {
          const sp = proj(C, [xOfW(specOmega(kd), WMAX), specY(mag[kd]), 0]);
          if (sp) glowDot(sp, 9, '#ffffff', 'rgba(' + RGB.rose + ',0.9)');
        }
      }
      /* 琥珀：扰动频率的标尺 */
      const xd = xOfW(wd, WMAX);
      line3(C, [xd, 0, 0], [xd, 2.55, 0], { width: 1.2, dash: [5, 6], color: 'rgba(251,191,36,0.6)' });
      label3(C, [xd, 2.72, 0], 'ωd = ' + fmt(wd), { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
      label3(C, [XA, -0.3, 0], t({ zh: '（绝对 dB，参考 1 rad，−100 dB 触底；扰动含一撮宽带背景，好让「洞」看得见）',
                                    en: '(absolute dB re 1 rad, floor −100 dB; the disturbance carries a broadband floor so the hole is visible)' }),
        { size: 10, color: 'rgba(159,176,200,.5)', align: 'left' });
    },
    readout() {
      const Kc = Kcrit(), wd = state.wDist;
      /* 从历史采样量出稳态误差与交流残差：均值 = 常值扰动留下的偏置，
         去均值后的 RMS×√2 = 那根正弦压不掉的部分 */
      let n = 0, sum = 0, sum2 = 0;
      const t0 = state.t - 6;
      for (const s of samples) if (s.t >= t0 && s.e != null) { n++; sum += s.e; sum2 += s.e * s.e; }
      const mean = n ? sum / n : 0;
      const ac = n ? Math.sqrt(Math.max(0, sum2 / n - mean * mean)) * Math.SQRT2 : 0;
      /* e = −θ，故仅 P+D 时的解析稳态**误差**是 −d/(K − mgL)（θ 是正的，e 是负的） */
      const pred = state.K > Kc ? -(state.dConst ? state.dAmp : 0) / (state.K - Kc) : NaN;
      const tune = resTune(loopPar(state.useI), wd, state.rhoRes);
      const P = loopPar(state.useI);
      const mg = specData(), kd = Math.round(wd * SPEC_N / (TAU * SPEC_FS));
      const dbAt = (kd >= 1 && kd < SPEC_BINS) ? 20 * Math.log10(Math.max(mg[kd], 1e-18)) : NaN;
      return roHead('e = <b>' + fmtS(-SIM.B.th) + '</b> rad&ensp;·&ensp;d = <b>' + fmtS(SIM.B.d) + '</b> N·m') +
        '<div class="sinC">' + t({ zh: '稳态偏置（近 6 s 均值）= ', en: 'steady-state bias (6 s mean) = ' }) + '<b>' + fmtS(mean, 4) + '</b> rad</div>' +
        '<div class="sinC">' + t({ zh: '交流残差幅值 = ', en: 'AC residual amplitude = ' }) + '<b>' + fmtS(ac, 4) + '</b> rad</div>' +
        '<div class="sinC">' + t({ zh: '误差谱在 ωd 处 = ', en: 'error spectrum at ωd = ' }) + '<b>' + fmtS(dbAt, 1) + '</b> dB</div>' +
        '<div class="cosC">' + t({ zh: '仅 P+D 的解析稳态误差 −d/(K − mgL) = ', en: 'P+D analytic offset −d/(K − mgL) = ' }) +
          '<b>' + (isFinite(pred) ? fmtS(pred, 4) : '—') + '</b></div>' +
        '<div class="tanC">' + t({ zh: '谐振器 Kr = ', en: 'resonator Kr = ' }) + '<b>' + fmt(tune.Kr) + '</b>&ensp;·&ensp;φ = <b>' +
          fmt(tune.phi * 180 / Math.PI, 1) + '</b>°</div>' +
        '<div class="dim">' + (loopStable(P) ? t({ zh: '闭环稳定', en: 'closed loop stable' })
            : t({ zh: '闭环不稳定：I 项把稳定下界抬到了 K > mgL 之上', en: 'unstable: the integral term raises the stability floor above K > mgL' })) +
          '&ensp;·&ensp;' + t({ zh: '内模：常值 ↔ 1/s，正弦 ↔ 1/(s²+ω²)', en: 'internal model: constant ↔ 1/s, sinusoid ↔ 1/(s²+ω²)' }) + '</div>';
    }
  },

    draw(C) {
      const B = bodeData(), PX = -1.95;
      const XA = FRQ_X0, XB = FRQ_X0 + FRQ_LEN, YC = 2.55;
      const yOf = v => clamp(v, -YC, YC);

      if (state.showGrid) {
        planeGrid(C, 2, 0, XA, XB, FRQ_LEN / 5, -2.4, 2.4, 0.8, 'rgba(148,163,184,0.06)');
        planeGrid(C, 0, PX, -1.4, 1.4, 0.7, 0, WAVE_LEN, 1, 'rgba(148,163,184,0.07)');
      }

      /* 水位线 ln|S| = 0：上面是放大，下面是衰减 */
      line3(C, [XA, 0, 0], [XB + 0.15, 0, 0], { width: 1, dash: [5, 6], color: 'rgba(251,191,36,0.32)' });
      axisSeg(C, [XA - 0.35, 0, 0], [XB + 0.35, 0, 0], 'ω', { dx: 0.3, dy: 0.22 });
      axisSeg(C, [XA - 0.35, -YC - 0.15, 0], [XA - 0.35, YC + 0.25, 0], null);
      label3(C, [XA - 0.28, YC - 0.18, 0], 'ln |S(jω)|', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      for (const k of [5, 10, 15, 20]) tickMark(C, [xOfW(k, SP_W), 0, 0], [0, 0.06, 0], '' + k, { dy: -0.24 });
      for (const k of [-2, -1, 1, 2]) tickMark(C, [XA - 0.35, k, 0], [0.06, 0, 0], (k < 0 ? '−' : '') + Math.abs(k), { dx: -0.14, align: 'right' });

      if (state.showLnS) {
        const cur = B.curve.map(q => [xOfW(q[0], SP_W), yOf(q[1]), 0]);
        /* 按正负分段填色：鼓起来的（亮）与被压下去的（暗）是同一条曲线的两侧 */
        let run = [], sign = 0;
        const flush = () => {
          if (run.length > 1) fillBand(C, run, 0, sign > 0 ? 'rgba(251,113,133,0.22)' : 'rgba(251,113,133,0.09)');
          run = [];
        };
        for (const p of cur) {
          const s = p[1] >= 0 ? 1 : -1;
          if (s !== sign) { if (run.length) { run.push([p[0], 0, 0]); flush(); } sign = s; run = [[p[0], 0, 0]]; }
          run.push(p);
        }
        flush();
        strokePoly(C, cur, { width: 5.5, color: 'rgba(' + RGB.rose + ',0.13)' });
        strokePoly(C, cur, { width: 2.4, color: 'rgba(' + RGB.rose + ',0.95)' });
      }
      if (state.showTc) {
        const tc = B.tcurve.map(q => [xOfW(q[0], SP_W), yOf(q[1]), 0]);
        strokePoly(C, tc, { width: 1.8, color: 'rgba(' + RGB.violet + ',0.75)' });
        label3(C, [xOfW(SP_W * 0.62, SP_W), yOf(B.tcurve[186][1]) - 0.3, 0], 'ln |T|',
          { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
      }

      /* 探测：真闭环仿真对 sin(ωt) 的响应，沿 +z 流出 —— 曲线上那一点不是画出来的，是量出来的 */
      if (state.showProbe) {
        axisSeg(C, [PX, 0, 0], [PX, 0, WAVE_LEN + 0.6], 't', { dz: 0.4 });
        axisSeg(C, [PX, -1.5, 0], [PX, 1.6, 0], null);
        traceCurve(C, timePoly(C, 'cd', 0.5, PX, 0, 1.35), RGB.orange);
        traceCurve(C, timePoly(C, 'cth', 4.0, PX, 0, 1.35), RGB.rose);
        label3(C, [PX, 1.78, 0.2], t({ zh: 'd(t) ×0.5 → θ(t) ×4', en: 'd(t) ×0.5 → θ(t) ×4' }),
          { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });
      }

      /* 琥珀：探测频率的标尺 + 曲线上的读数点 */
      if (state.showGuides) {
        const w = state.wProbe, xw = xOfW(w, SP_W);
        const v = yOf(lnS(w, loopPar(true)));
        line3(C, [xw, 0, 0], [xw, v, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.8)' });
        const sp = proj(C, [xw, v, 0]);
        if (sp) glowDot(sp, 10, '#ffffff', 'rgba(251,191,36,0.9)');
        label3(C, [xw, v + (v >= 0 ? 0.34 : -0.34), 0], 'ω = ' + fmt(w),
          { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        label3(C, [xOfW(6.5, SP_W), 1.95, 0], '∫₀^∞ ln|S| dω = ' + fmt(B.I) + '   ( π·p = ' + fmt(Math.PI * omega0()) + ' )',
          { size: 11.5, color: 'rgba(251,191,36,.95)', align: 'left' });
        /* 画框外还有一条长尾（ln|S| ~ A/ω²）。填色只画到 ω = 20，
           所以把差额明确标出来 —— 不能让画面上那块面积冒充全区间的积分。 */
        const tail = B.I - B.vis;
        line3(C, [xOfW(15.4, SP_W), 0.72, 0], [XB + 0.1, 0.72, 0], { width: 1.2, color: 'rgba(251,191,36,0.7)' });
        arrowAt(C, [XB + 0.1, 0.72, 0], [XB - 0.05, 0.72, 0], 'rgba(251,191,36,0.7)');
        label3(C, [xOfW(15.2, SP_W), 1.0, 0], t({ zh: '画框外的尾部 ∫₂₀^∞ = ', en: 'tail beyond the frame ∫₂₀^∞ = ' }) + fmt(tail),
          { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'right' });
      }
      label3(C, [XA, -YC - 0.42, 0], t({ zh: '上方 = 扰动被放大 · 下方 = 被压小', en: 'above = amplified · below = attenuated' }),
        { size: 10.5, color: 'rgba(159,176,200,.55)', align: 'left' });
    },
    readout() {
      const B = bodeData(), p = omega0(), tgt = Math.PI * p;
      const P = loopPar(true), w = state.wProbe;
      const Sm = Math.exp(lnS(w, P));
      const err = (B.I - tgt) / tgt * 100;
      return roHead('ω = <b>' + fmt(w) + '</b> rad/s&ensp;·&ensp;|S(jω)| = <b>' + fmt(Sm) + '</b>&ensp;(' + fmtS(20 * Math.log10(Sm), 1) + ' dB)') +

          t({ zh: '衰减区 A₋ = ', en: 'attenuated A₋ = ' }) + '<b>' + fmt(B.aMinus) + '</b></div>' +

    }
  },

        label3(C, [xr, RAIL - 0.46, 0], 'x' + t({ zh: '指令', en: 'ref' }) + ' = 1.50 m', { size: 10.5, color: '#fb923c', align: 'center' });
        if (state.showGuides && D.minx < -0.001) {
          const xm = clamp(D.minx * XS, -4.3, 0);
          line3(C, [0, RAIL - 0.62, 0], [xm, RAIL - 0.62, 0], { width: 1.6, color: 'rgba(251,191,36,0.9)' });
          line3(C, [xm, RAIL - 0.7, 0], [xm, RAIL - 0.54, 0], { width: 1.4, color: 'rgba(251,191,36,0.9)' });
          label3(C, [xm / 2, RAIL - 0.82, 0], t({ zh: '先反向 ', en: 'reverse first ' }) + fmtS(D.minx, 3) + ' m',
            { size: 10.5, color: 'rgba(251,191,36,.95)', align: 'center' });
        }
      }

      /* 历史：θ、x、F 沿 +z 流出，基线抬到 HB 以免压在小车上 */
      axisSeg(C, [0, HB, 0], [0, HB, WAVE_LEN + 0.6], 't', { dz: 0.4 });
      line3(C, [0, HB, 0], [0, HB, WAVE_LEN], { width: 1, dash: [4, 5], color: 'rgba(159,176,200,0.25)' });
      for (let k = 1; k * WAVE_V <= WAVE_LEN + 1e-6; k++) tickMark(C, [0, HB, k * WAVE_V], [0.07, 0, 0], k + 's', { dx: 0.26, align: 'left' });
      if (state.showTh) traceCurve(C, timePoly(C, 'dth', 3.0, 0, HB, 1.3), RGB.rose);
      if (state.showX)  traceCurve(C, timePoly(C, 'dx', 0.22, 0, HB, 1.3), RGB.violet);
      if (state.showF)  traceCurve(C, timePoly(C, 'dF', 0.012, 0, HB, 1.3), RGB.emerald);
      label3(C, [0, HB + 1.5, 0.2], t({ zh: 'θ ×3 · x ×0.22 · F ×0.012', en: 'θ ×3 · x ×0.22 · F ×0.012' }),
        { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });

      label3(C, [-4.4, HB + 1.5, 0], t({ zh: '一个作动器 F，两个要管的量 θ 与 x', en: 'one actuator F, two regulated quantities θ and x' }),
        { size: 11, color: 'rgba(159,176,200,.7)', align: 'left' });
      label3(C, [-4.4, RAIL + 1.55, 0], 'z = +√(g/l) = ' + fmt(g.z) + t({ zh: '（右半平面零点）', en: ' (RHP zero)' }),
        { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left' });
    },
    readout() {
      const D = SIM.D, g = cartGains();
      /* 漂移率：对最近 3 s 的 x(t) 做最小二乘直线拟合 —— 报实测值，不报理论值 */
      let n = 0, st = 0, sx = 0, stt = 0, stx = 0;
      const t0 = state.t - 3;
      for (const s of samples) if (s.t >= t0 && s.dx != null) { n++; st += s.t; sx += s.dx; stt += s.t*s.t; stx += s.t*s.dx; }
      const den = n * stt - st * st;
      const slope = (n > 8 && Math.abs(den) > 1e-9) ? (n * stx - st * sx) / den : 0;
      return roHead('θ = <b>' + fmtS(D.th, 3) + '</b> rad&ensp;·&ensp;x = <b>' + fmtS(D.x, 3) + '</b> m') +
        '<div class="sinC">' + t({ zh: '摆角 θ = ', en: 'pole angle θ = ' }) + '<b>' + fmtS(D.th, 4) + '</b> rad</div>' +
        '<div class="cosC">' + t({ zh: '漂移率（近 3 s 拟合）= ', en: 'drift rate (3 s fit) = ' }) + '<b>' + fmtS(slope, 4) + '</b> m/s</div>' +
        '<div class="tanC">' + t({ zh: '作动力 F = ', en: 'actuator force F = ' }) + '<b>' + fmtS(D.F, 2) + '</b> N</div>' +
        '<div class="cotC">' + t({ zh: '初始反向位移 = ', en: 'initial reverse excursion = ' }) + '<b>' + fmtS(D.minx, 4) + '</b> m</div>' +
        '<div class="dim">' + t({ zh: '非最小相位零点 z = +√(g/l) = ', en: 'non-minimum-phase zero z = +√(g/l) = ' }) + fmt(g.z) +
          ' rad/s&ensp;·&ensp;ω' + t({ zh: '位置', en: 'pos' }) + ' = ' + fmt(g.wo) + ' rad/s = ' + fmt(state.woFrac) + '·z</div>' +
        '<div class="dim">' + t({ zh: '实测带宽上限 ≈ 0.35·z —— 零点就是那堵墙', en: 'measured bandwidth ceiling ≈ 0.35·z — the zero is the wall' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
let simClock = 0;                                 // 上一次 pushSample 看到的引擎时钟
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 本工具没有相位钟：显式把 ω 置 0，防引擎的 theta 积分把 undefined 累成 NaN。
     pushSample() 在 resetSim() 里先于第一帧被调用，所以这一句总是先生效。 */
  state.omega = 0;
  if (!SIM.A) seedAll();

  /* 引擎不给 pushSample 传 dt，这里自己从 state.t 差分出来（引擎已钳在 [0, 0.05]）。
     state.t 倒退 = 用户按了「重置」/ R —— 四路仿真整体重新播种。 */
  const dt = clamp(state.t - simClock, 0, 0.05);
  if (state.t < simClock - 1e-9) { seedAll(); SIM.clock = 0; }
  simClock = state.t;
  /* 定步长子步进（§0.3）：控制系统的教学价值全靠数值可信，绝不拿帧 dt 直接积一步。
     真正的推进在 advanceSim() 里，一格 TS = 2 ms、每格内 4 个 RK4 子步。 */
  advanceSim(dt);

  const A = SIM.A, B = SIM.B, Cc = SIM.C, D = SIM.D;
  /* 记录「当时的真实值」：中途拖滑杆改的是往后的控制律，已经画出去的那段
     历史是当时真实测到的，不重算（§4.6 / §6）。 */
  samples.push({
    t: state.t,
    ath: A.th, at: SIM.clock - A.t0,            /* ① 当前 K 的闭环响应与轮内时刻 */
    e: -B.th, uI: B.uI, uR: B.uR, bd: B.d,      /* ② 误差、积分项、谐振器、扰动 */
    cth: Cc.th, cd: Cc.d,                        /* ③ 探测正弦的输入与输出 */
    dx: D.x, dth: D.th, dF: D.F                  /* ④ 小车位置、摆角、作动力 */
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ④ 演算记录与回放（可选）—— 规范 §11                        ║
   ║  只有「同一次运行不可复得」的工具才需要（混沌、多体、由种子    ║
   ║  驱动的迭代）。不声明 RECORD 就完全没有录制 UI，行为与体积     ║
   ║  均不受影响 —— 绝大多数工具应当保持不声明。                   ║
   ╚══════════════════════════════════════════════════════════╝

   写法（每个可录制页签一份，键名与 SCENES 对应）：

   const RECORD = {
     lissa: {
       capture:  () => ({ th: state.theta }),        // 完整状态向量，JSON 可序列化
       restore:  s  => { state.theta = s.th; },      // 必须与 capture 对称（§8）
       seed:     () => ({ omega: state.omega }),     // 初值 + 积分参数
       reseed:   s  => { state.omega = s.omega; resetSim(); },
       lock:     ['omega'],                          // 回放期间置灰的滑杆
       roundOf:  () => 0                             // 当前轮次，供「录一轮」判定
     }
   };

   本工具不声明：四路仿真都不是「同一次运行不可复得」的对象 —— 它们是确定性
   的线性系统，同一组滑杆值重开就是同一条曲线，存轨迹没有信息增量。 */
const RECORD = {};

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    /* 回放冻结的是「演算」，不是「观察」：相机 tween 在上面已经走过了，
       视角、开关、绘制全部照常 —— 与「暂停只冻结模拟」同一条精神（§11.7）。 */
    if (recState.mode === 'replay') {
      recStep(dt);
    } else if (state.running) {
      if (recState.mode === 'recording') {
        /* 录制时把时间量子化成整数个 REC_DT。理由（§11.2）：物理若由变长的
           帧 dt 推进，轨迹就依赖于帧率抖动，「从同一种子重算」在**本机**都对
           不上，比对曲线也就失去意义。量子化之后轨迹是种子的确定性函数，
           本机重算能贴到舍入噪声，跨机器的差别才干净地归因于超越函数实现。 */
        recState.acc += dt;
        let guard = 0;
        while (recState.acc >= REC_DT && guard++ < 64) { recState.acc -= REC_DT; simAdvance(REC_DT); recPush(); }
      } else {
        simAdvance(dt);
      }
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); refreshRecInfo(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= 场景作用域参数与时间驱动 ================= */
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）

/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
