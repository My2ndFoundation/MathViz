/* ================= 图数据与算法（确定性预设图） =================
   9 个节点 A–I，13 条无向带权边。所有算法在同一张图上运行；
   startNode 与权重扰动 k 改变输入，但每组输入的结果完全确定、可复现。 */
/* ALGO-BEGIN（此块为纯函数，独立于引擎与 UI，可单独抽出做正确性测试） */
const NODE_NAMES = ['A','B','C','D','E','F','G','H','I'];
const NODES = [
  [-2.05,  0.00], [-1.05,  1.25], [-1.05, -1.25],
  [ 0.00,  0.45], [ 0.25, -1.40], [ 1.00,  1.35],
  [ 1.15, -0.50], [ 2.20,  0.70], [ 2.30, -1.20]
];
/* [u, v, 基础权重] */
const EDGES = [
  [0,1,4], [0,2,2], [1,2,1], [1,3,5], [2,4,9], [3,4,2], [3,5,7],
  [3,6,4], [4,6,3], [5,6,2], [5,7,3], [6,8,8], [7,8,2]
];
/* 确定性权重扰动模式（weightVariation 滑杆），保证重置可复现 */
const WPAT = [0, 1, -1, 1, 0, -1, 1, 0, -1, 1, 0, -1, 1];
function edgeWeights(k){ return EDGES.map((e, i) => Math.max(1, e[2] + k * WPAT[i])); }

function adjacency(){
  const adj = NODES.map(() => []);
  EDGES.forEach((e, i) => {
    adj[e[0]].push({ to: e[1], ei: i });
    adj[e[1]].push({ to: e[0], ei: i });
  });
  return adj;
}

/* 广度优先搜索：逐层扩张，layer = 最少边数距离 */
function computeBFS(start){
  const n = NODES.length, adj = adjacency();
  const layer = new Array(n).fill(-1);
  const parent = new Array(n).fill(-1);
  const parentEdge = new Array(n).fill(-1);
  layer[start] = 0;
  const q = [start], order = [start];
  while (q.length){
    const u = q.shift();
    const nb = adj[u].slice().sort((a, b) => a.to - b.to);
    for (const nx of nb){
      if (layer[nx.to] === -1){
        layer[nx.to] = layer[u] + 1;
        parent[nx.to] = u;
        parentEdge[nx.to] = nx.ei;
        q.push(nx.to);
        order.push(nx.to);
      }
    }
  }
  let maxLayer = 0;
  for (const L of layer) if (L > maxLayer) maxLayer = L;
  return { layer, parent, parentEdge, order, maxLayer };
}

   steps[j] = { u, du, relax:[{ei,from,to,old,nd,improved}], snap } */
function computeDijkstra(start, w){
  const n = NODES.length, adj = adjacency();
  const dist = new Array(n).fill(Infinity);
  const parent = new Array(n).fill(-1);
  const parentEdge = new Array(n).fill(-1);
  const done = new Array(n).fill(false);
  dist[start] = 0;
  const settleOrder = [], steps = [];
  for (let it = 0; it < n; it++){
    let u = -1, best = Infinity;
    for (let i = 0; i < n; i++) if (!done[i] && dist[i] < best){ best = dist[i]; u = i; }
    if (u === -1) break;
    done[u] = true;
    settleOrder.push(u);
    const relax = [];
    for (const nx of adj[u]){
      if (done[nx.to]) continue;
      const nd = dist[u] + w[nx.ei];
      const improved = nd < dist[nx.to];
      relax.push({ ei: nx.ei, from: u, to: nx.to, old: dist[nx.to], nd: nd, improved: improved });
      if (improved){ dist[nx.to] = nd; parent[nx.to] = u; parentEdge[nx.to] = nx.ei; }
    }
    steps.push({ u: u, du: dist[u], relax: relax, snap: dist.slice() });
  }
  return { dist, parent, parentEdge, settleOrder, steps };
}

/* Kruskal：边按权重从小到大检查，不成环则并入（并查集），n−1 条边即成树
   events[j] = { ei, w, accepted, snap(检查后各节点的分量代表), nAcc, total } */
function computeKruskal(w){
  const n = NODES.length;
  const sorted = EDGES.map((e, i) => i).sort((a, b) => (w[a] - w[b]) || (a - b));
  const comp = [];
  for (let i = 0; i < n; i++) comp[i] = i;
  const find = x => { while (comp[x] !== x){ comp[x] = comp[comp[x]]; x = comp[x]; } return x; };
  const events = [], accepted = [];
  let total = 0;
  for (const ei of sorted){
    if (accepted.length === n - 1) break;
    const a = find(EDGES[ei][0]), b = find(EDGES[ei][1]);
    const ok = a !== b;
    if (ok){ comp[a] = b; accepted.push(ei); total += w[ei]; }
    const snap = [];
    for (let i = 0; i < n; i++) snap[i] = find(i);
    events.push({ ei: ei, w: w[ei], accepted: ok, snap: snap, nAcc: accepted.length, total: total });
  }
  return { sorted, events, accepted, total, complete: accepted.length === n - 1 };
}

/* 结构页：活动边集的连通分量（并查集） */
function componentsOf(edgeOn){
  const n = NODES.length;
  const comp = [];
  for (let i = 0; i < n; i++) comp[i] = i;
  const find = x => { while (comp[x] !== x){ comp[x] = comp[comp[x]]; x = comp[x]; } return x; };
  EDGES.forEach((e, i) => { if (edgeOn[i]){ const a = find(e[0]), b = find(e[1]); if (a !== b) comp[a] = b; } });
  const groups = {};
  for (let i = 0; i < n; i++){
    const r = find(i);
    (groups[r] = groups[r] || []).push(i);
  }
  const list = Object.keys(groups).map(k => groups[k]);
  return { count: list.length, groups: list };
}

}

/* 沿一条节点序列匀速巡游的脉冲点（由共享时钟驱动） */
function pulsePos(walk, speed, phase){
  const segs = walk.length - 1;
  let p = (state.theta * speed + phase) % segs;
  if (p < 0) p += segs;
  const s = Math.floor(p), f = p - s;
  const a = NODES[walk[s]], b = NODES[walk[Math.min(s + 1, segs)]];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, 0];
}

function drawZRuler(C, x0, y0, zmax, tickStep, scale, unitLabel){
  const amber = 'rgba(251,191,36,0.55)';
  line3(C, [x0, y0, 0], [x0, y0, zmax], { width: 1.2, color: amber });
  for (let k = tickStep; k * scale <= zmax + 1e-6; k += tickStep){
    line3(C, [x0, y0 - 0.07, k * scale], [x0, y0 + 0.07, k * scale], { width: 1.2, color: amber });
    label3(C, [x0, y0 - 0.26, k * scale], String(k), { size: 10, color: 'rgba(251,191,36,0.8)', align: 'center' });
  }
  label3(C, [x0, y0 + 0.32, zmax], t(unitLabel), { size: 10.5, color: 'rgba(251,191,36,0.9)', align: 'center' });
}
/* 连通分量虚线圈（青色源结构） */
function drawHalo(C, members){
  let cx = 0, cy = 0;
  members.forEach(i => { cx += NODES[i][0]; cy += NODES[i][1]; });
  cx /= members.length; cy /= members.length;
  let r = 0.42;
  members.forEach(i => { r = Math.max(r, Math.hypot(NODES[i][0] - cx, NODES[i][1] - cy) + 0.4); });
  const pts = [];
  for (let j = 0; j <= 48; j++){
    const a = j / 48 * TAU;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), 0]);

  strokePoly(C, pts, { width: 1, dash: [5, 6], color: 'rgba(45,212,234,0.4)' });

      iso:   { label: { zh: '立体',     en: '3D' },         az: -0.9,       el: 0.32,  dist: 11.5, tx: 0, ty: 0, tz: 2.2 },
      side:  { label: { zh: '侧视 层级', en: 'Side layers' }, az: -Math.PI/2, el: 0.001, dist: 11,   tx: 0, ty: 0, tz: 2.6,
               onSelect(){ forceToggle('showLayers'); } },
      front: { label: { zh: '正视 图',  en: 'Front graph' },  az: 0.001,      el: 0.02,  dist: 8,    tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 'showTreeB',  label: { zh: 'BFS 树', en: 'BFS tree' },   color: '#fb7185', checked: true },
      { key: 'showFront',  label: { zh: '波前',   en: 'Wavefront' },  color: '#a78bfa', checked: true },
      { key: 'showLayers', label: { zh: '层级标尺', en: 'Layer ruler' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格',   en: 'Grid' },       color: '#64748b', checked: true }
    ],
    draw(C){
      const tr = traces(), bfs = tr.bfs, LZ = 1.3;
      const S = Math.min(stepF(), bfs.maxLayer);
      if (state.showGrid) drawGridXY(C, 2.6, 0.65);
      /* 基底图（暗淡的原图，位于 z=0） */
      for (let i = 0; i < EDGES.length; i++) drawEdge3(C, i, 0, 0, { width: 1.2, color: 'rgba(159,176,200,0.28)' });
      for (let i = 0; i < NODES.length; i++) solidDot(C, nodePt(i, 0), 2.4, 'rgba(159,176,200,0.6)');
      if (state.showLayers) drawZRuler(C, -2.75, -1.75, bfs.maxLayer * LZ, 1, LZ, { zh: '层', en: 'layer' });
      /* 提升后的节点 z 坐标（含出层动画） */
      const zOf = i => {
        const k = bfs.layer[i];
        if (k <= 0) return 0;
        const rv = clamp(S - (k - 1), 0, 1);
        return rv <= 0 ? null : ((k - 1) + ease(rv)) * LZ;
      };
      const Lf = state.theta >= bfs.maxLayer ? -1 : Math.min(bfs.maxLayer, Math.floor(S) + 1);
      /* BFS 树边（玫红）：连接相邻两层 */
      if (state.showTreeB){
        for (let i = 0; i < NODES.length; i++){
          if (bfs.parent[i] < 0) continue;
          const zi = zOf(i);
          if (zi === null) continue;
          const zp = zOf(bfs.parent[i]) || 0;
          const a = clamp(S - (bfs.layer[i] - 1), 0, 1);
          strokePoly(C, [nodePt(bfs.parent[i], zp), nodePt(i, zi)], { width: 5, color: 'rgba(251,113,133,' + (0.13 * a) + ')' });
          strokePoly(C, [nodePt(bfs.parent[i], zp), nodePt(i, zi)], { width: 2.2, color: 'rgba(251,113,133,' + (0.9 * a) + ')' });
        }
      }
      /* 提升的节点：投影虚线（琥珀）→ 光点 → 字母 */
      for (let i = 0; i < NODES.length; i++){
        const zi = zOf(i);
        if (zi === null) continue;
        if (state.showLayers && zi > 0.02){
          line3(C, nodePt(i, 0), nodePt(i, zi), { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.3)' });
        }
        const isFr = state.showFront && bfs.layer[i] === Lf;
        if (i === sNode()){
          drawNodeDot(C, i, zi, 11, 'rgba(186,240,255,0.9)');
        } else {
          drawNodeDot(C, i, zi, isFr ? 9.5 : 7, isFr ? 'rgba(167,139,250,0.9)' : 'rgba(45,212,234,0.85)');
        }
        nodeLabel(C, i, zi);
      }
      label3(C, [2.5, -1.75, 0], t({ zh: '起点 ', en: 'start ' }) + NODE_NAMES[sNode()],
        { size: 11, color: 'rgba(186,240,255,0.85)', align: 'center' });
    },
    readout(){
      const tr = traces(), bfs = tr.bfs;
      const s = Math.min(Math.floor(state.theta), bfs.maxLayer);
      const vis = bfs.layer.filter(L => L >= 0 && L <= s).length;
      const Lf = state.theta >= bfs.maxLayer ? bfs.maxLayer : Math.min(bfs.maxLayer, Math.floor(Math.min(stepF(), bfs.maxLayer)) + 1);
      const frontNodes = [];
      for (let i = 0; i < NODES.length; i++) if (bfs.layer[i] === Lf) frontNodes.push(NODE_NAMES[i]);
      return algoHead(bfs.maxLayer) +
        '<div>' + t({ zh: '已访问', en: 'visited' }) + ' <b>' + vis + '</b> / 9</div>' +
        '<div class="cosC">' + t({ zh: '波前 · 第 ', en: 'wavefront · layer ' }) + Lf + t({ zh: ' 层：', en: ': ' }) + '<b>' + (frontNodes.join(' ') || '—') + '</b></div>' +
        '<div class="sinC">' + t({ zh: 'BFS 树边', en: 'BFS tree edges' }) + ' = <b>' + Math.max(0, vis - 1) + '</b></div>' +
        '<div class="dim">' + t({ zh: '层 = 到起点的最少边数 · 不变量：波前外的节点不可能更近', en: 'layer = fewest edges from the start · invariant: nothing outside the frontier can be closer' }) + '</div>';
    }
  },

  /* ────── 3 · Dijkstra 最短路径 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 与 BFS 页同一条判断，加一条恒等式。
     ① 终止时读数印「已敲定 9 / 9」，实测 dij.steps.length = settleOrder.length = 9
     = NODES.length = |V|：又是输入规模。任何连通图跑完都等于它自己的 n，
     那是 while 循环的退出条件，不是某个量走到了某处 —— 详见 BFS 页注释里
     与 §4.7 认可的 n = 96 的对照（96 是数学预言的值，换数据就不是 96；
     这里的 9 换数据就是新的 n，结论一个字都不用改）。
     ② 读数末行那句不变量「敲定后 d 不再变」是**逐步成立**的恒等式：
     每敲定一个节点它就成立一次，没有哪一步它「终于」成立 ——
     真正会打破它的是负权边，而那是这一页留给用户去试的反例，不是本页会走到的事。
     ③ 退一步取「每敲定一个节点」当判据也不行：九步除以 ω = 0.55 步/s ⇒
     1.8 s 一次，频闪。 */
  dij: {
    label: { zh: 'Dijkstra 最短路', en: 'Dijkstra' },
    params: ['startNode', 'wvar', 'omega'],
    /* 与 BFS 页同一诊断：九步敲定完九个节点后永久定格（读数区「完成（按 R 重放）」）。
       两根可拖的滑杆里选起点 s 而不是权重扰动 k：tips 说「每个节点的高度字面上就是
       它到起点的最短距离」，高度这件事只有换源点才会整体改写；k 只是把某几条边的坡度
       调一调，最短路树多半原样不动。k 因此留给用户，让他自己去试「负权会怎样」那个反例。
       值域、kind、周期与取整夹取均与 BFS 页同口径，见那一页的说明。 */
    drive: { key: 'startNode', from: 0, to: 8, period: 18, kind: 'linear' },
    brand: { zh: 'Dijkstra 每一步敲定一个「当前最近」的未定节点，再松弛它的邻边。不变量：敲定过的距离绝不再变——这正是它要求边权非负的原因。节点的高度就是最短距离。',
             en: 'Each Dijkstra step settles the closest unsettled node, then relaxes its edges. The invariant — a settled distance never changes again — is exactly why edge weights must be non-negative. A node’s height is its shortest distance.' },
    tips: { zh: '顿悟：按 2 侧视——每个节点的高度字面上就是它到起点的最短距离，最短路树成了一张缆车图；玫红树边的坡长就是边权。若允许负权边，「敲定不悔」的不变量就会被推翻。',
            en: 'Epiphany: press 2 for the side view — each node’s height literally is its shortest distance from the start, and the shortest-path tree becomes a cable-car diagram whose rose edges climb by exactly the edge weight. Negative weights would break the never-revise invariant.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.9,       el: 0.32,  dist: 11.5, tx: 0, ty: 0, tz: 2.6 },
      side:  { label: { zh: '侧视 距离', en: 'Side distance' }, az: -Math.PI/2, el: 0.001, dist: 11.5, tx: 0, ty: 0, tz: 3,
               onSelect(){ forceToggle('showDist'); } },
      front: { label: { zh: '正视 图',  en: 'Front graph' },   az: 0.001,      el: 0.02,  dist: 8,    tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 'showSPT',   label: { zh: '最短路树', en: 'Shortest-path tree' }, color: '#fb7185', checked: true },
      { key: 'showRelax', label: { zh: '松弛操作', en: 'Relaxations' },        color: '#a78bfa', checked: true },
      { key: 'showFar',   label: { zh: '最远路径', en: 'Farthest path' },      color: '#fb923c', checked: true },
      { key: 'showDist',  label: { zh: '距离与权重', en: 'Distances & weights' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',  label: { zh: '网格',     en: 'Grid' },               color: '#64748b', checked: true }
    ],
    draw(C){
      const tr = traces(), dij = tr.dij, w = tr.w;
      let maxd = 1;
      dij.dist.forEach(d => { if (isFinite(d)) maxd = Math.max(maxd, d); });
      const zs = 6.0 / maxd;
      const nStep = dij.steps.length;
      const S = Math.min(stepF(), nStep);
      const f = S - Math.floor(S);
      const settledN = Math.min(Math.floor(S), nStep);
      const zNow = i => {
        for (let k = 0; k < settledN; k++) if (dij.settleOrder[k] === i) return dij.dist[i] * zs;
        if (settledN < nStep && dij.steps[settledN].u === i) return dij.dist[i] * zs * ease(f);
        return null;                                  /* 未敲定：仍在基底 */
      };
      if (state.showGrid) drawGridXY(C, 2.6, 0.65);
      /* 基底图与权重 */
      for (let i = 0; i < EDGES.length; i++) drawEdge3(C, i, 0, 0, { width: 1.2, color: 'rgba(159,176,200,0.28)' });
      if (state.showDist) for (let i = 0; i < EDGES.length; i++) weightLabel(C, i, w[i], 0);
      if (state.showDist) drawZRuler(C, -2.75, -1.75, maxd * zs, maxd > 12 ? 5 : 2, zs, { zh: '距离', en: 'dist' });
      const snapPrev = settledN > 0 ? dij.steps[settledN - 1].snap : dij.dist.map((d, i) => i === sNode() ? 0 : Infinity);
      /* 最短路树（玫红缆车图） */
      if (state.showSPT){
        for (let k = 0; k < Math.min(settledN + 1, nStep); k++){
          const u = dij.settleOrder[k];
          if (u == null || dij.parent[u] < 0) continue;
          const zu = zNow(u);
          if (zu === null) continue;
          const p = dij.parent[u], zp = dij.dist[p] * zs;
          const a = k < settledN ? 1 : ease(f);
          strokePoly(C, [nodePt(p, zp), [NODES[u][0], NODES[u][1], zu]], { width: 5, color: 'rgba(251,113,133,' + (0.13 * a) + ')' });
          strokePoly(C, [nodePt(p, zp), [NODES[u][0], NODES[u][1], zu]], { width: 2.2, color: 'rgba(251,113,133,' + (0.9 * a) + ')' });
        }
      }
      /* 当前步的松弛脉冲（紫）：从新敲定节点射向各邻居 */
      if (state.showRelax && settledN < nStep && state.theta < nStep){
        const st = dij.steps[settledN];
        const zu = dij.dist[st.u] * zs * ease(f);
        const pulse = 0.2 + 0.6 * Math.sin(Math.PI * clamp(f, 0, 1));
        for (const r of st.relax){
          line3(C, [NODES[st.u][0], NODES[st.u][1], zu], nodePt(r.to, 0),
            { width: r.improved ? 2 : 1.2, dash: r.improved ? null : [4, 5], color: 'rgba(167,139,250,' + pulse + ')' });
          if (r.improved){
            label3(C, nodePt(r.to, 0), di(r.old) + '→' + r.nd, { size: 10, color: '#a78bfa', align: 'center', dy: 14 });
          }
        }
      }
      /* 完成后：到最远节点的路径（橙） */
      if (state.showFar && state.theta >= nStep){
        let far = sNode();
        dij.dist.forEach((d, i) => { if (isFinite(d) && d > dij.dist[far]) far = i; });
        const walk = [];
        for (let u = far; u >= 0; u = dij.parent[u]){ walk.push(u); if (u === sNode()) break; }
        walk.reverse();
        const pts = walk.map(u => nodePt(u, dij.dist[u] * zs));
        strokePoly(C, pts, { width: 6.5, color: 'rgba(251,146,60,0.16)' });
        strokePoly(C, pts, { width: 3, color: 'rgba(251,146,60,0.95)' });
      }
      /* 节点：敲定=翠绿抬升，进行中=玫红上升，未定=基底暗点+暂定距离 */
      for (let i = 0; i < NODES.length; i++){
        const zi = zNow(i);
        if (zi === null){
          solidDot(C, nodePt(i, 0), 2.6, 'rgba(159,176,200,0.65)');
          nodeLabel(C, i, 0, 'rgba(159,176,200,0.75)');
          if (state.showDist && state.theta < nStep){
            label3(C, nodePt(i, 0), 'd=' + di(snapPrev[i]), { size: 10, color: 'rgba(167,139,250,0.75)', align: 'center', dy: 26 });
          }
          continue;
        }
        if (state.showDist && zi > 0.02) line3(C, nodePt(i, 0), nodePt(i, zi), { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.3)' });
        const rising = settledN < nStep && dij.steps[settledN].u === i;
        if (i === sNode()) drawNodeDot(C, i, zi, 11, 'rgba(186,240,255,0.9)');
        else drawNodeDot(C, i, zi, rising ? 9.5 : 7.5, rising ? 'rgba(251,113,133,0.9)' : 'rgba(52,211,153,0.88)');
        nodeLabel(C, i, zi);
        if (state.showDist) label3(C, nodePt(i, zi), 'd=' + dij.dist[i], { size: 10, color: '#fbbf24', align: 'center', dy: 14 });
      }
    },
    readout(){
      const tr = traces(), dij = tr.dij;
      const nStep = dij.steps.length;
      const settledN = Math.min(Math.floor(state.theta), nStep);
      let cur = '';
      if (settledN < nStep){
        const st = dij.steps[settledN];
        const imp = st.relax.filter(r => r.improved).map(r => 'd(' + NODE_NAMES[r.to] + ') ' + di(r.old) + '→' + r.nd);
        cur = '<div class="tanC">' + t({ zh: '本步敲定：', en: 'settling: ' }) + '<b>' + NODE_NAMES[st.u] + '</b> (d = ' + st.du + ')</div>' +
              '<div class="cosC">' + t({ zh: '松弛：', en: 'relax: ' }) + '<b>' + (imp.join(' · ') || t({ zh: '无改进', en: 'no improvement' })) + '</b></div>';
      } else {
        let far = sNode();
        dij.dist.forEach((d, i) => { if (isFinite(d) && d > dij.dist[far]) far = i; });
        const walk = [];
        for (let u = far; u >= 0; u = dij.parent[u]){ walk.push(NODE_NAMES[u]); if (u === sNode()) break; }
        walk.reverse();
        cur = '<div class="tanC">' + t({ zh: '已敲定', en: 'settled' }) + ' <b>9</b> / 9</div>' +
              '<div class="cotC">' + t({ zh: '最远 ', en: 'farthest ' }) + NODE_NAMES[far] + t({ zh: '：', en: ': ' }) + 'd = <b>' + dij.dist[far] + '</b> · ' + walk.join('–') + '</div>';
      }
      return algoHead(nStep) + cur +
        '<div class="sinC">' + t({ zh: '最短路树边', en: 'shortest-path tree edges' }) + ' = <b>' + Math.max(0, settledN - 1) + '</b></div>' +
        '<div class="dim">' + t({ zh: '不变量：敲定后 d 不再变 —— 因此不允许负权边', en: 'invariant: settled d never changes — hence no negative edge weights' }) + '</div>';
    }
  },

  /* ────── 4 · 最小生成树（Kruskal） ────── */
  mst: {
    label: { zh: '最小生成树', en: 'MST (Kruskal)' },
    params: ['wvar', 'omega'],
    /* 同上：十步检完十条边后永久定格。本页没有起点可言（Kruskal 不需要源点），
       两根滑杆里 ω 是钟，真正的自变量只剩权重扰动 k —— 而它正是这一页的要害：
       tips 让人看「每条边悬挂在 z = 权重的高度上，算法像涨潮一样从低到高收边」，
       k 一动，整排边在权重阶梯上重新排队，谁先被收、谁因成环被弹回（玫红 ×）跟着换人，
       连总权 Σw 都变——「最小」这件事是相对一组具体权重而言的，这一点只有动起来才看得见。
       值域取满 [0, 3]：k = 0 是「基础权重」这个必要的对照基准，不是退化端。
       取整后四档各占一段平台（阶梯驱动，理由同 BFS 页）。
       k = 3 跳回 0 整棵树会瞬间换形 ⇒ linear（往返）；四档来回，取 12 s，每档约 1.5 s。
       wvar 被用作缓存键，已在 wVar() 里 round + clamp。 */
    drive: { key: 'wvar', from: 0, to: 3, period: 12, kind: 'linear' },
    brand: { zh: 'Kruskal 按权重从小到大逐条检边：不成环就收入树中，成环就丢弃。「连接所有节点」与「总权最小」是两个约束，恰好 n−1 条边同时满足它们。',
             en: 'Kruskal examines edges from lightest to heaviest: keep an edge unless it closes a cycle. "Connect every node" and "minimize total weight" are two separate constraints — exactly n−1 edges satisfy both.' },
    tips: { zh: '顿悟：按 3 侧视——每条边悬挂在 z = 权重的高度上，算法像涨潮一样从低到高收边，成环的边被弹回（玫红 ×）；青色虚线圈是并查集的分量，收边即合并。按 2 正视看最终的最小生成树。',
            en: 'Epiphany: press 3 for the side view — every edge hangs at height z = its weight, and the algorithm collects them like a rising tide, bouncing off any edge that would close a cycle (rose ×); the dashed cyan rings are union-find components merging as edges land. Press 2 to face the finished MST.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.8,       el: 0.38,  dist: 11,  tx: 0, ty: 0, tz: 2.2 },
      front: { label: { zh: '正视 树',  en: 'Front MST' },    az: 0.001,      el: 0.02,  dist: 7.5, tx: 0, ty: 0, tz: 0 },
      side:  { label: { zh: '侧视 权重', en: 'Side weights' }, az: -Math.PI/2, el: 0.001, dist: 11,  tx: 0, ty: 0, tz: 2.8,
               onSelect(){ forceToggle('showQueue'); } }
    },
    toggles: [
      { key: 'showRejected', label: { zh: '成环弃边', en: 'Rejected edges' }, color: '#fb7185', checked: true },
      { key: 'showQueue',    label: { zh: '权重阶梯', en: 'Weight ladder' },  color: '#a78bfa', checked: true },
      { key: 'showMST',      label: { zh: '已收树边', en: 'Tree edges' },     color: '#34d399', checked: true },
      { key: 'showHalo',     label: { zh: '连通分量', en: 'Components' },     color: '#2dd4ea', checked: true },
      { key: 'showGrid',     label: { zh: '网格',     en: 'Grid' },           color: '#64748b', checked: true }
    ],
    draw(C){
      const tr = traces(), mst = tr.mst, w = tr.w, WS = 0.62;
      let maxW = 1;
      w.forEach(x => { maxW = Math.max(maxW, x); });
      const nEv = mst.events.length;
      const S = Math.min(stepF(), nEv);
      const j = Math.floor(S), f = S - j;
      const pos = {};
      mst.sorted.forEach((ei, q) => { pos[ei] = q; });
      if (state.showGrid) drawGridXY(C, 2.6, 0.65);
      for (let i = 0; i < EDGES.length; i++) drawEdge3(C, i, 0, 0, { width: 1, color: 'rgba(159,176,200,0.18)' });
      if (state.showQueue) drawZRuler(C, -2.75, -1.75, maxW * WS, 2, WS, { zh: '权重', en: 'weight' });
      /* 每条边按其在排序队列中的位置渲染 */
      for (let i = 0; i < EDGES.length; i++){
        const p = pos[i];
        if (p < j && p < nEv){
          const ev = mst.events[p];
          if (ev.accepted){
            if (state.showMST){
              drawEdge3(C, i, 0, 0, { width: 5.5, color: 'rgba(52,211,153,0.14)' });
              drawEdge3(C, i, 0, 0, { width: 2.4, color: 'rgba(52,211,153,0.92)' });
              weightLabel(C, i, w[i], 0);
            }
          } else if (state.showRejected){
            drawEdge3(C, i, 0, 0, { width: 1.4, dash: [4, 5], color: 'rgba(251,113,133,0.55)' });
            label3(C, edgeMid(i, 0), '×', { size: 12, color: '#fb7185', align: 'center' });
          }
        } else if (p === j && j < nEv && state.theta < nEv){
          /* 正在下落的当前检查边 */
          const zc = w[i] * WS * (1 - ease(f));
          drawEdge3(C, i, zc, zc, { width: 2.4, color: 'rgba(167,139,250,0.9)' });
          weightLabel(C, i, w[i], zc, 'rgba(251,191,36,0.95)');
          label3(C, [-2.75, -1.45, w[i] * WS], t({ zh: '检查 w = ', en: 'testing w = ' }) + w[i],
            { size: 10.5, color: '#fbbf24', align: 'left' });
        } else if (state.showQueue){
          /* 尚未检查：悬挂在 z = 权重 的高度 */
          const zq = w[i] * WS;
          drawEdge3(C, i, zq, zq, { width: 1.4, color: 'rgba(167,139,250,0.25)' });
          weightLabel(C, i, w[i], zq, 'rgba(167,139,250,0.5)');
        }
      }
      /* 并查集分量圈（检查完 j 条边后的快照） */
      if (state.showHalo){
        const snap = j > 0 ? mst.events[Math.min(j, nEv) - 1].snap : NODES.map((_, i) => i);
        const groups = {};
        snap.forEach((r, i) => { (groups[r] = groups[r] || []).push(i); });
        Object.keys(groups).forEach(k => drawHalo(C, groups[k]));
      }
      for (let i = 0; i < NODES.length; i++){
        drawNodeDot(C, i, 0, 6.5, 'rgba(45,212,234,0.85)');
        nodeLabel(C, i, 0);
      }
      /* 金光闪（§4.7）：最后一条边落进树里、「已接受」停在 8 = n − 1 的那一瞬。
         这一页值得闪、而 BFS / Dijkstra 两页不值得，差别就在这个 8：
         那两页终止时印的 9 是 |V|，是输入规模、是循环退出条件；
         这里检了 10 条边（k ≥ 2 时 11 条）却只收 8 条，**停的位置是定理预言的**，
         而且是本工具两个页签都讲过的同一个定理（「路径与连通」页 tips「树恰有 n−1 条边」、
         本页 brand「恰好 n−1 条边同时满足两个约束」）。实测四档权重扰动：
         k = 0/1 检 10 条、k = 2/3 检 11 条，Σw 从 20 一路变到 28 ——
         检边数在变、总权在变，收下的边数 8 岿然不动。那才叫走到了一个数上。
         判据没有阈值可借，也不需要：两个布尔而已。`mst.complete` 就是
         computeKruskal 末行的 `accepted.length === n − 1`，也正是 readout 里 `done`
         用来印「完成：8 = 9 − 1 条边 · 连通 ✓ · 无环 ✓」的那一个；
         `state.theta >= nEv` 是「动画确实播到了最后一条边」—— 少了它，complete
         是对整个预计算结果说的，第一帧就为真，会开局白闪。
         实测（ω = 0.55 步/s）：60 s 内 1 次。默认开自动播放（k 被 drive 扫）时
         命中在 t = 20.00 s、θ = 11.0（那一刻 k = 2 ⇒ nEv = 11）；关掉自动播放、
         k 钉在 PARAMS 默认 0 时命中在 t = 18.18 s、θ = 10.0。
         之后 θ 单调不回卷、nEv ≤ 11，判据恒真 —— 上升沿只有一次，整场一闪，
         按 R 重放才有下一次（resetSim 里的 goldFlashReset() 已把打点清账）。
         代价是要等 18 ~ 20 s；这是这一页的节奏，不是判据太严。
         锚点取最后一条事件边的中点：computeKruskal 只有在 accepted 满 n − 1 时才 break，
         所以末条事件必是被接受的那条 —— 合上这棵树的那条边，光就从它身上炸开。 */
      goldHit('mst', mst.complete && state.theta >= nEv);
      drawGoldFlash(C, nEv ? edgeMid(mst.events[nEv - 1].ei, 0) : null);
    },
    readout(){
      const tr = traces(), mst = tr.mst;
      const nEv = mst.events.length;
      const j = Math.min(Math.floor(state.theta), nEv);
      const last = j > 0 ? mst.events[j - 1] : null;
      const acc = last ? last.nAcc : 0;
      const rej = j - acc;
      const total = last ? last.total : 0;
      const done = state.theta >= nEv && mst.complete;
      return algoHead(nEv) +
        '<div>' + t({ zh: '已检边', en: 'examined' }) + ' <b>' + j + '</b> / ' + nEv +
          '&ensp;·&ensp;<span class="tanC">' + t({ zh: '接受', en: 'kept' }) + ' <b>' + acc + '</b></span>' +
          '&ensp;·&ensp;<span class="sinC">' + t({ zh: '弃', en: 'rejected' }) + ' <b>' + rej + '</b></span></div>' +
        '<div class="tanC">' + t({ zh: '当前树权', en: 'tree weight' }) + ' Σw = <b>' + total + '</b></div>' +
        (done ? '<div class="cosC">' + t({ zh: '完成：8 = 9 − 1 条边 · 连通 ✓ · 无环 ✓', en: 'done: 8 = 9 − 1 edges · connected ✓ · acyclic ✓' }) + '</div>' : '') +
        '<div class="dim">' + t({ zh: '两个约束：连接所有节点 + 总权最小 · 贪心可行的关键：环上最重的边必不在 MST 中', en: 'two constraints: connect all nodes + minimum total weight · greedy works because the heaviest edge on any cycle is never in the MST' }) + '</div>';
    }
  }
};
/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 记录当时的真实算法进度：步数与三种算法各自的「已知区域」规模 */
  const tr = traces();
  const s = state.theta;
  const bl = Math.min(Math.floor(s), tr.bfs.maxLayer);
  samples.push({
    t: state.t,
    step: s,
    bfsN: tr.bfs.layer.filter(L => L >= 0 && L <= bl).length,
    dijN: Math.min(Math.floor(s), tr.dij.steps.length),
    mstN: (function(){ let a = 0; const j = Math.min(Math.floor(s), tr.mst.events.length);
      for (let i = 0; i < j; i++) if (tr.mst.events[i].accepted) a++; return a; })()
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {

      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');

        state[tg.key] = cb.checked;

      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);

}

}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */

    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

function setLang(l) {

  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
