<!-- ============================================================
  火箭：会自己变的倒立摆 —— 推力矢量控制沙盒 · 交互式数学可视化
  基于 math-viz-starter.html v1.1.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇 / §11 记录回放）

  ── 一句话 ────────────────────────────────────────────────
  **火箭就是倒立摆**：推力矢量接在下面，重心在上面，任何姿态偏差都自己
  长大。它比裸摆多出来的三件事，正是本工具要给你撞的三堵墙：
    ① 被控对象在飞行中**自己变**（T·ℓ(t)/J(t) 一路漂移，默认参数实测
       13.97 → 31.66 s⁻²，×2.27，一次飞行 46.7 s）；
    ② 扰动通道**变多**（常值风 + 阵风 + 气动静不稳定）；
    ③ 作动器**有限**（位置限幅 + 速率限幅 + 一阶滞后）。

  ── 教学参数声明（重要）──────────────────────────────────
  箭体长度、干重、燃料、流量、重心与压心位置、参考面积与气动系数，
  **全部是为把课讲清楚而选的教学参数，不是任何真实型号的数据**，也不要
  拿去反推谁家的火箭。它们只需满足：起飞推重比略大于 1、飞行几十秒、
  T·ℓ/J 有肉眼可见的漂移、最大动压附近气动极点能与控制权限打成平手。

  ── 物理与数值 ────────────────────────────────────────────
  二维竖直平面，状态 (x, y, vx, vy, θ, ω, fuel)。质量随燃料线性下降，
  **重心 c(t) 随燃料迁移**，转动惯量 J(t) 随之变。推力经喷管摆角 δ 作用：
      τ = −T·ℓ(t)·sin δ，  ℓ(t) = 喷管到重心的力臂
  线性化后 θ̈ = a(t)·θ − b(t)·δ，其中
      b(t) = T·ℓ(t)/J(t)                     ← 本工具的心脏
      a(t) = q(t)·A·Cnα·(c_p − c)/J(t)       ← 气动，开环极点 s = ±√a
  右半平面那个 +√a 就是「必倒」的数学，四个页签的读数区都能看到它。

  **与设计文档的一处修正**：文档 §3.1 写「压心在重心之下时加剧不稳定」，
  方向写反了。真实火箭是压心在重心**之上**（靠近头部）才静不稳定，尾翼
  把压心往后拉才稳定。这里按物理实际实现，滑杆「压心 − 重心」> 0 即静
  不稳定，默认 +2 m —— 这正是真实运载火箭的常态，也正是它离了 TVC 就
  必倒的原因。

  积分器：**RK4，固定步长 h = 1/2000 s**，帧内做 floor(dt/h) 个子步（余量
  留到下一帧），子步上限 260。模拟时刻恒为 k·h，绝不累加浮点。控制器**是
  离散的**：按 fs 零阶保持更新（k % ctrlEvery == 0），这是刻意的 —— 采样
  带来的纯延迟 0.5/fs 是本工具的核心教学点，连续控制器会把它藏起来。
  作动器与控制采样都是不可微环节，因此在子步边界上更新，不进 RK4 的
  右端项（δ 在一个子步内冻结）。

  可复现性：风 = 常值 + 阵风，阵风由 **mulberry32 有种子伪随机数**生成的
  插值表给出，是「种子 + 模拟时刻」的纯函数（Math.random 在这里不可用）。
  于是同一颗种子、同一组参数的两次发射逐位一致 —— §11 的存档才回放得了。

  ── 每一次坠毁都必须可诊断 ────────────────────────────────
  读数区常驻「结局 + 诊断」两行，诊断按设计文档 §3.3 的优先级表判定首要
  死因并给出识别它的证据：采样过慢 / 增益过高+饱和 / 增益调度缺失 /
  积分饱和 / 作动器太慢。五条都不过阈值时报得分最高的主导因素，绝不说
  「不知道」——诊断不出来的坠毁是工具的 bug，不是模拟的特性。

  ── 运动机制（规范 §8 出路①的痕迹要求）────────────────────
  **没有任何参数带 drive。** 四个页签全部靠 RK4 积分器自己推进，每个场景
  对象内都留了一行注释写明这一点。飞行落幕后停留 3.6 s 让人读完诊断，
  随即**自动再发射一次**（同一颗种子 ⇒ 同一次飞行），因此没有任何页签会
  「一次性演进后永久定格」。改动种子滑杆 = 显式的「再发射一次」：清空
  历史、从新参数重新点火，已经画出去的那一段是当时的真实值，不重算。

  ── 四个页签 ──────────────────────────────────────────
  飞行       —— 箭体、重心、压心、力臂 ℓ(t)、喷管摆角与羽流、风场箭头
                顿悟视角：「正视 x·y」= 推力线不穿过重心，倒立摆现形
  姿态与控制量 —— θ、δ_cmd（零阶保持阶梯）、δ_actual；限幅段橙、限速段白
                顿悟视角：「侧视 δ·t」= 台阶。把 fs 拉低，台阶变粗
  裕度仪表盘  —— 相位裕度 / 增益裕度 / 作动余量 / 权限比，全部随时间变
                顿悟视角：「侧视 M·t」= 它们不是常数，一路下沉
  增益调度    —— 同一阵风、同一组初值，定增益 vs 调度增益并排飞
                顿悟视角：「侧视 双 θ·t」= 差别只在飞行的后半段

  ── 增益调度是怎么调的 ────────────────────────────────
  调度钉住的是**闭环**而不是开环增益：每一刻按当前 b(t)、a(t) 反解出
  b·Kp − a = ωn²、b·Kd = 2ζωn。ωn 不能只取起飞值 —— 气动右半平面极点
  p = √a 会随动压长大，而带一个 +p 极点的回路必须让闭环带宽显著高过 p，
  所以令 ωn ≥ 3√a。但调度器**不去要它要不到的带宽**：作动器一阶极点的
  1/3 与采样角频率的 1/12 各给一条上限。撞上这两条线时相位裕度自己塌
  下去 —— 那是真的做不到，不是没调好。

  ── 存档体积提示 ──────────────────────────────────────
  capture() 装的是**两枚**火箭的完整积分器状态（含控制器 I 项、作动器、
  子步计数 k 与余量 acc、以及全部路径相关的诊断累加器），实测 112 个
  字段/行。默认参数下一次发射 = 2514 行 ≈ 2.7 MB JSON。比规范 §11.4
  举的例子大，但「回放不做算术」的前提是状态要装全 —— 漏一个 I 项，
  回放就会悄悄偏离，而画面看上去完全正常。

  版本记录（changelog，新→旧）：

                       每帧成立的结构事实，第三页的 b·Kp − a = ωn² 是代数恒等式

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);

  }catch(e){}

/* TAU 与角度换算提到 PARAMS/SCENES 之前声明：物理常量块在对象字面量里直接
   引用它们（非惰性函数体内），留在原「常量与状态」区会触发 TDZ。 */
const TAU = Math.PI * 2;
const DEG = 180 / Math.PI;
const RAD = Math.PI / 180;

/* ============================================================
   火箭模型（二维竖直平面）—— 全部是**教学参数**
   ------------------------------------------------------------
   下面每一个数字都是为了让课讲得清楚而选的，**不是任何真实型号的
   数据**，也不要拿去反推谁家的火箭。它们只需满足三件事：
     ① 起飞推重比略大于 1，飞行持续几十秒，肉眼跟得住；
     ② 燃料耗尽前后 T·ℓ(t)/J(t) 有量级可见的漂移（实测 ×2.2 左右）；
     ③ 最大动压附近气动右半平面极点能与控制权限打成平手。

   坐标：世界 x = 水平，y = 高度，z = 时间轴（引擎约定，§4.1）。
   火箭状态 st = [x, y, vx, vy, θ, ω, fuel]，θ 自竖直方向逆时针为正。
   喷管在箭体底端，重心在其上方 ℓ(t) 处 —— **这就是倒立摆**：
   推力作用在下面，重心在上面，任何姿态偏差都自己长大。
   ============================================================ */
const VEH = {
  L: 20,          // 箭体长度 m
  mDry: 2500,     // 干重 kg
  mdot: 300,      // 燃料质量流量 kg/s
  cDry: 11,       // 干结构重心距喷管 m
  Lf: 10,         // 燃料柱等效长度 m
  Aref: 10,       // 气动参考面积 m²
  Cna: 3.0,       // 法向力系数导数 /rad
  Cd: 0.6,        // 阻力系数
  tauAct: 0.04,   // 作动器一阶时间常数 s
  g: 9.81,
  rho0: 1.225,
  Hs: 8000        // 大气标高 m
};

const H_STEP = 1 / 2000;   // RK4 定步长（规范 §0.3：绝不拿帧 dt 直接积一步）
const MAX_SUB = 260;       // 每帧子步上限（后台切回时宁可落后，也不卡死一帧）
const DIAG_EVERY = 40;     // 裕度/诊断评估周期（子步）= 0.02 s，纯 k 的函数
const HOLD_SEC = 3.6;      // 结局停留时长，之后自动再发射一次（§8 出路①）
const T_MAX = 130;         // 单次发射的模拟时间上限 s
const TH_KILL = 70 * RAD;  // 判「翻滚失控」的姿态阈值
const TH_OK = 20 * RAD;    // MECO 时判「姿态良好」的阈值

/* 结局编码（索引即编码，天然对称，可直接进存档） */
const END_NAME = [
  { zh: '主机关机（MECO）· 姿态保持住了', en: 'MECO — attitude held' },
  { zh: '翻滚失控', en: 'Tumbled out of control' },
  { zh: '触地', en: 'Ground impact' },

  { zh: '超时 / 推力不足未能起飞', en: 'Timed out / never lifted off' }
];

/* ---------- 质量、重心与转动惯量：三者都随燃料变 ---------- */
function fuelComOf() { return VEH.cDry + state.comShift * VEH.L; }
function comOf(fuel) {
  const cf = fuelComOf();
  return (VEH.mDry * VEH.cDry + fuel * cf) / (VEH.mDry + fuel);
}
function inertiaOf(fuel, c) {
  const cf = fuelComOf();
  const dD = VEH.cDry - c, dF = cf - c;
  return VEH.mDry * VEH.L * VEH.L / 12 + VEH.mDry * dD * dD +
         fuel * VEH.Lf * VEH.Lf / 12 + fuel * dF * dF;
}

/* ---------- 风：有种子的伪随机数（Math.random 在这里不可用） ---------- */
/* 存档要能复现，风就必须是「种子 + 模拟时刻」的纯函数。mulberry32 是
   32 位整数状态的确定性发生器，跨浏览器逐位一致（只用 imul / 移位，
   不碰任何超越函数）。阵风表在播种时一次性生成，之后 gustAt() 只做
   平滑插值 —— 于是风不依赖帧率、不依赖子步边界，是 ts 的纯函数。 */
function mulberry32(a) {
  return function () {
    a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const GUST_N = 512, GUST_DT = 0.35;
const gustTab = new Array(GUST_N).fill(0);
function buildGust(seed) {
  const r = mulberry32((seed | 0) * 2654435761 >>> 0);
  for (let i = 0; i < GUST_N; i++) gustTab[i] = r() * 2 - 1;
}
function gustAt(ts) {
  const u = ts / GUST_DT;
  const i0 = Math.floor(u), f = u - i0;
  const i = ((i0 % GUST_N) + GUST_N) % GUST_N, j = (i + 1) % GUST_N;
  const s = f * f * (3 - 2 * f);          // smoothstep：C¹ 连续，RK4 才有意义
  return gustTab[i] * (1 - s) + gustTab[j] * s;
}
/* 风廓线：地面弱、9 km 附近有一条「急流」。这不是装饰 —— 常值侧风在自由
   飞行体上只是**瞬态**：箭被吹得侧移，直到 vx 追上风速，相对侧风就没了。
   只有随高度变化的风（箭一直在往新的风层里钻）才是持续扰动，积分饱和与
   最大动压这两课才有得讲。 */
function windAt(ts, y) {
  const jz = (y - 9000) / 4500;
  const shear = 0.35 + 1.65 * Math.exp(-jz * jz);
  return (state.wind + state.gust * gustAt(ts)) * shear;
}

/* ---------- 导数：RK4 的右端项 ---------- */
/* δ 在一个子步内冻结（作动器侧的零阶保持），所以它是参数不是状态。 */
function deriv(st, dact, ts, out) {
  const fuel = st[6] > 0 ? st[6] : 0;
  const burning = fuel > 0 && state.thrust > 0;
  const T = burning ? state.thrust : 0;
  const m = VEH.mDry + fuel;
  const c = comOf(fuel), J = inertiaOf(fuel, c);
  const th = st[4];

  /* 推力：沿箭体轴、再偏转 δ。力臂 ℓ(t) = c（喷管在底端）
     τ_thrust = −T·ℓ·sin δ —— 与设计文档 §3.1 的 T·sin δ·ℓ 同一式，
     负号只是「δ 为正时把箭头往回压」的符号约定。 */
  const Fx = -T * Math.sin(th + dact);
  const Fy = T * Math.cos(th + dact);
  let tau = -T * c * Math.sin(dact);

  /* 气动：法向力作用在压心，压心相对重心的位置 = state.cpShift。
     **诚实说明**：真实火箭压心在重心**之上**（靠近头部）时才是静不稳定的
     —— 尾翼把压心往后（下）拉才是稳定构型。设计文档 §3.1 那句「压心在
     重心之下时加剧不稳定」把方向写反了，这里按物理实际实现，默认
     cpShift = +2 m（压心在重心上方 2 m），于是本箭**气动静不稳定** ——
     这正是真实运载火箭的常态，也正是它离了 TVC 就必倒的原因。 */
  const w = windAt(ts, st[1]);
  const rvx = st[2] - w, rvy = st[3];
  const V = Math.sqrt(rvx * rvx + rvy * rvy);
  let Ax = 0, Ay = 0;
  if (V > 1e-3) {
    const rho = VEH.rho0 * Math.exp(-(st[1] > 0 ? st[1] : 0) / VEH.Hs);
    const q = 0.5 * rho * V * V;
    const px = Math.cos(th), py = Math.sin(th);        // 箭体法向
    const vperp = rvx * px + rvy * py;
    const N = -q * VEH.Aref * VEH.Cna * (vperp / V);
    Ax += N * px; Ay += N * py;
    const D = q * VEH.Aref * VEH.Cd;
    Ax += -D * rvx / V; Ay += -D * rvy / V;
    tau += q * VEH.Aref * VEH.Cna * (vperp / V) * state.cpShift;
  }

  out[0] = st[2]; out[1] = st[3];
  out[2] = (Fx + Ax) / m;
  out[3] = (Fy + Ay) / m - VEH.g;
  out[4] = st[5];
  out[5] = tau / J;
  out[6] = burning ? -VEH.mdot : 0;
}

/* RK4 缓冲复用（两枚火箭顺序推进，共用即可，不做每子步分配） */
const KA = [0,0,0,0,0,0,0], KB = [0,0,0,0,0,0,0], KC = [0,0,0,0,0,0,0],
      KD = [0,0,0,0,0,0,0], KT = [0,0,0,0,0,0,0];
function rk4(V, h, ts) {
  const st = V.st, d = V.dAct;
  deriv(st, d, ts, KA);
  for (let i = 0; i < 7; i++) KT[i] = st[i] + 0.5 * h * KA[i];
  deriv(KT, d, ts + 0.5 * h, KB);
  for (let i = 0; i < 7; i++) KT[i] = st[i] + 0.5 * h * KB[i];
  deriv(KT, d, ts + 0.5 * h, KC);
  for (let i = 0; i < 7; i++) KT[i] = st[i] + h * KC[i];
  deriv(KT, d, ts + h, KD);
  for (let i = 0; i < 7; i++) st[i] += h / 6 * (KA[i] + 2 * KB[i] + 2 * KC[i] + KD[i]);
}

/* ---------- 线性化：等效控制增益 b(t) 与气动右半平面极点 ---------- */
/*   θ̈ = a(t)·θ − b(t)·δ ，  b = T·ℓ/J（本工具的心脏），
     a = q·A·Cnα·(c_p − c)/J  ⇒ 开环极点 s = ±√a （右半平面那个就是「必倒」） */
function plantOf(V) {
  const fuel = V.st[6] > 0 ? V.st[6] : 0;
  const c = comOf(fuel), J = inertiaOf(fuel, c);
  const b = (fuel > 0 ? state.thrust : 0) * c / J;
  const w = windAt(SIM.k * H_STEP, V.st[1]);
  const rvx = V.st[2] - w, rvy = V.st[3];
  const Vm = Math.sqrt(rvx * rvx + rvy * rvy);
  let a = 0, q = 0;
  if (Vm > 1) {
    const rho = VEH.rho0 * Math.exp(-(V.st[1] > 0 ? V.st[1] : 0) / VEH.Hs);
    q = 0.5 * rho * Vm * Vm;
    a = q * VEH.Aref * VEH.Cna * state.cpShift / J;
  }
  return { c: c, J: J, b: b, a: a, q: q, m: VEH.mDry + fuel };
}

/* 增益调度：钉住的是**闭环**，不是开环增益。
   定增益 = 你在发射台上调的那三个数，一路不动。
   调度   = 每一刻按当前的 b(t) = T·ℓ/J 与 a(t) 反解出该用的增益，使
            b·Kp − a = ωn²、b·Kd = 2ζωn，于是 ωn 与 ζ 全程不变。
   ωn 不能只取起飞值：气动右半平面极点 p = √a 会随动压长大，而**带一个
   +p 极点的回路，闭环带宽必须显著高过 p 才可能稳**（这条是硬约束，不是
   调参手感）。所以令 ωn ≥ KBW·√a —— 调度器于是同时追着「增益变了」和
   「不稳定性变强了」两件事。追不上时是作动器的带宽先到顶，那时读数区
   会看到相位裕度自己塌下去：**这是真的做不到，不是没调好**。 */
const KBW = 3;
function gainsOf(V, P) {
  if (!V.sched) return [state.kp, state.kd, state.ki];
  const bb = P.b > 1e-3 ? P.b : 1e-3;
  /* 但调度器**不去要它要不到的带宽**：作动器一阶极点 1/τa 与采样率各给一条
     上限（工程惯例：闭环带宽不超过作动器极点的 1/3、采样角频率的 1/12）。
     越过这两条线，多出来的增益只会把 ω_c 顶到相位已经烂掉的频段上，喷管
     还追不上 —— 那不是「调度得更好」，那是另一种坠毁。 */
  const wnCap = Math.min(1 / (3 * VEH.tauAct), TAU * state.fs / 12);
  const wn0 = Math.sqrt(SIM.wn2);
  const wn = Math.max(wn0, Math.min(wnCap, KBW * Math.sqrt(P.a > 0 ? P.a : 0)));
  return [(wn * wn + P.a) / bb, 2 * SIM.zeta * wn / bb, SIM.ki0 / bb];
}

/* ---------- 频域裕度（每 DIAG_EVERY 个子步算一次，纯 k 的函数） ---------- */
/*   L(jω) = b·C(jω) / ((jω)² − a) · e^{−jωτ} / (1 + jωτa)
     C(jω) = Kp + Ki/(jω) + Kd·jω
   注意：被控对象带一个右半平面极点时，正的相位裕度**不是**稳定的充分条件
   —— 它只管住「延迟侧」那条边界。另一条边界是权限比 b·Kp/a：低于 1，
   控制权限就压不住气动不稳定。两条边界都常驻页签③ 与读数区。 */
function margins(b, a, kp, kd, ki, tz, ta) {
  const out = { pm: 0, gm: 0, wc: 0, dZoh: 0, dAct: 0, ok: false };
  if (!(b > 1e-6)) return out;
  const N = 140, l0 = Math.log(0.05), l1 = Math.log(400);
  let pMag = 0, pW = 0, wc = -1, firstMag = 0;
  const magAt = w => {
    let den = -w * w - a;
    const fl = 1e-3 * (w * w + Math.abs(a) + 1);
    if (Math.abs(den) < fl) den = den < 0 ? -fl : fl;
    const cIm = kd * w - ki / w;
    return b * Math.sqrt(kp * kp + cIm * cIm) / Math.abs(den) / Math.sqrt(1 + w * w * ta * ta);
  };
  const phAt = w => {
    const den = -w * w - a;
    const cIm = kd * w - ki / w;
    return Math.atan2(cIm, kp) * DEG - (den < 0 ? 180 : 0) - w * tz * DEG - Math.atan(w * ta) * DEG;
  };
  for (let i = 0; i < N; i++) {
    const w = Math.exp(l0 + (l1 - l0) * i / (N - 1));
    const mg = magAt(w);
    if (i === 0) firstMag = mg;
    if (i > 0 && pMag >= 1 && mg < 1) {
      const f = (Math.log(pMag) - 0) / (Math.log(pMag) - Math.log(mg));
      wc = Math.exp(Math.log(pW) + f * (Math.log(w) - Math.log(pW)));
      break;
    }
    pMag = mg; pW = w;
  }
  if (wc < 0) {
    /* 找不到穿越点有两种完全相反的含义，不能一并当作「裕度充足」：
       ① 全频段 |L| < 1 且被控对象带右半平面极点 ⇒ 增益根本压不住那个极点，
          这是**低增益侧**的边界，裕度应当报 0（页签③ 的曲线因此贴在死亡线上）；
       ② 其余情形（气动稳定、|L| 始终不够大）没有失稳风险，报满值。 */
    const lowSide = firstMag < 1 && a > 1e-6;
    out.pm = lowSide ? 0 : 90;
    out.gm = lowSide ? 0 : 40;
    out.wc = 0; out.ok = true;
    return out;
  }
  out.wc = wc;
  out.pm = 180 + phAt(wc);
  while (out.pm > 180) out.pm -= 360;
  while (out.pm <= -180) out.pm += 360;
  /* 归因：ZOH 纯延迟在穿越频率处吃掉的相位是精确的 ω_c·τ；作动器一阶滞后
     取同一 ω_c 处的 atan(ω_cτa)（一阶近似 —— 去掉它 |L| 会略变，穿越频率
     也会略移，这一项只用于比大小，不当精确值用）。 */
  out.dZoh = wc * tz * DEG;
  out.dAct = Math.atan(wc * ta) * DEG;
  /* 增益裕度：ω_c 之后第一次相位穿 −180° */
  let pPh = phAt(wc), pw2 = wc, gm = 40;
  for (let i = 0; i < N; i++) {
    const w = wc * Math.exp(i / (N - 1) * Math.log(400 / wc));
    const ph = phAt(w);
    if (i > 0 && pPh > -180 && ph <= -180) {
      const f = (pPh + 180) / (pPh - ph);
      const ww = Math.exp(Math.log(pw2) + f * (Math.log(w) - Math.log(pw2)));
      gm = -20 * Math.log10(Math.max(1e-9, magAt(ww)));
      break;
    }
    pPh = ph; pw2 = w;
  }
  out.gm = Math.min(40, gm);
  out.ok = true;
  return out;
}

/* ---------- 一枚火箭 ---------- */
function newVeh(sched) {
  return {
    sched: sched ? 1 : 0,
    st: [0, 0, 0, 0, 0, 0, 0],
    dAct: 0, dCmd: 0, uRaw: 0, iTerm: 0, rateLim: 0,
    kpEff: 0,
    lifted: 0, alive: 1, endCode: 0, endT: -1,
    b: 0, aTh: 0, pm: 90, gm: 40, wc: 0, dZoh: 0, dAtt: 0, auth: 99, am: 1,
    /* —— 诊断累加器（都是路径相关量，必须进存档，不能事后重算） —— */
    satT: 0, rateT: 0, sepMax: 0,
    satEma: 0, rateEma: 0, satEmaMax: 0, rateEmaMax: 0, oscD: 0, oscDSign: 0,
    pm0: -1, pmMin: 999, pmMinT: 0, pmZeroT: -1, dZohBad: 0, dActBad: 0, wcBad: 0,
    authMin: 999, authMinT: 0, authZeroT: -1,
    iPeak: 0, iSatT: 0,
    oscN: 0, oscAmp: 0, oscSign: 0,
    b0: 0, bEnd: 0
  };
}

const SIM = {
  VF: newVeh(false),        // 定增益
  VS: newVeh(true),         // 调度增益
  k: 0,                     // 子步计数 —— 模拟时刻恒为 k·h，绝不累加浮点
  acc: 0,                   // 帧内不足一个子步的余量
  ctrlEvery: 50,            // 控制采样周期（子步数）
  wn2: 1, twz: 1, ki0: 0, zeta: 0.7,   // 调度基准（起飞时刻的闭环系数与阻尼比）
  launch: 0,                // 发射次数 = §11.3 的「轮次」
  holdT: -1,                // 结局停留倒计时（模拟秒）
  sig: null
};

function activeVeh() { return state.schedOn ? SIM.VS : SIM.VF; }

/* 种子签名：任何一项变了就是「用户要求再发射一次」（显式、由用户发起）。
   zoomT 是纯显示量，故意不在里面。 */
function seedSig() {
  return [state.kp, state.kd, state.ki, state.fs, state.dmax, state.drate,
          state.wind, state.gust, Math.round(state.wseed), state.thrust,
          state.fuel0, state.comShift, state.cpShift, state.antiWind ? 1 : 0]
         .map(v => (+v).toPrecision(10)).join('|');
}

function startLaunch() {
  buildGust(Math.round(state.wseed));
  SIM.k = 0; SIM.acc = 0; SIM.holdT = -1;
  SIM.ctrlEvery = Math.max(1, Math.round((1 / state.fs) / H_STEP));
  const f0 = state.fuel0;
  [SIM.VF, SIM.VS].forEach(V => {
    const fresh = newVeh(V.sched);
    Object.keys(fresh).forEach(kk => { V[kk] = fresh[kk]; });
    V.st = [0, 0, 0, 0, 0, 0, f0];
  });
  /* 调度基准取起飞时刻（q ≈ 0）的被控对象 */
  const P0 = plantOf(SIM.VF);
  SIM.wn2 = Math.max(0.05, state.kp * P0.b - P0.a);
  SIM.twz = state.kd * P0.b;
  SIM.ki0 = state.ki * P0.b;
  SIM.zeta = SIM.twz / (2 * Math.sqrt(SIM.wn2));
  SIM.VF.b0 = SIM.VS.b0 = P0.b;
  SIM.VF.bEnd = SIM.VS.bEnd = P0.b;
  SIM.VF.b = SIM.VS.b = P0.b;
  SIM.launch++;
  SIM.sig = seedSig();
  samples.length = 0;
}

/* ---------- 离散控制器（零阶保持，采样率 fs） ---------- */
function controlUpdate(V) {
  const P = plantOf(V);
  const g = gainsOf(V, P);
  const Ts = 1 / state.fs;
  const e = V.st[4];                       // θ_ref = 0：把箭立直
  V.iTerm += g[2] * e * Ts;
  const u = g[0] * e + g[1] * V.st[5] + V.iTerm;
  const dm = state.dmax;
  const sat = u > dm ? dm : (u < -dm ? -dm : u);
  /* 抗积分饱和（反算式）。关掉它 + 持续侧风 = 死因④「积分饱和」 */
  if (state.antiWind && u !== sat) V.iTerm -= (u - sat);
  V.uRaw = u; V.dCmd = sat;
  V.kpEff = g[0];
}

/* ---------- 作动器：一阶跟随 + 速率限幅 + 位置限幅 ---------- */
function actuatorStep(V) {
  let rate = (V.dCmd - V.dAct) / VEH.tauAct;
  const rm = state.drate;
  V.rateLim = 0;
  if (rate > rm) { rate = rm; V.rateLim = 1; }
  else if (rate < -rm) { rate = -rm; V.rateLim = 1; }
  V.dAct += rate * H_STEP;
  if (V.dAct > state.dmax) V.dAct = state.dmax;
  else if (V.dAct < -state.dmax) V.dAct = -state.dmax;
}

function endVeh(V, code, ts) {
  if (!V.alive) return;
  V.alive = 0; V.endCode = code; V.endT = ts;
  V.bEnd = V.b;
}

function stepVeh(V, ts, doCtrl) {
  if (!V.alive) return;
  if (doCtrl) controlUpdate(V);
  actuatorStep(V);
  if (!V.lifted) {
    const m = VEH.mDry + Math.max(0, V.st[6]);
    const T = V.st[6] > 0 ? state.thrust : 0;
    if (T > m * VEH.g) V.lifted = 1;
  }
  rk4(V, H_STEP, ts);
  if (V.st[6] < 0) V.st[6] = 0;
  if (!V.lifted) { for (let i = 0; i < 6; i++) V.st[i] = 0; }

  /* 逐子步统计的路径量（不能只在诊断刻度上采，快速穿越会漏）。
     除了全程占空，还要一份**窗口化**占空（4 s 时间常数的指数滑动平均）：
     一次 46 秒的飞行只在最后两秒把喷管顶死，全程占空只有 4%，看上去像
     没饱和过 —— 而实际上那两秒正是它死掉的原因。诊断要看临死那一段。 */
  const satNow = Math.abs(V.uRaw) >= state.dmax ? 1 : 0;
  if (satNow) V.satT += H_STEP;
  if (V.rateLim) V.rateT += H_STEP;
  const kEma = H_STEP / 4;
  V.satEma += (satNow - V.satEma) * kEma;
  V.rateEma += (V.rateLim - V.rateEma) * kEma;
  if (V.satEma > V.satEmaMax) V.satEmaMax = V.satEma;
  if (V.rateEma > V.rateEmaMax) V.rateEmaMax = V.rateEma;
  /* 饱和极限环的招牌是**喷管在两侧限幅之间来回撞**，不是 θ 穿零 ——
     发散时 θ 可以一路不换号，δ 却一直在砰砰砰。 */
  const dS = V.dCmd > 0.5 * state.dmax ? 1 : (V.dCmd < -0.5 * state.dmax ? -1 : 0);
  if (dS !== 0) {
    if (V.oscDSign !== 0 && dS !== V.oscDSign) V.oscD++;
    V.oscDSign = dS;
  }
  const sep = Math.abs(V.dCmd - V.dAct);
  if (sep > V.sepMax) V.sepMax = sep;
  const ath = Math.abs(V.st[4]);
  /* 积分项峰值只在姿态还正常时统计：翻滚之后 P 项本身就是几十弧度，
     反算式退饱和会把 I 项拽到同一量级，那不是积分饱和，是坠毁的余波。 */
  if (ath < TH_OK) {
    const ai = Math.abs(V.iTerm) / state.dmax;
    if (ai > V.iPeak) V.iPeak = ai;
    if (ai > 0.9) V.iSatT += H_STEP;
  }

  const te = ts + H_STEP;
  if (ath > TH_KILL) endVeh(V, 1, te);
  else if (V.lifted && V.st[1] <= 0) endVeh(V, 2, te);
  else if (V.st[6] <= 0) endVeh(V, ath < TH_OK ? 0 : 3, te);
  else if (te > T_MAX) endVeh(V, 4, te);
}

/* 诊断刻度：裕度、权限比、极限环计数。50 Hz，纯 k 的函数。 */
function diagTick(V, ts) {
  if (!V.alive) return;
  const P = plantOf(V);
  const g = gainsOf(V, P);
  const M = margins(P.b, P.a, g[0], g[1], g[2], 0.5 / state.fs, VEH.tauAct);
  V.b = P.b; V.aTh = P.a; V.bEnd = P.b;
  V.pm = M.pm; V.gm = M.gm; V.wc = M.wc; V.dZoh = M.dZoh; V.dAtt = M.dAct;
  V.auth = P.a > 1e-6 ? P.b * g[0] / P.a : 99;
  const use = Math.max(Math.abs(V.dCmd) / state.dmax,
                       Math.abs(V.dCmd - V.dAct) / VEH.tauAct / state.drate);
  V.am = Math.max(0, 1 - Math.min(1.5, use));

  if (V.pm0 < 0 && ts > 1.5) V.pm0 = V.pm;
  if (V.pm < V.pmMin) {
    V.pmMin = V.pm; V.pmMinT = ts;
    V.dZohBad = V.dZoh; V.dActBad = V.dAtt; V.wcBad = V.wc;
  }
  if (V.pmZeroT < 0 && V.pm <= 0 && ts > 1.0) V.pmZeroT = ts;
  if (V.auth < V.authMin) { V.authMin = V.auth; V.authMinT = ts; }
  if (V.authZeroT < 0 && V.auth <= 1 && ts > 1.0) V.authZeroT = ts;

  /* 极限环：θ 的穿零次数 + 指数衰减的峰值（一个数就够，可进存档） */
  const th = V.st[4];
  const s = th > 0.02 ? 1 : (th < -0.02 ? -1 : 0);
  if (s !== 0) {
    if (V.oscSign !== 0 && s !== V.oscSign) V.oscN++;
    V.oscSign = s;
  }
  const dec = Math.exp(-DIAG_EVERY * H_STEP / 6);
  /* 只在姿态还没翻掉时更新：翻滚过程中的 60° 不是极限环幅值，是坠毁本身 */
  if (Math.abs(th) < 45 * RAD) V.oscAmp = Math.max(Math.abs(th), V.oscAmp * dec);
}

/* ---------- 每帧推进：把 dt 切成整数个 h，模拟时刻 = k·h ---------- */
/* 余量 SIM.acc 让模拟时钟长期跟住墙钟而不系统性超前；子步序列因此是
   「调用序列」的确定性函数 —— 录制态下每次都是 simAdvance(REC_DT)，
   于是同一颗种子两次发射逐位一致，§11.2 的本机重算才成立。 */
function stepSim(dt) {
  SIM.acc += dt;
  let n = Math.floor(SIM.acc / H_STEP);
  if (n > MAX_SUB) { n = MAX_SUB; SIM.acc = 0; } else { SIM.acc -= n * H_STEP; }
  for (let i = 0; i < n; i++) {
    const ts = SIM.k * H_STEP;
    const doCtrl = (SIM.k % SIM.ctrlEvery) === 0;
    stepVeh(SIM.VF, ts, doCtrl);
    stepVeh(SIM.VS, ts, doCtrl);
    if ((SIM.k % DIAG_EVERY) === 0) { diagTick(SIM.VF, ts); diagTick(SIM.VS, ts); }
    SIM.k++;
    /* 两枚都落幕 ⇒ 停留 HOLD_SEC 秒让人读完诊断，然后自动再发射一次。
       同一颗种子 ⇒ 同一次飞行，于是这个页签是循环的，不会「一次性演进后
       永久定格」（规范 §8 出路①）。 */
    if (!SIM.VF.alive && !SIM.VS.alive) {
      if (SIM.holdT < 0) SIM.holdT = HOLD_SEC;
      else {
        SIM.holdT -= H_STEP;
        if (SIM.holdT <= 0) { startLaunch(); return; }
      }
    }
  }
}

/* ---------- 死因诊断（设计文档 §3.3 的优先级表） ---------- */
/* 每一次坠毁都必须可诊断 —— 诊断不出来是工具的 bug，不是模拟的特性。 */
function pct(x) { return (100 * x).toFixed(0) + '%'; }
function diagnose(V) {
  const T = V.endT > 0 ? V.endT : SIM.k * H_STEP;
  const fs = state.fs, tz = 500 / fs;                  // ZOH 等效延迟 ms
  const satD = V.satT / Math.max(0.5, T);
  const rateD = V.rateT / Math.max(0.5, T);
  /* 临死那一段的占空（EMA 峰值），与全程占空并列在证据里 */
  const satW = V.satEmaMax, rateW = V.rateEmaMax;
  const bR = V.b0 > 1e-6 ? V.bEnd / V.b0 : 1;
  const pm0 = V.pm0 < 0 ? V.pm : V.pm0;
  const badT = V.pmZeroT >= 0 ? V.pmZeroT : V.pmMinT;
  const cand = [];

  /* ① 采样过慢：相位裕度归零，且零阶保持延迟是裕度**损失**的主因。
     「主因」这三个字要当真：起飞时裕度就已经很薄（pm0 ≤ 25°），说明采样率
     从第一秒起就是那个绑手绑脚的约束；若起飞时裕度充足、是后来被 T·ℓ/J 的
     漂移吃掉的，那主因是③ 而不是①，哪怕吃掉它的确实是零阶保持的相位。 */
  const zeroed = V.pmZeroT >= 0;
  const zeroTxt = zeroed
    ? { zh: '相位裕度在 t = ' + badT.toFixed(1) + ' s 归零', en: 'phase margin hit zero at t = ' + badT.toFixed(1) + ' s' }
    : { zh: '相位裕度在 t = ' + badT.toFixed(1) + ' s 跌到最低 ' + V.pmMin.toFixed(0) + '°',
        en: 'phase margin bottomed out at ' + V.pmMin.toFixed(0) + '\u00b0 at t = ' + badT.toFixed(1) + ' s' };
  cand.push({
    ok: zeroed && V.dZohBad >= 15 && V.dZohBad >= V.dActBad && (pm0 <= 25 || Math.abs(bR - 1) < 0.35),
    score: V.dZohBad / 15,
    name: { zh: '采样过慢', en: 'Sampling too slow' },
    ev: {
      zh: '采样率 ' + fs.toFixed(0) + ' Hz ⇒ 零阶保持等效延迟 ' + tz.toFixed(0) +
          ' ms ⇒ 在穿越频率 ω_c = ' + V.wcBad.toFixed(1) + ' rad/s 处吃掉 ' +
          V.dZohBad.toFixed(0) + '° 相位（作动器只占 ' + V.dActBad.toFixed(0) +
          '°）；' + zeroTxt.zh + '，起飞时还有 ' + pm0.toFixed(0) + '°',
      en: 'Sampling at ' + fs.toFixed(0) + ' Hz \u21d2 zero-order-hold delay ' + tz.toFixed(0) +
          ' ms \u21d2 at crossover \u03c9_c = ' + V.wcBad.toFixed(1) + ' rad/s it eats ' +
          V.dZohBad.toFixed(0) + '\u00b0 of phase (the actuator only ' + V.dActBad.toFixed(0) +
          '\u00b0); ' + zeroTxt.en + ', from ' + pm0.toFixed(0) + '\u00b0 at liftoff'
    }
  });

  /* ② 增益过高 + 饱和：出现极限环，且 δ 长期贴在 δmax */
  cand.push({
    ok: satW > 0.35 && V.oscD >= 6,
    score: satW / 0.35 * Math.min(2, V.oscD / 6),
    name: { zh: '增益过高 + 饱和', en: 'Gain too high + saturation' },
    ev: {
      zh: '喷管在两侧限幅 ±' + (state.dmax * DEG).toFixed(1) + '° 之间来回撞了 ' + V.oscD +
          ' 次（峰值窗口占空 ' + pct(satW) + '，全程 ' + pct(satD) + '），θ 极限环幅值 ' +
          (V.oscAmp * DEG).toFixed(1) + '° —— 饱和把回路等效增益截断，剩下的只有延迟：' +
          'K_p = ' + fmt(state.kp) + ' 在小信号下是对的，一旦顶死就不再是你调的那个增益',
      en: 'The nozzle slammed between the ±' + (state.dmax * DEG).toFixed(1) + '° stops ' + V.oscD +
          ' times (peak windowed duty ' + pct(satW) + ', ' + pct(satD) + ' over the whole flight), ' +
          'with a ' + (V.oscAmp * DEG).toFixed(1) + '\u00b0 limit cycle in \u03b8 \u2014 saturation clips the loop gain, ' +
          'leaving only the delay: K_p = ' + fmt(state.kp) + ' is the gain you tuned for small signals, not the one you get on the stops'
    }
  });

  /* ③ 增益调度缺失：起飞时裕度充足，随 T·ℓ/J 与 q 漂移在后段归零 */
  cand.push({
    ok: !V.sched && pm0 > 25 && Math.abs(bR - 1) > 0.35 &&
         (V.pmZeroT >= 0 || V.authZeroT >= 0 || V.authMin < 1.15),
    score: (!V.sched ? 1 : 0) * Math.max(V.authMin < 1.5 ? 1.5 / Math.max(0.2, V.authMin) : 0,
                                         V.pmZeroT >= 0 && pm0 > 25 ? 1.2 : 0),
    name: { zh: '增益调度缺失', en: 'No gain scheduling' },
    ev: {
      zh: '起飞时相位裕度 ' + pm0.toFixed(0) + '°、等效增益 T·ℓ/J = ' + V.b0.toFixed(1) +
          ' s⁻²；到 t = ' + (V.authZeroT >= 0 ? V.authZeroT.toFixed(1) : V.authMinT.toFixed(1)) +
          ' s 它已漂到 ' + V.bEnd.toFixed(1) + ' s⁻²（×' + bR.toFixed(2) +
          '），而最大动压把气动极点推到 +' + Math.sqrt(Math.max(0, V.aTh)).toFixed(2) +
          ' rad/s，权限比 b·Kp/a 跌到 ' + V.authMin.toFixed(2) +
          ' —— 你在发射台上调的那一组参数，只在飞行的前一段是对的',
      en: 'At liftoff the phase margin was ' + pm0.toFixed(0) + '° and T·ℓ/J = ' + V.b0.toFixed(1) +
          ' s⁻²; by t = ' + (V.authZeroT >= 0 ? V.authZeroT.toFixed(1) : V.authMinT.toFixed(1)) +
          ' s it had drifted to ' + V.bEnd.toFixed(1) + ' s⁻² (×' + bR.toFixed(2) +
          '), while max-q pushed the aerodynamic pole to +' + Math.sqrt(Math.max(0, V.aTh)).toFixed(2) +
          ' rad/s and the authority ratio b·Kp/a fell to ' + V.authMin.toFixed(2) +
          ' — the gains you tuned on the pad were only right for one stretch of the flight'
    }
  });

  /* ④ 积分饱和：持续风下 I 项发散、退饱和滞后导致过冲 */
  cand.push({
    ok: !state.antiWind && V.iPeak > 0.85 && V.iSatT > 1.0,
    score: (!state.antiWind ? 1 : 0) * V.iPeak / 0.85,
    name: { zh: '积分饱和', en: 'Integrator windup' },
    ev: {
      zh: '抗积分饱和已关闭：' + state.wind.toFixed(0) +
          ' m/s 的侧风随高度切变（箭一直在钻进新的风层，扰动不会自己消失），' +
          'I 项峰值达到 ' + V.iPeak.toFixed(2) + '×δmax，' + V.iSatT.toFixed(1) +
          ' s 处于饱和区；误差反号后 I 项还得先「放完气」，纠正因此迟到，δ 已无余量',
      en: 'Anti-windup is off: the ' + state.wind.toFixed(0) +
          ' m/s crosswind shears with altitude (the vehicle keeps climbing into fresh air, so the ' +
          'disturbance never goes away), the I term peaked at ' + V.iPeak.toFixed(2) + '\u00d7\u03b4max and spent ' +
          V.iSatT.toFixed(1) + ' s saturated; once the error reversed the integrator had to unwind first, ' +
          'so the correction arrived late with no authority left'
    }
  });

  /* ⑤ 作动器太慢：速率限幅是限制项，δ_cmd 与 δ_actual 长期分离 */
  cand.push({
    ok: rateW > 0.30 && V.sepMax > 0.35 * state.dmax,
    score: rateW / 0.30,
    name: { zh: '作动器太慢', en: 'Actuator too slow' },
    ev: {
      zh: '喷管限速 ' + (state.drate * DEG).toFixed(0) + '°/s：临死那一段有 ' + pct(rateW) +
          ' 的时间卡在限速段（全程 ' + pct(rateD) + '），δ_cmd 与 δ_actual 最大分离 ' +
          (V.sepMax * DEG).toFixed(1) + '°（= 限幅量程的 ' + pct(V.sepMax / state.dmax) +
          '）—— 指令算得再对也送不到喷管，限制项是作动器而不是控制律',
      en: 'Nozzle rate limit ' + (state.drate * DEG).toFixed(0) + '\u00b0/s: rate-limited ' + pct(rateW) +
          ' of the time near the end (' + pct(rateD) + ' over the whole flight), with \u03b4_cmd and \u03b4_actual ' +
          'separating by up to ' + (V.sepMax * DEG).toFixed(1) + '\u00b0 (' + pct(V.sepMax / state.dmax) +
          ' of full travel) \u2014 a correct command that never reaches the nozzle: the binding constraint is the actuator, not the control law'
    }
  });

  for (const c of cand) if (c.ok) return c;
  /* 兜底：没有哪一条过阈值，就报得分最高的那条主导因素 —— 绝不说「不知道」 */
  let best = cand[0];
  for (const c of cand) if (c.score > best.score) best = c;
  return {
    ok: false, name: best.name, ev: best.ev,
    weak: { zh: '（未达判据阈值，以下为主导因素）', en: '(below the decision threshold; dominant factor follows)' }
  };
}

/* ============================================================
   场景级绘制部件（引擎部件不够用时在这里补，绝不改引擎）
   ============================================================ */
const AX = 'rgba(159,176,200,0.9)';
const AX_DIM = 'rgba(159,176,200,0.5)';
const C_ROSE = '#fb7185', C_VIOLET = '#a78bfa', C_EMERALD = '#34d399',
      C_ORANGE = '#fb923c', C_AMBER = '#fbbf24', C_CYAN = '#2dd4ea', C_WHITE = '#e2e8f0';

/* 一根带箭头与字母的轴 */
function axis1(C, a, b, lab, lp) {
  line3(C, a, b, { width: 1.4, color: AX });
  arrowAt(C, b, [a[0] + (b[0]-a[0])*0.92, a[1] + (b[1]-a[1])*0.92, a[2] + (b[2]-a[2])*0.92], AX);
  label3(C, lp, lab, { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
}

/* 时间轴（沿 +z）与秒刻度；yb = 轴所在高度 */
function timeAxis(C, yb) {
  const v = state.zoomT;
  line3(C, [0, yb, 0], [0, yb, WAVE_LEN + 0.5], { width: 1.4, color: AX });
  arrowAt(C, [0, yb, WAVE_LEN + 0.5], [0, yb, WAVE_LEN + 0.3], AX);
  label3(C, [0, yb, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const every = v < 0.35 ? 5 : (v < 0.8 ? 2 : 1);
  for (let k = 1; k * v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, yb - 0.05, k*v], [0, yb + 0.05, k*v], { width: 1.2, color: AX_DIM });
    if (k % every === 0) label3(C, [0, yb - 0.22, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
}

/* 沿时间轴的一条水平参考线（虚线语义见 §4.2） */
function refLine(C, y, dash, col) {
  line3(C, [0, y, 0], [0, y, WAVE_LEN], { width: 1, dash: dash, color: col });
}

/* 沿 t 的网格 */
function timeGrid(C, yb, half) {
  const v = state.zoomT;
  for (let i = -2; i <= 2; i++) {
    if (i === 0) continue;
    line3(C, [0, yb + i*half/2, 0], [0, yb + i*half/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.06)' });
  }
  const every = v < 0.35 ? 5 : 1;
  for (let k = every; k * v <= WAVE_LEN + 1e-6; k += every) {
    line3(C, [0, yb - half, k*v], [0, yb + half, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 历史曲线取样：抽稀到 ≤ 900 点，避免长航时把 draw() 拖垮 */
function strideOf() { return Math.max(1, Math.ceil(samples.length / 900)); }
function nowTs() { return samples.length ? samples[samples.length-1].ts : 0; }

/* 自动量程（示波器那一套）。默认配置下姿态误差只有零点几度，若把量程写死
   成 ±30°，θ 与 δ 两条曲线就都贴在基线上 —— 教学载荷（阶梯、限幅段）根本
   看不见。取窗口内峰值、按 1-2-5 档位量化，量程于是只跳档、不逐帧抖动。
   读数区给的始终是精确值，量程只影响画面高度。 */
function niceStep(v) {
  if (!(v > 0) || !isFinite(v)) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  const m = v / e;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
}
function autoScale(sel, floorV, capV) {
  let mx = 0;
  const st = strideOf();
  for (let i = samples.length - 1; i >= 0; i -= st) {
    const v = Math.abs(sel(samples[i]));
    if (isFinite(v) && v > mx) mx = v;
  }
  const q = niceStep(mx * 1.3);
  return Math.min(capV, Math.max(floorV, q));
}

/* 普通折线：sel 返回世界 y，越界裁剪 */
function tracePts(sel, lo, hi) {
  const pts = [], st = strideOf(), n0 = nowTs();
  for (let i = samples.length - 1; i >= 0; i -= st) {
    const s = samples[i];
    let y = sel(s);
    if (!isFinite(y)) { pts.push(null); continue; }
    if (y < lo) y = lo; else if (y > hi) y = hi;
    pts.push([0, y, (n0 - s.ts) * state.zoomT]);
  }
  return pts;
}

/* 零阶保持阶梯：由新到旧走，每格先竖着跳到本格的保持值，再横着走完这一格。
   于是台阶的立边是真的立边，而不是被采样点连成的斜坡 —— fs 一低，台阶
   就肉眼可见地变粗。方向与 tracePts 一致（头亮尾隐）。 */
function stairPts(sel, lo, hi) {
  const pts = [], st = strideOf(), n0 = nowTs();
  let pz = null;
  for (let i = samples.length - 1; i >= 0; i -= st) {
    const s = samples[i];
    let y = sel(s);
    if (!isFinite(y)) { pz = null; pts.push(null); continue; }
    if (y < lo) y = lo; else if (y > hi) y = hi;
    const z = (n0 - s.ts) * state.zoomT;
    if (pz !== null) pts.push([0, y, pz]);
    pts.push([0, y, z]);
    pz = z;
  }
  return pts;
}

/* 分段高亮：只画满足 flag 的那些段（饱和段 / 限速段各一色） */
function flagSegs(C, sel, flag, lo, hi, col, w) {
  const st = strideOf(), n0 = nowTs();
  let run = [];
  for (let i = 0; i < samples.length; i += st) {
    const s = samples[i];
    if (flag(s)) {
      let y = sel(s);
      if (y < lo) y = lo; else if (y > hi) y = hi;
      run.push([0, y, (n0 - s.ts) * state.zoomT]);
    } else if (run.length) {
      if (run.length > 1) strokePoly(C, run, { width: w, color: col });
      run = [];
    }
  }
  if (run.length > 1) strokePoly(C, run, { width: w, color: col });
}

/* 一条历史曲线的标准双描（外辉光 + 头亮尾隐的内核） */
function trace(C, pts, rgb) {
  if (pts.length < 2) return;
  strokePoly(C, pts, { width: 5.5, color: 'rgba(' + rgb + ',0.13)' });
  strokePoly(C, pts, { width: 2.2, fade: ['rgba(' + rgb + ',1)', 'rgba(' + rgb + ',0.04)'] });
}
const RGB = { rose: '251,113,133', violet: '167,139,250', emerald: '52,211,153',
              orange: '251,146,60', amber: '251,191,36', cyan: '45,212,234', white: '226,232,240' };

/* ---------- 火箭示意图（示意，不是比例图） ---------- */
const BODY_0 = 3.4;
function rocketGlyph(C, V, ox, sc) {
  const BODY = BODY_0 * (sc || 1);
  const fuel = V.st[6], c = comOf(fuel), th = V.st[4];
  const f = c / VEH.L;
  const ux = -Math.sin(th), uy = Math.cos(th);      // 箭体「向上」单位向量
  const cm = [ox, 0, 0];
  const tail = [ox - ux*BODY*f, -uy*BODY*f, 0];
  const nose = [ox + ux*BODY*(1-f), uy*BODY*(1-f), 0];

  /* 竖直参考（θ 是相对它量的） */
  line3(C, [ox, -BODY*f, 0], [ox, BODY*0.9, 0], { width: 1.3, dash: [6,6], color: 'rgba(159,176,200,0.30)' });

  /* 箭体：青 = 源几何。重心永远画在原点，燃料排空时箭体就从它身上滑过去 */
  strokePoly(C, [tail, nose], { width: 8, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, [tail, nose], { width: 3, color: V.alive ? 'rgba(45,212,234,0.95)' : 'rgba(159,176,200,0.55)' });
  solidDot(C, nose, 3.2, V.alive ? 'rgba(45,212,234,0.95)' : 'rgba(159,176,200,0.6)');

  /* 燃料柱：随燃料排空而缩短，重心因此一路迁移 —— 本工具的心脏 */
  const cf = fuelComOf(), frac = state.fuel0 > 0 ? Math.max(0, fuel / state.fuel0) : 0;
  const halfF = VEH.Lf * frac / 2;
  const s0 = (cf - halfF - c) * BODY / VEH.L, s1 = (cf + halfF - c) * BODY / VEH.L;
  if (frac > 0.002) {
    strokePoly(C, [[ox + ux*s0, uy*s0, 0], [ox + ux*s1, uy*s1, 0]],
      { width: 6, color: 'rgba(45,212,234,0.22)' });
  }

  /* 喷管与羽流：偏转 δ_actual；限幅 → 橙，限速 → 白 */
  const sat = Math.abs(V.uRaw) >= state.dmax;
  /* 限幅 → 橙、限速 → 白、正常 → 青（六处同源里「限幅段/限速段」的第一处） */
  const prgb = !V.alive ? '159,176,200' : (sat ? RGB.orange : (V.rateLim ? RGB.white : RGB.cyan));
  const dd = th + V.dAct;
  const plen = V.st[6] > 0 && V.alive ? 0.5 + 0.9 * (state.thrust / 420000) : 0;
  const pex = [tail[0] + Math.sin(dd)*plen, tail[1] - Math.cos(dd)*plen, 0];
  if (plen > 0) {
    strokePoly(C, [tail, pex], { width: 8, color: 'rgba(' + prgb + ',0.16)' });
    strokePoly(C, [tail, pex], { width: 2.4, fade: ['rgba(' + prgb + ',0.95)', 'rgba(' + prgb + ',0.06)'] });
    arrowAt(C, pex, tail, 'rgba(' + prgb + ',0.9)');
  }

  /* δ 弧（琥珀 = 度量注记） */
  if (state.showCg && Math.abs(V.dAct) > 0.004 && plen > 0) {
    const ap = [];
    const n = Math.max(2, Math.ceil(Math.abs(V.dAct)/0.05));
    for (let i = 0; i <= n; i++) {
      const a = th + V.dAct * i / n;
      ap.push([tail[0] + Math.sin(a)*plen*0.75, tail[1] - Math.cos(a)*plen*0.75, 0]);
    }
    strokePoly(C, ap, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
    label3(C, ap[Math.floor(n/2)], 'δ', { font: 'italic 13px ' + FONT_MATH, color: C_AMBER, align: 'center', dx: -12, dy: 6 });
  }

  /* θ 弧 */
  if (state.showCg && Math.abs(th) > 0.01) {
    const r0 = 0.9, ap = [];
    const n = Math.max(2, Math.ceil(Math.abs(th)/0.05));
    for (let i = 0; i <= n; i++) {
      const a = th * i / n;
      ap.push([ox - Math.sin(a)*r0, Math.cos(a)*r0, 0]);
    }
    strokePoly(C, ap, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
    label3(C, ap[Math.floor(n/2)], 'θ', { font: 'italic 13px ' + FONT_MATH, color: C_AMBER, align: 'center', dy: -12 });
  }

  /* 重心（白）与压心（琥珀）：ℓ(t) 是喷管到重心的力臂 */
  if (state.showCg) {
    const cpS = state.cpShift * BODY / VEH.L;
    const cp = [ox + ux*cpS, uy*cpS, 0];
    solidDot(C, cp, 3, 'rgba(251,191,36,0.95)');
    label3(C, cp, t({ zh: '压心', en: 'CoP' }), { size: 10, color: 'rgba(251,191,36,.85)', align: 'left', dx: 9, dy: -8 });
    line3(C, tail, cm, { width: 1.3, dash: [7,7], color: 'rgba(226,232,240,0.45)' });
    label3(C, [(tail[0]+cm[0])/2, (tail[1]+cm[1])/2, 0], 'ℓ(t)',
      { font: 'italic 11px ' + FONT_MATH, color: 'rgba(226,232,240,.8)', align: 'right', dx: -8 });
  }
  const scm = proj(C, cm);
  if (scm) glowDot(scm, 13 * (sc || 1), '#ffffff', 'rgba(186,240,255,0.9)');
  if (state.showCg) label3(C, cm, t({ zh: '重心', en: 'CoM' }), { size: 10, color: 'rgba(226,232,240,.8)', align: 'left', dx: 11, dy: 9 });
}

/* 风场箭头（次级骨架色）：长度 ∝ 当前风速 */
function windField(C, ts) {
  const w = windAt(ts, activeVeh().st[1]);
  const len = Math.max(-2.0, Math.min(2.0, w / 22));
  for (let i = -2; i <= 2; i++) {
    const y = i * 0.85;
    const x0 = -3.0;
    const a = [x0, y, 0], b = [x0 + len, y, 0];
    if (Math.abs(len) < 0.02) continue;
    line3(C, a, b, { width: 1.3, color: 'rgba(159,176,200,0.42)' });
    arrowAt(C, b, a, 'rgba(159,176,200,0.55)');
  }
  label3(C, [-3.0, 2.15, 0], t({ zh: '风 ', en: 'wind ' }) + fmtS(w, 1) + ' m/s',
    { size: 10.5, color: 'rgba(159,176,200,.75)', align: 'left' });
}

/* 读数区共用的抬头：t / 高度 / 姿态 / 燃料 / 等效增益 */

/* 页签④ 用：某一枚的一行诊断（只在它确实失败时才有） */

  const d = diagnose(V);
  return '<div class="dim">' + t(lead) + t(d.name) + ' — ' + t(d.ev) + '</div>';
}

  /* 金光闪（§4.7）：本页有意不加 —— 属「恒等式 / 结构事实」。
     这一页画的是「控制器是离散的：每 1/f_s 秒采一次、然后把值保持住」，
     δ_cmd 因此是一串台阶。这不是一个会在某一刻发生的事件，而是 controlUpdate()
     的调用节拍本身：每一帧都成立，把 f_s 从 40 Hz 拉到 2 Hz 只是把台阶加粗，
     没有哪一刻它「终于」变成阶梯。
     唯一像事件的是 δ_cmd 顶到 ±δmax，但那要么太稀、要么太密，且都不是本页的论点：
     实测（整趟飞行数「进入限幅」的次数）默认档 **0 次**（δmax = 8°，风 12 / 阵风 12
     根本顶不到）；风 60 / 阵风 50 时 1 次；把 δmax 压到 1° 则 6 次、平均 0.17 s

  signals: {
    label: { zh: '姿态与控制量', en: 'Attitude & command' },
    params: P_ALL,
    /* 在动的机制（§8 出路①）：同一台 RK4 积分器；本页签只换一种测量方式

    brand: { zh: '控制器是离散的：每 1/fs 秒采一次、然后把值保持住。δ_cmd 因此是一串台阶，不是一条曲线。台阶越粗，纠正到达得越晚——这就是纯延迟。',
             en: 'The controller is discrete: it samples every 1/fs seconds and then holds. δ_cmd is therefore a staircase, not a curve. The coarser the steps, the later every correction arrives — that is pure delay.' },
    tips: { zh: '提示：把采样率 fs 拉到 8 Hz 以下，再按「近观台阶」（它会把时间轴一并拉开）—— δ_cmd 的台阶肉眼可见地变粗，同时页签③ 的相位裕度整条往下掉。工具 A③ 讲的「力不是太大，是来得太晚」，在这里是你亲手撞的一堵墙。',
            en: 'Tip: drag the control rate below 8 Hz, then press "Zoom on the steps" (it stretches the time axis for you) — the steps of δ_cmd visibly coarsen while the phase margin on tab ③ sinks. The lesson of tool A③, "the force is not too large, it arrives too late", is a wall you walk into here yourself.' },

      near: { label: { zh: '近观台阶', en: 'Zoom on the steps' }, az: -Math.PI/2, el: 0.001, dist: 4.6, tx: 0, ty: -1.35, tz: 0.75,
              /* 联动：台阶要看得见，时间轴就得拉开 —— 40 秒压进 8 个世界单位时，

              onSelect() { setParam('zoomT', 1.0); } }
    },
    toggles: [
      { key: 'showTheta', label: { zh: '姿态 θ(t)', en: 'Attitude θ(t)' }, color: C_ROSE, checked: true },
      { key: 'showCmd',   label: { zh: 'δ 指令（阶梯）', en: 'δ command (staircase)' }, color: C_VIOLET, checked: true },
      { key: 'showAct',   label: { zh: 'δ 实际', en: 'δ actual' }, color: C_EMERALD, checked: true },
      { key: 'showSat',   label: { zh: '限幅段', en: 'Saturated segments' }, color: C_ORANGE, checked: true },
      { key: 'showRate',  label: { zh: '限速段', en: 'Rate-limited segments' }, color: C_WHITE, checked: true },
      { key: 'schedOn',   label: { zh: '增益调度', en: 'Gain scheduling' }, color: C_VIOLET, checked: false },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.zoomT + 0.5,
    draw(C) {
      const V = activeVeh(), sch = V.sched;
      const TH = 1.55, DL = -1.35, DS = 1.05;    // θ 带基线 / δ 带基线 / δ 带半高
      /* 两条带各自自动量程。δ 量程恰好在**开始饱和时**把 ±δmax 拉进画面：
         没顶死时看的是台阶的形状，顶死了看的是限幅线 —— 正好是两种时候各自
         该看的东西。 */
      const thS = autoScale(s => (sch ? s.S.th : s.F.th) * DEG, 0.5, 90);
      const dS = autoScale(s => Math.max(Math.abs(sch ? s.S.dc : s.F.dc), Math.abs(sch ? s.S.da : s.F.da)) * DEG, 0.2, 30);
      const dmaxDeg = state.dmax * DEG;
      const limIn = dmaxDeg <= dS * 1.35;
      if (state.showGrid) { timeGrid(C, TH, 0.9); timeGrid(C, DL, 0.9); }
      timeAxis(C, -2.7);
      refLine(C, TH, [5,6], 'rgba(148,163,184,0.24)');
      refLine(C, DL, [5,6], 'rgba(148,163,184,0.24)');
      if (limIn) {
        refLine(C, DL + dmaxDeg/dS*DS, [5,6], 'rgba(251,146,60,0.30)');
        refLine(C, DL - dmaxDeg/dS*DS, [5,6], 'rgba(251,146,60,0.30)');
      }
      label3(C, [0, TH + 1.15, 0.1], t({ zh: 'θ（1 格 = ', en: 'θ (1 unit = ' }) + fmt(thS, thS < 1 ? 2 : 1) + '°）',
        { size: 10.5, color: 'rgba(251,113,133,.85)', align: 'center' });
      label3(C, [0, DL + DS + 0.22, 0.1],
        t({ zh: 'δ（1 格 = ', en: 'δ (1 unit = ' }) + fmt(dS, dS < 1 ? 2 : 1) + '°）　±δmax = ' + dmaxDeg.toFixed(1) + '°' +
        (limIn ? '' : t({ zh: '（在量程外）', en: ' (off scale)' })),
        { size: 10.5, color: 'rgba(251,146,60,.85)', align: 'center' });

      const thOf = s => TH + (sch ? s.S.th : s.F.th) * DEG / thS;
      const cmdOf = s => DL + (sch ? s.S.dc : s.F.dc) * DEG / dS * DS;
      const actOf = s => DL + (sch ? s.S.da : s.F.da) * DEG / dS * DS;

      if (state.showTheta) trace(C, tracePts(thOf, TH-1.2, TH+1.2), RGB.rose);
      /* 顺序：δ_actual 在下 → 限幅/限速高亮 → δ_cmd 阶梯在最上。
         阶梯是本页签的主角，被实际值盖住就白画了（作动器快的时候两条几乎重合）。 */
      if (state.showAct) trace(C, tracePts(actOf, DL-1.4, DL+1.4), RGB.emerald);
      /* 限幅段与限速段分别着色（设计文档 §3.2）：橙 = 贴着 δmax，白 = 在限速段 */
      if (state.showSat) flagSegs(C, actOf, s => (sch ? s.S.sat : s.F.sat), DL-1.4, DL+1.4, 'rgba(251,146,60,0.95)', 4);
      if (state.showRate) flagSegs(C, actOf, s => (sch ? s.S.rl : s.F.rl), DL-1.4, DL+1.4, 'rgba(226,232,240,0.9)', 2.6);
      if (state.showCmd) trace(C, stairPts(cmdOf, DL-1.4, DL+1.4), RGB.violet);

      /* 头部光点（六处同源的第四处） */
      const heads = [[thOf, RGB.rose, state.showTheta], [cmdOf, RGB.violet, state.showCmd], [actOf, RGB.emerald, state.showAct]];
      if (samples.length) {
        const s0 = samples[samples.length-1];
        heads.forEach(h => {
          if (!h[2]) return;
          const p = proj(C, [0, h[0](s0), 0]);
          if (p) glowDot(p, 9, '#ffffff', 'rgba(' + h[1] + ',0.88)');
        });
      }
      label3(C, [0, TH + 0.55, WAVE_LEN*0.6], 'θ(t)', { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'center' });
      label3(C, [0, DL + 0.5, WAVE_LEN*0.6], 'δcmd(t)', { font: 'italic 13px ' + FONT_MATH, color: C_VIOLET, align: 'center' });
      label3(C, [0, DL - 0.55, WAVE_LEN*0.6], 'δact(t)', { font: 'italic 13px ' + FONT_MATH, color: C_EMERALD, align: 'center' });
    },
    readout() {
      const V = activeVeh();
      const ts = Math.max(0.5, SIM.k * H_STEP);
      return roHead(V) +
        '<div class="sinC">θ = <b>' + fmtS(V.st[4]*DEG, 1) + '</b>°</div>' +
        '<div class="cosC">δ<sub>cmd</sub> = <b>' + fmtS(V.dCmd*DEG, 2) + '</b>°&ensp;·&ensp;' +
          t({ zh: '保持 ', en: 'held ' }) + (1000/state.fs).toFixed(0) + ' ms/' + t({ zh: '格', en: 'step' }) + '</div>' +
        '<div class="tanC">δ<sub>act</sub> = <b>' + fmtS(V.dAct*DEG, 2) + '</b>°&ensp;·&ensp;|δ<sub>cmd</sub>−δ<sub>act</sub>| = <b>' +
          fmt(Math.abs(V.dCmd-V.dAct)*DEG, 2) + '</b>°</div>' +
        '<div class="cotC">' + t({ zh: '限幅占空', en: 'Saturated' }) + ' <b>' + pct(V.satT/ts) + '</b>&ensp;·&ensp;' +
          t({ zh: '限速占空', en: 'Rate-limited' }) + ' <b>' + pct(V.rateT/ts) + '</b></div>' +
        '<div class="dim">' + t({ zh: '零阶保持等效延迟 = 0.5/f', en: 'ZOH equivalent delay = 0.5/f' }) + 's = ' +
          (500/state.fs).toFixed(0) + ' ms&ensp;·&ensp;' + t({ zh: '在 ω_c = ', en: 'at ω_c = ' }) + fmt(V.wc, 1) +
          t({ zh: ' rad/s 处 = ', en: ' rad/s that is ' }) + fmt(V.dZoh, 0) + '°</div>' +
        roVerdict(V);
    }
  },

  margins: {

         时间轴本身就是那条死亡线 —— 闪的就是曲线**第一次跨过它**的那一刻。

         · **默认档一次都不闪**。定增益那枚全程 pm_min = 46.5°（MECO 时）、
           权限比 min = 1.44，两个闩锁都没翻；调度那枚 26.9° / 4.16。
           这是设计如此，不是判据写错：页签④ 的 tips 就说要把压心 − 重心推上去才看得到。
         · 压心 − 重心 = **+2.5 m** 仍不翻（权限比 min 1.15，差一点）；
           **+3 m** 是第一档翻的：pmZeroT = 45.84 s、authZeroT = 46.28 s，
           而这趟飞行仍以 MECO 成功收场（endCode 0）；
           **+4 m**（tips 点名的那一档）pmZeroT = **40.70 s**、authZeroT = 41.48 s，
           定增益那枚随后以 endCode 3 收场，调度那枚安然 MECO。一次发射至多闪一次，
           一个发射周期约 50 s（46.7 s 飞行 + 3.6 s 停留）。
         · 直接数金光闪（130 s 一趟）：默认 **0 次**；cp = +2.5 **0 次**；
           cp = +3 **2 次**（t = 45.85 / 96.13）；cp = +4 **2 次**（t = 40.72 / 91.00）；
           cp = +4 且开着「增益调度」**0 次**（调度那枚从不跌破）。四个页签 frameErrors 全空。
         · 两个闩锁里**先翻的永远是 pmZeroT**：全部档位上权限比都晚 0.4–0.8 s 才跌破 1，
           或者根本不跌破。authZeroT 那一半是护栏，不是主角。
         · 调度那枚（VS）在 cp = +1 … +6 的每一档都从不翻 —— 那正是页签④ 的论点。

         **已知副作用（照实写）**：`activeVeh()` 随「增益调度」开关在 VF / VS 之间切换。
         cp = +4、定增益那枚已在 40.7 s 闩死之后，拨到「增益调度」判据由真转假（熄灭），
         再拨回「定增益」就由假转真 —— **这一下是假上升沿，会再闪一次**：实测在
         simT = 43 s 处拨一个来回，闪的次数从 1 变成 2。
         之所以仍然读 activeVeh() 而不是钉死 SIM.VF：这一页画的、读数印的都是当前那一枚，
         钉死 VF 会让「开着调度、屏幕上那条曲线好好的」时候闪起来，那比多闪一次更糟。
         而假上升沿发生时，屏幕上确实正显示着一条已经跌破 0 的曲线，只是「跨过去」
         发生在过去而不是此刻。
         锚点取 [0,0,0]：时间轴头端、正是「0 = 出局」那行字所在的死亡线上。 */
      goldHit('margins', V.pmZeroT >= 0 || V.authZeroT >= 0);
      drawGoldFlash(C, [0, 0, 0]);
    },
    readout() {
      const V = activeVeh();
      return roHead(V) +
        '<div class="sinC">' + t({ zh: '相位裕度', en: 'Phase margin' }) + ' = <b>' + fmt(V.pm, 0) + '</b>°&ensp;<span class="dim">(min ' +
          fmt(Math.min(999, V.pmMin), 0) + '° @ ' + fmt(V.pmMinT, 1) + ' s)</span></div>' +

        '<div class="cotC">' + t({ zh: '权限比', en: 'Authority' }) + ' b·K<sub>p</sub>/a = <b>' + fmt(Math.min(99, V.auth)) +

        '<div class="dim">' + t({ zh: '穿越频率 ω_c = ', en: 'crossover ω_c = ' }) + fmt(V.wc, 1) +
          t({ zh: ' rad/s · 其中零阶保持吃 ', en: ' rad/s · ZOH eats ' }) + fmt(V.dZoh, 0) +
          t({ zh: '°、作动器吃 ', en: '°, actuator eats ' }) + fmt(V.dAtt, 0) + '°</div>' +
        '<div class="dim">' + t({ zh: '开环气动极点 s = ±', en: 'open-loop aero pole s = ±' }) + fmt(Math.sqrt(Math.max(0, V.aTh))) +
          t({ zh: ' rad/s · 正的那个就是倒立摆的「必倒」', en: ' rad/s · the positive one is the inverted pendulum’s "must fall"' }) + '</div>' +

  /* ────── ④ 增益调度 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 属「恒等式」（次：与页签③ 是同一个事件）。
     调度律 gainsOf() 直接把 Kp 解成 (ωn² + a)/b，所以 **b·Kp − a = ωn² 是代数恒等式**，
     不是被逼近出来的结果：实测整趟飞行逐帧核对，|b·Kp − a − ωn²| / ωn² 最大

     —— 实测默认档两者乘积从 1.000 一路涨到 6.547，因为 ωn 本身会随气动极点 √a 抬升，

     本页唯一像「到达」的离散事件，是定增益那一枚跌破死亡线 —— 那与页签③ 的

  schedule: {

             en: 'Same gusts, same initial conditions, same vehicle: fixed gains on the left, gains scheduled on T·ℓ(t)/J(t) and dynamic pressure on the right. The difference does not show up in the first second — it shows up in the second half of the flight.' },
    tips: { zh: '提示：把「压心 − 重心」推到 +4 m 再看 —— 最大动压附近，定增益那一枚的权限比先跌破 1，而调度那一枚把 b·Kp − a 钉死在起飞值上。这就是真实火箭做增益调度的全部理由。',
            en: 'Tip: push "CoP − CoM" to +4 m and watch — near max-q the fixed-gain vehicle’s authority ratio falls below 1 first, while the scheduled one pins b·Kp − a at its liftoff value. That is the entire reason real launch vehicles schedule their gains.' },

      refLine(C, GB, [5,6], 'rgba(148,163,184,0.24)');
      /* 两枚共用同一个量程，否则「谁抖得厉害」这件事就被各自的量程抹平了 */
      const thS = autoScale(s => Math.max(Math.abs(s.F.th), Math.abs(s.S.th)) * DEG, 0.5, 90);
      label3(C, [0, TH + 1.15, 0.1], t({ zh: 'θ（1 格 = ', en: 'θ (1 unit = ' }) + fmt(thS, thS < 1 ? 2 : 1) + '°）',
        { size: 10.5, color: 'rgba(159,176,200,.7)', align: 'center' });
      label3(C, [0, GB - 0.75, 0.1], t({ zh: '基线 = 起飞值 ×1', en: 'baseline = liftoff ×1' }),
        { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'center' });

      if (state.showFix) trace(C, tracePts(s => TH + s.F.th*DEG/thS, TH-1.2, TH+1.2), RGB.rose);
      if (state.showSch) trace(C, tracePts(s => TH + s.S.th*DEG/thS, TH-1.2, TH+1.2), RGB.violet);
      if (state.showKp) trace(C, tracePts(s => GB + (s.S.kp - 1)*GS, GB-1.0, GB+1.3), RGB.emerald);
      if (state.showB) trace(C, tracePts(s => GB + (s.F.br - 1)*GS, GB-1.0, GB+1.3), RGB.orange);

      if (samples.length) {

        hd.forEach(h => {

      /* 两枚火箭并排（缩小到 0.55，本页签的主角是两条曲线）：左定增益、右调度增益 */

      label3(C, [0, TH + 0.55, WAVE_LEN*0.6], 'θfixed', { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'center' });

        : t(END_NAME[V.endCode]) + ' @ ' + fmt(V.endT, 1) + ' s');
      return '<div>t = <b>' + fmt(ts) + '</b> s&ensp;·&ensp;' + t({ zh: '同一阵风 · 种子', en: 'same gusts · seed' }) +
             ' #' + Math.round(state.wseed) + '</div>' +
        '<div class="dim">T·ℓ/J = ' + fmt(F.b, 1) + ' s⁻²&ensp;·&ensp;' + t({ zh: '起飞值', en: 'at liftoff' }) + ' ' +
          fmt(F.b0, 1) + ' s⁻²&ensp;·&ensp;<b>×' + fmt(bR) + '</b></div>' +
        '<div class="sinC">' + t({ zh: '定增益', en: 'Fixed' }) + '：θ = <b>' + fmtS(F.st[4]*DEG, 1) + '</b>°&ensp;·&ensp;' +
          t({ zh: '权限比', en: 'auth' }) + ' <b>' + fmt(Math.min(99, F.auth)) + '</b>&ensp;·&ensp;' + line(F) + '</div>' +
        '<div class="cosC">' + t({ zh: '调度增益', en: 'Scheduled' }) + '：θ = <b>' + fmtS(S.st[4]*DEG, 1) + '</b>°&ensp;·&ensp;' +

          t({ zh: '定', en: 'fixed' }) + ' <b>' + fmt(F.kpEff) + '</b>&ensp;·&ensp;' +
          t({ zh: '调度', en: 'sched' }) + ' <b>' + fmt(S.kpEff) + '</b>（×' + fmt(state.kp > 0 ? S.kpEff/state.kp : 1) + '）</div>' +
        /* 只给**失败**的那一枚报死因。成功抵达 MECO 的那枚硬安一个「首要死因」，
           会教出错误的因果 —— 与 roVerdict() 同一条规矩。 */
        diagLine(F, { zh: '定增益诊断：', en: 'Fixed-gain diagnosis: ' }) +

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 写 state 并同步滑杆回显（RECORD.reseed 用） */
function setParam(key, v) { state[key] = v; syncParamSlider(key); }
function setToggle(key, v) {
  state[key] = !!v;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = !!v; });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录"当时的真实值"                              ║
   ╚══════════════════════════════════════════════════════════╝ */
let lastSampleT = 0;
function pushSample() {
  /* 本工具没有相位钟：显式把 ω 置 0，防引擎的 theta 积分把 undefined 累成 NaN。 */
  state.omega = 0;

  const ri = recInfo();
  if (ri && ri.mode === 'replay') {
    /* 回放态**不积分**：SIM 已由 restore() 按存档那一行写好，再推一步就等于
       画第 i+1 行附近的另一段（§11.7 的判据一律走 recInfo()）。 */
    lastSampleT = state.t;
  } else {
    /* 种子变了 = 用户要求「再发射一次」：显式、由用户发起，历史清空而不是
       被追溯重算（§6）。已经画出去的那一段是当时的真实值。 */
    if (SIM.sig !== seedSig()) startLaunch();
    const dt = clamp(state.t - lastSampleT, 0, 0.05);
    lastSampleT = state.t;
    if (dt > 0) stepSim(dt);
  }

  const ts = SIM.k * H_STEP;
  const pack = V => ({
    th: V.st[4], dc: V.dCmd, da: V.dAct,
    sat: Math.abs(V.uRaw) >= state.dmax ? 1 : 0,
    rl: V.rateLim,
    pm: V.pm, gm: V.gm, am: V.am, au: Math.min(9, V.auth),
    kp: state.kp > 0 ? V.kpEff / state.kp : 1,
    br: V.b0 > 1e-6 ? V.b / V.b0 : 1
  });
  samples.push({ t: state.t, ts: ts, F: pack(SIM.VF), S: pack(SIM.VS) });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ④ 演算记录与回放 —— 规范 §11                              ║
   ║  一次发射 = 一轮。风的种子与全部决定飞行的参数进 seed()，     ║
   ║  于是一次漂亮的（或惨烈的）飞行可以存下来、发给别人、逐帧复看。 ║
   ║  四个页签是**同一次发射的四种测量**（§6），共用一份钩子。      ║
   ╚══════════════════════════════════════════════════════════╝ */

/* capture() 必须装下完整的积分器状态：位置、速度、姿态、角速率、燃料、
   作动器、**以及控制器的积分项** —— I 项也是状态，漏掉它是经典错误：
   restore 之后的第一步就用错了积分值，画面却完全正常。
   子步余量 acc 与子步计数 k 同理：k 决定下一步是不是控制采样时刻。
   轮次计数 SIM.launch **不进**存档（§11.6：簿记不是状态）。 */
function packVeh(V) {
  return {
    st: V.st.slice(),
    dAct: V.dAct, dCmd: V.dCmd, uRaw: V.uRaw, iTerm: V.iTerm, rateLim: V.rateLim,
    kpEff: V.kpEff,
    lifted: V.lifted, alive: V.alive, endCode: V.endCode, endT: V.endT,
    b: V.b, aTh: V.aTh, pm: V.pm, gm: V.gm, wc: V.wc,
    dZoh: V.dZoh, dAtt: V.dAtt, auth: V.auth, am: V.am,
    satT: V.satT, rateT: V.rateT, sepMax: V.sepMax,
    satEma: V.satEma, rateEma: V.rateEma, satEmaMax: V.satEmaMax, rateEmaMax: V.rateEmaMax,
    oscD: V.oscD, oscDSign: V.oscDSign,
    pm0: V.pm0, pmMin: V.pmMin, pmMinT: V.pmMinT, pmZeroT: V.pmZeroT,
    dZohBad: V.dZohBad, dActBad: V.dActBad, wcBad: V.wcBad,
    authMin: V.authMin, authMinT: V.authMinT, authZeroT: V.authZeroT,
    iPeak: V.iPeak, iSatT: V.iSatT,
    oscN: V.oscN, oscAmp: V.oscAmp, oscSign: V.oscSign,
    b0: V.b0, bEnd: V.bEnd
  };
}
function unpackVeh(V, s) {
  for (let i = 0; i < 7; i++) V.st[i] = s.st[i];
  Object.keys(s).forEach(kk => { if (kk !== 'st') V[kk] = s[kk]; });
}
function captureRun() {
  return {
    et: state.t, lt: lastSampleT, k: SIM.k, acc: SIM.acc,
    wn2: SIM.wn2, twz: SIM.twz, ki0: SIM.ki0, holdT: SIM.holdT,
    F: packVeh(SIM.VF), S: packVeh(SIM.VS)
  };
}
function restoreRun(s) {
  state.t = s.et; lastSampleT = s.lt; SIM.k = s.k; SIM.acc = s.acc;
  SIM.wn2 = s.wn2; SIM.twz = s.twz; SIM.ki0 = s.ki0; SIM.holdT = s.holdT;
  unpackVeh(SIM.VF, s.F); unpackVeh(SIM.VS, s.S);
  /* ctrlEvery 与 sig 就地重算：它们是滑杆的函数，存进去反而会在回放里与
     实际滑杆值打架。重算之后 restore(capture()) 依然逐位对称。 */
  SIM.ctrlEvery = Math.max(1, Math.round((1 / state.fs) / H_STEP));
  SIM.sig = seedSig();
}

const RECORD = (function () {
  const hooks = {
    capture: captureRun,
    restore: restoreRun,
    /* 纯取值器：把本页签退回一轮起点是引擎在 recStartRecording() 里做的
       （reseed(seed())，§11.6）。录制与本机重算于是从同一个 t0 起步。
       t0 也是积分参数：本工具每步的 dt 由 state.t 的差分算出，起点不同，
       子步余量 acc 的演化就不同，重算便不再是重算。 */
    seed() {
      return {
        kp: state.kp, kd: state.kd, ki: state.ki, fs: state.fs,
        dmax: state.dmax, drate: state.drate,
        wind: state.wind, gust: state.gust, wseed: Math.round(state.wseed),
        thrust: state.thrust, fuel0: state.fuel0,
        comShift: state.comShift, cpShift: state.cpShift,
        antiWind: state.antiWind ? 1 : 0,
        h: H_STEP, t0: state.t
      };
    },
    reseed(s) {
      setParam('kp', s.kp); setParam('kd', s.kd); setParam('ki', s.ki);
      setParam('fs', s.fs); setParam('dmax', s.dmax); setParam('drate', s.drate);
      setParam('wind', s.wind); setParam('gust', s.gust); setParam('wseed', s.wseed);
      setParam('thrust', s.thrust); setParam('fuel0', s.fuel0);
      setParam('comShift', s.comShift); setParam('cpShift', s.cpShift);
      setToggle('antiWind', !!s.antiWind);
      state.t = s.t0; lastSampleT = s.t0;
      startLaunch();
      SIM.launch = 1;
    },
    /* 回放期间锁死全部种子滑杆：动它们等于换一次发射，画面与数据立刻脱节。
       zoomT 与显示开关不锁 —— 回放冻结的是演算，不是观察（§11.7）。 */
    lock: ['kp','kd','ki','fs','dmax','drate','wind','gust','wseed','thrust','fuel0','comShift','cpShift'],
    /* 一轮 = 一次发射：从点火到结局，再加 HOLD_SEC 秒的停留。之后自动
       再发射，轮次 +1，引擎据此在那一帧停录。 */
    roundOf: () => SIM.launch
  };
  return { flight: hooks, signals: hooks, margins: hooks, schedule: hooks };
})();

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  /* 本工具：重置 = 再发射一次（快捷键 R）。发射计数归 1，历史清空。 */
  startLaunch();
  SIM.launch = 1;
  lastSampleT = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    /* 回放冻结的是「演算」，不是「观察」：相机 tween 在上面已经走过了，
       视角、开关、绘制全部照常 —— 与「暂停只冻结模拟」同一条精神（§11.7）。 */
    if (recState.mode === 'replay') {
      recStep(dt);
    } else if (state.running) {
      if (recState.mode === 'recording') {
        /* 录制时把时间量子化成整数个 REC_DT。理由（§11.2）：物理若由变长的
           帧 dt 推进，轨迹就依赖于帧率抖动，「从同一种子重算」在**本机**都对
           不上，比对曲线也就失去意义。量子化之后轨迹是种子的确定性函数，
           本机重算能贴到舍入噪声，跨机器的差别才干净地归因于超越函数实现。 */
        recState.acc += dt;
        let guard = 0;
        while (recState.acc >= REC_DT && guard++ < 64) { recState.acc -= REC_DT; simAdvance(REC_DT); recPush(); }
      } else {
        simAdvance(dt);
      }
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); refreshRecInfo(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= 场景作用域参数与时间驱动 ================= */
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）

/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {

      });

}
