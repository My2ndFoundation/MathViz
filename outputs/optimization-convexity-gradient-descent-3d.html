  let bf = Infinity, bx = r, by = 0;
  for (let i = 0; i < 720; i++) {
    const u = i / 720 * TAU, x = r * Math.cos(u), y = r * Math.sin(u), v = f4(x, y);
    if (v < bf) { bf = v; bx = x; by = y; }
  }
  return { inside: false, x: bx, y: by, f: bf };
}

/* —— 梯度下降轨道 —— 两种语义，按「驱动是否接管本页签」切换：
   · 手动模式（自动播放关闭）：真实历史，只追加，参数中途改变不重算旧步，
     R 重置重播。这是本工具原有的不变量，一字未动。
   · 驱动模式（本页签有 drive 且自动播放开着）：驱动量每帧都在变，若还只追加，
     画面就会留着一条用旧参数算出的轨迹，与读数对不上——那正是「真实历史」
     不变量本来要防的事。所以此时改为整条重播：每帧用当前参数从 x₀ 重算固定
     步数，轨迹与读数始终同源。关掉自动播放即刻回到追加语义。 */
let orb1 = [0], orbA = [[0, 0]], orbB1 = [[0, 0]], orbB2 = [[0, 0]];
function reseedOrbits() {
  const x0 = clamp(state.startX, -1.8, 1.8), y0 = clamp(state.startY, -1.8, 1.8);
  orb1 = [x0];
  orbA = [[x0, y0]];
  orbB1 = [[x0, y0]];
  orbB2 = [[-x0, -y0]];   /* B 从中心对称起点出发 */
}

/* 驱动模式下每帧重播的步数（按页签）：
   one 的轨迹沿 n 轴排开，可视窗口只容得下 WAVE_LEN*0.8/ZSTEP ≈ 14 步，
   取满这一窗，画出来正好是从 x₀ 到第 14 步的完整一段；
   valley / convex 的路径整条画在 xy 平面上（drawSurfPath 最多取 260 点），
   步数给足才看得出 zig-zag 抖动与最终落进哪个井。 */
const ORBIT_SHOW = { one: 14, valley: 60, convex: 60 };

function nNow() {
  /* driveInfo() 是引擎提供的只读访问器：本页签有 drive 且自动播放开着才非 null */
  if (driveInfo() && ORBIT_SHOW[curTab]) return ORBIT_SHOW[curTab];
  return Math.min(Math.floor(state.theta), ORBIT_MAX);
}

/* 把四条轨道裁到 n 步（只缩不增）。用途见 pushSample()：读数报出的 n 与画面上
   真正画出的步数必须同源，而画面取的是 orb*.length − 1。 */
function trimOrbits(n) {
  const len = Math.max(1, n + 1);
  if (len >= orb1.length) return;
  orb1.length = len; orbA.length = len; orbB1.length = len; orbB2.length = len;
}

/* 驱动模式下判断「该重播了没有」的参数指纹：只要有一个入参动了就整条重算 */
function orbSig() {
  return state.eta + '|' + state.lam + '|' + state.startX + '|' + state.startY +
         '|' + Math.round(state.surfSel);
}
let lastOrbSig = null;
function gdStep1(x) {
  if (!isFinite(x)) return Infinity;
  const nx = x - state.eta * d1(x);
  return (isFinite(nx) && Math.abs(nx) < DIVERGE) ? nx : Infinity;
}
function gdStep2(p, gf) {
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) return [Infinity, Infinity];
  const g = gf(p[0], p[1]);
  const nx = p[0] - state.eta * g[0], ny = p[1] - state.eta * g[1];
  if (!isFinite(nx) || !isFinite(ny) || Math.abs(nx) > DIVERGE || Math.abs(ny) > DIVERGE) return [Infinity, Infinity];
  return [nx, ny];
}
/* 轨道末端的当前位置（发散 / 出域则返回 null） */
function lastFinite(orb) {
  const p = orb[orb.length - 1];
  if (!p || !isFinite(p[0]) || !isFinite(p[1]) || Math.abs(p[0]) > 2.35 || Math.abs(p[1]) > 2.35) return null;
  return p;
}
/* |值| > 999 显示 ±∞（§7） */
function fmtV(v, d) { return (isFinite(v) && Math.abs(v) <= 999) ? fmtS(v, d == null ? 2 : d) : '±∞'; }

/* —— 曲面缓存：网格采样 / 线框网面 / 地面等高线图（换 λ 或预设才重建） —— */
let fldCache = { key: '' };
function fieldFor(tab) {
  if (tab === 'valley') return { key: 'A' + fmt(state.lam, 1), f: f2 };
  const i = Math.round(state.surfSel);
  return { key: 'B' + i, f: SURF3[i].f };
}
function ensureField(tab) {
  const fd = fieldFor(tab);
  if (fldCache.key === fd.key) return fldCache;
  const n1 = GN + 1, vals = new Float64Array(n1 * n1);
  let mn = Infinity, mx = -Infinity;
  for (let j = 0; j <= GN; j++) for (let i = 0; i <= GN; i++) {
    const v = fd.f(-D2 + 2 * D2 * i / GN, -D2 + 2 * D2 * j / GN);
    vals[j * n1 + i] = v;
    if (v < mn) mn = v;
    if (v > mx) mx = v;
  }
  const cap = Math.min(mx, HCAP);
  const mesh = [];
  for (let j = 0; j <= GN; j += 4) {
    for (let i = 0; i <= GN; i++) {
      const v = vals[j * n1 + i];
      if (v > HCAP) { mesh.push(null); continue; }
      mesh.push([-D2 + 2 * D2 * i / GN, v, -D2 + 2 * D2 * j / GN]);
    }
    mesh.push(null);
  }
  for (let i = 0; i <= GN; i += 4) {
    for (let j = 0; j <= GN; j++) {
      const v = vals[j * n1 + i];
      if (v > HCAP) { mesh.push(null); continue; }
      mesh.push([-D2 + 2 * D2 * i / GN, v, -D2 + 2 * D2 * j / GN]);
    }
    mesh.push(null);
  }
  const map = [];
  for (let k = 1; k <= 9; k++) map.push(segsToPts(contourSegs(vals, mn + (cap - mn) * k / 10), FLOOR + 0.005));
  fldCache = { key: fd.key, f: fd.f, vals: vals, zmin: mn, zmax: mx, mesh: mesh, map: map };
  return fldCache;
}

/* marching squares：等值线 f(x,y)=c 的线段集（数学坐标 [x,y]） */
function contourSegs(v, c) {
  const n1 = GN + 1, step = 2 * D2 / GN, segs = [];
  for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) {
    const x0 = -D2 + i * step, y0 = -D2 + j * step;
    const va = v[j * n1 + i] - c,           vb = v[j * n1 + i + 1] - c;
    const vd = v[(j + 1) * n1 + i + 1] - c, ve = v[(j + 1) * n1 + i] - c;
    const pts = [];
    if (va * vb < 0) pts.push([x0 + step * va / (va - vb), y0]);
    if (vb * vd < 0) pts.push([x0 + step, y0 + step * vb / (vb - vd)]);
    if (ve * vd < 0) pts.push([x0 + step * ve / (ve - vd), y0 + step]);
    if (va * ve < 0) pts.push([x0, y0 + step * va / (va - ve)]);
    if (pts.length === 2) segs.push(pts);
    else if (pts.length === 4) { segs.push([pts[0], pts[1]]); segs.push([pts[2], pts[3]]); }
  }
  return segs;
}
function segsToPts(segs, yw) {
  const pts = [];
  for (const s of segs) pts.push([s[0][0], yw, s[0][1]], [s[1][0], yw, s[1][1]], null);
  return pts;
}

/* —— 地面网格 / 曲面坐标轴（世界映射：数学 (x,y,f) → 世界 (x, y=f, z=y)） —— */
function drawFloorGrid(C) {
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    const u = i * 0.5;
    line3(C, [u, FLOOR, -D2], [u, FLOOR, D2], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-D2, FLOOR, u], [D2, FLOOR, u], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}
function drawSurfAxes(C) {
  const e = D2 + 0.5;
  line3(C, [-e, FLOOR, 0], [e, FLOOR, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [e, FLOOR, 0], [e - 0.2, FLOOR, 0], AXIS);
  label3(C, [e + 0.25, FLOOR, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, FLOOR, -e], [0, FLOOR, e], { width: 1.4, color: AXIS });
  arrowAt(C, [0, FLOOR, e], [0, FLOOR, e - 0.2], AXIS);
  label3(C, [0, FLOOR, e + 0.3], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const cx = -D2 - 0.45, cz = -D2 - 0.45;
  line3(C, [cx, FLOOR, cz], [cx, 1.7, cz], { width: 1.4, color: AXIS });
  arrowAt(C, [cx, 1.7, cz], [cx, 1.5, cz], AXIS);
  label3(C, [cx, 1.95, cz], 'f', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const yv of [0, 1]) {
    line3(C, [cx - 0.06, yv, cz], [cx + 0.06, yv, cz], { width: 1.2, color: AXIS_DIM });
    label3(C, [cx - 0.15, yv, cz], '' + yv, { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
}
function drawContourMap(C, F) {
  for (const pts of F.map) {
    if (pts.length > 1) strokePoly(C, pts, { width: 1.2, color: 'rgba(167,139,250,0.45)' });
  }
}

/* —— 曲面下降路径：曲面上实线 + 地面投影虚线（由新到旧，头亮尾隐） —— */
function drawSurfPath(C, orb, fS, rgb) {
  const k = orb.length - 1;
  if (k < 1) return;
  const pts = [], flo = [];
  for (let i = k; i >= Math.max(0, k - 260); i--) {
    const p = orb[i];
    if (!p || !isFinite(p[0]) || !isFinite(p[1]) || Math.abs(p[0]) > 2.35 || Math.abs(p[1]) > 2.35) {
      pts.push(null); flo.push(null); continue;
    }
    pts.push([p[0], Math.min(fS(p[0], p[1]), HCAP) + 0.012, p[1]]);
    flo.push([p[0], FLOOR + 0.012, p[1]]);
  }
  strokePoly(C, pts, { width: 5.5, color: 'rgba(' + rgb + ',0.13)' });
  strokePoly(C, pts, { width: 2.2, fade: ['rgba(' + rgb + ',1)', 'rgba(' + rgb + ',0.04)'] });
  strokePoly(C, flo, { width: 1.5, dash: [7, 7], color: 'rgba(' + rgb + ',0.55)' });
}

/* —— z=0 平面上的梯度箭头（约束页） —— */
function planeArrow(C, P, V, len, rgba, hex, lab) {
  const l = Math.hypot(V[0], V[1]);
  if (l < 1e-5) return;
  const sc = Math.min(0.9, len / l);
  const a = [P[0], P[1], 0], b = [P[0] + V[0] * sc, P[1] + V[1] * sc, 0];
  line3(C, a, b, { width: 2.2, color: rgba });
  arrowAt(C, b, a, rgba);
  label3(C, b, lab, { font: 'italic 14px ' + FONT_MATH, color: hex, dx: 8, dy: -9 });
}

/* —— 一维页：n 轴（沿 z，最新一步贴在 z=0） —— */
function axisN1(C) {
  const L = WAVE_LEN * 0.8;
  line3(C, [0, 0, 0], [0, 0, L + 0.5], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 0, L + 0.5], [0, 0, L + 0.3], AXIS);
  label3(C, [0, 0, L + 0.9], 'n', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const k = nNow();
  for (let j = 1; j * ZSTEP <= L + 1e-6; j++) {
    if (k - j < 0) break;
    line3(C, [0, -0.06, j * ZSTEP], [0, 0.06, j * ZSTEP], { width: 1.2, color: AXIS_DIM });
    if (j % 4 === 0) label3(C, [0, -0.25, j * ZSTEP], 'n−' + j, { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
}

/* —— 联动：视角选中时同步开关状态与面板复选框（§5.3） —— */

  state[key] = val;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = val; });
}

/* —— 读数区固定首两行（步进时钟版本）与公共小件 —— */
function roHead() {
  /* 驱动接管时 n 不再是 ⌊ωt⌋ 而是每帧重播的固定步数，标签得跟着改口，
     否则读数会宣称一个与画面不符的来源 */
  const drv = driveInfo();
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' +
         (drv ? t({ zh: '重播 n = ', en: 'replay n = ' }) : 'n = ⌊ωt⌋ = ') +
         '<b>' + nNow() + '</b></div>' +

         t(drv ? { zh: '自动播放中 · 轨迹每帧按当前参数从 x₀ 重播',

                   en: 'start set by x₀, y₀ · press R to replay' }) + '</div>';
}

}
function divergedLabel(C, y) {

     驱动接管时轨迹每帧按当前参数整条重播，η 一小下一帧就重新算出有限轨迹，
     发散不再是死局；手动模式下轨道只追加，发散那一步已经写进历史，

    ? { zh: '发散 → ±∞ · 减小 η 即刻重播（无需按 R）', en: 'diverged → ±∞ · lower η and it replays at once (no R)' }

      /* 目标函数曲线（青，源几何） */
      const cpts = [];
      for (let i = 0; i <= 76; i++) { const x = -1.9 + 3.8 * i / 76; cpts.push([x, f1(x), 0]); }
      strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
      label3(C, [1.62, f1(1.75), 0], 'f(x) = 0.6x²', { font: 'italic 13px ' + FONT_MATH, color: CYAN, align: 'left', dx: 10 });
      /* 起点 */
      const x0 = clamp(state.startX, -1.8, 1.8);
      solidDot(C, [x0, f1(x0), 0], 3, 'rgba(226,232,240,0.9)');
      label3(C, [x0, f1(x0) + 0.24, 0], 'x₀', { font: 'italic 12px ' + FONT_MATH, color: 'rgba(226,232,240,.8)', align: 'center' });
      const k = orb1.length - 1, xk = orb1[k];
      /* 迭代轨迹（玫红，沿 n 轴流出，最新贴 z=0；越界裁剪断开） */
      if (state.showPath1 && k >= 1) {
        const pts = [];
        for (let i = k; i >= 0; i--) {
          const z = (k - i) * ZSTEP;
          if (z > WAVE_LEN * 0.8) break;
          const x = orb1[i];
          if (!isFinite(x) || Math.abs(x) > CLIP1) { pts.push(null); continue; }
          pts.push([x, f1(x), z]);
        }
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, pts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
        for (let i = k - 1; i >= Math.max(0, k - 12); i--) {
          const x = orb1[i];
          if (!isFinite(x) || Math.abs(x) > CLIP1) continue;
          solidDot(C, [x, f1(x), (k - i) * ZSTEP], 2.2, 'rgba(251,113,133,0.8)');
        }
      }
      /* 切线与更新（紫）：xₙ₊₁ = xₙ − η·f′(xₙ) 的几何构造 */
      if (state.showTan && isFinite(xk) && Math.abs(xk) <= CLIP1) {
        const fk = f1(xk), dk = d1(xk);
        line3(C, [xk - 0.7, fk - 0.7 * dk, 0], [xk + 0.7, fk + 0.7 * dk, 0], { width: 1.6, alpha: 0.55, color: VIOLET });
        const xn = xk - state.eta * dk;
        if (state.showGuides) {
          line3(C, [xk, fk, 0], [xk, 0, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.6)' });
          if (Math.abs(xn) <= 2.1) line3(C, [xn, 0, 0], [xn, f1(xn), 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,191,36,0.35)' });
        }
        if (Math.abs(xn) <= 2.1 && Math.abs(xn - xk) > 0.01) {
          line3(C, [xk, 0, 0], [xn, 0, 0], { width: 1.8, color: 'rgba(167,139,250,0.95)' });
          arrowAt(C, [xn, 0, 0], [xk, 0, 0], 'rgba(167,139,250,0.95)');
          label3(C, [(xk + xn) / 2, -0.26, 0], '−η·f′', { font: 'italic 12px ' + FONT_MATH, color: VIOLET, align: 'center' });
        }
        label3(C, [-2.05, 2.2, 0], 'xₙ₊₁ = xₙ − η·f′(xₙ)', { font: 'italic 13px ' + FONT_MATH, color: VIOLET, align: 'left' });
      }
      /* 当前点 */
      if (isFinite(xk) && Math.abs(xk) <= CLIP1) {
        const sp = proj(C, [xk, f1(xk), 0]);
        if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');
      } else {
        divergedLabel(C, 2.55);
      }
      /* 金光闪（§4.7）：迭代走到谷底 —— 紫色 −η·f′ 箭头缩没的那一步。
         判据借的就是上面第 625 行画不画那支箭头的那个数：
         `Math.abs(xn − xk) > 0.01`，而 xn − xk = −η·f′(xₙ)，
         所以 |η·f′(xₙ)| ≤ 0.01 与「箭头消失」逐字等价，不是另立的 ε
         （读数里的 Δx = −η·f′ 也在同一刻落到 ±0.01 以内）。
         两个守卫都不能省：`isFinite(xk)` —— η 大到发散时 gdStep1 返回 Infinity，
         那时 η·f′ 是 NaN、比较为假，可一旦有人把判据写成「步长很小」的近似式
         就会给发散报捷，**绝不给发散打光**；`|xk| ≤ CLIP1` —— 出了裁剪框的点
         画面上根本不画（§6 奇点约定），不画的东西不该闪。
         cadence 要分两种语义讲，因为本页两种模式的算术不是一回事（见 orb* 注释）：
         · 驱动模式（默认，η 由 drive 0.02→2 period 12 pingpong 扫）：每帧按当前 η
           整条重播 ORBIT_SHOW.one = 14 步，于是 xₖ = 1.5·(1−1.2η)¹⁴，
           **「到没到谷底」是 η 的函数，不是时间的函数**。解
           1.8η·|1−1.2η|¹⁴ ≤ 0.01 得判据为真的区间 η ∈ (0.184, 1.395)
           （η = 0.8333 处收缩因子为 0，一步到底），上升沿落在扫过区间两端的时候。
           实测（Node 定帧推进，默认参数，60 s）：**10 次**，
           首次 t = 0.50 s（η = 0.185，xₖ = 0.0446，|η·f′| = 0.00991），
           次次 t = 7.85 s（η = 1.3895，xₖ = 0.0052），随后 12.50 / 19.85 / 24.50 …
           一个 12 s 周期 2 次，最密间隔 4.65 s。
         · 手动模式（关掉自动播放，只追加的真实历史）：默认 η = 0.3 / x₀ = 1.5 /
           ω = 1.2 步/s ⇒ 0.54·0.64ⁿ ≤ 0.01 要 n = 9 步，t = 9/1.2 = 7.50 s；
           此后判据恒真，不再有上升沿（实测 60 s **1 次**，首次 t = 7.50 s，
           n = 9，xₖ = 0.0270，|η·f′| = 0.00973）—— 收敛就是收敛，一次就够。
         锚点 [0, 0, 0]：f(x) = 0.6x² 的谷底本身，也是最新一步所在的 z = 0 切面。 */
      goldHit('one', isFinite(xk) && Math.abs(xk) <= CLIP1 &&
                     Math.abs(state.eta * d1(xk)) <= 0.01);
      drawGoldFlash(C, [0, 0, 0]);
    },
    readout() {
      const k = orb1.length - 1, xk = orb1[k], ok = isFinite(xk);
      const fac = Math.abs(1 - 1.2 * state.eta);
      const reg = state.eta < 1 / 1.2 ? t({ zh: '单调收敛', en: 'monotone convergence' })
                : state.eta < 2 / 1.2 ? t({ zh: '振荡收敛', en: 'oscillating convergence' })
                : t({ zh: '发散', en: 'divergence' });
      return roHead() +
        '<div class="sinC">xₙ = <b>' + fmtV(xk) + '</b>&ensp;f(xₙ) = <b>' + fmtV(ok ? f1(xk) : Infinity) + '</b></div>' +
        '<div class="cosC">f′(xₙ) = <b>' + fmtV(ok ? d1(xk) : Infinity) + '</b>&ensp;Δx = −η·f′ = ' + fmtV(ok ? -state.eta * d1(xk) : Infinity) + '</div>' +
        '<div class="dim">|1 − 1.2η| = ' + fmt(fac) + ' · ' + reg + '</div>' + capNote();
    }
  },

  /* ────── 凸与非凸：局部最小值依赖初始点 ────── */

  /* ────── 约束优化：∇f = λ∇g，相切即最优 ────── */

    views: {

      if (state.showMap) for (const c of F4LEVELS) strokePoly(C, ellipse4(c), { width: 1.2, color: 'rgba(167,139,250,0.45)' });
      const r = state.rad;

      solidDot(C, [F4C[0], F4C[1], 0], 3, 'rgba(226,232,240,0.9)');

      if (state.showCon)   planeArrow(C, [px, py], gg, 0.55, 'rgba(52,211,153,0.95)', EMERALD, '∇g');
      /* 最优点（相切处）与 ∇f = λ∇g 标注 */
      const O = constrOpt();
      const so = proj(C, [O.x, O.y, 0]);
      if (so) glowDot(so, 10, '#ffffff', 'rgba(251,191,36,0.85)');
      label3(C, [O.x, O.y, 0], O.inside ? t({ zh: 'λ = 0（约束未激活）', en: 'λ = 0 (inactive)' }) : '∇f = λ∇g',
        { font: 'italic 12px ' + FONT_MATH, color: AMBER, dx: 10, dy: 14 });
      const sp = proj(C, [px, py, 0]);
      if (sp) glowDot(sp, 13, '#ffffff', 'rgba(186,240,255,0.9)');
      /* 金光闪（§4.7）：巡游探针走到约束圆上的那个最优点 —— 橙色过点等高线
         吻住翠绿约束圆、∇f 与 ∇g 变平行的那一刻，也就是 tips 的顿悟点本身。
         判据借读数的两位小数：f(P) 与 f* 印成同一个数（|f(P) − f*| < 0.005）。
         **不要**改用同一行读数里的 |sin∠(∇f, ∇g)| —— 它同样是两位小数，但它
         在最优点附近是**一阶**小量（sn ∝ |Δu|）：实测 r = 0.9 时 sn < 0.005 的
         角度窗口两个临界点加起来才 0.0189 rad，摊到极小这一个上 ≈ 0.0095 rad，
         ω = 1.2 rad/s 下驻留 **0.47 帧** —— 整帧跨过去才是常态。
         f 走的是**二阶**：最优点是 h(u) = f₄(r cos u, r sin u) 的极小，
         h′(u*) = 0 ⇒ |Δf| < 0.005 对应实测 |Δu| < 0.126 rad（窗口 0.2515 rad，
         边界 u ∈ [0.438, 0.690]，u* = 0.5672）⇒ 驻留 0.210 s ≈ **12.6 帧**。
         同一个到达，量对了才量得到 —— 这是「窗口不得窄于一帧步长」的教科书案例。
         `!O.inside` 不能省：r ≥ 1.332 时无约束最小值 min f 落进圆内、约束失效
         （读数印「λ = 0（约束未激活）」），constrOpt() 把 O.f 返回成 0 而探针
         的 f(P) 永远够不着 0，此时**正确行为就是不闪**；漏了这一句，一旦
         有人把 r 拉到 1.6 又恰好路过，闪的会是一个不存在的约束最优。
         无 drive：探针角由引擎共享时钟走（ω = 1.2 rad/s）。约束圆上 ∇f ∥ ∇g
         恰有 2 个临界点（默认 r = 0.9 实测 u = 0.5644 的极小与 3.5853 的极大），
         判据只认极小 ⇒ 一圈一次。
         实测（Node 定帧推进，默认参数 r = 0.9 / ω = 1.2，60 s）：**12 次**，
         首次 t = 0.37 s（θ = 0.44 rad = 窗口下沿；最优点 O = (0.7591, 0.4836)，
         f* = 0.0519），此后每 5.24 s（= 2π/ω）一次。
         锚点 [O.x, O.y, 0]：那个琥珀最优点，「∇f = λ∇g」标注挂着的地方。 */
      goldHit('lagr', !O.inside && Math.abs(f4(px, py) - O.f) < 0.005);
      drawGoldFlash(C, [O.x, O.y, 0]);
    },
    readout() {
      const r = state.rad, ph = mod2pi(state.theta);
      const px = r * Math.cos(ph), py = r * Math.sin(ph);
      const gf = g4f(px, py), gg = [2 * px, 2 * py];
      const cr = Math.abs(gf[0] * gg[1] - gf[1] * gg[0]);
      const sn = cr / ((Math.hypot(gf[0], gf[1]) * Math.hypot(gg[0], gg[1])) || 1);
      const O = constrOpt();
      const go = [2 * O.x, 2 * O.y], gfo = g4f(O.x, O.y);
      const lam = O.inside ? 0 : (gfo[0] * go[0] + gfo[1] * go[1]) / ((go[0] * go[0] + go[1] * go[1]) || 1);
      return roHead() +
        '<div class="sinC">f(P) = <b>' + fmt(f4(px, py)) + '</b>&ensp;∇f = (' + fmtS(gf[0]) + ', ' + fmtS(gf[1]) + ')</div>' +
        '<div class="tanC">|sin∠(∇f, ∇g)| = <b>' + fmt(sn) + '</b>' + t({ zh: '（0 即相切）', en: ' (0 = tangent)' }) + '</div>' +
        '<div class="cotC">f* = <b>' + fmt(O.f) + '</b>&ensp;λ = ' + fmtS(lam) + '</div>' +
        '<div class="dim">' + t(O.inside
          ? { zh: 'min f 落在圆内：约束不起作用', en: 'min f lies inside the circle: constraint inactive' }
          : { zh: '最优点处 f 的等高线与约束圆相切', en: 'at the optimum the contour of f is tangent to the circle' }) + '</div>';
    }
  }
};
/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 步进时钟：n = ⌊ωt⌋ 推进四条下降轨道               ║
   ║  原则：手动模式下轨道只追加"当时的真实位置"，参数中途改变不重算  ║
   ║        旧步，重置（R）时从当前起点重播；驱动模式下整条重播      ║
   ║        （见 orb* 上方注释）                                  ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  if (state.theta === 0) { reseedOrbits(); lastOrbSig = null; }
  const n = nNow();
  /* 「驱动 → 手动」的反向过渡（关掉自动播放，或伸手拖被驱动的那根滑块——
     引擎会当场关掉自动播放）：nNow() 立刻退回 ⌊ωt⌋，可重播留下的长轨道
     不会自己变短，于是读数报 n = 5 而画面画着 60 步，要等 ⌊ωt⌋ 涨过
     ORBIT_SHOW 才自愈（valley/convex 约 50 秒）。每帧把轨道裁到 n（只缩不增），
     读数与画面重新同源。裁完之后只追加：手动模式「记录当时的真实值、
     参数中途改变不重算旧步」的语义从这一帧起完整成立，未被破坏。 */
  trimOrbits(n);
  const S = SURF3[Math.round(state.surfSel)];
  /* 驱动接管且入参变了 → 丢掉旧轨迹，用当前参数从 x₀ 重播，
     避免画出一条与读数不同源的陈旧轨迹 */
  const sig = orbSig();
  if (driveInfo() && sig !== lastOrbSig) reseedOrbits();
  lastOrbSig = sig;
  while (orb1.length - 1 < n) {
    orb1.push(gdStep1(orb1[orb1.length - 1]));
    orbA.push(gdStep2(orbA[orbA.length - 1], g2));
    orbB1.push(gdStep2(orbB1[orbB1.length - 1], S.g));
    orbB2.push(gdStep2(orbB2[orbB2.length - 1], S.g));
  }
  const xk = orb1[orb1.length - 1], pA = orbA[orbA.length - 1];
  samples.push({
    t: state.t,
    loss1: isFinite(xk) ? f1(xk) : Infinity,                              /* 当时的一维损失 */
    lossA: (pA && isFinite(pA[0]) && isFinite(pA[1])) ? f2(pA[0], pA[1]) : Infinity  /* 当时的谷地损失 */
  });
}

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
