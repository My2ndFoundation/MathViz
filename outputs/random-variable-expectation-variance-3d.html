<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'random-variable-expectation-variance-3d',
  title: { zh: '随机变量、期望与方差 · 概率质量的平衡点', en: 'Random Variables · Expectation & Variance' },
  h1:    { zh: '随机变量 · 期望 · 方差', en: 'Random Variables' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'preset', label: { zh: '分布预设',           en: 'Distribution preset' }, min: 1,    max: 3,   step: 1,    value: 1,   fmt: v => t(PRESET_NAMES[Math.round(v) - 1]) },
  { key: 'skew',   label: { zh: '偏斜程度 <i>s</i>',  en: 'Skew <i>s</i>' },       min: -1.5, max: 1.5, step: 0.05, value: 0,   fmt: v => fmtS(v) },
  { key: 'pivot',  label: { zh: '支点位置 <i>c</i>',  en: 'Pivot <i>c</i>' },      min: 1,    max: 6,   step: 0.05, value: 3.5, fmt: v => fmt(v) },
  { key: 'a',      label: { zh: '缩放 <i>a</i>',      en: 'Scale <i>a</i>' },      min: -1.5, max: 1.5, step: 0.05, value: 1,   fmt: v => fmtS(v) },
  { key: 'b',      label: { zh: '平移 <i>b</i>',      en: 'Shift <i>b</i>' },      min: -2,   max: 2,   step: 0.1,  value: 0,   fmt: v => fmtS(v) },
  { key: 'omega',  label: { zh: '抽样速度 <i>ω</i>',  en: 'Sampling rate <i>ω</i>' }, min: 0.5, max: 4, step: 0.1,  value: 2,   fmt: v => fmt(v, 1) + ' rad/s' }
];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：随机变量数学与绘图助手（引擎之上，引擎零改动） ────── */
const ROSE_A = 'rgba(251,113,133,';
const VIO_A = 'rgba(167,139,250,';
const EME_A = 'rgba(52,211,153,';
const ORG_A = 'rgba(251,146,60,';
const CYAN_A = 'rgba(45,212,234,';
const AMB_A = 'rgba(251,191,36,';

/* 取值 1..6 的离散分布：数轴世界坐标与高度缩放 */
const XS = [1, 2, 3, 4, 5, 6];
const SX = 0.9, HS = 2.6;
const xw = v => (v - 3.5) * SX;

/* 分布预设 × 偏斜：权重 wᵢ = baseᵢ · exp(s·(i−2.5))，随后归一化——
   任何参数组合下 Σpᵢ ≡ 1（参数化本身保证总和不被破坏） */
const PRESETS = [
  [1, 1, 1, 1, 1, 1],
  [1, 0.62, 0.38, 0.24, 0.15, 0.09],
  [4, 1, 0.35, 0.35, 1, 4]
];
const PRESET_NAMES = [
  { zh: '公平骰子', en: 'Fair die' },
  { zh: '偏斜分布', en: 'Skewed' },
  { zh: '双峰分布', en: 'Bimodal' }
];
function pmf() {
  const base = PRESETS[Math.round(state.preset) - 1];
  const s = state.skew;
  const w = base.map((bw, i) => bw * Math.exp(s * (i - 2.5) * 0.8));
  const Z = w.reduce((acc, x) => acc + x, 0);
  return w.map(x => x / Z);
}
function statsOf(xs, p) {
  let mu = 0;
  for (let i = 0; i < xs.length; i++) mu += p[i] * xs[i];
  let va = 0, mad = 0;
  for (let i = 0; i < xs.length; i++) {
    const d = xs[i] - mu;
    va += p[i] * d * d;
    mad += p[i] * Math.abs(d);
  }
  return { mu: mu, va: va, sd: Math.sqrt(va), mad: mad };
}
/* 独立同分布之和 X₁+X₂ 的分布（卷积）：q[k] 对应取值 k+2 */
function convSelf(p) {
  const q = new Array(11).fill(0);
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) q[i + j] += p[i] * p[j];
  return q;
}

/* 页签一（从结果到随机变量）：固定样本空间——抛三枚硬币，X = 正面次数。
   四个取值按启用顺序取色 rose → violet → emerald → orange（一值一色，六处同源） */
const COIN = [
  { lab: { zh: '正正正', en: 'HHH' }, x: 3 },
  { lab: { zh: '正正反', en: 'HHT' }, x: 2 },
  { lab: { zh: '正反正', en: 'HTH' }, x: 2 },
  { lab: { zh: '反正正', en: 'THH' }, x: 2 },
  { lab: { zh: '正反反', en: 'HTT' }, x: 1 },
  { lab: { zh: '反正反', en: 'THT' }, x: 1 },
  { lab: { zh: '反反正', en: 'TTH' }, x: 1 },
  { lab: { zh: '反反反', en: 'TTT' }, x: 0 }
];
const COINP = [1 / 8, 3 / 8, 3 / 8, 1 / 8];
const COINF = ['1/8', '3/8', '3/8', '1/8'];
const VAL_A = [ROSE_A, VIO_A, EME_A, ORG_A];
const outY = i => 1.61 - i * 0.46;
const valY = k => -1.35 + k * 0.9;

/* 量尺（横杆 + 端刺 + 标签），σ / MAD / |a|σ 通用 */
function drawRuler(C, x0, x1, y, text, colA) {
  line3(C, [x0, y, 0], [x1, y, 0], { width: 1.2, color: colA + '0.75)' });
  line3(C, [x0, y - 0.06, 0], [x0, y + 0.06, 0], { width: 1.2, color: colA + '0.75)' });
  line3(C, [x1, y - 0.06, 0], [x1, y + 0.06, 0], { width: 1.2, color: colA + '0.75)' });
  label3(C, [(x0 + x1) / 2, y - 0.24, 0], text, { font: 'italic 10.5px ' + FONT_MATH, color: colA + '0.9)', align: 'center' });
}

/* 视角联动：选中视角时自动开启对应开关（同步面板复选框） */
function enableKey(key) {
  if (state[key]) return;
  state[key] = true;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = true; });
}

/* 每个滑杆归属的页签（未列出者在所有页签显示）——场景级 UI 辅助（不改引擎函数）：
   一个独立的 rAF 轮询在页签切换时更新 .ctl 行显隐，与 PARAMS 顺序一一对应
   （paramsHost 的第 i 个子节点即 PARAMS[i]） */
const PARAM_TABS = {
  preset: ['expect', 'vari', 'lin'],
  skew:   ['expect', 'vari', 'lin'],
  pivot:  ['expect'],
  a:      ['lin'],
  b:      ['lin'],
  omega:  ['map', 'expect']
};
let _paramSyncTab = null;
function syncParamRows() {
  if (curTab === _paramSyncTab) return;
  const host = document.getElementById('paramsHost');
  if (!host || host.children.length < PARAMS.length) return;
  _paramSyncTab = curTab;
  PARAMS.forEach((p, i) => {
    const row = host.children[i];
    if (!row) return;
    const tabs = PARAM_TABS[p.key];
    row.style.display = (!tabs || tabs.indexOf(curTab) !== -1) ? '' : 'none';
  });
}
/* 首帧后启动（此时引擎已完成同步初始化，curTab 已就绪，避免 TDZ） */
requestAnimationFrame(function _paramSyncLoop() { syncParamRows(); requestAnimationFrame(_paramSyncLoop); });

const SCENES = {

  /* ────── 一：从结果到随机变量 ────── */
  map: {
    label: { zh: '从结果到随机变量', en: 'Outcome → number' },
    params: ['omega'],
    brand: { zh: '随机变量 X 不是「会变的未知数」，而是一个函数：把样本空间 Ω 里的每个结果映射成一个数。抛三枚硬币、令 X = 正面次数——八个结果汇入四个数。',
             en: 'A random variable X is not "a letter that varies" — it is a function assigning a number to every outcome in the sample space Ω. Toss three coins with X = number of heads: eight outcomes flow into four numbers.' },
    tips: { zh: '提示：切「正视 映射」看三支同色箭头汇入同一个数——X(正正反) = X(正反正) = X(反正正) = 2：不同结果，同一取值；p(2) = 3/8 正是这三支箭头份额之和。',
            en: 'Tip: in "Front: mapping", watch three same-colored arrows merge into one number — X(HHT) = X(HTH) = X(THH) = 2: different outcomes, one value; p(2) = 3/8 is exactly the sum of those three arrow shares.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },             az: -0.65, el: 0.3,  dist: 9.5, tx: 0, ty: 0.2, tz: 0 },
      front: { label: { zh: '正视 映射', en: 'Front: mapping' }, az: 0.001, el: 0.02, dist: 7.5, tx: 0, ty: 0.2, tz: 0 }
    },
    toggles: [
      { key: 'showMap',  label: { zh: '映射箭头 <i>X</i>(ω)', en: 'Mapping arrows <i>X</i>(ω)' }, color: '#cbd5e1', checked: true },
      { key: 'showPmf',  label: { zh: '概率质量 <i>p</i>(<i>x</i>)', en: 'Prob. mass <i>p</i>(<i>x</i>)' }, color: '#fb7185', checked: true },
      { key: 'showDraw', label: { zh: '随机抽样', en: 'Random draws' }, color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      if (state.showGrid) drawGridXY(C, 2.5, 0.5);

      /* 样本空间 Ω（青色源几何：一列结果点） */
      label3(C, [-2.6, 2.05, 0], t({ zh: '样本空间 Ω', en: 'Sample space Ω' }), { size: 12, color: '#2dd4ea', align: 'center' });
      for (let i = 0; i < 8; i++) {
        const oy = outY(i);
        const hot = state.showDraw && sim.coinCur === i && state.t - sim.coinBorn < 0.7;
        const sp = proj(C, [-2.6, oy, 0]);
        if (sp) glowDot(sp, hot ? 9 : 6, '#ffffff', CYAN_A + (hot ? '0.95)' : '0.55)'));
        label3(C, [-2.8, oy, 0], t(COIN[i].lab), { size: 11, color: hot ? '#bfefff' : 'rgba(159,176,200,.8)', align: 'right' });
      }

      /* 值域数轴（竖直）与四个取值 */
      line3(C, [1.7, -1.75, 0], [1.7, 1.95, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [1.7, 1.95, 0], [1.7, 1.75, 0], AXIS);
      label3(C, [1.7, 2.15, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (let k = 0; k < 4; k++) {
        const vy = valY(k);
        line3(C, [1.62, vy, 0], [1.78, vy, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [1.5, vy, 0], String(k), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
        const dp = proj(C, [1.7, vy, 0]);
        if (dp) glowDot(dp, 8, '#ffffff', VAL_A[k] + '0.85)');
      }

      /* 映射箭头：X 是函数——多个结果可以射向同一个数 */
      if (state.showMap) {
        label3(C, [-0.5, 2.05, 0], t({ zh: 'X(ω) = 正面朝上的次数', en: 'X(ω) = number of heads' }),
          { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        for (let i = 0; i < 8; i++) {
          const k = COIN[i].x, oy = outY(i), vy = valY(k);
          const hot = state.showDraw && sim.coinCur === i && state.t - sim.coinBorn < 0.7;
          line3(C, [-2.45, oy, 0], [1.58, vy, 0], { width: hot ? 2.4 : 1.3, color: VAL_A[k] + (hot ? '0.95)' : '0.38)') });
          arrowAt(C, [1.58, vy, 0], [-2.45 + 3.63, oy + (vy - oy) * 0.9, 0], VAL_A[k] + (hot ? '0.95)' : '0.5)'));
        }
      }

      /* 概率质量条（一值一色）+ E(X) 标记 */
      if (state.showPmf) {
        for (let k = 0; k < 4; k++) {
          const vy = valY(k), len = COINP[k] * 3.0;
          line3(C, [1.85, vy, 0], [1.85 + len, vy, 0], { width: 12, color: VAL_A[k] + '0.3)' });
          line3(C, [1.82 + len, vy, 0], [1.85 + len, vy, 0], { width: 12, color: VAL_A[k] + '0.85)' });
          label3(C, [1.98 + len, vy, 0], 'p = ' + COINF[k], { font: 'italic 10.5px ' + FONT_MATH, color: VAL_A[k] + '0.95)', align: 'left' });
        }
        line3(C, [1.5, valY(1.5), 0], [1.9, valY(1.5), 0], { width: 1.3, dash: [5, 5], color: AMB_A + '0.8)' });
        label3(C, [1.36, valY(1.5), 0], 'E(X) = 1.5', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'right' });
      }
    },
    readout() {
      const n = sim.coinN, cur = sim.coinCur;
      const CLS = ['sinC', 'cosC', 'tanC', 'cotC'];
      let h = '<div>' + t({ zh: '已抽 ', en: 'draws ' }) + '<b>' + n + '</b>' +
        (cur >= 0 ? '&ensp;·&ensp;' + t(COIN[cur].lab) + ' → X = <b>' + COIN[cur].x + '</b>' : '') + '</div>';
      for (let k = 0; k < 4; k++) {
        h += '<div class="' + CLS[k] + '">P(X=' + k + ') = ' + COINF[k] + ' = <b>' + fmt(COINP[k], 3) + '</b>' +
          (n > 0 ? '<span class="dim">&ensp;' + t({ zh: '频率 ', en: 'freq ' }) + fmt(sim.coinCnt[k] / n) + '</span>' : '') + '</div>';
      }
      return h + '<div class="dim">' + t({ zh: 'X 是函数：多个结果 → 同一个数', en: 'X is a function: many outcomes → one number' }) + '</div>';
    }
  },

  /* ────── 二：期望作为重心 ────── */
  expect: {
    label: { zh: '期望 · 重心', en: 'Expectation' },
    params: ['preset', 'skew', 'pivot', 'omega'],
    brand: { zh: '把 pᵢ 当作放在数轴 xᵢ 处的质量块，E(X) = Σxᵢpᵢ 就是它们的重心。支点放在 μ 上，杠杆纹丝不动；放偏一点，杆立刻倾斜。',
             en: 'Treat each pᵢ as a mass resting at xᵢ on the number line: E(X) = Σxᵢpᵢ is their center of mass. Put the fulcrum at μ and the beam rests level; move it off by a little and the beam tips.' },
    tips: { zh: '提示：切「正视 数轴」拖支点 c——只有 c = μ 时杆才平衡；再看翠绿的抽样平均 x̄ 慢慢爬向琥珀色的 μ（大数定律）。公平骰子 μ = 3.5：期望不必是任何一个可能的结果。',
            en: 'Tip: in "Front: axis", drag the pivot c — the beam balances only at c = μ; then watch the emerald sample mean x̄ crawl toward the amber μ (law of large numbers). For a fair die μ = 3.5: an expectation need not be a possible outcome.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.7,  el: 0.32, dist: 10, tx: 0, ty: 0.3, tz: 0 },
      front: { label: { zh: '正视 数轴', en: 'Front: axis' }, az: 0.001, el: 0.02, dist: 8,  tx: 0, ty: 0.3, tz: 0 }
    },
    toggles: [
      { key: 'showMass', label: { zh: '概率质量块', en: 'Probability masses' }, color: '#fb7185', checked: true },
      { key: 'showBal',  label: { zh: '支点与 <i>μ</i>', en: 'Fulcrum & <i>μ</i>' }, color: '#fbbf24', checked: true },
      { key: 'showAvg',  label: { zh: '抽样平均 <i>x̄</i>', en: 'Sample mean <i>x̄</i>' }, color: '#34d399', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const pm = pmf(), st = statsOf(XS, pm);
      const c = state.pivot, cw = xw(c), mw = xw(st.mu);
      let tq = 0;
      for (let i = 0; i < 6; i++) tq += pm[i] * (XS[i] - c);
      const A = clamp(-0.12 * tq, -0.15, 0.15), ca = Math.cos(A), sa = Math.sin(A);
      const rot = (x, y) => { const dx = x - cw; return [cw + dx * ca - y * sa, dx * sa + y * ca, 0]; };

      if (state.showGrid) drawGridXY(C, 3, 1);

      /* 杠杆：数轴本身就是天平杆（绕支点倾斜） */
      line3(C, rot(xw(0.4), 0), rot(xw(6.6), 0), { width: 5.5, color: 'rgba(241,245,249,0.13)' });
      line3(C, rot(xw(0.4), 0), rot(xw(6.6), 0), { width: 2, color: 'rgba(241,245,249,0.92)' });
      for (let v = 1; v <= 6; v++) {
        const bx = xw(v);
        line3(C, rot(bx, -0.06), rot(bx, 0.06), { width: 1.2, color: AXIS_DIM });
        label3(C, rot(bx, -0.28), String(v), { size: 10, color: 'rgba(159,176,200,.7)', align: 'center' });
      }

      /* 概率质量块（玫红）：高度 = pᵢ */
      if (state.showMass) {
        for (let i = 0; i < 6; i++) {
          const bx = xw(XS[i]), h = pm[i] * HS;
          line3(C, rot(bx, 0.05), rot(bx, 0.05 + h), { width: 16, color: ROSE_A + '0.3)' });
          line3(C, rot(bx, Math.max(0.05, h)), rot(bx, 0.05 + h), { width: 16, color: ROSE_A + '0.85)' });
          label3(C, rot(bx, 0.3 + h), fmt(pm[i]), { size: 10, color: ROSE_A + '0.9)', align: 'center' });
        }
        label3(C, [xw(0.6), 2.25, 0], 'E(X) = Σ xᵢ pᵢ', { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'left' });
      }

      /* 支点（琥珀三角）与 μ 标记 */
      if (state.showBal) {
        strokePoly(C, [[cw - 0.17, -0.36, 0], [cw, -0.04, 0], [cw + 0.17, -0.36, 0], [cw - 0.17, -0.36, 0]],
          { width: 1.6, color: AMB_A + '0.9)' });
        label3(C, [cw, -0.58, 0], 'c = ' + fmt(c), { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        line3(C, [mw, -0.85, 0], [mw, 1.95, 0], { width: 1.3, dash: [5, 5], color: AMB_A + '0.55)' });
        label3(C, [mw, 2.1, 0], 'μ = E(X) = ' + fmt(st.mu), { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        const bp = proj(C, rot(mw, 0.02));
        if (bp) glowDot(bp, 9, '#ffffff', AMB_A + '0.9)');
        if (Math.abs(tq) < 0.015) {
          label3(C, [cw, -1.05, 0], t({ zh: '平衡', en: 'balanced' }), { size: 11, color: '#34d399', align: 'center' });
        }
      }

      /* 抽样平均 x̄（翠绿）与落珠：长期平均 → 期望 */
      if (state.showAvg && sim.dieN > 0) {
        const m = sim.dieSum / sim.dieN, aw = xw(m);
        line3(C, [aw, -1.6, 0], [aw, -0.5, 0], { width: 1.5, color: EME_A + '0.7)' });
        arrowAt(C, [aw, -0.5, 0], [aw, -0.8, 0], EME_A + '0.9)');
        const ap = proj(C, rot(aw, 0.02));
        if (ap) glowDot(ap, 8, '#ffffff', EME_A + '0.85)');
        label3(C, [aw, -1.82, 0], 'x̄ = ' + fmt(m) + ' (n = ' + sim.dieN + ')',
          { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'center' });
        const age = state.t - sim.dieBorn;
        if (age < 0.5 && sim.dieCur > 0) {
          const k = age / 0.5, bx = xw(sim.dieCur), land = rot(bx, 0.08);
          const px = bx + (land[0] - bx) * k, py = 2.3 + (land[1] - 2.3) * k * k;
          const sp = proj(C, [px, py, 0]);
          if (sp) glowDot(sp, 6, '#ffffff', EME_A + (0.9 - 0.5 * k).toFixed(2) + ')');
        }
      }
    },
    readout() {
      const pm = pmf(), st = statsOf(XS, pm);
      let tq = 0;
      for (let i = 0; i < 6; i++) tq += pm[i] * (XS[i] - state.pivot);
      let h = '<div>μ = E(X) = Σxᵢpᵢ = <b>' + fmt(st.mu) + '</b>&ensp;<span class="dim">· ' + t(PRESET_NAMES[Math.round(state.preset) - 1]) + '</span></div>';
      h += '<div><span style="color:#fbbf24">' + t({ zh: '净力矩 ', en: 'net torque ' }) + 'Σpᵢ(xᵢ−c) = <b>' + fmtS(tq, 3) + '</b></span>' +
        (Math.abs(tq) < 0.015 ? '<span class="tanC">&ensp;<b>' + t({ zh: '平衡', en: 'balanced' }) + '</b></span>' : '') + '</div>';
      h += '<div class="tanC">x̄ = ' + (sim.dieN > 0 ? '<b>' + fmt(sim.dieSum / sim.dieN) + '</b> (n = ' + sim.dieN + ')' : '<b>—</b>') + '</div>';
      const attain = Math.abs(st.mu - Math.round(st.mu)) < 0.01;
      return h + '<div class="dim">' + t(attain
        ? { zh: '期望是平衡点，不预言单次结果', en: 'expectation balances the mass — it predicts no single trial' }
        : { zh: 'μ 不是任何可能取值——期望是平衡点，不是必然结果', en: 'μ is not an attainable value — a balance point, not an outcome' }) + '</div>';
    }
  },

  /* ────── 三：方差与标准差 ────── */
  vari: {
    label: { zh: '方差 · 标准差', en: 'Variance' },
    params: ['preset', 'skew'],
    brand: { zh: '方差量的是概率质量对平衡点的散开程度：Var(X) = Σpᵢ(xᵢ−μ)²——每个取值到 μ 的距离先平方、再按概率加权。标准差 σ = √Var 把平方拉回原单位。',
             en: 'Variance measures how the probability mass spreads about its balance point: Var(X) = Σpᵢ(xᵢ−μ)² — square each distance to μ, then weight by probability. The standard deviation σ = √Var returns to the original units.' },
    tips: { zh: '提示：紫色正方形的边是 |xᵢ−μ|、面积是平方距离，深浅是概率权重；琥珀虚线方块面积恰为 σ²，它的边 σ 直接量在数轴上（μ±σ 量尺）。打开「平均绝对距离」对比——数值相近，定义不同，别混淆。',
            en: 'Tip: each violet square has side |xᵢ−μ| — its area is the squared distance, its opacity the probability weight; the dashed amber square has area exactly σ², so its side σ lies right on the axis (the μ±σ ruler). Toggle "Mean absolute distance" to compare — close in value, different by definition.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },          az: -0.6,  el: 0.3,  dist: 11, tx: 0, ty: 0.6, tz: 0 },
      front: { label: { zh: '正视 数轴', en: 'Front: axis' }, az: 0.001, el: 0.02, dist: 10, tx: 0, ty: 0.7, tz: 0 }
    },
    toggles: [
      { key: 'showMass', label: { zh: '概率质量块', en: 'Probability masses' }, color: '#fb7185', checked: true },
      { key: 'showSq',   label: { zh: '平方距离 (<i>x</i>ᵢ−<i>μ</i>)²', en: 'Squared distances' }, color: '#a78bfa', checked: true },
      { key: 'showSig',  label: { zh: '<i>σ</i> 与 <i>σ</i>²', en: '<i>σ</i> & <i>σ</i>²' }, color: '#fbbf24', checked: true },
      { key: 'showMad',  label: { zh: '平均绝对距离对比', en: 'Mean absolute distance' }, color: '#34d399', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const pm = pmf(), st = statsOf(XS, pm), mw = xw(st.mu);
      const pmax = Math.max.apply(null, pm);

      /* 数轴 */
      line3(C, [xw(0.4), 0, 0], [xw(6.6), 0, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [xw(6.6), 0, 0], [xw(6.4), 0, 0], AXIS);
      label3(C, [xw(6.95), 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (let v = 1; v <= 6; v++) {
        const bx = xw(v);
        line3(C, [bx, -0.06, 0], [bx, 0.06, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [bx, -0.22, 0], String(v), { size: 10, color: 'rgba(159,176,200,.7)', align: 'center' });
      }

      /* 概率质量（玫红，挂在数轴下方，让上方留给平方距离） */
      if (state.showMass) {
        for (let i = 0; i < 6; i++) {
          const bx = xw(XS[i]), h = pm[i] * 1.6;
          line3(C, [bx, -0.42, 0], [bx, -0.42 - h, 0], { width: 12, color: ROSE_A + '0.3)' });
          line3(C, [bx, -0.42 - h, 0], [bx, -0.39 - h, 0], { width: 12, color: ROSE_A + '0.85)' });
        }
        label3(C, [xw(0.5), -0.65, 0], 'pᵢ', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'right' });
      }

      /* μ（琥珀虚线） */
      line3(C, [mw, -0.75, 0], [mw, 2.35, 0], { width: 1.3, dash: [5, 5], color: AMB_A + '0.55)' });
      label3(C, [mw, 2.5, 0], 'μ = ' + fmt(st.mu), { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });

      /* 平方距离方块（紫）：边 |xᵢ−μ|，面积 (xᵢ−μ)²，透明度 = 权重 pᵢ */
      if (state.showSq) {
        for (let i = 0; i < 6; i++) {
          const bx = xw(XS[i]), s = Math.abs(bx - mw);
          if (s < 0.03) continue;
          const x0 = Math.min(bx, mw), x1 = Math.max(bx, mw);
          const al = 0.16 + 0.6 * pm[i] / pmax;
          strokePoly(C, [[x0, 0.06, 0], [x1, 0.06, 0], [x1, 0.06 + s, 0], [x0, 0.06 + s, 0], [x0, 0.06, 0]],
            { width: 1.4, color: VIO_A + al.toFixed(2) + ')' });
        }
        label3(C, [xw(6.7), 2.0, 0], 'Var(X) = Σ pᵢ (xᵢ−μ)²', { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
        label3(C, [xw(6.7), 1.72, 0], t({ zh: '深浅 = 权重 pᵢ', en: 'opacity = weight pᵢ' }), { size: 10.5, color: VIO_A + '0.75)', align: 'center' });
      }

      /* σ 方块（琥珀虚线，面积恰为 σ²）与 μ±σ 量尺 */
      if (state.showSig) {
        const sw = st.sd * SX;
        strokePoly(C, [[mw, 0.06, 0], [mw + sw, 0.06, 0], [mw + sw, 0.06 + sw, 0], [mw, 0.06 + sw, 0], [mw, 0.06, 0]],
          { width: 1.6, dash: [5, 6], color: AMB_A + '0.9)' });
        label3(C, [mw + sw / 2, 0.06 + sw / 2, 0], 'σ²', { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        drawRuler(C, mw - sw, mw + sw, -2.45, 'μ ± σ · σ = ' + fmt(st.sd), AMB_A);
      }

      /* 平均绝对距离（翠绿量尺，仅作直觉对比） */
      if (state.showMad) {
        const md = st.mad * SX;
        drawRuler(C, mw - md, mw + md, -2.05, 'μ ± E|X−μ| = ±' + fmt(st.mad), EME_A);
      }
    },
    readout() {
      const pm = pmf(), st = statsOf(XS, pm);
      return '<div>μ = <b>' + fmt(st.mu) + '</b></div>' +
        '<div class="cosC">Var(X) = Σpᵢ(xᵢ−μ)² = <b>' + fmt(st.va) + '</b></div>' +
        '<div><span style="color:#fbbf24">σ = √Var = <b>' + fmt(st.sd) + '</b></span></div>' +
        '<div class="tanC">E|X−μ| = <b>' + fmt(st.mad) + '</b>' + t({ zh: '（对比用）', en: ' (for comparison)' }) + '</div>' +
        '<div class="dim">' + t({ zh: 'σ 与 x 同单位：μ±σ 直接画在数轴上', en: 'σ shares x’s units: μ±σ sits right on the axis' }) + '</div>';
    }
  },

  /* ────── 四：线性变换与独立求和 ────── */
  lin: {
    label: { zh: '线性变换 · 求和', en: 'aX+b · sums' },
    params: ['preset', 'skew', 'a', 'b'],

            en: 'Tip: face-on, drag b — the violet distribution slides as a whole while the σ ruler never stretches; drag a and the ruler scales to |a|σ. Switch to "Front: with sum": add two independent dice — means add and variances add (σ grows only by √2) — and adding variances holds only under independence.' },
    views: {
      iso:   { label: { zh: '立体',        en: '3D' },              az: -0.6,  el: 0.3,  dist: 13,   tx: 0, ty: -0.5, tz: 0 },
      front: { label: { zh: '正视 数轴',   en: 'Front: axis' },     az: 0.001, el: 0.02, dist: 11,   tx: 0, ty: -0.5, tz: 0 },
      sum:   { label: { zh: '正视 含独立和', en: 'Front: with sum' }, az: 0.001, el: 0.02, dist: 13.5, tx: 0, ty: -0.8, tz: 0,
               onSelect: () => enableKey('showSum') }
    },
    toggles: [
      { key: 'showX',    label: { zh: '<i>X</i> 的分布', en: '<i>X</i>' }, color: '#fb7185', checked: true },
      { key: 'showY',    label: { zh: '<i>Y</i> = <i>aX</i>+<i>b</i>', en: '<i>Y</i> = <i>aX</i>+<i>b</i>' }, color: '#a78bfa', checked: true },
      { key: 'showArr',  label: { zh: '映射箭头', en: 'Mapping arrows' }, color: '#cbd5e1', checked: true },
      { key: 'showMeas', label: { zh: '期望与 <i>σ</i> 量尺', en: '<i>E</i> & <i>σ</i> rulers' }, color: '#fbbf24', checked: true },
      { key: 'showSum',  label: { zh: '独立和 <i>X</i>₁+<i>X</i>₂', en: 'Sum <i>X</i>₁+<i>X</i>₂' }, color: '#34d399', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const pm = pmf(), st = statsOf(XS, pm), a = state.a, b = state.b;
      const HB = 2.0, yX = 1.6, yY = -0.7, yS = -3.0;
      /* 本页签用更紧的共享尺（0.62/单位），保证 a、b 的全部范围都在正视视野内；
         三行同一比例——σ 与 |a|σ、√2σ 可直接对比 */
      const SL = 0.62;
      const xl = u => (u - 1.5) * SL;
      const yv = XS.map(v => a * v + b);
      const muY = a * st.mu + b;

      /* X 行（玫红） */
      line3(C, [xl(0.4), yX, 0], [xl(6.6), yX, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [xl(6.6), yX, 0], [xl(6.4), yX, 0], AXIS);
      label3(C, [xl(7.1), yX, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (let v = 1; v <= 6; v++) {
        const bx = xl(v);
        line3(C, [bx, yX - 0.05, 0], [bx, yX + 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [bx, yX - 0.22, 0], String(v), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
      if (state.showX) {
        for (let i = 0; i < 6; i++) {
          const bx = xl(XS[i]), h = pm[i] * HB;
          line3(C, [bx, yX + 0.04, 0], [bx, yX + 0.04 + h, 0], { width: 14, color: ROSE_A + '0.3)' });
          line3(C, [bx, yX + 0.01 + h, 0], [bx, yX + 0.04 + h, 0], { width: 14, color: ROSE_A + '0.85)' });
        }
        label3(C, [xl(0.5), yX + 1.0, 0], 'X', { font: 'italic 14px ' + FONT_MATH, color: '#fb7185', align: 'right' });
      }

      /* Y 行（紫）：同一把尺——间距被 a 拉伸，高度（概率）原封不动 */
      const wx0 = Math.min(xl(Math.min.apply(null, yv)) - 0.35, xl(0.4));
      const wx1 = Math.max(xl(Math.max.apply(null, yv)) + 0.35, xl(6.6));
      line3(C, [wx0, yY, 0], [wx1, yY, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [wx1, yY, 0], [wx1 - 0.2, yY, 0], AXIS);
      label3(C, [wx1 + 0.32, yY, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      const lo = Math.ceil(Math.min.apply(null, yv)), hi = Math.floor(Math.max.apply(null, yv));
      const stp = hi - lo > 9 ? 2 : 1;
      for (let u = lo; u <= hi; u += stp) {
        const bx = xl(u);
        line3(C, [bx, yY - 0.05, 0], [bx, yY + 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [bx, yY - 0.22, 0], (u < 0 ? '−' : '') + Math.abs(u), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
      if (state.showY) {
        for (let i = 0; i < 6; i++) {
          const bx = xl(yv[i]), h = pm[i] * HB;
          line3(C, [bx, yY + 0.04, 0], [bx, yY + 0.04 + h, 0], { width: 14, color: VIO_A + '0.3)' });
          line3(C, [bx, yY + 0.01 + h, 0], [bx, yY + 0.04 + h, 0], { width: 14, color: VIO_A + '0.85)' });
        }
        label3(C, [wx0 + 0.1, yY + 1.0, 0], 'Y = aX + b', { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'left' });
      }

      /* 映射箭头 xᵢ → a·xᵢ + b */
      if (state.showArr) {
        for (let i = 0; i < 6; i++) {
          const x0 = xl(XS[i]), x1 = xl(yv[i]);
          line3(C, [x0, yX - 0.06, 0], [x1, yY + 0.1, 0], { width: 1.2, dash: [4, 5], color: 'rgba(203,213,225,0.35)' });
          arrowAt(C, [x1, yY + 0.1, 0], [x0 + (x1 - x0) * 0.9, yX - 0.06 + (yY + 0.1 - yX + 0.06) * 0.9, 0], 'rgba(203,213,225,0.5)');
        }
      }

      /* 期望映射与 σ 量尺（琥珀） */
      if (state.showMeas) {
        const mxw = xl(st.mu), myw = xl(muY);
        const sw = st.sd * SL, swY = Math.abs(a) * st.sd * SL;
        const p1 = proj(C, [mxw, yX, 0]);
        if (p1) glowDot(p1, 8, '#ffffff', AMB_A + '0.9)');
        const p2 = proj(C, [myw, yY, 0]);
        if (p2) glowDot(p2, 8, '#ffffff', AMB_A + '0.9)');
        line3(C, [mxw, yX - 0.06, 0], [myw, yY + 0.06, 0], { width: 1.5, dash: [7, 7], color: AMB_A + '0.7)' });
        arrowAt(C, [myw, yY + 0.06, 0], [mxw + (myw - mxw) * 0.9, yX - 0.06 + (yY + 0.12 - yX) * 0.9, 0], AMB_A + '0.85)');
        label3(C, [(mxw + myw) / 2 + 0.18, (yX + yY) / 2, 0], 'E(Y) = aE(X) + b',
          { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'left' });
        drawRuler(C, mxw - sw, mxw + sw, yX - 0.5, 'σ', AMB_A);
        if (swY > 0.02) drawRuler(C, myw - swY, myw + swY, yY - 0.5, '|a|σ', AMB_A);
      }

      /* 独立求和（翠绿）：X₁+X₂ 的分布（卷积），期望相加、方差相加 */
      if (state.showSum) {
        const q = convSelf(pm);
        const xw2 = u => (u - 7) * SL;
        line3(C, [xw2(1.2), yS, 0], [xw2(12.8), yS, 0], { width: 1.4, color: AXIS });
        arrowAt(C, [xw2(12.8), yS, 0], [xw2(12.6), yS, 0], AXIS);
        for (let u = 2; u <= 12; u += 2) {
          const bx = xw2(u);
          line3(C, [bx, yS - 0.05, 0], [bx, yS + 0.05, 0], { width: 1.2, color: AXIS_DIM });
          label3(C, [bx, yS - 0.22, 0], String(u), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
        }
        for (let k = 0; k < 11; k++) {
          const bx = xw2(k + 2), h = q[k] * HB;
          line3(C, [bx, yS + 0.04, 0], [bx, yS + 0.04 + h, 0], { width: 12, color: EME_A + '0.3)' });
          line3(C, [bx, yS + 0.01 + h, 0], [bx, yS + 0.04 + h, 0], { width: 12, color: EME_A + '0.85)' });
        }
        label3(C, [xw2(1.2), yS + 1.0, 0], 'X₁ + X₂', { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'left' });
        const ms = xw2(2 * st.mu), ss = Math.SQRT2 * st.sd * SL;
        const p3 = proj(C, [ms, yS, 0]);
        if (p3) glowDot(p3, 8, '#ffffff', AMB_A + '0.9)');
        if (state.showMeas) drawRuler(C, ms - ss, ms + ss, yS - 0.5, '√2·σ', AMB_A);
      }
    },
    readout() {
      const pm = pmf(), st = statsOf(XS, pm), a = state.a, b = state.b;
      return '<div class="sinC">E(X) = <b>' + fmt(st.mu) + '</b>&ensp;·&ensp;Var(X) = <b>' + fmt(st.va) + '</b></div>' +
        '<div class="cosC">E(Y) = aE(X)+b = <b>' + fmtS(a * st.mu + b) + '</b>&ensp;·&ensp;Var(Y) = a²Var(X) = <b>' + fmt(a * a * st.va) + '</b></div>' +
        '<div class="tanC">E(X₁+X₂) = 2μ = <b>' + fmt(2 * st.mu) + '</b>&ensp;·&ensp;Var = 2σ² = <b>' + fmt(2 * st.va) + '</b></div>' +
        '<div class="dim">' + t({ zh: '方差相加要求独立：相关时 Var(X+Y) = VarX + VarY + 2Cov', en: 'adding variances needs independence: otherwise Var(X+Y) = VarX + VarY + 2Cov' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 抽样模拟：θ 驱动抽样节奏（速度 ∝ ω）；θ 回退（R 重置）即清空计数重来。
   每次抽样都用「当时的真实分布」——中途改预设或偏斜，已抽的历史计数不重算（§6） */
const sim = { last: 1e9, acc: 0, coinN: 0, coinCnt: [0, 0, 0, 0], coinCur: -1, coinBorn: -1e9,
              dieN: 0, dieSum: 0, dieCur: 0, dieBorn: -1e9 };

function pushSample() {
  if (state.theta < sim.last) {
    sim.coinN = 0; sim.coinCnt = [0, 0, 0, 0]; sim.coinCur = -1; sim.coinBorn = -1e9;
    sim.dieN = 0; sim.dieSum = 0; sim.dieCur = 0; sim.dieBorn = -1e9; sim.acc = 0;
  }
  const dth = Math.max(0, state.theta - Math.min(sim.last, state.theta));
  sim.last = state.theta;

  sim.acc += dth * 1.3;                       // 抽样节拍 ∝ ω（θ 本身按 ω 积分）
  while (sim.acc >= 1) {
    sim.acc -= 1;
    /* 页签一：抛三枚硬币——8 个结果等可能 */
    const ci = Math.floor(Math.random() * 8);
    sim.coinCur = ci; sim.coinBorn = state.t;
    sim.coinCnt[COIN[ci].x]++; sim.coinN++;
    /* 页签二：掷一次骰子——按当时的真实 pᵢ 抽样 */
    const p = pmf();
    let r = Math.random(), di = 0;
    while (di < 5 && r > p[di]) { r -= p[di]; di++; }
    sim.dieCur = di + 1; sim.dieBorn = state.t;
    sim.dieN++; sim.dieSum += di + 1;
  }

  samples.push({ t: state.t });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
