const DUP_S    = 0.80;       /* ② Dupin 指标线的等比缩放（1/√|κn| 的量纲太大） */

const SPH_X    = -2.10;      /* ④ 球冠（内蕴测量）所在 x */
const CYL_X    =  2.30;      /* ④ 卷纸（圆柱）所在 x */
const CYL_L    =  1.20;      /* ④ 卷纸沿母线的半长 */
const FLAT_Y   =  0.015;     /* ④ 摊平件所在高度（略抬起，避免与网格 z-fighting） */
const FLAT_DZ  =  3.00;      /* ④ 摊平件沿 +z 的平移量 */

/* ── 通用小工具 ── */
function fmtInf(x, d) { return Math.abs(x) > 999 ? (x < 0 ? '−∞' : '+∞') : fmtS(x, d == null ? 2 : d); }
/* 折线的三维弦长和 —— 「蚂蚁的卷尺」：只沿曲面上的点量，不用任何外在信息 */
function polyLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) {
    const A = pts[i - 1], B = pts[i];
    if (!A || !B) continue;
    L += Math.hypot(B[0] - A[0], B[1] - A[1], B[2] - A[2]);
  }
  return L;
}
/* 同步开关状态与面板复选框（视角联动用） */
function setTg(key, val) {

  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = val; });

/* ══════ ① 椭圆的曲率、渐屈线与累积转角 ══════ */
function ellPt(t, a, b)    { return [a * Math.cos(t), b * Math.sin(t), 0]; }
function ellSpeed(t, a, b) { const s = Math.sin(t), c = Math.cos(t); return Math.sqrt(a*a*s*s + b*b*c*c); }
/* κ(t) = ab / (a²sin²t + b²cos²t)^{3/2}（由 |r′×r″| / |r′|³ 直接得出，r′×r″ ≡ ab） */
function ellK(t, a, b)     { const s = Math.sin(t), c = Math.cos(t); return a*b / Math.pow(a*a*s*s + b*b*c*c, 1.5); }
/* 渐屈线（曲率中心轨迹）：E(t) = ( (a²−b²)/a·cos³t , (b²−a²)/b·sin³t )，一条星形线 */
function ellEvo(t, a, b) {
  const c = Math.cos(t), s = Math.sin(t);
  return [(a*a - b*b) / a * c*c*c, (b*b - a*a) / b * s*s*s, 0];
}
/* 累积转角的解析原函数：Φ(t) = ∫₀ᵗ κ|r′|dt′ = ∫₀ᵗ ab dt′/(a²sin²+b²cos²)
   = 连续化的 arctan((a/b)·tan t)。用 round 取分支使 Φ 处处连续、单调，
   于是 Φ(t+2π) − Φ(t) ≡ 2π —— 这一步是解析的，但工具里显示的 ∮κ ds 仍取自
   历史采样的差值（见 loopTurn），不靠这条恒等式背书。 */
function turnPhi(t, a, b) {
  const n = Math.round(t / Math.PI);
  return n * Math.PI + Math.atan((a / b) * Math.tan(t - n * Math.PI));
}
/* 从历史采样里实测「上一整圈」的 ∮κ ds：把 th − 2π 处的累积值线性插值出来再作差。
   历史窗口不足一整圈时返回 null（读数显示「—」，绝不假装量到了）。 */
function loopTurn() {
  if (samples.length < 3) return null;
  const now = samples[samples.length - 1];
  const target = now.th - TAU;
  if (samples[0].th > target) return null;
  let i = 0;
  while (i < samples.length - 2 && samples[i + 1].th < target) i++;
  const s0 = samples[i], s1 = samples[i + 1];
  const d = s1.th - s0.th;
  const w = d > 1e-12 ? (target - s0.th) / d : 0;
  return now.turn - (s0.turn + (s1.turn - s0.turn) * w);
}

/* ══════ ②③ 二次曲面 f = ½(κ₁x² + κ₂y²) —— 原点处主曲率恰为 κ₁、κ₂ ══════ */
function surfF(x, y) { return 0.5 * (state.k1 * x * x + state.k2 * y * y); }
function surfW(x, y) { return [x, surfF(x, y), y]; }             /* 数学 (x,y,f) → 世界 */
/* 欧拉公式：κn(θ) = κ₁cos²θ + κ₂sin²θ = H + ((κ₁−κ₂)/2)·cos2θ，周期 π */
function kappaN(th) { const c = Math.cos(th), s = Math.sin(th); return state.k1 * c * c + state.k2 * s * s; }

function surfMesh(D, nl, ns) {
  const pts = [];
  for (let i = 0; i <= nl; i++) {
    const x = -D + 2 * D * i / nl;
    for (let j = 0; j <= ns; j++) pts.push(surfW(x, -D + 2 * D * j / ns));
    pts.push(null);
  }
  for (let j = 0; j <= nl; j++) {
    const y = -D + 2 * D * j / nl;
    for (let i = 0; i <= ns; i++) pts.push(surfW(-D + 2 * D * i / ns, y));
    pts.push(null);
  }
  return pts;
}
function surfRim(D) {
  const pts = [], n = 40;
  for (let i = 0; i <= n; i++) pts.push(surfW(-D + 2 * D * i / n, -D));
  for (let i = 0; i <= n; i++) pts.push(surfW(D, -D + 2 * D * i / n));
  for (let i = 0; i <= n; i++) pts.push(surfW(D - 2 * D * i / n, D));
  for (let i = 0; i <= n; i++) pts.push(surfW(-D, D - 2 * D * i / n));
  return pts;
}
/* θ 方向的法截线：s ↦ (s·cosθ, ½κn·s², s·sinθ)，恰是一条以 κn 为曲率的抛物线 */
function sectionPts(th, D) {
  const pts = [], n = 60, c = Math.cos(th), s = Math.sin(th);
  for (let i = 0; i <= n; i++) {
    const u = -D + 2 * D * i / n;
    pts.push(surfW(u * c, u * s));
  }
  return pts;
}
/* 原点处法截线的密切圆（半径 1/|κn|，位于含法向的法平面内）。
   κn → 0 时半径发散：返回 null 交由调用方改画切线并标 ∞（§6 奇点处理）。 */
function oscCirclePts(th, kn) {
  if (!isFinite(kn) || Math.abs(kn) < 1e-3) return null;
  const Rc = 1 / Math.abs(kn), out = [], N = 360, c = Math.cos(th), s = Math.sin(th);
  let on = false;
  for (let i = 0; i <= N; i++) {
    const al = i / N * TAU;
    const h = Rc * Math.sin(al), yv = (1 - Math.cos(al)) / kn;
    if (Math.abs(yv) > CLIPY || Math.abs(h) > CLIPX) { if (on) { out.push(null); on = false; } continue; }
    out.push([h * c, yv, h * s]); on = true;
  }
  return out;
}
/* 三点法（Menger 曲率）实测法截线在原点的曲率 —— 与欧拉公式互为独立验算 */
function mengerK(A, B, C3) {
  const ab = Math.hypot(A[0]-B[0], A[1]-B[1], A[2]-B[2]);
  const bc = Math.hypot(B[0]-C3[0], B[1]-C3[1], B[2]-C3[2]);
  const ca = Math.hypot(C3[0]-A[0], C3[1]-A[1], C3[2]-A[2]);
  const u = [B[0]-A[0], B[1]-A[1], B[2]-A[2]], v = [C3[0]-A[0], C3[1]-A[1], C3[2]-A[2]];
  const cr = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
  const area = 0.5 * Math.hypot(cr[0], cr[1], cr[2]);
  const den = ab * bc * ca;
  return den < 1e-12 ? 0 : 4 * area / den;
}
function sectionKmeasured(th) {
  const h = 0.03, c = Math.cos(th), s = Math.sin(th);
  return mengerK(surfW(-h * c, -h * s), surfW(0, 0), surfW(h * c, h * s));
}
/* Dupin 指标线：极坐标 r(θ) = 1/√|κn(θ)|（等比缩放 DUP_S 便于观察）。
   K > 0 是椭圆、K < 0 是一对共轭双曲线、K = 0 退化成两条平行线；
   κn → 0 的方向上 r → ∞，按 §6 裁剪并用 null 断开折线。 */
function dupinPts() {
  const pts = [], N = 720;
  let on = false;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU, kn = kappaN(a);
    const rr = Math.abs(kn) < 1e-9 ? Infinity : DUP_S / Math.sqrt(Math.abs(kn));
    if (!isFinite(rr) || rr > DUP_MAX) { if (on) { pts.push(null); on = false; } continue; }
    pts.push([rr * Math.cos(a), 0, rr * Math.sin(a)]); on = true;
  }
  return pts;
}
/* 渐近方向（κn = 0 的方向）：仅 K < 0 时存在，tan²θ* = −κ₁/κ₂ */
function asymptoticDirs() {
  const k1 = state.k1, k2 = state.k2;
  if (k1 * k2 >= -1e-9 || Math.abs(k2) < 1e-9) return null;
  const th = Math.atan(Math.sqrt(-k1 / k2));
  return [th, -th];
}

/* 沿 +z 的周期标尺（琥珀），起点可平移 —— 引擎的 drawPeriodBracket 固定从 z = 0 起 */

/* ══════ ④ 内蕴测量：球冠、卷纸、以及把它们摊平 ══════ */
/* 半径 R 的球面上、以极点为心、内蕴半径 s 处的点（极点落在世界 y = 0） */
function capPt(psi, beta, R) {
  return [SPH_X + R * Math.sin(psi) * Math.cos(beta), -R + R * Math.cos(psi), R * Math.sin(psi) * Math.sin(beta)];
}
/* 半径 R 的圆柱：把平面纸 (u, v) 等距地卷上去，u 是卷曲方向的弧长、v 沿母线 */
function cylPt(u, v, R) {
  return [CYL_X + R * Math.sin(u / R), -R + R * Math.cos(u / R), v];
}
function cylW(R) { return Math.min(1.25, R * 2.2); }
function capMesh(R, r) {
  const ps = r / R, pts = [];
  for (let m = 0; m < 12; m++) {
    const be = m / 12 * TAU;
    for (let i = 0; i <= 24; i++) pts.push(capPt(ps * i / 24, be, R));
    pts.push(null);
  }
  for (let j = 1; j <= 5; j++) {
    const p = ps * j / 5;
    for (let i = 0; i <= 64; i++) pts.push(capPt(p, i / 64 * TAU, R));
    pts.push(null);
  }
  return pts;
}
function capCirclePts(R, r, n) {
  const ps = r / R, pts = [];
  for (let i = 0; i <= n; i++) pts.push(capPt(ps, i / n * TAU, R));
  return pts;
}
function capMeridianPts(R, r, n, beta) {
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(capPt(r / R * i / n, beta, R));
  return pts;
}
function cylMesh(R) {
  const w = cylW(R), pts = [];
  for (let i = 0; i <= 8; i++) {
    const u = -w + 2 * w * i / 8;
    pts.push(cylPt(u, -CYL_L, R), cylPt(u, CYL_L, R), null);
  }
  for (let j = 0; j <= 6; j++) {
    const v = -CYL_L + 2 * CYL_L * j / 6;
    for (let i = 0; i <= 48; i++) pts.push(cylPt(-w + 2 * w * i / 48, v, R));
    pts.push(null);
  }
  return pts;
}
function cylCirclePts(R, r, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const b = i / n * TAU; pts.push(cylPt(r * Math.cos(b), r * Math.sin(b), R)); }
  return pts;
}
function flatSheetPts(R) {
  const w = cylW(R), pts = [];
  for (let i = 0; i <= 8; i++) {
    const u = -w + 2 * w * i / 8;
    pts.push([CYL_X + u, FLAT_Y, FLAT_DZ - CYL_L], [CYL_X + u, FLAT_Y, FLAT_DZ + CYL_L], null);
  }
  for (let j = 0; j <= 6; j++) {
    const v = FLAT_DZ - CYL_L + 2 * CYL_L * j / 6;
    pts.push([CYL_X - w, FLAT_Y, v], [CYL_X + w, FLAT_Y, v], null);
  }
  return pts;
}
/* 摊平后的球冠：半径 r 的扇形，张角 Θ = C(r)/r 用**实测**周长算，
   于是 2π − Θ 就是那道「橘子皮楔形缺口」，不是硬写进去的常数。 */
function capSectorPts(R, r, n, Cm) {
  const TH = Cm / r, pts = [[SPH_X, FLAT_Y, FLAT_DZ]];
  for (let i = 0; i <= n; i++) {
    const b = TH * i / n;
    pts.push([SPH_X + r * Math.cos(b), FLAT_Y, FLAT_DZ + r * Math.sin(b)]);
  }
  pts.push([SPH_X, FLAT_Y, FLAT_DZ]);
  return pts;
}
/* 由「卷尺量到的」周长 C 与内蕴半径 r 反解高斯曲率：
   常曲率面上精确成立 C(r) = (2π/√K)·sin(√K·r)（K < 0 时为 sinh）。
   经典的 K ≈ 3(2πr − C)/(πr³) 只是它在 r → 0 的首项，读数里另行标出。 */
function solveKfromC(Cm, rm) {
  if (!(rm > 1e-6) || !isFinite(Cm)) return 0;
  const q = Cm / (TAU * rm);
  if (Math.abs(1 - q) < 1e-4) return 6 * (1 - q) / (rm * rm);   /* x → 0 的解析首项，避开二分噪声 */
  if (q < 1) {
    let lo = 1e-9, hi = Math.PI;
    if (Math.sin(hi) / hi > q) return (hi / rm) * (hi / rm);
    for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (Math.sin(m) / m > q) lo = m; else hi = m; }
    const x = (lo + hi) / 2;
    return (x / rm) * (x / rm);
  }
  let lo = 1e-9, hi = 1;
  while (Math.sinh(hi) / hi < q && hi < 60) hi *= 2;
  for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (Math.sinh(m) / m < q) lo = m; else hi = m; }
  const x = (lo + hi) / 2;
  return -(x / rm) * (x / rm);
}
/* 一次把「蚂蚁量到的东西」全量完：周长、内蕴半径都取自实际画出的折线弦长和 */
function antMeasure() {
  const R = state.R, r = state.r;
  const Ccap = polyLen(capCirclePts(R, r, 512));
  const rcap = polyLen(capMeridianPts(R, r, 256, 0));
  const Ccyl = polyLen(cylCirclePts(R, r, 512));
  const Cflat = TAU * r;
  const Kin = solveKfromC(Ccap, rcap), Kex = 1 / (R * R);
  return {
    R: R, r: r,
    Ccap: Ccap, rcap: rcap, Cflat: Cflat, Ccyl: Ccyl,
    Kin: Kin,                              /* 内蕴：只用卷尺 */
    Kex: Kex,                              /* 外在：κ₁κ₂ = (1/R)(1/R) */
    Kdiff: Math.abs(Kin - Kex),            /* 两者之差 —— 绝妙定理的数值证据 */
    KcylIn: solveKfromC(Ccyl, r),          /* 卷纸的内蕴 K —— 实测，应恒为 0 */
    KcylEx: (1 / R) * 0,                   /* 卷纸的外在 K = κ₁·κ₂ = (1/R)·0 */
    gap: TAU - Ccap / r,                   /* 摊平后的楔形缺口（弧度） */
    series: 3 * (TAU * r - Ccap) / (Math.PI * r * r * r)   /* 经典展开式的首项估计 */
  };
}
/* 卷纸上一条网格线：卷之前 2w，卷之后仍是 2w —— 差值实测 */
function cylEdgeCheck(R) {
  const w = cylW(R), n = 400, pts = [];
  for (let i = 0; i <= n; i++) pts.push(cylPt(-w + 2 * w * i / n, 0, R));
  return { curved: polyLen(pts), flat: 2 * w };
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  osc 密切圆 · euler 法截线与欧拉公式                        ║
   ║  gauss 高斯曲率 K = κ₁κ₂ · egregium 绝妙定理                ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 密切圆页的整圈计数器：金光闪的判据是「∮κ ds 又攒满了一个 2π」。
   为什么不用 `turn % 2π < ε` 那种窗口写法：穿越 2π 恰好发生在 θ = 0 那个
   跑得最快的点上（默认 a=1.10 / b=0.55 ⇒ dΦ/dθ = a/b·… = 2，dΦ/dt = 1.8 rad/s，
   一帧 0.030 rad），ω 拉到上限 2.5 时一帧就是 0.083 rad —— 任何固定窗口都会
   被整帧跨过去。数圈数没有窗口，跨得再快也漏不掉。 */
let oscLapSeen = 0;

const SCENES = {

  /* ────── ① 密切圆：曲率就是「最贴合的那个圆」的倒半径 ────── */
  osc: {
    label: { zh: '密切圆 · 曲线的曲率', en: 'Osculating circle' },
    params: ['a', 'b', 'omega'],
    /* 无 drive：动点由引擎时钟直接驱动（theta += ω·dt，见 simAdvance），
       κ(t) 与 ∮κ ds 都随之流出——§8 出路①。 */
    brand: { zh: '在椭圆上每一点，都有唯一一个与它「贴合到二阶」的圆；曲率 κ 就是这个密切圆半径的倒数。拖拽旋转坐标系，看圆心如何在星形的渐屈线上狂奔。',
             en: 'At every point of an ellipse there is a unique circle that hugs it to second order; the curvature κ is the reciprocal of that osculating circle’s radius. Drag to rotate and watch its centre race along the star-shaped evolute.' },
    tips: { zh: '顿悟点：按 2「渐屈线 x·y」正视 —— 曲率就是「最贴合的那个圆」的倒半径：曲线越平，密切圆越大、圆心跑得越远，那条星形轨迹（渐屈线）正是圆心自己画出来的。',
            en: 'Epiphany: press 2 (evolute x·y) — curvature is one over the radius of the best-fitting circle. The flatter the curve, the bigger that circle and the further its centre flies; the star-shaped track it leaves behind is the evolute.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' }, az: -0.78, el: 0.33, dist: 12.5, tx: 0, ty: -0.28, tz: 2.9 },
      evo:  { label: { zh: '渐屈线 x·y', en: 'Evolute x·y' }, az: 0.001, el: 0.02, dist: 6.8, tx: 0, ty: 0, tz: 0,
              onSelect: () => { setTg('showEvolute', true); setTg('showOsc', true); } },
      kt:   { label: { zh: '曲率 κ·t', en: 'Curvature κ·t' }, az: -Math.PI/2, el: 0.001, dist: 12.5, tx: 0, ty: -0.4, tz: 3.4,
              onSelect: () => { setTg('showK', true); setTg('showTurn', true); } }
    },
    toggles: [
      { key: 'showK',       label: { zh: '曲率 κ(t)', en: 'Curvature κ(t)' },                       color: '#fb7185', checked: true },
      { key: 'showEvolute', label: { zh: '渐屈线（曲率中心轨迹）', en: 'Evolute (locus of centres)' }, color: '#a78bfa', checked: true },
      { key: 'showOsc',     label: { zh: '密切圆 + T/N 标架', en: 'Osculating circle + T/N frame' }, color: '#34d399', checked: true },
      { key: 'showTurn',    label: { zh: '累积转角 ∫κ ds', en: 'Accumulated turning ∫κ ds' },       color: '#fb923c', checked: true },
      { key: 'showGrid',    label: { zh: '网格', en: 'Grid' },                                       color: '#64748b', checked: true }
    ],
    sampleWindow: () => TAU / state.omega * 1.08 + 0.6,
    draw(C) {
      const a = state.a, b = state.b, th = state.theta;
      const P = ellPt(th, a, b), E = ellEvo(th, a, b);
      const kap = ellK(th, a, b), Rc = 1 / kap;
      const turnNow = samples.length ? samples[samples.length - 1].turn : 0;

      if (state.showGrid) { drawGridXY(C, 1.8, 0.5); drawTimeGrid(C, { yMax: 1.9, v: WAVE_V }); }

      /* 参考虚线：累积转角的 2π 基准（琥珀度量注记） */
      if (state.showTurn) {
        const yr = TURN_Y0 + TAU * TS;
        strokePoly(C, [[0, yr, 0], [0, yr, WAVE_LEN]], { width: 1, dash: [5, 6], color: 'rgba(251,191,36,0.22)' });
        label3(C, [0, yr, WAVE_LEN * 0.62], '2π', { font: 'italic 12px ' + FONT_MATH, color: 'rgba(251,191,36,.9)', align: 'center', dy: -9 });
      }

      drawAxes(C, { ex: 1.85, ey: 1.85, yTicks: [1], xTicks: [1], tAxis: true, v: WAVE_V });

      /* 历史曲线（由新到旧，头亮尾隐） */
      if (state.showK && samples.length > 1) {
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const z = (state.t - samples[i].t) * WAVE_V;
          if (z > WAVE_LEN) break;
          pts.push([0, clamp(samples[i].k * KS, 0, 2.4), z]);
        }
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, pts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
      }
      if (state.showTurn && samples.length > 1) {
        const pts = [];
        let prevW = null;
        for (let i = samples.length - 1; i >= 0; i--) {
          const z = (state.t - samples[i].t) * WAVE_V;
          if (z > WAVE_LEN) break;
          const w = samples[i].turn - TAU * Math.floor(samples[i].turn / TAU);
          if (prevW !== null && w > prevW + 0.5) pts.push(null);
          pts.push([0, TURN_Y0 + w * TS, z]);
          prevW = w;
        }
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,146,60,0.13)' });
        strokePoly(C, pts, { width: 2.2, fade: ['rgba(251,146,60,1)', 'rgba(251,146,60,0.04)'] });
      }

      /* 渐屈线（紫，第二曲线） */
      if (state.showEvolute) {
        const ev = [];
        for (let i = 0; i <= 240; i++) ev.push(ellEvo(i / 240 * TAU, a, b));
        strokePoly(C, ev, { width: 5, color: 'rgba(167,139,250,0.13)' });
        strokePoly(C, ev, { width: 1.8, color: 'rgba(167,139,250,0.95)' });
      }

      /* 椭圆本体（青，源几何） */
      const el = [];
      for (let i = 0; i <= 200; i++) el.push(ellPt(i / 200 * TAU, a, b));
      strokePoly(C, el, { width: 6, color: 'rgba(45,212,234,0.13)' });
      strokePoly(C, el, { width: 2, color: 'rgba(45,212,234,0.95)' });
      solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');

      /* 密切圆与 T/N 标架（翠绿，第三曲线） */
      if (state.showOsc) {
        const oc = [];
        for (let i = 0; i <= 240; i++) {
          const al = i / 240 * TAU;
          const p = [E[0] + Rc * Math.cos(al), E[1] + Rc * Math.sin(al), 0];
          oc.push((Math.abs(p[0]) > ELL_CLIP || Math.abs(p[1]) > ELL_CLIP) ? null : p);
        }
        strokePoly(C, oc, { width: 4.5, color: 'rgba(52,211,153,0.12)' });
        strokePoly(C, oc, { width: 1.8, color: 'rgba(52,211,153,0.9)' });
        line3(C, P, E, { width: 1.3, dash: [6, 6], color: 'rgba(52,211,153,0.75)' });
        solidDot(C, E, 3, 'rgba(52,211,153,0.95)');
        const sp = ellSpeed(th, a, b);
        const T = [-a * Math.sin(th) / sp, b * Math.cos(th) / sp];
        const dN = [E[0] - P[0], E[1] - P[1]];
        const dl = Math.hypot(dN[0], dN[1]) || 1;
        const Tt = [P[0] + T[0] * 0.5, P[1] + T[1] * 0.5, 0];
        const Nt = [P[0] + dN[0] / dl * 0.5, P[1] + dN[1] / dl * 0.5, 0];
        line3(C, P, Tt, { width: 1.8, color: 'rgba(52,211,153,0.95)' });
        arrowAt(C, Tt, P, 'rgba(52,211,153,0.95)');
        label3(C, Tt, 'T', { font: 'italic 13px ' + FONT_MATH, color: '#34d399', dx: 8, dy: -8 });
        line3(C, P, Nt, { width: 1.8, color: 'rgba(52,211,153,0.7)' });
        arrowAt(C, Nt, P, 'rgba(52,211,153,0.7)');
        label3(C, Nt, 'N', { font: 'italic 13px ' + FONT_MATH, color: '#34d399', dx: 8, dy: -8 });
      }

      /* 曲线头光点 → 主点 P → 公式标注（画家算法尾段） */
      if (state.showK) {
        const hk = proj(C, [0, clamp(kap * KS, 0, 2.4), 0]);
        if (hk) glowDot(hk, 9, '#ffffff', 'rgba(251,113,133,0.9)');
      }
      if (state.showTurn) {
        const w = turnNow - TAU * Math.floor(turnNow / TAU);
        const ht = proj(C, [0, TURN_Y0 + w * TS, 0]);
        if (ht) glowDot(ht, 8, '#ffffff', 'rgba(251,146,60,0.85)');
      }
      const sp0 = proj(C, P);
      if (sp0) glowDot(sp0, 15, '#ffffff', 'rgba(186,240,255,0.9)');

      if (state.showK)    label3(C, [0, 2.05, 1.3], 'κ = 1/R', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      if (state.showTurn) label3(C, [0, TURN_Y0 - 0.26, 1.3], '∫κ ds', { font: 'italic 13px ' + FONT_MATH, color: '#fb923c', align: 'left' });
      if (state.showEvolute) label3(C, [E[0], E[1], 0], t({ zh: '渐屈线', en: 'evolute' }), { size: 11, color: '#a78bfa', dx: 9, dy: 13 });

      /* 金光闪：累积转角 ∮κ ds 又攒满一个 2π —— 动点绕椭圆走完了整整一圈，
         橙色转角带撞上那条标着「2π」的琥珀虚线并回绕。这就是读数最后一行
         「∮κ ds（上一整圈，实测）… 2π = 6.28」印的那个到达，也是本页 dim 那句
         「与 a、b 无关」的落点：椭圆再扁，一圈也还是 2π。
         判据窗口：**没有窗口** —— 用 Math.floor(turn / 2π) 的递增当判据。
         不借读数两位小数、也不借那条 2π 虚线的像素宽度，理由写在 oscLapSeen
         的声明处：穿越 2π 落在曲线跑得最快的点上，ω = 2.5 时一帧 0.083 rad，
         任何固定窗口都会被整帧跨过去。写成 `=== oscLapSeen + 1`（而不是 `>`）
         是第二道护栏：在别的页签停留时 turnAcc 照样在攒，回到本页时圈数可能
         已经跳了好几圈 —— 那不是「刚刚走满」，不该闪；只把计数对齐，等下一圈。
         首帧护栏就在初值上：turn 从 0 起 ⇒ lap = 0，而 oscLapSeen 也是 0，
         0 === 1 为假，加载时不会白闪（flashOn 初值 undefined，首帧即真就会白闪）。
         实测（默认 a=1.10, b=0.55, ω=0.90 rad/s；60 s 确定性推帧）：
         60 s 内 8 次、6.98 s 一闪，首次命中在 t = 6.98 s（θ = 6.285 rad，
         刚攒满第一个 2π）；ω 拉到上限 2.5 时 60 s 内 23 次、2.52 s 一闪
         （首次 t = 2.52 s）—— 换成窗口写法这一档就会开始漏，数圈数不会。
         锚点取那条 2π 参考虚线在 z = 0 的落点：命中的一瞬，橙色曲线的头正压在
         这条线上，光从「攒满」的那个刻度上泛开。 */
      const oscLap = Math.floor(turnNow / TAU);
      goldHit('osc', oscLap === oscLapSeen + 1);
      oscLapSeen = oscLap;
      drawGoldFlash(C, [0, TURN_Y0 + TAU * TS, 0]);
    },
    readout() {
      const a = state.a, b = state.b, th = state.theta;
      const kap = ellK(th, a, b), sp = ellSpeed(th, a, b), E = ellEvo(th, a, b);
      const lt = loopTurn();
      return readoutHead() +
        '<div class="sinC">κ(t) = <b>' + fmt(kap) + '</b>' + t({ zh: '　曲率半径 ', en: '　radius ' }) + 'R = 1/κ = <b>' + fmtInf(1 / kap) + '</b></div>' +
        '<div class="cosC">' + t({ zh: '曲率中心 ', en: 'centre ' }) + 'E = (<b>' + fmtS(E[0]) + '</b>, <b>' + fmtS(E[1]) + '</b>)</div>' +
        '<div class="tanC">‖r′‖ = <b>' + fmt(sp) + '</b>　ds = ‖r′‖ dt</div>' +
        '<div class="cotC">∮κ ds ' + t({ zh: '（上一整圈，实测）', en: '(last full turn, measured)' }) + ' = <b>' +
          (lt == null ? '—' : fmt(lt)) + '</b>　2π = ' + fmt(TAU) + '</div>' +
        '<div class="dim">' + t({ zh: '与 a、b 无关 —— 高斯–博内定理的一维预演', en: 'independent of a and b — a 1-D preview of Gauss–Bonnet' }) + '</div>';
    }
  },

  /* ────── ② 法截线：一点上无穷多条曲率，只由两个极值决定 ────── */
  /* 金光闪：**本页不加**（恒等式，次：频闪）——
     本页画的 κn(θ) = κ₁cos²θ + κ₂sin²θ 每一帧都严格等于欧拉公式的右边，
     它是一条函数图像，没有哪一刻它「终于」相等；紫色 Dupin 指标线的两轴
     与两个主方向垂直，同样是构造出来的（sectionPts 就按这个式子画）。
     唯一像「事件」的是 θ 扫过主方向，可那是每 π/2 一次：默认 ω = 0.9 rad/s
     ⇒ 1.75 s 一次，60 s 内 34 次，远超 §4.7 的 4 s 节奏线，闪成节拍器。 */
  euler: {
    label: { zh: '法截线 · 主曲率', en: 'Normal sections' },
    params: ['k1', 'k2', 'omega'],
    /* 无 drive：法平面的方位角 θ 由引擎时钟直接驱动（theta += ω·dt），
       κn(θ) 随之沿 +z 流出——§8 出路①。 */
    brand: { zh: '含法向的平面绕法线旋转，切出一族法截线；它们的曲率 κn(θ) = κ₁cos²θ + κ₂sin²θ 只由两个极值 κ₁、κ₂ 决定。拖拽旋转，或按 2 俯视切平面。',
             en: 'A plane containing the normal spins around it, cutting a family of normal sections; their curvatures κn(θ) = κ₁cos²θ + κ₂sin²θ are fixed by just two extremes, κ₁ and κ₂. Drag to rotate, or press 2 to look down on the tangent plane.' },
    tips: { zh: '顿悟点：按 2「切平面俯视 x·y」—— 一点上有无穷多条法截线的曲率，却只由两个极值决定；紫色 Dupin 指标线的两条对称轴恰好落在这两个主方向上，而它们必然互相垂直。',
            en: 'Epiphany: press 2 (tangent plane, top view) — a point carries infinitely many normal-section curvatures, yet only two extremes decide them all. The violet Dupin indicatrix has its axes exactly along those two principal directions, and they are necessarily perpendicular.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' }, az: -0.82, el: 0.34, dist: 14, tx: 0, ty: -0.1, tz: 3.6 },
      top:  { label: { zh: '切平面俯视 x·y', en: 'Tangent plane, top x·y' }, az: 0.001, el: 1.52, dist: 8.5, tx: 0, ty: 0, tz: 0.2,
              onSelect: () => { setTg('showDupin', true); setTg('showPrin', true); } },
      side: { label: { zh: 'κn · t 侧视', en: 'κn · t side' }, az: -Math.PI/2, el: 0.001, dist: 12, tx: 0, ty: 0, tz: 5.2,
              onSelect: () => { setTg('showKn', true); } }
    },
    toggles: [
      { key: 'showKn',    label: { zh: '法曲率 κn(θ)', en: 'Normal curvature κn(θ)' },      color: '#fb7185', checked: true },
      { key: 'showDupin', label: { zh: 'Dupin 指标线', en: 'Dupin indicatrix' },            color: '#a78bfa', checked: true },
      { key: 'showSect',  label: { zh: '法截线 + 密切圆', en: 'Normal section + circle' },  color: '#34d399', checked: true },
      { key: 'showPrin',  label: { zh: '主方向与主截线', en: 'Principal directions' },      color: '#fb923c', checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' },                                 color: '#64748b', checked: true }
    ],
    sampleWindow: () => TLEN / WAVE_V + 0.6,
    draw(C) {
      const th = state.theta, kn = kappaN(th);
      const c = Math.cos(th), s = Math.sin(th);

      if (state.showGrid) { drawPlaneGridXZ(C, 0, D2 + 0.2, 0.325, 0); drawKnGrid(C); }

      /* 参考虚线：κn = 0 基线 + 渐近方向（K < 0 时才存在，§6） */
      strokePoly(C, [[0, 0, ZS], [0, 0, ZS + TLEN]], { width: 1, dash: [5, 6], color: 'rgba(159,176,200,0.28)' });
      const asy = asymptoticDirs();
      if (state.showDupin && asy) {
        for (const ad of asy) {
          strokePoly(C, [[-DUP_MAX * Math.cos(ad), 0, -DUP_MAX * Math.sin(ad)], [DUP_MAX * Math.cos(ad), 0, DUP_MAX * Math.sin(ad)]],
            { width: 1, dash: [4, 5], color: 'rgba(167,139,250,0.30)' });
        }
        label3(C, [DUP_MAX * Math.cos(asy[0]), 0, DUP_MAX * Math.sin(asy[0])],
          t({ zh: '渐近方向', en: 'asymptotic' }), { size: 10.5, color: 'rgba(167,139,250,.7)', dx: 6, dy: -6 });
      }

      drawSurfAxes(C, D2);
      drawKnAxis(C);
      if (state.showKn) {
        periodBracketAt(C, ZS, Math.PI / state.omega * WAVE_V, 0, -1.25,
          'π/ω = ' + fmt(Math.PI / state.omega) + ' s');
      }

      /* 历史曲线 κn(θ)（玫红，第一曲线） */
      if (state.showKn && samples.length > 1) {
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const z = ZS + (state.t - samples[i].t) * WAVE_V;
          if (z > ZS + TLEN) break;
          pts.push([0, clamp(samples[i].kn * KNS, -CLIPY, CLIPY), z]);
        }
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, pts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
      }

      /* 曲面线框（青，源几何） */
      strokePoly(C, surfMesh(D2, 10, 24), { width: 1, color: 'rgba(45,212,234,0.34)' });
      strokePoly(C, surfRim(D2), { width: 1.6, color: 'rgba(45,212,234,0.85)' });

      /* Dupin 指标线（紫，第二曲线） */
      if (state.showDupin) {
        const dp = dupinPts();
        strokePoly(C, dp, { width: 4.5, color: 'rgba(167,139,250,0.12)' });
        strokePoly(C, dp, { width: 1.8, color: 'rgba(167,139,250,0.92)' });
        label3(C, [0, 0.02, -DUP_MAX - 0.15], 'r(θ) = 1/√|κn|',
          { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
      }

      /* 主方向与主截线（橙，第四曲线） */
      if (state.showPrin) {
        strokePoly(C, sectionPts(0, D2), { width: 1.8, color: 'rgba(251,146,60,0.9)' });
        strokePoly(C, sectionPts(Math.PI / 2, D2), { width: 1.8, color: 'rgba(251,146,60,0.9)' });
        line3(C, [-D2 - 0.2, 0, 0], [D2 + 0.2, 0, 0], { width: 1.3, dash: [7, 7], color: 'rgba(251,146,60,0.55)' });
        line3(C, [0, 0, -D2 - 0.2], [0, 0, D2 + 0.2], { width: 1.3, dash: [7, 7], color: 'rgba(251,146,60,0.55)' });
        label3(C, surfW(D2, 0), 'κ₁ = ' + fmtS(state.k1), { font: 'italic 12px ' + FONT_MATH, color: '#fb923c', dx: 8, dy: -8 });
        label3(C, surfW(0, D2), 'κ₂ = ' + fmtS(state.k2), { font: 'italic 12px ' + FONT_MATH, color: '#fb923c', dx: 8, dy: -8 });
      }

      /* 当前法截线与密切圆（翠绿，第三曲线） */
      if (state.showSect) {
        line3(C, [-(D2 + 0.2) * c, 0, -(D2 + 0.2) * s], [(D2 + 0.2) * c, 0, (D2 + 0.2) * s],
          { width: 1.2, dash: [6, 6], color: 'rgba(52,211,153,0.5)' });
        const sec = sectionPts(th, D2);
        strokePoly(C, sec, { width: 5, color: 'rgba(52,211,153,0.13)' });
        strokePoly(C, sec, { width: 2.2, color: 'rgba(52,211,153,0.95)' });
        const oc = oscCirclePts(th, kn);
        if (oc) {
          strokePoly(C, oc, { width: 4, color: 'rgba(52,211,153,0.10)' });
          strokePoly(C, oc, { width: 1.6, color: 'rgba(52,211,153,0.8)' });
          solidDot(C, [0, 1 / kn, 0], 3, 'rgba(52,211,153,0.95)');
          line3(C, [0, 0, 0], [0, 1 / kn, 0], { width: 1.2, dash: [6, 6], color: 'rgba(52,211,153,0.6)' });
        } else {
          /* κn → 0：密切圆退化成切线，按 §6 标 ∞ */

        label3(C, [SPH_X + r * 0.9 * Math.cos((TH + TAU) / 2), FLAT_Y, FLAT_DZ + r * 0.9 * Math.sin((TH + TAU) / 2)],
          t({ zh: '缺口 ', en: 'gap ' }) + fmt(M.gap) + ' rad',
          { size: 11, color: '#fb923c', align: 'center' });
      }

      /* 蚂蚁：沿测地圆与平面对照圆同步走，头部光点同源着色 */
      const antCap = proj(C, capPt(r / R, be, R));
      if (state.showGeo && antCap) glowDot(antCap, 10, '#ffffff', 'rgba(251,113,133,0.9)');
      const antFlat = proj(C, [SPH_X + r * Math.cos(be), FLAT_Y, r * Math.sin(be)]);
      if (state.showFlatCirc && antFlat) glowDot(antFlat, 8, '#ffffff', 'rgba(167,139,250,0.85)');
      const antCyl = proj(C, cylPt(r * Math.cos(be), r * Math.sin(be), R));
      if (state.showRoll && antCyl) glowDot(antCyl, 8, '#ffffff', 'rgba(52,211,153,0.85)');

      const pole = proj(C, [SPH_X, 0, 0]);
      if (pole) glowDot(pole, 15, '#ffffff', 'rgba(186,240,255,0.9)');
      const tp = proj(C, [CYL_X, 0, 0]);
      if (tp) glowDot(tp, 12, '#ffffff', 'rgba(186,240,255,0.75)');

      label3(C, [SPH_X, 0.55, -1.55], 'K = 1/R² = ' + fmt(M.Kex),
        { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      label3(C, [CYL_X, 0.55, -1.55], 'K = (1/R)·0 = ' + fmt(M.KcylEx),
        { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'center' });
    },
    readout() {
      const M = antMeasure(), E = cylEdgeCheck(state.R);
      return readoutHead() +
        '<div class="sinC">' + t({ zh: '测地圆周长（实测）', en: 'geodesic circumference (measured)' }) +
          ' C(r) = <b>' + fmt(M.Ccap) + '</b>　2πr = ' + fmt(M.Cflat) + '</div>' +
        '<div class="cosC">' + t({ zh: '外在 ', en: 'extrinsic ' }) + 'K = κ₁κ₂ = 1/R² = <b>' + fmt(M.Kex) + '</b></div>' +
        '<div class="tanC">' + t({ zh: '内蕴 ', en: 'intrinsic ' }) + 'K' + t({ zh: '（只用卷尺）', en: ' (tape measure only)' }) +
          ' = <b>' + fmt(M.Kin) + '</b>　|Δ| = ' + fmt(M.Kdiff, 4) + '</div>' +
        '<div class="cotC">' + t({ zh: '卷纸：外在 ', en: 'rolled sheet: extrinsic ' }) + 'K = <b>' + fmt(M.KcylEx) +
          '</b>　' + t({ zh: '内蕴 ', en: 'intrinsic ' }) + 'K = <b>' + fmt(M.KcylIn) + '</b>　' +
          t({ zh: '网格边长差 ', en: 'edge-length change ' }) + fmt(Math.abs(E.curved - E.flat), 4) + '</div>' +
        '<div class="dim">' + t({ zh: '摊平缺口 = 2π − C(r)/r = ', en: 'flattening gap = 2π − C(r)/r = ' }) + fmt(M.gap) +
          ' rad　·　' + t({ zh: '展开式 3(2πr−C)/(πr³) = ', en: 'series 3(2πr−C)/(πr³) = ' }) + fmt(M.series) +
          t({ zh: '（仅首项）', en: ' (leading term only)' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 累积转角 ∮κ ds 必须「攒」而不是「算」：解析式 Φ 用的是当下的 a、b，
   中途改滑杆再整条重算就会把历史波形改写掉（§4.6）。这里只把**本步**的
   增量按当时的真实参数加进去，过去那一段永远保持它真实的轨迹。 */
let turnAcc = 0, turnLastTh = 0;

function pushSample() {
  const th = state.theta, a = state.a, b = state.b;
  if (samples.length === 0) { turnAcc = 0; turnLastTh = th; }   /* resetSim() 清空采样后的第一枚 */
  else if (th > turnLastTh) { turnAcc += turnPhi(th, a, b) - turnPhi(turnLastTh, a, b); turnLastTh = th; }
  samples.push({
    t: state.t,
    th: th,
    k: ellK(th, a, b),        /* ① 当时的椭圆曲率 */
    turn: turnAcc,            /* ① 当时的累积转角 ∫κ ds */
    kn: kappaN(th)            /* ② 当时的法曲率 κn(θ) */
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ④ 演算记录与回放（可选）—— 规范 §11                        ║
   ║  只有「同一次运行不可复得」的工具才需要（混沌、多体、由种子    ║
   ║  驱动的迭代）。不声明 RECORD 就完全没有录制 UI，行为与体积     ║
   ║  均不受影响 —— 绝大多数工具应当保持不声明。                   ║
   ╚══════════════════════════════════════════════════════════╝

   写法（每个可录制页签一份，键名与 SCENES 对应）：

   const RECORD = {
     lissa: {
       capture:  () => ({ th: state.theta }),        // 完整状态向量，JSON 可序列化
       restore:  s  => { state.theta = s.th; },      // 必须与 capture 对称（§8）
       seed:     () => ({ omega: state.omega }),     // 初值 + 积分参数
       reseed:   s  => { state.omega = s.omega; resetSim(); },
       lock:     ['omega'],                          // 回放期间置灰的滑杆
       roundOf:  () => 0                             // 当前轮次，供「录一轮」判定
     }
   };

   本模板不声明（示例场景无此需要），故下面给一个空对象占位。 */
const RECORD = {};

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    /* 回放冻结的是「演算」，不是「观察」：相机 tween 在上面已经走过了，
       视角、开关、绘制全部照常 —— 与「暂停只冻结模拟」同一条精神（§11.7）。 */
    if (recState.mode === 'replay') {
      recStep(dt);
    } else if (state.running) {
      if (recState.mode === 'recording') {
        /* 录制时把时间量子化成整数个 REC_DT。理由（§11.2）：物理若由变长的
           帧 dt 推进，轨迹就依赖于帧率抖动，「从同一种子重算」在**本机**都对
           不上，比对曲线也就失去意义。量子化之后轨迹是种子的确定性函数，
           本机重算能贴到舍入噪声，跨机器的差别才干净地归因于超越函数实现。 */
        recState.acc += dt;
        let guard = 0;
        while (recState.acc >= REC_DT && guard++ < 64) { recState.acc -= REC_DT; simAdvance(REC_DT); recPush(); }
      } else {
        simAdvance(dt);
      }
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); refreshRecInfo(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= 场景作用域参数与时间驱动 ================= */
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）

/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {

    b.className = 'tab';
    b.dataset.tab = id;

/* ================= 视角与页签 ================= */
/* 选择器必须限定在 .views 之内：.vbtn 只是个样式类，工具可能为了复用外观
   把它挂到别处的按钮上（如文本预设）。不限定的话 closest('.views') 会返回
   null，这里当场抛错，视角高亮从此再不更新。行为查询不能只认样式类。 */
function refreshViewButtons() {
  document.querySelectorAll('.views .vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* ══════════════ 演算记录与回放（规范 §11）══════════════
   自成一节，刻意排在所有 UI 构建器之后、switchTab 之前：它与「场景时间
   驱动」是两个子系统，嵌在后者中间会让 scripts/port_drive_engine.py 把
   它当成驱动引擎的一部分灌进另外 50 个工具（实测踩过）。 */

/* ══════════════ 演算记录与回放 · 引擎侧（规范 §11） ══════════════
   工具只提供 RECORD 里的六个钩子；序列化、下载/上传、回放时钟、校验、
   种子比对全在这里，各工具不得自己再写一份。 */
const REC_FORMAT = 'mathviz-run';
const REC_FORMAT_VERSION = 1;
const REC_DT = 0.02;         // 采样间隔（模拟秒）
const REC_MAX_ROWS = 20000;  // 行数上限；到顶停录并提示，绝不静默截断（§11.4）
const REC_PREC = 12;         // 数值有效位；比对基线要把这项舍入计入（§11.4）

const recState = {
  mode: 'live',              // 'live' | 'recording' | 'replay'
  rows: [], fields: null, shape: null,
  seed: null, tab: null, srcName: null,
  i: 0, playing: true, rate: 1, acc: 0, t0: 0,
  roundAt: null, note: null,
  verify: null               // { delta, reproduced } —— §11.2 的种子比对结论
};

function recHooks(tab) { return RECORD && RECORD[tab || curTab] || null; }

/* 唯一的只读判据访问器。工具的 draw()/readout() 要查模式一律走它，
   不得自拼判据 —— 理由同 §6「双语义迭代」：同一判据两种写法必然漂移。 */
function recInfo() {
  if (!recHooks()) return null;
  return {
    mode: recState.mode,
    rows: recState.rows.length,
    i: recState.i,
    playing: recState.playing,
    srcName: recState.srcName,
    verify: recState.verify,
    note: recState.note
  };
}

/* capture() 的对象 → 一行数字。展开顺序由第一次调用的结构冻结（§11.6）。 */
function recShapeOf(o) {
  const f = [];
  (function walk(v, path) {
    if (Array.isArray(v)) v.forEach((x, i) => walk(x, path + '[' + i + ']'));
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => walk(v[k], path ? path + '.' + k : k));
    else f.push(path);
  })(o, '');
  return f;
}
function recFlatten(o) {
  const out = [];
  (function walk(v) {
    if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => walk(v[k]));
    else out.push(typeof v === 'number' ? +v.toPrecision(REC_PREC) : v);
  })(o);
  return out;
}
function recUnflatten(row, tmpl) {
  let i = 0;
  return (function walk(v) {
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = walk(v[k]); }); return o; }
    return row[i++];
  })(tmpl);
}

/* 推进一步模拟。抽出来是为了让「录制时按 REC_DT 量子化」与「种子重算」
   走的是同一条代码路径 —— 两边若各写一份，重算就不再是重算了。 */
function simAdvance(d) {
  state.t += d;
  state.theta += state.omega * d;
  applyDrive();
  const dv = SCENES[curTab].drive;
  if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
  pushSample();
}

function recStartRecording() {
  const h = recHooks(); if (!h) return;
  /* 起录前先把本页签重置到一轮的开头（§11.3）。这一步是引擎的责任，不是各
     工具在 seed() 里偷偷做 —— 否则 seed() 就成了一个会改状态的取值器，是留给
     下一个人的陷阱。理由：不重置的话，seed 描述的是这一轮的起点，而第 0 行
     描述的是「你按下录制的那一刻」，§11.2 的重算于是从头就跟存档不在同一段
     时间上，比对必然失败，且失败得像一次正常的混沌发散——查都没处查。 */
  if (h.reseed && h.seed) h.reseed(h.seed());
  const snap = h.capture();
  recState.mode = 'recording';
  recState.rows = []; recState.tab = curTab;
  recState.shape = snap; recState.fields = recShapeOf(snap);
  recState.seed = h.seed(); recState.roundAt = h.roundOf();
  recState.t0 = state.t;          // 录制起点的引擎时钟；回放要照它复原，见 recStep
  recState.note = null; recState.verify = null; recState.acc = 0;
  recPush();                                      // 立即记下第 0 行
  buildRecRow();
}
function recStopRecording(note) {
  if (recState.mode !== 'recording') return;
  recState.mode = 'live';
  recState.note = note || null;
  buildRecRow();
}

/* 记一行。**不做时间节流** —— 录制态下 frame() 已经把推进量子化成整数个
   REC_DT，一格一行即可。曾经写成「state.t - lastAt >= REC_DT」的节流：累加出
   的差常是 0.019999999999999997，于是约一半的行被悄悄丢掉，行号与步数错位，
   种子重算怎么算都对不上。量子化之后节流就是多余且有害的。 */
function recPush() {
  if (recState.mode !== 'recording') return;
  const h = recHooks(); if (!h) return;
  if (h.roundOf() !== recState.roundAt) { recStopRecording(UI.recRoundEnd); return; }  // §11.3 录一轮
  recState.rows.push(recFlatten(h.capture()));
  if (recState.rows.length >= REC_MAX_ROWS) recStopRecording(UI.recFull);
}

/* 回放推进：按 rate 走行号，restore 后照常 pushSample()，
   于是历史曲线、读数、绘制全部沿用实时那一套。 */
function recStep(dt) {
  const h = recHooks(); if (!h || !recState.rows.length) return;
  if (recState.playing) {
    recState.acc += dt * recState.rate;
    while (recState.acc >= REC_DT && recState.i < recState.rows.length - 1) { recState.acc -= REC_DT; recState.i++; }
    if (recState.i >= recState.rows.length - 1) { recState.acc = 0; recState.playing = false; buildRecRow(); }
  }
  h.restore(recUnflatten(recState.rows[recState.i], recState.shape));
  /* 从录制起点算起，不是从 0 —— 录制未必始于 t = 0，凭空归零会让任何把引擎
     时钟纳入 capture() 的工具在回放时对不上（实测三体差 6.0 s，正是起录前
     跑过的那段）。 */
  state.t = recState.t0 + recState.i * REC_DT;
  pushSample();
}

function recExitReplay() {
  if (recState.mode !== 'replay') return;
  recState.mode = 'live';
  recState.rows = []; recState.i = 0; recState.srcName = null; recState.verify = null; recState.note = null;
  resetSim();
  buildRecRow();
}

function recSave() {
  if (!recState.rows.length) return;
  const doc = {
    format: REC_FORMAT, formatVersion: REC_FORMAT_VERSION,
    tool: { id: TOOL.id, version: VERSION, engine: ENGINE_VERSION },
    tab: recState.tab, recordedAt: new Date().toISOString(),
    seed: recState.seed,
    trace: { dt: REC_DT, t0: recState.t0, fields: recState.fields, rows: recState.rows }
  };
  const blob = new Blob([JSON.stringify(doc)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = TOOL.id + '-' + recState.tab + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 加载校验（§11.5）：五步，任一不过即明确拒绝，不做兼容性猜测。 */
function recValidate(doc) {
  if (!doc || doc.format !== REC_FORMAT) return { zh: '不是 MathViz 存档文件', en: 'Not a MathViz run file' };
  if (doc.formatVersion !== REC_FORMAT_VERSION)
    return { zh: '存档格式版本 ' + doc.formatVersion + ' 本工具不认识', en: 'Unknown archive format version ' + doc.formatVersion };
  if (!doc.tool || doc.tool.id !== TOOL.id)
    return { zh: '这份存档属于「' + ((doc.tool && doc.tool.id) || '?') + '」，不是本工具',
             en: 'This archive belongs to "' + ((doc.tool && doc.tool.id) || '?') + '", not this tool' };
  const h = recHooks(doc.tab);
  if (!h) return { zh: '存档的页签「' + doc.tab + '」在本工具中不可录制', en: 'Tab "' + doc.tab + '" is not recordable here' };
  const want = recShapeOf(h.capture());
  const got = (doc.trace && doc.trace.fields) || [];
  if (want.length !== got.length || want.some((k, i) => k !== got[i]))
    return { zh: '存档的字段与本版本不一致，拒绝载入（字段错位会画出看似合理实则错误的图）',
             en: 'Field set does not match this version; refusing to load (a mismatch would draw a plausible but wrong picture)' };
  if (!doc.trace.rows || !doc.trace.rows.length) return { zh: '存档里没有数据行', en: 'Archive contains no rows' };
  return null;
}

/* §11.2：用种子在本机重新积分，与记录的轨迹逐点比对。
   工具没给 reseed/seed 就跳过（返回 null），不阻塞回放。 */
function recVerify(doc) {
  const h = recHooks(doc.tab);
  if (!h || !h.reseed || !doc.seed) return null;
  /* 重算是一次「离线」推演：它会走 simAdvance，因而动到 state.t 与 samples。
     全部存下来在 finally 里还原 —— 比对不该在用户的现场留下任何痕迹。 */
  const keep = h.capture();
  const keepT = state.t, keepSamples = samples.slice();
  try {
    h.reseed(doc.seed);
    let worst = 0;
    const n = Math.min(doc.trace.rows.length, 400);
    for (let k = 0; k < n; k++) {
      const mine = recFlatten(h.capture()), theirs = doc.trace.rows[k];
      for (let j = 0; j < mine.length; j++) {
        const a = +mine[j], b = +theirs[j];
        if (isFinite(a) && isFinite(b)) worst = Math.max(worst, Math.abs(a - b));
      }
      /* 走与录制时完全相同的推进路径（同一个 simAdvance、同一个 REC_DT），
         否则「重算」就变成了另一条数值轨迹，本机也会报复现失败。 */
      if (k < n - 1) simAdvance(REC_DT);
    }
    /* 阈值要把 toPrecision(REC_PREC) 的舍入算进去（§11.4）：存档只留 12 位
       有效数字，本机完美复现时 δ 也就落在这个量级，而非 0。 */
    return { delta: worst, reproduced: worst < 1e-9 };
  } catch (e) {
    return null;
  } finally {
    h.restore(keep);
    state.t = keepT;
    samples.length = 0; keepSamples.forEach(s => samples.push(s));
  }
}

function recLoadDoc(doc, name) {
  const bad = recValidate(doc);
  if (bad) { recState.note = bad; buildRecRow(); return false; }
  const h = recHooks(doc.tab);
  if (doc.tab !== curTab) switchTab(doc.tab);
  recState.verify = recVerify(doc);
  recState.mode = 'replay';
  recState.rows = doc.trace.rows;
  recState.fields = doc.trace.fields;
  recState.shape = h.capture();
  recState.seed = doc.seed; recState.tab = doc.tab; recState.srcName = name;
  recState.t0 = +doc.trace.t0 || 0;
  recState.i = 0; recState.acc = 0; recState.playing = true; recState.rate = 1; recState.note = null;
  samples.length = 0;
  buildRecRow();
  return true;
}

/* 状态行的文案只有这一处出处。buildRecRow() 在状态切换时重建整行、
   refreshRecInfo() 每 120 ms 重写这一行，两边都读它。
   为什么必须只有一处：这一行正是这么坏掉过的 —— 当年 refreshRecInfo() 只认
   'recording'，文案又只长在 buildRecRow() 里，于是回放期间没有任何代码去改它，
   进度永远停在「1 / N」，只有按下暂停或整段播完（那两条路径会重建整行）才跳一下。
   画面在动、数字不动，看上去像回放卡住了，其实回放一直是对的。 */
function recInfoText() {
  const bits = [];
  if (recState.mode === 'replay') {
    bits.push(t(UI.recReplay) + ' ' + (recState.i + 1) + ' / ' + recState.rows.length);
    if (recState.srcName) bits.push(recState.srcName);
    if (recState.verify) {
      /* 尾巴「这不是 bug，见提示」只在**复现失败**时才有意义 —— 成功时贴上去
         会读成「复现了 —— 这不是 bug」，反而让人以为出了事。 */
      bits.push(t(recState.verify.reproduced ? UI.recVerifyOK : UI.recVerifyNo) +
                recState.verify.delta.toExponential(1) +
                (recState.verify.reproduced ? '）' : t(UI.recVerifyTail)));
    }
  } else {
    bits.push(recState.rows.length + t(UI.recRows));
  }
  if (recState.note) bits.push(t(recState.note));
  return bits.join(' · ');
}

/* 录制 / 回放行（§11）。只在当前页签声明了 RECORD 钩子时出现；
   整行每次重建 —— 它的状态机只有三态，重建比增量改 DOM 更不容易漂。 */
function buildRecRow() {
  const host = document.getElementById('recHost');
  if (!host) return;
  host.innerHTML = '';
  if (!recHooks()) return;

  const row = document.createElement('div');
  row.className = 'row recrow';
  const mk = (labObj, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'btn' + (cls ? ' ' + cls : '');
    b.textContent = t(labObj);
    b.addEventListener('click', fn);
    return b;
  };

  if (recState.mode === 'replay') {
    row.appendChild(mk(recState.playing ? UI.recPause : UI.recPlay,
      () => { recState.playing = !recState.playing; buildRecRow(); }));
    row.appendChild(mk(UI.recRewind, () => { recState.i = 0; recState.acc = 0; recState.playing = true; buildRecRow(); }));
    const rate = document.createElement('button');
    rate.className = 'btn';
    rate.textContent = recState.rate + '×';
    rate.addEventListener('click', () => {
      const steps = [0.25, 0.5, 1, 2, 4];
      recState.rate = steps[(steps.indexOf(recState.rate) + 1) % steps.length];
      buildRecRow();
    });
    row.appendChild(rate);
    row.appendChild(mk(UI.recExit, recExitReplay));
  } else if (recState.mode === 'recording') {
    row.appendChild(mk(UI.recStop, () => recStopRecording(null), 'wide'));
    row.appendChild(mk(UI.recSave, recSave));
  } else {
    row.appendChild(mk(UI.recRec, recStartRecording, 'wide'));
    row.appendChild(mk(UI.recSave, recSave));
    row.appendChild(mk(UI.recLoad, () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          let doc = null;
          try { doc = JSON.parse(rd.result); }
          catch (e) { recState.note = { zh: '文件不是合法 JSON', en: 'File is not valid JSON' }; buildRecRow(); return; }
          recLoadDoc(doc, f.name);
        };
        rd.readAsText(f);
      });
      inp.click();
    }));
  }
  host.appendChild(row);

  /* 状态行：进度 / 行数 / 存档来源 / 种子比对结论 / 提示 */
  const info = document.createElement('div');
  info.className = 'recinfo';
  info.textContent = recInfoText();
  info.dataset.rec = '1';
  host.appendChild(info);

  refreshRecLocks();
}

/* 录制中的行数、回放中的进度都是每帧在变的，而 buildRecRow() 只在状态切换时
   跑 —— 只改这一行文本，别整行重建（重建会打断按钮的焦点与 hover）。由 frame()
   的读数节流一并调用，120 ms 一次足够。判据是「不是 live」而不是「是 recording」：
   回放同样每帧在走，漏掉它就等于让进度数字停在原地。 */
function refreshRecInfo() {
  if (recState.mode === 'live') return;
  const el = document.querySelector('#recHost .recinfo[data-rec]');
  if (!el) return;
  el.textContent = recInfoText();
}

/* 回放期间种子滑杆置灰 —— 改它们等于改种子，画面与数据会脱节（§11.7）。 */
function refreshRecLocks() {
  const h = recHooks();
  const lock = (recState.mode === 'replay' && h && h.lock) || [];
  Object.keys(paramWraps).forEach(k => {
    const e = paramWraps[k];
    if (!e) return;
    const on = lock.indexOf(k) >= 0;
    e.input.disabled = on;
    e.wrap.style.opacity = on ? '0.45' : '';
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  /* 换页签 = 换实验：正在录的那一轮不再对应画面，停录并保留已录数据；
     回放态则整个退出 —— 存档是绑定页签的（§11.4 的 tab 字段）。 */
  if (recState.mode === 'recording' && recState.tab !== id) recStopRecording(null);
  if (recState.mode === 'replay' && recState.tab !== id) recExitReplay();
  buildRecRow();
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  buildRecRow();               // 录制行的文案是建行时取的 t()，整行重建即跟随语言
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
