<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'proof-logic-induction-3d',
  title: { zh: '证明的本质 · 量词、反例与归纳', en: 'The Essence of Proof · Quantifiers, Counterexamples & Induction' },
  h1:    { zh: '证明的本质', en: 'The Essence of Proof' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'omega',      label: { zh: '推演速度 <i>v</i>',    en: 'Proof pace <i>v</i>' },        min: 0.3, max: 3,  step: 0.05, value: 1,  fmt: v => fmt(v) + t({ zh: ' 步/s', en: ' steps/s' }) },
  { key: 'probeN',     label: { zh: '探针整数 <i>n</i>',    en: 'Probe integer <i>n</i>' },     min: 0,   max: 24, step: 1,    value: 12, fmt: v => v.toFixed(0) },
  { key: 'domainM',    label: { zh: '有限域大小 <i>m</i>',  en: 'Domain size <i>m</i>' },       min: 3,   max: 9,  step: 1,    value: 6,  fmt: v => v.toFixed(0) },
  { key: 'witnessY',   label: { zh: '候选见证 <i>y</i>',    en: 'Candidate witness <i>y</i>' }, min: 1,   max: 9,  step: 1,    value: 3,  fmt: v => v.toFixed(0) },
  { key: 'quantPreset',label: { zh: '谓词预设 R(x,y)',      en: 'Predicate preset R(x,y)' },    min: 1,   max: 2,  step: 1,    value: 1,
    fmt: v => t(v < 1.5 ? { zh: '配对 x+y=m+1', en: 'pairing x+y=m+1' } : { zh: '支配 y ≥ x', en: 'dominance y ≥ x' }) },
  { key: 'checkN',     label: { zh: '检验上限 <i>N</i>',    en: 'Check up to <i>N</i>' },       min: 0,   max: 45, step: 1,    value: 12, fmt: v => v.toFixed(0) }
];

/* ───────── 场景级辅助（不改引擎；参照 fourier-essence-3d 的做法） ───────── */
const GOLD = 2.39996;
function isPrime(v){
  if (v < 2) return false;
  if (v % 2 === 0) return v === 2;
  for (let d = 3; d * d <= v; d += 2) if (v % d === 0) return false;
  return true;
}
function smallestFactor(v){
  if (v % 2 === 0) return 2;
  for (let d = 3; d * d <= v; d += 2) if (v % d === 0) return d;
  return v;
}
/* 任意 z 层上的圆 */
function circle3(C, cx, cy, z, r, opt){
  const pts = [];
  for (let i = 0; i <= 64; i++){ const a = i / 64 * TAU; pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a), z]); }
  strokePoly(C, pts, opt);
}
/* 填充四边形（真值格） */
function fillQuad(C, pts, color){
  const s = pts.map(p => proj(C, p));
  if (s.some(p => !p)) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s[0][0], s[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
/* 场景一：集合几何与确定性布点（P = 4|n ⊂ Q = 2|n） */
const Q_C = [0.15, 0], Q_R = 1.55, P_C = [-0.35, 0.1], P_R = 0.78;
function intPos(n){
  const a = n * GOLD + 0.8;
  if (n % 4 === 0){
    const r = 0.12 + 0.52 * ((n * 0.37) % 1);
    return [P_C[0] + r*Math.cos(a), P_C[1] + r*Math.sin(a)];
  }
  if (n % 2 === 0){
    let p = [Q_C[0] + 1.22*Math.cos(a), Q_C[1] + 1.22*Math.sin(a)];
    if (Math.hypot(p[0]-P_C[0], p[1]-P_C[1]) < 0.95)
      p = [Q_C[0] + 1.22*Math.cos(a + Math.PI), Q_C[1] + 1.22*Math.sin(a + Math.PI)];
    return p;
  }
  const r = 1.85 + 0.4 * ((n * 0.61) % 1);
  return [Q_C[0] + r*Math.cos(a), Q_C[1] + r*Math.sin(a)];
}
/* 场景三：反证链（√2 无理） */
const CHAIN = [
  { zh: '假设 √2 = p/q（p、q 互素）', en: 'Assume √2 = p/q in lowest terms' },
  { zh: '平方：p² = 2q²',            en: 'Square: p² = 2q²' },
  { zh: '⇒ p 为偶数，记 p = 2r',      en: '⇒ p is even, write p = 2r' },
  { zh: '⇒ q² = 2r²，q 也为偶数',     en: '⇒ q² = 2r², so q is even too' },
  { zh: '⊥ 与「互素」矛盾 ⇒ √2 无理',  en: '⊥ contradicts lowest terms ⇒ √2 is irrational' }
];
/* 场景四：多米诺 */
const DOM_N = 12, DOM_DZ = 0.75, DOM_Z0 = 0.6, DOM_H = 1.0, DOM_W = 0.28;
/* 波前扫完 12 张后再多留 4 拍看终态，然后从头推一次。
   为什么这一页没有 drive、而是改这里：驱动量必须是本页 params 里的一根滑杆，
   而「数学归纳法」页只有一根 ω，它是钟本身不是自变量（审计也把它读成「多声明」——
   连它都不改变当前这一帧的画面）。这一页的自变量本来就是引擎相位钟 θ：波前 f = θ，
   骨牌一张接一张倒下。病不在缺驱动量，而在这只钟走过 12 之后 dominoProg 全被夹到 1，
   画面永久定格在「全倒」上（实测 t≈200 s 起读数恒为「已证明至 n = 12」、画面逐像素相同）。
   所以修法是让它循环：多留 DOM_HOLD 拍定格，再重新推倒第一张。
   这不违反「历史绝不重算」——本页没有历史缓冲，dominoProg 是 θ 的纯函数。
   关掉「基础步骤」时 f 恒为 0（没人推第一张），关掉「归纳步骤」时 f 被夹在 1
   （波死在第一张），两种情形本来就该定格，循环不改变它们的语义。 */
const DOM_HOLD = 4;
function dominoFront(){
  let f = state.s4Base ? (Math.max(0, state.theta) % (DOM_N + DOM_HOLD)) : 0;
  if (!state.s4Step) f = Math.min(f, 1);   /* 无归纳步骤：波前止于 P(1) */
  return f;
}
function dominoProg(k, f){ return clamp(f - (k - 1), 0, 1); }
function fallenCount(f){ return clamp(Math.floor(f), 0, DOM_N); }

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 一、命题与逆否：P→Q 就是 P ⊆ Q ────── */
  implication: {
    label: { zh: '命题与逆否', en: 'Contrapositive' },
    params: ['probeN'],
    /* brand 原话「拖动探针 n 逐一检验」：探针整数从 0 走到 24，逐个落进
       P ⊆ Q 的嵌套里——n = 4, 8, 12… 落在内圈，n = 6, 10… 只在外圈，
       Q→P 的反例就是这么被撞见的。n 是整数：period 16 让每一步停约 1/3 秒，
       慢到能读出格子上的数字。 */
    drive: { key: 'probeN', from: 0, to: 24, period: 16, kind: 'linear' },
    brand: { zh: '「能被 4 整除 → 是偶数」不过是集合包含：P 圆整个装在 Q 圆里。逆否命题 ¬Q→¬P 读的是同一张图，逆命题 Q→P 却被 n = 6 一票否决。拖动探针 n 逐一检验。',
             en: '"Divisible by 4 → even" is just set inclusion: circle P sits wholly inside circle Q. The contrapositive ¬Q→¬P reads the very same picture, while the converse Q→P is vetoed by n = 6. Drag the probe n to test each case.' },
    tips: { zh: '顿悟：按 2 切到「正视 集合」——P ⊆ Q 的嵌套一旦看见，P→Q 与 ¬Q→¬P 就是同一句话（圆内推圆内 = 圆外推圆外）；打开「逆命题反例」，一个橙点 n = 6 击倒 Q→P。',
            en: 'Epiphany: press 2 for the face-on set view — once you see P nested in Q, P→Q and ¬Q→¬P are the same sentence (inside-to-inside = outside-to-outside); switch on "converse counterexample" and one orange dot, n = 6, fells Q→P.' },

        circle3(C, P_C[0], P_C[1], zL, P_R, { width: 1.3, dash: [5, 6], color: 'rgba(52,211,153,0.55)' });

        label3(C, [Q_C[0], -Q_R - 0.4, zL], t({ zh: '逆否 ¬Q → ¬P：同一张图', en: 'Contrapositive ¬Q → ¬P: same picture' }),

      /* 主层集合 */
      if (state.s1Q){
        circle3(C, Q_C[0], Q_C[1], 0, Q_R, { width: 6, color: 'rgba(167,139,250,0.13)' });
        circle3(C, Q_C[0], Q_C[1], 0, Q_R, { width: 2, color: 'rgba(167,139,250,0.95)' });
        label3(C, [Q_C[0] + Q_R*0.72, Q_C[1] + Q_R*0.85, 0], t({ zh: 'Q：偶数', en: 'Q: even' }),

          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }
      label3(C, [Q_C[0], Q_R + 0.5, 0], 'P → Q  ⇔  P ⊆ Q',
        { font: 'italic 13px ' + FONT_MATH, color: '#e2e8f0', align: 'center' });
      /* 整数样本点 */
      for (let n = 0; n <= 24; n++){
        const p = intPos(n);
        const col = n % 4 === 0 ? 'rgba(251,113,133,0.85)'
                  : n % 2 === 0 ? 'rgba(167,139,250,0.85)'
                  : 'rgba(159,176,200,0.75)';
        solidDot(C, [p[0], p[1], 0], 2.6, col);
      }
      /* 逆命题反例 n = 6 */
      if (state.s1ConvEx){
        const p6 = intPos(6);
        circle3(C, p6[0], p6[1], 0, 0.16, { width: 1.6, color: 'rgba(251,146,60,0.9)' });
        const sp6 = proj(C, [p6[0], p6[1], 0]);
        if (sp6) glowDot(sp6, 9, '#ffffff', 'rgba(251,146,60,0.9)');
        label3(C, [p6[0], p6[1] - 0.3, 0], t({ zh: '反例 n = 6：在 Q 不在 P ⇒ Q ↛ P', en: 'n = 6: in Q, not in P ⇒ Q ↛ P' }),

      /* 探针 */
      const nP = Math.round(state.probeN);

      const sp = proj(C, [pp[0], pp[1], 0]);
      if (sp) glowDot(sp, 13, '#ffffff', 'rgba(186,240,255,0.9)');
      label3(C, [pp[0], pp[1] + 0.26, 0], 'n = ' + nP,
        { font: 'italic 13px ' + FONT_MATH, color: '#e2e8f0', align: 'center' });
    },
    readout(){
      const n = Math.round(state.probeN), Pn = n % 4 === 0, Qn = n % 2 === 0;
      const yes = t({ zh: '真', en: 'true' }), no = t({ zh: '假', en: 'false' });
      return '<div><span class="sinC">P(n) = <b>' + (Pn ? yes : no) + '</b></span>&ensp;·&ensp;' +
             '<span class="cosC">Q(n) = <b>' + (Qn ? yes : no) + '</b></span>&ensp;·&ensp;n = <b>' + n + '</b></div>' +
             '<div class="sinC">P → Q：<b>' + t({ zh: '真（P ⊆ Q）', en: 'true (P ⊆ Q)' }) + '</b></div>' +
             '<div class="tanC">¬Q → ¬P：<b>' + t({ zh: '真 · 与原命题等价', en: 'true · equivalent to the original' }) + '</b></div>' +
             '<div class="cotC">Q → P：<b>' + t({ zh: '假 · 反例 n = 6', en: 'false · counterexample n = 6' }) + '</b></div>' +
             '<div class="dim">' + t({ zh: '逆命题与否命题互为逆否，同真同假', en: 'converse and inverse are each other’s contrapositive' }) + '</div>';
    }

  /* ────── 二、量词顺序：∀x∃y ≠ ∃y∀x ────── */
  quantifiers: {
    label: { zh: '量词顺序', en: 'Quantifier order' },
    params: ['domainM', 'quantPreset', 'witnessY'],
    /* tips 原话「可扫遍每一行都不满」——那句话本身就是一个动作：候选见证 y
       自己把每一行扫一遍，∃y∀x 一行也凑不齐，∀x∃y 却列列都有。谓词预设是
       离散选择（不驱动），域大小 m 换的是舞台不是论证。y 越界会被 clamp 到 m，
       所以取满 [1, 9]；period 12 让每行停约 0.7 秒，够看清整行亮没亮。 */
    drive: { key: 'witnessY', from: 1, to: 9, period: 12, kind: 'linear' },
    brand: { zh: '同样四个符号，顺序不同意思迥异：∀x∃y 允许每个 x 各找各的 y，∃y∀x 要求一个 y 同时伺候所有 x。在 m×m 真值网格上，前者是「每列都有亮格」，后者是「存在整行全亮」。',
             en: 'Same four symbols, different order, different meaning: ∀x∃y lets each x pick its own y, while ∃y∀x demands one y that serves every x. On an m×m truth grid the first says "every column has a lit cell", the second "some row is fully lit".' },
    tips: { zh: '顿悟：按 2 正视网格——配对谓词 x+y=m+1 下，玫红见证点排成阶梯（每列各有 y），可扫遍每一行都不满：∀x∃y 真而 ∃y∀x 假。把谓词换成 y ≥ x，第 m 行整行亮起，两者才同真。',
            en: 'Epiphany: press 2 to face the grid — under the pairing predicate x+y=m+1 the rose witnesses form a staircase (every column has its y), yet no row you scan is ever full: ∀x∃y true, ∃y∀x false. Switch the predicate to y ≥ x and row m lights up whole — only then do both hold.' },
    views: {
      iso:   { label: { zh: '立体',      en: '3D' },         az: -0.6,  el: 0.45, dist: 8.5, tx: 0, ty: 0, tz: 0 },
      front: { label: { zh: '正视 网格', en: 'Front grid' },  az: 0.001, el: 0.02, dist: 6.8, tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 's2Witness', label: { zh: '每列见证（∀x∃y）', en: 'Column witnesses (∀x∃y)' }, color: '#fb7185', checked: true },
      { key: 's2Row',     label: { zh: '整行扫描（∃y∀x）', en: 'Row scan (∃y∀x)' },        color: '#a78bfa', checked: true },
      { key: 's2Cells',   label: { zh: '真值格',            en: 'Truth cells' },            color: '#34d399', checked: true },
      { key: 'showGrid',  label: { zh: '网格',              en: 'Grid' },                   color: '#64748b', checked: true }
    ],
    draw(C){
      const m = Math.round(state.domainM), pred = Math.round(state.quantPreset);
      const S = 3.6 / m, x0 = -1.8, y0 = -1.8;
      const R = (x, y) => pred === 1 ? (x + y === m + 1) : (y >= x);
      if (state.showGrid){
        for (let i = 0; i <= m; i++){
          line3(C, [x0 + i*S, y0, 0], [x0 + i*S, y0 + m*S, 0], { width: 1, color: 'rgba(148,163,184,0.14)' });
          line3(C, [x0, y0 + i*S, 0], [x0 + m*S, y0 + i*S, 0], { width: 1, color: 'rgba(148,163,184,0.14)' });
        }
      }
      for (let i = 1; i <= m; i++){
        label3(C, [x0 + (i - 0.5)*S, y0 - 0.22, 0], '' + i, { size: 10, color: 'rgba(159,176,200,0.7)', align: 'center' });
        label3(C, [x0 - 0.2, y0 + (i - 0.5)*S, 0], '' + i, { size: 10, color: 'rgba(159,176,200,0.7)', align: 'right' });
      }
      label3(C, [x0 + m*S + 0.35, y0 - 0.22, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      label3(C, [x0 - 0.2, y0 + m*S + 0.3, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      /* 真值格 */
      if (state.s2Cells){
        for (let i = 1; i <= m; i++) for (let j = 1; j <= m; j++){
          if (!R(i, j)) continue;
          const cx = x0 + (i - 0.5)*S, cy = y0 + (j - 0.5)*S, h = S * 0.36;
          fillQuad(C, [[cx-h, cy-h, 0], [cx+h, cy-h, 0], [cx+h, cy+h, 0], [cx-h, cy+h, 0]], 'rgba(52,211,153,0.25)');
          strokePoly(C, [[cx-h, cy-h, 0], [cx+h, cy-h, 0], [cx+h, cy+h, 0], [cx-h, cy+h, 0], [cx-h, cy-h, 0]],
            { width: 1.4, color: 'rgba(52,211,153,0.8)' });
        }
      }
      /* 每列见证（∀x∃y） */
      if (state.s2Witness){
        for (let i = 1; i <= m; i++){
          let wj = 0;
          for (let j = 1; j <= m; j++) if (R(i, j)){ wj = j; break; }
          if (!wj) continue;
          const cx = x0 + (i - 0.5)*S, cy = y0 + (wj - 0.5)*S;
          line3(C, [cx, y0 - 0.05, 0], [cx, cy, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,113,133,0.6)' });
          const sp = proj(C, [cx, cy, 0]);
          if (sp) glowDot(sp, 8, '#ffffff', 'rgba(251,113,133,0.9)');
        }
        label3(C, [x0, y0 + m*S + 0.62, 0], t({ zh: '∀x ∃y：每列各找各的 y ✓', en: '∀x ∃y: each column finds its own y ✓' }),
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left' });
      }
      /* 整行扫描（∃y∀x） */
      if (state.s2Row){
        const w = clamp(Math.round(state.witnessY), 1, m);
        const cy = y0 + (w - 0.5)*S;
        line3(C, [x0 - 0.35, cy, 0], [x0 + m*S + 0.35, cy, 0], { width: 1.5, dash: [5, 6], color: 'rgba(167,139,250,0.8)' });
        let cov = 0;
        for (let i = 1; i <= m; i++) if (R(i, w)){
          cov++;
          circle3(C, x0 + (i - 0.5)*S, cy, 0, S * 0.3, { width: 1.6, color: 'rgba(167,139,250,0.9)' });
        }
        const full = cov === m;
        label3(C, [x0 + m*S + 0.45, cy, 0], 'y = ' + w + '：' + cov + '/' + m, { size: 11, color: '#a78bfa', align: 'left' });
        label3(C, [x0, y0 - 0.6, 0],
          t(full ? { zh: '∃y ∀x：y = ' + w + ' 整行全亮 ✓', en: '∃y ∀x: row y = ' + w + ' fully lit ✓' }
                 : { zh: '∃y ∀x：整行不满 ⇒ 此 y 不是统一见证', en: '∃y ∀x: row not full ⇒ this y is no uniform witness' }),
          { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'left' });
      }
    },
    readout(){
      const m = Math.round(state.domainM), pred = Math.round(state.quantPreset);
      const w = clamp(Math.round(state.witnessY), 1, m);
      const R = (x, y) => pred === 1 ? (x + y === m + 1) : (y >= x);
      let cov = 0;
      for (let i = 1; i <= m; i++) if (R(i, w)) cov++;
      const exTrue = pred === 2;
      return '<div>R(x,y)：<b>' + t(pred === 1 ? { zh: 'x + y = m + 1', en: 'x + y = m + 1' } : { zh: 'y ≥ x', en: 'y ≥ x' }) + '</b>&ensp;·&ensp;m = <b>' + m + '</b></div>' +
             '<div class="sinC">∀x ∃y R：<b>' + t({ zh: '真（逐列见证）', en: 'true (per-column witnesses)' }) + '</b></div>' +
             '<div class="cosC">∃y ∀x R：<b>' + (exTrue ? t({ zh: '真（y = m 整行）', en: 'true (row y = m)' }) : t({ zh: '假（无整行全亮）', en: 'false (no fully lit row)' })) + '</b></div>' +
             '<div class="tanC">' + t({ zh: '当前行 y = ', en: 'current row y = ' }) + w + '：<b>' + cov + ' / ' + m + '</b></div>' +
             '<div class="dim">' + t({ zh: '有限网格只是语义模型，不能替代一般证明', en: 'a finite grid models the semantics — it does not replace a general proof' }) + '</div>';
    }
  },

  /* ────── 三、反例与反证 ────── */
  counterexample: {
    label: { zh: '反例与反证', en: 'Counterexample' },
    params: ['checkN'],
    /* tips 原话「把『检验上限 N』拖过 41」：证据一枚枚攒到 41 枚，
       第 41 步橙点亮起、玫红横梁应声而断——例子无论多少都不是证明。
       取满 [0, 45]，越过 41 之后还留几步让人看清「断了就是断了」。 */
    drive: { key: 'checkN', from: 0, to: 45, period: 14, kind: 'linear' },
    brand: { zh: '欧拉多项式 n²−n+41 连出 41 个素数，看似铁证如山——检验到 n = 41 却轰然倒塌：41²−41+41 = 41·41。全称命题一个反例即死；反证法则反过来，假设结论为假，让推理链自己撞进矛盾 ⊥。',
             en: 'Euler’s polynomial n²−n+41 delivers 41 primes in a row — overwhelming evidence, it seems — until n = 41 brings it down: 41²−41+41 = 41·41. One counterexample kills a universal claim; proof by contradiction runs the other way, assuming the conclusion false and letting the chain crash into ⊥.' },
    tips: { zh: '顿悟：把「检验上限 N」拖过 41，再按 2 正视——41 枚翠绿证据旁一个橙点，玫红横梁应声而断：例子无论多少都不是证明。按 3 侧视「反证链」，√2 的推理沿 z 轴五步撞上 ⊥。',
            en: 'Epiphany: drag "check up to N" past 41, then press 2 to face the row — one orange dot beside 41 emerald confirmations snaps the rose beam: no number of examples is a proof. Press 3 for the contradiction chain — √2’s reasoning marches five steps down z into ⊥.' },
    views: {
      iso:   { label: { zh: '立体',      en: '3D' },          az: -0.7,       el: 0.35, dist: 8.5, tx: 0, ty: 0, tz: 1.2 },
      front: { label: { zh: '正视 证据', en: 'Front row' },    az: 0.001,      el: 0.02, dist: 6.5, tx: 0, ty: 0, tz: 0 },
      chain: { label: { zh: '侧视 反证链', en: 'Chain side' }, az: -Math.PI/2, el: 0.15, dist: 9,   tx: 0, ty: -0.4, tz: 2.6,
               onSelect: () => { state.s3Chain = true; syncToggle('s3Chain'); } }
    },
    toggles: [
      { key: 's3Claim', label: { zh: '全称命题横梁', en: 'Universal-claim beam' },   color: '#fb7185', checked: true },
      { key: 's3Chain', label: { zh: '反证链（√2）', en: 'Contradiction chain (√2)' }, color: '#a78bfa', checked: true },
      { key: 's3Dots',  label: { zh: '逐例检验',     en: 'Case-by-case evidence' },  color: '#34d399', checked: true },
      { key: 'showGrid',label: { zh: '网格',         en: 'Grid' },                   color: '#64748b', checked: true }
    ],
    draw(C){
      if (state.showGrid) drawGridXY(C, 2.5, 0.5);
      const N = Math.round(state.checkN);
      const X = n => -2.2 + n * (4.4 / 45);
      /* n 轴 */
      line3(C, [-2.4, 0, 0], [2.5, 0, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [2.5, 0, 0], [2.3, 0, 0], AXIS);
      label3(C, [2.72, 0, 0], 'n', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (let n = 0; n <= 45; n += 5){
        line3(C, [X(n), -0.05, 0], [X(n), 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [X(n), -0.24, 0], '' + n, { size: 10, color: 'rgba(159,176,200,0.55)', align: 'center' });
      }
      const broken = N >= 41;
      /* 全称命题横梁 */
      if (state.s3Claim){
        if (broken){
          const col = 'rgba(251,146,60,0.55)';
          line3(C, [X(0), 1.5, 0], [X(41) - 0.12, 1.5, 0], { width: 2, dash: [4, 5], color: col });
          line3(C, [X(41) + 0.12, 1.5, 0], [X(45), 1.5, 0], { width: 2, dash: [4, 5], color: col });
          label3(C, [X(43), 1.74, 0], t({ zh: '已被击穿', en: 'refuted' }), { size: 11, color: '#fb923c', align: 'center' });
        } else {
          line3(C, [X(0), 1.5, 0], [X(45), 1.5, 0], { width: 6, color: 'rgba(251,113,133,0.13)' });
          line3(C, [X(0), 1.5, 0], [X(45), 1.5, 0], { width: 2, color: 'rgba(251,113,133,0.9)' });
        }
        label3(C, [X(0), 1.78, 0], t({ zh: '猜想：∀n，n²−n+41 为素数', en: 'Claim: ∀n, n²−n+41 is prime' }),
          { font: 'italic 13px ' + FONT_MATH, color: broken ? '#fb923c' : '#fb7185', align: 'left' });
      }
      /* 逐例检验 */
      if (state.s3Dots){
        let compIdx = 0;
        for (let n = 0; n <= Math.min(N, 45); n++){
          const v = n*n - n + 41, x = X(n);
          if (isPrime(v)){
            solidDot(C, [x, 0.8, 0], 2.6, 'rgba(52,211,153,0.9)');
          } else {
            const d = smallestFactor(v);
            line3(C, [x, 0.8, 0], [x, -0.5, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,146,60,0.8)' });
            const sp = proj(C, [x, 0.8, 0]);
            if (sp) glowDot(sp, 10, '#ffffff', 'rgba(251,146,60,0.95)');
            label3(C, [x, -0.68 - (compIdx % 3) * 0.24, 0], 'n = ' + n + '：' + d + '·' + (v / d),
              { size: 11, color: '#fb923c', align: 'center' });
            if (n === 41)
              label3(C, [x, -1.55, 0], t({ zh: '反例：一个就够', en: 'counterexample: one is enough' }),
                { size: 11, color: '#fb923c', align: 'center' });
            compIdx++;
          }
        }
        label3(C, [X(N), 0.45, 0], 'N = ' + N, { size: 10, color: 'rgba(159,176,200,0.8)', align: 'center' });
      }
      /* 反证链（沿 z：推理时间） */
      if (state.s3Chain){
        for (let k = 0; k < CHAIN.length; k++){
          const z = 0.8 + k * 1.15, last = k === CHAIN.length - 1;

let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

    const v = o.v || 1;

    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {

        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });

    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

  };

const brandDesc = document.getElementById('brandDesc');

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {

    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
