<!-- ============================================================
  三角函数的本质 · 交互式数学可视化
  本工具早于 PARAMS/SCENES 声明层，手写静态面板 + 双页签，
  engine-version 留空为 pre-declarative（不源自受管 starter）。

  两个页签共享同一段圆周运动（同一个运动，不同的测量）：
    正弦 · 余弦 —— 单位圆上匀速圆周运动的 y / x 投影随时间展开
    正切 · 余切 —— 半径延长线与圆的两条切线（x=A / y=A）的交点随时间展开

  采样原则：记录当时的真实值（参数中途改变，历史不重算）

  金光闪（设计系统 §4.7）：本工具**两个页签都不加**，且**本文件未移植
  goldHit / drawGoldFlash / goldFlashReset 三个引擎部件**——除本段说明与下方
  版本记录外，这三个名字在文件里一次也不出现。这是有意为之，不是漏做。两条理由：
    · 内容上：两页画的都是恒等式 / 函数图像。「正弦 · 余弦」页把匀速圆周运动的
      投影按时间铺开，那条正弦曲线上每一点都是同一个定义在不同时刻的取值，
      没有哪一刻某个量「终于」等于另一个；「正切 · 余切」页同理，tan 的几何意义
      （半径延长线与切线 x = A 的交点高度）逐帧成立。逐页的数与理由写在
      drawSC / drawTC 两个函数之前。
    · 结构上：本文件是 pre-declarative 引擎（无 PARAMS / SCENES，手写静态面板、
      draw() 里按 state.tab 分派）。既然两页都不闪，移植那段引擎部件只会留下
      一段永不执行的死代码，还会让「本文件已接金光闪」的错觉传下去。
      日后若本文件迁到声明式引擎，再连同判据一起补。

  版本记录（新→旧）：
    1.2.0  2026-08-09  金光闪（§4.7）普查表态：两个页签画的都是恒等式 / 函数图像，
                       全部有意不加；本文件为 pre-declarative 引擎，也不移植
                       goldHit / drawGoldFlash 部件。理由见上方说明与
                       drawSC / drawTC 两处注释
    1.1.1  2026-08-01  帧级异常兜底：单帧抛出不再杀死渲染循环
    1.1.0  2026-07-11  全量双语支持（中/EN 切换）
    1.0.0  2026-07-11  首个版本
============================================================ -->
<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}
.tab.active[data-tab="tc"]{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.55);color:#8df0c6}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:14px;line-height:1;cursor:pointer}
.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn{padding:5px 9px;font-size:11.5px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 页签内容切换 */
body[data-tab="sc"] .tabsec[data-tab="tc"]{display:none}
body[data-tab="tc"] .tabsec[data-tab="sc"]{display:none}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
.readout b{font-weight:600;color:#e8eef7}
.readout .sinC b{color:var(--trace-rose)}
.readout .cosC b{color:var(--trace-violet)}
.readout .tanC b{color:var(--trace-emerald)}
.readout .cotC b{color:var(--trace-orange)}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  .tabs{top:52px;left:14px;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}
}
</style>

<script>
'use strict';
/* ================= i18n 核心 ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

const TOOL = {
  id: 'trig-essence-3d-new',

/* 页面级词典：静态面板节点通过 data-i18n="<key>" 关联到此处的 zh/en 文案 */
const STR = {

/* ================= 常量与状态 ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面
const CLIP = 3.0;        // tan / cot 的显示裁剪范围（世界单位）
const EXT_SC = 1.9;      // 第一页坐标轴半长
const EXT_TC = 3.35;     // 第二页坐标轴半长

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = {
  omega: 1, amp: 1, phi: 0, waveSpeed: 1.2,
  running: true, t: 0, theta: 0,
  showSin: true, showCos: false, showHelix: false,
  showTan: true, showCot: false,
  showGuides: true, showGrid: true

/* 历史采样：同时记录 x 与 y —— 两个页签共用同一段运动历史；

let curTab = 'sc';

  sc: {
    iso:    { az: -0.95,      el: 0.30,  dist: 11,   tx: 0, ty: 0, tz: 2.8 },

    sine:   { az: -Math.PI/2, el: 0.001, dist: 11.5, tx: 0, ty: 0, tz: 3.4 },
    cosv:   { az: -Math.PI/2, el: 1.52,  dist: 11.5, tx: 0, ty: 0, tz: 3.4 }

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 通用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

function drawAxes(C, v, ex, ey, yTicks, xTicks) {
  /* x 轴 */
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  /* y 轴 */
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  /* t 轴（时间） */
  line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
  label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  /* y 轴刻度 */
  for (const k of yTicks) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  /* x 轴刻度 */
  for (const k of xTicks) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
  /* t 轴每秒刻度 */
  const every = v < 0.8 ? 2 : 1;
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
    if (k % every === 0) {
      label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* ================= 第一页：正弦 / 余弦 ================= */
function drawGridSC(C, A, v) {
  const gr = Math.max(1, Math.ceil(A*2)/2);
  for (let i = -gr*2; i <= gr*2; i++) {
    if (i === 0) continue;
    const y = i / 2;
    line3(C, [0, y, 0], [0, y, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -gr, k*v], [0, gr, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
  if (state.showCos) {
    for (let i = -gr*2; i <= gr*2; i++) {
      if (i === 0) continue;
      const x = i / 2;
      line3(C, [x, 0, 0], [x, 0, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.07)' });
    }
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [-gr, 0, k*v], [gr, 0, k*v], { width: 1, color: 'rgba(148,163,184,0.05)' });
    }
  }
}

/* 金光闪（§4.7）：「正弦 · 余弦」页有意**不加**——恒等式 / 函数图像（处处成立），
   兼频率过密。本页画的 y = A·sin(ωt+φ) 是一条函数图像：曲线上每一点都是同一个
   定义在不同时刻的取值，玫红头亮点与圆上动点的 y 投影每一帧都严格对齐（同一个
   Py 算出来的），没有哪一刻它们「终于」对齐。
   唯一像地标的是特征点（过零、峰值 ±A），但那是周期复发而非到达：θ 由引擎时钟
   积分（state.theta += ω·dt），默认 ω = 1 ⇒ 过零每 π/ω = 3.14 s 一次，把过零与峰值
   一起算则每 π/2ω = 1.57 s 一次；滑杆推到 ω = 4 ⇒ 0.79 s / 0.39 s，比一闪的衰减
   时长（规范定的 1.05 s）还短，会连成常亮的琥珀底色。
   周期 T 这个量本页也画了（drawPeriodBracket），但它是被标注出来的常量，
   不是走向某处的量。 */
function drawSC(C) {
  const A = state.amp, v = state.waveSpeed;
  const th = state.theta + state.phi;
  const Px = A * Math.cos(th), Py = A * Math.sin(th);

  if (state.showGrid) drawGridSC(C, A, v);

  if (state.showGuides && state.showSin) {
    line3(C, [0,  A, 0], [0,  A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(251,113,133,0.22)' });
    line3(C, [0, -A, 0], [0, -A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(251,113,133,0.22)' });
  }

  drawAxes(C, v, EXT_SC, EXT_SC, [1], []);
  if (state.showGuides) drawPeriodBracket(C, TAU / state.omega, v, 0, -(A + 0.38), 'T = ' + fmt(TAU / state.omega) + ' s');

  /* 历史曲线（由新到旧；最新点贴着 t=0 平面） */
  const wavePts = [], cosPts = [], helixPts = [];
  for (let i = samples.length - 1; i >= 0; i--) {
    const s = samples[i];
    const z = (state.t - s.t) * v;
    if (z > WAVE_LEN) break;
    if (state.showSin)   wavePts.push([0, s.y, z]);
    if (state.showCos)   cosPts.push([s.x, 0, z]);
    if (state.showHelix) helixPts.push([s.x, s.y, z]);
  }
  if (helixPts.length > 1) {
    strokePoly(C, helixPts, { width: 1.6, fade: ['rgba(226,232,240,0.85)', 'rgba(226,232,240,0)'] });
  }
  if (cosPts.length > 1) {
    strokePoly(C, cosPts, { width: 5.5, color: 'rgba(167,139,250,0.13)' });
    strokePoly(C, cosPts, { width: 2.2, fade: ['rgba(167,139,250,1)', 'rgba(167,139,250,0.04)'] });
  }
  if (wavePts.length > 1) {
    strokePoly(C, wavePts, { width: 5.5, color: 'rgba(251,113,133,0.14)' });
    strokePoly(C, wavePts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
  }

  drawCircle(C, A);
  if (state.showGuides) drawAngleArc(C, th, A);

  /* 旋转半径 */
  line3(C, [0, 0, 0], [Px, Py, 0], { width: 2, color: 'rgba(241,245,249,0.92)' });

  /* 投影虚线 */
  if (state.showGuides) {
    line3(C, [Px, Py, 0], [0, Py, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,113,133,0.8)' });
    if (state.showCos) {
      line3(C, [Px, Py, 0], [Px, 0, 0], { width: 1.5, dash: [7, 7], color: 'rgba(167,139,250,0.8)' });
    }
  }

  /* 投影点（= 波形最前端） */
  if (state.showSin || state.showGuides) {
    const s = proj(C, [0, Py, 0]);
    if (s) glowDot(s, 9, '#ffffff', 'rgba(251,113,133,0.85)');
  }
  if (state.showCos) {
    const s = proj(C, [Px, 0, 0]);
    if (s) glowDot(s, 8, '#ffffff', 'rgba(167,139,250,0.85)');
  }

  /* 圆上的运动点 P */
  const sp = proj(C, [Px, Py, 0]);
  if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');

  /* 公式标注 */
  const zl = Math.min(2.8, 1.6 * v + 0.6);
  if (state.showSin) {
    label3(C, [0, A + 0.26, zl], 'y = A·sin(ωt + φ)',
      { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
  }
  if (state.showCos) {
    label3(C, [A + 0.3, 0, zl], 'x = A·cos(ωt + φ)',
      { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
  }
}

/* ================= 第二页：正切 / 余切 ================= */
/* ===BUILD-CURVE=== */
/* 构建 tan / cot 折线：θ 空间细分 + 渐近线断开 + 裁剪到 ±CLIP。
   kind='tan'：值 = A·tanθ，曲线位于平面 x=A；渐近线在 θ = kπ ± π/2（cosθ=0）
   kind='cot'：值 = A·cotθ，曲线位于平面 y=A；渐近线在 θ = kπ（sinθ=0）
   返回 { pts: [[x,y,z] | null, ...]（由新到旧）, asymZ: [z, ...] } */
function buildBranchCurve(samps, tNow, A, v, kind) {
  const pts = [], asymZ = [];
  const isTan = kind === 'tan';
  const val = th => isTan ? A * Math.tan(th) : A / Math.tan(th);
  const br  = th => isTan ? Math.floor((th + Math.PI/2) / Math.PI) : Math.floor(th / Math.PI);
  function rangeOf(k) {           /* 分支 k 内 |值| ≤ CLIP 的 θ 区间 */
    if (isTan) { const w = Math.atan(CLIP / A); return [k*Math.PI - w, k*Math.PI + w]; }
    const d = Math.atan(A / CLIP);
    return [k*Math.PI + d, (k+1)*Math.PI - d];
  }
  let lastTh = null;              /* 最近一次输出点的 θ（判断连续性） */
  function emitRange(thNew, zNew, thOld, zOld) {   /* thNew ≥ thOld，同一分支内 */
    const r = rangeOf(br(thNew));
    const hi = Math.min(thNew, r[1]), lo = Math.max(thOld, r[0]);
    if (hi < lo) {
      if (pts.length && pts[pts.length-1] !== null) pts.push(null);
      lastTh = null;
      return;
    }
    if (lastTh === null || Math.abs(lastTh - hi) > 1e-9) {
      if (pts.length && pts[pts.length-1] !== null) pts.push(null);
    }
    const span = (thNew - thOld) || 1e-12;
    const zAt = th => zNew + (thNew - th) / span * (zOld - zNew);
    const n = Math.min(12, Math.max(1, Math.ceil(Math.abs(val(hi) - val(lo)) / 0.3)));
    for (let j = 0; j <= n; j++) {
      const th = hi - (hi - lo) * j / n;
      const w = val(th), z = zAt(th);
      pts.push(isTan ? [A, w, z] : [w, A, z]);
    }
    lastTh = lo;
  }
  let prev = null;                /* { raw, thu, z } */
  for (let i = samps.length - 1; i >= 0; i--) {
    const s = samps[i];
    const z = (tNow - s.t) * v;
    if (z > WAVE_LEN) break;
    const raw = Math.atan2(s.y, s.x);
    const thu = prev === null ? raw : prev.thu + wrapPI(raw - prev.raw);
    const cur = { raw: raw, thu: thu, z: z };
    if (prev !== null) {
      const bN = br(prev.thu), bO = br(cur.thu);
      if (bN === bO) {
        emitRange(prev.thu, prev.z, cur.thu, cur.z);
      } else if (bN - bO === 1) {
        /* 恰好跨过一条渐近线 */
        const thB = isTan ? bN * Math.PI - Math.PI/2 : bN * Math.PI;
        const f = (prev.thu - thB) / ((prev.thu - cur.thu) || 1e-12);
        const zB = prev.z + f * (cur.z - prev.z);
        asymZ.push(zB);
        emitRange(prev.thu, prev.z, thB + 1e-6, zB);
        emitRange(thB - 1e-6, zB, cur.thu, cur.z);
      } else {
        if (pts.length && pts[pts.length-1] !== null) pts.push(null);
        lastTh = null;
      }
    }
    prev = cur;
  }
  return { pts: pts, asymZ: asymZ };
}
/* ===BUILD-CURVE-END=== */

function drawGridTC(C, A, v) {
  /* 正切平面 x = A */
  for (let iy = -CLIP; iy <= CLIP; iy++) {
    if (iy === 0) continue;
    line3(C, [A, iy, 0], [A, iy, WAVE_LEN], { width: 1, color: 'rgba(52,211,153,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [A, -CLIP, k*v], [A, CLIP, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
  line3(C, [A, 0, 0], [A, 0, WAVE_LEN], { width: 1.2, color: 'rgba(52,211,153,0.35)' });
  /* 余切平面 y = A */
  if (state.showCot) {
    for (let ix = -CLIP; ix <= CLIP; ix++) {
      if (ix === 0) continue;
      line3(C, [ix, A, 0], [ix, A, WAVE_LEN], { width: 1, color: 'rgba(251,146,60,0.09)' });
    }
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [-CLIP, A, k*v], [CLIP, A, k*v], { width: 1, color: 'rgba(148,163,184,0.05)' });
    }
    line3(C, [0, A, 0], [0, A, WAVE_LEN], { width: 1.2, color: 'rgba(251,146,60,0.3)' });
  }
}

/* 金光闪（§4.7）：「正切 · 余切」页有意**不加**——恒等式 / 函数图像（处处成立），
   次因是无上升沿的发散量。本页画的 tan θ = A·sin θ/cos θ，其几何意义（半径延长线
   与切线 x = A 的交点高度）是每一帧都成立的构造，不存在「终于相等」的那一刻。
   最像地标的 θ → π/2 不是到达而是发散：tan 在那里趋于无穷，本页只能把它裁在
   CLIP = 3.0（见文件顶部常量，A = 1 时对应 θ = 71.57°，之后曲线断开、
   buildBranchCurve 换一支新分支）。曲线永远够不到那条渐近线，只是撞上一条
   为了画得出来才设的显示裁剪线——闪它等于把「发散」讲成「抵达」。
   频率上也不合格：tan 的周期是 π/ω，默认 ω = 1 ⇒ 3.14 s 一次，
   ω = 4 ⇒ 0.79 s 一次，短于一闪的衰减时长（1.05 s）。 */
function drawTC(C) {
  const A = state.amp, v = state.waveSpeed;
  const th = state.theta + state.phi;
  const Px = A * Math.cos(th), Py = A * Math.sin(th);
  const c = Math.cos(th), sn = Math.sin(th);
  const tv = A * Math.tan(th);
  const cv = A / Math.tan(th);

  if (state.showGrid) drawGridTC(C, A, v);

  /* tan = ±1（即 ±A）参考虚线 */
  if (state.showGuides && state.showTan) {
    line3(C, [A,  A, 0], [A,  A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(52,211,153,0.20)' });
    line3(C, [A, -A, 0], [A, -A, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(52,211,153,0.20)' });
  }

  drawAxes(C, v, EXT_TC, EXT_TC, [1, 2, 3], [1, 2, 3]);
  if (state.showGuides) {
    drawPeriodBracket(C, Math.PI / state.omega, v, state.showTan ? A : 0, -(CLIP + 0.35),
      'T = π/ω = ' + fmt(Math.PI / state.omega) + ' s');
  }

  /* ---- tan / cot 历史曲线 ---- */
  if (state.showTan) {
    const bc = buildBranchCurve(samples, state.t, A, v, 'tan');
    if (bc.pts.length > 1) {
      strokePoly(C, bc.pts, { width: 5.5, color: 'rgba(52,211,153,0.13)' });
      strokePoly(C, bc.pts, { width: 2.2, fade: ['rgba(52,211,153,1)', 'rgba(52,211,153,0.05)'] });
    }
    if (state.showGuides) {
      for (const z of bc.asymZ) {
        line3(C, [A, -CLIP, z], [A, CLIP, z], { width: 1, dash: [4, 5], color: 'rgba(52,211,153,0.30)' });
      }
    }
  }
  if (state.showCot) {
    const bc = buildBranchCurve(samples, state.t, A, v, 'cot');
    if (bc.pts.length > 1) {
      strokePoly(C, bc.pts, { width: 5.5, color: 'rgba(251,146,60,0.12)' });
      strokePoly(C, bc.pts, { width: 2.2, fade: ['rgba(251,146,60,1)', 'rgba(251,146,60,0.05)'] });
    }
    if (state.showGuides) {
      for (const z of bc.asymZ) {
        line3(C, [-CLIP, A, z], [CLIP, A, z], { width: 1, dash: [4, 5], color: 'rgba(251,146,60,0.30)' });
      }
    }
  }

  /* ---- 切线（结构线） ---- */
  if (state.showTan) {
    line3(C, [A, -CLIP, 0], [A, CLIP, 0], { width: 1.6, color: 'rgba(52,211,153,0.55)' });
    solidDot(C, [A, 0, 0], 3, '#34d399');
    label3(C, [A, CLIP + 0.16, 0], 'x = A', { font: 'italic 11px ' + FONT_MATH, color: 'rgba(52,211,153,0.8)', align: 'center' });
  }
  if (state.showCot) {
    line3(C, [-CLIP, A, 0], [CLIP, A, 0], { width: 1.6, color: 'rgba(251,146,60,0.55)' });
    solidDot(C, [0, A, 0], 3, '#fb923c');
    label3(C, [CLIP + 0.24, A, 0], 'y = A', { font: 'italic 11px ' + FONT_MATH, color: 'rgba(251,146,60,0.8)', align: 'left' });
  }

  drawCircle(C, A);
  if (state.showGuides) drawAngleArc(C, th, A);

  /* 旋转半径 */
  line3(C, [0, 0, 0], [Px, Py, 0], { width: 2, color: 'rgba(241,245,249,0.92)' });

  /* ---- 半径延长虚线（同一条直线同时给出 tan 与 cot 的交点） ---- */
  if (state.showGuides && (state.showTan || state.showCot)) {
    const box = CLIP + 0.35;
    const sB = Math.min(
      Math.abs(c)  > 1e-6 ? box / Math.abs(c)  : 1e9,
      Math.abs(sn) > 1e-6 ? box / Math.abs(sn) : 1e9
    );
    const cl = s => {
      if (!isFinite(s)) s = (s > 0 ? 1 : -1) * 1e9;
      return Math.sign(s) * Math.min(Math.abs(s), sB);
    };
    const list = [0];
    if (state.showTan) list.push(cl(A / c));
    if (state.showCot) list.push(cl(A / sn));
    const s0 = Math.min.apply(null, list), s1 = Math.max.apply(null, list);
    line3(C, [s0*c, s0*sn, 0], [s1*c, s1*sn, 0], { width: 1.3, dash: [6, 6], color: 'rgba(226,232,240,0.45)' });
  }

  /* ---- 正切线段（切线上的读数）与交点 Q ---- */
  if (state.showTan) {
    if (Math.abs(tv) <= CLIP) {
      line3(C, [A, 0, 0], [A, tv, 0], { width: 6, color: 'rgba(52,211,153,0.28)' });
      line3(C, [A, 0, 0], [A, tv, 0], { width: 3, color: '#34d399' });
      const q = proj(C, [A, tv, 0]);
      if (q) glowDot(q, 10, '#ffffff', 'rgba(52,211,153,0.9)');
    } else {
      const sg = tv > 0 ? 1 : -1;
      strokePoly(C, [[A, 0, 0], [A, sg * CLIP, 0]], { width: 3, fade: ['#34d399', 'rgba(52,211,153,0)'] });
      label3(C, [A, sg * (CLIP + 0.28), 0], '∞', { font: 'italic 15px ' + FONT_MATH, color: '#34d399', align: 'center' });
    }
  }
  /* ---- 余切线段与交点 R ---- */
  if (state.showCot) {
    if (Math.abs(cv) <= CLIP) {
      line3(C, [0, A, 0], [cv, A, 0], { width: 6, color: 'rgba(251,146,60,0.26)' });
      line3(C, [0, A, 0], [cv, A, 0], { width: 3, color: '#fb923c' });
      const q = proj(C, [cv, A, 0]);
      if (q) glowDot(q, 9, '#ffffff', 'rgba(251,146,60,0.9)');
    } else {
      const sg = cv > 0 ? 1 : -1;
      strokePoly(C, [[0, A, 0], [sg * CLIP, A, 0]], { width: 3, fade: ['#fb923c', 'rgba(251,146,60,0)'] });
      label3(C, [sg * (CLIP + 0.3), A, 0], '∞', { font: 'italic 15px ' + FONT_MATH, color: '#fb923c', align: 'center' });
    }
  }

  /* 圆上的运动点 P */
  const sp = proj(C, [Px, Py, 0]);
  if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');

  /* 公式标注 */
  const zl = Math.min(2.8, 1.6 * v + 0.6);
  if (state.showTan) {
    label3(C, [A, CLIP + 0.55, zl], 'y = A·tan(ωt + φ)',
      { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'center' });
  }
  if (state.showCot) {
    label3(C, [CLIP + 0.55, A, zl], 'x = A·cot(ωt + φ)',
      { font: 'italic 13px ' + FONT_MATH, color: '#fb923c', align: 'center' });
  }
}

/* ================= 主绘制 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  if (curTab === 'sc') drawSC(C);
  else drawTC(C);
}

/* ================= 模拟与主循环 ================= */
function pushSample() {
  const th = state.theta + state.phi;
  samples.push({ t: state.t, x: state.amp * Math.cos(th), y: state.amp * Math.sin(th) });
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      pushSample();
    }
    const windowSec = WAVE_LEN / state.waveSpeed + 0.5;
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

/* ================= 读数 ================= */
const roEl = document.getElementById('readout');
function updateReadout() {
  const th = state.theta + state.phi;
  const deg = mod2pi(th) * 180 / Math.PI;
  const turns = th / TAU;
  const headHtml =
    '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt+φ = <b>' + fmt(th) + '</b> rad</div>' +
    '<div class="dim">' + t({ zh: '≡ ' + deg.toFixed(0) + '°（第 ' + fmt(turns) + ' 圈）', en: '≡ ' + deg.toFixed(0) + '° (turn ' + fmt(turns) + ')' }) + '</div>';
  if (curTab === 'sc') {
    roEl.innerHTML = headHtml +
      '<div class="sinC">y = A·sin θ = <b>' + fmtS(state.amp * Math.sin(th)) + '</b></div>' +
      '<div class="cosC">x = A·cos θ = <b>' + fmtS(state.amp * Math.cos(th)) + '</b></div>' +
      '<div class="dim">f = ω/2π = ' + (state.omega / TAU).toFixed(3) + ' Hz&ensp;·&ensp;T = ' + fmt(TAU / state.omega) + ' s</div>';
  } else {
    const dsp = x => (!isFinite(x) || Math.abs(x) > 999) ? (x > 0 ? '+∞' : '−∞') : fmtS(x);
    roEl.innerHTML = headHtml +
      '<div class="tanC">y = A·tan θ = <b>' + dsp(state.amp * Math.tan(th)) + '</b></div>' +
      '<div class="cotC">x = A·cot θ = <b>' + dsp(state.amp / Math.tan(th)) + '</b></div>' +
      '<div class="dim">T = π/ω = ' + fmt(Math.PI / state.omega) + ' s&ensp;·&ensp;' + t({ zh: 'cos θ = 0 处为渐近线', en: 'asymptote at cos θ = 0' }) + '</div>';
  }
}

/* ================= 控件绑定 ================= */
function bindRange(rid, vid, key, fm) {
  const r = document.getElementById(rid), vv = document.getElementById(vid);
  const upd = () => { state[key] = parseFloat(r.value); vv.textContent = fm(state[key]); };
  r.addEventListener('input', upd);
  upd();
  return upd;
}
bindRange('rOmega', 'vOmega', 'omega', x => fmt(x) + ' rad/s');
bindRange('rAmp', 'vAmp', 'amp', x => fmt(x));
const updSpeed = bindRange('rSpeed', 'vSpeed', 'waveSpeed', x => fmt(x) + t({ zh: ' 单位/s', en: ' units/s' }));
(function () {
  const r = document.getElementById('rPhi'), vv = document.getElementById('vPhi');
  const upd = () => { const u = parseFloat(r.value); state.phi = u * Math.PI; vv.textContent = fmt(u) + ' π'; };
  r.addEventListener('input', upd);
  upd();
})();

function bindCheck(id, key) {
  const c = document.getElementById(id);
  c.addEventListener('change', () => { state[key] = c.checked; });
  state[key] = c.checked;
}
bindCheck('cSin', 'showSin');
bindCheck('cCos', 'showCos');
bindCheck('cHelix', 'showHelix');
bindCheck('cTan', 'showTan');
bindCheck('cCot', 'showCot');
bindCheck('cGuides', 'showGuides');
bindCheck('cGrid', 'showGrid');

const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(STR.pause) : t(STR.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

/* ---- 视角 ---- */
const vbtns = Array.prototype.slice.call(document.querySelectorAll('.vbtn'));
function refreshViewButtons() {
  vbtns.forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = VIEWS[curTab][name];
  if (!vw) return;
  if (name === 'cosv' && !state.showCos) { state.showCos = true; document.getElementById('cCos').checked = true; }
  if (name === 'cotv' && !state.showCot) { state.showCot = true; document.getElementById('cCot').checked = true; }
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx, ty: vw.ty, tz: vw.tz },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}
vbtns.forEach(b => b.addEventListener('click', () => applyView(b.dataset.view)));

/* ---- 页签 ---- */
const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
const tabBtns = Array.prototype.slice.call(document.querySelectorAll('.tab'));

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(STR.panelTitle);

  btnPlay.textContent = state.running ? t(STR.pause) : t(STR.resume);
  /* 开关文本节点在 label 内、input 之后，已在静态 HTML 中包成 <span data-i18n="…">，
     此处只重写这些包裹节点，绝不重建含 input 的 label，以保住既有监听 */
  document.querySelectorAll('[data-i18n]').forEach(el => {

function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView('iso'));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') switchTab(curTab === 'sc' ? 'tc' : 'sc');
  else if (e.key >= '1' && e.key <= '4') {
    const names = curTab === 'sc' ? ['iso', 'circle', 'sine', 'cosv'] : ['iso', 'circle', 'tanv', 'cotv'];
    applyView(names[+e.key - 1]);
  }
});

/* ================= 启动 ================= */
resize();
cams.sc = Object.assign({}, VIEWS.sc.iso);
cams.sc.dist = viewDist(cams.sc.dist);
cams.tc = Object.assign({}, VIEWS.tc.iso);
cams.tc.dist = viewDist(cams.tc.dist);
cam = cams.sc;
refreshViewButtons();
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
