  e 的本质 · The Essence of e
  基于 math-viz-starter.html（STARTER_VERSION 1.0.0），遵循
  math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）。

  e 不是神秘常数——「连续复利、自我导数、单位面积」等完全不同的路
  在 2.71828… 交汇。六个场景：复利极限 (1+1/n)ⁿ · 自我导数 aˣ 与
  ln a·aˣ 的重合 · 方向场 dy/dx = y 中随自己高度生长 · 1/x 下面积
  恰为 1 时 b = e · 统计里的 e：(1−1/n)ⁿ → 1/e 与对数视角下的钟形
  曲线 · 欧拉公式 e^iθ：利息付在虚数方向，增长变成旋转。

  版本记录（changelog，新→旧）：
    1.0.1  2026-07-31  参数面板按页签显示：各场景声明 params，只列出对当前页签有效的滑块
    1.0.0  2026-07-13  首发：复利极限 / 自我导数 / 随自己生长 / 面积为 1 / 统计里的 e / 欧拉公式 六场景
============================================================ -->
<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);

.tab{border:1px solid transparent;background:transparent;color:#b8c6da;

  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;

/* 驱动控制行 */

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'e-essence-3d',
  title: { zh: 'e 的本质 · The Essence of e', en: 'The Essence of e' },
  h1:    { zh: 'e 的本质', en: 'The Essence of e' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'nRaw',  label: { zh: '每年复利次数 <i>n</i> = 2<sup><i>k</i></sup>', en: 'Compoundings / year <i>n</i> = 2<sup><i>k</i></sup>' },
    min: 0, max: 10, step: 1, value: 3, fmt: v => 'n = ' + Math.pow(2, v).toFixed(0), map: v => Math.pow(2, v) },
  { key: 'a',     label: { zh: '底数 <i>a</i>',        en: 'Base <i>a</i>' },
    min: 1.2, max: 4, step: 0.01, value: 2, fmt: v => fmt(v) },
  { key: 'x0',    label: { zh: '探针位置 <i>x</i>₀',   en: 'Probe position <i>x</i>₀' },
    min: -1.5, max: 1.5, step: 0.01, value: 0.6, fmt: v => fmtS(v) },
  { key: 'y0',    label: { zh: '初始高度 <i>y</i>₀',   en: 'Initial height <i>y</i>₀' },
    min: 0.3, max: 2, step: 0.01, value: 1, fmt: v => fmt(v) },
  { key: 'b',     label: { zh: '积分上限 <i>b</i>',    en: 'Upper limit <i>b</i>' },
    min: 1, max: 6, step: 0.01, value: 2, fmt: v => fmt(v) },
  { key: 'm',     label: { zh: '抽签次数 <i>n</i> = 2<sup><i>k</i></sup>', en: 'Tickets <i>n</i> = 2<sup><i>k</i></sup>' },
    min: 0, max: 10, step: 1, value: 3, fmt: v => 'n = ' + Math.pow(2, v).toFixed(0), map: v => Math.pow(2, v) },
  { key: 'speed', label: { zh: '演示速度',             en: 'Demo speed' },
    min: 0.3, max: 2, step: 0.05, value: 0.8, fmt: v => fmt(v) + t({ zh: ' 单位/s', en: ' units/s' }) },
  /* ω 驱动引擎时钟 θ 的积分（θ += ω·dt），仅在欧拉公式页显示 */
  { key: 'omega', label: { zh: '角速度 <i>ω</i>', en: 'Angular speed <i>ω</i>' },
    min: 0.2, max: 2.5, step: 0.05, value: 1, fmt: v => fmt(v) + ' rad/s' }
];

/* ── e 的本质：场景级常量与小部件（均在 SCENES 之上，引擎零改动） ──
   颜色语义：rose = 第一主曲线（复利阶梯 / aˣ / 解曲线 y）
             violet = 第二曲线（极限 eˣ / 导数 ln a·aˣ / 变化率流 y′）
             emerald = 第三曲线（同族解）· cyan = 源几何（方向场 / 1/x / 基准线）
             amber = 度量注记（差距 / 斜率比 / 面积） */
const E = Math.E;
const C_ROSE = '#fb7185', C_VIO = '#a78bfa', C_EME = '#34d399', C_CYN = '#2dd4ea', C_AMB = '#fbbf24';
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')';

/* —— 复利页世界坐标：x = 年 × XS1，y = 金额 × YS1 —— */
const XS1 = 1.7, YS1 = 0.5, YR_MAX = 2, GHOST_NS = [365, 52, 12, 4, 2, 1];
const VX1 = yr => yr * XS1, VY1 = v => v * YS1;
/* 复利阶梯折线：每期期末跳升一次（值 = (1+1/n)^⌊n·x⌋） */
function stairPts(n, z) {
  const pts = [[0, VY1(1), z]];
  const total = Math.round(n * YR_MAX);
  let v = 1;
  for (let k = 1; k <= total; k++) {
    const x = VX1(k / n);
    pts.push([x, VY1(v), z]);
    v *= 1 + 1 / n;
    pts.push([x, VY1(v), z]);
  }
  pts.push([VX1(YR_MAX), VY1(v), z]);
  return pts;
}
/* —— 自我导数页 / ODE 页的裁剪采样：单调递增函数触顶即断 —— */
function fnPts(f, x0, x1, dx, ymax, z) {
  const pts = [];
  let px = null, py = null;
  for (let x = x0; x <= x1 + 1e-9; x += dx) {
    const y = f(x);
    if (y > ymax) {
      if (px !== null && y !== py) pts.push([px + (ymax - py) * (x - px) / (y - py), ymax, z || 0]);
      return pts;
    }
    pts.push([x, y, z || 0]);
    px = x; py = y;
  }
  return pts;
}
/* 通用第一象限风格坐标轴（区间与刻度可配；tk = {v, lab, c}） */
function axes2(C, o) {
  line3(C, [o.x0, 0, 0], [o.x1, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [o.x1, 0, 0], [o.x1 - 0.2, 0, 0], AXIS);
  label3(C, [o.x1 + 0.25, 0, 0], o.xlab || 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, o.y0, 0], [0, o.y1, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, o.y1, 0], [0, o.y1 - 0.2, 0], AXIS);
  label3(C, [0, o.y1 + 0.2, 0], o.ylab || 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  (o.xticks || []).forEach(tk => {
    line3(C, [tk.v, -0.05, 0], [tk.v, 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [tk.v, -0.24, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'center' }
      : { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  });
  (o.yticks || []).forEach(tk => {
    line3(C, [-0.05, tk.v, 0], [0.05, tk.v, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.14, tk.v, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'right' }
      : { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1, every = v < 0.8 ? 2 : 1;
    for (let k = 1; k * v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k * v], [0, 0.06, k * v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) label3(C, [0, -0.25, k * v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}
/* 矩形区域网格（z=0 平面） */
function gridRect(C, x0, x1, y0, y1, st) {
  for (let x = Math.ceil(x0 / st) * st; x <= x1 + 1e-9; x += st) {
    line3(C, [x, y0, 0], [x, y1, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
  for (let y = Math.ceil(y0 / st) * st; y <= y1 + 1e-9; y += st) {
    line3(C, [x0, y, 0], [x1, y, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}
/* 填充多边形（面积页专用；借用引擎 polyPath 的裁剪路径） */
function fillPoly3(C, pts, color) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}
/* —— ODE 页常量与演示粒子累积量（在 ③ pushSample 中推进） —— */
const ODE_X0 = -2, ODE_X1 = 2, ODE_YMAX = 2.6;

/* —— 统计页世界坐标：x = 试验进度 × XS5；y 线性 = 概率 × YS5，
      对数视角 = ln(概率) × YLOG5（场景级变换，画 ln y 而非 y） —— */
const C_ORG = '#fb923c';
const XS5 = 2.2, YS5 = 2.2, YLOG5 = 0.75, LOG_FLOOR5 = -2.7, X5MAX = 1.9;
const statY = v => state.logY
  ? Math.max(LOG_FLOOR5, Math.log(Math.max(v, 1e-9))) * YLOG5
  : v * YS5;
/* 向下阶梯：每期 ×(1−1/n)，全部落空的概率（触底即断，兼容对数视角） */
function stairDownPts(n, z) {
  const pts = [[0, statY(1), z]];
  const floorY = state.logY ? LOG_FLOOR5 * YLOG5 : 0;
  const total = Math.round(n * X5MAX);
  let v = 1;
  for (let k = 1; k <= total; k++) {
    const x = XS5 * k / n;
    pts.push([x, statY(v), z]);
    v *= 1 - 1 / n;
    const y = statY(v);
    if (v <= 1e-9 || y <= floorY + 1e-9) { pts.push([x, floorY, z]); return pts; }
    pts.push([x, y, z]);
  }
  pts.push([XS5 * X5MAX, statY(v), z]);
  return pts;
}

/* —— 欧拉页：部分和螺线 Σ_{j≤k}(iθ)ʲ/j!（每项 = 上一项 ×iθ/j，段数有界；
      θ 取主值 (−π, π] 以约束部分和的外摆幅度 ≤ ~5，θ = π 时外摆最大——正是恒等式时刻） —— */
function eulerSeriesPts(thm, kmax) {
  const pts = [[0, 0, 0]];
  let re = 0, im = 0, tr = 1, ti = 0;
  for (let j = 0; j <= kmax; j++) {
    re += tr; im += ti;
    pts.push([re, im, 0]);
    const f = thm / (j + 1);
    const w = -ti * f; ti = tr * f; tr = w;
  }
  return { pts: pts, re: re, im: im };
}
const fmtC = (re, im) => fmtS(re) + (im < 0 ? ' − ' : ' + ') + fmt(Math.abs(im)) + 'i';

            { width: 1.6, color: hexA(C_EME, 0.45) });
        });
        label3(C, [-1.4, 2.55, 0], 'c·eˣ', { font: 'italic 12px ' + FONT_MATH, color: hexA(C_EME, 0.8), align: 'center' });
      }

      /* 两条时间流：数值 y(t)（玫红）与变化率 y′(t)（紫，恰好重合） */
      if (samples.length > 1) {
        const rosePts = [], vioPts = [];
        let prevOx = null;
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i], z = (state.t - s.t) * v;
          if (z > WAVE_LEN) break;
          if (prevOx !== null && s.ox > prevOx + 1e-9) { rosePts.push(null); vioPts.push(null); }
          if (s.oy <= ODE_YMAX) {
            rosePts.push([0, s.oy, z]);
            vioPts.push([0, s.orate, z]);
          } else { rosePts.push(null); vioPts.push(null); }
          prevOx = s.ox;
        }
        if (state.showRate) strokePoly(C, vioPts, { width: 4.5, color: hexA(C_VIO, 0.55) });
        if (state.showSol) {
          strokePoly(C, rosePts, { width: 5.5, color: hexA(C_ROSE, 0.14) });
          strokePoly(C, rosePts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
        }
        if (state.showRate) label3(C, [0, 2.42, 2.4], 'y′(t) = y(t)', { font: 'italic 13px ' + FONT_MATH, color: C_VIO, align: 'center' });
      }

      /* 解曲线与粒子（玫红主角） */
      if (state.showSol) {
        const sp = fnPts(x => y0 * Math.exp(x), ODE_X0, ODE_X1, 0.02, ODE_YMAX);
        strokePoly(C, sp, { width: 5.5, color: hexA(C_ROSE, 0.14) });
        strokePoly(C, sp, { width: 2.2, color: hexA(C_ROSE, 0.95) });
        label3(C, [1.05, Math.min(y0 * Math.exp(1.05), 2.25) + 0.22, 0], 'y = y₀eˣ',
          { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'left' });
        const yl = y0 * Math.exp(odeX);
        if (yl <= ODE_YMAX) {
          const d = 0.5 / Math.hypot(1, yl);
          const tip = [odeX + d, yl + d * yl, 0];
          line3(C, [odeX, yl, 0], tip, { width: 1.6, color: 'rgba(251,191,36,0.85)' });
          arrowAt(C, tip, [odeX, yl, 0], 'rgba(251,191,36,0.85)');
          label3(C, [tip[0] + 0.1, tip[1] + 0.14, 0], 'dy/dx = y', { font: 'italic 12px ' + FONT_MATH, color: C_AMB, align: 'left' });
          const pp = proj(C, [odeX, yl, 0]);
          if (pp) glowDot(pp, 15, '#ffffff', 'rgba(186,240,255,0.9)');
          const hd = proj(C, [0, yl, 0]);
          if (hd) glowDot(hd, 9, '#ffffff', hexA(C_ROSE, 0.9));
        }
      }
    },
    readout() {
      const y = state.y0 * Math.exp(odeX);
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;x = ' + fmtS(odeX) + '</div>' +
        '<div class="sinC">y = y₀eˣ = <b>' + fmt(y, 3) + '</b></div>' +
        '<div class="cosC">y′ = dy/dx = <b>' + fmt(y, 3) + '</b></div>' +
        '<div class="ambC">y′/y = <b>1.000</b></div>' +
        '<div class="dim">' + t({ zh: '每一点的坡度都等于自身高度', en: 'the slope equals the height, everywhere' }) + '</div>';
    }
  },

  /* ────── ④ 面积为 1：∫₁ᵇ dx/x = 1 ⇒ b = e ────── */

                 { v: 4, lab: '4' }, { v: 5, lab: '5' }, { v: 6, lab: '6' }],
        yticks: [{ v: 1, lab: '1' }, { v: 2, lab: '2' }, { v: 3, lab: '3' }]
      });

      /* 琥珀面积：1 → b 的曲边梯形（奇点 1/x 用比例步长细分） */
      if (state.showArea) {
        const ap = [[1, 0, 0], [1, 1, 0]];
        let x = 1;
        while (x < b) { ap.push([x, 1 / x, 0]); x += Math.max(0.01, x * 0.03); }
        ap.push([b, 1 / b, 0], [b, 0, 0]);
        fillPoly3(C, ap, hexA(C_AMB, hit ? 0.22 : 0.13));
        line3(C, [1, 0, 0], [1, 1, 0], { width: 1.3, color: 'rgba(251,191,36,0.7)' });
        if (hit) line3(C, [b, 0, 0], [b, 1 / b, 0], { width: 6, color: hexA(C_AMB, 0.3) });
        line3(C, [b, 0, 0], [b, 1 / b, 0], { width: hit ? 2.4 : 1.3, color: 'rgba(251,191,36,' + (hit ? 0.95 : 0.7) + ')' });
        label3(C, [Math.max((1 + b) / 2, 1.5), 0.32, 0], '∫₁ᵇ dx/x = ln b = ' + fmt(area),
          { font: 'italic 13px ' + FONT_MATH, color: C_AMB, align: 'center' });
        if (hit) label3(C, [b, 1 / b + 0.5, 0], t({ zh: '面积 = 1 ⇒ b = e', en: 'area = 1 ⇒ b = e' }),

        if (hp2) glowDot(hp2, 10, '#ffffff', 'rgba(251,191,36,0.9)');
      }

      /* 双曲线 y = 1/x（青，源几何；靠近 0 处比例步长防陡峭） */
      if (state.showHyp) {
        const hp = [];
        let x = 1 / 3.4;
        while (x < 6.3) { hp.push([x, 1 / x, 0]); x += Math.max(0.02, x * 0.045); }
        hp.push([6.3, 1 / 6.3, 0]);
        strokePoly(C, hp, { width: 6, color: 'rgba(45,212,234,0.13)' });
        strokePoly(C, hp, { width: 2, color: 'rgba(45,212,234,0.95)' });
        label3(C, [4.6, 1 / 4.6 + 0.3, 0], 'y = 1/x', { font: 'italic 13px ' + FONT_MATH, color: C_CYN, align: 'center' });
        solidDot(C, [1, 1, 0], 3, 'rgba(241,245,249,0.95)');
        label3(C, [1.1, 1.18, 0], '(1, 1)', { size: 10, color: 'rgba(159,176,200,.75)', align: 'left' });
        solidDot(C, [E, 1 / E, 0], 3, 'rgba(251,191,36,0.95)');
        label3(C, [E + 0.12, 1 / E + 0.18, 0], '(e, 1/e)', { font: 'italic 11px ' + FONT_MATH, color: C_AMB, align: 'left' });
      }
    },
    readout() {
      const b = state.b, area = Math.log(b);
      const hit = Math.abs(area - 1) < 0.01;
      return '<div>b = <b>' + fmt(b) + '</b></div>' +
        '<div class="ambC">' + t({ zh: '面积', en: 'area' }) + ' = ln b = <b>' + area.toFixed(5) + '</b></div>' +
        '<div class="cynC">1/b = <b>' + fmt(1 / b, 3) + '</b></div>' +
        '<div class="dim">' + (hit
          ? t({ zh: '面积恰为 1 ⇒ b = e = 2.71828', en: 'area exactly 1 ⇒ b = e = 2.71828' })
          : t({ zh: '面积到 1.00 时停下——那就是 e', en: 'stop when the area hits 1.00 — that is e' })) + '</div>';
    }
  },

    draw(C) {

        label3(C, [0.32, statY(1) + 0.24, 0], 'y = (1−1/n)^⌊nx⌋', { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'left' });
        const vm = Math.pow(1 - 1 / m, m);
        if (vm > 1e-9) {
          const dp = proj(C, [XS5, statY(vm), 0]);
          if (dp) glowDot(dp, 10, '#ffffff', hexA(C_ROSE, 0.9));

    }
  },

      { key: 'showSeries', label: { zh: '级数螺线 Σ(iθ)ʲ/j!',       en: 'Series spiral Σ(iθ)ʲ/j!' },       color: '#34d399', checked: false },
      { key: 'showWaves',  label: { zh: '投影波形 cos·sin',         en: 'Shadow waves cos·sin' },          color: '#fb923c', checked: true },
      { key: 'showGrid',   label: { zh: '网格',                     en: 'Grid' },                          color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.speed + 0.5,
    draw(C) {
      const th = state.theta, v = state.speed;
      const cz = Math.cos(th), sz = Math.sin(th);
      const thm = mod2pi(th);
      const nearPi = Math.abs(thm - Math.PI) < 0.03;
      if (state.showGrid) { drawGridXY(C, 1.5, 0.5); drawTimeGrid(C, { yMax: 1.5, v: v }); }
      axes2(C, {
        x0: -1.9, x1: 2.1, y0: -1.9, y1: 2.0, xlab: 'Re', ylab: 'Im',
        xticks: [{ v: -1, lab: '−1' }, { v: 1, lab: '1' }],
        yticks: [{ v: 1, lab: 'i', c: '#9fb0c8' }, { v: -1, lab: '−i', c: '#9fb0c8' }],
        tAxis: true, v: v
      });

      /* 历史：橙色投影波形（顶视 cos · 侧视 sin）与玫红螺旋 */
      if (samples.length > 1) {
        const hp = [], cp = [], sp = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i], z = (state.t - s.t) * v;
          if (z > WAVE_LEN) break;
          hp.push([s.ex, s.ey, z]);
          cp.push([s.ex, 0, z]);
          sp.push([0, s.ey, z]);
        }
        if (state.showWaves) {
          strokePoly(C, cp, { width: 5.5, color: hexA(C_ORG, 0.10) });
          strokePoly(C, cp, { width: 1.8, fade: [hexA(C_ORG, 0.9), hexA(C_ORG, 0.04)] });
          strokePoly(C, sp, { width: 5.5, color: hexA(C_ORG, 0.10) });
          strokePoly(C, sp, { width: 1.8, fade: [hexA(C_ORG, 0.9), hexA(C_ORG, 0.04)] });
          label3(C, [1.32, 0.14, 2.3], 'cos θ', { font: 'italic 13px ' + FONT_MATH, color: C_ORG, align: 'left' });
          label3(C, [0.06, 1.32, 2.3], 'sin θ', { font: 'italic 13px ' + FONT_MATH, color: C_ORG, align: 'left' });
        }
        if (state.showHelix) {
          strokePoly(C, hp, { width: 5.5, color: hexA(C_ROSE, 0.14) });
          strokePoly(C, hp, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
        }
      }

      drawCircle(C, 1);
      drawAngleArc(C, th, 1);

      /* 级数螺线（翠绿）：Σ(iθ)ʲ/j!，每段 = 上一段 ×iθ/j，一步一个直角，落回 z（θ 取主值） */
      if (state.showSeries) {
        const S = eulerSeriesPts(wrapPI(th), 14);
        strokePoly(C, S.pts, { width: 4.5, color: hexA(C_EME, 0.13) });
        strokePoly(C, S.pts, { width: 1.8, color: hexA(C_EME, 0.9) });
        for (let j = 1; j < S.pts.length; j++) solidDot(C, S.pts[j], 2, hexA(C_EME, 0.9));
        label3(C, [-1.5, -1.4, 0], 'Σ (iθ)ʲ/j!', { font: 'italic 13px ' + FONT_MATH, color: C_EME, align: 'center' });
      }

      /* 玫红半径 + 紫色速度箭头（永远垂直）+ 琥珀直角标记 */
      line3(C, [0, 0, 0], [cz, sz, 0], { width: 2, color: hexA(C_ROSE, 0.9) });
      if (state.showVel) {
        const L = 0.55, tip = [cz - L * sz, sz + L * cz, 0];
        line3(C, [cz, sz, 0], tip, { width: 2, color: hexA(C_VIO, 0.95) });
        arrowAt(C, tip, [cz, sz, 0], hexA(C_VIO, 0.95));
        const s2 = 0.13;
        strokePoly(C, [[(1 - s2) * cz, (1 - s2) * sz, 0],
                       [(1 - s2) * cz - s2 * sz, (1 - s2) * sz + s2 * cz, 0],
                       [cz - s2 * sz, sz + s2 * cz, 0]], { width: 1.3, color: 'rgba(251,191,36,0.85)' });
        label3(C, [tip[0] - 0.2 * sz, tip[1] + 0.2 * cz, 0], 'i·e^iθ', { font: 'italic 13px ' + FONT_MATH, color: C_VIO, align: 'center' });
      }

      /* 投影虚线与波形头部（橙） */
      if (state.showWaves) {
        line3(C, [cz, sz, 0], [cz, 0, 0], { width: 1.5, dash: [7, 7], color: hexA(C_ORG, 0.8) });
        line3(C, [cz, sz, 0], [0, sz, 0], { width: 1.5, dash: [7, 7], color: hexA(C_ORG, 0.8) });
        const hc = proj(C, [cz, 0, 0]);
        if (hc) glowDot(hc, 8, '#ffffff', hexA(C_ORG, 0.85));
        const hs = proj(C, [0, sz, 0]);
        if (hs) glowDot(hs, 8, '#ffffff', hexA(C_ORG, 0.85));
      }

      /* 欧拉恒等式时刻：θ ≈ π 时 (−1, 0) 琥珀闪烁 */
      solidDot(C, [-1, 0, 0], 2.6, 'rgba(251,191,36,0.75)');
      if (nearPi) {
        const ip = proj(C, [-1, 0, 0]);
        if (ip) glowDot(ip, 15 + 3 * Math.sin(state.t * 9), '#fff7e0', 'rgba(251,191,36,0.9)');
        label3(C, [-1, 0.32, 0], 'e^iπ + 1 = 0', { font: 'italic 14px ' + FONT_MATH, color: C_AMB, align: 'center' });
      }

      /* 主点 z = e^iθ（玫红光点） */
      const zp = proj(C, [cz, sz, 0]);
      if (zp) glowDot(zp, 13, '#ffffff', hexA(C_ROSE, 0.9));
      label3(C, [cz * 1.3, sz * 1.3 + 0.12, 0], 'z = e^iθ', { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'center' });
    },
    readout() {
      const th = state.theta, cz = Math.cos(th), sz = Math.sin(th);
      const thm = mod2pi(th);
      const nearPi = Math.abs(thm - Math.PI) < 0.03;
      let h = readoutHead() +
        '<div class="sinC">z = e<sup>iθ</sup> = <b>' + fmtC(cz, sz) + '</b></div>' +
        '<div class="cosC">i·z = <b>' + fmtC(-sz, cz) + '</b></div>' +
        '<div class="cotC">cos θ = <b>' + fmtS(cz) + '</b> · sin θ = <b>' + fmtS(sz) + '</b></div>';
      if (state.showSeries) {
        const S = eulerSeriesPts(wrapPI(th), 14);
        h += '<div class="tanC">|Σ − e<sup>iθ</sup>| = <b>' + Math.hypot(S.re - cz, S.im - sz).toFixed(4) + '</b></div>';
      }
      h += nearPi
        ? '<div class="ambC" style="font-family:var(--font-math);font-style:italic">e<sup>iπ</sup> + 1 = <b>0</b></div>'
        : '<div class="dim">' + t({ zh: '|z| = 1：增长全部付给了方向', en: '|z| = 1 — all the growth goes into direction' }) + '</div>';
      return h;
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 共享时钟推进两个演示累积量：复利页探针 probeYr、ODE 页粒子 odeX。
     重置（t 回到 0）时一并归位；暂停时本函数不被调用，粒子随之冻结。 */
  let dt = state.t - _lastPushT;
  if (dt < 0) { dt = 0; odeX = ODE_X0; probeYr = 0; }
  _lastPushT = state.t;
  probeYr += state.speed * 0.25 * dt;
  if (probeYr > YR_MAX) probeYr -= YR_MAX;
  odeX += state.speed * 0.7 * dt;
  if (odeX > ODE_X1) odeX = ODE_X0;
  const y = state.y0 * Math.exp(odeX);
  samples.push({
    t: state.t,
    ox: odeX,               /* 粒子当时的 x 位置（用于识别重新释放的断点） */
    oy: y,                  /* 当时的真实数值 y */
    orate: y,               /* 当时的真实变化率 y′ = y —— 这正是本页的顿悟 */
    ex: Math.cos(state.theta),  /* 欧拉页：z = e^iθ 当时的实部（改 ω 不重算历史） */
    ey: Math.sin(state.theta)   /* 欧拉页：z = e^iθ 当时的虚部 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');

/* ================= UI 生成（由 ①② 声明驱动） ================= */

       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {

/* ================= 视角与页签 ================= */
function refreshViewButtons() {

    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);

}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */

    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };

}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd()
     （语言切换 / 用户拖动都会触发）读的是吸附后的 input.value，会把这点
     差值永久写回 state —— 暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {

  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {

  updateReadout();
}

function setLang(l) {

  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);

document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];

  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
