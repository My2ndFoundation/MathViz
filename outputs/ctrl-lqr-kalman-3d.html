<!-- ============================================================
  最优与估计 —— LQR 与卡尔曼 / Optimal & Estimated — LQR and the Kalman Filter
  引擎：math-viz-starter.html · STARTER_VERSION 1.1.0
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）
  内容规范：docs/superpowers/specs/2026-08-02-lqr-kalman-design.md

  被控对象仍是那根倒立摆（与 ctrl-feedback-pid-3d / ctrl-locus-limits-3d 同一根）：
      ẋ = A x + B u,  x = [θ, ω]ᵀ,  A = [[0, 1], [g/L, −c]],  B = [0, 1/(mL²)]ᵀ
  开环极点 s = (−c ± √(c²+4g/L))/2 —— 右半平面那个正极点就是「必倒」的数学。

  本工具的论点：控制器不是调出来的，是算出来的。
    · LQR    ——「怎么动」：给出代价权重 Q、R，K = R⁻¹BᵀP 由 Riccati 方程解出
    · 卡尔曼 ——「你以为自己在哪」：给出噪声统计 W、V，L = ΣCᵀV⁻¹ 由同一类方程解出
    · 分离原理：两件事可以分开设计（闭环极点 = LQR 极点 ∪ 卡尔曼极点，逐数字可核对）
    · 诚实的收尾：LQG 没有保证的鲁棒裕度（Doyle 1978）

  Riccati 方程在页内实时解（Kleinman/牛顿迭代，Ackermann 配极点给稳定初值），
  读数区常驻残差 ‖AᵀP + PA − PBR⁻¹BᵀP + Q‖ 与迭代次数 —— 「解出来了」可核对。
  物理用 RK4 定步长 h = 1/2000 s 子步进，控制器按 fs 零阶保持离散更新。
  仿真用**线性化**被控对象：这样代价积分与 Lyapunov 解析值可以逐位对照。

  版本记录（changelog，新→旧）：
    1.0.0  2026-08-02  首发：LQR 代价比根轨迹（含手调 K 的代价对照）、卡尔曼增益
                       是两个不确定度的加权、协方差的呼吸（含耦合切断实验）、
                       分离原理与 LQG 裕度崩塌 四个页签
                       First release: the LQR cost-ratio locus (with a hand-tuned K
                       cost duel), the Kalman gain as a weighing of two uncertainties,
                       the breathing covariance (with a decoupling experiment), and
                       the separation principle together with the LQG margin collapse
============================================================ -->

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.1.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;
const ENGINE_VERSION = document.querySelector('meta[name="engine-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'ctrl-lqr-kalman-3d',
  title: { zh: '最优与估计 · LQR 与卡尔曼', en: 'Optimal & Estimated · LQR and the Kalman Filter' },
  h1:    { zh: '最优与估计', en: 'Optimal & Estimated' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },

  recRec:    { zh: '● 记录',   en: '● Record' },
  recStop:   { zh: '■ 停止',   en: '■ Stop' },
  recSave:   { zh: '⬇ 保存',   en: '⬇ Save' },
  recLoad:   { zh: '⬆ 载入',   en: '⬆ Load' },
  recExit:   { zh: '✕ 退出回放', en: '✕ Exit replay' },
  recPlay:   { zh: '▶',        en: '▶' },
  recPause:  { zh: '⏸',        en: '⏸' },
  recRewind: { zh: '⏮',        en: '⏮' },
  recRows:   { zh: ' 行',      en: ' rows' },
  recFull:   { zh: '已达行数上限，录制停止（数据完整，未截断）',
               en: 'Row limit reached, recording stopped (data complete, not truncated)' },
  recRoundEnd: { zh: '本轮结束，录制自动停止', en: 'Round complete, recording stopped' },
  recReplay: { zh: '回放中', en: 'Replaying' },
  recVerifyOK: { zh: '种子比对：本机复现（δ = ', en: 'Seed check: reproduced here (δ = ' },
  recVerifyNo: { zh: '种子比对：本机复现不了（δ = ', en: 'Seed check: not reproducible here (δ = ' },
  recVerifyTail: { zh: '）—— 这不是 bug，见提示', en: ') — not a bug, see the tip' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* TAU 提到 PARAMS/SCENES 之前声明：本工具的常量层（gauss / 椭圆 / 圆的角度计算）
   在 SCENES 之前就要用它，留在原「常量与状态」区（SCENES 之后）会触发 TDZ 报错。 */
const TAU = Math.PI * 2;


/* 数值格式：代价与噪声跨好几个数量级，滑杆读的是 log10，显示回真值 */
const p10 = v => Math.pow(10, v);
function fmtSig(x) {
  if (!isFinite(x)) return '∞';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  if (e >= -3 && e <= 4) return x.toFixed(Math.max(0, Math.min(4, 3 - e)));
  return x.toExponential(1);
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ║  invMap: 状态值→原始值。声明了 map 就必须给（规范 §8 硬约束） ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'len',  label: { zh: '摆长 <i>L</i>',        en: 'Pendulum length <i>L</i>' },
    min: 0.4, max: 1.4, step: 0.02, value: 1.0,  fmt: v => fmt(v) + ' m' },
  { key: 'mass', label: { zh: '摆质量 <i>m</i>',      en: 'Pendulum mass <i>m</i>' },
    min: 0.4, max: 1.4, step: 0.05, value: 1.0,  fmt: v => fmt(v) + ' kg' },
  { key: 'damp', label: { zh: '摆的阻尼 <i>c</i>',    en: 'Viscous damping <i>c</i>' },
    min: 0,   max: 3,   step: 0.05, value: 0.40, fmt: v => fmt(v) + ' s⁻¹' },
  /* 代价与噪声都跨 5 个数量级，滑杆走 log10；带 map 必配 invMap（§8 硬约束） */
  { key: 'qc',   label: { zh: '角度代价 <i>q</i>（求快）', en: 'Angle cost <i>q</i> (be quick)' },
    min: -2, max: 3, step: 0.05, value: 1,
    map: v => p10(v), invMap: v => Math.log10(v), fmt: v => fmtSig(p10(v)) },
  { key: 'rc',   label: { zh: '控制代价 <i>r</i>（省力）', en: 'Control cost <i>r</i> (be gentle)' },
    min: -3, max: 2, step: 0.05, value: -1,
    map: v => p10(v), invMap: v => Math.log10(v), fmt: v => fmtSig(p10(v)) },
  { key: 'wh',   label: { zh: '手调闭环带宽 <i>ω</i><sub>h</sub>', en: 'Hand-tuned bandwidth <i>ω</i><sub>h</sub>' },
    min: 0.5, max: 20, step: 0.1, value: 2.0, fmt: v => fmt(v, 1) + ' rad/s' },
  { key: 'sw',   label: { zh: '过程噪声 <i>σ</i><sub>w</sub>（模型多不可信）', en: 'Process noise <i>σ</i><sub>w</sub> (how wrong is the model)' },
    min: -3, max: 1, step: 0.05, value: -0.5,
    map: v => p10(v), invMap: v => Math.log10(v), fmt: v => fmtSig(p10(v)) },
  { key: 'sv',   label: { zh: '测量噪声 <i>σ</i><sub>v</sub>（传感器多不可信）', en: 'Sensor noise <i>σ</i><sub>v</sub> (how wrong is the sensor)' },
    min: -3, max: 1, step: 0.05, value: -2,
    map: v => p10(v), invMap: v => Math.log10(v), fmt: v => fmtSig(p10(v)) },
  { key: 'psi',  label: { zh: '过程噪声入口 <i>ψ</i>', en: 'Process-noise direction <i>ψ</i>' },
    min: 0, max: 90, step: 1, value: 0,
    fmt: v => fmt(v, 0) + '°' + t(v < 15 ? { zh: '（力矩）', en: ' (torque)' }
                                : v > 75 ? { zh: '（角度漂移）', en: ' (angle drift)' } : { zh: '（混合）', en: ' (mixed)' }) },
  { key: 'tilt', label: { zh: '每轮初始倾角 <i>θ</i>₀', en: 'Initial tilt per round <i>θ</i>₀' },
    min: 0.05, max: 0.40, step: 0.01, value: 0.20, fmt: v => fmt(v) + ' rad' },
  { key: 'fs',   label: { zh: '采样率 <i>f</i><sub>s</sub>', en: 'Sample rate <i>f</i><sub>s</sub>' },
    min: 5, max: 200, step: 1, value: 50, fmt: v => fmt(v, 0) + ' Hz' },

    for (let k = i + 1; k < 3; k++) if (Math.abs(M[k][i]) > Math.abs(M[p][i])) p = k;
    const tmp = M[i]; M[i] = M[p]; M[p] = tmp;
    const d = M[i][i] || 1e-300;

    for (let k = 0; k < 3; k++) {

function ackermann(A, B, d) {

/* ── LQR：Q = diag(q, 0)、R = r。K 只取决于代价**比** ρ = q/r ── */

function lqrSolve() {
  const sig = [state.len, state.mass, state.damp, state.qc, state.rc].join('|');
  if (lqrCache.sig === sig) return lqrCache.val;
  const A = plantA(), B = plantB();
  const S = careSolve(A, B, costQ(), state.rc);

  const a = aOf(), b = bOf(), w = state.wh;

  const pv = state.psi * Math.PI / 180;
  const nz = gauss() * state.sw * Math.sqrt(state.fs);
  const th1 = A[0][0]*W.cTh + A[0][1]*W.cW;
  const w1  = A[1][0]*W.cTh + A[1][1]*W.cW + bOf()*uc;
  W.cTh += Ts * (th1 + Math.sin(pv)*nz);
  W.cW  += Ts * (w1  + Math.cos(pv)*nz);
  W.cTh = clamp(W.cTh, -50, 50); W.cW = clamp(W.cW, -400, 400);
  const meas = W.cTh + state.sv * Math.sqrt(state.fs) * gauss();
  const eth = A[0][0]*W.cETh + A[0][1]*W.cEW;
  const ew  = A[1][0]*W.cETh + A[1][1]*W.cEW + bOf()*uc;
  let nTh = W.cETh + Ts * eth, nW = W.cEW + Ts * ew;
  nTh += kg[0] * (meas - nTh); nW += kg[1] * (meas - nTh);
  W.cETh = clamp(nTh, -50, 50); W.cEW = clamp(nW, -400, 400);
}

/* 定步长子步进：把引擎那一帧的 dt 切成整数个 h，余量留到下一帧 */
let simClock = 0, simAcc = 0, covAcc = 0;
function stepWorld(dt) {
  ensureWorld();
  if (!(dt > 0)) return;
  simAcc += dt;
  let n = 0;
  while (simAcc >= H_FIX && n < SUB_MAX) { simAcc -= H_FIX; subStep(H_FIX); n++; }
  if (n >= SUB_MAX) simAcc = 0;                  // 积压直接丢弃，不追赶
  /* 协方差递推走采样节拍（它本来就是离散的） */
  covAcc += dt;
  const Ts = 1 / state.fs;
  let m = 0;
  while (covAcc >= Ts && m < 512) { covAcc -= Ts; covStep(); m++; }
  if (m >= 512) covAcc = 0;
  if (WORLD.tC >= roundCov()) seedCov();
}

/* ── 绘制助手（用引擎部件拼，规范 §4） ── */
function zAt(tt) { return (state.t - tt) * state.waveSpeed; }
/* 一列样本 → 折线点：沿 +z 流出，最新贴在 z = 0，超界裁到 ±lim */
function traceOf(sel, y0, sc, lim, xp) {
  const pts = [];

    const s = samples[i], v = sel(s);
    if (v == null || !isFinite(v)) { pts.push(null); continue; }
    pts.push([xp || 0, y0 + clamp(v * sc, -lim, lim), zAt(s.t)]);

}
/* 历史曲线双描：外层同色辉光 .13 + 内核渐变（头亮尾隐），规范 §4.2 */

/* y–t 平面的坐标框：只要 y 轴与 t 轴（引擎的 drawAxes 必带 x 轴，这里用不上） */

/* 刻度步长随窗口自适应：窗口一长，每秒一个标签会挤成一片 */

/* 任意平面上的方格网（i 为常量轴：0=x, 1=y, 2=z） */
function planeGrid(C, axis, at, u0, u1, du, v0, v1, dv, color) {
  const mk = (u, v) => axis === 0 ? [at, u, v] : axis === 1 ? [u, at, v] : [u, v, at];
  for (let u = Math.ceil(u0/du)*du; u <= u1 + 1e-9; u += du) line3(C, mk(u, v0), mk(u, v1), { width: 1, color: color });
  for (let v = Math.ceil(v0/dv)*dv; v <= v1 + 1e-9; v += dv) line3(C, mk(u0, v), mk(u1, v), { width: 1, color: color });

/* 圆（奈奎斯特的单位圆、以 −1 为心的禁区圆） */
function circlePts(cx, cy, r, z, n) {
  const pts = [];
  const N = n || 72;
  for (let i = 0; i <= N; i++) { const a = i / N * TAU; pts.push([cx + r*Math.cos(a), cy + r*Math.sin(a), z]); }
  return pts;
}
/* 协方差椭圆：kσ 等高线 x = k·Σ^{1/2}·[cos t, sin t]，对称 2×2 解析开方 */
function ellipsePts(Sig, cx, cy, z, sx, sy, k, n, bx, by) {
  const s11 = Sig[0][0], s12 = Sig[0][1], s22 = Sig[1][1];
  const tr = s11 + s22, dt = s11*s22 - s12*s12;
  const disc = Math.max(0, tr*tr/4 - dt);
  const l1 = tr/2 + Math.sqrt(disc), l2 = Math.max(0, tr/2 - Math.sqrt(disc));
  let v1;
  if (Math.abs(s12) > 1e-300) v1 = [l1 - s22, s12];
  else v1 = s11 >= s22 ? [1, 0] : [0, 1];
  const n1 = Math.hypot(v1[0], v1[1]) || 1;
  v1 = [v1[0]/n1, v1[1]/n1];
  const v2 = [-v1[1], v1[0]];
  const r1 = k * Math.sqrt(Math.max(0, l1)), r2 = k * Math.sqrt(Math.max(0, l2));
  const pts = [];
  const N = n || 44;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU, ca = Math.cos(a), sa = Math.sin(a);
    const dx = r1*ca*v1[0] + r2*sa*v2[0], dy = r1*ca*v1[1] + r2*sa*v2[1];
    /* 越界的先验椭圆裁到画框内（规范 §6 无界值处理）：不裁的话「一无所知」
       那一枚会大到把整幅画盖住，收缩过程反而看不见 */
    const X = bx || 1e9, Y = by || 1e9;
    pts.push([clamp(cx + dx*sx, -X, X), clamp(cy + dy*sy, -Y, Y), z]);
  }
  return pts;
}
/* 倒立摆本体：枢轴在 (0, 0, PZ)，θ 自竖直向上量起 */

/* ── 页① 的世界映射：复平面在 x·y（按 ω₀ 归一），代价比 ρ = q/r 沿 z ──
   这与 ctrl-locus-limits-3d 页签① 是刻意的呼应：那里第三根轴是**增益**（你手动
   扫的），这里是**代价比**（你只说明偏好，增益自己出来）。同一张复平面、同样
   按 ω₀ 归一、同样的正交俯视顿悟视角。 */
const LOC_S = 0.95, LOC_RE0 = -4.0, LOC_RE1 = 1.75, LOC_IM = 2.9;
const RHO_LO = -2, RHO_HI = 5, RHO_LEN = 4.6;
const zOfRho = lr => (clamp(lr, RHO_LO, RHO_HI) - RHO_LO) / (RHO_HI - RHO_LO) * RHO_LEN;
const xOfRe = re => clamp(re, LOC_RE0, LOC_RE1) * LOC_S;

const locusCache = { sig: '', br: null };
/* 极点束由**逐点实解 Riccati** 得到（141 次，约 0.4 ms，按被控对象缓存）——
   不是把解析式画一遍：整个工具的论点就是「这条曲线是解出来的」。 */
function locusData() {
  const sig = [state.len, state.mass, state.damp].join('|');
  if (locusCache.sig === sig) return locusCache.br;
  const A = plantA(), B = plantB();
  const br = [[], []];
  let prev = null;
  for (let i = 0; i < LOC_N; i++) {
    const lr = RHO_LO + (RHO_HI - RHO_LO) * i / (LOC_N - 1);
    const S = careSolve(A, B, [[p10(lr), 0], [0, 0]], 1);
    let r = eig2([[A[0][0] - B[0]*S.K[0], A[0][1] - B[0]*S.K[1]],
                  [A[1][0] - B[1]*S.K[0], A[1][1] - B[1]*S.K[1]]]);
    if (prev) {                                   /* 连续性追踪：贪心最近邻配对，
                                                     否则两条支会在分离点上串色 */
      const d00 = Math.hypot(r[0][0]-prev[0][0], r[0][1]-prev[0][1]);
      const d01 = Math.hypot(r[1][0]-prev[0][0], r[1][1]-prev[0][1]);
      if (d01 < d00) r = [r[1], r[0]];
    } else if (r[0][1] < r[1][1]) r = [r[1], r[0]];
    br[0].push({ lr: lr, re: r[0][0], im: r[0][1] });
    br[1].push({ lr: lr, re: r[1][0], im: r[1][1] });
    prev = r;
  }
  locusCache.sig = sig; locusCache.br = br;
  return br;
}
function locusPoly(branch, w0) {
  const pts = [];
  for (const q of branch) {
    const re = q.re / w0, im = q.im / w0;
    if (!inBox(re, im)) { if (pts.length && pts[pts.length - 1] !== null) pts.push(null); continue; }
    pts.push([re * LOC_S, im * LOC_S, zOfRho(q.lr)]);
  }
  return pts;
}
/* 页① 的响应小窗：贴在当前 ρ 的高度上，摆在复平面**下方**（放右边会被面板盖住） */
const RSP_X0 = -3.6, RSP_X1 = 1.5, RSP_Y = -4.85, RSP_SC = 5.5, RSP_CLIP = 0.85;
/* 小窗的时间跨度不等于一轮：LQR 常常 1 秒就稳住，拿 7 秒的窗去装它，95% 的画面
   是一条压在零线上的直线。取两个控制器里**较慢**的那个的 6 个时间常数，两条
   曲线才都在窗内展开；上限仍是一轮，免得比一轮还长。 */
function respHorizon() {
  const S = lqrSolve();
  const decay = Math.min(-Math.max(S.poles[0][0], S.poles[1][0]), state.wh);
  return clamp(6 / Math.max(0.2, decay), 0.5, roundLqr());

/* 页④ 的奈奎斯特平面：与 s 平面**并排**放在 z = 0 上，不沿 z 叠放 ——
   两张平面都是复平面，沿深度叠起来后任何一个正视都会把两者画在同一片像素上

/* 最近 win 秒内某个残差的 RMS（页② 用来量化「谁更准」） */
function rmsOf(sel, win) {
  let n = 0, s = 0;
  for (let i = samples.length - 1; i >= 0; i--) {
    const q = samples[i];
    if (state.t - q.t > win) break;
    const e = sel(q);
    if (e == null || !isFinite(e)) continue;
    s += e * e; n++;

  return n ? Math.sqrt(s / n) : null;
}

      const X0 = xOfRe(LOC_RE0), X1 = xOfRe(LOC_RE1), Y1 = yOfIm(LOC_IM);

      if (state.showGrid) planeGrid(C, 2, 0, X0, X1, LOC_S, -Y1, Y1, LOC_S, 'rgba(148,163,184,0.07)');
      /* 虚轴平面 Re s = 0 是稳定边界曲面 —— LQR 的极点永远在它左边，这是定理 */
      planeGrid(C, 0, 0, -Y1, Y1, LOC_S, 0, RHO_LEN, RHO_LEN/4, 'rgba(45,212,234,0.09)');

      axisSeg(C, [X0 - 0.25, 0, 0], [X1 + 0.3, 0, 0], 'Re', { dx: 0.34, dy: 0.2 });
      axisSeg(C, [0, -Y1 - 0.2, 0], [0, Y1 + 0.3, 0], 'Im', { dy: 0.24 });
      axisSeg(C, [0, 0, 0], [0, 0, RHO_LEN + 0.5], 'ρ', { dz: 0.4 });
      for (const k of [-4, -3, -2, -1, 1]) tickMark(C, [k*LOC_S, 0, 0], [0, 0.07, 0], (k < 0 ? '−' : '') + Math.abs(k), { dy: -0.22 });
      for (const k of [-2, -1, 1, 2]) tickMark(C, [0, k*LOC_S, 0], [0.07, 0, 0], (k < 0 ? '−' : '') + Math.abs(k) + 'j', { dx: -0.26, align: 'right' });
      for (let e = RHO_LO; e <= RHO_HI; e++) tickMark(C, [0, 0, zOfRho(e)], [0.07, 0, 0], '10' + (e < 0 ? '⁻' : '') + '⁰¹²³⁴⁵⁶⁷⁸⁹'[Math.abs(e)], { dx: 0.3, align: 'left' });

      /* 极点束：一条支 = 一种颜色，读数区里同色加粗（六处同源） */
      const LD = locusData();
      if (state.showB1) { const p = locusPoly(LD[0], w0);
        strokePoly(C, p, { width: 5.5, color: rgba(C_ROSE, 0.13) });
        strokePoly(C, p, { width: 2.2, color: rgba(C_ROSE, 0.92) }); }
      if (state.showB2) { const p = locusPoly(LD[1], w0);
        strokePoly(C, p, { width: 5.5, color: rgba(C_VIOLET, 0.13) });
        strokePoly(C, p, { width: 2.2, color: rgba(C_VIOLET, 0.92) }); }

      /* 当前 ρ 的切片：虚线方框 + 两个极点光点 */
      strokePoly(C, [[X0,-Y1,zr],[X1,-Y1,zr],[X1,Y1,zr],[X0,Y1,zr],[X0,-Y1,zr]],
        { width: 1.2, dash: [6, 6], color: rgba(C_CYAN, 0.45) });
      const cols = [C_ROSE, C_VIOLET], on = [state.showB1, state.showB2];
      for (let j = 0; j < 2; j++) {
        if (!on[j]) continue;
        const re = S.poles[j][0] / w0, im = S.poles[j][1] / w0;
        if (!inBox(re, im)) continue;
        const p3 = [xOfRe(re), yOfIm(im), zr];
        if (state.showGuides) line3(C, p3, [p3[0], 0, zr], { width: 1.5, dash: [7, 7], color: rgba(cols[j], 0.7) });
        const sp = proj(C, p3);
        if (sp) glowDot(sp, 10, '#ffffff', rgba(cols[j], 0.9));
      }
      /* 手调 K 的极点：双重根 −ω_h（翠绿） */
      if (state.showMan) {
        const re = -state.wh / w0;
        if (inBox(re, 0)) {
          const sp = proj(C, [xOfRe(re), 0, zr]);
          if (sp) glowDot(sp, 9, '#ffffff', rgba(C_EMERALD, 0.9));
          label3(C, [xOfRe(re), 0.26, zr], '−ω h', { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'center' });
        }
      }

      /* 开环极点：ρ → 0 时 LQR 极点趋于它们的**镜像**（贵控制极限） */
      const olp = eig2(plantA());
      for (const r of olp) {
        const re = r[0] / w0;
        if (inBox(re, 0)) solidDot(C, [xOfRe(re), 0, 0], 3.4, rgba(C_CYAN, 0.95));
      }
      label3(C, [xOfRe(olp[0][0]/w0) + 0.1, -0.34, 0], t({ zh: '开环极点', en: 'open-loop poles' }),
        { size: 10.5, color: '#2dd4ea', align: 'left' });

      /* 响应小窗：真闭环仿真的 θ(t)，贴在当前 ρ 的高度上 —— 极点位置与响应一一对应 */
      const rd = respHorizon();
      const respPts = (sel, ageSel) => {
        const pts = []; let prevAge = -1;
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i], age = ageSel(s);
          if (age == null || age > rd) continue;
          if (prevAge >= 0 && age > prevAge) pts.push(null);      // 换了一轮，折线断开
          prevAge = age;
          const v = sel(s);
          if (v == null || !isFinite(v)) { pts.push(null); continue; }
          pts.push([RSP_X0 + (age / rd) * (RSP_X1 - RSP_X0), RSP_Y + clamp(v * RSP_SC, -RSP_CLIP, RSP_CLIP), zr]);
        }
        return pts;
      };
      if (state.showResp || state.showMan) {
        line3(C, [RSP_X0, RSP_Y, zr], [RSP_X1, RSP_Y, zr], { width: 1, dash: [5, 6], color: rgba(C_SLATE, 0.4) });
        line3(C, [RSP_X0, RSP_Y - RSP_CLIP - 0.1, zr], [RSP_X0, RSP_Y + RSP_CLIP + 0.1, zr], { width: 1, color: rgba(C_SLATE, 0.35) });
        label3(C, [RSP_X0 - 0.12, RSP_Y, zr], 'θ', { font: 'italic 12px ' + FONT_MATH, color: '#c4d2e6', align: 'right' });
        label3(C, [RSP_X1, RSP_Y - 0.22, zr], fmt(rd, 1) + ' s',
          { size: 10, color: 'rgba(159,176,200,.6)', align: 'right' });
        label3(C, [RSP_X0 + 0.06, RSP_Y + RSP_CLIP + 0.24, zr],
          t({ zh: '同一个 θ₀ 下的闭环响应', en: 'closed-loop response from the same θ₀' }),
          { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'left' });
      }
      if (state.showMan)  curve(C, respPts(s => s.mTh, s => s.aA), C_EMERALD);
      if (state.showResp) curve(C, respPts(s => s.oTh, s => s.aA), C_ORANGE);

      /* 代价对比条（琥珀度量注记）：解析值 J = x₀ᵀPx₀，长度按 LQR 归一 */
      if (state.showGuides) {
        const Jo = costOfK(S.K), Jm = costOfK(Km);
        const yB = RSP_Y - 1.55, wMax = RSP_X1 - RSP_X0;
        /* 条长按两者中较长的那根归一，量程封顶 4×（手调可以差得非常离谱） */
        const rel = (isFinite(Jm) && Jo > 0) ? Math.min(4, Jm / Jo) : 4;
        const mx = Math.max(1, rel);
        line3(C, [RSP_X0, yB + 0.15, zr], [RSP_X0 + wMax / mx, yB + 0.15, zr],
          { width: 7, color: rgba(C_ORANGE, 0.8) });
        line3(C, [RSP_X0, yB - 0.15, zr], [RSP_X0 + wMax * rel / mx, yB - 0.15, zr],
          { width: 7, color: rgba(C_EMERALD, 0.8) });
        label3(C, [RSP_X0 + wMax / mx + 0.1, yB + 0.15, zr], 'J LQR = ' + fmtSig(Jo),
          { font: 'italic 11px ' + FONT_MATH, color: '#fb923c', align: 'left' });
        label3(C, [RSP_X0 + wMax * rel / mx + 0.1, yB - 0.15, zr],
          'J ' + t({ zh: '手调', en: 'hand' }) + ' = ' + (isFinite(Jm) ? fmtSig(Jm) : '∞'),
          { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'left' });
        label3(C, [RSP_X0, yB - 0.5, zr],
          t({ zh: '多花的代价 ', en: 'excess cost ' }) + (isFinite(Jm) ? '+' + fmt((Jm/Jo - 1) * 100, 2) + '%' : '∞'),
          { size: 11, color: 'rgba(251,191,36,.95)', align: 'left' });
      }

      label3(C, [X0 + 0.3, Y1 + 0.62, 0], 'AᵀP + PA − PBR⁻¹BᵀP + Q = 0,   K = R⁻¹BᵀP',
        { font: 'italic 13px ' + FONT_MATH, color: '#2dd4ea', align: 'left' });
      label3(C, [X0 + 0.3, Y1 + 0.28, 0], t({ zh: '复平面两轴均以 ω₀ = √(g/L) 归一；ρ = q/r 为对数轴',
                                              en: 'both plane axes normalised by ω₀ = √(g/L); ρ = q/r on a log axis' }),
        { size: 10.5, color: 'rgba(159,176,200,.6)', align: 'left' });
    },
    readout() {
      const W = ensureWorld(), S = lqrSolve(), Km = manualK();
      const rho = state.qc / state.rc;
      const an = srlPoles(rho);
      /* 解析对称根轨迹 vs 实解 Riccati：两条独立路径，差要报出来 */
      let dPole = 0;
      for (let i = 0; i < 2; i++) {
        const a = S.poles[i];
        let bd = Infinity;
        for (const b of an) bd = Math.min(bd, Math.hypot(a[0]-b[0], a[1]-b[1]));
        dPole = Math.max(dPole, bd / Math.max(1e-12, Math.hypot(a[0], a[1])));
      }
      const Jo = costOfK(S.K), Jm = costOfK(Km);
      const exc = isFinite(Jm) && Jo > 0 ? (Jm / Jo - 1) * 100 : Infinity;
      const mo = W.JoEnd, mm = W.JmEnd;
      const excM = (mo != null && mm != null && mo > 0) ? (mm / mo - 1) * 100 : null;
      return roHead() +
        '<div>ρ = q/r = <b>' + fmtSig(rho) + '</b>&ensp;<span class="dim">(q = ' + fmtSig(state.qc) +
          ', r = ' + fmtSig(state.rc) + t({ zh: '；K 只取决于比值', en: '; K depends on the ratio only' }) + ')</span></div>' +
        '<div class="cyaC">K<sub>LQR</sub> = <b>[' + fmt(S.K[0], 3) + ', ' + fmt(S.K[1], 3) + ']</b></div>' +
        '<div class="sinC">s₁ = <b>' + poleText(S.poles[0]) + '</b></div>' +
        '<div class="cosC">s₂ = <b>' + poleText(S.poles[1]) + '</b></div>' +
        '<div class="tanC">' + t({ zh: '手调', en: 'hand-tuned' }) + ' K = <b>[' + fmt(Km[0], 3) + ', ' + fmt(Km[1], 3) +
          ']</b>&ensp;<span class="dim">(' + t({ zh: '双重极点 ', en: 'double pole ' }) + '−' + fmt(state.wh, 1) + ')</span></div>' +
        '<div class="cotC">J<sub>LQR</sub> = <b>' + fmtSig(Jo) + '</b>&ensp;·&ensp;' +
          t({ zh: '手调', en: 'hand' }) + ' J = ' + (isFinite(Jm) ? fmtSig(Jm) : '∞') + '&ensp;·&ensp;' +
          t({ zh: '多花', en: 'excess' }) + ' <b>' + (isFinite(exc) ? '+' + fmt(exc, 2) + '%' : '∞') + '</b></div>' +
        '<div class="dim">' + t({ zh: '实测（一轮 ZOH 积分）', en: 'measured (one round, ZOH)' }) + ' J = ' +
          (mo == null ? '—' : fmtSig(mo)) + ' / ' + (mm == null ? '—' : fmtSig(mm)) +
          (excM == null ? '' : '&ensp;' + t({ zh: '多花', en: 'excess' }) + ' ' + sgn2(excM, 1) + '%') + '</div>' +
        '<div class="amb">' + t({ zh: 'Riccati 残差', en: 'Riccati residual' }) + ' ‖AᵀP+PA−PBR⁻¹BᵀP+Q‖ = <b>' +
          S.res.toExponential(1) + '</b>&ensp;·&ensp;' + S.iters + t({ zh: ' 次迭代', en: ' iterations' }) + '</div>' +
        '<div class="dim">' + t({ zh: '与解析对称根轨迹之差', en: 'vs analytic symmetric root locus' }) + ' ' +
          dPole.toExponential(1) + '&ensp;·&ensp;s⁴ − (2a+c²)s² + a² + ρb² = 0</div>';
    }
  },

  /* ── ② 卡尔曼增益 = 两个不确定度的加权 ──────────────────────
     靠什么在动：无 drive —— 真实状态由 RK4 积分器自走（LQR 状态反馈镇定 +
     过程噪声常驻），测量每个采样时刻重新抽噪，纯模型预测每 roundKf() 秒
     （随「演示时长」）重新对齐一次（seedKf），指数漂走的过程反复重演。 */
  gain: {
    label: { zh: '卡尔曼增益', en: 'Kalman gain' },
    params: ['len', 'mass', 'damp', 'qc', 'rc', 'sw', 'sv', 'psi', 'tilt', 'fs', 'waveSpeed'],
    brand: { zh: '同一段运动，四种读法：真值、含噪测量、纯模型预测、卡尔曼融合。σ_v 越大它越信模型，σ_w 越大它越信测量 —— 卡尔曼不是滤波技巧，是「该信谁」的定量答案。',
             en: 'One motion, four readings: the truth, the noisy measurement, the model-only prediction, and the Kalman fusion. Raise σ_v and it leans on the model; raise σ_w and it leans on the sensor — the Kalman filter is not a smoothing trick, it is a quantitative answer to "whom should I believe".' },
    tips: { zh: '提示：这一页直接接着「让倒立摆站起来」页签④ —— 那里的观测器增益是手调的（极点随手配在 −8），这里的 L = ΣCᵀV⁻¹ 是由噪声统计**算出来的**。注意读数区那条：被控对象不稳定，所以 σ_v → ∞ 时 L₁ 并不趋于 0，而是停在镜像极点那个下限上。',
            en: 'Tip: this continues tab 4 of "Standing the inverted pendulum up", where the observer gain was hand-placed at −8. Here L = ΣCᵀV⁻¹ is computed from the noise statistics. Note the line in the readout: because the plant is unstable, L₁ does not go to zero as σ_v → ∞ — it floors at the mirror-pole gain.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' },              az: -0.80, el: 0.30,  dist: 13.0, tx: 0, ty: 0, tz: 2.7 },
      side: { label: { zh: '侧视 θ·t', en: 'Side θ·t' },     az: -Math.PI/2, el: 0.001, dist: 12.0, tx: 0, ty: 0, tz: 2.9,
              onSelect: () => { ['showTrue', 'showMeas', 'showPred', 'showEst'].forEach(k => { state[k] = true;
                document.querySelectorAll('input[data-key="' + k + '"]').forEach(o => { o.checked = true; }); }); } },
      face: { label: { zh: '正视 摆 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 7.5, tx: 0, ty: 0.35, tz: PZ }
    },
    toggles: [
      { key: 'showMeas', label: { zh: '含噪测量 y',        en: 'Noisy measurement y' },   color: '#fb7185', checked: true },
      { key: 'showPred', label: { zh: '纯模型预测（不看测量）', en: 'Model-only prediction' }, color: '#a78bfa', checked: true },
      { key: 'showEst',  label: { zh: '卡尔曼融合 θ̂',      en: 'Kalman estimate θ̂' },     color: '#34d399', checked: true },
      { key: 'showTrue', label: { zh: '真值 θ',            en: 'True θ' },                color: '#9fb0c8', checked: true },
      { key: 'showGuides', label: { zh: '投影辅助线',      en: 'Projection guides' },     color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格',              en: 'Grid' },                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => demoSpan() + 0.5,
    draw(C) {
      const W = ensureWorld(), v = state.waveSpeed, F = kfSolve();
      const TH = 2.6, LIM = 1.55;
      if (state.showGrid) drawTimeGrid(C, { yMax: 1.7, v: v });
      laneLine(C, 0, null);
      for (const sg of [1, -1]) line3(C, [0, sg*LIM, 0], [0, sg*LIM, WAVE_LEN],
        { width: 1, dash: [5, 6], color: rgba(C_AMBER, 0.20) });
      label3(C, [0, LIM + 0.16, WAVE_LEN * 0.6],
        t({ zh: '|θ| > ' + fmt(LIM/TH) + ' rad：曲线裁剪', en: '|θ| > ' + fmt(LIM/TH) + ' rad : clipped' }),
        { size: 10.5, color: rgba(C_AMBER, 0.7), align: 'center' });
      frameYT(C, 1.9, [{ y: 0.25*TH, s: '0.25' }, { y: -0.25*TH, s: '−0.25' },
                       { y: 0.5*TH, s: '0.5' }, { y: -0.5*TH, s: '−0.5' }]);
      label3(C, [0, 2.12, 0], 'θ', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });

      /* 画序：真值（骨架）→ 测量（撕碎的）→ 纯模型（漂走的）→ 卡尔曼（压在最上） */
      if (state.showTrue) curve(C, traceOf(s => s.bTh, 0, TH, LIM), C_SLATE);
      if (state.showMeas) curve(C, traceOf(s => s.meas, 0, TH, LIM), C_ROSE);
      if (state.showPred) curve(C, traceOf(s => s.pTh, 0, TH, LIM), C_VIOLET);
      if (state.showEst)  curve(C, traceOf(s => s.eTh, 0, TH, LIM), C_EMERALD);

      /* 推算窗口的起点（琥珀度量注记）：紫线每次都是从这里与真值重合后放手的 */
      if (state.showPred && state.showGuides) {
        const pw = predWindow();
        for (let k = 0; k * pw <= demoSpan() + pw; k++) {
          const z = (W.tP + k * pw) * v;
          if (z <= 0 || z > WAVE_LEN) continue;
          line3(C, [0, -1.7, z], [0, -1.55, z], { width: 1.4, color: rgba(C_AMBER, 0.7) });
        }
        label3(C, [0, -1.9, W.tP * v + 0.4], t({ zh: '↑ 每次在此重新对齐真值', en: '↑ realigned to the truth here' }),
          { size: 10, color: rgba(C_AMBER, 0.65), align: 'left' });
      }
      if (state.showGuides) line3(C, [state.len*Math.sin(W.bTh), state.len*Math.cos(W.bTh), PZ],
        [0, clamp(W.bTh*TH, -LIM, LIM), 0], { width: 1.5, dash: [7, 7], color: rgba(C_SLATE, 0.45) });
      if (state.showTrue) headDot(C, 0, W.bTh, TH, LIM, C_SLATE, 8);
      if (state.showMeas) headDot(C, 0, W.meas, TH, LIM, C_ROSE);
      if (state.showPred) headDot(C, 0, W.pTh, TH, LIM, C_VIOLET);
      if (state.showEst)  headDot(C, 0, W.eTh, TH, LIM, C_EMERALD, 10);

      /* 「该信谁」的琥珀标尺：k_θ = P/(P+R) ∈ [0,1]，本次更新给测量的权重 */
      const kth = clamp(W.kTheta || 0, 0, 1);
      const BX = 0.95, BY0 = -1.72, BW = 1.5;
      line3(C, [BX, BY0, 0], [BX + BW, BY0, 0], { width: 3, color: rgba(C_SLATE, 0.35) });
      line3(C, [BX, BY0, 0], [BX + BW * kth, BY0, 0], { width: 7, color: rgba(C_AMBER, 0.85) });
      label3(C, [BX, BY0 + 0.2, 0], t({ zh: '信模型', en: 'trust model' }), { size: 10, color: rgba(C_VIOLET, 0.85), align: 'left' });
      label3(C, [BX + BW, BY0 + 0.2, 0], t({ zh: '信测量', en: 'trust sensor' }), { size: 10, color: rgba(C_ROSE, 0.85), align: 'right' });
      label3(C, [BX + BW*kth, BY0 - 0.22, 0], 'K = P/(P+R) = ' + fmt(kth, 3),
        { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'center' });

      drawUpright(C, state.len, W.bTh);
      drawPend(C, W.bTh, state.len, C_CYAN, true);
      label3(C, [0, -0.66, PZ], t({ zh: '只测得到 θ（还带噪）', en: 'only θ is measured — and it is noisy' }),
        { size: 11, color: rgba(C_CYAN, 0.8), align: 'center' });
      label3(C, [0, -2.06, WAVE_LEN * 0.45], 'dx̂/dt = A x̂ + B u + L(y − C x̂),   L = ΣCᵀV⁻¹',
        { font: 'italic 13px ' + FONT_MATH, color: rgba(C_EMERALD, 0.85), align: 'center' });
    },
    readout() {
      const W = ensureWorld(), F = kfSolve();
      const rp = rmsOf(q => q.pTh - q.bTh, 2.0), re = rmsOf(q => q.eTh - q.bTh, 2.0);
      const rm = rmsOf(q => q.meas - q.bTh, 2.0);
      const floor = gainFloor();
      return roHead() +
        '<div class="dim">' + t({ zh: '真值', en: 'true' }) + ' θ = <b>' + fmtS(W.bTh, 4) + '</b> rad</div>' +
        '<div class="sinC">' + t({ zh: '含噪测量', en: 'measurement' }) + ' y = <b>' + fmtS(W.meas, 4) + '</b>' +
          '&ensp;<span class="dim">RMS ' + (rm == null ? '—' : fmt(rm, 4)) + '</span></div>' +
        '<div class="cosC">' + t({ zh: '纯模型预测', en: 'model only' }) + ' = <b>' + fmtS(W.pTh, 4) + '</b>' +
          '&ensp;<span class="dim">RMS ' + (rp == null ? '—' : fmt(rp, 4)) +
          t({ zh: '，每 ', en: ', realigned every ' }) + fmt(predWindow(), 2) + t({ zh: ' s 重新对齐', en: ' s' }) + '</span></div>' +
        '<div class="tanC">' + t({ zh: '卡尔曼融合', en: 'Kalman' }) + ' θ̂ = <b>' + fmtS(W.eTh, 4) + '</b>' +
          '&ensp;<span class="dim">RMS ' + (re == null ? '—' : fmt(re, 4)) + '</span></div>' +
        '<div class="cyaC">L = <b>[' + fmt(F.L[0], 3) + ', ' + fmt(F.L[1], 3) + ']</b>&ensp;<span class="dim">Σ₁₁ = ' +
          F.Sig[0][0].toExponential(2) + ', Σ₂₂ = ' + F.Sig[1][1].toExponential(2) + '</span></div>' +
        '<div class="amb">' + t({ zh: '本次更新给测量的权重', en: 'weight on this measurement' }) +
          ' K = P/(P+R) = <b>' + fmt(clamp(W.kTheta || 0, 0, 1), 4) + '</b></div>' +
        '<div class="dim">σ_w = ' + fmtSig(state.sw) + ' → ∞ ' + t({ zh: '则 K → 1（信测量）', en: '⇒ K → 1 (trust the sensor)' }) +
          '&ensp;·&ensp;σ_v = ' + fmtSig(state.sv) + ' → ∞ ' +
          t({ zh: '则 L₁ ↓ 但**不到 0**：被控对象不稳定，下限 √(c²+4a)−c = ',
              en: '⇒ L₁ falls but never to 0: the plant is unstable, floor √(c²+4a)−c = ' }) + fmt(floor, 3) + '</div>' +
        '<div class="amb">' + t({ zh: 'Riccati 残差', en: 'Riccati residual' }) + ' <b>' + F.res.toExponential(1) +
          '</b>&ensp;·&ensp;' + F.iters + t({ zh: ' 次迭代', en: ' iterations' }) + '&ensp;·&ensp;' +
          t({ zh: '滤波极点', en: 'filter poles' }) + ' ' + poleText(F.poles[0]) + '</div>';
    }
  },

  /* ── ③ 协方差的呼吸 ────────────────────────────────────────
     靠什么在动：无 drive —— 协方差递推每个采样时刻走一次预测/更新（covStep），
     椭圆链沿 +z 流出；每 roundCov() 秒（随「演示时长」）把 Σ 退回一个大先验
     （seedCov），「从一无所知到收敛」的过程反复重演，永不定格。 */
  covariance: {
    label: { zh: '协方差的呼吸', en: 'The breathing covariance' },
    params: ['len', 'mass', 'damp', 'qc', 'rc', 'sw', 'sv', 'psi', 'tilt', 'fs', 'waveSpeed'],
    brand: { zh: '相平面 (θ, ω) 铺在 x·y，时间沿 z：预测步让椭圆沿动力学拉伸长大（玫红），更新步让它沿测量方向收缩（紫）。一呼一吸，就是滤波器全部的工作。',
             en: 'The phase plane (θ, ω) lies in x·y and time runs along z: the predict step stretches and grows the ellipse along the dynamics (rose), the update step contracts it along the measured direction (violet). Breathe out, breathe in — that is the whole job of the filter.' },
    tips: { zh: '提示：只测 θ、不测 ω，椭圆本该只在 θ 方向被压扁 —— 但 θ̇ = ω 这条耦合把「确定」传播到了 ω 上，这就是测不到的量也能估出来的原因。打开「切断耦合 θ̇ = ω」，ω 立刻不可观，读数区的 σ_ω 会退回先验值再也不收缩。',
            en: 'Tip: only θ is measured, so the ellipse ought to flatten along θ alone — but the coupling θ̇ = ω propagates that certainty into ω, which is exactly why an unmeasured quantity can still be estimated. Switch on "cut the coupling θ̇ = ω" and ω becomes unobservable at once: the readout σ_ω falls back to the prior and stops contracting.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' },                az: -0.85, el: 0.32,  dist: 13.5, tx: 0, ty: 0, tz: 2.7 },
      side:  { label: { zh: '侧视 σ·t（呼吸）', en: 'Side σ·t (the breathing)' }, az: -Math.PI/2, el: 0.001, dist: 11.0, tx: 0, ty: 0, tz: 3.2 },
      face:  { label: { zh: '相平面正视 θ·ω', en: 'Phase plane θ·ω' }, az: 0.001, el: 0.02, dist: 10.5, tx: 0, ty: 0, tz: 3.2 }
    },
    toggles: [
      { key: 'showSm',     label: { zh: '预测后 Σ⁻（长大）', en: 'After predict Σ⁻ (grows)' },   color: '#fb7185', checked: true },
      { key: 'showSp',     label: { zh: '更新后 Σ⁺（收缩）', en: 'After update Σ⁺ (shrinks)' },  color: '#a78bfa', checked: true },
      { key: 'showEstTr',  label: { zh: '估计轨迹 (θ̂, ω̂)',   en: 'Estimate track (θ̂, ω̂)' },     color: '#34d399', checked: true },
      { key: 'showTrueTr', label: { zh: '真实轨迹 (θ, ω)',    en: 'True track (θ, ω)' },        color: '#fb923c', checked: true },
      { key: 'noCouple',   label: { zh: '切断耦合 θ̇ = ω',     en: 'Cut the coupling θ̇ = ω' },   color: '#2dd4ea', checked: false },
      { key: 'showGuides', label: { zh: '度量标注',            en: 'Metrology marks' },          color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格',                en: 'Grid' },                     color: '#64748b', checked: true }
    ],
    sampleWindow: () => demoSpan() + 0.5,
    draw(C) {
      const W = ensureWorld(), v = state.waveSpeed;
      const SX = 6.5, SY = 1.3, EK = 2;      // θ 与 ω 的世界缩放；椭圆画 2σ
      const EX = 1.75, EY = 1.75;
      if (state.showGrid) planeGrid(C, 2, 0, -EX, EX, 0.5, -EY, EY, 0.5, 'rgba(148,163,184,0.07)');
      axisSeg(C, [-EX - 0.2, 0, 0], [EX + 0.3, 0, 0], 'θ', { dx: 0.26, dy: 0.18 });
      axisSeg(C, [0, -EY - 0.2, 0], [0, EY + 0.3, 0], 'ω', { dy: 0.24 });
      axisSeg(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], 't', { dz: 0.42 });
      for (const k of [-0.2, -0.1, 0.1, 0.2]) tickMark(C, [k*SX, 0, 0], [0, 0.07, 0], fmtS(k, 1), { dy: -0.22 });
      for (const k of [-1, -0.5, 0.5, 1]) tickMark(C, [0, k*SY, 0], [0.07, 0, 0], fmtS(k, 1), { dx: -0.24, align: 'right' });
      const step = tickStep(demoSpan());
      for (let k = step; k * v <= WAVE_LEN + 1e-6; k += step)
        tickMark(C, [0, 0, k*v], [0.07, 0, 0], fmt(k, k < 10 ? 1 : 0) + 's', { dx: 0.28, align: 'left' });
      /* 测量方向（青，源几何）：只有 θ 这一根轴被直接观测到 */
      line3(C, [-EX, 0, 0], [EX, 0, 0], { width: 1, dash: [4, 5], color: rgba(C_CYAN, 0.35) });
      label3(C, [EX * 0.72, -0.2, 0], t({ zh: '只有 θ 被测量', en: 'only θ is measured' }),
        { size: 10.5, color: rgba(C_CYAN, 0.8), align: 'center' });

      /* 椭圆链：沿 z 每隔约 0.26 世界单位画一枚，一呼（玫红）一吸（紫）交替 */
      let lastZ = -9;
      for (let i = samples.length - 1; i >= 0; i--) {
        const s = samples[i];
        if (s.cS11m == null) continue;
        const z = zAt(s.t);
        if (z > WAVE_LEN) break;
        if (z - lastZ < 0.5) continue;
        lastZ = z;
        const Sm = [[s.cS11m, s.cS12m], [s.cS12m, s.cS22m]];
        const Sp = [[s.cS11p, s.cS12p], [s.cS12p, s.cS22p]];
        /* 老椭圆按 z 平方衰减：透视让远端（= 更老）反而被放大，不压下去就会
           把最新那一枚盖住 —— 收缩过程恰恰要看最新那几枚 */
        const fade = 0.06 + 0.8 * Math.pow(Math.max(0, 1 - z / WAVE_LEN), 2);
        if (state.showSm) strokePoly(C, ellipsePts(Sm, 0, 0, z, SX, SY, EK, 44, EX, EY),
          { width: 1.6, color: rgba(C_ROSE, 0.72 * fade) });
        if (state.showSp) strokePoly(C, ellipsePts(Sp, 0, 0, z, SX, SY, EK, 44, EX, EY),
          { width: 1.6, color: rgba(C_VIOLET, 0.85 * fade) });
      }
      /* 最新那一枚：加粗，并用琥珀量出两个半轴 */
      const Sm0 = W.Sm, Sp0 = W.Sp;
      if (state.showSm) strokePoly(C, ellipsePts(Sm0, 0, 0, 0, SX, SY, EK, 72, EX, EY), { width: 2.6, color: rgba(C_ROSE, 0.95) });
      if (state.showSp) strokePoly(C, ellipsePts(Sp0, 0, 0, 0, SX, SY, EK, 72, EX, EY), { width: 2.6, color: rgba(C_VIOLET, 0.98) });
      if (state.showGuides) {
        const sTh = Math.sqrt(Math.max(0, Sp0[0][0])) * EK, sOm = Math.sqrt(Math.max(0, Sp0[1][1])) * EK;
        line3(C, [0, 0, 0], [clamp(sTh*SX, -EX, EX), 0, 0], { width: 2, color: rgba(C_AMBER, 0.9) });
        line3(C, [0, 0, 0], [0, clamp(sOm*SY, -EY, EY), 0], { width: 2, color: rgba(C_AMBER, 0.9) });
        label3(C, [clamp(sTh*SX, -EX, EX) + 0.06, -0.18, 0], '2σ θ = ' + fmtSig(sTh),
          { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'left' });
        label3(C, [0.08, clamp(sOm*SY, -EY, EY) + 0.14, 0], '2σ ω = ' + fmtSig(sOm),
          { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'left' });
      }

      /* 两条轨迹沿时间流出 */
      if (state.showTrueTr) {
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) { const s = samples[i];
          if (s.cTh == null) { pts.push(null); continue; }
          pts.push([clamp(s.cTh*SX, -EX, EX), clamp(s.cW*SY, -EY, EY), zAt(s.t)]); }
        curve(C, pts, C_ORANGE);
      }
      if (state.showEstTr) {
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) { const s = samples[i];
          if (s.cETh == null) { pts.push(null); continue; }
          pts.push([clamp(s.cETh*SX, -EX, EX), clamp(s.cEW*SY, -EY, EY), zAt(s.t)]); }
        curve(C, pts, C_EMERALD);
      }
      if (state.showTrueTr) { const p = proj(C, [clamp(W.cTh*SX,-EX,EX), clamp(W.cW*SY,-EY,EY), 0]);
        if (p) glowDot(p, 9, '#ffffff', rgba(C_ORANGE, 0.88)); }
      if (state.showEstTr) { const p = proj(C, [clamp(W.cETh*SX,-EX,EX), clamp(W.cEW*SY,-EY,EY), 0]);
        if (p) glowDot(p, 10, '#ffffff', rgba(C_EMERALD, 0.9)); }

      label3(C, [-EX, EY + 0.62, 0], 'Σ⁻ = ΦΣ⁺Φᵀ + Q d     Σ⁺ = Σ⁻ − Σ⁻Cᵀ(CΣ⁻Cᵀ + R d)⁻¹CΣ⁻',
        { font: 'italic 13px ' + FONT_MATH, color: '#2dd4ea', align: 'left' });
      if (state.noCouple) label3(C, [-EX, EY + 0.28, 0],
        t({ zh: '耦合已切断：A₁₂ = 0 ⇒ ω 不可观，ω 方向不再收缩',
            en: 'coupling cut: A₁₂ = 0 ⇒ ω is unobservable and stops contracting' }),
        { size: 11, color: '#fbbf24', align: 'left' });
    },
    readout() {
      const W = ensureWorld();
      const sThM = Math.sqrt(Math.max(0, W.Sm[0][0])), sThP = Math.sqrt(Math.max(0, W.Sp[0][0]));
      const sOmM = Math.sqrt(Math.max(0, W.Sm[1][1])), sOmP = Math.sqrt(Math.max(0, W.Sp[1][1]));
      /* 「先验」= 完全不测量时 ω 的稳态标准差：ω̇ = −cω + w ⇒ σ = σ_w/√(2c) */
      const prior = state.damp > 1e-9 ? state.sw / Math.sqrt(2 * state.damp) : Infinity;
      const F = kfSolve();
      return roHead() +
        '<div class="sinC">' + t({ zh: '预测后', en: 'after predict' }) + ' σ<sub>θ</sub>⁻ = <b>' + fmtSig(sThM) +
          '</b>&ensp;σ<sub>ω</sub>⁻ = <b>' + fmtSig(sOmM) + '</b></div>' +
        '<div class="cosC">' + t({ zh: '更新后', en: 'after update' }) + ' σ<sub>θ</sub>⁺ = <b>' + fmtSig(sThP) +
          '</b>&ensp;σ<sub>ω</sub>⁺ = <b>' + fmtSig(sOmP) + '</b></div>' +
        '<div class="amb">' + t({ zh: '本次更新的收缩率', en: 'contraction this update' }) + '&ensp;θ: <b>' +
          fmt(sThM > 0 ? sThP / sThM : 1, 4) + '</b>&ensp;ω: <b>' + fmt(sOmM > 0 ? sOmP / sOmM : 1, 4) + '</b>' +
          t({ zh: '（ω 没被直接测量）', en: ' (ω is never measured)' }) + '</div>' +
        '<div class="dim">' + t({ zh: '不测量时的先验', en: 'prior without measurement' }) + ' σ_w/√(2c) = ' +
          (isFinite(prior) ? fmtSig(prior) : '∞') + '&ensp;·&ensp;' +
          t({ zh: '当前 σ_ω⁺ / 先验 = ', en: 'current σ_ω⁺ / prior = ' }) +
          (isFinite(prior) && prior > 0 ? fmt(sOmP / prior, 3) : '—') + '</div>' +
        '<div class="' + (state.noCouple ? 'amb' : 'cyaC') + '">' +
          (state.noCouple
            ? t({ zh: '耦合已切断：A₁₂ = 0 ⇒ [C; CA] 降秩，ω 不可观 —— 比值回到 1',
                  en: 'coupling cut: A₁₂ = 0 ⇒ [C; CA] loses rank, ω unobservable — the ratio returns to 1' })
            : t({ zh: '耦合在：θ̇ = ω 把 θ 的确定性传播到 ω，比值 < 1',
                  en: 'coupling on: θ̇ = ω propagates θ-certainty into ω, so the ratio is < 1' })) + '</div>' +
        '<div class="dim">' + t({ zh: '稳态 Riccati 解（连续）', en: 'steady-state ARE (continuous)' }) + ' Σ₂₂ = ' +
          F.Sig[1][1].toExponential(3) + '&ensp;·&ensp;√Σ₂₂ = ' + fmtSig(Math.sqrt(F.Sig[1][1])) + '</div>';
    }
  },

  /* ── ④ 分离原理，以及它的代价 ───────────────────────────────
     靠什么在动：无 drive —— LQG 闭环（u = −K x̂）由 RK4 积分器自走，过程噪声与
     测量噪声常驻，每 roundLqg() 秒（随「演示时长」）重新踢一脚（seedLqg），
     裕度不足时的振荡因此反复看得见。极点与奈奎斯特曲线随滑杆实时重算。 */
  separation: {
    label: { zh: '分离原理与代价', en: 'Separation & its price' },
    params: ['len', 'mass', 'damp', 'qc', 'rc', 'sw', 'sv', 'psi', 'tilt', 'fs', 'waveSpeed'],
    brand: { zh: '把 LQR 与卡尔曼拼成 LQG：实际闭环的 4 个特征值恰是 LQR 的 2 个 ∪ 卡尔曼的 2 个 —— 定理，不是巧合。而它的代价在奈奎斯特图上：状态反馈绕开的那个禁区，LQG 一头扎了进去。',
             en: 'Bolt the LQR onto the Kalman filter and you get LQG: the four eigenvalues of the actual closed loop are exactly the two LQR ones together with the two Kalman ones — a theorem, not a coincidence. The price shows up on the Nyquist plot: the forbidden disc that state feedback always avoids is exactly what LQG dives into.' },
    tips: { zh: '提示：状态反馈的 LQR 有保证的裕度（卡尔曼不等式 |1+L(jω)| ≥ 1 ⇒ 相位裕度 ≥ 60°），画面上就是玫红曲线永远绕开以 −1 为心的青色单位圆。串上观测器，保证就没了 —— 按 4 一键套用一组把 LQG 裕度压到 10° 以下的参数（Doyle 1978）。最优不等于稳健。',
            en: 'Tip: LQR state feedback has guaranteed margins — the Kalman inequality |1+L(jω)| ≥ 1 forces a phase margin of at least 60°, which on screen is the rose curve always skirting the cyan unit circle centred at −1. Cascade an observer and the guarantee is gone: press 4 to apply a parameter set that drives the LQG margin below 10° (Doyle 1978). Optimal is not robust.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' },                    az: -0.55, el: 0.28, dist: 17, tx: 1.6, ty: -0.6, tz: 0 },
      pole: { label: { zh: '极点平面正视', en: 'Pole plane' },      az: 0.001, el: 0.02, dist: 9.5, tx: -1.1, ty: -0.6, tz: 0 },
      nyq:  { label: { zh: '奈奎斯特正视', en: 'Nyquist plane' },   az: 0.001, el: 0.02, dist: 9.0, tx: NY_CX, ty: 0, tz: 0 },
      /* 视角联动（§5.3）：这一格除了换相机，还把滑杆整体套到「裕度崩塌」那一组
         —— Doyle 1978 的结论必须能当场做出来，而不是只在 tips 里被引用。
         滑杆会同步跟着动（syncParamSlider），所以没有隐藏状态。 */
      doyle:{ label: { zh: '裕度崩塌（套用 Doyle 参数组）', en: 'Margin collapse (apply Doyle set)' },
              az: 0.001, el: 0.02, dist: 9.0, tx: NY_CX, ty: 0, tz: 0,
              onSelect: () => {
                state.len = 1.0; state.mass = 1.0; state.damp = 0.40;
                state.qc = 0.01; state.rc = 1; state.sw = 10; state.sv = 0.001; state.psi = 90;
                ['len', 'mass', 'damp', 'qc', 'rc', 'sw', 'sv', 'psi'].forEach(syncParamSlider);
              } }
    },
    toggles: [
      { key: 'showLqrP', label: { zh: 'LQR 极点',            en: 'LQR poles' },            color: '#fb7185', checked: true },
      { key: 'showKfP',  label: { zh: '卡尔曼极点',          en: 'Kalman poles' },         color: '#a78bfa', checked: true },
      { key: 'showLqgP', label: { zh: 'LQG 实际闭环特征值',  en: 'Actual LQG eigenvalues' }, color: '#34d399', checked: true },
      { key: 'showTrace',label: { zh: 'LQG 闭环 θ(t)',       en: 'LQG closed-loop θ(t)' }, color: '#fb923c', checked: true },
      { key: 'showNyq',  label: { zh: '奈奎斯特与禁区圆',    en: 'Nyquist & forbidden disc' }, color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格',                en: 'Grid' },                 color: '#64748b', checked: true }
    ],
    sampleWindow: () => demoSpan() + 0.5,
    draw(C) {
      const W = ensureWorld(), D = sepData(), w0 = omega0();
      const X0 = xOfRe(LOC_RE0), X1 = xOfRe(LOC_RE1), Y1 = yOfIm(LOC_IM);

      /* ── s 平面（z = 0）：三组极点必须重合 ── */
      if (state.showGrid) planeGrid(C, 2, 0, X0, X1, LOC_S, -Y1, Y1, LOC_S, 'rgba(148,163,184,0.07)');
      axisSeg(C, [X0 - 0.25, 0, 0], [X1 + 0.3, 0, 0], 'Re', { dx: 0.34, dy: 0.2 });
      axisSeg(C, [0, -Y1 - 0.2, 0], [0, Y1 + 0.3, 0], 'Im', { dy: 0.24 });
      for (const k of [-4, -3, -2, -1, 1]) tickMark(C, [k*LOC_S, 0, 0], [0, 0.07, 0], (k < 0 ? '−' : '') + Math.abs(k), { dy: -0.22 });
      for (const k of [-2, -1, 1, 2]) tickMark(C, [0, k*LOC_S, 0], [0.07, 0, 0], (k < 0 ? '−' : '') + Math.abs(k) + 'j', { dx: -0.26, align: 'right' });
      const mark = (p, col, r, ring) => {
        const re = p[0] / w0, im = p[1] / w0;
        if (!inBox(re, im)) return;
        const sp = proj(C, [xOfRe(re), yOfIm(im), 0]);
        if (!sp) return;
        if (ring) { ctx.save(); ctx.strokeStyle = rgba(col, 0.95); ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(sp[0], sp[1], r, 0, TAU); ctx.stroke(); ctx.restore(); }
        else glowDot(sp, r, '#ffffff', rgba(col, 0.9));
      };
      if (state.showLqrP) D.lqrPoles.forEach(p => mark(p, C_ROSE, 11));
      if (state.showKfP)  D.kfPoles.forEach(p => mark(p, C_VIOLET, 11));
      if (state.showLqgP) D.lqg.forEach(p => mark(p, C_EMERALD, 15, true));
      label3(C, [X0 + 0.3, Y1 + 0.6, 0],
        t({ zh: 's 平面：LQR 极点 ∪ 卡尔曼极点 = LQG 实际闭环的 4 个特征值',
            en: 's-plane: LQR poles ∪ Kalman poles = the 4 actual LQG eigenvalues' }),
        { size: 11.5, color: 'rgba(159,176,200,.85)', align: 'left' });
      label3(C, [X0 + 0.3, Y1 + 0.26, 0], t({ zh: '两轴以 ω₀ = √(g/L) 归一（翠绿圈套在前两者上）',
                                              en: 'axes normalised by ω₀ = √(g/L); the emerald rings sit on top of them' }),
        { size: 10.5, color: 'rgba(159,176,200,.55)', align: 'left' });

      /* ── LQG 闭环的真实 θ(t)：贴在 s 平面下方 ── */
      if (state.showTrace) {
        const rd = roundLqg(), Y0 = -Y1 - 1.25, SC = 4.0, CL = 0.8;
        line3(C, [X0, Y0, 0], [X1, Y0, 0], { width: 1, dash: [5, 6], color: rgba(C_SLATE, 0.4) });
        const pts = []; let prevAge = -1;
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i];
          if (s.aD == null || s.aD > rd) continue;
          if (prevAge >= 0 && s.aD > prevAge) pts.push(null);
          prevAge = s.aD;
          pts.push([X0 + (s.aD / rd) * (X1 - X0), Y0 + clamp(s.gTh * SC, -CL, CL), 0]);
        }
        curve(C, pts, C_ORANGE);
        label3(C, [X1 + 0.14, Y0, 0], t({ zh: 'LQG 闭环 θ(t)', en: 'LQG closed loop θ(t)' }),
          { size: 11, color: '#fb923c', align: 'left' });
      }

      /* ── 奈奎斯特平面（并排放在 s 平面右侧）：禁区圆是「保证」的几何形状 ── */
      if (state.showNyq) {
        const NR = NY_R * NY_S;
        const nx = v => NY_CX + clamp(v, -NY_R, NY_R) * NY_S, ny = v => clamp(v, -NY_R, NY_R) * NY_S;
        if (state.showGrid) planeGrid(C, 2, 0, NY_CX - NR, NY_CX + NR, NY_S, -NR, NR, NY_S, 'rgba(148,163,184,0.07)');
        axisSeg(C, [NY_CX - NR - 0.25, 0, 0], [NY_CX + NR + 0.3, 0, 0], 'Re', { dx: 0.34, dy: 0.2 });
        axisSeg(C, [NY_CX, -NR - 0.2, 0], [NY_CX, NR + 0.3, 0], 'Im', { dy: 0.24 });
        for (const k of [-2, -1, 1, 2]) tickMark(C, [NY_CX + k*NY_S, 0, 0], [0, 0.07, 0], (k < 0 ? '−' : '') + Math.abs(k), { dy: -0.22 });
        /* 禁区：以 −1 为心的单位圆。卡尔曼不等式 |1 + L| ≥ 1 说 LQR 的曲线进不来 */
        strokePoly(C, circlePts(NY_CX - NY_S, 0, NY_S, 0), { width: 1.8, color: rgba(C_CYAN, 0.55) });
        strokePoly(C, circlePts(NY_CX, 0, NY_S, 0, 48), { width: 1, dash: [4, 5], color: rgba(C_SLATE, 0.28) });
        solidDot(C, [NY_CX - NY_S, 0, 0], 3.4, rgba(C_CYAN, 0.95));
        label3(C, [NY_CX - NY_S, -0.24, 0], '−1', { font: 'italic 12px ' + FONT_MATH, color: '#2dd4ea', align: 'center' });
        const nyqPoly = list => {
          const pts = [];
          for (const p of list) {
            if (!isFinite(p[0]) || !isFinite(p[1])) { pts.push(null); continue; }
            if (Math.abs(p[0]) > NY_R || Math.abs(p[1]) > NY_R) { if (pts.length && pts[pts.length-1] !== null) pts.push(null); continue; }
            pts.push([nx(p[0]), ny(p[1]), 0]);
          }
          return pts;
        };
        /* 共轭对称：负频率那一半镜像画出来（虚线），闭合的才是完整的奈奎斯特图 */
        const mirror = list => list.map(p => [p[0], -p[1]]);
        strokePoly(C, nyqPoly(D.nyqLQR), { width: 2.4, color: rgba(C_ROSE, 0.95) });
        strokePoly(C, nyqPoly(mirror(D.nyqLQR)), { width: 1.4, dash: [5, 5], color: rgba(C_ROSE, 0.4) });
        strokePoly(C, nyqPoly(D.nyqLQG), { width: 2.4, color: rgba(C_VIOLET, 0.95) });
        strokePoly(C, nyqPoly(mirror(D.nyqLQG)), { width: 1.4, dash: [5, 5], color: rgba(C_VIOLET, 0.4) });
        /* 穿越点与相位裕度（琥珀度量注记）：从 −1 方向量到穿越点，取短弧 */
        const mkPM = (mm, fn, col, rr) => {
          if (!mm) return;
          const Lc = fn(mm.w);
          if (Math.abs(Lc[0]) > NY_R || Math.abs(Lc[1]) > NY_R) return;
          const sp = proj(C, [nx(Lc[0]), ny(Lc[1]), 0]);
          if (sp) glowDot(sp, 9, '#ffffff', rgba(col, 0.9));
          const a0 = Math.PI;
          let d = Math.atan2(Lc[1], Lc[0]) - a0;
          while (d > Math.PI) d -= TAU;
          while (d < -Math.PI) d += TAU;
          const arc = [];
          for (let i = 0; i <= 40; i++) {
            const a = a0 + d * i / 40;
            arc.push([NY_CX + rr * NY_S * Math.cos(a), rr * NY_S * Math.sin(a), 0]);
          }
          strokePoly(C, arc, { width: 1.6, color: rgba(C_AMBER, 0.85) });
          label3(C, [NY_CX + rr * NY_S * Math.cos(a0 + d/2) * 1.18, rr * NY_S * Math.sin(a0 + d/2) * 1.18 - 0.1, 0],
            fmt(mm.pm, 1) + '°', { font: 'italic 11px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        };
        mkPM(D.pmLQR, w => loopLQR(w, D.K), C_ROSE, 0.72);
        mkPM(D.pmLQG, w => loopLQG(w, D.K, D.L), C_VIOLET, 0.44);
        label3(C, [NY_CX - NR, NR + 0.6, 0],
          t({ zh: '奈奎斯特：玫红 = LQR 状态反馈，紫 = LQG（串上观测器）',
              en: 'Nyquist: rose = LQR state feedback, violet = LQG (observer in the loop)' }),
          { size: 11.5, color: 'rgba(159,176,200,.85)', align: 'left' });
        label3(C, [NY_CX - NR, NR + 0.26, 0], '|1 + L(jω)| ≥ 1  ⇒  PM ≥ 60°,  GM ∈ [0.5, ∞)',
          { font: 'italic 12px ' + FONT_MATH, color: rgba(C_CYAN, 0.9), align: 'left' });
        label3(C, [NY_CX - NR, -NR - 0.35, 0],
          t({ zh: '青圈 = 禁区（以 −1 为心的单位圆）：状态反馈永远进不去',
              en: 'cyan circle = the forbidden unit disc centred at −1: state feedback never enters it' }),
          { size: 10.5, color: rgba(C_CYAN, 0.7), align: 'left' });
      }
    },
    readout() {
      const D = sepData(), W = ensureWorld();
      const pmA = D.pmLQR, pmB = D.pmLQG;
      const ok = D.err < 1e-8;
      const poles4 = D.lqg.slice().sort((a, b) => b[0] - a[0] || b[1] - a[1]);

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 引擎不给 pushSample 传 dt，这里从 state.t 差分出来（引擎已把它钳在 [0, 0.05]）。
     state.t 倒退 = 用户按了「重置」/ R，此时整体重新播种。 */
  const dt = clamp(state.t - simClock, 0, 0.05);
  if (state.t < simClock - 1e-9) seedAll();
  simClock = state.t;
  stepWorld(dt);
  const W = WORLD;
  /* 记录「当时的真实值」：中途拖滑杆（改代价、改噪声统计）不会重算这些历史点，
     所以画面上「换了权重之后极点搬家」的那一刻是真的（规范 §4.6）。 */
  samples.push({
    t: state.t,
    /* 页①：代价对决 —— 两条 θ(t) 与各自的轮内龄期 */
    aA: W.tA, oTh: W.o.th, mTh: W.mn.th,
    /* 页②：真值 / 测量 / 纯模型预测 / 卡尔曼融合 */
    bTh: W.bTh, meas: W.meas, pTh: W.pTh, eTh: W.eTh,
    /* 页③：相平面轨迹与一呼一吸的两枚协方差 */
    cTh: W.cTh, cW: W.cW, cETh: W.cETh, cEW: W.cEW,
    cS11m: W.Sm[0][0], cS12m: W.Sm[0][1], cS22m: W.Sm[1][1],
    cS11p: W.Sp[0][0], cS12p: W.Sp[0][1], cS22p: W.Sp[1][1],
    /* 页④：LQG 闭环的真实 θ 与轮内龄期 */
    aD: W.tD, gTh: W.gTh
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ④ 演算记录与回放（可选）—— 规范 §11                        ║
   ╚══════════════════════════════════════════════════════════╝

   **本工具不声明**：四个页签演示的都是「同一组参数按下重置就重来一遍」的确定性
   过程 —— 被控对象是线性的、非混沌的，噪声只是叠加在上面的统计装饰，存档相对
   于「参数 + 种子」没有增量信息。按 §11 的适用范围，不声明即完全没有录制 UI，
   行为与体积均不受影响。 */
const RECORD = {};

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    /* 回放冻结的是「演算」，不是「观察」：相机 tween 在上面已经走过了，
       视角、开关、绘制全部照常 —— 与「暂停只冻结模拟」同一条精神（§11.7）。 */
    if (recState.mode === 'replay') {
      recStep(dt);
    } else if (state.running) {
      if (recState.mode === 'recording') {
        /* 录制时把时间量子化成整数个 REC_DT。理由（§11.2）：物理若由变长的
           帧 dt 推进，轨迹就依赖于帧率抖动，「从同一种子重算」在**本机**都对
           不上，比对曲线也就失去意义。量子化之后轨迹是种子的确定性函数，
           本机重算能贴到舍入噪声，跨机器的差别才干净地归因于超越函数实现。 */
        recState.acc += dt;
        let guard = 0;
        while (recState.acc >= REC_DT && guard++ < 64) { recState.acc -= REC_DT; simAdvance(REC_DT); recPush(); }
      } else {
        simAdvance(dt);
      }
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); refreshRecInfo(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= 场景作用域参数与时间驱动 ================= */
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）

/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();

}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
