<style>

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'conic-essence-3d',
  title: { zh: '圆锥曲线的本质 · 统一定义 / Conic Sections', en: 'The Essence of Conic Sections · One Definition' },
  h1:    { zh: '圆锥曲线的本质', en: 'The Essence of Conic Sections' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 半顶角固定 45°：cos α = √2/2 → e = cos β / cos α ∈ [0, √2]，滑杆封顶 E_MAX（留在 √2 内侧）。
   45° 还有一个关键好处：外侧丹德林球的高度比 (1+sinα)/(1−sinα) 只有 5.83（60° 时是 13.9），
   两个球才可能同时进入取景。 */
const ALPHA = Math.PI / 4;
const SIN_A = Math.sin(ALPHA), COS_A = Math.cos(ALPHA), TAN_A = Math.tan(ALPHA);
const E_MAX = 1.40;      /* 滑杆上限：必须 < 1/cos α = √2 ≈ 1.4142，否则 β 无解。滑杆直接引用此值 */

const PARAMS = [
  { key: 'e',     label: { zh: '离心率 <i>e</i>', en: 'Eccentricity <i>e</i>' },   min: 0.05, max: E_MAX, step: 0.01, value: 0.6, fmt: v => fmt(v) },
  { key: 'omega', label: { zh: '演示速度 <i>ω</i>', en: 'Demo speed <i>ω</i>' }, min: 0,    max: 3,     step: 0.05, value: 0.8, fmt: v => fmt(v) + ' rad/s' }
];

/* ── 圆锥曲线常量与场景辅助（曲线按 rose→violet→emerald→orange 启用） ── */
const Y0 = 1.6;          /* 切面过轴上的点 p₀ = (0, y₀, 0) */
const S_BASE = 3.2;      /* 圆锥沿轴绘制半长的下限 */
const S_CAP = 26;        /* 圆锥沿轴绘制半长的上限（相机 dist 上限 60 决定的取景天花板） */
const S_FIT = 24;        /* 丹德林球 |h| + R 超过此值即已跑出取景，不再绘制（读数如实声明） */
const CLIP_S_BND = 12;   /* 有界截线（椭圆）的裁剪上限：能闭合就闭合 */
const CLIP_S_UNB = 6.5;  /* 无界截线（抛物线 / 双曲线）的裁剪长度 */
const L = 1.4;           /* 半通径 l（极坐标 r = l / (1 + e·cos ν)） */
const CLIP_R_UNB = 8;    /* 页 2：无界曲线（e ≥ 1）的极坐标裁剪半径 */
const CLIP_R_CAP = 30;   /* 页 2：有界曲线（e < 1）的裁剪封顶 */
const R_VIS = 6;         /* 无界曲线上动点 P 的可见半径上限（跳过禁区与远端） */
const DIR_MAX = 9;       /* 准线太远（x = l/e > DIR_MAX）时改为文字标注 */
const H_INF = 1e-9;      /* |sin β − sin α| < H_INF ⇔ 真抛物线：第二球退到无穷远 */

const CYAN = '#2dd4ea', ROSE = '#fb7185', VIOLET = '#a78bfa', EMERALD = '#34d399', AMBER = '#fbbf24', SLATE = '#9fb0c8';
const ROSE_CORE = 'rgba(251,113,133,0.95)', ROSE_GLOW = 'rgba(251,113,133,0.13)';
const AMBER_DASH = 'rgba(251,191,36,0.55)';   /* [7,7] 投影辅助线 */

/* 视角预设 dist 的上限。引擎的 viewDist() 在窄屏/竖屏还会再乘 1.4，
   这里预先留出余量，保证最终值不越过引擎自己的 [4.5, 60] 钳制区间。 */
const distCap = () => (W < 820 || W < H) ? 42 : 58;

/* β = 平面与轴的夹角：cos β = e·cos α（e=0→90° 圆 · e=1→45°=α 抛物线 · e=√2→0°） */
const betaOf = ev => Math.acos(clamp(ev * COS_A, 0, 1));
const beta = () => Math.max(betaOf(state.e), 1e-3);   /* β=0 为退化双直线，取极限值避免 0/0 */
/* 类型判定与读数里印出的 e 必须一致：滑杆步长 0.01，e = 1.00 才是抛物线 */
const typeOf = ev => t(ev < 1 - 1e-9 ? { zh: '椭圆', en: 'Ellipse' } : (ev <= 1 + 1e-9 ? { zh: '抛物线', en: 'Parabola' } : { zh: '双曲线', en: 'Hyperbola' }));
const deg = a => (a * 180 / Math.PI).toFixed(0);
const degS = a => (a < 0 ? '−' : '') + (Math.abs(a) * 180 / Math.PI).toFixed(0);   /* 有符号角度，负号用 U+2212 */

/* ── 自适应采样：f(t) → 三维点 或 null（奇点 / 越界）；边缘二分、奇点断开 ── */
function edgePt(f, tGood, tBad) {
  let a = tGood, b = tBad, pa = f(a);
  for (let k = 0; k < 16; k++) {
    const m = 0.5 * (a + b), pm = f(m);
    if (pm) { a = m; pa = pm; } else b = m;
  }
  return pa;
}
function refinePt(f, t0, p0, t1, p1, out, depth) {
  const d = Math.hypot(p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]);
  if (d <= 0.3 || depth <= 0) { out.push(p1); return; }
  const tm = 0.5 * (t0 + t1), pm = f(tm);
  if (!pm) {                       /* 区间内含渐近线：两侧各逼近裁剪边缘后断开 */
    out.push(edgePt(f, t0, tm));
    out.push(null);
    out.push(edgePt(f, t1, tm));
    out.push(p1);
    return;
  }
  refinePt(f, t0, p0, tm, pm, out, depth - 1);
  refinePt(f, tm, pm, t1, p1, out, depth - 1);
}
function sampleCurve(f, a, b, N) {
  const out = [];
  let tp = a, pp = f(a);
  out.push(pp || null);
  for (let i = 1; i <= N; i++) {
    const t = a + (b - a) * i / N, p = f(t);
    if (pp && p) refinePt(f, tp, pp, t, p, out, 8);
    else if (pp && !p) { out.push(edgePt(f, tp, t)); out.push(null); }
    else if (!pp && p) { out.push(edgePt(f, t, tp)); out.push(p); }
    else out.push(null);
    tp = t; pp = p;
  }
  return out;
}
/* 点集包围盒（用于自动取景与标注锚点） */
function frameOf(pts, fb) {
  let n = 0;
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (const p of pts) {
    if (!p) continue;
    n++;
    for (let i = 0; i < 3; i++) { if (p[i] < mn[i]) mn[i] = p[i]; if (p[i] > mx[i]) mx[i] = p[i]; }
  }
  if (!n) {
    const c = fb.c, r = fb.rad;
    return { c: c, rad: r, mn: [c[0]-r, c[1]-r, c[2]-r], mx: [c[0]+r, c[1]+r, c[2]+r] };
  }
  return {
    c: [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2],
    rad: Math.max(0.8, 0.5 * Math.hypot(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2])),
    mn: mn, mx: mx
  };
}
/* 取景结果按 e 缓存（每帧多处取用，避免重复采样） */
const _fCache = {};
let _fKey = '';
function frameCache(id, fn) {
  const k = state.e.toFixed(4);
  if (_fKey !== k) { _fKey = k; for (const p in _fCache) delete _fCache[p]; }
  if (!_fCache[id]) _fCache[id] = fn();
  return _fCache[id];
}

/* ── 页 1/3：圆锥、切面、截线 ── */
/* 圆锥参数式 p(φ,s) = (s·tanα·cosφ, s, s·tanα·sinφ)，s∈[lo,hi] 贯穿双腔 */
/* 椭圆（β > α）时截线有界，s 的上确界 = sinβ·y₀ / (sinβ − cosβ·tanα)；其余分支无界 */
function sliceSMax() {
  const b = beta(), den = Math.sin(b) - Math.cos(b) * TAN_A;
  return den > 1e-9 ? Math.sin(b) * Y0 / den : Infinity;
}
function sliceClip() {                                               /* 有界时刚好把曲线整个包住 */
  const m = sliceSMax();
  return isFinite(m) ? Math.min(CLIP_S_BND, m * 1.04) : CLIP_S_UNB;
}
const sliceClipped = () => sliceSMax() * 1.04 > sliceClip();        /* true → 曲线被截断，读数须声明 */

function slicePt(phi, cl) {
  const b = beta(), sb = Math.sin(b), cb = Math.cos(b);
  const den = sb + cb * TAN_A * Math.sin(phi);           /* = 0 → 双曲线的渐近方向 */
  if (Math.abs(den) < 1e-7) return null;
  const s = sb * Y0 / den;
  if (!isFinite(s) || Math.abs(s) > cl) return null;
  return [s * TAN_A * Math.cos(phi), s, s * TAN_A * Math.sin(phi)];
}
function slicePts() {
  const cl = sliceClip();
  return sampleCurve(phi => slicePt(phi, cl), 0, TAU, 240);
}
const sliceFrame = () => frameCache('slice', () => frameOf(slicePts(), { c: [0, Y0, 0], rad: 2.2 }));

/* 切面基：法向 n = (0, sinβ, cosβ)，面内正交基 u₁ = x̂、u₂ = (0, cosβ, −sinβ) */
function planeU2() { const b = beta(); return [0, Math.cos(b), -Math.sin(b)]; }
/* 切面半宽：由截线在"面内"的真实跨度决定——切面必须完整包住截线，又不该白白撑大取景 */
const planeHalf = () => frameCache('pw', () => {
  const u2 = planeU2();
  let m = 3.4;
  for (const p of slicePts()) {
    if (!p) continue;
    m = Math.max(m, Math.abs(p[0]), Math.abs((p[1] - Y0) * u2[1] + p[2] * u2[2]));
  }
  return clamp(m * 1.12 + 0.5, 4.6, 12);
});

/* ── 页 3：丹德林双球 ── */
/* 球心 (0,h,0)、半径 R = |h|·sinα（内切于圆锥）；与切面相切给出 h = sinβ·y₀ / (sinβ ∓ sinα） */
function dandelin() {
  const b = beta(), sb = Math.sin(b), cb = Math.cos(b);
  const mk = h => {
    const R = Math.abs(h) * SIN_A;
    const d = sb * (h - Y0);                          /* 球心到切面的有符号距离（|d| = R） */
    return { h: h, R: R, F: [0, h - d * sb, -d * cb], yt: h * COS_A * COS_A, rt: Math.abs(h) * COS_A * SIN_A };
  };
  const hA = sb * Y0 / (sb + SIN_A);                  /* 恒存在：切面与顶点之间的小球 */
  const dB = sb - SIN_A;                              /* β = α（真抛物线）时 = 0，第二球退到无穷远 */
  return [mk(hA), Math.abs(dB) > H_INF ? mk(sb * Y0 / dB) : null];
}
/* 球是否还在取景框里（e → 1 时外球真的会跑掉，这不是裁剪，是几何本身） */
const sphFits = S => !!S && Math.abs(S.h) + S.R <= S_FIT;

/* 圆锥沿轴的绘制范围：必须容得下截线；页 3 还要容得下能进入取景的丹德林球 */
function coneRange(withSpheres) {
  const f = sliceFrame();
  let lo = Math.min(-S_BASE, f.mn[1] - 0.6), hi = Math.max(S_BASE, f.mx[1] + 0.6);
  if (withSpheres) {
    for (const S of dandelin()) {
      if (!sphFits(S)) continue;
      hi = Math.max(hi, S.h + S.R + 0.8);
      lo = Math.min(lo, S.h - S.R - 0.8);
    }
  }
  return [clamp(lo, -S_CAP, -1.2), clamp(hi, 1.2, S_CAP)];
}

/* 自动取景：截线 + 切面 + 顶点（页 3 再并入两个球）——圆锥本身允许溢出画面，那是圆锥该有的样子 */
function sceneFrame(withSpheres) {
  return frameCache(withSpheres ? 'dand' : 'cone', () => {
    const pts = [[0, 0, 0]], u2 = planeU2(), PW = planeHalf();
    for (const sg of [[1, 1], [1, -1], [-1, -1], [-1, 1]]) {
      pts.push([sg[0] * PW, Y0 + sg[1] * PW * u2[1], sg[1] * PW * u2[2]]);
    }
    for (const p of slicePts()) if (p) pts.push(p);
    if (withSpheres) {
      for (const S of dandelin()) {
        if (!sphFits(S)) continue;
        pts.push([0, S.h - S.R, 0], [0, S.h + S.R, 0],
                 [S.R, S.h, 0], [-S.R, S.h, 0], [0, S.h, S.R], [0, S.h, -S.R]);
      }
    }
    return frameOf(pts, { c: [0, Y0, 0], rad: 3.2 });
  });
}

/* 参数变化时保持预设视角的取景（用户一旦手动拖拽，lastView = null，本函数不再干预） */
function holdView() {
  const name = lastView[curTab];
  if (tween || !name) return;
  const v = SCENES[curTab].views[name];
  cam.az = v.az; cam.el = v.el; cam.dist = viewDist(v.dist);
  cam.tx = v.tx || 0; cam.ty = v.ty || 0; cam.tz = v.tz || 0;
}

function fillQuad(C, q, color) {
  const s = [];
  for (const p of q) { const t = proj(C, p); if (!t) return; s.push(t); }
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s[0][0], s[0][1]);
  for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* 近侧视时圆锥必须"塌成一个 V"：只留下两条轮廓母线，纬圆全部让路（顿悟视角，原则 5） */
const edgeOn = () => Math.abs(cam.el) < 0.15;

function drawCone(C, rg) {
  const lo = rg[0], hi = rg[1], eo = edgeOn();
  const gen = (a, w, col) => line3(C,
    [lo * TAN_A * Math.cos(a), lo, lo * TAN_A * Math.sin(a)],
    [hi * TAN_A * Math.cos(a), hi, hi * TAN_A * Math.sin(a)],
    { width: w, color: col });
  if (eo) {
    for (let i = 0; i < 6; i++) gen(i / 6 * TAU, 1, 'rgba(45,212,234,0.10)');
    for (const a of [-cam.az, Math.PI - cam.az]) gen(a, 1.6, 'rgba(45,212,234,0.55)');  /* 轮廓母线 = V */
  } else {
    for (let i = 0; i < 24; i++) gen(i / 24 * TAU, 1, 'rgba(45,212,234,0.20)');
    for (let k = -3; k <= 3; k++) {                    /* 6 圈纬圆（侧视时不画） */
      if (k === 0) continue;
      const sv = (k > 0 ? hi : -lo) * Math.abs(k) / 3 * Math.sign(k);
      const rr = Math.abs(sv) * TAN_A, pts = [];
      for (let i = 0; i <= 64; i++) { const a = i / 64 * TAU; pts.push([rr * Math.cos(a), sv, rr * Math.sin(a)]); }
      strokePoly(C, pts, { width: 1.2, color: 'rgba(45,212,234,0.30)' });
    }
  }
  solidDot(C, [0, 0, 0], 2.6, 'rgba(45,212,234,0.9)');
}

/* 圆锥场景专用坐标轴（y = 圆锥轴） */
function coneAxes(C, rg) {
  const ey = rg[1] + 0.9, ax = Math.max(3.4, rg[1] * 0.5);
  line3(C, [0, rg[0] - 0.6, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.35, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, 0, 0], [ax, 0, 0], { width: 1.1, color: AXIS_DIM });
  label3(C, [ax + 0.3, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, 0, 0], [0, 0, ax], { width: 1.1, color: AXIS_DIM });
  label3(C, [0, 0, ax + 0.35], 'z', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
}

function drawPlane(C) {
  const u2 = planeU2(), PW = planeHalf();
  const q = [];
  for (const sg of [[1, 1], [1, -1], [-1, -1], [-1, 1]]) {
    q.push([sg[0] * PW, Y0 + sg[1] * PW * u2[1], sg[1] * PW * u2[2]]);
  }
  fillQuad(C, q, 'rgba(159,176,200,0.07)');
  strokePoly(C, [q[0], q[1], q[2], q[3], q[0]], { width: 1.2, color: 'rgba(159,176,200,0.5)' });
  solidDot(C, [0, Y0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* α（顶点处，母线与轴）· β（p₀ 处，切面与轴）· 一条与母线平行的青色参考虚线供直接比较 */
function drawAngles(C) {
  const b = beta(), ar = clamp(sceneFrame(false).rad * 0.16, 1.15, 3.2);
  const ap = [];
  for (let i = 0; i <= 24; i++) { const u = ALPHA * i / 24; ap.push([0, ar * Math.cos(u), ar * Math.sin(u)]); }
  strokePoly(C, ap, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [0, (ar + 0.35) * Math.cos(ALPHA / 2), (ar + 0.35) * Math.sin(ALPHA / 2)], 'α = 45°',
    { font: 'italic 13px ' + FONT_MATH, color: AMBER, align: 'center' });

  const LG = ar * 2.7;                               /* 过 p₀ 且平行于母线的参考虚线（[5,6] 参考） */
  line3(C, [0, Y0 - LG * COS_A, LG * SIN_A], [0, Y0 + LG * COS_A, -LG * SIN_A],
    { width: 1, dash: [5, 6], color: 'rgba(45,212,234,0.5)' });
  label3(C, [0, Y0 + (LG + 0.4) * COS_A, -(LG + 0.4) * SIN_A], t({ zh: '∥ 母线', en: '∥ generator' }),
    { size: 11, color: 'rgba(45,212,234,0.8)', align: 'center' });

  const bp = [];
  for (let i = 0; i <= 32; i++) { const u = b * i / 32; bp.push([0, Y0 + ar * Math.cos(u), -ar * Math.sin(u)]); }
  strokePoly(C, bp, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [0, Y0 + (ar + 0.35) * Math.cos(b / 2), -(ar + 0.35) * Math.sin(b / 2)], 'β = ' + deg(b) + '°',
    { font: 'italic 13px ' + FONT_MATH, color: AMBER, align: 'center' });
}

/* 类型 / 公式标注：锚在截线包围盒的正上方，永远跟着曲线走（不会钻到右侧面板底下） */
function typeLabel(C) {
  const f = sliceFrame(), y = f.mx[1] + 0.75, z = f.c[2];
  label3(C, [0, y + 0.55, z], typeOf(state.e), { size: 13, color: ROSE, align: 'center' });
  label3(C, [0, y, z], 'e = cos β / cos α = ' + fmt(state.e),
    { font: 'italic 13px ' + FONT_MATH, color: 'rgba(251,113,133,0.85)', align: 'center' });
}

function drawSlice(C) {
  const pts = slicePts();
  strokePoly(C, pts, { width: 5.5, color: ROSE_GLOW });
  strokePoly(C, pts, { width: 2.2, color: ROSE_CORE });
}

const inRange = (p, rg) => p[1] >= rg[0] && p[1] <= rg[1];

function drawSphere(C, S, rg) {
  const col = 'rgba(226,232,240,0.28)';
  const yLo = Math.max(S.h - S.R, rg[0]), yHi = Math.min(S.h + S.R, rg[1]);
  if (yLo < yHi) {
    for (let k = 0; k <= 7; k++) {                    /* 纬圆（垂直于轴） */
      const y = yLo + (yHi - yLo) * k / 7;
      const rr = Math.sqrt(Math.max(0, S.R * S.R - (y - S.h) * (y - S.h)));
      if (rr < 0.02) continue;
      const pts = [];
      for (let i = 0; i <= 72; i++) {
        const a = i / 72 * TAU;
        pts.push([rr * Math.cos(a), y, rr * Math.sin(a)]);
      }
      strokePoly(C, pts, { width: 1, color: col });
    }
  }
  for (let m = 0; m < 2; m++) {                       /* 两条经圆 */
    const pts = [];
    for (let i = 0; i <= 96; i++) {
      const u = i / 96 * TAU, y = S.h + S.R * Math.cos(u), rr = S.R * Math.sin(u);
      const p = m === 0 ? [rr, y, 0] : [0, y, rr];
      pts.push(inRange(p, rg) ? p : null);
    }
    strokePoly(C, pts, { width: 1, color: col });
  }
}

function drawTangRing(C, S, rg) {                     /* 球与圆锥的切触圆（琥珀度量注记，[5,6] 参考虚线） */
  const pts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU, p = [S.rt * Math.cos(a), S.yt, S.rt * Math.sin(a)];
    pts.push(inRange(p, rg) ? p : null);
  }
  strokePoly(C, pts, { width: 1, dash: [5, 6], color: 'rgba(251,191,36,0.55)' });
}

/* ── 页 2：焦点—准线 ── */
/* 极坐标裁剪半径：e < 1 按真实远地点闭合（椭圆必须画成闭合曲线）；e ≥ 1 才用固定裁剪 */
function polarClip() {
  const e = state.e;
  if (e >= 1 - 1e-9) return CLIP_R_UNB;
  return Math.min(CLIP_R_CAP, 1.15 * L / (1 - e));
}
const polarClipped = () => state.e < 1 - 1e-9 && L / (1 - state.e) > polarClip();

function polarPt(th, cl) {
  const e = state.e, den = 1 + e * Math.cos(th);
  if (Math.abs(den) < 1e-7) return null;
  const r = L / den;                                  /* r<0 即另一支（同一焦点与准线，比值仍为 e） */
  if (!isFinite(r) || Math.abs(r) > cl) return null;
  return [r * Math.cos(th), r * Math.sin(th), 0];
}
function polarPts() {
  const cl = polarClip();
  return sampleCurve(th => polarPt(th, cl), 0, TAU, 240);
}
/* 页 2 取景：曲线包围盒并入准线（scene helper，与其它取景函数放在一起） */
const polarFrame = () => frameCache('polar', () => {
  const pts = polarPts().slice();
  const xd = L / state.e;
  if (xd <= DIR_MAX) pts.push([xd, 0, 0]);
  return frameOf(pts, { c: [0, 0, 0], rad: 2.2 });
});

/* 动点 P 的极角 ν（真近点角）与分支序号 k。
   有界时整圈扫掠（k 恒为 0，轨迹连续）；无界时只扫 |r| ≤ R_VIS 的可见弧段，
   ν 从 +ν_e 跳回 −ν_e 是一次真实的"换支"——k 随之 +1，彗尾在此处必须断开。 */
/* m = 扫掠模式（0 = 整圈闭合 · 1 = 受限往复）。模式与分支序号 k 一起构成"这一枚样本属于哪条轨迹"的身份：
   e 越过 ≈0.9533 时模式翻转，ν 会从 mod2pi(t) 跳到 t−te（跳幅可达 π），而此时 k 可能仍是 0——
   只看 k 会漏掉这次瞬移，彗尾便跨着禁区连出一条直线。故 m 必须一并记录。 */
function pSweep(t) {
  const e = state.e, rv = e < 1 - 1e-9 ? polarClip() : R_VIS;
  const cmin = (L / rv - 1) / e;
  if (cmin <= -1) return { nu: mod2pi(t), k: 0, m: 0 };
  const te = Math.acos(clamp(cmin, -1, 1)), span = 2 * te;
  const k = Math.floor(t / span);
  return { nu: t - k * span - te, k: k, m: 1 };
}

/* ν 角弧（琥珀度量注记）。ν 本身已在正确区间：闭合时 ∈ [0, 2π)，无界时 ∈ [−νe, νe]，
   所以直接按 ν 的符号扫弧——负角走顺时针的短弧，绝不绕远路画成一个圈。 */
function drawNuArc(C, nu, sc) {
  if (Math.abs(nu) <= 0.04) return;
  const r0 = clamp(sc * 0.1, 0.22, 0.9);
  const n = Math.max(2, Math.ceil(Math.abs(nu) / 0.06));
  const ap = [];
  for (let j = 0; j <= n; j++) { const a = nu * j / n; ap.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]); }
  strokePoly(C, ap, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.22) * Math.cos(nu / 2), (r0 + 0.22) * Math.sin(nu / 2), 0], 'ν',
    { font: 'italic 13px ' + FONT_MATH, color: AMBER, align: 'center' });
}

/* 坐标轴刻度：随取景自动稀疏 */
function ticksTo(m) {
  const st = m > 10 ? 4 : (m > 5 ? 2 : 1), out = [];
  for (let k = st; k <= m - 0.4; k += st) out.push(k);
  return out;
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── 页 1：圆锥截面 ────── */
  cone: {
    label: { zh: '圆锥截面', en: 'Conic section' },
    params: ['e'],
    brand: { zh: '一把刀切一个圆锥：刀面与轴的夹角 β 大于半顶角 α = 45° 时切出椭圆，等于 α 时切出抛物线，小于 α 时切出双曲线。拖动 e，同一把刀连续地改变姿态。',
             en: 'Slice a cone with a plane: when the angle β between the plane and the axis is greater than the half-angle α = 45°, the cut is an ellipse; equal to α, a parabola; less than α, a hyperbola. Drag e and watch the same blade tilt continuously.' },
    tips: { zh: '提示：按「侧视 β∠α」（键 2）——圆锥塌成一个 V，切面塌成一条线，于是 β 与 α 可以直接目测比较。切面与青色虚线（∥ 母线）重合的那一刻，正是抛物线 e = 1。',
            en: 'Tip: press "Side β∠α" (key 2) — the cone collapses into a V and the plane collapses into a line, so β and α can be compared by eye directly. The instant the plane lines up with the cyan dashed line (∥ generator) is exactly the parabola, e = 1.' },
    views: {
      iso: {
        label: { zh: '立体', en: '3D' }, az: -0.7, el: 0.28,
        get dist() { return clamp(sceneFrame(false).rad * 2.5, 8, distCap()); },
        get tx() { return 0; },
        get ty() { return sceneFrame(false).c[1]; },
        get tz() { return 0; }
      },
      side: {
        label: { zh: '侧视 β∠α', en: 'Side β∠α' }, az: -Math.PI / 2, el: 0.02,
        get dist() { return clamp(sceneFrame(false).rad * 2.4, 8, distCap()); },
        get tx() { return 0; },
        get ty() { return sceneFrame(false).c[1]; },
        get tz() { return 0; }
      },
      face: {
        label: { zh: '正对切面', en: 'Face the plane' },
        az: 0.001,
        get el() { return beta(); },
        get dist() { return clamp(sliceFrame().rad * 2.7, 7, 40); },
        get tx() { return 0; },
        get ty() { return sliceFrame().c[1]; },
        get tz() { return clamp(sliceFrame().c[2], -3, 11); }
      }
    },
    toggles: [
      { key: 'showCurve', label: { zh: '截线', en: 'Section curve' },       color: ROSE, checked: true },
      { key: 'showPlane', label: { zh: '切面', en: 'Cutting plane' },       color: SLATE, checked: true },
      { key: 'showArcs',  label: { zh: '角度 α·β', en: 'Angles α·β' },   color: AMBER, checked: true },
      { key: 'showProj',  label: { zh: '投影辅助线', en: 'Projection guides' }, color: AMBER, checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' },       color: '#64748b', checked: false }
    ],
    sampleWindow: () => 2.2,
    draw(C) {
      holdView();
      const rg = coneRange(false);
      if (state.showGrid) drawGridXY(C, 3, 1);
      coneAxes(C, rg);
      drawCone(C, rg);
      if (state.showPlane) drawPlane(C);
      if (state.showCurve) drawSlice(C);
      if (state.showArcs) drawAngles(C);
      if (state.showProj) {                       /* 截线两个顶点 → 圆锥轴（[7,7] 琥珀投影虚线） */
        for (const ph of [Math.PI / 2, -Math.PI / 2]) {
          const p = slicePt(ph, sliceClip());
          if (p) line3(C, p, [0, p[1], 0], { width: 1.5, dash: [7, 7], color: AMBER_DASH });
        }
      }
      typeLabel(C);
    },
    readout() {
      const e = state.e, b = beta();
      return readoutHead() +
        '<div class="cnC">' + t({ zh: '截面类型', en: 'Section type' }) + ' <b>' + typeOf(e) + '</b>&ensp;e = <b>' + fmt(e) + '</b></div>' +

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  const p = pSweep(state.theta);                   /* 动点 P 当时的真实极角 ν、分支序号 k 与扫掠模式 m */
  const r = L / (1 + state.e * Math.cos(p.nu));    /* 当时的真实焦半径 */
  samples.push({
    t: state.t,
    px: r * Math.cos(p.nu),
    py: r * Math.sin(p.nu),
    k: p.k,                                        /* (k, m) 变化 = 换支或换模式（真实的瞬移），彗尾在此断开 */
    m: p.m
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');

      });

/* ================= 视角与页签 ================= */
function refreshViewButtons() {

    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);

}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd()
     （语言切换 / 用户拖动都会触发）读的是吸附后的 input.value，会把这点
     差值永久写回 state —— 暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
