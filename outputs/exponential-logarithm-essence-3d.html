  指数把相等的输入步长变成相等的倍数变化；对数反过来回答"需要经历
  多少次倍增"——它不是孤立运算，而是指数映射的逆。四个场景：
  指数增长（bˣ 与线性对照，等步等倍） · 互为逆运算（bˣ 与 log_b x
  关于 y = x 镜像，联动点交换坐标） · 乘法变加法（正数轴抬升到对数
  轴，乘法缩放变成平移，log(xy) = log x + log y） · 倍增与半衰
  （y = y₀e^(kt)，倍增时间与半衰期 ln2/|k|）。

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'exponential-logarithm-essence-3d',
  title: { zh: '指数与对数的本质 · The Essence of Exponentials & Logarithms', en: 'The Essence of Exponentials & Logarithms' },
  h1:    { zh: '指数与对数的本质', en: 'Exponentials & Logarithms' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'b',     label: { zh: '底数 <i>b</i> = 2<sup><i>s</i></sup>', en: 'Base <i>b</i> = 2<sup><i>s</i></sup>' },
    min: -1.6, max: 2, step: 0.05, value: 1, fmt: v => 'b = ' + fmt(bMap(v)), map: v => bMap(v) },
  { key: 'px',    label: { zh: '探针 <i>x</i>₀', en: 'Probe <i>x</i>₀' },
    min: -2, max: 3, step: 0.01, value: 1, fmt: v => fmtS(v) },
  { key: 'mx',    label: { zh: '因数 <i>x</i>', en: 'Factor <i>x</i>' },
    min: -0.5, max: 1.48, step: 0.01, value: 0.3, fmt: v => fmt(Math.pow(10, v)), map: v => Math.pow(10, v) },
  { key: 'my',    label: { zh: '因数 <i>y</i>', en: 'Factor <i>y</i>' },
    min: -0.5, max: 1.48, step: 0.01, value: 0.7, fmt: v => fmt(Math.pow(10, v)), map: v => Math.pow(10, v) },
  { key: 'y0',    label: { zh: '初始量 <i>y</i>₀', en: 'Initial amount <i>y</i>₀' },
    min: 0.3, max: 2, step: 0.01, value: 1, fmt: v => fmt(v) },
  { key: 'k',     label: { zh: '连续增长率 <i>k</i>', en: 'Growth rate <i>k</i>' },
    min: -1.2, max: 1.2, step: 0.01, value: 0.45, fmt: v => fmtS(v) + ' /s' },
  { key: 'speed', label: { zh: '波形展开速度', en: 'Wave unroll speed' },
    min: 0.4, max: 2.5, step: 0.05, value: 1, fmt: v => fmt(v) + t({ zh: ' 单位/s', en: ' units/s' }) },
  /* ω 仅维持引擎时钟 θ 的积分（θ += ω·dt），本工具不直接使用，永不显示 */
  { key: 'omega', label: { zh: '角速度 <i>ω</i>', en: 'Angular speed <i>ω</i>' },
    min: 0.2, max: 2, step: 0.05, value: 1, fmt: v => fmt(v) + ' rad/s' }
];

/* ── 指数与对数：场景级常量与小部件（均在 SCENES 之上，引擎零改动） ──
   颜色语义：rose = 第一主曲线（bˣ / 联动点 P / log x 段 / 数值流 y(t)）
             violet = 第二曲线（线性对照 / log_b x / log y 段 / 倍增参考级）
             emerald = 第三曲线（乘积 xy）· cyan = 源几何（镜面 y=x / 双轨映射扇）
             amber = 度量注记（Δx=1 / ×b / log(xy) / 倍增标尺） */
const E = Math.E, LN2 = Math.log(2), LN10 = Math.log(10);
const C_ROSE = '#fb7185', C_VIO = '#a78bfa', C_EME = '#34d399', C_CYN = '#2dd4ea', C_AMB = '#fbbf24';
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')';
/* 底数滑杆映射：b = 2^s，|s| < 0.2 时推离 0，保证 b 永不等于 1 */
const bMap = v => Math.pow(2, Math.abs(v) < 0.2 ? (v < 0 ? -0.2 : 0.2) : v);
/* 上标数字（科学计数法 a×10ⁿ 用） */
const SUPS = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
const supInt = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(d => SUPS[+d]).join('');
const fmtSci = v => {
  if (v >= 100) { const n = Math.floor(Math.log(v) / LN10); return fmt(v / Math.pow(10, n)) + '×10' + supInt(n); }
  return fmt(v);
};
/* 通用裁剪采样：y 超出 [ymin, ymax] 时精确触边并以 null 断开（单调与否皆可） */
function curvePts(f, x0, x1, dx, ymin, ymax, z) {
  z = z || 0;
  const pts = [];
  let px = null, py = null;
  for (let x = x0; x <= x1 + 1e-9; x += dx) {
    const y = f(x);
    const inN = y >= ymin && y <= ymax;
    const pIn = py !== null && py >= ymin && py <= ymax;
    if (inN) {
      if (py !== null && !pIn) {
        const yb = py > ymax ? ymax : ymin;
        pts.push([px + (yb - py) * (x - px) / (y - py), yb, z]);
      }
      pts.push([x, y, z]);
    } else if (pIn) {
      const yb = y > ymax ? ymax : ymin;
      pts.push([px + (yb - py) * (x - px) / (y - py), yb, z]);
      pts.push(null);
    }
    px = x; py = y;
  }
  return pts;
}
/* 通用第一象限风格坐标轴（区间与刻度可配；tk = {v, lab, c}） */
function axes2(C, o) {
  line3(C, [o.x0, 0, 0], [o.x1, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [o.x1, 0, 0], [o.x1 - 0.2, 0, 0], AXIS);
  if (o.xlab !== '') label3(C, [o.x1 + 0.25, 0, 0], o.xlab || 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, o.y0, 0], [0, o.y1, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, o.y1, 0], [0, o.y1 - 0.2, 0], AXIS);
  label3(C, [0, o.y1 + 0.2, 0], o.ylab || 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  (o.xticks || []).forEach(tk => {
    line3(C, [tk.v, -0.05, 0], [tk.v, 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [tk.v, -0.24, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'center' }
      : { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  });
  (o.yticks || []).forEach(tk => {
    line3(C, [-0.05, tk.v, 0], [0.05, tk.v, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.14, tk.v, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'right' }
      : { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1, every = v < 0.8 ? 2 : 1;
    for (let k = 1; k * v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k * v], [0, 0.06, k * v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) label3(C, [0, -0.25, k * v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}
/* 矩形区域网格（z=0 平面） */
function gridRect(C, x0, x1, y0, y1, st) {
  for (let x = Math.ceil(x0 / st) * st; x <= x1 + 1e-9; x += st) {
    line3(C, [x, y0, 0], [x, y1, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
  for (let y = Math.ceil(y0 / st) * st; y <= y1 + 1e-9; y += st) {
    line3(C, [x0, y, 0], [x1, y, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}
/* 琥珀比例 / 区间括尺（竖向） */
function ratioBracket(C, bx, y1, y2, lab) {

      }

      /* 因数 x（玫红）与因数 y（紫）：双轨对应点 + 虚线映射 */
      const railPt = (u, col, lab, r) => {
        if (u <= 10) {
          line3(C, [LINP(u), 0, 0], [LPOS(u), YLOG, 0], { width: 1.5, dash: [7, 7], color: hexA(col, 0.55) });
          const sl = proj(C, [LINP(u), 0, 0]);
          if (sl) glowDot(sl, r, '#ffffff', hexA(col, 0.85));
          label3(C, [LINP(u), -0.42, 0], lab, { font: 'italic 12px ' + FONT_MATH, color: col, align: 'center' });
        }
        const sg = proj(C, [LPOS(u), YLOG, 0]);
        if (sg) glowDot(sg, r, '#ffffff', hexA(col, 0.85));
      };
      if (state.showXn) railPt(x, C_ROSE, 'x', 8);
      if (state.showYn) railPt(y, C_VIO, 'y', 8);

      /* 乘积 xy（翠绿）：线性轨上可能出界，对数轨上永远在场 */
      if (state.showProd) {
        if (pr <= 10) {
          const sl = proj(C, [LINP(pr), 0, 0]);
          if (sl) glowDot(sl, 9, '#ffffff', hexA(C_EME, 0.9));
          label3(C, [LINP(pr), -0.62, 0], 'xy', { font: 'italic 12px ' + FONT_MATH, color: C_EME, align: 'center' });
        } else {
          line3(C, [6.0, -0.55, 0], [6.32, -0.55, 0], { width: 1.6, color: hexA(C_EME, 0.9) });
          arrowAt(C, [6.32, -0.55, 0], [6.1, -0.55, 0], hexA(C_EME, 0.9));
          label3(C, [5.9, -0.55, 0], 'xy = ' + fmtSci(pr) + ' ' + t({ zh: '超出线性刻度', en: 'off the linear scale' }),
            { size: 10.5, color: C_EME, align: 'right' });
        }
        const sg = proj(C, [LPOS(pr), YLOG, 0]);
        if (sg) glowDot(sg, 10, '#ffffff', hexA(C_EME, 0.95));
        label3(C, [LPOS(pr), YLOG - 0.45, 0], 'xy', { font: 'italic 12px ' + FONT_MATH, color: C_EME, align: 'center' });
      }

      /* 对数轨上方的加法段：log x（玫红）+ log y（紫）= log(xy) */
      if (state.showXn || state.showYn || state.showProd) {
        const hb = YLOG + 0.34, a0 = LPOS(1), a1 = LPOS(x), a2 = LPOS(pr);
        if (state.showXn) {
          line3(C, [a0, hb, 0], [a1, hb, 0], { width: 3, color: hexA(C_ROSE, 0.9) });
          line3(C, [a0, hb - 0.05, 0], [a0, hb + 0.05, 0], { width: 1.2, color: hexA(C_ROSE, 0.9) });
          if (Math.abs(a1 - a0) > 0.5) label3(C, [(a0 + a1) / 2, hb + 0.17, 0], 'log x', { font: 'italic 11px ' + FONT_MATH, color: C_ROSE, align: 'center' });
        }
        if (state.showYn) {
          line3(C, [a1, hb, 0], [a2, hb, 0], { width: 3, color: hexA(C_VIO, 0.9) });
          line3(C, [a1, hb - 0.05, 0], [a1, hb + 0.05, 0], { width: 1.2, color: hexA(C_VIO, 0.9) });
          if (Math.abs(a2 - a1) > 0.5) label3(C, [(a1 + a2) / 2, hb + 0.17, 0], 'log y', { font: 'italic 11px ' + FONT_MATH, color: C_VIO, align: 'center' });
        }
        if (state.showProd) {
          line3(C, [a2, hb, 0], [a2, YLOG, 0], { width: 1.2, dash: [4, 5], color: 'rgba(251,191,36,0.7)' });
          label3(C, [clamp(a2, 1.2, 5.6), hb + 0.44, 0], 'log(xy) = log x + log y',
            { font: 'italic 13px ' + FONT_MATH, color: C_AMB, align: 'center' });
        }
      }
    },
    readout() {
      const x = state.mx, y = state.my, pr = x * y;
      return '<div>x = <b>' + fmt(x) + '</b>&ensp;·&ensp;y = <b>' + fmt(y) + '</b></div>' +
        '<div class="tanC">xy = <b>' + fmtSci(pr) + '</b></div>' +
        '<div><span class="sinC">log₁₀x = <b>' + fmtS(LG(x), 3) + '</b></span>&ensp;<span class="cosC">log₁₀y = <b>' + fmtS(LG(y), 3) + '</b></span></div>' +
        '<div class="ambC">log₁₀x + log₁₀y = <b>' + fmtS(LG(pr), 3) + '</b> = log₁₀(xy)</div>' +
        '<div class="dim">' + t({ zh: '数量级 xy ≈ 10', en: 'order of magnitude xy ≈ 10' }) + supInt(Math.round(LG(pr))) + '&ensp;·&ensp;x > 0, y > 0</div>';
    }
  },

  /* ────── ④ 倍增与半衰：y = y₀e^(kt) 沿时间轴流出 ────── */
  decay: {
    label: { zh: '倍增与半衰', en: 'Doubling & half-life' },
    params: ['y0', 'k', 'speed'],
    brand: { zh: '连续变化 y = y₀e^(kt)：变化率始终正比于当前量。k > 0 是增长、k < 0 是衰减，历史数值沿时间轴流出。拖动 k 穿过 0，看增长翻转成衰减。',
             en: 'Continuous change y = y₀e^(kt): the rate is always proportional to the current amount. k > 0 grows, k < 0 decays, and the history streams out along the time axis. Drag k through 0 to flip growth into decay.' },
    tips: { zh: '按 2 侧视 y·t：琥珀标尺量出 ln2/|k|——无论当前量是多少，再过这么久必翻倍（k > 0）或减半（k < 0），紫色参考级 y₀·2ⁿ 因而等距成层。这是「指数增长」页等步等倍的连续版本；e 本身的来历见工具「e 的本质」。',
            en: 'Press 2 for the side y·t view: the amber ruler marks ln2/|k| — whatever the current amount, after that long it has doubled (k > 0) or halved (k < 0), which is why the violet reference levels y₀·2ⁿ form equally spaced layers. This is the continuous version of the Growth tab; for where e itself comes from, see "The Essence of e".' },
    views: {
      iso:  { label: { zh: '立体',     en: '3D' },       az: -0.95,      el: 0.3,   dist: 11,   tx: 0, ty: 0.9, tz: 2.8 },
      side: { label: { zh: '侧视 y·t', en: 'Side y·t' }, az: -Math.PI/2, el: 0.001, dist: 10.5, tx: 0, ty: 1.1, tz: 3.4 }
    },
    toggles: [
      { key: 'showVal',    label: { zh: '数值流 y(t)',      en: 'Value stream y(t)' },  color: '#fb7185', checked: true },
      { key: 'showLevels', label: { zh: '倍增参考级 y₀·2ⁿ', en: 'Doubling levels y₀·2ⁿ' }, color: '#a78bfa', checked: true },
      { key: 'showT2',     label: { zh: '倍增 / 半衰标尺',  en: 'Doubling / half-life ruler' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格',             en: 'Grid' },               color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.speed + 0.5,
    draw(C) {
      const v = state.speed, k = state.k;
      if (state.showGrid) drawTimeGrid(C, { yMax: 2.5, v: v });
      axes2(C, {
        x0: -0.45, x1: 0.55, y0: -0.35, y1: 2.85, xlab: '',
        yticks: [{ v: YS4, lab: '1' }, { v: 2 * YS4, lab: '2' }, { v: 4 * YS4, lab: '4' }],
        tAxis: true, v: v
      });

      /* 倍增参考级（紫，虚线）：y₀·2ⁿ 在对数意义下等距成层 */
      if (state.showLevels) {
        for (let m = -3; m <= 2; m++) {
          const Lv = state.y0 * Math.pow(2, m);
          if (Lv < 0.12 || Lv > DK_YMAX) continue;
          line3(C, [0, Lv * YS4, 0], [0, Lv * YS4, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(167,139,250,0.30)' });
          const lab = m === 0 ? 'y₀' : (m > 0 ? Math.pow(2, m) + 'y₀' : 'y₀/' + Math.pow(2, -m));
          label3(C, [0.14, Lv * YS4, 0], lab, { font: 'italic 11px ' + FONT_MATH, color: 'rgba(167,139,250,0.75)', align: 'left' });
        }
      }

      /* 历史数值流（玫红，头亮尾隐；重新释放处以 null 断开） */
      if (state.showVal && samples.length > 1) {
        const pts = [];
        let pg = null;
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i], z = (state.t - s.t) * v;
          if (z > WAVE_LEN) break;
          if (pg !== null && s.dg !== pg) pts.push(null);
          pts.push([0, s.dy * YS4, z]);
          pg = s.dg;
        }
        strokePoly(C, pts, { width: 5.5, color: hexA(C_ROSE, 0.14) });
        strokePoly(C, pts, { width: 2.2, fade: ['rgba(251,113,133,1)', 'rgba(251,113,133,0.04)'] });
      }

      /* 当前量：白色量杆 + 主光点 + 公式 */
      const h = decayY * YS4;
      line3(C, [0, 0, 0], [0, h, 0], { width: 2, color: 'rgba(241,245,249,0.92)' });
      const sp = proj(C, [0, h, 0]);
      if (sp) glowDot(sp, 15, '#ffffff', 'rgba(186,240,255,0.9)');
      label3(C, [0.16, Math.min(h + 0.28, 2.75), 0], 'y = y₀·e^(kt)', { font: 'italic 13px ' + FONT_MATH, color: C_ROSE, align: 'left' });

      /* 倍增 / 半衰标尺（琥珀）：固定时长 ln2/|k| */
      if (state.showT2 && Math.abs(k) > 0.02) {
        const T2 = LN2 / Math.abs(k);
        drawPeriodBracket(C, T2, v, 0, -0.28,
          (k > 0 ? '×2' : '×½') + ' · ln2/|k| = ' + fmt(T2) + ' s');
      }
    },
    readout() {
      const k = state.k, big = Math.abs(k) > 0.02;
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;k = ' + fmtS(k) + ' /s</div>' +
        '<div class="sinC">y(t) = <b>' + fmt(decayY, 3) + '</b></div>' +
        '<div class="ambC">' + (k >= 0
          ? t({ zh: '倍增时间', en: 'doubling time' }) + ' ln2/k = <b>' + (big ? fmt(LN2 / k) + ' s' : '∞') + '</b>'
          : t({ zh: '半衰期', en: 'half-life' }) + ' ln2/|k| = <b>' + (big ? fmt(LN2 / -k) + ' s' : '∞') + '</b>') + '</div>' +
        '<div class="cosC">' + t({ zh: 'e 折时间', en: 'e-folding time' }) + ' 1/|k| = <b>' + (big ? fmt(1 / Math.abs(k)) + ' s' : '∞') + '</b></div>' +
        '<div class="dim">' + t({ zh: 'k > 0 增长 · k < 0 衰减 · ln 即 log_e', en: 'k > 0 grows · k < 0 decays · ln is log base e' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 共享时钟推进倍增页的数值 y：dy/dt = k·y 逐帧精确积分 y ×= e^(k·dt)。
     记录的是"当时的真实值"——中途改 k 只改变此后的斜率，历史绝不重算。
     越界（爆顶 / 衰竭）时从 y₀ 重新释放，decayGen 递增以便历史折线断开。 */
  let dt = state.t - _lastPushT;
  if (dt < 0) { dt = 0; decayY = state.y0; decayGen++; }   /* 重置：t 回到 0 */
  _lastPushT = state.t;
  decayY *= Math.exp(state.k * dt);
  if (decayY > DK_YMAX + 0.15 || decayY < DK_YMIN) { decayY = state.y0; decayGen++; }
  samples.push({
    t: state.t,
    dy: decayY,      /* 当时的真实数值 y(t) */
    dg: decayGen     /* 释放代号：变化处即历史断点 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
