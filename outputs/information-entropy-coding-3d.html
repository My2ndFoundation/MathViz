const Z_V = 0.9;              /* 历史沿 t 轴的流速（世界单位/s） */

/* 当前符号分布：几何权重 rⁱ 自动归一化（skew=0 → 均匀，skew→1 → 集中于首符号），恒有 pᵢ > 0 */
function dist() {
  const m = Math.round(state.mSym), r = 1 - 0.82 * state.skew;
  const P = []; let sum = 0;
  for (let i = 0; i < m; i++) { const w = Math.pow(r, i); P.push(w); sum += w; }
  for (let i = 0; i < m; i++) P[i] /= sum;

/* Huffman 编码：反复合并两个最小概率（平局按最小符号号，完全确定）；返回逐步森林 + 码长 + 码字 */
function huffman(P) {
  const leaves = P.map((p, i) => ({ p: p, sym: i, kids: null, minSym: i }));
  const steps = [leaves.slice()];
  let pool = leaves.slice();
  while (pool.length > 1) {
    pool = pool.slice().sort((a, b) => a.p - b.p || a.minSym - b.minSym);
    const a = pool[0], b = pool[1];
    const hi = (b.p > a.p) ? b : (a.p > b.p ? a : (a.minSym < b.minSym ? a : b));
    const lo = hi === a ? b : a;
    const parent = { p: a.p + b.p, sym: -1, kids: [hi, lo], minSym: Math.min(a.minSym, b.minSym) };
    pool = pool.slice(2).concat([parent]);
    steps.push(pool.slice());
  }
  const lens = new Array(P.length).fill(1), codes = new Array(P.length).fill('0');
  if (P.length > 1) {
    (function walk(n, d, c) {
      if (!n.kids) { lens[n.sym] = d; codes[n.sym] = c; return; }
      walk(n.kids[0], d + 1, c + '0');
      walk(n.kids[1], d + 1, c + '1');
    })(steps[steps.length - 1][0], 0, '');
  }
  return { steps: steps, lens: lens, codes: codes };

/* 树布局：叶按符号序固定 x，父节点 x=后代叶均值、y=较高子树再高一层 */
function placeTree(n, pos, m) {
  if (!n.kids) { const q = { x: symX4(n.sym, m), y: 0.3, cnt: 1 }; pos.set(n, q); return q; }

  const q = { x: (a.x * a.cnt + b.x * b.cnt) / (a.cnt + b.cnt), y: Math.max(a.y, b.y) + 0.55, cnt: a.cnt + b.cnt };

}

  ctx.beginPath();
  ctx.moveTo(s[0][0], s[0][1]);
  for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (edge) { ctx.strokeStyle = edge; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke(); }
  ctx.restore();
}

         「峰顶 p = ½ · H = 1 bit」，闪的就是那两条线交会的那一点。
         判据取 |p − ½| < 0.005：不是拍的，是本页 p 读数的显示精度（fmt(p, 3)），
         亮起时读数正好翻成 0.500。不用 |H − 1| 是因为 H 在峰顶是二次平坦的
         （H ≈ 1 − 2.885·δ²），|H−1| < 0.005 对应 |δ| < 0.042 —— 那个窗口宽到
         把「快到峰顶」也算成到达了。锚点就取峰顶。
         实测 60 s 十五次（t = 1.98 起，上行 p = 0.4958 / 下行 p = 0.5042 交替）：
         驱动 8 s 往返，峰顶一趟过一次，节奏就是 4 s 一闪。这是目前全队最密的一处，
         仍在 §4.7 的频闪线（每一两秒真一次）之上，但已经贴着它 ——
         若日后有人把本页的驱动周期调短，这一闪要跟着重新量。 */
      goldHit('binary', Math.abs(p - 0.5) < 0.005);
      drawGoldFlash(C, [pToX(0.5), BIT_H, 0]);
    },
    readout() {
      const p = state.pBin, H = H2of(p);
      const c1 = p > 0 ? p * surprise(p) : 0, c2 = p < 1 ? (1 - p) * surprise(1 - p) : 0;
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;p = <b>' + fmt(p, 3) + '</b></div>' +
        '<div class="cosC">H(p) = <b>' + fmt(H) + '</b> bit</div>' +
        '<div class="sinC">p·I(p) = <b>' + fmt(c1) + '</b>&ensp;·&ensp;(1−p)·I(1−p) = <b>' + fmt(c2) + '</b></div>' +
        '<div class="dim">' + t({ zh: 'p = ½ 时 H 最大 = 1 bit；p = 0 或 1 时 H = 0', en: 'H peaks at 1 bit when p = ½; H = 0 at p = 0 or 1' }) + '</div>';
    }
  },

  /* ────── ③ 多结果分布：H = Σpᵢ·Iᵢ = 长期平均惊奇 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 翠绿的运行平均是个**随机量**，它会晃。
     「平均惊奇 → H」是大数律意义上的贴近，不是某一刻的到达：平均值从上方
     或下方反复穿过 H 线，穿多少次取决于跑了多久，不取决于它有没有「走到」。
     实测（emitRate = 2 符号/s、固定种子、跑满 300 s 共 601 个符号）把两条路都堵死了：
     · 判据取读数精度 |平均 − H| < 0.005 —— **一次都不成立**，全程最近只到 0.0084；
     · 放宽到 0.02 —— 300 s 内九次，那是随机游走反复穿过 H 线，不是走到 H 上。
     一个永不亮，一个替过零打光。与 π 工具的投针页、φ 工具的最无理的数页同一类。 */
  ensemble: {
    label: { zh: '多结果分布', en: 'Distribution' },
    params: ['mSym', 'skew', 'emitRate'],
    /* 本页不需要 drive，也不是「正当静止」：符号源本身就在按 emitRate 持续发符号，
       被演示量（已发符号数、上一枚符号的惊奇度 I、运行平均）随引擎时钟真实推进
       —— 实测 t≈200 s 起 12 s 内「emitted 405 → 417、last surprise 3.28 → 1.29 bit」逐条在变。
       故此处既不补 drive 也不写 drive: null；留这行注释是为了让「已排除」与「漏了」可区分。 */
    brand: { zh: '把熵推广到 m 个结果：H = Σpᵢ·Iᵢ。分布越均匀熵越高（上限 log₂m），越集中熵越低。符号源按当前分布随机发出符号，其惊奇度的长期平均正是熵。',
             en: 'Generalize to m outcomes: H = Σpᵢ·Iᵢ. The more uniform the distribution, the higher the entropy (at most log₂m); the more concentrated, the lower. A source emits symbols from this distribution — the long-run average surprise is exactly the entropy.' },
    tips: { zh: '提示：熵就是长期平均惊奇。按 3 键侧视 平均·t——翠绿的运行平均线沿时间轴逐渐贴上紫色 H 线；把偏斜 s 拉到 0，H 升至 log₂m（琥珀线）：均匀分布最难预测。',
            en: 'Tip: entropy is long-run average surprise. Press 3 for the side average·t view — the emerald running average settles onto the violet H line; drag skew s to 0 and H climbs to log₂m (amber line): the uniform distribution is the hardest to predict.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.85, el: 0.33, dist: 10.5, tx: 0.2, ty: 1, tz: 1.4 },
      front: { label: { zh: '正视 分布', en: 'Front bars' }, az: 0.001, el: 0.02, dist: 8, tx: 0, ty: 1, tz: 0 },
      side:  { label: { zh: '侧视 平均·t', en: 'Side avg·t' }, az: -Math.PI / 2, el: 0.001, dist: 10, tx: 0.5, ty: 1.2, tz: 3,
               onSelect() { state.showAvg = true; syncToggle('showAvg'); } }
    },
    toggles: [
      { key: 'showBars', label: { zh: '概率柱',            en: 'Probability bars' },    color: CYAN,      checked: true },
      { key: 'showI3',   label: { zh: '惊奇度 Iᵢ 与脉冲流', en: 'Surprise Iᵢ & pulses' }, color: ROSE,      checked: true },
      { key: 'showHl',   label: { zh: '熵线 H',            en: 'Entropy line H' },      color: VIOLET,    checked: true },
      { key: 'showAvg',  label: { zh: '平均惊奇流',        en: 'Running average' },     color: EMERALD,   checked: true },
      { key: 'showGrid', label: { zh: '网格',              en: 'Grid' },                color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / Z_V + 0.5,
    draw(C) {
      const P = dist(), m = P.length, Hm = entropyOf(P);
      const PS = 2.2;            /* 概率 1 的世界高度 */
      const CLIP3 = 5.5;         /* 惊奇度显示裁剪（bit） */
      const XR = 2.0;            /* 平均惊奇栏杆所在 x */
      if (state.showGrid) drawGridXY(C, 2.2, 0.55);
      axisSeg(C, [-2.2, 0, 0], [2.35, 0, 0], t({ zh: '符号', en: 'sym' }), { font: '11px ' + FONT_CN });
      /* 左：概率轴 */
      axisSeg(C, [-2.05, 0, 0], [-2.05, PS + 0.35, 0], 'p');
      for (const pv of [0.5, 1]) {
        line3(C, [-2.1, pv * PS, 0], [-2.0, pv * PS, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-2.17, pv * PS, 0], pv === 1 ? '1' : '0.5', { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
      /* 右（x = XR）：bit 轴 + 时间轴 */
      axisSeg(C, [XR, 0, 0], [XR, CLIP3 * BIT_I + 0.3, 0], null);
      label3(C, [XR + 0.16, CLIP3 * BIT_I + 0.18, 0], 'bit', { size: 10, color: 'rgba(159,176,200,.7)', align: 'left' });
      for (let k = 1; k <= 5; k++) {
        line3(C, [XR - 0.05, k * BIT_I, 0], [XR + 0.05, k * BIT_I, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [XR + 0.14, k * BIT_I, 0], '' + k, { size: 10, color: 'rgba(159,176,200,.6)', align: 'left' });
      }
      axisSeg(C, [XR, 0, 0], [XR, 0, WAVE_LEN + 0.4], 't');
      tTicks(C, XR, 0);

      /* 概率柱（青色源几何；几何权重自动归一化，Σpᵢ = 1 恒成立） */
      for (let i = 0; i < m; i++) {
        const x = symX3(i, m), h = P[i] * PS, w = 0.14;
        if (state.showBars) quad(C, [[x - w, 0, 0], [x + w, 0, 0], [x + w, h, 0], [x - w, h, 0]],
          'rgba(45,212,234,0.20)', 'rgba(45,212,234,0.85)');
        label3(C, [x, -0.22, 0], SYM[i], { font: 'italic 12px ' + FONT_MATH, color: '#9fb0c8', align: 'center' });
        if (state.showBars) label3(C, [x, -0.46, 0], (P[i] * 100).toFixed(0) + '%', { size: 9.5, color: 'rgba(45,212,234,.75)', align: 'center' });
      }

      /* 惊奇度 Iᵢ（玫红）：小概率符号站得高 */
      if (state.showI3) {
        for (let i = 0; i < m; i++) {
          const x = symX3(i, m), y = Math.min(surprise(P[i]), CLIP3) * BIT_I;
          line3(C, [x, 0, 0], [x, y, 0], { width: 1, dash: [5, 6], color: 'rgba(251,113,133,0.45)' });
          solidDot(C, [x, y, 0], 3, 'rgba(251,113,133,0.95)');
        }
        label3(C, [symX3(m - 1, m) + 0.16, Math.min(surprise(P[m - 1]), CLIP3) * BIT_I + 0.05, 0], 'Iᵢ = −log₂ pᵢ',
          { font: 'italic 12px ' + FONT_MATH, color: ROSE, align: 'left' });
      }

      /* 熵线 H（紫）与均匀分布上限 log₂m（琥珀） */
      if (state.showHl) {
        line3(C, [-2.05, Hm * BIT_I, 0], [XR, Hm * BIT_I, 0], { width: 1.2, dash: [5, 6], color: 'rgba(167,139,250,0.8)' });
        label3(C, [-2.0, Hm * BIT_I + 0.18, 0], 'H = Σpᵢ·Iᵢ = ' + fmt(Hm) + ' bit',
          { font: 'italic 12px ' + FONT_MATH, color: VIOLET, align: 'left' });
        line3(C, [-2.05, log2(m) * BIT_I, 0], [XR, log2(m) * BIT_I, 0], { width: 1, dash: [4, 5], color: 'rgba(251,191,36,0.4)' });
        label3(C, [XR - 0.06, log2(m) * BIT_I + 0.15, 0], 'log₂m = ' + fmt(log2(m)),
          { font: 'italic 11px ' + FONT_MATH, color: 'rgba(251,191,36,.8)', align: 'right' });
      }

      /* 惊奇脉冲流（玫红）：每发出一个符号，就在其位置留下一根高 Iᵢ 的脉冲 */
      if (state.showI3) {
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i];
          const z = zOf(s.t);
          if (z > WAVE_LEN) break;
          if (s.sym < 0 || s.sym >= m) continue;
          line3(C, [symX3(s.sym, m), 0, z], [symX3(s.sym, m), Math.min(s.surp, CLIP3) * BIT_I, z],
            { width: 1.6, color: 'rgba(251,113,133,0.5)' });
        }
        if (emit.lastSym >= 0 && emit.lastSym < m) {
          const z = zOf(emit.lastT);
          if (z <= WAVE_LEN) {
            const sp = proj(C, [symX3(emit.lastSym, m), Math.min(emit.lastSurp, CLIP3) * BIT_I, z]);
            if (sp) glowDot(sp, 9, '#ffffff', 'rgba(251,113,133,0.85)');
          }
        }
      }

      /* 平均惊奇流（翠绿）沿栏杆流出，贴向紫色 H(t) 线 */
      if (state.showAvg && samples.length > 1) {
        const ha = [], av = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const s = samples[i], z = zOf(s.t);
          if (z > WAVE_LEN) break;
          ha.push([XR, s.Hm * BIT_I, z]);
          av.push(s.avg == null ? null : [XR, Math.min(s.avg, CLIP3) * BIT_I, z]);
        }
        strokePoly(C, ha, { width: 1.6, color: 'rgba(167,139,250,0.55)' });
        strokePoly(C, av, { width: 5.5, color: 'rgba(52,211,153,0.13)' });
        strokePoly(C, av, { width: 2.2, fade: ['rgba(52,211,153,1)', 'rgba(52,211,153,0.04)'] });
        if (emit.count) {
          const yA = Math.min(emit.total / emit.count, CLIP3) * BIT_I;
          const sp = proj(C, [XR, yA, 0]);
          if (sp) glowDot(sp, 9, '#ffffff', 'rgba(52,211,153,0.9)');
          label3(C, [XR + 0.28, yA, 0], fmt(emit.total / emit.count) + ' bit', { size: 10.5, color: EMERALD, align: 'left' });
        }
        label3(C, [XR, -0.35, 2.2], t({ zh: '平均惊奇 → H', en: 'avg surprise → H' }), { size: 10.5, color: 'rgba(52,211,153,.8)', align: 'center' });
      }
    },
    readout() {
      const P = dist(), m = P.length, Hm = entropyOf(P);
      const avg = emit.count ? emit.total / emit.count : null;
      return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' + t({ zh: '已发出 ', en: 'emitted ' }) + '<b>' + emit.count + '</b>' + t({ zh: ' 个符号', en: ' symbols' }) + '</div>' +
        '<div class="sinC">' + t({ zh: '最近惊奇 I = ', en: 'last surprise I = ' }) + '<b>' + (emit.lastSym >= 0 ? fmt(emit.lastSurp) : '—') + '</b> bit' +
          (emit.lastSym >= 0 && emit.lastSym < m ? '&ensp;(' + SYM[emit.lastSym] + ')' : '') + '</div>' +
        '<div class="cosC">H = Σpᵢ·Iᵢ = <b>' + fmt(Hm) + '</b> bit</div>' +
        '<div class="tanC">' + t({ zh: '平均惊奇 = ', en: 'running average = ' }) + '<b>' + (avg == null ? '—' : fmt(avg)) + '</b> bit</div>' +
        '<div class="dim">' + t({ zh: '均匀上限 log₂m = ', en: 'uniform max log₂m = ' }) + fmt(log2(m)) + ' bit</div>';
    }
  },

  /* ────── ④ 编码树：Huffman 前缀码，L̄ ≥ H ────── */
  coding: {
    label: { zh: '编码树', en: 'Coding tree' },
    params: ['mSym', 'skew', 'codeStep'],
    /* tips 就是一句驱动说明："拖动「编码合并步骤 k」从零重演建树"——k 是本页自变量。
       取满 [0, 7]：7 = 符号数 m 取上限 8 时的合并次数。m 更小时尾段会停在建好的整棵树上
       （实测默认 m = 5 时，k 被夹在终态 4 上停留 2.0 s，恰是上行程的一半；中间每一步各 0.57 s），
       这是一次"看完整棵树"的停顿——但它成立的前提是
       上面那条 fmt 的夹取，否则滑杆会标出一个读数区并不认的 k。
       不把 to 写死成 4 的理由：4 只对默认的 m = 5 成立，m 取 6/7/8 时整棵树将永远建不完，
       那等于把一处回显缺陷换成一处功能缺陷。
       从 7 跳回 0 整棵树会瞬间拆光 ⇒ linear（往返 = 建树再拆树）；每步一次合并，8 s 跟得上。
       codeStep 带 map: Math.round，按 §8 硬约束补了 invMap（Math.round 的滑杆刻度即自身，故取恒等）。 */
    drive: { key: 'codeStep', from: 0, to: 7, period: 8, kind: 'linear' },
    brand: { zh: '「反复合并两个最小概率」自底向上长出 Huffman 前缀码树：高频符号得到短码、低频符号得到长码，ℓᵢ ≈ −log₂pᵢ。平均码长 L̄ = Σpᵢℓᵢ 永远不低于熵 H——熵是无损压缩的极限。',
             en: 'Repeatedly merging the two least likely nodes grows the Huffman prefix tree bottom-up: frequent symbols get short codes, rare ones long codes, ℓᵢ ≈ −log₂pᵢ. The mean code length L̄ = Σpᵢℓᵢ can never drop below the entropy H — entropy is the limit of lossless compression.' },
    tips: { zh: '提示：拖动「编码合并步骤 k」从零重演建树——每一步合并概率最小的两棵子树（琥珀圈标出下一对）。按 2 键正视，看下方对比图：橙色 L̄ 线永远压不到紫色 H 线之下，但相差不足 1 bit。',
            en: 'Tip: drag the merge-step slider k to replay the construction — each step merges the two least likely subtrees (the amber rings mark the next pair). Press 2 for the front view and watch the chart below: the orange L̄ line never drops below the violet H line, yet stays within 1 bit of it.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.7, el: 0.3, dist: 11, tx: 0, ty: 0.4, tz: 0 },
      front: { label: { zh: '正视 编码树', en: 'Front tree' }, az: 0.001, el: 0.02, dist: 8.6, tx: 0, ty: 0.4, tz: 0 }
    },
    toggles: [
      { key: 'showTree',  label: { zh: '编码树',              en: 'Coding tree' },           color: CYAN,      checked: true },
      { key: 'showIdeal', label: { zh: '理想码长 −log₂pᵢ',    en: 'Ideal length −log₂pᵢ' },  color: ROSE,      checked: true },
      { key: 'showH4',    label: { zh: '熵线 H',              en: 'Entropy line H' },        color: VIOLET,    checked: true },
      { key: 'showLen',   label: { zh: '实际码长 ℓᵢ 与 L̄',    en: 'Actual ℓᵢ & mean L̄' },    color: ORANGE,    checked: true },
      { key: 'showGrid',  label: { zh: '网格',                en: 'Grid' },                  color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / Z_V + 0.5,
    draw(C) {
      const P = dist(), m = P.length, Hm = entropyOf(P);
      const HF = huffman(P);
      const k = clamp(Math.round(state.codeStep), 0, m - 1);
      const full = k === m - 1;
      const S4 = 0.34, yB = -2.35, CLIP4 = 5.5;
      const Lbar = P.reduce((a, p, i) => a + p * HF.lens[i], 0);
      if (state.showGrid) drawGridXY(C, 2.2, 0.55);

      /* 编码树（青色结构，向上生长） */
      if (state.showTree) {
        const forest = HF.steps[k];
        const pos = new Map();
        forest.forEach(rt => placeTree(rt, pos, m));
        const drawNode = n => {
          if (!n.kids) return;
          const q = pos.get(n);
          n.kids.forEach((kid, j) => {
            const qk = pos.get(kid);
            line3(C, [q.x, q.y, 0], [qk.x, qk.y, 0], { width: 1.6, color: 'rgba(45,212,234,0.7)' });
            label3(C, [(q.x + qk.x) / 2 + (j === 0 ? -0.1 : 0.1), (q.y + qk.y) / 2 + 0.06, 0], j === 0 ? '0' : '1',
              { font: '10px ' + FONT_MONO, color: 'rgba(159,176,200,.85)', align: j === 0 ? 'right' : 'left' });
            drawNode(kid);
          });
          solidDot(C, [q.x, q.y, 0], 3, 'rgba(45,212,234,0.95)');
          label3(C, [q.x, q.y + 0.2, 0], fmt(n.p), { size: 9.5, color: 'rgba(45,212,234,.75)', align: 'center' });
        };
        forest.forEach(drawNode);
        for (let i = 0; i < m; i++) {
          const x = symX4(i, m);
          const sp = proj(C, [x, 0.3, 0]);
          if (sp) glowDot(sp, 8, '#ffffff', 'rgba(45,212,234,0.85)');
          label3(C, [x, 0.02, 0], SYM[i] + ' ' + (P[i] * 100).toFixed(0) + '%', { size: 9.5, color: 'rgba(45,212,234,.8)', align: 'center' });
          if (full && state.showLen) label3(C, [x, -0.22, 0], HF.codes[i], { font: '10px ' + FONT_MONO, color: ORANGE, align: 'center' });
        }
        /* 下一步要合并的两棵最小子树（琥珀提示） */
        if (!full) {
          const sorted = forest.slice().sort((a, b) => a.p - b.p || a.minSym - b.minSym);
          let topY = 0.3;
          pos.forEach(q => { if (q.y > topY) topY = q.y; });
          for (const nd of [sorted[0], sorted[1]]) {
            const q = pos.get(nd);
            const ring = [];
            for (let j = 0; j <= 24; j++) { const a = j / 24 * TAU; ring.push([q.x + 0.2 * Math.cos(a), q.y + 0.2 * Math.sin(a), 0]); }
            strokePoly(C, ring, { width: 1.2, dash: [4, 5], color: 'rgba(251,191,36,0.85)' });
          }
          label3(C, [0, topY + 0.5, 0], t({ zh: '下一步：合并两个最小概率', en: 'next: merge the two smallest' }),
            { size: 11, color: 'rgba(251,191,36,.85)', align: 'center' });
        }
      }

      /* 下方对比图：理想码长（玫红） vs 实际码长（橙），基线 yB */
      line3(C, [-2.0, yB, 0], [2.0, yB, 0], { width: 1.4, color: AXIS });
      for (let b = 1; b <= 5; b++) {
        line3(C, [-2.04, yB + b * S4, 0], [-1.96, yB + b * S4, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-2.12, yB + b * S4, 0], '' + b, { size: 9.5, color: 'rgba(159,176,200,.6)', align: 'right' });
      }
      label3(C, [-2.1, yB + 5 * S4 + 0.26, 0], 'bit', { size: 10, color: 'rgba(159,176,200,.7)', align: 'center' });
      for (let i = 0; i < m; i++) {
        const x = symX4(i, m);
        label3(C, [x, yB - 0.2, 0], SYM[i], { font: 'italic 11px ' + FONT_MATH, color: '#9fb0c8', align: 'center' });
        if (state.showIdeal) {
          const hI = Math.min(surprise(P[i]), CLIP4) * S4;
          line3(C, [x - 0.07, yB, 0], [x - 0.07, yB + hI, 0], { width: 6, alpha: 0.26, color: ROSE });
          line3(C, [x - 0.07, yB, 0], [x - 0.07, yB + hI, 0], { width: 3, color: 'rgba(251,113,133,0.9)' });
        }
        if (state.showLen) {
          const hL = HF.lens[i] * S4;
          line3(C, [x + 0.07, yB, 0], [x + 0.07, yB + hL, 0], { width: 6, alpha: 0.26, color: ORANGE });
          line3(C, [x + 0.07, yB, 0], [x + 0.07, yB + hL, 0], { width: 3, color: 'rgba(251,146,60,0.9)' });
        }
      }
      if (state.showIdeal) label3(C, [-1.9, yB + 5 * S4 + 0.26, 0], 'ℓᵢ ≈ Iᵢ = −log₂ pᵢ',
        { font: 'italic 11px ' + FONT_MATH, color: ROSE, align: 'left' });
      if (state.showH4) {
        line3(C, [-2.0, yB + Hm * S4, 0], [2.0, yB + Hm * S4, 0], { width: 1.2, dash: [5, 6], color: 'rgba(167,139,250,0.85)' });
        label3(C, [2.08, yB + Hm * S4, 0], 'H = ' + fmt(Hm), { font: 'italic 11px ' + FONT_MATH, color: VIOLET, align: 'left', dy: 9 });
      }
      if (state.showLen) {
        line3(C, [-2.0, yB + Lbar * S4, 0], [2.0, yB + Lbar * S4, 0], { width: 1.2, dash: [5, 6], color: 'rgba(251,146,60,0.9)' });
        label3(C, [2.08, yB + Lbar * S4, 0], 'L̄ = ' + fmt(Lbar), { font: 'italic 11px ' + FONT_MATH, color: ORANGE, align: 'left', dy: -9 });
      }
      label3(C, [0, yB - 0.5, 0], t({ zh: '香农源编码极限：H ≤ L̄ < H + 1', en: 'Shannon source-coding limit: H ≤ L̄ < H + 1' }),
        { size: 11, color: 'rgba(251,191,36,.85)', align: 'center' });
      /* 金光闪（§4.7）：橙色 L̄ 线**落到**紫色 H 线上 —— 冗余归零，
         香农下界不再只是「压不下去的地板」，而是被真正踩到。
         这一页 tips 说的是「永远压不到 H 之下，但相差不足 1 bit」；等号什么时候
         成立，是这句话缺的那一半：当且仅当每个 pᵢ 都是 2 的负整数次幂。
         本工具的 dist() 是几何分布，能做到这件事的只有 skew = 0（均匀）
         且 m ∈ {2, 4, 8}。默认 m = 5 / skew = 0.45 不闪，把两根滑杆拨过去才闪。

         判据这里**故意不借读数精度**，取 L̄ − H < 1e-9。理由是本页要判的是
         「等号取不取得到」这件是非题，而读数只有两位小数。实测把 (m, skew) 的
         整张格点（m = 2…8 × skew = 0.00…1.00，步长 0.01）扫了一遍：
         · 等号真正成立的只有 3 个格点：m/skew = 2/0、4/0、8/0；
         · 冗余落在 (0, 0.005) 之间、读数照样印成 0.00 的却有 **40 个**
           （如 7/0.60 = 0.00308、8/0.60 = 0.00166、2/0.05 = 0.00032）。
         借显示精度会让这 40 个格点全部误报「踩到下界」。
         这是少数几处显示精度不够用的判据 —— 借读数是默认，不是教条。
         锚点取两条线重合处的右端标签位置。 */
      goldHit('coding', Lbar - Hm < 1e-9);
      drawGoldFlash(C, [2.0, yB + Hm * S4, 0]);
    },
    readout() {
      const P = dist(), m = P.length, Hm = entropyOf(P), HF = huffman(P);
      const k = clamp(Math.round(state.codeStep), 0, m - 1);
      const Lbar = P.reduce((a, p, i) => a + p * HF.lens[i], 0);
      return '<div>' + t({ zh: '合并步骤 k = ', en: 'merge step k = ' }) + '<b>' + k + '</b> / ' + (m - 1) +
             (k === m - 1 ? t({ zh: '（建成）', en: ' (done)' }) : '') + '</div>' +
        '<div class="cosC">H = <b>' + fmt(Hm) + '</b> bit/' + t({ zh: '符号', en: 'sym' }) + '</div>' +
        '<div class="cotC">L̄ = Σpᵢℓᵢ = <b>' + fmt(Lbar) + '</b> bit/' + t({ zh: '符号', en: 'sym' }) + '</div>' +
        '<div>' + t({ zh: '冗余 ', en: 'redundancy ' }) + 'L̄ − H = <b>' + fmt(Lbar - Hm) + '</b> bit&ensp;·&ensp;' +
             t({ zh: '效率 ', en: 'efficiency ' }) + (Lbar > 0 ? (100 * Hm / Lbar).toFixed(1) : '—') + '%</div>' +
        '<div class="dim">' + t({ zh: '前缀码：任何码字都不是另一个码字的前缀，可即时解码', en: 'prefix code: no codeword is a prefix of another — instantly decodable' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录"当时的真实值"，参数中途改变时历史不重算      ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  if (state.omega == null) state.omega = 0;   /* 本工具没有旋转时钟：θ 恒为 0，历史只随 t 流动 */
  if (state.t === 0) {                        /* 重置：符号源清零并换用固定种子（可复现） */
    emit.next = 0; emit.count = 0; emit.total = 0;
    emit.lastSym = -1; emit.lastSurp = 0; emit.lastT = -1;
    emit.rng = mulberry32(20260731);
  }
  const P = dist(), Hm = entropyOf(P);
  let sym = -1, surp = 0;
  if (emit.rng && state.t >= emit.next - 1e-9) {   /* 符号源：按"当时的分布"随机发出一个符号 */
    emit.next = state.t + 1 / state.emitRate;
    const u = emit.rng();
    let acc = 0; sym = P.length - 1;
    for (let i = 0; i < P.length; i++) { acc += P[i]; if (u < acc) { sym = i; break; } }
    surp = surprise(P[sym]);                       /* 几何权重恒有 pᵢ > 0，惊奇度有限 */
    emit.count++; emit.total += surp;
    emit.lastSym = sym; emit.lastSurp = surp; emit.lastT = state.t;
  }
  samples.push({
    t: state.t,
    p: state.pBin,                     /* 当时的二元概率 */
    I: surprise(state.pBin),           /* 当时的惊奇度（p = 0 时为 Infinity，绘制时折线断开） */
    Hb: H2of(state.pBin),              /* 当时的二元熵 */
    Hm: Hm,                            /* 当时的多符号分布熵 */
    sym: sym, surp: surp,              /* 本帧发出的符号（无则 −1）及其惊奇度 */
    avg: emit.count ? emit.total / emit.count : null   /* 当时的运行平均惊奇 */
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

/* —— 金光闪（gold flash）：命中「那个数」的那一瞬，全屏泛起一层琥珀色的光 ——
   规范见设计系统 §4.7。要点在那里，这里只留实现约定：

     goldHit(id, on)            每帧喂一次判据，**由假变真**时打点（id 用页签键）
     drawGoldFlash(C, anchor3)  画这一闪，放在 draw(C) 的最后一行
     goldFlashReset()           清打点；引擎已在 resetSim() 里调过

   衰减走 state.t，与其余装饰脉动同一个时钟：暂停即冻结，录制器按固定 dt
   推进也复现得出。加色（lighter）而非覆盖 —— 峰值时场景必须仍然透得出来，
   这是原则 2「画布即主角」在这一闪上的落法。 */
const FLASH_DUR = 1.05, FLASH_RISE = 0.09;
const flashAt = {}, flashOn = {};
function goldHit(id, on) {
  if (on && !flashOn[id]) flashAt[id] = state.t;
  flashOn[id] = on;
}
function goldFlashReset() {
  Object.keys(flashAt).forEach(k => { delete flashAt[k]; });
  Object.keys(flashOn).forEach(k => { delete flashOn[k]; });
}
function drawGoldFlash(C, anchor3) {
  const t0 = flashAt[curTab];
  if (t0 == null) return;
  const k = state.t - t0;
  if (k < 0 || k >= FLASH_DUR) return;
  const env = k < FLASH_RISE ? k / FLASH_RISE
                             : Math.pow(1 - (k - FLASH_RISE) / (FLASH_DUR - FLASH_RISE), 2);
  const a = REDUCED ? env * 0.3 : env;
  if (a <= 0.002) return;
  /* 锚点由工具侧提供，写错是常事（最常见的是把二维点直接传进来，proj 于是
     算出 NaN，createRadialGradient 抛异常、整帧作废）。这里兜住：投影失败、
     传了 null、或者算出非有限值，一律回落到画面中心——闪照样闪，只是不居中。 */
  let p = (anchor3 && proj(C, anchor3)) || null;
  if (!p || !isFinite(p[0]) || !isFinite(p[1])) p = [CX, CY];
  const R = Math.hypot(W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 满屏均匀底光：没有这一层就只是「中心亮了一下」，够不上「全屏一闪」 */
  ctx.fillStyle = 'rgba(251,191,36,' + (0.065 * a).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  /* 命中点泛光：白金核心 → 琥珀 */
  const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], R * 0.78);
  g.addColorStop(0,    'rgba(255,247,224,' + (0.42 * a).toFixed(4) + ')');
  g.addColorStop(0.22, 'rgba(253,224,140,' + (0.19 * a).toFixed(4) + ')');
  g.addColorStop(0.6,  'rgba(251,191,36,'  + (0.07 * a).toFixed(4) + ')');
  g.addColorStop(1,    'rgba(251,191,36,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  /* 边缘暖晕：四角先亮起来，「整屏」这件事才被看见 */
  const v = ctx.createRadialGradient(CX, CY, R * 0.2, CX, CY, R * 0.6);
  v.addColorStop(0, 'rgba(251,191,36,0)');
  v.addColorStop(1, 'rgba(251,191,36,' + (0.13 * a).toFixed(4) + ')');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  /* 冲击波：一圈自命中点推向画外的琥珀细环 */
  if (!REDUCED) {
    const q = Math.min(1, k / (FLASH_DUR * 0.8));
    const rr = R * 0.92 * (1 - Math.pow(1 - q, 3));       /* easeOutCubic */
    const fade = Math.pow(1 - q, 1.6);
    ctx.beginPath();
    ctx.arc(p[0], p[1], Math.max(1, rr), 0, TAU);
    ctx.lineWidth = 1 + 2.2 * fade;
    ctx.strokeStyle = 'rgba(255,247,224,' + (0.5 * fade).toFixed(4) + ')';
    ctx.stroke();
  }
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  /* 金光闪的打点一并清账：t 归零后，flashAt 里留着的是「未来」的时刻，
     命中判据也还停在旧的真值上——不清，重置后走回同一个命中点时不会再闪 */
  goldFlashReset();
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */

    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };

}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
