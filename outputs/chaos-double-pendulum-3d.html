<title>混沌双摆 · 确定性的不可预测</title>
<!-- ============================================================
  混沌双摆：确定性的不可预测 · 交互式数学可视化
  基于 math-viz-starter.html v1.1.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）

  物理与数值（先读这段，它决定了整个工具的可信度）：
    双摆，无阻尼，m₁ = m₂ = 1、L₁ = L₂ = 1、g = 9.81，状态 (θ₁, θ₂, ω₁, ω₂)。
    积分器：RK4，固定步长 h ≤ 1/2000 s，在引擎每帧的 dt 内做 ceil(dt/h) 个子步，
    子步数封顶 SUB_MAX —— 绝不拿引擎的 per-frame dt 直接积一步（混沌系统受不起）。
    小角度极限的两个简正频率 √((2∓√2)g/L) = 2.3972 / 5.7874 rad/s，已实测吻合。
    读数区常驻能量漂移 |ΔE/E₀|：算不准这件事本身就是课程内容，不是瑕疵披露。

  坐标约定（每个页签一套，读数与轴字母都写明）：
    页签① x, y = 摆所在的竖直平面，z = 时间（末端轨迹沿 +z 流出，引擎原生用法）
    页签② y = log₁₀ δ，z = 时间
    页签③ x = θ₁，y = θ₂（相平面，各自 wrap 到 ±π），z = 时间
    页签④ x = θ₂/θ₂ᵐᵃˣ，y = ω₂/ω₂ʳᵉᶠ（按能量归一的庞加莱截面），z = 能量

  种子绝不加 drive（规范 §6「双语义迭代」）：th1 / th2 / logD0 / nEns / energy
  全是种子，改动它们的语义是「重新播种」—— 清空轨迹、从新初值重新积分，显式
  且由用户发起，不是每帧偷偷重算历史。四个场景各留一行注释写明它靠什么在动
  （§8 出路① + 出路④ 的痕迹要求）。

  版本记录（新→旧）：
    1.2.0  2026-08-09  金光闪（规范 §4.7）的表态：四个页签**全部有意不加**，理由逐页写进
                       场景注释并附实测数字 —— ① 孪生双摆发生的是「分离」不是「到达」，
                       且 TWIN_APART = 0.3 是调度常数（阈值放大六倍，分手时刻只挪 1.24 s）；
                       ② 指数律是恒等式般的图像，饱和线 60 s 内被穿越 112 次且讲反结论；
                       ③ 折返次数是每帧重算的启发式，60 s 上跳 63 次、下跳 37 次；
                       ④ tips 明写「混沌不是开关」，任何一闪都把它讲成开关。
                       因此本文件不移植 goldHit / drawGoldFlash 引擎部件（插了就是死代码）。
                       Gold-flash (spec §4.7) verdict: all four tabs deliberately opt out,
                       with per-tab reasons and measured numbers in the scene comments;
                       the engine parts are therefore not ported into this file.
    1.1.1  2026-08-02  回放期间面板上的进度数字不再停在「1 / N」：状态行的文案抽成唯一出处 recInfoText()，每 120 ms 与录制行数走同一条刷新路径。回放本身一直是对的，坏的只是那个数字
    1.1.0  2026-08-02  接入引擎 1.1.0 的「演算记录与回放」（规范 §11）：页签①
                       「孪生双摆」可录制。录制以一轮为单位 —— 按「记录」即从
                       种子重新播种并把时间量子化成整数个 REC_DT，录到本轮结束
                       自动停止，于是每份存档恰好是一次完整的「重合 → 分手 →
                       分开」。载入时引擎按轨迹进入回放（必定成功），同时用存
                       档里的种子在本机重新积分并逐点比对；比对结论写在读数区
                       —— 贴在舍入噪声上说明本机复现了这次运行，指数抬起来则
                       是这个工具在自己身上演示了自己的论点。页签②③④ 不声明
                       钩子（派生实验与重负载系综，不值得存档）
                       Wires in engine 1.1.0's record/replay (spec §11): tab 1
                       "Twins" is recordable. Recording is scoped to one round —
                       pressing Record re-seeds from the seed and quantizes time
                       into whole REC_DT steps, and it stops when the round ends,
                       so every archive is exactly one complete "together →
                       split → apart" cycle. On load the engine replays the
                       trace (always faithful) and, in parallel, re-integrates
                       the stored seed locally and compares point by point; the
                       verdict is printed in the readout — hugging the rounding
                       floor means this machine reproduced the run, an
                       exponential lift-off means the tool just demonstrated its
                       own thesis on itself. Tabs 2–4 declare no hooks
    1.0.1  2026-08-02  页签① 的「分手」改为可反复看：两摆真正分开后再留一个
                       完整窗口就重新播种。原先它是一次性事件（实测 t ≈ 11 s
                       发生），去别的页签逛一圈回来就已经错过且无提示；②③ 页
                       本就各有重播种，①页是漏了。判据用「下摆末端拉开多少」
                       而非照抄②③的「跑满一根时间轴」——默认 zScale 下窗口只有
                       6.7 s，短于 11 s，照抄会赶在分手之前重来
                       Tab 1's split is now repeatable: the pair re-seeds one
                       full window after the bobs visibly separate. It used to
                       be a one-shot event (measured at t ≈ 11 s) that any tab
                       excursion silently consumed; tabs 2 and 3 already
                       re-seeded, tab 1 was an omission. The trigger is bob
                       separation rather than tabs 2–3's "one full time axis",
                       because at the default zScale that window is 6.7 s —
                       shorter than 11 s, so copying it would re-seed before
                       the split ever happened
    1.0.0  2026-08-02  首个版本：四个页签（孪生双摆 / 分离的指数律 /
                       初值扇面的拉伸与折叠 / 庞加莱截面从可积到混沌），
                       固定步长 RK4 子步进，全量双语，frame() 加固
                       Initial release: four scenes (twin pendulums /
                       exponential separation law / stretch-and-fold ensemble /
                       Poincare section from integrable to chaos), fixed-step
                       RK4 substepping, full zh-en i18n, hardened frame()
============================================================ -->

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.1.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;
const ENGINE_VERSION = document.querySelector('meta[name="engine-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'chaos-double-pendulum-3d',
  title: { zh: '混沌双摆 · 确定性的不可预测', en: 'Chaotic double pendulum · deterministic unpredictability' },
  /* h1 的英文比中文短：英文页签一行比中文宽约 130px，居中的页签条会往左顶到
     标题上（实测 1280px 下重叠 41px）。标题短一点，两边就都留得下。 */
  h1:    { zh: '混沌双摆 · 确定性的不可预测', en: 'The double pendulum' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  /* 演算记录与回放（§11）。仅当场景在 RECORD 里声明了钩子时才出现。 */
  recRec:    { zh: '● 记录',   en: '● Record' },
  recStop:   { zh: '■ 停止',   en: '■ Stop' },
  recSave:   { zh: '⬇ 保存',   en: '⬇ Save' },
  recLoad:   { zh: '⬆ 载入',   en: '⬆ Load' },
  recExit:   { zh: '✕ 退出回放', en: '✕ Exit replay' },
  recPlay:   { zh: '▶',        en: '▶' },
  recPause:  { zh: '⏸',        en: '⏸' },
  recRewind: { zh: '⏮',        en: '⏮' },
  recRows:   { zh: ' 行',      en: ' rows' },
  recFull:   { zh: '已达行数上限，录制停止（数据完整，未截断）',
               en: 'Row limit reached, recording stopped (data complete, not truncated)' },
  recRoundEnd: { zh: '本轮结束，录制自动停止', en: 'Round complete, recording stopped' },
  recReplay: { zh: '回放中', en: 'Replaying' },
  recVerifyOK: { zh: '种子比对：本机复现（δ = ', en: 'Seed check: reproduced here (δ = ' },
  recVerifyNo: { zh: '种子比对：本机复现不了（δ = ', en: 'Seed check: not reproducible here (δ = ' },
  recVerifyTail: { zh: '）—— 这不是 bug，见提示', en: ') — not a bug, see the tip' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* TAU 沿用 starter 的位置（提到 PARAMS/SCENES 之前）：场景层若在对象字面量里
   直接引用它（非惰性函数体内），留在原「常量与状态」区会触发 TDZ 报错。 */
const TAU = Math.PI * 2;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ║  invMap: 状态值→原始值。声明了 map 就必须给，否则被 drive     ║
   ║          驱动时滑块回显会错位（规范 §8 硬约束）               ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'th1',    label: { zh: '初始角 <i>θ</i>₁', en: 'Initial angle <i>θ</i>₁' }, min: 0, max: 3.14, step: 0.005, value: 2,    fmt: v => fmt(v) + ' rad' },
  { key: 'th2',    label: { zh: '初始角 <i>θ</i>₂', en: 'Initial angle <i>θ</i>₂' }, min: 0, max: 3.14, step: 0.005, value: 2,    fmt: v => fmt(v) + ' rad' },
  /* map 存的是 10^v（真正的 δ₀），故必须成对给 invMap —— 规范 §8 硬约束 */
  { key: 'logD0',  label: { zh: '初值偏差 <i>δ</i>₀', en: 'Initial offset <i>δ</i>₀' }, min: -12, max: -2, step: 0.05, value: -6,
    fmt: v => expTxt(v), map: v => Math.pow(10, v), invMap: v => Math.log10(v) },
  { key: 'nEns',   label: { zh: '系综个数 <i>N</i>', en: 'Ensemble size <i>N</i>' }, min: 8, max: 120, step: 1, value: 110, fmt: v => v.toFixed(0) },
  { key: 'zScale', label: { zh: '时间轴缩放', en: 'Time-axis scale' }, min: 0.3, max: 3, step: 0.01, value: 1.2,
    fmt: v => fmt(v) + t({ zh: ' 单位/s', en: ' units/s' }) },
  { key: 'energy', label: { zh: '系统能量 <i>E</i>', en: 'System energy <i>E</i>' }, min: -29.2, max: 0, step: 0.05, value: -16, fmt: v => fmtS(v) }
];

/* ════════ 场景层助手 —— 全部新增在 SCENES 之上，引擎函数一字未改 ════════ */

/* 物理：m₁ = m₂ = 1、L₁ = L₂ = 1、g = 9.81；状态 s = [θ₁, θ₂, ω₁, ω₂] */
const G = 9.81;
const H_FIX = 1 / 2000;          // 固定积分步长（设计 §0.2：绝不拿引擎每帧 dt 直接积一步）
/* 每帧子步上限。取 1024 是算出来的：最坏一帧是引擎钳出的 dt = 0.05 s 乘页签④
   的 10 倍速 = 0.5 s 模拟时间，需要 1000 个子步 —— 1024 既留住「h ≤ 1/2000 恒成立」，
   又给出一个硬上限，后台标签页切回来不会把主线程锁死（实测该帧 0.6 ms）。 */
const SUB_MAX = 1024;
const E_MIN = -3 * G;            // 双臂静止悬垂 = 能量下界 −29.43
const E_FLIP = -G;               // 外臂能翻过顶点所需的最低能量 −9.81
const LD = 0.5;                  // 摆杆在世界坐标里的绘制长度（页签①）
const SXY = 1.7 / Math.PI;       // 相平面：θ ∈ [−π, π] → 世界 [−1.7, 1.7]（页签③）
/* 四组实验各有自己的节奏 —— 实测 λ ≈ 1.13 s⁻¹，于是：
   页签① 实时（6.7 s 的末端轨迹窗口刚好）；
   页签② 需要看完 δ 从 10⁻¹⁰ 长到饱和 ≈ 24 s，故时间轴压缩 ×0.28、积分 3 倍速；
   页签③ 拉伸到充满相平面约 7 s，故时间轴 ×0.83、实时；
   页签④ 截面要几百个穿越点才有结构，故 10 倍速。
   这些倍率只改「这组实验推进多快」，不改任何物理量，读数里的 t 一律是模拟秒。 */
/* 页签① 一轮的判据不能照抄 ②③ 的「跑满一根时间轴」：实测两摆在 t ≈ 11 s 才
   真正分开，而默认 zScale = 1.2 时可视窗口只有 WAVE_LEN/1.2 ≈ 6.7 s —— 按窗口
   重播种会赶在分手之前就重来，用户永远看不到那一刻。改用内容判据：等下摆末端
   真的拉开 TWIN_APART 个世界单位之后，再完整留一个窗口让「已分开」走完再重来，
   于是「重合 → 分手 → 分开」三段每轮都看得全。 */
const TWIN_APART = 0.3;          // 页签① 判定「肉眼已是两个摆」的下摆末端间距（世界单位）
const LYAP_RATE = 3;             // 页签② 积分加速倍率
const LYAP_ZF = 0.28;            // 页签② 时间轴相对 zScale 的压缩
/* 一轮的长度 = WAVE_LEN / (zScale · ENS_ZBOOST) ≈ 8.8 s：实测丝长在 8.8 s 前后
   长到 ~15 rad，此时既已折叠数次、相邻两点又还没拉开到看不出是一条丝。 */
const ENS_ZBOOST = 0.76;         // 页签③ 时间轴相对 zScale 的拉伸
const ENS_ARC = 0.004;           // 页签③ 初值弧长（rad）
const POIN_RATE = 10;            // 页签④ 积分加速倍率：截面要够多穿越点才有结构
const POIN_CAP = 1200;           // 页签④ 每条轨道的环形缓冲上限（旧点被挤出 ⇒ 画面永远在换）
const FAM = [-4, -6, -8, -10];   // 页签② 的 δ₀ 族（log₁₀），等间距 2 位小数
const SAT_L = 0.3;               // log₁₀ δ 超过这里视作已饱和（此后不再有信息）
const FIT_HI = -0.5;             // 拟合上界（须在饱和之前）
const FIT_LO = 0.7;              // 拟合下界 = log₁₀ δ₀ + 0.7（跳过初始暂态）
const NORB = 4;                  // 页签④ 同时打点的轨道数

/* Canvas 内复用 :root 的同值字面量（规范 §1.1） */
const COL = {
  rose: [251,113,133], violet: [167,139,250], emerald: [52,211,153],
  orange: [251,146,60], cyan: [45,212,234], amber: [251,191,36], slate: [159,176,200]
};
const FAMC = [COL.rose, COL.violet, COL.emerald, COL.orange];
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

/* ── 数值核心 ───────────────────────────────────────────── */

/* 双摆运动方程（拉格朗日量给出的标准形式，代入 m=L=1 化简）。
   只调用 4 次三角函数：sin/cos(θ₁)、sin/cos(θ₂)，其余用和角公式展开。 */
function deriv(s, o) {
  const t1 = s[0], t2 = s[1], w1 = s[2], w2 = s[3];
  const s1 = Math.sin(t1), c1 = Math.cos(t1);
  const s2 = Math.sin(t2), c2 = Math.cos(t2);
  const sd = s1 * c2 - c1 * s2;          // sin(θ₁−θ₂)
  const cd = c1 * c2 + s1 * s2;          // cos(θ₁−θ₂)
  const s12 = sd * c2 - cd * s2;         // sin(θ₁−2θ₂)
  const D = 4 - 2 * cd * cd;             // L(2m₁+m₂−m₂cos2(θ₁−θ₂)) = 3 − cos2(θ₁−θ₂)
  o[0] = w1;
  o[1] = w2;
  o[2] = (-3 * G * s1 - G * s12 - 2 * sd * (w2 * w2 + w1 * w1 * cd)) / D;
  o[3] = (2 * sd * (2 * w1 * w1 + 2 * G * c1 + w2 * w2 * cd)) / D;
  return o;
}

const _ka = [0,0,0,0], _kb = [0,0,0,0], _kc = [0,0,0,0], _kd = [0,0,0,0], _tw = [0,0,0,0];
function rk4Step(s, h) {
  deriv(s, _ka);
  for (let i = 0; i < 4; i++) _tw[i] = s[i] + h / 2 * _ka[i];
  deriv(_tw, _kb);
  for (let i = 0; i < 4; i++) _tw[i] = s[i] + h / 2 * _kb[i];
  deriv(_tw, _kc);
  for (let i = 0; i < 4; i++) _tw[i] = s[i] + h * _kc[i];
  deriv(_tw, _kd);
  for (let i = 0; i < 4; i++) s[i] += h / 6 * (_ka[i] + 2 * _kb[i] + 2 * _kc[i] + _kd[i]);
}

/* 固定步长子步进：把引擎那一帧的 dt 切成 ceil(dt/h) 段（h ≤ 1/2000 s）。
   引擎已把 dt 钳在 [0, 0.05]，这里再用 SUB_MAX 兜一层，后台切回不会卡死。 */
function advance(s, dt) {
  if (!(dt > 0)) return;
  const n = Math.min(SUB_MAX, Math.max(1, Math.ceil(dt / H_FIX)));
  const h = dt / n;
  for (let i = 0; i < n; i++) rk4Step(s, h);
}

/* 总能量 E = T + V（m=L=1）：算不准多少，读数区常驻公开 */
function energyOf(s) {
  const w1 = s[2], w2 = s[3], cd = Math.cos(s[0] - s[1]);
  return w1 * w1 + 0.5 * w2 * w2 + w1 * w2 * cd - 2 * G * Math.cos(s[0]) - G * Math.cos(s[1]);
}
/* 无量纲能量漂移。分母取「相对静止悬垂多出来的那部分能量」E₀ − E_min，而不是
   E₀ 本身：E₀ 会正好穿过 0（θ ≈ π/2 的种子、页签④ 能量滑杆的上端都会），拿它
   当分母会把一个 10⁻¹⁰ 的误差报成天文数字。E₀ − E_min 才是这场运动真正的能量量程。 */
function driftRel(e, e0) { return Math.abs(e - e0) / Math.max(1e-3, Math.abs(e0 - E_MIN)); }

/* 相空间四维欧氏距离（角度分量先 wrap 到 ±π，否则绕圈会造出假的巨大分离） */
function phaseDist(a, b) {
  return Math.hypot(wrapPI(a[0] - b[0]), wrapPI(a[1] - b[1]), a[2] - b[2], a[3] - b[3]);
}

function bob1(s) { return [LD * Math.sin(s[0]), -LD * Math.cos(s[0])]; }
function bob2(s) { const a = bob1(s); return [a[0] + LD * Math.sin(s[1]), a[1] - LD * Math.cos(s[1])]; }

function expo(x) {
  if (!isFinite(x) || x <= 0) return '0';
  return x.toExponential(1).replace('e+', 'e').replace('e-', 'e−');
}
function expTxt(v) { return expo(Math.pow(10, v)); }
const SUP = { '-12': '⁻¹²', '-10': '⁻¹⁰', '-8': '⁻⁸', '-6': '⁻⁶', '-4': '⁻⁴', '-2': '⁻²', '0': '⁰' };
function supTxt(k) { return SUP[String(k)] || String(k); }

/* ── 四组独立的被积系统 ─────────────────────────────────────
   samples[]（引擎共享历史）只承载页签① 的孪生轨迹；页签②③④ 的
   序列 / 快照 / 截面点各自留在本组里 —— 它们不是「同一个运动的不同测量」，
   而是同一套方程的另外几场实验，混进 samples[] 会让滑窗语义打架。 */
const SIM = {
  seeded: false,
  twin: { a: null, b: null, t: 0, e0: 0, drift: 0, d0: 1e-6, d: 1e-6, round: 0, apartAt: -1 },
  lyap: { ref: null, per: [], ser: [], t: 0, e0: 0, drift: 0, round: 0, samp: 0 },
  ens:  { sys: [], hist: [], t: 0, e0: 0, drift: 0, round: 0, snapAt: -1, len: 0, folds: 0, foldIdx: [] },
  poin: { sys: [], pre: [], pts: null, t: 0, e0: 0, drift: 0, round: 0, cross: 0,
          thMax: 1, w2ref: 1, z: 0, last: null }
};
const SG = { th1: null, th2: null, d0: null, n: null, E: null };
let simClock = 0;

function zEns() { return state.zScale * ENS_ZBOOST; }
function zLyap() { return state.zScale * LYAP_ZF; }
function zOfE(E) { return (E - E_MIN) / (0 - E_MIN) * 6.5; }

function seedTwin() {
  const T = SIM.twin;
  T.a = [state.th1, state.th2, 0, 0];
  T.b = [state.th1, state.th2 + state.logD0, 0, 0];   // state.logD0 已经过 map，存的是 10^v
  T.d0 = phaseDist(T.a, T.b); T.d = T.d0;
  T.t = 0; T.e0 = energyOf(T.a); T.drift = 0; T.round++; T.apartAt = -1;
  samples.length = 0;                                  // 重新播种 = 清空轨迹，而不是偷偷重算历史
}
function seedLyap() {
  const L = SIM.lyap;
  L.ref = [state.th1, state.th2, 0, 0];
  L.per = FAM.map(e => [state.th1, state.th2 + Math.pow(10, e), 0, 0]);
  L.ser = FAM.map(() => []);
  L.t = 0; L.samp = -1; L.e0 = energyOf(L.ref); L.drift = 0; L.round++;
}
function seedEns() {
  const E = SIM.ens, N = Math.max(2, Math.round(state.nEns));
  E.sys = [];
  for (let i = 0; i < N; i++) {
    E.sys.push([state.th1 + (i / (N - 1) - 0.5) * ENS_ARC, state.th2, 0, 0]);
  }
  E.hist = []; E.t = 0; E.snapAt = -1; E.len = ENS_ARC; E.folds = 0; E.foldIdx = [];
  E.e0 = energyOf(E.sys[0]); E.drift = 0; E.round++;
}
function seedPoin(clearPts) {
  const P = SIM.poin, E = state.energy;
  const m = -(E + 2 * G) / G;                          // 截面上可达的 θ₂：cos θ₂ ≥ m
  P.thMax = Math.max(0.02, m <= -1 ? Math.PI * 0.985 : (m >= 1 ? 0.02 : Math.acos(clamp(m, -1, 1))));
  P.w2ref = 2 * Math.sqrt(Math.max(1e-4, E - E_MIN));  // ω₂ 的理论满刻度（θ₂ = 0 处取到）
  P.z = zOfE(E);
  P.sys = []; P.pre = [];
  for (let k = 0; k < NORB; k++) {
    const th2 = P.thMax * (0.16 + 0.80 * k / (NORB - 1));
    const w1 = Math.sqrt(Math.max(1e-6, E - (-2 * G - G * Math.cos(th2))));
    P.sys.push([0, th2, w1, 0]);                       // 种子本身就落在截面上（θ₁ = 0, ω₁ > 0）
    P.pre.push([0, th2, w1, 0]);
  }
  if (clearPts || !P.pts) P.pts = [[], [], [], []];
  P.e0 = E; P.drift = 0; P.t = 0; P.cross = 0; P.last = null; P.round++;
}
function seedAll() { seedTwin(); seedLyap(); seedEns(); seedPoin(true); syncSeedSig(); SIM.seeded = true; }

/* 录制 / 种子重算共用的「把页签① 摆回一轮的起点」。RECORD.seed 与 RECORD.reseed
   都只走这一条路径 —— 两边各写一份，「重算」就不再是重算了（§11.2）。
   用 seedTwin 而不是 seedAll：只有①页可录，重算不该顺手把②③④ 的实验也推倒。
   state.t / simClock 一并归零是必需的，不是顺手：本工具的 dt 是 pushSample 里由
   state.t − simClock 差分出来的，而 (t + 0.02) − t 在 t ≈ 137 时给的是
   0.019999999999990905，在 t = 0 时才正好是 0.02。录制与重算若从不同的 t 起步，
   两条轨迹的步长在末位就不一样，λ ≈ 1.13 s⁻¹ 会在几秒内把它放大到肉眼可见 ——
   比对曲线于是永远对不上，而且看上去像是「跨机器差异」。 */
function recSeedTwin(th1, th2, d0) {
  state.th1 = th1; state.th2 = th2; state.logD0 = d0;
  ['th1', 'th2', 'logD0'].forEach(syncParamSlider);   // 面板回显种子（回放期间它们是置灰的）
  seedTwin();
  syncSeedSig();                                     // 免得下一帧 checkReseed() 又播一次
  state.t = 0; simClock = 0;
}
function syncSeedSig() {
  SG.th1 = state.th1; SG.th2 = state.th2; SG.d0 = state.logD0;
  SG.n = Math.round(state.nEns); SG.E = state.energy;
}
/* 种子改了 = 用户明确要求重新播种（§0.3）：清空轨迹、从新初值重新积分。
   这是显式的、一次性的，不是每帧偷偷重算历史。 */
function checkReseed() {
  const n = Math.round(state.nEns);
  if (state.th1 !== SG.th1 || state.th2 !== SG.th2) { seedTwin(); seedLyap(); seedEns(); }
  else {
    if (state.logD0 !== SG.d0) seedTwin();
    if (n !== SG.n) seedEns();
  }
  if (state.energy !== SG.E) seedPoin(!state.keepE);
  syncSeedSig();
}

function stepTwin(dt) {
  const T = SIM.twin;
  /* 分开之后再留整整一个窗口就重新播种，让「分手」可以反复看 —— 判据是内容
     而不是「跑满一根时间轴」，理由见 TWIN_APART 处的注释。②③ 页同样永不定格，
     只是它们的现象本来就落在一个窗口之内，故用的是窗口判据。 */
  if (T.apartAt >= 0 && T.t - T.apartAt > WAVE_LEN / state.zScale) { seedTwin(); return; }
  advance(T.a, dt); advance(T.b, dt);
  T.t += dt;
  T.d = phaseDist(T.a, T.b);
  if (T.apartAt < 0) {
    const A = bob2(T.a), B = bob2(T.b);
    if (Math.hypot(A[0] - B[0], A[1] - B[1]) > TWIN_APART) T.apartAt = T.t;
  }
  T.drift = Math.max(T.drift, driftRel(energyOf(T.a), T.e0));
}
function stepLyap(dt) {
  const L = SIM.lyap, dts = dt * LYAP_RATE;
  /* 一轮跑满整根时间轴就重新播种：曲线族从左边重新长起来，页签永不定格 */
  if (L.t >= WAVE_LEN / zLyap()) { seedLyap(); return; }
  advance(L.ref, dts);
  for (let k = 0; k < L.per.length; k++) advance(L.per[k], dts);
  L.t += dts;
  L.drift = Math.max(L.drift, driftRel(energyOf(L.ref), L.e0));
  if (L.t - L.samp >= 0.04) {
    L.samp = L.t;
    for (let k = 0; k < L.per.length; k++) {
      L.ser[k].push({ t: L.t, L: Math.log10(Math.max(1e-18, phaseDist(L.ref, L.per[k]))) });
    }
  }
}
function stepEns(dt) {
  const E = SIM.ens;
  if (E.t >= WAVE_LEN / zEns()) { seedEns(); return; }
  for (let i = 0; i < E.sys.length; i++) advance(E.sys[i], dt);
  E.t += dt;
  E.drift = Math.max(E.drift, driftRel(energyOf(E.sys[0]), E.e0));
  if (E.t - E.snapAt >= 0.03) {
    E.snapAt = E.t;
    const st = Math.max(1, Math.ceil(E.sys.length / 48)), arr = [];
    for (let i = 0; i < E.sys.length; i += st) arr.push(wrapPI(E.sys[i][0]), wrapPI(E.sys[i][1]));
    E.hist.push({ t: E.t, p: arr });
  }
  const marks = [], st = filamentStats(E.sys, marks);
  E.len = st.len; E.folds = st.folds; E.foldIdx = marks;
}
function stepPoin(dt) {
  const P = SIM.poin, dts = dt * POIN_RATE;
  if (!(dts > 0)) return;
  const n = Math.min(SUB_MAX, Math.max(1, Math.ceil(dts / H_FIX)));
  const h = dts / n;
  for (let k = 0; k < NORB; k++) {
    const s = P.sys[k], pre = P.pre[k], buf = P.pts[k];
    for (let i = 0; i < n; i++) {
      pre[0] = s[0]; pre[1] = s[1]; pre[2] = s[2]; pre[3] = s[3];
      rk4Step(s, h);
      const a = wrapPI(pre[0]), b = wrapPI(s[0]);
      if (pre[2] > 0 && a < 0 && b >= 0 && b - a < 1) {   // θ₁ 由负穿零且 ω₁ > 0
        const f = -a / (b - a);
        const pt = {
          u: clamp(wrapPI(pre[1] + (s[1] - pre[1]) * f) / P.thMax, -1.05, 1.05) * 1.7,
          w: clamp((pre[3] + (s[3] - pre[3]) * f) / P.w2ref, -1.05, 1.05) * 1.55,
          z: P.z
        };
        buf.push(pt);
        if (buf.length > POIN_CAP) buf.shift();
        P.cross++; P.last = pt;
      }
    }
  }
  P.t += dts;
  P.drift = Math.max(P.drift, driftRel(energyOf(P.sys[0]), P.e0));
}
/* 页签①② 的两组永远在积分（7 个系统，很便宜）；页签③④ 的重负载只在
   本页签激活时推进 —— 否则 N = 120 的系综 + 6 倍速的截面会白烧一半 CPU。 */
function stepSim(dt, replay) {
  if (!SIM.seeded) seedAll();
  /* 回放态：页签① 的孪生系统由存档驱动 —— 引擎的 recStep() 先 restore() 再
     pushSample()，这里若再积一步，画出来的就比 restore 的状态多走一格；更糟的是
     stepTwin 里那条「分开一个窗口就重新播种」的判据会拿存档值触发 seedTwin()，
     当场把回放内容清掉。其余三组一并冻结：回放冻结的是演算，不是观察（§11.7），
     相机 / 视角 / 开关全都照常。判据一律走引擎的 recInfo()，不自拼（§11.7）。 */
  if (replay) return;
  checkReseed();
  stepTwin(dt);
  stepLyap(dt);
  if (curTab === 'ensemble') stepEns(dt);
  if (curTab === 'transition') stepPoin(dt);
}

/* ── 分析 ───────────────────────────────────────────────── */

/* 序列里 log₁₀ δ 首次达到 L 的时刻（线性插值） */
function tAtL(s, L) {
  for (let i = 1; i < s.length; i++) {
    if (s[i].L >= L) {
      const p = s[i-1], q = s[i];
      return p.t + (q.t - p.t) * (L - p.L) / Math.max(1e-12, q.L - p.L);
    }
  }
  return null;
}
/* 公共拟合窗口：暂态之后、饱和之前，且由 δ₀ 最大（最先饱和）的那条定上下界。
   四条曲线必须在同一段轨迹上拟合 —— 各用各的窗口会采到不同时段的有限时间
   λ 涨落，斜率立刻散到 13%（实测），而那不是曲线不平行，是量法不对。 */
function fitWindow(ser0) {
  if (!ser0 || ser0.length < 8) return null;
  const a = tAtL(ser0, ser0[0].L + FIT_LO);
  if (a == null) return null;
  let b = tAtL(ser0, FIT_HI);
  if (b == null) b = ser0[ser0.length - 1].t;
  return (b - a) > 0.5 ? [a, b] : null;
}
/* 在给定窗口上最小二乘拟合 log₁₀ δ 对 t 的斜率；λ = 斜率 × ln10。
   饱和段一旦进了拟合，λ 就是垃圾，所以窗口的上界卡在饱和之前。 */
function fitLam(ser, win) {
  if (!ser || !win) return null;
  let n = 0, st = 0, sl = 0, stt = 0, stl = 0;
  for (let i = 0; i < ser.length; i++) {
    const p = ser[i];
    if (p.t < win[0] || p.t > win[1]) continue;
    n++; st += p.t; sl += p.L; stt += p.t * p.t; stl += p.t * p.L;
  }
  if (n < 6) return null;
  const den = n * stt - st * st;
  if (Math.abs(den) < 1e-12) return null;
  const slope = (n * stl - st * sl) / den;
  return { lam: slope * Math.LN10, slope: slope, b: (sl - slope * st) / n, n: n };
}

/* 丝长与折返次数。折返 = 发夹：切向角沿丝单调转过 ≥ 2 rad 的一段。
   不能用「相邻两段转角 > 110°」去判 —— 110 个点会把一个 180° 的发夹摊成
   每段 2°，逐段阈值一个都数不到（实测眼睛看得见 2 个折叠、计数器报 0）。
   marks（可选）收下每个发夹最尖的那个点号，draw() 拿去打琥珀标记。 */
function filamentStats(sys, marks) {
  const A = [], IDX = [];
  let len = 0, px = null, py = null;
  for (let i = 0; i < sys.length; i++) {
    const x = wrapPI(sys[i][0]), y = wrapPI(sys[i][1]);
    if (px !== null) {
      const dx = x - px, dy = y - py;
      if (Math.abs(dx) < Math.PI && Math.abs(dy) < Math.PI) {
        const seg = Math.hypot(dx, dy);
        len += seg;
        if (seg > 1e-12) { A.push(Math.atan2(dy, dx)); IDX.push(i); }
        else { A.push(null); IDX.push(i); }
      } else { A.push(null); IDX.push(i); }
    }
    px = x; py = y;
  }
  let folds = 0, run = 0, dir = 0, peak = -1, best = 0;
  const close = () => {
    if (Math.abs(run) >= 2.0) { folds++; if (marks && marks.length < 24 && peak >= 0) marks.push(peak); }
    run = 0; peak = -1; best = 0;
  };
  for (let i = 1; i < A.length; i++) {
    if (A[i] === null || A[i-1] === null) { close(); dir = 0; continue; }
    const da = wrapPI(A[i] - A[i-1]);
    const nd = da >= 0 ? 1 : -1;
    if (dir !== 0 && nd !== dir) close();
    dir = nd; run += da;
    if (Math.abs(da) > best) { best = Math.abs(da); peak = IDX[i]; }
  }
  close();
  return { len: len, folds: folds };
}

/* 截面覆盖率：规则轨道落在一条 1 维定线上（在 32×32 格里只占 ~1/n 的格子），
   混沌轨道弥漫成 2 维的海。实测标定（每条约 1000 点）：
     E = −28.6 全规则 → 覆盖 0.049 / 0.061 / 0.075 / 0.096
     E = −16  混合   → 0.290 / 0.245 / 0.026(岛) / 0.249
     E = −5   全混沌 → 0.40 – 0.44
   规则的最大值 0.096 与混沌的最小值 0.245 之间取 0.15 为阈；点太少还没铺开，
   低于 SEC_MIN_N 一律报「取样中」而不是猜。 */
const SEC_GRID = 32, SEC_TH = 0.15, SEC_MIN_N = 300;
function sectionStats() {
  const P = SIM.poin, out = [], N2 = SEC_GRID * SEC_GRID;
  for (let k = 0; k < NORB; k++) {
    const buf = P.pts[k], cells = Object.create(null);
    let c = 0;
    for (let i = 0; i < buf.length; i++) {
      const p = buf[i];
      const gx = Math.floor((p.u / 1.7 * 0.5 + 0.5) * SEC_GRID);
      const gy = Math.floor((p.w / 1.55 * 0.5 + 0.5) * SEC_GRID);
      const key = gx + ',' + gy;
      if (!cells[key]) { cells[key] = 1; c++; }
    }
    const cov = c / N2;
    out.push({ n: buf.length, cov: cov, cls: buf.length < SEC_MIN_N ? 0 : (cov > SEC_TH ? 2 : 1) });
  }
  return out;
}

/* ── 绘制助手（引擎部件之上的薄封装，不改引擎） ─────────────── */

/* 自定义字母轴（引擎 drawAxes 只写 x/y，这里给 θ₁ / θ₂ / log δ / E 定制字母） */
function axis3(C, a, b, letter, lpos) {
  line3(C, a, b, { width: 1.4, color: AXIS });
  arrowAt(C, b, [b[0] + (a[0]-b[0])*0.06, b[1] + (a[1]-b[1])*0.06, b[2] + (a[2]-b[2])*0.06], AXIS);
  label3(C, lpos, letter, { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
}
/* 秒刻度的间隔：时间轴的可见秒数跨了 6.7 s 到 24 s，固定 1 s 会把标签挤成一片 */
function tickStep(v) {
  const span = WAVE_LEN / v, cand = [0.5, 1, 2, 5, 10, 20, 50];
  for (let i = 0; i < cand.length; i++) if (span / cand[i] <= 9) return cand[i];
  return cand[cand.length - 1];
}
/* 时间轴秒刻度（复刻引擎 drawAxes 的 t 轴语汇，但可挂在任意 x 上） */
function secTicks(C, v, px) {
  const stp = tickStep(v);
  for (let k = 1; k * stp * v <= WAVE_LEN + 1e-6; k++) {
    const z = k * stp * v;
    line3(C, [px, -0.06, z], [px, 0.06, z], { width: 1.2, color: AXIS_DIM });
    label3(C, [px, -0.25, z], fmt(k * stp, stp < 1 ? 1 : 0) + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
}
/* 一套双摆：杆 + 上摆锤 + 下摆锤光点，全部用该系统的语义色（六处同源之三、四） */
function drawPend(C, s, c) {
  const p1 = bob1(s), p2 = bob2(s);
  line3(C, [0, 0, 0], [p1[0], p1[1], 0], { width: 2, color: rgba(c, 0.92) });
  line3(C, [p1[0], p1[1], 0], [p2[0], p2[1], 0], { width: 2, color: rgba(c, 0.92) });
  solidDot(C, [p1[0], p1[1], 0], 3.2, rgba(c, 0.95));
  const sp = proj(C, [p2[0], p2[1], 0]);
  if (sp) glowDot(sp, 12, '#ffffff', rgba(c, 0.9));
}
/* 同步开关到 state 与全部同名 checkbox（供视角 onSelect 联动） */
function setTog(key, val) {
  state[key] = val;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = val; });
}
/* 读数区首行：时间 + 常驻的能量漂移（§0.2 —— 这不是瑕疵披露，是课程内容） */
function roHead(tt, drift) {
  return '<div>t = <b>' + fmt(tt) + '</b> s&ensp;·&ensp;|Δ<i>E</i>|/(<i>E</i>₀−<i>E</i><sub>min</sub>) = <b>' + expo(drift) + '</b></div>';
}

     唯一像事件的候选是曲线越过饱和线 SAT_L = 0.3。两个理由否掉它：
     ① 会讲反 —— 画面上那条线自带的标注是「饱和：此后不再有信息」，
        给「信息耗尽」全屏打光，等于把本页最没意义的一段抬成高潮；
     ② 频率过密到荒唐 —— 实测（默认参数、确定性推帧 60 s）：四族合计 **112 次**
        上升沿，平均 0.54 s 一次，最短相邻间隔 0.05 s（3 帧）。原因是饱和后
        log₁₀δ 就在 0.3 附近来回摆，同一条曲线反复穿越。这不是强调，是频闪。
     （60 s 内本页重新播种 7 轮，一轮 WAVE_LEN/(zScale·LYAP_ZF) = 23.8 s 模拟时间，
       LYAP_RATE = 3 倍速 ⇒ 墙上 7.9 s；frameErrors 空。） */
  lyapunov: {
    label: { zh: '指数律', en: 'Exponential law' },
    params: ['th1', 'th2', 'zScale'],
    /* 在动的机制（§8 出路①，无 drive）：参考摆与四个偏差摆同样由 RK4 子步进推进，
       每 0.02 s 记一枚 log₁₀ δ；一族曲线从 z = 0 一路长到时间轴尽头，跑满一轮就
       重新播种（stepLyap 里那行），于是「生长 → 饱和 → 重来」永远循环，不会定格。 */
    brand: { zh: '把分离 δ(t) 取对数画出来：混沌区间里它是一条直线，斜率就是李雅普诺夫指数 λ。一族不同 δ₀ 的曲线彼此平行、且等距。',
             en: 'Plot log δ(t): inside the chaotic stretch it is a straight line whose slope is the Lyapunov exponent λ. A family of different δ₀ gives parallel, evenly spaced lines.' },
    tips: { zh: '提示：初值精度每多买 2 位小数，整族曲线只是整体平移一格，预测时限只增加 2·ln10/λ 秒 —— 想把预测时间翻倍，精度得提高到 e^(λT) 倍。按「log δ · t 侧视」，那族平行等距的直线就是全部论据。',
            en: 'Tip: buying two more decimal digits of precision only shifts the whole family sideways — the prediction horizon grows by just 2·ln10/λ seconds. Doubling the horizon costs a factor of e^(λT) in precision. Snap to "log δ · t": those parallel, evenly spaced lines are the entire argument.' },
    views: {
      iso:  { label: { zh: '立体',           en: '3D' },         az: -0.9,       el: 0.34, dist: 13, tx: 0, ty: 0, tz: 3.4 },
      lat:  { label: { zh: 'log δ · t 侧视', en: 'log δ · t' },   az: -Math.PI/2, el: 0.02, dist: 12, tx: 0, ty: 0, tz: 3.5 }
    },
    toggles: [
      { key: 'fam0',    label: { zh: 'δ₀ = 10⁻⁴',  en: 'δ₀ = 10⁻⁴' },  color: '#fb7185', checked: true },
      { key: 'fam1',    label: { zh: 'δ₀ = 10⁻⁶',  en: 'δ₀ = 10⁻⁶' },  color: '#a78bfa', checked: true },
      { key: 'fam2',    label: { zh: 'δ₀ = 10⁻⁸',  en: 'δ₀ = 10⁻⁸' },  color: '#34d399', checked: true },
      { key: 'fam3',    label: { zh: 'δ₀ = 10⁻¹⁰', en: 'δ₀ = 10⁻¹⁰' }, color: '#fb923c', checked: true },
      { key: 'showFit', label: { zh: '拟合直线 λ', en: 'Fitted slope λ' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',label: { zh: '网格',       en: 'Grid' },        color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.zScale + 0.5,
    draw(C) {
      const v = zLyap(), L = SIM.lyap;
      const yOf = q => clamp((q + 5) * 0.3, -1.95, 1.95);
      if (state.showGrid) {
        for (let q = -10; q <= 0; q += 2) {
          line3(C, [0, yOf(q), 0], [0, yOf(q), WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
          label3(C, [0, yOf(q), -0.35], '10' + supTxt(q), { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
        }
        const stp = tickStep(v);
        for (let k = 1; k * stp * v <= WAVE_LEN + 1e-6; k++) {
          line3(C, [0, -1.9, k*stp*v], [0, 1.9, k*stp*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
        }
      }
      axis3(C, [0, -1.95, 0], [0, 2.05, 0], 'log δ', [0, 2.3, 0]);
      axis3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], 't', [0, 0, WAVE_LEN + 0.9]);
      secTicks(C, v, 0);
      /* 饱和参考线（度量注记 = 琥珀）：越过它 δ 已长到系统尺度，不再有信息 */
      line3(C, [0, yOf(SAT_L), 0], [0, yOf(SAT_L), WAVE_LEN], { width: 1, dash: [5, 6], color: rgba(COL.amber, 0.5) });
      label3(C, [0, yOf(SAT_L) + 0.17, WAVE_LEN * 0.24], t({ zh: '饱和：此后不再有信息', en: 'saturated: no information beyond' }),
        { size: 10.5, color: rgba(COL.amber, 0.9), align: 'center' });

      let fitShown = null;
      const win = fitWindow(L.ser[0]);
      for (let k = 0; k < FAM.length; k++) {
        if (!state['fam' + k]) continue;
        const ser = L.ser[k], c = FAMC[k], xk = (k - 1.5) * 0.22;
        if (ser.length < 2) continue;
        let cut = ser.length;
        for (let i = 0; i < ser.length; i++) { if (ser[i].L > SAT_L) { cut = i; break; } }
        const lin = [], sat = [];
        for (let i = 0; i < cut; i++) lin.push([xk, yOf(ser[i].L), ser[i].t * v]);
        for (let i = Math.max(0, cut - 1); i < ser.length; i++) sat.push([xk, yOf(ser[i].L), ser[i].t * v]);
        if (sat.length > 1) strokePoly(C, sat, { width: 1.6, dash: [4, 5], color: rgba(c, 0.32) });
        if (lin.length > 1) {
          strokePoly(C, lin, { width: 5.5, color: rgba(c, 0.13) });
          strokePoly(C, lin, { width: 2.2, color: rgba(c, 0.95) });
        }
        const last = ser[ser.length - 1];
        const sp = proj(C, [xk, yOf(last.L), last.t * v]);
        if (sp) glowDot(sp, 9, '#ffffff', rgba(c, 0.9));
        label3(C, [xk, yOf(ser[0].L) - 0.02, -1.15], 'δ₀ = 10' + supTxt(FAM[k]),
          { font: 'italic 11.5px ' + FONT_MATH, color: rgba(c, 0.95), align: 'center' });
        const f = fitLam(ser, win);
        if (f && !fitShown) { fitShown = f; fitShown.k = k; }
      }
      if (state.showFit && fitShown) {
        const f = fitShown;
        const t0 = (FAM[f.k] + FIT_LO - f.b) / f.slope, t1 = (FIT_HI - f.b) / f.slope;
        if (isFinite(t0) && isFinite(t1) && t1 > t0) {
          line3(C, [0, yOf(f.slope*t0 + f.b), t0*v], [0, yOf(f.slope*t1 + f.b), t1*v],
            { width: 1.4, dash: [6, 6], color: rgba(COL.amber, 0.8) });
          label3(C, [0, yOf(f.slope*t1 + f.b) + 0.2, t1*v], 'λ = ' + fmt(f.lam) + ' s⁻¹',
            { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        }
      }
      label3(C, [0, -1.75, WAVE_LEN * 0.5], 'log₁₀ δ(t) = log₁₀ δ₀ + (λ/ln10)·t',
        { font: 'italic 12.5px ' + FONT_MATH, color: 'rgba(159,176,200,.75)', align: 'center' });
    },
    readout() {
      const L = SIM.lyap, cls = ['sinC', 'cosC', 'tanC', 'cotC'];
      const win = fitWindow(L.ser[0]);
      let out = roHead(L.t, L.drift), lams = [];
      for (let k = 0; k < FAM.length; k++) {
        const f = fitLam(L.ser[k], win);
        if (f) lams.push(f.lam);
        out += '<div class="' + cls[k] + '">δ₀ = 10' + supTxt(FAM[k]) + '&ensp;λ = <b>' +
          (f ? fmt(f.lam) + ' s⁻¹' : '—') + '</b></div>';
      }
      const lam = lams.length ? lams.reduce((a, b) => a + b, 0) / lams.length : 0;
      const spread = lams.length > 1 ? (Math.max.apply(null, lams) - Math.min.apply(null, lams)) : 0;
      out += '<div class="ambC">' + t({ zh: '倍增时间 ', en: 'doubling time ' }) + 'ln2/λ = <b>' +
        (lam > 0 ? fmt(Math.LN2 / lam) + ' s' : '—') + '</b></div>';
      out += '<div class="dim">' + (lam > 0
        ? t({ zh: '再多买 1 位小数 = 多 ' + fmt(Math.LN10 / lam) + ' s 预测', en: 'one more decimal digit = ' + fmt(Math.LN10 / lam) + ' s more forecast' })
        : t({ zh: '拟合中…', en: 'fitting…' })) +
        '&ensp;·&ensp;' + t({ zh: '斜率离散 ', en: 'slope spread ' }) + expo(spread) + '</div>';
      return out;
    }
  },

  /* ══════ 页签 3 · 初值扇面：拉伸与折叠 ══════ */
  /* 金光闪（§4.7）：本页有意不加 —— 属「量本身会晃」。本页画的是一段初值弧被拉成长丝、
     再被相空间的有界性折回来。tips 说的是「拉伸与折叠同时发生」，这是一个持续的过程，
     不是一个时刻：丝每一帧都在被拉长（E.len 单调增），也每一帧都可能正在折。
     唯一可数的候选是折返次数 E.folds（readout 自己就写成「折返次数 ≈」，那个约等号
     不是谦虚）。它由 filamentStats() **每帧从零重算**的启发式给出 —— 沿丝扫方向翻转、
     累计位移过 2.0 rad 才记一折 —— 所以在临界发夹处它会来回跳。
     实测（默认参数、确定性推帧 60 s）：E.folds **上跳 63 次、下跳 37 次**
     （每轮 8.77 s 里典型序列 0→1→0→1→2→3→4→3→4→5→6→5→6→5→4→5，然后重新播种）。
     按上升沿闪就是 63 次 / 60 s ≈ 每 0.95 s 一次，而且其中近四成是同一次折返
     在阈值上抖回来又抖过去 —— 既是频闪，又是给一个估计量的抖动打光。
     与 π 工具的投针页同一类：另一侧的结论没错，不代表这一刻发生了什么。
     （frameErrors 空。） */
  ensemble: {
    label: { zh: '拉伸与折叠', en: 'Stretch & fold' },
    params: ['th1', 'th2', 'nEns', 'zScale'],
    /* 在动的机制（§8 出路①，无 drive）：N 个初值同步被 RK4 推进，丝在相平面里
       被拉长再折回；跑满一根时间轴（stepEns 里的 WAVE_LEN / zEns()）就重新播种，
       于是「一小段弧 → 长丝 → 折叠 → 絮」这一轮反复循环上演，永不定格。
       nEns 与 th1/th2 是种子，绝不加 drive：改动它们 = 重新播种。 */
    brand: { zh: '在初值空间的一小段弧上撒 N 个几乎相同的初值，同步积分。看这段弧被拉伸成长丝、被相空间的有界性折叠回来，反复几次后扒成一团絮。',
             en: 'Sprinkle N nearly identical initial conditions along a tiny arc and integrate them together. Watch the arc stretch into a filament, fold back because phase space is bounded, and after a few rounds shred into a wisp.' },
    tips: { zh: '提示：混沌不是「乱」，是两件很规矩的事同时发生 —— 拉伸让邻居分开，折叠让它们回不到无穷远。只有拉伸是发散，只有折叠是周期，两个一起才是混沌。按「相平面 θ₁·θ₂ 正视」，看折叠发生的那一下。',
            en: 'Tip: chaos is not "messiness" — it is two very orderly things happening at once. Stretching pulls neighbours apart; folding keeps them from escaping to infinity. Stretching alone diverges, folding alone is periodic; only together is it chaos. Snap to "Phase θ₁·θ₂" to catch the fold as it happens.' },
    views: {
      iso:   { label: { zh: '立体',            en: '3D' },          az: -0.9,       el: 0.33, dist: 12,  tx: 0, ty: 0, tz: 3.2, onSelect() { setTog('showSheet', true); setTog('showArc', true); } },
      /* 沿 z 轴正视时，凡是有 z 跨度的东西都会被透视放大到失真，所以这个视角
         自动只留 z = 0 的当前丝：演化面与初值弧关掉（§5.3 的视角联动）。 */
      phase: { label: { zh: '相平面 θ₁·θ₂ 正视', en: 'Phase θ₁·θ₂' }, az: 0.001,      el: 0.02, dist: 6.4, tx: 0, ty: 0, tz: 0,   onSelect() { setTog('showSheet', false); setTog('showArc', false); setTog('showFil', true); } },
      top:   { label: { zh: '丝 θ₁·t 俯视',     en: 'Filament θ₁·t' }, az: -Math.PI/2, el: 1.5,  dist: 12,  tx: 0, ty: 0, tz: 3.4, onSelect() { setTog('showSheet', true); } }
    },
    toggles: [
      { key: 'showFil',   label: { zh: '当前丝',     en: 'Filament now' },   color: '#fb7185', checked: true },
      { key: 'showSheet', label: { zh: '时间演化面', en: 'Evolution sheet' },color: '#a78bfa', checked: true },
      { key: 'showArc',   label: { zh: '初值弧',     en: 'Seed arc' },       color: '#2dd4ea', checked: true },
      { key: 'showFolds', label: { zh: '折返标记',   en: 'Fold marks' },     color: '#fbbf24', checked: true },
      { key: 'showGrid',  label: { zh: '网格',       en: 'Grid' },           color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / state.zScale + 0.5,
    draw(C) {
      const v = zEns(), E = SIM.ens, R = Math.PI * SXY;
      if (state.showGrid) {
        for (let i = -2; i <= 2; i++) {
          if (i === 0) continue;
          line3(C, [i*R/2, -R, 0], [i*R/2, R, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
          line3(C, [-R, i*R/2, 0], [R, i*R/2, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
        }
        strokePoly(C, [[-R,-R,0],[R,-R,0],[R,R,0],[-R,R,0],[-R,-R,0]], { width: 1, color: 'rgba(148,163,184,0.16)' });
      }
      axis3(C, [-R-0.15, 0, 0], [R+0.15, 0, 0], 'θ₁', [R + 0.38, 0, 0]);
      axis3(C, [0, -R-0.15, 0], [0, R+0.15, 0], 'θ₂', [0, R + 0.32, 0]);
      axis3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], 't', [0, 0, WAVE_LEN + 0.9]);
      secTicks(C, v, 0);

      /* 时间演化面：每枚快照一条淡紫折线，越旧越隐（§1.2 渐隐尾档位） */
      if (state.showSheet) {
        for (let h = 0; h < E.hist.length; h++) {
          const sn = E.hist[h], z = (E.t - sn.t) * v;
          const a = clamp(0.30 - 0.26 * (z / WAVE_LEN), 0.04, 0.30);
          const pts = [];
          let lx = null, ly = null;
          for (let i = 0; i < sn.p.length; i += 2) {
            const x = sn.p[i] * SXY, y = sn.p[i+1] * SXY;
            if (lx !== null && (Math.abs(x - lx) > R || Math.abs(y - ly) > R)) pts.push(null);
            pts.push([x, y, z]); lx = x; ly = y;
          }
          strokePoly(C, pts, { width: 1.1, color: rgba(COL.violet, a) });
        }
      }
      /* 初值弧：源几何 = 青（它就是被演示的那个"种子"） */
      if (state.showArc && E.hist.length) {
        const sn = E.hist[0], z = (E.t - sn.t) * v, pts = [];
        for (let i = 0; i < sn.p.length; i += 2) pts.push([sn.p[i]*SXY, sn.p[i+1]*SXY, z]);
        strokePoly(C, pts, { width: 3, color: rgba(COL.cyan, 0.95) });
        const sp = proj(C, pts[Math.floor(pts.length/2)]);
        if (sp) glowDot(sp, 8, '#ffffff', rgba(COL.cyan, 0.9));
      }
      /* 当前丝 */
      if (state.showFil) {
        const pts = []; let lx = null, ly = null;
        for (let i = 0; i < E.sys.length; i++) {
          const x = wrapPI(E.sys[i][0]) * SXY, y = wrapPI(E.sys[i][1]) * SXY;
          if (lx !== null && (Math.abs(x - lx) > R || Math.abs(y - ly) > R)) pts.push(null);
          pts.push([x, y, 0]); lx = x; ly = y;
        }
        strokePoly(C, pts, { width: 5.5, color: rgba(COL.rose, 0.13) });
        strokePoly(C, pts, { width: 2.4, color: rgba(COL.rose, 0.95) });
        /* 折返标记：度量注记一律琥珀（点号由 filamentStats 一并算出，同源不二算） */
        if (state.showFolds && E.foldIdx) {
          for (let j = 0; j < E.foldIdx.length; j++) {
            const s = E.sys[E.foldIdx[j]];
            if (s) solidDot(C, [wrapPI(s[0]) * SXY, wrapPI(s[1]) * SXY, 0], 2.8, rgba(COL.amber, 0.9));
          }
        }
      }
      label3(C, [0, -R - 0.3, WAVE_LEN * 0.5],
        t({ zh: '拉伸让邻居分开 · 折叠让它们回不到无穷远', en: 'stretching separates neighbours · folding keeps them bounded' }),
        { size: 11, color: 'rgba(159,176,200,.55)', align: 'center' });
      label3(C, [R - 0.05, R - 0.12, 0.15], 'N = ' + E.sys.length,
        { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'right' });
    },
    readout() {
      const E = SIM.ens;
      return roHead(E.t, E.drift) +
        '<div class="cyanC">' + t({ zh: '初始弧长 ', en: 'seed arc ' }) + '= <b>' + ENS_ARC.toFixed(3) + '</b> rad</div>' +
        '<div class="sinC">' + t({ zh: '当前丝长 ', en: 'filament ' }) + '= <b>' + fmt(E.len) + '</b> rad</div>' +
        '<div class="cosC">' + t({ zh: '丝长 / 初始 ', en: 'stretch ratio ' }) + '= <b>' + expo(E.len / ENS_ARC) + '</b></div>' +
        '<div class="ambC">' + t({ zh: '折返次数 ≈ ', en: 'folds ≈ ' }) + '<b>' + E.folds + '</b></div>' +
        '<div class="dim">N = ' + E.sys.length + '&ensp;·&ensp;' +
          t({ zh: '第 ' + E.round + ' 轮 · 本轮已演化 ' + fmt(E.t) + ' s', en: 'round ' + E.round + ' · ' + fmt(E.t) + ' s into it' }) + '</div>';
    }
  },

  /* ══════ 页签 4 · 从可积到混沌：庞加莱截面 ══════ */
  /* 金光闪（§4.7）：本页有意不加 —— 属「闪了会把结论讲反」。本页 tips 的第一句就是
     「混沌不是开关，是渗透」。全屏一闪的语义恰恰是开关：某一刻之前不是，之后是。
     两个候选都正对着这句话作对：
     ① `cov > SEC_TH`（SEC_TH = 0.15，sectionStats 用它把轨道印成「规则 / 混沌」）。
        那个 0.15 是作者为了印一个标签取的分界，闪它等于宣布「这里就是开关」。
        而且它连事件都算不上：覆盖率随点数单调爬升，越线时刻只反映**采样跑了多久**。
        实测（默认 E = −16、确定性推帧 60 s）：四条轨道要等缓冲攒过 SEC_MIN_N = 300
        才开始分类，于是三次「规则 → 混沌」全挤在 t = 52.10 / 53.25 / 55.53 s，
        cov 恰好各自爬过 0.150；再跑下去它们只会继续涨（终值 0.158 / 0.160 / 0.166）。
        换句话说这一闪报的是「点收够了」，不是「这条轨道变混沌了」——它一直是混沌的。
     ② 能量滑到 E_FLIP = −9.81（页面确实画了这条琥珀虚线）。它是外臂能翻过顶点的
        最低能量，是个真数学值，但它不是混沌的起点：默认 E = −16 远在它之下，
        截面上就已经有混沌海了。给它打光会被直接读成「混沌从这里开始」。
     真要给这一页找一闪，得先有一个「渗透完成」的数 —— 本页没有定义这样的数，
     也不该为了闪一下而现造一个。（frameErrors 空。） */
  transition: {
    label: { zh: '可积到混沌', en: 'Onset of chaos' },
    params: ['energy'],
    /* 在动的机制（§8 出路①，无 drive）：四条轨道以 POIN_RATE = 10 倍速被 RK4 推进，
       每次 θ₁ 由负穿零且 ω₁ > 0 就往截面上打一个点（约 40 点/秒）；每条轨道的缓冲是

        ' rad&ensp;·&ensp;' + t({ zh: 'ω₂ 满刻度 ±', en: 'ω₂ full scale ±' }) + fmt(P.w2ref) + ' rad/s</div>';
