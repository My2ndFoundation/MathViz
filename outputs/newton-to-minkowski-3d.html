  从牛顿到闵可夫斯基：时空的重建 · 交互式数学可视化
  基于 math-viz-starter.html v1.0.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）

  坐标约定（与前作 spacetime-light-cone-3d 一致，务必先读）：
    x, y = 两个空间维；z = ct，取 c = 1，故光的世界线斜率恰 1（45°）。
    引擎的「z 是时间轴」在这里字面成立，但这是**时空图上的几何时间**，
    不是历史采样流。samples[] 不参与作图：整张图每帧由参数直接重新生成，
    所以 pushSample() 只记 t，保持最小实现（规范 §4.6 的「历史存当时真实值」
    不受影响——本工具没有需要保真的历史波形）。
    页签②⑤的两张函数图不是时空图，画在 x–y 平面（z = 0）上，故其顿悟视角
    是「正视 x·y」而非侧视。

  与前作的分工：前作从「c 不变」这条公理出发讲光锥的几何；本工具讲公理之前
    的那一段——牛顿的平直时空、它在哪里裂开、度规里那个负号怎么被逼出来。
    前作页签①（闪光生锥）问「闪光圆的圆心动不动」，本工具页签②问「追光者
    测到的光速是多少、两套速度叠加律何时分家」，画面与问题都不重复。

  核心二次型：Q_ε = (ct)² + ε(x² + y²)。ε 由滑杆直接控制：
    ε = +1 四维欧氏（等值面球面，零集只有一个点）
    ε =  0 退化（等值面一对水平平面，零集是整个 ct = 0 平面 = 牛顿的绝对同时）
    ε = −1 闵可夫斯基（等值面双曲面，零集是 45° 双锥 = 光锥）
  光的世界线 r = ct 上 Q_ε = (1 + ε)(ct)²，要它恒为零只有 ε = −1 这一个解。

  五个页签共享同一份 state（同一个宇宙，不同的追问）：
    牛顿的平直时空 —— 绝对同时把时空切成一叠水平切片，伽利略变换只敢推倒世界线
                     顿悟视角：「x·ct 侧视」= 世界线来回歪、同时面纹丝不动
    速度叠加的裂缝 —— 那条「光速恒为 1」的水平线就是相对论的全部输入
                     顿悟视角：「u·结果 正视」= 两条叠加曲线在高速端分道扬镳
    符号的诞生     —— 拖 ε 走一遍：球 → 一对平面 → 锥；负号是被逼出来的
                     顿悟视角：「x·ct 侧视」= 等值面剖面与零集同时形变
    重建：剪切→双曲旋转 —— 三种「旋转」并排，同一个 β 下各自保住什么
                     顿悟视角：「x·ct 侧视」= 圆 / 水平线 / 双曲线同框
    γ 什么时候接管 —— 八个数量级的对数扫描，牛顿力学的有效边界看得见
                     顿悟视角：「log–log 正视」= β²/2 渐近直线与 β→1 发散同框

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'newton-to-minkowski-3d',
  title: { zh: '从牛顿到闵可夫斯基 · 时空的重建', en: 'Newton to Minkowski · Rebuilding Spacetime' },
  h1:    { zh: '从牛顿到闵可夫斯基', en: 'Newton to Minkowski' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

const TAU = Math.PI * 2;

/* ================= 本工具的世界常量与语义色 ================= */
const CT_MAX = 4.2;      // ct 方向的绘制半长（世界单位）
const R_MAX  = 4.2;      // 空间方向的绘制半径
const CT_TOP = 4;        // 页签①：同时面叠到 ct = 4

/* 曲线语义色，启用顺序 rose → violet → emerald → orange；
   cyan = 源几何 / 结构（页签①的绝对同时面）；
   amber = 度量注记——光的世界线与光锥是**尺子**，不是数据曲线（规范 §1.1）。 */
const C_ROSE = '#fb7185', C_VIOLET = '#a78bfa', C_EMERALD = '#34d399', C_ORANGE = '#fb923c';
const C_AMBER = '#fbbf24', C_CYAN = '#2dd4ea';

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
/* |值| > 999 显示 ±∞（规范 §7）；γ 在 β→±1 时会炸开 */
function fmtInf(x, d) {
  if (!isFinite(x) || Math.abs(x) > 999) return (x < 0 ? '−∞' : '+∞');
  return fmtS(x, d == null ? 2 : d);
}
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sup(n) { return String(n).split('').map(c => SUP[c] || c).join(''); }
/* 科学计数法：页签⑤跨八个数量级，两位小数装不下 */
function fmtSci(x, d) {
  if (!isFinite(x)) return '∞';
  if (x === 0) return '0';
  const s = x < 0 ? '−' : '';
  const ax = Math.abs(x);
  const e = Math.floor(Math.log10(ax));
  return s + (ax / Math.pow(10, e)).toFixed(d == null ? 2 : d) + '×10' + sup(e);
}
/* β 的通用显示：低速端用科学计数法，高速端用定点（0.999 这种要看清小数位） */
function fmtBeta(b) { return b >= 0.01 ? fmt(b, b > 0.99 ? 6 : 4) : fmtSci(b); }

const gammaOf = b => 1 / Math.sqrt(Math.max(1e-12, 1 - b * b));

/* 页签⑤要在 β = 10⁻⁸ 处读 γ − 1 ≈ 5×10⁻¹⁷ —— 直接写 gammaOf(b) − 1 会被双精度
   的灾难性相消吃掉（画出来是一条锯齿噪声）。下面三个量都改用**解析化简后**的
   等价表达式，分母不再出现 1 − 1 的相消（s = √(1−β²)）：
     γ − 1        = β²/(s(1+s))
     1 − 1/γ      = β²/(1+s)
     动能相对偏差  = [(γ−1) − β²/2]/(β²/2) = β²(s+2)/(s(1+s)²)   →  β→0 时趋于 (3/4)β²
   三式在 β → 0 与 β → 1 两端都稳定，且与原式恒等（可用 β = 0.1 核对：
   γ−1 = 0.00503782、动能偏差 = 0.0075631）。 */
function gm1Of(b) { const u = b * b, s = Math.sqrt(Math.max(1e-12, 1 - u)); return u / (s * (1 + s)); }
function conOf(b) { const u = b * b, s = Math.sqrt(Math.max(1e-12, 1 - u)); return u / (1 + s); }
function keDevOf(b) { const u = b * b, s = Math.sqrt(Math.max(1e-12, 1 - u)); return u * (s + 2) / (s * (1 + s) * (1 + s)); }
/* 百分比：0.001% 以上用定点，更小才退到科学计数法（读数区不该总是一串 ×10ⁿ） */
function fmtPct(p) { return (Math.abs(p) >= 0.001 ? fmt(p, 3) : fmtSci(p, 3)) + '%'; }
/* 同理的纯数版本：跨八个数量级的量，大的写定点、小的写科学计数法 */
function fmtSmall(x) { return Math.abs(x) >= 0.001 ? fmt(x, 4) : fmtSci(x, 3); }

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 关于 beta：这里是**线性 β**，不是前作 spacetime-light-cone-3d 的快度。
   前作页签⑤要事件沿双曲线匀速滑，那需要快度 φ = artanh β 匀速增长；本工具
   页签④要把伽利略剪切与洛伦兹推动放在**同一个 β**下并排比较（差别正是
   γ − 1 那一点点），线性 β 才是对的参数化。请勿"修正"成快度。
   关于 logBeta：滑杆刻度是 log₁₀β（八个数量级），state 里存的是 β 本身，
   由 map/invMap 双向换算。§8 硬约束：带 map 必须同时带 invMap；drive 的
   [from,to] 要落在映射后的 [10⁻⁸, 10⁻⁰·⁰⁰⁰⁴] = [1e−8, 0.9990794] 内。 */
const PARAMS = [

    min: 0.5, max: 4, step: 0.02, value: 2.25, fmt: v => fmt(v) },
  { key: 'uB',      label: { zh: '第二个速度 <i>u</i>', en: 'Second speed <i>u</i>' },

/* ================= 场景级绘制部件（引擎之上的一层，引擎本身零改动） ================= */

/* 时空坐标轴：x、y 是空间，z 轴写作 ct（引擎的 drawAxes 把 z 标成 t，
   且量程绑死 WAVE_LEN，这里另起一份而不是去改引擎——规范"引擎 diff = 0"）。 */
function drawStAxes(C, o) {
  o = o || {};
  const ex = o.ex != null ? o.ex : R_MAX;
  const ez = o.ez != null ? o.ez : CT_MAX;
  const z0 = o.zMin != null ? o.zMin : -ez;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.3, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.yAxis !== false) {
    line3(C, [0, -ex, 0], [0, ex, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [0, ex, 0], [0, ex - 0.2, 0], AXIS);
    label3(C, [0, ex + 0.26, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  }
  line3(C, [0, 0, z0], [0, 0, ez], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 0, ez], [0, 0, ez - 0.2], AXIS);
  label3(C, [0, 0, ez + 0.34], 'ct', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (let k = Math.ceil(z0); k <= Math.floor(ez); k++) {
    if (k === 0) continue;
    line3(C, [-0.07, 0, k], [0.07, 0, k], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.2, 0, k], (k < 0 ? '−' : '') + Math.abs(k), { size: 10, color: 'rgba(159,176,200,.6)', align: 'right' });
  }
  for (let k = -Math.floor(ex); k <= Math.floor(ex); k++) {
    if (k === 0) continue;
    line3(C, [k, 0, -0.07], [k, 0, 0.07], { width: 1.2, color: AXIS_DIM });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* x–ct 平面的网格（闵氏图的方格纸） */
function drawXCTGrid(C, gx, gz) {
  for (let i = -gx; i <= gx; i++) {
    if (i === 0) continue;
    line3(C, [i, 0, -gz], [i, 0, gz], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
  for (let k = -gz; k <= gz; k++) {
    if (k === 0) continue;
    line3(C, [-gx, 0, k], [gx, 0, k], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 光锥（琥珀 = 度量注记）。o = { ez, zMin, alpha, rulings } */
function drawLightCone(C, o) {
  o = o || {};
  const ez = o.ez != null ? o.ez : CT_MAX;
  const zMin = o.zMin != null ? o.zMin : -ez;
  const a = o.alpha != null ? o.alpha : 1;
  const NR = o.rulings != null ? o.rulings : 12;
  const sides = zMin < 0 ? [1, -1] : [1];
  for (const s of sides) {
    const L = s > 0 ? ez : Math.min(ez, -zMin);
    for (let i = 0; i < NR; i++) {
      const a0 = i / NR * TAU;
      line3(C, [0, 0, 0], [L * Math.cos(a0), L * Math.sin(a0), s * L],
        { width: 1.2, color: rgba(C_AMBER, (s > 0 ? 0.28 : 0.18) * a) });
    }
    for (let k = 1; k <= Math.floor(L); k++) {
      const pts = [];
      for (let j = 0; j <= 56; j++) {
        const a1 = j / 56 * TAU;
        pts.push([k * Math.cos(a1), k * Math.sin(a1), s * k]);
      }
      strokePoly(C, pts, { width: 1.2, color: rgba(C_AMBER, (s > 0 ? 0.38 : 0.26) * a) });
    }
    /* x–ct 剖面上的两条母线画亮：侧视时就是教科书那个 45° 的 X */
    for (const sx of [1, -1]) {
      line3(C, [0, 0, 0], [sx * L, 0, s * L], { width: 1.8, color: rgba(C_AMBER, 0.9 * a) });
    }
  }
}

/* ---------- 二维函数图框（页签②⑤）：贴在 x–y 平面 z = 0 上 ----------
   这两页画的是函数曲线，不是时空图，所以顿悟视角是「正视 x·y」。
   数据坐标 (u, v) → 世界坐标 (x, y, 0)。 */
function mkFrame(x0, y0, w, h, u0, u1, v0, v1) {
  return { x0: x0, y0: y0, w: w, h: h, u0: u0, u1: u1, v0: v0, v1: v1 };
}
function fp(F, u, v) {
  return [F.x0 + (u - F.u0) / (F.u1 - F.u0) * F.w,
          F.y0 + (v - F.v0) / (F.v1 - F.v0) * F.h, 0];
}
/* 采样一条 v = f(u) 的曲线；越出框外的点写成 null 断点（规范 §6 奇点处理） */
function fcurve(F, u0, u1, n, f) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = u0 + (u1 - u0) * i / n;
    const v = f(u);
    if (v == null || !isFinite(v) || v < F.v0 || v > F.v1) { pts.push(null); continue; }
    pts.push(fp(F, u, v));
  }
  return pts;
}
/* 框的坐标轴 + 刻度 + 轴名。o = { xTicks:[{u,label}], yTicks:[{v,label}], xName, yName, grid } */
function drawFrameAxes(C, F, o) {
  o = o || {};
  const vb = o.vBase != null ? o.vBase : F.v0;
  if (o.grid) {
    (o.xTicks || []).forEach(tk => {
      line3(C, fp(F, tk.u, F.v0), fp(F, tk.u, F.v1), { width: 1, color: 'rgba(148,163,184,0.06)' });
    });
    (o.yTicks || []).forEach(tk => {
      line3(C, fp(F, F.u0, tk.v), fp(F, F.u1, tk.v), { width: 1, color: 'rgba(148,163,184,0.06)' });
    });
  }
  line3(C, fp(F, F.u0, vb), fp(F, F.u1, vb), { width: 1.4, color: AXIS });
  arrowAt(C, fp(F, F.u1, vb), fp(F, F.u1 - (F.u1 - F.u0) * 0.03, vb), AXIS);
  line3(C, fp(F, F.u0, F.v0), fp(F, F.u0, F.v1), { width: 1.4, color: AXIS });
  arrowAt(C, fp(F, F.u0, F.v1), fp(F, F.u0, F.v1 - (F.v1 - F.v0) * 0.03), AXIS);
  (o.xTicks || []).forEach(tk => {
    const p = fp(F, tk.u, vb);
    line3(C, [p[0], p[1] - 0.06, 0], [p[0], p[1] + 0.06, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [p[0], p[1] - 0.24, 0], tk.label, { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  });
  (o.yTicks || []).forEach(tk => {
    const p = fp(F, F.u0, tk.v);
    line3(C, [p[0] - 0.06, p[1], 0], [p[0] + 0.06, p[1], 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [p[0] - 0.13, p[1], 0], tk.label, { size: 10, color: 'rgba(159,176,200,.6)', align: 'right' });
  });
  if (o.xName) {
    const p = fp(F, F.u1, vb);
    label3(C, [p[0] + 0.1, p[1] - 0.26, 0], o.xName, { size: 11.5, color: 'rgba(159,176,200,.85)', align: 'left' });
  }
  if (o.yName) {
    const p = fp(F, F.u0, F.v1);
    label3(C, [p[0], p[1] + 0.26, 0], o.yName, { size: 11.5, color: 'rgba(159,176,200,.85)', align: 'center' });
  }
}
/* 曲线在框里的标准画法：外辉光 + 内核（规范 §4.2） */
function strokeFcurve(C, pts, hex) {
  strokePoly(C, pts, { width: 5.5, color: rgba(hex, 0.13) });
  strokePoly(C, pts, { width: 2.2, color: rgba(hex, 0.95) });
}
/* 当前值的头部光点 + 投影虚线（六处同源的第 3、4 处） */
function frameMark(C, F, u, v, hex, guides) {
  if (!isFinite(v) || v < F.v0 || v > F.v1) return;
  const P = fp(F, u, v);
  if (guides) {
    line3(C, P, fp(F, u, F.v0), { width: 1.5, dash: [7, 7], color: rgba(hex, 0.5) });
    line3(C, P, fp(F, F.u0, v), { width: 1.5, dash: [7, 7], color: rgba(hex, 0.5) });
  }
  const s = proj(C, P);
  if (s) glowDot(s, 9, '#ffffff', rgba(hex, 0.9));
}

/* ---------- 页签①：牛顿的绝对同时面（cyan = 结构色） ---------- */
function drawSlices(C, half) {
  for (let k = 0; k <= CT_TOP; k++) {
    const a = k === 0 ? 0.55 : 0.34;
    const sq = [[-half, -half, k], [half, -half, k], [half, half, k], [-half, half, k], [-half, -half, k]];
    strokePoly(C, sq, { width: 1.6, color: rgba(C_CYAN, a) });
    for (let i = -2; i <= 2; i++) {
      if (i === 0) continue;
      const u = i * half / 3;
      line3(C, [u, -half, k], [u, half, k], { width: 1, color: rgba(C_CYAN, 0.10) });
      line3(C, [-half, u, k], [half, u, k], { width: 1, color: rgba(C_CYAN, 0.10) });
    }
  }
}
/* 页签①的三条世界线：S 系速度 v，画在以 β 运动的参考系里 ⇒ 显示斜率 v − β
   （伽利略变换 x′ = x − β·ct, t′ = t：只推倒世界线，不碰同时面） */
const NEWTON_LINES = [
  { key: 'showRest',  v: 0,     hex: C_ROSE,    cls: 'c1', tag: { zh: '静止者 v = 0', en: 'at rest, v = 0' } },
  { key: 'showMoveA', v: 0.45,  hex: C_VIOLET,  cls: 'c2', tag: { zh: '匀速者 v = +0.45', en: 'uniform, v = +0.45' } },
  { key: 'showMoveB', v: -0.30, hex: C_EMERALD, cls: 'c3', tag: { zh: '反向匀速者 v = −0.30', en: 'opposite, v = −0.30' } }
];

/* ---------- 页签③：Q_ε = (ct)² + ε(x² + y²) 的等值面与零集 ----------
   三条曲面生成器都按「ε 连续过零」写，ε = 0 时退化成一对水平平面 / 整个
   ct = 0 平面，既不发散也不消失（这是本页的关键：退化情形正是牛顿时空）。 */
const EPS0 = 1e-3;                       // 判 ε 是否已到"零号"的阈值
function qOf(e, x, y, ct) { return ct * ct + e * (x * x + y * y); }

/* Q = +|Q| 的等值面（rose）：ct = ±√(L − ε r²)
   ε > 0 时 r ≤ √(L/ε) —— 球面（被画框裁的椭球）；ε = 0 时 ct = ±√L —— 一对
   水平平面；ε < 0 时对一切 r 有解 —— 双叶双曲面。一个公式贯穿三种几何。 */
function drawLevelPlus(C, e, L) {
  const N = 44;
  for (let m = 0; m < 6; m++) {                       // 经线族（3D 骨架）
    const a0 = m / 6 * Math.PI, ca = Math.cos(a0), sa = Math.sin(a0);
    for (const sg of [1, -1]) {
      const pts = [];
      for (let i = -N; i <= N; i++) {
        const r = R_MAX * i / N;
        const val = L - e * r * r;
        if (val < 0) { pts.push(null); continue; }
        const ct = sg * Math.sqrt(val);
        if (Math.abs(ct) > CT_MAX) { pts.push(null); continue; }
        pts.push([r * ca, r * sa, ct]);
      }
      strokePoly(C, pts, { width: 1.1, color: rgba(C_ROSE, 0.20) });
    }
  }
  if (Math.abs(e) < EPS0) {                           // 退化：一对水平平面，用同心圆表达"面"
    for (const sg of [1, -1]) {
      for (let k = 1; k <= 4; k++) {
        const pts = [];
        for (let j = 0; j <= 56; j++) { const a1 = j / 56 * TAU; pts.push([k * Math.cos(a1), k * Math.sin(a1), sg * Math.sqrt(L)]); }
        strokePoly(C, pts, { width: 1.1, color: rgba(C_ROSE, 0.22) });
      }
    }
  } else {                                            // 等 ct 的截面圆：r² = (L − ct²)/ε
    for (let i = -8; i <= 8; i++) {
      const ct = i * 0.5;
      const r2 = (L - ct * ct) / e;
      if (!(r2 > 0.02)) continue;
      const r = Math.sqrt(r2);
      if (r > R_MAX) continue;
      const pts = [];
      for (let j = 0; j <= 56; j++) { const a1 = j / 56 * TAU; pts.push([r * Math.cos(a1), r * Math.sin(a1), ct]); }
      strokePoly(C, pts, { width: 1.1, color: rgba(C_ROSE, 0.22) });
    }
  }
  for (const sg of [1, -1]) {                         // x–ct 剖面亮线：侧视时的主角
    const pts = [];
    for (let i = -80; i <= 80; i++) {
      const x = R_MAX * i / 80;
      const val = L - e * x * x;
      if (val < 0) { pts.push(null); continue; }
      const ct = sg * Math.sqrt(val);
      if (Math.abs(ct) > CT_MAX) { pts.push(null); continue; }
      pts.push([x, 0, ct]);
    }
    strokePoly(C, pts, { width: 5.5, color: rgba(C_ROSE, 0.13) });
    strokePoly(C, pts, { width: 2.2, color: rgba(C_ROSE, 0.95) });
  }
}

/* Q = −|Q| 的等值面（violet）：r² = (L + (ct)²)/|ε|，只有 ε < 0 才存在。
   ε → 0⁻ 时它退到无穷远（自然离开画框），这正是"零号没有类空支"的画面。 */
function drawLevelMinus(C, e, L) {
  if (e > -EPS0) return;
  const k = -e;
  for (let i = -8; i <= 8; i++) {
    const ct = i * 0.5;
    const r = Math.sqrt((L + ct * ct) / k);
    if (r > R_MAX) continue;
    const pts = [];
    for (let j = 0; j <= 56; j++) { const a1 = j / 56 * TAU; pts.push([r * Math.cos(a1), r * Math.sin(a1), ct]); }
    strokePoly(C, pts, { width: 1.1, color: rgba(C_VIOLET, 0.22) });
  }
  for (const sx of [1, -1]) {
    const pts = [];
    for (let i = -80; i <= 80; i++) {
      const ct = CT_MAX * i / 80;
      const x = sx * Math.sqrt((L + ct * ct) / k);
      if (Math.abs(x) > R_MAX) { pts.push(null); continue; }
      pts.push([x, 0, ct]);
    }
    strokePoly(C, pts, { width: 5.5, color: rgba(C_VIOLET, 0.13) });
    strokePoly(C, pts, { width: 2.2, color: rgba(C_VIOLET, 0.95) });
  }
}

/* 零集 Q = 0（amber = 度量注记：它就是"光能走的方向"）
   ε > 0：只有原点一个点 · ε = 0：整个 ct = 0 平面 · ε < 0：半顶角 arctan√(−ε) 的双锥。
   ε ≤ 0 走同一条代码路径（斜率 k = √(−ε)，k = 0 时锥面自然摊平成平面）。 */
function drawNullSet(C, e) {
  if (e > EPS0) {                                     // 零维：一个点
    const s = proj(C, [0, 0, 0]);
    if (s) glowDot(s, 16, '#ffffff', rgba(C_AMBER, 0.9));
    return;
  }
  const k = Math.sqrt(Math.max(0, -e));
  const R = k > 1e-6 ? Math.min(R_MAX, CT_MAX / k) : R_MAX;
  for (let i = 0; i < 14; i++) {
    const a0 = i / 14 * TAU, ca = Math.cos(a0), sa = Math.sin(a0);
    for (const sg of [1, -1]) {
      line3(C, [0, 0, 0], [R * ca, R * sa, sg * k * R], { width: 1.2, color: rgba(C_AMBER, 0.26) });
    }
  }
  for (let r = 1; r <= Math.floor(R); r++) {
    for (const sg of [1, -1]) {
      const pts = [];
      for (let j = 0; j <= 56; j++) { const a1 = j / 56 * TAU; pts.push([r * Math.cos(a1), r * Math.sin(a1), sg * k * r]); }
      strokePoly(C, pts, { width: 1.1, color: rgba(C_AMBER, 0.30) });
      if (k < 1e-6) break;                            // k = 0 时上下两片重合，画一次就够
    }
  }
  for (const sx of [1, -1]) for (const sg of [1, -1]) {
    line3(C, [0, 0, 0], [sx * R, 0, sg * k * R], { width: 1.8, color: rgba(C_AMBER, 0.85) });
    if (k < 1e-6) break;
  }
}

/* 当前 ε 对应的几何名与零集描述（页签③读数与画面标注共用） */
function geomOf(e) {
  if (e > 0.02) return {
    name: { zh: '四维欧氏', en: 'four-dimensional Euclidean' },
    nul:  { zh: '零集 = 一个点（0 维）', en: 'null set = a single point (0-dim)' },
    lvl:  { zh: '等值面：球面', en: 'level set: sphere' },
    bad:  { zh: '没有锥；旋转能把未来转成过去 ⇒ 因果崩溃', en: 'no cone; a rotation turns future into past ⇒ causality collapses' }
  };
  if (e < -0.02) return {
    name: { zh: '闵可夫斯基', en: 'Minkowski' },
    nul:  { zh: '零集 = 双锥面（2 维）', en: 'null set = double cone (2-dim)' },
    lvl:  { zh: '等值面：双曲面', en: 'level set: hyperboloid' },
    bad:  { zh: '光锥在这里诞生：ε = −1 时半顶角恰 45°', en: 'the light cone is born here: at ε = −1 the half-angle is exactly 45°' }
  };
  return {
    name: { zh: '退化（伽利略）', en: 'degenerate (Galilean)' },
    nul:  { zh: '零集 = 整个 ct = 0 平面（2 维）', en: 'null set = the whole ct = 0 plane (2-dim)' },
    lvl:  { zh: '等值面：一对水平平面', en: 'level set: a pair of horizontal planes' },
    bad:  { zh: '这正是牛顿的绝对同时——页签①那叠切片', en: 'this is exactly Newton’s absolute simultaneity — the stack of slices in tab ①' }
  };
}

/* 读数区固定首两行：坐标约定 + 本工具的核心二次型，杜绝符号歧义 */
function roHead() {
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' +
    t({ zh: '坐标 x, y = 空间，z = ct（c = 1）', en: 'coords x, y = space, z = ct (c = 1)' }) + '</div>' +

                              en: 'quadratic form Q(ε) = (ct)² + ε(x² + y²); ε = −1 is Minkowski' }) + '</div>';
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const SCENES = {

  /* ────── ① 牛顿的平直时空：一叠绝对同时面 ────── */
  newton: {
    label: { zh: '牛顿时空', en: 'Newtonian spacetime' },
    params: ['beta'],
    /* β 是坐标量（线性区间），单向回绕会跳变 ⇒ kind: 'linear' → 默认 pingpong */
    drive: { key: 'beta', from: -0.9, to: 0.9, period: 9, kind: 'linear' },
    brand: { zh: '牛顿时空不是"三维空间随便加一根时间轴"，而是一叠「绝对的」同时面：每一层是整个空间的一个瞬间，人人共用。伽利略变换只把世界线推倒，那叠切片纹丝不动。',
             en: 'Newtonian spacetime is not "3D space plus some time axis" — it is a stack of absolute simultaneity slices, each one whole-space-at-an-instant, shared by everyone. A Galilean transformation only tips the worldlines; the stack never moves.' },
    tips: { zh: '时间间隔与"同一时刻的空间距离"是两个互不相干的不变量，没有任何东西把空间和时间联系起来——这就是牛顿时空的全部结构。切到「x·ct 侧视」，看 β 怎么变，水平的同时面就是不动。',
            en: 'The time interval and the spatial distance "at the same instant" are two unrelated invariants — nothing ties space to time. That is the entire structure of Newtonian spacetime. Switch to "Side x·ct" and watch: whatever β does, the horizontal slices never budge.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' }, az: -0.78, el: 0.30, dist: 13, tx: 0, ty: 0, tz: 1.9 },
      /* x·ct 侧视：az≈0、el 取下限 −1.45 时，屏幕右 = +x、屏幕上 = +ct（引擎的
         up 恒为世界 y，只有这个姿态能把 ct 立起来），即教科书那张时空图。 */
      side: { label: { zh: 'x·ct 侧视', en: 'Side x·ct' }, az: 0.001, el: -1.45, dist: 11, tx: 0, ty: 0, tz: 1.9 },
      top:  { label: { zh: '俯视 x·y', en: 'Top x·y' }, az: 0.001, el: 0.02, dist: 10.5, tx: 0, ty: 0, tz: 0 }
