<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'binomial-pascal-probability-3d',
  title: { zh: '二项式定理 · Pascal 三角形与概率', en: "The Binomial Theorem · Pascal's Triangle & Probability" },
  h1:    { zh: '二项式定理与 Pascal 三角形', en: 'Binomial · Pascal · Probability' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'n',     label: { zh: '次数 <i>n</i>',       en: 'Power <i>n</i>' },            min: 1,    max: 12,   step: 1,    value: 6,   fmt: v => v.toFixed(0) },
  { key: 'k',     label: { zh: '选中项 <i>k</i>',     en: 'Chosen <i>k</i>' },           min: 0,    max: 12,   step: 1,    value: 2,   fmt: v => v.toFixed(0) },
  { key: 'a',     label: { zh: '第一项 <i>a</i>',     en: 'First term <i>a</i>' },       min: 0.5,  max: 2,    step: 0.05, value: 1.2, fmt: v => fmt(v) },
  { key: 'b',     label: { zh: '第二项 <i>b</i>',     en: 'Second term <i>b</i>' },      min: 0.5,  max: 2,    step: 0.05, value: 0.8, fmt: v => fmt(v) },
  { key: 'p',     label: { zh: '成功概率 <i>p</i>',   en: 'Success prob. <i>p</i>' },    min: 0.05, max: 0.95, step: 0.01, value: 0.5, fmt: v => fmt(v) },
  { key: 'omega', label: { zh: '走路速度 <i>ω</i>',   en: 'Walk speed <i>ω</i>' },       min: 0.2,  max: 4,    step: 0.05, value: 1.2, fmt: v => fmt(v) + ' rad/s' }
];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：组合数学与绘图助手（引擎之上，引擎零改动） ────── */
const SQ2PI = Math.sqrt(2 * Math.PI);
const FACT = [1];
for (let i = 1; i <= 12; i++) FACT[i] = FACT[i - 1] * i;
function binomC(n, k) { n = Math.round(n); k = Math.round(k); if (k < 0 || k > n) return 0; return FACT[n] / (FACT[k] * FACT[n - k]); }
const curN = () => Math.round(state.n);
const curK = () => Math.min(Math.round(state.k), Math.round(state.n));   /* k 永不超过 n */
const term = (n, j, a, b) => binomC(n, j) * Math.pow(a, n - j) * Math.pow(b, j);
const pmf = (n, j, p) => binomC(n, j) * Math.pow(p, j) * Math.pow(1 - p, n - j);

const ROSE_A = 'rgba(251,113,133,';
const VIO_A  = 'rgba(167,139,250,';
const EME_A  = 'rgba(52,211,153,';
const CYAN_A = 'rgba(45,212,234,';
const AMB_A  = 'rgba(251,191,36,';

const SUP = ['⁰', '¹', '²', '³', '⁴', '⁵', '⁶', '⁷', '⁸', '⁹', '¹⁰', '¹¹', '¹²'];
/* 单项式 aⁿ⁻ʲbʲ 的显示串 */
function mono(j, n) {
  const ea = n - j, eb = j;
  const pa = ea === 0 ? '' : 'a' + (ea === 1 ? '' : SUP[ea]);
  const pb = eb === 0 ? '' : 'b' + (eb === 1 ? '' : SUP[eb]);
  return (pa + pb) || '1';
}

/* 三角形节点布局：第 m 行第 j 个（j=0..m），行向 +z 退开（步距 dz 由场景给定） */
const PT = { y0: 2.9, dy: 0.48, hx: 0.56 };
const nodePos = (m, j, dz) => [(j - m / 2) * PT.hx, PT.y0 - m * PT.dy, m * dz];

/* 投影填充四边形（场景级部件；任一顶点越过近裁剪面则整体放弃） */
function fillQuad(C, pts, color) {
  const s = [];
  for (const p of pts) { const q = proj(C, p); if (!q) return; s.push(q); }
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(s[0][0], s[0][1]);
  for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
/* 竖直条：中心 x、底 y0、高 h、半宽 hw、深 z */
function drawBar(C, x, y0, h, hw, z, fill, edge) {
  const q = [[x - hw, y0, z], [x + hw, y0, z], [x + hw, y0 + h, z], [x - hw, y0 + h, z]];
  fillQuad(C, q, fill);
  strokePoly(C, q.concat([q[0]]), { width: 1.3, color: edge });
}

/* 第 idx 条到达 (n,k) 的路径（“先右后左”的字典序展开，确定可复现）
   返回长度 n 的 0/1 数组：1 = 向右（选 b / 成功），恰含 k 个 1 */
function unrankPath(n, k, idx) {
  const steps = []; let rem = k, rest = idx;
  for (let s = 0; s < n; s++) {
    const withR = binomC(n - s - 1, rem - 1);   /* 本步向右后剩余的方案数 */
    if (rem > 0 && rest < withR) { steps.push(1); rem--; }
    else { rest -= withR; steps.push(0); }
  }
  return steps;
}

const SCENES = {

  /* ────── 一：几何展开 —— 系数 = 同类项的块数 ────── */
  expand: {
    label: { zh: '几何展开', en: 'Expansion' },
    params: ['n', 'a', 'b'],
    /* brand 直接写着「拖动 a、b，看各项此消彼长」——驱动 b 就是把这句话演出来：
       b < a 时低次项（aⁿ 一侧）压倒一切，b > a 时高次项翻上来，各项条此起彼伏，
       而系数 C(n,k) 始终不动 —— 恰好说明「系数是块数，与 a、b 无关」。
       驱动 b 而非 n：n 是离散的结构量，改它会让条数忽增忽减；a、b 是连续的，画面更连贯。
       量程取满 0.5…2（作者已把下端设在 0.5 > 0，无退化）。首尾差别大 → linear。周期 8 s。 */
    drive: { key: 'b', from: 0.5, to: 2, period: 8, kind: 'linear' },
    brand: { zh: '(a+b)ⁿ 的每一项都是一次「选择」的记录：在 n 个括号里各选 a 或 b，选中 k 个 b 的方案恰有 C(n,k) 种。拖动 a、b，看各项此消彼长。',
             en: 'Every term of (a+b)ⁿ records a choice: pick a or b from each of the n brackets, and there are exactly C(n,k) ways to pick b exactly k times. Drag a and b to watch the terms trade places.' },
    tips: { zh: '提示：切「正视 x·y」并把 n 调到 2——正方形被切成 a²、两块 ab、b²，四块面积正好对上三根条的高度：系数 1、2、1 就是「同类项的块数」。',
            en: 'Tip: switch to "Front x·y" and set n = 2 — the square splits into a², two ab pieces and b², and the four areas match the three bars exactly: the coefficients 1, 2, 1 are simply how many congruent pieces there are.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.55, el: 0.3,  dist: 11.5, tx: 0.4, ty: 1.3, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 9.5,  tx: 0.4, ty: 1.4, tz: 0 }
    },
    toggles: [
      { key: 'showTerms',  label: { zh: '各项大小条', en: 'Term bars' },                    color: '#fb7185', checked: true },
      { key: 'showSquare', label: { zh: '(a+b)² 面积分割', en: '(a+b)² area model' },       color: '#2dd4ea', checked: true },
      { key: 'showCoef',   label: { zh: '系数 C(n,k)', en: 'Coefficients C(n,k)' },         color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                               color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const n = curN(), a = state.a, b = state.b;
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* — 左：(a+b)² 面积模型（青色源几何，内部按 a/b 语义着色） — */
      if (state.showSquare) {
        const S = 2.9, x0 = -4.9, y0 = 0, fa = a / (a + b);
        const xs = x0 + S * fa, x1 = x0 + S, ys = y0 + S * fa, y1 = y0 + S;
        fillQuad(C, [[x0, y0, 0], [xs, y0, 0], [xs, ys, 0], [x0, ys, 0]], VIO_A + '0.16)');
        fillQuad(C, [[xs, ys, 0], [x1, ys, 0], [x1, y1, 0], [xs, y1, 0]], EME_A + '0.16)');
        fillQuad(C, [[xs, y0, 0], [x1, y0, 0], [x1, ys, 0], [xs, ys, 0]], ROSE_A + '0.13)');
        fillQuad(C, [[x0, ys, 0], [xs, ys, 0], [xs, y1, 0], [x0, y1, 0]], ROSE_A + '0.13)');
        strokePoly(C, [[x0, y0, 0], [x1, y0, 0], [x1, y1, 0], [x0, y1, 0], [x0, y0, 0]], { width: 2, color: CYAN_A + '0.9)' });
        line3(C, [xs, y0, 0], [xs, y1, 0], { width: 1.2, color: CYAN_A + '0.5)' });
        line3(C, [x0, ys, 0], [x1, ys, 0], { width: 1.2, color: CYAN_A + '0.5)' });
        label3(C, [(x0 + xs) / 2, (y0 + ys) / 2, 0], 'a²', { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
        label3(C, [(xs + x1) / 2, (ys + y1) / 2, 0], 'b²', { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'center' });
        label3(C, [(xs + x1) / 2, (y0 + ys) / 2, 0], 'ab', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
        label3(C, [(x0 + xs) / 2, (ys + y1) / 2, 0], 'ab', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
        /* 边长量尺（琥珀度量） */
        line3(C, [x0, y0 - 0.22, 0], [xs, y0 - 0.22, 0], { width: 1.2, color: AMB_A + '0.75)' });
        line3(C, [xs, y0 - 0.22, 0], [x1, y0 - 0.22, 0], { width: 1.2, dash: [4, 4], color: AMB_A + '0.75)' });
        label3(C, [(x0 + xs) / 2, y0 - 0.44, 0], 'a', { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        label3(C, [(xs + x1) / 2, y0 - 0.44, 0], 'b', { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        label3(C, [(x0 + x1) / 2, y1 + 0.32, 0], '(a+b)² = a² + 2ab + b²',
          { font: 'italic 12px ' + FONT_MATH, color: CYAN_A + '0.9)', align: 'center' });
      }

      /* — 右：(a+b)ⁿ 各项大小条（纯 a 紫 · 混合 玫红 · 纯 b 翠绿） — */
      if (state.showTerms) {
        const terms = []; let mx = 1e-12;
        for (let j = 0; j <= n; j++) { terms.push(term(n, j, a, b)); mx = Math.max(mx, terms[j]); }
        const L = 5.0, xL = -0.4, bw = L / (n + 1), hw = Math.min(0.2, bw * 0.34), Hh = 2.7;
        line3(C, [xL - 0.25, 0, 0], [xL + L + 0.35, 0, 0], { width: 1.4, color: AXIS });
        arrowAt(C, [xL + L + 0.35, 0, 0], [xL + L + 0.15, 0, 0], AXIS);
        label3(C, [xL + L + 0.65, 0, 0], 'k', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
        for (let j = 0; j <= n; j++) {
          const x = xL + bw * (j + 0.5);
          const h = terms[j] / mx * Hh;
          const col = j === 0 ? VIO_A : j === n ? EME_A : ROSE_A;
          drawBar(C, x, 0, h, hw, 0, col + '0.20)', col + '0.85)');
          if (state.showCoef) label3(C, [x, h + 0.32, 0], binomC(n, j).toFixed(0),
            { size: 10.5, color: AMB_A + '0.9)', align: 'center' });
          if (n <= 9) label3(C, [x, -0.3, 0], mono(j, n),
            { font: 'italic 11px ' + FONT_MATH, color: 'rgba(226,232,240,.7)', align: 'center' });
          else label3(C, [x, -0.3, 0], j.toFixed(0),
            { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
        }
        label3(C, [xL + L / 2, Hh + 0.95, 0], '(a+b)ⁿ = Σ C(n,k)·aⁿ⁻ᵏbᵏ',
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }
    },
    readout() {
      const n = curN(), a = state.a, b = state.b;
      let tot = 0, mx = -1, mk = 0;
      for (let j = 0; j <= n; j++) { const v = term(n, j, a, b); tot += v; if (v > mx) { mx = v; mk = j; } }
      return '<div>(a+b)ⁿ = ' + fmt(a + b) + '<sup>' + n + '</sup> = <b>' + fmt(Math.pow(a + b, n)) + '</b></div>' +
        '<div class="sinC">' + t({ zh: '逐项求和', en: 'sum of terms' }) + ' Σ C(n,k)aⁿ⁻ᵏbᵏ = <b>' + fmt(tot) + '</b></div>' +
        '<div><span style="color:#fbbf24">' + t({ zh: '最大项', en: 'largest term' }) + ' k = <b>' + mk + '</b> · C(' + n + ',' + mk + ')·' + mono(mk, n) + ' = ' + fmt(mx) + '</span></div>' +
        '<div class="dim">' + t({ zh: '两条算法同值 —— 展开只是把同类项重新分组', en: 'both routes agree — expansion just regroups like terms' }) + '</div>';
    }
  },

  /* ────── 二：Pascal 三角形 —— 一条递推长出整座三角形 ────── */
  pascal: {
    label: { zh: 'Pascal 三角形', en: "Pascal's triangle" },
    params: ['n', 'k'],
    /* brand 的原话是「这一条递推生成整座三角形」——生成是个过程，驱动 n 让三角形
       一行一行长出来，递推才从一句陈述变成看得见的动作（配合「侧视 层级」尤其明显：
       每一层确实只由上一层决定）。这是选 n 的**正面理由**，与死区无关。
       为什么不是 k：k 只是「在既有的三角形里挑一个节点」，挑遍一行并不能说明三角形是被
       递推生成的；n 才是 brand 那句话的自变量。
       （附带一提：k 的量程 0…12 与 n 无关，curK() = min(k, n) 会在 k > n 时把它钳在 n 上，
       n = 6 时有一半行程停着不动。但这不构成排除 k 的理由 —— 同批 huffman 的 symSel
       遇到同样的饱和，是用「上界写成 getter」解决的，这里同样可以写成 get to(){return curN();}。
       所以口径统一为：**死区可以修，不是取舍依据；取舍依据是哪个量演的是本页的那句话**。） */
    drive: { key: 'n', from: 1, to: 12, period: 10, kind: 'linear' },
    brand: { zh: '每个数都等于左上与右上之和——这一条递推生成整座三角形。第 n 行正是 (a+b)ⁿ 的系数，也是 n 步二选一的路径数。',
             en: 'Each number is the sum of the two above it — that single recurrence grows the whole triangle. Row n is exactly the coefficients of (a+b)ⁿ, and the path counts of n binary choices.' },
    tips: { zh: '提示：切「正视 x·y」看完整 Pascal 结构；切「侧视 层级」，三角形塌成一串向后退开的行——每一层只由上一层决定。拖 k，看两个紫色父节点如何汇成玫红的 C(n,k)。',
            en: 'Tip: "Front x·y" shows the full Pascal structure; "Side layers" collapses the triangle into receding rows — each layer determined only by the previous one. Drag k and watch the two violet parents merge into the rose C(n,k).' },
    views: {
      iso:   { label: { zh: '立体',       en: '3D' },          az: -0.6,        el: 0.28, dist: 13,   tx: 0, ty: 0.2, tz: 1.8 },
      front: { label: { zh: '正视 x·y',   en: 'Front x·y' },   az: 0.001,       el: 0.02, dist: 10.5, tx: 0, ty: 0.2, tz: 1.6 },
      side:  { label: { zh: '侧视 层级',  en: 'Side layers' }, az: -Math.PI / 2, el: 0.02, dist: 11,   tx: 0, ty: 0.2, tz: 1.6 }
    },
    toggles: [
      { key: 'showTarget',  label: { zh: '选中节点 C(n,k)', en: 'Chosen node C(n,k)' },  color: '#fb7185', checked: true },
      { key: 'showParents', label: { zh: '递推来源', en: 'Recurrence parents' },          color: '#a78bfa', checked: true },
      { key: 'showVals',    label: { zh: '数值标注', en: 'Values' },                      color: '#2dd4ea', checked: true },
      { key: 'showRow',     label: { zh: '第 n 行标尺', en: 'Row-n ruler' },              color: '#fbbf24', checked: true },
      { key: 'showGrid',    label: { zh: '网格', en: 'Grid' },                            color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const n = curN(), kk = curK(), dz = 0.45;
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 递推连线（骨架） */
      for (let m = 1; m <= n; m++) for (let j = 0; j <= m; j++) {
        if (j > 0) line3(C, nodePos(m - 1, j - 1, dz), nodePos(m, j, dz), { width: 1, color: 'rgba(148,163,184,0.15)' });
        if (j < m) line3(C, nodePos(m - 1, j, dz), nodePos(m, j, dz), { width: 1, color: 'rgba(148,163,184,0.15)' });
      }
      /* 节点与数值（青色结构） */
      for (let m = 0; m <= n; m++) for (let j = 0; j <= m; j++) {
        const P = nodePos(m, j, dz);
        solidDot(C, P, m === n ? 2.6 : 2, CYAN_A + (m === n ? '0.95)' : '0.55)'));
        if (state.showVals) label3(C, [P[0], P[1] + 0.17, P[2]], binomC(m, j).toFixed(0),
          { size: 10, color: m === n ? 'rgba(226,232,240,.92)' : 'rgba(159,176,200,.62)', align: 'center' });
      }
      /* 第 n 行标尺（琥珀度量） */
      if (state.showRow) {
        const Lp = nodePos(n, 0, dz), Rp = nodePos(n, n, dz);
        line3(C, [Lp[0] - 0.35, Lp[1] - 0.28, Lp[2]], [Rp[0] + 0.35, Rp[1] - 0.28, Rp[2]], { width: 1.2, color: AMB_A + '0.7)' });
        label3(C, [Rp[0] + 0.5, Rp[1] - 0.28, Rp[2]],
          t({ zh: '第 ' + n + ' 行 · 和 = 2' + SUP[n], en: 'row ' + n + ' · sum = 2' + SUP[n] }),
          { size: 10.5, color: AMB_A + '0.9)', align: 'left' });
      }
      /* 递推来源（紫）：两个父节点 + 汇入边 */
      if (state.showParents && n >= 1) {
        for (const pj of [kk - 1, kk]) {
          if (pj < 0 || pj > n - 1) continue;
          const P = nodePos(n - 1, pj, dz);
          line3(C, P, nodePos(n, kk, dz), { width: 1.8, color: VIO_A + '0.85)' });
          const s = proj(C, P);
          if (s) glowDot(s, 9, '#ffffff', VIO_A + '0.9)');
        }
      }
      /* 选中节点（玫红主角） */
      if (state.showTarget) {
        const P = nodePos(n, kk, dz);
        const s = proj(C, P);
        if (s) glowDot(s, 12, '#ffffff', ROSE_A + '0.9)');
        label3(C, [P[0], P[1] - 0.36, P[2]], 'C(' + n + ',' + kk + ') = ' + binomC(n, kk).toFixed(0),
          { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }
    },
    readout() {
      const n = curN(), kk = curK();
      const c = binomC(n, kk);
      let rec = '';
      if (n >= 1) {
        const p1 = binomC(n - 1, kk - 1), p2 = binomC(n - 1, kk);
        rec = '<div class="cosC">= C(' + (n - 1) + ',' + (kk - 1) + ') + C(' + (n - 1) + ',' + kk + ') = ' +
          p1.toFixed(0) + ' + ' + p2.toFixed(0) + ' = <b>' + (p1 + p2).toFixed(0) + '</b></div>';
      }
      const clampNote = Math.round(state.k) > n
        ? '<div class="dim">' + t({ zh: 'k 超出 n，已取 k = n', en: 'k exceeds n — clamped to k = n' }) + '</div>' : '';
      return '<div class="sinC">C(' + n + ',' + kk + ') = n!/[k!(n−k)!] = <b>' + c.toFixed(0) + '</b></div>' + rec +
        '<div><span style="color:#fbbf24">' + t({ zh: '第 n 行总和', en: 'row-n sum' }) + ' = 2ⁿ = <b>' + Math.pow(2, n).toFixed(0) + '</b></span></div>' +
        '<div class="dim">' + t({ zh: '每个数 = 左上 + 右上', en: 'each number = upper-left + upper-right' }) + '</div>' + clampNote;
    }
  },

  /* ────── 三：路径计数 —— C(n,k) 是走得出来的 ────── */
  paths: {
    label: { zh: '路径计数', en: 'Path counting' },
    params: ['n', 'k', 'omega'],
    brand: { zh: '从顶点出发走 n 步，每步向左或向右：到达第 k 个位置的走法恰有 C(n,k) 种。系数不是抽象记号，而是一条条能走出来的路。',
             en: 'Start at the apex and take n left-or-right steps: exactly C(n,k) walks reach position k. The coefficient is not an abstract symbol — it is a set of walkable routes.' },
    tips: { zh: '提示：紫色粗细是「流量」——经过每条边、最终抵达目标的路径条数；玫红是正在演示的一条。调大 ω 让 C(n,k) 条路径逐一走完；切「正视 x·y」与 Pascal 页对照：每个节点上的路径数正是那里的数字。',
            en: 'Tip: violet thickness is flow — how many target-bound paths use each edge; the rose line is the one being walked. Raise ω to cycle through all C(n,k) of them, then compare with the Pascal tab in "Front x·y": the count at each node is the very same number.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.55, el: 0.3,  dist: 12,   tx: 0, ty: 0.2, tz: 1.2 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 10,   tx: 0, ty: 0.2, tz: 1 }
    },
    toggles: [
      { key: 'showRep',  label: { zh: '当前路径', en: 'Current path' },        color: '#fb7185', checked: true },
      { key: 'showFlow', label: { zh: '全部路径流量', en: 'All-path flow' },   color: '#a78bfa', checked: true },
      { key: 'showCnt',  label: { zh: '节点路径数', en: 'Node counts' },       color: '#2dd4ea', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' },                    color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const n = curN(), kk = curK(), dz = 0.3;
      const total = binomC(n, kk);
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 骨架格架 */
      for (let m = 1; m <= n; m++) for (let j = 0; j <= m; j++) {
        if (j > 0) line3(C, nodePos(m - 1, j - 1, dz), nodePos(m, j, dz), { width: 1, color: 'rgba(148,163,184,0.12)' });
        if (j < m) line3(C, nodePos(m - 1, j, dz), nodePos(m, j, dz), { width: 1, color: 'rgba(148,163,184,0.12)' });
      }
      /* 流量（紫）：经过每条边、最终到达 (n,k) 的路径数（聚合，绝不画 2ⁿ 条） */
      if (state.showFlow) {
        for (let m = 0; m < n; m++) for (let j = 0; j <= m; j++) {
          for (const d of [0, 1]) {
            const j2 = j + d;
            const w = binomC(m, j) * binomC(n - m - 1, kk - j2);
            if (w <= 0) continue;
            const fr = w / total;
            line3(C, nodePos(m, j, dz), nodePos(m + 1, j2, dz),
              { width: 1 + 2.6 * Math.sqrt(fr), color: VIO_A + (0.16 + 0.5 * fr).toFixed(2) + ')' });
          }
        }
      }
      /* 节点 + 到达计数（青 = Pascal 数） */
      for (let m = 0; m <= n; m++) for (let j = 0; j <= m; j++) {
        const P = nodePos(m, j, dz);
        solidDot(C, P, 2, CYAN_A + '0.5)');
        if (state.showCnt) label3(C, [P[0], P[1] + 0.17, P[2]], binomC(m, j).toFixed(0),
          { size: 9.5, color: 'rgba(45,212,234,.6)', align: 'center' });
      }
      /* 起点与终点 */
      const apex = proj(C, nodePos(0, 0, dz));
      if (apex) glowDot(apex, 9, '#ffffff', CYAN_A + '0.85)');
      const TgtP = nodePos(n, kk, dz);
      const tp = proj(C, TgtP);
      if (tp) glowDot(tp, 11, '#ffffff', ROSE_A + '0.9)');
      label3(C, [TgtP[0], TgtP[1] - 0.36, TgtP[2]],
        t({ zh: 'C(' + n + ',' + kk + ') = ' + total.toFixed(0) + ' 条路径', en: 'C(' + n + ',' + kk + ') = ' + total.toFixed(0) + ' paths' }),
        { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      label3(C, [0, PT.y0 + 0.5, 0],
        t({ zh: '每步：左 = 不选 b · 右 = 选 b', en: 'each step: left = skip b · right = take b' }),
        { size: 11, color: 'rgba(159,176,200,.7)', align: 'center' });

      /* 当前代表路径（玫红）+ 行走点（θ 驱动，暂停即冻结） */
      if (state.showRep && total > 0) {
        const u = state.theta / TAU;
        const idx = Math.floor(u) % total;
        const prog = u - Math.floor(u);
        const steps = unrankPath(n, kk, idx);
        const pts = [nodePos(0, 0, dz)];
        let j = 0;
        for (let m = 0; m < n; m++) { j += steps[m]; pts.push(nodePos(m + 1, j, dz)); }
        strokePoly(C, pts, { width: 5.5, color: ROSE_A + '0.14)' });
        strokePoly(C, pts, { width: 2.4, color: ROSE_A + '0.95)' });
        const fseg = Math.min(n - 1e-9, prog * n);
        const si = Math.floor(fseg), lt = fseg - si;
        const A2 = pts[si], B2 = pts[si + 1];
        const wp = [A2[0] + (B2[0] - A2[0]) * lt, A2[1] + (B2[1] - A2[1]) * lt, A2[2] + (B2[2] - A2[2]) * lt];
        const s = proj(C, wp);
        if (s) glowDot(s, 14, '#ffffff', 'rgba(186,240,255,0.9)');
      }
    },
    readout() {
      const n = curN(), kk = curK(), total = binomC(n, kk);
      const u = state.theta / TAU, idx = Math.floor(u) % total;
      const str = unrankPath(n, kk, idx).map(s => s ? 'R' : 'L').join('');
      return '<div>' + t({ zh: '目标节点', en: 'target node' }) + ' (n, k) = (' + n + ', ' + kk + ')</div>' +
        '<div class="sinC">' + t({ zh: '路径总数', en: 'total paths' }) + ' = C(' + n + ',' + kk + ') = <b>' + total.toFixed(0) + '</b></div>' +
        '<div class="cosC">' + t({ zh: '当前路径', en: 'current path' }) + ' #<b>' + (idx + 1) + '</b>/' + total.toFixed(0) + ' · ' + str + '</div>' +
        '<div class="dim">' + t({ zh: '每条路径恰含 k = ' + kk + ' 个 R', en: 'every path has exactly k = ' + kk + ' R steps' }) + '</div>';
    }
  },

  /* ────── 四：二项分布 —— 计数 × 概率 = 分布 ────── */
  dist: {
    label: { zh: '二项分布', en: 'Binomial distribution' },
    params: ['n', 'k', 'p'],
    /* tips 的第二句「拖 p 看山峰滑向 np」正是本页相对上一页新增的东西：
       上一页只有计数（已由 n 驱动），这一页多出来的是概率。驱动 p，玫红概率柱的峰
       连同紫色正态近似一起沿 np 平滑滑移，均值与 σ 标注同步走 —— 「计数 × 概率 = 分布」
       里的「概率」这一半才动起来。
       驱动 p 而非 n：n 已在上一页驱动，且 p 连续（step 0.01），动画远比整数 n 平滑。
       量程取满 0.05…0.95 —— 两端的退化情形（p = 0 / 1 时分布塌成一根柱）作者已挡在量程外。
       首尾突变 → linear。周期 8 s。 */
    drive: { key: 'p', from: 0.05, to: 0.95, period: 8, kind: 'linear' },
    brand: { zh: '给每一步赋上概率：向右 p、向左 1−p，C(n,k) 条路径便汇成 P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ。计数一乘概率，三角形就变成了分布。',
             en: 'Give each step a probability — p right, 1−p left — and the C(n,k) paths add up to P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ. Multiply counting by probability and the triangle becomes a distribution.' },
    tips: { zh: '提示：切「正视 x·y」把 n 拉大——玫红柱越来越贴近紫色 N(np, np(1−p)) 虚线；拖 p 看山峰滑向 np。这正是高斯工具里钟形曲线的来处。',
            en: 'Tip: in "Front x·y" push n up — the rose bars hug the violet N(np, np(1−p)) dashes ever tighter; drag p and the peak slides to np. This is exactly where the Gaussian tool\'s bell curve comes from.' },
    views: {
      iso:   { label: { zh: '立体',     en: '3D' },        az: -0.6,  el: 0.3,  dist: 12, tx: 0, ty: 1, tz: 1 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 9.5, tx: 0, ty: 1.2, tz: 0 }
    },
    toggles: [
      { key: 'showBars',   label: { zh: '概率柱 P(X=k)', en: 'Bars P(X=k)' },           color: '#fb7185', checked: true },
      { key: 'showNormal', label: { zh: '正态近似', en: 'Normal approximation' },        color: '#a78bfa', checked: true },
      { key: 'showStack',  label: { zh: '各 n 切片', en: 'Slices by n' },                color: '#cbd5e1', checked: false },
      { key: 'showMean',   label: { zh: '均值与 σ', en: 'Mean & σ' },                    color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' },                            color: '#64748b', checked: false }
    ],
    sampleWindow: () => 10,
    draw(C) {
      const n = curN(), kk = curK(), p = state.p;
      const bw = Math.min(0.62, 7.6 / (n + 1)), YS = 4.0;
      const xw = u => (u - n / 2) * bw;
      if (state.showGrid) drawGridXY(C, 4, 1);

      /* 坐标轴 */
      line3(C, [xw(-1), 0, 0], [xw(n + 1.2), 0, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [xw(n + 1.2), 0, 0], [xw(n + 1), 0, 0], AXIS);
      label3(C, [xw(n + 1.2) + 0.3, 0, 0], 'k', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      line3(C, [xw(-1), 0, 0], [xw(-1), 3.6, 0], { width: 1.4, color: AXIS });
      arrowAt(C, [xw(-1), 3.6, 0], [xw(-1), 3.4, 0], AXIS);
      label3(C, [xw(-1), 3.85, 0], 'P', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
      for (const tk of [0.2, 0.4, 0.6, 0.8]) {
        line3(C, [xw(-1) - 0.05, tk * YS, 0], [xw(-1) + 0.05, tk * YS, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [xw(-1) - 0.14, tk * YS, 0], fmt(tk, 1), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
      const kEvery = n > 8 ? 2 : 1;
      for (let j = 0; j <= n; j++) {
        line3(C, [xw(j), -0.05, 0], [xw(j), 0.05, 0], { width: 1.2, color: AXIS_DIM });
        if (j % kEvery === 0) label3(C, [xw(j), -0.26, 0], j.toFixed(0), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
      /* 各 n 切片（幽灵阶梯：同一 p，n 从小到大） */
      if (state.showStack) {
        for (let m = 1; m < n; m++) {
          const z = (n - m) * 0.55, bwm = Math.min(0.62, 7.6 / (m + 1));
          const pts = [];
          for (let j = 0; j <= m; j++) pts.push([(j - m / 2) * bwm, pmf(m, j, p) * YS, z]);
          strokePoly(C, pts, { width: 1, color: 'rgba(203,213,225,0.18)' });
        }
      }
      /* 正态近似（紫虚线）：N(np, np(1−p)) */
      if (state.showNormal) {
        const mu = n * p, sg = Math.sqrt(n * p * (1 - p));
        const pts = [];
        for (let i = 0; i <= 160; i++) {
          const u = -1 + (n + 2) * i / 160;
          const y = Math.exp(-(u - mu) * (u - mu) / (2 * sg * sg)) / (sg * SQ2PI) * YS;
          pts.push([xw(u), Math.min(y, 4.4), 0]);
        }
        strokePoly(C, pts, { width: 1.8, dash: [7, 5], color: VIO_A + '0.85)' });
        label3(C, [xw(mu) + 0.5, Math.min(1 / (sg * SQ2PI) * YS, 4.2) + 0.25, 0], 'N(np, np(1−p))',
          { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'left' });
      }
      /* 概率柱（玫红，主角；选中 k 高亮） */
      if (state.showBars) {
        for (let j = 0; j <= n; j++) {
          const P = pmf(n, j, p);
          const hl = j === kk;
          drawBar(C, xw(j), 0, P * YS, Math.min(0.2, bw * 0.34), 0,
            ROSE_A + (hl ? '0.30)' : '0.14)'), ROSE_A + (hl ? '0.95)' : '0.55)'));
          if (hl) {
            const s = proj(C, [xw(j), P * YS, 0]);
            if (s) glowDot(s, 9, '#ffffff', ROSE_A + '0.9)');
          }
        }
        label3(C, [xw(n / 2), 4.6, 0], 'P(X=k) = C(n,k)·pᵏ(1−p)ⁿ⁻ᵏ',
          { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      }
      /* 均值与 σ（琥珀度量） */
      if (state.showMean) {
        const mu = n * p, sg = Math.sqrt(n * p * (1 - p));
        line3(C, [xw(mu), 0, 0], [xw(mu), 3.3, 0], { width: 1.3, dash: [5, 5], color: AMB_A + '0.75)' });
        label3(C, [xw(mu), 3.5, 0], 'μ = np', { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
        line3(C, [xw(mu - sg), -0.42, 0], [xw(mu + sg), -0.42, 0], { width: 1.2, color: AMB_A + '0.75)' });
        line3(C, [xw(mu - sg), -0.48, 0], [xw(mu - sg), -0.36, 0], { width: 1.2, color: AMB_A + '0.75)' });
        line3(C, [xw(mu + sg), -0.48, 0], [xw(mu + sg), -0.36, 0], { width: 1.2, color: AMB_A + '0.75)' });
        label3(C, [xw(mu), -0.64, 0], 'μ ± σ', { size: 10.5, color: AMB_A + '0.9)', align: 'center' });
      }
    },
    readout() {
      const n = curN(), kk = curK(), p = state.p;
      const P = pmf(n, kk, p);
      const mu = n * p, sg = Math.sqrt(n * p * (1 - p));
      return '<div>n = <b>' + n + '</b>&ensp;·&ensp;p = <b>' + fmt(p) + '</b></div>' +
        '<div class="sinC">P(X=' + kk + ') = ' + binomC(n, kk).toFixed(0) + '·p<sup>' + kk + '</sup>(1−p)<sup>' + (n - kk) + '</sup> = <b>' + P.toFixed(3) + '</b></div>' +
        '<div><span style="color:#fbbf24">μ = np = <b>' + fmt(mu) + '</b>&ensp;·&ensp;σ = √[np(1−p)] = <b>' + fmt(sg) + '</b></span></div>' +
        '<div class="dim">' + t({ zh: 'n 越大越接近钟形（见高斯工具）', en: 'larger n → closer to the bell (see the Gaussian tool)' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
/* 本工具的路径行走由 θ 直接驱动（确定可复现，暂停即冻结）；
   历史仅记录当时真实的 P(X=k)（参数中途改变，已记录的样本不重算） */
function pushSample() {
  const n = Math.round(state.n), kk = Math.min(Math.round(state.k), n);
  samples.push({ t: state.t, P: binomC(n, kk) * Math.pow(state.p, kk) * Math.pow(1 - state.p, n - kk) });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];

    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };

}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];

    b.classList.toggle('active', b.dataset.mode === driveMode[id]);

}

function buildDrive() {
  const host = document.getElementById('driveHost');

    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });

      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
