<!-- ============================================================
  i 的本质 · The Essence of i
  基于 math-viz-starter.html（STARTER_VERSION 1.0.0），遵循
  math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）。

  i 不是「想象出来的数」，而是旋转 90° 这个动作的名字——它闯进数学
  不是为了解 x² = −1，而是因为实数世界自己需要它。五个场景：转四分
  之一圈（×i = 逆时针转 90°，i² = −1 即两次直角转弯 = 掉头）· 从三
  次方程闯进来（Cardano 的 x³ = 15x + 4：实根 4 只能借道复平面，
  ∛(2±11i) = 2±i 共轭相加落回实轴）· 纸面外的根（曲面 |p(z)| 的零
  点坑：c 扫过 0 时根离开实轴迁去虚轴——根从不消失，只是离开纸面）·
  镜像双胞胎（z 与 z̄ 隔实轴互镜，z+z̄ 与 z·z̄ 永远是实数——实数世界
  从不漏出虚数）· i 就是一个矩阵（J = [0 −1; 1 0] 转 90°，J² = −I；
  a+bi ≡ [a −b; b a]，复数只是旋转缩放矩阵的速记）。

  版本记录（changelog，新→旧）：
    1.0.1  2026-07-31  参数面板按页签显示：各场景声明 params，只列出对当前页签有效的滑块
    1.0.0  2026-07-13  首发：转四分之一圈 / 从三次方程闯进来 / 纸面外的根 / 镜像双胞胎 / i 就是一个矩阵 五场景
============================================================ -->
<style>

.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}

.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}

/* 开关 */

.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'i-essence-3d',
  title: { zh: 'i 的本质 · The Essence of i', en: 'The Essence of i' },
  h1:    { zh: 'i 的本质', en: 'The Essence of i' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 're0',     label: { zh: 'Re <i>z</i>₀',        en: 'Re <i>z</i>₀' },
    min: -1.5, max: 1.5, step: 0.05, value: 1.0,  fmt: v => fmtS(v) },
  { key: 'im0',     label: { zh: 'Im <i>z</i>₀',        en: 'Im <i>z</i>₀' },
    min: -1.5, max: 1.5, step: 0.05, value: 0.6,  fmt: v => fmtS(v) },
  { key: 'speed',   label: { zh: '演示速度',             en: 'Demo speed' },
    min: 0.3, max: 2,    step: 0.05, value: 0.8,  fmt: v => fmt(v) + '×' },
  { key: 'branchK', label: { zh: '立方根分支 <i>k</i>',  en: 'Cube-root branch <i>k</i>' },
    min: 0,   max: 2,    step: 1,    value: 0,    fmt: v => 'k = ' + v.toFixed(0) },
  { key: 'polySel', label: { zh: '多项式 <i>p</i>(<i>z</i>)', en: 'Polynomial <i>p</i>(<i>z</i>)' },
    min: 0,   max: 1,    step: 1,    value: 0,
    fmt: v => t(Math.round(v) === 0 ? { zh: 'z² + c', en: 'z² + c' } : { zh: 'z³ − z + c', en: 'z³ − z + c' }) },
  { key: 'cc',      label: { zh: '常数项 <i>c</i>',      en: 'Constant <i>c</i>' },
    min: -2,  max: 2,    step: 0.02, value: 1.0,  fmt: v => fmtS(v) },
  { key: 'zre',     label: { zh: 'Re <i>z</i> = <i>a</i>', en: 'Re <i>z</i> = <i>a</i>' },
    min: -1.5, max: 1.5, step: 0.05, value: 1.0,  fmt: v => fmtS(v) },
  { key: 'zim',     label: { zh: 'Im <i>z</i> = <i>b</i>', en: 'Im <i>z</i> = <i>b</i>' },
    min: -1.5, max: 1.5, step: 0.05, value: 0.7,  fmt: v => fmtS(v) },
  { key: 'quarC',   label: { zh: '共轭对参数 <i>q</i>',  en: 'Pair parameter <i>q</i>' },
    min: -1.2, max: 1.2, step: 0.02, value: 0.8,  fmt: v => fmtS(v) },
  { key: 'ma',      label: { zh: '矩阵元 <i>a</i>',      en: 'Entry <i>a</i>' },
    min: -1.5, max: 1.5, step: 0.05, value: 0.8,  fmt: v => fmtS(v) },
  { key: 'mb',      label: { zh: '矩阵元 <i>b</i>',      en: 'Entry <i>b</i>' },
    min: -1.5, max: 1.5, step: 0.05, value: 0.6,  fmt: v => fmtS(v) },
  /* ω 驱动引擎时钟 θ 的积分（θ += ω·dt）——本工具的演示时钟由 speed
     调速、在 ③ pushSample 中积分，θ 本身不直接入画，故滑杆隐藏 */
  { key: 'omega',   label: { zh: '角速度 <i>ω</i>', en: 'Angular speed <i>ω</i>' },
    min: 0.2, max: 2, step: 0.05, value: 0.6, fmt: v => fmt(v) + ' rad/s' }
];

/* ── i 的本质：场景级常量与小部件（均在 SCENES 之上，引擎零改动） ──
   颜色语义：rose = 第一主曲线（旋转点 z / 三次曲线 / 实轴切片 / z 本体 / 追踪向量）
             violet = 第二曲线（四个驻点 / ∛(2+11i) / 根的迁徙 / z̄ / a+bi 变换云）
             emerald = 第三曲线（∛(2−11i) / z+z̄）· orange = 第四曲线（z·z̄）
             cyan = 源几何（实数轴 / 单位圆 / 曲面 / 镜面 / 向量云）
             amber = 度量注记（旋转弧 / 共轭配对 / 零点坑 / 直角三角形 / J² 闪光） */
const PI = Math.PI, HPI = Math.PI / 2;
const C_ROSE = '#fb7185', C_VIO = '#a78bfa', C_EME = '#34d399', C_ORG = '#fb923c',
      C_CYN = '#2dd4ea', C_AMB = '#fbbf24', C_WHT = '#e2e8f0';
const hexA = (h, a) => 'rgba(' + parseInt(h.slice(1,3),16) + ',' + parseInt(h.slice(3,5),16) + ',' + parseInt(h.slice(5,7),16) + ',' + a + ')';
/* 视角联动：改 state 并同步面板复选框 */
const setToggle = (key, val) => {
  state[key] = val;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = val; });
};
/* 平面旋转与复数格式化 */
const rot2 = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const czs = (re, im) => fmtS(re) + (im < 0 ? ' − ' : ' + ') + fmt(Math.abs(im)) + 'i';
/* 步进旋转：u 个「单位步」→ 弧度。每步前 70% 缓动转过 90°、后 30% 停驻 */
function stepAngle(u) { const n = Math.floor(u), f = u - n; return (n + ease(Math.min(1, f / 0.7))) * HPI; }
/* 圆弧折线（z=0 平面）：圆心 (cx,cy)，半径 r，从 a0 到 a1 */
function arcPts(cx, cy, r, a0, a1) {
  const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 0.05));
  const pts = [];
  for (let j = 0; j <= n; j++) { const a = a0 + (a1 - a0) * j / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), 0]); }
  return pts;
}
/* 复平面坐标轴：中心 (cx,0)，右半宽 hw（可选 hwL 左半宽）、半高 hh；tk = {v, lab, c} */
function axesC(C, cx, hw, hh, o) {
  o = o || {};
  const hl = o.hwL != null ? o.hwL : hw;
  line3(C, [cx - hl, 0, 0], [cx + hw, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [cx + hw, 0, 0], [cx + hw - 0.2, 0, 0], AXIS);
  label3(C, [cx + hw + 0.28, 0, 0], o.xlab || 'Re', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [cx, -hh, 0], [cx, hh, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [cx, hh, 0], [cx, hh - 0.2, 0], AXIS);
  label3(C, [cx, hh + 0.2, 0], o.ylab || 'Im', { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  (o.xticks || []).forEach(tk => {
    line3(C, [cx + tk.v, -0.05, 0], [cx + tk.v, 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [cx + tk.v, -0.22, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'center' }
      : { size: 10, color: 'rgba(159,176,200,.6)', align: 'center' });
  });
  (o.yticks || []).forEach(tk => {
    line3(C, [cx - 0.05, tk.v, 0], [cx + 0.05, tk.v, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [cx - 0.13, tk.v, 0], tk.lab, tk.c
      ? { font: 'italic 11px ' + FONT_MATH, color: tk.c, align: 'right' }
      : { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  });
}
/* 矩形区域网格（z=0 平面）与地面网格（y=0 平面） */
function gridRect(C, x0, x1, y0, y1, st) {
  for (let x = Math.ceil(x0 / st) * st; x <= x1 + 1e-9; x += st) {
    line3(C, [x, y0, 0], [x, y1, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
  for (let y = Math.ceil(y0 / st) * st; y <= y1 + 1e-9; y += st) {

  }
}
function gridFloor(C, g, st) {
  const n = Math.round(g / st);

    if (i === 0) continue;
    const u = i * st;
    line3(C, [u, 0, -g], [u, 0, g], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, 0, u], [g, 0, u], { width: 1, color: 'rgba(148,163,184,0.08)' });

}
/* 填充多边形（直角三角形等；借用引擎 polyPath 的裁剪路径） */
function fillPoly3(C, pts, color) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

/* —— 演示时钟累积量（在 ③ pushSample 中按 speed 积分推进） ——
   turnA：转四分之一圈页的 ×i 步数；matU：矩阵页的 ×J 步数 */
let _lastPushT = 0, turnA = 0, matU = 0;

/* —— ② Cardano：x³ = 15x + 4 的双景常量 ——
   左景（x·y 图）中心 CBA.cx；右景（复平面）中心 CBB.cx。
   2+11i 的模 = 5√5，其立方根模 = √5；k=0 分支恰是 2+i。 */
const CBA = { cx: -1.95, sx: 0.28, sy: 0.042, x0: -4.4, x1: 4.8 };
const CBB = { cx: 1.85, s: 0.42 };
const CB_ARG = Math.atan2(11, 2), CB_MOD = Math.sqrt(5);
const CB_ROOTS = [0, 1, 2].map(k => {
  const a = (CB_ARG + 2 * PI * k) / 3;
  return [CB_MOD * Math.cos(a), CB_MOD * Math.sin(a)];
});
/* 三个实根 = 各分支共轭对之和 2·Re：[4, −2−√3, −2+√3] */
const CB_REAL = CB_ROOTS.map(r => 2 * r[0]);
const CB_REAL_LAB = ['4', '−2−√3', '−2+√3'];

/* —— ③ 纸面外的根：曲面 |p(z)| —— 世界坐标 x = Re z, z = Im z, y = |p|·比例 */
const RT_D = 1.8, RT_GN = 40, RT_SC = [0.35, 0.15], RT_CRIT = 2 / (3 * Math.sqrt(3));
function pEval(sel, c, re, im) {   /* p(z) 的实部与虚部 */
  if (sel === 0) return [re * re - im * im + c, 2 * re * im];
  return [re * re * re - 3 * re * im * im - re + c, 3 * re * re * im - im * im * im - im];
}
let rtCache = null;
function rtEnsure() {   /* 线框网面缓存：换 (sel, c) 才重建 */
  const sel = Math.round(state.polySel), c = state.cc;
  if (rtCache && rtCache.sel === sel && rtCache.c === c) return rtCache;
  const sc = RT_SC[sel], mesh = [];
  const X = i => -RT_D + 2 * RT_D * i / RT_GN;
  const h = (re, im) => { const p = pEval(sel, c, re, im); return Math.hypot(p[0], p[1]) * sc; };
  for (let j = 0; j <= RT_GN; j += 2) {
    for (let i = 0; i <= RT_GN; i++) mesh.push([X(i), h(X(i), X(j)), X(j)]);
    mesh.push(null);
  }
  for (let i = 0; i <= RT_GN; i += 2) {
    for (let j = 0; j <= RT_GN; j++) mesh.push([X(i), h(X(i), X(j)), X(j)]);
    mesh.push(null);
  }
  rtCache = { sel: sel, c: c, mesh: mesh };
  return rtCache;
}
/* p(z) 的零点（解析解，确定性）：返回 [[Re, Im], …] */
function rtRoots(sel, c) {
  if (sel === 0) {
    if (c <= 0) { const r = Math.sqrt(-c); return [[r, 0], [-r, 0]]; }
    const r = Math.sqrt(c);
    return [[0, r], [0, -r]];
  }
  /* z³ − z + c：三实根（|c| ≤ 2/(3√3)）用三角解，否则 Cardano + 共轭对 */
  if (Math.abs(c) <= RT_CRIT) {
    const m = 2 / Math.sqrt(3), ph = Math.acos(clamp(-c * 3 * Math.sqrt(3) / 2, -1, 1)) / 3;
    return [0, 1, 2].map(k => [m * Math.cos(ph - 2 * PI * k / 3), 0]);
  }
  const D = Math.sqrt(c * c / 4 - 1 / 27);
  const r = Math.cbrt(-c / 2 + D) + Math.cbrt(-c / 2 - D);
  const im = Math.sqrt(Math.max(0, 3 * r * r - 4)) / 2;
  return [[r, 0], [-r / 2, im], [-r / 2, -im]];
}
/* 根的迁徙路径：c 扫过 [−2,2] 时全部零点的足迹（每多项式懒生成一次） */
const rtPathCache = {};
function rtPath(sel) {
  if (rtPathCache[sel]) return rtPathCache[sel];
  const pts = [];
  for (let c2 = -2; c2 <= 2.001; c2 += 0.02) {
    rtRoots(sel, c2).forEach(r => pts.push([r[0], 0, r[1]]));
  }
  rtPathCache[sel] = pts;
  return pts;
}

/* —— ⑤ i 就是一个矩阵：确定性向量云（24 支，长度按黄金角展开） —— */
const MAT_N = 24, MAT_CLOUD = [];
for (let k = 0; k < MAT_N; k++) {
  const a = k * 2 * PI / MAT_N, L = 0.62 + 0.46 * (0.5 + 0.5 * Math.sin(k * 2.3999632));
  MAT_CLOUD.push([L * Math.cos(a), L * Math.sin(a)]);
}

      /* 曲面（青线框，源几何） */

          const sp = proj(C, [r[0], 0, r[1]]);
          if (sp) glowDot(sp, 10, '#fff7e0', 'rgba(251,191,36,0.9)');
          label3(C, [r[0], 0.24, r[1]], Math.abs(r[1]) < 1e-9 ? fmtS(r[0]) : czs(r[0], r[1]),

        });
        const dc = sel === 0 ? Math.abs(c) : Math.min(Math.abs(c - RT_CRIT), Math.abs(c + RT_CRIT));
        if (dc < 0.07) {
          const mp = sel === 0 ? [0, 0, 0] : [(c > 0 ? 1 : -1) / Math.sqrt(3), 0, 0];
          const sp = proj(C, mp);
          if (sp) glowDot(sp, 15 + 3 * Math.sin(state.t * 9), '#fff7e0', 'rgba(251,191,36,0.85)');
          label3(C, [mp[0], -0.32, mp[2]], t({ zh: '根正在离开纸面', en: 'roots leaving the paper' }),

      return '<div class="sinC">p(x) = ' + (sel === 0 ? 'x² + c' : 'x³ − x + c') + '&ensp;·&ensp;c = <b>' + fmtS(c) + '</b></div>' +

          /* 琥珀度量：转角 arg z */
          const a0 = Math.atan2(pv[1], pv[0]), a1 = a0 + Math.atan2(b, a);

          label3(C, [0.62 * Math.cos((a0 + a1) / 2), 0.62 * Math.sin((a0 + a1) / 2), 0], 'arg z',
            { font: 'italic 11px ' + FONT_MATH, color: C_AMB, align: 'center' });

      }

      /* J² = −I 命中：琥珀闪光 */
      if (state.mDemo && Math.abs(mod2pi(rot) - PI) < 0.2) {
        const sp = proj(C, [0, 0, 0]);
        if (sp) glowDot(sp, 16 + 3 * Math.sin(state.t * 9), '#fff7e0', 'rgba(251,191,36,0.85)');
        label3(C, [0, -1.66, 0], 'J² = −I · ' + t({ zh: '每个向量精确反向', en: 'every vector exactly reversed' }),
          { font: 'italic 12.5px ' + FONT_MATH, color: C_AMB, align: 'center' });
      }

      label3(C, [-2.05, 1.44, 0], 'a + bi ≡ [a −b; b a]', { font: 'italic 13px ' + FONT_MATH, color: C_VIO, align: 'left' });
    },
    readout() {
      const a = state.ma, b = state.mb;
      const n = Math.floor(matU), nm = ((n % 4) + 4) % 4;

        '<div class="cosC">M = [a −b; b a] = [<b>' + fmtS(a) + '&thinsp;' + fmtS(-b) + '; ' + fmtS(b) + '&thinsp;' + fmtS(a) + '</b>]</div>' +
        '<div class="cotC">det M = a² + b² = <b>' + fmt(a * a + b * b) + '</b> = |z|²</div>' +
        '<div class="ambC">arg = <b>' + (Math.atan2(b, a) * 180 / PI).toFixed(0) + '°</b>&ensp;·&ensp;|z| = <b>' + fmt(Math.hypot(a, b)) + '</b></div>' +
        '<div class="dim">λ² + 1 = 0 → λ = ±i' + t({ zh: '（旋转「丢失」的特征值）', en: ' (the eigenvalues rotation "lost")' }) + '</div>';
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 共享时钟按 speed 积分推进两个演示累积量：turnA（转四分之一圈页的
     ×i 步数）与 matU（矩阵页的 ×J 步数）。重置（t 回到 0）时一并归位；
     暂停时本函数不被调用，演示随模拟一同冻结。
     原则：记录「当时的真实值」——采样存的是该瞬间的步数，中途改
     speed 不重算历史。 */
  let dt = state.t - _lastPushT;
  if (dt < 0) { dt = 0; turnA = 0; matU = 0; }
  _lastPushT = state.t;
  if (state.stepDemo) turnA += dt * state.speed * 0.9;
  if (state.mDemo)    matU  += dt * state.speed * 0.9;
  samples.push({ t: state.t, a: turnA, m: matU });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
