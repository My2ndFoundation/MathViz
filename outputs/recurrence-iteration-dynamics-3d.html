<!-- ============================================================
  递推、迭代与稳定性 · 交互式数学可视化
  基于 math-viz-starter.html v1.0.0 制作
  设计规范：math-viz-design-system.md（令牌 / 组件 / 绘制语言 / 交互词汇）

  核心顿悟：递推关系不是直接给出数列，而是定义一台
  反复把输出送回输入的机器 xₙ₊₁ = f(xₙ)。

  三个页签共享同一只步进时钟（n = ⌊ωt⌋，同一台机器、不同的测量）：
    蛛网图   —— 竖线撞曲线、横线回对角线，机器的运转轨迹
                顿悟视角：「正视蛛网」收敛 / 交替 / 发散 / 2 周期一目了然
    三维序列 —— 序列抬进 (xₙ, xₙ₊₁, n) 空间成一条空间折线
                顿悟视角：「正视 xₙ·xₙ₊₁」折线塌缩到曲线 y=f(x) 上
    牛顿迭代 —— f(x) = x − g(x)/g′(x) 只是另一台迭代机
                顿悟视角：「迭代机 f」切线步骤原来就是蛛网图

  采样原则：orbit 记录每一步的真实迭代值；参数中途改变只影响
  未来的步骤，历史轨迹绝不重算；重置（R）以 x₀ 重新播种。
  唯一的例外是牛顿页开着自动播放时：x₀ 由时间驱动，轨道每帧按当前 x₀
  重播这一轮（见 replayOrbN），画的永远是此刻那个起点的真实级联；
  关掉自动播放即回到上面的原语义，蛛网 / 三维序列两页始终不受影响。

  版本记录（changelog，新→旧）：
    1.1.0  2026-07-31  静止页签接入时间驱动：自动播放可开关，往返/循环可切换；
                       牛顿页在驱动下按当前 x₀ 重新上膛，收敛后不再永久定格
    1.0.1  2026-07-31  参数面板按页签显示：各场景声明 params，只列出对当前页签有效的滑块
    1.0.0  2026-07-12  首个版本：蛛网图 / 三维序列 / 牛顿迭代三页签
============================================================ -->

<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'recurrence-iteration-dynamics-3d',
  title: { zh: '递推、迭代与稳定性 · Recurrence & Iteration', en: 'Recurrence & Iterative Dynamics' },
  h1:    { zh: '递推 · 迭代与稳定性', en: 'Recurrence · Iteration' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ============ 场景级辅助（工具区，位于引擎之上，不改引擎） ============ */
const ROSE = '#fb7185', VIOLET = '#a78bfa', EMERALD = '#34d399',
      CYAN = '#2dd4ea', AMBER = '#fbbf24', WHITE = '#e2e8f0';
const ORBIT_MAX = 400;   /* 迭代步数上限 */
const DIVERGE = 1e6;     /* 视为发散的阈值 */
const CLIPW = 3.0;       /* 世界坐标裁剪（§6 奇点约定） */
const ZSTEP = 0.5;       /* 三维序列页：每一步沿 n 轴的世界间距 */

/* —— 迭代机家族（蛛网 / 三维序列页共用） —— */
const FAMS = [
  { name: { zh: '线性 a·x + b', en: 'linear a·x + b' } },
  { name: { zh: '逻辑 r·x(1−x)', en: 'logistic r·x(1−x)' } }
];
function famIdx() { return Math.round(state.family); }
function fMap(x) { return famIdx() === 0 ? state.a * x + state.b : state.r * x * (1 - x); }
function fDer(x) { return famIdx() === 0 ? state.a : state.r * (1 - 2 * x); }
function fLabel() {
  return famIdx() === 0
    ? 'f(x) = ' + fmtS(state.a) + '·x ' + (state.b < 0 ? '− ' : '+ ') + fmt(Math.abs(state.b))
    : 'f(x) = ' + fmt(state.r) + '·x(1−x)';
}
/* 值 → 世界坐标（线性族 1:1 缩放，逻辑族把 [0,1] 摊满画面） */
function mx(x) { return famIdx() === 0 ? x * 0.9 : (x - 0.5) * 3.6; }
function famDom() { return famIdx() === 0 ? [-2.4, 2.4] : [-0.03, 1.03]; }
function famTicks() { return famIdx() === 0 ? [-2, -1, 1, 2] : [0, 1]; }
/* |值| > 999 显示 ±∞（§7），d 为小数位 */
function fmtV(v, d) { return (isFinite(v) && Math.abs(v) <= 999) ? fmtS(v, d == null ? 2 : d) : '±∞'; }

/* —— 牛顿迭代页：g(x) 与迭代机 f(x) = x − g/g′ —— */
const GS = [
  { label: 'g(x) = x²−2', g: x => x * x - 2,   d: x => 2 * x,         roots: [-Math.SQRT2, Math.SQRT2], ys: 0.72, xr: 2.4 },
  { label: 'g(x) = x³−x', g: x => x * x * x - x, d: x => 3 * x * x - 1, roots: [-1, 0, 1],                ys: 0.5,  xr: 2.2 }
];
function gCur() { return GS[Math.round(state.gsel)]; }
function nMap(x) {
  const G = gCur(), d = G.d(x);
  if (Math.abs(d) < 1e-6) return Infinity;
  return x - G.g(x) / d;
}
const mxN = x => x * 0.9;

/* —— 轨道（orbit = 数列本身；同一只步进时钟 n = ⌊ωt⌋ 驱动两台机器） —— */
let orbF = [0], orbN = [0];
function reseed() {
  orbF = [famIdx() === 0 ? clamp(state.x0, -2, 2) : clamp(state.x0, 0.02, 0.98)];
  orbN = [clamp(state.x0, -2, 2)];
}
function stepVal(map, x) {
  if (!isFinite(x) || Math.abs(x) > DIVERGE) return Infinity;
  const y = map(x);
  return (!isFinite(y) || Math.abs(y) > DIVERGE) ? Infinity : y;
}
function nNow() { return Math.min(Math.floor(state.theta), ORBIT_MAX - 1); }

/* —— 牛顿页的「重新上膛」（仅在 x₀ 被驱动时生效） ——
   牛顿法五六步就把误差压到机器精度，之后 xₙ 恒等于根：一次演进演完，画面永久定格。
   驱动 x₀ 后，这一页有两只钟且分工不同：步进钟 n = ⌊ωt⌋ 说「这一轮演到第几步」，
   驱动说「这一轮从哪里开始」。每 NEWTON_RUN 步为一轮，轮满就把级联收回起点重演。
   轨道按「当前 x₀ 走到第 n 步」逐帧重播，所以画出来的永远是此刻滑杆上那个起点的
   真实级联——不会出现轨迹用旧 x₀ 算、滑杆却已经滑到别处的自相矛盾。
   关掉自动播放（或伸手拖 x₀）立刻回到原语义：一次播种、只向前走、绝不重算。
   蛛网 / 三维序列两页共用的 orbF 完全不受影响，仍是绝不重算的真实历史。 */
/* 一轮 4 步，步号 k = 1…4（不含 0）。两条边界各有理由：
   上界 4 —— 切线步骤只画最近 4 步，k ≤ 4 才保证这 4 步里含第 1 步，也就是那条从当前
   x₀ 出发、随 x₀ 一起滑动的切线；再长一步，画面里就只剩几条早已收敛到根、叠在一起
   不动的线段了（实测：一轮 7 步时，步号 5、6 上出现整整 0.5 s 的零像素变化）。
   下界 1 —— 步号 0 那一帧只有一个孤零零的起点：既没有切线可画，读数区也只能写
   「上一步 ±∞」，与本页 tips 让人盯的「误差 ≈ 前误差²」直接打架。每轮从第 1 步起，
   前一步的误差就永远存在，那句话才句句为真。 */
const NEWTON_RUN = 4;
/* 用引擎的只读访问器判定，不要手写 `autoPlay[...] && SCENES[...].drive`：
   同一个判据在仓库里出现两种写法，正是这个引擎被复制成 51 份后最容易漂移的地方。
   driveInfo() 已经含「当前页签有 drive」+「用户没关掉自动播放」两个条件。 */
function newtonDriven() {
  const d = driveInfo();
  return !!d && d.key === 'x0';
}
function replayOrbN() {
  /* 用未截顶的 θ 数步：ORBIT_MAX 是给 orbF 数组封顶的，而重播出来的轨道
     长度恒 ≤ NEWTON_RUN + 1，不受那条上限约束，也就不会在 t 很大时卡住不动。 */
  const steps = 1 + (Math.floor(Math.max(0, state.theta)) % NEWTON_RUN);
  orbN = [clamp(state.x0, -2, 2)];
  for (let i = 0; i < steps; i++) orbN.push(stepVal(nMap, orbN[i]));
}

/* —— 蛛网折线（顶点由新到旧，头亮尾隐；越界裁剪并断开） —— */
function cobwebPts(orb, M, maxV) {
  const fwd = [];
  const P = (x, y) => {
    const wx = M(x), wy = M(y);
    if (!isFinite(wx) || !isFinite(wy)) { fwd.push(null); return; }
    if (Math.abs(wx) > CLIPW || Math.abs(wy) > CLIPW) {
      fwd.push([clamp(wx, -CLIPW, CLIPW), clamp(wy, -CLIPW, CLIPW), 0]);
      fwd.push(null);
      return;
    }
    fwd.push([wx, wy, 0]);
  };
  if (orb.length && isFinite(orb[0])) P(orb[0], 0);
  for (let i = 0; i + 1 < orb.length; i++) {
    const a = orb[i], b = orb[i + 1];
    if (!isFinite(a) || !isFinite(b)) { fwd.push(null); continue; }
    P(a, b);   /* 竖线：撞向曲线取 f(xₙ) */
    P(b, b);   /* 横线：滑回对角线换座 */
  }
  let arr = fwd;
  if (arr.length > maxV) arr = arr.slice(arr.length - maxV);
  return arr.slice().reverse();
}

/* —— 函数曲线折线（越界与陡跳处以 null 断开，§6） —— */
function curvePts(fn, xa, xb, N, MXf, MYf, lim) {
  const pts = [];
  let pw = null;
  for (let i = 0; i <= N; i++) {
    const x = xa + (xb - xa) * i / N;
    const y = fn(x);
    const wy = isFinite(y) ? MYf(y) : Infinity;
    if (!isFinite(wy) || Math.abs(wy) > lim) { pts.push(null); pw = null; continue; }
    if (pw !== null && Math.abs(wy - pw) > 1.2) pts.push(null);
    pts.push([MXf(x), wy, 0]);
    pw = wy;
  }
  return pts;
}

/* —— 自定义二维轴（xₙ / xₙ₊₁ 等标签，场景级组合，不动引擎 drawAxes） —— */
function axes2D(C, ex, ey, xl, yl, ticks, M) {
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.3, 0, 0], xl, { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.2, 0], yl, { font: 'italic 14px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const v of (ticks || [])) {
    const w = M(v);
    if (Math.abs(w) > ex) continue;
    const lb = (v < 0 ? '−' : '') + Math.abs(v);
    line3(C, [w, -0.05, 0], [w, 0.05, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [w, -0.22, 0], lb, { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    line3(C, [-0.05, w, 0], [0.05, w, 0], { width: 1.2, color: AXIS_DIM });
    label3(C, [-0.14, w, 0], lb, { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }
}

/* —— 三维序列页：n 轴（沿 z，最新一步贴在 z=0） —— */
function axisN(C) {
  line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
  arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
  label3(C, [0, 0, WAVE_LEN + 0.9], 'n', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const k = nNow();
  for (let j = 1; j * ZSTEP <= WAVE_LEN + 1e-6; j++) {
    if (k - j < 0) break;
    line3(C, [0, -0.06, j * ZSTEP], [0, 0.06, j * ZSTEP], { width: 1.2, color: AXIS_DIM });
    if (j % 4 === 0) label3(C, [0, -0.25, j * ZSTEP], 'n−' + j, { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
  }
}

/* —— 三维序列点集（由新到旧）：Pᵢ = (xᵢ, xᵢ₊₁, (k−1−i)·ZSTEP) —— */
function liftPts() {
  const k = orbF.length - 1, out = [];
  for (let i = k - 1; i >= 0; i--) {
    const z = (k - 1 - i) * ZSTEP;
    if (z > WAVE_LEN) break;
    const a = orbF[i], b = orbF[i + 1];
    if (!isFinite(a) || !isFinite(b)) { out.push(null); continue; }
    const wx = mx(a), wy = mx(b);
    if (Math.abs(wx) > CLIPW || Math.abs(wy) > CLIPW) { out.push(null); continue; }
    out.push([wx, wy, z]);
  }
  return out;
}

/* —— 联动：视角选中时自动开启对应开关（§5.3） —— */
function forceToggle(key) {
  if (state[key]) return;
  state[key] = true;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = true; });
}

/* —— 读数区固定首两行（步进时钟版本） —— */
function roHead(machine) {
  /* 牛顿页被驱动时级联每 NEWTON_RUN 步重演一轮，画面上只有第 1…4 步；此时再印全局的
     n = ⌊ωt⌋ 就是在说谎（读数一路数到 46，画布上只有 4 步）。改印本轮步号，与画布同源。 */
  const nCell = newtonDriven()
    ? 'n = <b>' + (orbN.length - 1) + '</b> / ' + NEWTON_RUN +
      t({ zh: '（本轮）', en: ' (this run)' })
    : 'n = ⌊ωt⌋ = <b>' + nNow() + '</b>';
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;' + nCell + '</div>' +
         '<div class="dim">' + t({ zh: '迭代机 ', en: 'machine ' }) + machine + '</div>';
}
function seqTail(orb, m) {
  const k = orb.length - 1, parts = [];
  for (let i = Math.max(0, k - m); i <= k; i++) parts.push(fmtV(orb[i]));
  return (k - m > 0 ? '… ' : '') + parts.join(' → ');
}
function capNote() {
  return orbF.length >= ORBIT_MAX
    ? '<div class="dim">' + t({ zh: '已达迭代上限 · 按 R 重置', en: 'iteration cap reached · press R to reset' }) + '</div>'
    : '';
}
function fmtErr(e) {
  if (!isFinite(e)) return '±∞';
  if (e === 0) return '0';
  return e < 0.005 ? e.toExponential(1).replace('-', '−') : fmt(e);
}
function regimeStr() {
  if (famIdx() === 0) {
    const a = state.a;
    if (Math.abs(a) >= 1) return t({ zh: '|a| ≥ 1 · 蛛网被甩出（发散）', en: '|a| ≥ 1 · thrown outward (diverges)' });
    return a >= 0
      ? t({ zh: '0 ≤ a < 1 · 单调收敛', en: '0 ≤ a < 1 · monotone convergence' })
      : t({ zh: '−1 < a < 0 · 交替收敛（螺旋）', en: '−1 < a < 0 · alternating (spiral) convergence' });
  }
  const r = state.r;
  if (r < 1) return t({ zh: 'r < 1 · 收敛到 0', en: 'r < 1 · converges to 0' });
  if (r < 3) return t({ zh: '1 < r < 3 · 收敛到 x* = 1−1/r', en: '1 < r < 3 · converges to x* = 1−1/r' });
  if (r < 3.45) return t({ zh: 'r > 3 · 2 周期环（蛛网方框）', en: 'r > 3 · period-2 cycle (cobweb box)' });
  return t({ zh: 'r 更大 · 周期倍增 → 混沌', en: 'larger r · period doubling → chaos' });
}

          (k >= 1 ? fmtV(orbF[k - 1]) : fmtV(xk)) + '</b>, <b>' +
          (k >= 1 ? fmtV(xk) : fmtV(fMap(xk))) + '</b>)</div>' +
        '<div class="dim">' + seqTail(orbF, 4) + '</div>' +
        '<div class="dim">' + t({ zh: '正视底面（按 2）：折线塌缩到 y = f(x) 上', en: 'front view (press 2): polyline collapses onto y = f(x)' }) + '</div>' + capNote();
    }
  },

  /* ────── 页签 3：牛顿迭代 —— 求根也是同一台机器 ────── */
  newton: {
    label: { zh: '牛顿迭代', en: 'Newton' },
    params: ['x0', 'omega', 'gsel'],
    /* tips 让人「盯住误差」，可误差在收敛后就不再变了——这一页演一次就永久定格。
       本页三根滑块里 ω 是钟本身、g 是离散选择，真正的自变量只有起点 x₀：起点一路滑过去，
       「从哪来」决定要几步才被二次收敛吸住，也决定是从上方单调逼近还是先越过根再回头。
       值域没取满 [−2, 2]，收进 [0.7, 2]：牛顿映射在 g′ = 0 处没有定义，下一步直接飞出画框
       （x²−2 的退化点在 0，x³−x 的在 ±0.577，都落在量程中段而非两端），扫掠必须绕开；
       负半轴只是正半轴关于根的镜像，收掉不丢任何教学内容。这一段里两个 g 都全程收敛到
       正根，画面上永远有在动的东西。
       从 2 跳回 0.7 起点会瞬移 ⇒ linear（往返）；每步一次迭代，8 s 足够读完误差那两行。
       8 s 与「一轮 4 步 ÷ 默认 ω = 1」相位锁定：一轮正好扫完起点区间的一趟，去程一轮、
       回程一轮，画面每 8 s 严丝合缝地重复一次（实测 Δ8 s 逐像素为 0、Δ10 s 为 0.13%）。
       配套的重新上膛见 replayOrbN——只声明 drive 而不重播，画面会用旧 x₀ 的轨迹骗人。 */
    drive: { key: 'x0', from: 0.7, to: 2, period: 8, kind: 'linear' },
    brand: { zh: '牛顿法只是另一台迭代机：f(x) = x − g(x)/g′(x)。每一步在 (xₙ, g(xₙ)) 作切线、滑到与 x 轴的交点，就得到 xₙ₊₁；在根附近误差按平方缩小。',
             en: 'Newton’s method is just another iteration machine: f(x) = x − g(x)/g′(x). Each step draws the tangent at (xₙ, g(xₙ)) and slides to where it hits the x-axis — that is xₙ₊₁. Near a root the error shrinks quadratically.' },
    tips: { zh: '提示：盯住读数区的误差——每一步大约是前一步的平方（二次收敛）。按 3「迭代机 f」：切线步骤原来就是同一张蛛网图，只是这台 f 在根处斜率为 0，把蛛网吸得飞快。',
            en: 'Tip: watch the error in the readout — each step is roughly the square of the last (quadratic convergence). Press 3 (machine f): the tangent steps are the very same cobweb, except this f has slope 0 at the root, so the web gets sucked in fast.' },
    views: {
      iso:     { label: { zh: '立体',     en: '3D' },           az: -0.7,  el: 0.35, dist: 8.5, tx: 0, ty: 0, tz: 0 },
      front:   { label: { zh: '正视切线', en: 'Front tangent' }, az: 0.001, el: 0.02, dist: 6.2, tx: 0, ty: 0, tz: 0 },
      machine: { label: { zh: '迭代机 f', en: 'Machine f' },     az: 0.001, el: 0.02, dist: 6.2, tx: 0, ty: 0, tz: 0,
                 onSelect() { forceToggle('showMachine'); } }
    },
    toggles: [
      { key: 'showG',       label: { zh: '曲线 g(x)',        en: 'Curve g(x)' },        color: '#fb7185', checked: true },
      { key: 'showTan',     label: { zh: '切线步骤',         en: 'Tangent steps' },     color: '#34d399', checked: true },
      { key: 'showMachine', label: { zh: '迭代机 f 与 y = x', en: 'Machine f & y = x' }, color: '#a78bfa', checked: false },
      { key: 'showGrid',    label: { zh: '网格',              en: 'Grid' },              color: '#64748b', checked: true }
    ],
    sampleWindow: () => 12,
    draw(C) {
      const G = gCur(), MY = y => y * G.ys, k = orbN.length - 1;
      if (state.showGrid) drawGridXY(C, 2, 0.5);
      axes2D(C, 2.4, 2.4, 'x', 'g(x)', [-2, -1, 1, 2], mxN);

      /* 根（琥珀 · 度量注记） */
      for (const rt of G.roots) {
        const w = mxN(rt);
        line3(C, [w, -0.09, 0], [w, 0.09, 0], { width: 1.6, color: 'rgba(251,191,36,0.9)' });
        label3(C, [w, 0.24, 0], 'x*', { font: 'italic 12px ' + FONT_MATH, color: AMBER, align: 'center' });
      }

      /* 曲线 g(x)（玫红 · 第一主曲线） */
      if (state.showG) {
        const pts = curvePts(G.g, -G.xr, G.xr, 200, mxN, MY, 2.5);
        strokePoly(C, pts, { width: 5.5, color: 'rgba(251,113,133,0.13)' });
        strokePoly(C, pts, { width: 2.2, color: 'rgba(251,113,133,0.95)' });
        label3(C, [-2.25, 2.15, 0], G.label, { font: 'italic 13px ' + FONT_MATH, color: ROSE, align: 'left' });
      }

      /* 迭代机 f = x − g/g′（紫）与对角线（青）：牛顿法的蛛网真身 */
      if (state.showMachine) {
        line3(C, [-2.25, -2.25, 0], [2.25, 2.25, 0], { width: 1.6, color: 'rgba(45,212,234,0.8)' });
        label3(C, [2.05, 1.85, 0], 'y = x', { font: 'italic 13px ' + FONT_MATH, color: CYAN, align: 'left' });
        const pts = curvePts(nMap, -G.xr, G.xr, 260, mxN, mxN, 2.5);
        strokePoly(C, pts, { width: 5.5, color: 'rgba(167,139,250,0.13)' });
        strokePoly(C, pts, { width: 2, color: 'rgba(167,139,250,0.9)' });
        label3(C, [-2.25, -2.15, 0], 'f(x) = x − g/g′', { font: 'italic 13px ' + FONT_MATH, color: VIOLET, align: 'left' });
        const web = cobwebPts(orbN, mxN, 70);
        strokePoly(C, web, { width: 1.6, fade: ['rgba(167,139,250,0.9)', 'rgba(167,139,250,0.05)'] });
      }

      /* 切线步骤（翠绿 · 结构线）：新一步实亮，旧几步渐隐 */
      if (state.showTan) {
        for (let j = Math.min(4, k); j >= 1; j--) {
          const a = orbN[k - j], b = orbN[k - j + 1];
          if (!isFinite(a) || !isFinite(b)) continue;
          const wa = [mxN(a), MY(G.g(a)), 0], wb = [mxN(b), 0, 0];
          if (Math.abs(wa[0]) > CLIPW || Math.abs(wa[1]) > CLIPW || Math.abs(wb[0]) > CLIPW) continue;
          const alpha = j === 1 ? 0.9 : 0.45 / j;
          line3(C, wa, wb, { width: j === 1 ? 1.8 : 1.2, color: 'rgba(52,211,153,' + alpha + ')' });
          if (j === 1) {
            /* 投影虚线（玫红）：从 x 轴交点抬回曲线，即下一步的 g(xₙ₊₁) */
            const gb = MY(G.g(b));
            if (Math.abs(gb) <= CLIPW) line3(C, wb, [wb[0], gb, 0], { width: 1.5, dash: [7, 7], color: 'rgba(251,113,133,0.8)' });
            const hs = proj(C, wa);
            if (hs) glowDot(hs, 9, '#ffffff', 'rgba(251,113,133,0.9)');
            label3(C, [wb[0], -0.3, 0], 'xₙ₊₁', { font: 'italic 12px ' + FONT_MATH, color: AMBER, align: 'center' });
          }
        }
      }

      /* 主点 P：x 轴上的当前迭代值 */
      if (isFinite(orbN[k])) {
        const w = mxN(orbN[k]);
        if (Math.abs(w) <= CLIPW) {
          const sp = proj(C, [w, 0, 0]);
          if (sp) glowDot(sp, 14, '#ffffff', 'rgba(186,240,255,0.9)');
        }
      }
    },
    readout() {
      const G = gCur(), k = orbN.length - 1, xk = orbN[k];
      let err = '±∞', errP = '±∞';
      if (isFinite(xk)) {
        let m = Infinity;
        for (const rt of G.roots) m = Math.min(m, Math.abs(xk - rt));
        err = fmtErr(m);
      }
      if (k >= 1 && isFinite(orbN[k - 1])) {
        let m = Infinity;
        for (const rt of G.roots) m = Math.min(m, Math.abs(orbN[k - 1] - rt));
        errP = fmtErr(m);
      }
      return roHead('f(x) = x − g/g′ · ' + G.label) +
        '<div>xₙ = <b>' + fmtV(xk, 4) + '</b></div>' +
        '<div class="sinC">g(xₙ) = <b>' + (isFinite(xk) ? fmtV(G.g(xk), 4) : '±∞') + '</b></div>' +
        '<div class="tanC">g′(xₙ) = <b>' + (isFinite(xk) ? fmtV(G.d(xk)) : '±∞') + '</b></div>' +
        '<div class="dim">|xₙ − x*| = ' + err + '&ensp;·&ensp;' + t({ zh: '上一步 ', en: 'prev ' }) + errP + '</div>' +
        '<div class="dim">' + t({ zh: '误差 ≈ 前误差²（二次收敛）', en: 'error ≈ (previous error)² — quadratic' }) + '</div>' +
        /* 迭代上限说的是 orbF 那条一直往前长的轨道。本页被驱动时每轮重播、轨道恒 ≤ 5 项，
           永远碰不到上限，不该跟着弹「按 R 重置」——按了也只是把驱动相位归零。
           判据放在这里而不是 capNote() 里：那是三个页签共用的，改它会连累蛛网页。 */
        (newtonDriven() ? '' : capNote());
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 步进时钟：n = ⌊ωt⌋；每跨过一个整数，两台机器各前进一步。
     orbit 记录的是"当时的真实迭代值"——参数中途改变只影响未来步骤，
     历史轨迹绝不重算（§6）。θ = 0 意味着刚重置：以 x₀ 重新播种。 */
  if (state.theta === 0) reseed();
  const nT = nNow();
  while (orbF.length - 1 < nT) {
    orbF.push(stepVal(fMap, orbF[orbF.length - 1]));
    orbN.push(stepVal(nMap, orbN[orbN.length - 1]));
  }
  /* 牛顿页被驱动时按当前 x₀ 重播这一轮（见 replayOrbN）：orbF 不受影响。 */
  if (newtonDriven()) replayOrbN();
  const i = Math.min(nT, orbF.length - 1);
  /* 牛顿轨道重播后长度只到本轮步数，全局步号 i 会越界 —— 取它自己的末项，
     记录的仍是"此刻的真实迭代值"。未重播时两条轨道等长，末项就是 orbN[i]。 */
  const xn = orbN[orbN.length - 1];
  samples.push({
    t: state.t,
    n: i,
    xf: isFinite(orbF[i]) ? orbF[i] : null,
    xn: isFinite(xn) ? xn : null
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;

    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };

}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd()
     （语言切换 / 用户拖动都会触发）读的是吸附后的 input.value，会把这点
     差值永久写回 state —— 暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
