<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'weierstrass-essence-3d',
  title: { zh: '万能代换的本质 · 单位圆的弦斜率参数化', en: 'The Weierstrass Substitution' },
  h1:    { zh: '万能代换的本质', en: 'Weierstrass Substitution' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'xAng',   label: { zh: '角 <i>x</i>', en: 'Angle <i>x</i>' },      min: -180, max: 180, step: 1,    value: 60,  fmt: v => v.toFixed(0) + '°', map: v => v * Math.PI / 180, invMap: v => v * 180 / Math.PI },
  { key: 'tSlope', label: { zh: '弦斜率 <i>t</i>', en: 'Chord slope <i>t</i>' }, min: -3, max: 3, step: 0.05, value: 0.5, fmt: v => fmtS(v) },
  { key: 'omega',  label: { zh: '角速度 <i>ω</i>', en: 'Angular speed <i>ω</i>' }, min: 0.2, max: 3, step: 0.05, value: 0.6, fmt: v => fmt(v) + ' rad/s' }
];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：万能代换绘图助手（引擎之上，引擎零改动） ────── */
const ROSE_A = 'rgba(251,113,133,';
const VIO_A = 'rgba(167,139,250,';
const EME_A = 'rgba(52,211,153,';
const ORG_A = 'rgba(251,146,60,';
const AMB_A = 'rgba(251,191,36,';

const V_FLOW = 1.2;   // 页签三：波形沿 t 轴流速
const WY = 0.55;      // 页签三：函数值 → 世界 y
const TCLIP = 2.9;    // 页签三：t 曲线裁剪值（§6 奇点处理）

const gcd = (a, b) => b ? gcd(b, a % b) : a;
/* 滑杆 t 值若恰为小分母分数 p/q，返回 {p, q}（勾股数展示用） */
function niceFrac(v) {
  const p0 = Math.round(v * 20);
  if (Math.abs(v * 20 - p0) > 1e-6) return null;
  const g = gcd(Math.abs(p0), 20) || 20;
  const q = 20 / g;
  if (q > 10) return null;
  return { p: p0 / g, q: q };
}
/* 分数排版（约分 · U+2212 负号 · 整数省略分母） */
function fracS(a, b) {
  const g = gcd(Math.abs(a), Math.abs(b)) || 1;
  a /= g; b /= g;
  if (b < 0) { a = -a; b = -b; }
  const s = a < 0 ? '−' : '';
  return b === 1 ? s + Math.abs(a) : s + Math.abs(a) + '/' + b;
}
/* 圆心 (cx,cy) 处从 a0 到 a1 的角度弧（短程，默认琥珀度量注记） */
function arcAt(C, cx, cy, a0, a1, r, name, col) {
  let d = a1 - a0;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  const n = Math.max(2, Math.ceil(Math.abs(d) / 0.05));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + d * i / n;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: 1.5, color: (col || AMB_A) + '0.85)' });
  if (name) {
    const mid = a0 + d / 2;
    label3(C, [cx + (r + 0.17) * Math.cos(mid), cy + (r + 0.17) * Math.sin(mid), 0], name,
      { font: 'italic 12px ' + FONT_MATH, color: (col || AMB_A) + '1)', align: 'center' });
  }
}
const arcBetween = (C, a0, a1, r, name, col) => arcAt(C, 0, 0, a0, a1, r, name, col);
/* 弦 Q(−s,0) → P(s·cosx, s·sinx)（翠绿主结构）与 y 轴交点 t；
   s 为整体缩放，yMax 为 t 交点可见界；x→±π 时弦竖直、t→∞（§6）。返回 P */
function drawChord(C, x, s, yMax, o) {
  o = o || {};
  const half = x / 2;
  const P = [s * Math.cos(x), s * Math.sin(x)];
  const vertical = Math.abs(Math.cos(half)) < 1e-4;
  if (vertical) {
    line3(C, [-s, -yMax * 0.92, 0], [-s, yMax * 0.92, 0], { width: 2.2, color: EME_A + '0.9)' });
    label3(C, [-s, yMax * 0.92 + 0.16, 0], 't → ±∞',
      { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'center' });
  } else {
    const tv = Math.tan(half);
    const dir = [Math.cos(half), Math.sin(half)];
    /* 延长线（结构层）：延过 y 轴交点，超出可视界时截到边缘 */
    let L = Math.max(2.35 * s, s * Math.sqrt(1 + tv * tv) + 0.3 * s);
    if (Math.abs(dir[1]) * L > yMax + 0.1) L = (yMax + 0.1) / Math.abs(dir[1]);
    line3(C, [-s - 0.3 * s * dir[0], -0.3 * s * dir[1], 0], [-s + L * dir[0], L * dir[1], 0],
      { width: 1.3, color: EME_A + '0.4)' });
    /* 弦本体（辉光 + 内核） */
    line3(C, [-s, 0, 0], [P[0], P[1], 0], { width: 6, color: EME_A + '0.13)' });
    line3(C, [-s, 0, 0], [P[0], P[1], 0], { width: 2.4, color: EME_A + '0.95)' });
    if (o.slopeLabel) {
      label3(C, [-s + (P[0] + s) * 0.55, P[1] * 0.55, 0], 't = tan(x/2)',
        { font: 'italic 12.5px ' + FONT_MATH, color: '#34d399', align: 'center', dy: -14 });
    }
    /* y 轴交点即 t：弦 y = t(x+1) 在 x=0 处取 t */
    if (Math.abs(tv) * s <= yMax) {
      const sp = proj(C, [0, s * tv, 0]);
      if (sp) glowDot(sp, 9, '#ffffff', EME_A + '0.9)');
      if (o.tLabel) label3(C, [0, s * tv, 0], o.tLabel,
        { font: 'italic 12.5px ' + FONT_MATH, color: '#34d399', align: 'left', dx: 11, dy: -9 });
    } else {
      label3(C, [0, (tv > 0 ? yMax + 0.16 : -yMax - 0.16), 0], tv > 0 ? 't → +∞' : 't → −∞',
        { font: 'italic 12.5px ' + FONT_MATH, color: '#34d399', align: 'center' });
    }
  }
  /* 定点 Q（青，源几何） */
  solidDot(C, [-s, 0, 0], 3, 'rgba(45,212,234,0.95)');
  if (o.qLabel) label3(C, [-s, 0, 0], 'Q(−1, 0)',
    { font: 'italic 11px ' + FONT_MATH, color: '#2dd4ea', align: 'center', dy: 16 });
  return P;
}
/* 公式清单（dim 参考区，不参与交互——让学习者知道本页生成哪些公式） */
function formulaList(title, lines) {
  return '<div class="dim" style="margin-top:8px;border-top:1px dashed rgba(148,163,184,.2);padding-top:6px">' +
    t(title) + '</div>' +
    lines.map(s => '<div class="dim" style="font-family:var(--font-math);font-style:italic">' + s + '</div>').join('');
}
/* 视角联动：确保某开关已开（§5.3） */
function enableToggle(key) {
  if (state[key]) return;
  state[key] = true;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = true; });
}

const SCENES = {

  /* ────── 一：弦 · 半角 ────── */
  chord: {
    label: { zh: '弦 · 半角', en: 'Chord · Half angle' },
    params: ['xAng'],
    /* 角 x 扫过整圈时弦、半角与 sin/cos 投影同步变化，正是本页要让人看见的那一件事；
       x = ±π 是 tips 点名的顿悟端点（弦竖直、t → ±∞），所以取满值域不收边。
       首尾同一点（P 都落在 (−1,0)），天然相接 ⇒ circular；读数含角度与三个公式，给 10 s。 */
    drive: { key: 'xAng', from: -Math.PI, to: Math.PI, period: 10, kind: 'circular' },

             en: 'Draw a chord from the fixed point Q(−1,0) to a point P on the circle: the central angle x opens only half as wide at Q, so the chord’s slope is exactly t = tan(x/2) — and it crosses the y-axis at height t. Drag x and watch slope, half angle and axis reading stay one and the same.' },
    tips: { zh: '提示：切「正视 单位圆」看圆周角定理——圆心角 x 张在圆心，同一段弧在 Q 处只张开 x/2，所以弦的斜率恰是 tan(x/2)；这根弦穿过 y 轴的高度就是 t，斜率不用算，抬头读轴即可。把 x 拖到 ±180°，弦竖直、t 冲向 ±∞。',
            en: 'Tip: in "Front: unit circle" watch the inscribed angle theorem — the central angle x opens at the center, but the same arc opens only x/2 at Q, so the chord’s slope is exactly tan(x/2); and the chord crosses the y-axis at height t, so you read the slope straight off the axis. Drag x to ±180° and the chord goes vertical, t racing to ±∞.' },
    views: {

    toggles: [
      { key: 'showChord', label: { zh: '弦与斜率 <i>t</i>', en: 'Chord & slope <i>t</i>' }, color: '#34d399', checked: true },
      { key: 'showProj',  label: { zh: '投影 sin·cos', en: 'sin·cos projections' }, color: '#fb7185', checked: true },
      { key: 'showHalf',  label: { zh: '圆心角与圆周角', en: 'Central & inscribed' }, color: '#fbbf24', checked: true },

    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {
      const x = state.xAng, half = x / 2;

        const fy = proj(C, [0, P[1], 0]);

        label3(C, [P[0], -0.14, 0], 'cos x', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center', dy: 12 });

    readout() {
      const x = state.xAng, half = x / 2, sx = Math.sin(x), cx = Math.cos(x);
      const tv = Math.tan(half);
      const inf = Math.abs(tv) > 999;
      const tvS = inf ? (tv > 0 ? '+∞' : '−∞') : fmtS(tv);
      const slope = Math.abs(1 + cx) < 1e-6 ? null : sx / (1 + cx);
      let out = '<div>x = <b>' + (x * 180 / Math.PI).toFixed(0) + '°</b>&ensp;·&ensp;x/2 = <b>' + (half * 180 / Math.PI).toFixed(0) + '°</b></div>' +

        '<div class="sinC">sin x = <b>' + fmtS(sx) + '</b> = 2t/(1+t²) = <b>' + fmtS(inf ? 0 : 2 * tv / (1 + tv * tv)) + '</b></div>' +
        '<div class="cosC">cos x = <b>' + fmtS(cx) + '</b> = (1−t²)/(1+t²) = <b>' + fmtS(inf ? -1 : (1 - tv * tv) / (1 + tv * tv)) + '</b></div>' +
        '<div class="dim">' + t({ zh: '圆周角定理：圆心角 x 是弦上圆周角 x/2 的两倍', en: 'Inscribed angle theorem: the central angle x doubles the inscribed angle x/2' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（半角家族）', en: 'Formulas this tab generates (the half-angle family)' }, [
        't = tan(x/2) = sinx/(1+cosx) = (1−cosx)/sinx',
        'sinx = 2t/(1+t²) · cosx = (1−t²)/(1+t²)',
        'tanx = 2t/(1−t²)',
        'sin²(x/2) = (1−cosx)/2 · cos²(x/2) = (1+cosx)/2',
        'sinx = 2sin(x/2)cos(x/2) · cosx = 1−2sin²(x/2)',
        t({ zh: '圆周角定理', en: 'inscribed angle theorem' }) + ': x = 2·(x/2)'
      ]);
      return out;
    }
  },

  /* ────── 二：有理点 · 勾股数 ────── */

    drive: { key: 'tSlope', from: -3, to: 3, period: 10, kind: 'linear' },
    brand: { zh: '反过来让斜率 t 当参数：每个 t 给出圆上一点 P = ((1−t²)/(1+t²), 2t/(1+t²))——t 有理，P 必有理。拖动 t 沿数轴滑动，弦绕 Q 扫过整个圆，勾股数一个个亮出来。',
             en: 'Now let the slope t be the parameter: each t picks the point P = ((1−t²)/(1+t²), 2t/(1+t²)) — rational t, rational P. Slide t along its number line and the chord sweeps the whole circle, lighting up Pythagorean triples as it goes.' },
    tips: { zh: '提示：把 t 拖到 1/2、2/5 这样的分数，读数区亮出勾股数——弦斜率有理，落点坐标必有理：单位圆上的所有有理点（勾股数）都是这根弦扫出来的。t 拖到头，P 逼近 (−1,0)——那是唯一漏掉的点。',
            en: 'Tip: drag t to a fraction like 1/2 or 2/5 and the readout lights up a Pythagorean triple — a rational slope forces a rational landing point: every rational point on the circle (every triple) is swept out by this one chord. Push t to the end and P closes in on (−1,0), the only point missed.' },
    views: {

      { key: 'showArc2',  label: { zh: '角 <i>x</i> 与 <i>x</i>/2', en: 'Angles <i>x</i> & <i>x</i>/2' }, color: '#fbbf24', checked: true },

    ],
    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {

      if (state.showGrid) drawGridXY(C, 1.5, 0.5);
      drawAxes(C, { ex: 1.8, ey: 1.75, yTicks: [1], xTicks: [1], tAxis: false });
      drawCircle(C, 1);
      /* t 数轴：y 轴的翠绿刻度——弦的 y 轴交点就是参数本身 */
      if (state.showTAxis) {
        line3(C, [0, -1.55, 0], [0, 1.55, 0], { width: 1.2, color: EME_A + '0.35)' });
        for (let k = -3; k <= 3; k++) {
          if (!k) continue;

          line3(C, [-0.045, yv, 0], [0.045, yv, 0], { width: 1.2, color: EME_A + '0.6)' });

        }
        label3(C, [0.14, 1.62, 0], '(t)', { font: 'italic 12px ' + FONT_MATH, color: EME_A + '0.9)', align: 'left' });
      }
      /* 角度弧：x = 2·arctan t 与 Q 处的 x/2 */
      if (state.showArc2) {
        arcBetween(C, 0, x, 0.3, 'x');
        arcAt(C, -1, 0, 0, x / 2, 0.46, 'x/2');
      }
      const P = drawChord(C, x, 1, 1.5, { tLabel: 't = ' + fmtS(tv), qLabel: true });
      /* 有理坐标投影 */
      if (state.showCoord) {
        line3(C, [P[0], P[1], 0], [0, P[1], 0], { width: 1.5, dash: [7, 7], color: ROSE_A + '0.8)' });
        line3(C, [P[0], P[1], 0], [P[0], 0, 0], { width: 1.5, dash: [7, 7], color: VIO_A + '0.8)' });
        const fy = proj(C, [0, P[1], 0]);
        if (fy) glowDot(fy, 7, '#ffffff', ROSE_A + '0.85)');
        const fx = proj(C, [P[0], 0, 0]);
        if (fx) glowDot(fx, 7, '#ffffff', VIO_A + '0.85)');
        label3(C, [-0.08, P[1], 0], '2t/(1+t²)', { font: 'italic 11px ' + FONT_MATH, color: '#fb7185', align: 'right', dx: -8 });
        label3(C, [P[0], -0.14, 0], '(1−t²)/(1+t²)', { font: 'italic 11px ' + FONT_MATH, color: '#a78bfa', align: 'center', dy: 12 });
      }
      /* 主点 P：t 为好分数时直接标出有理坐标 */
      const sp = proj(C, [P[0], P[1], 0]);
      if (sp) glowDot(sp, 13, '#ffffff', 'rgba(186,240,255,0.9)');
      const fr = niceFrac(tv);
      const pl = fr ? 'P(' + fracS(fr.q * fr.q - fr.p * fr.p, fr.q * fr.q + fr.p * fr.p) + ', ' + fracS(2 * fr.p * fr.q, fr.q * fr.q + fr.p * fr.p) + ')' : 'P';
      label3(C, [P[0] * 1.2, P[1] * 1.2 + 0.05, 0], pl,
        { font: 'italic 12.5px ' + FONT_MATH, color: '#e2e8f0', align: P[0] < -0.2 ? 'right' : 'left', dx: P[0] < -0.2 ? -4 : 6 });
    },
    readout() {
      const tv = state.tSlope, den = 1 + tv * tv;
      const sx = 2 * tv / den, cx = (1 - tv * tv) / den;
      const x = 2 * Math.atan(tv);
      const fr = niceFrac(tv);
      let out = '<div>t = <b>' + fmtS(tv) + '</b>' + (fr && fr.q > 1 ? ' = ' + fracS(fr.p, fr.q) : '') +
        '&ensp;·&ensp;x = 2·arctan t = <b>' + (x * 180 / Math.PI).toFixed(0) + '°</b></div>' +
        '<div class="sinC">sin x = 2t/(1+t²) = <b>' + fmtS(sx) + '</b>' + (fr ? ' = ' + fracS(2 * fr.p * fr.q, fr.p * fr.p + fr.q * fr.q) : '') + '</div>' +
        '<div class="cosC">cos x = (1−t²)/(1+t²) = <b>' + fmtS(cx) + '</b>' + (fr ? ' = ' + fracS(fr.q * fr.q - fr.p * fr.p, fr.p * fr.p + fr.q * fr.q) : '') + '</div>';
      if (fr && fr.p !== 0 && Math.abs(fr.p) !== fr.q) {
        const A0 = Math.abs(fr.q * fr.q - fr.p * fr.p), B0 = Math.abs(2 * fr.p * fr.q), C0 = fr.p * fr.p + fr.q * fr.q;
        const g2 = gcd(gcd(A0, B0), C0);
        const a = A0 / g2, b = B0 / g2, c = C0 / g2;
        out += '<div><span style="color:#fbbf24">' + t({ zh: '勾股数！', en: 'Pythagorean triple!' }) + ' (' + a + ', ' + b + ', ' + c + ')：' + a + '² + ' + b + '² = ' + c + '²</span></div>';
      }
      out += '<div class="dim">' + t({ zh: 't 有理 ⇔ P 有理（(−1,0) 除外）', en: 'rational t ⇔ rational P (except (−1,0))' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（圆的有理点）', en: 'Formulas this tab generates (rational points)' }, [
        'x = 2·arctan t',
        'sinx = 2t/(1+t²) · cosx = (1−t²)/(1+t²)',
        't = p/q ⇒ P = ((q²−p²)/(q²+p²), 2pq/(q²+p²))',
        t({ zh: '勾股数通式', en: 'Pythagorean triples' }) + ': (q²−p², 2pq, q²+p²)',
        '(3,4,5) (5,12,13) (8,15,17) (7,24,25) (20,21,29) …',
        't → ±∞ ⇒ P → (−1, 0)' + t({ zh: '（唯一漏掉的点）', en: ' (the only point missed)' })
      ]);
      return out;
    }
  },

  /* ────── 三：代换 · 有理化 ────── */
  subst: {
    label: { zh: '代换 · 有理化', en: 'Substitute' },
    params: ['omega'],
    brand: { zh: 'P 绕圆匀速转动：sin 与 cos 永远困在 ±1 之间，而 t = tan(x/2) 每圈从 −∞ 扫到 +∞、走完整条实数轴——所以任何 sin、cos 的有理式都能代换成 t 的有理函数来积分。',
             en: 'Let P orbit at constant speed: sin and cos stay trapped in ±1, while t = tan(x/2) sweeps the entire real line every turn — which is why any rational expression in sin and cos integrates as a rational function of t.' },
    tips: { zh: '提示：切「侧视 y·t」对比三条曲线——sin、cos 有界，而翠绿的 t 每圈从 −∞ 冲到 +∞、把实数轴走完一遍，过 (−1,0) 时断开（渐近虚线标 ∞）。一圈 ↔ 一条实数轴，这就是三角积分能全局化为有理积分的原因。',
            en: 'Tip: in "Side y·t" compare the three curves — sin and cos are bounded, while the emerald t races from −∞ to +∞ every single turn, covering the whole real line and breaking at (−1,0) (dashed asymptote, marked ∞). One turn ↔ one real line: that is why trig integrals rationalize globally.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.85, el: 0.3, dist: 10.5, tx: 0, ty: 0, tz: 2.6 },
      side:  { label: { zh: '侧视 y·t', en: 'Side y·t' }, az: -Math.PI / 2, el: 0.001, dist: 10.5, tx: 0, ty: 0, tz: 3.2,
               onSelect: () => enableToggle('showT') },
      front: { label: { zh: '正视 圆', en: 'Front: circle' }, az: 0.001, el: 0.02, dist: 7, tx: 0, ty: 0, tz: 0.3 }
    },
    toggles: [
      { key: 'showSin',    label: { zh: 'sin <i>x</i>', en: 'sin <i>x</i>' }, color: '#fb7185', checked: true },
      { key: 'showCos',    label: { zh: 'cos <i>x</i>', en: 'cos <i>x</i>' }, color: '#a78bfa', checked: true },
      { key: 'showT',      label: { zh: '<i>t</i> = tan(<i>x</i>/2)', en: '<i>t</i> = tan(<i>x</i>/2)' }, color: '#34d399', checked: true },
      { key: 'showTan',    label: { zh: 'tan <i>x</i>', en: 'tan <i>x</i>' }, color: '#fb923c', checked: false },
      { key: 'showGuides', label: { zh: '渐近线与周期', en: 'Asymptotes & period' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {
      const th = state.theta;
      if (state.showGrid) drawTimeGrid(C, { yMax: 1.6, v: V_FLOW });
      drawAxes(C, { ex: 1.0, ey: 1.85, yTicks: [], xTicks: [], tAxis: true, v: V_FLOW });
      /* y 轴按函数值标刻度（值 1 ↔ 世界 WY） */
      for (const sg of [1, -1]) {
        line3(C, [-0.05, sg * WY, 0], [0.05, sg * WY, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.13, sg * WY, 0], sg < 0 ? '−1' : '1', { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
      /* ±1 包络（sin、cos 的牢笼——t 不受其困） */
      if (state.showGuides) {
        line3(C, [0, WY, 0], [0, WY, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(148,163,184,0.22)' });
        line3(C, [0, -WY, 0], [0, -WY, WAVE_LEN], { width: 1, dash: [5, 6], color: 'rgba(148,163,184,0.22)' });
        /* 渐近线：每次过 (−1,0)，t 从 +∞ 跳到 −∞ */
        for (let i = samples.length - 1; i > 0; i--) {
          if (samples[i].m !== samples[i - 1].m) {
            const z = (state.t - samples[i].t) * V_FLOW;
            if (z > WAVE_LEN) break;
            line3(C, [0, -1.6, z], [0, 1.6, z], { width: 1, dash: [4, 5], color: EME_A + '0.3)' });
            label3(C, [0, 1.72, z], '∞', { font: 'italic 15px ' + FONT_MATH, color: EME_A + '0.8)', align: 'center' });
          }
        }
        drawPeriodBracket(C, TAU / state.omega, V_FLOW, 0, -1.75, 'T = 2π/ω = ' + fmt(TAU / state.omega) + ' s');
      }
      /* 历史曲线（真实记录，t 与 tan 在分支边界断开并裁剪，§6） */
      const defs = [
        { on: state.showTan, f: 'tn', c: ORG_A, brk: 'mt', w: 1.8, hw: 7 },
        { on: state.showCos, f: 'c',  c: VIO_A, brk: null, w: 1.8, hw: 7 },
        { on: state.showSin, f: 's',  c: ROSE_A, brk: null, w: 1.8, hw: 7 },
        { on: state.showT,   f: 'tv', c: EME_A, brk: 'm',  w: 2.4, hw: 9 }
      ];
      for (const d of defs) {
        if (!d.on || samples.length < 2) continue;
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const smp = samples[i];
          const z = (state.t - smp.t) * V_FLOW;
          if (z > WAVE_LEN) break;
          if (d.brk && i < samples.length - 1 && samples[i + 1][d.brk] !== smp[d.brk]) pts.push(null);
          pts.push([0, clamp(smp[d.f], -TCLIP, TCLIP) * WY, z]);
        }
        if (pts.length < 2) continue;
        strokePoly(C, pts, { width: d.w + 3.1, color: d.c + '0.13)' });
        strokePoly(C, pts, { width: d.w, fade: [d.c + '1)', d.c + '0.04)'] });
        const cur = samples[samples.length - 1][d.f];
        if (Math.abs(cur) <= TCLIP) {
          const hp = proj(C, [0, cur * WY, 0]);
          if (hp) glowDot(hp, d.hw, '#ffffff', d.c + '0.9)');
        }
      }
      /* 公式标注（同色锚定） */
      if (state.showT)   label3(C, [0, TCLIP * WY + 0.3, 1.6], 't = tan(x/2)', { font: 'italic 13px ' + FONT_MATH, color: '#34d399', align: 'center' });
      if (state.showSin) label3(C, [0, 0.74, 3.1], 'sin x', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      if (state.showCos) label3(C, [0, -0.74, 3.1], 'cos x', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
      if (state.showTan) label3(C, [0, -TCLIP * WY - 0.3, 1.6], 'tan x', { font: 'italic 12px ' + FONT_MATH, color: '#fb923c', align: 'center' });
      /* z=0 的生成几何：圆 + 弦 + 旋转半径 + 主点 */
      drawCircle(C, WY);
      drawAngleArc(C, th, WY);
      drawChord(C, wrapPI(th), WY, TCLIP * WY, {});
      const P = [WY * Math.cos(th), WY * Math.sin(th)];
      if (state.showGuides && state.showSin) {
        line3(C, [P[0], P[1], 0], [0, P[1], 0], { width: 1.5, dash: [7, 7], color: ROSE_A + '0.7)' });
      }
      line3(C, [0, 0, 0], [P[0], P[1], 0], { width: 2, color: 'rgba(241,245,249,0.92)' });
      const sp = proj(C, [P[0], P[1], 0]);
      if (sp) glowDot(sp, 13, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const th = state.theta;
      const tv = Math.tan(th / 2);
      const inf = Math.abs(tv) > 999;
      let out = readoutHead() +
        '<div class="tanC">t = tan(x/2) = <b>' + (inf ? '±∞' : fmtS(tv)) + '</b></div>' +
        '<div class="sinC">sin x = 2t/(1+t²) = <b>' + fmtS(Math.sin(th)) + '</b></div>' +
        '<div class="cosC">cos x = (1−t²)/(1+t²) = <b>' + fmtS(Math.cos(th)) + '</b></div>' +
        '<div class="dim">' + t({ zh: '一圈 T = ' + fmt(TAU / state.omega) + ' s ↔ t 扫完一整条实数轴', en: 'one turn T = ' + fmt(TAU / state.omega) + ' s ↔ t sweeps the whole real line' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（万能代换字典）', en: 'Formulas this tab generates (the substitution dictionary)' }, [
        't = tan(x/2), x ∈ (−π, π)',
        'sinx = 2t/(1+t²) · cosx = (1−t²)/(1+t²)',
        'tanx = 2t/(1−t²) · dx = 2dt/(1+t²)',
        '∫R(sinx, cosx)dx = ∫R(…)·2/(1+t²)·dt' + t({ zh: '（必为有理式）', en: ' (always rational)' }),
        t({ zh: '例', en: 'e.g.' }) + ': ∫dx/(1+cosx) = ∫dt = tan(x/2) + C',
        t({ zh: '例', en: 'e.g.' }) + ': ∫cscx·dx = ln|tan(x/2)| + C',
        t({ zh: '圆的有理参数化', en: 'rational parametrization' }) + ': (x, y) = ((1−t²)/(1+t²), 2t/(1+t²))'
      ]);
      return out;
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 页签三的曲线：记录当时的真实值；m / mt 为分支编号——
     m 在 θ 过 π+2kπ（P 过 (−1,0)，t 跳 ∓∞）时 +1，mt 是 tanθ 的分支 */
  const th = state.theta;
  samples.push({
    t: state.t,
    s: Math.sin(th),
    c: Math.cos(th),
    tv: Math.tan(th / 2),
    tn: Math.tan(th),
    m: Math.floor((th + Math.PI) / TAU),
    mt: Math.floor((th + Math.PI / 2) / Math.PI)
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    if (state.running) {
      state.t += dt;
      state.theta += state.omega * dt;
      applyDrive();
      const dv = SCENES[curTab].drive;
      if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
      pushSample();
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
