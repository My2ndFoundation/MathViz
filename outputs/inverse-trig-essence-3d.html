<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'inverse-trig-essence-3d',
  title: { zh: '反三角函数的本质 · 从值取回角', en: 'The Essence of Inverse Trig' },
  h1:    { zh: '反三角函数的本质', en: 'Inverse Trig Functions' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  autoPlay: { zh: '自动播放', en: 'Auto-play' },
  pingpong: { zh: '往返',     en: 'Ping-pong' },
  loop:     { zh: '循环',     en: 'Loop' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  ① 参数声明 —— 自动生成滑杆                                ║
   ║  key: state 中的键 · label: 支持 <i>数学符号</i>            ║
   ║  fmt: 格式化"滑杆原始值"用于显示 · map(可选): 原始值→状态值   ║
   ╚══════════════════════════════════════════════════════════╝ */
const PARAMS = [
  { key: 'tVal',  label: { zh: '输入值 <i>t</i>', en: 'Input <i>t</i>' }, min: -1,  max: 1, step: 0.01, value: 0.5, fmt: v => fmtS(v) },
  { key: 'omega', label: { zh: '角速度 <i>ω</i>', en: 'Angular speed <i>ω</i>' }, min: 0.2, max: 3, step: 0.05, value: 0.6, fmt: v => fmt(v) + ' rad/s' }
];

/* ╔══════════════════════════════════════════════════════════╗
   ║  ② 场景注册 —— 每个键就是一个页签                           ║
   ║  必填：label / brand / tips / views(首项即"立体"，双击回正)  ║
   ║        toggles(曲线按 rose→violet→emerald→orange 取色)     ║
   ║        draw(C) / readout()                                ║
   ║  可选：sampleWindow() 历史滑窗秒数 · views[x].onSelect 联动 ║
   ╚══════════════════════════════════════════════════════════╝ */
/* ────── 场景级：反三角绘图助手（引擎之上，引擎零改动） ────── */
const ROSE_A = 'rgba(251,113,133,';
const VIO_A = 'rgba(167,139,250,';
const EME_A = 'rgba(52,211,153,';
const AMB_A = 'rgba(251,191,36,';
const WHT_A = 'rgba(226,232,240,';

const V_FLOW = 1.2;   // 页签三：波形沿 t 轴流速
const WY = 0.42;      // 页签三：弧度值 → 世界 y
const CLIP3 = 3.6;    // 页签三：斜坡 θ 的裁剪值（§6）
const HPI = Math.PI / 2;

/* 圆心 (cx,cy) 处从 a0 到 a1 的角度弧（短程，默认琥珀度量注记） */
function arcAt(C, cx, cy, a0, a1, r, name, col) {
  let d = a1 - a0;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  const n = Math.max(2, Math.ceil(Math.abs(d) / 0.05));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + d * i / n;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: 1.5, color: (col || AMB_A) + '0.85)' });
  if (name) {
    const mid = a0 + d / 2;
    label3(C, [cx + (r + 0.17) * Math.cos(mid), cy + (r + 0.17) * Math.sin(mid), 0], name,
      { font: 'italic 12px ' + FONT_MATH, color: (col || AMB_A) + '1)', align: 'center' });
  }
}
const arcBetween = (C, a0, a1, r, name, col) => arcAt(C, 0, 0, a0, a1, r, name, col);
/* 原点处 a0→a1 的自定义描边弧（主值枝高亮 / 互余分段用） */
function arcStroke(C, a0, a1, r, o) {
  const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 0.05));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    pts.push([r * Math.cos(a), r * Math.sin(a), 0]);
  }
  strokePoly(C, pts, o);
}
/* 过 (x0,y0)、斜率 m 的切线段（结构层）；m 传大数即近竖直 */
function tangentSeg(C, x0, y0, m, L, col) {
  let dx = 1, dy = m;
  const n = Math.hypot(dx, dy);
  dx = dx / n * L; dy = dy / n * L;
  line3(C, [x0 - dx, y0 - dy, 0], [x0 + dx, y0 + dy, 0], { width: 1.6, color: col + '0.6)' });
}
/* 公式清单（dim 参考区，不参与交互——让学习者知道本页生成哪些公式） */
function formulaList(title, lines) {
  return '<div class="dim" style="margin-top:8px;border-top:1px dashed rgba(148,163,184,.2);padding-top:6px">' +
    t(title) + '</div>' +
    lines.map(s => '<div class="dim" style="font-family:var(--font-math);font-style:italic">' + s + '</div>').join('');
}
/* 视角联动：确保某开关已开（§5.3） */
function enableToggle(key) {
  if (state[key]) return;
  state[key] = true;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = true; });
}

const SCENES = {

  /* ────── 一：读圆取角 ────── */
  circle: {
    label: { zh: '读圆取角', en: 'Angle retrieval' },
    params: ['tVal'],
    brand: { zh: '反三角函数是「从值取回角」的机器：横线 y = t 与圆相交不止一次，必须约定取哪一段——arcsin 取右半圆、arccos 取上半圆。拖动 t，看主值点、第二解与互余关系如何联动。',
             en: 'Inverse trig is a machine that retrieves the angle from a value: the line y = t crosses the circle more than once, so we must agree on a branch — arcsin takes the right half, arccos the top half. Drag t and watch the principal point, the second solution, and the complementary pair move together.' },
    tips: { zh: '提示：切「正视 单位圆」开「互余 π/2」——玫红弧 arcsin t 与紫弧接力拼满一个直角：arcsin t + arccos t = π/2，两个取角点互为对角线 y = x 的镜像。把 t 拖成负数，看 arccos 越过 90°。',
            en: 'Tip: in "Front: unit circle" enable "Complementary π/2" — the rose arc arcsin t and the violet arc join end to end into exactly one right angle: arcsin t + arccos t = π/2, and the two retrieval points mirror each other across y = x. Drag t negative and watch arccos push past 90°.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.55, el: 0.3, dist: 8.5, tx: 0, ty: 0, tz: 0 },
      front: { label: { zh: '正视 单位圆', en: 'Front: unit circle' }, az: 0.001, el: 0.02, dist: 6.5, tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 'showAsin',  label: { zh: 'arcsin · 右半圆', en: 'arcsin · right half' }, color: '#fb7185', checked: true },
      { key: 'showAcos',  label: { zh: 'arccos · 上半圆', en: 'arccos · top half' }, color: '#a78bfa', checked: true },
      { key: 'showComp',  label: { zh: '互余 π/2', en: 'Complementary π/2' }, color: '#fbbf24', checked: true },
      { key: 'showGhost', label: { zh: '第二解（多值）', en: '2nd solution' }, color: '#9fb0c8', checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {
      const tv = state.tVal, as = Math.asin(tv), ac = Math.acos(tv);
      if (state.showGrid) drawGridXY(C, 1.5, 0.5);
      drawAxes(C, { ex: 1.85, ey: 1.8, yTicks: [1], xTicks: [1], tAxis: false });
      drawCircle(C, 1);
      /* arcsin：主值枝 = 右半圆 */
      if (state.showAsin) {
        arcStroke(C, -HPI, HPI, 0.965, { width: 4.5, color: ROSE_A + '0.28)' });
        line3(C, [-1.8, tv, 0], [1.8, tv, 0], { width: 1.5, dash: [7, 7], color: ROSE_A + '0.5)' });
        label3(C, [-1.78, tv, 0], 'y = t', { font: 'italic 11px ' + FONT_MATH, color: '#fb7185', align: 'right', dx: -6 });
        const P1 = [Math.cos(as), tv];
        line3(C, [0, 0, 0], [P1[0], P1[1], 0], { width: 1.6, color: ROSE_A + '0.55)' });
        arcBetween(C, 0, as, 0.34, 'arcsin t', ROSE_A);
        /* 第二解 π − arcsin t（幽灵） */
        if (state.showGhost) {
          const a2 = Math.PI - as;
          const P2 = [Math.cos(a2), Math.sin(a2)];
          line3(C, [0, 0, 0], [P2[0], P2[1], 0], { width: 1.2, dash: [4, 5], color: ROSE_A + '0.35)' });
          const s2 = proj(C, [P2[0], P2[1], 0]);
          if (s2) glowDot(s2, 6, ROSE_A + '0.75)', ROSE_A + '0.35)');
          label3(C, [P2[0] * 1.3, P2[1] * 1.3, 0], 'π − arcsin t',
            { font: 'italic 11px ' + FONT_MATH, color: ROSE_A + '0.6)', align: 'center' });
        }
        const s1 = proj(C, [P1[0], P1[1], 0]);
        if (s1) glowDot(s1, 10, '#ffffff', ROSE_A + '0.9)');
      }
      /* arccos：主值枝 = 上半圆 */
      if (state.showAcos) {
        arcStroke(C, 0, Math.PI, 1.05, { width: 4.5, color: VIO_A + '0.28)' });
        line3(C, [tv, -1.75, 0], [tv, 1.75, 0], { width: 1.5, dash: [7, 7], color: VIO_A + '0.5)' });
        label3(C, [tv, -1.78, 0], 'x = t', { font: 'italic 11px ' + FONT_MATH, color: '#a78bfa', align: 'center', dy: 12 });
        const Q = [tv, Math.sin(ac)];
        line3(C, [0, 0, 0], [Q[0], Q[1], 0], { width: 1.6, color: VIO_A + '0.55)' });
        arcBetween(C, 0, ac, 0.52, 'arccos t', VIO_A);
        if (state.showGhost) {
          const a2 = -ac;
          const P2 = [Math.cos(a2), Math.sin(a2)];
          line3(C, [0, 0, 0], [P2[0], P2[1], 0], { width: 1.2, dash: [4, 5], color: VIO_A + '0.35)' });
          const s2 = proj(C, [P2[0], P2[1], 0]);
          if (s2) glowDot(s2, 6, VIO_A + '0.75)', VIO_A + '0.35)');
          label3(C, [P2[0] * 1.3, P2[1] * 1.3, 0], '−arccos t',
            { font: 'italic 11px ' + FONT_MATH, color: VIO_A + '0.6)', align: 'center' });
        }
        const sq = proj(C, [Q[0], Q[1], 0]);
        if (sq) glowDot(sq, 10, '#ffffff', VIO_A + '0.9)');
      }
      /* 互余：镜像 + 直角分段（玫红段 + 紫段拼满 π/2） */
      if (state.showComp && state.showAsin && state.showAcos) {
        line3(C, [-1.55, -1.55, 0], [1.55, 1.55, 0], { width: 1, dash: [5, 6], color: AMB_A + '0.5)' });
        label3(C, [1.58, 1.58, 0], 'y = x', { font: 'italic 11px ' + FONT_MATH, color: AMB_A + '0.85)', align: 'left', dx: 6 });
        line3(C, [Math.cos(as), tv, 0], [tv, Math.sin(ac), 0], { width: 1.3, dash: [7, 7], color: AMB_A + '0.55)' });
        arcStroke(C, 0, HPI, 0.9, { width: 1, dash: [5, 6], color: AMB_A + '0.45)' });
        arcStroke(C, 0, as, 0.8, { width: 2.5, color: ROSE_A + '0.9)' });
        arcStroke(C, as, HPI, 0.8, { width: 2.5, color: VIO_A + '0.9)' });
        label3(C, [1.02 * Math.cos(HPI / 2), 1.02 * Math.sin(HPI / 2), 0], 'π/2',
          { font: 'italic 12px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
      }
    },
    readout() {
      const tv = state.tVal, as = Math.asin(tv), ac = Math.acos(tv);
      let out = '<div>t = <b>' + fmtS(tv) + '</b></div>' +
        '<div class="sinC">arcsin t = <b>' + fmtS(as) + '</b> rad = <b>' + (as * 180 / Math.PI).toFixed(0) + '°</b></div>' +
        '<div class="cosC">arccos t = <b>' + fmtS(ac) + '</b> rad = <b>' + (ac * 180 / Math.PI).toFixed(0) + '°</b></div>' +
        '<div>arcsin t + arccos t = <b style="color:#fbbf24">' + fmt(as + ac) + '</b> = π/2</div>' +
        '<div class="dim">' + t({ zh: 'sin θ = t 的全部解：θ = arcsin t + 2kπ 或 π − arcsin t + 2kπ', en: 'all solutions of sin θ = t: θ = arcsin t + 2kπ or π − arcsin t + 2kπ' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（定义与主值）', en: 'Formulas this tab generates (definitions & principal values)' }, [
        'arcsin: [−1, 1] → [−π/2, π/2]',
        'arccos: [−1, 1] → [0, π]',
        'arctan: ℝ → (−π/2, π/2)',
        'arcsin t + arccos t = π/2',
        'arctan t + arccot t = π/2',
        'arcsin(−t) = −arcsin t · arccos(−t) = π − arccos t',
        'sin(arcsin t) = t' + t({ zh: '（反向未必：见第三页）', en: ' (the converse can fail: see tab 3)' })
      ]);
      return out;
    }
  },

  /* ────── 二：镜像 · 导数 ────── */
  mirror: {
    label: { zh: '镜像 · 导数', en: 'Mirror · Derivative' },
    params: ['tVal'],
    brand: { zh: '反函数就是把图象沿 y = x 翻过来：正弦只有在单调主枝上才翻得动。镜像交换 (x, y)，也交换「涨」与「跑」——arcsin 的斜率是主枝斜率的倒数 1/√(1−t²)。',
             en: 'An inverse function is the graph flipped over y = x — and sine only flips on a monotone branch. The mirror swaps (x, y), and with it rise and run: the slope of arcsin is the reciprocal 1/√(1−t²) of the branch’s slope.' },
    tips: { zh: '提示：切「正视 x·y」看镜像——暗色完整正弦被横线 y = t 打穿无数次（不可逆），玫红主枝只被打穿一次；沿琥珀对角线翻过去就是紫色 arcsin。开「切线与导数」：两条翠绿切线互为镜像、斜率互为倒数，t 拖到 ±1 时 arcsin 的切线立起来（∞）。',
            en: 'Tip: in "Front x·y" watch the mirror — the dim full sine is pierced endlessly by y = t (not invertible), the rose branch only once; flip it over the amber diagonal and you get the violet arcsin. Enable "Tangents & derivative": the two emerald tangents mirror each other with reciprocal slopes, and at t = ±1 the arcsin tangent stands vertical (∞).' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.6, el: 0.32, dist: 9.5, tx: 0, ty: 0, tz: 0 },
      front: { label: { zh: '正视 x·y', en: 'Front x·y' }, az: 0.001, el: 0.02, dist: 7.5, tx: 0, ty: 0, tz: 0 }
    },
    toggles: [
      { key: 'showSinBr',     label: { zh: '正弦主枝', en: 'Sine branch' }, color: '#fb7185', checked: true },
      { key: 'showAsinCurve', label: { zh: 'arcsin 曲线', en: 'arcsin curve' }, color: '#a78bfa', checked: true },
      { key: 'showSlope',     label: { zh: '切线与导数', en: 'Tangents & derivative' }, color: '#34d399', checked: true },
      { key: 'showMirror',    label: { zh: '镜像 <i>y</i> = <i>x</i>', en: 'Mirror <i>y</i> = <i>x</i>' }, color: '#fbbf24', checked: true },
      { key: 'showFull',      label: { zh: '完整正弦（多解）', en: 'Full sine (many solutions)' }, color: '#9fb0c8', checked: true },
      { key: 'showGrid',      label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: true }
    ],
    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {
      const tv = state.tVal, as = Math.asin(tv);
      const k = Math.sqrt(Math.max(0, 1 - tv * tv));       // 主枝斜率 cos(arcsin t)
      if (state.showGrid) drawGridXY(C, 2, 0.5);
      drawAxes(C, { ex: 2.25, ey: 2.1, yTicks: [1], xTicks: [1], tAxis: false });
      /* π/2 刻度（域与值域的界桩） */
      for (const sg of [1, -1]) {
        line3(C, [sg * HPI, -0.05, 0], [sg * HPI, 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [sg * HPI, -0.22, 0], sg < 0 ? '−π/2' : 'π/2', { font: 'italic 10px ' + FONT_MATH, color: 'rgba(159,176,200,.6)', align: 'center' });
        line3(C, [-0.05, sg * HPI, 0], [0.05, sg * HPI, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.12, sg * HPI, 0], sg < 0 ? '−π/2' : 'π/2', { font: 'italic 10px ' + FONT_MATH, color: 'rgba(159,176,200,.6)', align: 'right' });
      }
      /* 完整正弦（暗，不可逆）+ 横线 y=t 的多解幽灵 */
      if (state.showFull) {
        const pts = [];
        for (let x = -4.8; x <= 4.8 + 1e-6; x += 0.05) pts.push([x, Math.sin(x), 0]);
        strokePoly(C, pts, { width: 1.4, color: 'rgba(159,176,200,0.28)' });
        line3(C, [-4.8, tv, 0], [4.8, tv, 0], { width: 1, dash: [4, 5], color: ROSE_A + '0.35)' });
        for (const k2 of [-1, 0, 1]) {
          for (const x of [as + k2 * TAU, Math.PI - as + k2 * TAU]) {
            if (Math.abs(x) > 4.8 || Math.abs(x - as) < 1e-9) continue;
            solidDot(C, [x, tv, 0], 2.5, ROSE_A + '0.5)');
          }
        }
      }
      /* 镜像对角线 */
      if (state.showMirror) {
        line3(C, [-2, -2, 0], [2, 2, 0], { width: 1, dash: [5, 6], color: AMB_A + '0.5)' });
        label3(C, [2.03, 2.03, 0], 'y = x', { font: 'italic 11px ' + FONT_MATH, color: AMB_A + '0.85)', align: 'left', dx: 6 });
      }
      /* 正弦主枝（玫红，单调段） */
      if (state.showSinBr) {
        const pts = [];
        for (let u = -HPI; u <= HPI + 1e-6; u += 0.02) pts.push([u, Math.sin(u), 0]);
        strokePoly(C, pts, { width: 5, color: ROSE_A + '0.13)' });
        strokePoly(C, pts, { width: 2.2, color: ROSE_A + '0.95)' });
        label3(C, [1.62, 0.92, 0], 'y = sin x', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', align: 'left', dx: 4 });
      }
      /* arcsin 曲线（紫，= 主枝的镜像） */
      if (state.showAsinCurve) {
        const pts = [];
        for (let u = -HPI; u <= HPI + 1e-6; u += 0.02) pts.push([Math.sin(u), u, 0]);
        strokePoly(C, pts, { width: 5, color: VIO_A + '0.13)' });
        strokePoly(C, pts, { width: 2.2, color: VIO_A + '0.95)' });
        label3(C, [0.62, 1.62, 0], 'y = arcsin x', { font: 'italic 13px ' + FONT_MATH, color: '#a78bfa', align: 'left', dx: 6 });
      }
      /* 镜像点对 B(as, t) ↔ A(t, as) 与切线 */
      const B = [as, tv], A = [tv, as];
      if (state.showMirror) line3(C, [B[0], B[1], 0], [A[0], A[1], 0], { width: 1.3, dash: [7, 7], color: AMB_A + '0.55)' });
      if (state.showSlope) {
        tangentSeg(C, B[0], B[1], k, 0.45, EME_A);
        tangentSeg(C, A[0], A[1], k < 1e-3 ? 1e6 : 1 / k, 0.45, EME_A);
        label3(C, [B[0], B[1], 0], 'k = ' + fmt(k), { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'left', dx: 12, dy: 12 });
        label3(C, [A[0], A[1], 0], k < 1e-3 ? '1/k → ∞' : '1/k = ' + fmt(1 / k),
          { font: 'italic 11px ' + FONT_MATH, color: '#34d399', align: 'right', dx: -12, dy: -12 });
      }
      const sb = proj(C, [B[0], B[1], 0]);
      if (sb) glowDot(sb, 9, '#ffffff', ROSE_A + '0.9)');
      const sa = proj(C, [A[0], A[1], 0]);
      if (sa) glowDot(sa, 9, '#ffffff', VIO_A + '0.9)');
    },
    readout() {
      const tv = state.tVal, as = Math.asin(tv);
      const k = Math.sqrt(Math.max(0, 1 - tv * tv));
      const inv = k < 1e-3 ? '+∞' : fmt(1 / k);
      let out = '<div>t = <b>' + fmtS(tv) + '</b>&ensp;·&ensp;arcsin t = <b>' + fmtS(as) + '</b></div>' +
        '<div class="sinC">' + t({ zh: '主枝斜率', en: 'branch slope' }) + ' k = cos(arcsin t) = √(1−t²) = <b>' + fmt(k) + '</b></div>' +
        '<div class="tanC">(arcsin)′(t) = 1/k = 1/√(1−t²) = <b>' + inv + '</b></div>' +
        '<div class="dim">' + t({ zh: '镜像交换 (x, y)，斜率随之互为倒数', en: 'the mirror swaps (x, y), so the slopes are reciprocals' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（镜像与导数）', en: 'Formulas this tab generates (mirror & derivatives)' }, [
        '(f⁻¹)′(x) = 1/f′(f⁻¹(x))',
        '(arcsin x)′ = 1/√(1−x²) · (arccos x)′ = −1/√(1−x²)',
        '(arctan x)′ = 1/(1+x²)',
        'cos(arcsin x) = √(1−x²) · tan(arcsin x) = x/√(1−x²)',
        '∫dx/√(1−x²) = arcsin x + C',
        '∫dx/(1+x²) = arctan x + C',
        '∫dx/(a²+x²) = (1/a)·arctan(x/a) + C'
      ]);
      return out;
    }
  },

  /* ────── 三：折叠 · 取回的角 ────── */
  fold: {
    label: { zh: '折叠 · 取回的角', en: 'Folding' },
    params: ['omega'],
    brand: { zh: 'θ 匀速上爬、一去不回，而 arcsin(sin θ) 永远被折回 ±π/2 的主值带——折成三角波；arctan(tan θ) 每过 π/2+kπ 就跳落一层，折成锯齿。取回的角 ≠ 原来的角，差的正是 2kπ 与 kπ。',
             en: 'θ climbs forever, but arcsin(sin θ) is folded back into the ±π/2 band — a triangle wave; arctan(tan θ) drops a floor at every π/2+kπ — a sawtooth. The retrieved angle differs from the true one by exactly 2kπ or kπ.' },
    tips: { zh: '提示：切「侧视 y·t」——白色斜坡 θ 冲出画面，玫红 arcsin(sin θ) 却永远困在 ±π/2 琥珀带里折成三角波；开 arctan(tan θ) 看它在虚线处整层跳落。这就是 sin(arcsin t) = t 恒成立、arcsin(sin θ) = θ 不成立的原因。',
            en: 'Tip: in "Side y·t" the white ramp θ escapes the frame while the rose arcsin(sin θ) stays trapped in the amber ±π/2 band as a triangle wave; enable arctan(tan θ) to watch it drop a whole floor at each dashed line. This is why sin(arcsin t) = t always holds but arcsin(sin θ) = θ does not.' },
    views: {
      iso:   { label: { zh: '立体', en: '3D' }, az: -0.85, el: 0.3, dist: 10.5, tx: 0, ty: 0, tz: 2.6 },
      side:  { label: { zh: '侧视 y·t', en: 'Side y·t' }, az: -Math.PI / 2, el: 0.001, dist: 10.5, tx: 0, ty: 0, tz: 3.2,
               onSelect: () => enableToggle('showAsinF') },
      front: { label: { zh: '正视 圆', en: 'Front: circle' }, az: 0.001, el: 0.02, dist: 7, tx: 0, ty: 0, tz: 0.3 }
    },
    toggles: [
      { key: 'showRamp',   label: { zh: '角 θ = ωt', en: 'Angle θ = ωt' }, color: '#e2e8f0', checked: true },
      { key: 'showAsinF',  label: { zh: 'arcsin(sin θ)', en: 'arcsin(sin θ)' }, color: '#fb7185', checked: true },
      { key: 'showAcosF',  label: { zh: 'arccos(cos θ)', en: 'arccos(cos θ)' }, color: '#a78bfa', checked: false },
      { key: 'showAtanF',  label: { zh: 'arctan(tan θ)', en: 'arctan(tan θ)' }, color: '#34d399', checked: true },
      { key: 'showGuides', label: { zh: '主值带与跳变', en: 'Bands & jumps' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',   label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: false }
    ],
    sampleWindow: () => WAVE_LEN / V_FLOW + 0.5,
    draw(C) {
      const th = state.theta;
      if (state.showGrid) drawTimeGrid(C, { yMax: 1.6, v: V_FLOW });
      drawAxes(C, { ex: 0.95, ey: 1.85, yTicks: [], xTicks: [], tAxis: true, v: V_FLOW });
      /* 主值带（琥珀）：±π/2 与 π */
      if (state.showGuides) {
        for (const b of [[HPI, 'π/2'], [-HPI, '−π/2'], [Math.PI, 'π']]) {
          if (b[0] > Math.PI && !state.showAcosF) continue;
          if (Math.abs(b[0]) > HPI && b[0] !== Math.PI) continue;
          line3(C, [0, b[0] * WY, 0], [0, b[0] * WY, WAVE_LEN], { width: 1, dash: [5, 6], color: AMB_A + '0.4)' });
          label3(C, [-0.1, b[0] * WY, 0], b[1], { font: 'italic 10.5px ' + FONT_MATH, color: AMB_A + '0.85)', align: 'right' });
        }
        /* arctan(tanθ) 的跳变线（翠绿虚线，有限跳变而非渐近） */
        if (state.showAtanF) {
          for (let i = samples.length - 1; i > 0; i--) {
            if (samples[i].mt !== samples[i - 1].mt) {
              const z = (state.t - samples[i].t) * V_FLOW;
              if (z > WAVE_LEN) break;
              line3(C, [0, -HPI * WY, z], [0, HPI * WY, z], { width: 1, dash: [4, 5], color: EME_A + '0.35)' });
              label3(C, [0, HPI * WY + 0.16, z], 'θ = π/2 + kπ', { font: 'italic 10px ' + FONT_MATH, color: EME_A + '0.7)', align: 'center' });
            }
          }
        }
      }
      /* 历史曲线：白斜坡冲出裁剪窗，取回的角折回主值带（§6） */
      const defs = [
        { on: state.showRamp,  f: 'ramp', c: WHT_A, brk: null, w: 1.6, hw: 8, white: true },
        { on: state.showAcosF, f: 'ac3',  c: VIO_A, brk: null, w: 1.8, hw: 7 },
        { on: state.showAtanF, f: 'at3',  c: EME_A, brk: 'mt', w: 1.8, hw: 7 },
        { on: state.showAsinF, f: 'as3',  c: ROSE_A, brk: null, w: 2.2, hw: 9 }
      ];
      for (const d of defs) {
        if (!d.on || samples.length < 2) continue;
        const pts = [];
        for (let i = samples.length - 1; i >= 0; i--) {
          const smp = samples[i];
          const z = (state.t - smp.t) * V_FLOW;
          if (z > WAVE_LEN) break;
          if (d.brk && i < samples.length - 1 && samples[i + 1][d.brk] !== smp[d.brk]) pts.push(null);
          pts.push([0, clamp(smp[d.f], -CLIP3, CLIP3) * WY, z]);
        }
        if (pts.filter(Boolean).length < 2) continue;
        if (d.white) {
          strokePoly(C, pts, { width: d.w, fade: [d.c + '0.85)', d.c + '0)'] });
        } else {
          strokePoly(C, pts, { width: d.w + 3.1, color: d.c + '0.13)' });
          strokePoly(C, pts, { width: d.w, fade: [d.c + '1)', d.c + '0.04)'] });
        }
        const cur = samples[samples.length - 1][d.f];
        if (Math.abs(cur) <= CLIP3) {
          const hp = proj(C, [0, cur * WY, 0]);
          if (hp) glowDot(hp, d.hw, '#ffffff', (d.white ? 'rgba(186,240,255,' : d.c) + '0.9)');
        }
      }
      /* 公式标注（同色锚定） */
      if (state.showRamp && th <= CLIP3) label3(C, [0, th * WY + 0.22, 0.5], 'θ = ωt', { font: 'italic 12px ' + FONT_MATH, color: WHT_A + '0.85)', align: 'center' });
      if (state.showRamp && th > CLIP3)  label3(C, [0, CLIP3 * WY + 0.24, 0.5], 'θ = ωt ↗', { font: 'italic 12px ' + FONT_MATH, color: WHT_A + '0.7)', align: 'center' });
      if (state.showAsinF) label3(C, [0, -HPI * WY - 0.26, 2.2], 'arcsin(sin θ)', { font: 'italic 12.5px ' + FONT_MATH, color: '#fb7185', align: 'center' });
      if (state.showAcosF) label3(C, [0, Math.PI * WY + 0.22, 3.4], 'arccos(cos θ)', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', align: 'center' });
      if (state.showAtanF) label3(C, [0, -HPI * WY - 0.52, 4.2], 'arctan(tan θ)', { font: 'italic 12px ' + FONT_MATH, color: '#34d399', align: 'center' });
      /* z=0 的生成几何：小圆 + 旋转半径 + 角弧 */
      drawCircle(C, 0.5);
      drawAngleArc(C, th, 0.5);
      if (state.showAsinF) arcBetween(C, 0, Math.asin(Math.sin(th)), 0.62, null, ROSE_A);
      const P = [0.5 * Math.cos(th), 0.5 * Math.sin(th)];
      line3(C, [0, 0, 0], [P[0], P[1], 0], { width: 2, color: 'rgba(241,245,249,0.92)' });
      const sp = proj(C, [P[0], P[1], 0]);
      if (sp) glowDot(sp, 12, '#ffffff', 'rgba(186,240,255,0.9)');
    },
    readout() {
      const th = state.theta;
      const as3 = Math.asin(Math.sin(th)), ac3 = Math.acos(Math.cos(th)), at3 = Math.atan(Math.tan(th));
      let out = readoutHead() +
        '<div class="sinC">arcsin(sin θ) = <b>' + fmtS(as3) + '</b>' + t({ zh: '（三角波）', en: ' (triangle wave)' }) + '</div>' +
        '<div class="cosC">arccos(cos θ) = <b>' + fmtS(ac3) + '</b></div>' +
        '<div class="tanC">arctan(tan θ) = <b>' + fmtS(at3) + '</b>' + t({ zh: '（锯齿）', en: ' (sawtooth)' }) + '</div>' +
        '<div class="dim">θ − arctan(tan θ) = ' + fmt(th - at3) + ' = kπ&ensp;·&ensp;' + t({ zh: '取回的角被折回主值带', en: 'retrieved angles fold into the principal band' }) + '</div>';
      out += formulaList({ zh: '本页生成的公式（折叠规则）', en: 'Formulas this tab generates (folding rules)' }, [
        'arcsin(sin θ) = θ, θ ∈ [−π/2, π/2]',
        'arcsin(sin θ) = π − θ, θ ∈ [π/2, 3π/2]' + t({ zh: '（周期 2π 的三角波）', en: ' (a 2π triangle wave)' }),
        'arccos(cos θ) = |θ − 2kπ|' + t({ zh: '（0…π 折返）', en: ' (bounces in 0…π)' }),
        'arctan(tan θ) = θ − kπ, k = round(θ/π)',
        'sin(arcsin t) = t · tan(arctan t) = t' + t({ zh: '（正向恒成立）', en: ' (always true this way)' }),
        'arctan x + arctan(1/x) = ±π/2 (x ≷ 0)',
        'arctan u + arctan v ≡ arctan((u+v)/(1−uv)) (mod π)'
      ]);
      return out;
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
function pushSample() {
  /* 页签三：θ 斜坡与三个「取回的角」的真实值；mt 为 arctan(tanθ) 的分支编号 */
  const th = state.theta;
  samples.push({
    t: state.t,
    ramp: th,
    as3: Math.asin(Math.sin(th)),
    ac3: Math.acos(Math.cos(th)),
    at3: Math.atan(Math.tan(th)),
    mt: Math.floor((th + Math.PI / 2) / Math.PI)
  });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    applyDrive();
    const dv = SCENES[curTab].drive;
    if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* ================= 场景时间驱动（引擎区） ================= */
/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd()
     （语言切换 / 用户拖动都会触发）读的是吸附后的 input.value，会把这点
     差值永久写回 state —— 暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
