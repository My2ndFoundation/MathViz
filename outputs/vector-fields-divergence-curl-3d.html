<script>
'use strict';
/* ================= i18n 核心（引擎区） ================= */
const LANG_KEY = 'mathviz-lang';
function resolveLang(){
  try{
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = resolveLang();
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

const STARTER_VERSION = '1.0.0';
const VERSION = document.querySelector('meta[name="tool-version"]').content;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ⓪ 工具元信息 —— id 与双语标题                              ║
   ╚══════════════════════════════════════════════════════════╝ */
const TOOL = {
  id: 'vector-fields-divergence-curl-3d',
  title: { zh: '向量场、散度与旋度 · Vector Fields, Divergence & Curl', en: 'Vector Fields, Divergence & Curl' },
  h1:    { zh: '向量场 · 散度 · 旋度', en: 'Vector Fields · Div & Curl' }
};

/* 引擎 UI 文案（一般无需改动） */
const UI = {
  panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
  pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
  resume: { zh: '▶ 继续', en: '▶ Resume' },
  reset:  { zh: '↺ 重置', en: '↺ Reset' },
  views:  { zh: '视角', en: 'View' },
  hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 空格暂停 · 1–9 视角 · T 切换页签',
            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }
};

/* ════ 场景层常量与助手（全部位于 SCENES 之上，引擎零改动） ════ */
const DOM = 2;           /* 场定义域 |x|,|y| ≤ DOM */
const PROBE_R = 0.45;    /* 探针测量小圆半径 */
const RING_R = 0.4;      /* 示踪圆环初始半径 */
const FLOOR = -1.6;      /* 梯度页地面高度 */
const GN = 40;           /* marching squares 采样网格数 */

/* 场预设：F(x,y) = (P, Q)，均为线性 / 多项式场——无奇点，解析散度与旋度 */
const FIELDS = [
  { name: { zh: '均匀场', en: 'Uniform' },                  formula: 'F = s·(1, 0.45)',
    F: (x, y) => [state.s, 0.45 * state.s],                 div: () => 0,           curl: () => 0 },
  { name: { zh: '径向场（源 / 汇）', en: 'Radial (source/sink)' }, formula: 'F = s·(x, y)',
    F: (x, y) => [state.s * x, state.s * y],                div: () => 2 * state.s, curl: () => 0 },
  { name: { zh: '旋转场', en: 'Rotation' },                 formula: 'F = s·(−y, x)',
    F: (x, y) => [-state.s * y, state.s * x],               div: () => 0,           curl: () => 2 * state.s },
  { name: { zh: '鞍形场', en: 'Saddle' },                   formula: 'F = s·(x, −y)',
    F: (x, y) => [state.s * x, -state.s * y],               div: () => 0,           curl: () => 0 },
  { name: { zh: '涡旋源', en: 'Swirling source' },          formula: 'F = s·(x−y, x+y)',
    F: (x, y) => [state.s * (x - y), state.s * (x + y)],    div: () => 2 * state.s, curl: () => 2 * state.s }
];
const curField = () => FIELDS[Math.round(state.field)];
const evalF = (x, y) => curField().F(x, y);

/* 梯度页标量场：f、解析梯度 g、Laplacian（Δf = ∇·∇f） */
const SURFS = [
  { name: { zh: '高斯山丘', en: 'Gaussian hill' },
    f: (x, y) => 1.1 * Math.exp(-(x*x + y*y) / 1.2),
    g: (x, y) => { const e = 1.1 * Math.exp(-(x*x + y*y) / 1.2); return [-2*x/1.2*e, -2*y/1.2*e]; },
    lap: (x, y) => { const e = 1.1 * Math.exp(-(x*x + y*y) / 1.2); return (4*(x*x + y*y)/1.44 - 4/1.2) * e; } },
  { name: { zh: '碗形抛物面', en: 'Bowl' },
    f: (x, y) => 0.28 * (x*x + y*y) - 0.8,
    g: (x, y) => [0.56*x, 0.56*y],
    lap: () => 1.12 },
  { name: { zh: '马鞍面', en: 'Saddle surface' },
    f: (x, y) => 0.3 * (x*x - y*y),
    g: (x, y) => [0.6*x, -0.6*y],
    lap: () => 0 }
];
const DENS_NAMES = [ { zh: '稀', en: 'Sparse' }, { zh: '中', en: 'Medium' }, { zh: '密', en: 'Dense' } ];
const gridN = () => [5, 7, 9][Math.round(state.dens)];

/* |v|>999 显示 ±∞（文案规范 §7） */
const fmtInf = v => Math.abs(v) > 999 ? (v < 0 ? '−∞' : '+∞') : fmt(v);

/* RK4 沿场推进一步（场为多项式，处处光滑，无 NaN 风险） */
function rk4Step(x, y, h) {
  const k1 = evalF(x, y);
  const k2 = evalF(x + h/2*k1[0], y + h/2*k1[1]);
  const k3 = evalF(x + h/2*k2[0], y + h/2*k2[1]);
  const k4 = evalF(x + h*k3[0], y + h*k3[1]);
  return [x + h/6*(k1[0] + 2*k2[0] + 2*k3[0] + k4[0]),
          y + h/6*(k1[1] + 2*k2[1] + 2*k3[1] + k4[1])];
}

/* 场箭头网格（青 = 源几何：场本身）；长度饱和，移动端箭头数 25–81 */
function drawFieldArrows(C) {
  const n = gridN(), stepv = 2 * DOM / (n - 1);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = -DOM + i * stepv, y = -DOM + j * stepv;
    const f = evalF(x, y), m = Math.hypot(f[0], f[1]);
    if (m < 1e-3) { solidDot(C, [x, y, 0], 1.6, 'rgba(45,212,234,0.5)'); continue; }
    const L = 0.5 * m / (1 + 0.9 * m);
    const ux = f[0]/m*L, uy = f[1]/m*L;
    const a = [x - ux/2, y - uy/2, 0], b = [x + ux/2, y + uy/2, 0];
    line3(C, a, b, { width: 1.3, color: 'rgba(45,212,234,0.55)' });
    arrowAt(C, b, a, 'rgba(45,212,234,0.75)');
  }
}

/* 流线缓存：场预设或场强改变才重建（确定性种子网格） */
let streamCache = null;
function ensureStreams() {
  const key = Math.round(state.field) + '|' + state.s.toFixed(2);
  if (streamCache && streamCache.key === key) return streamCache.lines;
  const lines = [];
  if (Math.abs(state.s) > 1e-4) {
    for (const sx of [-1.5, -0.5, 0.5, 1.5]) for (const sy of [-1.5, -0.5, 0.5, 1.5]) {
      const fwd = [], bwd = [];
      let p = [sx, sy];
      for (let k = 0; k < 110; k++) {
        p = rk4Step(p[0], p[1], 0.05);
        if (Math.abs(p[0]) > DOM + 0.35 || Math.abs(p[1]) > DOM + 0.35) break;
        fwd.push([p[0], p[1], 0]);
      }
      p = [sx, sy];
      for (let k = 0; k < 110; k++) {
        p = rk4Step(p[0], p[1], -0.05);
        if (Math.abs(p[0]) > DOM + 0.35 || Math.abs(p[1]) > DOM + 0.35) break;
        bwd.push([p[0], p[1], 0]);
      }
      bwd.reverse();
      const pts = bwd.concat([[sx, sy, 0]], fwd);
      if (pts.length > 2) lines.push(pts);
    }
  }
  streamCache = { key: key, lines: lines };
  return lines;
}
function drawStreams(C) {
  for (const pts of ensureStreams()) {
    strokePoly(C, pts, { width: 1.6, alpha: 0.5, color: '#a78bfa' });
  }
}
/* 流动光点：沿流线按共享时钟滑行（确定性，由 θ 直接给出） */
function drawStreamDots(C) {
  const lines = ensureStreams();
  const ph = mod2pi(state.theta) / TAU;
  for (const pts of lines) {
    const L = pts.length;
    for (const off of [0, 0.5]) {
      const idx = Math.min(L - 1, Math.floor(((ph + off) % 1) * L));
      const sp = proj(C, pts[idx]);
      if (sp) glowDot(sp, 5, '#ffffff', 'rgba(167,139,250,0.8)');
    }
  }
}

/* 探针处的场向量（玫红 = 第一主曲线） */
function drawProbeVec(C) {
  const f = evalF(state.px, state.py), m = Math.hypot(f[0], f[1]);
  if (m > 1e-3) {
    const L = 0.9 * m / (1 + 0.45 * m);
    const tip = [state.px + f[0]/m*L, state.py + f[1]/m*L, 0];
    line3(C, [state.px, state.py, 0], tip, { width: 2.4, color: 'rgba(251,113,133,0.95)' });
    arrowAt(C, tip, [state.px, state.py, 0], 'rgba(251,113,133,0.95)');
    label3(C, tip, 'F(x₀, y₀)', { font: 'italic 13px ' + FONT_MATH, color: '#fb7185', dx: 10, dy: -8 });
  } else {
    label3(C, [state.px, state.py, 0], 'F = 0', { font: 'italic 12px ' + FONT_MATH, color: '#fb7185', align: 'center', dy: -18 });
  }
}

/* 探针测量小圆（琥珀 = 度量注记） */
function drawProbeCircle(C) {
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const a = i / 48 * TAU;
    pts.push([state.px + PROBE_R * Math.cos(a), state.py + PROBE_R * Math.sin(a), 0]);
  }
  strokePoly(C, pts, { width: 1.4, color: 'rgba(251,191,36,0.8)' });
}

/* 边界通量短箭 F·n̂（玫红）：向外为正、向内为负 */
function drawFluxStubs(C) {
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * TAU, nx = Math.cos(a), ny = Math.sin(a);
    const bx = state.px + PROBE_R * nx, by = state.py + PROBE_R * ny;
    const f = evalF(bx, by);
    const fn = f[0]*nx + f[1]*ny;
    const L = clamp(fn * 0.32, -0.5, 0.5);
    if (Math.abs(L) < 0.02) { solidDot(C, [bx, by, 0], 1.5, 'rgba(251,113,133,0.5)'); continue; }
    const tip = [bx + nx*L, by + ny*L, 0];
    line3(C, [bx, by, 0], tip, { width: 1.8, color: 'rgba(251,113,133,0.9)' });
    arrowAt(C, tip, [bx, by, 0], 'rgba(251,113,133,0.9)');
  }
}

/* 边界切向短箭 F·t̂（紫）：环流的局部贡献 */
function drawTangStubs(C) {
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * TAU;
    const nx = Math.cos(a), ny = Math.sin(a);
    const tx = -ny, ty = nx;
    const bx = state.px + PROBE_R * nx, by = state.py + PROBE_R * ny;
    const f = evalF(bx, by);
    const ft = f[0]*tx + f[1]*ty;
    const L = clamp(ft * 0.32, -0.5, 0.5);
    if (Math.abs(L) < 0.02) { solidDot(C, [bx, by, 0], 1.5, 'rgba(167,139,250,0.5)'); continue; }
    const tip = [bx + tx*L, by + ty*L, 0];
    line3(C, [bx, by, 0], tip, { width: 1.8, color: 'rgba(167,139,250,0.9)' });
    arrowAt(C, tip, [bx, by, 0], 'rgba(167,139,250,0.9)');
  }
}

/* 桨轮（玫红）：由共享时钟按 ω = (∇×F)/2 积分出的真实转角（③ 中累积） */
function drawPaddle(C) {

/* 示踪圆环：以探针为心的圆随场平流 τ 秒（由共享时钟相位确定性给出） */
function tracerTau() {
  const om = Math.max(Math.abs(state.omega), 0.05);
  return mod2pi(state.theta) / om * 0.6;
}
function tracerRing() {
  const tau = tracerTau();
  const pts = [], N = 40, h = 0.045;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    let x = state.px + RING_R * Math.cos(a), y = state.py + RING_R * Math.sin(a);
    let rem = tau;
    while (rem > 1e-9) {
      const st = Math.min(h, rem);
      const q = rk4Step(x, y, st);
      x = clamp(q[0], -9, 9); y = clamp(q[1], -9, 9);
      rem -= st;
    }
    pts.push([x, y, 0]);
  }
  return pts;
}
function drawTracerRing(C) {
  /* 初始圆环（虚线参考） */
  const p0 = [];
  for (let i = 0; i <= 40; i++) {
    const a = i / 40 * TAU;
    p0.push([state.px + RING_R * Math.cos(a), state.py + RING_R * Math.sin(a), 0]);
  }
  strokePoly(C, p0, { width: 1, dash: [5, 6], color: 'rgba(167,139,250,0.45)' });
  const pts = tracerRing();
  strokePoly(C, pts, { width: 5.5, color: 'rgba(167,139,250,0.13)' });
  strokePoly(C, pts, { width: 2.2, color: 'rgba(167,139,250,0.95)' });
  label3(C, pts[0], 'A(τ)', { font: 'italic 12px ' + FONT_MATH, color: '#a78bfa', dx: 8, dy: -8 });
}

/* 场公式角标（青） */

/* ── 梯度页助手：数学 (x, y, f) → 世界 (x, y=f, z=y)，地面 y = FLOOR ── */
let surfCache = null;
function ensureSurf() {
  const si = Math.round(state.surf);
  if (surfCache && surfCache.surf === si) return surfCache;
  const S = SURFS[si], n1 = GN + 1;
  const vals = new Float64Array(n1 * n1);
  let mn = Infinity, mx = -Infinity;
  for (let j = 0; j <= GN; j++) for (let i = 0; i <= GN; i++) {
    const v = S.f(-DOM + 2*DOM*i/GN, -DOM + 2*DOM*j/GN);
    vals[j*n1 + i] = v;
    if (v < mn) mn = v;
    if (v > mx) mx = v;
  }
  surfCache = { surf: si, vals: vals, zmin: mn, zmax: mx, mesh: null, map: null };
  const mesh = [];
  for (let j = 0; j <= GN; j += 4) {
    for (let i = 0; i <= GN; i++) mesh.push([-DOM + 2*DOM*i/GN, vals[j*n1 + i], -DOM + 2*DOM*j/GN]);
    mesh.push(null);
  }
  for (let i = 0; i <= GN; i += 4) {
    for (let j = 0; j <= GN; j++) mesh.push([-DOM + 2*DOM*i/GN, vals[j*n1 + i], -DOM + 2*DOM*j/GN]);
    mesh.push(null);
  }
  surfCache.mesh = mesh;
  const map = [];
  for (let k = 1; k <= 9; k++) {
    map.push(segsToPts(contourSegs(mn + (mx - mn) * k / 10), FLOOR + 0.005));
  }
  surfCache.map = map;
  return surfCache;
}
/* marching squares：等值线 f(x,y)=c 的线段集（数学坐标） */
function contourSegs(c) {
  const v = surfCache.vals, n1 = GN + 1, step = 2*DOM/GN, segs = [];
  for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) {
    const x0 = -DOM + i*step, y0 = -DOM + j*step;
    const va = v[j*n1 + i] - c,         vb = v[j*n1 + i + 1] - c;
    const vd = v[(j+1)*n1 + i + 1] - c, ve = v[(j+1)*n1 + i] - c;
    const pts = [];
    if (va * vb < 0) pts.push([x0 + step * va / (va - vb), y0]);
    if (vb * vd < 0) pts.push([x0 + step, y0 + step * vb / (vb - vd)]);
    if (ve * vd < 0) pts.push([x0 + step * ve / (ve - vd), y0 + step]);
    if (va * ve < 0) pts.push([x0, y0 + step * va / (va - ve)]);
    if (pts.length === 2) segs.push(pts);
    else if (pts.length === 4) { segs.push([pts[0], pts[1]]); segs.push([pts[2], pts[3]]); }
  }
  return segs;
}
function segsToPts(segs, yw) {
  const pts = [];
  for (const s of segs) pts.push([s[0][0], yw, s[0][1]], [s[1][0], yw, s[1][1]], null);
  return pts;
}
function drawFloorGrid(C) {
  for (let i = -4; i <= 4; i++) {
    if (i === 0) continue;
    const u = i * 0.5;
    line3(C, [u, FLOOR, -DOM], [u, FLOOR, DOM], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-DOM, FLOOR, u], [DOM, FLOOR, u], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}
/* 梯度页坐标轴：地面 x、y + 角落竖直 f 轴（引擎 drawAxes 面向 z=0 平面，此处自备） */
function drawSurfAxes(C) {
  const e = DOM + 0.5;
  line3(C, [-e, FLOOR, 0], [e, FLOOR, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [e, FLOOR, 0], [e - 0.2, FLOOR, 0], AXIS);
  label3(C, [e + 0.25, FLOOR, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, FLOOR, -e], [0, FLOOR, e], { width: 1.4, color: AXIS });
  arrowAt(C, [0, FLOOR, e], [0, FLOOR, e - 0.2], AXIS);
  label3(C, [0, FLOOR, e + 0.3], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  const cx = -DOM - 0.45, cz = -DOM - 0.45;
  line3(C, [cx, FLOOR, cz], [cx, 1.7, cz], { width: 1.4, color: AXIS });
  arrowAt(C, [cx, 1.7, cz], [cx, 1.5, cz], AXIS);
  label3(C, [cx, 1.95, cz], 'f', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  for (const yv of [-1, 0, 1]) {
    line3(C, [cx - 0.06, yv, cz], [cx + 0.06, yv, cz], { width: 1.2, color: AXIS_DIM });
    label3(C, [cx - 0.15, yv, cz], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
  }

function drawContourMap(C) {
  for (const pts of ensureSurf().map) {
    if (pts.length > 1) strokePoly(C, pts, { width: 1.2, color: 'rgba(167,139,250,0.45)' });
  }
}
function drawMesh(C, alpha) {
  strokePoly(C, ensureSurf().mesh, { width: 1, color: 'rgba(45,212,234,' + alpha + ')' });
}
/* 地面梯度箭头场 ∇f（翠绿 = 标量场生出的向量场） */
function drawGradFieldArrows(C) {
  const S = SURFS[Math.round(state.surf)];
  const n = gridN(), stepv = 2 * DOM / (n - 1);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = -DOM + i * stepv, y = -DOM + j * stepv;
    const g = S.g(x, y), m = Math.hypot(g[0], g[1]);
    if (m < 1e-3) { solidDot(C, [x, FLOOR + 0.01, y], 1.5, 'rgba(52,211,153,0.45)'); continue; }
    const L = 0.44 * m / (1 + 1.1 * m);
    const a = [x, FLOOR + 0.01, y], b = [x + g[0]/m*L, FLOOR + 0.01, y + g[1]/m*L];
    line3(C, a, b, { width: 1.3, color: 'rgba(52,211,153,0.6)' });
    arrowAt(C, b, a, 'rgba(52,211,153,0.75)');
  }
}

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const TAU = Math.PI * 2;
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 记录当时的真实散度 / 旋度，并积分桨轮真实转角      ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
let _lastSampleT = 0;
function pushSample() {
  const Fv = evalF(state.px, state.py);
  const dv = curField().div(state.px, state.py);
  const cl = curField().curl(state.px, state.py);
  let dtS = state.t - _lastSampleT;
  if (!(dtS > 0) || dtS > 0.06) dtS = 0;
  if (state.t === 0) state.paddleAng = 0;
  state.paddleAng = (state.paddleAng || 0) + cl / 2 * dtS;   /* 桨轮转角 = ∫(∇×F)/2 dt，真实积分 */
  _lastSampleT = state.t;
  samples.push({ t: state.t, Fx: Fv[0], Fy: Fv[1], div: dv, curl: cl });
}

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

function resetSim() {
  state.t = 0;
  state.theta = 0;
  samples.length = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
  lastTs = ts;

  if (tween) {
    const k = Math.min(1, (ts - tween.t0) / tween.dur);
    const e = ease(k);
    const f = tween.from, o = tween.to;
    cam.az = f.az + wrapPI(o.az - f.az) * e;
    cam.el = f.el + (o.el - f.el) * e;
    cam.dist = f.dist + (o.dist - f.dist) * e;
    cam.tx = f.tx + (o.tx - f.tx) * e;
    cam.ty = f.ty + (o.ty - f.ty) * e;
    cam.tz = f.tz + (o.tz - f.tz) * e;
    if (k >= 1) tween = null;
  }

  if (state.running) {
    state.t += dt;
    state.theta += state.omega * dt;
    pushSample();
  }
  const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
  while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

  draw();
  if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
  requestAnimationFrame(frame);
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      val.textContent = p.fmt(raw);
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); upd(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
function refreshViewButtons() {
  document.querySelectorAll('.vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
</html>
