            en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · Space to pause · 1–9 views · T to switch tabs' }

const TAU = Math.PI * 2;

/* ============================================================
   三体物理核心（场景级：位于引擎之上，引擎本身零改动）
   全部为无量纲单位，G = 1，三体等质量 m = 1。
   ============================================================ */
const G_CONST = 1;
const H_STEP  = 1 / 1000;   // 固定积分步长（无量纲时间）——辛格式必须定步长
const MAX_SUB = 80;         // 单帧子步上限：dt ≤ 0.05 时只需 50 步，留余量且防卡死
const R_ESC   = 12;         // 逃逸半径（相对质心）
const T_MAX   = 200;        // 单次播种的最长积分时间
const FIG8_T  = 6.32591398292621;   // 图 8 编舞的周期（Chenciner–Montgomery）
const SAT_D   = 2.0;        // 分离的饱和尺度（系统本身的线度量级）
const ENC_IN  = 0.35;       // 近距离遭遇的判定阈值
const ENC_OUT = 0.60;       // 遭遇计数的回滞阈值（防止一次遭遇被数很多遍）

const PRESET_NAME = [
  { zh: '图 8 编舞',     en: 'Figure-8 choreography' },
  { zh: '拉格朗日三角',   en: 'Lagrange triangle' },
  { zh: '随机三维初值',   en: 'Generic 3-D seed' }
];

/* 三个种子初值，均满足 Σm r = 0 与 Σm v = 0（质心静止于原点） */
function seedIC(preset) {
  if (preset === 0) {
    /* Chenciner–Montgomery 图 8：等质量，三体共用同一条 8 字轨道，互差 T/3 */
    const x = 0.97000436, y = -0.24308753;
    const vx = 0.93240737, vy = 0.86473146;
    return {
      m: [1, 1, 1],
      r: [[x, y, 0], [-x, -y, 0], [0, 0, 0]],
      v: [[vx / 2, vy / 2, 0], [vx / 2, vy / 2, 0], [-vx, -vy, 0]]
    };
  }
  if (preset === 1) {
    /* 拉格朗日等边三角：边长 a = 1 ⇒ 外接半径 R = 1/√3，角速度 ω = √(3Gm/a³) = √3。
       等质量的三角解是**线性不稳定**的，软化与舍入迟早把它推垮——这正是它的教学价值。 */
    const R = 1 / Math.sqrt(3), w = Math.sqrt(3);
    const r = [], v = [];
    for (let k = 0; k < 3; k++) {
      const a = k * TAU / 3;
      r.push([R * Math.cos(a), R * Math.sin(a), 0]);
      v.push([-w * R * Math.sin(a), w * R * Math.cos(a), 0]);
    }
    return { m: [1, 1, 1], r: r, v: v };
  }
  /* 一般三维初值：本身就不共面的束缚态，实测约 t ≈ 39 抛出一体 */
  return {
    m: [1, 1, 1],
    r: [[-0.90, 0.20, 0.30], [0.95, -0.15, -0.20], [-0.05, -0.05, -0.10]],
    v: [[0.12, 0.44, -0.08], [0.10, -0.40, 0.16], [-0.22, -0.04, -0.08]]
  };
}

/* 把整个初值刚性转到一般姿态：R = Ry(0.618·τ)·Rx(τ)。
   只绕一根轴不够——绕 x 转不改 x 分量，(x,·) 的两张影子会保留同一套 x 结构。 */
function rotVec(p, tilt) {
  const c = Math.cos(tilt), s = Math.sin(tilt);
  const c2 = Math.cos(tilt * 0.618), s2 = Math.sin(tilt * 0.618);
  const y = p[1] * c - p[2] * s, z = p[1] * s + p[2] * c;
  return [p[0] * c2 + z * s2, y, -p[0] * s2 + z * c2];
}
function rotIC(ic, tilt) {
  return { m: ic.m.slice(), r: ic.r.map(p => rotVec(p, tilt)), v: ic.v.map(p => rotVec(p, tilt)) };
}

/* 软化加速度：a_i = Σ_j G m_j (r_j − r_i) / (|r_j − r_i|² + ε²)^{3/2} */
function accel(m, r, eps, out) {
  const e2 = eps * eps;
  for (let i = 0; i < 3; i++) { out[i][0] = 0; out[i][1] = 0; out[i][2] = 0; }
  for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
    const dx = r[j][0] - r[i][0], dy = r[j][1] - r[i][1], dz = r[j][2] - r[i][2];
    const s = dx * dx + dy * dy + dz * dz + e2;
    const inv = G_CONST / (s * Math.sqrt(s));
    out[i][0] += m[j] * dx * inv; out[i][1] += m[j] * dy * inv; out[i][2] += m[j] * dz * inv;
    out[j][0] -= m[i] * dx * inv; out[j][1] -= m[i] * dy * inv; out[j][2] -= m[i] * dz * inv;
  }
}
/* 与软化力**配套**的势能：U = −G m_i m_j /(r² + ε²)^{1/2}。用配套的势，能量
   才是软化动力学的严格守恒量，|ΔE/E₀| 才真的在量积分误差而不是在量软化本身。 */
function energyOf(S, eps) {
  const m = S.m, r = S.r, v = S.v;
  let E = 0;
  for (let i = 0; i < 3; i++) E += 0.5 * m[i] * (v[i][0]*v[i][0] + v[i][1]*v[i][1] + v[i][2]*v[i][2]);
  const e2 = eps * eps;
  for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
    const dx = r[j][0]-r[i][0], dy = r[j][1]-r[i][1], dz = r[j][2]-r[i][2];
    E -= G_CONST * m[i] * m[j] / Math.sqrt(dx*dx + dy*dy + dz*dz + e2);
  }
  return E;
}
function angMomOf(S) {
  const m = S.m, r = S.r, v = S.v;
  let Lx = 0, Ly = 0, Lz = 0;
  for (let i = 0; i < 3; i++) {
    Lx += m[i] * (r[i][1]*v[i][2] - r[i][2]*v[i][1]);
    Ly += m[i] * (r[i][2]*v[i][0] - r[i][0]*v[i][2]);
    Lz += m[i] * (r[i][0]*v[i][1] - r[i][1]*v[i][0]);
  }
  return [Lx, Ly, Lz];
}
function comOf(S) {
  const m = S.m, r = S.r;
  const M = m[0] + m[1] + m[2];
  return [(m[0]*r[0][0] + m[1]*r[1][0] + m[2]*r[2][0]) / M,
          (m[0]*r[0][1] + m[1]*r[1][1] + m[2]*r[2][1]) / M,
          (m[0]*r[0][2] + m[1]*r[1][2] + m[2]*r[2][2]) / M];
}
function makeSys(ic, eps) {
  const S = {
    m: ic.m.slice(),
    r: ic.r.map(p => p.slice()),
    v: ic.v.map(p => p.slice()),
    a: [[0,0,0],[0,0,0],[0,0,0]]
  };
  accel(S.m, S.r, eps, S.a);
  return S;
}
/* velocity-Verlet 单步（辛格式，定步长）：
     v ← v + (h/2)a ; r ← r + h v ; a ← a(r) ; v ← v + (h/2)a  */
function vstep(S, h, eps) {
  const h2 = h * 0.5;
  for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) {
    S.v[i][k] += h2 * S.a[i][k];
    S.r[i][k] += h * S.v[i][k];
  }
  accel(S.m, S.r, eps, S.a);
  for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) S.v[i][k] += h2 * S.a[i][k];
}

/* ================= 模拟状态（一份运动，四种测量：规范 §6） ================= */
/* 始终同时积分两套系统：A = 种子本身，B = 种子给天体 1 的 x 加上 δ₀。
   页签①② 只画 A；页签③④ 画 A 与 B 的对照。四个页签共享同一次积分。 */
const SIM = {
  A: null, B: null,
  tSim: 0,                  // 本次播种以来的积分时间（无量纲）
  seedCount: 0,             // 播种次数
  lastReason: null,         // 'escape' | 'timeout' | null（首次播种）
  escapes: 0, timeouts: 0,
  E0: 0, L0: [0,0,0],
  driftE: 0, driftEmax: 0, driftL: 0, driftLmax: 0,
  minSep: Infinity,         // 真实三维最近接近距离（本次播种以来）
  minProj: { xy: Infinity, yz: Infinity, xz: Infinity },  // 各投影下"看起来的"最近接近
  curSep: [0, 0, 0],        // 当前 r₁₂ / r₁₃ / r₂₃
  d0: 1e-8, dSep: 0,        // 18 维相空间分离
  encounters: 0, encArmed: true, encFlag: false,
  choreoLost: 0,            // 图 8 失去编舞的周期号（0 = 尚未失去）
  projChecks: 0, projViol: 0,   // 投影不等式断言的计数器
  sig: null
};

/* 种子签名：任何一项变了都意味着「用户要求重新播种」（规范 §0.3 的显式语义）。
   这里也是 preset / tilt / soften / logD0 四个键**真正被消费**的地方——它们不在
   draw()/readout() 里出现，而是每帧经 pushSample → seedSig 读到。规范 §8 的
   「含经模块级辅助函数间接读取的」说的就是这种情况，故消费它们的场景必须把它们
   写进 params（页签③④ 的 logD0 即是如此）。 */
function seedSig() {
  return [Math.round(state.preset), state.tilt.toFixed(4), state.soften.toFixed(4),
          state.logD0.toExponential(4)].join('|');
}

function seedAll(reason) {
  const eps = state.soften;
  const ic = rotIC(seedIC(Math.round(state.preset)), state.tilt);
  SIM.A = makeSys(ic, eps);
  const icB = { m: ic.m.slice(), r: ic.r.map(p => p.slice()), v: ic.v.map(p => p.slice()) };
  icB.r[0][0] += state.logD0;          // δ₀ 只加在天体 1 的 x 上 ⇒ δ(0) = δ₀ 精确
  SIM.B = makeSys(icB, eps);
  SIM.tSim = 0;
  SIM.seedCount++;
  SIM.lastReason = reason || null;
  SIM.E0 = energyOf(SIM.A, eps);
  SIM.L0 = angMomOf(SIM.A);
  SIM.driftE = SIM.driftEmax = SIM.driftL = SIM.driftLmax = 0;
  SIM.minSep = Infinity;
  SIM.minProj = { xy: Infinity, yz: Infinity, xz: Infinity };
  SIM.d0 = Math.max(1e-300, state.logD0);
  SIM.dSep = SIM.d0;
  SIM.encounters = 0; SIM.encArmed = true; SIM.encFlag = false;
  SIM.choreoLost = 0;
  SIM.sig = seedSig();
  samples.length = 0;
}

/* 当前三对间距 r₁₂ / r₁₃ / r₂₃。只此一份公式：stepSim() 每帧刷新它，
   startRound() 播种后也要刷新 —— 否则新一轮的第 0 步还挂着上一轮最后一帧的
   间距，读数会闪一下旧值，更要命的是它进了存档：录制的第 0 行就不再是种子的
   函数，§11.2 的本机重算从第一行起就对不上（实测 δ = 1.73）。 */
function sepOf(S) {
  const r = S.r;
  return [
    Math.hypot(r[1][0]-r[0][0], r[1][1]-r[0][1], r[1][2]-r[0][2]),
    Math.hypot(r[2][0]-r[0][0], r[2][1]-r[0][1], r[2][2]-r[0][2]),
    Math.hypot(r[2][0]-r[1][0], r[2][1]-r[1][1], r[2][2]-r[1][2])
  ];
}

/* 18 维相空间距离（9 个位置分量 + 9 个速度分量） */
function phaseDist(A, B) {
  let s = 0;
  for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) {
    const dr = A.r[i][k] - B.r[i][k], dv = A.v[i][k] - B.v[i][k];
    s += dr*dr + dv*dv;
  }
  return Math.sqrt(s);
}

/* 每帧推进：固定步长 h 做 ceil(dt/h) 个子步，上限 MAX_SUB。
   诊断量（最近接近、遭遇计数、投影不等式断言）逐子步统计，不会漏掉快速穿越。 */
function stepSim(dt) {
  const eps = state.soften;
  let n = Math.ceil(dt / H_STEP);
  if (n > MAX_SUB) n = MAX_SUB;     // 后台切回时宁可模拟时间落后，也不卡死一帧
  if (n < 1) n = 1;
  SIM.encFlag = false;
  for (let k = 0; k < n; k++) {
    vstep(SIM.A, H_STEP, eps);
    vstep(SIM.B, H_STEP, eps);
    SIM.tSim += H_STEP;

    const r = SIM.A.r;
    let md = Infinity;
    for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
      const dx = r[j][0]-r[i][0], dy = r[j][1]-r[i][1], dz = r[j][2]-r[i][2];
      const d3 = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d3 < md) md = d3;
      if (d3 < SIM.minSep) SIM.minSep = d3;
      /* 投影只会让距离变小，绝不会变大：这条不等式在每个瞬时都必须成立。
         逐对逐子步做断言，违例数常驻页签② 读数区（实测恒为 0）。 */
      const pxy = Math.sqrt(dx*dx + dy*dy);
      const pyz = Math.sqrt(dy*dy + dz*dz);
      const pxz = Math.sqrt(dx*dx + dz*dz);
      if (pxy < SIM.minProj.xy) SIM.minProj.xy = pxy;
      if (pyz < SIM.minProj.yz) SIM.minProj.yz = pyz;
      if (pxz < SIM.minProj.xz) SIM.minProj.xz = pxz;
      SIM.projChecks += 3;
      if (pxy > d3 + 1e-9 || pyz > d3 + 1e-9 || pxz > d3 + 1e-9) SIM.projViol++;
    }
    if (SIM.encArmed && md < ENC_IN) { SIM.encounters++; SIM.encArmed = false; SIM.encFlag = true; }
    else if (!SIM.encArmed && md > ENC_OUT) SIM.encArmed = true;
  }

  const rr = SIM.A.r;
  SIM.curSep = sepOf(SIM.A);
  SIM.dSep = phaseDist(SIM.A, SIM.B);
  const E = energyOf(SIM.A, eps), L = angMomOf(SIM.A);
  SIM.driftE = Math.abs((E - SIM.E0) / SIM.E0);
  if (SIM.driftE > SIM.driftEmax) SIM.driftEmax = SIM.driftE;
  SIM.driftL = Math.hypot(L[0]-SIM.L0[0], L[1]-SIM.L0[1], L[2]-SIM.L0[2]);
  if (SIM.driftL > SIM.driftLmax) SIM.driftLmax = SIM.driftL;
  if (!SIM.choreoLost && Math.round(state.preset) === 0 && SIM.dSep > 0.25) {
    SIM.choreoLost = Math.floor(SIM.tSim / FIG8_T) + 1;
  }

  /* 规范 §0.4：三体常见一体逃逸，画面会变成一条无限后退的直线 —— 实质定格。
     超出 R_ESC 或积分超过 T_MAX 即自动回到种子重新播种，并在读数区说明原因。 */
  const com = comOf(SIM.A);
  let far = 0;
  for (let i = 0; i < 3; i++) {
    far = Math.max(far, Math.hypot(rr[i][0]-com[0], rr[i][1]-com[1], rr[i][2]-com[2]));
  }
  if (far > R_ESC) { SIM.escapes++; seedAll('escape'); }
  else if (SIM.tSim > T_MAX) { SIM.timeouts++; seedAll('timeout'); }
}

/* ================= 投影：四维曲线的三个影子（页签② 的核心机制） ================= */
/* projMode 不是滑杆参数，而是由页签② 的视角预设经 onSelect 切换的显示模式，
   所以它是模块级变量、不进 state（state 只装滑杆与开关，规范 §6）。 */
let projMode = 'xyz';
const PROJ_INFO = {
  xyz: { label: { zh: '纯空间 x·y·z', en: 'Pure space x·y·z' }, ax: 'x', ay: 'y', az: 'z',
         drop: { zh: '没有维度被丢掉：三根轴全是空间', en: 'nothing discarded: all three axes are spatial' }, key: null },
  xyt: { label: { zh: '时间辫 x·y·t', en: 'Time braid x·y·t' }, ax: 'x', ay: 'y', az: 't',
         drop: { zh: '丢掉的是 z', en: 'the discarded axis is z' }, key: 'xy' },
  yzt: { label: { zh: '时间辫 y·z·t', en: 'Time braid y·z·t' }, ax: 'y', ay: 'z', az: 't',
         drop: { zh: '丢掉的是 x', en: 'the discarded axis is x' }, key: 'yz' },
  xzt: { label: { zh: '时间辫 x·z·t', en: 'Time braid x·z·t' }, ax: 'x', ay: 'z', az: 't',
         drop: { zh: '丢掉的是 y', en: 'the discarded axis is y' }, key: 'xz' }
};
/* p = 三维位置，age = 现在减去该样本的时刻；返回世界坐标。
   注意 state.zScale 只在**时间辫**分支里读：纯空间没有时间轴，读了它就等于
   让页签①③ 多依赖一个它们并不用的键，与各自的 params 声明对不上（规范 §8）。 */
function worldOf(mode, p, age) {
  if (mode === 'xyz') return [p[0], p[1], p[2]];
  const z = age * state.zScale;
  if (mode === 'yzt') return [p[1], p[2], z];
  if (mode === 'xzt') return [p[0], p[2], z];
  return [p[0], p[1], z];        // 'xyt'
}
function setProj(m) { projMode = m; }

/* ============================================================
   场景级绘制部件（引擎部件不够用时在这里补，绝不改引擎）
   ============================================================ */
const AX = 'rgba(159,176,200,0.9)';
const AX_DIM = 'rgba(159,176,200,0.5)';
const BODY_COL = ['#fb7185', '#a78bfa', '#34d399'];      // 曲线启用顺序：rose → violet → emerald
const BODY_GLOW = ['rgba(251,113,133,', 'rgba(167,139,250,', 'rgba(52,211,153,'];
const AMBER = 'rgba(251,191,36,';
const CYAN = 'rgba(45,212,234,';

/* 可自定义轴字母的坐标轴：引擎的 drawAxes 把 x / y / t 写死了，本工具四种投影
   的轴含义每次都不同，故在场景层做一个替身（fourier-essence-3d 同款做法）。 */
function axes3(C, o) {
  const ex = o.ex, ey = o.ey, ez = o.ez;
  if (o.lx) {
    line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AX });
    arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AX);
    label3(C, [ex + 0.26, 0, 0], o.lx, { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  }
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AX });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AX);

  if (o.timeAxis) {

    line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AX_DIM });
    label3(C, [-0.14, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });

}

/* 轨迹取点：长拖尾时按跨度抽稀（视觉上无差别，单帧代价却是常数量级） */
function trailPts(sys, bodyIdx, mode, xform) {
  const n = samples.length;
  if (n < 2) return null;
  const stride = Math.max(1, Math.ceil(n / 700));
  const pts = [];
  for (let i = n - 1; i >= 0; i -= stride) {
    const s = samples[i];
    const p = (sys === 'A') ? s.a[bodyIdx] : s.b[bodyIdx];
    const w = worldOf(mode, p, state.t - s.t);
    pts.push(xform ? xform(w) : w);
  }
  return pts;
}

/* 一条轨迹的标准双描：外层辉光 + 内核头亮尾隐（规范 §4.2） */
function strokeTrail(C, pts, rgbPrefix, w) {
  if (!pts || pts.length < 2) return;
  strokePoly(C, pts, { width: (w || 2.2) + 3.3, color: rgbPrefix + '0.13)' });
  strokePoly(C, pts, { width: w || 2.2, fade: [rgbPrefix + '1)', rgbPrefix + '0.04)'] });
}

/* 上标数字（读数区的科学计数法用）；负号用 U+207B，与 §7 的 U+2212 同族 */
const SUP = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
function supNum(e) { return String(e).split('').map(c => SUP[c] || c).join(''); }
function sci(x, d) {
  if (!isFinite(x)) return '∞';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, e);
  return m.toFixed(d == null ? 2 : d) + '×10' + supNum(e);
}

/* 守恒量的诚实披露：能量与角动量漂移，当前值与峰值都报。

/* 录制 / 回放的说明行（§11）。模式判据一律走引擎的 recInfo()（§11.7），
   不得自拼判据 —— 同一判据出现两种写法，正是引擎副本互相漂移的起点。
   §11.3「录一轮」在本工具的含义要说明白：一份存档 = 一次完整的故事，
   从播种到那一体被甩出去（或积分超时）为止，不是随手截的一段。 */
function roRec() {
  const ri = recInfo();
  if (!ri) return '';
  if (ri.mode === 'recording') {
    return '<div class="ambC">' + t({
      zh: '录制中：一份存档 = 一轮 —— 从刚才那次播种，到逃逸或超时自动收尾为止。',
      en: 'Recording: one archive = one round — from the re-seed just now to the escape (or timeout) that ends it.'
    }) + '</div>';
  }
  if (ri.mode !== 'replay') return '';
  let s = '<div class="ambC">' + t({
    zh: '回放中：画面来自存档的轨迹，不做任何算术 —— 一份存档就是一轮完整的演化。',
    en: 'Replaying: the picture comes from the recorded trace, with no arithmetic — one archive is one complete round.'
  }) + '</div>';
  const v = ri.verify;
  if (!v) return s;
  return s + '<div class="dim">' + (v.reproduced ? t({
    zh: '种子比对 δ = ' + v.delta.toExponential(1) + '：同一种子在这台机器上重新积分，' +
        '逐点贴合到存档 12 位有效数字的舍入量级 —— 这一轮在这里复现了。',
    en: 'Seed check δ = ' + v.delta.toExponential(1) + ': re-integrating the same seed on this machine tracks the ' +
        'archive down to its 12-significant-digit rounding floor — this round does reproduce here.'
  }) : t({
    zh: '种子比对 δ = ' + v.delta.toExponential(1) + '：同一种子、同一段代码，本机重算已经跑出另一条轨迹。' +
        '这不是 bug —— ECMAScript 不保证 Math.sin / Math.pow 跨实现逐位相同，1 ULP 的差别被这个系统的' +
        '正李雅普诺夫指数放大，几十秒就长到 O(1)。存轨迹而不是只存种子，正是为了这一条。',
    en: 'Seed check δ = ' + v.delta.toExponential(1) + ': same seed, same code — and the local re-integration has ' +
        'already left the recorded trajectory. This is not a bug: ECMAScript does not require Math.sin / Math.pow to ' +
        'agree bit-for-bit across implementations, and a 1-ULP difference is stretched to O(1) within seconds by this ' +
        'system’s positive Lyapunov exponent. Storing the trace, not just the seed, is exactly why.'
  })) + '</div>';

/* 软化项的披露：规范要求必须写明它是数值处理而非物理 */
function roSoften() {
  return '<div class="dim"><i>ε</i> = ' + state.soften.toFixed(3) +
         t({ zh: '（软化参数：数值处理，不是物理）', en: ' (softening: a numerical device, not physics)' }) + '</div>';
}

/* 最小二乘拟合 ln δ = b + λ t —— 只用未饱和段（δ < 0.2·SAT_D）。
   截距 b 一并返回：拟合直线必须画在数据上，锚在 δ₀ 上会整条掉到曲线底下。 */
function fitLambda() {
  let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < samples.length; i++) {
    const s = samples[i];
    if (!(s.d > 0) || s.d > 0.2 * SAT_D) continue;
    const x = s.ts, y = Math.log(s.d);
    n++; sx += x; sy += y; sxx += x*x; sxy += x*y;
  }
  if (n < 24) return null;
  const den = n * sxx - sx * sx;
  if (Math.abs(den) < 1e-12) return null;
  const lam = (n * sxy - sx * sy) / den;
  return { lam: lam, b: (sy - lam * sx) / n };
}

/* 视角预设的动态相机：沿轨道法线看下去 / 沿轨道平面切向看过去。
   引擎的 applyView() 先调 onSelect 再读 vw.az / vw.el，所以就地改写视角对象合法。
   法线 n = Ry(0.618τ)·Rx(τ)·(0,0,1) = (cos τ·sin .618τ, −sin τ, cos τ·cos .618τ)
   ⇒ el = −τ，az = 0.618τ。 */
function faceOrbit(vw) {
  vw.el = clamp(-state.tilt, -1.45, 1.53) + 0.001;
  vw.az = 0.618 * state.tilt + 0.001;
}
function edgeOrbit(vw) {
  const a = 0.618 * state.tilt;
  vw.el = 0.001;
  vw.az = Math.atan2(Math.cos(a), -Math.sin(a));
}
/* 供 onSelect 用：改开关时同步复选框（引擎给每个开关挂了 data-key） */
function setToggle(key, on) {
  state[key] = !!on;
  document.querySelectorAll('input[data-key="' + key + '"]').forEach(o => { o.checked = !!on; });
}
/* 供 onSelect 用：改滑杆值时同步滑块回显（syncParamSlider 是引擎的同步入口） */
function setParam(key, v) { state[key] = v; syncParamSlider(key); }

    params: ['preset', 'tilt', 'zScale', 'trail', 'soften'],
