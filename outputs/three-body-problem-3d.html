    brand: { zh: '真实状态是 ℝ³ 里的三条轨迹；加上时间，本体是 (x, y, z, t) 里的一条四维曲线。引擎只有三根世界轴，每次只能看它的一个三维影子 —— 用视角按钮切换四种喂法。',
             en: 'The true state is three trajectories in ℝ³; add time and the real object is a single curve in (x, y, z, t) — four dimensions. The engine has only three world axes, so you only ever see one 3-D shadow of it at a time. Use the view buttons to switch between the four feeds.' },
    tips: { zh: '提示：先把预设留在「图 8 编舞」—— 一条你事先知道形状的干净闭合曲线 —— 把倾角拧到 30° 以上，再依次按三张「辫」。同一段运动的三个影子长得毫不相干；哪一张都不是真相，就像立方体在纸上的影子是个方框套方框。读数区那两行会告诉你：影子里的最近接近距离总是比真实的更小。',
            en: 'Tip: keep the preset on "Figure-8 choreography" — a clean closed curve whose shape you already know — raise the tilt past 30°, then press the three "braid" views in turn. Three shadows of one motion, and they look like three unrelated things. None of them is the truth, just as a cube casts a square-inside-a-square onto paper. The readout makes it quantitative: the closest approach seen in a shadow is always smaller than the real one.' },
    views: {
      iso:    { label: { zh: '立体', en: '3D' }, az: -0.85, el: 0.32, dist: 9.5, tx: 0, ty: 0, tz: 1.4 },
      space:  { label: { zh: '纯空间 x·y·z', en: 'Pure space' }, az: -0.7, el: 0.35, dist: 8.0, tx: 0, ty: 0, tz: 0,
                onSelect() { setProj('xyz'); } },
      braid1: { label: { zh: '辫 x·y·t', en: 'Braid x·y·t' }, az: -0.95, el: 0.30, dist: 11.5, tx: 0, ty: 0, tz: 2.8,
                onSelect() { setProj('xyt'); } },
      braid2: { label: { zh: '辫 y·z·t', en: 'Braid y·z·t' }, az: -0.95, el: 0.30, dist: 11.5, tx: 0, ty: 0, tz: 2.8,
                onSelect() { setProj('yzt'); } },
      braid3: { label: { zh: '辫 x·z·t', en: 'Braid x·z·t' }, az: -0.95, el: 0.30, dist: 11.5, tx: 0, ty: 0, tz: 2.8,
                onSelect() { setProj('xzt'); } },
      side:   { label: { zh: '辫的侧视', en: 'Braid side-on' }, az: -Math.PI/2, el: 0.001, dist: 12, tx: 0, ty: 0, tz: 3.2 }
    },
    toggles: [
      { key: 'showB1',   label: { zh: '天体 1 轨迹', en: 'Body 1 trail' }, color: '#fb7185', checked: true },
      { key: 'showB2',   label: { zh: '天体 2 轨迹', en: 'Body 2 trail' }, color: '#a78bfa', checked: true },
      { key: 'showB3',   label: { zh: '天体 3 轨迹', en: 'Body 3 trail' }, color: '#34d399', checked: true },
      { key: 'showDrop', label: { zh: '被丢掉的那一维', en: 'The discarded axis' }, color: '#fbbf24', checked: true },
      { key: 'showGrid', label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: true }
    ],
    sampleWindow: () => state.trail + 0.5,
    draw(C) {
      const m = projMode, info = PROJ_INFO[m], isT = (m !== 'xyz');
      const zEnd = isT ? Math.min(WAVE_LEN + 0.6, state.trail * state.zScale + 0.6) : 2.4;

      if (state.showGrid) {
        drawGridXY(C, 2.4, 0.6);
        if (isT) drawTimeGrid(C, { yMax: 2.2, v: state.zScale });
      }
      axes3(C, { ex: 2.4, ey: 2.4, ez: zEnd, lx: info.ax, ly: info.ay, lz: info.az,
                 timeAxis: isT, xTicks: [1, 2], yTicks: [1] });

      for (let i = 0; i < 3; i++) {
        if (!state['showB' + (i + 1)]) continue;
        strokeTrail(C, trailPts('A', i, m), BODY_GLOW[i]);
      }

      /* 被丢掉的那一维：从当前点沿时间轴投下的琥珀虚线。
         纯空间视图里没有维度被丢掉，所以这组虚线自然不出现。 */
      if (state.showDrop && isT) {
        for (let i = 0; i < 3; i++) {
          const w = worldOf(m, SIM.A.r[i], 0);
          line3(C, w, [w[0], w[1], zEnd - 0.3], { width: 1, dash: [4, 5], color: AMBER + '0.28)' });
        }
      }

      for (let i = 0; i < 3; i++) {
        const w = worldOf(m, SIM.A.r[i], 0);
        const s = proj(C, w);
        if (s) glowDot(s, 11, '#ffffff', BODY_GLOW[i] + '0.9)');
        label3(C, w, String(i + 1),
          { font: 'italic 13px ' + FONT_MATH, color: BODY_COL[i], align: 'center', dy: -16 });
      }

      /* 同样锚在左下，避开左上的品牌区 */
      label3(C, [-2.3, -1.95, 0], t(info.label),
        { size: 12, color: 'rgba(159,176,200,.8)', align: 'left' });
      label3(C, [-2.3, -2.2, 0], t(info.drop),
        { size: 11, color: AMBER + '0.8)', align: 'left' });
    },
    readout() {
      const info = PROJ_INFO[projMode];
      const app = info.key ? SIM.minProj[info.key] : SIM.minSep;
      return roHead() +
        '<div>' + t({ zh: '当前投影：', en: 'projection: ' }) + '<b>' + t(info.label) + '</b></div>' +
        '<div class="ambC">' + t({ zh: '真实最近接近 ', en: 'true closest approach ' }) + '= <b>' +
          (isFinite(SIM.minSep) ? fmt(SIM.minSep, 3) : '—') + '</b></div>' +
        '<div class="ambC">' + t({ zh: '影子里「看起来」的 ', en: 'apparent in this shadow ' }) + '= <b>' +
          (isFinite(app) ? fmt(app, 3) : '—') + '</b></div>' +
        '<div class="dim">' + t(info.drop) + '</div>' +
        '<div class="dim">' + t({ zh: '不等式断言（投影只会让距离变小）：', en: 'assertion (projection only shrinks distances): ' }) +
          SIM.projViol + ' / ' + SIM.projChecks + t({ zh: ' 次违例', en: ' violations' }) + '</div>' +
        roSoften() + roRec();
    }
  },

  /* ────── ③ 图 8 编舞 · 稳定解是刀锋 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 会把结论讲反，且台账预判的那个量并不存在。

     ① 会讲反：本页唯一的离散事件是 SIM.choreoLost —— 扰动解 B **离开**图 8 的
        那个周期号（`SIM.dSep > 0.25` 触发）。它标记的是失败：给它打金光，等于
        表彰「精确解被扰动毁掉了」。tips 要人看的是翠绿那套几十周期不散。

     ② 预判落空的方式（记下来，供台账回写）：普查台账预设本页会有「A 回到初始
        状态」这样一个到达。**这一页没有这个量。** 页面上唯一的周期读数是
        `SIM.tSim / FIG8_T`，一个一直增长的计数（读数印「第 N 个周期」），
        它永远不会「等于」什么；页面从不计算 A 与自身初值的距离。
        为写这条注释，在页面之外现算了那个量：它每个周期确实回来一次，实测前 9 个
        周期的最近回归距离依次是 5.1e−3 / 1.2e−2 / 8.6e−3 / 3.9e−3 / 2.7e−3 /
        9.1e−3 / 1.3e−2 / 7.0e−3 / 5.3e−4（60 s 跑 9.67 个周期）—— 既不为 0
        （积分器有漂移），也没有上升沿的意味：图 8 从**第一个**周期起就是周期解，
        那是精确解的构造性质，不是走出来的到达。真闪起来是 6.33 s 一响的节拍器。
        要把它变成可闪的题，得先在页面上造一个自己不测的量 —— 那是给闪找题目。 */
  choreo: {
    label: { zh: '图 8 编舞', en: 'Figure-8' },
    params: ['preset', 'tilt', 'trail', 'logD0', 'soften'],
    /* 在动的机制（出路①）：同一台积分器同时推进 A（原解）与 B（扰动解）。
       两者的初值只差 δ₀，是**种子**，绝不加 drive。图 8 不会逃逸，但会在
       T_MAX = 200（约 31 个周期）后按 §0.4 自动重新播种，故本页也不会定格。 */
    brand: { zh: 'Chenciner–Montgomery 的图 8 编舞：三体等质量、共用同一条 8 字轨道，互差三分之一周期。它是三体的一个精确周期解 —— 也是刀锋上的平衡。',
             en: 'The Chenciner–Montgomery figure-8 choreography: three equal masses chase one another along a single shared figure-8 orbit, offset by a third of a period. It is an exact periodic solution of the three-body problem — and a balance on a knife edge.' },
    tips: { zh: '提示：三体不是总是混乱，是几乎总是。图 8 这样的精确解存在，翠绿那套跑几十个周期都不散；但给玫红那套加 10⁻⁸ 的扰动，若干周期后它就离开轨道再也找不回来。按「轨道正视」看那条干净的 8 字 —— 三颗珠子串在同一条曲线上，这正是「编舞」二字的意思。',
            en: 'Tip: the three-body problem is not always chaotic — just almost always. Exact solutions like the figure-8 do exist, and the emerald copy holds its shape for dozens of periods. Perturb the rose copy by 10⁻⁸ and after a few periods it leaves the orbit for good. Press "Face the orbit" for the clean figure-8: three beads threaded on one single curve, which is exactly what "choreography" means here.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' }, az: -0.7, el: 0.35, dist: 9.0, tx: 0, ty: 0, tz: 0 },
      face: { label: { zh: '轨道正视', en: 'Face the orbit' }, az: 0.001, el: 0.001, dist: 8.4, tx: 0, ty: 0, tz: 0,
              onSelect() { setParam('preset', 0); faceOrbit(this); } },
      pair: { label: { zh: '并排对比', en: 'Side by side' }, az: 0.001, el: 0.001, dist: 10.5, tx: 0, ty: 0, tz: 0,
              onSelect() { setParam('preset', 0); setToggle('sideBySide', true); faceOrbit(this); } },
      over: { label: { zh: '叠合对比', en: 'Overlaid' }, az: 0.001, el: 0.001, dist: 6.8, tx: 0, ty: 0, tz: 0,
              onSelect() { setParam('preset', 0); setToggle('sideBySide', false); faceOrbit(this); } }
    },
    toggles: [
      { key: 'showPerturb', label: { zh: '扰动解 +δ₀', en: 'Perturbed copy +δ₀' }, color: '#fb7185', checked: true },
      { key: 'showRef',     label: { zh: '原解（精确编舞）', en: 'Exact choreography' }, color: '#34d399', checked: true },
      { key: 'sideBySide',  label: { zh: '并排放置', en: 'Offset side by side' }, color: '#fbbf24', checked: true },
      { key: 'showGrid',    label: { zh: '网格', en: 'Grid' }, color: '#64748b', checked: true }
    ],
    sampleWindow: () => Math.max(state.trail, FIG8_T * 1.05) + 0.5,
    draw(C) {
      const dx = state.sideBySide ? 1.75 : 0;
      const shiftA = w => [w[0] - dx, w[1], w[2]];
      const shiftB = w => [w[0] + dx, w[1], w[2]];

      if (state.showGrid) drawGridXY(C, 2.6, 0.65);
      axes3(C, { ex: 3.0, ey: 2.2, ez: 2.0, lx: 'x', ly: 'y', lz: 'z',
                 timeAxis: false, xTicks: [1], yTicks: [1] });

      /* 原解：三体共用**同一条** 8 字轨道 —— 所以只画一条翠绿曲线（三段用 null
         断开拼接），再在它上面钉三颗珠子。这正是 choreography 一词的意思。 */
      if (state.showRef) {
        const pts = [];
        for (let i = 0; i < 3; i++) {
          const p = trailPts('A', i, 'xyz', shiftA);
          if (p) { pts.push.apply(pts, p); pts.push(null); }
        }
        strokeTrail(C, pts, BODY_GLOW[2]);
        for (let i = 0; i < 3; i++) {
          const s = proj(C, shiftA(SIM.A.r[i]));
          if (s) glowDot(s, 10, '#ffffff', BODY_GLOW[2] + '0.9)');
        }
        /* 叠合模式下 dx = 0，两条标注会锚在同一个世界点上叠成乱码：
           这时改用屏幕空间 dy 把它们上下分开（世界坐标分不开——正是因为叠合了）。 */
        label3(C, [-dx, -1.8, 0], t({ zh: '原解 · 精确编舞', en: 'exact choreography' }),
          { size: 11, color: BODY_COL[2], align: 'center', dy: dx ? 0 : -9 });
      }

      if (state.showPerturb) {
        const pts = [];
        for (let i = 0; i < 3; i++) {
          const p = trailPts('B', i, 'xyz', shiftB);
          if (p) { pts.push.apply(pts, p); pts.push(null); }
        }
        strokeTrail(C, pts, BODY_GLOW[0]);
        for (let i = 0; i < 3; i++) {
          const s = proj(C, shiftB(SIM.B.r[i]));
          if (s) glowDot(s, 10, '#ffffff', BODY_GLOW[0] + '0.9)');
        }
        label3(C, [dx, -1.8, 0], t({ zh: '扰动解 · +δ₀', en: 'perturbed · +δ₀' }),
          { size: 11, color: BODY_COL[0], align: 'center', dy: dx ? 0 : 9 });
      }

      /* 琥珀 = 度量注记：当前跑到第几个周期 */
      label3(C, [0, 2.0, 0],
        t({ zh: '第 ' + fmt(SIM.tSim / FIG8_T) + ' 个周期', en: 'period ' + fmt(SIM.tSim / FIG8_T) }),
        { size: 11, color: '#fbbf24', align: 'center' });
    },
    readout() {
      const per = SIM.tSim / FIG8_T;
      const isFig8 = Math.round(state.preset) === 0;
      const lost = SIM.choreoLost
        ? t({ zh: '第 ' + SIM.choreoLost + ' 周期失去编舞', en: 'choreography lost at period ' + SIM.choreoLost })
        : t({ zh: '编舞仍然成立', en: 'choreography still holding' });
      return roHead() +
        '<div class="tanC">' + t({ zh: '周期数 ', en: 'periods ' }) + '<i>t</i>/<i>T</i> = <b>' + fmt(per) +
          '</b>&ensp;<span class="dim"><i>T</i> = ' + fmt(FIG8_T, 4) + '</span></div>' +
        '<div class="sinC">' + t({ zh: '与原轨道的偏离 ', en: 'deviation from the exact orbit ' }) +
          '<i>δ</i> = <b>' + sci(SIM.dSep) + '</b></div>' +
        '<div class="ambC"><b>' + lost + '</b></div>' +
        (isFig8 ? '' : '<div class="dim">' +
          t({ zh: '本页以图 8 编舞为对象：请把「初值预设」拨回「图 8 编舞」',
              en: 'this tab is about the figure-8 — set the preset back to "Figure-8 choreography"' }) + '</div>') +
        roConserved() + roSoften();
    }
  },

  /* ────── ④ 分道 · 逃逸 · 守恒量 ────── */
  /* 金光闪（§4.7）：本页有意不加 —— 发散，不是到达；而且没有稳定的量可打。
     本页画的 δ(t) 是指数**发散**的：默认 δ₀ = 10⁻⁸，60 s（9.67 个图 8 周期）
     实测从 1.00e−8 长到 3.50e−6，涨了 350 倍，还远没走完。它不趋向任何值。
     候选一「δ 触到饱和线 SAT_D = 2.0」不能要：那根线上页面自己写着「饱和：
     此后不再有信息」—— 给一个「从此不再有信息」的时刻打金光，正是 §4.7
     说的把结论讲反；何况混沌预设下它出现的时刻完全不可控。
     候选二「λ 稳定下来」也不能要：λ 是滑窗最小二乘的拟合值（只取未饱和段），
     每帧都在抖，它没有一个「终于等于」的对象。
     近距离遭遇的琥珀刻线是事件不是到达，同页签① 的理由。 */
  divergence: {
    label: { zh: '分道与逃逸', en: 'Divergence & escape' },
    params: ['preset', 'tilt', 'zScale', 'trail', 'logD0', 'soften'],
    /* 在动的机制（出路①）：同一台积分器推进 A 与 B；本页画的 log δ(t) 曲线
       由每帧的真实 δ 采样流出（pushSample 记录当时真实值，绝不重算）。
       **无 drive**。一体逃逸或积分超时会按 §0.4 自动重新播种并计数，
       所以曲线永远在重新生长，不会「一次性演进后永久定格」。 */
    brand: { zh: '两套三体，初值只差 δ₀。把 log₁₀ δ(t) 沿时间轴画出来：混沌区是一条直线，斜率就是李雅普诺夫指数。每一次跳变下面，都对应一次近距离遭遇。',
             en: 'Two three-body systems whose initial conditions differ by δ₀. Plot log₁₀ δ(t) along the time axis and the chaotic regime is a straight line whose slope is the Lyapunov exponent. Every jump in that line sits directly above a close encounter.' },
    tips: { zh: '提示：三体的混沌有个具体的放大器 —— 近距离遭遇。两体擦身而过时，出射方向对入射参数极度敏感，一次遭遇就能把 10⁻¹⁰ 的差别放大好几个数量级。按「log δ · t 正视」，看分离曲线的每一次跳变，正下方都有一根琥珀刻线。',
            en: 'Tip: the chaos of the three-body problem has a concrete amplifier — the close encounter. When two bodies swing past each other the outgoing direction is extremely sensitive to the incoming one, and a single pass can magnify a difference of 10⁻¹⁰ by several orders of magnitude. Press "log δ · t front" and check every jump in the separation curve: an amber tick sits right below it.' },
    views: {
      iso:  { label: { zh: '立体', en: '3D' }, az: -1.05, el: 0.28, dist: 14, tx: 0, ty: 0.7, tz: 2.8 },
      logt: { label: { zh: 'log δ · t 正视', en: 'log δ · t front' }, az: -Math.PI/2, el: 0.001, dist: 14, tx: 0, ty: 0.7, tz: 3.4 },
      sys:  { label: { zh: '两套系统特写', en: 'The two systems' }, az: -Math.PI/2, el: 0.001, dist: 4.4, tx: 0, ty: 2.6, tz: 2.4 },
      top:  { label: { zh: '俯视', en: 'Top' }, az: -Math.PI/2, el: 1.52, dist: 13, tx: 0, ty: 0, tz: 3.4 }
    },
    toggles: [
      { key: 'showDelta', label: { zh: '分离曲线 log δ', en: 'Separation log δ' }, color: '#fb7185', checked: true },
      { key: 'showFit',   label: { zh: '指数律拟合', en: 'Exponential fit' },      color: '#a78bfa', checked: true },
      { key: 'showSys',   label: { zh: '两套系统', en: 'Both systems' },           color: '#34d399', checked: true },
      { key: 'showEnc',   label: { zh: '近距离遭遇', en: 'Close encounters' },     color: '#fbbf24', checked: true },
      { key: 'showGrid',  label: { zh: '网格', en: 'Grid' },                       color: '#64748b', checked: true }
    ],
    sampleWindow: () => state.trail + 0.5,
    draw(C) {
      const LO = -12, HI = 1, Y0 = -1.9, Y1 = 1.4;
      const yOf = ld => Y0 + (clamp(ld, LO, HI) - LO) / (HI - LO) * (Y1 - Y0);
      const zEnd = Math.min(WAVE_LEN + 0.6, state.trail * state.zScale + 0.6);

      if (state.showGrid) drawTimeGrid(C, { yMax: 1.6, v: state.zScale });
      /* 十年刻度（结构线，灰） */
      for (let d = LO; d <= HI; d += 2) {
        const y = yOf(d);
        line3(C, [0, y, 0], [0, y, zEnd - 0.2], { width: 1, color: 'rgba(148,163,184,0.08)' });
        label3(C, [0, y, -0.18], '10' + supNum(d),
          { size: 10, color: 'rgba(159,176,200,.55)', align: 'right' });
      }
      axes3(C, { ex: 0, ey: 1.75, ez: zEnd, lx: null, ly: 'δ', lz: 't', timeAxis: true });

      /* 饱和线（翠绿虚线）：δ 长到系统尺度后，曲线不再携带信息 */
      const ySat = yOf(Math.log10(SAT_D));
      line3(C, [0, ySat, 0], [0, ySat, zEnd - 0.2],
        { width: 1, dash: [5, 6], color: BODY_GLOW[2] + '0.55)' });
      label3(C, [0, ySat + 0.17, zEnd * 0.55], t({ zh: '饱和：此后不再有信息', en: 'saturated: no information beyond here' }),
        { size: 10.5, color: BODY_GLOW[2] + '0.85)', align: 'center' });

      /* 分离曲线（玫红 = 扰动解那一族） */
      if (state.showDelta && samples.length > 1) {
        const pts = [];
        const stride = Math.max(1, Math.ceil(samples.length / 700));
        for (let i = samples.length - 1; i >= 0; i -= stride) {
          const s = samples[i];
          pts.push([0, yOf(Math.log10(Math.max(s.d, 1e-300))), (state.t - s.t) * state.zScale]);
        }
        strokeTrail(C, pts, BODY_GLOW[0], 2.4);
      }

      /* 近距离遭遇（琥珀 = 度量注记）：分离曲线的每一次跳变都在一根刻线上方 */
      if (state.showEnc) {
        for (let i = 0; i < samples.length; i++) {
          if (!samples[i].enc) continue;
          const z = (state.t - samples[i].t) * state.zScale;
          if (z > zEnd) continue;
          line3(C, [0, Y0 - 0.20, z], [0, yOf(Math.log10(Math.max(samples[i].d, 1e-300))), z],
            { width: 1.2, color: AMBER + '0.5)' });
          solidDot(C, [0, Y0 - 0.20, z], 2.4, AMBER + '0.95)');
        }
      }

      /* 指数律拟合（紫）：δ ≈ e^{b+λt}，未饱和段是一条直线。
         画在拟合出的截距上，不是画在 δ₀ 上——后者会整条掉到曲线底下去。 */
      const fit = fitLambda();
      if (state.showFit && fit && fit.lam > 0) {
        const tNow = SIM.tSim;
        const back = Math.min(state.trail, tNow);
        const yAt = tt => yOf((fit.b + fit.lam * tt) / Math.LN10);
        strokePoly(C, [[0, yAt(tNow), 0], [0, yAt(tNow - back), back * state.zScale]],
          { width: 1.6, dash: [6, 6], color: BODY_GLOW[1] + '0.9)' });
        label3(C, [0, yAt(tNow) + 0.24, 0.45], 'λ ≈ ' + fmt(fit.lam),
          { font: 'italic 13px ' + FONT_MATH, color: BODY_COL[1], align: 'left' });
      }

      /* 两套系统的 x·y 投影，上下叠放在图上方。两处安排都由本页的顿悟视角
         （沿世界 x 轴的侧视）决定：
         ① 两套必须**竖直**叠放而不是左右并排——左右的偏移在侧视里是深度，会叠成一团；
         ② 插图本身必须铺在**世界 y·z 平面**上（系统的 x 喂给世界 z）——铺在 x·y 平面
            的话，插图在侧视里会被压成一根竖线。
         同理，两个标注用**屏幕空间** dx 偏出去，世界 x 方向的偏移在侧视里也是深度。 */
      if (state.showSys) {
        const K = 0.20, EXT = 2.2, YA = 2.1, YB = 3.1, Z0 = 2.4;
        /* 定窗口：跑出 EXT 的点返回 null（折线在此断开），逃逸的天体自然离开视窗，
           而不会把插图撑破、压到另一套系统上去。 */
        const put = (w, s) => {
          if (Math.hypot(w[0], w[1]) > EXT) return null;
          return [0, w[1] * K + (s === 'A' ? YA : YB), w[0] * K + Z0];
        };
        for (const which of ['A', 'B']) {
          const col = which === 'A' ? BODY_GLOW[2] : BODY_GLOW[0];
          const pts = [];
          for (let i = 0; i < 3; i++) {
            const p = trailPts(which, i, 'xyz', w => put(w, which));
            if (p) { pts.push.apply(pts, p); pts.push(null); }
          }
          strokeTrail(C, pts, col, 1.8);
          const sys = which === 'A' ? SIM.A : SIM.B;
          for (let i = 0; i < 3; i++) {
            const w = put(sys.r[i], which);
            const s = w && proj(C, w);
            if (s) glowDot(s, 8, '#ffffff', col + '0.9)');
          }
        }
        label3(C, [0, YA, Z0], t({ zh: '原解', en: 'reference' }),
          { size: 10.5, color: BODY_COL[2], align: 'left', dx: 56 });
        label3(C, [0, YB, Z0], t({ zh: '扰动解 +δ₀', en: 'perturbed +δ₀' }),
          { size: 10.5, color: BODY_COL[0], align: 'left', dx: 56 });
      }
    },
    readout() {
      const fit = fitLambda();
      const lam = (fit && fit.lam > 0) ? fit.lam : null;
      const dbl = lam ? Math.LN2 / lam : null;
      return roHead() +
        '<div class="sinC"><i>δ</i>(<i>t</i>) = <b>' + sci(SIM.dSep) + '</b>' +
          '&ensp;<span class="dim">δ₀ = ' + sci(SIM.d0) + '</span></div>' +
        '<div class="cosC">λ ≈ <b>' + (lam ? fmt(lam) : '—') + '</b>&ensp;·&ensp;' +
          t({ zh: '倍增时间 ', en: 'doubling time ' }) + (dbl ? fmt(dbl) : '—') + '</div>' +
        '<div class="ambC">' + t({ zh: '近距离遭遇 ', en: 'close encounters ' }) + '<b>' + SIM.encounters +
          t({ zh: ' 次', en: '' }) + '</b>&ensp;·&ensp;' + t({ zh: '逃逸 ', en: 'escapes ' }) + '<b>' + SIM.escapes +
          t({ zh: ' 次', en: '' }) + '</b></div>' +
        roConserved() + roSoften();
    }
  }
};

/* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
const WAVE_LEN = 8;      // t 轴的世界长度（可视窗口）
const NEAR = 0.15;       // 近裁剪面

const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

const state = { running: true, t: 0, theta: 0 };  // 参数键与开关键由 ①② 自动注入
const samples = [];
let curTab = null;
const RELABEL = [];
const cams = {};
let cam = null;
let tween = null;
const lastView = {};
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ╔══════════════════════════════════════════════════════════╗
   ║  ③ 采样 —— 按你的工具需要扩展字段                           ║
   ║  原则：记录"当时的真实值"，参数中途改变时历史不重算            ║
   ╚══════════════════════════════════════════════════════════╝ */
let lastSampleT = 0;
function pushSample() {
  /* 本工具没有相位钟：显式把 ω 置 0，防引擎的 theta 积分把 undefined 累成 NaN。
     pushSample() 在 resetSim() 里先于第一帧被调用，所以这一句总是先生效。 */
  state.omega = 0;

  /* 回放态**不积分**：SIM 已经由 recHooks().restore() 按存档那一行写好，这里
     再跑一次 stepSim 就等于「先回到第 i 行、再往前推 0.02」——画面看上去毫无
     异样，画的却是第 i+1 行附近的另一段。模式判据一律走引擎的 recInfo()
     （规范 §11.7），不得自拼判据。 */
  const ri = recInfo();
  if (ri && ri.mode === 'replay') {
    lastSampleT = state.t;
  } else {
    /* 种子变了（用户动了预设 / 倾角 / 软化 / 扰动）= 显式重新播种：清空轨迹、
       从新初值重新积分。这是规范 §0.3 要求的「显式、用户发起」，而不是每帧
       偷偷重算历史；已经画出去的那段轨迹是当时的真实值，不会被追溯改写。 */
    if (SIM.sig !== seedSig()) {
      seedAll(null);
      SIM.seedCount = 1; SIM.lastReason = null;
      lastSampleT = state.t;
    }

    /* 推进积分器：引擎已把 dt 钳在 [0, 0.05]，这里再拆成固定步长 h 的子步 */
    const dt = clamp(state.t - lastSampleT, 0, 0.05);
    lastSampleT = state.t;
    if (dt > 0) stepSim(dt);
  }

  /* 记录**当时的真实值**：位置与 δ 都是这一刻积分器算出来的。 */
  samples.push({
    t: state.t,
    ts: SIM.tSim,
    a: [SIM.A.r[0].slice(), SIM.A.r[1].slice(), SIM.A.r[2].slice()],
    b: [SIM.B.r[0].slice(), SIM.B.r[1].slice(), SIM.B.r[2].slice()],
    d: SIM.dSep,
    enc: SIM.encFlag
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  ④ 演算记录与回放 —— 规范 §11                              ║
   ║  三体正是这条能力的适用对象：同一次运行不可复得。可录制的是   ║
   ║  「真实运动」与「三重投影」两个页签 —— 它们是**同一次积分的   ║
   ║  两种测量**（§6），所以钩子共用同一份 capture / restore。     ║
   ║  「图 8 编舞」「分道与逃逸」不可录制：它们同时跑 A、B 两套系统 ║
   ║  做对照实验，记的不是「这一次运行」，而是一场比较。            ║
   ╚══════════════════════════════════════════════════════════╝ */

/* JSON 表示不了 Infinity（会变成 null），用哨兵值来回换。
   两个方向必须严格互逆，否则 restore(capture()) 就不再对称（§8）。 */
const REC_INF = 1e30;
const finOut = v => (isFinite(v) ? v : REC_INF);
const finIn  = v => (v >= REC_INF ? Infinity : v);
/* lastReason 是字符串，扁平化后会混进一行数字里；编码成序号，
   索引即编码、REASON_CODE[i] 即解码，天然对称。 */
const REASON_CODE = [null, 'escape', 'timeout'];

/* 完整的积分器状态 —— r、v **和 a** 三者缺一不可。velocity-Verlet 把上一步
   末算出的 a 带进下一步开头（v ← v + (h/2)a 用的就是它），漏掉 a，restore
   之后的第一步就用错了力：画面完全正常，轨迹却已经悄悄偏离。除积分器外还要
   带上模拟时钟与 draw()/readout() 读到的每一个诊断量，否则回放的读数会停在
   进入回放那一刻的数字上。B 系统不在这里：它只服务于两个不可录制的对照页签。 */
function capture3B() {
  const A = SIM.A;
  return {
    et: state.t, lt: lastSampleT, ts: SIM.tSim,
    r: [A.r[0].slice(), A.r[1].slice(), A.r[2].slice()],
    v: [A.v[0].slice(), A.v[1].slice(), A.v[2].slice()],
    a: [A.a[0].slice(), A.a[1].slice(), A.a[2].slice()],
    E0: SIM.E0, L0: SIM.L0.slice(),
    dE: SIM.driftE, dEmax: SIM.driftEmax, dL: SIM.driftL, dLmax: SIM.driftLmax,
    sep: SIM.curSep.slice(),
    mSep: finOut(SIM.minSep),
    mXY: finOut(SIM.minProj.xy), mYZ: finOut(SIM.minProj.yz), mXZ: finOut(SIM.minProj.xz),
    enc: SIM.encounters, encArm: SIM.encArmed ? 1 : 0, encFlg: SIM.encFlag ? 1 : 0,
    pChk: SIM.projChecks, pViol: SIM.projViol,
    seedN: SIM.seedCount, reason: REASON_CODE.indexOf(SIM.lastReason),
    esc: SIM.escapes, tout: SIM.timeouts
  };
}
function restore3B(s) {
  const A = SIM.A;
  state.t = s.et; lastSampleT = s.lt; SIM.tSim = s.ts;
  for (let i = 0; i < 3; i++) for (let k = 0; k < 3; k++) {
    A.r[i][k] = s.r[i][k]; A.v[i][k] = s.v[i][k]; A.a[i][k] = s.a[i][k];
  }
  SIM.E0 = s.E0; SIM.L0 = s.L0.slice();
  SIM.driftE = s.dE; SIM.driftEmax = s.dEmax; SIM.driftL = s.dL; SIM.driftLmax = s.dLmax;
  SIM.curSep = s.sep.slice();
  SIM.minSep = finIn(s.mSep);
  SIM.minProj = { xy: finIn(s.mXY), yz: finIn(s.mYZ), xz: finIn(s.mXZ) };
  SIM.encounters = s.enc; SIM.encArmed = !!s.encArm; SIM.encFlag = !!s.encFlg;
  SIM.projChecks = s.pChk; SIM.projViol = s.pViol;
  SIM.seedCount = s.seedN; SIM.lastReason = REASON_CODE[s.reason];
  SIM.escapes = s.esc; SIM.timeouts = s.tout;
  /* sig 不进存档、而是就地重算：它是「滑杆是否被动过」的指纹，存进去反而会
     在回放里与实际滑杆值打架，触发 pushSample 的重新播种。重算之后
     restore(capture()) 依然逐位对称（滑杆没变，指纹自然不变）。 */
  SIM.sig = seedSig();
}

/* 回到种子重新起算。seed() 与 reseed() 都走它，两条路径才是同一条。 */
function startRound() {
  seedAll(null);
  SIM.seedCount = 1; SIM.lastReason = null;
  SIM.escapes = 0; SIM.timeouts = 0;
  SIM.projChecks = 0; SIM.projViol = 0;
  /* seedAll() 不刷新这个派生量（它平时由 stepSim 每帧算）。第 0 行必须是种子的
     函数，所以在这里补算一次 —— 漏了它，存档第 0 行带的是上一轮末尾的间距。 */
  SIM.curSep = sepOf(SIM.A);
  lastSampleT = state.t;
}

const RECORD = (function () {
  const hooks = {
    capture: capture3B,
    restore: restore3B,

    /* 注意：seed() 会**重新播种**。§11.3 要求「录一轮」——存档必须从种子的第
       0 步开始。否则 §11.2 的本机重算是从 tSim = 0 重跑，而存档是从半路截的，
       两条压根不在同一段时间上，比对必然失败（而且是看上去很像"混沌发散"的
       那种失败，比报错更误导人）。引擎的 recStartRecording() 先 reseed(seed())
       把本页签退回一轮起点，再 capture() 冻结字段结构并记第 0 行 —— 于是第 0 行
       恰好是这一轮的第 0 步。按下「● 记录」= 从头再来一次。

       t0 也是**积分参数**：本工具每步的 dt 由 state.t 的差分算出（见
       pushSample），起点不同，每一步的 dt 就差 1 ULP，n = ceil(dt/h) 偶尔差
       一整个子步，重算便不再是重算。 */
    seed() {
      /* 纯取值器：把本页签退回一轮起点是**引擎**在 recStartRecording() 里做的
         （`reseed(seed())`，§11.6）。录制与重算于是都从同一个 t0 起步。 */
      return {
        preset: Math.round(state.preset), tilt: state.tilt,
        soften: state.soften, d0: state.logD0,
        h: H_STEP, t0: state.t
      };
    },
    reseed(s) {
      setParam('preset', s.preset); setParam('tilt', s.tilt);
      setParam('soften', s.soften); setParam('logD0', s.d0);
      state.t = s.t0;
      startRound();
    },

    /* 只锁种子滑杆：它们一动就是另一次运行，画面与存档立刻脱节。
       zScale / trail 是纯显示量，回放期间必须留着——回放冻结的是演算，
       不是观察（§11.7），观众还得能重新取景。 */
    lock: ['preset', 'tilt', 'soften'],

    /* 一轮 = 一次播种到下一次播种。本工具在逃逸（R_ESC）或超时（T_MAX）时自动
       重新播种（§0.4），于是一份存档恰好是一个完整的故事：从初值到那一体被甩
       出去为止。引擎据此在轮次变化的那一帧停录。 */
    roundOf: () => SIM.seedCount
  };
  /* 两个页签 = 同一次积分的两种测量，共用同一份钩子对象。 */
  return { orbit: hooks, shadows: hooks };
})();

/* ================= 画布 ================= */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

function resize() {
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  FOCAL = 1.2 * Math.min(H, W * 1.1);
  bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  bgGrad.addColorStop(0, '#0c1526');
  bgGrad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);

/* ================= 基础数学 ================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mod2pi = a => { a %= TAU; if (a < 0) a += TAU; return a; };
const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
const fmt = (x, d = 2) => x.toFixed(d);
const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

/* ================= 轨道相机与投影 ================= */
function makeCam() {
  const cp = Math.cos(cam.el), sp = Math.sin(cam.el);
  const eye = [
    cam.tx + cam.dist * cp * Math.sin(cam.az),
    cam.ty + cam.dist * sp,
    cam.tz + cam.dist * cp * Math.cos(cam.az)
  ];
  const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  return { eye, f, r, u };
}
function camPt(C, p) {
  const d = sub(p, C.eye);
  return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
}
function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
function clipNear(a, b) {
  const t = (NEAR - a[2]) / (b[2] - a[2]);
  return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR];
}

/* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
function polyPath(C, pts) {
  if (pts.length < 2) return null;
  let head = null, tail = null, contin = false, prev = null;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const P = pts[i];
    if (P === null) { prev = null; contin = false; continue; }
    const cur = camPt(C, P);
    if (prev !== null) {
      let a = prev, b = cur;
      const av = a[2] >= NEAR, bv = b[2] >= NEAR;
      if (av || bv) {
        if (!av) a = clipNear(a, b);
        if (!bv) b = clipNear(b, a);
        const sA = scr(a), sB = scr(b);
        if (!contin) ctx.moveTo(sA[0], sA[1]);
        ctx.lineTo(sB[0], sB[1]);
        if (!head) head = sA;
        tail = sB;
        contin = bv;
      } else {
        contin = false;
      }
    }
    prev = cur;
  }
  return head ? [head, tail] : null;
}

function strokePoly(C, pts, o) {
  const ht = polyPath(C, pts);
  if (!ht) return;
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = o.width || 2;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.dash) ctx.setLineDash(o.dash);
  if (o.fade) {
    const h = ht[0], t = ht[1];
    if (Math.hypot(t[0]-h[0], t[1]-h[1]) < 2) {
      ctx.strokeStyle = o.fade[0];
    } else {
      const g = ctx.createLinearGradient(h[0], h[1], t[0], t[1]);
      g.addColorStop(0, o.fade[0]);
      g.addColorStop(1, o.fade[1]);
      ctx.strokeStyle = g;
    }
  } else {
    ctx.strokeStyle = o.color;
  }
  ctx.stroke();
  ctx.restore();
}
const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

function glowDot(s, r, core, mid) {
  const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
  g.addColorStop(0, core);
  g.addColorStop(0.35, mid);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}
function solidDot(C, p, r, color) {
  const s = proj(C, p);
  if (!s) return;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(s[0], s[1], r, 0, TAU);
  ctx.fill();
}

function label3(C, p, text, o) {
  const s = proj(C, p);
  if (!s) return;
  ctx.save();
  ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
  ctx.fillStyle = o.color || '#c4d2e6';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(3,6,12,.85)';
  ctx.shadowBlur = 4;
  ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
  ctx.restore();
}

function arrowAt(C, tip3, before3, color) {
  const t = proj(C, tip3), b = proj(C, before3);
  if (!t || !b) return;
  const a = Math.atan2(t[1]-b[1], t[0]-b[0]);
  const L = 9;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a-0.42), t[1]-L*Math.sin(a-0.42));
  ctx.moveTo(t[0], t[1]); ctx.lineTo(t[0]-L*Math.cos(a+0.42), t[1]-L*Math.sin(a+0.42));
  ctx.stroke();
  ctx.restore();
}

/* ================= 常用场景部件 ================= */
const AXIS = 'rgba(159,176,200,0.9)';
const AXIS_DIM = 'rgba(159,176,200,0.5)';

/* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[], tAxis:bool, v(秒刻度间距的波速) } */
function drawAxes(C, o) {
  const ex = o.ex, ey = o.ey;
  line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
  label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
  arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
  label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
  if (o.tAxis) {
    line3(C, [0, 0, 0], [0, 0, WAVE_LEN + 0.5], { width: 1.4, color: AXIS });
    arrowAt(C, [0, 0, WAVE_LEN + 0.5], [0, 0, WAVE_LEN + 0.3], AXIS);
    label3(C, [0, 0, WAVE_LEN + 0.9], 't', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    const v = o.v || 1;
    const every = v < 0.8 ? 2 : 1;
    for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
      line3(C, [0, -0.06, k*v], [0, 0.06, k*v], { width: 1.2, color: AXIS_DIM });
      if (k % every === 0) {
        label3(C, [0, -0.25, k*v], k + 's', { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }
  for (const k of (o.yTicks || [])) {
    for (const yv of [k, -k]) {
      line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
    }
  }
  for (const k of (o.xTicks || [])) {
    for (const xv of [k, -k]) {
      line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
      label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
    }
  }
}

/* z=0 平面方格网格（几何类场景） */
function drawGridXY(C, g, step) {
  const n = Math.round(g / step);
  for (let i = -n; i <= n; i++) {
    if (i === 0) continue;
    const u = i * step;
    line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
  }
}

/* y–t 时间平面网格（流式波形类场景）：o = { yMax, v } */
function drawTimeGrid(C, o) {
  const g = o.yMax, v = o.v;
  for (let i = Math.round(-g*2); i <= Math.round(g*2); i++) {
    if (i === 0) continue;
    line3(C, [0, i/2, 0], [0, i/2, WAVE_LEN], { width: 1, color: 'rgba(148,163,184,0.10)' });
  }
  for (let k = 1; k*v <= WAVE_LEN + 1e-6; k++) {
    line3(C, [0, -g, k*v], [0, g, k*v], { width: 1, color: 'rgba(148,163,184,0.07)' });
  }
}

/* 周期标尺（琥珀）：在平面 x=px、高度 yb 处，从 z=0 画到 z=T·v */
function drawPeriodBracket(C, Tsec, v, px, yb, text) {
  const zT = Tsec * v;
  if (zT > WAVE_LEN + 0.01) return;
  const amber = 'rgba(251,191,36,0.75)';
  line3(C, [px, yb, 0], [px, yb, zT], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, 0], [px, yb + 0.06, 0], { width: 1.2, color: amber });
  line3(C, [px, yb - 0.06, zT], [px, yb + 0.06, zT], { width: 1.2, color: amber });
  label3(C, [px, yb - 0.2, zT/2], text, { size: 10.5, color: 'rgba(251,191,36,.9)', align: 'center' });
}

/* 单位圆（半径 A，位于 z=0 平面，青色源几何） */
function drawCircle(C, A) {
  const cpts = [];
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU;
    cpts.push([A * Math.cos(a), A * Math.sin(a), 0]);
  }
  strokePoly(C, cpts, { width: 6, color: 'rgba(45,212,234,0.13)' });
  strokePoly(C, cpts, { width: 2, color: 'rgba(45,212,234,0.95)' });
  for (let q = 0; q < 4; q++) {
    const a = q * Math.PI / 2;
    line3(C, [A*0.95*Math.cos(a), A*0.95*Math.sin(a), 0],
             [A*1.06*Math.cos(a), A*1.06*Math.sin(a), 0],
             { width: 1, color: 'rgba(45,212,234,0.5)' });
  }
  solidDot(C, [0, 0, 0], 2.2, 'rgba(159,176,200,0.9)');
}

/* 角度弧 θ（琥珀度量注记） */
function drawAngleArc(C, th, A) {
  const thm = mod2pi(th);
  if (thm <= 0.03) return;
  const r0 = Math.max(0.14, Math.min(0.34, 0.5 * A));
  const n = Math.max(2, Math.ceil(thm / 0.06));
  const apts = [];
  for (let j = 0; j <= n; j++) {
    const a = thm * j / n;
    apts.push([r0 * Math.cos(a), r0 * Math.sin(a), 0]);
  }
  strokePoly(C, apts, { width: 1.6, color: 'rgba(251,191,36,0.9)' });
  label3(C, [(r0 + 0.15) * Math.cos(thm/2), (r0 + 0.15) * Math.sin(thm/2), 0], 'θ',
    { font: 'italic 13px ' + FONT_MATH, color: '#fbbf24', align: 'center' });
}

/* 读数区固定首两行 */
function readoutHead() {
  const th = state.theta;
  const deg = (mod2pi(th) * 180 / Math.PI).toFixed(0);
  const lap = fmt(th / TAU);
  return '<div>t = <b>' + fmt(state.t) + '</b> s&ensp;·&ensp;θ = ωt = <b>' + fmt(th) + '</b> rad</div>' +
         '<div class="dim">' + t({ zh: '≡ ' + deg + '°（第 ' + lap + ' 圈）', en: '≡ ' + deg + '° (turn ' + lap + ')' }) + '</div>';
}

/* ================= 主绘制与主循环 ================= */
function draw() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const C = makeCam();
  SCENES[curTab].draw(C);
}

/* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
   resetSim() 会清空它——用户主动重置后应当允许重新报。
   声明必须排在 resetSim() 之前：resetSim() 引用 frameErrSeen，声明留在它下方
   就只靠「启动序列恰好先求值到这里」躲开 TDZ，是结构性的隐患，而这份 starter
   会被复制给所有未来工具。 */
const frameErrSeen = Object.create(null);
function frameError(err) {
  const k = curTab + '|' + ((err && err.message) || err);
  if (frameErrSeen[k]) return;
  frameErrSeen[k] = 1;
  console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
}

function resetSim() {
  /* 清空帧级异常去重表：用户主动重置后应当允许重新报 */
  Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  state.t = 0;
  state.theta = 0;
  /* 驱动时钟的偏移一并归零：否则 t 回到 0 而偏移还在，驱动会停在一个任意
     相位上，「重置」就名不副实了 */
  Object.keys(driveOff).forEach(id => { driveOff[id] = 0; driveOffAt[id] = 0; });
  samples.length = 0;
  /* 本工具：重置 = 回到种子重新播种，播种计数与断言计数一并归零 */
  seedAll(null);
  SIM.seedCount = 1; SIM.lastReason = null;
  SIM.escapes = 0; SIM.timeouts = 0;
  SIM.projChecks = 0; SIM.projViol = 0;
  lastSampleT = 0;
  pushSample();
}

let lastTs = performance.now(), lastRO = 0;
function frame(ts) {
  try {
    const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
    lastTs = ts;

    if (tween) {
      const k = Math.min(1, (ts - tween.t0) / tween.dur);
      const e = ease(k);
      const f = tween.from, o = tween.to;
      cam.az = f.az + wrapPI(o.az - f.az) * e;
      cam.el = f.el + (o.el - f.el) * e;
      cam.dist = f.dist + (o.dist - f.dist) * e;
      cam.tx = f.tx + (o.tx - f.tx) * e;
      cam.ty = f.ty + (o.ty - f.ty) * e;
      cam.tz = f.tz + (o.tz - f.tz) * e;
      if (k >= 1) tween = null;
    }

    /* 回放冻结的是「演算」，不是「观察」：相机 tween 在上面已经走过了，
       视角、开关、绘制全部照常 —— 与「暂停只冻结模拟」同一条精神（§11.7）。 */
    if (recState.mode === 'replay') {
      recStep(dt);
    } else if (state.running) {
      if (recState.mode === 'recording') {
        /* 录制时把时间量子化成整数个 REC_DT。理由（§11.2）：物理若由变长的
           帧 dt 推进，轨迹就依赖于帧率抖动，「从同一种子重算」在**本机**都对
           不上，比对曲线也就失去意义。量子化之后轨迹是种子的确定性函数，
           本机重算能贴到舍入噪声，跨机器的差别才干净地归因于超越函数实现。 */
        recState.acc += dt;
        let guard = 0;
        while (recState.acc >= REC_DT && guard++ < 64) { recState.acc -= REC_DT; simAdvance(REC_DT); recPush(); }
      } else {
        simAdvance(dt);
      }
    }
    const windowSec = (SCENES[curTab].sampleWindow || (() => 10))();
    while (samples.length && samples[0].t < state.t - windowSec) samples.shift();

    draw();
    if (ts - lastRO > 120) { lastRO = ts; updateReadout(); refreshRecInfo(); }
  } catch (err) {
    frameError(err);
  } finally {
    /* rAF 放 finally 是「循环永不断」的机械保证：不依赖 catch 里写对什么。
       代价是画布可能停在最后一帧好内容而屏幕无提示——这是有意的取舍，
       「整个工具变砖」比「画面停在错误状态」更不可接受。 */
    requestAnimationFrame(frame);
  }
}

const roEl = document.getElementById('readout');
function updateReadout() { roEl.innerHTML = SCENES[curTab].readout(); }

/* ================= 场景作用域参数与时间驱动 ================= */
const paramWraps = {};   // key -> { wrap, input, val, p }
const autoPlay = {};     // tabId -> 是否自动播放
const driveMode = {};    // tabId -> 'loop' | 'pingpong'
const driveOff = {};     // tabId -> 驱动时钟相对引擎时钟的累计偏移（= 自动播放累计关停时长）
const driveOffAt = {};   // tabId -> 本次关停的起点（引擎时钟读数）

/* 驱动时钟：引擎时钟减去「自动播放关掉的那些时间」。关停期间它不走，
   所以重新打开时驱动量从原地续上，不跳变。求值仍是纯函数——只是把
   自变量从 state.t 换成这个校正过的时钟，不做增量积分：既不累积浮点
   漂移，录制器按固定 dt 离线重放也能复现同一串值（偏移在一次渲染内是常量）。
   已知语义：偏移只扣「自动播放关停」的时长，不扣「页签没被选中」的时长——
   离开某页签 10 秒再切回来，它的驱动量会跳到 10 秒后的位置。这与「暂停只冻结
   模拟、相机照走」是同一族约定（时钟是全局的，页签只是不同的观测口），
   如需改成每页签独立时钟，得连录制器的离线重放一起改，不要只改这里。 */
function driveClock(id) { return state.t - (driveOff[id] || 0); }

/* 驱动求值：驱动时钟（见 driveClock）的纯函数，不做增量积分 —— 不累积
   浮点漂移，暂停恢复不跳变，且录制器按固定 dt 推进 state.t 时可直接复用。 */
function driveValue(d, tt, mode) {
  const m = mode || d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
  const u = ((tt / d.period) % 1 + 1) % 1;              // 负时间也落在 [0,1)
  const s = (m === 'loop') ? u : (u < 0.5 ? 2 * u : 2 - 2 * u);
  return d.from + (d.to - d.from) * s;
}

/* 把当前场景的驱动量按引擎时钟写回 state。只动数据、不碰 DOM ——
   录制器的离线渲染也调它，那条路径上没有面板可同步（见规范 §D1）。 */
function applyDrive() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return;
  state[sc.drive.key] = driveValue(sc.drive, driveClock(curTab), driveMode[curTab]);
}

/* 供录制器判断无缝循环的吸附基准；无驱动或用户关掉自动播放时返回 null */
function driveInfo() {
  const sc = SCENES[curTab];
  if (!sc || !sc.drive || !autoPlay[curTab]) return null;
  return { key: sc.drive.key, period: sc.drive.period, mode: driveMode[curTab] };
}

const warnedNoInvMap = {};   // key -> 已就「有 map 没 invMap」告警过

/* 把驱动出的值反算回滑块刻度并回显。带 map 的参数必须提供 invMap，
   否则只能退回显示映射后的值（规范 §8 已把 invMap 列为硬约束）。 */
function syncParamSlider(key) {
  const e = paramWraps[key];
  if (!e) return;
  /* 本函数每帧都被调用，所以每个 key 只喊一次，别把控制台刷爆 */
  if (e.p.map && !e.p.invMap && !warnedNoInvMap[key]) {
    warnedNoInvMap[key] = true;
    console.warn('[math-viz] 参数 "' + key + '" 声明了 map 却没有 invMap：' +
                 '驱动值会被当作滑杆原始值写进量程，回显与 state 会错位（规范 §8）。');
  }
  const raw = (e.p.map && e.p.invMap) ? e.p.invMap(state[key]) : state[key];
  /* 先写进 input，再读回来显示：range 带 step，写进去的值会被吸附到刻度上。
     若直接显示 raw，读数与滑杆句柄就会对不上；更要命的是下一次 upd() 读的是
     吸附后的 input.value，会把这点差值永久写回 state —— 暂停时 frame() 不再跑
     applyDrive()，再也修不回来。upd() 的触发面已经收窄到「用户拖动这根滑杆」
     一条：语言切换只调 render()（见下方 relabel 注释），不再写 state。 */
  e.input.value = raw;
  e.val.textContent = e.p.fmt(parseFloat(e.input.value));
}

/* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。
   不复制 DOM：滑块值是跨页签共享的 state，复制会引入多份 DOM 的同步问题。 */
function syncParamVisibility() {
  const list = SCENES[curTab] && SCENES[curTab].params;
  Object.keys(paramWraps).forEach(k => {
    paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
  });
}

/* 开关自动播放的唯一入口：复选框与「拖滑块接管」都走这里，驱动时钟的记账
   才不会漏。关掉时记下停摆起点，打开时把停摆时长补进偏移量。 */
function setAutoPlayFor(id, on) {
  on = !!on;
  if (!!autoPlay[id] === on) return;            // 状态没变就别动时钟，避免重复记账
  if (on) driveOff[id] += state.t - driveOffAt[id];
  else driveOffAt[id] = state.t;
  autoPlay[id] = on;
  refreshDriveRow(id);
}

function setAutoPlay(on) { setAutoPlayFor(curTab, on); }

function refreshDriveRow(id) {
  const row = document.querySelector('.drive[data-tab="' + id + '"]');
  if (!row) return;
  row.querySelector('input').checked = !!autoPlay[id];
  row.querySelectorAll('[data-mode]').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === driveMode[id]);
  });
}

function buildDrive() {
  const host = document.getElementById('driveHost');
  Object.keys(SCENES).forEach(id => {
    const d = SCENES[id].drive;
    if (!d) return;
    autoPlay[id] = true;
    driveMode[id] = d.mode || (d.kind === 'circular' ? 'loop' : 'pingpong');
    driveOff[id] = 0; driveOffAt[id] = 0;      // 先置零，页签才不会把 undefined 读进算式
    const row = document.createElement('div');
    row.className = 'drive';
    row.dataset.tab = id;
    row.innerHTML = '<label class="tg"><input type="checkbox" checked><span class="autoL"></span></label>' +
      '<span class="dmode"><button class="btn" data-mode="pingpong"></button>' +
      '<button class="btn" data-mode="loop"></button></span>';
    row.querySelector('input').addEventListener('change', e => { setAutoPlayFor(id, e.target.checked); });
    row.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => { driveMode[id] = b.dataset.mode; refreshDriveRow(id); });
    });
    host.appendChild(row);
    const relabel = () => {
      row.querySelector('.autoL').textContent = t(UI.autoPlay);
      row.querySelector('[data-mode="pingpong"]').textContent = t(UI.pingpong);
      row.querySelector('[data-mode="loop"]').textContent = t(UI.loop);
    };
    RELABEL.push(relabel);
    relabel();
    refreshDriveRow(id);
  });
}

/* ================= UI 生成（由 ①② 声明驱动） ================= */
function buildParams() {
  const host = document.getElementById('paramsHost');
  PARAMS.forEach(p => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
    const input = document.createElement('input');
    input.type = 'range';
    input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
    const val = wrap.querySelector('.val');
    /* render 只回显滑杆当前刻度；upd 才是「用户动了滑杆」的语义（写 state）。
       两者分开，语言切换就不会顺手把读数写回 state —— 见下方 relabel 注释。 */
    const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
    const upd = () => {
      const raw = parseFloat(input.value);
      state[p.key] = p.map ? p.map(raw) : raw;
      render();
    };
    input.addEventListener('input', upd);
    wrap.appendChild(input);
    host.appendChild(wrap);
    paramWraps[p.key] = { wrap, input, val, p };
    /* 用户伸手拖被驱动的滑块 = 明确要接管，自动播放当场关闭，
       否则下一帧就会被驱动值覆盖回去。这是与「暂停只冻结模拟」一致的语义。 */
    input.addEventListener('input', () => {
      const d = SCENES[curTab] && SCENES[curTab].drive;
      if (d && d.key === p.key && autoPlay[curTab]) setAutoPlay(false);
    });
    upd();                       // 建面板时用默认刻度初始化 state
    /* 语言切换只重排文案（fmt 里可能带 t()），绝不能顺手调 upd() 把滑杆刻度
       写回 state：被 drive 驱动的参数，其 state 值比滑杆 step 精细得多，写回去
       等于把它永久量化一次；暂停时 frame() 不再跑 applyDrive()，再也修不回来。 */
    const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
    RELABEL.push(relabel);
    relabel();
  });
}

function buildToggles() {
  const host = document.getElementById('togglesHost');
  Object.keys(SCENES).forEach(id => {
    const grp = document.createElement('div');
    grp.className = 'toggles';
    grp.dataset.tab = id;
    SCENES[id].toggles.forEach(tg => {
      if (!(tg.key in state)) state[tg.key] = tg.checked;
      const lab = document.createElement('label');
      lab.className = 'tg';
      lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
        '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        state[tg.key] = cb.checked;
        document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
      });
      const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
      RELABEL.push(relabel);
      relabel();
      grp.appendChild(lab);
    });
    host.appendChild(grp);
  });
}

function buildViews() {
  const host = document.getElementById('viewsHost');
  Object.keys(SCENES).forEach(id => {
    const row = document.createElement('div');
    row.className = 'views';
    row.dataset.tab = id;
    const lab = document.createElement('span');
    lab.className = 'vlabel';
    row.appendChild(lab);
    const labRelabel = () => { lab.textContent = t(UI.views); };
    RELABEL.push(labRelabel);
    labRelabel();
    Object.keys(SCENES[id].views).forEach(name => {
      const b = document.createElement('button');
      b.className = 'btn vbtn';
      b.dataset.view = name;
      b.addEventListener('click', () => applyView(name));
      row.appendChild(b);
      const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
      RELABEL.push(relabel);
      relabel();
    });
    host.appendChild(row);
  });
}

function buildTabs() {
  const nav = document.getElementById('tabsNav');
  Object.keys(SCENES).forEach(id => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = id;
    b.addEventListener('click', () => switchTab(id));
    nav.appendChild(b);
    const relabel = () => { b.textContent = t(SCENES[id].label); };
    RELABEL.push(relabel);
    relabel();
  });
}

/* ================= 视角与页签 ================= */
/* 选择器必须限定在 .views 之内：.vbtn 只是个样式类，工具可能为了复用外观
   把它挂到别处的按钮上（如文本预设）。不限定的话 closest('.views') 会返回
   null，这里当场抛错，视角高亮从此再不更新。行为查询不能只认样式类。 */
function refreshViewButtons() {
  document.querySelectorAll('.views .vbtn').forEach(b => {
    const row = b.closest('.views');
    b.classList.toggle('active', row.dataset.tab === curTab && b.dataset.view === lastView[curTab]);
  });
}
function viewDist(d) { return (W < 820 || W < H) ? d * 1.4 : d; }
function applyView(name) {
  const vw = SCENES[curTab].views[name];
  if (!vw) return;
  if (vw.onSelect) vw.onSelect();   /* 可选联动：如自动开启该视角对应的曲线开关 */
  tween = {
    from: { az: cam.az, el: cam.el, dist: cam.dist, tx: cam.tx, ty: cam.ty, tz: cam.tz },
    to:   { az: vw.az, el: vw.el, dist: viewDist(vw.dist), tx: vw.tx || 0, ty: vw.ty || 0, tz: vw.tz || 0 },
    t0: performance.now(),
    dur: REDUCED ? 1 : 750
  };
  lastView[curTab] = name;
  refreshViewButtons();
}

const brandDesc = document.getElementById('brandDesc');
const tipsEl = document.getElementById('tips');
/* ══════════════ 演算记录与回放（规范 §11）══════════════
   自成一节，刻意排在所有 UI 构建器之后、switchTab 之前：它与「场景时间
   驱动」是两个子系统，嵌在后者中间会让 scripts/port_drive_engine.py 把
   它当成驱动引擎的一部分灌进另外 50 个工具（实测踩过）。 */

/* ══════════════ 演算记录与回放 · 引擎侧（规范 §11） ══════════════
   工具只提供 RECORD 里的六个钩子；序列化、下载/上传、回放时钟、校验、
   种子比对全在这里，各工具不得自己再写一份。 */
const REC_FORMAT = 'mathviz-run';
const REC_FORMAT_VERSION = 1;
const REC_DT = 0.02;         // 采样间隔（模拟秒）
const REC_MAX_ROWS = 20000;  // 行数上限；到顶停录并提示，绝不静默截断（§11.4）
const REC_PREC = 12;         // 数值有效位；比对基线要把这项舍入计入（§11.4）

const recState = {
  mode: 'live',              // 'live' | 'recording' | 'replay'
  rows: [], fields: null, shape: null,
  seed: null, tab: null, srcName: null,
  i: 0, playing: true, rate: 1, acc: 0, t0: 0,
  roundAt: null, note: null,
  verify: null               // { delta, reproduced } —— §11.2 的种子比对结论
};

function recHooks(tab) { return RECORD && RECORD[tab || curTab] || null; }

/* 唯一的只读判据访问器。工具的 draw()/readout() 要查模式一律走它，
   不得自拼判据 —— 理由同 §6「双语义迭代」：同一判据两种写法必然漂移。 */
function recInfo() {
  if (!recHooks()) return null;
  return {
    mode: recState.mode,
    rows: recState.rows.length,
    i: recState.i,
    playing: recState.playing,
    srcName: recState.srcName,
    verify: recState.verify,
    note: recState.note
  };
}

/* capture() 的对象 → 一行数字。展开顺序由第一次调用的结构冻结（§11.6）。 */
function recShapeOf(o) {
  const f = [];
  (function walk(v, path) {
    if (Array.isArray(v)) v.forEach((x, i) => walk(x, path + '[' + i + ']'));
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => walk(v[k], path ? path + '.' + k : k));
    else f.push(path);
  })(o, '');
  return f;
}
function recFlatten(o) {
  const out = [];
  (function walk(v) {
    if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') Object.keys(v).forEach(k => walk(v[k]));
    else out.push(typeof v === 'number' ? +v.toPrecision(REC_PREC) : v);
  })(o);
  return out;
}
function recUnflatten(row, tmpl) {
  let i = 0;
  return (function walk(v) {
    if (Array.isArray(v)) return v.map(walk);
    if (v && typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = walk(v[k]); }); return o; }
    return row[i++];
  })(tmpl);
}

/* 推进一步模拟。抽出来是为了让「录制时按 REC_DT 量子化」与「种子重算」
   走的是同一条代码路径 —— 两边若各写一份，重算就不再是重算了。 */
function simAdvance(d) {
  state.t += d;
  state.theta += state.omega * d;
  applyDrive();
  const dv = SCENES[curTab].drive;
  if (dv && autoPlay[curTab]) syncParamSlider(dv.key);
  pushSample();
}

function recStartRecording() {
  const h = recHooks(); if (!h) return;
  /* 起录前先把本页签重置到一轮的开头（§11.3）。这一步是引擎的责任，不是各
     工具在 seed() 里偷偷做 —— 否则 seed() 就成了一个会改状态的取值器，是留给
     下一个人的陷阱。 */
  if (h.reseed && h.seed) h.reseed(h.seed());
  const snap = h.capture();
  recState.mode = 'recording';
  recState.rows = []; recState.tab = curTab;
  recState.shape = snap; recState.fields = recShapeOf(snap);
  recState.seed = h.seed(); recState.roundAt = h.roundOf();
  recState.t0 = state.t;          // 录制起点的引擎时钟；回放要照它复原，见 recStep
  recState.note = null; recState.verify = null; recState.acc = 0;
  recPush();                                      // 立即记下第 0 行
  buildRecRow();
}
function recStopRecording(note) {
  if (recState.mode !== 'recording') return;
  recState.mode = 'live';
  recState.note = note || null;
  buildRecRow();
}

/* 记一行。**不做时间节流** —— 录制态下 frame() 已经把推进量子化成整数个
   REC_DT，一格一行即可。曾经写成「state.t - lastAt >= REC_DT」的节流：累加出
   的差常是 0.019999999999999997，于是约一半的行被悄悄丢掉，行号与步数错位，
   种子重算怎么算都对不上。量子化之后节流就是多余且有害的。 */
function recPush() {
  if (recState.mode !== 'recording') return;
  const h = recHooks(); if (!h) return;
  if (h.roundOf() !== recState.roundAt) { recStopRecording(UI.recRoundEnd); return; }  // §11.3 录一轮
  recState.rows.push(recFlatten(h.capture()));
  if (recState.rows.length >= REC_MAX_ROWS) recStopRecording(UI.recFull);
}

/* 回放推进：按 rate 走行号，restore 后照常 pushSample()，
   于是历史曲线、读数、绘制全部沿用实时那一套。 */
function recStep(dt) {
  const h = recHooks(); if (!h || !recState.rows.length) return;
  if (recState.playing) {
    recState.acc += dt * recState.rate;
    while (recState.acc >= REC_DT && recState.i < recState.rows.length - 1) { recState.acc -= REC_DT; recState.i++; }
    if (recState.i >= recState.rows.length - 1) { recState.acc = 0; recState.playing = false; buildRecRow(); }
  }
  h.restore(recUnflatten(recState.rows[recState.i], recState.shape));
  /* 从录制起点算起，不是从 0 —— 录制未必始于 t = 0，凭空归零会让任何把引擎
     时钟纳入 capture() 的工具在回放时对不上（实测三体差 6.0 s，正是起录前
     跑过的那段）。 */
  state.t = recState.t0 + recState.i * REC_DT;
  pushSample();
}

function recExitReplay() {
  if (recState.mode !== 'replay') return;
  recState.mode = 'live';
  recState.rows = []; recState.i = 0; recState.srcName = null; recState.verify = null; recState.note = null;
  resetSim();
  buildRecRow();
}

function recSave() {
  if (!recState.rows.length) return;
  const doc = {
    format: REC_FORMAT, formatVersion: REC_FORMAT_VERSION,
    tool: { id: TOOL.id, version: VERSION, engine: ENGINE_VERSION },
    tab: recState.tab, recordedAt: new Date().toISOString(),
    seed: recState.seed,
    trace: { dt: REC_DT, t0: recState.t0, fields: recState.fields, rows: recState.rows }
  };
  const blob = new Blob([JSON.stringify(doc)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = TOOL.id + '-' + recState.tab + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* 加载校验（§11.5）：五步，任一不过即明确拒绝，不做兼容性猜测。 */
function recValidate(doc) {
  if (!doc || doc.format !== REC_FORMAT) return { zh: '不是 MathViz 存档文件', en: 'Not a MathViz run file' };
  if (doc.formatVersion !== REC_FORMAT_VERSION)
    return { zh: '存档格式版本 ' + doc.formatVersion + ' 本工具不认识', en: 'Unknown archive format version ' + doc.formatVersion };
  if (!doc.tool || doc.tool.id !== TOOL.id)
    return { zh: '这份存档属于「' + ((doc.tool && doc.tool.id) || '?') + '」，不是本工具',
             en: 'This archive belongs to "' + ((doc.tool && doc.tool.id) || '?') + '", not this tool' };
  const h = recHooks(doc.tab);
  if (!h) return { zh: '存档的页签「' + doc.tab + '」在本工具中不可录制', en: 'Tab "' + doc.tab + '" is not recordable here' };
  const want = recShapeOf(h.capture());
  const got = (doc.trace && doc.trace.fields) || [];
  if (want.length !== got.length || want.some((k, i) => k !== got[i]))
    return { zh: '存档的字段与本版本不一致，拒绝载入（字段错位会画出看似合理实则错误的图）',
             en: 'Field set does not match this version; refusing to load (a mismatch would draw a plausible but wrong picture)' };
  if (!doc.trace.rows || !doc.trace.rows.length) return { zh: '存档里没有数据行', en: 'Archive contains no rows' };
  return null;
}

/* §11.2：用种子在本机重新积分，与记录的轨迹逐点比对。
   工具没给 reseed/seed 就跳过（返回 null），不阻塞回放。 */
function recVerify(doc) {
  const h = recHooks(doc.tab);
  if (!h || !h.reseed || !doc.seed) return null;
  /* 重算是一次「离线」推演：它会走 simAdvance，因而动到 state.t 与 samples。
     全部存下来在 finally 里还原 —— 比对不该在用户的现场留下任何痕迹。 */
  const keep = h.capture();
  const keepT = state.t, keepSamples = samples.slice();
  try {
    h.reseed(doc.seed);
    let worst = 0;
    const n = Math.min(doc.trace.rows.length, 400);
    for (let k = 0; k < n; k++) {
      const mine = recFlatten(h.capture()), theirs = doc.trace.rows[k];
      for (let j = 0; j < mine.length; j++) {
        const a = +mine[j], b = +theirs[j];
        if (isFinite(a) && isFinite(b)) worst = Math.max(worst, Math.abs(a - b));
      }
      /* 走与录制时完全相同的推进路径（同一个 simAdvance、同一个 REC_DT），
         否则「重算」就变成了另一条数值轨迹，本机也会报复现失败。 */
      if (k < n - 1) simAdvance(REC_DT);
    }
    /* 阈值要把 toPrecision(REC_PREC) 的舍入算进去（§11.4）：存档只留 12 位
       有效数字，本机完美复现时 δ 也就落在这个量级，而非 0。 */
    return { delta: worst, reproduced: worst < 1e-9 };
  } catch (e) {
    return null;
  } finally {
    h.restore(keep);
    state.t = keepT;
    samples.length = 0; keepSamples.forEach(s => samples.push(s));
  }
}

function recLoadDoc(doc, name) {
  const bad = recValidate(doc);
  if (bad) { recState.note = bad; buildRecRow(); return false; }
  const h = recHooks(doc.tab);
  if (doc.tab !== curTab) switchTab(doc.tab);
  recState.verify = recVerify(doc);
  recState.mode = 'replay';
  recState.rows = doc.trace.rows;
  recState.fields = doc.trace.fields;
  recState.shape = h.capture();
  recState.seed = doc.seed; recState.tab = doc.tab; recState.srcName = name;
  recState.t0 = +doc.trace.t0 || 0;
  recState.i = 0; recState.acc = 0; recState.playing = true; recState.rate = 1; recState.note = null;
  samples.length = 0;
  buildRecRow();
  return true;
}

/* 状态行的文案只有这一处出处。buildRecRow() 在状态切换时重建整行、
   refreshRecInfo() 每 120 ms 重写这一行，两边都读它。
   为什么必须只有一处：这一行正是这么坏掉过的 —— 当年 refreshRecInfo() 只认
   'recording'，文案又只长在 buildRecRow() 里，于是回放期间没有任何代码去改它，
   进度永远停在「1 / N」，只有按下暂停或整段播完（那两条路径会重建整行）才跳一下。
   画面在动、数字不动，看上去像回放卡住了，其实回放一直是对的。 */
function recInfoText() {
  const bits = [];
  if (recState.mode === 'replay') {
    bits.push(t(UI.recReplay) + ' ' + (recState.i + 1) + ' / ' + recState.rows.length);
    if (recState.srcName) bits.push(recState.srcName);
    if (recState.verify) {
      /* 尾巴「这不是 bug，见提示」只在**复现失败**时才有意义 —— 成功时贴上去
         会读成「复现了 —— 这不是 bug」，反而让人以为出了事。 */
      bits.push(t(recState.verify.reproduced ? UI.recVerifyOK : UI.recVerifyNo) +
                recState.verify.delta.toExponential(1) +
                (recState.verify.reproduced ? '）' : t(UI.recVerifyTail)));
    }
  } else {
    bits.push(recState.rows.length + t(UI.recRows));
  }
  if (recState.note) bits.push(t(recState.note));
  return bits.join(' · ');
}

/* 录制 / 回放行（§11）。只在当前页签声明了 RECORD 钩子时出现；
   整行每次重建 —— 它的状态机只有三态，重建比增量改 DOM 更不容易漂。 */
function buildRecRow() {
  const host = document.getElementById('recHost');
  if (!host) return;
  host.innerHTML = '';
  if (!recHooks()) return;

  const row = document.createElement('div');
  row.className = 'row recrow';
  const mk = (labObj, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'btn' + (cls ? ' ' + cls : '');
    b.textContent = t(labObj);
    b.addEventListener('click', fn);
    return b;
  };

  if (recState.mode === 'replay') {
    row.appendChild(mk(recState.playing ? UI.recPause : UI.recPlay,
      () => { recState.playing = !recState.playing; buildRecRow(); }));
    row.appendChild(mk(UI.recRewind, () => { recState.i = 0; recState.acc = 0; recState.playing = true; buildRecRow(); }));
    const rate = document.createElement('button');
    rate.className = 'btn';
    rate.textContent = recState.rate + '×';
    rate.addEventListener('click', () => {
      const steps = [0.25, 0.5, 1, 2, 4];
      recState.rate = steps[(steps.indexOf(recState.rate) + 1) % steps.length];
      buildRecRow();
    });
    row.appendChild(rate);
    row.appendChild(mk(UI.recExit, recExitReplay));
  } else if (recState.mode === 'recording') {
    row.appendChild(mk(UI.recStop, () => recStopRecording(null), 'wide'));
    row.appendChild(mk(UI.recSave, recSave));
  } else {
    row.appendChild(mk(UI.recRec, recStartRecording, 'wide'));
    row.appendChild(mk(UI.recSave, recSave));
    row.appendChild(mk(UI.recLoad, () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json,.json';
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          let doc = null;
          try { doc = JSON.parse(rd.result); }
          catch (e) { recState.note = { zh: '文件不是合法 JSON', en: 'File is not valid JSON' }; buildRecRow(); return; }
          recLoadDoc(doc, f.name);
        };
        rd.readAsText(f);
      });
      inp.click();
    }));
  }
  host.appendChild(row);

  /* 状态行：进度 / 行数 / 存档来源 / 种子比对结论 / 提示 */
  const info = document.createElement('div');
  info.className = 'recinfo';
  info.textContent = recInfoText();
  info.dataset.rec = '1';
  host.appendChild(info);

  refreshRecLocks();
}

/* 录制中的行数、回放中的进度都是每帧在变的，而 buildRecRow() 只在状态切换时
   跑 —— 只改这一行文本，别整行重建（重建会打断按钮的焦点与 hover）。由 frame()
   的读数节流一并调用，120 ms 一次足够。判据是「不是 live」而不是「是 recording」：
   回放同样每帧在走，漏掉它就等于让进度数字停在原地。 */
function refreshRecInfo() {
  if (recState.mode === 'live') return;
  const el = document.querySelector('#recHost .recinfo[data-rec]');
  if (!el) return;
  el.textContent = recInfoText();
}

/* 回放期间种子滑杆置灰 —— 改它们等于改种子，画面与数据会脱节（§11.7）。 */
function refreshRecLocks() {
  const h = recHooks();
  const lock = (recState.mode === 'replay' && h && h.lock) || [];
  Object.keys(paramWraps).forEach(k => {
    const e = paramWraps[k];
    if (!e) return;
    const on = lock.indexOf(k) >= 0;
    e.input.disabled = on;
    e.wrap.style.opacity = on ? '0.45' : '';
  });
}

function switchTab(id) {
  if (id === curTab) return;
  curTab = id;
  tween = null;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.toggles[data-tab], .views[data-tab], .drive[data-tab]').forEach(el => {
    el.style.display = el.dataset.tab === id ? '' : 'none';
  });
  cam = cams[id];
  brandDesc.textContent = t(SCENES[id].brand);
  tipsEl.textContent = t(SCENES[id].tips);
  /* 换页签 = 换实验：正在录的那一轮不再对应画面，停录并保留已录数据；
     回放态则整个退出 —— 存档是绑定页签的（§11.4 的 tab 字段）。 */
  if (recState.mode === 'recording' && recState.tab !== id) recStopRecording(null);
  if (recState.mode === 'replay' && recState.tab !== id) recExitReplay();
  buildRecRow();
  syncParamVisibility();
  refreshViewButtons();
  updateReadout();
}

/* ================= 播放 / 重置 / 折叠 ================= */
const btnPlay = document.getElementById('btnPlay');
function togglePlay() {
  state.running = !state.running;
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
}
btnPlay.addEventListener('click', togglePlay);
document.getElementById('btnReset').addEventListener('click', resetSim);

const panel = document.getElementById('panel');
const btnFold = document.getElementById('btnFold');
btnFold.addEventListener('click', () => {
  const c = panel.classList.toggle('collapsed');
  btnFold.textContent = c ? '+' : '−';
});
if (window.innerWidth < 760) {
  panel.classList.add('collapsed');
  btnFold.textContent = '+';
}

/* ================= 语言切换 ================= */
function applyLang() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(TOOL.title);
  document.querySelector('.brand h1').textContent = t(TOOL.h1);
  document.getElementById('panelTitle').textContent = t(UI.panelTitle);
  document.querySelector('.hint').textContent = t(UI.hint);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  btnPlay.textContent = state.running ? t(UI.pause) : t(UI.resume);
  document.getElementById('btnReset').textContent = t(UI.reset);
  RELABEL.forEach(f => f());
  buildRecRow();               // 录制行的文案是建行时取的 t()，整行重建即跟随语言
  brandDesc.textContent = t(SCENES[curTab].brand);
  tipsEl.textContent = t(SCENES[curTab].tips);
  updateReadout();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', l);
    history.replaceState(null, '', u);
  } catch (e) {}
  applyLang();
}
document.getElementById('btnLang').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
document.getElementById('verBadge').textContent = 'v' + VERSION;

/* ================= 交互：旋转 / 平移 / 缩放 ================= */
const pointers = new Map();
let pinch = null;

function pan(dx, dy) {
  const C = makeCam();
  const s = cam.dist / FOCAL;
  cam.tx = clamp(cam.tx - C.r[0]*dx*s + C.u[0]*dy*s, -6, 6);
  cam.ty = clamp(cam.ty - C.r[1]*dx*s + C.u[1]*dy*s, -5, 5);
  cam.tz = clamp(cam.tz - C.r[2]*dx*s + C.u[2]*dy*s, -3, 11);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
  tween = null;
  lastView[curTab] = null;
  refreshViewButtons();
  if (pointers.size === 2) {
    const vs = Array.from(pointers.values());
    pinch = {
      gap: Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y),
      cx: (vs[0].x + vs[1].x) / 2,
      cy: (vs[0].y + vs[1].y) / 2
    };
  }
  canvas.classList.add('dragging');
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX;
  p.y = e.clientY;
  if (pointers.size === 1) {
    const panMode = e.shiftKey || (e.buttons & 2) || p.btn === 2 || p.btn === 1;
    if (panMode) {
      pan(dx, dy);
    } else {
      cam.az -= dx * 0.0055;
      cam.el = clamp(cam.el + dy * 0.0055, -1.45, 1.53);
    }
  } else if (pointers.size === 2 && pinch) {
    const vs = Array.from(pointers.values());
    const gap = Math.hypot(vs[0].x - vs[1].x, vs[0].y - vs[1].y);
    const cx = (vs[0].x + vs[1].x) / 2, cy = (vs[0].y + vs[1].y) / 2;
    if (gap > 1) cam.dist = clamp(cam.dist * pinch.gap / gap, 4.5, 60);
    pan(cx - pinch.cx, cy - pinch.cy);
    pinch = { gap: gap, cx: cx, cy: cy };
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tween = null;
  cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 4.5, 60);
}, { passive: false });

canvas.addEventListener('dblclick', () => applyView(Object.keys(SCENES[curTab].views)[0]));

window.addEventListener('keydown', e => {
  const tg = e.target.tagName;
  if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT' || tg === 'BUTTON') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'r' || e.key === 'R') resetSim();
  else if (e.key === 't' || e.key === 'T') {
    const keys = Object.keys(SCENES);
    switchTab(keys[(keys.indexOf(curTab) + 1) % keys.length]);
  }
  else if (e.key >= '1' && e.key <= '9') {
    const names = Object.keys(SCENES[curTab].views);
    const i = +e.key - 1;
    if (i < names.length) applyView(names[i]);
  }
});

/* ================= 启动 ================= */
resize();
buildTabs();
buildParams();
buildDrive();
buildToggles();
buildViews();
Object.keys(SCENES).forEach(id => {
  const first = Object.keys(SCENES[id].views)[0];
  const v = SCENES[id].views[first];
  cams[id] = { az: v.az, el: v.el, dist: viewDist(v.dist), tx: v.tx || 0, ty: v.ty || 0, tz: v.tz || 0 };
  lastView[id] = first;
});
switchTab(Object.keys(SCENES)[0]);
applyLang();
resetSim();
requestAnimationFrame(frame);
</script>
</body>
