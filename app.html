<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
  --sb-w:268px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn);
  -webkit-font-smoothing:antialiased}

.shell{display:flex;height:100vh;height:100dvh;width:100%}

/* ---- 侧边栏 ---- */
.sidebar{flex:0 0 var(--sb-w);width:var(--sb-w);height:100%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#0a1120,#070b14);border-right:1px solid var(--panel-line);
  transition:margin-left .22s cubic-bezier(.4,0,.2,1);z-index:20}
.shell.hid .sidebar{margin-left:calc(-1 * var(--sb-w))}

.sb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:16px 14px 12px;border-bottom:1px solid var(--panel-line)}
.brand{display:block;text-decoration:none;color:inherit}
.brand .eyebrow{font-size:9.5px;letter-spacing:.2em;color:rgba(159,176,200,.62);text-transform:uppercase}
.brand .name{margin-top:3px;font-family:var(--font-math);font-weight:600;font-size:17px;
  letter-spacing:.04em;color:#eef3fa}
.brand:hover .name{color:#bfefff}

.iconbtn{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(13,20,36,.6);border:1px solid var(--panel-line);border-radius:8px;
  color:rgba(159,176,200,.85);font-family:var(--font-mono);font-size:12px;line-height:1;cursor:pointer;
  transition:border-color .15s,color .15s}
.iconbtn:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.iconbtn:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}

.sb-search{padding:11px 12px 8px}
.sb-search input{width:100%;background:rgba(5,7,13,.66);border:1px solid var(--panel-line);
  border-radius:9px;padding:7px 10px;color:var(--ui-bright);font-family:var(--font-cn);font-size:12.5px;
  outline:none;transition:border-color .15s}
.sb-search input::placeholder{color:rgba(159,176,200,.45)}
.sb-search input:focus{border-color:rgba(45,212,234,.5)}

.sb-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 14px;
  scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.28) transparent}
.sb-list::-webkit-scrollbar{width:8px}
.sb-list::-webkit-scrollbar-thumb{background:rgba(148,163,184,.24);border-radius:8px}

.grp{margin:13px 6px 5px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(155,232,247,.62)}
.item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;margin:1px 0;border:1px solid transparent;border-radius:9px;
  background:transparent;color:rgba(226,232,240,.82);font-family:var(--font-cn);font-size:12.5px;
  line-height:1.35;cursor:pointer;transition:background .13s,border-color .13s,color .13s}
.item:hover{background:rgba(45,212,234,.07);border-color:rgba(148,163,184,.2);color:#eaf1fb}
.item:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:-2px}
.item .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c,var(--ui-slate));
  box-shadow:0 0 8px var(--c,var(--ui-slate))}
.item .tx{flex:1;min-width:0}
.item.on{background:rgba(45,212,234,.12);border-color:rgba(45,212,234,.42);color:#fff}
.item.on .tx{font-weight:600}
.item.home{margin-bottom:2px}
.item.home .dot{background:transparent;border:1.5px dashed rgba(159,176,200,.55);box-shadow:none;
  width:9px;height:9px}
.empty{padding:14px 10px;font-size:12px;color:rgba(159,176,200,.55)}

.sb-foot{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--panel-line);font-size:11.5px}
.sb-foot .sp{flex:1}
.sb-foot a,.sb-foot button{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;
  color:rgba(159,176,200,.8);background:rgba(13,20,36,.6);border:1px solid var(--panel-line);
  border-radius:7px;padding:5px 9px;cursor:pointer;text-decoration:none;
  transition:border-color .15s,color .15s}
.sb-foot a:hover,.sb-foot button:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.sb-foot a:focus-visible,.sb-foot button:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}

/* ---- 主内容区 ---- */
.stage{position:relative;flex:1;min-width:0;height:100%;background:var(--bg-deep)}
#frame{display:block;width:100%;height:100%;border:0;background:var(--bg-deep)}

/* 侧栏收起时贴在左缘的唤出把手：所有工具在这个位置都是空白 */
.edge{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:30;
  width:20px;height:74px;display:none;align-items:center;justify-content:center;
  background:rgba(13,20,36,.86);border:1px solid var(--panel-line);border-left:0;
  border-radius:0 10px 10px 0;color:rgba(159,176,200,.9);font-family:var(--font-mono);font-size:11px;
  cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:background .15s,color .15s,border-color .15s}
.edge:hover{background:rgba(20,30,52,.94);color:#bfefff;border-color:rgba(45,212,234,.5)}
.edge:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}
.shell.hid .edge{display:flex}

.scrim{position:fixed;inset:0;z-index:15;background:rgba(3,6,12,.55);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:none}

/* ---- 移动端：侧栏变成覆盖式抽屉 ---- */
@media (max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;box-shadow:0 0 44px rgba(0,0,0,.6)}
  .shell.hid .sidebar{margin-left:calc(-1 * var(--sb-w) - 8px)}
  .shell:not(.hid) .scrim{display:block}
  .edge{height:64px}
}

/* ===== 录制器 ===== */
.rec-btn{position:absolute;right:16px;bottom:16px;z-index:40;
  display:flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(10,16,28,.82);backdrop-filter:blur(8px);
  color:#dbe6f5;font-size:13px;letter-spacing:.02em}

.rec-btn[disabled]{opacity:.4;cursor:not-allowed}
.rec-btn .dot{width:9px;height:9px;border-radius:50%;background:#ff5a8a}
.rec-panel{position:absolute;right:16px;bottom:62px;z-index:41;width:274px;
  padding:14px;border-radius:14px;display:none;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(8,13,24,.94);backdrop-filter:blur(12px);
  color:#dbe6f5;font-size:12.5px}
.rec-panel.on{display:block}
.rec-panel h4{margin:0 0 10px;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:#7d8ca6;font-weight:600}
.rec-row{margin-bottom:11px}
.rec-row > label{display:block;margin-bottom:5px;color:#93a3bd;font-size:11.5px}
.rec-seg{display:flex;gap:5px}
.rec-seg button{flex:1;padding:6px 0;border-radius:7px;cursor:pointer;font-size:11.5px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);color:#93a3bd}
.rec-seg button.on{border-color:#ff5a8a;color:#ffd7e3;background:rgba(255,90,138,.14)}
.rec-chk{display:flex;align-items:center;gap:7px;color:#93a3bd;cursor:pointer}
.rec-go{width:100%;padding:9px 0;margin-top:3px;border-radius:9px;cursor:pointer;
  border:1px solid rgba(255,90,138,.5);background:rgba(255,90,138,.16);color:#ffd7e3}
.rec-go[disabled]{opacity:.45;cursor:not-allowed}
.rec-note{margin-top:9px;color:#6f7f99;font-size:11px;line-height:1.5}
.rec-eff{color:#ffd7e3;font-weight:600}
.rec-bar{height:3px;margin-top:9px;border-radius:2px;background:rgba(255,255,255,.09);overflow:hidden}
.rec-bar i{display:block;height:100%;width:0;background:#ff5a8a;transition:width .1s linear}
/* 录制期间：iframe 脱离 flex 布局，按目标画幅定尺寸再缩放预览 */
.stage.rec-live{overflow:hidden;position:relative}
.stage.rec-live > iframe{position:absolute;left:50%;top:50%;
  transform-origin:50% 50%;border:0}
</style>
</head>

/* ================= i18n（与工具页共用同一个 localStorage 键） ================= */
var LANG_KEY = 'mathviz-lang';
var NAV_KEY = 'mathviz-nav';
function resolveLang(){
  try{
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'zh' || q === 'en') return q;
    var s = localStorage.getItem(LANG_KEY);
    if (s === 'zh' || s === 'en') return s;
  }catch(e){}
  return (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
}
function t(s){ return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.zh) : s; }

/* ================= 状态 ================= */

var syncing = false;   // 防止 iframe 回同步与主动导航互相打架

function byId(id){ for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i]; return null; }
function fileOf(id){ var d = byId(id); return d ? d.file : null; }

/* 由 iframe 的真实地址反查工具（用户在画廊内点击卡片时也能同步高亮） */
function idFromPath(path){
  if (!path) return null;
  var f = path.split('/').pop();
  for (var i = 0; i < TOOLS.length; i++){
    if (TOOLS[i].file.split('/').pop() === f) return TOOLS[i].id;
  }
  return null;
}

/* ================= 侧栏渲染 ================= */
function renderNav(){
  var kw = (qBox.value || '').trim().toLowerCase();
  var html = '';

  var homeOn = curId === null ? ' on' : '';
  html += '<button class="item home' + homeOn + '" data-id="">' +
          '<span class="dot"></span><span class="tx">' + t(L.home) + '</span></button>';

  var hits = 0;
  for (var c = 0; c < CATS.length; c++){
    var cat = CATS[c];
    var items = [];
    for (var i = 0; i < TOOLS.length; i++){
      var d = TOOLS[i];
      if (d.cat !== cat.key) continue;
      if (kw){
        var hay = (t(d.title) + ' ' + d.title.zh + ' ' + d.title.en + ' ' +
                   d.kicker.zh + ' ' + d.kicker.en + ' ' + d.id).toLowerCase();
        if (hay.indexOf(kw) < 0) continue;
      }
      items.push(d);
    }
    if (!items.length) continue;
    hits += items.length;
    html += '<div class="grp">' + esc(t(cat.label)) + '</div>';
    for (var j = 0; j < items.length; j++){
      var it = items[j];
      html += '<button class="item' + (it.id === curId ? ' on' : '') + '" data-id="' + esc(it.id) + '"' +
              ' style="--c:var(--trace-' + esc(it.accent) + ')" title="' + esc(t(it.title)) + '">' +
              '<span class="dot"></span><span class="tx">' + esc(t(it.title)) + '</span></button>';
    }
  }
  if (!hits && kw) html += '<div class="empty">' + t(L.none) + '</div>';
  navList.innerHTML = html;
}

function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderChrome(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('brandName').textContent = t(L.brand);
  qBox.placeholder = t(L.search);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  document.getElementById('btnAlone').title = t(L.alone);
  document.getElementById('btnHide').title = t(L.hide) + ' (Ctrl+B)';
  document.getElementById('btnShow').title = t(L.show) + ' (Ctrl+B)';
  document.getElementById('brandLink').href = 'index.html?lang=' + LANG;
  var d = curId ? byId(curId) : null;
  document.title = d ? t(d.title) + ' · MathViz' : t(L.title);
  document.getElementById('btnAlone').href = d ? d.file + '?lang=' + LANG : 'index.html?lang=' + LANG;
  /* 录制器的文案也归 renderChrome 管：本仓库的约定是语言开关即时生效，不许等到刷新 */
  if (window.REC && REC.UI && REC.UI.render){
    var rbt = document.getElementById('recBtnTxt');
    if (rbt) rbt.textContent = REC.t(REC.UI.L.rec);
    REC.UI.render();
  }
}

/* ================= 导航 ================= */
function srcFor(id){
  var f = id ? fileOf(id) : 'index.html';
  return f ? f + '?lang=' + LANG : 'index.html?lang=' + LANG;
}

/* 换页面用 location.replace 而不是赋值 frame.src：
   赋值 src 会往「联合会话历史」里塞一条 iframe 记录，和外壳自己的 pushState
   交错在一起，后退键就会出现「地址与侧栏都退了、画面还停在上一个工具」的错位。
   replace 不产生历史记录，历史就完全由外壳掌握。跨源（file://）时回落到 src。 */
function setFrame(url){
  try{
    if (frame.contentWindow){ frame.contentWindow.location.replace(url); return; }
  }catch(e){}
  frame.src = url;
}

function go(id, push){
  REC.abort();
  if (id && !byId(id)) id = null;
  curId = id || null;
  syncing = true;
  setFrame(srcFor(curId));
  renderNav();
  renderChrome();
  if (push !== false){
    try{
      var u = new URL(location.href);
      if (curId) u.searchParams.set('tool', curId); else u.searchParams.delete('tool');
      u.searchParams.set('lang', LANG);
      history.pushState({ tool: curId }, '', u);
    }catch(e){}
  }
  if (window.innerWidth <= 760) setSidebar(false);
}

/* ================= 侧栏显隐 ================= */
function setSidebar(open, remember){
  shell.classList.toggle('hid', !open);
  if (remember !== false){
    try{ localStorage.setItem(NAV_KEY, open ? 'open' : 'hid'); }catch(e){}
  }
}
function toggleSidebar(){ setSidebar(shell.classList.contains('hid')); }

/* ================= 事件 ================= */
navList.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.item') : null;
  if (!b) return;
  go(b.getAttribute('data-id') || null);
});
qBox.addEventListener('input', renderNav);
qBox.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ qBox.value = ''; renderNav(); qBox.blur(); }
  e.stopPropagation();
});
document.getElementById('btnHide').addEventListener('click', function(){ setSidebar(false); });
document.getElementById('btnShow').addEventListener('click', function(){ setSidebar(true); });
document.getElementById('scrim').addEventListener('click', function(){ setSidebar(false); });
document.getElementById('btnLang').addEventListener('click', function(){
  /* 切语言会重载 iframe，工具实例整个换掉：录制现场必须先丢弃，
     否则离线循环会继续驱动一个已被卸载的文档，收尾时还会把旧快照写进新实例。 */
  REC.abort();
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  try{
    var u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(history.state, '', u);
  }catch(e){}
  syncing = true;
  setFrame(srcFor(curId));   // 让工具页按新语言重载
  renderNav(); renderChrome();
});

window.addEventListener('popstate', function(e){
  var id = null;
  try{ id = new URLSearchParams(location.search).get('tool'); }catch(e2){}
  go(id, false);
});

/* 快捷键：Ctrl/Cmd+B 或 [ —— 都避开工具自己的 空格 / 1–9 / T / R */
function isTyping(el){
  if (!el) return false;
  var tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}
function hotkey(e){
  if (isTyping(e.target)) return;
  var mod = e.ctrlKey || e.metaKey;
  if ((mod && (e.key === 'b' || e.key === 'B')) || (!mod && !e.altKey && e.key === '[')){
    e.preventDefault();
    toggleSidebar();
  }
}
document.addEventListener('keydown', hotkey);

/* iframe 载入后：把快捷键也挂到工具文档上（同源才行），并回同步高亮与地址栏 */
frame.addEventListener('load', function(){
  REC.Bridge.invalidate();
  var doc = null;
  try{ doc = frame.contentDocument; }catch(e){}
  if (doc){
    try{ doc.addEventListener('keydown', hotkey); }catch(e){}
    try{
      var id = idFromPath(frame.contentWindow.location.pathname);
      if (!syncing && id !== curId){          // 用户在画廊里点了卡片
        curId = id; renderNav(); renderChrome();
        try{
          var u = new URL(location.href);
          if (curId) u.searchParams.set('tool', curId); else u.searchParams.delete('tool');
          history.replaceState({ tool: curId }, '', u);

  if (h.resize) { try{ h.resize(); }catch(e){} }
  if (h.draw)   { try{ h.draw();   }catch(e){} }

  var o = { w: w, h: hh, mode: (cfg.visual === 'overlay' ? 'overlay' : 'clean'),
            canvas: null, _prev: prev, _stage: stage };
  if (o.mode === 'overlay'){
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = hh;
    o.canvas = cv; o.ctx = cv.getContext('2d');
  } else {
    o.canvas = h.canvas;
  }
  _compActive = o;
  return o;
};

/* 每帧调用。clean 模式什么都不用做（captureStream 直接盯着工具 canvas）。 */
REC.Compositor.frame = function(o, h, info){
  if (!o || o.mode !== 'overlay') return;
  var c = o.ctx, w = o.w, hh = o.h;
  c.clearRect(0, 0, w, hh);
  c.drawImage(h.canvas, 0, 0, w, hh);

  var vert = hh > w;
  var pad = Math.round(w * 0.033);
  var base = Math.round(w * 0.0125);           /* 字号基准，随画幅缩放 */
  var sc = h.SCENES && h.curTab ? h.SCENES[h.curTab] : null;
  var d = byId(h.toolId);

  /* 标题：左上（竖屏时下移，给顶部留呼吸） */
  var ty = vert ? Math.round(hh * 0.055) : pad;
  if (d){
    c.save();
    c.textBaseline = 'top';
    c.fillStyle = '#7d8ca6';
    c.font = '600 ' + Math.round(base * 0.82) + 'px ui-sans-serif, -apple-system, "PingFang SC", sans-serif';
    c.fillText(String(REC.t(d.kicker) || '').toUpperCase(), pad, ty);
    c.fillStyle = '#dbe6f5';
    c.font = '600 ' + Math.round(base * 1.5) + 'px ui-sans-serif, -apple-system, "PingFang SC", sans-serif';
    c.fillText(REC.t(d.title) || '', pad, ty + Math.round(base * 1.25));
    c.restore();
  }

  /* 图例：左下。色点取 toggle 自己声明的 color —— 工具就是用这个色值画曲线的，
     原则 3 要求同一条曲线在图例点与曲线体上完全同色；只有工具没声明时才回落到 REC.COLORS。 */
  if (sc && sc.toggles){
    c.save();
    c.textBaseline = 'middle';
    var y = hh - pad, n = 0;
    for (var k = 0; k < sc.toggles.length; k++){
      var tg = sc.toggles[k];
      if (!h.state[tg.key]) continue;                     /* 只画已开启的曲线 */
      var col = tg.color || REC.COLORS[n % REC.COLORS.length];
      c.fillStyle = col;
      c.beginPath(); c.arc(pad + base * 0.4, y, base * 0.4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#93a3bd';
      _drawRichLabel(c, REC.t(tg.label) || tg.key, pad + base * 1.3, y, base);
      y -= base * 1.9; n++;
    }
    c.restore();
  }

  /* 读数：右上。工具的 readout() 返回 HTML，这里剥标签取纯文本，逐行画。 */
  if (sc && sc.readout){
    var txt = '';
    try{ txt = String(sc.readout()); }catch(e){ txt = ''; }
    var lines = _decodeReadoutLines(txt);
    c.save();
    c.textAlign = 'right';
    c.textBaseline = 'top';
    c.font = 'italic ' + Math.round(base * 1.05) + 'px Georgia, "Songti SC", serif';
    c.fillStyle = '#dbe6f5';
    var ry = ty;
    for (var i = 0; i < lines.length; i++){
      var ln = lines[i].replace(/\s+/g, ' ').trim();
      if (!ln) continue;
      c.fillText(ln, w - pad, ry);
      ry += base * 1.6;
      if (ry > hh * 0.5) break;                          /* 读数再长也不许压到画面中部 */
    }
    c.restore();
  }
};

REC.Compositor.end = function(o){
  if (!o) return;
  frame.style.width      = o._prev.fw;
  frame.style.height     = o._prev.fh;
  frame.style.transform  = o._prev.ftr;
  frame.style.marginLeft = o._prev.fml;
  frame.style.marginTop  = o._prev.fmt;
  o._stage.classList.remove('rec-live');
  if (_compActive === o) _compActive = null;    /* 解除重入锁，允许下一场录制 */
  var h = REC.Bridge.get();
  if (h){ try{ h.resize(); h.draw(); }catch(e){} }
};
/* ===== /REC:COMPOSITOR ===== */

/* ===== REC:SOURCE ===== */
REC.Source = {};
REC.Source.__test = function(){
  var r = { pass: [], fail: [] };
  function ok(n, c){ if (c) r.pass.push(n); else r.fail.push(n); }
  var h = REC.Bridge.get();
  if (!h){ r.fail.push('需要先载入一个工具（Bridge 不可用）'); return r; }
  ok('offline 是函数', typeof REC.Source.offline === 'function');
  ok('realtime 是函数', typeof REC.Source.realtime === 'function');
  ok('snapDuration 是函数', typeof REC.Source.snapDuration === 'function');
  /* 无缝循环吸附：omega=1 时周期 2π≈6.283，8s 应吸附到 2 个周期 12.566…
     取「不超过原时长的最大整数倍，至少 1 个周期」 */
  ok('时长吸附到周期整数倍', Math.abs(REC.Source.snapDuration(8, 1) - 6.283185307179586) < 1e-6);
  ok('吸附不足一个周期时给一个整周期', Math.abs(REC.Source.snapDuration(3, 1) - 6.283185307179586) < 1e-6);
  ok('omega 为 0 时原样返回', REC.Source.snapDuration(8, 0) === 8);
  /* 工具没声明 omega 时必须按 0 处理，否则离线推进会整段 NaN */
  ok('omegaOf 对缺失 omega 给 0', REC.Source.omegaOf({ state: { theta: 0 } }) === 0);
  ok('omegaOf 对 NaN omega 给 0', REC.Source.omegaOf({ state: { omega: NaN } }) === 0);
  ok('缺失 omega 时时长不被吸附', REC.Source.snapDuration(8, REC.Source.omegaOf({ state: {} })) === 8);

  /* 端到端：跑一段 0.5s 的离线渲染，帧数必须精确，且现场被还原 */
  var snap = REC.Bridge.snapshot();
  var o = REC.Compositor.begin(h, { visual: 'clean', aspect: '1:1' });
  var s = REC.Source.offline(h, o, { duration: 0.5, loop: false, orbit: false, viewTo: '' }, null);
  ok('offline 返回 stream', !!(s && s.stream && s.stream.getVideoTracks().length === 1));
  s.done.then(function(res){
    REC.Compositor.end(o);
    REC.Bridge.restore(snap);
    REC.Source.__lastProbe = {
      frames: res.frames,
      framesOk: res.frames === Math.round(0.5 * REC.FPS),
      restored: Math.abs(h.state.theta - snap.state.theta) < 1e-9,
      runningRestored: h.state.running === snap.state.running
    };
  });
  r.pass.push('端到端离线渲染已发起（结果见 REC.Source.__lastProbe）');
  return r;
};

/* 工具的 state 未必声明 omega —— 例如 outputs/cartesian-polar-coordinate-3d.html 的
   state 只有 {running, t, theta, kPhase}。缺省一律按 0 处理，否则 theta += undefined*dt
   会从第一帧起变成 NaN，录出来是一段静默的空白视频，全程不报错。 */
REC.Source.omegaOf = function(h){
  var w = h && h.state ? h.state.omega : 0;
  return (typeof w === 'number' && isFinite(w)) ? w : 0;
};

/* 无缝循环：把时长吸到动画周期 2π/ω 的整数倍。ω=0（静态场景）时不吸。 */
REC.Source.snapDuration = function(sec, omega){
  if (!omega) return sec;
  var period = 2 * Math.PI / Math.abs(omega);
  var n = Math.floor(sec / period);
  if (n < 1) n = 1;
  return n * period;
};

REC.Source.offline = function(h, o, cfg, onProgress){
  var total = Math.max(1, Math.round(cfg.duration * REC.FPS));
  var dt = 1 / REC.FPS;
  var stream = o.canvas.captureStream(0);         /* 0 = 只接受手动 requestFrame */
  var track = stream.getVideoTracks()[0];
  var cancelled = false;
  var omega = REC.Source.omegaOf(h);              /* 工具没有 omega 时按 0，见 omegaOf 注释 */

  /* 接管驱动：停掉工具自己的积分，本函数按固定步长推进 */
  var wasRunning = h.state.running;
  h.state.running = false;

  /* 运镜的起止镜位。引擎的 tween 走真实时钟，离线模式必须自己插值。 */
  var cam0 = { az: h.cam.az, el: h.cam.el, dist: h.cam.dist,
               tx: h.cam.tx, ty: h.cam.ty, tz: h.cam.tz };
  var camTo = null;
  if (cfg.viewTo && h.SCENES && h.curTab){
    var sc = h.SCENES[h.curTab];
    var v = sc && sc.views && sc.views[cfg.viewTo];
    if (v) camTo = v.cam || v;
  }
  function ease(k){ return k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2; }

  var done = new Promise(function(resolve){
    var i = 0;
    function step(){
      if (cancelled){ h.state.running = wasRunning; resolve({ frames: i, cancelled: true }); return; }
      if (i >= total){ h.state.running = wasRunning; resolve({ frames: i, cancelled: false }); return; }
      var k = i / total;

      /* 1. 推进仿真（固定步长，与真实帧率无关） */
      h.state.t += dt;
      h.state.theta += omega * dt;
      if (h.pushSample) h.pushSample();

      /* 2. 运镜 */
      if (cfg.orbit) h.cam.az = cam0.az + 2 * Math.PI * k;
      if (camTo){
        var e = ease(Math.min(1, k / 0.6));       /* 前 60% 完成过渡，留时间看结果 */
        var f;
        for (f in cam0) if (typeof camTo[f] === 'number') h.cam[f] = cam0[f] + (camTo[f] - cam0[f]) * e;
      }

      /* 3. 绘制 + 合成 + 交帧 */
      h.draw();
      REC.Compositor.frame(o, h, { i: i, total: total, t: i * dt });
      if (track.requestFrame) track.requestFrame();
      else if (stream.requestFrame) stream.requestFrame();

      i++;
      if (onProgress) onProgress(i / total);
      requestAnimationFrame(step);               /* 让出主线程，编码器才有机会消费 */
    }
    requestAnimationFrame(step);
  });

  return { stream: stream, done: done, cancel: function(){ cancelled = true; } };
};

/* 实时录制：被动跟随工具自己的 rAF，能录下手动拖拽旋转、切 tab、拖滑块的全过程 */
REC.Source.realtime = function(h, o, cfg){
  var stream = o.canvas.captureStream(REC.FPS);
  var timer = null;
  if (o.mode === 'overlay'){
    /* overlay 模式的离屏画布不会自己更新，得自己按帧刷 */
    var i = 0;
    var tick = function(){
      REC.Compositor.frame(o, h, { i: i, total: 0, t: i / REC.FPS });
      i++;
      timer = requestAnimationFrame(tick);
    };
    timer = requestAnimationFrame(tick);
  }
  return {
    stream: stream,
    stop: function(){ if (timer) cancelAnimationFrame(timer); timer = null; }
  };
};

function _seg(key, opts){
  var s = '<div class="rec-seg">';
  for (var i = 0; i < opts.length; i++){
    var on = REC.CFG[key] === opts[i][0] ? ' on' : '';
    s += '<button class="' + on.replace(/^ /, '') + '" data-k="' + key + '" data-v="' + opts[i][0] + '">'
       + REC.t(REC.UI.L[opts[i][1]]) + '</button>';
  }
  return s + '</div>';
}

/* 无缝循环要求整数个动画周期，所以时长会被吸附；不足一个周期时向上补成完整周期
   —— 在 ω=0.5 的工具上，设 8s 实际录出 12.57s。面板必须当场把这个有效时长说出来，
   否则用户要等录完看文件才发现对不上。只有「离线定长」才谈得上时长，其余模式原样返回。 */
REC.UI.effDur = function(){
  var req = REC.CFG.duration;
  if (!REC.CFG.loop || REC.CFG.drive !== 'offline' || REC.CFG.visual === 'screen') return req;
  if (!REC.Bridge.get || !REC.Source.omegaOf || !REC.Source.snapDuration) return req;
  var h = REC.Bridge.get();
  if (!h) return req;
  return REC.Source.snapDuration(req, REC.Source.omegaOf(h));
};

REC.UI.durText = function(){
  var req = REC.CFG.duration, eff = REC.UI.effDur();
  if (Math.abs(eff - req) < 0.05) return req + 's';
  return req + 's → <span class="rec-eff">' + _fmtSecs(eff) + 's</span>';
};

REC.UI.render = function(){
  var pan = document.getElementById('recPanel');
  if (!pan) return;
  var mime = REC.Encoder.pickMime ? REC.Encoder.pickMime() : null;
  var okBridge = REC.Bridge.available ? REC.Bridge.available() : false;
  var note = '';
  var px = REC.sizeOf(REC.CFG.aspect, REC.CFG.res);
  if (!mime) note = REC.t(REC.UI.L.noMime);
  else if (!okBridge && REC.CFG.visual !== 'screen') note = REC.t(REC.UI.L.noBridge);
  else {
    /* 「整页」录的是标签页本身，尺寸由窗口决定，报画幅/分辨率会骗人 */
    note = REC.t(REC.UI.L.willBe) + '.' + mime.ext;
    if (REC.CFG.visual !== 'screen' && px){
      note += '　' + px[0] + '×' + px[1];
      if (REC.CFG.res === '4K') note += REC.t(REC.UI.L.heavy);
    }
    /* 时长被无缝循环改过就解释一句，别让用户录完对着文件猜 */
    var effD = REC.UI.effDur();
    if (effD - REC.CFG.duration > 0.05)      note += '<br>' + REC.t(REC.UI.L.loopUp);
    else if (REC.CFG.duration - effD > 0.05) note += '<br>' + REC.t(REC.UI.L.loopDown);
  }

  pan.innerHTML =
    '<h4>' + REC.t(REC.UI.L.title) + '</h4>' +
    '<div class="rec-row"><label>' + REC.t(REC.UI.L.visual) + '</label>' +
      _seg('visual', [['clean','clean'],['overlay','overlay'],['screen','screen']]) + '</div>' +
    '<div class="rec-row"><label>' + REC.t(REC.UI.L.aspect) + '</label>' +
      _seg('aspect', [['16:9','aspect'],['9:16','aspect'],['1:1','aspect']]) + '</div>' +
    '<div class="rec-row"><label>' + REC.t(REC.UI.L.res) + '</label>' +
      _seg('res', [['1080p','res'],['2K','res'],['4K','res']]) + '</div>' +
    '<div class="rec-row"><label>' + REC.t(REC.UI.L.drive) + '</label>' +
      _seg('drive', [['offline','offline'],['realtime','realtime']]) + '</div>' +
    '<div class="rec-row"><label>' + REC.t(REC.UI.L.dur) + ' · <span id="recDurVal">' + REC.UI.durText() + '</span></label>' +
      '<input id="recDur" type="range" min="3" max="30" step="1" value="' + REC.CFG.duration + '" style="width:100%"></div>' +
    '<div class="rec-row"><label class="rec-chk"><input type="checkbox" data-k="loop"' + (REC.CFG.loop ? ' checked' : '') + '> ' + REC.t(REC.UI.L.loop) + '</label></div>' +
    '<div class="rec-row"><label class="rec-chk"><input type="checkbox" data-k="orbit"' + (REC.CFG.orbit ? ' checked' : '') + '> ' + REC.t(REC.UI.L.orbit) + '</label></div>' +
    '<button class="rec-go" id="recGo"' + (mime ? '' : ' disabled') + '>' + REC.t(REC.UI.L.go) + '</button>' +
    '<div class="rec-bar"><i id="recBar"></i></div>' +
    '<div class="rec-note" id="recNote">' + note + '</div>';

  /* 画幅与分辨率按钮的文案就是它的值本身，_seg 的字典取不到，这里直接回填 */
  var segs = pan.querySelectorAll('[data-k="aspect"],[data-k="res"]');
  for (var i = 0; i < segs.length; i++) segs[i].textContent = segs[i].getAttribute('data-v');
};

REC.UI.mount = function(){
  var btn = document.getElementById('recBtn');
  var pan = document.getElementById('recPanel');
  if (!btn || !pan || btn.__mounted) { if (btn && btn.__mounted) REC.UI.render(); return; }
  btn.__mounted = true;
  document.getElementById('recBtnTxt').textContent = REC.t(REC.UI.L.rec);
  REC.UI.render();

  btn.addEventListener('click', function(){
    pan.classList.toggle('on');
    if (pan.classList.contains('on')) REC.UI.render();
  });

  /* 事件委托：面板每次 render 都会重建内容，绑在容器上才不会丢 */
  pan.addEventListener('click', function(e){
    var el = e.target;
    var k = el.getAttribute && el.getAttribute('data-k');
    if (k && el.tagName === 'BUTTON'){
      REC.CFG[k] = el.getAttribute('data-v');
      el.className = 'on';   /* 先给被点的按钮本身盖上选中态：render() 会整体重建面板，
                                 旧节点脱离 DOM 后不会再被样式选中，靠这行保证它自身可见/可测 */
      REC.UI.render();
      return;
    }
    if (el.id === 'recGo') REC.UI.run();
  });
  pan.addEventListener('change', function(e){
    var el = e.target, k = el.getAttribute && el.getAttribute('data-k');
    if (k && el.type === 'checkbox'){
      REC.CFG[k] = el.checked;
      /* 循环开关直接决定有效时长，勾完必须重画，否则显示和实际脱节 */
      if (k === 'loop') REC.UI.render();
    }
  });
  pan.addEventListener('input', function(e){
    if (e.target.id === 'recDur'){
      REC.CFG.duration = +e.target.value;
      /* 无缝循环会把时长吸附到周期整数倍，拖滑块时就得跟着变，不能只回显原值 */
      document.getElementById('recDurVal').innerHTML = REC.UI.durText();
    }
  });
};

REC.busy = null;      /* 录制中的现场；同时充当会话身份，见 _finish 的校验 */

/* 面板回到「可以开始录制」的样子 */
function _recReset(){
  var go = document.getElementById('recGo');
  if (go){ go.disabled = false; go.textContent = REC.t(REC.UI.L.go); }
  var bar = document.getElementById('recBar');
  if (bar) bar.style.width = '0';
}

function _stopStream(st){
  if (!st || !st.getTracks) return;
  var tr = st.getTracks();
  for (var i = 0; i < tr.length; i++){ try{ tr[i].stop(); }catch(e){} }
}

/* 文件名里的时长：写真实录到的秒数，不是滑块上的设定值 */
function _fmtSecs(s){
  var v = Math.round(s * 10) / 10;
  return (v === Math.round(v)) ? String(Math.round(v)) : String(v);
}

/* 「中断」：把录制丢掉。切工具、切语言、关页面走这条路——产物一律不要。 */
REC.abort = function(){
  var b = REC.busy;
  if (!b) return;
  REC.busy = null;          /* 先摘掉身份，在途的 done/ended 回调就会被 _finish 挡在门外 */
  try{ if (b.src && b.src.cancel) b.src.cancel(); }catch(e){}
  try{ if (b.src && b.src.stop)   b.src.stop();   }catch(e){}
  /* 停编码器只为释放它和它持有的轨道，Blob 直接丢弃 */
  try{ if (b.ses) REC.Encoder.stop(b.ses)['catch'](function(){}); }catch(e){}
  try{ if (b.stream) _stopStream(b.stream); }catch(e){}
  try{ if (b.ctxObj) REC.Compositor.end(b.ctxObj); }catch(e){}
  try{ if (b.snap) REC.Bridge.restore(b.snap); }catch(e){}
  _recReset();
};

/* 「停止」：用户在面板上主动收尾。与 abort 是两种意图——这条路必须出片并下载。
   实时 / 整页录制没有预定时长，全靠它结束。 */
REC.stop = function(b){
  b = b || REC.busy;
  if (!b || REC.busy !== b) return;
  /* 还停在选窗口对话框上（没有编码器可停），只能按丢弃处理 */
  if (b.pending || !b.ses){ REC.abort(); return; }
  _finish(b);
};

REC.UI.run = function(){
  if (REC.busy){ REC.stop(); return; }
  var mime = REC.Encoder.pickMime();
  var note = document.getElementById('recNote');
  if (!mime){ if (note) note.textContent = REC.t(REC.UI.L.noMime); return; }

  var go = document.getElementById('recGo');
  var bar = document.getElementById('recBar');
  var cfg = REC.CFG;

  /* 模式 3：屏幕录制，不经 Bridge / Compositor，因此 file:// 下也能用 */
  if (cfg.visual === 'screen'){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
      if (note) note.textContent = REC.t(REC.UI.L.noMime);
      return;
    }
    /* 身份要在 await 选窗口对话框「之前」就立起来：否则对话框开着时再点一次按钮，
       会再发一次 getDisplayMedia，第一条流没人引用也没人 stop，浏览器就一直共享屏幕。 */
    var bs = { pending: true, ses: null, src: null, ctxObj: null, snap: null, stream: null,
               mime: mime, dur: null, aspect: cfg.aspect, res: null, toolId: curId, startedAt: Date.now() };
    REC.busy = bs;
    go.textContent = REC.t(REC.UI.L.stop);
    navigator.mediaDevices.getDisplayMedia({ video: { frameRate: REC.FPS }, audio: false })
      .then(function(st){
        /* 等对话框期间已被中断（切工具 / 又点了一次停止）：这条流成了孤儿，必须立刻关掉 */
        if (REC.busy !== bs){ _stopStream(st); return; }
        bs.pending = false;
        bs.stream = st;
        bs.startedAt = Date.now();
        /* 整页模式的尺寸由用户选的窗口决定，不由面板决定 —— 码率照实际拿到的分辨率算 */
        var tset = st.getVideoTracks()[0].getSettings ? st.getVideoTracks()[0].getSettings() : null;
        var sw = (tset && tset.width) || 1920, sh = (tset && tset.height) || 1080;
        bs.res = sh + 'p';
        bs.ses = REC.Encoder.start(st, mime.mime, REC.bitrateFor(sw, sh));
        /* 用户在浏览器的共享条上点「停止共享」也要收尾 */
        st.getVideoTracks()[0].addEventListener('ended', function(){ REC.stop(bs); });
      })['catch'](function(){
        if (REC.busy === bs){ REC.busy = null; _recReset(); }
        if (note) note.textContent = REC.t(REC.UI.L.noMime);
      });
    return;
  }

  var h = REC.Bridge.get();
  if (!h){ if (note) note.textContent = REC.t(REC.UI.L.noBridge); return; }

  var snap = REC.Bridge.snapshot();
  var ctxObj = REC.Compositor.begin(h, cfg);
  if (!ctxObj){ if (note) note.textContent = REC.t(REC.UI.L.noBridge); return; }

  var dur = cfg.duration;
  if (cfg.loop) dur = REC.Source.snapDuration(dur, REC.Source.omegaOf(h));

  /* 画幅、时长、工具 id 都在开录这一刻定格：收尾时再去读 REC.CFG / curId，
     用户中途改了设置或换了工具，文件名就会撒谎。 */
  if (cfg.drive === 'realtime'){
    var src = REC.Source.realtime(h, ctxObj, cfg);
    var ses = REC.Encoder.start(src.stream, mime.mime, REC.bitrateFor(ctxObj.w, ctxObj.h));
    /* 实时录制没有预定时长，dur 留空，收尾时按实际经过的墙钟时间算 */
    REC.busy = { pending: false, ses: ses, src: src, ctxObj: ctxObj, snap: snap, stream: src.stream,
                 mime: mime, dur: null, aspect: cfg.aspect, res: cfg.res, toolId: curId, startedAt: Date.now() };
    go.textContent = REC.t(REC.UI.L.stop);
    return;                       /* 由用户再点一次「停止」触发 REC.stop → _finish */
  }

  var src2 = REC.Source.offline(h, ctxObj, {
    duration: dur, loop: cfg.loop, orbit: cfg.orbit, viewTo: cfg.viewTo
  }, function(k){ if (bar) bar.style.width = Math.round(k * 100) + '%'; });

  var ses2 = REC.Encoder.start(src2.stream, mime.mime, REC.bitrateFor(ctxObj.w, ctxObj.h));
  var b2 = { pending: false, ses: ses2, src: src2, ctxObj: ctxObj, snap: snap, stream: src2.stream,
             mime: mime, dur: dur, aspect: cfg.aspect, res: cfg.res, toolId: curId, startedAt: Date.now() };
  REC.busy = b2;
  go.disabled = true;
  src2.done.then(function(res){
    /* done 在「跑满」和「被取消」两种情况下都会 resolve。被取消时现场已由 abort()
       收拾干净，这里再走 _finish 就会下载一段截断的半成品。 */
    if (res && res.cancelled) return;
    _finish(b2);
  });
};

function _finish(b){
  /* 身份校验：这场录制已经不是当前现场了（被中断，或已被别的会话接管）就什么都不做。
     abort() 会先把 REC.busy 摘掉，在途的回调全靠这一行挡住。 */
  if (!b || REC.busy !== b || !b.ses) return;
  REC.busy = null;
  /* 先停驱动，免得收尾期间还在往流里塞帧 */
  try{ if (b.src && b.src.stop)   b.src.stop();   }catch(e){}
  try{ if (b.src && b.src.cancel) b.src.cancel(); }catch(e){}
  REC.Encoder.stop(b.ses).then(function(blob){
    if (!blob || !blob.size) return;               /* 0 字节就别塞给用户了 */
    var secs = (b.dur != null) ? b.dur : (Date.now() - b.startedAt) / 1000;
    var name = (b.toolId || 'mathviz') + '-' + String(b.aspect).replace(':', 'x')
             + (b.res ? '-' + b.res : '')
             + '-' + _fmtSecs(secs) + 's.' + b.mime.ext;
    REC.Encoder.download(blob, name);
  })['catch'](function(){})['finally'](function(){
    if (b.ctxObj) REC.Compositor.end(b.ctxObj);
    if (b.snap)   REC.Bridge.restore(b.snap);
    _recReset();
  });
}

REC.UI.__test = function(){
  var r = { pass: [], fail: [] };
  function ok(n, c){ if (c) r.pass.push(n); else r.fail.push(n); }
  REC.UI.mount();
  var btn = document.getElementById('recBtn');
  var pan = document.getElementById('recPanel');
  ok('录制按钮存在', !!btn);
  ok('面板已渲染出内容', !!pan && pan.innerHTML.length > 0);
  ok('面板默认收起', pan.className.indexOf('on') < 0);
  btn.click();
  ok('点按钮展开面板', pan.className.indexOf('on') >= 0);
  /* 画幅分段器：点 9:16 应写回 CFG */
  var seg = pan.querySelector('[data-k="aspect"][data-v="9:16"]');
  ok('存在 9:16 选项', !!seg);
  if (seg){ seg.click(); ok('点击写回 CFG.aspect', REC.CFG.aspect === '9:16');
            ok('选中态加了 on', seg.className.indexOf('on') >= 0); }
  /* 分辨率分段器：三档都要在，点 4K 应写回 CFG 并让说明里出现真实像素尺寸 */
  var r1080 = pan.querySelector('[data-k="res"][data-v="1080p"]');
  var r2k   = pan.querySelector('[data-k="res"][data-v="2K"]');
  var r4k   = pan.querySelector('[data-k="res"][data-v="4K"]');
  ok('分辨率三档齐全', !!r1080 && !!r2k && !!r4k);
  ok('分辨率按钮文案是值本身', !!r4k && r4k.textContent === '4K');
  if (r4k){
    r4k.click();
    ok('点击写回 CFG.res', REC.CFG.res === '4K');
    var n4 = pan.querySelector('#recNote');
    /* 此刻 aspect 已被上面点成 9:16，竖屏 4K 应是 2160×3840 */
    ok('说明里报出真实像素尺寸', !!n4 && n4.textContent.indexOf('2160×3840') >= 0);
    ok('4K 给出编码较重的提示', !!n4 && n4.textContent.indexOf('4K') >= 0);
  }
  /* 有效时长：无缝循环把时长吸附到周期整数倍，面板必须显示吸附后的值。
     用真实踩过的场景做用例 —— ω=0.5 的工具周期 12.57s，设 8s 会被补成 12.57s。 */
  var _realGet = REC.Bridge.get, _cfg0 = { d: REC.CFG.duration, l: REC.CFG.loop, dr: REC.CFG.drive };
  REC.Bridge.get = function(){ return { state: { omega: 0.5 } }; };
  REC.CFG.duration = 8; REC.CFG.loop = true; REC.CFG.drive = 'offline';
  ok('ω=0.5 设 8s 有效时长补到 12.57s', Math.abs(REC.UI.effDur() - 12.566370614359172) < 1e-6);
  ok('有效时长与设定不同时标出箭头', REC.UI.durText().indexOf('→') >= 0);
  REC.UI.render();
  var nEff = pan.querySelector('#recNote');
  ok('说明里解释了为何被拉长', !!nEff && nEff.textContent.indexOf(REC.t(REC.UI.L.loopUp)) >= 0);
  REC.CFG.loop = false;
  ok('关掉无缝循环后有效时长回到设定值', REC.UI.effDur() === 8);
  ok('无差异时不标箭头', REC.UI.durText().indexOf('→') < 0);
  REC.CFG.loop = true; REC.CFG.drive = 'realtime';
  ok('实时录制不吸附时长', REC.UI.effDur() === 8);
  REC.Bridge.get = _realGet;
  REC.CFG.duration = _cfg0.d; REC.CFG.loop = _cfg0.l; REC.CFG.drive = _cfg0.dr;
  REC.UI.render();

  var v = pan.querySelector('[data-k="visual"][data-v="clean"]');
  if (v){ v.click(); ok('点击写回 CFG.visual', REC.CFG.visual === 'clean'); }
  var dur = pan.querySelector('#recDur');
  ok('存在时长滑块', !!dur);
  if (dur){ ok('时长下限 3', +dur.min === 3); ok('时长上限 30', +dur.max === 30); }
  ok('存在开始按钮', !!pan.querySelector('#recGo'));
  ok('存在格式说明', pan.innerHTML.indexOf('mp4') >= 0 || pan.innerHTML.indexOf('webm') >= 0);
  REC.CFG.aspect = '16:9'; REC.CFG.visual = 'overlay'; REC.CFG.res = '1080p';   /* 复位，别污染后续测试 */
  btn.click();
  ok('再点按钮收起面板', pan.className.indexOf('on') < 0);
  ok('run 已接线（不再抛 not wired）', (function(){
    try{ REC.UI.run.toString().indexOf('not wired'); }catch(e){ return false; }
    return REC.UI.run.toString().indexOf('not wired') < 0;
  })());
  ok('abort 是函数', typeof REC.abort === 'function');
  /* 「停止」与「中断」是两条独立的路：面板上的停止必须出片，abort 才是丢弃 */
  ok('stop 是函数', typeof REC.stop === 'function');
  ok('stop 与 abort 不是同一个函数', REC.stop !== REC.abort);
  ok('run 空转时点停止不抛错', (function(){
    try{ REC.stop(); return true; }catch(e){ return false; }
  })());
  return r;
};
/* ===== /REC:UI ===== */

/* ================= 启动 ================= */
function boot(){
  renderNav(); renderChrome();
  var id = null;
  try{ id = new URLSearchParams(location.search).get('tool'); }catch(e){}
  if (id && !byId(id)) id = null;
  curId = id;
  syncing = true;
  setFrame(srcFor(curId));
  renderNav(); renderChrome();
  try{ history.replaceState({ tool: curId }, '', location.href); }catch(e){}

  var pref = null;
  try{ pref = localStorage.getItem(NAV_KEY); }catch(e){}
  var wide = window.innerWidth > 760;
  setSidebar(pref ? pref === 'open' : wide, false);
  if (REC.UI.mount) REC.UI.mount();
}

window.addEventListener('beforeunload', function(){ REC.abort(); });

/* 工具清单优先取 tools.json（有服务器时永远最新）；取不到就用内嵌副本 */
(function(){
  var done = false;
  function start(){ if (!done){ done = true; boot(); } }
  try{
    fetch('tools.json', { cache: 'no-cache' }).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(j){
      if (j && j.tools && j.tools.length){
        TOOLS = j.tools.map(function(d){
          return { id: d.id, file: d.file, cat: d.category, accent: d.accent, title: d.title, kicker: d.kicker };
        });
      }
      start();
    })['catch'](start);
  }catch(e){ start(); }
  setTimeout(start, 1200);   // file:// 或离线时的兜底
})();
