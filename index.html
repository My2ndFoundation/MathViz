<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="数学可视化 · MathViz —— 交互式数学概念可视化工具集,把抽象概念变成可旋转的三维场景。">
<title>数学可视化 · MathViz</title>
<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---- 背景荧光屏 ---- */
#bg{position:fixed;inset:0;z-index:0;display:block}

/* ---- 内容层 ---- */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;
  padding:clamp(48px,9vh,120px) clamp(20px,5vw,48px) 56px}

/* ---- 品牌 ---- */
.eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.24em;color:rgba(159,176,200,.72);
  text-transform:uppercase;margin-bottom:0}
.lang{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:rgba(159,176,200,.8);
  background:rgba(13,20,36,.6);border:1px solid var(--panel-line);border-radius:7px;
  padding:5px 11px;cursor:pointer;transition:border-color .15s,color .15s}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}
h1{margin:0;font-family:var(--font-math);font-weight:600;
  font-size:clamp(34px,6vw,56px);letter-spacing:.06em;color:#eef3fa;
  text-shadow:0 2px 28px rgba(45,212,234,.22)}
.lead{margin:18px 0 0;max-width:52ch;font-size:clamp(14px,2.2vw,16px);
  line-height:1.7;color:rgba(159,176,200,.9)}
.hintline{margin:14px 0 0;font-family:var(--font-mono);font-size:12px;
  letter-spacing:.02em;color:rgba(159,176,200,.55)}

/* ---- 分节眉题 ---- */
.sect{display:flex;align-items:baseline;gap:12px;margin:52px 0 18px}
.sect .lbl{font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(159,176,200,.7)}
.sect .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--panel-line),transparent)}
.sect .count{font-family:var(--font-mono);font-size:11px;color:rgba(159,176,200,.5)}

/* ---- 卡片网格 ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:11px;
  padding:20px 20px 18px;border-radius:16px;overflow:hidden;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  text-decoration:none;color:inherit;
  transition:border-color .18s,transform .18s,box-shadow .18s}
.card::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,var(--c),transparent 72%);opacity:.75}
.card:hover{border-color:rgba(45,212,234,.5);transform:translateY(-3px);
  box-shadow:0 26px 62px rgba(0,0,0,.42)}
.card:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}
.k{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);
  box-shadow:0 0 10px var(--c);flex:none}
.kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(159,176,200,.7)}
.card h2{margin:2px 0 0;font-family:var(--font-math);font-weight:600;
  font-size:20px;letter-spacing:.02em;color:#eaf1fb}
.card p{margin:0;font-size:13px;line-height:1.65;color:rgba(159,176,200,.82)}
.foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:6px}
.tag{font-family:var(--font-mono);font-size:11px;color:rgba(159,176,200,.6)}
.open{font-size:12.5px;color:#9be8f7;display:inline-flex;align-items:center;gap:5px}
.arw{transition:transform .18s}
.card:hover .arw{transform:translateX(3px)}

/* ---- 敬请期待卡片 ---- */
.ghost{background:rgba(13,20,36,.4);border-style:dashed;
  border-color:rgba(148,163,184,.22);box-shadow:none;cursor:default}
.ghost::before{display:none}
.ghost:hover{transform:none;border-color:rgba(148,163,184,.3);box-shadow:none}
.ghost .dot{background:transparent;border:1.5px dashed rgba(159,176,200,.5);
  box-shadow:none;width:10px;height:10px}
.ghost h2{color:rgba(226,232,240,.75)}
.ghost p{color:rgba(159,176,200,.6)}

/* ---- 页脚 ---- */
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--panel-line);
  font-size:12px;color:rgba(159,176,200,.6)}
footer a{color:rgba(159,176,200,.85);text-decoration:none;
  border-bottom:1px solid rgba(159,176,200,.25);padding-bottom:1px;
  transition:color .15s,border-color .15s}
footer a:hover{color:#bfefff;border-color:rgba(45,212,234,.6)}
footer a:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}

@media (max-width:560px){
  .foot{flex-direction:row}
  .lead{max-width:none}
}
</style>
</head>

</main>

  lead: { zh: '把抽象的数学概念变成能旋转、能拖动的三维场景。同一个数学对象，换个角度就是另一条曲线——转到对的视角，关系会突然显形。',
          en: 'Abstract math turned into rotatable, draggable 3D scenes. The same object viewed from a different angle becomes a different curve — find the right view and the relationship suddenly appears.' },
  hintline: { zh: '点开即在浏览器中运行，无需安装 · 拖拽旋转 · 滚轮缩放 · 双击回正', en: 'Runs in the browser, nothing to install · Drag to rotate · Scroll to zoom · Double-click to reset' },
  sectTools: { zh: 'Tools · 工具集', en: 'Tools' },
  available: { zh: ' 个可用', en: ' available' },
  open: { zh: '打开', en: 'Open' },
  soonKicker: { zh: 'Soon · 敬请期待', en: 'Coming soon' },
  soonTitle: { zh: '更多工具', en: 'More tools' },
  soonDesc: { zh: '这是一个持续生长的合集，新的可视化会陆续加入。', en: 'A growing collection — new visualizations land here over time.' },
  footLeft: { zh: '开源 · 单文件 · 零依赖 · 可离线', en: 'Open source · Single file · Zero dependencies · Works offline' }
};

function renderPage() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t(L.title);
  document.getElementById('h1').textContent = t(L.h1);
  document.getElementById('lead').textContent = t(L.lead);
  document.getElementById('hintline').textContent = t(L.hintline);
  document.getElementById('sectTools').textContent = t(L.sectTools);
  document.getElementById('count').textContent = TOOLS.length + t(L.available);
  document.getElementById('footLeft').textContent = t(L.footLeft);
  document.getElementById('btnLang').textContent = LANG === 'zh' ? 'EN' : '中';
  document.getElementById('grid').innerHTML = TOOLS.map(d =>
    '<a class="card" style="--c:var(--trace-' + d.accent + ')" href="' + d.file + '?lang=' + LANG + '">' +
      '<div class="k"><span class="dot"></span><span class="kicker">' + (LANG === 'zh' ? d.kicker.zh + ' · ' + d.kicker.en : d.kicker.en) + '</span></div>' +
      '<h2>' + t(d.title) + '</h2><p>' + t(d.desc) + '</p>' +
      '<div class="foot"><span class="tag">' + t(d.tag) + '</span><span class="open">' + t(L.open) + '<span class="arw">→</span></span></div>' +
    '</a>').join('') +
    '<div class="card ghost"><div class="k"><span class="dot"></span><span class="kicker">' + t(L.soonKicker) + '</span></div>' +
    '<h2>' + t(L.soonTitle) + '</h2><p>' + t(L.soonDesc) + '</p>' +
    '<div class="foot"><span class="tag">building…</span></div></div>';
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch (e) {}
  renderPage();
}
document.getElementById('btnLang').addEventListener('click', function(){ setLang(LANG === 'zh' ? 'en' : 'zh'); });
renderPage();

/* 背景荧光屏:几条缓慢流动的示波器轨迹,呼应工具本身"画布即主角"的美学 */
const cv = document.getElementById('bg');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, grad = null;

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  grad = g.createRadialGradient(W*0.5, H*0.30, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
  grad.addColorStop(0, '#0c1526');
  grad.addColorStop(1, '#05070d');
}
window.addEventListener('resize', resize);
resize();

const TAU = Math.PI * 2;
const traces = [
  { c: 'rgba(45,212,234,0.15)',  w: 1.6, amp: 0.11, freq: 2.1, speed:  0.20, phase: 0.0 },
  { c: 'rgba(251,113,133,0.12)', w: 1.4, amp: 0.075, freq: 3.2, speed: -0.15, phase: 1.7 },
  { c: 'rgba(167,139,250,0.10)', w: 1.2, amp: 0.05, freq: 4.7, speed:  0.11, phase: 3.1 }
];
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function drawTrace(t, time){
  const midY = H * 0.5, A = H * t.amp;
  g.beginPath();
  for (let x = 0; x <= W; x += 6){
    const u = x / W;
    const env = Math.sin(u * Math.PI);              // 两端渐隐的包络
    const y = midY + A * env * Math.sin(u * TAU * t.freq + time * t.speed + t.phase);
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.lineWidth = t.w; g.strokeStyle = t.c; g.lineCap = 'round';
  g.stroke();
}
function render(time){
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  for (const t of traces) drawTrace(t, time);
}
function frame(ts){
  render((ts || 0) / 1000);
  requestAnimationFrame(frame);
}
if (REDUCED) render(0);
else requestAnimationFrame(frame);
</script>
