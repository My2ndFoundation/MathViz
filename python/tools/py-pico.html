      "blurb": {
        "en": "Let the hardware call a function the instant a button pin falls. The handler only adds one to a counter; the main loop reads the counter and reports it.",
        "zh": "\u8ba9\u786c\u4ef6\u5728\u6309\u94ae\u5f15\u811a\u4e00\u6389\u4e0b\u6765\u5c31\u8c03\u7528\u4e00\u4e2a\u51fd\u6570\u3002\u5904\u7406\u51fd\u6570\u53ea\u628a\u8ba1\u6570\u52a0\u4e00\uff1b\u4e3b\u5faa\u73af\u8bfb\u8ba1\u6570\u5e76\u62a5\u544a\u3002"
      },
      "notes": {
        "en": [
          "What the board does: wire a push button between GP14 and a GND pin. The serial line first asks you to press it; each press prints the new total and flips the on-board LED. A cheap button often bounces - its contacts chatter for a millisecond or two - so one press can count as two or three. Removing that is debouncing, which is on the Embedded Patterns page.",
          "The button pin is set up as an input with the chip's internal pull-up resistor switched on: with the button released the pin reads 1, and pressing it connects the pin to ground so it reads 0. The press is therefore a falling edge, from 1 to 0.",
          "irq attaches an interrupt: when the trigger happens, the processor stops whatever the main loop is doing - even halfway through a line - runs the handler, and then carries on. The handler is given the Pin as its one argument, which is why on_press has a parameter it never uses. Nothing in the main loop has to keep checking the button, so a press cannot be missed while the loop sleeps its 100 ms.",
          "Keep an interrupt handler short: it holds up everything else while it runs, and on some ports it cannot even allocate memory. Here it does one thing, add one to presses. Because that counter lives at module level and the handler assigns to it, the handler names it with global first. The main loop copies presses into count once per pass, so it prints and compares one consistent value even if another press lands meanwhile. Handing richer data from a handler to the main loop safely is the ring buffer on the Embedded Patterns page."
        ],

          "irq \u6302\u4e0a\u4e00\u4e2a\u4e2d\u65ad\uff1a\u89e6\u53d1\u6761\u4ef6\u4e00\u51fa\u73b0\uff0c\u5904\u7406\u5668\u5c31\u505c\u4e0b\u4e3b\u5faa\u73af\u6b63\u5728\u505a\u7684\u4e8b\u2014\u2014\u54ea\u6015\u4e00\u884c\u53ea\u6267\u884c\u5230\u4e00\u534a\u2014\u2014\u53bb\u8fd0\u884c\u5904\u7406\u51fd\u6570\uff0c\u518d\u63a5\u7740\u56de\u53bb\u3002\u5904\u7406\u51fd\u6570\u6536\u5230 Pin \u4f5c\u4e3a\u552f\u4e00\u7684\u5b9e\u53c2\uff0c\u6240\u4ee5 on_press \u6709\u4e00\u4e2a\u7528\u4e0d\u4e0a\u7684\u53c2\u6570\u3002\u4e3b\u5faa\u73af\u4e0d\u5fc5\u4e00\u76f4\u76ef\u7740\u6309\u94ae\uff0c\u5b83\u7761\u90a3 100 \u6beb\u79d2\u7684\u65f6\u5019\u4e5f\u4e0d\u4f1a\u6f0f\u6389\u6309\u952e\u3002",
          "\u4e2d\u65ad\u5904\u7406\u51fd\u6570\u8981\u77ed\uff1a\u5b83\u8fd0\u884c\u65f6\u522b\u7684\u4e00\u5207\u90fd\u5f97\u7b49\u7740\uff0c\u6709\u7684 port \u4e0a\u5b83\u751a\u81f3\u4e0d\u80fd\u5206\u914d\u5185\u5b58\u3002\u8fd9\u91cc\u5b83\u53ea\u505a\u4e00\u4ef6\u4e8b\uff1apresses \u52a0\u4e00\u3002\u56e0\u4e3a\u8fd9\u4e2a\u8ba1\u6570\u653e\u5728\u6a21\u5757\u7ea7\u3001\u5904\u7406\u51fd\u6570\u8981\u7ed9\u5b83\u8d4b\u503c\uff0c\u6240\u4ee5\u5148\u7528 global \u70b9\u540d\u3002\u4e3b\u5faa\u73af\u6bcf\u4e00\u8f6e\u5148\u628a presses \u6284\u8fdb count\uff0c\u8fd9\u6837\u5373\u4f7f\u671f\u95f4\u53c8\u6765\u4e86\u4e00\u6b21\u6309\u952e\uff0c\u5b83\u6253\u5370\u548c\u6bd4\u8f83\u7684\u4e5f\u662f\u540c\u4e00\u4e2a\u503c\u3002\u8981\u628a\u66f4\u591a\u6570\u636e\u5b89\u5168\u5730\u4ece\u5904\u7406\u51fd\u6570\u4ea4\u7ed9\u4e3b\u5faa\u73af\uff0c\u7528\u73af\u5f62\u7f13\u51b2\uff0c\u89c1\u300c\u5d4c\u5165\u5f0f\u7f16\u7a0b\u6a21\u5f0f\u300d\u4e00\u9875\u3002"

      "source": "\"\"\"Count button presses with a pin interrupt; the main loop only reports them.\"\"\"\nfrom machine import Pin\nimport utime\n\nBUTTON_PIN = 14\nLED_PIN = 25\nREPORT_MS = 100\n\npresses = 0\n\n\ndef on_press(pin):\n# >>> BLANK id=count level=2 hint=\"\u4e24\u884c\uff1a\u5148\u58f0\u660e\u8981\u6539\u7684\u662f\u6a21\u5757\u7ea7\u7684\u90a3\u4e2a\u8ba1\u6570\u53d8\u91cf\uff0c\u518d\u8ba9\u5b83\u52a0\u4e00\uff1b\u52a0\u4e00\u7528 +=\uff0c\u4e0d\u5199 presses = presses + 1 || \u51fd\u6570\u91cc\u7ed9\u4e00\u4e2a\u6a21\u5757\u7ea7\u53d8\u91cf\u8d4b\u503c\uff0c\u5f97\u5148\u7528 global \u70b9\u540d\u5b83\uff0c\u5426\u5219 Python \u4f1a\u628a\u5b83\u5f53\u6210\u65b0\u7684\u5c40\u90e8\u53d8\u91cf\" hintEn=\"Two lines: first declare that the counter you are changing is the module-level one, then add one to it; add with +=, not presses = presses + 1 || To assign to a module-level variable inside a function you must name it with global first, or Python treats it as a new local variable\"\n    global presses\n    presses += 1\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n# >>> BLANK id=button-pin level=2 hint=\"\u6784\u9020\u4e00\u4e2a Pin \u5b58\u8fdb button\uff1a\u4e09\u4e2a\u5b9e\u53c2\u5168\u6309\u4f4d\u7f6e\u5199\u2014\u2014\u5e38\u91cf BUTTON_PIN\uff08\u4e0d\u5199 14\uff09\u3001\u8f93\u5165\u6a21\u5f0f\u3001\u4e0a\u62c9\u7535\u963b\uff0c\u4e0d\u5199 mode= / pull= || \u6a21\u5f0f\u4e0e\u4e0a\u62c9\u90fd\u662f Pin \u7c7b\u4e0a\u7684\u5e38\u91cf\uff1a\u8f93\u5165\u662f IN\uff0c\u4e0a\u62c9\u662f PULL_UP\" hintEn=\"Build a Pin and store it in button, with all three arguments given by position - the constant BUTTON_PIN (not 14), the input mode and the pull-up resistor, no mode= or pull= || The mode and the pull-up are both constants on the Pin class: input is IN and pull-up is PULL_UP\"\n    button = Pin(BUTTON_PIN, Pin.IN, Pin.PULL_UP)\n# \u003c\u003c\u003c BLANK\n    led = Pin(LED_PIN, Pin.OUT)\n# >>> BLANK id=irq level=2 hint=\"button \u4e0a\u7684\u4e00\u4e2a\u65b9\u6cd5\u8c03\u7528\uff0c\u7ed9\u8fd9\u4e2a\u5f15\u811a\u6302\u4e2d\u65ad\uff1b\u4e24\u4e2a\u5b9e\u53c2\u90fd\u7528\u5173\u952e\u5b57\u5199\uff0c\u5148 trigger= \u540e handler=\uff0chandler \u5c31\u662f\u4e0a\u9762\u90a3\u4e2a\u51fd\u6570\u7684\u540d\u5b57\uff08\u4e0d\u52a0\u62ec\u53f7\uff09 || \u6309\u4e0b\u65f6\u5f15\u811a\u4ece 1 \u6389\u5230 0\uff08\u4e0a\u62c9\uff09\uff0c\u6240\u4ee5\u89e6\u53d1\u6761\u4ef6\u662f\u4e0b\u964d\u6cbf\uff0cPin \u7c7b\u4e0a\u7684\u5e38\u91cf IRQ_FALLING\" hintEn=\"One method call on button that attaches an interrupt to the pin; both arguments by keyword, trigger= first and then handler=, where the handler is the name of the function above (no brackets) || Pressing pulls the pin from 1 down to 0 (it has a pull-up), so the trigger is a falling edge, the Pin constant IRQ_FALLING\"\n    button.irq(trigger=Pin.IRQ_FALLING, handler=on_press)\n# \u003c\u003c\u003c BLANK\n    shown = 0\n    print(\"press the button on GP14\")\n    while True:\n        count = presses\n        if count != shown:\n            print(\"presses:\", count)\n            led.toggle()\n            shown = count\n        utime.sleep_ms(REPORT_MS)\n\n\nif __name__ == \"__main__\":\n    main()\n",

      "title": {

      "blurb": {
        "en": "A periodic Timer calls a function every 250 ms to flip the LED, a one-shot Timer ends the show after 10 seconds - and the main loop is free to do something else.",
        "zh": "\u4e00\u4e2a\u5468\u671f\u5b9a\u65f6\u5668\u6bcf 250 \u6beb\u79d2\u8c03\u7528\u4e00\u6b21\u51fd\u6570\u7ffb\u8f6c LED\uff0c\u4e00\u4e2a\u5355\u6b21\u5b9a\u65f6\u5668 10 \u79d2\u540e\u7ed3\u675f\u6f14\u793a\u2014\u2014\u4e3b\u5faa\u73af\u7a7a\u51fa\u6765\u505a\u522b\u7684\u4e8b\u3002"
      },
      "notes": {
        "en": [
          "What the board does: the on-board LED blinks steadily, on for a quarter of a second and off for a quarter, for ten seconds, then goes dark. Meanwhile the serial line prints once a second how many seconds have passed and how many times the LED has flipped so far - about 4 more each second - and at the end how many flips there were in all, about 40.",
          "Timer(period=..., mode=..., callback=...) asks MicroPython to call a function for you on a schedule. On the Pico this is a software timer: according to the MicroPython rp2 quick reference, the chip's system timer keeps the time and raises an interrupt, and the callback runs as a soft interrupt - squeezed in between the main program's steps - unless you pass hard=True. Timer.PERIODIC repeats every period milliseconds until you call deinit(); Timer.ONE_SHOT fires once. The callback is passed by name, without brackets - you hand over the function itself, not the result of calling it - and it receives the Timer as its one argument.",
          "Compare Blink the On-Board LED, where the loop sleeps between changes and can do nothing else. Here the blinking keeps its rhythm on its own; the main loop sleeps a whole second at a time just to print, and the blink does not wait for it. Callbacks run in between the main loop's work, so keep them short - on_blink flips the LED and counts, nothing more.",
          "led, toggles and finished are module-level so the callbacks can reach them; main and the callbacks that assign to them name them with global first. The one-shot timer ends the demo by setting the flag finished, and the main loop checks that flag once a second - which is why the final count can be a flip or so either side of 40. Writing a main loop that runs several timed jobs without any Timer is on the Embedded Patterns page."
        ],

      "source": "\"\"\"Blink the LED from a timer callback while the main loop does other work.\"\"\"\nfrom machine import Pin, Timer\nimport utime\n\nLED_PIN = 25\nBLINK_MS = 250\nRUN_MS = 10000\n\nled = None\ntoggles = 0\nfinished = False\n\n\ndef on_blink(timer):\n    global toggles\n    led.toggle()\n    toggles += 1\n\n\ndef on_finish(timer):\n# >>> BLANK id=finish level=2 hint=\"\u4e24\u884c\uff1a\u5148\u58f0\u660e\u8981\u6539\u7684\u662f\u6a21\u5757\u7ea7\u7684\u90a3\u4e2a\u6807\u5fd7\uff0c\u518d\u628a\u5b83\u8bbe\u6210\u771f\uff1b\u76f4\u63a5\u8d4b True\uff0c\u4e0d\u7528 not || \u51fd\u6570\u91cc\u7ed9\u6a21\u5757\u7ea7\u53d8\u91cf\u8d4b\u503c\u8981\u5148\u7528 global \u70b9\u540d\uff1b\u6807\u5fd7\u7684\u540d\u5b57\u5c31\u662f\u4e3b\u5faa\u73af while \u91cc\u5224\u65ad\u7684\u90a3\u4e2a\" hintEn=\"Two lines: first declare that the flag you are changing is the module-level one, then make it true; assign True directly, not via not || Assigning to a module-level variable inside a function needs global first; the flag is the one the main loop's while tests\"\n    global finished\n    finished = True\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n    global led\n    led = Pin(LED_PIN, Pin.OUT)\n# >>> BLANK id=periodic level=2 hint=\"\u6784\u9020\u4e00\u4e2a Timer \u5b58\u8fdb blinker\uff1a\u4e09\u4e2a\u5b9e\u53c2\u90fd\u7528\u5173\u952e\u5b57\uff0c\u987a\u5e8f\u662f period=\u3001mode=\u3001callback=\uff1b\u5468\u671f\u7528\u5e38\u91cf BLINK_MS\uff0c\u56de\u8c03\u662f\u4e0a\u9762\u6bcf\u6b21\u7ffb\u8f6c LED \u7684\u90a3\u4e2a\u51fd\u6570\u540d\uff08\u4e0d\u52a0\u62ec\u53f7\uff09 || \u8fd9\u4e2a\u5b9a\u65f6\u5668\u8981\u4e00\u904d\u53c8\u4e00\u904d\u5730\u89e6\u53d1\uff0c\u6a21\u5f0f\u662f Timer \u7c7b\u4e0a\u7684\u5e38\u91cf PERIODIC\uff08\u4e0b\u4e00\u884c\u90a3\u4e2a\u53ea\u89e6\u53d1\u4e00\u6b21\u7684\u662f ONE_SHOT\uff09\" hintEn=\"Build a Timer and store it in blinker: all three arguments by keyword, in the order period=, mode=, callback=; the period is the constant BLINK_MS and the callback is the name of the function above that flips the LED (no brackets) || This timer fires again and again, so its mode is the Timer constant PERIODIC (the one on the next line, which fires once, is ONE_SHOT)\"\n    blinker = Timer(period=BLINK_MS, mode=Timer.PERIODIC, callback=on_blink)\n# \u003c\u003c\u003c BLANK\n    stopper = Timer(period=RUN_MS, mode=Timer.ONE_SHOT, callback=on_finish)\n    seconds = 0\n# >>> BLANK id=loop level=1 hint=\"\u4e00\u4e2a while \u5934\uff1a\u53ea\u8981\u6807\u5fd7 finished \u8fd8\u6ca1\u53d8\u771f\u5c31\u7ee7\u7eed\uff1b\u7528 not\uff0c\u4e0d\u5199 == False\uff0c\u4e0d\u5199 is False\" hintEn=\"One while header: keep going as long as the flag finished has not become true; use not, not == False or is False\"\n    while not finished:\n# \u003c\u003c\u003c BLANK\n        utime.sleep(1)\n        seconds += 1\n        print(seconds, \"s:\", toggles, \"toggles\")\n    blinker.deinit()\n    stopper.deinit()\n    led.value(0)\n    print(\"stopped after\", toggles, \"toggles\")\n\n\nif __name__ == \"__main__\":\n    main()\n",

      },
      "notes": {
        "en": [
          "What the board does: with a button between GP14 and GND, the on-board LED stays off for two seconds and then lights. Press the button as fast as you can: the serial line prints your reaction time in milliseconds, typically a couple of hundred. Let go and it starts again. At the start it also prints a pretend wrap-around example, which comes out as -976.",
          "The counter behind utime.ticks_ms() does not grow for ever: it counts up to a largest value and then starts again from 0. How far it gets differs from board to board - the documentation only promises that the period is a power of two (MicroPython time docs; not measured here). To see the problem with small numbers, pretend the counter wraps at 1024.",
          "With that pretend counter, suppose the LED lights at reading 1000 and you press 48 ms later. The counter reaches 1023, wraps to 0, and reads 24 when you press. Plain subtraction gives 24 minus 1000, which is -976 - a negative reaction time. Nothing is wrong with the arithmetic; the readings are positions on a ring, not points on a line.",
          "On a real board the period is large, so a wrap rarely lands inside one measurement - which is exactly why this bug hides in testing and appears in a device left running for days. The fix, ring arithmetic, is Elapsed Time with ticks_diff.",
          "The busy-wait while loops simply spin until the button changes, which is fine for a timer that has nothing else to do. The second one waits for you to let go, so holding the button down does not start the next round."

      "source": "\"\"\"Time a reaction by subtracting two ticks_ms() readings - right until the counter wraps.\"\"\"\nfrom machine import Pin\nimport utime\n\nLED_PIN = 25\nBUTTON_PIN = 14\nWAIT_MS = 2000\n\n\ndef elapsed_ms(new, old):\n# >>> BLANK id=subtract level=1 hint=\"\u4e00\u884c return\uff1a\u540e\u4e00\u6b21\u8bfb\u6570\u51cf\u524d\u4e00\u6b21\u8bfb\u6570\uff0c\u7167\u53c2\u6570\u540d\u5199\uff0cnew \u5728\u524d\" hintEn=\"One return line: the later reading minus the earlier one, using the parameter names, new first\"\n    return new - old\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n    led = Pin(LED_PIN, Pin.OUT)\n    button = Pin(BUTTON_PIN, Pin.IN, Pin.PULL_UP)\n    print(\"wrap at 1024, 1000 then 24:\", elapsed_ms(24, 1000))\n    while True:\n        led.value(0)\n        utime.sleep_ms(WAIT_MS)\n        led.value(1)\n        start = utime.ticks_ms()\n# >>> BLANK id=wait-press level=2 hint=\"\u4e24\u884c\uff1a\u4e00\u4e2a while \u5934\uff0c\u53ea\u8981\u6309\u94ae\u8fd8\u677e\u7740\u5c31\u4e00\u76f4\u8f6c\uff1b\u4e0b\u4e00\u884c\u5faa\u73af\u4f53\u4ec0\u4e48\u4e5f\u4e0d\u505a\uff0c\u5199 pass\u3002\u6761\u4ef6\u7167\u7a0b\u5e8f\u672b\u5c3e\u7b49\u677e\u624b\u7684\u90a3\u4e2a while \u7684\u6837\u5b50\u5199\uff1a\u6309\u94ae\u8bfb\u6570\u5199\u5728\u5de6\u8fb9\u3001\u7528 == \u4e0e\u4e00\u4e2a\u6570\u6bd4\uff0c\u4e0d\u5199 !=\uff0c\u4e5f\u4e0d\u5355\u5199\u8bfb\u6570 || \u4e0a\u62c9\u7684\u6309\u94ae\u677e\u5f00\u65f6\u8bfb 1\u3001\u6309\u4e0b\u65f6\u8bfb 0\uff0c\u6240\u4ee5\u8bfb\u6570\u79bb\u5f00 1 \u7684\u90a3\u4e00\u523b\u5faa\u73af\u7ed3\u675f\" hintEn=\"Two lines: a while header that keeps spinning as long as the button is still released, and a body that does nothing, written pass. Write the test the way the while at the end of the program that waits for you to let go is written: the button reading on the left, compared with a number using ==, not != and not the reading on its own || A pulled-up button reads 1 when released and 0 when pressed, so the loop ends the moment the reading leaves 1\"\n        while button.value() == 1:\n            pass\n# \u003c\u003c\u003c BLANK\n        end = utime.ticks_ms()\n# >>> BLANK id=report level=2 hint=\"\u4e00\u884c print\uff0c\u4e09\u4e2a\u5b9e\u53c2\u6309\u4f4d\u7f6e\u3001\u7528\u9017\u53f7\u5206\u5f00\uff08\u4e0d\u7528 f-string\uff0c\u4e0d\u7528 + \u62fc\u63a5\uff09\uff1a\u4e00\u4e2a\u53cc\u5f15\u53f7\u5b57\u7b26\u4e32\u3001\u8fd9\u6b21\u7684\u6beb\u79d2\u6570\u3001\u518d\u4e00\u4e2a\u53cc\u5f15\u53f7\u5b57\u7b26\u4e32\uff1b\u7b2c\u4e00\u4e2a\u5b57\u7b26\u4e32\u9010\u5b57\u662f reaction \u52a0\u4e00\u4e2a\u5192\u53f7\uff0c\u6700\u540e\u4e00\u4e2a\u9010\u5b57\u662f ms\uff1b\u6beb\u79d2\u6570\u8c03\u7528\u672c\u7a0b\u5e8f\u91cc\u7684\u90a3\u4e2a\u51fd\u6570\u6765\u7b97\uff08\u4e0d\u76f4\u63a5\u76f8\u51cf\uff09\uff0c\u5b83\u7684\u5b9e\u53c2\u4e5f\u6309\u4f4d\u7f6e\u5199 || \u4e24\u4e2a\u8bfb\u6570\u7684\u987a\u5e8f\uff1a\u540e\u8bfb\u5230\u7684\u90a3\u4e2a\u5728\u524d\uff0c\u5148\u8bfb\u5230\u7684\u5728\u540e\" hintEn=\"One print line with three arguments by position, separated by commas (no f-string, no + joining): a double-quoted string, the milliseconds this time, and another double-quoted string; the first string is exactly reaction followed by a colon, the last is exactly ms; the milliseconds come from calling this program's own function (not a subtraction written out), its arguments by position too || The order of the two readings: the one taken later goes first, the earlier one second\"\n        print(\"reaction:\", elapsed_ms(end, start), \"ms\")\n# \u003c\u003c\u003c BLANK\n        while button.value() == 0:\n            pass\n\n\nif __name__ == \"__main__\":\n    main()\n",

      "notes": {
        "en": [
          "What the board does: exactly what Elapsed Time by Plain Subtraction does - the LED lights after two seconds and the serial line prints your reaction time. At the start it prints the counter's period on this board and the same pretend wrap-around example, which now comes out as 48, the right answer.",
          "The counter behind utime.ticks_ms() does not grow for ever: it counts up to a largest value and then starts again from 0. How far it gets differs from board to board - the documentation only promises that the period is a power of two (MicroPython time docs; not measured here). To see the problem with small numbers, pretend the counter wraps at 1024.",
          "ticks_diff first takes the difference modulo the period. In Python % with a positive divisor never gives a negative answer, so for the pretend counter (24 - 1000) % 1024 is 48: the distance forward round the ring from the old reading to the new one. Because the period is a power of two, MicroPython itself can do this step with a bit mask instead of %, the trick shown in Eight LEDs in One Byte.",
          "The second step makes the answer signed. A forward distance in the upper half of the ring is taken to mean that new actually came before old, so a whole period is subtracted: with 1024, a distance of 1000 becomes -24. The result always lies from minus half a period up to half a period minus one - the same range the documentation gives for utime.ticks_diff, and the reason two readings must be taken less than half a period apart to be trusted.",
          "main gets the real period from the board rather than hard-coding one: the documentation shows that stepping one tick back from 0 with utime.ticks_add lands on the largest value the counter can hold, and one more than that is the period. In your own programs just call utime.ticks_diff(end, start); writing it out here shows what it does. Using it to run jobs on a schedule without blocking is on the Embedded Patterns page.",
          "The page's checker compares ticks_diff with a version that simply tries every candidate answer from minus half a period upwards until adding it to old lands on new, using periods of 16, 64, 256 and 1024 - half the cases sit right on the wrap-around edges: a difference of 0, one either way, half a period minus one, and minus half a period."

      "source": "\"\"\"Time a reaction with ring arithmetic, the way utime.ticks_diff() does.\"\"\"\nfrom machine import Pin\nimport utime\n\nLED_PIN = 25\nBUTTON_PIN = 14\nWAIT_MS = 2000\n\n\ndef ticks_diff(new, old, period):\n# >>> BLANK id=ring level=2 hint=\"\u4e00\u884c\uff0c\u628a\u7ed3\u679c\u5b58\u8fdb d\uff1a\u5148\u7167\u5e38\u76f8\u51cf\uff08new \u5728\u524d\uff09\uff0c\u6574\u4e2a\u5dee\u7528\u62ec\u53f7\u62ec\u8d77\u6765\uff0c\u518d\u5bf9 period \u53d6\u4f59\uff1b\u7528 %\uff0c\u4e0d\u7528 & || Python \u7684 % \u5728\u9664\u6570\u4e3a\u6b63\u65f6\u7ed3\u679c\u603b\u843d\u5728 0 \u5230 period - 1 \u4e4b\u95f4\uff0c\u54ea\u6015\u5dee\u662f\u8d1f\u7684\" hintEn=\"One line storing the result in d: subtract as usual (new first), bracket the whole difference, then take it modulo period; use %, not & || In Python, % with a positive divisor always lands between 0 and period - 1, even when the difference is negative\"\n    d = (new - old) % period\n# \u003c\u003c\u003c BLANK\n# >>> BLANK id=signed level=2 hint=\"\u4e24\u884c\uff1a\u4e00\u4e2a if \u5934\uff0cd \u843d\u5728\u4e0a\u534a\u5708\uff08\u5927\u4e8e\u7b49\u4e8e\u534a\u4e2a\u5468\u671f\uff09\u65f6\u6210\u7acb\u2014\u2014d \u5199\u5728\u5de6\u8fb9\uff0c\u534a\u4e2a\u5468\u671f\u5199\u6210 period // 2\uff0c\u7528 >=\uff1b\u4e0b\u4e00\u884c\u7528 -= \u628a d \u632a\u5230\u8d1f\u7684\u90a3\u4e00\u8fb9 || \u4e0a\u534a\u5708\u7684\u5dee\u5176\u5b9e\u8868\u793a new \u6bd4 old \u65e9\uff1a\u51cf\u53bb\u4e00\u6574\u5708 period\uff0c\u5c31\u5f97\u5230\u90a3\u4e2a\u8d1f\u6570\" hintEn=\"Two lines: an if header that holds when d is in the upper half of the ring (at least half a period) - d on the left, half a period written period // 2, using >=; then a line that uses -= to move d to the negative side || A difference in the upper half really means new came before old: take off one whole turn, period, and you get that negative number\"\n    if d >= period // 2:\n        d -= period\n# \u003c\u003c\u003c BLANK\n    return d\n\n\ndef main():\n    led = Pin(LED_PIN, Pin.OUT)\n    button = Pin(BUTTON_PIN, Pin.IN, Pin.PULL_UP)\n# >>> BLANK id=period level=3 hint=\"\u4e00\u884c\uff0c\u628a\u8ba1\u6570\u5668\u7684\u5468\u671f\u5b58\u8fdb period\uff1a\u8c03\u7528 utime \u4e0a\u7684\u4e00\u4e2a\u51fd\u6570\uff0c\u518d\u52a0 1\uff1b\u4e0d\u5199\u6b7b\u4efb\u4f55\u6570\u5b57\uff08\u5468\u671f\u56e0\u677f\u5b50\u800c\u5f02\uff09 || \u8fd9\u4e2a\u51fd\u6570\u628a\u4e00\u4e2a ticks \u503c\u5f80\u524d\u6216\u5f80\u540e\u632a\u82e5\u5e72\u6beb\u79d2\uff1b\u4ece 0 \u5f80\u56de\u632a 1\uff0c\u5c31\u843d\u5728\u8ba1\u6570\u5668\u80fd\u53d6\u5230\u7684\u6700\u5927\u503c\u4e0a || \u51fd\u6570\u662f ticks_add\uff0c\u4e24\u4e2a\u5b9e\u53c2\u662f 0 \u548c -1\" hintEn=\"One line storing the counter's period in period: call a utime function and add 1; no hard-coded number (the period differs from board to board) || That function moves a ticks value some milliseconds forward or back; moving back 1 from 0 lands on the largest value the counter can hold || The function is ticks_add, with the arguments 0 and -1\"\n    period = utime.ticks_add(0, -1) + 1\n# \u003c\u003c\u003c BLANK\n    print(\"ticks period:\", period)\n    print(\"wrap at 1024, 1000 then 24:\", ticks_diff(24, 1000, 1024))\n    while True:\n        led.value(0)\n        utime.sleep_ms(WAIT_MS)\n        led.value(1)\n        start = utime.ticks_ms()\n        while button.value() == 1:\n            pass\n        end = utime.ticks_ms()\n        print(\"reaction:\", ticks_diff(end, start, period), \"ms\")\n        while button.value() == 0:\n            pass\n\n\nif __name__ == \"__main__\":\n    main()\n",
