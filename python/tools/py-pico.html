     其中一条的正文还直接说破了那个空唯一要考的判断（原文不在这里复述：这段
     注释是随页面一起发出去的字节）。

     **临摹模式一并挡掉**，理由同样具体：临摹有 `alphaBlind` 档（`S.alpha = 0`，
     影子层全透明，她凭记忆敲）。那一档下右侧面板照样印着整行原文——泄的是同
     一件事，只换了个模式。

     所以判据写成 `=== 'read'`（**白名单**）而不是 `!== 'blank'`（黑名单）：
     黑名单在加第四个模式时会默认放行，而「默认放行」正是这个洞的形状。

     锚**可以**落在挖空体内——第 0 期的 `anchor_check()` 禁过，第 1 期（设计 D7）
     放开了：值得讲解的行通常正是值得挖掉的行。所以数据层不再挡，泄题的防线
     全在读取侧，两道各守一半，缺一不可：
       · 这里：非读模式面板里根本没有行注段；
       · `line_note_reader_check()`（gates/hygiene.py）：core 里只有本函数与
         `noteLineIndex` 两处许读行注字段，别处新增一个读取点当场红。 */
  function panelLineNotes(program, mode) {
    if (mode !== 'read') { return []; }
    return (program && program.lineNotes) ? program.lineNotes : [];
  }

  /* clearScope(scope, programs, currentId) → string[] | null

     'page' 给的是 `programs` 的全部 id——也就是**本页**内嵌的那一章，不是整个
     模块：页面只内嵌自己那一章（GENERATED:PROGRAMS），同模块别的页的 id 在这里
     根本看不见。这一级原先叫 'module'、按钮写「清空本模块」，而它从来只清本页；
     名字与文案都已改成与行为一致（「清空本页」）。

     'all' 这一支返回 **null**，含义是"交给 Store.clearAll()，不走 id 列表"：
     整项清空扫的是键前缀，本页根本列举不出别的页的 id，返回一个只含本页
     id 的数组会是一个看上去很对、实际上清不干净的谎（裁决 R4）。
     未知 scope 当场抛——清空是不可撤销的，猜不得。 */
  function clearScope(scope, programs, currentId) {
    if (scope === 'program') { return currentId ? [currentId] : []; }
    if (scope === 'page') {

    if (scope === 'all') { return null; }
    throw new Error('clearScope: 未知范围 ' + scope + '（只认 program / page / all）');
  }

  /* clearRecords(store, scope, ids) —— 按 scope 真正动手清

     收一个 store 形状的对象（不是直接抓模块）**只为一件事**：让"先 flush 再清"
     这个次序可以在 node 下被断言。次序不是风格问题——`Store.cancelPending`
     只被 setDraft/scheduleDraft 调用，**清空不取消排队中的那次防抖写**，
     所以不先落盘就删，400 ms 后那次写会把草稿原样送回来，而 UI 已经说了
     "已清空"，她不会再去看第二眼。

     `ids === null` 是 `clearScope('all')` 的出口：交给 clearAll 扫键前缀。
     单题 / 本页两级只清 draft（进度不连坐，spec §4.5）。 */
  function clearRecords(store, scope, ids) {
    store.flush();
    if (ids === null) { store.clearAll(); return; }
    if (scope === 'program') {
      ids.forEach(function (id) { store.clearProgram(id); });
      return;
    }
    store.clearMany(ids);
  }

  /* clearHitsCurrent(ids, currentId) → boolean
     这一次清空**动到当前这一题了吗**？

     选择器里每一项的「⋯ → 清空本题」可以清**任意**一个程序，所以"清完要不要
     重新读草稿、要不要把当前这一遍临摹作废"不能无条件成立：她正临摹着 A、
     顺手清掉 B 的草稿，若照样重置，下一次 traceRun() 会看到 S.typed 非空、
     把一遍**从未被打断的**临摹标成 resumed，成绩从此不计——而"重来"又会丢掉
     她真实的进度。`ids === null` 是整项清空（Store.clearAll 扫键前缀），
     那一定包含当前这一题。 */
  function clearHitsCurrent(ids, currentId) {
    if (ids === null) { return true; }
    if (!currentId) { return false; }
    return (ids || []).indexOf(currentId) !== -1;

  /* clearFlash(ui) —— 撤掉硬拦截的红边与说明。

     单拎出来是因为它跑在一个 1600 ms 的延时回调里，而那段时间足够她切走模式
     或换一题，`renderStage()` 会把 traceUI 置空：**回调必须在"已经没人要它"
     的情况下安全返回**，而不是抛一个未捕获的 TypeError 进控制台。
     （拆除那一侧还会 clearTimeout，两道保险互不依赖。） */
  function clearFlash(ui) {
    if (!ui || !ui.input) { return; }
    ui.input.classList.remove('py-blocked');
    if (ui.blockNote) { ui.blockNote.hidden = true; }
  }

  /* variantsOf(programs, program) → Program[]
     同一个 `problem` 的几种写法（§2.4），按注册表顺序、含自己。
     缺 `problem` 字段的程序**只和自己一组**：naive 的 `q.problem === p.problem`
     会把所有 undefined 判成同一组，把毫不相干的程序摆成"变体"。 */
  function variantsOf(programs, program) {
    var p = program || {};
    var key = p.problem;
    if (typeof key !== 'string' || key === '') { return p.id ? [p] : []; }
    return (programs || []).filter(function (q) { return q.problem === key; });

  /* 一行的前导空格数（只数半角空格，与 Editor.indentOf 同法）。 */
  function leadSpaces(line) {
    var i = 0;
    while (i < line.length && line.charAt(i) === ' ') { i++; }
    return i;
  }

  /* literalKindName(type, lang) → 字面量类别的双语名字（'一个字符串' / '一个 f-string'）。
     只在这一处定义；blankFeedback 的字面量分支都从这里取，不各自拼一遍。 */
  function literalKindName(type, lang) {
    return t(type === 'fstring' ? 'literalFstring' : 'literalString', lang);
  }

  /* blankFeedback(answer, reference, lang) → { ok, kind, message, caret }

     逐空判定的那句话与光标位置。**不给答案**（不回整段 body），只报
     "第几个 token 起开始不同：期待 X，你写了 Y"，caret 是要送进 textarea
     的字符下标（Judge 的两种 index 语义完全不同，见下）。

       kind 'different' / 'missing' / 'extra'：index 是**有效 token 下标**，
         expected/got 是 token 原文（字符串或 null）。光标去那个 token 的起点，
         所以要用 PyLex.significant 现取它在 answer 里的偏移。
       kind 'indent'：index 是**物理行号**，expected/got 是**相对缩进数值**
         （不是 null、不是字符串）。光标去那一行的行首。裁决 R30/R31。

     另有 Judge 结构上看不见的一种错：**整块的绝对缩进**。Judge.normalize 比的是
     行与行之间的相对缩进，所以单行挖空体 `    x = 1` 与 `x = 1` 在它眼里完全
     相等——可 Exercise.merge 是拿她这一份原样替换回源码的，少了那四格，粘进
     PyCharm 就是 IndentationError。所以这里先自己比一遍第一行的绝对缩进。

     字面量例外（Task 11b，控制方裁决 T11-1，源自 Task 11 评审 C1）：PyLex 把
     一整个字符串或 f-string 切成**一个** token，"期待的 token 原文"对字面量
     来说就是答案本身——照其他 token 那样把 expected 印出来，等于把整行答案
     摆在她眼前。所以期待的 token 是 string/fstring 时，消息里绝不出现它的原文：
     kind 'different' 只说"第几个字符起不同"（下标是在 token 原文——含引号
     与 f-string 的 `f` 前缀——里数的，1 起）；她自己写的（`cmp.got`）仍可以
     照常复述，那是她自己的输入，不是答案。kind 'missing' 只说"这里该有一个
     字符串/f-string"，不带任何原文。kind 'extra' 与 'indent'/'lead-indent'
     不受影响——'extra' 没有 expected 可印，indent 系两种从不涉及字面量原文。 */
  function blankFeedback(answer, reference, lang) {
    var a = String(answer == null ? '' : answer);
    var r = String(reference == null ? '' : reference);

    var aFirst = a.split('\n')[0];
    var rFirst = r.split('\n')[0];
    if (aFirst.trim() !== '' && leadSpaces(aFirst) !== leadSpaces(rFirst)) {
      return {
        ok: false,
        kind: 'lead-indent',
        caret: 0,
        message: ts('blankLead', lang, [1, leadSpaces(rFirst), leadSpaces(aFirst)])
      };
    }

    var cmp = judge().compare(a, r);
    if (cmp.ok) {
      return { ok: true, kind: 'equal', caret: 0, message: t('blankOk', lang) };
    }

    if (cmp.kind === 'indent') {
      var starts = editor().lineStarts(a);
      var li = Math.max(0, Math.min(cmp.index, starts.length - 1));
      return {
        ok: false,
        kind: 'indent',
        caret: starts[li],
        message: ts('blankIndent', lang, [cmp.index + 1, cmp.expected, cmp.got])
      };
    }

    var L = pyLex();
    var toks = L.significant(L.tokenize(a));

    /* 字面量分支：只有 'different' / 'missing' 会指向一个"期待的 token"，
       'extra' 没有期待值可言。refTok 取参考侧同一下标的有效 token——与
       Judge.compare 用的是同一套 PyLex.significant(PyLex.tokenize(...))，
       下标口径一致（brief 已确认）。 */
    var refToks = (cmp.kind === 'different' || cmp.kind === 'missing')
      ? L.significant(L.tokenize(r)) : null;
    var refTok = refToks ? refToks[cmp.index] : null;
    var isLiteral = !!refTok && (refTok.type === 'string' || refTok.type === 'fstring');

    if (isLiteral && cmp.kind === 'missing') {
      return {
        ok: false,
        kind: cmp.kind,
        caret: a.length,
        message: ts('blankMissingLiteral', lang, [cmp.index + 1, literalKindName(refTok.type, lang)])
      };
    }

    if (isLiteral && cmp.kind === 'different') {
      var atTok = toks[cmp.index];
      if (atTok && (atTok.type === 'string' || atTok.type === 'fstring')) {
        /* 两边都是字面量：逐字符比 token 原文（含引号/前缀），找第一个不同的
           下标 k——一方是另一方前缀时取较短者的长度。绝不把 rt[i] 的原文
           （cmp.expected）放进消息，只用它来算 k。 */
        var refText = cmp.expected, atText = cmp.got;
        var short = Math.min(refText.length, atText.length);
        var k = short;
        for (var ci = 0; ci < short; ci++) {
          if (refText.charAt(ci) !== atText.charAt(ci)) { k = ci; break; }
        }
        return {
          ok: false,
          kind: cmp.kind,
          caret: Math.min(a.length, atTok.start + k),
          message: ts('blankDiffLiteral', lang, [cmp.index + 1, literalKindName(refTok.type, lang), k + 1])
        };
      }
      /* 她在该放字面量的位置写了别的东西：只说该放哪一类，仍可以复述她
         自己写的（cmp.got 是答案侧原文，不是答案）。 */
      return {
        ok: false,
        kind: cmp.kind,
        caret: atTok ? atTok.start : a.length,
        message: ts('blankWrongKind', lang, [cmp.index + 1, literalKindName(refTok.type, lang), cmp.got])
      };
    }

    var caret = (cmp.kind === 'missing' || !toks[cmp.index]) ? a.length : toks[cmp.index].start;
    var key = cmp.kind === 'missing' ? 'blankMissing'
            : cmp.kind === 'extra' ? 'blankExtra' : 'blankDiff';
    var args = cmp.kind === 'missing' ? [cmp.index + 1, cmp.expected]
             : cmp.kind === 'extra' ? [cmp.index + 1, cmp.got]
             : [cmp.index + 1, cmp.expected, cmp.got];
    return { ok: false, kind: cmp.kind, caret: caret, message: ts(key, lang, args) };
  }

  /* traceStates(reference, typed, result) → ('ok'|'bad'|'over')[]

     临摹中间层要按**她打的文本**的字符下标上色，而 Trace.update 给的
     marks[].index 是**参考侧**的偏移，两者在她多打/少打时根本不是一回事。
     这里用 Trace.alignLines 把两侧按行重新对齐，把 marks 按 update() 里
     同样的顺序（逐行、行内 j < min(typedFull, refFull)）消费回来，再把
     overflow 的 {line,col} 折回 typed 的下标。

     产出的数组长度恒等于 typed.length —— trace.js 文件头写死的不变量是
     `marks.length + overflow.length === typed.length`；万一哪天不成立，
     这里**整片不标红**而不是错位标红：一片无来由的红比没有红更难看懂。 */
  function traceStates(reference, typed, result) {
    var text = String(typed == null ? '' : typed);
    var states = new Array(text.length);
    for (var i = 0; i < text.length; i++) { states[i] = 'ok'; }

    var marks = (result && result.marks) || [];
    var overflow = (result && result.overflow) || [];
    if (marks.length + overflow.length !== text.length) { return states; }

    var rows = trace().alignLines(String(reference == null ? '' : reference), text);
    var lineStart = [];
    var pos = 0;
    for (var r = 0; r < rows.length; r++) {
      lineStart.push(pos);
      pos += rows[r].typedFull.length;
    }

    var m = 0;
    for (var k = 0; k < rows.length; k++) {
      var row = rows[k];
      var matchLen = Math.min(row.typedFull.length, row.refFull.length);
      for (var j = 0; j < matchLen && m < marks.length; j++, m++) {
        states[lineStart[k] + j] = (marks[m].state === 'ok') ? 'ok' : 'bad';
      }
    }
    for (var o = 0; o < overflow.length; o++) {
      var ov = overflow[o];
      var idx = (lineStart[ov.line] || 0) + ov.col;
      if (idx >= 0 && idx < states.length) { states[idx] = 'over'; }
    }
    return states;
  }

  /* expectedCharAt(reference, text, offset) → string | null

     「她打的这一格，按参考应当是哪个字符？」——硬拦截档要不要拒绝这次按键、
     以及拒绝之后屏幕上该说什么，都由它回答。

     用**文本自己的行列**去查参考，而不是全局偏移：她多打/少打一行之后，
     全局偏移就不再指向同一个位置了（`trace.js` 按行重新对齐，同一条道理）。
     两种"参考在这里没有内容"的情形都回 null，调用方分别说人话：
       · 这一行整行超出了参考（line >= 参考行数）
       · 这一列超出了本行、而本行是参考的最后一行（后面没有换行符可打了）
     本行未到结尾时列越界则应当打换行符，所以回 '\n' 而不是 null。 */
  function expectedCharAt(reference, text, offset) {
    var ref = String(reference == null ? '' : reference);
    var s = String(text == null ? '' : text);
    var before = s.slice(0, offset);
    var line = before.split('\n').length - 1;
    var col = offset - (before.lastIndexOf('\n') + 1);
    var refLines = ref.split('\n');
    var refLine = refLines[line];
    if (refLine === undefined) { return null; }
    if (col < refLine.length) { return refLine.charAt(col); }
    return (line < refLines.length - 1) ? '\n' : null;
  }

  /* charMatches(reference, text, offset) → boolean
     text[offset] 这个字符与参考的同一行同一列一致吗？参考在那里没有内容
     （expectedCharAt 回 null）时一律不一致——硬拦截档据此拒绝这次按键。 */
  function charMatches(reference, text, offset) {
    var expected = expectedCharAt(reference, text, offset);
    return expected !== null && expected === String(text == null ? '' : text).charAt(offset);
  }

  /* blockedHint(reference, text, offset, lang) → string

     硬拦截档**拒绝了一次按键**时屏幕上要说的那句话。这句话不是装饰：
     `applyEnter` 会把上一行的缩进带到下一行，而参考的下一行可能顶格，
     于是 col 一直落在参考行的内容之外——**她打什么都被拒**，唯一的出路是
     猜到要连按几次退格。一次她看不见的拒绝，与一个死掉的页面无法区分。 */
  function blockedHint(reference, text, offset, lang) {
    var ref = String(reference == null ? '' : reference);
    var s = String(text == null ? '' : text);
    var before = s.slice(0, offset);
    var line = before.split('\n').length - 1;
    var col = offset - (before.lastIndexOf('\n') + 1);
    var refLines = ref.split('\n');
    var expected = expectedCharAt(ref, s, offset);
    if (refLines[line] === undefined) {
      return ts('blockedPastEnd', lang, [refLines.length]);
    }
    if (expected === null) {
      return ts('blockedLineEnd', lang, [line + 1, refLines[line].length, col]);
    }
    if (expected === '\n') {
      return ts('blockedNewline', lang, [line + 1]);
    }
    /* 最常见的那一种拒绝：`applyEnter` 把上一行的深缩进带了下来，而参考这一行
       更浅。只报"第 N 格应该是 o"她仍要自己数格子；直接说多了几格、按几次退格。
       判据：光标之前这一行全是空格（就是自动缩进那几格），且比参考的缩进深。 */
    var lineStart = offset - col;
    var typedIndent = s.slice(lineStart, offset);
    var refIndent = leadSpaces(refLines[line]);
    if (/^ *$/.test(typedIndent) && col > refIndent) {
      return ts('blockedIndent', lang, [col - refIndent]);
    }
    return ts('blockedExpect', lang, [line + 1, col + 1, expected]);
  }

  /* ---- 一次临摹 run 的生命周期（三个决策，全是纯的）----

     `trace.js` 只在某个下标**首次被 seen** 时把它记进 firstWrong。所以把一整段
     文本一次喂进一个**新建**的 session，每个字符都在它最终正确的样子下被首次
     看见——历史上的错全没了：

       连续会话（打错→退格→改对）   accuracy 0.9730  errors 1  backspaces 1
       新建 session 喂同样的终文本   accuracy 1.0000  errors 0  backspaces 0

     于是两条纪律：
       1. 一次 run 只持有**一个** session，跨模式切换存活（`reuseRun`）——
          否则按一次 `1` 再按一次 `3` 就能刷出 100%，而 bestAcc 走 Math.max
          且熬得过清空，那个她没打出来的成绩会**永久**留在进度里。
       2. 从一份非空草稿上接着打的 run 标成 `resumed`，**不写 progress**
          （`shouldSaveBest`），直到「重来」开一遍干净的。 */
  function newRun(progId, reference, typed) {
    var ref = String(reference == null ? '' : reference);
    return {
      progId: progId,
      reference: ref,
      session: trace().create(ref),
      resumed: String(typed == null ? '' : typed) !== '',
      saved: false
    };
  }

     不去重建 session。 */
  function reuseRun(run, progId, reference) {
    return !!run && run.progId === progId &&
           run.reference === String(reference == null ? '' : reference);
  }

  /* 这一遍的成绩该写进 progress 吗？只有"从零开始、这一遍真打完了、且还没记过"
     才算数。 */
  function shouldSaveBest(run, stats) {
    if (!run || run.resumed || run.saved) { return false; }
    if (!stats || !(stats.total > 0)) { return false; }
    return stats.correct >= stats.total;
  }

  /* applyFollowEnter(reference, value, pos) → { value, selStart, selEnd }
     「跟随影子」：Enter 直接跳到标准程序下一行的缩进位。默认关——缩进正是
     最该练的那一样，帮她跳等于把练习本身拿掉了。形状与 Editor.applyTab /
     applyEnter 一致（selEnd === selStart 恒成立，裁决 R32）。 */
  function applyFollowEnter(reference, value, pos) {
    var ref = String(reference == null ? '' : reference);
    var v = String(value == null ? '' : value);
    var before = v.slice(0, pos);
    var lineIdx = before.split('\n').length; /* 换行之后落到的那一行（0-based） */
    var refLines = ref.split('\n');
    var indent = ' '.repeat(leadSpaces(refLines[lineIdx] || ''));
    var at = pos + 1 + indent.length;
    return { value: before + '\n' + indent + v.slice(pos), selStart: at, selEnd: at };
  }

  /* ---- 分段临摹（第 5 期 chunks 设计）：四个纯决策，DOM 层只照着画 ----

     chunkSegments(cleanText, chunks) → null | [{ index, title, start, end, text, fromLine, toLine }]

     **段 = 从本段 `from` 那一行起、到下一段 `from` 之前为止的全部行**（最后一段到文本
     末尾，含结尾换行；第一段从偏移 0 起，文本开头若有空行也归它）。`to` 只作校验
     （本段最后一个非空行），**不参与切分**。

     为什么不是 `from…to` 闭区间（设计 C1）：段与段之间隔着空行，空行不唯一、当不了锚；
     闭区间会让那些空行不属于任何段，她把全部段打完、拼起来却少了几个空行，复制出去的
     程序与原文不同。「到下一段 from 为止」让段首尾相接、覆盖全文，**拼回去逐字节等于
     clean 文本**——主规格 §4.3「片段拼回去必须与原文逐字节相同」在段这一层的版本。
     python/scripts/gates/library.py 的 chunks_check 在裸 vm 里调的就是这一个函数，
     与门用 Python 独立算出的起止偏移逐段比。

     `chunks` 缺省 / 空数组 / 锚找不到 / 锚不唯一 / 顺序不对 → **null**，调用方走今天
     不分段的路径。失败时不抛：页面宁可退回不分段，也不能白屏；门保证真实数据走不到
     这一支。`fromLine` / `toLine`（1 起）只供显示「第 31–58 行」。 */
  function chunkSegments(cleanText, chunks) {
    if (!Array.isArray(chunks) || chunks.length === 0) { return null; }
    var text = String(cleanText == null ? '' : cleanText);
    var lines = text.split('\n');
    var starts = [];
    var pos = 0;
    for (var i = 0; i < lines.length; i++) {
      starts.push(pos);
      pos += lines[i].length + 1;
    }
    function uniqueLine(anchor) {
      if (typeof anchor !== 'string' || anchor === '') { return -1; }
      var hit = -1;
      for (var k = 0; k < lines.length; k++) {
        if (lines[k] === anchor) {
          if (hit !== -1) { return -1; }
          hit = k;
        }
      }
      return hit;
    }
    var froms = [], tos = [];
    for (var c = 0; c < chunks.length; c++) {
      var ch = chunks[c];
      if (!ch || typeof ch !== 'object') { return null; }
      var f = uniqueLine(ch.from), t2 = uniqueLine(ch.to);
      if (f === -1 || t2 === -1 || t2 < f) { return null; }
      if (c > 0 && f <= tos[c - 1]) { return null; }
      froms.push(f);
      tos.push(t2);
    }
    var out = [];
    for (var s = 0; s < chunks.length; s++) {
      var start = (s === 0) ? 0 : starts[froms[s]];
      var end = (s === chunks.length - 1) ? text.length : starts[froms[s + 1]];
      out.push({
        index: s,
        title: chunks[s].title,
        start: start,
        end: end,
        text: text.slice(start, end),
        fromLine: froms[s] + 1,
        toLine: tos[s] + 1
      });
    }
    return out;
  }

  /* 分段程序的临摹草稿：仍存在 Store 的 (id, 'trace') 键下（store.js 只存字符串，
     一行不改），值是 JSON `{"v":1,"seg":k,"typed":["…",…]}`，数组长度 = 段数。
     **不分段程序的草稿仍是今天的纯字符串**，这两个函数碰都不碰它。 */
  var CHUNK_DRAFT_V = 1;
  function encodeChunkDraft(seg, typed) {
    return JSON.stringify({ v: CHUNK_DRAFT_V, seg: seg, typed: typed });
  }

  /* decodeChunkDraft(raw, n) → { seg, typed } | null
     null 的意思是「没有分段草稿」，调用方从第 1 段空白开始。四种情形都是 null：
       · 不是字符串 / 空串（从没打过）；
       · 一个纯字符串——这一题是后来才加的 chunks，她以前按整段打过（JSON.parse 失败，
         或解析出来不是我们的形状：纯文本恰好是合法 JSON，比如一个数字，也算）；
       · 版本号不认识；
       · 数组长度与段数不同、元素不是字符串、seg 越界——作者改过分段，旧缓冲对不上段。
     「视为无」不等于「删掉」：旧字符串在她打下第一个字之前不被覆盖，那是调用方的纪律
     （mount 里的 chunk.legacy）。 */
  function decodeChunkDraft(raw, n) {
    if (typeof raw !== 'string' || raw === '') { return null; }
    var d;
    try { d = JSON.parse(raw); } catch (e) { return null; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) { return null; }
    if (d.v !== CHUNK_DRAFT_V) { return null; }
    if (!Array.isArray(d.typed) || d.typed.length !== n) { return null; }
    for (var i = 0; i < d.typed.length; i++) {
      if (typeof d.typed[i] !== 'string') { return null; }
    }
    var seg = d.seg;
    if (typeof seg !== 'number' || seg !== Math.floor(seg) || seg < 0 || seg >= n) { return null; }
    return { seg: seg, typed: d.typed.slice() };
  }

  /* chunkDoneFlags(segs, typed, stats) → boolean[]
     每段打完了吗。这一次页面生命里有过 run 的段按它的 stats 判（`correct >= total`，
     与 shouldSaveBest 同一口径）；还没有 run 的段（刷新后从草稿恢复、还没切过去）
     没有 stats 可看，就看缓冲是否**逐字等于**段的参考——那种段的 ✓ 只是显示，成绩
     本来就不会记（resumed）。 */
  function chunkDoneFlags(segs, typed, stats) {
    var out = [];
    for (var i = 0; i < (segs || []).length; i++) {
      var st = stats && stats[i];
      if (st) {
        out.push(st.total > 0 && st.correct >= st.total);
      } else {
        out.push(typeof (typed && typed[i]) === 'string' && typed[i] === segs[i].text &&
                 segs[i].text !== '');
      }
    }
    return out;
  }

  /* chunkTotals(statsList) → { total, correct, errors, elapsedMs, accuracy, cpm }
     全程汇总（设计 §2.2「总结算」）：
       accuracy = Σ(total − errors) / Σtotal
       cpm      = Σcorrect / Σ活跃时间（分钟）
     不是各段正确率的平均：一段 3 个字符打错 1 个，与一段 300 个字符打错 1 个，
     平均会把前者的 67% 与后者的 99.7% 一样看待。活跃时间为 0 时 cpm 为 0，
     与 trace.js 同一条「绝不产出 Infinity」。写进 progress 的仍是
     `{ bestAcc, bestCpm, at }`——schema 不变，不需要迁移。 */
  function chunkTotals(statsList) {
    var total = 0, correct = 0, errors = 0, ms = 0;
    (statsList || []).forEach(function (st) {
      if (!st) { return; }
      total += Number(st.total) || 0;
      correct += Number(st.correct) || 0;
      errors += Number(st.errors) || 0;
      ms += Number(st.elapsedMs) || 0;
    });
    return {
      total: total,
      correct: correct,
      errors: errors,
      elapsedMs: ms,
      accuracy: total > 0 ? (total - errors) / total : 1,
      cpm: ms > 0 ? correct / (ms / 60000) : 0
    };
  }

  /* chunkTailFill(reference, typed) → string | null

     段尾空行自动补齐（评审 I1，控制方裁决）。「段间空行归前一段」（C1）让第 1、2 段的参考
     以 `\n\n\n` 结尾——影子层在最后一个可见行之后什么都不画，逐键打的人**看不见也打不到**
     那两个空行（Enter 的自动缩进还会在空行里留下几个空格，又是一处首次错误），于是 ✓、
     「下一段」、全程成绩全都挂在一个她做不到的条件上。

     判据：她打的内容以「参考去掉尾部换行」（body）开头，余下的部分由**至少一个**换行与自动
     缩进留下的空格组成，且换行数不超过参考尾部的换行数——即她打完了本段最后一个非空行**并按了
     Enter**。此时返回**完整的段参考**，调用方用它替换缓冲；否则 null。
     为什么非要那一下 Enter（不在「刚好等于 body」时就补）：打完一行之后按 Enter 是手的惯性；
     若先补齐，她那一下 Enter 就会多出一行（「你比参考多了 1 行」、复制出去多一个空行）。
     不分段时整段程序的结尾换行同样要她自己按，口径一致。空行不是她的练习，
     补进去之后各段拼回去仍逐字节等于 clean。trace.js 不改：补齐后的缓冲照常 update。
     调用方只在**插入**（缓冲变长）时调它：删除时也补，退格就删不掉那几个空行了。 */
  function chunkTailFill(reference, typed) {
    var ref = String(reference == null ? '' : reference);
    var s = String(typed == null ? '' : typed);
    var body = ref.replace(/\n+$/, '');
    if (body === ref || body === '') { return null; }
    if (s.length < body.length || s.slice(0, body.length) !== body) { return null; }
    var rest = s.slice(body.length);
    if (!/^(\n *)+$/.test(rest)) { return null; }
    var nl = rest.split('\n').length - 1;
    if (nl > ref.length - body.length) { return null; }
    return ref;
  }

  /* chunkResumedAny(runs, typed) → boolean
     全程成绩为什么不记，要**说出来**（评审 I2）：某段的 run 是 resumed，**或者**某段缓冲
     非空却还没有 run（刷新后从草稿恢复、还没切过去——那段的历史已经不在任何 session 里，
     shouldSaveChunked 也因为它没有 run 而不写）。任一成立，全程就不计，页面要写明。 */
  function chunkResumedAny(runs, typed) {
    var r = runs || [], ty = typed || [];
    var n = Math.max(r.length, ty.length);
    for (var i = 0; i < n; i++) {
      if (r[i] && r[i].resumed) { return true; }
      if (!r[i] && typeof ty[i] === 'string' && ty[i] !== '') { return true; }
    }
    return false;
  }

  /* shouldSaveChunked(runs, stats, n) → boolean
     全程成绩该写进 progress 吗？**N 段都在干净的 run 里打完**才算：
       · 每一段都有 run，且没有一段 resumed（某段的 run 创建时缓冲非空）——与不分段时
         「接着草稿打的这一遍不计」同一条纪律，任何一段洗过历史，全程就不可信；
       · 每一段的 stats 都 `correct >= total`；
       · 这一组 run 还没全部记过（某段「重来」开了新 run，这一组就是新的一组）。
     调用方写完之后把每个 run 标 saved，同一组不重复落盘。 */
  function shouldSaveChunked(runs, stats, n) {

    var fresh = false;
    for (var i = 0; i < n; i++) {
      var run = runs[i], st = stats[i];
      if (!run || run.resumed) { return false; }
      if (!st || !(st.total > 0) || st.correct < st.total) { return false; }
      if (!run.saved) { fresh = true; }
    }
    return fresh;
  }

    '.py-board{padding:0 7px;border-radius:999px;border:1px solid var(--panel-line,rgba(148,163,184,.3));',
    '  color:var(--ui-bright,#e2e8f0)}',
    '.py-tag{padding:0 6px;border-radius:4px;background:rgba(148,163,184,.12);',
    '  font-family:var(--font-code,ui-monospace,monospace);font-size:11px}',
    '.py-note{margin:0 0 9px}',
    '.py-note.py-anchor{background:rgba(45,212,234,.12);border-radius:5px;padding:3px 6px}',
    '.py-note-at{display:block;font-family:var(--font-code,ui-monospace,monospace);font-size:11px;',
    '  color:var(--ui-slate,#9fb0c8);white-space:pre;overflow-x:auto}',
    /* 语法高亮：与 Editor.highlight 的 tok-<type> 一一对应 */
    '.tok-keyword{color:#c4b5fd}.tok-string,.tok-fstring{color:#86efac}.tok-number{color:#fbbf24}',
    '.tok-comment{color:#64748b;font-style:italic}.tok-op,.tok-punct{color:#94a3b8}',
    '.tok-builtin{color:#67e8f9}.tok-softkw{color:#a5b4fc}.tok-name{color:#e2e8f0}',
    '.tok-decorator{color:#bef264}',
    /* ---- 分段临摹的段条：永不换行（设计 §6.2）。窄屏不靠调常量，而是让标题**可以缩**：
       按钮与说明文字 min-width:0 + 省略号，上一段 / 下一段两个按钮 flex:0 0 auto 不缩、排在最前。
       它是顶栏下面独立的一行，所以挤不掉顶栏里现有的按钮。 ---- */
    '.py-chunkbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;',
    '  padding:5px 12px;border-bottom:1px solid var(--panel-line,rgba(148,163,184,.16))}',
    '.py-chunk-label{flex:0 1000 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.py-chunk-seg{flex:0 1 auto;min-width:0;max-width:16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
    '.py-chunk-nav{flex:0 0 auto;white-space:nowrap}',
    '.py-chunk-go{color:#05070d;background:var(--py-accent);border-color:var(--py-accent)}',
    '@media (max-width:880px){.py-picker{flex-basis:170px}.py-panel{display:none}}'
  ].join('\n');

  function ensureStyle(doc) {
    if (doc.getElementById(STYLE_ID)) { return; }
    var s = doc.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    (doc.head || doc.documentElement).appendChild(s);
  }

  var ACCENTS = { cyan: 1, rose: 1, violet: 1, emerald: 1, orange: 1 };

  /* mount({ root, programs, lang, accent }) → controller
     controller: { setMode, setProgram, setLang, destroy } */
  function mount(opts) {
    opts = opts || {};
    var rootEl = opts.root;
    if (!rootEl || typeof rootEl.appendChild !== 'function' || !rootEl.ownerDocument) {
      throw new Error('PyInteract.mount({ root, programs, lang }) 需要一个真实的 DOM 节点作为 root；' +
                      '纯函数层（filterPrograms / copyPayload / …）不需要 DOM，可以单独调用。');
    }
    var doc = rootEl.ownerDocument;
    var win = doc.defaultView;
    var St = store();

    /* ---- 小工具 ---- */
    function h(tag, cls, text) {
      var e = doc.createElement(tag);
      if (cls) { e.className = cls; }
      if (text !== undefined && text !== null) { e.textContent = String(text); }
      return e;
    }
    function wipe(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
    function btn(cls, text, onClick) {
      var b = h('button', cls, text);
      b.type = 'button';
      b.addEventListener('click', onClick);
      return b;
    }

    /* 存储不可用 / 配额满 / schema 迁移：顶部**持久横幅**，不是 toast、不自动消失。
       她以为存住了而其实没有，是这套东西最坏的失败方式（spec §4.5）。

       注册必须排在**第一次碰存储之前**（下面的 getPrefs 就会碰）：Store 的
       `notified` 标志保证回调最多响一次，第一次读写若在注册之前失败，这条
       回调就永远不会被调用，横幅永远不出现——一个只在存储真的坏掉时才暴露
       的顺序 bug。建壳之后还会再用 available() 兜一次底（同一页里若有别的
       代码先触发过 notify，回调同样不会再响）。 */
    var bannerKey = null;
    St.onUnavailable(function (reason) {
      bannerKey = reason === 'quota' ? 'bannerQuota'
                : reason === 'migrated' ? 'bannerMigrated' : 'bannerNone';
      paintBanner();
    });

    /* ---- 状态 ---- */
    var PROGRAMS = (opts.programs || []).slice();
    var prefs = St.getPrefs() || {};
    var S = {
      lang: (opts.lang === 'en') ? 'en' : 'zh',
      mode: 'read',
      progId: PROGRAMS.length ? PROGRAMS[0].id : null,
      filters: (prefs.filters && typeof prefs.filters === 'object') ? prefs.filters : {},
      compareId: null,
      answers: {},
      given: {},
      hintTier: {},
      typed: '',
      alpha: (typeof prefs.alpha === 'number') ? prefs.alpha : 1,
      strictness: (prefs.strictness === 'loose' || prefs.strictness === 'block') ? prefs.strictness : 'mark',
      followShadow: prefs.followShadow === true,
      anchorLine: -1,
      /* 当前这一遍临摹的 run（{progId, reference, session, resumed, saved}）。
         挂在 S 上而不是 traceUI 上，模式来回切时才不会被重建，见 traceRun()。 */
      run: null,
      /* 分段临摹的状态；当前程序没有 chunks（或 chunkSegments 解析失败）时为 null，
         所有分段代码都在 `if (S.chunk)` 分支里，null 时走的是今天原样的代码（设计 §2.4）。
         { progId, segs, seg, typed: string[], runs: run[], stats: stats[], legacy }
           seg     当前段（0 起）；S.typed 始终是 typed[seg] 的镜像，下游代码不必分支
           runs    每段一个 run（一段 = 一个 reference = 一个 Trace session），跨模式存活
           stats   每段最近一次 update 的 stats，全程汇总用
           legacy  存储里是一份解不出来的旧草稿（纯字符串 / 段数对不上）：在她打下第一个字
                   之前一律不写存储，不因为打开页面、切一下段就把她的东西覆盖掉 */
      chunk: null
    };

    /* ---- 骨架 ---- */
    ensureStyle(doc);
    wipe(rootEl);
    rootEl.classList.add('py-root');
    if (opts.accent && ACCENTS[opts.accent]) {
      rootEl.style.setProperty('--py-accent', 'var(--trace-' + opts.accent + ')');
    }

    var bannerSlot = h('div', 'py-banner-slot');
    var body = h('div', 'py-body');
    var picker = h('aside', 'py-picker');
    var main = h('main', 'py-main');
    var topBar = h('div', 'py-bar');
    var stage = h('div', 'py-stage');
    var bottom = h('div', 'py-bottom');
    var panel = h('aside', 'py-panel');
    main.appendChild(topBar);
    main.appendChild(stage);
    main.appendChild(bottom);
    body.appendChild(picker);
    body.appendChild(main);
    body.appendChild(panel);
    rootEl.appendChild(bannerSlot);
    rootEl.appendChild(body);

    function paintBanner() {
      if (!bannerSlot) { return; } /* 回调可能在建壳之前就响 */
      wipe(bannerSlot);
      if (!bannerKey) { return; }
      bannerSlot.appendChild(h('div', 'py-banner', t(bannerKey, S.lang)));
    }
    if (!St.available() && !bannerKey) { bannerKey = 'bannerNone'; }

    var toastTimer = null;
    function toast(text) {
      var el = h('div', 'py-toast', text);
      stage.appendChild(el);
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () {
        if (el.parentNode) { el.parentNode.removeChild(el); }
      }, 1800);
    }

    /* ---- 当前程序 ---- */
    function current() {
      for (var i = 0; i < PROGRAMS.length; i++) {
        if (PROGRAMS[i].id === S.progId) { return PROGRAMS[i]; }
      }
      return null;
    }
    /* 读 / 临摹 / 复制看到的源码一律是 clean 过的（R16） */
    function cleanSource(p) {
      return p ? exercise().clean(typeof p.source === 'string' ? p.source : '') : '';
    }

    /* 当前程序的段；没有 chunks 时**连 clean 都不算**，直接 null——不分段的程序走的
       每一行都与今天相同。clean 抛错（源码指令不成对）也退回不分段：挖空模式自己会把
       那个错误摆到舞台上，这里不替它在装配期炸整页。 */
    function segmentsOf(p) {
      if (!p || !Array.isArray(p.chunks) || !p.chunks.length) { return null; }
      try { return chunkSegments(cleanSource(p), p.chunks); } catch (e) { return null; }
    }

    /* ---- 草稿 ---- */
    function loadDrafts() {
      var p = current();
      S.answers = {};
      S.given = {};
      S.hintTier = {};
      S.typed = '';
      S.chunk = null;
      if (!p) { return; }
      var raw = St.getDraft(p.id, 'blank');
      if (raw) {
        try {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') { S.answers = parsed; }
        } catch (e) { /* 草稿坏了就当没有，不拿一个异常把整页拖垮 */ }
      }
      var typed = St.getDraft(p.id, 'trace');
      /* 分段程序：草稿是 JSON（decodeChunkDraft）。S.chunk 整个重建——连同各段的 run：
         loadDrafts 的三个调用点（装配、换题、清空打到了当前这一题）本来就都作废当前
         这一遍，与下面那条「不碰 S.run」的纪律不冲突，只是 run 住的地方不同。 */
      var segs = segmentsOf(p);
      if (segs) {
        var d = decodeChunkDraft(typed, segs.length);
        var arr = [];
        for (var i = 0; i < segs.length; i++) { arr.push(d ? d.typed[i] : ''); }
        S.chunk = {
          progId: p.id, segs: segs, seg: d ? d.seg : 0, typed: arr, runs: [], stats: [],
          legacy: !d && typeof typed === 'string' && typed !== ''
        };
        S.typed = arr[S.chunk.seg];
        return;
      }
      if (typeof typed === 'string') { S.typed = typed; }
      /* ⚠ 这里**不碰 S.run**。loadDrafts 是共享的，而"这一遍临摹作不作废"
         只有真正换了题 / 真正清掉了当前这一题的草稿才成立：清别人的草稿时
         照样重置，会把一遍从未被打断的临摹标成 resumed（成绩不计），
         而"重来"又会丢掉她真实的进度。重置放在调用方，各自说明理由。 */
    }
    function saveBlank() { if (S.progId) { St.scheduleDraft(S.progId, 'blank', JSON.stringify(S.answers)); } }
    function saveTyped() {
      if (!S.progId) { return; }
      if (S.chunk) {
        /* 解不出来的旧草稿还在存储里、她还一个字没打：不写（见 S.chunk.legacy）。 */
        if (S.chunk.legacy) { return; }
        St.scheduleDraft(S.progId, 'trace', encodeChunkDraft(S.chunk.seg, S.chunk.typed));
        return;
      }
      St.scheduleDraft(S.progId, 'trace', S.typed);
    }
    /* patchProgress / setPrefs 都是**顶层键浅合并**：给的必须是完整子对象（R9）。 */
    function savePrefs() {
      St.setPrefs({
        alpha: S.alpha,
        strictness: S.strictness,
        followShadow: S.followShadow,
        filters: S.filters
      });
    }

    /* ================= 程序选择器 ================= */
    var LINE_CAPS = [0, 20, 40, 80];

    function toggleFilter(dim, value) {
      var list = asList(S.filters[dim]).slice();
      var at = list.indexOf(value);
      if (at === -1) { list.push(value); } else { list.splice(at, 1); }
      S.filters[dim] = list;
      savePrefs();
      renderPicker();
    }

    function chipRow(dim, values, labelOf) {
      var wrap = h('div', 'py-chips');
      values.forEach(function (v) {
        var on = asList(S.filters[dim]).indexOf(v) !== -1;
        var c = btn('py-chip', labelOf(v), function () { toggleFilter(dim, v); });
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        wrap.appendChild(c);
      });
      return wrap;
    }

    function renderPicker() {
      wipe(picker);

      var fs = h('div', 'py-sec');
      fs.appendChild(h('h4', null, t('level', S.lang)));
      fs.appendChild(chipRow('level', LEVELS, function (v) { return 'L' + v; }));
      fs.appendChild(h('h4', null, t('kind', S.lang)));
      fs.appendChild(chipRow('kind', KINDS, function (v) { return kindLabel(v, S.lang); }));
      fs.appendChild(h('h4', null, t('boards', S.lang)));
      fs.appendChild(chipRow('boards', BOARDS, function (v) { return v; }));
      fs.appendChild(h('h4', null, t('filters', S.lang)));
      var caps = h('div', 'py-chips');
      LINE_CAPS.forEach(function (n) {
        var on = (Number(S.filters.maxLines) || 0) === n;
        var c = btn('py-chip', n === 0 ? t('anyLength', S.lang) : ts('maxLines', S.lang, [n]), function () {
          S.filters.maxLines = n;
          savePrefs();
          renderPicker();
        });
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        caps.appendChild(c);
      });
      fs.appendChild(caps);
      picker.appendChild(fs);

      var list = h('ul', 'py-list');
      var shown = filterPrograms(PROGRAMS, S.filters);
      if (!shown.length) {
        list.appendChild(h('li', 'py-item', t('nothing', S.lang)));
      }
      shown.forEach(function (p) {
        var li = h('li', 'py-item');
        li.setAttribute('aria-current', p.id === S.progId ? 'true' : 'false');
        var tx = h('div', 'py-item-t', pick(p.title, S.lang) || p.id);
        var meta = h('span', 'py-item-m',
          'L' + p.level + ' · ' + kindLabel(p.kind, S.lang) + ' · ' + ts('lines', S.lang, [p.lines]));
        tx.appendChild(meta);
        li.appendChild(tx);
        li.addEventListener('click', function () { setProgram(p.id); });
        li.appendChild(btn('py-x', '⋯', function (ev) {
          ev.stopPropagation();
          askClear('program', p.id);
        }));
        list.appendChild(li);
      });
      picker.appendChild(list);

      var tools = h('div', 'py-sec');
      var row = h('div', 'py-chips');
      row.appendChild(btn('py-btn', t('clearPage', S.lang), function () { askClear('page', null); }));
      row.appendChild(btn('py-btn', t('clearAll', S.lang), function () { askClear('all', null); }));
      tools.appendChild(row);
      picker.appendChild(tools);
    }

    /* ================= 三级清空 ================= */
    function askClear(scope, progId) {
      var ids = clearScope(scope, PROGRAMS, progId || S.progId);
      /* 二次确认里的条数是 Store.countRecords 的**真实条数**，不是估的。
         两处措辞上的诚实，都是因为这个数字与"这一级实际清掉什么"并不重合：
           · countRecords 数的是 draft:blank + draft:trace + progress 三种键，
             而单题 / 本页两级只清 draft（进度是"她已经会了"的记录，spec §4.5
             明确不连坐），所以文案说"其中的草稿会被清除、进度保留"。
           · 'all' 这一级本页列举不出别的页的 id，所以只能数出本页的那一部分，
             文案就明说"本页 N 条，其他页的记录也会一并清除"——报一个看上去
             精确、实际只数了本页的数字，是在撒谎。 */
      var n = St.countRecords(ids === null ? PROGRAMS.map(function (p) { return p.id; }) : ids);
      var key = scope === 'program' ? 'confirmOne' : scope === 'page' ? 'confirmPage' : 'confirmAll';
      var ask = (win && typeof win.confirm === 'function') ? win.confirm : null;
      if (ask && !ask.call(win, ts(key, S.lang, [n]))) { return; }
      /* 动手的次序（先 flush 再清）在 clearRecords 里，那里测得到。 */
      clearRecords(St, scope, ids);
      /* 只有清到当前这一题时才重读草稿、作废当前这一遍；清别人的不动她。 */
      if (clearHitsCurrent(ids, S.progId)) {
        loadDrafts();
        S.run = null;
      }
      renderAll();
      toast(t('cleared', S.lang));
    }

    /* ================= 代码文档（读模式 / 对照）================= */
    function noteLineIndex(p, lines) {
      /* lineNotes 用整行原文当锚（不是行号）：找到第一条逐字相同的行。 */
      var map = {};
      (p && p.lineNotes ? p.lineNotes : []).forEach(function (note, i) {
        var at = String(note.at == null ? '' : note.at);
        for (var k = 0; k < lines.length; k++) {
          if (lines[k] === at) { map[k] = i; return; }
        }
      });
      return map;
    }

    function renderDoc(p, src, otherLines) {
      var docEl = h('div', 'py-doc');
      var lines = src.split('\n');
      var notes = noteLineIndex(p, lines);
      var frs = editor().highlight(src);

      var rows = [];
      var makeRow = function (i) {
        var row = h('div', 'py-line');
        var num = h('div', 'py-num', String(i + 1));
        if (notes[i] !== undefined) {
          num.className = 'py-num py-has-note';
          num.textContent = (i + 1) + ' ●';
          num.addEventListener('click', function () {
            S.anchorLine = i;
            renderPanel();
            highlightAnchor();
          });
        }
        var code = h('div', 'py-code');
        row.appendChild(num);
        row.appendChild(code);
        if (otherLines && otherLines[i] !== lines[i]) { row.className = 'py-line py-diff'; }
        docEl.appendChild(row);
        rows.push({ row: row, code: code });
        return code;
      };

      var li = 0;
      var code = makeRow(0);
      frs.forEach(function (f) {
        var parts = f.text.split('\n');
        for (var i = 0; i < parts.length; i++) {
          if (i > 0) { li++; code = makeRow(li); }
          if (parts[i] !== '') { code.appendChild(h('span', f.cls, parts[i])); }
        }
      });
      /* 空行也要有高度，否则行号与代码错位 */
      rows.forEach(function (r) { if (!r.code.firstChild) { r.code.appendChild(h('span', 'tok-plain', '​')); } });
      docEl.__rows = rows;
      return docEl;
    }

    function highlightAnchor() {
      var docs = stage.querySelectorAll('.py-doc');
      for (var d = 0; d < docs.length; d++) {
        var rows = docs[d].__rows || [];
        for (var i = 0; i < rows.length; i++) {
          var on = (i === S.anchorLine);
          var cls = rows[i].row.className.replace(/ ?py-anchor/, '');
          rows[i].row.className = on ? (cls + ' py-anchor') : cls;
          if (on && rows[i].row.scrollIntoView) {
            rows[i].row.scrollIntoView({ block: 'nearest' });
          }
        }
      }
    }

    function renderRead() {
      var p = current();
      var docs = h('div', 'py-docs');
      var mine = cleanSource(p);
      var other = null;
      if (S.compareId) {
        var q = null;
        PROGRAMS.forEach(function (x) { if (x.id === S.compareId) { q = x; } });
        if (q) { other = { prog: q, src: cleanSource(q) }; }
      }
      var otherLines = other ? other.src.split('\n') : null;
      docs.appendChild(renderDoc(p, mine, otherLines));
      if (other) {
        docs.appendChild(renderDoc(other.prog, other.src, mine.split('\n')));
      }
      stage.appendChild(docs);
    }

    /* ================= 挖空模式 ================= */
    var blankInputs = {};

    function renderBlank() {
      var p = current();
      blankInputs = {};
      var parsed;
      try {
        parsed = exercise().parse(typeof p.source === 'string' ? p.source : '');
      } catch (e) {
        stage.appendChild(h('div', 'py-msg py-bad-msg', String(e && e.message ? e.message : e)));
        return;
      }
      var byId = {};
      parsed.blanks.forEach(function (b) { byId[b.id] = b; });

      var docEl = h('div', 'py-doc');
      var lines = parsed.stripped.split('\n');
      var badge = 0;

      lines.forEach(function (lineText, i) {
        var entry = parsed.lineMap[i];
        var row = h('div', 'py-line');
        if (entry && entry.kind === 'blank') {
          badge++;
          var b = byId[entry.blankId];
          row.appendChild(h('div', 'py-badge', '①②③④⑤⑥⑦⑧⑨'.charAt(badge - 1) || String(badge)));
          row.appendChild(blankBox(b));
        } else {
          row.appendChild(h('div', 'py-num', String(i + 1)));
          var code = h('div', 'py-code');
          editor().highlight(lineText).forEach(function (f) {
            code.appendChild(h('span', f.cls, f.text));
          });
          if (!code.firstChild) { code.appendChild(h('span', 'tok-plain', '​')); }
          row.appendChild(code);
        }
        docEl.appendChild(row);
      });
      stage.appendChild(docEl);
    }

    function blankBox(b) {
      var box = h('div', 'py-blankbox');
      var ta = doc.createElement('textarea');
      ta.className = 'py-blank-in';
      ta.spellcheck = false;
      ta.rows = Math.max(1, String(b.body).split('\n').length);
      /* 缺省值是这个空的缩进本身：Exercise.merge 拿她这一份原样替换回源码，
         少了那几格粘进 PyCharm 就是 IndentationError（Judge 看不见绝对缩进）。 */
      ta.value = (S.answers[b.id] !== undefined && S.answers[b.id] !== null)
        ? S.answers[b.id] : b.indent;
      if (S.given[b.id]) { ta.className += ' py-given'; }

      var msg = h('div', 'py-msg');

      ta.addEventListener('input', function () {
        S.answers[b.id] = ta.value;
        /* 她一动手，"已填入标准答案"这个标记就不再成立——留着的话，一个她
           自己打出来的空会一直灰着显示"不计完成"。 */
        if (S.given[b.id]) {
          delete S.given[b.id];
          ta.className = ta.className.replace(/ ?py-given/, '');
          msg.className = 'py-msg';
          msg.textContent = '';
        }
        saveBlank();
      });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          /* 挖空模式 Tab 在空与空之间跳（spec §3.3）——临摹模式的 Tab 才插四格。 */
          e.preventDefault();
          jumpBlank(b.id, e.shiftKey ? -1 : 1);
          return;
        }
        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          var r = editor().applyEnter(ta.value, ta.selectionStart);
          ta.value = r.value;
          ta.setSelectionRange(r.selStart, r.selEnd);
          ta.rows = Math.max(1, ta.value.split('\n').length);
          S.answers[b.id] = ta.value;
          saveBlank();
        }
      });

      var bar = h('div', 'py-blank-bar');
      var hintMsg = h('div', 'py-msg');
      bar.appendChild(btn('py-btn', t('hint', S.lang) + ' (L' + b.level + ')', function () {
        var tier = (S.hintTier[b.id] || 0) + 1;
        S.hintTier[b.id] = Math.min(tier, b.level);
        hintMsg.textContent = hintAt(b, S.hintTier[b.id], S.lang);
        noteProgress();
      }));
      bar.appendChild(btn('py-btn', t('giveUp', S.lang), function () {
        S.answers[b.id] = b.body;
        S.given[b.id] = true;
        ta.value = b.body;
        ta.className = 'py-blank-in py-given';
        ta.rows = Math.max(1, b.body.split('\n').length);
        msg.className = 'py-msg';
        msg.textContent = t('given', S.lang);
        saveBlank();
      }));
      bar.appendChild(btn('py-btn', t('check', S.lang), function () { checkBlank(b); }));

      box.appendChild(ta);
      box.appendChild(bar);
      box.appendChild(hintMsg);
      box.appendChild(msg);
      blankInputs[b.id] = { ta: ta, msg: msg, blank: b };
      return box;
    }

    function jumpBlank(fromId, dir) {
      var ids = Object.keys(blankInputs);
      var at = ids.indexOf(fromId);
      var next = ids[at + dir];
      if (next && blankInputs[next]) { blankInputs[next].ta.focus(); }
    }

    function checkBlank(b) {
      var ui = blankInputs[b.id];
      if (!ui) { return null; }
      var fb = blankFeedback(ui.ta.value, b.body, S.lang);
      ui.msg.className = 'py-msg ' + (fb.ok ? 'py-ok-msg' : 'py-bad-msg');
      ui.msg.textContent = fb.message;
      ui.ta.className = 'py-blank-in' + (S.given[b.id] ? ' py-given' : '') + (fb.ok ? ' py-okk' : ' py-badd');
      if (!fb.ok) {
        /* 光标送到出错的位置——不给答案，只指路（spec §3.3） */
        ui.ta.focus();
        var at = Math.max(0, Math.min(fb.caret, ui.ta.value.length));
        ui.ta.setSelectionRange(at, at);
      }
      return fb;
    }

    function checkAllBlanks() {
      var ids = Object.keys(blankInputs);
      var allOk = ids.length > 0;
      ids.forEach(function (id) {
        var fb = checkBlank(blankInputs[id].blank);
        if (!fb || !fb.ok || S.given[id]) { allOk = false; }
      });
      if (allOk) { toast(t('blankAllOk', S.lang)); }
      noteProgress(allOk);
      return allOk;
    }

    function noteProgress(done) {
      if (!S.progId) { return; }
      var used = 0;
      Object.keys(S.hintTier).forEach(function (k) { used += S.hintTier[k]; });
      /* 顶层键浅合并：blank 这个子对象整体替换，调用方给完整的一份（R9）。 */
      var prev = St.getProgress(S.progId) || {};
      var wasDone = !!(prev.blank && prev.blank.done);
      St.patchProgress(S.progId, {
        blank: { done: done === true || wasDone, hintsUsed: used, at: Date.now() }
      });
    }

    /* ================= 影子临摹 ================= */
    var traceUI = null;

    /* 一次「run」= 一个 Trace session，**跨模式切换存活**。

       为什么不能在每次 renderTrace 里新建：`trace.js` 只在某个下标**首次被
       seen** 时记进 firstWrong，而重建后的 session 是被整段 `S.typed` 一次
       喂进去的——每个字符都在它**最终正确的样子**下被首次看见，于是
         连续会话（打错→退格→改对）  accuracy 0.9730  errors 1
         重建 session（同样的最终文本）accuracy 1.0000  errors 0  backspaces 0
       按一次 `1` 再按一次 `3` 就能把一个她没打出来的 100% 经 bestAcc 的
       Math.max **永久**写进进度（清空也删不掉）。

       从一份已有草稿接着打的 run 同样洗掉了历史，所以标成 resumed：统计照显
       （并写明"这一遍不计"），但**不写 progress**，直到「重来」开一遍干净的。 */
    function traceRun(reference) {
      if (S.chunk) {
        /* 分段：每段一个 run，按 progId + 段 reference 判复用（设计 §2.2「模式切换」）。
           某段的 run 创建时它的缓冲非空，这一段就是 resumed。 */
        var k = S.chunk.seg;
        var r = S.chunk.runs[k];
        if (reuseRun(r, S.progId, reference)) { return r; }
        S.chunk.runs[k] = newRun(S.progId, reference, S.typed);
        S.chunk.stats[k] = null;
        return S.chunk.runs[k];
      }
      if (reuseRun(S.run, S.progId, reference)) { return S.run; }
      S.run = newRun(S.progId, reference, S.typed);
      return S.run;
    }

    /* 切到第 k 段。缓冲在 S.chunk.typed 里，切走不丢、切回来原样还在；段号跟着草稿
       落盘，刷新后回到同一段（设计 §6.3）。 */
    function setChunk(k) {
      if (!S.chunk || k < 0 || k >= S.chunk.segs.length || k === S.chunk.seg) {
        /* 点的是当前段：焦点也要还给输入层——留在按钮上的话，她接着打 1 / 2 / 3 / [ / ]
           会切模式、换题（评审 m2）。 */
        if (traceUI && traceUI.input.focus) { traceUI.input.focus(); }
        return;
      }
      S.chunk.typed[S.chunk.seg] = S.typed;
      S.chunk.seg = k;
      S.typed = S.chunk.typed[k];
      saveTyped();
      renderTopBar();
      renderStage();
      renderBottom();
      paintTrace();
      if (traceUI && traceUI.input.focus) { traceUI.input.focus(); }
    }

    function restartTrace() {
      if (S.chunk) {
        /* 「重来」只重来**当前段**（设计 C5）：清这一段的缓冲、下一次 traceRun 开一个
           新 session。整题重来走已有的三级清空。 */
        var k = S.chunk.seg;
        S.typed = '';
        S.chunk.typed[k] = '';
        S.chunk.runs[k] = null;
        S.chunk.stats[k] = null;
        saveTyped();
        renderTopBar();
        renderStage();
        renderBottom();
        paintTrace();
        return;
      }
      S.typed = '';
      saveTyped();
      S.run = null;   /* 下一次 traceRun() 开一遍干净的：resumed 为假，成绩算数 */
      renderStage();
      renderBottom();
      paintTrace();
    }

    function renderTrace() {
      var p = current();
      /* 分段：参考只是**当前段**（设计 C3）。三层坐标系从段首起算，与不分段时完全同构，
         trace.js 一行不改——三层对齐、逐行同步、首次即正确、空闲剔除都原样作用在这一段上。 */
      var reference = S.chunk ? S.chunk.segs[S.chunk.seg].text : cleanSource(p);
      var run = traceRun(reference);

      var shadow = h('pre', 'py-layer py-shadow');
      var typedLayer = h('pre', 'py-layer py-typed');
      var input = doc.createElement('textarea');
      input.className = 'py-layer py-input';
      input.spellcheck = false;
      input.autocapitalize = 'off';
      input.autocomplete = 'off';
      input.setAttribute('autocorrect', 'off');
      input.value = S.typed;

      editor().highlight(reference).forEach(function (f) {
        shadow.appendChild(h('span', f.cls, f.text));
      });
      shadow.style.opacity = String(S.alpha);

      stage.appendChild(shadow);
      stage.appendChild(typedLayer);
      stage.appendChild(input);

      /* 拒绝一次按键时说明原因的那一行；不占布局（绝对定位在舞台底部）。 */
      var blockNote = h('div', 'py-blocknote');
      blockNote.hidden = true;
      stage.appendChild(blockNote);

      traceUI = { shadow: shadow, typed: typedLayer, input: input,
                  run: run, reference: reference, blockNote: blockNote, blockTimer: null };

      /* 同步滚动由顶层 textarea 的 scroll 驱动，另外两层用 transform：
         translate 不像 scrollTop 那样有子像素抖动，三层才不会在滚动时错开。 */
      input.addEventListener('scroll', function () {
        var tr = 'translate(' + (-input.scrollLeft) + 'px,' + (-input.scrollTop) + 'px)';
        shadow.style.transform = tr;
        typedLayer.style.transform = tr;
      });

      input.addEventListener('beforeinput', function (e) {
        if (S.strictness !== 'block') { return; }
        if (e.inputType !== 'insertText' || e.data == null || e.data.length !== 1) { return; }
        var s = input.selectionStart, en = input.selectionEnd;
        var next = input.value.slice(0, s) + e.data + input.value.slice(en);
        if (charMatches(reference, next, s)) { return; }
        e.preventDefault();
        /* 拒绝必须**看得见**：自动缩进会把她推进"参考这一行早就结束了"的
           死角，那时她打什么都被拒，而屏幕上什么都没有——与页面坏掉无法区分。 */
        showBlocked(blockedHint(reference, next, s, S.lang));
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' || e.key === 'Delete') { run.session.noteBackspace(); return; }
        if (e.key === 'Tab') {
          e.preventDefault();
          var r = editor().applyTab(input.value, input.selectionStart, input.selectionEnd);
          input.value = r.value;
          input.setSelectionRange(r.selStart, r.selEnd);
          onTyped();
          return;
        }
        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          var r2 = S.followShadow
            ? applyFollowEnter(reference, input.value, input.selectionStart)
            : editor().applyEnter(input.value, input.selectionStart);
          input.value = r2.value;
          /* applyTab 与 applyEnter 同形（selEnd === selStart 恒成立），
             两种按键都能直接 setSelectionRange，不必分支（裁决 R32）。 */
          input.setSelectionRange(r2.selStart, r2.selEnd);
          onTyped();
        }
      });

      input.addEventListener('input', onTyped);
      paintTrace();
    }

    /* 拒绝反馈：文字说明 + 顶层输入框闪一下红边。文字留到下一次按键或 1.6 秒
       后才撤，闪光只是把视线拉过去。 */
    function showBlocked(text) {
      if (!traceUI) { return; }
      var note = traceUI.blockNote;
      note.textContent = text;
      note.hidden = false;
      traceUI.input.classList.add('py-blocked');
      if (traceUI.blockTimer) { clearTimeout(traceUI.blockTimer); }
      /* 回调读的是**外层的** traceUI：1.6 秒之内她完全可能切走模式或换一题，
         那时它已经是 null。clearFlash 自带守卫，安全返回。 */
      traceUI.blockTimer = setTimeout(function () { clearFlash(traceUI); }, 1600);
    }

    /* 拆掉当前这一层临摹 UI：**先停掉延时回调**，再置空。只加回调里的守卫也
       能不崩，但那样会留下一个"还会醒来、醒来却无事可做"的定时器；两件事一起
       消灭，才不用去想它醒来时世界长什么样。 */
    function teardownTrace() {
      if (traceUI && traceUI.blockTimer) { clearTimeout(traceUI.blockTimer); }
      traceUI = null;
    }

    function onTyped() {
      if (!traceUI) { return; }
      var before = S.typed;
      S.typed = traceUI.input.value;
      if (S.chunk) {
        /* 段尾空行自动补齐（见 chunkTailFill）：只在插入时。 */
        if (S.typed.length > before.length) {
          var filled = chunkTailFill(traceUI.reference, S.typed);
          if (filled !== null && filled !== S.typed) {
            traceUI.input.value = filled;
            traceUI.input.setSelectionRange(filled.length, filled.length);
            S.typed = filled;
          }
        }
        S.chunk.typed[S.chunk.seg] = S.typed;
        S.chunk.legacy = false;   /* 她打下了第一个字：从此按分段草稿存 */
      }
      saveTyped();
      paintTrace();
    }

    function paintTrace() {
      if (!traceUI) { return; }
      /* 一个字都还没打时**不碰 session**：Trace 的时钟从第一次 update() 起走，
         装配时先 update 一次，等于把她读题、找键盘的时间算进速度里
         （spec §3.4「计时在首次按键开始」）。 */
      if (S.typed === '') {
        wipe(traceUI.typed);
        if (statsBox) { wipe(statsBox); }
        if (S.chunk) {
          /* 这一段被删空了：它的 stats 不再成立（评审 m1），✓ 与「全程 k / N」跟着撤。 */
          S.chunk.stats[S.chunk.seg] = null;
          if (renderChunkWhole().join(',') !== S.chunk.flagSig) { renderChunkBar(); }
        }
        return;
      }
      var res = traceUI.run.session.update(S.typed);
      var states = traceStates(traceUI.reference, S.typed, res);

      if (S.strictness === 'loose') {
        /* 宽松档：光标所在的那一行还没打完，先不结算（行尾才算数）。 */
        var pos = traceUI.input.selectionStart || 0;
        var lineNo = S.typed.slice(0, pos).split('\n').length - 1;
        var start = 0, seen = 0, i;
        for (i = 0; i < S.typed.length && seen < lineNo; i++) {
          if (S.typed.charAt(i) === '\n') { seen++; }
        }
        start = i;
        for (i = start; i < S.typed.length; i++) {
          if (S.typed.charAt(i) === '\n') { break; }
          states[i] = 'ok';
        }
      }

      wipe(traceUI.typed);
      var frs = editor().highlight(S.typed);
      var off = 0;
      frs.forEach(function (f) {
        var runStart = 0;
        for (var i = 1; i <= f.text.length; i++) {
          var endOfRun = (i === f.text.length) || (states[off + i] !== states[off + runStart]);
          if (!endOfRun) { continue; }
          var state = states[off + runStart];
          var cls = f.cls + (state === 'bad' ? ' py-bad' : state === 'over' ? ' py-over' : '');
          traceUI.typed.appendChild(h('span', cls, f.text.slice(runStart, i)));
          runStart = i;
        }
        off += f.text.length;
      });

      renderStats(res.stats);
    }

    var statsBox = null;
    function renderStats(st) {
      if (!statsBox) { return; }
      wipe(statsBox);
      function cell(label, value) {
        var s = h('span', null, label + ' ');
        s.appendChild(h('b', null, value));
        statsBox.appendChild(s);
      }
      /* 向下取整，不四舍五入：她打错了一个字符、屏幕上明明标着红，正确率却
         写着 100%（236 个字符里错 1 个 = 99.6%），是一个会让人不信这块表的读数。 */
      cell(t('accuracy', S.lang), Math.floor(st.accuracy * 100) + '%');
      cell(t('cpm', S.lang), String(Math.round(st.cpm)));
      cell(t('elapsed', S.lang), Math.round(st.elapsedMs / 1000) + 's');
      cell(t('backspaces', S.lang), String(st.backspaces));
      /* 行数差要**明说**：她多打一行之后，逐行对齐会让后面整片变红，
         不说清楚她面对的就是一片无来由的红（裁决 R39）。 */
      if (st.lineDelta !== 0) {
        var key = st.lineDelta > 0 ? 'lineMore' : 'lineLess';
        statsBox.appendChild(h('span', 'py-warn', ts(key, S.lang, [Math.abs(st.lineDelta)])));
      }
      if (S.chunk) { renderChunkStats(st); return; }
      var run = traceUI && traceUI.run;
      /* 这一遍是接着草稿打的：历史错误早就不在这个 session 里了，显示出来的
         正确率必然偏高——说清楚，并且**不写进 progress**（见 traceRun 的注释）。 */
      if (run && run.resumed) {
        statsBox.appendChild(h('span', 'py-warn', t('resumed', S.lang)));
      }
      /* 只在**这一遍打完**时落一次盘：每个按键都写一次 localStorage 既没必要，
         也会把一遍还没打完的中途成绩记成"最好成绩"。 */
      if (S.progId && shouldSaveBest(run, st)) {
        run.saved = true;
        var prev = St.getProgress(S.progId) || {};
        var old = prev.trace || {};
        /* 顶层键浅合并：trace 这个子对象整体替换，给完整的一份（R9）。 */
        St.patchProgress(S.progId, {
          trace: {
            bestAcc: Math.max(Number(old.bestAcc) || 0, st.accuracy),
            bestCpm: Math.max(Number(old.bestCpm) || 0, st.cpm),
            at: Date.now()
          }
        });
      }
    }

    /* ---- 分段临摹的统计行尾巴：段的数字已经由 renderStats 画好（与不分段同一套格子），
       这里接着画 resumed 说明、「全程 k / N 段」、全程落盘与「下一段 →」。 ---- */
    function renderChunkStats(st) {
      var C = S.chunk;
      var k = C.seg;
      C.stats[k] = st;
      var run = C.runs[k];
      if (run && run.resumed) {
        statsBox.appendChild(h('span', 'py-warn', t('resumed', S.lang)));
      } else if (chunkResumedAny(C.runs, C.typed)) {
        statsBox.appendChild(h('span', 'py-warn', t('chunkAnyResumed', S.lang)));
      }
      var flags = renderChunkWhole();

      /* 全程汇总只在 N 段都在干净的 run 里打完时写一次（设计 C6，schema 不变）。 */
      if (S.progId && shouldSaveChunked(C.runs, C.stats, C.segs.length)) {
        C.runs.forEach(function (r) { r.saved = true; });
        var sum = chunkTotals(C.stats);
        var prev = St.getProgress(S.progId) || {};
        var old = prev.trace || {};
        St.patchProgress(S.progId, {
          trace: {
            bestAcc: Math.max(Number(old.bestAcc) || 0, sum.accuracy),
            bestCpm: Math.max(Number(old.bestCpm) || 0, sum.cpm),
            at: Date.now()
          }
        });
      }

      /* 这一段打全对：出「下一段 →」，**不自动跳**——她可能想回看这一段（设计 C4）。 */
      if (flags[k] && k < C.segs.length - 1) {
        statsBox.appendChild(btn('py-btn py-chunk-go', t('chunkNextGo', S.lang), function () {
          setChunk(k + 1);
        }));
      }
      /* 段按钮上的 ✓ 跟着完成状态变：只在变了的时候重画段条，不每个按键都重建。 */
      var sig = flags.join(',');
      if (sig !== C.flagSig) { renderChunkBar(); }
    }

    /* 「全程 k / N 段」一格；返回每段的完成标记。 */
    function renderChunkWhole() {
      var C = S.chunk;
      var flags = chunkDoneFlags(C.segs, C.typed, C.stats);
      if (statsBox) {
        var n = flags.filter(Boolean).length;
        var s = h('span', null, t('chunkWhole', S.lang) + ' ');
        s.appendChild(h('b', null, ts('chunkWholeOf', S.lang, [n, flags.length])));
        statsBox.appendChild(s);
      }
      return flags;
    }

    /* 段条：顶栏下面独立的一行，**仅临摹模式、仅有 chunks 时**存在于 DOM 里——
       没有 chunks 的页面上这个节点根本不被插入，DOM 与合并前相同（设计 §2.4）。 */
    var chunkBar = null;
    function renderChunkBar() {
      var C = S.chunk;
      if (!C || S.mode !== 'trace') {
        if (chunkBar && chunkBar.parentNode) { chunkBar.parentNode.removeChild(chunkBar); }
        chunkBar = null;
        return;
      }
      if (!chunkBar) {
        chunkBar = h('div', 'py-chunkbar');
        main.insertBefore(chunkBar, stage);
      }
      wipe(chunkBar);
      var flags = chunkDoneFlags(C.segs, C.typed, C.stats);
      C.flagSig = flags.join(',');
      var cur = C.segs[C.seg];
      var curTitle = pick(cur.title, S.lang);
      var label = h('span', 'py-pip py-chunk-label',
        ts('chunkLabel', S.lang, [C.seg + 1, C.segs.length, curTitle, cur.fromLine, cur.toLine]));
      label.title = label.textContent;

      /* 上一段 / 下一段排在**最前**（评审 m4）：段条放不下时 overflow:hidden 裁的是行尾，
         行尾放的是可以被裁的东西（逐段按钮与「下一段」的功能重复），导航按钮永远看得见。
         收缩次序由 flex-shrink 决定：说明文字先缩，逐段按钮再缩，导航按钮不缩。 */
      var prevB = btn('py-btn py-chunk-nav', t('chunkPrev', S.lang), function () { setChunk(C.seg - 1); });
      if (C.seg === 0) { prevB.disabled = true; }
      chunkBar.appendChild(prevB);
      var nextB = btn('py-btn py-chunk-nav', t('chunkNext', S.lang), function () { setChunk(C.seg + 1); });
      if (C.seg === C.segs.length - 1) { nextB.disabled = true; }
      chunkBar.appendChild(nextB);
      chunkBar.appendChild(label);
      C.segs.forEach(function (sg, i) {
        var title = pick(sg.title, S.lang);
        var b = btn('py-btn py-chunk-seg', (flags[i] ? '✓ ' : '') + (i + 1) + ' ' + title,
                    function () { setChunk(i); });
        b.title = title;
        b.setAttribute('aria-pressed', i === C.seg ? 'true' : 'false');
        chunkBar.appendChild(b);
      });
    }

      "source": "\"\"\"Blink the Pico's on-board LED from a planned list of on / off times.\"\"\"\nfrom machine import Pin\nimport utime\n\nLED_PIN = 25\nFLASHES = 3\nON_MS = 200\nOFF_MS = 800\n\n\ndef blink_schedule(n, on_ms, off_ms):\n    plan = []\n    t = 0\n    for _ in range(n):\n        plan.append((t, 1))\n        t += on_ms\n# >>> BLANK id=off-event level=2 hint=\"\u4e24\u884c\uff0c\u548c\u4e0a\u9762\u5f00\u706f\u7684\u90a3\u4e24\u884c\u5bf9\u79f0\uff1a\u5148\u5f80 plan \u91cc\u8ffd\u52a0\u4e00\u4e2a (\u65f6\u523b, \u7535\u5e73) \u5143\u7ec4\uff0c\u518d\u628a t \u5f80\u540e\u63a8\uff1b\u8ffd\u52a0\u7528 append\u3001\u63a8\u8fdb\u7528 +=\uff08\u4e0d\u5199 t = t + \u2026\uff09 || \u706d\u706f\u7684\u7535\u5e73\u662f 0\uff1b\u706d\u7740\u7684\u65f6\u957f\u662f off_ms\" hintEn=\"Two lines, the mirror image of the two switch-on lines above: first append a (time, level) tuple to plan, then move t forward; append with append and move with += (not t = t + ...) || The level for off is 0; it stays off for off_ms\"\n        plan.append((t, 0))\n        t += off_ms\n# \u003c\u003c\u003c BLANK\n    return plan\n\n\ndef main():\n# >>> BLANK id=led-pin level=2 hint=\"\u6784\u9020\u4e00\u4e2a Pin \u5bf9\u8c61\u5b58\u8fdb led\uff1a\u7b2c\u4e00\u4e2a\u5b9e\u53c2\u7528\u5e38\u91cf LED_PIN\uff08\u4e0d\u5199 25\uff09\uff0c\u7b2c\u4e8c\u4e2a\u5b9e\u53c2\u6309\u4f4d\u7f6e\u5199\u5f15\u811a\u6a21\u5f0f\uff0c\u4e0d\u5199 mode= || \u8fd9\u4e2a\u5f15\u811a\u662f\u7528\u6765\u70b9\u706f\u7684\uff0c\u6240\u4ee5\u662f\u8f93\u51fa\u6a21\u5f0f\uff0c\u5b83\u662f Pin \u7c7b\u4e0a\u7684\u4e00\u4e2a\u5e38\u91cf\" hintEn=\"Build a Pin object and store it in led: the first argument is the constant LED_PIN (not 25), the second is the pin mode, given by position, not as mode= || The pin drives a light, so it is an output; that mode is a constant on the Pin class\"\n    led = Pin(LED_PIN, Pin.OUT)\n# \u003c\u003c\u003c BLANK\n    led.value(0)\n    plan = blink_schedule(FLASHES, ON_MS, OFF_MS)\n    for at_ms, level in plan:\n        print(at_ms, \"ms: LED\", \"on\" if level else \"off\")\n        led.value(level)\n        if level == 1:\n            utime.sleep_ms(ON_MS)\n        else:\n            utime.sleep_ms(OFF_MS)\n    for _ in range(6):\n# >>> BLANK id=toggle level=1 hint=\"led \u4e0a\u7684\u4e00\u4e2a\u65b9\u6cd5\u8c03\u7528\uff0c\u4e0d\u5e26\u5b9e\u53c2\uff0c\u628a\u706f\u4ece\u4eae\u53d8\u706d\u6216\u4ece\u706d\u53d8\u4eae\uff1b\u4e0d\u7528 value()\" hintEn=\"One method call on led, with no arguments, that flips the light from on to off or off to on; not value()\"\n        led.toggle()\n# \u003c\u003c\u003c BLANK\n        utime.sleep_ms(100)\n    print(\"done\")\n\n\nif __name__ == \"__main__\":\n    main()\n",

        "zh": "\u8ba9 LED \u98de\u5feb\u5730\u5f00\u5173\u6765\u8c03\u6697\u5b83\u3002\u4eae\u5ea6\u767e\u5206\u6bd4\u6362\u6210 0 \u5230 65535 \u7684 16 \u4f4d\u5360\u7a7a\u6bd4\uff0c\u53ea\u7528\u6574\u6570\u7b97\u672f\u56db\u820d\u4e94\u5165\u3002"

      "notes": {
        "en": [
          "What the board does: an LED on GP15 (through a resistor to ground) fades from off up to full brightness in ten steps, then back down, over and over, each step 50 ms. At the start the serial line shows six conversions: 0 % gives 0, 1 % gives 655, 25 % gives 16384, 50 % gives 32768, 99 % gives 64880 and 100 % gives 65535.",
          "PWM (pulse-width modulation) does not change the voltage: the pin is still only on or off, but it switches 1000 times a second (freq(1000)), too fast for your eye. The duty is the fraction of each cycle spent on. In MicroPython duty_u16 takes that fraction as a 16-bit number: 0 is always off, 65535 is always on, and the documentation defines the ratio as value / 65535 (machine.PWM docs; not measured here).",
          "duty turns a percentage into that number. The exact value, percent times 65535 over 100, is usually not whole, so it has to be rounded. Adding half the divisor (50) before floor division rounds halves up, and it stays in whole numbers the whole way - no float error to think about.",
          "Why not Python's round? round rounds an exact half to the even neighbour. For 30 % the exact value is 19660.5: rounding half up gives 19661, round gives 19660. Among 0 to 100 that happens at 30 % and 70 %; everywhere else the two agree. Dropping the + 50 is worse: plain floor division is one too small for half of all the percentages.",
          "The try / finally around the endless loop matters on real hardware: when you press Stop in your editor, MicroPython raises KeyboardInterrupt, and finally sets the duty to 0 and releases the PWM, so the LED is not left glowing.",
          "The page's checker compares duty with an exact fraction rounded half up, on a couple of hundred percentages picked at random from 0 to 100 - with extra cases on the five percentages whose exact value ends in .5, the only places where a round-based version gives itself away."

          "PWM\uff08\u8109\u5bbd\u8c03\u5236\uff09\u5e76\u4e0d\u6539\u53d8\u7535\u538b\uff1a\u5f15\u811a\u4ecd\u7136\u53ea\u6709\u5f00\u548c\u5173\uff0c\u53ea\u662f\u6bcf\u79d2\u5207\u6362 1000 \u6b21\uff08freq(1000)\uff09\uff0c\u5feb\u5f97\u773c\u775b\u8ddf\u4e0d\u4e0a\u3002\u5360\u7a7a\u6bd4\u662f\u6bcf\u4e2a\u5468\u671f\u91cc\u5f00\u7740\u7684\u90a3\u4e00\u90e8\u5206\u3002MicroPython \u7684 duty_u16 \u7528\u4e00\u4e2a 16 \u4f4d\u6570\u8868\u793a\u5b83\uff1a0 \u662f\u4e00\u76f4\u5173\uff0c65535 \u662f\u4e00\u76f4\u5f00\uff0c\u6587\u6863\u628a\u6bd4\u4f8b\u5b9a\u4e49\u4e3a value / 65535\uff08machine.PWM \u6587\u6863\uff1b\u672c\u673a\u6ca1\u6709\u5b9e\u6d4b\uff09\u3002",

      "source": "\"\"\"Fade an LED with PWM, turning a brightness percentage into a 16-bit duty.\"\"\"\nfrom machine import Pin, PWM\nimport utime\n\nLED_PIN = 15\nFREQ_HZ = 1000\nMAX_DUTY = 65535\nSTEP = 10\nPAUSE_MS = 50\n\n\ndef duty(percent):\n# >>> BLANK id=round-half-up level=3 hint=\"\u4e00\u884c return\uff0c\u53ea\u7528\u6574\u6570\u7b97\u672f\uff1a\u4e0d\u7528 round()\uff0c\u4e0d\u7528 /\uff1bpercent \u5199\u5728\u6700\u524d\u9762\uff0c\u4e58\u7684\u662f\u5e38\u91cf MAX_DUTY\uff08\u4e0d\u5199 65535\uff09\uff0c\u5148\u4e58\u3001\u518d\u52a0\u3001\u6700\u540e\u6574\u9664 || \u52a0\u4e0a\u7684\u90a3\u4e2a\u6570\u8ba9\u6574\u9664\u53d8\u6210\u56db\u820d\u4e94\u5165\uff0c\u5b83\u662f\u9664\u6570\u7684\u4e00\u534a || \u9664\u6570\u662f 100\uff0c\u6240\u4ee5\u52a0\u7684\u662f 50\uff1b\u6574\u884c\u5f62\u5982 return (\u2026 + 50) // 100\" hintEn=\"One return line using only integer arithmetic: no round(), no /; percent comes first, multiplied by the constant MAX_DUTY (not 65535), then add, and finally floor-divide || The number you add turns the floor division into rounding half up, and it is half the divisor || The divisor is 100, so you add 50; the line has the shape return (... + 50) // 100\"\n    return (percent * MAX_DUTY + 50) // 100\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n    pwm = PWM(Pin(LED_PIN))\n# >>> BLANK id=freq level=1 hint=\"pwm \u4e0a\u7684\u4e00\u4e2a\u65b9\u6cd5\u8c03\u7528\uff0c\u8bbe\u5b9a PWM \u7684\u9891\u7387\uff1b\u5b9e\u53c2\u7528\u5e38\u91cf FREQ_HZ\uff0c\u4e0d\u5199 1000\" hintEn=\"One method call on pwm that sets the PWM frequency; pass the constant FREQ_HZ, not 1000\"\n    pwm.freq(FREQ_HZ)\n# \u003c\u003c\u003c BLANK\n    for percent in (0, 1, 25, 50, 99, 100):\n        print(percent, \"% ->\", duty(percent))\n    try:\n        while True:\n            for percent in range(0, 101, STEP):\n                pwm.duty_u16(duty(percent))\n                utime.sleep_ms(PAUSE_MS)\n# >>> BLANK id=fade-down level=2 hint=\"\u4e00\u4e2a for \u5934\uff0c\u5faa\u73af\u53d8\u91cf\u4ecd\u53eb percent\uff0c\u7528\u4e09\u4e2a\u5b9e\u53c2\u7684 range \u4ece 100 \u5f80\u4e0b\u6570\uff1b\u6b65\u957f\u5199\u6210 -STEP\uff08\u4e0d\u5199 -10\uff09\uff0c\u4e0d\u7528 reversed() || \u7ec8\u70b9\u662f -1\uff1arange \u4e0d\u542b\u7ec8\u70b9\uff0c\u5199 -1 \u624d\u80fd\u6570\u5230 0 \u4e3a\u6b62\" hintEn=\"One for header, the loop variable still called percent, using range with three arguments to count down from 100; the step is -STEP (not -10), and no reversed() || The stop is -1: range leaves out its stop, so -1 is what lets it reach 0\"\n            for percent in range(100, -1, -STEP):\n# \u003c\u003c\u003c BLANK\n                pwm.duty_u16(duty(percent))\n                utime.sleep_ms(PAUSE_MS)\n    finally:\n        pwm.duty_u16(0)\n        pwm.deinit()\n\n\nif __name__ == \"__main__\":\n    main()\n",

      "blurb": {
        "en": "A hobby servo reads its angle from the width of a pulse sent 50 times a second. Turn 0-180 degrees into microseconds, then microseconds into a 16-bit duty.",
        "zh": "\u6a21\u578b\u8235\u673a\u4ece\u6bcf\u79d2 50 \u6b21\u7684\u8109\u51b2\u5bbd\u5ea6\u8bfb\u51fa\u89d2\u5ea6\u3002\u628a 0\u2013180 \u5ea6\u6362\u6210\u5fae\u79d2\uff0c\u518d\u628a\u5fae\u79d2\u6362\u6210 16 \u4f4d\u5360\u7a7a\u6bd4\u3002"
      },
      "notes": {
        "en": [
          "What the board does: a servo on GP16 (signal wire; power from its own 5 V supply, grounds joined) swings to 0 degrees, 45, 90, 135, 180 and back to 90, pausing one second at each. Each step prints the angle, the pulse width and the duty: 0 degrees is 500 us and 1638, 90 degrees is 1500 us and 4915, 180 degrees is 2500 us and 8192.",
          "A common servo expects a pulse every 20 ms (50 Hz, hence freq(50)) and turns to an angle set by how long the pulse is: about 0.5 ms for 0 degrees up to about 2.5 ms for 180. Exact limits vary between servo models; these are typical values, and pushing past a servo's real limits makes it strain against its end stop.",
          "pulse_us spreads the 2000 us range evenly over 180 degrees in whole microseconds, multiplying before dividing so nothing is lost early - angle // 180 first would be 0 for every angle below 180. servo_duty then says what fraction of the 20000 us period that pulse is, as a 16-bit duty, rounding half up with the same add-half-then-floor-divide trick as PWM Brightness from a Percentage.",
          "Dropping the rounding (just floor-dividing) gives a duty one too small for 89 of the 181 whole angles - harmless to a servo, but wrong. Only one angle, 135, has an exact value ending in .5 (6553.5); half up and round-to-even both give 6554 there, so for this program round would happen to agree.",
          "The page's checker compares servo_duty with a version that does the arithmetic in exact fractions, on hundreds of angles across 0 to 180, including both ends and 135."
        ],

      "source": "\"\"\"Point a hobby servo: angle -> pulse width in microseconds -> 16-bit PWM duty.\"\"\"\nfrom machine import Pin, PWM\nimport utime\n\nSERVO_PIN = 16\nFREQ_HZ = 50\nPERIOD_US = 20000\nMIN_US = 500\nMAX_US = 2500\nMAX_DUTY = 65535\nANGLES = (0, 45, 90, 135, 180, 90)\n\n\ndef pulse_us(angle):\n# >>> BLANK id=pulse level=3 hint=\"\u4e00\u884c return\uff0c\u53ea\u7528\u6574\u6570\u7b97\u672f\uff0c\u53ea\u7528\u4e00\u6b21 //\uff0c\u4e0d\u52a0\u591a\u4f59\u7684\u62ec\u53f7\uff1bMIN_US \u5199\u5728\u6700\u524d\u9762\uff0c\u518d\u52a0\u4e0a\u6309\u89d2\u5ea6\u644a\u51fa\u53bb\u7684\u90a3\u4e00\u622a\uff1aangle \u5199\u5728\u524d\uff0c\u4e58\u4ee5\u5199\u6210 (MAX_US - MIN_US) \u7684\u53ef\u53d8\u8303\u56f4\uff08\u4e0d\u5199 2000\uff09 || \u90a3\u4e00\u622a\u8981\u5148\u4e58\u540e\u6574\u9664 180\uff1a\u5148\u7b97 angle // 180 \u7684\u8bdd\uff0c180 \u5ea6\u4ee5\u4e0b\u5168\u662f 0 || \u6574\u884c\u5f62\u5982 return MIN_US + angle * (\u2026) // 180\" hintEn=\"One return line with integer arithmetic only, a single // and no extra brackets; MIN_US comes first, plus the share the angle adds on: angle first, times the range the pulse can vary over, written (MAX_US - MIN_US) rather than 2000 || That share must be multiplied before it is floor-divided by 180: doing angle // 180 first gives 0 for every angle below 180 || The line has the shape return MIN_US + angle * (...) // 180\"\n    return MIN_US + angle * (MAX_US - MIN_US) // 180\n# \u003c\u003c\u003c BLANK\n\n\ndef servo_duty(angle):\n    width = pulse_us(angle)\n# >>> BLANK id=duty level=2 hint=\"\u4e00\u884c return\uff0c\u53ea\u7528\u6574\u6570\u7b97\u672f\uff08\u4e0d\u7528 round\u3001\u4e0d\u7528 /\uff09\uff1awidth \u4e58 MAX_DUTY\uff0c\u52a0\u4e0a\u534a\u4e2a\u5468\u671f\uff0c\u518d\u6574\u9664\u6574\u4e2a\u5468\u671f\uff1bwidth \u5199\u5728\u6700\u524d\u9762\uff0c\u5468\u671f\u90fd\u7528\u5e38\u91cf PERIOD_US \u8868\u793a\uff0c\u4e0d\u5199\u6570\u5b57 || \u534a\u4e2a\u5468\u671f\u5199\u6210 PERIOD_US // 2\uff1a\u52a0\u4e0a\u9664\u6570\u7684\u4e00\u534a\u518d\u6574\u9664\uff0c\u5c31\u662f\u56db\u820d\u4e94\u5165\" hintEn=\"One return line in integer arithmetic (no round, no /): width times MAX_DUTY, plus half a period, floor-divided by the whole period; width comes first, and every period is written with the constant PERIOD_US, no bare numbers || Half a period is PERIOD_US // 2: adding half the divisor before floor division rounds to the nearest\"\n    return (width * MAX_DUTY + PERIOD_US // 2) // PERIOD_US\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n    servo = PWM(Pin(SERVO_PIN))\n    servo.freq(FREQ_HZ)\n    for angle in ANGLES:\n        print(angle, \"deg ->\", pulse_us(angle), \"us ->\", servo_duty(angle))\n# >>> BLANK id=move level=1 hint=\"servo \u4e0a\u7684\u4e00\u4e2a\u65b9\u6cd5\u8c03\u7528\uff0c\u8bbe 16 \u4f4d\u5360\u7a7a\u6bd4\uff1b\u5b9e\u53c2\u5c31\u662f servo_duty \u5bf9\u8fd9\u4e2a\u89d2\u5ea6\u7b97\u51fa\u7684\u503c\uff0c\u76f4\u63a5\u5d4c\u5957\u8c03\u7528\uff0c\u4e0d\u53e6\u5b58\u53d8\u91cf\" hintEn=\"One method call on servo that sets the 16-bit duty; its argument is what servo_duty works out for this angle, called inline rather than stored in a variable first\"\n        servo.duty_u16(servo_duty(angle))\n# \u003c\u003c\u003c BLANK\n        utime.sleep(1)\n    servo.deinit()\n\n\nif __name__ == \"__main__\":\n    main()\n",

      "notes": {
        "en": [
          "What the board does: nothing you can see - the sensor is inside the chip. Every two seconds the serial line shows the raw reading, the voltage and the temperature; in a warm room the reading is around 14000, which is about 0.705 V and about 27.6 degrees. Put a finger on the chip and the number creeps up.",
          "ADC(4) opens the analogue-to-digital converter's fifth channel, which is wired to the temperature sensor (newer firmware also names it ADC.CORE_TEMP). read_u16() returns 0 to 65535 whatever the converter's real resolution - the RP2040's is 12 bits - scaled so 65535 means the 3.3 V reference (machine.ADC docs; not measured here).",
          "volts scales the reading back to a voltage. celsius then uses the RP2040 datasheet's rule for this sensor: at 27 degrees it gives 0.706 V, and each degree warmer lowers the voltage by 1.721 millivolts, so the temperature is 27 minus the voltage above 0.706 divided by 0.001721. The answer is rounded to one decimal place - the sensor is not good to much better than a degree anyway.",
          "Rounding a float to one decimal place can go wrong when the true value sits exactly on a .x5 halfway point. For this program that never happens: over all 65536 possible readings the exact value is never a tie, and the float result matches exact-fraction arithmetic on every one.",
          "The page's checker compares celsius with a version that does the whole calculation in exact fractions and only turns it into a float at the very end, on hundreds of readings - half near room temperature, half from the whole range."

      "source": "\"\"\"Read the RP2040's built-in temperature sensor and turn it into Celsius.\"\"\"\nfrom machine import ADC\nimport utime\n\nSENSOR_CHANNEL = 4\nVREF = 3.3\nFULL_SCALE = 65535\nPAUSE_S = 2\n\n\ndef volts(raw):\n# >>> BLANK id=volts level=2 hint=\"\u4e00\u884c return\uff1araw \u5199\u5728\u6700\u524d\u9762\uff0c\u5148\u4e58\u53c2\u8003\u7535\u538b\u518d\u9664\u4ee5\u6ee1\u91cf\u7a0b\uff0c\u4e24\u4e2a\u90fd\u7528\u5e38\u91cf\uff08VREF\u3001FULL_SCALE\uff09\uff0c\u4e0d\u5199\u6570\u5b57\uff1b\u7528 /\uff0c\u4e0d\u7528 // || \u53ea\u5199\u4e00\u884c\u3001\u53ea\u7528\u8fd9\u4e24\u4e2a\u5e38\u91cf\uff0c\u4e0d\u5148\u5b58\u4e2d\u95f4\u53d8\u91cf\uff1b\u5224\u5b9a\u6309\u8bb0\u53f7\u9010\u4e2a\u6bd4\uff0c\u6362\u4e86\u5148\u540e\uff08VREF \u5199\u5728 raw \u524d\u9762\uff09\u4f1a\u5224\u9519\" hintEn=\"One return line: raw comes first, multiplied by the reference voltage and then divided by the full scale, both as constants (VREF, FULL_SCALE) rather than numbers; use /, not // || One line with just those two constants and no helper variable; the checker compares token by token, so another order (VREF before raw) is marked wrong\"\n    return raw * VREF / FULL_SCALE\n# \u003c\u003c\u003c BLANK\n\n\ndef celsius(raw):\n    v = volts(raw)\n# >>> BLANK id=celsius level=3 hint=\"\u4e00\u884c return\uff0c\u5916\u9762\u5957 round(\u2026, 1) \u4fdd\u7559\u4e00\u4f4d\u5c0f\u6570\uff08\u7b2c\u4e8c\u4e2a\u5b9e\u53c2\u76f4\u63a5\u5199 1\uff0c\u4e0d\u5199 ndigits=\uff09\uff1b\u91cc\u9762\u662f 27 \u51cf\u53bb\u4e00\u4e2a\u5206\u6570\uff1a\u5206\u5b50\u662f v \u4e0e\u4f20\u611f\u5668\u5728 27 \u5ea6\u65f6\u7684\u7535\u538b\u4e4b\u5dee\uff08v \u5728\u524d\uff0c\u62ec\u53f7\u62ec\u8d77\u6765\uff09\uff0c\u5206\u6bcd\u662f\u6bcf\u5ea6\u7684\u7535\u538b\u53d8\u5316 || \u6570\u5b57\u76f4\u63a5\u5199\u8fdb\u53bb\uff08\u672c\u7a0b\u5e8f\u6ca1\u6709\u4e3a\u5b83\u4eec\u5b9a\u4e49\u5e38\u91cf\uff09\uff0c\u5199\u6210 27 - (\u2026) / \u2026\uff0c\u4e0d\u5199\u6210 27 + (\u2026) || \u6570\u636e\u624b\u518c\u7684\u6570\uff1a27 \u5ea6\u65f6\u7535\u538b\u662f 0.706\uff0c\u6bcf\u5347\u9ad8\u4e00\u5ea6\u7535\u538b\u4e0b\u964d 0.001721\" hintEn=\"One return line wrapped in round(..., 1) to keep one decimal place (the second argument is just 1, not ndigits=); inside it, 27 minus a fraction: the top is the difference between v and the sensor's voltage at 27 degrees (v first, in brackets), the bottom is the change in voltage per degree || Write the numbers in directly (the program has no constants for them), as 27 - (...) / ..., not 27 + (...) || The datasheet numbers: at 27 degrees the voltage is 0.706, and each degree warmer lowers it by 0.001721\"\n    return round(27 - (v - 0.706) / 0.001721, 1)\n# \u003c\u003c\u003c BLANK\n\n\ndef main():\n    sensor = ADC(SENSOR_CHANNEL)\n    while True:\n# >>> BLANK id=read level=1 hint=\"\u4ece sensor \u8bfb\u4e00\u4e2a 16 \u4f4d\u7684\u539f\u59cb\u8bfb\u6570\u5b58\u8fdb raw\uff1asensor \u4e0a\u7684\u4e00\u4e2a\u65b9\u6cd5\u8c03\u7528\uff0c\u4e0d\u5e26\u5b9e\u53c2\uff0c\u65b9\u6cd5\u540d\u4ee5 _u16 \u7ed3\u5c3e\" hintEn=\"Read a 16-bit raw value from sensor into raw: one method call on sensor with no arguments, whose name ends in _u16\"\n        raw = sensor.read_u16()\n# \u003c\u003c\u003c BLANK\n        print(\"raw\", raw, \"->\", volts(raw), \"V ->\", celsius(raw), \"C\")\n        utime.sleep(PAUSE_S)\n\n\nif __name__ == \"__main__\":\n    main()\n",
