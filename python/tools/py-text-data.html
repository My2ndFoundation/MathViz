  /* clearScope(scope, programs, currentId) → string[] | null

  function clearScope(scope, programs, currentId) {

  /* clearHitsCurrent(ids, currentId) → boolean

  /* clearFlash(ui) —— 撤掉硬拦截的红边与说明。

     或换一题，`renderStage()` 会把 traceUI 置空：**回调必须在"已经没人要它"
     的情况下安全返回**，而不是抛一个未捕获的 TypeError 进控制台。

  /* variantsOf(programs, program) → Program[]
     同一个 `problem` 的几种写法（§2.4），按注册表顺序、含自己。
     缺 `problem` 字段的程序**只和自己一组**：naive 的 `q.problem === p.problem`

    var cmp = judge().compare(a, r);

    }

    if (cmp.kind === 'indent') {
      var starts = editor().lineStarts(a);

        var refText = cmp.expected, atText = cmp.got;
        var short = Math.min(refText.length, atText.length);

        for (var ci = 0; ci < short; ci++) {

        }
        return {
          ok: false,
          kind: cmp.kind,
          caret: Math.min(a.length, atTok.start + k),

        };
      }
      /* 她在该放字面量的位置写了别的东西：只说该放哪一类，仍可以复述她
         自己写的（cmp.got 是答案侧原文，不是答案）。 */
      return {
        ok: false,
        kind: cmp.kind,
        caret: atTok ? atTok.start : a.length,
        message: ts('blankWrongKind', lang, [cmp.index + 1, literalKindName(refTok.type, lang), cmp.got])

             : cmp.kind === 'extra' ? [cmp.index + 1, cmp.got]
             : [cmp.index + 1, cmp.expected, cmp.got];
    return { ok: false, kind: cmp.kind, caret: caret, message: ts(key, lang, args) };
  }

  /* traceStates(reference, typed, result) → ('ok'|'bad'|'over')[]

     这里用 Trace.alignLines 把两侧按行重新对齐，把 marks 按 update() 里
     同样的顺序（逐行、行内 j < min(typedFull, refFull)）消费回来，再把
     overflow 的 {line,col} 折回 typed 的下标。

     产出的数组长度恒等于 typed.length —— trace.js 文件头写死的不变量是
     `marks.length + overflow.length === typed.length`；万一哪天不成立，

      var matchLen = Math.min(row.typedFull.length, row.refFull.length);
      for (var j = 0; j < matchLen && m < marks.length; j++, m++) {

  }

  /* expectedCharAt(reference, text, offset) → string | null

     「她打的这一格，按参考应当是哪个字符？」——硬拦截档要不要拒绝这次按键、
     以及拒绝之后屏幕上该说什么，都由它回答。

     用**文本自己的行列**去查参考，而不是全局偏移：她多打/少打一行之后，
     全局偏移就不再指向同一个位置了（`trace.js` 按行重新对齐，同一条道理）。
     两种"参考在这里没有内容"的情形都回 null，调用方分别说人话：

       · 这一列超出了本行、而本行是参考的最后一行（后面没有换行符可打了）

  function shouldSaveBest(run, stats) {

    if (!stats || !(stats.total > 0)) { return false; }

  /* applyFollowEnter(reference, value, pos) → { value, selStart, selEnd }
     「跟随影子」：Enter 直接跳到标准程序下一行的缩进位。默认关——缩进正是

      var f = uniqueLine(ch.from), t2 = uniqueLine(ch.to);
      if (f === -1 || t2 === -1 || t2 < f) { return null; }
      if (c > 0 && f <= tos[c - 1]) { return null; }
      froms.push(f);
      tos.push(t2);
    }
    var out = [];
    for (var s = 0; s < chunks.length; s++) {
      var start = (s === 0) ? 0 : starts[froms[s]];
      var end = (s === chunks.length - 1) ? text.length : starts[froms[s + 1]];
      out.push({
        index: s,
        title: chunks[s].title,
        start: start,
        end: end,
        text: text.slice(start, end),
        fromLine: froms[s] + 1,
        toLine: tos[s] + 1
      });
    }
    return out;
  }

  /* 分段程序的临摹草稿：仍存在 Store 的 (id, 'trace') 键下（store.js 只存字符串，
     一行不改），值是 JSON `{"v":1,"seg":k,"typed":["…",…]}`，数组长度 = 段数。
     **不分段程序的草稿仍是今天的纯字符串**，这两个函数碰都不碰它。 */
  var CHUNK_DRAFT_V = 1;
  function encodeChunkDraft(seg, typed) {
    return JSON.stringify({ v: CHUNK_DRAFT_V, seg: seg, typed: typed });
  }

  /* decodeChunkDraft(raw, n) → { seg, typed } | null
     null 的意思是「没有分段草稿」，调用方从第 1 段空白开始。四种情形都是 null：
       · 不是字符串 / 空串（从没打过）；
       · 一个纯字符串——这一题是后来才加的 chunks，她以前按整段打过（JSON.parse 失败，
         或解析出来不是我们的形状：纯文本恰好是合法 JSON，比如一个数字，也算）；
       · 版本号不认识；
       · 数组长度与段数不同、元素不是字符串、seg 越界——作者改过分段，旧缓冲对不上段。
     「视为无」不等于「删掉」：旧字符串在她打下第一个字之前不被覆盖，那是调用方的纪律
     （mount 里的 chunk.legacy）。 */
  function decodeChunkDraft(raw, n) {
    if (typeof raw !== 'string' || raw === '') { return null; }
    var d;
    try { d = JSON.parse(raw); } catch (e) { return null; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) { return null; }
    if (d.v !== CHUNK_DRAFT_V) { return null; }
    if (!Array.isArray(d.typed) || d.typed.length !== n) { return null; }
    for (var i = 0; i < d.typed.length; i++) {
      if (typeof d.typed[i] !== 'string') { return null; }
    }
    var seg = d.seg;
    if (typeof seg !== 'number' || seg !== Math.floor(seg) || seg < 0 || seg >= n) { return null; }
    return { seg: seg, typed: d.typed.slice() };
  }

  /* chunkDoneFlags(segs, typed, stats) → boolean[]
     每段打完了吗。这一次页面生命里有过 run 的段按它的 stats 判（`correct >= total`，
     与 shouldSaveBest 同一口径）；还没有 run 的段（刷新后从草稿恢复、还没切过去）
     没有 stats 可看，就看缓冲是否**逐字等于**段的参考——那种段的 ✓ 只是显示，成绩
     本来就不会记（resumed）。 */
  function chunkDoneFlags(segs, typed, stats) {
    var out = [];
    for (var i = 0; i < (segs || []).length; i++) {
      var st = stats && stats[i];
      if (st) {
        out.push(st.total > 0 && st.correct >= st.total);
      } else {
        out.push(typeof (typed && typed[i]) === 'string' && typed[i] === segs[i].text &&
                 segs[i].text !== '');
      }
    }
    return out;
  }

  /* chunkTotals(statsList) → { total, correct, errors, elapsedMs, accuracy, cpm }
     全程汇总（设计 §2.2「总结算」）：
       accuracy = Σ(total − errors) / Σtotal
       cpm      = Σcorrect / Σ活跃时间（分钟）
     不是各段正确率的平均：一段 3 个字符打错 1 个，与一段 300 个字符打错 1 个，
     平均会把前者的 67% 与后者的 99.7% 一样看待。活跃时间为 0 时 cpm 为 0，
     与 trace.js 同一条「绝不产出 Infinity」。写进 progress 的仍是
     `{ bestAcc, bestCpm, at }`——schema 不变，不需要迁移。 */
  function chunkTotals(statsList) {
    var total = 0, correct = 0, errors = 0, ms = 0;
    (statsList || []).forEach(function (st) {
      if (!st) { return; }
      total += Number(st.total) || 0;
      correct += Number(st.correct) || 0;
      errors += Number(st.errors) || 0;
      ms += Number(st.elapsedMs) || 0;
    });
    return {
      total: total,
      correct: correct,
      errors: errors,
      elapsedMs: ms,
      accuracy: total > 0 ? (total - errors) / total : 1,
      cpm: ms > 0 ? correct / (ms / 60000) : 0
    };
  }

  /* chunkTailFill(reference, typed) → string | null

     段尾空行自动补齐（评审 I1，控制方裁决）。「段间空行归前一段」（C1）让第 1、2 段的参考
     以 `\n\n\n` 结尾——影子层在最后一个可见行之后什么都不画，逐键打的人**看不见也打不到**
     那两个空行（Enter 的自动缩进还会在空行里留下几个空格，又是一处首次错误），于是 ✓、
     「下一段」、全程成绩全都挂在一个她做不到的条件上。

     判据：她打的内容以「参考去掉尾部换行」（body）开头，余下的部分由**至少一个**换行与自动
     缩进留下的空格组成，且换行数不超过参考尾部的换行数——即她打完了本段最后一个非空行**并按了
     Enter**。此时返回**完整的段参考**，调用方用它替换缓冲；否则 null。
     为什么非要那一下 Enter（不在「刚好等于 body」时就补）：打完一行之后按 Enter 是手的惯性；
     若先补齐，她那一下 Enter 就会多出一行（「你比参考多了 1 行」、复制出去多一个空行）。
     不分段时整段程序的结尾换行同样要她自己按，口径一致。空行不是她的练习，
     补进去之后各段拼回去仍逐字节等于 clean。trace.js 不改：补齐后的缓冲照常 update。
     调用方只在**插入**（缓冲变长）时调它：删除时也补，退格就删不掉那几个空行了。 */
  function chunkTailFill(reference, typed) {
    var ref = String(reference == null ? '' : reference);
    var s = String(typed == null ? '' : typed);
    var body = ref.replace(/\n+$/, '');
    if (body === ref || body === '') { return null; }
    if (s.length < body.length || s.slice(0, body.length) !== body) { return null; }
    var rest = s.slice(body.length);
    if (!/^(\n *)+$/.test(rest)) { return null; }
    var nl = rest.split('\n').length - 1;
    if (nl > ref.length - body.length) { return null; }
    return ref;
  }

  /* chunkResumedAny(runs, typed) → boolean
     全程成绩为什么不记，要**说出来**（评审 I2）：某段的 run 是 resumed，**或者**某段缓冲
     非空却还没有 run（刷新后从草稿恢复、还没切过去——那段的历史已经不在任何 session 里，
     shouldSaveChunked 也因为它没有 run 而不写）。任一成立，全程就不计，页面要写明。 */
  function chunkResumedAny(runs, typed) {
    var r = runs || [], ty = typed || [];
    var n = Math.max(r.length, ty.length);
    for (var i = 0; i < n; i++) {
      if (r[i] && r[i].resumed) { return true; }
      if (!r[i] && typeof ty[i] === 'string' && ty[i] !== '') { return true; }
    }
    return false;
  }

  /* shouldSaveChunked(runs, stats, n) → boolean
     全程成绩该写进 progress 吗？**N 段都在干净的 run 里打完**才算：
       · 每一段都有 run，且没有一段 resumed（某段的 run 创建时缓冲非空）——与不分段时
         「接着草稿打的这一遍不计」同一条纪律，任何一段洗过历史，全程就不可信；
       · 每一段的 stats 都 `correct >= total`；
       · 这一组 run 还没全部记过（某段「重来」开了新 run，这一组就是新的一组）。
     调用方写完之后把每个 run 标 saved，同一组不重复落盘。 */
  function shouldSaveChunked(runs, stats, n) {
    if (!(n > 0) || !runs || !stats) { return false; }
    var fresh = false;
    for (var i = 0; i < n; i++) {
      var run = runs[i], st = stats[i];
      if (!run || run.resumed) { return false; }
      if (!st || !(st.total > 0) || st.correct < st.total) { return false; }
      if (!run.saved) { fresh = true; }
    }
    return fresh;
  }

    '.py-chunk-go{color:#05070d;background:var(--py-accent);border-color:var(--py-accent)}',
    '@media (max-width:880px){.py-picker{flex-basis:170px}.py-panel{display:none}}'
  ].join('\n');

  function ensureStyle(doc) {
    if (doc.getElementById(STYLE_ID)) { return; }
    var s = doc.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    (doc.head || doc.documentElement).appendChild(s);
  }

  var ACCENTS = { cyan: 1, rose: 1, violet: 1, emerald: 1, orange: 1 };

  /* mount({ root, programs, lang, accent }) → controller
     controller: { setMode, setProgram, setLang, destroy } */
  function mount(opts) {
    opts = opts || {};
    var rootEl = opts.root;
    if (!rootEl || typeof rootEl.appendChild !== 'function' || !rootEl.ownerDocument) {
      throw new Error('PyInteract.mount({ root, programs, lang }) 需要一个真实的 DOM 节点作为 root；' +
                      '纯函数层（filterPrograms / copyPayload / …）不需要 DOM，可以单独调用。');
    }
    var doc = rootEl.ownerDocument;
    var win = doc.defaultView;
    var St = store();

    /* ---- 小工具 ---- */
    function h(tag, cls, text) {
      var e = doc.createElement(tag);
      if (cls) { e.className = cls; }
      if (text !== undefined && text !== null) { e.textContent = String(text); }
      return e;
    }
    function wipe(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }
    function btn(cls, text, onClick) {
      var b = h('button', cls, text);
      b.type = 'button';
      b.addEventListener('click', onClick);
      return b;
    }

    /* 存储不可用 / 配额满 / schema 迁移：顶部**持久横幅**，不是 toast、不自动消失。
       她以为存住了而其实没有，是这套东西最坏的失败方式（spec §4.5）。

       注册必须排在**第一次碰存储之前**（下面的 getPrefs 就会碰）：Store 的
       `notified` 标志保证回调最多响一次，第一次读写若在注册之前失败，这条
       回调就永远不会被调用，横幅永远不出现——一个只在存储真的坏掉时才暴露
       的顺序 bug。建壳之后还会再用 available() 兜一次底（同一页里若有别的
       代码先触发过 notify，回调同样不会再响）。 */
    var bannerKey = null;
    St.onUnavailable(function (reason) {
      bannerKey = reason === 'quota' ? 'bannerQuota'
                : reason === 'migrated' ? 'bannerMigrated' : 'bannerNone';
      paintBanner();
    });

    /* ---- 状态 ---- */
    var PROGRAMS = (opts.programs || []).slice();
    var prefs = St.getPrefs() || {};
    var S = {
      lang: (opts.lang === 'en') ? 'en' : 'zh',
      mode: 'read',
      progId: PROGRAMS.length ? PROGRAMS[0].id : null,
      filters: (prefs.filters && typeof prefs.filters === 'object') ? prefs.filters : {},
      compareId: null,
      answers: {},
      given: {},
      hintTier: {},
      typed: '',
      alpha: (typeof prefs.alpha === 'number') ? prefs.alpha : 1,
      strictness: (prefs.strictness === 'loose' || prefs.strictness === 'block') ? prefs.strictness : 'mark',
      followShadow: prefs.followShadow === true,
      anchorLine: -1,
      /* 当前这一遍临摹的 run（{progId, reference, session, resumed, saved}）。
         挂在 S 上而不是 traceUI 上，模式来回切时才不会被重建，见 traceRun()。 */
      run: null,
      /* 分段临摹的状态；当前程序没有 chunks（或 chunkSegments 解析失败）时为 null，
         所有分段代码都在 `if (S.chunk)` 分支里，null 时走的是今天原样的代码（设计 §2.4）。
         { progId, segs, seg, typed: string[], runs: run[], stats: stats[], legacy }
           seg     当前段（0 起）；S.typed 始终是 typed[seg] 的镜像，下游代码不必分支
           runs    每段一个 run（一段 = 一个 reference = 一个 Trace session），跨模式存活
           stats   每段最近一次 update 的 stats，全程汇总用
           legacy  存储里是一份解不出来的旧草稿（纯字符串 / 段数对不上）：在她打下第一个字
                   之前一律不写存储，不因为打开页面、切一下段就把她的东西覆盖掉 */
      chunk: null
    };

    /* ---- 骨架 ---- */
    ensureStyle(doc);
    wipe(rootEl);
    rootEl.classList.add('py-root');
    if (opts.accent && ACCENTS[opts.accent]) {
      rootEl.style.setProperty('--py-accent', 'var(--trace-' + opts.accent + ')');
    }

    var bannerSlot = h('div', 'py-banner-slot');
    var body = h('div', 'py-body');
    var picker = h('aside', 'py-picker');
    var main = h('main', 'py-main');
    var topBar = h('div', 'py-bar');
    var stage = h('div', 'py-stage');
    var bottom = h('div', 'py-bottom');
    var panel = h('aside', 'py-panel');
    main.appendChild(topBar);
    main.appendChild(stage);
    main.appendChild(bottom);
    body.appendChild(picker);
    body.appendChild(main);
    body.appendChild(panel);
    rootEl.appendChild(bannerSlot);
    rootEl.appendChild(body);

    function paintBanner() {
      if (!bannerSlot) { return; } /* 回调可能在建壳之前就响 */
      wipe(bannerSlot);
      if (!bannerKey) { return; }
      bannerSlot.appendChild(h('div', 'py-banner', t(bannerKey, S.lang)));
    }
    if (!St.available() && !bannerKey) { bannerKey = 'bannerNone'; }

    var toastTimer = null;
    function toast(text) {
      var el = h('div', 'py-toast', text);
      stage.appendChild(el);
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () {
        if (el.parentNode) { el.parentNode.removeChild(el); }
      }, 1800);
    }

    /* ---- 当前程序 ---- */
    function current() {
      for (var i = 0; i < PROGRAMS.length; i++) {
        if (PROGRAMS[i].id === S.progId) { return PROGRAMS[i]; }
      }
      return null;
    }
    /* 读 / 临摹 / 复制看到的源码一律是 clean 过的（R16） */
    function cleanSource(p) {
      return p ? exercise().clean(typeof p.source === 'string' ? p.source : '') : '';
    }

    /* 当前程序的段；没有 chunks 时**连 clean 都不算**，直接 null——不分段的程序走的
       每一行都与今天相同。clean 抛错（源码指令不成对）也退回不分段：挖空模式自己会把
       那个错误摆到舞台上，这里不替它在装配期炸整页。 */
    function segmentsOf(p) {
      if (!p || !Array.isArray(p.chunks) || !p.chunks.length) { return null; }
      try { return chunkSegments(cleanSource(p), p.chunks); } catch (e) { return null; }
    }

    /* ---- 草稿 ---- */
    function loadDrafts() {
      var p = current();
      S.answers = {};
      S.given = {};
      S.hintTier = {};
      S.typed = '';
      S.chunk = null;
      if (!p) { return; }
      var raw = St.getDraft(p.id, 'blank');
      if (raw) {
        try {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') { S.answers = parsed; }
        } catch (e) { /* 草稿坏了就当没有，不拿一个异常把整页拖垮 */ }
      }
      var typed = St.getDraft(p.id, 'trace');
      /* 分段程序：草稿是 JSON（decodeChunkDraft）。S.chunk 整个重建——连同各段的 run：
         loadDrafts 的三个调用点（装配、换题、清空打到了当前这一题）本来就都作废当前
         这一遍，与下面那条「不碰 S.run」的纪律不冲突，只是 run 住的地方不同。 */
      var segs = segmentsOf(p);
      if (segs) {
        var d = decodeChunkDraft(typed, segs.length);
        var arr = [];
        for (var i = 0; i < segs.length; i++) { arr.push(d ? d.typed[i] : ''); }
        S.chunk = {
          progId: p.id, segs: segs, seg: d ? d.seg : 0, typed: arr, runs: [], stats: [],
          legacy: !d && typeof typed === 'string' && typed !== ''
        };
        S.typed = arr[S.chunk.seg];
        return;
      }
      if (typeof typed === 'string') { S.typed = typed; }
      /* ⚠ 这里**不碰 S.run**。loadDrafts 是共享的，而"这一遍临摹作不作废"
         只有真正换了题 / 真正清掉了当前这一题的草稿才成立：清别人的草稿时
         照样重置，会把一遍从未被打断的临摹标成 resumed（成绩不计），
         而"重来"又会丢掉她真实的进度。重置放在调用方，各自说明理由。 */
    }
    function saveBlank() { if (S.progId) { St.scheduleDraft(S.progId, 'blank', JSON.stringify(S.answers)); } }
    function saveTyped() {
      if (!S.progId) { return; }
      if (S.chunk) {
        /* 解不出来的旧草稿还在存储里、她还一个字没打：不写（见 S.chunk.legacy）。 */
        if (S.chunk.legacy) { return; }
        St.scheduleDraft(S.progId, 'trace', encodeChunkDraft(S.chunk.seg, S.chunk.typed));
        return;
      }
      St.scheduleDraft(S.progId, 'trace', S.typed);
    }
    /* patchProgress / setPrefs 都是**顶层键浅合并**：给的必须是完整子对象（R9）。 */
    function savePrefs() {
      St.setPrefs({
        alpha: S.alpha,
        strictness: S.strictness,
        followShadow: S.followShadow,
        filters: S.filters
      });
    }

    /* ================= 程序选择器 ================= */
    var LINE_CAPS = [0, 20, 40, 80];

    function toggleFilter(dim, value) {
      var list = asList(S.filters[dim]).slice();
      var at = list.indexOf(value);
      if (at === -1) { list.push(value); } else { list.splice(at, 1); }
      S.filters[dim] = list;
      savePrefs();
      renderPicker();
    }

    function chipRow(dim, values, labelOf) {
      var wrap = h('div', 'py-chips');
      values.forEach(function (v) {
        var on = asList(S.filters[dim]).indexOf(v) !== -1;
        var c = btn('py-chip', labelOf(v), function () { toggleFilter(dim, v); });
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        wrap.appendChild(c);
      });
      return wrap;
    }

    function renderPicker() {
      wipe(picker);

      var fs = h('div', 'py-sec');
      fs.appendChild(h('h4', null, t('level', S.lang)));
      fs.appendChild(chipRow('level', LEVELS, function (v) { return 'L' + v; }));
      fs.appendChild(h('h4', null, t('kind', S.lang)));
      fs.appendChild(chipRow('kind', KINDS, function (v) { return kindLabel(v, S.lang); }));
      fs.appendChild(h('h4', null, t('boards', S.lang)));
      fs.appendChild(chipRow('boards', BOARDS, function (v) { return v; }));
      fs.appendChild(h('h4', null, t('filters', S.lang)));
      var caps = h('div', 'py-chips');
      LINE_CAPS.forEach(function (n) {
        var on = (Number(S.filters.maxLines) || 0) === n;
        var c = btn('py-chip', n === 0 ? t('anyLength', S.lang) : ts('maxLines', S.lang, [n]), function () {
          S.filters.maxLines = n;
          savePrefs();
          renderPicker();
        });
        c.setAttribute('aria-pressed', on ? 'true' : 'false');
        caps.appendChild(c);
      });
      fs.appendChild(caps);
      picker.appendChild(fs);

      var list = h('ul', 'py-list');
      var shown = filterPrograms(PROGRAMS, S.filters);
      if (!shown.length) {
        list.appendChild(h('li', 'py-item', t('nothing', S.lang)));
      }
      shown.forEach(function (p) {
        var li = h('li', 'py-item');
        li.setAttribute('aria-current', p.id === S.progId ? 'true' : 'false');
        var tx = h('div', 'py-item-t', pick(p.title, S.lang) || p.id);
        var meta = h('span', 'py-item-m',
          'L' + p.level + ' · ' + kindLabel(p.kind, S.lang) + ' · ' + ts('lines', S.lang, [p.lines]));
        tx.appendChild(meta);
        li.appendChild(tx);
        li.addEventListener('click', function () { setProgram(p.id); });
        li.appendChild(btn('py-x', '⋯', function (ev) {
          ev.stopPropagation();
          askClear('program', p.id);
        }));
        list.appendChild(li);
      });
      picker.appendChild(list);

      var tools = h('div', 'py-sec');
      var row = h('div', 'py-chips');
      row.appendChild(btn('py-btn', t('clearModule', S.lang), function () { askClear('module', null); }));
      row.appendChild(btn('py-btn', t('clearAll', S.lang), function () { askClear('all', null); }));
      tools.appendChild(row);
      picker.appendChild(tools);
    }

    /* ================= 三级清空 ================= */
    function askClear(scope, progId) {
      var ids = clearScope(scope, PROGRAMS, progId || S.progId);
      /* 二次确认里的条数是 Store.countRecords 的**真实条数**，不是估的。
         两处措辞上的诚实，都是因为这个数字与"这一级实际清掉什么"并不重合：
           · countRecords 数的是 draft:blank + draft:trace + progress 三种键，
             而单题 / 模块两级只清 draft（进度是"她已经会了"的记录，spec §4.5
             明确不连坐），所以文案说"其中的草稿会被清除、进度保留"。
           · 'all' 这一级本页列举不出别的页的 id，所以只能数出本页的那一部分，
             文案就明说"本页 N 条，其他页的记录也会一并清除"——报一个看上去
             精确、实际只数了本页的数字，是在撒谎。 */
      var n = St.countRecords(ids === null ? PROGRAMS.map(function (p) { return p.id; }) : ids);
      var key = scope === 'program' ? 'confirmOne' : scope === 'module' ? 'confirmModule' : 'confirmAll';
      var ask = (win && typeof win.confirm === 'function') ? win.confirm : null;
      if (ask && !ask.call(win, ts(key, S.lang, [n]))) { return; }
      /* 动手的次序（先 flush 再清）在 clearRecords 里，那里测得到。 */
      clearRecords(St, scope, ids);
      /* 只有清到当前这一题时才重读草稿、作废当前这一遍；清别人的不动她。 */
      if (clearHitsCurrent(ids, S.progId)) {
        loadDrafts();
        S.run = null;
      }
      renderAll();
      toast(t('cleared', S.lang));
    }

    /* ================= 代码文档（读模式 / 对照）================= */
    function noteLineIndex(p, lines) {
      /* lineNotes 用整行原文当锚（不是行号）：找到第一条逐字相同的行。 */
      var map = {};
      (p && p.lineNotes ? p.lineNotes : []).forEach(function (note, i) {
        var at = String(note.at == null ? '' : note.at);
        for (var k = 0; k < lines.length; k++) {
          if (lines[k] === at) { map[k] = i; return; }
        }
      });
      return map;
    }

    function renderDoc(p, src, otherLines) {
      var docEl = h('div', 'py-doc');
      var lines = src.split('\n');
      var notes = noteLineIndex(p, lines);
      var frs = editor().highlight(src);

      var rows = [];
      var makeRow = function (i) {
        var row = h('div', 'py-line');
        var num = h('div', 'py-num', String(i + 1));
        if (notes[i] !== undefined) {
          num.className = 'py-num py-has-note';
          num.textContent = (i + 1) + ' ●';
          num.addEventListener('click', function () {
            S.anchorLine = i;
            renderPanel();
            highlightAnchor();
          });
        }
        var code = h('div', 'py-code');
        row.appendChild(num);
        row.appendChild(code);
        if (otherLines && otherLines[i] !== lines[i]) { row.className = 'py-line py-diff'; }
        docEl.appendChild(row);
        rows.push({ row: row, code: code });
        return code;
      };

      var li = 0;
      var code = makeRow(0);
      frs.forEach(function (f) {
        var parts = f.text.split('\n');
        for (var i = 0; i < parts.length; i++) {
          if (i > 0) { li++; code = makeRow(li); }
          if (parts[i] !== '') { code.appendChild(h('span', f.cls, parts[i])); }
        }
      });
      /* 空行也要有高度，否则行号与代码错位 */
      rows.forEach(function (r) { if (!r.code.firstChild) { r.code.appendChild(h('span', 'tok-plain', '​')); } });
      docEl.__rows = rows;
      return docEl;
    }

    function highlightAnchor() {
      var docs = stage.querySelectorAll('.py-doc');
      for (var d = 0; d < docs.length; d++) {
        var rows = docs[d].__rows || [];
        for (var i = 0; i < rows.length; i++) {
          var on = (i === S.anchorLine);
          var cls = rows[i].row.className.replace(/ ?py-anchor/, '');
          rows[i].row.className = on ? (cls + ' py-anchor') : cls;
          if (on && rows[i].row.scrollIntoView) {
            rows[i].row.scrollIntoView({ block: 'nearest' });
          }
        }
      }
    }

    function renderRead() {
      var p = current();
      var docs = h('div', 'py-docs');
      var mine = cleanSource(p);
      var other = null;
      if (S.compareId) {
        var q = null;
        PROGRAMS.forEach(function (x) { if (x.id === S.compareId) { q = x; } });
        if (q) { other = { prog: q, src: cleanSource(q) }; }
      }
      var otherLines = other ? other.src.split('\n') : null;
      docs.appendChild(renderDoc(p, mine, otherLines));
      if (other) {
        docs.appendChild(renderDoc(other.prog, other.src, mine.split('\n')));
      }
      stage.appendChild(docs);
    }

    /* ================= 挖空模式 ================= */
    var blankInputs = {};

    function renderBlank() {
      var p = current();
      blankInputs = {};
      var parsed;
      try {
        parsed = exercise().parse(typeof p.source === 'string' ? p.source : '');
      } catch (e) {
        stage.appendChild(h('div', 'py-msg py-bad-msg', String(e && e.message ? e.message : e)));
        return;
      }
      var byId = {};
      parsed.blanks.forEach(function (b) { byId[b.id] = b; });

      var docEl = h('div', 'py-doc');
      var lines = parsed.stripped.split('\n');
      var badge = 0;

      lines.forEach(function (lineText, i) {
        var entry = parsed.lineMap[i];
        var row = h('div', 'py-line');
        if (entry && entry.kind === 'blank') {
          badge++;
          var b = byId[entry.blankId];
          row.appendChild(h('div', 'py-badge', '①②③④⑤⑥⑦⑧⑨'.charAt(badge - 1) || String(badge)));
          row.appendChild(blankBox(b));
        } else {
          row.appendChild(h('div', 'py-num', String(i + 1)));
          var code = h('div', 'py-code');
          editor().highlight(lineText).forEach(function (f) {
            code.appendChild(h('span', f.cls, f.text));
          });
          if (!code.firstChild) { code.appendChild(h('span', 'tok-plain', '​')); }
          row.appendChild(code);
        }
        docEl.appendChild(row);
      });
      stage.appendChild(docEl);
    }

    function blankBox(b) {
      var box = h('div', 'py-blankbox');
      var ta = doc.createElement('textarea');
      ta.className = 'py-blank-in';
      ta.spellcheck = false;
      ta.rows = Math.max(1, String(b.body).split('\n').length);
      /* 缺省值是这个空的缩进本身：Exercise.merge 拿她这一份原样替换回源码，
         少了那几格粘进 PyCharm 就是 IndentationError（Judge 看不见绝对缩进）。 */
      ta.value = (S.answers[b.id] !== undefined && S.answers[b.id] !== null)
        ? S.answers[b.id] : b.indent;
      if (S.given[b.id]) { ta.className += ' py-given'; }

      var msg = h('div', 'py-msg');

      ta.addEventListener('input', function () {
        S.answers[b.id] = ta.value;
        /* 她一动手，"已填入标准答案"这个标记就不再成立——留着的话，一个她
           自己打出来的空会一直灰着显示"不计完成"。 */
        if (S.given[b.id]) {
          delete S.given[b.id];
          ta.className = ta.className.replace(/ ?py-given/, '');
          msg.className = 'py-msg';
          msg.textContent = '';
        }
        saveBlank();
      });
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Tab') {
          /* 挖空模式 Tab 在空与空之间跳（spec §3.3）——临摹模式的 Tab 才插四格。 */
          e.preventDefault();
          jumpBlank(b.id, e.shiftKey ? -1 : 1);
          return;
        }
        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          var r = editor().applyEnter(ta.value, ta.selectionStart);
          ta.value = r.value;
          ta.setSelectionRange(r.selStart, r.selEnd);
          ta.rows = Math.max(1, ta.value.split('\n').length);
          S.answers[b.id] = ta.value;
          saveBlank();
        }
      });

      var bar = h('div', 'py-blank-bar');
      var hintMsg = h('div', 'py-msg');
      bar.appendChild(btn('py-btn', t('hint', S.lang) + ' (L' + b.level + ')', function () {
        var tier = (S.hintTier[b.id] || 0) + 1;
        S.hintTier[b.id] = Math.min(tier, b.level);
        hintMsg.textContent = hintAt(b, S.hintTier[b.id], S.lang);
        noteProgress();
      }));
      bar.appendChild(btn('py-btn', t('giveUp', S.lang), function () {
        S.answers[b.id] = b.body;
        S.given[b.id] = true;
        ta.value = b.body;
        ta.className = 'py-blank-in py-given';
        ta.rows = Math.max(1, b.body.split('\n').length);
        msg.className = 'py-msg';
        msg.textContent = t('given', S.lang);
        saveBlank();
      }));
      bar.appendChild(btn('py-btn', t('check', S.lang), function () { checkBlank(b); }));

      box.appendChild(ta);
      box.appendChild(bar);
      box.appendChild(hintMsg);
      box.appendChild(msg);
      blankInputs[b.id] = { ta: ta, msg: msg, blank: b };
      return box;
    }

    function jumpBlank(fromId, dir) {
      var ids = Object.keys(blankInputs);
      var at = ids.indexOf(fromId);
      var next = ids[at + dir];
      if (next && blankInputs[next]) { blankInputs[next].ta.focus(); }
    }

    function checkBlank(b) {
      var ui = blankInputs[b.id];
      if (!ui) { return null; }
      var fb = blankFeedback(ui.ta.value, b.body, S.lang);
      ui.msg.className = 'py-msg ' + (fb.ok ? 'py-ok-msg' : 'py-bad-msg');
      ui.msg.textContent = fb.message;
      ui.ta.className = 'py-blank-in' + (S.given[b.id] ? ' py-given' : '') + (fb.ok ? ' py-okk' : ' py-badd');
      if (!fb.ok) {
        /* 光标送到出错的位置——不给答案，只指路（spec §3.3） */
        ui.ta.focus();
        var at = Math.max(0, Math.min(fb.caret, ui.ta.value.length));
        ui.ta.setSelectionRange(at, at);
      }
      return fb;
    }

    function checkAllBlanks() {
      var ids = Object.keys(blankInputs);
      var allOk = ids.length > 0;
      ids.forEach(function (id) {
        var fb = checkBlank(blankInputs[id].blank);
        if (!fb || !fb.ok || S.given[id]) { allOk = false; }
      });
      if (allOk) { toast(t('blankAllOk', S.lang)); }
      noteProgress(allOk);
      return allOk;
    }

    function noteProgress(done) {
      if (!S.progId) { return; }
      var used = 0;
      Object.keys(S.hintTier).forEach(function (k) { used += S.hintTier[k]; });
      /* 顶层键浅合并：blank 这个子对象整体替换，调用方给完整的一份（R9）。 */
      var prev = St.getProgress(S.progId) || {};
      var wasDone = !!(prev.blank && prev.blank.done);
      St.patchProgress(S.progId, {
        blank: { done: done === true || wasDone, hintsUsed: used, at: Date.now() }
      });
    }

    /* ================= 影子临摹 ================= */
    var traceUI = null;

    /* 一次「run」= 一个 Trace session，**跨模式切换存活**。

       为什么不能在每次 renderTrace 里新建：`trace.js` 只在某个下标**首次被
       seen** 时记进 firstWrong，而重建后的 session 是被整段 `S.typed` 一次
       喂进去的——每个字符都在它**最终正确的样子**下被首次看见，于是
         连续会话（打错→退格→改对）  accuracy 0.9730  errors 1
         重建 session（同样的最终文本）accuracy 1.0000  errors 0  backspaces 0
       按一次 `1` 再按一次 `3` 就能把一个她没打出来的 100% 经 bestAcc 的
       Math.max **永久**写进进度（清空也删不掉）。

       从一份已有草稿接着打的 run 同样洗掉了历史，所以标成 resumed：统计照显
       （并写明"这一遍不计"），但**不写 progress**，直到「重来」开一遍干净的。 */
    function traceRun(reference) {
      if (S.chunk) {
        /* 分段：每段一个 run，按 progId + 段 reference 判复用（设计 §2.2「模式切换」）。
           某段的 run 创建时它的缓冲非空，这一段就是 resumed。 */
        var k = S.chunk.seg;
        var r = S.chunk.runs[k];
        if (reuseRun(r, S.progId, reference)) { return r; }
        S.chunk.runs[k] = newRun(S.progId, reference, S.typed);
        S.chunk.stats[k] = null;
        return S.chunk.runs[k];
      }
      if (reuseRun(S.run, S.progId, reference)) { return S.run; }
      S.run = newRun(S.progId, reference, S.typed);
      return S.run;
    }

    /* 切到第 k 段。缓冲在 S.chunk.typed 里，切走不丢、切回来原样还在；段号跟着草稿
       落盘，刷新后回到同一段（设计 §6.3）。 */
    function setChunk(k) {
      if (!S.chunk || k < 0 || k >= S.chunk.segs.length || k === S.chunk.seg) {
        /* 点的是当前段：焦点也要还给输入层——留在按钮上的话，她接着打 1 / 2 / 3 / [ / ]
           会切模式、换题（评审 m2）。 */
        if (traceUI && traceUI.input.focus) { traceUI.input.focus(); }
        return;
      }
      S.chunk.typed[S.chunk.seg] = S.typed;
      S.chunk.seg = k;
      S.typed = S.chunk.typed[k];
      saveTyped();
      renderTopBar();
      renderStage();
      renderBottom();
      paintTrace();
      if (traceUI && traceUI.input.focus) { traceUI.input.focus(); }
    }

    function restartTrace() {
      if (S.chunk) {
        /* 「重来」只重来**当前段**（设计 C5）：清这一段的缓冲、下一次 traceRun 开一个
           新 session。整题重来走已有的三级清空。 */
        var k = S.chunk.seg;
        S.typed = '';
        S.chunk.typed[k] = '';
        S.chunk.runs[k] = null;
        S.chunk.stats[k] = null;
        saveTyped();
        renderTopBar();
        renderStage();
        renderBottom();
        paintTrace();
        return;
      }
      S.typed = '';
      saveTyped();
      S.run = null;   /* 下一次 traceRun() 开一遍干净的：resumed 为假，成绩算数 */
      renderStage();
      renderBottom();
      paintTrace();
    }

    function renderTrace() {
      var p = current();
      /* 分段：参考只是**当前段**（设计 C3）。三层坐标系从段首起算，与不分段时完全同构，
         trace.js 一行不改——三层对齐、逐行同步、首次即正确、空闲剔除都原样作用在这一段上。 */
      var reference = S.chunk ? S.chunk.segs[S.chunk.seg].text : cleanSource(p);
      var run = traceRun(reference);

      var shadow = h('pre', 'py-layer py-shadow');
      var typedLayer = h('pre', 'py-layer py-typed');
      var input = doc.createElement('textarea');
      input.className = 'py-layer py-input';
      input.spellcheck = false;
      input.autocapitalize = 'off';
      input.autocomplete = 'off';
      input.setAttribute('autocorrect', 'off');
      input.value = S.typed;

      editor().highlight(reference).forEach(function (f) {
        shadow.appendChild(h('span', f.cls, f.text));
      });
      shadow.style.opacity = String(S.alpha);

      stage.appendChild(shadow);
      stage.appendChild(typedLayer);
      stage.appendChild(input);

      /* 拒绝一次按键时说明原因的那一行；不占布局（绝对定位在舞台底部）。 */
      var blockNote = h('div', 'py-blocknote');
      blockNote.hidden = true;
      stage.appendChild(blockNote);

      traceUI = { shadow: shadow, typed: typedLayer, input: input,
                  run: run, reference: reference, blockNote: blockNote, blockTimer: null };

      /* 同步滚动由顶层 textarea 的 scroll 驱动，另外两层用 transform：
         translate 不像 scrollTop 那样有子像素抖动，三层才不会在滚动时错开。 */
      input.addEventListener('scroll', function () {
        var tr = 'translate(' + (-input.scrollLeft) + 'px,' + (-input.scrollTop) + 'px)';
        shadow.style.transform = tr;
        typedLayer.style.transform = tr;
      });

      input.addEventListener('beforeinput', function (e) {
        if (S.strictness !== 'block') { return; }
        if (e.inputType !== 'insertText' || e.data == null || e.data.length !== 1) { return; }
        var s = input.selectionStart, en = input.selectionEnd;
        var next = input.value.slice(0, s) + e.data + input.value.slice(en);
        if (charMatches(reference, next, s)) { return; }
        e.preventDefault();
        /* 拒绝必须**看得见**：自动缩进会把她推进"参考这一行早就结束了"的
           死角，那时她打什么都被拒，而屏幕上什么都没有——与页面坏掉无法区分。 */
        showBlocked(blockedHint(reference, next, s, S.lang));
      });

      input.addEventListener('keydown', function (e) {
        if (e.key === 'Backspace' || e.key === 'Delete') { run.session.noteBackspace(); return; }
        if (e.key === 'Tab') {
          e.preventDefault();
          var r = editor().applyTab(input.value, input.selectionStart, input.selectionEnd);
          input.value = r.value;
          input.setSelectionRange(r.selStart, r.selEnd);
          onTyped();
          return;
        }
        if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          var r2 = S.followShadow
            ? applyFollowEnter(reference, input.value, input.selectionStart)
            : editor().applyEnter(input.value, input.selectionStart);
          input.value = r2.value;
          /* applyTab 与 applyEnter 同形（selEnd === selStart 恒成立），
             两种按键都能直接 setSelectionRange，不必分支（裁决 R32）。 */
          input.setSelectionRange(r2.selStart, r2.selEnd);
          onTyped();
        }
      });

      input.addEventListener('input', onTyped);
      paintTrace();
    }

    /* 拒绝反馈：文字说明 + 顶层输入框闪一下红边。文字留到下一次按键或 1.6 秒
       后才撤，闪光只是把视线拉过去。 */
    function showBlocked(text) {
      if (!traceUI) { return; }
      var note = traceUI.blockNote;
      note.textContent = text;
      note.hidden = false;
      traceUI.input.classList.add('py-blocked');
      if (traceUI.blockTimer) { clearTimeout(traceUI.blockTimer); }
      /* 回调读的是**外层的** traceUI：1.6 秒之内她完全可能切走模式或换一题，
         那时它已经是 null。clearFlash 自带守卫，安全返回。 */
      traceUI.blockTimer = setTimeout(function () { clearFlash(traceUI); }, 1600);
    }

    /* 拆掉当前这一层临摹 UI：**先停掉延时回调**，再置空。只加回调里的守卫也
       能不崩，但那样会留下一个"还会醒来、醒来却无事可做"的定时器；两件事一起
       消灭，才不用去想它醒来时世界长什么样。 */
    function teardownTrace() {
      if (traceUI && traceUI.blockTimer) { clearTimeout(traceUI.blockTimer); }
      traceUI = null;
    }

    function onTyped() {
      if (!traceUI) { return; }
      var before = S.typed;
      S.typed = traceUI.input.value;
      if (S.chunk) {
        /* 段尾空行自动补齐（见 chunkTailFill）：只在插入时。 */
        if (S.typed.length > before.length) {
          var filled = chunkTailFill(traceUI.reference, S.typed);
          if (filled !== null && filled !== S.typed) {
            traceUI.input.value = filled;
            traceUI.input.setSelectionRange(filled.length, filled.length);
            S.typed = filled;
          }
        }
        S.chunk.typed[S.chunk.seg] = S.typed;
        S.chunk.legacy = false;   /* 她打下了第一个字：从此按分段草稿存 */
      }
      saveTyped();
      paintTrace();
    }

    function paintTrace() {
      if (!traceUI) { return; }
      /* 一个字都还没打时**不碰 session**：Trace 的时钟从第一次 update() 起走，
         装配时先 update 一次，等于把她读题、找键盘的时间算进速度里
         （spec §3.4「计时在首次按键开始」）。 */
      if (S.typed === '') {
        wipe(traceUI.typed);
        if (statsBox) { wipe(statsBox); }
        if (S.chunk) {
          /* 这一段被删空了：它的 stats 不再成立（评审 m1），✓ 与「全程 k / N」跟着撤。 */
          S.chunk.stats[S.chunk.seg] = null;
          if (renderChunkWhole().join(',') !== S.chunk.flagSig) { renderChunkBar(); }
        }
        return;
      }
      var res = traceUI.run.session.update(S.typed);
      var states = traceStates(traceUI.reference, S.typed, res);

      if (S.strictness === 'loose') {
        /* 宽松档：光标所在的那一行还没打完，先不结算（行尾才算数）。 */
        var pos = traceUI.input.selectionStart || 0;
        var lineNo = S.typed.slice(0, pos).split('\n').length - 1;
        var start = 0, seen = 0, i;
        for (i = 0; i < S.typed.length && seen < lineNo; i++) {
          if (S.typed.charAt(i) === '\n') { seen++; }
        }
        start = i;
        for (i = start; i < S.typed.length; i++) {
          if (S.typed.charAt(i) === '\n') { break; }
          states[i] = 'ok';
        }
      }

      wipe(traceUI.typed);
      var frs = editor().highlight(S.typed);
      var off = 0;
      frs.forEach(function (f) {
        var runStart = 0;
        for (var i = 1; i <= f.text.length; i++) {
          var endOfRun = (i === f.text.length) || (states[off + i] !== states[off + runStart]);
          if (!endOfRun) { continue; }
          var state = states[off + runStart];
          var cls = f.cls + (state === 'bad' ? ' py-bad' : state === 'over' ? ' py-over' : '');
          traceUI.typed.appendChild(h('span', cls, f.text.slice(runStart, i)));
          runStart = i;
        }
        off += f.text.length;
      });

      renderStats(res.stats);
    }

    var statsBox = null;
    function renderStats(st) {
      if (!statsBox) { return; }
      wipe(statsBox);
      function cell(label, value) {
        var s = h('span', null, label + ' ');
        s.appendChild(h('b', null, value));
        statsBox.appendChild(s);
      }
      /* 向下取整，不四舍五入：她打错了一个字符、屏幕上明明标着红，正确率却
         写着 100%（236 个字符里错 1 个 = 99.6%），是一个会让人不信这块表的读数。 */
      cell(t('accuracy', S.lang), Math.floor(st.accuracy * 100) + '%');
      cell(t('cpm', S.lang), String(Math.round(st.cpm)));
      cell(t('elapsed', S.lang), Math.round(st.elapsedMs / 1000) + 's');
      cell(t('backspaces', S.lang), String(st.backspaces));
      /* 行数差要**明说**：她多打一行之后，逐行对齐会让后面整片变红，
         不说清楚她面对的就是一片无来由的红（裁决 R39）。 */
      if (st.lineDelta !== 0) {
        var key = st.lineDelta > 0 ? 'lineMore' : 'lineLess';
        statsBox.appendChild(h('span', 'py-warn', ts(key, S.lang, [Math.abs(st.lineDelta)])));
      }
      if (S.chunk) { renderChunkStats(st); return; }
      var run = traceUI && traceUI.run;
      /* 这一遍是接着草稿打的：历史错误早就不在这个 session 里了，显示出来的
         正确率必然偏高——说清楚，并且**不写进 progress**（见 traceRun 的注释）。 */
      if (run && run.resumed) {
        statsBox.appendChild(h('span', 'py-warn', t('resumed', S.lang)));
      }
      /* 只在**这一遍打完**时落一次盘：每个按键都写一次 localStorage 既没必要，
         也会把一遍还没打完的中途成绩记成"最好成绩"。 */
      if (S.progId && shouldSaveBest(run, st)) {
        run.saved = true;
        var prev = St.getProgress(S.progId) || {};
        var old = prev.trace || {};
        /* 顶层键浅合并：trace 这个子对象整体替换，给完整的一份（R9）。 */
        St.patchProgress(S.progId, {
          trace: {
            bestAcc: Math.max(Number(old.bestAcc) || 0, st.accuracy),
            bestCpm: Math.max(Number(old.bestCpm) || 0, st.cpm),
            at: Date.now()
          }
        });
      }
    }

    /* ---- 分段临摹的统计行尾巴：段的数字已经由 renderStats 画好（与不分段同一套格子），
       这里接着画 resumed 说明、「全程 k / N 段」、全程落盘与「下一段 →」。 ---- */
    function renderChunkStats(st) {
      var C = S.chunk;
      var k = C.seg;
      C.stats[k] = st;
      var run = C.runs[k];
      if (run && run.resumed) {
        statsBox.appendChild(h('span', 'py-warn', t('resumed', S.lang)));
      } else if (chunkResumedAny(C.runs, C.typed)) {
        statsBox.appendChild(h('span', 'py-warn', t('chunkAnyResumed', S.lang)));
      }
      var flags = renderChunkWhole();

      /* 全程汇总只在 N 段都在干净的 run 里打完时写一次（设计 C6，schema 不变）。 */
      if (S.progId && shouldSaveChunked(C.runs, C.stats, C.segs.length)) {
        C.runs.forEach(function (r) { r.saved = true; });
        var sum = chunkTotals(C.stats);
        var prev = St.getProgress(S.progId) || {};
        var old = prev.trace || {};
        St.patchProgress(S.progId, {
          trace: {
            bestAcc: Math.max(Number(old.bestAcc) || 0, sum.accuracy),
            bestCpm: Math.max(Number(old.bestCpm) || 0, sum.cpm),
            at: Date.now()
          }
        });
      }

      /* 这一段打全对：出「下一段 →」，**不自动跳**——她可能想回看这一段（设计 C4）。 */
      if (flags[k] && k < C.segs.length - 1) {
        statsBox.appendChild(btn('py-btn py-chunk-go', t('chunkNextGo', S.lang), function () {
          setChunk(k + 1);
        }));
      }
      /* 段按钮上的 ✓ 跟着完成状态变：只在变了的时候重画段条，不每个按键都重建。 */
      var sig = flags.join(',');
      if (sig !== C.flagSig) { renderChunkBar(); }
    }

    /* 「全程 k / N 段」一格；返回每段的完成标记。 */
    function renderChunkWhole() {
      var C = S.chunk;
      var flags = chunkDoneFlags(C.segs, C.typed, C.stats);
      if (statsBox) {
        var n = flags.filter(Boolean).length;
        var s = h('span', null, t('chunkWhole', S.lang) + ' ');
        s.appendChild(h('b', null, ts('chunkWholeOf', S.lang, [n, flags.length])));
        statsBox.appendChild(s);
      }
      return flags;
    }

    /* 段条：顶栏下面独立的一行，**仅临摹模式、仅有 chunks 时**存在于 DOM 里——
       没有 chunks 的页面上这个节点根本不被插入，DOM 与合并前相同（设计 §2.4）。 */
    var chunkBar = null;
    function renderChunkBar() {
      var C = S.chunk;
      if (!C || S.mode !== 'trace') {
        if (chunkBar && chunkBar.parentNode) { chunkBar.parentNode.removeChild(chunkBar); }
        chunkBar = null;
        return;
      }
      if (!chunkBar) {
        chunkBar = h('div', 'py-chunkbar');
        main.insertBefore(chunkBar, stage);
      }
      wipe(chunkBar);
      var flags = chunkDoneFlags(C.segs, C.typed, C.stats);
      C.flagSig = flags.join(',');
      var cur = C.segs[C.seg];
      var curTitle = pick(cur.title, S.lang);
      var label = h('span', 'py-pip py-chunk-label',
        ts('chunkLabel', S.lang, [C.seg + 1, C.segs.length, curTitle, cur.fromLine, cur.toLine]));
      label.title = label.textContent;

      /* 上一段 / 下一段排在**最前**（评审 m4）：段条放不下时 overflow:hidden 裁的是行尾，
         行尾放的是可以被裁的东西（逐段按钮与「下一段」的功能重复），导航按钮永远看得见。
         收缩次序由 flex-shrink 决定：说明文字先缩，逐段按钮再缩，导航按钮不缩。 */
      var prevB = btn('py-btn py-chunk-nav', t('chunkPrev', S.lang), function () { setChunk(C.seg - 1); });
      if (C.seg === 0) { prevB.disabled = true; }
      chunkBar.appendChild(prevB);
      var nextB = btn('py-btn py-chunk-nav', t('chunkNext', S.lang), function () { setChunk(C.seg + 1); });
      if (C.seg === C.segs.length - 1) { nextB.disabled = true; }
      chunkBar.appendChild(nextB);
      chunkBar.appendChild(label);
      C.segs.forEach(function (sg, i) {
        var title = pick(sg.title, S.lang);
        var b = btn('py-btn py-chunk-seg', (flags[i] ? '✓ ' : '') + (i + 1) + ' ' + title,
                    function () { setChunk(i); });
        b.title = title;
        b.setAttribute('aria-pressed', i === C.seg ? 'true' : 'false');
        chunkBar.appendChild(b);
      });
    }

    /* ================= 顶栏 / 底栏 / 讲解面板 ================= */
    function renderTopBar() {
      wipe(topBar);
      renderChunkBar();   /* 段条跟着顶栏一起重画：模式、语言、题目一变它就要跟着变 */
      var p = current();
      if (!p) { return; }

      var vs = variantsOf(PROGRAMS, p);
      if (vs.length > 1) {
        topBar.appendChild(h('span', 'py-pip', t('variants', S.lang)));
        vs.forEach(function (q) {
          var b = btn('py-btn', pick(q.title, S.lang) || q.id, function () {
            if (q.id === p.id) { return; }
            if (S.compareId === q.id) { S.compareId = null; } else { S.compareId = q.id; }
            renderStage();
          });
          b.setAttribute('aria-pressed', (q.id === S.compareId) ? 'true' : 'false');
          if (q.id === p.id) { b.disabled = true; }
          topBar.appendChild(b);
        });
        topBar.appendChild(h('span', 'py-pip', t('compare', S.lang)));
      }

      if (S.mode === 'trace') {
        topBar.appendChild(h('span', 'py-pip', t('alpha', S.lang)));
        var sl = doc.createElement('input');
        sl.type = 'range';
        sl.className = 'py-slider';
        sl.min = '0'; sl.max = '1'; sl.step = '0.01';
        sl.value = String(S.alpha);
        sl.addEventListener('input', function () {
          S.alpha = Number(sl.value);
          if (traceUI) { traceUI.shadow.style.opacity = String(S.alpha); }
          savePrefs();
        });
        topBar.appendChild(sl);
        [['alphaTrace', 1], ['alphaFaint', 0.35], ['alphaBlind', 0]].forEach(function (pair) {
          topBar.appendChild(btn('py-btn', t(pair[0], S.lang), function () {
            S.alpha = pair[1];
            sl.value = String(S.alpha);
            if (traceUI) { traceUI.shadow.style.opacity = String(S.alpha); }
            savePrefs();
          }));
        });

        topBar.appendChild(h('span', 'py-pip', t('strictness', S.lang)));
        [['strictLoose', 'loose'], ['strictMark', 'mark'], ['strictBlock', 'block']].forEach(function (pair) {
          var b = btn('py-btn', t(pair[0], S.lang), function () {
            S.strictness = pair[1];
            savePrefs();
            renderTopBar();
            paintTrace();
          });
          b.setAttribute('aria-pressed', S.strictness === pair[1] ? 'true' : 'false');
          topBar.appendChild(b);
        });

 so a run of spaces, tabs or newlines counts as one gap and whitespace at either end gives no empty strings\"\n    words = no_punct.split()\n# \u003c\u003c\u003c BLANK\n# >>> BLANK id=join-words level=1 hint=\"\u628a words \u7528\u6070\u597d\u4e00\u4e2a\u7a7a\u683c\u91cd\u65b0\u8fde\u6210\u4e00\u4e2a\u5b57\u7b26\u4e32\u5e76\u4ea4\u56de\u53bb\uff1a\u5728\u5206\u9694\u4e32\uff08\u53cc\u5f15\u53f7\u91cc\u4e00\u4e2a\u7a7a\u683c\uff09\u4e0a\u8c03\u7528 join\" hintEn=\"Glue words back into one string with exactly one space between neighbours and return it: call join on the separator (one space in double quotes)\"\n    return \" \".join(words)\n# \u003c\u003c\u003c BLANK\n\n\ndef same_text(a, b):\n    return clean(a) == clean(b)\n\n\nif __name__ == \"__main__\":\n    samples = [\n        \"  Hello,   World!  \",\n        \"hello world\",\n        \"It's a TEST... isn't it?\",\n        \"Tabs\\tand\\nnewlines   too\",\n        \"Rock 'n' roll -- 1950s!\",\n    ]\n    for s in samples:\n        print(repr(clean(s)))\n    print(same_text(\"Hello, World!\", \"hello   world\"))\n    print(\"Hello, World!\" == \"hello   world\")\n    print(same_text(\"Don't STOP\", \"dont stop\"))\n",

      "source": "\"\"\"Read a text file and list its most common words, ignoring stopwords.\"\"\"\n\nimport string\n\nSTOPWORDS = {\"the\", \"a\", \"and\", \"on\", \"to\", \"is\", \"it\", \"was\", \"no\"}\n\n\ndef clean_words(text):\n    table = str.maketrans(\"\", \"\", string.punctuation)\n    return text.lower().translate(table).split()\n\n\ndef top_words(text, n, stopwords):\n    counts = {}\n    for word in clean_words(text):\n# >>> BLANK id=skip-stopword level=1 hint=\"\u8fd9\u4e2a\u8bcd\u5728 stopwords \u8fd9\u4e2a\u96c6\u5408\u91cc\u5c31\u8df3\u8fc7\uff1a\u7528\u6210\u5458\u8fd0\u7b97 in \u5199\u4e00\u4e2a if\uff0c\u88ab\u6d4b\u7684\u8bcd\u5199\u5728\u5de6\u8fb9\uff08\u4e0b\u4e00\u884c\u7684 continue \u5df2\u7ecf\u5199\u597d\uff09\" hintEn=\"Skip the word when it is in the set stopwords: an if with the membership operator in, the word on the left (the continue on the next line is already there)\"\n        if word in stopwords:\n# \u003c\u003c\u003c BLANK\n            continue\n        counts[word] = counts.get(word, 0) + 1\n# >>> BLANK id=rank level=3 hint=\"\u628a counts \u7684\u952e\u503c\u5bf9\u6392\u597d\u5b58\u8fdb ranked\uff1asorted \u7684\u7b2c\u4e00\u4e2a\u5b9e\u53c2\u662f counts.items()\uff0c\u518d\u7528\u5173\u952e\u5b57\u5b9e\u53c2 key \u7ed9\u4e00\u4e2a lambda\uff0c\u5b83\u7684\u53c2\u6570\u53eb pair\uff0c\u8fd4\u56de\u4e00\u4e2a\u4e8c\u5143\u7ec4\uff1b\u6b21\u6570\u90a3\u4e00\u9879\u7528\u4e00\u5143\u8d1f\u53f7\u53d6\u53cd\uff08\u4e0d\u7528 reverse=True\uff0c\u4e5f\u4e0d\u4e58\u4ee5 -1\uff09 || \u4e8c\u5143\u7ec4\u7b2c\u4e00\u9879\u8ba9\u6b21\u6570\u5927\u7684\u6392\u524d\u9762\uff1b\u7b2c\u4e8c\u9879\u662f\u5355\u8bcd\u672c\u8eab\uff0c\u6b21\u6570\u76f8\u540c\u65f6\u6309\u5b57\u6bcd\u987a\u5e8f || pair[0] \u662f\u5355\u8bcd\uff0cpair[1] \u662f\u6b21\u6570\" hintEn=\"Sort the key-value pairs of counts and keep them in ranked: the first argument to sorted is counts.items(), then the keyword argument key gets a lambda whose parameter is called pair and which returns a 2-tuple; the count is negated with a unary minus (not reverse=True, and not multiplying by -1) || The first item of the tuple puts bigger counts first; the second item is the word itself, so equal counts go in alphabetical order || pair[0] is the word and pair[1] is the count\"\n    ranked = sorted(counts.items(), key=lambda pair: (-pair[1], pair[0]))\n# \u003c\u003c\u003c BLANK\n# >>> BLANK id=take-n level=1 hint=\"\u4ea4\u56de ranked \u7684\u524d n \u9879\uff1a\u7528\u5207\u7247\uff0c\u5192\u53f7\u524d\u9762\u7684\u8d77\u70b9\u7559\u7a7a\uff08\u4e0d\u5199 0\uff09\" hintEn=\"Return the first n items of ranked with a slice, leaving the start before the colon empty (do not write 0)\"\n    return ranked[:n]\n# \u003c\u003c\u003c BLANK\n\n\nif __name__ == \"__main__\":\n    with open(\"_fixtures/passage.txt\") as f:\n        text = f.read()\n    for word, count in top_words(text, 4, STOPWORDS):\n        print(f\"{word:\u003c6}{count}\")\n    print(len(clean_words(text)), \"words before the stopwords go\")\n    print(top_words(\"b a c a b\", 10, set()))\n",

        "en": [
          "A regular expression (regex) is a small pattern language for describing text: not one exact string, but a shape that many strings can have. Python's re module runs these patterns. re.findall(pattern, text) scans text from left to right and returns a list of every piece that fits the pattern, without overlaps, as strings.",
          "The building blocks used here. A plain character matches itself: the minus sign matches a minus sign. The class shorthand backslash d matches one digit. Square brackets make a character class that matches one character from a set or range: [A-Z] is one capital letter, [aeiou] one vowel. After any item, a quantifier says how many: + means one or more, * means zero or more, ? means zero or one (optional), and {2} means exactly two.",
          "Why the r in front of every pattern? In an ordinary string Python processes backslashes first: \"\\b\" is one character, a backspace, while r\"\\b\" is two, a backslash and a b - and in a regex backslash b means \"word boundary\", which is what you usually wanted. A raw string hands the backslash to the re module untouched. Since Python 3.12 an unknown escape such as backslash d in an ordinary string even gives a SyntaxWarning. The last demo line gives 1 and 2 for those two lengths, and True because the raw string with backslash d equals the ordinary string written with a doubled backslash. The general rule for raw strings is on \u300cStrings: Text as Data\u300d.",
          "find_numbers treats a minus sign as part of a number only when it touches the digits. From the demo line it gets 12, 3, -4, 7, 30, 15, 123, -9 and -2: the 12 inside B12 and the 15 inside 15kg count, 07 becomes the int 7, and AB123-9 gives 123 and then -9, because nothing tells the pattern that this minus was really a hyphen. Regexes match shapes, not meaning. find_codes, two capitals followed by digits, finds only AB123 - B12 has one capital before its digits, not two.",
          "The quantifier lines, on a1b22: one digit at a time gives 1, 2, 2; one-or-more gives 1 and 22; zero-or-more also finds empty matches between the digits, so the list becomes an empty string, 1, an empty string, 22 and an empty string - * almost always wants company. colou?r finds color and colour but not colouur, and the vowel class finds seven vowels in regular expression."
        ],
        "zh": [
          "\u6b63\u5219\u8868\u8fbe\u5f0f\uff08regex\uff09\u662f\u4e00\u95e8\u63cf\u8ff0\u6587\u672c\u7684\u5c0f\u578b\u6a21\u5f0f\u8bed\u8a00\uff1a\u63cf\u8ff0\u7684\u4e0d\u662f\u67d0\u4e00\u4e2a\u786e\u5207\u7684\u5b57\u7b26\u4e32\uff0c\u800c\u662f\u8bb8\u591a\u5b57\u7b26\u4e32\u90fd\u53ef\u80fd\u6709\u7684\u4e00\u79cd\u5f62\u72b6\u3002Python \u7528 re \u6a21\u5757\u6765\u8dd1\u8fd9\u4e9b\u6a21\u5f0f\u3002re.findall(\u6a21\u5f0f, text) \u4ece\u5de6\u5230\u53f3\u626b\u63cf text\uff0c\u628a\u6240\u6709\u7b26\u5408\u6a21\u5f0f\u3001\u4e92\u4e0d\u91cd\u53e0\u7684\u7247\u6bb5\u4f5c\u4e3a\u5b57\u7b26\u4e32\u88c5\u8fdb\u4e00\u4e2a\u5217\u8868\u4ea4\u56de\u6765\u3002",
          "\u8fd9\u91cc\u7528\u5230\u7684\u79ef\u6728\u3002\u666e\u901a\u5b57\u7b26\u5339\u914d\u5b83\u81ea\u5df1\uff1a\u51cf\u53f7\u5339\u914d\u51cf\u53f7\u3002\u7b80\u5199\u7c7b\u300c\u53cd\u659c\u6760 d\u300d\u5339\u914d\u4e00\u4e2a\u6570\u5b57\u3002\u65b9\u62ec\u53f7\u7ec4\u6210\u5b57\u7b26\u7c7b\uff0c\u5339\u914d\u96c6\u5408\u6216\u8303\u56f4\u91cc\u7684\u4e00\u4e2a\u5b57\u7b26\uff1a[A-Z] \u662f\u4e00\u4e2a\u5927\u5199\u5b57\u6bcd\uff0c[aeiou] \u662f\u4e00\u4e2a\u5143\u97f3\u3002\u4efb\u4f55\u4e00\u9879\u540e\u9762\u90fd\u53ef\u4ee5\u8ddf\u4e00\u4e2a\u91cf\u8bcd\u8bf4\u8981\u51e0\u4e2a\uff1a+ \u662f\u4e00\u4e2a\u6216\u591a\u4e2a\uff0c* \u662f\u96f6\u4e2a\u6216\u591a\u4e2a\uff0c? \u662f\u96f6\u4e2a\u6216\u4e00\u4e2a\uff08\u53ef\u6709\u53ef\u65e0\uff09\uff0c{2} \u662f\u6070\u597d\u4e24\u4e2a\u3002",

      "source": "\"\"\"Pull every whole number out of messy text with a regular expression.\"\"\"\n\nimport re\n\n\ndef find_numbers(text):\n# >>> BLANK id=findall level=2 hint=\"\u7528 re \u6a21\u5757\u7684 findall \u5728 text \u91cc\u627e\u51fa\u5168\u90e8\u5339\u914d\uff0c\u5217\u8868\u5b58\u8fdb matches\uff1b\u6a21\u5f0f\u5199\u6210\u53cc\u5f15\u53f7\u7684\u539f\u59cb\u5b57\u7b26\u4e32\uff0c\u6570\u5b57\u7528\u7b80\u5199\u7684\u6570\u5b57\u7c7b\uff08\u53cd\u659c\u6760\u52a0 d\uff0c\u4e0d\u7528\u65b9\u62ec\u53f7\u91cc\u5199 0-9 \u7684\u8303\u56f4\uff09\uff0c\u8d1f\u53f7\u5c31\u5199\u5b83\u672c\u8eab\u3001\u7528\u4e00\u4e2a\u5355\u5b57\u7b26\u7684\u91cf\u8bcd\u6807\u6210\u53ef\u6709\u53ef\u65e0\uff1b\u6574\u4e2a\u6a21\u5f0f\u91cc\u4e0d\u7528\u82b1\u62ec\u53f7\u5199\u6b21\u6570 || \u6a21\u5f0f\u4ece\u5de6\u5230\u53f3\u662f\uff1a\u4e00\u4e2a\u53ef\u6709\u53ef\u65e0\u7684\u8d1f\u53f7\uff0c\u7136\u540e\u4e00\u4e2a\u6216\u591a\u4e2a\u6570\u5b57\" hintEn=\"Use findall from the re module to collect every match in text and keep the list in matches; write the pattern as a raw string in double quotes, with the shorthand digit class (backslash d, not a 0-9 range in square brackets); the minus sign is written as itself and made optional with a one-character quantifier; no counts in braces anywhere in the pattern || Read left to right, the pattern is: an optional minus sign, then one or more digits\"\n    matches = re.findall(r\"-?\\d+\", text)\n# \u003c\u003c\u003c BLANK\n# >>> BLANK id=to-ints level=1 hint=\"\u628a matches \u91cc\u7684\u6bcf\u4e2a\u5b57\u7b26\u4e32\u8f6c\u6210 int\uff0c\u7528\u5217\u8868\u63a8\u5bfc\u5f0f\u76f4\u63a5\u4ea4\u56de\u53bb\uff0c\u5faa\u73af\u53d8\u91cf\u53eb m\uff08\u4e0d\u7528 map\uff09\" hintEn=\"Turn every string in matches into an int and return the result straight away with a list comprehension whose loop variable is m (not map)\"\n    return [int(m) for m in matches]\n# \u003c\u003c\u003c BLANK\n\n\ndef find_codes(text):\n    return re.findall(r\"[A-Z]{2}\\d+\", text)\n\n\nif __name__ == \"__main__\":\n    line = \"Room B12: 3 chairs, -4 C at 07:30, total=15kg; ref AB123-9 and x-2\"\n    print(find_numbers(line))\n    print(find_codes(line))\n    print(re.findall(r\"\\d\", \"a1b22\"))\n    print(re.findall(r\"\\d+\", \"a1b22\"))\n    print(re.findall(r\"\\d*\", \"a1b22\"))\n    print(re.findall(r\"colou?r\", \"color colour colouur\"))\n    print(re.findall(r\"[aeiou]\", \"regular expression\"))\n    print(len(\"\\b\"), len(r\"\\b\"), r\"\\d\" == \"\\\\d\")\n",

      "blurb": {
        "en": "Check that a date is typed as DD/MM/YYYY with one fullmatch call, then convert the parts and check the ranges.",
        "zh": "\u7528\u4e00\u6b21 fullmatch \u68c0\u67e5\u65e5\u671f\u662f\u4e0d\u662f\u6309 DD/MM/YYYY \u6253\u7684\uff0c\u518d\u628a\u5404\u6bb5\u8f6c\u6210\u6574\u6570\u3001\u68c0\u67e5\u8303\u56f4\u3002"
      },
      "notes": {
        "en": [
          "Validation usually comes in two layers. First the format: is this even the right shape? Then the values: does the shape hold sensible numbers? The regex handles the first layer in one line: two digits, a slash, two digits, a slash, four digits, with {2} and {4} fixing each length exactly. Only once the shape is right is it safe to convert the pieces with int - the regex guarantees there are exactly three and that each is all digits.",
          "re has three ways to apply a pattern, and they differ in where the match may sit. fullmatch needs the whole string to fit, start to end. match only needs the beginning of the string to fit and ignores whatever follows. search looks for a fit anywhere. The last four lines show it with a pattern for one or more digits: fullmatch on 2024x gives None, match on 2024x happily finds 2024 and ignores the x, match on year 2024 gives None because the string does not start with a digit, and search finds 2024 in it. For validation you want fullmatch - with match, 25/12/2024x would have passed.",
          "The agreed rule, the same in both versions: the day must be 1 to 31 and the month 1 to 12, and nothing more - no short months, no leap years, any four-digit year. A real program would go on to check those; here the point is the format.",
          "Of the eight test strings, 25/12/2024 is ok; 5/12/2024 (one-digit day), 25-12-2024 (dashes) and 25/12/2024x (an extra character) have the wrong format; 00/10/2024 and 12/13/2024 are out of range; and 31/02/2024 and 01/01/0000 are ok - by the agreed rule, not because they are real dates.",
          "map(int, ...) applies int to each piece and the three results are unpacked into three names in one line; map is covered on \u300cComprehensions & Built-ins\u300d. Compare with Check a Date: By Hand, which does the same job with split, len and isdecimal and gives exactly the same answers."
        ],
        "zh": [
          "\u6821\u9a8c\u901a\u5e38\u5206\u4e24\u5c42\u3002\u5148\u67e5\u683c\u5f0f\uff1a\u5f62\u72b6\u5bf9\u4e0d\u5bf9\uff1f\u518d\u67e5\u53d6\u503c\uff1a\u5f62\u72b6\u91cc\u88c5\u7684\u6570\u5408\u4e0d\u5408\u7406\uff1f\u6b63\u5219\u4e00\u884c\u5c31\u7ba1\u4f4f\u7b2c\u4e00\u5c42\uff1a\u4e24\u4f4d\u6570\u5b57\u3001\u659c\u6760\u3001\u4e24\u4f4d\u6570\u5b57\u3001\u659c\u6760\u3001\u56db\u4f4d\u6570\u5b57\uff0c{2} \u548c {4} \u628a\u6bcf\u6bb5\u7684\u957f\u5ea6\u5199\u6b7b\u3002\u53ea\u6709\u5f62\u72b6\u5bf9\u4e86\uff0c\u624d\u80fd\u653e\u5fc3\u5730\u7528 int \u8f6c\u6362\u5404\u6bb5\u2014\u2014\u6b63\u5219\u4fdd\u8bc1\u4e86\u6070\u597d\u4e09\u6bb5\u3001\u6bcf\u6bb5\u5168\u662f\u6570\u5b57\u3002",

      "source": "\"\"\"Check a date typed as DD/MM/YYYY, using a regular expression for the format.\"\"\"\n\nimport re\n\n\ndef check_date(text):\n# >>> BLANK id=fullmatch level=2 hint=\"text \u6574\u4e2a\u4e0d\u7b26\u5408\u683c\u5f0f\u65f6\u8fdb\u5165\u8fd9\u4e2a if\uff1a\u7528 not \u52a0 re \u6a21\u5757\u91cc\u90a3\u4e2a\u8981\u6c42\u6574\u4e32\u90fd\u5339\u914d\u7684\u51fd\u6570\uff08\u4e0d\u662f match\uff0c\u4e5f\u4e0d\u662f search \u52a0\u951a\u70b9\uff09\uff1b\u6a21\u5f0f\u662f\u53cc\u5f15\u53f7\u7684\u539f\u59cb\u5b57\u7b26\u4e32\uff0c\u6bcf\u4e00\u4f4d\u6570\u5b57\u90fd\u7528\u7b80\u5199\u7684\u6570\u5b57\u7c7b\uff08\u53cd\u659c\u6760\u52a0 d\uff09\uff0c\u6bcf\u4e00\u6bb5\u7684\u4f4d\u6570\u7528\u82b1\u62ec\u53f7\u91cc\u7684\u6b21\u6570\u5199\u6b7b\uff08\u4e0d\u8fde\u5199\u4e24\u4e2a\u6570\u5b57\u7c7b\uff09\uff0c\u4e24\u4e2a\u659c\u6760\u539f\u6837\u5199\u3001\u524d\u9762\u4e0d\u52a0\u53cd\u659c\u6760\uff0ctext \u662f\u7b2c\u4e8c\u4e2a\u5b9e\u53c2 || \u6a21\u5f0f\u4f9d\u6b21\u662f\uff1a\u4e24\u4f4d\u6570\u5b57\u3001\u659c\u6760\u3001\u4e24\u4f4d\u6570\u5b57\u3001\u659c\u6760\u3001\u56db\u4f4d\u6570\u5b57\" hintEn=\"Enter this if when text as a whole does not fit the format: not, then the function in the re module that must match the entire string (not match, and not search with anchors); the pattern is a raw string in double quotes, every digit is the shorthand digit class (backslash d), and each group's length is fixed with a count in braces (rather than writing the digit class twice); the two slashes are written as they are, with no backslash before them; text is the second argument || The pattern is, in order: two digits, a slash, two digits, a slash, four digits\"\n    if not re.fullmatch(r\"\\d{2}/\\d{2}/\\d{4}\", text):\n# \u003c\u003c\u003c BLANK\n        return \"wrong format\"\n# >>> BLANK id=unpack level=2 hint=\"\u683c\u5f0f\u5df2\u7ecf\u5bf9\u4e86\uff1a\u628a text \u6309\u659c\u6760\uff08\u53cc\u5f15\u53f7\uff09\u5207\u5f00\uff0c\u6bcf\u6bb5\u8f6c\u6210 int\uff0c\u4e00\u6b21\u89e3\u5305\u7ed9 day\u3001month\u3001year \u4e09\u4e2a\u540d\u5b57\u2014\u2014\u7528 map\uff0c\u4e0d\u7528\u63a8\u5bfc\u5f0f || map \u7684\u7b2c\u4e00\u4e2a\u5b9e\u53c2\u662f int\uff0c\u7b2c\u4e8c\u4e2a\u662f split \u5207\u51fa\u6765\u7684\u5217\u8868\" hintEn=\"The format is right now: split text at the slashes (double quotes), turn each piece into an int and unpack them into day, month and year in one go - use map, not a comprehension || map's first argument is int and its second is the list that split gives back\"\n    day, month, year = map(int, text.split(\"/\"))\n# \u003c\u003c\u003c BLANK\n    if not 1 \u003c= day \u003c= 31 or not 1 \u003c= month \u003c= 12:\n        return \"out of range\"\n    return \"ok\"\n\n\nif __name__ == \"__main__\":\n    tests = [\n        \"25/12/2024\", \"5/12/2024\", \"25-12-2024\", \"25/12/2024x\",\n        \"31/02/2024\", \"00/10/2024\", \"12/13/2024\", \"01/01/0000\",\n    ]\n    for t in tests:\n        print(f\"{t:\u003c12}{check_date(t)}\")\n    print(re.fullmatch(r\"\\d+\", \"2024x\"))\n    print(re.match(r\"\\d+\", \"2024x\").group())\n    print(re.match(r\"\\d+\", \"year 2024\"))\n    print(re.search(r\"\\d+\", \"year 2024\").group())\n",

      "source": "\"\"\"Check a date typed as DD/MM/YYYY by hand, without a regular expression.\"\"\"\n\n\ndef check_date(text):\n    parts = text.split(\"/\")\n# >>> BLANK id=three-parts level=2 hint=\"\u4e00\u4e2a if \u7684\u5934\uff1alen \u90a3\u4e00\u4fa7\u5199\u5728\u6bd4\u8f83\u53f7\u5de6\u8fb9\uff0c\u7528\u4e0d\u7b49\u53f7\uff08\u4e0d\u7528 not \u5305\u4e00\u4e2a\u7b49\u53f7\uff09 || \u6570\u7684\u662f split \u5207\u51fa\u6765\u7684\u6bb5\u6570\uff0c\u6070\u597d 3 \u6bb5\u624d\u5bf9\" hintEn=\"The head of an if: the len side goes on the left of the comparison, with not-equal (not a not wrapped round ==) || What is counted is the pieces that split gave back, and only exactly 3 is right\"\n    if len(parts) != 3:\n# \u003c\u003c\u003c BLANK\n        return \"wrong format\"\n    for part, width in zip(parts, (2, 2, 4)):\n# >>> BLANK id=part-check level=2 hint=\"\u4e00\u4e2a if \u7684\u5934\uff1a\u8fd9\u4e00\u6bb5\u957f\u5ea6\u4e0d\u5bf9\u3001\u6216\u8005\u542b\u6709\u4e0d\u662f\u6570\u5b57\u7684\u5b57\u7b26\u2014\u2014\u4e24\u4e2a\u6761\u4ef6\u7528 or \u8fde\u8d77\u6765\uff0c\u957f\u5ea6\u90a3\u4e2a\u5728\u524d\uff1b\u957f\u5ea6\u90a3\u4e2a\u662f len \u5199\u5728\u6bd4\u8f83\u53f7\u5de6\u8fb9\u3001\u7528\u4e0d\u7b49\u53f7\uff1b\u6570\u5b57\u90a3\u4e2a\u662f not \u52a0\u5b57\u7b26\u4e32\u65b9\u6cd5 isdecimal()\uff0c\u4e0d\u7528 isdigit() \u6216 isnumeric()\uff08\u00b2 \u8fd9\u7c7b\u4e0a\u6807 isdigit() \u4e5f\u8ba4\uff0cint() \u5374\u4e0d\u8ba4\uff09 || \u88ab\u68c0\u67e5\u7684\u662f\u5faa\u73af\u91cc\u7684\u8fd9\u4e00\u6bb5 part\uff0c\u5b83\u5e94\u6709\u7684\u957f\u5ea6\u662f width\" hintEn=\"The head of an if: the piece has the wrong length or holds something that is not a digit - join the two tests with or, the length test first; the length test has len on the left of the comparison and not-equal; the digit test is not followed by the string method isdecimal(), not isdigit() or isnumeric() (isdigit() also accepts superscripts such as \u00b2, which int() rejects       "notes": {
        "en": [
          "Round brackets in a pattern make a group: they do not change what matches, but they remember the piece of text each group matched. Groups are numbered from 1 in the order their opening brackets appear; group 0 is always the whole match. On a match object, group(n) hands back one piece and groups() all of them as a tuple. The demo prints the whole match Lovelace, Ada and then the two groups Lovelace and Ada.",
          "re.sub(pattern, replacement, text) replaces every match with the replacement. Inside the replacement, backslash followed by a number refers back to what that group matched - a backreference. So a replacement that names group 2, a space, then group 1 writes the forename first. The replacement needs to be a raw string too, for the same reason as the pattern. The last demo line uses one group to put a space into 5kg and 12kg, and shows that sub changes every match, not just the first: 5 kg of flour, 12 kg of rice.",
          "backslash w is a word character: a letter, a digit or an underscore. ^ matches only at the start of the string and $ only at the end, so this pattern must cover the whole line. Without them, sub would happily rewrite a piece in the middle of a longer line.",

      "source": "\"\"\"Turn \"Surname, Forename\" into \"Forename Surname\" with groups and re.sub.\"\"\"\n\nimport re\n\n\ndef swap_name(line):\n# >>> BLANK id=sub level=3 hint=\"\u4ea4\u56de re \u6a21\u5757\u91cc sub \u7684\u7ed3\u679c\uff1a\u4e09\u4e2a\u5b9e\u53c2\u4f9d\u6b21\u662f\u6a21\u5f0f\u3001\u66ff\u6362\u4e32\u3001line\uff1b\u6a21\u5f0f\u548c\u66ff\u6362\u4e32\u90fd\u5199\u6210\u53cc\u5f15\u53f7\u7684\u539f\u59cb\u5b57\u7b26\u4e32\uff1b\u5355\u8bcd\u7528\u53cd\u659c\u6760\u52a0 w\uff08\u4e0d\u7528\u5b57\u6bcd\u8303\u56f4\uff09\uff0c\u66ff\u6362\u4e32\u91cc\u7528\u53cd\u659c\u6760\u52a0\u6570\u5b57\u5f15\u7528\u5206\u7ec4\uff08\u4e0d\u7528 g \u52a0\u5c16\u62ec\u53f7\uff09\uff1b\u9017\u53f7\u540e\u9762\u5199\u4e00\u4e2a\u666e\u901a\u7a7a\u683c\uff08\u4e0d\u7528\u53cd\u659c\u6760\u52a0 s\uff09 || \u6a21\u5f0f\u7528 ^ \u548c $ \u9489\u4f4f\u6574\u884c\uff0c\u91cc\u9762\u662f\u4e24\u4e2a\u62ec\u53f7\u5206\u7ec4\uff0c\u6bcf\u7ec4\u662f\u4e00\u4e2a\u6216\u591a\u4e2a\u5355\u8bcd\u5b57\u7b26\uff0c\u4e24\u7ec4\u4e4b\u95f4\u662f\u4e00\u4e2a\u9017\u53f7\u52a0\u4e00\u4e2a\u7a7a\u683c || \u66ff\u6362\u4e32\u662f\uff1a\u5148\u5f15\u7528\u7b2c 2 \u7ec4\uff0c\u4e00\u4e2a\u7a7a\u683c\uff0c\u518d\u5f15\u7528\u7b2c 1 \u7ec4\" hintEn=\"Return the result of sub from the re module: its three arguments are the pattern, the replacement and line; write both as raw strings in double quotes; words are backslash w (not a range of letters), and the replacement refers to groups in the backslash-number form (not g with angle brackets); after the comma write one plain space (not backslash s) || The pattern is pinned to the whole line with ^ and $, and holds two bracketed groups, each one or more word characters, with a comma and one space between them || The replacement is: group 2 first, one space, then group 1\"\n    return re.sub(r\"^(\\w+), (\\w+)$\", r\"\\2 \\1\", line)\n# \u003c\u003c\u003c BLANK\n\n\nif __name__ == \"__main__\":\n    names = [\n        \"Lovelace, Ada\", \"Turing, Alan\", \"Grace Hopper\",\n        \"Hopper,Grace\", \"O'Neil, Cathy\", \"Liskov, Barbara, Jane\",\n    ]\n    for name in names:\n        print(swap_name(name))\n    m = re.fullmatch(r\"(\\w+), (\\w+)\", \"Lovelace, Ada\")\n    print(m.group(0))\n# >>> BLANK id=groups level=1 hint=\"\u6253\u5370 m \u7684\u7b2c 1 \u7ec4\u548c\u7b2c 2 \u7ec4\uff0c\u4f5c\u4e3a print \u7684\u4e24\u4e2a\u5b9e\u53c2\uff1a\u7528 match \u5bf9\u8c61\u7684 group \u65b9\u6cd5\u3001\u7ed9\u7ec4\u53f7\uff08\u4e0d\u7528\u65b9\u62ec\u53f7\u4e0b\u6807\uff0c\u4e5f\u4e0d\u7528 groups\uff09\" hintEn=\"Print group 1 and group 2 of m as two arguments to print: use the match object's group method with the group number (not square-bracket indexing, and not groups)\"\n    print(m.group(1), m.group(2))\n# \u003c\u003c\u003c BLANK\n    print(re.sub(r\"(\\d+)kg\", r\"\\1 kg\", \"5kg of flour, 12kg of rice\"))\n",

      "notes": {
        "en": [
          "JSON is a text format for data: objects in braces, arrays in square brackets, strings in double quotes, numbers, true, false and null. Almost every language can read and write it, which makes it the usual way to save structured data or send it between programs. It looks like Python, but it is not Python: in JSON the constants are true, false and null in lower case.",
          "The json module has two pairs of functions. dumps and loads work with strings (the s is for string): dumps turns a Python value into JSON text and loads turns text back. dump and load do the same with an open file, so you never hold the text yourself. indent=2 spreads the text over lines with two-space indentation for people to read; sort_keys=True writes the keys in alphabetical order, so the same data always gives the same text.",
          "The record as JSON takes 9 lines, with the keys in the order active, marks, name, tutor. True has become true, None has become null, and the tuple (91, 78) has become an array.",
          "JSON has fewer types than Python, so a round trip is not always exact. There is no tuple in JSON, only arrays, so marks comes back as a list: that is why comparing the loaded record with the original gives False, while comparing marks with the list version of the original marks gives True. Dictionary keys must be strings in JSON: dumps turns the key 7 into the string \"7\", and loads keeps it as a string. The last line reads JSON text written by hand: false becomes False, null becomes None, and 2.5 stays a float.",

      "source": "\"\"\"A small parser for settings: [sections], key = value lines and # comments.\"\"\"\n\n\ndef parse_config(text):\n    config = {}\n    section = None\n    for number, raw in enumerate(text.splitlines(), start=1):\n        line = raw.strip()\n        if not line or line.startswith(\"#\"):\n            continue\n        if line.startswith(\"[\") and line.endswith(\"]\"):\n# >>> BLANK id=section level=3 hint=\"\u8fdb\u5165\uff08\u6216\u65b0\u5efa\uff09\u8fd9\u4e00\u8282\uff0c\u8ba9 section \u6307\u5411\u8fd9\u4e00\u8282\u7684\u5b57\u5178\uff1a\u7528 config \u7684 setdefault \u65b9\u6cd5\uff0c\u7b2c\u4e8c\u4e2a\u5b9e\u53c2\u662f\u4e00\u4e2a\u7a7a\u5b57\u5178\u3001\u5199\u6210\u4e00\u5bf9\u82b1\u62ec\u53f7\uff08\u4e0d\u7528 dict()\uff09\uff1b\u8282\u540d\u7528\u5207\u7247\u4ece line \u91cc\u53d6\u51fa\u6765\uff08\u4e0d\u7528 strip \u53bb\u6389\u65b9\u62ec\u53f7\u5b57\u7b26\uff09 || \u7b2c\u4e00\u4e2a\u5b9e\u53c2\u662f\u8282\u540d\uff1aline \u53bb\u6389\u7b2c\u4e00\u4e2a\u548c\u6700\u540e\u4e00\u4e2a\u5b57\u7b26\uff0c\u518d\u53bb\u6389\u4e24\u5934\u7684\u7a7a\u767d || \u5207\u7247\u7684\u8d77\u70b9\u662f 1\u3001\u7ec8\u70b9\u662f -1\uff0c\u540e\u9762\u7d27\u8ddf strip()\" hintEn=\"Enter (or create) this section and make section point at its dictionary: call config's setdefault method with an empty dictionary written as a pair of braces as the second argument (not dict()); cut the section name out of line with a slice (not strip with the bracket characters) || The first argument is the section name: line without its first and last characters, with the whitespace at both ends stripped off || The slice starts at 1 and stops at -1, followed straight away by strip()\"\n            section = config.setdefault(line[1:-1].strip(), {})\n# \u003c\u003c\u003c BLANK\n            continue\n# >>> BLANK id=partition level=1 hint=\"\u5728\u7b2c\u4e00\u4e2a\u7b49\u53f7\u5904\u628a line \u5207\u6210\u4e09\u4efd\uff0c\u4f9d\u6b21\u5b58\u8fdb key\u3001sep\u3001value\uff1a\u7528\u90a3\u4e2a\u603b\u662f\u4ea4\u56de\u4e09\u4efd\u7684\u5b57\u7b26\u4e32\u65b9\u6cd5\uff08\u4e0d\u662f split\uff0c\u4e5f\u4e0d\u662f\u4ece\u53f3\u8fb9\u627e\u7684\u90a3\u4e2a\uff09\uff0c\u7b49\u53f7\u5199\u5728\u53cc\u5f15\u53f7\u91cc\" hintEn=\"Cut line into three at the first equals sign and unpack into key, sep and value: use the string method that always hands back three parts (not split, and not the one that searches from the right), with the equals sign in double quotes\"\n        key, sep, value = line.partition(\"=\")\n# \u003c\u003c\u003c BLANK\n        if not sep or not key.strip():\n            raise ValueError(f\"line {number}: expected key = value\")\n        if section is None:\n            raise ValueError(f\"line {number}: {key.strip()} is outside a section\")\n# >>> BLANK id=store level=1 hint=\"\u5728\u5f53\u524d\u8fd9\u4e00\u8282\u91cc\u8bb0\u4e0b\u8fd9\u4e2a\u8bbe\u7f6e\uff1a\u952e\u548c\u503c\u90fd\u7528\u4e0d\u5e26\u5b9e\u53c2\u7684 strip \u53bb\u6389\u4e24\u5934\u7684\u7a7a\u767d\uff1b\u540c\u4e00\u4e2a\u952e\u518d\u51fa\u73b0\u65f6\uff0c\u8fd9\u4e00\u884c\u76f4\u63a5\u8986\u76d6\u524d\u4e00\u4e2a\" hintEn=\"Record the setting in the current section: strip both the key and the value with strip and no arguments, taking the whitespace off both ends; when the same key comes again, this line simply overwrites the earlier one\"\n        section[key.strip()] = value.strip()\n# \u003c\u003c\u003c BLANK\n    return config\n\n\ndef parse_or_error(text):\n    try:\n        return parse_config(text)\n    except ValueError as e:\n        return f\"error: {e}\"\n\n\nSETTINGS = \"\"\"\n# game settings\n[display]\nwidth = 800\nheight=600\ntitle = Space Race = Deluxe\n\n[sound]\nvolume = 7\n    volume = 9\n\"\"\"\n\nif __name__ == \"__main__\":\n    config = parse_config(SETTINGS)\n    print(config)\n    print(config[\"display\"][\"title\"], int(config[\"sound\"][\"volume\"]) + 1)\n    print(parse_or_error(\"[a]\\nx = 1\\njust some words\\n\"))\n    print(parse_or_error(\"speed = 3\\n[b]\\n\"))\n    print(parse_or_error(\"[a]\\n = 5\\n\"))\n",

      "notes": {
        "en": [
          "Before a program can work out 12*(3+45) it has to see it as a sequence of meaningful pieces, called tokens: 12, *, (, 3, +, 45, ). This first stage of reading a language is lexical analysis, and the function that does it is a tokeniser or lexer. It is the first stage of a compiler too. Turning the tokens into an answer is a separate job: the shunting yard algorithm on \u300cStacks & Queues\u300d takes a token list exactly like this one.",
          "The difficulty is that a number can be several characters long, so the loop needs to remember something between characters: the digits of the number it is building. That memory is the state. A digit adds to the number and moves on; the test is isdecimal(), because isdigit() also accepts superscripts such as \u00b2, which int() cannot read. Any other character first ends the number, if one is in progress, and then is dealt with itself: an operator or bracket becomes a token of its own, whitespace is skipped, and anything else is an error.",
          "The step after the loop is easy to forget: if the text ends with a digit, the last number is still sitting in the state when the loop runs out, and has to be added by hand. Without that step 12*(3+45) would still work, since it ends with a bracket, but 3+45 would lose its 45.",

      "source": "\"\"\"Split an arithmetic expression into tokens, one character at a time.\"\"\"\n\nOPERATORS = \"+-*/()\"\n\n\ndef tokenise(text):\n    tokens = []\n    number = \"\"\n    for ch in text:\n        if ch.isdecimal():\n# >>> BLANK id=grow-number level=1 hint=\"\u8fd9\u4e2a\u6570\u5b57\u5b57\u7b26\u63a5\u5230\u6b63\u5728\u62fc\u7684\u6570\u5b57\u540e\u9762\uff1a\u7528\u589e\u5f3a\u8d4b\u503c\uff08\u4e0d\u5199 number = number + \u2026\uff09\" hintEn=\"Add this digit character to the end of the number being built: use augmented assignment (not number = number + ...)\"\n            number += ch\n# \u003c\u003c\u003c BLANK\n            continue\n        if number:\n            tokens.append(number)\n            number = \"\"\n        if ch in OPERATORS:\n            tokens.append(ch)\n# >>> BLANK id=not-space level=2 hint=\"\u4e0a\u9762\u90a3\u4e2a if \u7684\u53e6\u4e00\u652f\uff1ach \u4e0d\u662f\u7a7a\u767d\u5b57\u7b26\u65f6\u8fdb\u5165\u2014\u2014\u7528 elif\uff0c\u52a0 not\uff0c\u518d\u52a0\u5b57\u7b26\u4e32\u7684\u4e00\u4e2a\u65b9\u6cd5\uff08\u4e0d\u7528\u548c\u7a7a\u683c\u6bd4\u8f83\uff0c\u90a3\u6837\u6f0f\u6389\u5236\u8868\u7b26\uff09 || \u65b9\u6cd5\u662f isspace\" hintEn=\"The other branch of the if above: enter it when ch is not a whitespace character - elif, then not, then a string method (not a comparison with a space, which would miss tabs) || The method is isspace\"\n        elif not ch.isspace():\n# \u003c\u003c\u003c BLANK\n# >>> BLANK id=raise level=2 hint=\"\u629b\u51fa ValueError\uff0c\u6d88\u606f\u662f\u4e00\u4e2a\u53cc\u5f15\u53f7\u7684 f-string\uff0c\u628a\u51fa\u95ee\u9898\u7684\u5b57\u7b26\u7528 !r \u8f6c\u6362\uff08\u5e26\u5f15\u53f7\uff09\u653e\u8fdb\u53bb\uff08\u4e0d\u8c03\u7528 repr\uff09 || f-string \u7684\u6587\u5b57\u662f\uff1aunexpected character\uff0c\u4e00\u4e2a\u7a7a\u683c\uff0c\u7136\u540e\u662f\u82b1\u62ec\u53f7\u91cc\u7684 ch!r\" hintEn=\"Raise a ValueError whose message is an f-string in double quotes that puts in the offending character with the !r conversion (so it shows with quotes; do not call repr) || The f-string's text is: unexpected character, one space, then ch!r in braces\"\n            raise ValueError(f\"unexpected character {ch!r}\")\n# \u003c\u003c\u003c BLANK\n    if number:\n        tokens.append(number)\n    return tokens\n\n\ndef tokenise_or_none(text):\n    try:\n        return tokenise(text)\n    except ValueError:\n        return None\n\n\nif __name__ == \"__main__\":\n    for expr in [\"12*(3+45)\", \" 7 - 2/ 10 \", \"(1+2)*3^2\", \"3 + x\", \"\"]:\n        try:\n            print(tokenise(expr))\n        except ValueError as e:\n            print(\"error:\", e)\n    print(tokenise_or_none(\"4 % 2\"), tokenise_or_none(\"40 2\"))\n",

/* ---- i18n ----
   与 python/app.html、python/index.html 同源的那十来行（契约 C7）。语义必须一致：
   存储键 python-lang，两处兜底都是 en 不是 zh——否则缺 key 时英文界面会突然冒出
   中文。存储键绝不能沿用别的子项目的：三个子项目的语言状态各自独立。
   面板内部的文案由 core/interact.js 自己的 STR 管，经 ctl.setLang() 传进去；
   这里只管这一页自己的 chrome。 */
var LANG_KEY = 'python-lang';
function resolveLang() {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') return q;
    var s = localStorage.getItem(LANG_KEY);
    if (s === 'en' || s === 'zh') return s;
  } catch (e) { /* file:// 下 localStorage 可能不可用 */ }
  return 'en';
}
var LANG = resolveLang();
function t(s) { return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.en) : s; }

/* 版本徽章直接读 meta，不在脚本里再抄一遍数字。抄一遍就会有两个真相：chess 的
   工具在 1.0.2 那次就是脚本里的常量忘了跟 meta 一起改，面板上整整两个版本都在
   显示旧号。 */
var VERSION = (function () {
  var m = document.querySelector('meta[name="tool-version"]');
  return (m && m.getAttribute('content')) || '0.0.0';
})();

var stageEl = document.getElementById('stage');
var h1El = document.getElementById('h1');
var verEl = document.getElementById('verBadge');
var btnLang = document.getElementById('btnLang');

function applyChrome() {
  document.documentElement.lang = (LANG === 'zh') ? 'zh-CN' : 'en';
  document.title = t(TOOL.title) + ' · Python';
  h1El.textContent = t(TOOL.h1);
  verEl.textContent = 'v' + VERSION;
  btnLang.textContent = (LANG === 'zh') ? 'EN' : '中';
}
applyChrome();

/* 内联区段是空的（新建页面还没跑过 inline_core.py）时，PyInteract 根本不存在。
   那种情况下的默认行为是一个"加载正常、然后什么都没有"的白板——本仓最讨厌的
   那种失败。所以当场把原因与修法写在舞台上，而不是只在 console 里留一条
   TypeError。 */
if (typeof PyInteract === 'undefined' || typeof PyInteract.mount !== 'function') {
  stageEl.textContent =
    'core 尚未内联：先跑 python3 python/scripts/inline_core.py（以及 build_programs.py）。'
    + ' / Core is not inlined yet: run python3 python/scripts/inline_core.py first.';
  stageEl.style.padding = '18px';
  stageEl.style.color = 'var(--trace-orange)';
} else {
  /* PROGRAMS 由 GENERATED:PROGRAMS 注入成一个全局 PyPrograms；骨架页用 none
     弃权，所以这里必须容忍它不存在（mount 会渲染出"这组筛选下没有程序"）。 */
  var PROGRAMS = (typeof PyPrograms !== 'undefined' && PyPrograms &&
                  Object.prototype.toString.call(PyPrograms.programs) === '[object Array]')
    ? PyPrograms.programs : [];

  var ctl = PyInteract.mount({
    root: stageEl, programs: PROGRAMS, lang: LANG, accent: TOOL.accent
  });

  /* chrome 与面板分开刷：mount() 已经按 LANG 渲过一遍面板，载入时再调一次
     ctl.setLang() 只是白白重渲。所以 applyChrome() 单独存在（上面已经调过），
     setLang() 才把两件事一起做。 */
  var setLang = function (l) {
    LANG = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    /* 地址栏跟着走：分享出去的链接、以及壳下一次 setFrame() 读到的都是它。 */
    try {
      var u = new URL(location.href);
      u.searchParams.set('lang', l);
      history.replaceState(null, '', u);
    } catch (e) {}
    applyChrome();
    ctl.setLang(l);
  };

  btnLang.addEventListener('click', function () { setLang(LANG === 'zh' ? 'en' : 'zh'); });
}
</script>
</body>
</html>
