<script>
'use strict';

/* ================= i18n（与 chess/cryptography 两份既有导航页逐字同源，约 15 行） ===========
   本子项目没有 viz-engine.js 那一类运行时模块可抄（design spec §0：无 canvas、
   无运行时），直接照抄既有两份的写法。语义必须一致：存储键 python-lang；
   resolveLang() 与 t() 的兜底都是 en，不是 zh —— 否则缺 key 时英文页面会突然
   冒出中文。
   存储键绝不能沿用别的子项目的：三个子项目的语言状态各自独立，共用一个键会让
   在那边切成中文的动作把这边也一起切了。 */
var LANG_KEY = 'python-lang';
function resolveLang() {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') return q;
    var s = localStorage.getItem(LANG_KEY);
    if (s === 'en' || s === 'zh') return s;
  } catch (e) { /* file:// 下 localStorage 可能不可用 */ }
  return 'en';                         // 子项目默认英文
}
var LANG = resolveLang();
function t(s) { return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.en) : s; }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================= 唯一的出站引用 =================
   这是整个 python 子树里唯一一处指向父目录的路径（另一处在 app.html，
   同样只有一处）。它的存在是为了「返回 MathViz」这一个链接；除它之外，
   core、tools、programs、scripts 四个目录里不许出现任何父目录形式的相对
   路径——check.py 的 outbound_ref_check() 逐文件数着这件事。

   为什么要数：设计约束是「把 python 整个目录复制到任何别处仍可用」。
   一条随手写下的越界相对路径会在**别人搬走目录的那一刻**才失效，而那时没有
   任何东西会报警。把它变成一条提交前就会响的断言。

   自愈：http(s) 下对这个 URL 发一次 HEAD 探测，404/网络失败就把链接藏掉。
   file:// 下 fetch 探测本来就会失败（同源限制），无法区分「文件不在」与
   「协议不让探」，所以那种情况保持显示——file:// 的使用者基本都在仓库里。 */
var PARENT_HOME = '../app.html';
/* 目的地是 MathViz 的**导航壳** app.html，不是它的扁平画廊 index.html。
   去程已经是「壳 → 壳」（根 index.html 的子项目卡片带 target="_top" 直接进
   python/app.html），回程就该对称：落在 MathViz 自己的壳上，侧边栏是
   数学工具那一条。指向 index.html 会把人扔在一张没有侧边栏的画廊上——那正是
   cryptography 那一轮修的两个 bug 的同一个形状，只是换了个方向。 */

function wireParentLink(el) {
  if (!el) return;
  el.href = PARENT_HOME + '?lang=' + LANG;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    fetch(PARENT_HOME, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) el.style.display = 'none';
    })['catch'](function () { el.style.display = 'none'; });
  } catch (e) { el.style.display = 'none'; }
}

   这里内嵌一份副本静默回落。

   生成，**不要手改**：手抄的镜像字段没人看管就一定会漂（根仓 62 条里 48 条
   静默漂移过）。改注册表，再跑那个脚本；pre-commit 钩子也会代跑。
   本页比 app.html 多带 desc：画廊卡片要显示简介，离线与线上从此一致。 */

/* 拒绝与接受**同样的尺寸与视觉权重**——ICO 明确要求拒绝不得比接受更难。
   不要把其中一个改成小字链接或次要色。 */
.mv-consent button{flex:1;padding:9px 0;border-radius:9px;cursor:pointer;font-size:12.5px;
  border:1px solid rgba(45,212,234,.45);background:rgba(45,212,234,.12);color:#bfefff}
.mv-consent button:hover{border-color:rgba(45,212,234,.8)}
.mv-consent button:focus-visible{outline:2px solid rgba(45,212,234,.85);outline-offset:2px}
/* 画廊页脚里的文字链接。壳里的图标按钮在 .sb-foot 内，样式由页面既有的
   `.sb-foot a,.sb-foot button` 规则提供，这里不要再加尺寸相关的声明——
   加了就会和那一行的 中 / ↗ / GitHub 不齐。 */
a.mv-cookie-link{margin-left:8px;cursor:pointer;text-decoration:none}
</style>
<script>
(function(){
  /* 在 iframe 里什么都不做：三个壳的 srcFor(null) 都返回 index.html，即画廊是被
     装进 iframe 的。不拦就是一次访问打两次 pageview、叠两个同意横幅。
     这里自己判断，不依赖各页的 IN_SHELL——那个变量只有根目录的 index.html 有。 */
  try { if (window.self !== window.top) return; } catch (e) { return; }

  var GA_ID = 'G-QJZ5Y8HQG9', CKEY = 'mathviz-consent', LKEY = 'python-lang';
  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lang() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'zh' || q === 'en') return q;
      var s = ls(LKEY);
      if (s === 'zh' || s === 'en') return s;
    } catch (e) {}
    return 'en';
  }
  var T = {
    zh: { msg: '我们使用 Google Analytics 了解哪些工具更有用。仅在你同意后才会设置 cookie。',
          ok: '接受', no: '拒绝', priv: '隐私说明', set: 'Cookie 设置' },
    en: { msg: 'We use Google Analytics to see which tools are useful. Cookies are set only if you agree.',
          ok: 'Accept', no: 'Reject', priv: 'Privacy', set: 'Cookie settings' }
  }[lang()];

  var loaded = false;
  function loadGA() {
    if (loaded) return; loaded = true;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date());
    /* send_page_view:false 是必须的。壳初始加载会调一次 go() 去恢复 ?tool=，
       不关掉自动 pageview 就会把第一个工具计两次。 */
    gtag('config', GA_ID, { send_page_view: false });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    send();
  }
  function path() {
    var id = null;
    try { id = new URLSearchParams(location.search).get('tool'); } catch (e) {}
    var base = location.pathname.replace(/\/[^\/]*$/, '/');
    return id ? base + 'tool/' + id : base;
  }
  function send() {
    if (!window.gtag) return;
    gtag('event', 'page_view', { page_path: path(), page_title: document.title });
  }

  /* 包装 go 而不是在三个壳里各手写一行：go 是壳换工具的唯一漏斗，包装它
     让整件事 100% 由生成器产出，三个壳一行不改。GA 看不进 iframe，所以这是
     唯一能知道「用户开了哪个工具」的地方。 */
  if (typeof window.go === 'function') {
    var _go = window.go;
    window.go = function () { var r = _go.apply(this, arguments); send(); return r; };
  }

  var box = null;
  function banner() {
    if (box) { box.hidden = false; return; }
    box = document.createElement('div');
    box.className = 'mv-consent';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', T.set);
    box.innerHTML = '<p>' + T.msg + ' <a href="../privacy.html">' + T.priv + '</a></p>'
      + '<div class="row"><button type="button" data-a="1"></button>'
      + '<button type="button" data-a="0"></button></div>';
    var b = box.querySelectorAll('button');
    b[0].textContent = T.ok; b[1].textContent = T.no;
    b[0].onclick = function () { save(CKEY, 'granted'); box.hidden = true; loadGA(); };
    /* 关闭 / Esc 等同**拒绝**，不等同同意。 */
    b[1].onclick = function () { save(CKEY, 'denied'); box.hidden = true; };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && box && !box.hidden) { save(CKEY, 'denied'); box.hidden = true; }
    });
    document.body.appendChild(box);
  }

  /* 撤回要和给出同意一样容易（ICO），所以入口必须常驻。两种宿主：
     · 壳：做成图标按钮插进 .sb-foot 的语言键旁边，继承那一行控件的现成样式，
       不引入新的视觉元素（此前是一条独占一行的文字链接，太重）。
     · 画廊页：页脚里跟在版权后面，一条文字链接。
     两处都用 title/aria-label 说明具体含义——⚙ 本身只表达「设置」。 */
  var lang = document.getElementById('btnLang');
  var bar = lang && lang.parentNode && lang.parentNode.classList.contains('sb-foot')
            ? lang.parentNode : null;
  if (bar) {
    var g = document.createElement('button');
    g.type = 'button'; g.className = 'mv-cookie-link'; g.textContent = '⚙';
    g.title = T.set; g.setAttribute('aria-label', T.set);
    g.onclick = function (e) { e.preventDefault(); banner(); };
    lang.parentNode.insertBefore(g, lang.nextSibling);
  } else {
    var foot = document.querySelector('.copyright');
    if (foot) {
      var a = document.createElement('a');
      a.className = 'mv-cookie-link'; a.href = '#'; a.textContent = '· ' + T.set;
      a.title = T.set;
      a.onclick = function (e) { e.preventDefault(); banner(); };
      foot.appendChild(a);
    }
  }

  var c = ls(CKEY);
  if (c === 'granted') loadGA();
  else if (c !== 'denied') banner();   /* 未做选择 = 未同意，不加载 GA */
})();
</script>

</body>
</html>
