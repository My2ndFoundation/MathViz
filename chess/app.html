           target="_top" 在顶层是空操作，加上是为了让这条规则在四个入口处一致。
           href 是占位的 '#'：真实地址由 wireParentLink() 在运行时写入（见脚本里的
           PARENT_HOME 一节）。这一页 100% 靠 JS 驱动，无 JS 兜底本就不成立。 -->
      <a class="brand" id="brandLink" href="#" target="_top">

<script>
'use strict';

/* ================= i18n =================
   与 chess/index.html 同源的那 15 行（它自己也是从 chess/core/viz-engine.js
   抄来的）。语义必须一致：存储键 chess-lang，两处兜底都是 en 不是 zh——
   否则缺 key 时英文页面会突然冒出中文。 */
var LANG_KEY = 'chess-lang';
var NAV_KEY = 'chess-nav';
function resolveLang() {
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') return q;
    var s = localStorage.getItem(LANG_KEY);
    if (s === 'en' || s === 'zh') return s;
  } catch (e) { /* file:// 下 localStorage 可能不可用 */ }
  return 'en';
}
var LANG = resolveLang();
function t(s) { return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.en) : s; }
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ================= 唯一的出站引用 =================
   这是整个 chess 子树里唯一一处指向父目录的路径。它的存在是为了「返回 MathViz」
   这一个链接；除它之外，core、games、tools 三个目录里不许出现任何父目录形式的
   相对路径——check.py 的 outbound_ref_check() 逐文件数着这件事。

   为什么要数：设计约束是「把 chess 整个目录复制到任何别处仍可用」。一条随手写下
   的越界相对路径会在**别人搬走目录的那一刻**才失效，而那时没有任何东西会报警。
   把它变成一条提交前就会响的断言。

   自愈：http(s) 下对这个 URL 发一次 HEAD 探测，404/网络失败就把链接藏掉。
   file:// 下 fetch 探测本来就会失败（同源限制），无法区分「文件不在」与
   「协议不让探」，所以那种情况保持显示——file:// 的使用者基本都在仓库里。
   （这一段与 cryptography/app.html 的同名一段同源；那边先落地，这里补齐。） */
var PARENT_HOME = '../app.html';

function wireParentLink(el) {
  if (!el) return;
  el.href = PARENT_HOME + '?lang=' + LANG;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    fetch(PARENT_HOME, { method: 'HEAD' }).then(function (r) {
      if (!r.ok) el.style.display = 'none';
    })['catch'](function () { el.style.display = 'none'; });
  } catch (e) { el.style.display = 'none'; }
}

/* ================= 回退列表 =================
   运行时优先 fetch('chess-tools.json')；file:// 下 fetch 会因同源限制失败，
   靠这份内嵌副本兜底——一个在 file:// 下只剩 home 一项的导航壳等于没有。
   代价是这份副本与 chess/index.html 里的那份都要跟注册表同步，由
   chess/scripts/check.py 的 fallback_check() 逐页比对 id 集合来保证。

   每条都必须带 version：srcFor() 拿它当缓存键，画廊卡片还要把它显示出来，而
   file:// 下 FALLBACK 是唯一的数据源——漏一个字段，离线打开的地址就退化成
   ?v=undefined，线上却一切正常，是那种只在别人机器上出现的 bug。
   fallback_check() 只比 id 集合，不会替你发现这件事，所以另有一道
   fallback_version_check()。 */
var FALLBACK = [
  {
    id: 'chess-moves-geometry', file: 'tools/chess-moves-geometry.html', accent: 'rose', phase: 1, version: '1.1.0',
    kicker: { en: 'Rules', zh: '规则' },
    title: { en: 'Geometry of Movement', zh: '走法的几何本质' },
    tag: { en: 'attack domain · min-move field · mobility', zh: '攻击域 · 最少步数场 · 机动性' }
  },
  {
    id: 'chess-rules-check-mate', file: 'tools/chess-rules-check-mate.html', accent: 'violet', phase: 1, version: '1.1.0',
    kicker: { en: 'Rules', zh: '规则' },
    title: { en: 'Rules, Legality and Mate', zh: '规则、合法性与将杀' },
    tag: { en: 'pseudo-legal minus legal · castling · mate', zh: '伪合法减合法 · 易位 · 将杀' }
  },
  {
    id: 'chess-game-replay', file: 'tools/chess-game-replay.html', accent: 'emerald', phase: 2, version: '1.1.0',
    kicker: { en: 'Games', zh: '棋局' },
    title: { en: 'Reading a Game', zh: '读懂一局棋' },
    tag: { en: '30 games · piece traces · evaluation curves · heat map', zh: '30 局棋谱 · 子力轨迹 · 评估曲线 · 热力图' }
  },
  {
    id: 'chess-search-minimax', file: 'tools/chess-search-minimax.html', accent: 'orange', phase: 4, version: '1.1.0',
    kicker: { en: 'Search', zh: '搜索' },
    title: { en: 'Game Trees and Search', zh: '博弈树与搜索' },
    tag: { en: 'minimax · alpha-beta · move ordering · Shannon number', zh: '极小极大 · α-β 剪枝 · 走法排序 · 香农数' }
  },
  {
    id: 'chess-board-algorithms', file: 'tools/chess-board-algorithms.html', accent: 'cyan', phase: 5, version: '1.7.0',
    kicker: { en: 'Algorithms', zh: '算法' },
    title: { en: 'Classic Problems on the Board', zh: '棋盘上的经典算法' },
    tag: { en: "N-Queens · Knight's Tour · shortest path · rooks & lines · king domination · count paths · bitboards · independent knights · field of fewest moves", zh: 'N 皇后 · 骑士巡游 · 最短路 · 车与线 · 王的支配集 · 数路径 · 位盘 · 互不攻击的马 · 最少步数场' }
  }
];
var TOOLS = FALLBACK;

   `.sb-foot a,.sb-foot button` 规则提供，这里不要再加尺寸相关的声明——
   加了就会和那一行的 中 / ↗ / GitHub 不齐。 */
a.mv-cookie-link{margin-left:8px;cursor:pointer;text-decoration:none}
</style>
<script>
(function(){
  /* 在 iframe 里什么都不做：三个壳的 srcFor(null) 都返回 index.html，即画廊是被
     装进 iframe 的。不拦就是一次访问打两次 pageview、叠两个同意横幅。
     这里自己判断，不依赖各页的 IN_SHELL——那个变量只有根目录的 index.html 有。 */
  try { if (window.self !== window.top) return; } catch (e) { return; }

  var GA_ID = 'G-QJZ5Y8HQG9', CKEY = 'mathviz-consent', LKEY = 'chess-lang';
  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lang() {
    try {
      var q = new URLSearchParams(location.search).get('lang');
      if (q === 'zh' || q === 'en') return q;
      var s = ls(LKEY);
      if (s === 'zh' || s === 'en') return s;
    } catch (e) {}
    return 'en';
  }
  var T = {
    zh: { msg: '我们使用 Google Analytics 了解哪些工具更有用。仅在你同意后才会设置 cookie。',
          ok: '接受', no: '拒绝', priv: '隐私说明', set: 'Cookie 设置' },
    en: { msg: 'We use Google Analytics to see which tools are useful. Cookies are set only if you agree.',
          ok: 'Accept', no: 'Reject', priv: 'Privacy', set: 'Cookie settings' }
  }[lang()];

  var loaded = false;
  function loadGA() {
    if (loaded) return; loaded = true;
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { window.dataLayer.push(arguments); };
    gtag('js', new Date());
    /* send_page_view:false 是必须的。壳初始加载会调一次 go() 去恢复 ?tool=，
       不关掉自动 pageview 就会把第一个工具计两次。 */
    gtag('config', GA_ID, { send_page_view: false });
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
    document.head.appendChild(s);
    send();
  }
  function path() {
    var id = null;
    try { id = new URLSearchParams(location.search).get('tool'); } catch (e) {}
    var base = location.pathname.replace(/\/[^\/]*$/, '/');
    return id ? base + 'tool/' + id : base;
  }
  function send() {
    if (!window.gtag) return;
    gtag('event', 'page_view', { page_path: path(), page_title: document.title });
  }

  /* 包装 go 而不是在三个壳里各手写一行：go 是壳换工具的唯一漏斗，包装它
     让整件事 100% 由生成器产出，三个壳一行不改。GA 看不进 iframe，所以这是
     唯一能知道「用户开了哪个工具」的地方。 */
  if (typeof window.go === 'function') {
    var _go = window.go;
    window.go = function () { var r = _go.apply(this, arguments); send(); return r; };
  }

  var box = null;
  function banner() {
    if (box) { box.hidden = false; return; }
    box = document.createElement('div');
    box.className = 'mv-consent';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-label', T.set);
    box.innerHTML = '<p>' + T.msg + ' <a href="../privacy.html">' + T.priv + '</a></p>'
      + '<div class="row"><button type="button" data-a="1"></button>'
      + '<button type="button" data-a="0"></button></div>';
    var b = box.querySelectorAll('button');
    b[0].textContent = T.ok; b[1].textContent = T.no;
    b[0].onclick = function () { save(CKEY, 'granted'); box.hidden = true; loadGA(); };
    /* 关闭 / Esc 等同**拒绝**，不等同同意。 */
    b[1].onclick = function () { save(CKEY, 'denied'); box.hidden = true; };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && box && !box.hidden) { save(CKEY, 'denied'); box.hidden = true; }
    });
    document.body.appendChild(box);
  }

  /* 撤回要和给出同意一样容易（ICO），所以入口必须常驻。两种宿主：
     · 壳：做成图标按钮插进 .sb-foot 的语言键旁边，继承那一行控件的现成样式，
       不引入新的视觉元素（此前是一条独占一行的文字链接，太重）。
     · 画廊页：页脚里跟在版权后面，一条文字链接。
     两处都用 title/aria-label 说明具体含义——⚙ 本身只表达「设置」。 */
  var lang = document.getElementById('btnLang');
  var bar = lang && lang.parentNode && lang.parentNode.classList.contains('sb-foot')
            ? lang.parentNode : null;
  if (bar) {
    var g = document.createElement('button');
    g.type = 'button'; g.className = 'mv-cookie-link'; g.textContent = '⚙';
    g.title = T.set; g.setAttribute('aria-label', T.set);
    g.onclick = function (e) { e.preventDefault(); banner(); };
    lang.parentNode.insertBefore(g, lang.nextSibling);
  } else {
    var foot = document.querySelector('.copyright');
    if (foot) {
      var a = document.createElement('a');
      a.className = 'mv-cookie-link'; a.href = '#'; a.textContent = '· ' + T.set;
      a.title = T.set;
      a.onclick = function (e) { e.preventDefault(); banner(); };
      foot.appendChild(a);
    }
  }

  var c = ls(CKEY);
  if (c === 'granted') loadGA();
  else if (c !== 'denied') banner();   /* 未做选择 = 未同意，不加载 GA */
})();
</script>

</body>
</html>
