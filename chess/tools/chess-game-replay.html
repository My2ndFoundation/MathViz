   罕见但合法——例如慢一点的弃兵局面），直线的近端不能无条件钉在 z=0。
   z=0 是「现在」，一个已经死掉的子不该看起来好像还在棋盘上存在到现在——
   它应该像所有历史一样，随 upto 增长同步后退，近端停在它被吃的那个
   ply，而不是继续伸到 0。这是对 tracePoints() 里「被吃的子不再新增
   采样点，端点自然随 upto 后退」那条既有行为的类比延伸，brief 原文的
   「到 z=0」只覆盖了它没写出来的隐含前提——这颗子还活着。 */
function drawTraces(camC) {
  var list = RP.traces(rs);
  var zs = rs.zStep, upto = rs.ply, onlyMoved = !!E.state.onlyMoved;
  for (var i = 0; i < list.length; i++) {
    var tr = list[i];
    if (onlyMoved && tr.points.length === 1) continue;
    var color = tr.code > 0 ? CYAN : ORANGE;
    var dead = tr.capturedAt != null && tr.capturedAt <= upto;
    var alpha = dead ? 0.25 : 0.85;
    if (tr.points.length === 1) {
      var p0 = tr.points[0];
      var c = L.squareCenter(CC.fileOf(p0.sq), CC.rankOf(p0.sq));
      var topPly = dead ? tr.capturedAt : upto;
      var zFar = -(upto - 0) * zs;
      var zNear = -(upto - topPly) * zs;
      E.line3(camC, [c[0], c[1], zFar], [c[0], c[1], zNear], { color: color, width: 2, alpha: alpha });
      if (dead) E.solidDot(camC, [c[0], c[1], zNear], 4, color);
      continue;
    }
    var pts = tracePoints(tr, upto, zs);
    if (pts.length < 2) continue;
    E.strokePoly(camC, pts, { color: color, width: 2, alpha: alpha });
    if (dead) E.solidDot(camC, pts[pts.length - 1], 4, color);
  }
}

/* ================= 传输控件（挂进 #recHost） ================= */
var transportEls = null;   // { play, scrub, speed, counter }
var btnPlayTop = null;     // 面板顶部复用的 Play 按钮（bindTopButtons 里赋值），syncTransport() 里同步文案

function buildTransport() {
  var host = document.getElementById('recHost');
  host.innerHTML = '';
  var row = document.createElement('div');
  row.className = 'row recrow';
  function mk(text, fn) {
    var b = document.createElement('button');
    b.className = 'btn';
    b.textContent = text;
    b.addEventListener('click', fn);
    row.appendChild(b);
    return b;
  }
  mk('⏮', function () { RP.rewind(rs); syncTransport(); });
  mk('◀', function () { RP.setPlaying(rs, false); RP.step(rs, -1); syncTransport(); });
  var play = mk('▶', function () { RP.setPlaying(rs, !rs.playing); syncTransport(); });
  mk('▶|', function () { RP.setPlaying(rs, false); RP.step(rs, 1); syncTransport(); });
  var SPEEDS = [0.5, 1, 1.5, 3, 6];
  var speed = mk('1.5×', function () {
    rs.speed = SPEEDS[(SPEEDS.indexOf(rs.speed) + 1) % SPEEDS.length];
    syncTransport();
  });
  host.appendChild(row);

  var scrub = document.createElement('input');
  scrub.type = 'range'; scrub.min = 0; scrub.step = 1;
  /* 你一动它就停在你这一步（规格 §5.1）——「全交互」与「自动演示」
     不是两种模式，是同一条时间轴的两种驱动源。 */
  scrub.addEventListener('input', function () {
    RP.setPlaying(rs, false);
    RP.goto(rs, +scrub.value);
    syncTransport();
  });
  host.appendChild(scrub);

  var counter = document.createElement('div');
  counter.className = 'recinfo';
  host.appendChild(counter);

  transportEls = { play: play, scrub: scrub, speed: speed, counter: counter };
}

/* 每帧只改文本、不重建 DOM：重建会打断 range 的拖拽手感，而且每帧
   重建十来个元素本身就吃掉绘制预算。 */
function syncTransport() {
  if (!transportEls || !rs) return;
  transportEls.play.textContent = rs.playing ? '⏸' : '▶';
  transportEls.speed.textContent = rs.speed + '×';
  transportEls.scrub.max = rs.maxPly;
  if (document.activeElement !== transportEls.scrub) transportEls.scrub.value = rs.ply;
  transportEls.counter.textContent = rs.ply + ' / ' + rs.maxPly +
    (rs.ply > 0 ? '  ' + rs.san[rs.ply - 1] : '');
  highlightMoveRow();
  syncKeyNote();   // 关键步说明卡片的可见性只与「停在哪一步」有关，与传输条同源
  /* 面板顶部复用的 Play 按钮（见下面 bindTopButtons）也读同一份 rs.playing——
     单一出处，不再靠「两个旗标碰巧从同一个默认值一起翻转」这种巧合去同步
     （那种巧合只在「唯一改变它们的地方就是同一次点击」时成立，rs.playing
     还会被传输条的其余按钮、拖动时间轴、关键步自动暂停等多条路径改写，
     不满足这个前提，必须显式同步）。 */
  if (btnPlayTop) btnPlayTop.textContent = rs.playing
    ? E.t({ zh: '⏸ 暂停', en: '⏸ Pause' })
    : E.t({ zh: '▶ 播放', en: '▶ Play' });
}

/* ================= SAN 步表（浮在 canvas 左侧，回合号 | 白 | 黑） ================= */
function rebuildMoveList() {
  var host = document.getElementById('moveList');
  if (!host) return;
  host.innerHTML = '';
  if (!rs || !rs.maxPly) {
    var empty = document.createElement('div');
    empty.className = 'mlEmpty';
    empty.textContent = E.t({ zh: '（无走法）', en: '(no moves)' });
    host.appendChild(empty);
    return;
  }
  function moveCell(ply) {
    var td = document.createElement('td');
    if (ply <= rs.maxPly) {
      td.className = 'mv';
      td.textContent = rs.san[ply - 1];
      td.dataset.ply = String(ply);
      td.addEventListener('click', function () {
        RP.setPlaying(rs, false);
        RP.goto(rs, ply);
        syncTransport();
      });
    }
    return td;
  }
  var table = document.createElement('table');
  var rounds = Math.ceil(rs.maxPly / 2);
  for (var r = 0; r < rounds; r++) {
    var tr = document.createElement('tr');
    var tdNum = document.createElement('td');
    tdNum.className = 'rnum';
    tdNum.textContent = (r + 1) + '.';
    tr.appendChild(tdNum);
    tr.appendChild(moveCell(r * 2 + 1));
    tr.appendChild(moveCell(r * 2 + 2));
    table.appendChild(tr);
  }
  host.appendChild(table);
}

/* 给当前半步的单元格加高亮，并滚动到可视区内。 */
function highlightMoveRow() {
  var host = document.getElementById('moveList');
  if (!host) return;
  var actives = host.querySelectorAll('td.mv.active');
  for (var i = 0; i < actives.length; i++) actives[i].classList.remove('active');
  if (!rs || rs.ply <= 0) return;
  var cell = host.querySelector('td.mv[data-ply="' + rs.ply + '"]');
  if (cell) {
    cell.classList.add('active');
    cell.scrollIntoView({ block: 'nearest' });
  }
}

/* ================= 关键步说明卡片（挂在 #tips 上方） ================= */
/* rs.note（{en,zh} 或 null）由 Replay.goto/rewind 维护——「停在哪一步」
   与「这一步是否有旁白」是同一件事的两面，卡片只是把它显示出来。
   dismiss 只影响「这一次停留」：noteDismissed 记的是哪个 ply 已经被关掉过，
   ply 一旦变化（继续走/回退/换棋局）就自动重新允许显示。 */
var lastNotePly = -1, noteDismissed = false;
function syncKeyNote() {
  var el = document.getElementById('keyNote');
  if (!el) return;
  if (!rs || !rs.note) { el.classList.remove('show'); return; }
  if (rs.ply !== lastNotePly) { lastNotePly = rs.ply; noteDismissed = false; }
  if (noteDismissed) { el.classList.remove('show'); return; }
  el.innerHTML = '<b>' + E.t({ zh: '关键步', en: 'Key moment' }) + '</b> — ' + E.t(rs.note);
  el.classList.add('show');
}
(function bindKeyNoteDismiss() {
  var el = document.getElementById('keyNote');
  if (el) el.addEventListener('click', function () { noteDismissed = true; syncKeyNote(); });
})();

/* ================= 棋盘视角翻转键 F ================= */
/* 键盘监听必须复用引擎那套焦点保护的判据——document.activeElement 是
   input/textarea/select/isContentEditable 时一律不响应，否则在 FEN 之类的
   输入框里打一个 f 就会翻转棋盘。 */
window.addEventListener('keydown', function (e) {
  var el = document.activeElement;
  var tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;
  if (e.key === 'f' || e.key === 'F') {
    E.cam.az = wrapPI(E.cam.az + Math.PI);
  }
});

/* ================= 棋局选择（presets，不是 views——views 只放相机角度） ================= */
/* 学习路线只有 11 局，另外 19 局由 Task 18 的棋局浏览器（按分组折叠的列表）
   进入。四个页签共享同一份 presets 数组引用——viz-engine.js 的 applyPreset()
   认出这是跨 tab 共享的同一份选择，会自动把四个 tab 的按钮高亮同步在一起，
   这样无论停在哪个页签都能换棋局，不必先切回 board。 */
var PRESETS = GM.LEARNING_ROUTE.map(function (id) {
  return { key: id,
           label: (function (h) { var s = h.White + '–' + h.Black; return { en: s, zh: s }; })(GM.headersOf(GM.byId[id])),
           onSelect: function () { loadGame(id); } };
});

/* ================= 四个页签 ================= */
var PARAMS = [];   // 没有连续量需要滑杆——回放的时间轴由传输条驱动，不是 PARAMS

var SCENES = {
  board: {
    label: { zh: '棋盘', en: 'Board' },
    brand: { zh: '一局棋是三维里的一条曲线——棋盘沿 −z 后退，摆成一叠正在翻页的历史。',
             en: 'A game of chess is a curve in three dimensions — the board recedes along −z into a stack of history flipping past.' },
    tips: { zh: '切到侧视：那一摞正在后退的方框就是回合轴本身。拖时间轴或按 ▶，看历史怎么从当前局面里「流出去」；F 翻转棋盘视角。',
            en: 'Switch to Side: the receding stack of frames is the ply axis made visible. Scrub the timeline or hit ▶ and watch history flow out of the current position; press F to flip the board.' },
    presetsLabel: { en: 'Game', zh: '棋局' },
    presets: PRESETS,
    views: { iso: VIEW_ISO, side: VIEW_SIDE, top: VIEW_TOP },
    draw: function (camC) {
      myCurTab = 'board';
      advanceReplay();
      if (!rs) { BR.drawBoard(ctx, camC, E, { layout: L }); return; }
      drawHistory(camC);
      drawPosition(camC);
    },
    readout: function () {
      /* syncTransport() 而不是只 syncKeyNote()：纯语言切换只走 applyLang() →
         updateReadout() → 这里，不经过传输条的任何按钮点击。之前只同步了
         关键步卡片，顶部 Play 按钮的文案（读 rs.playing，见 syncTransport()
         末尾）就漏了这条路径——「播放中撞上关键步自动暂停 → 切语言」会让
         按钮显示「暂停」而回放其实已经停了。syncTransport() 内部本就会调
         syncKeyNote()，这里不用再重复调用。 */
      syncTransport();
      if (!rs) return '';
      var h = GM.headersOf(rs.meta);
      return '<div>' + h.White + ' <span class="dim">' + E.t({ zh: '对', en: 'vs' }) + '</span> ' + h.Black + '</div>' +
        '<div class="dim">' + E.t({ zh: '半步', en: 'ply' }) + ' <b style="--c:var(--trace-cyan)">' + rs.ply + '</b> / ' + rs.maxPly +
        ' · ' + rs.speed + '×' + (rs.playing ? ' · ' + E.t({ zh: '播放中', en: 'playing' }) : '') + '</div>';
    },
  },

  /* eval/heat 眼下仍是最小可用占位——共享同一份 rs、同一个 drawPosition，
     暂不画各自的曲线/热力（Task 15/16），但绝不 throw，且都能正常
     切换、显示当前局面。 */
  trace: {
    label: { zh: '轨迹', en: 'Trace' },
    brand: { zh: '子力轨迹——每颗子的一生是一条线：x/y 是它站过的格，z 是回合数。',
             en: "Piece trajectories — each piece's life is one line: x/y is the square it stood on, z is the move number." },
    tips: {
      en: 'Switch to the Side view: the horizontal axis is now the move number, so every piece\'s whole life is one line. The knight that zig-zags across nine moves and the bishop that never left its square are the same object seen along time.',
      zh: '切到「侧视」：水平轴就是回合数，于是每颗子的一生都成了一条线。那只来回折了九步的马，和那只一步没离开原格的象，是同一件东西沿时间轴的两种样子。',
    },
    presetsLabel: { en: 'Game', zh: '棋局' },
    presets: PRESETS,
    views: { iso: VIEW_ISO, side: VIEW_SIDE, top: VIEW_TOP },
    toggles: [
      { key: 'onlyMoved', label: { zh: '只看走过的子', en: 'Moved only' }, color: CYAN, checked: false },
    ],
    draw: function (camC) {
      myCurTab = 'trace';
      advanceReplay();
      if (!rs) { BR.drawBoard(ctx, camC, E, { layout: L }); return; }
      drawHistory(camC);
      drawTraces(camC);
      drawPosition(camC);
    },
    readout: function () {
      syncTransport();
      if (!rs) return '';
      var list = RP.traces(rs);
      var st = traceStats(list, rs.ply);
      var busiestC = st.busiest && st.busiest.code > 0 ? 'var(--trace-cyan)' : 'var(--trace-orange)';
      var busiestTxt = st.busiest && st.busiest.steps > 0
        ? '<b style="--c:' + busiestC + '">' + pieceLetter(st.busiest.code) + CC.toAlg(st.busiest.from) + '</b> · ' +
          st.busiest.steps + ' ' + E.t({ zh: '步', en: (st.busiest.steps === 1 ? 'move' : 'moves') })
        : E.t({ zh: '（尚无）', en: '(none yet)' });
      return '<div class="dim">' + E.t({ zh: '半步', en: 'ply' }) + ' <b style="--c:var(--trace-cyan)">' + rs.ply + '</b> / ' + rs.maxPly + '</div>' +
        '<div class="dim">' + E.t({ zh: '尚存', en: 'alive' }) + ' <b>' + st.alive + '</b> / 32</div>' +
        '<div class="dim">' + E.t({ zh: '走得最多', en: 'busiest' }) + ' ' + busiestTxt + '</div>' +
        '<div class="dim">' + E.t({ zh: '一步没动', en: 'never moved' }) + ' <b>' + st.neverMoved + '</b></div>';
    },
  },

  eval: {
    label: { zh: '评估', en: 'Eval' },
    brand: { zh: '子力 / 控制 / 王安全三条曲线——占位页，见 Task 15。', en: 'Material / control / king-safety — three curves, placeholder, see Task 15.' },
    tips: { zh: '（占位）这一页之后会把三条评估曲线沿回合轴画出来；现在只显示当前局面。',
            en: '(placeholder) This tab will plot three evaluation curves along the ply axis; for now it just shows the current position.' },
    presetsLabel: { en: 'Game', zh: '棋局' },
    presets: PRESETS,
    views: { iso: VIEW_ISO, side: VIEW_SIDE },
    draw: function (camC) {
      myCurTab = 'eval';
      advanceReplay();
      if (!rs) { BR.drawBoard(ctx, camC, E, { layout: L }); return; }
      drawHistory(camC);
      drawPosition(camC);
    },
    readout: function () {
      syncKeyNote();
      if (!rs) return '';
      return '<div class="dim">' + E.t({ zh: '占位页 · 见 Task 15', en: 'placeholder · see Task 15' }) + '</div>' +
        '<div class="dim">' + E.t({ zh: '半步', en: 'ply' }) + ' ' + rs.ply + ' / ' + rs.maxPly + '</div>';
    },
  },

  heat: {
    label: { zh: '热力', en: 'Heat' },
    brand: { zh: '累计落子热力——占位页，见 Task 16。', en: 'Cumulative landing heat — placeholder, see Task 16.' },
    tips: { zh: '（占位）这一页之后会把每格被落子的累计次数画成高度；现在只显示当前局面。',
            en: '(placeholder) This tab will stand cumulative landings up as height per square; for now it just shows the current position.' },
    presetsLabel: { en: 'Game', zh: '棋局' },
    presets: PRESETS,
    views: { iso: VIEW_ISO, top: VIEW_TOP },
    draw: function (camC) {
      myCurTab = 'heat';
      advanceReplay();
      if (!rs) { BR.drawBoard(ctx, camC, E, { layout: L }); return; }
      drawPosition(camC);
    },
    readout: function () {
      syncKeyNote();
      if (!rs) return '';
      return '<div class="dim">' + E.t({ zh: '占位页 · 见 Task 16', en: 'placeholder · see Task 16' }) + '</div>' +
        '<div class="dim">' + E.t({ zh: '半步', en: 'ply' }) + ' ' + rs.ply + ' / ' + rs.maxPly + '</div>';
    },
  },
};

var TOOL = {
  id: 'chess-game-replay',
  title: { zh: '一局棋的回放 · MathViz', en: 'Game Replay · MathViz' },
  h1: { zh: '一局棋的回放', en: 'Game Replay' },
};
var VERSION = '1.0.0';

E.init({
  canvas: canvas,
  SCENES: SCENES, PARAMS: PARAMS, TOOL: TOOL,
  VERSION: VERSION,
  autoLoop: true,
});

/* buildTransport() 必须在 E.init() 之后——它要挂进 #recHost，而 #recHost
   在 init() 之前已经存在于 DOM 里，晚建没关系；真正的顺序约束是反过来的：
   E.init() 里的 buildPresets() 会先跑一遍 onSelect（loadGame），那时
   transportEls 还是 null，syncTransport() 里的 guard 会安静地跳过——
   所以这里建完传输条后要手动补一次 syncTransport()，把已经载入的
   棋局同步到刚建好的 DOM 上，不能指望 loadGame() 里那次调用替它做了这件事。 */
buildTransport();
syncTransport();

/* 面板顶部的通用 Play/Reset 按钮：与阶段 1 两个工具同一条纪律——不留给
   引擎自己的 state.running（棋没有连续模拟，这个旗标在本工具里没有意义），
   而是复用真实的回放控件路径（RP.setPlaying / RP.rewind），与传输条上的
   ⏮ / ▶ 走同一条代码路径，不会漂移。文案由 syncTransport() 统一写，
   这里只接线点击行为。 */
(function bindTopButtons() {
  btnPlayTop = document.getElementById('btnPlay');
  var btnResetTop = document.getElementById('btnReset');
  if (btnPlayTop) btnPlayTop.addEventListener('click', function () {
    if (!rs) return;
    RP.setPlaying(rs, !rs.playing);
    syncTransport();
  });
  if (btnResetTop) btnResetTop.addEventListener('click', function () {
    if (!rs) return;
    RP.rewind(rs);
    syncTransport();
  });
})();
syncTransport();   // 补一次：把 btnPlayTop 的文案也从「Pause / Resume」纠正成 rs.playing 的实际值

/* 验收探针：浏览器面板的 rAF 被节流到约十二秒一帧、document.hidden 恒为真，
   「看几秒没动」什么都证明不了。要验状态就读标志位，要验时序就直接推
   累加器。这个函数是本工具对外的唯一状态出口。 */
window.__replayProbe = function () {
  return { tool: 'chess-game-replay', tab: myCurTab, gameId: currentId,
           ply: rs && rs.ply, maxPly: rs && rs.maxPly, playing: rs && rs.playing,
           speed: rs && rs.speed, note: rs && rs.note && rs.note.en,
           flipped: isFlipped(), dt: E.state.dt, fen: rs && RP.position(rs).toFEN() };
};
/* 直接推时序用的把手：面板的 rAF 被节流到约十二秒一帧，等它自己走完
   一段是不可行的验收方式。给回放态一个出口，验收时直接喂 dt。 */
window.__rs = function () { return rs; };
window.__sync = syncTransport;
</script>
</body>
</html>
