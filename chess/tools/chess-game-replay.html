<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- 版本记录（changelog，新→旧）：
     1.0.0  2026-08-02  首发骨架：board 页（传输条 + SAN 步表 + 历史沿 −z 堆叠）与
                        四页签结构（trace/eval/heat 三页暂为最小占位，见 Task 14–16）。 -->
<meta name="tool-version" content="1.0.0">
<meta name="engine-version" content="chess-1.1.0">
<title>Game Replay · MathViz</title>
<!-- 样式令牌与组件整体搬运自 design-system/math-viz-starter.html 的 <style> 块，
     只做两处子项目专属调整：① canvas 是唯一主角，本子项目工具①②不分屏（分屏
     只属于阶段 2 之后的调试类工具）；② 默认英文——面板里没有任何硬编码中文，
     文案一律由引擎的 t() 在运行时从工具声明的 {zh,en} 对象里取。 -->
<style>
:root{
  --bg-deep:#05070d;
  --bg-mid:#0c1526;
  --trace-cyan:#2dd4ea;
  --trace-rose:#fb7185;
  --trace-violet:#a78bfa;
  --trace-emerald:#34d399;
  --trace-orange:#fb923c;
  --angle-amber:#fbbf24;
  --ui-slate:#9fb0c8;
  --ui-bright:#e2e8f0;
  --panel-bg:rgba(13,20,36,.74);
  --panel-line:rgba(148,163,184,.16);
  --font-cn:ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --font-math:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg-deep);color:var(--ui-bright);font-family:var(--font-cn)}
/* canvas 是主角：全屏置底，其余一切 UI 浮在其上，永不分屏 */
#scene{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* ---- 标题区 ---- */
.brand{position:fixed;top:20px;left:24px;pointer-events:none;user-select:none;max-width:min(520px,42vw)}
.brand .eyebrow{font-size:10px;letter-spacing:.22em;color:rgba(159,176,200,.72);margin-bottom:6px}
.brand h1{margin:0;font-family:var(--font-math);font-weight:600;font-size:26px;letter-spacing:.08em;
  color:#eef3fa;text-shadow:0 2px 20px rgba(45,212,234,.20)}
.brand p{margin:7px 0 0;font-size:12.5px;line-height:1.65;color:rgba(159,176,200,.85)}

/* ---- 页签 ---- */
.tabs{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;gap:4px;padding:4px;border-radius:999px;
  background:var(--panel-bg);border:1px solid var(--panel-line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.4);user-select:none}
.tab{border:1px solid transparent;background:transparent;color:#b8c6da;
  font-size:12.5px;font-family:var(--font-cn);padding:6px 15px;border-radius:999px;cursor:pointer;
  transition:color .15s,border-color .15s,background .15s}
.tab:hover{color:#e8f2fb}
.tab:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.tab.active{background:rgba(45,212,234,.13);border-color:rgba(45,212,234,.55);color:#9be8f7}

/* ---- 底部提示 ---- */
.hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;user-select:none;
  font-size:11px;letter-spacing:.05em;color:rgba(159,176,200,.6);white-space:nowrap}

/* ---- 控制面板 ---- */
.panel{position:fixed;top:14px;right:14px;width:304px;max-height:calc(100vh - 28px);overflow-y:auto;
  background:var(--panel-bg);border:1px solid var(--panel-line);border-radius:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none}
.panel::-webkit-scrollbar{width:6px}
.panel::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 10px;
  font-size:13px;font-weight:600;letter-spacing:.06em;color:#dbe6f5}
.panel:not(.collapsed) .panel-head{border-bottom:1px solid var(--panel-line)}
.ph-right{display:flex;align-items:center;gap:7px}
.ver{font-family:var(--font-mono);font-size:10px;color:rgba(159,176,200,.55)}
.lang{padding:3px 8px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:11px;cursor:pointer}
.lang:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.lang:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--panel-line);
  background:rgba(30,41,59,.5);color:var(--ui-slate);font-size:14px;line-height:1;cursor:pointer}
.fold:hover{border-color:rgba(45,212,234,.5);color:#bfefff}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:6px 14px 14px}

/* 滑杆 */
.ctl{margin:11px 0 3px}
.ctl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.ctl label{font-size:12px;color:#c6d2e4}
.ctl label i{font-family:var(--font-math);font-style:italic;font-size:13px}
.ctl .val{font-family:var(--font-mono);font-size:11.5px;color:#7dd3fc}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--trace-cyan);margin-top:-5px;border:2px solid #0b1220;box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(148,163,184,.28)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:2px solid #0b1220;border-radius:50%;
  background:var(--trace-cyan);box-shadow:0 0 8px rgba(45,212,234,.8)}
input[type=range]:focus-visible{outline:2px solid rgba(45,212,234,.7);outline-offset:2px;border-radius:4px}

/* 按钮 */
.row{display:flex;gap:8px;margin:13px 0 4px}
.btn{padding:6px 10px;border-radius:9px;border:1px solid rgba(148,163,184,.25);
  background:rgba(30,41,59,.55);color:#d7e2f2;font-size:12px;font-family:var(--font-cn);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:rgba(45,212,234,.55)}
.btn:focus-visible,.fold:focus-visible{outline:2px solid rgba(45,212,234,.8);outline-offset:1px}
.btn.wide{flex:1}
.btn.active{border-color:rgba(45,212,234,.8);background:rgba(45,212,234,.12);color:#9be8f7}
.views{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.views .vlabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.vbtn{padding:5px 9px;font-size:11.5px}

/* 预置内容（局面 / 棋种……）：与 .views 同一套外观，但语义上是独立控件——
   见 viz-engine.js「预置内容」一节的注释：视角回答「从哪儿看」，这里回答
   「看什么」，两者不再共用同一行按钮。 */
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px}
.presets .plabel{font-size:11.5px;color:rgba(159,176,200,.8);margin-right:2px}
.pbtn{padding:5px 9px;font-size:11.5px}

/* 开关 */
.toggles{display:flex;flex-wrap:wrap;gap:7px 12px;margin:12px 0 2px}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#c6d2e4;cursor:pointer}
.tg input{accent-color:var(--trace-cyan);width:14px;height:14px;margin:0;cursor:pointer}
.tg .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}

/* 工具自己的传输条 / IO 行；#recHost 是给它的槽，不需要的工具留空即可 */
.recrow{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 2px}
.recrow .btn{padding:5px 9px;font-size:11.5px}
.recinfo{font-family:var(--font-mono);font-size:11px;line-height:1.6;
  color:var(--ui-slate);margin:2px 0 2px;word-break:break-word}

/* 读数与提示 */
.readout{margin-top:13px;padding-top:10px;border-top:1px solid var(--panel-line);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:#a9b8cd}
/* 读数区的粗体值不再照抄 starter 的 sinC/cosC/tanC/cotC 四个三角专属类名——
   工具自己在行内写 style="--c:var(--trace-xxx)"，与 .tg .dot 用的是同一个
   自定义属性；没设 --c 时退化为 inherit，跟随 .readout 的默认字色。 */
.readout b{font-weight:600;color:var(--c, inherit)}
.readout .dim{color:rgba(159,176,200,.6)}
.tips{margin-top:11px;font-size:11px;line-height:1.65;color:rgba(159,176,200,.72)}

/* 关键步说明卡片：挂在 #tips 正上方，rs.note 非空时才出现（规格 §5 的
   「关键步自动暂停 + 弹出说明」）。与 .tips 同一份视觉语言（面板内嵌读数），
   但加一条左边框强调「这是这一步特有的旁白」，不是常驻的通用提示。 */
.keynote{display:none;margin-top:12px;padding:9px 11px;border-radius:9px;
  border-left:2px solid var(--trace-orange);background:rgba(251,146,60,.08);
  font-size:12px;line-height:1.6;color:#dbe6f5;cursor:pointer}
.keynote.show{display:block}
.keynote b{color:#fdba8c;font-weight:600}

/* SAN 步表：浮在 canvas 左侧、.brand 下方的独立面板——不是 .panel 的一部分，
   因为它属于「看什么」（棋局内容）而不是「参数与视角」。回合号 | 白 | 黑
   三列，点任意一格跳到那一步；当前半步高亮并保持在可视区内。 */
.movelist{position:fixed;left:24px;top:132px;width:196px;max-height:calc(100vh - 210px);
  overflow-y:auto;background:var(--panel-bg);border:1px solid var(--panel-line);
  border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.35);padding:6px;user-select:none;z-index:4}
.movelist::-webkit-scrollbar{width:6px}
.movelist::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:3px}
.movelist table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px}
.movelist td{padding:2.5px 4px;border-radius:5px;color:#c6d2e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.movelist td.rnum{color:rgba(159,176,200,.55);text-align:right;padding-right:6px;width:22px}
.movelist td.mv{cursor:pointer}
.movelist td.mv:hover{background:rgba(148,163,184,.14)}
.movelist td.mv.active{background:rgba(45,212,234,.16);color:#9be8f7}
.movelist .mlEmpty{padding:8px 4px;font-size:11px;color:rgba(159,176,200,.6)}

@media (max-width:760px){
  .brand{top:12px;left:14px;max-width:70vw}
  .brand h1{font-size:20px}
  .brand p{display:none}
  .tabs{top:52px;left:14px;transform:none}
  .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:62vh}
  .hint{display:none}
  .movelist{display:none}
}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="brand">
  <div class="eyebrow">INTERACTIVE CHESS · 交互式国际象棋</div>
  <h1></h1>
  <p id="brandDesc"></p>
</div>

<nav class="tabs" id="tabsNav"></nav>

<div class="movelist" id="moveList"></div>

<aside class="panel" id="panel">
  <div class="panel-head">
    <span id="panelTitle">Parameters &amp; Views</span>
    <span class="ph-right">
      <span class="ver" id="verBadge"></span>
      <button class="lang" id="btnLang" title="切换语言 / Switch language">中</button>
      <button class="fold" id="btnFold" title="收起 / 展开 · Collapse / expand">−</button>
    </span>
  </div>
  <div class="panel-body">
    <div id="paramsHost"></div>
    <div class="row">
      <button class="btn wide" id="btnPlay">⏸ Pause</button>
      <button class="btn" id="btnReset">↺ Reset</button>
    </div>
    <div id="recHost"></div>
    <div id="togglesHost"></div>
    <div id="presetsHost"></div>
    <div id="viewsHost"></div>
    <div class="readout" id="readout"></div>
    <div class="keynote" id="keyNote"></div>
    <div class="tips" id="tips"></div>
  </div>
</aside>

<div class="hint">Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · 1–9 views · T to switch tabs</div>

<script>
/* >>> GENERATED:VIZ-ENGINE */
/* 3D 渲染引擎 —— 由 design-system/math-viz-starter.html 裁剪而来。
   保留：轨道相机、透视投影与近裁剪、绘图原语、设计令牌、UI 组件、i18n。
   删除：连续时间积分、历史样本环形缓冲、三角函数专用部件、
         浮点采样录制/回放骨架（阶段 2 Task 1——每条前提在棋类工具上都不
         成立：棋没有连续演算可供逐帧采样，见下面 state.dt 的说明）。
   编辑源，运行时被内联进 tools/*.html。

   模块顶层绝不触碰 document / window.matchMedia / localStorage / location ——
   这样 `require('./viz-engine.js')` 在没有 DOM 的 node 环境里也能装载
   （见 task-12 的 Step 5 导出检查）。任何要碰 DOM 的东西都挪进 init() /
   bindOrbit() / 事件回调里，只有真正在浏览器里调用它们时才会执行。

   SCENES / PARAMS / TOOL 等「工具专属声明」不在这里假定成同名全局——
   那样在 node 下 require，或在没有声明它们的最小页面里调用 init()，会在
   第一次访问处直接 ReferenceError。这里把它们做成 init() 的可选参数，
   默认是空容器，未提供时相关机制安静地不生效。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.VizEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ================= i18n 核心（引擎区） ================= */
  const LANG_KEY = 'chess-lang';
  function resolveLang() {
    try {
      const q = new URLSearchParams(location.search).get('lang');
      if (q === 'en' || q === 'zh') return q;
      const s = localStorage.getItem(LANG_KEY);
      if (s === 'en' || s === 'zh') return s;
    } catch (e) { /* file:// 下 localStorage 可能不可用，或运行在无 DOM 环境（node） */ }
    return 'en';                       // 本子项目默认英文（规格 §1.6）
  }
  /* 默认值先摆一个字面量，真正的解析（碰 location / localStorage）延后到
     init() 才做——调用点是惰性的，模块顶层不触发它。 */
  let LANG = 'en';
  function t(s) { return (s && typeof s === 'object') ? (s[LANG] != null ? s[LANG] : s.en) : s; }
  // t() 的兜底是 s.en（与默认语言一致），不是 s.zh —— 否则缺 en 键时英文界面会突然冒出中文。

  const TAU = Math.PI * 2;

  /* 引擎级 UI 文案（英文默认；与 math-viz 的中文默认版本区分开）。
     这些是「按钮上写什么」层面的通用词汇，不属于任何单个工具，所以留在引擎里，
     不必由 init() 注入。 */
  const UI = {
    panelTitle: { zh: '参数与视角', en: 'Parameters & Views' },
    pause:  { zh: '⏸ 暂停', en: '⏸ Pause' },
    resume: { zh: '▶ 继续', en: '▶ Resume' },
    reset:  { zh: '↺ 重置', en: '↺ Reset' },
    views:  { zh: '视角', en: 'View' },
    /* 预置局面/预置内容的默认标签——场景可以用 SCENES[id].presetsLabel 覆盖它
       （如「棋种」而不是通用的「预置」），省略时退回这个通用词。 */
    presets: { zh: '预置', en: 'Preset' },
    /* 手势由 bindOrbit(canvas) 绑定，快捷键由 bindKeyboard() 绑定（见「交互」
       一节）——两组都是 init() 会自动接好的，提示语把它们列在一起。 */
    hint:   { zh: '拖拽旋转 · 滚轮 / 双指缩放 · 右键或 Shift 拖拽平移 · 双击回正 · 1–9 视角 · T 切换页签',
              en: 'Drag to rotate · Scroll / pinch to zoom · Right-click or Shift-drag to pan · Double-click to reset · 1–9 views · T to switch tabs' }
  };

  /* ================= 常量与状态（引擎区，以下一般无需改动） ================= */
  const NEAR = 0.15;       // 近裁剪面

  const FONT_CN = 'ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
  const FONT_MATH = 'Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif';

  /* window.matchMedia 的结果；只在 init() 里读一次（硬约束：模块顶层不碰 window）。 */
  let REDUCED = false;

  /* state.dt：本帧的时长（秒），由 frame() 每帧写入，已 clamp 到 [0, 0.05]
     以熬过后台标签页的时间跳变。场景在 draw() 里读它来推进自己的动画——
     这是引擎唯一的时钟出口。工具不得自己再用 performance.now() 算一遍：
     同一个量两处计算必然漂移（阶段 1 的两个工具各自造了一份 frameDt()，
     阶段 2 Task 1 一并收口）。running 默认 false（载入即暂停）——不是继承自
     math-viz 引擎的 true——那边的工具天生是一段持续运行的连续模拟，
     「打开就在动」是常态；棋类工具没有连续模拟，running 目前唯一的效果是
     喂给播放按钮的文案，真正的「自动巡回演示」是每个工具自己的
     demoRunning/demoPlaying 在管。默认给 true 会让按钮在打开页面的瞬间就
     显示「暂停」，暗示着有什么正在跑，这正是用户在两个棋类工具上报的体验
     问题的根——用户到达页面时演示已经在切换，第一件事却要去找暂停键。
     默认 false 让「打开 = 静止，播放是你主动要的」对每一个未来要接这份
     引擎的棋类工具都成立，不必每个工具各自记得覆盖它。 */
  const state = { running: false, dt: 0 };
  let curTab = null;
  const RELABEL = [];        // 语言切换时需要重新取文案的回调列表
  const cams = {};           // tabId -> 该页签「首视角」对应的相机参数（启动 / 双击回正用）
  /* cam 是「唯一一份」可变对象：往后任何「换页签因而换相机」都用 Object.assign(cam, ...)
     原地改写，绝不 `cam = 别的对象`——否则导出的 VizEngine.cam 会在换页签后指向一个
     没人再更新的旧对象。默认值给一个通用的三视角，供没有 SCENES 的最小用法直接可用。 */
  let cam = { az: -0.6, el: 0.32, dist: 10, tx: 0, ty: 0, tz: 0 };
  let tween = null;
  const lastView = {};
  /* tabId -> 当前选中的预置内容 key（见「预置内容」一节）。与 lastView 同一手法：
     views 是相机角度的单选记忆，lastPreset 是内容（局面/棋种/……）的单选记忆——
     两者过去被 Task 6 误合并进同一份 views（onSelect 里塞内容加载），这里把它们
     拆成两份独立状态，谁也不再替谁背锅。 */
  const lastPreset = {};

  /* SCENES / PARAMS / TOOL / 版本号：工具专属声明，由 init() 可选注入。
     默认给空容器而不是假定同名全局已存在——这样 require() 或在没提供它们的
     最小页面上调用 init() 都不会在访问处抛 ReferenceError，机制只是安静地不生效。 */
  let SCENES = {};
  let PARAMS = [];
  let TOOL = { id: null, title: { zh: '', en: '' }, h1: { zh: '', en: '' } };
  let VERSION = '0.0.0';

  /* ================= 画布 ================= */
  let canvas = null, ctx = null;
  let W = 0, H = 0, DPR = 1, FOCAL = 900, CX = 0, CY = 0, bgGrad = null;

  function resize() {
    if (!canvas) return;
    DPR = Math.min(2.5, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    FOCAL = 1.2 * Math.min(H, W * 1.1);
    bgGrad = ctx.createRadialGradient(W*0.5, H*0.3, 0, W*0.5, H*0.42, Math.max(W, H)*0.95);
    bgGrad.addColorStop(0, '#0c1526');
    bgGrad.addColorStop(1, '#05070d');
  }

  /* ================= 基础数学 ================= */
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const wrapPI = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
  const ease = k => k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;
  const fmt = (x, d = 2) => x.toFixed(d);
  const fmtS = (x, d = 2) => (x < 0 ? '−' : '') + Math.abs(x).toFixed(d);

  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

  /* ================= 轨道相机与投影 ================= */
  // 仰角安全范围：world up 取的是 (0,1,0)，el 趋近 ±π/2 时 forward 与它共线，
  // 下面 cross(f, [0,1,0]) 会退化成一个接近零的向量——右/上手基就此失定，
  // 不会报错，是整块画面悄悄塌缩成屏幕正中的一个点（norm() 对零向量的
  // 兜底是 0/1=0，不是抛异常）。bindOrbit() 里鼠标拖拽早就把 el 夹在这个
  // 范围内（见下面 pointermove 的 clamp），但那只管交互拖拽——SCENES 里
  // 声明的视角预设（tools/*.html 的 CAM_TOP 之类）是直接把 el 写进
  // tween.to 再原样赋给 cam.el 的，不经过那处 clamp。这里把同一对边界
  // 值搬到相机基本身的计算里，保证不管 cam.el 是被拖出来的还是被某个
  // 视角预设直接赋值出来的，算出来的基永远不会撞上这个奇点——单一出口，
  // 以后任何新工具写一个贴着 ±π/2 的 el 都不会把渲染悄悄弄坏。
  const EL_MIN = -1.45, EL_MAX = 1.53;
  function makeCam() {
    const elC = clamp(cam.el, EL_MIN, EL_MAX);
    const cp = Math.cos(elC), sp = Math.sin(elC);
    const eye = [
      cam.tx + cam.dist * cp * Math.sin(cam.az),
      cam.ty + cam.dist * sp,
      cam.tz + cam.dist * cp * Math.cos(cam.az)
    ];
    const f = norm(sub([cam.tx, cam.ty, cam.tz], eye));
    const r = norm(cross(f, [0, 1, 0]));
    const u = cross(r, f);
    return { eye, f, r, u };
  }
  function camPt(C, p) {
    const d = sub(p, C.eye);
    return [dot3(d, C.r), dot3(d, C.u), dot3(d, C.f)];
  }
  function scr(c) { const s = FOCAL / c[2]; return [CX + c[0]*s, CY - c[1]*s]; }
  function proj(C, p) { const c = camPt(C, p); return c[2] < NEAR ? null : scr(c); }
  function clipNear(a, b) {
    const tt = (NEAR - a[2]) / (b[2] - a[2]);
    return [a[0] + (b[0]-a[0])*tt, a[1] + (b[1]-a[1])*tt, NEAR];
  }

  /* proj() 的反方向：给一个屏幕点，把「相机 eye 出发经过该像素的那条射线」
     与世界平面 z = planeZ 求交，返回世界坐标 [x, y, planeZ]，射线与平面
     平行（或恰好落在平面内，同样无唯一解）或交点落在相机之后都返回 null。
     推导：scr() 是 cz=1 那层的仿射投影，把它反过来，屏幕点 (sx,sy) 对应
     相机空间方向 (cx, cy, 1)（cx=(sx-CX)/FOCAL, cy=(CY-sy)/FOCAL），
     camPt() 的基是正交的 {r,u,f}，所以世界方向就是 cx·r + cy·u + 1·f——
     和 camPt() 互为逆变换，同一份 FOCAL/CX/CY 用两次，谁都不用再猜一遍。
     这是 BoardRender.pickSquare（点击选子）能成立的唯一依据。 */
  function unproject(C, screenXY, planeZ) {
    if (planeZ == null) planeZ = 0;
    const cx = (screenXY[0] - CX) / FOCAL;
    const cy = (CY - screenXY[1]) / FOCAL;
    const dir = [
      cx * C.r[0] + cy * C.u[0] + C.f[0],
      cx * C.r[1] + cy * C.u[1] + C.f[1],
      cx * C.r[2] + cy * C.u[2] + C.f[2]
    ];
    if (Math.abs(dir[2]) < 1e-9) return null;             // 射线与平面平行（或共面），无唯一交点
    const tt = (planeZ - C.eye[2]) / dir[2];
    if (tt <= 0) return null;                              // 交点在相机之后（或恰在相机上）
    return [C.eye[0] + dir[0]*tt, C.eye[1] + dir[1]*tt, planeZ];
  }

  /* 投影常量的只读访问器——FOCAL/CX/CY/W/H 是模块私有的，之前每个消费方
     只能各自重新推一遍 FOCAL = 1.2·min(H, W·1.1) 的公式；棋子预览页就吃过
     这个亏（算错一次，全部棋子跟着错位）。往后任何要自己做投影相关计算
     的调用方，都从这里取权威值，不再重新推导。 */
  function viewInfo() { return { FOCAL: FOCAL, CX: CX, CY: CY, W: W, H: H }; }

  /* 让「ctx 参数」名副其实：drawBoard/drawPiece 这类跨模块的绘制函数把
     ctx 当参数注入，是为了能在 node 下装载、能给第二块画布画图（如规则
     工具要并排画伪合法/合法两块棋盘）。但 strokePoly/label3 等图元一直画
     在本模块 init() 时钉死的模块私有 ctx 上，从不重新指向别的画布——于是
     drawBoard(someOtherCanvas, …) 的输出会被悄悄劈成两半。withContext()
     在 fn() 执行期间把私有 ctx 换成调用方给的目标画布，结束后原样复原；
     选它而不是给每个图元加 ctx 形参，是因为改动只集中在一处，图元本身、
     调用点都不用逐个改签名。 */
  function withContext(targetCtx, fn) {
    const prev = ctx;
    ctx = targetCtx;
    try { return fn(); }
    finally { ctx = prev; }
  }

  /* 折线路径（支持 null 断点 + 近平面裁剪）；返回 [首点, 末点] 屏幕坐标 */
  function polyPath(C, pts) {
    if (pts.length < 2) return null;
    let head = null, tail = null, contin = false, prev = null;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const P = pts[i];
      if (P === null) { prev = null; contin = false; continue; }
      const cur = camPt(C, P);
      if (prev !== null) {
        let a = prev, b = cur;
        const av = a[2] >= NEAR, bv = b[2] >= NEAR;
        if (av || bv) {
          if (!av) a = clipNear(a, b);
          if (!bv) b = clipNear(b, a);
          const sA = scr(a), sB = scr(b);
          if (!contin) ctx.moveTo(sA[0], sA[1]);
          ctx.lineTo(sB[0], sB[1]);
          if (!head) head = sA;
          tail = sB;
          contin = bv;
        } else {
          contin = false;
        }
      }
      prev = cur;
    }
    return head ? [head, tail] : null;
  }

  function strokePoly(C, pts, o) {
    const ht = polyPath(C, pts);
    if (!ht) return;
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = o.width || 2;
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.dash) ctx.setLineDash(o.dash);
    if (o.fade) {
      const h = ht[0], tt = ht[1];
      if (Math.hypot(tt[0]-h[0], tt[1]-h[1]) < 2) {
        ctx.strokeStyle = o.fade[0];
      } else {
        const g = ctx.createLinearGradient(h[0], h[1], tt[0], tt[1]);
        g.addColorStop(0, o.fade[0]);
        g.addColorStop(1, o.fade[1]);
        ctx.strokeStyle = g;
      }
    } else {
      ctx.strokeStyle = o.color;
    }
    ctx.stroke();
    ctx.restore();
  }
  const line3 = (C, a, b, o) => strokePoly(C, [a, b], o);

  function glowDot(s, r, core, mid) {
    const g = ctx.createRadialGradient(s[0], s[1], 0, s[0], s[1], r);
    g.addColorStop(0, core);
    g.addColorStop(0.35, mid);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }
  function solidDot(C, p, r, color) {
    const s = proj(C, p);
    if (!s) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(s[0], s[1], r, 0, TAU);
    ctx.fill();
  }

  function label3(C, p, text, o) {
    const s = proj(C, p);
    if (!s) return;
    ctx.save();
    ctx.font = o.font || ((o.size || 12) + 'px ' + FONT_CN);
    ctx.fillStyle = o.color || '#c4d2e6';
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(3,6,12,.85)';
    ctx.shadowBlur = 4;
    ctx.fillText(text, s[0] + (o.dx || 0), s[1] + (o.dy || 0));
    ctx.restore();
  }

  function arrowAt(C, tip3, before3, color) {
    const tp = proj(C, tip3), b = proj(C, before3);
    if (!tp || !b) return;
    const a = Math.atan2(tp[1]-b[1], tp[0]-b[0]);
    const L = 9;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a-0.42), tp[1]-L*Math.sin(a-0.42));
    ctx.moveTo(tp[0], tp[1]); ctx.lineTo(tp[0]-L*Math.cos(a+0.42), tp[1]-L*Math.sin(a+0.42));
    ctx.stroke();
    ctx.restore();
  }

  /* ================= 常用场景部件 ================= */
  const AXIS = 'rgba(159,176,200,0.9)';
  const AXIS_DIM = 'rgba(159,176,200,0.5)';

  /* 坐标轴：o = { ex, ey, yTicks:[], xTicks:[] }。
     starter 版本还有个 tAxis（z 轴当连续时间轴用，靠一个「波形可视长度」常量定长、
     按秒打刻度）——棋没有连续时间驱动，这条分支随那个时间长度常量一起删掉了，
     只留平面上的 x/y 两轴。 */
  function drawAxes(C, o) {
    const ex = o.ex, ey = o.ey;
    line3(C, [-ex, 0, 0], [ex, 0, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [ex, 0, 0], [ex - 0.2, 0, 0], AXIS);
    label3(C, [ex + 0.22, 0, 0], 'x', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    line3(C, [0, -ey, 0], [0, ey, 0], { width: 1.4, color: AXIS });
    arrowAt(C, [0, ey, 0], [0, ey - 0.2, 0], AXIS);
    label3(C, [0, ey + 0.18, 0], 'y', { font: 'italic 15px ' + FONT_MATH, color: '#c4d2e6', align: 'center' });
    for (const k of (o.yTicks || [])) {
      for (const yv of [k, -k]) {
        line3(C, [-0.05, yv, 0], [0.05, yv, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [-0.13, yv, 0], (yv < 0 ? '−' : '') + Math.abs(yv), { size: 10, color: 'rgba(159,176,200,.7)', align: 'right' });
      }
    }
    for (const k of (o.xTicks || [])) {
      for (const xv of [k, -k]) {
        line3(C, [xv, -0.05, 0], [xv, 0.05, 0], { width: 1.2, color: AXIS_DIM });
        label3(C, [xv, -0.24, 0], (xv < 0 ? '−' : '') + Math.abs(xv), { size: 10, color: 'rgba(159,176,200,.55)', align: 'center' });
      }
    }
  }

  /* z=0 平面方格网格（几何类场景） */
  function drawGridXY(C, g, step) {
    const n = Math.round(g / step);
    for (let i = -n; i <= n; i++) {
      if (i === 0) continue;
      const u = i * step;
      line3(C, [u, -g, 0], [u, g, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
      line3(C, [-g, u, 0], [g, u, 0], { width: 1, color: 'rgba(148,163,184,0.08)' });
    }
  }

  /* ================= 主绘制与主循环 ================= */
  function draw() {
    if (!ctx) return;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    const C = makeCam();
    if (curTab != null && SCENES[curTab] && typeof SCENES[curTab].draw === 'function') {
      SCENES[curTab].draw(C);
    }
  }

  function updateReadout() {
    if (!roEl || curTab == null || !SCENES[curTab] || typeof SCENES[curTab].readout !== 'function') return;
    roEl.innerHTML = SCENES[curTab].readout();
  }

  /* 帧级异常兜底：同一页签的同一条错误只报一次，否则 60 fps 会把控制台刷爆。
     resetSim() 会清空它——用户主动重置后应当允许重新报。 */
  const frameErrSeen = Object.create(null);
  function frameError(err) {
    const k = curTab + '|' + ((err && err.message) || err);
    if (frameErrSeen[k]) return;
    frameErrSeen[k] = 1;
    console.warn('[frame] 场景「' + curTab + '」抛出异常，已跳过该帧并继续渲染循环：', err);
  }

  function resetSim() {
    Object.keys(frameErrSeen).forEach(k => delete frameErrSeen[k]);
  }

  let lastTs = 0, lastRO = 0;
  function frame(ts) {
    try {
      if (!lastTs) lastTs = ts;
      const dt = clamp((ts - lastTs) / 1000, 0, 0.05);
      lastTs = ts;

      if (tween) {
        const k = Math.min(1, (ts - tween.t0) / tween.dur);
        const e = ease(k);
        const f = tween.from, o = tween.to;
        cam.az = f.az + wrapPI(o.az - f.az) * e;
        cam.el = f.el + (o.el - f.el) * e;
        cam.dist = f.dist + (o.dist - f.dist) * e;
        cam.tx = f.tx + (o.tx - f.tx) * e;
        cam.ty = f.ty + (o.ty - f.ty) * e;
        cam.tz = f.tz + (o.tz - f.tz) * e;
        if (k >= 1) tween = null;
      }

      state.dt = dt;

      draw();
      if (ts - lastRO > 120) { lastRO = ts; updateReadout(); }
    } catch (err) {
      frameError(err);
    } finally {
      requestAnimationFrame(frame);
    }
  }

  /* ================= UI 生成（由消费方通过 init() 提供的 PARAMS / SCENES 声明驱动） ================= */
  const paramWraps = {};   // key -> { wrap, input, val, p }

  function buildParams() {
    const host = document.getElementById('paramsHost');
    if (!host || !PARAMS) return;
    PARAMS.forEach(p => {
      const wrap = document.createElement('div');
      wrap.className = 'ctl';
      wrap.innerHTML = '<div class="top"><label></label><span class="val"></span></div>';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value;
      const val = wrap.querySelector('.val');
      const render = () => { val.textContent = p.fmt(parseFloat(input.value)); };
      const upd = () => {
        const raw = parseFloat(input.value);
        state[p.key] = p.map ? p.map(raw) : raw;
        render();
      };
      input.addEventListener('input', upd);
      wrap.appendChild(input);
      host.appendChild(wrap);
      paramWraps[p.key] = { wrap, input, val, p };
      upd();                       // 建面板时用默认刻度初始化 state
      const relabel = () => { wrap.querySelector('label').innerHTML = t(p.label); render(); };
      RELABEL.push(relabel);
      relabel();
    });
  }

  /* 按当前页签的 params 显隐滑块。省略 params = 全部显示（向后兼容）。 */
  function syncParamVisibility() {
    const list = SCENES[curTab] && SCENES[curTab].params;
    Object.keys(paramWraps).forEach(k => {
      paramWraps[k].wrap.style.display = (!list || list.indexOf(k) >= 0) ? '' : 'none';
    });
  }

  function buildToggles() {
    const host = document.getElementById('togglesHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const grp = document.createElement('div');
      grp.className = 'toggles';
      grp.dataset.tab = id;
      (SCENES[id].toggles || []).forEach(tg => {
        if (!(tg.key in state)) state[tg.key] = tg.checked;
        const lab = document.createElement('label');
        lab.className = 'tg';
        lab.innerHTML = '<input type="checkbox" data-key="' + tg.key + '"' + (state[tg.key] ? ' checked' : '') + '>' +
          '<i class="dot" style="--c:' + tg.color + '"></i><span class="tgl"></span>';
        const cb = lab.querySelector('input');
        cb.addEventListener('change', () => {
          state[tg.key] = cb.checked;
          document.querySelectorAll('input[data-key="' + tg.key + '"]').forEach(o => { o.checked = cb.checked; });
        });
        const relabel = () => { lab.querySelector('.tgl').innerHTML = t(tg.label); };
        RELABEL.push(relabel);
        relabel();
        grp.appendChild(lab);
      });
      host.appendChild(grp);
    });
  }

  function buildViews() {
    const host = document.getElementById('viewsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const row = document.createElement('div');
      row.className = 'views';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'vlabel';
      row.appendChild(lab);
      const labRelabel = () => { lab.textContent = t(UI.views); };
      RELABEL.push(labRelabel);
      labRelabel();
      Object.keys(SCENES[id].views || {}).forEach(name => {
        const b = document.createElement('button');
        b.className = 'btn vbtn';
        b.dataset.view = name;
        b.addEventListener('click', () => applyView(name));
        row.appendChild(b);
        const relabel = () => { b.textContent = t(SCENES[id].views[name].label); };
        RELABEL.push(relabel);
        relabel();
      });
      host.appendChild(row);
    });
  }

  /* ================= 预置内容（局面 / 棋种……）================= */
  /* Task 6 的原话是「预置局面（views 的 onSelect 里加载）」——把内容选择塞进
     相机角度控件里。这两件事其实互不相干：相机角度回答「从哪儿看」，预置
     内容回答「看什么」。合并的后果是两头都坏：选了某个局面，相机会跟着
     跳；想从顶视角看某个局面，view 一栏根本没有这个组合按钮。这里补一个
     独立控件——buildParams / buildToggles / buildViews 之外的第四种——
     专门表示「离散的、有名字的内容」：一组按钮，互斥选中，选中的 key 写进
     导出的 state，并调用调用方给的 onSelect（真正去加载那份内容，如
     Interact.create(FEN) 或切换 E.state 里的棋种索引）。

     声明形状：SCENES[id].presets = [{ key, label, onSelect }, ...]，
     可选 SCENES[id].presetsLabel 覆盖分组标签（省略时用通用的 UI.presets——
     「预置/Preset」——见上面的声明）。没有声明 presets 的场景，#presetsHost
     里对应那一行不会出现，与 toggles/views 的既有习惯一致。 */
  function buildPresets() {
    const host = document.getElementById('presetsHost');
    if (!host) return;
    Object.keys(SCENES).forEach(id => {
      const list = SCENES[id].presets;
      if (!list || !list.length) return;
      const row = document.createElement('div');
      row.className = 'presets';
      row.dataset.tab = id;
      const lab = document.createElement('span');
      lab.className = 'plabel';
      row.appendChild(lab);

    if (parts.length < 4) throw new Error('Bad FEN: expected at least 4 fields, got ' + parts.length);
    const rows = parts[0].split('/');
    if (rows.length !== 8) throw new Error('Bad FEN: expected 8 ranks, got ' + rows.length);

    const p = new Position();
    let wKings = 0, bKings = 0;
    for (let r = 0; r < 8; r++) {
      const row = rows[7 - r];          // FEN 从第 8 横行开始写
      let f = 0;
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch >= '1' && ch <= '8') { f += +ch; continue; }
        const lower = ch.toLowerCase();
        const code = FEN_TO_CODE[lower];
        if (!code) throw new Error('Bad FEN: unknown piece "' + ch + '"');
        if (f > 7) throw new Error('Bad FEN: rank ' + (r + 1) + ' overflows');
        const s = SQ(f, r);
        const signed = (ch === lower) ? -code : code;
        p.board[s] = signed;
        if (code === K) {
          if (signed > 0) { p.kingW = s; wKings++; } else { p.kingB = s; bKings++; }
        }
        f++;
      }
      if (f !== 8) throw new Error('Bad FEN: rank ' + (r + 1) + ' has ' + f + ' squares, expected 8');
    }
    // 没有王、或某一方不止一个王，都不是一个真实的国际象棋局面 ——
    // 放任它通过会让 legalMoves/inCheck 在下游悄悄地对着 −1 出错。
    // 但这条护栏只对"对局"场景成立：有些教学用途（例如孤马 BFS 到
    // 每格最短步数场）就是要表示没有王的局面，所以留一个显式的
    // opt-out —— { requireKings: false }，默认仍为 true。
    if (requireKings) {
      if (wKings !== 1) throw new Error('Bad FEN: white must have exactly one king, found ' + wKings);
      if (bKings !== 1) throw new Error('Bad FEN: black must have exactly one king, found ' + bKings);
    }

    if (parts[1] !== 'w' && parts[1] !== 'b') {
      throw new Error('Bad FEN: side to move must be "w" or "b", got "' + parts[1] + '"');
    }
    p.turn = parts[1] === 'b' ? BLACK : WHITE;
    if (parts[2] !== '-') {
      if (parts[2].indexOf('K') >= 0) p.castling |= 1;
      if (parts[2].indexOf('Q') >= 0) p.castling |= 2;
      if (parts[2].indexOf('k') >= 0) p.castling |= 4;
      if (parts[2].indexOf('q') >= 0) p.castling |= 8;
    }
    p.ep = parts[3] === '-' ? -1 : fromAlg(parts[3]);
    if (parts.length > 4 && !/^\d+$/.test(parts[4])) {
      throw new Error('Bad FEN: half-move clock must be a non-negative integer, got "' + parts[4] + '"');
    }
    if (parts.length > 5 && !/^\d+$/.test(parts[5])) {
      throw new Error('Bad FEN: full-move number must be a non-negative integer, got "' + parts[5] + '"');
    }
    p.half = parts.length > 4 ? parseInt(parts[4], 10) : 0;
    p.full = parts.length > 5 ? parseInt(parts[5], 10) : 1;
    return p;
  };

  Position.prototype.toFEN = function () {
    const rows = [];
    for (let r = 7; r >= 0; r--) {
      let row = '', gap = 0;
      for (let f = 0; f < 8; f++) {
        const v = this.board[SQ(f, r)];
        if (v === EMPTY) { gap++; continue; }
        if (gap) { row += gap; gap = 0; }
        const ch = CODE_TO_FEN[Math.abs(v)];
        row += v > 0 ? ch.toUpperCase() : ch;
      }
      if (gap) row += gap;
      rows.push(row);
    }
    let cast = '';
    if (this.castling & 1) cast += 'K';
    if (this.castling & 2) cast += 'Q';
    if (this.castling & 4) cast += 'k';
    if (this.castling & 8) cast += 'q';
    return rows.join('/') + ' ' + (this.turn === WHITE ? 'w' : 'b') +
           ' ' + (cast || '-') +
           ' ' + (this.ep < 0 ? '-' : toAlg(this.ep)) +
           ' ' + this.half + ' ' + this.full;
  };

  const FLAG = { CAPTURE: 1, EP: 2, CASTLE_K: 4, CASTLE_Q: 8, DOUBLE: 16, PROMO: 32 };

  // 0x88 下的方向偏移：+16 是往上一横行，+1 是往右一直列。
  const OFF_N = [33, 31, 18, 14, -33, -31, -18, -14];
  const OFF_B = [17, 15, -17, -15];
  const OFF_R = [16, 1, -16, -1];
  // 八个方向的并集：斜线（象）∪ 直线（车）= 后的射线表，也恰好是王走一步
  // 能到的八个方向——王与后共享这张表纯属几何巧合（王只走一步，后可以
  // 滑到底），二者语义并不相同，所以用 OFF_K 只作为"王用这张表"的别名，
  // 不要把它当成"王专属"的表来读。
  const OFF_ALL8 = [17, 16, 15, 1, -17, -16, -15, -1];
  const OFF_K = OFF_ALL8;
  const SLIDE = { [B]: OFF_B, [R]: OFF_R, [Q]: OFF_ALL8 };   // B / R / Q 共用射线表
  const PROMO_PIECES = [Q, R, B, N];

  function mk(from, to, piece, captured, promo, flags) {
    return { from: from, to: to, piece: piece,
             captured: captured || 0, promo: promo || 0, flags: flags || 0 };
  }

  // Move 是每次调用现造的新对象，没有稳定恒等性——工具代码（例如用
  // pseudoLegalMoves() 减 legalMoves() 求"被别住的子"）需要按值比较两步棋
  // 是否是同一步。在同一局面内，from/to/promo 三项已完全确定一步棋
  // （piece/captured/flags 都能从局面 + from/to/promo 推出，不需要参与比较）。
  function sameMove(a, b) {
    return a.from === b.from && a.to === b.to && a.promo === b.promo;
  }

  Position.prototype.pseudoLegalMoves = function () {
    const out = [];
    const me = this.turn, bd = this.board;

    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }        // 跳过越界半区
      const v = bd[s];
      if (v === EMPTY || (v > 0 ? WHITE : BLACK) !== me) continue;
      const type = Math.abs(v);

      if (type === P) { pawnMoves(this, s, me, out); continue; }

      if (type === N || type === K) {
        const offs = type === N ? OFF_N : OFF_K;
        for (let i = 0; i < offs.length; i++) {
          const to = s + offs[i];
          if (to & 0x88) continue;
          const tv = bd[to];
          if (tv !== EMPTY && (tv > 0 ? WHITE : BLACK) === me) continue;
          out.push(mk(s, to, v, tv, 0, tv === EMPTY ? 0 : FLAG.CAPTURE));
        }
        continue;
      }

      const offs = SLIDE[type];
      for (let i = 0; i < offs.length; i++) {
        let to = s + offs[i];
        while (!(to & 0x88)) {
          const tv = bd[to];
          if (tv === EMPTY) { out.push(mk(s, to, v, 0, 0, 0)); to += offs[i]; continue; }
          if ((tv > 0 ? WHITE : BLACK) !== me) out.push(mk(s, to, v, tv, 0, FLAG.CAPTURE));
          break;                                  // 无论敌我，射线到此为止
        }
      }
    }
    castleMoves(this, me, out);
    return out;
  };

  function castleMoves(pos, me, out) {
    const bd = pos.board;
    const home = me === WHITE ? SQ(4, 0) : SQ(4, 7);
    if (bd[home] !== (me === WHITE ? K : -K)) return;
    if (pos.isAttacked(home, -me)) return;          // 被将军时不能易位

    const kBit = me === WHITE ? 1 : 4;
    const qBit = me === WHITE ? 2 : 8;
    const rookK = home + 3, rookQ = home - 4;

    if ((pos.castling & kBit) && bd[rookK] === (me === WHITE ? R : -R) &&
        bd[home + 1] === EMPTY && bd[home + 2] === EMPTY &&
        !pos.isAttacked(home + 1, -me) && !pos.isAttacked(home + 2, -me)) {
      out.push(mk(home, home + 2, bd[home], 0, 0, FLAG.CASTLE_K));
    }
    // 长易位：b 列（home−3）必须为空，但王不经过它，所以不检查它是否被攻击
    if ((pos.castling & qBit) && bd[rookQ] === (me === WHITE ? R : -R) &&
        bd[home - 1] === EMPTY && bd[home - 2] === EMPTY && bd[home - 3] === EMPTY &&
        !pos.isAttacked(home - 1, -me) && !pos.isAttacked(home - 2, -me)) {
      out.push(mk(home, home - 2, bd[home], 0, 0, FLAG.CASTLE_Q));
    }
  }

  function pawnMoves(pos, s, me, out) {
    const bd = pos.board;
    const dir = me === WHITE ? 16 : -16;
    const startRank = me === WHITE ? 1 : 6;
    const lastRank = me === WHITE ? 7 : 0;
    const piece = me === WHITE ? P : -P;

    const one = s + dir;
    if (!(one & 0x88) && bd[one] === EMPTY) {
      pushPawn(out, s, one, piece, 0, lastRank, 0);
      const two = s + dir * 2;
      if (rankOf(s) === startRank && !(two & 0x88) && bd[two] === EMPTY) {
        out.push(mk(s, two, piece, 0, 0, FLAG.DOUBLE));
      }
    }
    const caps = [dir + 1, dir - 1];
    for (let i = 0; i < 2; i++) {
      const to = s + caps[i];
      if (to & 0x88) continue;
      const tv = bd[to];
      if (tv === EMPTY) {
        if (to === pos.ep && pos.ep >= 0) {
          // 被吃的兵不在落点格，而在落点格的"身后"一格
          const victim = to - dir;
          out.push(mk(s, to, piece, bd[victim], 0, FLAG.CAPTURE | FLAG.EP));
        }
        continue;
      }
      if ((tv > 0 ? WHITE : BLACK) === me) continue;
      pushPawn(out, s, to, piece, tv, lastRank, FLAG.CAPTURE);
    }
  }

  function pushPawn(out, from, to, piece, captured, lastRank, flags) {
    if (rankOf(to) !== lastRank) { out.push(mk(from, to, piece, captured, 0, flags)); return; }
    for (let i = 0; i < PROMO_PIECES.length; i++) {
      out.push(mk(from, to, piece, captured, PROMO_PIECES[i], flags | FLAG.PROMO));
    }
  }

  // 易位权掩码：某格一旦被"离开或被占据"，对应的权利就消失。
  // 例如 a1 既是白后翼车的家，也是黑车吃过来时会落到的格，两种情况都该清 Q。
  const CASTLE_MASK = new Int8Array(128).fill(15);
  CASTLE_MASK[SQ(4, 0)] = 12;   // e1：白王一动，K 与 Q 全没
  CASTLE_MASK[SQ(0, 0)] = 13;   // a1：清 Q
  CASTLE_MASK[SQ(7, 0)] = 14;   // h1：清 K
  CASTLE_MASK[SQ(4, 7)] = 3;    // e8：清 k 与 q
  CASTLE_MASK[SQ(0, 7)] = 7;    // a8：清 q
  CASTLE_MASK[SQ(7, 7)] = 11;   // h8：清 k

  Position.prototype._make = function (m) {
    const undo = { castling: this.castling, ep: this.ep, half: this.half,
                   kingW: this.kingW, kingB: this.kingB };
    const bd = this.board;

    if (m.flags & FLAG.EP) {
      bd[m.to - (this.turn === WHITE ? 16 : -16)] = EMPTY;   // 被吃的兵不在落点格
    } else if (m.flags & FLAG.CASTLE_K) {
      bd[m.to + 1] = EMPTY; bd[m.to - 1] = this.turn === WHITE ? R : -R;
    } else if (m.flags & FLAG.CASTLE_Q) {
      bd[m.to - 2] = EMPTY; bd[m.to + 1] = this.turn === WHITE ? R : -R;
    }

    bd[m.from] = EMPTY;
    bd[m.to] = m.promo ? (this.turn === WHITE ? m.promo : -m.promo) : m.piece;

    if (Math.abs(m.piece) === K) {
      if (this.turn === WHITE) this.kingW = m.to; else this.kingB = m.to;
    }

    this.castling &= CASTLE_MASK[m.from] & CASTLE_MASK[m.to];
    this.ep = (m.flags & FLAG.DOUBLE)
      ? m.from + (this.turn === WHITE ? 16 : -16)
      : -1;
    this.half = (Math.abs(m.piece) === P || m.captured) ? 0 : this.half + 1;
    if (this.turn === BLACK) this.full++;
    this.turn = -this.turn;
    return undo;
  };

  Position.prototype._unmake = function (m, undo) {
    const bd = this.board;
    this.turn = -this.turn;
    if (this.turn === BLACK) this.full--;
    bd[m.from] = m.piece;
    bd[m.to] = m.captured;
    if (m.flags & FLAG.EP) {
      bd[m.to] = EMPTY;                                       // 落点本来是空的
      bd[m.to - (this.turn === WHITE ? 16 : -16)] = m.captured;
    } else if (m.flags & FLAG.CASTLE_K) {
      bd[m.to - 1] = EMPTY; bd[m.to + 1] = this.turn === WHITE ? R : -R;
    } else if (m.flags & FLAG.CASTLE_Q) {
      bd[m.to + 1] = EMPTY; bd[m.to - 2] = this.turn === WHITE ? R : -R;
    }
    this.castling = undo.castling; this.ep = undo.ep; this.half = undo.half;
    this.kingW = undo.kingW; this.kingB = undo.kingB;
  };

  Position.prototype.make = function (m) {
    const p = this.clone();
    p._make(m);
    return p;
  };

  // 从被攻击格反向扫射线：与其枚举所有敌子的走法，不如站在目标格上
  // 沿八个方向看出去，遇到的第一颗子是不是"能这样打过来"的类型。
  Position.prototype.isAttacked = function (target, by) {
    const bd = this.board;

    for (let i = 0; i < OFF_N.length; i++) {
      const s = target + OFF_N[i];
      if (s & 0x88) continue;
      const v = bd[s];
      if (v !== EMPTY && (v > 0 ? WHITE : BLACK) === by && Math.abs(v) === N) return true;
    }

    for (let i = 0; i < OFF_K.length; i++) {
      const dir = OFF_K[i];
      const diagonal = (dir === 17 || dir === 15 || dir === -17 || dir === -15);
      let s = target + dir, dist = 1;
      while (!(s & 0x88)) {
        const v = bd[s];
        if (v !== EMPTY) {
          if ((v > 0 ? WHITE : BLACK) === by) {
            const t = Math.abs(v);
            if (t === Q) return true;
            if (t === (diagonal ? B : R)) return true;
            if (dist === 1) {
              if (t === K) return true;
              // 兵只在"从目标格反过来看"的对应斜方向才构成攻击：
              // 白兵攻击的是它前方（+16 方向）两侧的格，所以反过来从
              // 目标格看，白兵攻击者应在 −17 / −15 方向（黑兵则相反，
              // 在 +17 / +15 方向）。
              if (t === P && diagonal) {
                if (by === WHITE && (dir === -17 || dir === -15)) return true;
                if (by === BLACK && (dir === 17 || dir === 15)) return true;
              }
            }
          }
          break;                      // 无论敌我，这条射线到此为止
        }
        s += dir; dist++;
      }
    }
    return false;
  };

  Position.prototype.inCheck = function (colour) {
    const k = this.kingSq(colour);
    return k < 0 ? false : this.isAttacked(k, -colour);
  };

  // 攻击 ≠ 走法：这两个函数回答"棋盘几何上谁打到了谁"，与"谁能合法地走
  // 到哪"是两个不同的问题——被己方子占据的格仍然"被攻击"（这正是"保护"
  // 的定义），兵的正前方推进与易位落点则从不算攻击。早先版本借道
  // pseudoLegalMoves() 实现，那只回答"能走到哪"，会把己方占据的格与
  // 未被防守的兵前方漏掉，导致 attackedBy 与 isAttacked 在同一局面上矛盾。
  // 现在与 isAttacked 共用同一套反向射线/马步/兵步几何，只是不提前
  // return，而是把每个方向命中的攻击方棋子收集起来。
  Position.prototype.attackedBy = function (target, by) {
    const bd = this.board;
    const out = [];

    for (let i = 0; i < OFF_N.length; i++) {
      const s = target + OFF_N[i];
      if (s & 0x88) continue;
      const v = bd[s];
      if (v !== EMPTY && (v > 0 ? WHITE : BLACK) === by && Math.abs(v) === N) out.push(s);
    }

    for (let i = 0; i < OFF_K.length; i++) {
      const dir = OFF_K[i];
      const diagonal = (dir === 17 || dir === 15 || dir === -17 || dir === -15);
      let s = target + dir, dist = 1;
      while (!(s & 0x88)) {
        const v = bd[s];
        if (v !== EMPTY) {
          if ((v > 0 ? WHITE : BLACK) === by) {
            const t = Math.abs(v);
            let hit = false;
            if (t === Q) hit = true;
            else if (t === (diagonal ? B : R)) hit = true;
            else if (dist === 1) {
              if (t === K) hit = true;
              else if (t === P && diagonal) {
                if (by === WHITE && (dir === -17 || dir === -15)) hit = true;
                if (by === BLACK && (dir === 17 || dir === 15)) hit = true;
              }
            }
            if (hit) out.push(s);
          }
          break;                      // 无论敌我，这条射线到此为止
        }
        s += dir; dist++;
      }
    }
    return out;
  };

  // 该格棋子的攻击范围：从棋子出发沿几何看能打到哪些格，
  // 与 isAttacked/attackedBy 是同一套几何的正向版本。包含被己方子
  // 占据的格（防守也是攻击），不含兵的正前方推进与易位落点
  // （那些是走法，不是攻击）。
  Position.prototype.attacksFrom = function (from) {
    const v = this.board[from];
    if (v === EMPTY) return [];
    const bd = this.board;
    const type = Math.abs(v);
    const colour = v > 0 ? WHITE : BLACK;
    const out = [];

    if (type === P) {
      const dir = colour === WHITE ? 16 : -16;
      const caps = [dir + 1, dir - 1];
      for (let i = 0; i < 2; i++) {
        const to = from + caps[i];
        if (!(to & 0x88)) out.push(to);
      }
      return out;
    }

    if (type === N || type === K) {
      const offs = type === N ? OFF_N : OFF_K;
      for (let i = 0; i < offs.length; i++) {
        const to = from + offs[i];
        if (!(to & 0x88)) out.push(to);
      }
      return out;
    }

    const offs = SLIDE[type];
    for (let i = 0; i < offs.length; i++) {
      let to = from + offs[i];
      while (!(to & 0x88)) {
        out.push(to);
        if (bd[to] !== EMPTY) break;   // 遇子（不论敌我）即为攻击范围的边界
        to += offs[i];
      }
    }
    return out;
  };

  Position.prototype.legalMoves = function () {
    const me = this.turn, out = [];
    const ms = this.pseudoLegalMoves();
    for (let i = 0; i < ms.length; i++) {
      const m = ms[i];
      const undo = this._make(m);
      // 与 inCheck 保持一致：找不到王（k < 0）视为"不构成将军"，
      // 而不是让 isAttacked(-1, …) 悄悄给出未定义的答案。
      // 这不是漏洞，是有意为之：没有王的局面（fromFEN(fen, {requireKings:false})
      // 构造出来的教学局面，例如孤马 BFS 场）根本没有"将军"这回事可暴露，
      // 所以 k < 0 时直接放行——legalMoves() 在此退化为 pseudoLegalMoves()，
      // 全部走法都算合法。调用方如果依赖"合法性过滤"这一行为，
      // 需要自己先确认局面里有王。
      const k = this.kingSq(me);
      if (k < 0 || !this.isAttacked(k, -me)) out.push(m);
      this._unmake(m, undo);
    }
    return out;
  };

  // 保守规则：只有"双方都不可能强制将死"才判子力不足。任何一方达到
  // 两个轻子（无论颜色组合）就已经存在理论杀法（KNN 对 K 也算，尽管
  // 实战极难逼出），所以立即返回 false。
  // 已知的不完整之处（有意为之，不是漏了）：同色格象分居两侧属于死局，
  // 但本函数把它算作"进行中"——要判定这种死局需要比较象所在格的颜色，
  // 这里没有做，读者不要以为这条规则是完整的。
  function insufficientMaterial(pos) {
    let minors = 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      const t = Math.abs(pos.board[s]);
      if (t === EMPTY || t === K) continue;
      if (t === P || t === R || t === Q) return false;
      minors++;
      if (minors > 1) return false;      // 两个轻子起就可能杀（含异色象）
    }
    return true;
  }

  Position.prototype.status = function () {
    const has = this.legalMoves().length > 0;
    const chk = this.inCheck(this.turn);
    if (!has) return chk ? 'checkmate' : 'stalemate';
    // 这条排在 chk 判断之前是刻意的：即使 this.turn 一方正被将军，只要子力
    // 不足，也报告 'insufficient' 而不是 'check'——checkmate 已经在上面的
    // !has 分支被排除了，所以这里不会掩盖任何将死；FIDE 的死局规则本就
    // 不区分"死局时是否被将军"。想单独知道"当下是否被将军"这个盘面事实
    // 的调用方，应该直接调 inCheck()，不要依赖 status() 的优先级。

      story: {
        en: 'Bobby Fischer was thirteen years old, an unrated junior invited to the Rosenwald Memorial in New York mostly as a courtesy, when he sat down across from Donald Byrne — an International Master, older brother of future grandmaster Robert Byrne, and one of the strongest players in the country. Nobody expected the game to be remembered.\n\nOn move 11 Byrne moved the same knight twice, losing a tempo that looks trivial on the scoresheet. Fischer answered with 11...Na4, a move the annotator Hans Kmoch later called one of the most powerful in chess history, and from there the position tightened around White\'s king. On move 17, with his own queen attacked by a bishop, Fischer played 17...Be6 instead of retreating it — he let Byrne capture his queen the very next move, calculating that the knight forks and discovered checks that followed were worth more than the piece he was giving up.\n\nKmoch dubbed it "The Game of the Century" and it won the tournament\'s brilliancy prize. It remains the standard reference for what a queen sacrifice actually is: not a desperate throw, but a trade of the most powerful piece on the board for a forced sequence that wins back more material than the queen was worth.',
        zh: '鲍比·费舍尔当年十三岁，还是个没有正式等级分的少年棋手，被主要出于礼节性地邀请参加纽约罗森瓦尔德纪念赛，对面坐着的唐纳德·伯恩是一位国际大师，也是日后特级大师罗伯特·伯恩的兄长，全美最强的棋手之一。当时没有人指望这局棋会被记住。\n\n第 11 回合，伯恩把同一只马又动了一次，看棋谱只是丢了一步先手，算不上大事。费舍尔用 11...Na4 回应——评注者汉斯·克莫赫后来称这是国际象棋史上最有力的几步棋之一——白方王翼从此被一点点收紧。第 17 回合，费舍尔的后正被一只象攻击，他没有把后撤走，而是走了 17...Be6，主动放伯恩在下一步吃掉自己的后：他算准了随后的马叉与闪击将赢回比后更多的子力。\n\n克莫赫称之为「世纪之局」，这局棋拿下了那届比赛的最佳对局奖。它至今仍是理解「弃后 queen sacrifice」真正含义的标准范本：不是孤注一掷，而是用棋盘上最重的子换一串强制的连续着法，换回比后本身更多的东西。',

      story: {
        en: 'Reykjavik, July 1972. The World Championship match between the Soviet defending champion Boris Spassky and the American challenger Bobby Fischer was already the most politically loaded chess event of the Cold War before a piece had moved: an American had never held the title, and Fischer had spent the run-up threatening not to show up at all over prize money and playing conditions.\n\nGame 1 itself was heading nowhere dramatic. The queens came off the board on move 11, and by move 29 the position was a bishop-and-pawn endgame that most strong players would simply draw. Then Fischer played 29...Bxh2, grabbing a pawn that Spassky\'s next move, 30.g3, immediately fenced in — the bishop had no way home. Fischer had gone hunting for a pawn in a position that did not need one, and it cost him the whole point.\n\nFischer lost the game, then forfeited Game 2 by not appearing at all, and briefly seemed ready to quit the match altogether over the arguments that followed. He came back and won it 12½–8½. But Game 1 is the one where the match\'s reputation for psychological brinkmanship started — not with a walkout, but with an ordinary-looking pawn that turned out to be exactly the trap its nickname promised.',
        zh: '1972 年 7 月，雷克雅未克。苏联卫冕冠军斯帕斯基与美国挑战者费舍尔的这场世界冠军赛，在棋子落地之前就已经是冷战期间政治色彩最浓的一场棋赛：此前从未有美国人拿过这个头衔，而费舍尔在赛前一直在为奖金与比赛条件威胁干脆不来。\n\n第 1 局本身开局并不激烈。第 11 回合双方就把后换掉了，到第 29 回合，局面已经简化成一个多数强手都会直接握手言和的象兵残局。然后费舍尔走了 29...Bxh2，吃掉一个本不必去吃的兵，斯帕斯基紧接着 30.g3 立刻把这只象圈死在了原地——它已经无路回家。费舍尔在一个根本不需要额外吃兵的局面里去猎兵，代价是丢掉了整整一分。\n\n费舍尔输掉了这一局，紧接着又因为没有到场而被判负第 2 局，围绕比赛条件的争执一度让他看起来真的要退赛。他后来还是回来了，并以 12½–8½ 拿下整场比赛。但这场比赛「心理博弈」的名声，正是从第 1 局开始的——不是从退赛开始，而是从一个看起来毫无问题、后来却名副其实地印证了「毒兵」这个绰号的兵开始。',

      story: {
        en: 'By Game 6, Fischer had already lost Game 1 and forfeited Game 2, and was down in the match. He then did something almost nobody expected: instead of his usual 1.e4, he opened 1.c4 — the first time in a serious tournament game he had ever taken the white side of the Queen\'s Gambit family. Spassky, a lifelong 1.e4 player himself, had prepared for the Fischer everyone knew and got a completely different opponent.\n\nThe game itself is remembered less for any single blow than for its accumulating pressure. Fischer built up a small positional edge move by move, and it never let go; by move 38 he was sacrificing an exchange (38.Rxf6) to tear open the position around Spassky\'s king, and two moves later offered the rook again with 39.Rxf6 rather than cash in material for safety. Spassky resigned facing an unstoppable mating attack.\n\nWhat happened after the final move is what the game is remembered for beyond the moves themselves: Spassky rose from the board and joined the audience in applauding Fischer\'s win. Fischer later called him "a true sportsman." It is the single most-told moment of humanity in a match otherwise defined by walkouts, lawsuits over the playing conditions, and Cold War tension on both benches.',
        zh: '打到第 6 局时，费舍尔已经输掉第 1 局、又因缺席被判负第 2 局，整场比赛落后。他这时做了一件几乎没人料到的事：没有像往常一样开 1.e4，而是走了 1.c4——这是他第一次在正式比赛里执白进入后翼弃兵一系的开局。斯帕斯基自己也是终身的 1.e4 棋手，他为大家熟悉的那个费舍尔做了准备，遇到的却是一个完全不同的对手。\n\n这局棋被记住，靠的不是哪一步孤立的妙手，而是从头到尾不断累积的压力。费舍尔一步一步攒起一个不大的位置优势，而且始终没有放松；到第 38 回合他弃还了一个交换（38.Rxf6）去撕开斯帕斯基王翼周围的防线，两回合之后又用 39.Rxf6 再度送出车，而不是见好就收换回安全。斯帕斯基面对无法阻挡的杀棋认了输。\n\n真正让这局棋被反复讲述的，是最后一步之后发生的事：斯帕斯基从棋盘前站起身，和观众一起为费舍尔的胜利鼓掌。费舍尔后来称他是「一位真正的体育精神代表」。在一场充斥着退赛、关于比赛条件的争执与双方席位上冷战张力的比赛里，这是被讲述最多的一个人性瞬间。',

    {
      id: 'tal-botvinnik-1960-g6',
      group: 'coldwar',
      tags: ['world-championship', 'sacrifice', 'attack'],
      difficulty: 3,
      source: 'https://en.wikipedia.org/wiki/World_Chess_Championship_1960',
      story: {
        en: 'Mikhail Tal was twenty-three, nicknamed "the Magician from Riga," and playing for the World Championship against Mikhail Botvinnik, the reigning champion and the most rigorously scientific player of his generation. Their styles could not have been more opposed: Botvinnik prepared with the discipline of the engineer he had trained as; Tal calculated forests of complications and then, when the calculation ran out, played on instinct.\n\nGame 6 is the game most often used to show what that meant over the board. On move 21 Tal played 21...Nf4!!, offering a knight for no calculable, forced win — contemporary annotators and Tal himself were explicit that he could not see all the way to the end of the resulting complications. He judged that the attack it opened against Botvinnik\'s king was worth more than the piece, without being able to prove it the way a modern engine could check in an instant. It worked: Botvinnik never found a safe path through the resulting storm and resigned by move 47.\n\nContemporary reports say the audience became so loud and excited during the game that it had to be moved to a quieter room. Tal went on to win the match and become the youngest world champion to that point, at twenty-three. The game endures specifically as a counterexample to the idea that every sound sacrifice can be calculated in advance — sometimes the strongest players commit to a piece on judgment alone.',
        zh: '米哈伊尔·塔尔当年二十三岁，绰号「里加的魔术师」，正与卫冕冠军、他那一代最讲究科学方法的棋手米哈伊尔·博特维尼克争夺世界冠军。两人的风格几乎是两极：博特维尼克带着他工程师训练出身的那种纪律去准备每一局；塔尔则会算出一整片错综复杂的变化，一旦算不到底，就凭直觉继续走下去。\n\n第 6 局最常被用来说明这意味着什么。第 21 回合，塔尔走了 21...Nf4!!，送出一只马，却算不出一条能被证明必胜的强制路线——同时代的评注者和塔尔本人都明确说过，他并没有把随后的乱战算到底。他判断由此打开的对博特维尼克王翼的攻势值得这个子，却没法像今天的引擎那样瞬间验证这个判断。结果奏效了：博特维尼克始终没能在随后的风暴里找到一条安全的路，第 47 回合前就认了输。\n\n据当时的报道，观众席一度喧闹到不得不把比赛挪到更安静的房间继续。塔尔后来赢下整场比赛，以二十三岁成为当时最年轻的世界冠军。这局棋之所以流传至今，恰恰是因为它是一个反例：不是每一次可靠的弃子都能提前算清楚——有时最强的棋手靠的只是判断，不是穷举。',

        zh: '威廉·斯坦尼茨此时五十八岁，前一年刚把世界冠军头衔输给了埃马努埃尔·拉斯克，但在黑斯廷斯 1895——当时史上阵容最强的一届赛事——他下出了后人记住他的那一局棋。对手库尔特·冯·巴德勒本是一位德国大师，也是小贵族出身，以脾气难处闻名，两人此前的私人恩怨让这局棋的收尾格外刺眼。\n\n从第 22 步起，斯坦尼茨把车一路推向前场连续将军——Rxe7+、Rf7+、Rg7+——冯·巴德勒本没有一步可以安全吃掉进攻的车，每一步都把黑王往孤立无援的方向再逼一格。到第 25 步 Rxh7+，黑王已经在走进一张杀网，再也没有别的办法可试。冯·巴德勒本没有坐下来看完结局，也没有当着满屋子人认输，而是一言不发地起身离开赛场，任由自己的钟走完时间判负。\n\n斯坦尼茨没能在棋盘上亲手走出最后一步。等确认冯·巴德勒本不会回来后，他站到演示棋盘前，把这套攻势原本会怎样收官，一步一步讲给在场观众听，赢得掌声。这局棋至今仍是少数因棋盘之外的收场而与棋局本身同样被人记住的对局之一。',

      story: {
        en: 'By November 2006, Vladimir Kramnik was the undisputed World Chess Champion, and the software he faced in Bonn — Deep Fritz, running on ordinary PC hardware — had already proven strong enough that the match was treated as a genuine contest, not a foregone conclusion. Game 2 was heading nowhere dramatic: Deep Fritz had won a pawn and was pressing a technical advantage, and by move 34 it had just captured a rook with 34.Nxf8.\n\nKramnik had a route back into the game: 34...Kg8, walking the king to safety, led to forced complications that later computer analysis showed drew by force. Instead he played 34...Qe3??, and Deep Fritz answered instantly with 35.Qh7# — a mate in one that had been sitting on the board the entire time. A reigning world champion, in a position he had spent real time calculating, missed a one-move checkmate.\n\nIt became the most cited blunder in chess history, not because the mistake itself was exotic — missed mates happen at every level — but because of who missed it, and what it revealed: even the best human calculation has a blind spot that a machine checking every legal reply simply does not.',
        zh: '2006年11月，弗拉基米尔·克拉姆尼克是当时无可争议的国际象棋世界冠军，他在波恩对阵的软件——跑在普通PC上的国际象棋引擎 Deep Fritz——已经强到让人认为这是一场真正势均力敌的对局，而不是走个过场。第2局并没有走向什么戏剧性的场面：Deep Fritz 多兵占优，第34步刚用 34.Nxf8 吃掉黑方一车。\n\n克拉姆尼克本来还有退路：34...Kg8 把王撤向安全处，之后的强制变化经后来的电脑分析证实是和棋。他却走了 34...Qe3??，Deep Fritz 立刻回以 35.Qh7#——那步杀棋一直摆在棋盘上，谁都能看见。一位在位世界冠军，在一个自己花了不少时间计算的局面里，看漏了一步杀。\n\n这一步后来成了国际象棋史上被引用最多的漏着，原因不在于这个错误本身有多离奇——各种水平的棋手都会看漏杀棋——而在于是谁看漏了它，以及它说明了什么：再强的人类计算力也有盲区，而一台会检查每一种合法应着的机器，恰好没有这个盲区。',
      },
      why: {
        en: 'The world champion missed a mate in one — the most famous blunder in chess history, and a lesson in human attention.',

      keyMoves: [

          en: '24.Qxf7+ grabs a second pawn with check while Black\'s pieces are tangled on the back rank — the computer is already converting a structural edge into a concrete material one.',
          zh: '24.Qxf7+ 借将军再吃一兵，此时黑方的子力还挤在底线上没理顺——引擎已经在把结构优势兑换成实实在在的多兵。' } },
        { ply: 63, san: 'Nxe6', note: {
          en: '32.Nxe6 forks Kramnik\'s bishop and rook — the position tips from "worse for Black" to "losing", several moves before the blunder that everyone remembers.',
          zh: '32.Nxe6 一步双叉 fork 同时叉住克拉姆尼克的象和车——局面从「黑方稍差」滑向「黑方已经输了」，比后来那步被所有人记住的漏着早了好几步。' } },
        { ply: 67, san: 'Nxf8', note: {

          zh: '34.Nxf8 吃掉黑方的车。就是这个局面：克拉姆尼克本来还有 34...Kg8 把王撤到安全处，事后分析证实这条路能强制守和。' } },

          zh: '34...Qe3?? 就是这步漏着本身——国际象棋史上最著名的一个。克拉姆尼克没走安全的王步，反而把后推到e3，看起来还在找取胜机会，却完全没看到这一步对h7的后将军毫无防御。据他本人事后所说，他算了好几步深，却恰好在关键的那一格前停住了。' } },

      story: {
        en: 'On 4 September 2022, at the Sinquefield Cup in Saint Louis, Magnus Carlsen — the reigning World Champion and heavy favourite — lost a classical game to 19-year-old Hans Niemann for the first time. The game itself was a fairly ordinary Nimzo-Indian: a level position drifted, Carlsen made a couple of imprecise moves in a rook-and-bishop ending, and on move 42 he played an outright blunder, 42.Rd7??, that let his position collapse into a technically lost ending. He resigned on move 57.\n\nThe next day, Carlsen withdrew from the tournament without explanation, posting a short public statement that quoted a José Mourinho line about preferring not to speak. Tournament organisers said the decision was personal and confirmed there was no indication any player had cheated during the event; FIDE\'s president publicly said there were better ways to have handled the situation and asked its Fair Play Commission to review any evidence that was submitted.\n\nChess.com later published an investigation concluding that Niemann had likely cheated in more than 100 past online games, but reported a lack of concrete statistical evidence of cheating in his over-the-board games against Carlsen. No official body has concluded that Niemann cheated in this particular game. What makes this game worth including is not what happened on the board — it is that this was the moment competitive chess had to publicly confront a question it had mostly avoided: how do you prove your opponent, sitting across the table, didn\'t cheat?',
        zh: '2022年9月4日，圣路易斯的辛克菲尔德杯（Sinquefield Cup）上，在位世界冠军、绝对夺冠热门马格努斯·卡尔森，第一次在正赛中负于19岁的汉斯·尼曼（Hans Niemann）。这盘棋本身相当普通：一个尼姆佐印度防御，局面在中局逐渐失去平衡，卡尔森在车象残局里走了几步不够精确的棋，第42步一步实实在在的漏着 blunder——42.Rd7??——让局面彻底崩溃成技术性输局，他在第57步认输。\n\n第二天，卡尔森未作说明地退出了赛事，只发了一条简短声明，引用了穆里尼奥的一句话——大意是「我宁愿不说话，说了我会有大麻烦」。赛事主办方表示这是他的个人决定，并确认没有任何迹象显示比赛期间有选手作弊；国际棋联（FIDE）主席公开表示本可以有更好的处理方式，并要求公平竞赛委员会审查任何被提交的证据。\n\nChess.com 后来发布调查报告，认为尼曼此前很可能在超过100盘线上对局中作弊，但表示在他与卡尔森的现场对局中，没有找到能站住脚的统计证据证明作弊。至今没有任何官方机构认定尼曼在这盘棋里作弊。这局棋值得收进来，理由不在棋盘上——而在于，这是竞技国际象棋第一次必须公开面对一个它此前大多回避的问题：你要怎么证明，坐在你对面的人没有作弊？',

      story: {
        en: 'Between June and October 1999, Garry Kasparov played a single game of chess against more than 50,000 people from over 75 countries, hosted on MSN\'s Gaming Zone. Kasparov played White alone; for Black, anyone could log in and vote on the next move, and the plurality decided what got played. Four strong young players — including 15-year-old Irina Krush, freshly crowned US Women\'s Champion — were brought in as official advisors to help the crowd think through its choices, and their analysis dominated the voting for most of the game.\n\nThe game turned sharp fast: by move 10 the World Team had already left known theory with a Krush-suggested novelty, and by move 11 Black\'s queen was deep in White\'s position picking up a pawn with the king still stuck in the centre. Kasparov later said the outcome stayed uncertain until around move 51, when the World Team\'s queenside pawn push won its vote by a narrow margin over the alternatives.\n\nIt ended on move 62, four months after it began, when Kasparov\'s pawn on g7 made a forced mate unstoppable and the World Team resigned rather than play it out. It remains one of the largest single collective decision-making experiments chess — or perhaps any strategy game — has ever run: tens of thousands of people, one shared board, one vote at a time.',
        zh: '1999年6月到10月间，加里·卡斯帕罗夫在MSN Gaming Zone上，独自一人对阵来自75个以上国家、超过5万人组成的「世界队」下了一局棋。卡斯帕罗夫单独执白；黑方这边，任何人都可以登录投票选下一步该走什么，得票最多的走法就会被真正走出来。微软请来四位年轻的强手棋手——包括当时15岁、刚拿到美国女子冠军的伊琳娜·克鲁什（Irina Krush）——作为官方顾问，帮助这群业余投票者理清思路，她们的分析在整局棋的大部分时间里主导了投票结果。\n\n局面很快变得复杂起来：第10步世界队就在克鲁什建议下走出了一步跳出已知理论的新招，第11步黑后已经深入白方阵地吃掉一个兵，此时黑王仍困在中路。卡斯帕罗夫后来说，胜负走向一直悬而未决，直到第51步左右——世界队推后翼兵的那步棋，只以微弱优势险胜了更稳妥的选项。\n\n四个月后，这局棋在第62步结束：卡斯帕罗夫的兵推到g7，让升变再也无法阻止，世界队没有把棋走完，直接认输。这至今仍是国际象棋——或者说任何策略类游戏——做过的规模最大的集体决策实验之一：数万人共享一张棋盘，一步一投票。',

    {
      id: 'menchik-euwe-1930',

      story: {
        en: 'At Hastings, over the New Year of 1930 into 1931, Vera Menchik — the reigning Women\'s World Champion, and the only woman playing in the men\'s Premier section — sat down against Max Euwe, the Dutch champion who would become World Chess Champion five years later by beating Alexander Alekhine. Euwe pushed his queenside pawns forward looking for an attack; Menchik defended it, traded queens on move 33, and by the adjournment the position — a bishop and five pawns each — was judged roughly level by the tournament\'s own report.\n\nEuwe kept pressing for a win anyway rather than settling for a draw in what should have been a safe position, and it cost him: Menchik\'s queenside pawn eventually outran his defence, promoted to a queen on move 59, and forced his resignation two moves later, on move 61.\n\nIt was Euwe\'s only loss of the tournament. He still won Hastings outright, and did go on to take the world title in 1935 — but this defeat followed him. The other grandmasters who lost to Menchik at Hastings over the years jokingly named themselves the "Menchik Club", membership open only to men who had lost a competitive game to her. It was self-deprecation dressed as a joke, and underneath it was a plain fact none of them could argue with: on that day, over that board, she was simply the better player.',
        zh: '1930年跨1931年新年前后的黑斯廷斯（Hastings）赛事上，时任女子世界冠军、也是那届甲组公开赛（Premier）里唯一女性选手的维拉·门契克（Vera Menchik），对阵荷兰棋手马克斯·尤伟（Max Euwe）——五年后，尤伟将击败亚历山大·阿廖欣（Alexander Alekhine），成为国际象棋世界冠军。尤伟推进后翼兵寻求攻势；门契克顶住了这波攻击，第33步兑掉后，双方封盘时的局面——各有一象与五个兵——按赛事自己的报道，是大致均势。\n\n尤伟本可以就此接受和棋，却选择继续争胜，代价随之而来：门契克的后翼兵最终跑过了他的防线，在第59步升变成后，两步之后、第61步，逼他认输。\n\n这是尤伟那届比赛唯一的一场失利。他仍然拿到了那届黑斯廷斯赛事的总冠军，五年后也确实登上了世界冠军的宝座——但这场败局一直跟着他。多年来，那些在黑斯廷斯输给门契克的大师们，半开玩笑地把自己组成了「门契克俱乐部」（Menchik Club），入会资格只有一条：输给过她一局正式比赛。这是包着玩笑外衣的自嘲，而玩笑底下是一个谁都没法反驳的事实：那一天，那张棋盘上，她就是更强的那个人。',

  for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);

/* 四个页签共用同一份回放状态：本工具的主题是「同一局棋，四种测量」——

/* 历史沿 −z 后退：z=0 是当前局面，第 i 个半步在 z = −(ply−i)·zStep。

   「一局棋是三维里的一条曲线」这件事说清楚了。 */

  if (RP.tick(rs, E.state.dt)) syncTransport();

/* ================= trace 页：子力轨迹（Task 14） ================= */
/* 一颗子的一生 = 一条三维折线：x/y 是它站过的格，z 是那一步的回合数。

  var pts = [];
  for (var i = 0; i < tr.points.length; i++) {
    var p = tr.points[i];
    if (p.ply > upto) break;
    var c = L.squareCenter(CC.fileOf(p.sq), CC.rankOf(p.sq));
    pts.push([c[0], c[1], -(upto - p.ply) * zs]);

  return pts;

var PIECE_LETTER = {};

PIECE_LETTER[CC.R] = 'R'; PIECE_LETTER[CC.Q] = 'Q'; PIECE_LETTER[CC.K] = 'K';
function pieceLetter(code) { return PIECE_LETTER[Math.abs(code)] || '?'; }

/* 截至当前 ply 的轨迹统计，用于 readout。「visible」= tr.points 里 ply<=upto

   一半时不能提前告诉使用者「这颗马这局一共走了 9 步」，那是还没发生的

   等价性在这里成立是因为「全局」正是 upto 取到头的特例。 */

  for (var i = 0; i < list.length; i++) {

    var visible = 0;
    for (var j = 0; j < tr.points.length; j++) {
      if (tr.points[j].ply > upto) break;
      visible++;
    }
    var steps = visible - 1;
    if (visible === 1) neverMoved++;
    if (!busiest || steps > busiest.steps) busiest = { code: tr.code, from: tr.from, steps: steps };

  return { busiest: busiest, neverMoved: neverMoved, alive: alive };

/* 画全部轨迹。dead（已被吃）的子整条线降到 alpha 0.25 并在末端画一个

   整局静态事实（不是按 upto 现算的 visible），与 brief 原文一致——它
   只轻微提前透露「这颗子这局再也不会动了」，比透露它具体去哪儿的代价
   小得多。
