     cap 是单帧步数上限。它的意义在批量化之后变了：以前每步都要重算一遍五个
     面板，cap 是在挡「一帧算 240 次」的墙钟灾难；现在一整批只重算一次，cap
     只剩下「别让一帧在轨迹上跑太远」这一个作用。

     dt <= 0（含 NaN）当 0 处理：引擎第一帧的 dt 可能是 0，不该让它把累加器
     搅成 NaN 之后再也走不动。sps <= 0 同理兜到 1。 */
  /* 实现用「乘以速率」一次算出步数，**不是**反复减去 1/sps 的循环。
     两个理由，第二个是实测出来的：
       1) O(1) 而不是 O(步数)；
       2) 反复减会把浮点误差累起来。实测 3.0 秒 @10 步/秒 走出 **29** 步：
          从 3.0 连减 29 次 0.1 之后余下 0.09999999999999973，比 0.1 差一点点，
          第 30 次的 `a >= iv` 就不成立了。改成 Math.floor(3.0 * 10) = 30，
          正是应有的答案（少的那一步虽然会留在 acc 里由下一帧补上，但
          「一秒钟到底走几步」不该靠下一帧来找齐）。 */
  /* EPS：把「差一个浮点末位就够一步」算作够了。
     这不是随手加的容差，是实测的：60 帧各喂 1/60 秒，累加出来的 a 是
     0.9999999999999999 而不是 1.0（二进制里 1/60 不精确），×10 得
     9.999999999999998，floor 成 9 —— 满一秒却只走了 9 步。30 帧各喂 1/30
     秒时又恰好凑够 10 步，于是同一段墙钟时间在 60 Hz 与 30 Hz 上走出不同
     的步数，正好踩中本项目要防的那件事（开发者的外接屏是 30 Hz）。
     1e-9 步是纳秒级的松弛，比任何真实计时分辨率都小若干个数量级，
     不可能凭空多走一步；而它足够盖住 IEEE754 在这个量级上的末位误差。 */
  const PLAY_EPS = 1e-9;
  /* 单帧步数上限的默认值。cap 省略时必须兜到它，**不能**让 Math.min(undefined, n)
     算出 NaN —— NaN 会写进调用方的累加器，而 NaN 一旦进去就再也出不来
     （NaN + dt 还是 NaN，NaN * rate 还是 NaN，floor 还是 NaN），播放从此
     静默死掉且不可恢复。本仓库唯一的调用点是传了 cap 的，但这是个导出给
     工具 ④⑤ 用的公开函数，下一个调用方会在另一个文件里安静地中招。
     同理挡掉 NaN / 负数 cap（Infinity 是有意义的"不设上限"，放行）。 */
  const PLAY_BURST_CAP = 240;
  function playSteps(acc, dt, sps, cap) {
    const lim = (typeof cap === 'number' && cap >= 0) ? cap : PLAY_BURST_CAP;
    const rate = sps > 0 ? sps : 1;
    const a = acc + (dt > 0 ? dt : 0);
    const n = Math.max(0, Math.min(lim, Math.floor(a * rate + PLAY_EPS)));
    return { steps: n, acc: Math.max(0, a - n / rate) };
  }

  /* ---------------- flashMarks：这一步该给谁点琥珀色 ----------------

     从 mount() 的 paintVars 里提出来的**纯函数**，理由是本阶段已经吃过一次亏：
     playSteps 留在闭包里的时候藏着一个"满一秒少走一步"的浮点 bug，提出来当天
     就被 node 测出来了。琥珀色的不变量比它还重要，不该只靠浏览器里点几下。

     **不变量：琥珀色的唯一含义是「这一步产生或变化」。** 基线（上一步的值）
     只在**同一帧**里可比 —— 深度不算数，帧的身份证是入帧步下标（见 frameIds）。

     base = { frameId, i, vals } 是上一步的基线，base 为 null 或 base.frameId
     为 null 表示还没有基线（刚 mount / 刚换轨迹）。四种情形：
       ① 同一帧            → 逐名比对（唯一一条真正在比较的路径）
       ② 这一帧上一步还不存在（入帧步下标 > 上一步的游标位置）→ 全标：
          整帧绑定都是这一步刚诞生的，标它们为真
       ③ 换到一个早就存在的帧（步出 / 后退 / runTo 跨帧）→ 一个都不标
       ④ 没有基线          → 一个都不标 */
  function flashMarks(base, cache) {
    const marks = Object.create(null);
    const hasBase = !!base && base.frameId !== null && base.frameId !== undefined;
    if (!hasBase) return marks;
    const names = cache.names || [];
    if (cache.varsFrameId === base.frameId) {
      const bv = base.vals || {};
      for (let k = 0; k < names.length; k++) {
        const n = names[k];
        if (bv[n] !== cache.vals[n]) marks[n] = true;
      }
    } else if (cache.varsFrameId > base.i) {
      for (let k = 0; k < names.length; k++) marks[names[k]] = true;
    }
    return marks;
  }

  function ensureDbgStyles() {
    if (document.getElementById(DBG_CSS_ID)) return;
    const st = document.createElement('style');
    st.id = DBG_CSS_ID;
    st.textContent = DBG_CSS;
    document.head.appendChild(st);
  }

  /* locals() 里的值**已经是 interp.js 的 snap() 快照**，不是活对象：
     snap() 会把函数值（解释出来的 {__fn:true,…} 和真 JS function 两种）
     就地换成字符串 `'ƒ 名字'`，把环形引用换成 `'[环形引用]'`，其余原样。
     所以下面这个前缀判断不是装饰：不加它，`ƒ safe` 会落进上一行的字符串
     分支被 JSON.stringify 加上一对引号，面板上显示成 `safe = "ƒ safe"`
     ——看起来像一个内容碰巧是这几个字的字符串变量，而不是一个函数。
     （实测抓到的，见任务报告。）
     代价是一个真的以 U+0192 加空格开头的用户字符串会被显示成不带引号的
     样子。这份歧义是 snap() 在轨迹里就已经造成的，不是这一层引入的——
     这一层只能选把常见情形显示对，而不是把它显示错。
     下面 function / __fn 两个分支因此在**正常轨迹上永远走不到**，留着是给
     没经过 snap() 的值用的：fmtVal 也被验收页拿去渲染 run().result，那个
     值是活的原值，不是快照。 */
  function fmtVal(v, depth) {
    depth = depth || 0;
    if (v === null) return 'null';
    if (typeof v === 'undefined') return 'undefined';
    if (typeof v === 'string') return v.slice(0, 2) === 'ƒ ' ? v : JSON.stringify(v);
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    if (typeof v === 'function') return 'ƒ ' + (v.name || '(anonymous)');
    if (typeof v === 'object' && v.__fn === true) return 'ƒ ' + (v.name || '(anonymous)');
    if (Array.isArray(v)) {
      if (depth >= 2) return '[…]';
      const parts = [];
      for (let k = 0; k < v.length && k < 12; k++) parts.push(fmtVal(v[k], depth + 1));
      if (v.length > 12) parts.push('… +' + (v.length - 12));
      return '[' + parts.join(', ') + ']';
    }
    if (typeof v === 'object') {
      if (depth >= 2) return '{…}';
      const keys = Object.keys(v), parts = [];
      for (let k = 0; k < keys.length && k < 8; k++) parts.push(keys[k] + ': ' + fmtVal(v[keys[k]], depth + 1));
      if (keys.length > 8) parts.push('… +' + (keys.length - 8));
      return '{' + parts.join(', ') + '}';
    }
    return String(v);
  }

  /* mount(el, cur, opts) → handle。

     opts:
       editor        Editor.mount() 的句柄。**代码区就是它**（规格 §2.8：
                     「当前执行行高亮（与调试器共用同一状态）」）——本模块不
                     另建第二个代码视图，只往这个句柄里写执行行/已访问行/断点。
       t             i18n 取值函数（页面传 VizEngine.t）。省略时退回英文。
       onCursorMove  游标移动且缓存已刷新之后调用，参数是 handle.state()。
       readout       可选：返回一段 HTML，追加进读数区（工具 ④⑤ 的尝试/回溯/
                     剪枝计数属于工具，不属于本模块）。
       keyTarget     绑快捷键的目标，默认 window。

     **本模块不自己起 rAF**：播放靠调用方每帧调一次 tick(dt)，dt 必须来自
     VizEngine.state.dt（引擎唯一的时钟出口，已 clamp 到 [0,0.05]）。按时间
     推进而不是按帧计数，是硬约束——开发者的外接屏是 30 Hz，任何按帧计数的
     速度在那台机器上都会慢一半。 */
  function mount(el, cur, opts) {
    opts = opts || {};
    ensureDbgStyles();
    const T = opts.t || function (s) { return (s && typeof s === 'object') ? (s.en != null ? s.en : s.zh) : s; };
    const editor = opts.editor || null;
    const keyTarget = opts.keyTarget || window;

    el.classList.add('dbg-root');
    el.textContent = '';

    const bar = document.createElement('div');
    bar.className = 'dbg-bar';
    function mkBtn(key, fn, title) {
      const b = document.createElement('button');
      b.className = 'dbg-btn';
      b.dataset.k = key;
      if (title) b.dataset.hint = title;
      b.addEventListener('click', fn);
      bar.appendChild(b);
      return b;
    }
    const bPlay = mkBtn('play', function () { setPlaying(!playing); });
    const bBack = mkBtn('back', function () { move(function (c) { return step(c, -1); }); });
    const bStep = mkBtn('step', function () { move(function (c) { return step(c, 1); }); });
    const bIn   = mkBtn('stepIn', function () { move(stepIn); }, 'F11');
    const bOver = mkBtn('stepOver', function () { move(stepOver); }, 'F10');
    const bOut  = mkBtn('stepOut', function () { move(stepOut); }, 'Shift+F11');
    const bRun  = mkBtn('runTo', function () { move(runTo); }, 'F5');

    const speedWrap = document.createElement('div');
    speedWrap.className = 'dbg-speed';
    const speedLab = document.createElement('span');
    const speedIn = document.createElement('input');
    speedIn.type = 'range';
    speedIn.min = '1'; speedIn.max = '120'; speedIn.step = '1'; speedIn.value = '10';
    const speedVal = document.createElement('b');
    speedWrap.appendChild(speedLab);
    speedWrap.appendChild(speedIn);
    speedWrap.appendChild(speedVal);
    bar.appendChild(speedWrap);

    const grid = document.createElement('div');
    grid.className = 'dbg-grid';
    function mkPane(cls) {
      const p = document.createElement('section');
      p.className = 'dbg-pane ' + cls;
      const h = document.createElement('h4');
      const list = document.createElement('div');
      list.className = 'dbg-list';
      p.appendChild(h);
      p.appendChild(list);
      return { pane: p, head: h, list: list };
    }
    const paneStack = mkPane('dbg-stack');
    const paneVars = mkPane('dbg-vars');
    const paneOut = mkPane('dbg-out');
    grid.appendChild(paneStack.pane);
    grid.appendChild(paneVars.pane);

    const readoutEl = document.createElement('div');
    readoutEl.className = 'dbg-readout';

    el.appendChild(bar);
    el.appendChild(grid);
    el.appendChild(paneOut.pane);
    el.appendChild(readoutEl);

    /* ---------------- 缓存：只在游标移动 / 换轨迹 / 换选中帧时重算 ---------------- */
    let cache = null;
    let prevVals = Object.create(null);   // 上一**步**的变量渲染文本，用来判定"这一步变了谁"
    /* 基线的归属：那份 prevVals 是**哪一帧**、在**哪个下标**上取的。
       null = 还没有基线（刚 mount、刚换轨迹）——此时一个名字都不许标，
       否则第 0 步会把「全部变量」当成「这一步全变了」闪一屏（验收清单第 23 条
       明确把凭空的琥珀色判成 bug）。 */
    let prevFrameId = null;
    let prevI = -1;
    let flashed = Object.create(null);    // 上一步真的变了的那些名字
    let flashedFrame = null;              // 那份标记是在哪一帧（入帧步下标）上算出来的
    /* 选中的调用栈帧。-1 = 跟随最内层（默认，也是每次单步之后自动回到的状态）；
       >= 0 则是显式选中的一帧，0 是全局帧。选中一帧会同时改**两样**东西：
       代码视图跳到那一帧的行，**变量区换成那一帧的变量**。只跳代码不换变量，
       等于把 A 帧的代码摆在 B 帧的变量旁边而不加说明——对一个正在学
       「每次递归调用都有自己的 n」的人，那是最坏的一种并排。 */
    let selFrame = -1;

    function recompute() {
      const stack = callStack(cur);
      const ids = frameIds(cur);
      /* selFrame < 0 时传 undefined，让 locals 走它的默认分支（最内层帧）；
         选中某一帧时传那一帧的 depth。越界（选中的帧因为游标移动已经不在栈上）
         由 locals 自己返回空对象，这里不额外兜。 */
      const lv = locals(cur, selFrame < 0 ? undefined : selFrame);
      const vals = Object.create(null);
      const names = Object.keys(lv).sort();
      for (let k = 0; k < names.length; k++) vals[names[k]] = fmtVal(lv[names[k]]);
      const shown = selFrame < 0 ? stack.length : selFrame;
      cache = {
        i: cur.i, len: cur.trace.length,
        truncated: !!cur.trace.truncated,
        line: currentLine(cur),
        depth: stack.length,
        visited: visitedLines(cur),
        stack: stack,
        /* varsFrame：变量区此刻显示的是**哪一帧**。面板标题写出来，
           不让使用者自己猜（规格 §2.7 的变量区只说"当前作用域"，而一旦
           允许点栈帧，"当前"就有两个可能的意思了）。 */
        varsFrame: shown,
        /* varsFrameId：变量区显示的那一帧的**身份证**（入帧步下标；全局帧恒为
           -1，越界的选中帧记 -2）。琥珀色的基线归属看它，不看 varsFrame ——
           见 frameIds 的注释：深度会被重复使用，下标不会。 */
        varsFrameId: shown === 0 ? -1 : (ids[shown - 1] != null ? ids[shown - 1] : -2),
        varsFrameName: shown === 0 ? null : ((stack[shown - 1] && stack[shown - 1].name) || '(anonymous)'),
        selected: selFrame >= 0,
        names: names, vals: vals,
        output: output(cur),
        board: boardState(cur),
      };
    }

    /* ---------------- 渲染 ---------------- */
    function rowText(cls, text) {
      const d = document.createElement('div');
      d.className = 'dbg-row ' + cls;
      d.textContent = text;
      return d;
    }
    function emptyRow(msg) {
      const d = document.createElement('div');
      d.className = 'dbg-empty';
      d.textContent = T(msg);
      return d;
    }

    function paintStack() {
      const frag = document.createDocumentFragment();
      const g = document.createElement('div');
      g.className = 'dbg-row dbg-frame' + (selFrame === 0 ? ' sel' : '');
      g.dataset.fi = '0';
      g.textContent = T(DBG_UI.global);
      frag.appendChild(g);
      for (let k = 0; k < cache.stack.length; k++) {
        const f = cache.stack[k];
        const d = document.createElement('div');
        d.className = 'dbg-row dbg-frame' + (selFrame === k + 1 ? ' sel' : '');
        d.dataset.fi = String(k + 1);
        d.dataset.line = String(f.line);
        const nm = document.createElement('span');
        nm.textContent = '  '.repeat(k) + (f.name || '(anonymous)') + '()';
        const at = document.createElement('span');
        at.className = 'at';
        at.textContent = '  @' + T(DBG_UI.roLine) + ' ' + f.line;
        d.appendChild(nm);
        d.appendChild(at);
        frag.appendChild(d);
      }
      if (!cache.stack.length) frag.appendChild(emptyRow(DBG_UI.noStack));
      paneStack.list.textContent = '';
      paneStack.list.appendChild(frag);
    }

    /* paintVars(isStep) —— **琥珀色闪烁的唯一含义是「这一步变了」。**
       因此只有真的走了一步（游标移动或换轨迹）才允许比对与重置基线；
       任何"不是一步"的重绘（点栈帧换看哪一帧、切语言）都必须 isStep=false：
       不闪，也**不动 prevVals**。

       两个具体的坏法，都是这条不变量被破坏的样子：
       ① 点外层帧时若照常比对，prevVals 还是最内层帧的值、cache.vals 已是
          外层帧的值，两帧的变量名基本不重合 —— 整屏变量一起闪，而根本没有
          任何一步发生；
       ② 更隐蔽的是接下来那一下 F10：若刚才顺手把 prevVals 重置成了外层帧的
          值，这一步就会拿最内层帧的新值去跟**另一帧**的旧值比，于是又闪一屏。
       验收清单第 23 条把"凭空的琥珀色"直接判成 bug，这里正是它的另一个来源。

       **isStep 这条路上同样要看帧**，这是上面那道守卫的镜像。走一步完全可以
       换帧（步入压帧、步出弹帧、跑到断点跨好几帧），而 prevVals 是**上一步
       那一帧**的值。不加守卫时实测 fact(4)（18 步轨迹、8 次换帧）每一次换帧
       都整帧闪：步出回到调用方那一下，调用方的 acc 与 n 一起宣布"我变了"，
       而它们从被挂起到现在一个字节都没动过。一个正看着递归收栈的人，
       看到的是一句谎话，而且正是这一阶段最核心的那一课上的谎话。

       换帧时怎么判，全部在 flashMarks 里（纯函数、node 可测），四种情形见那里。
       一刀切成"全标"或"全不标"都不对：全标 = 步出那条 bug 原样保留；
       全不标 = 步入时新绑定不再点亮，而那个点亮是真的。 */
    function paintVars(isStep) {
      /* 标记归属于一对 (哪一步, 哪一帧)：
         - 真的走了一步 → 现算（按上面四种情形），记下来，并把基线推进到本步；
         - 不是一步 → **原样复用**上一步算出来的那份标记，前提是现在显示的
           还是同一帧。只把 changed 一律当 false 会把当前这一步的琥珀色抹掉
           （切语言时就会这样）；而不看帧就复用，又会把最内层帧变了的名字
           标到外层帧同名的变量上。两个条件都要。 */
      let marks;
      if (isStep) {
        marks = flashMarks({ frameId: prevFrameId, i: prevI, vals: prevVals }, cache);
        flashed = marks;
        flashedFrame = cache.varsFrameId;
        prevVals = cache.vals;
        prevFrameId = cache.varsFrameId;
        prevI = cache.i;
      } else {
        marks = (cache.varsFrameId === flashedFrame) ? flashed : Object.create(null);
      }
      const frag = document.createDocumentFragment();
      for (let k = 0; k < cache.names.length; k++) {
        const n = cache.names[k];
        const changed = !!marks[n];
        const d = document.createElement('div');
        d.className = 'dbg-row dbg-var' + (changed ? ' chg' : '');
        const nm = document.createElement('span');
        nm.className = 'nm';
        nm.textContent = n;
        const eq = document.createElement('span');
        eq.className = 'eq';
        eq.textContent = ' = ';
        d.appendChild(nm);
        d.appendChild(eq);
        d.appendChild(document.createTextNode(cache.vals[n]));
        frag.appendChild(d);
      }
      if (!cache.names.length) frag.appendChild(emptyRow(DBG_UI.noVars));
      paneVars.list.textContent = '';
      paneVars.list.appendChild(frag);
      /* 标题写出这一栏显示的是哪一帧的变量。选中外层帧时额外加一个记号，
         省得看着一屏不熟悉的值去猜「程序是不是跳走了」——执行位置并没有动。 */
      paneVars.head.textContent = T(DBG_UI.vars) + ' · ' +
        (cache.varsFrameName ? cache.varsFrameName + '()' : T(DBG_UI.global)) +
        (cache.selected ? '  ' + T(DBG_UI.selected) : '');
    }

    /* 输出区增量渲染：日志只在末尾增删（输出是 [0, i] 的前缀），所以
       前进时只追加、后退时只砍尾，不整块重建——重建会把使用者的滚动位置
       每一步都甩回顶部。 */
    let outLen = 0;
    function paintOut() {
      const want = cache.output.length;
      if (want < outLen) {
        while (paneOut.list.children.length > want) paneOut.list.removeChild(paneOut.list.lastChild);
      } else if (want > outLen) {
        if (outLen === 0) paneOut.list.textContent = '';
        const frag = document.createDocumentFragment();
        for (let k = outLen; k < want; k++) frag.appendChild(rowText('', cache.output[k]));
        paneOut.list.appendChild(frag);
        paneOut.list.scrollTop = paneOut.list.scrollHeight;
      }
      outLen = want;
      if (!want && !paneOut.list.children.length) paneOut.list.appendChild(emptyRow(DBG_UI.noOut));
    }

    function paintReadout() {
      const nBreaks = Object.keys(cur.breakpoints).length;
      let html = '<b>' + (cache.len ? cache.i + 1 : 0) + '</b> / ' + cache.len + ' ' + T(DBG_UI.roStep) +
                 ' &middot; ' + T(DBG_UI.roLine) + ' <b>' + (cache.line == null ? '—' : cache.line) + '</b>' +

     message 原样透传，不包一层 {zh, en}、也不做任何翻译——它是从
     interp.js 产生的，编辑器要逐字显示这句话，在这里发明一层双语会让
     措辞跟解释器本身的表述分叉。

     **catch 接住的不一定是解析错。** 这个 try 罩着的是 Interp.parse 的整个
     调用，parse 内部自己的 bug（TypeError: Cannot read properties of
     undefined…）同样会落进来，而它**没有** line / col / category。照原样往
     下走的后果是：index 算成 NaN、category 是 undefined、V8 自己的报错文案
     被摆进编辑器的「语法错误」槽里，学习者读到的是"你第 NaN 行写错了"。
     一条她无法理解、也无法修的错误被说成是她写错了——正是本阶段最不能出的
     那种谎话（她只会得出"我没看懂"的结论）。
     所以：**只有带 line 的错才当解析错处理**，其余归到 category:'internal'，
     line/col/index 一律 null（DOM 层据此不画波浪线、不点红点——错不在某一行
     上，指哪一行都是编的），message 仍旧原样透传给调用方，由它去配一句
     「这是编辑器内部出错，不是你的代码的问题」的双语措辞（见 category 那段：
     分类是机器读的字段，措辞是调用方的事）。
     注意 Run 照旧被禁用（返回值是真值）——内部出错时不该假装可以运行。 */
  function check(src) {
    const I = interp();                  // ← 故意在 try 之外，见 interp() 的注释
    try {
      I.parse(src);
      return null;
    } catch (e) {
      if (!e || typeof e.line !== 'number' || typeof e.col !== 'number') {
        return {
          line: null, col: null, index: null, category: 'internal',
          message: (e && e.message) ? String(e.message) : String(e),
        };
      }
      const starts = lineStarts(src);
      const index = starts[e.line - 1] + e.col - 1;
      return { line: e.line, col: e.col, category: e.category, message: e.message, index: index };
    }
  }

  /* ---------------- 括号配对（规格 §2.8「括号配对高亮」） ----------------
     纯函数、零 DOM，node 可测。

     **同样复用 Interp.tokenize，不自己扫字符。** 这不是为了省事，是为了正确：
     裸扫字符会把字符串、模板串、注释里的括号当成真括号——`log("(")` 里的那个
     左括号会去跟真代码里的右括号配对，高亮当场指错地方。词法器已经把它们
     切成了 str/tpl/comment token，只看 punct token 就天然免疫。这与高亮层
     复用同一个词法器是同一条理由（见文件头注释）。

     光标定位约定与主流编辑器一致：**先看光标左邻的那个字符**（刚打完一个
     右括号时，人期待它立刻和它的左括号一起亮），左邻不是括号再看右邻。

     tokenize 抛错（引号没闭合之类）时返回 null，与 highlight() 的降级同一
     策略：打字打到一半源码几乎总是暂时不合法的，这时候不配对好过配错。 */
  const OPENERS = { '(': ')', '[': ']', '{': '}' };
  const CLOSERS = { ')': '(', ']': '[', '}': '{' };

  function bracketList(src) {
    const I = interp();                  // ← 故意在 try 之外，见 interp() 的注释
    let toks;
    try { toks = I.tokenize(src); } catch (e) { return null; }
    const out = [];
    for (let k = 0; k < toks.length; k++) {
      const tk = toks[k];
      if (tk.type !== 'punct') continue;
      const ch = src.slice(tk.start, tk.end);
      if (OPENERS[ch] || CLOSERS[ch]) out.push({ ch: ch, at: tk.start });
    }
    return out;
  }

  /* matchBracket(src, caret) → null | { open, close }，两个都是 src 里的字符下标。
     open 恒小于 close，与光标贴的是哪一头无关——调用方画两个框，不关心是谁
     找到了谁。 */
  function matchBracket(src, caret) {
    const list = bracketList(src);
    if (!list) return null;
    let idx = -1;
    for (let k = 0; k < list.length; k++) if (list[k].at === caret - 1) { idx = k; break; }
    if (idx < 0) for (let k = 0; k < list.length; k++) if (list[k].at === caret) { idx = k; break; }
    if (idx < 0) return null;

    const here = list[idx];
    if (OPENERS[here.ch]) {
      let depth = 0;
      for (let k = idx; k < list.length; k++) {
        if (OPENERS[list[k].ch]) depth++;
        else {
          depth--;
          if (depth === 0) {
            /* 深度归零时遇到的必须是**同种**的右括号；`(]` 这种交叉是配对
               失败，不是配上了——报 null 让高亮不亮，比亮在错的字符上诚实。 */
            return list[k].ch === OPENERS[here.ch] ? { open: here.at, close: list[k].at } : null;
          }
        }
      }
      return null;
    }
    let depth = 0;
    for (let k = idx; k >= 0; k--) {
      if (CLOSERS[list[k].ch]) depth++;
      else {
        depth--;
        if (depth === 0) {
          return list[k].ch === CLOSERS[here.ch] ? { open: list[k].at, close: here.at } : null;
        }
      }
    }
    return null;
  }

  /* ==================== DOM 层：透明 textarea 叠加编辑器（规格 §2.8） ====================

     以下所有代码**只在 mount() 被调用之后**才碰 document / window。模块顶层与
     上面三个纯函数一律零 DOM，node 测试套件（editor.test.js）因此照常装载得了
     这个文件。这条分界线是本模块的架构承诺：逻辑留在纯函数里，DOM 只负责画。
     不要把任何判断（高亮切片、语法检查、行起点换算）搬进这一层——它们在
     node 里可测，搬下来就再也测不了了。

     两层对齐是这套做法唯一真正会坏的地方：textarea 与 <pre> 的字体度量差一丝，
     光标就压在错误的字形上。所以两层的度量**由同一条 CSS 规则**同时声明
     （下面 `.ed-ta,.ed-hl,.ed-hl code,.ed-measure` 并列的那一条），而不是分别
     写两遍——不给「两处各写一遍、有一天只改了一处」留任何机会。

     纵向 padding 一律为 0，上下留白改由 .ed-root 自己的 padding 提供：
     textarea 的纵向 padding 会随内容一起滚走，而高亮层是靠 transform 平移内层
     <code> 的（padding 不跟着动），两者对纵向 padding 的处理天生不同，归零就
     没有这个分歧。横向 padding 两层写的是同一个值，滚动时两层的文字都压在
     padding 区上，行为一致，所以可以留。 */

  const CSS_ID = 'chess-editor-dom-css';
  /* 行高。行号槽、行条纹、波浪线、括号框的定位全靠它把行号换算成像素。
     **CSS 里所有跟行高有关的数都从这里插值出来，一个字面量都不留**（写法与
     下面的 PAD_X 一致）。这一条原来写的是"与下面 CSS 里的 line-height 是同一个
     数……改 CSS 就必须同时改这里"——那是一句靠人记住的约定，而 CSS 里当时躺着
     七个 18px 字面量。把 CSS 改成 20px、常量留在 18，条纹/波浪线/括号框会顺着
     文件**越往下偏得越多**（第 40 行差 80px），而整套 node 断言全绿：
     editor.test.js 只测得到 `LINE_H > 0`，测不到 CSS 字符串里写的是几。
     插值之后这种漂移写不出来了。 */
  const LINE_H = 18;
  /* 横向起点。**一个常量喂三处**：textarea 的 padding-left、高亮层的
     padding-left、以及 JS 里波浪线/括号框的 left 计算。
     字体度量已经靠"同一条 CSS 规则命中两层"做到了结构上不可能漂移，横向
     起点原来却是两处各写一遍的 `8px` 字面量——那是同一种失败（光标压在错的
     字形上），只是换了个轴。而且第三处（覆盖层的 left）当时压根没算这 8px，
     波浪线一直整体左移了一个 padding 的宽度。三处现在都从这里取。 */
  const PAD_X = 8;
  const PAD_L = '0 0 0 ' + PAD_X + 'px';
  /* 波浪线用内联 SVG data URI，不引外部图片（零依赖硬约束）。 */
  const SQUIGGLE = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='3'>" +
                   "<path d='M0 2.4 L1.5 0.6 L3 2.4 L4.5 0.6 L6 2.4' fill='none' stroke='%23f87171' stroke-width='1'/></svg>\")";

  const CSS = [
    '.ed-root{position:relative;display:flex;min-height:0;padding:6px 0;box-sizing:border-box;',
    'background:rgba(8,13,24,.72);border:1px solid rgba(148,163,184,.16);border-radius:10px;overflow:hidden}',
    /* ↓↓↓ 两层度量的唯一声明处，见上面的长注释 ↓↓↓ */
    '.ed-ta,.ed-hl,.ed-hl code,.ed-measure{',
    'font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;',
    'font-size:12.5px;line-height:' + LINE_H + 'px;letter-spacing:0;word-spacing:0;',
    'tab-size:2;-moz-tab-size:2;font-variant-ligatures:none;font-kerning:none;',
    'white-space:pre;overflow-wrap:normal;text-rendering:geometricPrecision}',
    /* ↑↑↑ 两层度量的唯一声明处 ↑↑↑ */
    '.ed-gutter{flex:0 0 auto;width:48px;position:relative;overflow:hidden;',
    'background:rgba(6,10,20,.55);border-right:1px solid rgba(148,163,184,.14);user-select:none}',
    '.ed-gutter-inner{position:absolute;left:0;top:0;right:0}',
    '.ed-ln{position:relative;height:' + LINE_H + 'px;line-height:' + LINE_H + 'px;box-sizing:border-box;',
    'font:11px/' + LINE_H + 'px ui-monospace,"SF Mono",Menlo,Consolas,monospace;',
    'color:rgba(159,176,200,.42);text-align:right;padding-right:8px;cursor:pointer}',
    '.ed-ln:hover{color:#bfefff;background:rgba(45,212,234,.07)}',
    '.ed-ln.bp{color:#ffd9e0}',
    '.ed-ln.bp::before{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;',
    'background:#fb7185;box-shadow:0 0 6px rgba(251,113,133,.85)}',
    '.ed-ln.err::after{content:"";position:absolute;left:17px;top:6px;width:6px;height:6px;border-radius:50%;background:#f87171}',
    '.ed-ln.cur{color:#9be8f7;background:rgba(45,212,234,.12)}',
    '.ed-body{position:relative;flex:1 1 auto;min-width:0}',
    '.ed-lines{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}',
    '.ed-lines-inner{position:absolute;left:0;top:0;right:0}',
    '.ed-stripe{position:absolute;left:0;right:0;height:' + LINE_H + 'px}',
    '.ed-stripe.visited{background:rgba(45,212,234,.055)}',
    '.ed-stripe.frame{background:rgba(167,139,250,.14);box-shadow:inset 2px 0 0 #a78bfa}',
    '.ed-stripe.cur{background:rgba(45,212,234,.16);box-shadow:inset 2px 0 0 #2dd4ea}',
    '.ed-squiggle{position:absolute;height:' + LINE_H + 'px;background-repeat:repeat-x;background-position:left bottom;',
    'background-size:6px 3px;background-image:' + SQUIGGLE + '}',
    /* 括号配对高亮：两个等宽的框，一个套开括号、一个套闭括号 */
    '.ed-bracket{position:absolute;height:' + LINE_H + 'px;box-sizing:border-box;',
    'border:1px solid rgba(45,212,234,.7);border-radius:2px;background:rgba(45,212,234,.12)}',
    '.ed-hl{position:absolute;inset:0;margin:0;padding:' + PAD_L + ';box-sizing:border-box;',
    'overflow:hidden;pointer-events:none;z-index:1;color:#dbe6f5}',
    '.ed-hl code{display:block}',
    '.ed-measure{position:absolute;visibility:hidden;left:-9999px;top:0}',
    '.ed-ta{position:absolute;inset:0;z-index:2;box-sizing:border-box;width:100%;height:100%;',
    'margin:0;padding:' + PAD_L + ';border:0;outline:none;resize:none;display:block;',
    'background:transparent;color:transparent;caret-color:#7dd3fc;overflow:auto}',
    '.ed-ta::selection{background:rgba(45,212,234,.30)}',
    '.ed-ta::-webkit-scrollbar{width:8px;height:8px}',
    '.ed-ta::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:4px}',
    /* token 配色：沿用子项目调色板（violet / orange / emerald / slate） */
    '.ed-kw{color:#a78bfa}',
    '.ed-num{color:#fb923c}',
    '.ed-str,.ed-tpl{color:#34d399}',
    '.ed-comment{color:rgba(159,176,200,.48);font-style:italic}',
    '.ed-name{color:#dbe6f5}',
    '.ed-punct{color:rgba(159,176,200,.82)}',
  ].join('');

  function ensureStyles() {
    if (document.getElementById(CSS_ID)) return;
    const st = document.createElement('style');
    st.id = CSS_ID;
    st.textContent = CSS;
    document.head.appendChild(st);
  }

  /* mount(el, { value, onChange, debounce }) → handle。

     onChange(value, err) 在**防抖之后**调用一次，err 是 check() 的原样返回值
     （合法时 null）——调用方据此禁用 Run（规格 §2.8：不会跑到一半才崩）。
     mount() 结束前会同步触发一次，这样 Run 的初始禁用态在第一次输入之前
     就是对的，而不是要等使用者先敲一个字符。

     handle 上与调试器对接的四个入口（setExecLine / setVisited / setFrameLine /
     setBreakpoints）都只改「怎么画」，不持有任何调试状态——断点的真身在
     Debugger 的 cur.breakpoints 上，这里只拿一个谓词去问它。 */
  function mount(el, opts) {
    opts = opts || {};
    ensureStyles();

    el.classList.add('ed-root');
    el.textContent = '';

    const gutter = document.createElement('div');
    gutter.className = 'ed-gutter';
    const gutterInner = document.createElement('div');
    gutterInner.className = 'ed-gutter-inner';
    gutter.appendChild(gutterInner);

    const body = document.createElement('div');
    body.className = 'ed-body';
    const lines = document.createElement('div');
    lines.className = 'ed-lines';
    const linesInner = document.createElement('div');
    linesInner.className = 'ed-lines-inner';
    lines.appendChild(linesInner);
    const pre = document.createElement('pre');
    pre.className = 'ed-hl';
    const code = document.createElement('code');
    pre.appendChild(code);
    const ta = document.createElement('textarea');
    ta.className = 'ed-ta';
    ta.spellcheck = false;
    ta.setAttribute('wrap', 'off');              // 关掉软换行：两层都必须 pre，不折行
    ta.setAttribute('autocapitalize', 'off');
    ta.setAttribute('autocomplete', 'off');
    ta.setAttribute('autocorrect', 'off');
    ta.value = opts.value == null ? '' : String(opts.value);
    body.appendChild(lines);
    body.appendChild(pre);
    body.appendChild(ta);

    el.appendChild(gutter);
    el.appendChild(body);

    let execLine = null;        // 当前执行行（调试器写）
    let frameLine = null;       // 选中的调用栈帧所在行（调试器写）
    let visited = Object.create(null);
    let hasBreak = function () { return false; };
    let gutterClick = null;
    let err = null;
    /* err 是不是**针对当前这份文本**算出来的。输入之后、防抖到期之前，err 还是
       编辑前那一次的结果：它的 line/col/index 指的是旧文本里的位置，拿去画
       波浪线会画在错的字符上；删掉几行时 err.line 甚至可能大于现在的总行数，
       波浪线就飘到最后一行下面去。所以 onInput 把它标记为陈旧，refreshMarkers
       在陈旧期间不画任何错误标记，emit() 重算之后再恢复。
       **getError() 仍然返回 err**（最后一次算出来的结果）——调用方拿它去
       决定 Run 的禁用态，那个判断在防抖期间应当保持不变，而不是先松开再收紧。 */
    let errFresh = true;
    let lineCount = 0;
    let charW = 0;
    let bracket = null;         // matchBracket() 的最近一次结果

    /* 行起点缓存：refreshMarkers 与 caretLine 都要 lineStarts(ta.value)，而
       refreshMarkers 在播放时每帧都跑。源码在两次调用之间几乎从不变，缓存
       一份、按内容比对失效即可（字符串相等是一次 memcmp，比重建一个几十项
       的数组 + 分配便宜得多）。 */
    let startsText = null, startsArr = null;
    function currentStarts() {
      if (startsText !== ta.value) { startsText = ta.value; startsArr = lineStarts(startsText); }
      return startsArr;
    }

    /* 字符宽度：拿一个与高亮层度量完全相同的隐藏元素实测，而不是靠
       canvas.measureText 另建一套字体串——那样又多出一处「同一个度量写两遍」。

       **量到 0 时绝不缓存。** 面板此刻可能整个 display:none（验收页按 `\`
       折叠时就是），getBoundingClientRect 返回 0。原来的 `w || 7` 会把
       7px 这个假宽度钉死一整个会话，此后每一条波浪线、每一个括号框都错位，
       而且再也没有机会自愈。现在量不到就返回 0，调用方跳过这一次绘制，
       等面板可见时的下一次刷新自然量到真值。 */
    function measureChar() {
      const probe = document.createElement('span');
      probe.className = 'ed-measure';
      probe.textContent = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx';   // 40 个
      body.appendChild(probe);
      const w = probe.getBoundingClientRect().width / 40;
      body.removeChild(probe);
      return w > 0 ? w : 0;
    }
    function ensureCharW() {
      if (charW > 0) return charW;
      const w = measureChar();
      if (w > 0) charW = w;
      return w;
    }

    /* 字符下标 → 覆盖层里的像素位置。PAD_X 必须加上：覆盖层（.ed-lines）是
       贴着 .ed-body 满铺的，而文字从 padding-left 之后才开始。 */
    function posOf(index) {
      const starts = currentStarts();
      let lo = 0, hi = starts.length - 1;
      while (lo < hi) {
        const mid = (lo + hi + 1) >> 1;
        if (starts[mid] <= index) lo = mid; else hi = mid - 1;
      }
      return { line: lo + 1, col: index - starts[lo] + 1 };
    }
    function leftPx(col) { return PAD_X + (col - 1) * charW; }

    function renderHighlight() {
      const src = ta.value;
      const segs = highlight(src);
      const frag = document.createDocumentFragment();
      for (let k = 0; k < segs.length; k++) {
        const s = segs[k];
        if (s.cls === 'plain') {
          frag.appendChild(document.createTextNode(s.text));
        } else {
          const sp = document.createElement('span');
          sp.className = 'ed-' + s.cls;
          sp.textContent = s.text;
          frag.appendChild(sp);
        }
      }
      /* 末尾补一个换行：源码最后一行为空时，<pre> 不会为它留出一行的高度，
         而 textarea 会——补上之后两层的总高度一致，滚到底不会错位。 */
      frag.appendChild(document.createTextNode('\n'));
      code.textContent = '';
      code.appendChild(frag);
    }

    function renderGutter() {
      const n = lineStarts(ta.value).length;
      if (n === lineCount) return;
      lineCount = n;
      const frag = document.createDocumentFragment();
      for (let i = 1; i <= n; i++) {
        const d = document.createElement('div');
        d.className = 'ed-ln';
        d.dataset.line = String(i);
        d.textContent = String(i);
        frag.appendChild(d);
      }
      gutterInner.textContent = '';
      gutterInner.appendChild(frag);
    }

    /* 只改标记，不重建 DOM：断点/当前行/错误行每一步都在变，重建整槽会把
       点击目标在指针按下与抬起之间换掉。 */
    function refreshMarkers() {
      /* 陈旧的 err 一律不参与绘制，见 errFresh 的声明处。 */
      const e = errFresh ? err : null;
      const kids = gutterInner.children;
      for (let i = 0; i < kids.length; i++) {
        const ln = i + 1;
        const d = kids[i];
        d.classList.toggle('bp', !!hasBreak(ln));
        d.classList.toggle('cur', execLine === ln);
        d.classList.toggle('err', !!e && e.line === ln);
        d.title = (e && e.line === ln) ? e.message : '';
      }

      const frag = document.createDocumentFragment();
      for (const key in visited) {
        const ln = +key;
        if (ln === execLine || ln === frameLine) continue;
        const st = document.createElement('div');
        st.className = 'ed-stripe visited';
        st.style.top = ((ln - 1) * LINE_H) + 'px';
        frag.appendChild(st);
      }
      if (frameLine != null && frameLine !== execLine) {
        const st = document.createElement('div');
        st.className = 'ed-stripe frame';
