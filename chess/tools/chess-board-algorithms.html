         "这个对象是不是我们要的形状"归这里。字段坏了就退回默认值，不抛。 ---- */
  function srcKey(pid) { return pid + '.src'; }
  function blankKey(pid, id) { return pid + '.' + id; }

  function loadSrc(pid) {
    const v = storeGet(srcKey(pid));
    if (!v) return null;
    if (typeof v.text !== 'string' || typeof v.paramSig !== 'string') {
      console.warn('[chess-board-algorithms] 存档 ' + LS_PREFIX + srcKey(pid) +
                   ' 缺 text / paramSig，当作没有');
      return null;
    }
    return { text: v.text, paramSig: v.paramSig, lang: (v.lang === 'zh' || v.lang === 'en') ? v.lang : null };
  }
  function saveSrc(pid, text) {
    if (!exerciseOn() || !pid) return false;          // 正常模式一个字节都不碰
    return storeSet(srcKey(pid), { text: text, paramSig: paramSig(pid), lang: curLang() });
  }
  function dropSrc(pid) { if (pid) storeDel(srcKey(pid)); }

  /* 一个挖空的进度。**读不出来 = 全新开始**，而不是报错：这三个数丢了顶多是
     少记一笔，不该挡住她做题。 */
  function loadBlank(pid, id) {
    const v = storeGet(blankKey(pid, id)) || {};
    const n = (typeof v.attempts === 'number' && isFinite(v.attempts) && v.attempts >= 0)
      ? Math.floor(v.attempts) : 0;
    const lv = (v.hintLevel === 0 || v.hintLevel === 1 || v.hintLevel === 2 ||
                v.hintLevel === 3 || v.hintLevel === 4) ? v.hintLevel : 0;
    const at = (typeof v.solvedAt === 'number' && isFinite(v.solvedAt)) ? v.solvedAt : null;
    return { attempts: n, hintLevel: lv, solvedAt: at };
  }
  function saveBlank(pid, id, rec) {
    if (!exerciseOn() || !pid) return false;
    return storeSet(blankKey(pid, id), {
      attempts: rec.attempts, hintLevel: rec.hintLevel, solvedAt: rec.solvedAt,
    });
  }
  /* ================= localStorage 到此为止 ================= */

  /* 占位注释那几行的中英原地对换。查得到表的那几行才换 —— 她自己改过的行对不上
     任何一份，原样留着。

     ⚠ **它今天只剩一个调用点：「从存档恢复」**（存的时候可能是另一种语言）。
     切语言那一头已经改成整份重新生成了（retextSources），逐行对换在那里既不够
     用（阶段 8 之后整份源码都是双语的，不止注释行）也没必要。但这里换不成 ——
     存档里那份是**她写的**，生成器吐不出来，只能就着它换掉认得出的那几行。
     换掉的只是注释，程序一个字节的行为都没变。 */
  function swapNoteLines(text, from, to) {
    const map = Object.create(null);
    for (let i = 0; i < from.length && i < to.length; i++) map[from[i]] = to[i];
    return String(text).split('\n').map(function (ln) {
      return Object.prototype.hasOwnProperty.call(map, ln) ? map[ln] : ln;
    }).join('\n');
  }

  /* 把上次写到一半的答案拿回来。返回这条轨道**真正要跑**的那份源码。

     ⚠ **参数对不上就不恢复。** 改一个 N，源码就是另一份了（这一页本来就会说
     「参数改成 N=8：源码按新参数重新生成了，自己改过的内容会被覆盖」）——
     把 N=6 写的答案倒进 N=8 的编辑器只会得到一段对不上号的代码。对不上就
     不恢复、并把原因记下来由提示面板说出口，不猜。 */
  function restoreSrc(pid, tk, g) {
    const st = S[pid];
    if (!exerciseOn() || tk.role === 'contrast' || !g.ex || !g.ex.blanks.length) return g.src;
    const rec = loadSrc(pid);
    if (!rec) { st.restore = { kind: 'none' }; return g.src; }
    const now = paramSig(pid);
    if (rec.paramSig !== now) {
      st.restore = { kind: 'stale', was: rec.paramSig, now: now };
      return g.src;
    }
    /* 存的时候是另一种语言 → 占位注释那几行换成当前语言的。换掉的只是注释，
       程序一个字节的行为都没变。

       ⚠ **这里换不成"整份重新生成"**（切语言那一头的做法，见 retextSources）：
       存档里那份是**她写的**，生成器吐不出来。她自己写的那几行照旧原样留着，
       周围的占位注释跟着界面语言走 —— 也正因为如此，恢复回来的这一份跟
       `pristineSrc` 必然不等，下一次切语言会把它判成"她改过"而原样留着。
       那是对的：它本来就是她的。 */
    const lang = curLang();
    const text = (rec.lang && rec.lang !== lang)
      ? swapNoteLines(rec.text, g.ex.notes[rec.lang], g.ex.notes[lang])
      : rec.text;
    /* ⚠ 存的跟刚生成的**一模一样** → 什么都没恢复，别说恢复了。onChange 那边
       已经挡掉了"原样存一份"，这里再挡一次旧存档：这句话是说给人听的，说错了
       比不说更糟。 */
    if (text === g.src) { st.restore = { kind: 'none' }; return g.src; }
    st.restore = { kind: 'ok' };
    return text;
  }

  /* Task 7/8 的入口：这道题此刻每条轨道上有哪些挖空。正常模式下 blanks 都是空
     数组 —— 那时候源码里的挖空体就是**正在跑的参考答案**，没有"空"可言。 */
  function blanksOf(pid) {
    return tracksOf(pid).map(function (tk) {
      return { file: tk.file, role: tk.role || 'edit',
               blanks: (tk.ex ? tk.ex.blanks : []).map(function (b) {
                 return { id: b.id, level: b.level, startLine: b.startLine };
               }) };
    });
  }
  function blankCount(pid) {
    return blanksOf(pid).reduce(function (n, x) { return n + x.blanks.length; }, 0);
  }

  /* ---------------- 视角：§5.3 的常规条（工具⑤ 的主体**就是**一块棋盘） ----------------

     `1` 正视：沿棋盘法线（z 轴）正对看进去，行列直读。它同时是引擎的初始相机、
     双击回正的家、以及取景框（updateFit）的计算基准——三处必须是同一份数字，
     所以从 HOME_VIEW 展开，不另写一遍。

     `2` 桌面 45°：**仰角是负的，这不是笔误。** `makeCam()` 的 `eye.y = dist·sin(el)`，
     而 board-render 把 rank 0 放在 y 的负侧；`el > 0` 会把人放到黑方那一侧。
     用引擎自己的 makeCam/proj 量过（N=6）：el=−π/4 时 rank 0 落在屏幕 y=+148、
     rank N 落在 y=−111 —— 白方在近处，正是坐在桌前看一副摆好的棋盘的样子。

     `3` 侧视：§5.3 要求「凡是把第三根轴立起来的 tab，必须提供一个沿那根轴的侧视」。
     这一页的第三根轴是深度塔（queens 是递归深度）。同一份实测：
       正视   az=0      el=0      深度塔七层的屏幕坐标全是 (0,0) —— **一层都看不见**
                                  （量的是过原点那一列；离中心越远的格子，透视会
                                  让它的塔顶沿径向外移一点，那是景深，不是层次）
       桌面   az=0      el=−π/4   七层的屏幕 y = 0 −24 −49 −76 −104 −134 −166
       侧视   az=−π/2   el=0      七层的屏幕 x = 0 +33 +66 +99 +132 +165 +198
     侧视把视线摆成垂直于 z 轴，于是深度铺开在屏幕横向、行号仍然是纵向，
     代价是那一列格子压成一条线——那正是「侧视」这个词的意思。
     **az 取 −π/2 而不是 +π/2**：两者都是合法的侧视，但 +π/2 时 z 映射到屏幕的
     −x，深度轴的刻度从右往左数（浏览器里当场看到 “5 4 3 2 …”）；−π/2 让深度
     往右长，与读数方向一致，也与左边调用栈从上往下长同向。 */
  const HOME_VIEW = { az: 0, el: 0, dist: 14, tx: 0, ty: 0, tz: 0 };
  const VIEWS = {
    front: Object.assign({ label: STR.vFront }, HOME_VIEW),
    table: { label: STR.vTable, az: 0, el: -Math.PI / 4, dist: 15, tx: 0, ty: 0, tz: 0 },
    side:  { label: STR.vSide,  az: -Math.PI / 2, el: 0, dist: 15, tx: 0, ty: 0, tz: 0 },
  };

  /* 开关是**显示**开关，与题目无关，所以四条共用一份声明（颜色顺序照旧
     rose → violet → emerald → orange 钉死）。引擎会给每个 tab 各建一组同名
     复选框并互相同步，切 tab 不会丢状态。 */
  const TOGGLES = [
    { key: 'marks',  label: STR.tgMarks,  color: C_TRY,   checked: true },
    { key: 'stale',  label: STR.tgStale,  color: C_OK,    checked: true },
    { key: 'tower',  label: STR.tgTower,  color: C_CUT,   checked: true },
    { key: 'pieces', label: STR.tgPieces, color: C_BACK,  checked: true },
    /* 第五条**不是显示开关**：它换的是跑什么（占位版 vs 参考版），所以颜色
       不取四种状态里的任何一种，用 cyan —— 这一页唯一"不属于四种状态"的颜色。
       默认关：进来先看懂完整实现，想练再打开（§2.9 的"这是自学工具不是考试"）。 */
    { key: 'exercise', label: STR.tgExercise, color: C_STACK, checked: false },
  ];

  /* 视角表：默认就是上面那三条。**一道题可以换掉 `side`**，而这不是装饰性的选项：
     默认的侧视沿世界 x 轴看进去，可并排多块棋盘正是沿 x 轴摆开的，于是「唯一能
     读出深度塔的那个视角」恰好也是「两块盘完全重合的那个视角」。见 tourKnight
     的 sideView。第一条（front）仍然是双击回正的家，键的顺序不动。

     ⚠ **底子必须是 `VIEWS.side` 本身，不是一个手写的 `{tx:0, ty:0, tz:0}`。**
     实测过写成后者的后果：一个只想覆盖一根轴的 `sideView: { az: 0 }` 会得到
     `el` / `dist` 全是 undefined 的相机 —— 引擎的 applyView 把它们补进 tween，
     一帧之后 `cam.el` / `cam.dist` 变成 NaN、`makeCam().eye` 变成 [NaN,NaN,NaN]、
     `proj()` 全是 NaN，画布整块变白**而且没有任何提示**，连按回「正视」都救不回来
     （tween 的起点已经是 NaN 了）。铺在 VIEWS.side 之上，部分覆盖就是部分覆盖。
     非有限的键在这里被丢掉只是为了不产生 NaN；真正把这类声明拦下来的是启动
     那一次的 validateDecl()。 */
  function viewsFor(P) {
    if (!P.sideView) return VIEWS;
    const side = Object.assign({}, VIEWS.side);
    Object.keys(P.sideView).forEach(function (k) {
      const v = P.sideView[k];
      if (typeof v === 'number' && isFinite(v)) side[k] = v;
    });
    return Object.assign({}, VIEWS, { side: side });
  }

  const SCENES = Object.create(null);
  PIDS.forEach(function (pid) {
    const P = PROBLEMS[pid];
    SCENES[pid] = {
      label: P.label, brand: P.brand, tips: P.tips,
      views: viewsFor(P), toggles: TOGGLES,
      /* 这个 tab 显示哪几根滑杆（引擎按 key 显隐）——就是这道题声明的那几根。 */
      params: (P.params || []).map(function (p) { return pkey(pid, p.key); }),
      draw: frameFor(pid),
      readout: function () { return readoutFor(pid); },
    };
  });

  /* ================= ③ 每道题的运行状态 =================
     一道题 = 一份或多份轨迹（`sources` 是数组：tourKnight 一个键持有两份源码，
     两块棋盘并排、同一个游标推两条轨迹）。所以状态一律按**轨道**（track）存，
     哪怕今天只有一条——单条特判会让 Task 5 把这一段重写一遍。 */
  const S = Object.create(null);
  /* `ex` 记的是**这组轨道是在哪个模式下建出来的**（不是开关此刻的位置）——
     pollParams 拿它跟开关比，才知道该说「进练习模式」还是「参数改成 …」。 */
  /* `judge` 是**上一次 Check 的结果**（`{ status, div, herIndex, refIndex, herSrc }`），
     null = 还没判过。它存的是**数据不是文案**：读数区与状态牌每次都从它重新渲染，
     所以切语言那一下判定结论也跟着换语言，不需要重跑任何东西。 */
  /* `prog` 是**这道题每个挖空的进度**（`{ attempts, hintLevel, solvedAt }`，按挖空
     id 索引），建轨道时从 localStorage 一次读齐、之后渲染只读内存，改动时同时
     写回。`restore` 记的是这一次重建**有没有把上次写到一半的答案拿回来**、
     没拿回来是为什么（提示面板顶上那句话读它）。 */
  PIDS.forEach(function (pid) {
    S[pid] = { tracks: [], sig: null, hookErr: null, ex: false, judge: null,
               prog: Object.create(null), restore: null };
  });

  let uiTab = null;             // 此刻显示的是哪道题
  let activeTrack = 0;          // 编辑器/调试器挂在这道题的第几条轨道上
  /* 重建**搬动过几次** activeTrack。修复轮 1 加的：一次无条件的重置让「换个
     参数就把单步弹回左栏」溜进了正常模式，而报告把它判成了「行为不变」。
     一个能被读出来的计数器让这件事从此可以被证伪 —— 正常模式下换参数它必须
     一直是 0，进练习模式（tourKnight 的 0 号轨道变成只读对照）时它必须涨 1。 */
  let activeMovedByRebuild = 0;
  let statusKind = 'idle';      // idle | ok | bad | judge | busy | boot —— 切语言时按它重画
  let jumpNote = null;          // 点棋盘反向定位之后那一句话
  /* 最近一次 relabel 里 retextSources 的结果 `{swapped, kept, failed}`。状态牌上
     那句「你改过的那一份没换」认它，探针也报它。 */
  let lastRetext = null;

  /* ⚠ `bootErr` / `statusLocked` **在这里声明**，不在下面「启动」那一节 ——
     `setStatus` / `attachEditor` / `frameFor` 都要读它们，而那三个函数写在启动
     之前。写成 `let` 又放在文件末尾，就是一个 TDZ 陷阱等着下一次重排。

     引导失败必须是**粘住的**：一旦 `statusLocked` 立起来，setStatus 就再也写不进
     状态牌了。这条锁不是洁癖 —— 它挡掉的是一条真实走过的路：引导失败 → 第一帧
     `setUiTab → ensureBuilt` → 源码生成抛在一个被吞掉的地方 → 空源码「成功」跑出
     0 步 → `ed.setValue('')` 的 onChange 把 Run 重新点亮 → 绿色的
     「Ran · 0 steps」把红字盖掉。破页于是长得跟正常页一模一样。 */
  let bootErr = null;
  /* 引导失败有两个来源，报错的口吻不一样：'algos' 是算法源码生成器没起来，
     'decl' 是这一页自己的题目声明写错了。 */
  let bootErrKind = 'algos';
  let statusLocked = false;

  function curP() { return uiTab ? PROBLEMS[uiTab] : null; }
  function curS() { return uiTab ? S[uiTab] : null; }
  function curTrack() {
    const st = curS();
    return st && st.tracks[activeTrack] ? st.tracks[activeTrack] : null;
  }
  function tracksOf(pid) { return (pid && S[pid]) ? S[pid].tracks : []; }

  /* ---------------- 声明式钩子抛了：**说出来，不要吞成默认值** ----------------

     `board()` / `readout()` / `zOf()` 这三个钩子原先各自被一个 catch 吞掉，退回
     一个看起来正常的默认值：静默的 8×8、空读数、少画一层塔。对一个论点就是
     「绝不静默失败」的页面，那是错的默认——而 tourKnight 正要往这个注册表里
     再接两条轨道，第三道题（Task 6）还会再接一条。

     怎么算「响亮」而又不把整页炸掉（这三处都在每帧的绘制路径上，直接抛会变成
     每秒 60 次异常）：把消息记在 `S[pid].hookErr` 上，① 写一次红色状态牌、
     ② 读数区每帧都挂一条黄字、③ 探针里能读到。按消息去重，所以每帧调用只写
     一次状态牌。 */
  function hookFail(pid, what, e) {
    const st = pid ? S[pid] : null;
    if (!st) return;
    const msg = (e && e.message) ? e.message : String(e);
    const full = what + '(): ' + msg;
    if (st.hookErr === full) return;             // 同一条错误不重复刷状态牌
    st.hookErr = full;
    statusKind = 'bad';
    setStatus(esc(t(STR.hookFail).replace('%W', what) + msg), 'bad');
  }

  /* 跑一条轨道。**同步且慢**：N=8 要跑 156,772 步（node 实测 ~203 ms）。
     调用方负责先把「正在跑」画出来。 */
  function runTrack(tk, src, keepBreakpoints) {
    tk.src = src;
    tk.err = null;
    let res;
    try {
      res = I.run(src, { host: {} });
    } catch (e) {
      tk.err = { category: e.category || 'runtime', line: e.line == null ? null : e.line, message: e.message };
      res = { result: undefined, trace: [] };
    }
    tk.res = res;
    const next = D.create(res.trace);
    if (keepBreakpoints && tk.cur) next.breakpoints = tk.cur.breakpoints;
    tk.cur = next;
    tk.bcache = null;
    /* 棋盘事件计数在这里就算好，不留到绘制循环里去算：一趟 200,000 步的轨迹要
       扫一遍才数得出来（node 实测个位数毫秒），而每帧预算只有 4 ms。调用方已经
       把这整段包在 withBusy 里了，多这一趟正好搭顺风车。 */
    trackOps(tk);
    return tk;
  }

  /* 一条轨道整趟跑下来在棋盘上干了些什么：mark 按四种 kind 分别计数，place / clear
     各一个数。**读数与探针都读它**，而 tourKnight 的 3×5 那一课（两边逐项相同、
     只有步数不同）就是拿这几个数说话的。
     按 trace 对象的身份缓存：Run / 换参数会换一条新 trace，缓存自然失效。 */
  function trackOps(tk) {
    const trace = tk.res ? tk.res.trace : [];
    if (tk.opsCache && tk.opsTrace === trace) return tk.opsCache;
    const o = { try: 0, ok: 0, cut: 0, back: 0, mark: 0, place: 0, clear: 0 };
    for (let k = 0; k < trace.length; k++) {
      const ops = trace[k].boardOps;
      for (let m = 0; m < ops.length; m++) {
        const op = ops[m];
        o[op.kind] = (o[op.kind] || 0) + 1;
        if (op.kind === 'mark') o[op.to] = (o[op.to] || 0) + 1;
      }
    }
    tk.opsTrace = trace;
    tk.opsCache = o;
    return o;
  }

  /* 生成一条轨道的源码。**`P.source()` 的每一个调用点都得走这里** —— 它是
     这一页唯一的源码入口，Task 5/6 还要再接三份源码（tour-dfs / tour-warnsdorff /
     knight-path）走同一条通道。

     ⚠ 以前这条通道不会报错：抛出被记进一个没有任何读者的 `S[pid].err`，`src`
     留成 `''`，而 `I.run('')` **不抛异常**、返回 `{result: undefined, trace: []}`
     —— 于是「源码生成失败」在界面上长得跟「运行成功、零步」一模一样。现在它
     变成这条轨道自己的 `tk.err`（showProblemStatus / relabel / 探针都读它——
       showProblemStatus 是**所有轨道一起看**的那一份，见它头上的注释）。

     ⚠ **第四个参数 `lang` 是必填的**（规格 §1.6）：七份生成器都会在缺它时当场抛
     「少了 lang」。别在这里补一个默认值把它压下去 —— 那样漏了转发的那道题会
     悄悄退回中文注释，而屏幕上没有一句话说明为什么。现在它走 catch，红字写在
     它自己那块编辑器上方。 */
  function genSource(P, pv, file) {
    try {
      return { src: P.source(pv, MODS, file, curLang()), err: null };
    } catch (e) {
      return { src: '', err: { category: 'source', file: file, line: null,
                               message: (e && e.message) ? e.message : String(e) } };
    }
  }

  /* 生成一条轨道**真正要用的**源码：先 genSource 拿到原文，再按当前模式把
     `// >>> BLANK` 指令处理掉。两种模式读的是同一份原文：

       正常模式  → `parse().clean`        只剥掉两行指令，挖空体（= 参考答案）原样跑
       练习模式  → `parse().placeholder`  挖空体换成占位注释 + fill

     ⚠ **正常模式那一份不是可选的收尾工作。** 原文里就嵌着指令行 —— 今天打开
     queens，`function safe` 里摆着两行五百来字符的
     `// >>> BLANK id=… fill="…" hint="…" hintEn="…"`：给解析器看的元数据，
     而且把占位实现和提示一起写在她眼前。剥它必须走 exercise.js，页面不许自己
     写一条正则：同一段"什么算指令行"的知识分成两份，迟早分岔。

     `parse()` 抛（指令写坏了）与 `source()` 抛是同一类事 —— 源码没交出来，
     所以复用 'source' 这个 category：编辑器空着，红字说明白为什么。

     `wantClean` 是 Check 用的那一个出口：**参考版本要的正是正常模式那一份**
     （`clean` —— 挖空体原样，那就是参考答案），哪怕此刻开着练习模式。写成一个
     显式参数而不是在调用点自己拼一次 `Exercise.parse(...).clean`：那样页面上就
     有了第二处知道"参考答案从哪儿来"的代码，两处迟早分岔。 */
  function prepareSource(P, pv, file, role, wantClean) {
    const g = genSource(P, pv, file);
    if (g.err) return { src: '', ex: null, err: g.err };
    let parsed;
    try { parsed = Exercise.parse(g.src, curLang()); }
    catch (e) {
      return { src: '', ex: null, err: { category: 'source', file: file, line: null,
        message: '挖空指令（// >>> BLANK）解析失败：' + ((e && e.message) ? e.message : String(e)) } };
    }
    /* 只读对照那一份走 clean：它摆在旁边是给人 diff 的，本来就没有空要她填。 */
    const wantBlanks = !wantClean && exerciseOn() && role !== 'contrast';
    return {
      src: wantBlanks ? parsed.placeholder : parsed.clean,
      ex: wantBlanks ? exStateOf(parsed) : null,
      err: null,
    };
  }

  /* 一条轨道刚被生成器喂过：记下**原文**与**生成它用的语言**。

     这两个字段是切语言（retextSources）唯一的判据，所以它们必须在**每一个**
     把生成结果放进轨道的地方各写一次 —— 今天是三处：buildProblem、
     「还原为原始版本」、attachRefTrack。写成一个函数而不是三处各写两行赋值，
     是因为漏写的后果是沉默的：漏的那一处会让 `tk.pristineSrc` 停在上一份上，
     于是切语言时那条轨道被判成"她改过"，永远不换语言，而且一个字都不说。

     ⚠ `tk.src` 不一定等于 `src`：练习模式下 buildProblem 跑的是 restoreSrc 交出来
     的那一份（她上次写到一半的答案）。**pristineSrc 记的是生成器吐出来的那一份**，
     不是编辑器里的那一份 —— 两者不等正是"她改过"的定义。

     生成失败（g.err）时 `lang` 记成 null，不是当前语言：那条轨道手上根本没有
     "某种语言的源码"，下一次切语言应当再试一次，而不是以为它已经是对的。 */
  function markGenerated(tk, g) {
    tk.pristineSrc = g.src;
    tk.lang = g.err ? null : curLang();
    return g.src;
  }

  /* 活动轨道只能落在可编辑的那一条上：练习模式下的只读对照排在**左边**
     （下标 0），而 `activeTrack` 默认就是 0 —— 不挪的话 F10/F9/Run 全落在
     一块永远不动的死源码上，而且看起来像是工具坏了。 */
  function firstEditable(pid) {
    const tks = tracksOf(pid);
    for (let k = 0; k < tks.length; k++) if (isEdit(tks[k])) return k;
    return 0;
  }
  function isContrast(tk) { return !!tk && tk.role === 'contrast'; }
  /* 判定时接上去的那条参考轨道（见 sourcesFor 头上那段）。它**跑**、有棋盘、
     有自己的游标，但没有编辑器槽位、不能被选中、不跟着她的游标走。 */
  function isReference(tk) { return !!tk && tk.role === 'reference'; }
  /* 「她那几条」：可编辑、会跑、共用一个游标的那些。三个判据里只有这一个是
     肯定式的 —— 新加一种角色时，忘了改的地方会退到"不是她的"，而不是"是她的"。

     ⚠ 这句话从前是**假的**：实现原本写成 `role !== 'contrast' && role !== 'reference'`，
     于是新增一种角色 `'x'` 会返回 true，退到"是她的"，跟注释承诺的方向正好反过来
     （`validateDecl` 的 EX_ROLES 白名单挡住了声明侧，所以那时候还没出 bug，但
     `isEdit` 正是 syncTracks 里"参考轨道不许被拖成共用游标"的唯一守卫 —— §2.9
     阶段 6 第 4 条）。同一份文件里 EX_ROLES 那条报错文案早就把真相说了出来
     （"认不出的角色会被当成可编辑轨道跑起来"），两段话打了架。
     改成肯定式是安全的：每条轨道都显式带 role —— sourcesFor 给 'edit'、声明给
     'edit'/'contrast'、attachRefTrack 给 'reference'，没有第四种来路。 */
  function isEdit(tk) { return !!tk && tk.role === 'edit'; }

  /* 按当前参数把一道题整个重建。参数没变就什么也不做（每帧都会问一次）。 */
  function buildProblem(pid, force) {
    const P = PROBLEMS[pid], st = S[pid], sig = buildSig(pid);
    if (!force && st.sig === sig && st.tracks.length) return false;
    st.hookErr = null;                 // 上一组参数下的钩子错误不该跟着新参数走
    /* 上一次 Check 的结论跟着这组参数/这个模式一起作废 —— 换了 N 之后"你在第 76
       步跟参考分道扬镳"讲的是另一份程序。参考轨道也一起没：下面这行 map 的长度
       是 `files.length`，接在末尾的那条参考轨道自然被截掉（它是 st.tracks 的最后
       一项，这是 attachRefTrack 的不变量）。 */
    st.judge = null;
    st.restore = null;                 // 这一次重建有没有恢复存档，下面重新答一遍
    const pv = paramsOf(pid);
    const files = sourcesFor(P);
    st.tracks = files.map(function (entry, k) {
      const old = st.tracks[k];
      const tk = old || { index: k, file: entry.file, src: '', pristineSrc: '', lang: null,
                          res: null, cur: D.create([]), err: null, bcache: null };
      tk.file = entry.file;
      tk.role = entry.role;
      const g = prepareSource(P, pv, entry.file, entry.role);
      tk.ex = g.ex;
      markGenerated(tk, g);
      if (entry.role === 'contrast') {
        /* **只读对照不跑**：没有轨迹、没有棋盘、没有游标（§2.9 阶段 6 第 1 条）。
           4×5 上那份朴素 DFS 是 200,000 步的截断轨迹 —— 跑它只为摆在旁边给人
           diff，等于每次进练习模式白付半秒。缓存一并清掉：这条轨道可能上一轮
           还是跑着的。 */
        tk.src = g.src;
        tk.res = null;
        tk.cur = D.create([]);
        tk.bcache = null;
        tk.opsCache = null;
        tk.opsTrace = null;
        tk.err = g.err;
        return tk;
      }
      /* runTrack 开头会把 tk.err 清成 null，所以生成错误只能在它之后盖上去。
         ⚠ 跑的是 `restoreSrc` 交出来的那一份：她上次写到一半的答案（存档里
         有、而且是按同一组参数写的）优先于刚生成的占位版。恢复出来的东西可能
         有语法错 —— 那也照原样跑、照原样报，那是她的代码，不该被悄悄换掉。 */
      const done = runTrack(tk, restoreSrc(pid, tk, g), true);
      if (g.err) done.err = g.err;
      return done;
    });
    /* 每个挖空的进度一次读齐（提示级别 / 尝试次数 / 判对时间），之后渲染只读
       内存这一份。正常模式下不读 —— 那时候根本没有"空"可言。 */
    st.prog = Object.create(null);
    if (exerciseOn()) {
      st.tracks.forEach(function (tk) {
        if (!isEdit(tk) || !tk.ex) return;
        tk.ex.blanks.forEach(function (b) { st.prog[b.id] = loadBlank(pid, b.id); });
      });
    }
    st.ex = exerciseOn();
    st.sig = sig;
    layoutTracks(pid);
    /* ⚠ **只在活动轨道真的没法用了的时候才挪它。**
       这一行原先是无条件的 `activeTrack = firstEditable(pid)`，而 buildProblem
       每换一次参数就跑一遍 —— 实测（base 6db3472 vs HEAD fe765db 同一份脚本
       对跑）：在 tourKnight 上把单步/断点/Run 点到右栏的 Warnsdorff，**只要动
       一下盘面滑杆就被弹回左栏的朴素 DFS，而且一个字都不说**。阶段 5 的
       buildProblem 根本不碰 activeTrack，那是一处本轮引入的正常模式回归。
       该挪的只有两种情形：轨道数变少了（下标悬空），或者它此刻落在只读对照上
       （进练习模式时 tourKnight 的 0 号轨道就变成了对照）。
       动没动过要能被断言，所以顺手记一次 —— 正常模式下换参数它必须是 0。 */
    if (pid === uiTab && !isEdit(st.tracks[activeTrack])) {
      const next = firstEditable(pid);
      if (next !== activeTrack) { activeTrack = next; activeMovedByRebuild++; }
    }
    return true;
  }

  /* ---------------- 棋盘布局：一道题的每条轨道各一块，横向并排 ----------------
     `BoardRender.layout()` 把棋盘钉在原点上，没有 origin 参数，所以并排靠一层
     只加一个 dx 的包装：squareCenter / squareCorners 两个出口都平移，drawBoard、
     drawCoordLabels、pickSquare 读的都是这两个出口，于是三处一起跟着走。
     一条轨道时 dx = 0，与不包装逐像素相同。 */
  function shiftLayout(L, dx) {
    if (!dx) return L;
    return {
      files: L.files, ranks: L.ranks, cell: L.cell, z: L.z, w: L.w, h: L.h,
      squareCenter: function (f, r) { const p = L.squareCenter(f, r); return [p[0] + dx, p[1], p[2]]; },
      squareCorners: function (f, r) {
        return L.squareCorners(f, r).map(function (p) { return [p[0] + dx, p[1], p[2]]; });
      },
    };
  }
  const BOARD_GAP = 1.6;        // 并排两块棋盘之间留几格宽
  /* 把「board() 交回来的是个什么东西」说清楚。**不用 JSON.stringify**：
     `{files: undefined}` 会被它序列化成 `{}`，而「忘了写 return」正是要一眼
     认出来的那一种，不能让它长得像「返回了个空对象」。 */
  function describeBoardSpec(spec) {
    if (spec === undefined) return 'undefined —— board() 忘了写 return？';
    if (spec === null) return 'null';
    if (typeof spec !== 'object') return typeof spec + ' ' + String(spec);
    return 'files=' + String(spec.files) + ' ranks=' + String(spec.ranks);
  }
  function layoutTracks(pid) {
    const P = PROBLEMS[pid], st = S[pid], pv = paramsOf(pid);
    let spec = null, threw = false;
    /* `P.board()` 交不出一块棋盘 → **不画棋盘**，并且说出来。以前这里退回一个
       静默的 8×8：一块尺寸完全错误、却长得像模像样的棋盘，是这一页能出的最坏
       的一种错——她会拿着它去数格子。`layout` 留 null，drawProblem / sceneBox /
       onBoardClick 三处都已经跳过 null，于是画面上什么都没有，红色状态牌在说为什么。

       ⚠ **「有没有报过」的判据是 `threw`，不是 `spec` 真不真。** 这两件事写成
       一件的后果实测过：`board()` 忘了写 `return`（Task 6 接 knightPath 时活生生
       的风险）→ 抛没抛都没有、`spec` 是 undefined → `if (spec)` 假 → **一句话都
       不说**，画布全白、状态牌绿的、读数区照常、探针 `hookError: null`。
       正是这段注释上面声称在防的那种失败，被这一个条件亲手放了进来。 */
    try { spec = P.board(pv); } catch (e) { threw = true; hookFail(pid, 'board', e); }
    if (!spec || !isFinite(spec.files) || !isFinite(spec.ranks) ||
        spec.files < 1 || spec.ranks < 1) {
      if (!threw) hookFail(pid, 'board', new Error('没有交出一块能用的棋盘：' + describeBoardSpec(spec)));
      st.tracks.forEach(function (tk) { tk.layout = null; tk.blocked = null; });
      return;
    }
    const files = Math.max(1, Math.round(spec.files));
    const ranks = Math.max(1, Math.round(spec.ranks));
    /* ---- `blocked`：挖掉的格子，**盘面形状的一部分**，所以在这里、跟 files /
       ranks 同一段里判，不新开一类。

       ⚠ **缺省必须与今天逐字节相同。** 五题里三题（queens / tourKnight /
       knightPath）的 `board()` 根本不返回这个字段 → 下面 `walls` 是 null →
       drawProblem 传给 BoardRender 的 `mask` 是 null → drawBoard 里那句
       `if (mask && mask(f,r) === false) continue;` 一次都不会真，格子循环走的
       是原来那条路。改动前后这三题的空盘画布哈希逐字节相同（见 task-3a 报告）。

       给了、但给坏了 → **跟"交不出 files/ranks"同样处理**：不画棋盘 + 说出来。
       一块少了几堵墙、却长得像模像样的棋盘，和一块尺寸错了的棋盘是同一种错——
       她会拿着它去数格子，而这道题的全部内容就是那些看不见的格子。 */
    let walls = null;
    if (spec.blocked !== undefined && spec.blocked !== null) {
      const cells = files * ranks;
      let bad = null;
      if (!Array.isArray(spec.blocked)) {
        bad = 'blocked 不是数组：' + (typeof spec.blocked) + ' ' + String(spec.blocked);
      } else {
        for (let k = 0; k < spec.blocked.length; k++) {
          const v = spec.blocked[k];
          if (typeof v !== 'number' || !isFinite(v) || Math.floor(v) !== v || v < 0 || v >= cells) {
            bad = 'blocked[' + k + '] 不是 0…' + (cells - 1) + ' 之间的格号：' + String(v);
            break;
          }
        }
      }
      if (bad) {
        hookFail(pid, 'board', new Error(bad));
        st.tracks.forEach(function (tk) { tk.layout = null; tk.blocked = null; });
        return;
      }
      walls = spec.blocked.length ? spec.blocked.slice() : null;
    }
    /* ⚠ 摆几块棋盘看的是**跑着的**轨道数，不是 `tracks.length` —— 只读对照
       没有棋盘。写成后者的后果是练习模式下那一块唯一的棋盘按"两块"的间距
       算偏移，整块盘偏到画面一侧去，而且什么都不报。 */
    const live = st.tracks.filter(function (tk) { return !isContrast(tk); });
    const n = Math.max(1, live.length);
    const pitch = files + BOARD_GAP;
    let slot = 0;
    st.tracks.forEach(function (tk) {
      if (isContrast(tk)) { tk.layout = null; tk.blocked = null; return; }
      const base = BR.layout({ files: files, ranks: ranks, cell: 1, z: 0 });
      tk.layout = shiftLayout(base, (slot - (n - 1) / 2) * pitch);
      /* 墙跟着轨道走而不是塞进 layout：`shiftLayout` 的 `if (!dx) return L;` 会
         原样交回 BR.layout 造的那个对象，往里塞字段就成了"有时在包装上、有时在
         引擎的对象上"两种形状。挂在轨道上只有一种形状，并排两块盘也各自有一份。 */
      tk.blocked = walls;
      slot++;
    });
  }

  /* ================= 棋盘状态：标记 + 棋子 + **写下它时的深度** =================

     `Debugger.boardState(cur)` 已经给了 marks / pieces，但它不带深度，而这一页
     恰恰需要深度：`'cut'` 标记**故意**不在回溯时擦掉（源码里每个节点擦一整行要
     多花 18.7% 的步数，N=8 会顶到 186,000、只剩 7% 余量；`mark` 之后立刻 `clear`
     要多花 8.7%，而且「这一整行都被攻击」的画面只闪一步就没了）。裁定是**留给
     显示层解决**：interp.js 给每条 Step 都记了 `depth`，把每个标记记成「它是在
     哪个深度写下的」，再把深度大于当前 Step.depth 的压暗即可 —— 零步数成本、
     通用、别的题照用。

     这里比那条规则**多判一件事**，理由是量出来的：光看深度，「上一个同深度的
     兄弟帧留下的标记」会被当成此刻有效的。N=6 全程平均下来，只按深度判有 18.26
     个标记是亮的，而真正属于当前这条调用链的只有 10.95 个；最坏的一步有 19 个
     标记在冒充「此刻」。所以再记一个「写下它时是第几步」，跟**当前那一层帧是
     从第几步进来的**（frameOp === 'push' 的那一步）比一比：比帧还早的，是上一个
     兄弟留下的，同样压暗。两条判据都只用 interp.js 记下的通用字段，仍然不需要
     知道算法在做什么。

     实现是**增量**的：游标往前走就接着往下叠（播放的常态），往回走才从 0 重建。
     N=8 的轨迹有 156,772 步，每帧从头重放一遍是 4 ms 预算里放不下的。 */
  function boardAt(tk) {
    const cur = tk.cur, trace = cur.trace, i = cur.i;
    let c = tk.bcache;
    if (!c || c.trace !== trace || c.i > i) {
      c = tk.bcache = { trace: trace, i: -1, marks: Object.create(null),
                        pieces: Object.create(null), entry: [], curDepth: 0 };
    }
    for (let k = c.i + 1; k <= i && k < trace.length; k++) {
      const s = trace[k];
      /* 入帧步的 depth 就是**新的**深度（interp.js 的 stepBoundary 在
         env.callDepth.n 递增之后打包），所以 entry[depth] 直接这么记。 */
      if (s.frameOp === 'push') c.entry[s.depth] = k;
      const ops = s.boardOps;
      for (let m = 0; m < ops.length; m++) {
        const op = ops[m];
        if (op.kind === 'mark') c.marks[op.sq] = { kind: op.to, depth: s.depth, step: k };
        else if (op.kind === 'place') c.pieces[op.sq] = op.to;
        else if (op.kind === 'clear') { delete c.marks[op.sq]; delete c.pieces[op.sq]; }
      }
      c.i = k;
    }
    const cs = trace[Math.min(i, trace.length - 1)];
    c.curDepth = cs ? cs.depth : 0;
    return c;
  }
  function isStale(m, c) {
    if (m.depth > c.curDepth) return true;
    const e = c.entry[m.depth];
    return e != null && m.step < e;
  }
  function markCounts(c) {
    let bright = 0, stale = 0;
    for (const key in c.marks) { if (isStale(c.marks[key], c)) stale++; else bright++; }
    return { bright: bright, stale: stale, total: bright + stale };
  }

  /* 格子编号 → (file, rank)。约定是 `sq = rank * files + file`（core/algos/queens.js
     的文件头写死了它，并且与 BoardRender.squareCenter(file, rank)、chess-core 的
     SQ(file, rank) 同向：rank 0 在最下面一行）。落在盘外的编号返回 null——
     由调用方计数并在读数里点名，不静默丢弃。 */
  function sqToFR(sq, L) {
    if (typeof sq !== 'number' && typeof sq !== 'string') return null;
    const n = Number(sq);
    if (!isFinite(n) || Math.floor(n) !== n || n < 0) return null;
    const f = n % L.files, r = (n - f) / L.files;
    if (r < 0 || r >= L.ranks) return null;
    return { f: f, r: r };
  }

  /* ================= 取景框（照抄 3b / 阶段 4 验收过的那一套） =================

     canvas 是全屏的，但真正看得见的只有「整窗减去左边代码面板、再减去右边参数
     面板」那一块。只平移不缩放等于假设剩下那块地方永远够大，而分隔条的存在本身
     就在推翻这个假设。所以做一个完整的取景变换 p → s·p + t：s 让场景的投影包围盒
     装进可见区，t 让它居中。包围盒按**回正视角**算、且只在可见区/棋盘尺寸变化时
     重算（不是每帧、也不跟活相机）：按活相机每帧重算会让旋转变成「棋盘被自动
     追着摆正」。 */
  const FIT_MARGIN = 0.9;
  /* 可见区底部留给深度轴名字的高度（drawZAxisName 写在这一条里）。声明在这里而
     不是挨着 drawZAxisName：updateFit() 在源码里排得更早，`const` 的 TDZ 只在
     运行期才放行，挨着写就等于赌「谁先被调用」。 */
  const Z_NAME_BAND = 20;
  let fit = { s: 1, tx: 0, ty: 0 };

  /* ---- 分栏宽度：夹在一处，两个调用点（拖拽与 resize） ----
     上限有两条：别超过窗口的 78%，且右边还压着一块参数面板，要给画布留
     CANVAS_MIN。下限 300 优先——窄窗口上两个上限都可能比它小。
     codeW === null 表示**还没有人拖过**，宽度归 CSS 的 `46vw` 管（相对单位，
     本来就跟着窗口走）；一旦拖过就变成像素值，从此每次 resize 都要重夹一遍。 */
  const CANVAS_MIN = 380;
  let codeW = null;

  function panelIsRight() {
    return document.getElementById('panel').getBoundingClientRect().left > window.innerWidth * 0.5;
  }
  function rightEdge() {
    const pr = document.getElementById('panel').getBoundingClientRect();
    return panelIsRight() ? pr.left - 10 : window.innerWidth;
  }
  function bottomEdge() {
    const pr = document.getElementById('panel').getBoundingClientRect();
    return panelIsRight() ? window.innerHeight - 26 : Math.max(1, pr.top - 10);
  }
  function clampCodeWidth(px2) {
    const cap = Math.min(window.innerWidth * 0.78, rightEdge() - CANVAS_MIN);
    return Math.max(300, Math.min(cap, px2));
  }
  function applyCodeWidth(px2) {
    codeW = clampCodeWidth(px2);
    document.documentElement.style.setProperty('--code-w', codeW + 'px');
  }
  function availRect() {
    const folded = document.body.classList.contains('folded');
    const x0 = folded ? 0 : document.getElementById('split').getBoundingClientRect().width;
    const x1 = rightEdge();
    return { x0: x0, y0: 46, w: Math.max(1, x1 - x0), h: Math.max(1, bottomEdge() - 46) };
  }

  /* 借引擎的 makeCam 算回正视角的相机：临时换、算完换回。不自己再抄一遍
     球坐标→基向量的公式（本仓库反复吃过「同一段数学两处各写一份」的亏）。 */
  function homeCam() {
    const live = E.cam, saved = {};
    for (const k in HOME_VIEW) { saved[k] = live[k]; live[k] = HOME_VIEW[k]; }
    const C = E.makeCam();
    for (const k in saved) live[k] = saved[k];
    return C;
  }
  /* 场景包围盒：每块棋盘的四角（外扩到坐标标签的锚点带）在 z=0 与塔顶两层。
     棋子以格心为底座往上长，最远一排的后冠会探出棋盘上沿，所以再按像素补一笔。 */
  function sceneBox(C) {
    const st = curS();
    if (!st || !st.tracks.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, ok = false;
    const zTop = towerTopZ();
    for (let k = 0; k < st.tracks.length; k++) {
      const L = st.tracks[k].layout;
      if (!L) continue;
      const o = L.squareCorners(0, 0)[0];
      const pad = BR.COORD_LABEL_OFFSET * L.cell;
      const xs = [o[0] - pad, o[0] + L.w + pad], ys = [o[1] - pad, o[1] + L.h + pad];
      /* ⚠ **每块棋盘的内边距要算在它自己的盒子上，再并进总盒子。** 这四行以前直接
         改共用的累加器：一块棋盘时无害，两块并排时 `y0 -= tall; x0 -= lab;` 会在
         第二轮再减一次——总盒子于是往左往下各多出一整份边距，取景框把画面推偏。
         （x1 / y1 是 max，重复加同样是错的，只是方向相反。） */
      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let z = 0; z < 2; z++) {
        const p = E.proj(C, [xs[a], ys[b], z ? zTop : L.z]);
        if (!p) return null;              // 近裁剪掉了：这一帧算不出，沿用上一次
        bx0 = Math.min(bx0, p[0]); bx1 = Math.max(bx1, p[0]);
        by0 = Math.min(by0, p[1]); by1 = Math.max(by1, p[1]);
      }
      const lab = BR.coordLabelSize(C, E, L);
      let tall = 0;
      for (let f = 0; f < L.files; f++) {
        tall = Math.max(tall, BR.pieceAutoScale(C, E, L.squareCenter(f, L.ranks - 1), L.cell) || 0);
      }
      by0 -= tall; bx0 -= lab; bx1 += lab; by1 += lab * 0.9;
      ok = true;
      x0 = Math.min(x0, bx0); x1 = Math.max(x1, bx1);
      y0 = Math.min(y0, by0); y1 = Math.max(y1, by1);
    }
    return ok ? { x0: x0, y0: y0, x1: x1, y1: y1 } : null;
  }
  function updateFit() {
    const box = sceneBox(homeCam());
    if (!box) return;                     // 算不出就不动，绝不退化成 1:1 把画面跳一下
    const bw = Math.max(1, box.x1 - box.x0), bh = Math.max(1, box.y1 - box.y0);
    const r = availRect();
    /* 顶部留给深度轴名字的那一条（drawZAxisName）。取景框把它当成不存在的区域，
       于是那行字永远不会压在棋盘上——不是「看起来没压上」，是它根本不在盒子里。
       **不看「深度塔」开关**：塔关掉时那行字确实不画，但按开关扣就得让开关去调
       updateFit()，否则「先算好取景框、再打开塔」那一下棋盘正好压上来——几十
       像素的空档换掉一个只在特定顺序下才犯的错，划算。 */
    const band = zNameBand(r);
    r.y0 += band;
    r.h = Math.max(1, r.h - band);
    const s = Math.min((r.w * FIT_MARGIN) / bw, (r.h * FIT_MARGIN) / bh);
    fit = {
      s: s,
      tx: r.x0 + r.w / 2 - s * (box.x0 + box.x1) / 2,
      ty: r.y0 + r.h / 2 - s * (box.y0 + box.y1) / 2,
    };
  }

  /* ================= 画 ================= */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  /* px(v)：「我要屏幕上的 v 像素」。所有绘制都在 `ctx.scale(fit.s, fit.s)` 之内，
     写下的每个长度都会再乘一次 fit.s。对几何那是对的（取景缩小时整幅画一起缩）；
     **对文字不对**——字号有一条与取景缩放无关的绝对可读下限。工具④ 实测过
     fit.s 低到 0.24，写死的 11px 会渲染成 2.6 像素。 */
  function px(v) { return v / (fit.s > 0 ? fit.s : 1); }

  /* 塔顶在 z 的哪儿：取当前题目所有轨道里最高的一层，至少一层，好让取景框
     在还没跑起来的时候也有个确定的盒子。 */
  let towerTop = 1;
  function towerTopZ() { return Math.max(1, towerTop) * spanZOf(curP()); }

  function fillSquare(C, L, f, r, color, alpha, outline) {
    const cs = L.squareCorners(f, r), pts = [];
    for (let k = 0; k < 4; k++) {
      const p = E.proj(C, cs[k]);
      if (!p) return;
      pts.push(p);
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fill();
    if (outline) {
      ctx.globalAlpha = Math.min(1, alpha + 0.4);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.1, px(1));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------------- 墙：挖掉的格子 ----------------
     两件事，都在这一页里，`core/board-render.js` 一行没动：

     ① **不画成棋盘格** —— 走 `BoardRender.drawBoard` 现成的 `spec.mask`
        （`mask(f,r) === false` 的格子跳过）。没有墙时 `wallMask` 交回 null，
        drawBoard 里的 `spec.mask || null` 于是仍是 null，那一句 `if (mask && …)`
        一次都不会真：**这就是"缺省与今天逐字节相同"的全部机制**。
     ② **画成一堵墙** —— 挖成一个洞跟"这里是墙"不是一回事：洞在画面上只是"没有
        格子"，而她要看见的是"这里过不去"。所以补一层 45° 斜纹，用的是右边那张
        König 小图里同一套值（底色 #0b1220、纹色 rgba(159,176,200,.30)、1.5px 线
        / 5px 间距）—— 同一块盘的两处画法必须一致，否则她得先证明那两张图说的是
        同一件事。斜纹画在 drawBoard **之前**：外框与坐标标签因此仍盖在最上层。

     斜纹按**屏幕像素**排（px()），不按世界坐标：格子是投影出来的四边形，透视下
     远近格宽差好几倍，按世界坐标排会让远处那几堵墙糊成一片实色。 */
  const WALL_FILL = '#0b1220';
  const WALL_HATCH = 'rgba(159,176,200,0.30)';
  function wallMask(L, blocked) {
    if (!blocked || !blocked.length) return null;
    const set = Object.create(null);
    for (let k = 0; k < blocked.length; k++) set[blocked[k]] = 1;
    return function (f, r) { return set[r * L.files + f] ? false : true; };
  }
  function drawWalls(C, L, blocked, tally) {
    if (!blocked || !blocked.length) return;
    const step = px(5), lw = px(1.5);
    for (let k = 0; k < blocked.length; k++) {
      const fr = sqToFR(blocked[k], L);
      if (!fr) { tally.offBoard++; continue; }
      const cs = L.squareCorners(fr.f, fr.r), pts = [];
      let clipped = false;
      for (let m = 0; m < 4; m++) {
        const p = E.proj(C, cs[m]);
        if (!p) { clipped = true; break; }
        pts.push(p);
      }
      if (clipped) continue;                       // 近裁剪掉的格不画，与 drawBoard 同规矩
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let m = 0; m < 4; m++) {
        x0 = Math.min(x0, pts[m][0]); x1 = Math.max(x1, pts[m][0]);
        y0 = Math.min(y0, pts[m][1]); y1 = Math.max(y1, pts[m][1]);
      }
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let m = 1; m < 4; m++) ctx.lineTo(pts[m][0], pts[m][1]);
      ctx.closePath();
      ctx.fillStyle = WALL_FILL;
      ctx.fill();
      ctx.clip();
      ctx.strokeStyle = WALL_HATCH;
      ctx.lineWidth = lw;
      ctx.beginPath();
      /* 45°，方向与 CSS 的 repeating-linear-gradient(45deg,…) 一致：条带沿屏幕
         左下→右上（y 轴向下，所以 x 增、y 减）。扫描线从左上角起、覆盖到
         bbox 的宽 + 高，斜着推过整个四边形。 */
      const span = (x1 - x0) + (y1 - y0);
      for (let d = 0; d <= span; d += step) {
        ctx.moveTo(x0 + d, y1);
        ctx.lineTo(x0 + d - (y1 - y0), y0);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  /* 标记：先画压暗的一批、再画有效的一批，重叠时有效的那个盖在上面。 */
  function drawMarks(C, P, L, c, tally) {
    for (let pass = 0; pass < 2; pass++) {
      for (const key in c.marks) {
        const m = c.marks[key];
        const stale = isStale(m, c);
        if (stale !== (pass === 0)) continue;
        if (stale && !E.state.stale) continue;
        const info = P.onMark(m.kind);
        if (!info || !info.color) { tally.badKinds[m.kind] = 1; continue; }
        const fr = sqToFR(+key, L);
        if (!fr) { tally.offBoard++; continue; }
        fillSquare(C, L, fr.f, fr.r, info.color, stale ? 0.12 : 0.38, !stale);
      }
    }
  }

  function drawPieces(C, L, c, tally) {
    for (const key in c.pieces) {
      const code = pieceCode(c.pieces[key]);
      if (code === null) { tally.badPieces[String(c.pieces[key])] = 1; continue; }
      const fr = sqToFR(+key, L);
      if (!fr) { tally.offBoard++; continue; }
      BR.drawPiece(ctx, C, E, { center: L.squareCenter(fr.f, fr.r), code: code, cell: L.cell });
    }
  }

  /* 深度塔：每一层取**此刻有效的、最新写下的那一个**标记，抬到 z = 层数·SPAN_Z，
     竖一根虚线柱、点一个按状态着色的点，层与层之间连成一条线——那条线就是左边
     调用栈面板里的那一摞帧（§1.4：z 轴就是调用栈深度）。
     层号由题目声明的 zOf 给（省略 = 标记的调用深度）：queens 是递归深度，
     knightPath 会是 BFS 的层数，这一段不需要知道是哪一种。 */
  function towerPoints(P, tk, c) {
    const zf = P.zOf || function (m) { return m.depth; };
    const best = Object.create(null);
    for (const key in c.marks) {
      const m = c.marks[key];
      if (isStale(m, c)) continue;
      let lv;
      /* zOf 抛了 → **说出来**（以前是静默丢掉这一层，塔于是少一截而画面看不出
         任何异常）。hookFail 按消息去重，所以每帧调用只会写一次状态牌。 */
      try { lv = zf(m, { sq: +key, track: tk, cur: tk.cur, D: D }); }
      catch (e) { hookFail(uiTab, 'zOf', e); lv = null; }
      if (typeof lv !== 'number' || !isFinite(lv) || lv < 0) continue;
      const prev = best[lv];
      if (!prev || prev.step < m.step) best[lv] = { sq: +key, step: m.step, kind: m.kind, level: lv };
    }
    return Object.keys(best).map(function (k) { return best[k]; })
      .sort(function (a, b) { return a.level - b.level; });
  }

  function drawTower(C, P, L, pts) {
    if (!pts.length) return;
    const span = spanZOf(P);
    const tops = [];
    ctx.save();
    ctx.setLineDash([px(3), px(3)]);
    ctx.lineWidth = Math.max(1, px(0.9));
    ctx.strokeStyle = 'rgba(148,163,184,0.45)';
    ctx.beginPath();
    for (let k = 0; k < pts.length; k++) {
      const fr = sqToFR(pts[k].sq, L);
      if (!fr) continue;
      const cc = L.squareCenter(fr.f, fr.r);
      const a = E.proj(C, cc), b = E.proj(C, [cc[0], cc[1], pts[k].level * span]);
      if (!a || !b) continue;
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      tops.push({ p: b, kind: pts[k].kind });
    }
    ctx.stroke();
    ctx.restore();
    if (tops.length > 1) {
      ctx.save();
      ctx.strokeStyle = C_STACK;
      ctx.lineWidth = Math.max(1.8, px(1.4));
      ctx.shadowColor = C_STACK;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(tops[0].p[0], tops[0].p[1]);
      for (let k = 1; k < tops.length; k++) ctx.lineTo(tops[k].p[0], tops[k].p[1]);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    for (let k = 0; k < tops.length; k++) {
      const info = P.onMark(tops[k].kind);
      ctx.fillStyle = (info && info.color) || C_STACK;
      ctx.beginPath();
      ctx.arc(tops[k].p[0], tops[k].p[1], Math.max(2.6, px(2.2)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* z 轴的刻度：贴在棋盘左下角外侧竖着数上去。正视下这一列刻度会叠在同一个点上
     ——那恰恰是「必须提供一个沿这根轴的侧视」的现场证据（§5.3），不是画错了。

     ⚠ 这里**只写数字**。轴的名字曾经是第 0 格刻度的前缀（`t(P.zLabel) + ' 0'`），
     右对齐画在棋盘左边——`sceneBox()` 给的内边距是按坐标标签（`a`/`1`，一两个字符）
     算的，而那串名字长得多，于是整行溢出取景框、钻到代码面板底下；两块棋盘并排时
     左盘那行的尾巴还会顶上右盘那行的头，读出来是一串乱码
     （`…ked) 0 recursion depth (squares walked) 0`）。名字改由 drawZAxisName()
     在取景框之外画，见下。 */
  function drawZAxis(C, P, L, levels) {
    const span = spanZOf(P);
    const o = L.squareCorners(0, 0)[0];
    const x = o[0] - 0.55 * L.cell, y = o[1] - 0.1 * L.cell;
    /* 层数多的题目（tourKnight 到 21 层）逐层写数字会挤成一条黑线，所以隔几层
       写一个——步长按层数算，不写死。第 0 层永远写，它带着轴的名字。 */
    const stride = Math.max(1, Math.ceil(levels / 10));
    ctx.save();
    ctx.fillStyle = 'rgba(159,176,200,0.62)';
    ctx.font = px(10.5) + 'px ' + FONT_MONO;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let d = 0; d <= levels; d++) {
      if (d !== 0 && d !== levels && d % stride !== 0) continue;
      const p = E.proj(C, [x, y, d * span]);
      if (!p) continue;
      ctx.fillText(String(d), p[0], p[1]);
    }
    ctx.restore();
  }

  /* 深度轴的名字：**一块画布只画一次**，画在 `ctx.scale(fit.s, fit.s)` 之外，
     横向居中于可见区（availRect）、纵向紧贴页签栏下沿。四件事一起解决：

     1. 它本来就该只有一份。`zLabel` 是**每道题**一份（`PROBLEMS[pid].zLabel`），
        不是每条轨道一份；两块棋盘各画一遍，写的是同一句话，还互相顶头。
     2. 横向位置只依赖 availRect()，而 availRect() 已经把折叠（`folded`）、分栏
        宽度（`#split` 的实际宽度）与窄屏下的面板换边（`panelIsRight()`）全算进
        去了。`clampCodeWidth()` 重夹面板宽度之后，这行字跟着一起移。
     3. 装不下就当场截断成省略号——宁可少说几个字，也不许伸出可见区。
     4. **为什么是页签栏底下、不是左下角**：左下角被 `#legend` 占着（可见区左下
        +16 起、111 px 高），第一版放在那儿就被图例压掉了半句；而右下角在分栏
        拖到最宽（可见区只剩 380 px）时同样会撞上图例。页签栏正下方那一条则在
        三种状态下都空着，且左右两侧的浮层（左图例、右参数面板）都够不到——
        居中意味着它只可能跟居中的页签栏冲突，而那一条正是 zNameBand() 让开的。

     updateFit() 在可见区顶部扣掉 zNameBand()（页签栏压住的那一截 + 这行字自己
     的高度），所以它既不压页签栏、也不压棋盘。 */
  function zNameBand(r) {
    r = r || availRect();
    const nav = document.getElementById('tabsNav');
    const nb = nav ? nav.getBoundingClientRect().bottom : 0;
    return Math.max(0, Math.round(nb - r.y0)) + Z_NAME_BAND;
  }
  /* 上一帧**真的**写下的那一行（含截断后的样子）与它在屏幕上占的横向区间。
     探针报的是这个，不是重算一遍——重算会把截断算丢，报出一个没人见过的字符串。
     与上面 `tally` 同一种做法：绘制自己交代绘制的结果。 */
  let zNameDrawn = null;
  function drawZAxisName(P) {
    zNameDrawn = null;
    if (!P || E.state.tower === false) return;   // 塔关掉了就没有轴，也就不必命名
    const r = availRect();
    ctx.save();
    ctx.font = '11px ' + FONT_MONO;
    ctx.fillStyle = 'rgba(159,176,200,0.62)';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    let s = t(STR.zAxis).replace('%L', t(P.zLabel));
    const cap = r.w - 16;
    if (ctx.measureText(s).width > cap) {
      while (s.length > 1 && ctx.measureText(s + '…').width > cap) s = s.slice(0, -1);
      s += '…';
    }
    const w = ctx.measureText(s).width;
    const x = Math.max(r.x0 + 8, r.x0 + (r.w - w) / 2);
    const y = r.y0 + zNameBand(r) - 6;
    ctx.fillText(s, x, y);
    ctx.restore();
    const nav = document.getElementById('tabsNav');
    zNameDrawn = { text: s, x: Math.round(x), right: Math.round(x + w), y: Math.round(y),
                   availX0: Math.round(r.x0), availX1: Math.round(r.x0 + r.w),
                   navBottom: nav ? Math.round(nav.getBoundingClientRect().bottom) : 0 };
  }

  /* 并排多块棋盘时，每块底下写它是哪份源码（一条轨道时不写：没有第二块要区分）。
     **活动的那一条要认得出来**：单步按钮、断点、Run 只作用在它身上，认错了就会
     以为工具没反应。所以活动的那块用 cyan（与左边编辑器槽位的高亮同色同义）。 */
  function drawTrackCaption(C, L, text, isActive) {
    const o = L.squareCorners(0, 0)[0];
    const p = E.proj(C, [o[0] + L.w / 2, o[1] - 1.15 * L.cell, 0]);
    if (!p) return;
    ctx.save();
    ctx.fillStyle = isActive ? C_STACK : 'rgba(159,176,200,0.72)';
    ctx.font = px(12) + 'px ' + FONT_MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(text, p[0], p[1]);
    ctx.restore();
  }
  /* 一条轨道叫什么：题目自己说了算（`trackLabel`），没说就用文件名。 */
  function trackTitle(P, tk, k) {
    /* ⚠ 参考轨道**不问题目**：`trackLabel(file)` 只认文件名，而参考轨道跟她那条
       用的是同一份文件 —— 问出来的两块棋盘会并排写着同一个名字（"Warnsdorff
       启发式" / "Warnsdorff 启发式"），而这两块盘的全部意义就是它们不是同一个
       东西。判定之后她那块也点名叫"你的版本"，两边成对。 */
    if (isReference(tk)) return t(STR.trkRef);
    const stT = curS();
    if (stT && stT.judge && isEdit(tk) && stT.tracks.indexOf(tk) === stT.judge.herIndex &&
        refIndexOf(uiTab) >= 0) return t(STR.trkYours);
    if (P && typeof P.trackLabel === 'function') {
      let s = null;
      try { s = P.trackLabel(tk.file, k); } catch (e) { hookFail(uiTab, 'trackLabel', e); s = null; }
      if (s) return t(s);
    }
    return tk.file;
  }

  /* 上一帧画的时候有多少东西没画成——读数区据此说话，绝不静默少画。
     （`place(sq, "wQ")` 那一类：认不出就一个后都不画、也不报错，是最难查的一种。） */
  let tally = { badPieces: {}, badKinds: {}, offBoard: 0 };

  function drawProblem(C, pid) {
    const P = PROBLEMS[pid], st = S[pid];
    if (!st.tracks.length) return;
    const fresh = { badPieces: {}, badKinds: {}, offBoard: 0 };
    /* **先收集，再统一画。** z 轴的刻度上限对并排的两块盘必须是**同一个数**：
       它是把两条轨迹摆在一起量的那把尺子，尺子不同就没得比了（而 drawZAxis 的
       `stride` 也是按上限算的，上限不同连刻度的疏密都会两边不一样，读者会把
       「尺子不同」误当成「层数不同」）。

       ⚠ 这里曾经是一趟循环、`top` 声明在循环外并在循环里累加：第 0 条轨道拿到的
       是**它自己**的最大层，第 1 条拿到的是**两条的最大值**——同一帧里左盘标到 8、
       右盘标到 12，而且谁大谁小取决于画的先后。towerTop（取景用，只许长不许缩）
       要的确实是两条的最大值，两件事共用了一个变量才出的这个洞。 */
    const shots = [];
    let top = 1;
    st.tracks.forEach(function (tk, k) {
      const L = tk.layout;
      if (!L) return;
      const c = boardAt(tk);
      const pts = towerPoints(P, tk, c);
      for (let j = 0; j < pts.length; j++) if (pts[j].level > top) top = pts[j].level;
      shots.push({ tk: tk, k: k, L: L, c: c, pts: pts, walls: tk.blocked || null });
    });
    const levels = Math.max(1, top);
    shots.forEach(function (s) {
      /* 先墙、后棋盘：两者画的格子互不相交（mask 挖掉的正是墙那几格），先画墙
         只是让 drawBoard 的外框与坐标标签留在最上层。没有墙时 mask 是 null，
         drawWalls 立刻返回 —— 与改动前同一条路径。 */
      drawWalls(C, s.L, s.walls, fresh);
      BR.drawBoard(ctx, C, E, { layout: s.L, mask: wallMask(s.L, s.walls) });
      if (E.state.marks !== false) drawMarks(C, P, s.L, s.c, fresh);
      if (E.state.pieces !== false) drawPieces(C, s.L, s.c, fresh);
      if (E.state.tower !== false) { drawTower(C, P, s.L, s.pts); drawZAxis(C, P, s.L, levels); }
      /* 判据是**画出来几块棋盘**，不是几条轨道：练习模式下 tourKnight 有两条
         轨道（一条只读对照没有棋盘），而一块孤零零的棋盘不需要标名字。 */
      if (shots.length > 1) drawTrackCaption(C, s.L, trackTitle(P, s.tk, s.k), s.k === activeTrack);
    });
    tally = fresh;
    /* 塔顶只允许长、不允许在同一次运行里缩回去——否则取景框会随着游标每走一步
       抖一下。换题目/换参数时由 rebuild 重置。 */
    if (top > towerTop) { towerTop = top; updateFit(); }
  }

  /* ---------------- 换页签时要办的事 ----------------
     引擎没有给出 tab 变更的回调，所以在每个场景的 draw 开头认一次——每帧一次，
     变了才做事（工具④ 的同一手法）。 */
  function setUiTab(pid) {
    if (pid === uiTab) return;
    uiTab = pid;
    /* 0 号轨道在练习模式下可能是那份**只读对照**（tourKnight）—— 单步与 Run
       落在一份不跑的死源码上，按什么都没反应。还没建过的题目这里是 0，
       buildProblem 建完之后会再挪一次。 */
    activeTrack = firstEditable(pid);
    towerTop = 1;
    jumpNote = null;
    paintLegend();
    /* ⚠ **这里不再同步跑解释器。** 换到一道还没建过的题目要跑一遍（甚至两遍）
       解释器：tourKnight 的 3×7 是两条各 200,000 步的轨迹，node 实测 457 + 507 ms。
       留在 draw 里就是主线程实打实卡上一秒，而且是在换页签这个最不该卡的时刻。
       建的事交给下面的 ensureBuiltAsync（withBusy → 先画一帧「正在跑」再去跑）。
       已经建过的题目照旧同步挂上去，那条路径上一行解释器都不跑。 */
    if (tracksOf(pid).length) { syncEditorSlots(); attachEditor(); updateFit(); }
  }

  /* 每一帧：先把调试器的时钟推一格，再在取景变换里把棋盘画出来。 */
  function frameFor(pid) {
    return function (C) {
      /* ⚠ 引导失败之后这一页**什么都不建、什么都不画**。尤其不能走到
         `setUiTab → ensureBuilt`：那一步会让 `P.source` 抛在 buildProblem 的
         catch 里，然后一路「成功」跑出空轨迹、把红色的引导失败洗成绿色的
         「Ran · 0 steps」。破页必须看起来就是破的。 */
      if (bootErr) return;
      setUiTab(pid);
      ensureBuiltAsync(pid);
      pollParams();
      /* 播放的时钟出口就是引擎的 state.dt（已 clamp 到 [0, 0.05]）。绝不自己用
         performance.now() 再算一遍帧时长，更不按帧计数——开发者的外接屏是
         30 Hz，按帧计数在那台机器上会慢一半。 */
      if (dbg) dbg.tick(E.state.dt);
      /* 一个游标推两条轨迹：调试器只认活动那一条，其余的每帧跟着它对齐一次。
         放在 tick 之后、绘制之前，所以并排的两块棋盘画的永远是同一个下标。 */
      syncTracks();
      ctx.save();
      ctx.translate(fit.tx, fit.ty);
      ctx.scale(fit.s, fit.s);
      try { drawProblem(C, pid); } finally { ctx.restore(); }
      /* 取景变换**之外**：轴的名字量的是屏幕像素，跟可见区对齐，不跟棋盘走。
         没有轨迹时（还没引导起来 / 引导失败）一个字都不写。 */
      if (S[pid] && S[pid].tracks.length) drawZAxisName(PROBLEMS[pid]);
    };
  }

  /* ================= 编辑器 + 调试器 ================= */
  const statusEl = document.getElementById('status');
  const btnRun = document.getElementById('btnRun');
  const btnRevert = document.getElementById('btnRevert');
  const btnCheck = document.getElementById('btnCheck');
  /* Run 与 Check 的禁用是**同一件事**：两个按钮都要先把编辑器里的东西交给
     解释器跑一遍，语法错时两个都跑不了。分开写迟早漏一个（而漏掉的那一个
     按下去只会在控制台里抛一条没人看的异常）。 */
  function setRunDisabled(v) { btnRun.disabled = v; btnCheck.disabled = v; }
  /* Check 只在练习模式下露面：正常模式下编辑器里就是参考答案，跟自己判自己。 */
  function syncCheckButton() { btnCheck.style.display = exerciseOn() ? '' : 'none'; }

  /* 状态牌**唯一**的写入口。锁上之后谁也写不进来 —— 见上面 statusLocked 那段。 */
  function setStatus(html, cls) {
    if (statusLocked) return;
    statusEl.className = 'sp-status' + (cls ? ' ' + cls : '');
    statusEl.innerHTML = html;
  }
  /* 引导失败那一条：自己开锁写一次、再锁回去。切语言时 relabel 会再调一次，
     所以它跟别的消息一样跟着语言走（以前它不跟 —— bootErr 分支从不设
     statusKind，relabel 那串 if 于是一条也命中不了）。 */
  function paintBootFail() {
    if (!bootErr) return;
    statusLocked = false;
    setStatus(esc(t(bootErrKind === 'decl' ? STR.declFail : STR.bootFail) + bootErr.message), 'bad');
    statusLocked = true;
  }
  function errText(err) {
    /* 源码生成失败要排在最前面：它的 line 是 null，落到下面那条会被说成
       「编辑器内部出错」，而这跟编辑器一点关系都没有。 */
    if (err.category === 'source') {
      return esc(t(STR.srcFail).replace('%F', err.file || '?') + err.message);
    }
    if (err.category === 'internal' || err.line == null) {
      return esc(t(STR.internal) + ': ' + err.message);
    }
    /* unsupported 一类**不加前缀**：interp.js 的 message 本身已经以
       "Unsupported syntax: …" 开头，再套一层就是同一句话说两遍。 */
    const head = err.category === 'unsupported' ? ''
               : (err.category === 'runtime' ? t(STR.runtime) : t(STR.syntax)) + ' · ';
    return esc(head + t(STR.atLine).replace('%L', err.line) + ': ' + err.message);
  }
  function runText(tk) {
    if (!tk || !tk.res) return t(STR.ready);
    const n = tk.res.trace.length;
    const r = tk.res.result;
    const rTxt = r === undefined ? '—' : (typeof r === 'number' ? fmtInt(r) : esc(D.fmtVal(r)));
    let s = t(STR.ranOk) + ' · <b>' + fmtInt(n) + '</b> ' + t(STR.steps) +
            ' · ' + t(STR.result) + ' <b>' + rTxt + '</b>';
    if (tk.res.trace.truncated) s += '<br>' + esc(t(STR.truncMsg));
    return s;
  }
  /* 一道题此刻的整体状态：**所有轨道一起看**。
     ⚠ 以前这里只看当前那一条（`showTrackStatus(curTrack())`）。一个 pid 两条轨道
     之后那就是个洞：非活动那条重新生成失败，会被绿色的「参数改成 …」原样盖掉，
     而她要等到点开另一份源码才看得见左边是空的。 */
  /* ⚠ 只报**她的**轨道。只读对照没有 `res`，`runText` 会给它一句灰色的
     "改一改代码，Run 会重新解释执行…" —— 而它根本不能改也不会跑；参考轨道虽然
     真的跑过，但"运行完成 · 156,772 步 · 返回值 4"是**参考答案的解数**，把它写在
     状态牌上等于顺手把答案报了出来。 */
  function runTextAll(st) {
    if (!st || !st.tracks.length) return t(STR.ready);
    const live = st.tracks.filter(isEdit);
    if (!live.length) return t(STR.ready);
    if (live.length === 1) return runText(live[0]);
    const P = PROBLEMS[uiTab];
    return live.map(function (tk) {
      return '<b>' + esc(trackTitle(P, tk, st.tracks.indexOf(tk))) + '</b> · ' + runText(tk);
    }).join('<br>');
  }
  function showProblemStatus() {
    const st = curS();
    if (!st || !st.tracks.length) { statusKind = 'idle'; setStatus(t(STR.ready), ''); return; }
    const P = PROBLEMS[uiTab], multi = st.tracks.length > 1;
    const bad = st.tracks.filter(function (tk) { return !!tk.err; });
    if (bad.length) {
      statusKind = 'bad';
      setStatus(bad.map(function (tk) {
        const k = st.tracks.indexOf(tk);
        return (multi ? '<b>' + esc(trackTitle(P, tk, k)) + '</b> · ' : '') + errText(tk.err);
      }).join('<br>'), 'bad');
      /* 源码根本没生成出来，编辑器是空的 —— 让 Run 可点，就等于给她一条
         「跑空程序 → 绿色的 0 步」的路，把刚说完的错误再洗掉一遍。
         她一旦动手写点什么，下面的 onChange 会照常把它重新点亮。 */
      if (curTrack() && curTrack().err && curTrack().err.category === 'source') setRunDisabled(true);
      return;
    }
    if (st.hookErr) return;                  // hookFail 刚写过红字，别用绿字盖掉
    /* 判过了就报判定结论，而不是「运行完成 · 144 步 · 返回值 0」—— 后者对着一个
       刚被判错的版本说"完成"，是这一页能给的最没用的一句话。
       **切语言之后这一句要还在**：relabel 认 statusKind 才知道重画哪一条，所以
       判定自己占一个 kind（见那边那串 if）。 */
    const jr = judgeRender(uiTab);
    if (jr) { statusKind = 'judge'; setStatus(jr.head.join('<br>'), jr.cls); return; }
    statusKind = 'ok';
    setStatus(runTextAll(st), 'ok');
  }

  /* ================= 并排多块源码：编辑器槽位 =================

     一道题有几份 `sources` 就并排几块编辑器（tourKnight 是唯一的两块）。槽位按
     **全页最大轨道数**一次建齐、之后只显隐，不反复 mount/unmount：Editor.mount
     会往宿主里塞四层 DOM 并挂事件，换一次题目重建一次是白付的开销，而且断点、
     滚动位置、光标全都会掉。

     `activeTrack` 是「单步 / 断点 / Run 作用在哪一块」。调试器只认一份编辑器
     句柄（mount 时闭包捕获），所以下面给它一个**代理**：所有调用转发到此刻活动
     的那一块。这样 debugger.js 一行不改（本阶段硬约束），而 F9 / F10 / F11 落在
     她正在看的那份源码上。 */
  const MAX_TRACKS = PIDS.reduce(function (m, pid) {
    return Math.max(m, (PROBLEMS[pid].sources || []).length);
  }, 1);
  const editorHost = document.getElementById('editorHost');
  const slots = [];
  for (let si = 0; si < MAX_TRACKS; si++) slots.push(makeSlot(si));

  function makeSlot(k) {
    const wrap = document.createElement('div');
    wrap.className = 'ed-slot';
    const cap = document.createElement('div');
    cap.className = 'ed-cap';
    const host = document.createElement('div');
    wrap.appendChild(cap);
    wrap.appendChild(host);
    editorHost.appendChild(wrap);
    const slot = { k: k, wrap: wrap, cap: cap, ed: null, lastLine: undefined, vis: null, visI: -1 };
    slot.ed = Ed.mount(host, {
      value: '',
      onChange: function (value, err) {
        /* 引导失败之后不再有「当前轨道」可言，而 `setValue('')` 会同步触发一次
           onChange —— 这里不挡住，Run 就会在破页上被重新点亮。 */
        if (bootErr) { setRunDisabled(true); return; }
        const tk = tracksOf(uiTab)[k];
        /* ⚠ **参考轨道不接受写入。** 上面那条 `gone` 分支会对它调一次
           `setValue('')`，而 setValue 同步触发这里 —— 不挡住的话，参考答案的源码
           当场被清成空串，下一次 Check 拿一份空程序当参考（`I.run('')` 不抛，
           安安静静给你 0 步的轨迹）。 */
        if (tk && !isReference(tk)) tk.src = value;   // 每块编辑器只写**它自己那条**轨道
        /* ---- 存档：**练习模式下、有空可填的那条轨道**，每次回调都写一次 ----
           这里**不再叠第二层防抖**：一次写的是三四 KB，比一次重绘便宜得多。

           ⚠ 但别把这句读成"存档没有延迟"。onChange 本身就是**防抖之后**才被调
           的 —— editor.js 的 onInput 把 emit() 挂在 `setTimeout(…, 220)` 上
           （`opts.debounce` 默认 220 ms，这里没有覆盖它）。所以"刚打完最后一个
           字就刷新 → 那几个字没了"的窗口**确实存在**，宽 220 ms；它归编辑器所
           有，不是这里能关掉的东西。真要关，得给这个 mount 传 `debounce: 0`，
           代价是每敲一个字符都重跑一次 check() + 重画高亮层 —— 那是工具 ④⑤ 共
           用的编辑器，动它的默认值要重做工具 ④ 的验收。现状是有意接受的。

           正常模式一个字节都不碰（saveSrc 自己那道闸也再挡一次）。

           ⚠ **跟占位版一模一样就把存档扔掉，不写。** 每次进练习模式、每次换
           页签，syncEditorSlots 都会 setValue 一次原样的占位版，同步触发这里 ——
           照写不误的话，光是点开一道题就会存下一份"她的答案"，而下一次打开时
           面板会指着它说「上次写到一半的答案已经恢复」。那是一句假话。 */
        if (tk && exerciseOn() && isEdit(tk) && tk.ex && tk.ex.blanks.length) {
          if (tk.ex.pristine !== value) saveSrc(uiTab, value);
          else {
            /* ⚠ 只扔**同一组参数下**的那份存档（她真的把自己写的删回了原样）。
               参数不同的那一份要留着：她刚把滑杆从 N=6 挪到 N=8，屏幕上这份
               原样的 N=8 占位版并不代表她扔掉了 N=6 那份答案 —— 滑杆挪回去
               就该还在。（同一组参数下另写一份答案仍然会盖掉它：一个题目一份
               文本，见 localStorage 那一节。） */
            const rec = loadSrc(uiTab);
            if (rec && rec.paramSig === paramSig(uiTab)) dropSrc(uiTab);
          }
        }
        /* 非活动那一块的语法错不该锁住 Run：Run 只重跑活动那一条。她切过去的
           那一刻 setActiveTrack 会重新问一次 getError()，那时才轮到它说话。 */
        if (k !== activeTrack) return;
        /* 判定的结论只对**判定那一刻的那份源码**成立。她一动手，"你在第 76 步跟
           参考分道扬镳"就变成了一句关于别的程序的话 —— 连同参考那块棋盘一起撤掉。

           ⚠ 两条判据缺一不可，都踩过：
             · `k === activeTrack`（上面那条早退）—— 隐藏参考槽位时 syncEditorSlots
               会对**别的**槽位调 `setValue('')`，那一下的 value 是空串，跟 herSrc
               当然不同。放在早退之前的话，Check 自己在设完 judge 之后调一次
               syncEditorSlots 就把刚做出来的判定抹掉了（写完当场撞上）。
             · `value !== herSrc` —— 切轨道 / 切语言 / 刚 Run 完那些 `setValue`
               送进来的是同一份文本，不该把结论抹掉。 */
        const stJ = curS();
        if (stJ && stJ.judge && value !== stJ.judge.herSrc) clearJudge(uiTab);
        setRunDisabled(!!err);                 // 规格 §2.8：有语法错时 Run 禁用
        if (err) { statusKind = 'bad'; setStatus(errText(err), 'bad'); }
        else if (statusKind === 'bad') {
          /* ⚠ 只清掉**编辑器自己刚放上去的**那条红。钩子失败与轨道错误跟她打的字
             毫无关系，不能被一句灰色的 Ready 洗掉 —— 实测过：`board()` 忘了写
             return 时 hookFail 刚写完红字，紧接着 syncEditorSlots 的 setValue 会
             同步触发这里，红字当场变成 Ready，而画布是空的。又一条「绿盖红」。 */
          const st2 = curS();
          if (st2 && (st2.hookErr || st2.tracks.some(function (x) { return !!x.err; }))) return;
          statusKind = 'idle';
          setStatus(t(STR.ready), '');
        }
      },
    });
    cap.addEventListener('click', function () { setActiveTrack(k); });
    /* 直接点进代码里也算「我要调这一份」——否则会出现「在左边打字、F10 在右边走」
       这种最让人不信任工具的错位。 */
    slot.ed.textarea.addEventListener('focus', function () { setActiveTrack(k); });
    return slot;
  }

  function actSlot() { return slots[activeTrack] || slots[0]; }
  const ed = {
    /* 属性要用 getter：debugger.js 读的是 `editor.textarea`（判断焦点在不在代码里），
       固定成 mount 那一刻的那一块就会在切换之后永远判错。 */
    get textarea() { return actSlot().ed.textarea; },
    caretLine: function () { return actSlot().ed.caretLine(); },
    getValue: function () { return actSlot().ed.getValue(); },
    getError: function () { return actSlot().ed.getError(); },
    setValue: function (v) { actSlot().ed.setValue(v); },
    refresh: function () { slots.forEach(function (s) { s.ed.refresh(); }); },
    setDebugState: function (o) { actSlot().ed.setDebugState(o); },
    setBreakpoints: function (p) { actSlot().ed.setBreakpoints(p); },
    /* 槽位**各自**注册，点谁的行号槽就先切到谁，再让调试器去切换那一行的断点。
       两步的顺序不能反：先切轨道，`toggleBreakAt` 里的 `cur` 才是那一条的游标。 */
    onGutterClick: function (fn) {
      slots.forEach(function (s, k) {
        s.ed.onGutterClick(function (ln) { setActiveTrack(k); fn(ln); });
      });
    },
  };

  const dbg = D.mount(document.getElementById('dbgHost'), D.create([]), {
    editor: ed,
    t: t,
  });

  /* 槽位跟着当前题目的轨道走：几条轨道显示几块，标题写清楚哪一块是活动的。
     **每次重建之后都要调**（源码可能整份换了）。 */
  function syncEditorSlots() {
    const P = curP(), tks = tracksOf(uiTab);
    /* 「并排好几块」的判据是**有槽位的轨道**有几条，不是轨道有几条：判定接上来的
       参考轨道没有槽位，按轨道数算的话 queens 判一次之后那块孤零零的编辑器就会
       挂上一句「（单步 / 断点 / Run 作用在这一份上）」—— 屏幕上只有它一块，
       这句话在跟谁比？ */
    const multi = tks.filter(function (tk) { return !isReference(tk); }).length > 1;
    slots.forEach(function (s, k) {
      const tk = tks[k];
      /* ⚠ **参考轨道没有槽位。** 它装的是参考答案 —— 摆进任何一块编辑器都等于把
         答案发给她，这一整个功能当场作废。所以它跟"这个下标上根本没有轨道"走同
         一条分支：槽位隐藏、内容清空。（今天只有 queens/knightPath 会走到这里：
         它们只有一份 sources，而槽位是按全页最大轨道数 2 建的，参考轨道恰好落在
         第 1 号槽位上。） */
      const gone = !tk || isReference(tk);
      s.wrap.classList.toggle('gone', gone);
      s.wrap.classList.toggle('active', multi && k === activeTrack);
      if (gone) { s.ed.setValue(''); s.lastLine = undefined; s.vis = null; s.visI = -1; return; }
      s.cap.textContent = '';
      const nm = document.createElement('span');
      nm.textContent = trackTitle(P, tk, k);
      s.cap.appendChild(nm);
      /* 只读对照（练习模式下的那份 DFS）：**textarea 直接置 readOnly**。
         `editor.js` 一行不改（它是工具④⑤ 共用的核心模块，动它要重做工具④ 的
         验收）—— 它已经把 textarea 导出来了，置一个标准 DOM 属性不算改它。
         每次都写，两个方向都写：不写回 false 的话，退出练习模式之后那一块
         会一直锁着，而且看不出为什么。 */
      const ro = isContrast(tk);
      s.wrap.classList.toggle('ro', ro);
      s.ed.textarea.readOnly = ro;
      if (ro) {
        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = t(STR.trkContrast);
        s.cap.appendChild(n);
      } else if (multi && k === activeTrack) {
        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = t(STR.trkActive);
        s.cap.appendChild(n);
      }
      /* 一块编辑器只在内容真的变了时才 setValue：它会清掉滚动位置、访问痕迹与
         执行行标记，每帧/每次切换都调一次的话，右边那份源码会不停跳回顶部。 */
      if (s.ed.getValue() !== tk.src) {
        s.ed.setValue(tk.src);
        s.lastLine = undefined; s.vis = null; s.visI = -1;
      }
      /* ⚠ 每块编辑器画**自己那条轨道**的断点。调试器交给代理的那个谓词是
         `hasBreak(cur, ln)`，`cur` 是它闭包里那个**会变**的变量——切一次轨道，
         上一块编辑器手里的谓词就悄悄开始报告新轨道的断点了。所以这里为每块
         重新钉一份读它自己 `tk.cur` 的谓词。 */
      s.ed.setBreakpoints(function (ln) { return D.hasBreak(tk.cur, ln); });
      /* 折叠期间这块是 display:none，编辑器量不到字符宽度；重新显示要刷一次。 */
      s.ed.refresh();
    });
    /* 提示面板画的是**活动轨道**上那几个空 —— 跟槽位是同一件事的两半（重建 /
       切轨道 / 切语言 / Run / Check 都从这里过），所以挂在这里，不必每个调用点
       各记一次「顺便重画提示」。 */
    renderExPanel();
  }

  /* 把调试器挂到当前题目的当前轨道上。换题目 = 换一份程序：编辑器内容、
     调试器游标一起换，每条轨道自己的断点跟着自己的 cur 走。 */
  function attachEditor() {
    const tk = curTrack();
    /* Check 的显隐跟着模式走。挂在这里是因为**每一条重建路径都经过它**
       （ensureBuiltAsync / pollParams / 启动），而"练习模式开关按下去"正是走
       pollParams 那一条。 */
    syncCheckButton();
    syncEditorSlots();
    if (!tk) { dbg.setCursor(D.create([])); return; }
    dbg.setCursor(tk.cur);
    showProblemStatus();
  }

  /* 换一条轨道当活动轨道。**不重新跑任何东西**，只是把单步/断点/Run 的落点挪过去。 */
  function setActiveTrack(k) {
    const tks = tracksOf(uiTab);
    /* 只读对照不能当活动轨道：单步/断点/Run 落在一份不跑的死源码上，按什么
       都没反应。点它的标题、点进它的文本里，都从这里被挡住（两个调用点）。
       参考轨道同样不能：它连编辑器槽位都没有（点不到它的标题），但**它有棋盘**，
       而点棋盘也会走到这里（onBoardClick），选中它等于把 Run 落在参考答案上。 */
    if (k === activeTrack || !isEdit(tks[k])) return;
    activeTrack = k;
    syncEditorSlots();
    dbg.setCursor(tks[k].cur);
    /* 切过来的这一份自己可能有语法错（她刚在上面打了半行）—— 那一刻 onChange
       因为「不是活动轨道」而闭了嘴，现在轮到它说话了。 */
    const e = ed.getError();
    setRunDisabled(!!e);
    if (e) { statusKind = 'bad'; setStatus(errText(e), 'bad'); return; }
    showProblemStatus();
  }

  /* ---------------- 一个游标，两条轨迹 ----------------

     调试器只推活动那一条；其余的每帧跟着它对齐到**同一个下标**。同一格步数预算
     下两边各自到了哪里，就是这一题要看的东西（3×4 上朴素在 898 步处已经走完，
     启发式还在 3,092 步的三分之一）。走完的那一条由 `D.goto` 夹在自己的末步上。

     ⚠ 非活动那块编辑器的执行行**只在真的换行时才写**：`setExecLine` 会重建整层
     标记 DOM，每帧无条件调一次是白付的。而且约束 4 —— 连续两步可能停在同一行，
     所以判据是「行号变了没有」，不是「游标动了没有」。 */
  function syncTracks() {
    const tks = tracksOf(uiTab);
    if (tks.length < 2) return;
    const act = tks[activeTrack];
    if (!act) return;
    const i = act.cur.i;
    for (let k = 0; k < tks.length; k++) {
      if (k === activeTrack) continue;
      const tk = tks[k], s = slots[k];
      /* ⚠ **判据是"这是她的轨道之一吗"，不是"这不是只读对照吗"。** 两种角色都得
         在 `D.goto` **之前**跳出去，而且理由完全不同：

           contrast   没有轨迹可推（`cur` 是空的，`currentLine` 是 null），
                      写上去只会把那块源码上的高亮乱擦一遍。
           reference  有轨迹、有游标，而且**恰恰不能跟她对齐** —— 判定之后它停在
                      `divergence.refStep`，她停在 `herStep`，两个数通常不相等
                      （§2.9 阶段 6 第 4 条：练习模式必须从"一个游标推两条"分叉
                      出来）。这里少一条判断，下一帧就把它拖回她那一步，而屏幕上
                      只表现为"两块盘怎么老是一样的"——本任务最典型的失败形态。 */
      if (!isEdit(tk)) continue;
      D.goto(tk.cur, i);                       // 越界自己夹住，返回值这里用不上
      if (!s) continue;
      const ln = D.currentLine(tk.cur);
      const vis = slotVisited(s, tk);
      if (s.lastLine !== ln) {
        s.lastLine = ln;
        s.ed.setDebugState({ execLine: ln, frameLine: null, visited: vis });
      }
    }
  }
  /* ================= 分级提示（§2.9 阶段 6 第 5 条） =================

     规格的原话：提示逐级给，不一次给完 —— 文字提示 → 点名涉及了哪几个变量 →
     参考答案的结构骨架 → 完整答案。**任何时候都可以直接看答案并继续。**

     四级的内容一个字都不在这一层：`Exercise.hintAt(blank, level)` 说了算。这里
     只管三件事 —— 她点到第几级了（存起来）、把那一级画出来、以及第 4 级那个
     「填进编辑器」按钮真的把答案填进去。

     ⚠ **「先自己想想」这类话一句都没有，而且不许加。** 卡住而无法前进只会让她
     把页面关掉；每一行都摆着一个「直接看答案」的按钮，就是这条规格的形状。 */

  const exHost = document.getElementById('exHost');

  /* 这道题此刻的进度记录（内存那一份）。挖空是新出现的（换了参数 / 刚进练习
     模式）就当场补一条 —— 读不出来 = 全新开始，见 loadBlank。 */
  function progOf(pid, id) {
    const st = pid ? S[pid] : null;
    if (!st) return { attempts: 0, hintLevel: 0, solvedAt: null };
    if (!st.prog[id]) st.prog[id] = loadBlank(pid, id);
    return st.prog[id];
  }
  function setProg(pid, id, patch) {
    const rec = progOf(pid, id);
    Object.keys(patch).forEach(function (k) { rec[k] = patch[k]; });
    saveBlank(pid, id, rec);
    return rec;
  }

  /* 提示面板画的是**活动轨道**上那几个空。只读对照没有空（它走 clean），
     参考轨道连槽位都没有 —— 两者的 `ex` 都是 null，自然一行都不画。 */
  function exBlanks() {
    const tk = curTrack();
    return (exerciseOn() && tk && tk.ex && tk.ex.blanks) ? tk.ex.blanks : [];
  }

  /* 一级提示的正文。第 3、4 级的正文是源码，要等宽 + 横向滚，所以顺手告诉
     调用方这一段该不该按代码排版。`hintAt` 的两句正文里第一行是引导句、
     其余是代码，这里按第一个换行切开 —— 引导句归 UI 的正文段，代码归 <pre>。 */
  function hintText(b, level) {
    let s;
    try { s = t(Exercise.hintAt(b, level)); }
    catch (e) {
      /* 提示坏了不该毁掉整块面板：说出来，别静默画个空行。 */
      return { lead: '', code: '', err: (e && e.message) ? e.message : String(e) };
    }
    const nl = s.indexOf('\n');
    if (level >= 3 && nl >= 0) return { lead: s.slice(0, nl), code: s.slice(nl + 1), err: null };
    return { lead: s, code: '', err: null };
  }

  function mkBtn(label, cls, onClick) {
    const b = document.createElement('button');
    b.className = 'btn ex-btn' + (cls ? ' ' + cls : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  /* 提示面板重画。**不是每帧调**：它挂在 syncEditorSlots 末尾（重建 / 切轨道 /
     切语言 / Run / Check 都经过那里），一次几十个 DOM 节点。 */
  function renderExPanel() {
    const pid = uiTab, blanks = exBlanks();
    exHost.classList.toggle('on', exerciseOn() && blanks.length > 0);
    exHost.textContent = '';
    if (!exerciseOn() || !blanks.length) return;

    const head = document.createElement('div');
    head.className = 'ex-head';
    const ht = document.createElement('span');
    ht.textContent = t(STR.exHints);
    head.appendChild(ht);
    const why = document.createElement('span');
    why.className = 'n';
    why.innerHTML = applyMarkup(esc(t(STR.exWhy)));
    head.appendChild(why);
    exHost.appendChild(head);

    /* 存档说的那句话（恢复了 / 参数对不上 / 这个浏览器不让存）。三种都写在
       同一行上，因为它们互斥。

       ⚠ 三条都走 textContent，所以三条都只做 `%K` 替换、都不过 markup。
       exStale 从前借的是 applyMarkup —— 它顺手把 `**x**` 换成 `<b>x</b>`，
       而 textContent 会把那对尖括号原样印出来。今天这三句里没有 `**`，看
       不出来；哪天谁在文案里加一个粗体就当场露馅。用 applySubs。 */
    const st = pid ? S[pid] : null;
    const notes = [];
    if (st && st.restore && st.restore.kind === 'ok') notes.push({ warn: false, s: t(STR.exRestored) });
    if (st && st.restore && st.restore.kind === 'stale') {
      notes.push({ warn: true, s: applySubs(t(STR.exStale), { V: st.restore.was, W: st.restore.now }) });
    }
    if (!lsAvail()) notes.push({ warn: true, s: t(STR.exNoStore) });
    notes.forEach(function (n) {
      const el = document.createElement('div');
      el.className = 'ex-lead' + (n.warn ? ' warn' : '');
      if (n.warn) el.style.color = '#fcd34d';
      el.textContent = n.s;
      exHost.appendChild(el);
    });

    blanks.forEach(function (b, i) {
      const rec = progOf(pid, b.id);
      const row = document.createElement('div');
      row.className = 'ex-row' + (rec.solvedAt ? ' done' : '');
      const top = document.createElement('div');
      top.className = 'ex-top';

      const id = document.createElement('span');
      id.className = 'ex-id';
      id.textContent = b.id;
      top.appendChild(id);

      const diff = document.createElement('span');
      diff.className = 'ex-diff';
      diff.textContent = t(STR.exDiff).replace('%L', String(b.level));
      top.appendChild(diff);

      /* 往下走一级。到第 4 级就走不动了 —— 那时候按钮变灰，但旁边「直接看答案」
         那一颗从头到尾都在。 */
      const next = mkBtn(t(STR.exHintBtn) + (rec.hintLevel ? ' ' + rec.hintLevel + '/4' : ''), '', function () {
        setProg(pid, b.id, { hintLevel: Math.min(4, rec.hintLevel + 1) });
        renderExPanel();
      });
      next.disabled = rec.hintLevel >= 4;
      top.appendChild(next);

      /* §2.9：**任何时候都可以直接看答案并继续。** 一颗按钮，不问理由、不弹确认。 */
      const all = mkBtn(t(STR.exAnswer), '', function () {
        setProg(pid, b.id, { hintLevel: 4 });
        renderExPanel();
      });
      all.disabled = rec.hintLevel >= 4;
      top.appendChild(all);

      if (rec.hintLevel >= 4) top.appendChild(mkBtn(t(STR.exFill), 'check', function () { fillAnswer(i); }));

      /* 状态词，**不是计分**（见 STR.exTries 上面那段）：还没按过 / 按过 / 已判对。
         `solvedAt` 在这里有两个读者 —— 上面 row 的 `done` 类（绿框）与这里的
         「已判对」；它不是只写不读的字段。准确的次数只进 title。 */
      const meta = document.createElement('span');
      meta.className = 'ex-meta' + (rec.solvedAt ? ' ok' : '');
      meta.textContent = rec.solvedAt ? t(STR.exSolved)
                       : (rec.attempts ? t(STR.exTried) : t(STR.exNoTry));
      if (rec.attempts) meta.title = applySubs(t(STR.exTries), { N: fmtInt(rec.attempts) });
      top.appendChild(meta);
      row.appendChild(top);

      if (!rec.hintLevel) {
        const none = document.createElement('div');
        none.className = 'ex-lead';
        none.textContent = t(STR.exNoHint);
        row.appendChild(none);
      } else {
        const h = hintText(b, rec.hintLevel);
        const stage = document.createElement('div');
        stage.className = 'ex-lead';
        stage.textContent = t(STR.exStage).replace('%L', String(rec.hintLevel));
        row.appendChild(stage);
        if (h.err) {
          const bad = document.createElement('div');
          bad.className = 'ex-body';
          bad.style.color = '#fca5a5';
          bad.textContent = 'hintAt(' + b.id + ', ' + rec.hintLevel + ')：' + h.err;
          row.appendChild(bad);
        } else {
          if (h.lead) {
            const lead = document.createElement('div');
            lead.className = 'ex-body';
            lead.textContent = h.lead;
            row.appendChild(lead);
          }
          if (h.code) {
            const pre = document.createElement('div');
            pre.className = 'ex-body code';
            pre.textContent = h.code;
            row.appendChild(pre);
          }
        }
      }
      exHost.appendChild(row);
    });
  }

  /* ---- 第 4 级的「填进编辑器」：她那段答案占哪几行 ----

     这一步唯一难的是**划边界**：占位版给的是「注释行 + 一行 fill」，而她的答案
     可以是三行、也可以是零行（把 fill 删了）。所以不猜行数，改成两头对齐：

       上边界  这个空的占位注释那一行（id 让它在整份源码里唯一 —— 见 exercise.js
               「这一行为什么这么短」那一节）。
       下边界  从**下一个空的注释行**（或文件末尾）往回，跟占位版原文逐行比。
               占位版里这一空之后、下一空之前的那几行全都对得上，剩下的那一段
               就是她写的。

     两头有一头对不上（她把注释删了、或者改了空下面的代码）就**一个字都不动**，
     并说清楚为什么 —— 答案就摆在上面那一格里，复制粘贴一秒钟的事，而猜错一行
     会把她写的东西吃掉。 */
  function noteIndexOf(lines, ex, i) {
    const a = ex.notes.zh[i], b = ex.notes.en[i];
    for (let n = 0; n < lines.length; n++) if (lines[n] === a || lines[n] === b) return n;
    return -1;
  }
  function answerRange(tk, i, lines) {
    const ex = tk.ex, pris = ex.pristine.split('\n');
    const ni = noteIndexOf(lines, ex, i);
    if (ni < 0) return { err: 'note' };
    const ni0 = noteIndexOf(pris, ex, i);
    if (ni0 < 0) return { err: 'note' };            // 占位版自己都找不到：不该发生
    const last = i + 1 >= ex.blanks.length;
    const nj = last ? lines.length : noteIndexOf(lines, ex, i + 1);
    const nj0 = last ? pris.length : noteIndexOf(pris, ex, i + 1);
    if (nj < 0 || nj0 < 0 || nj <= ni) return { err: 'tail' };
    const need = nj0 - (ni0 + 2);                   // 占位版里这一空之后的那几行
    let L = 0;
    while (L < need && (nj - 1 - L) > ni && lines[nj - 1 - L] === pris[nj0 - 1 - L]) L++;
    if (L !== need) return { err: 'tail' };
    return { start: ni + 1, end: nj - L, err: null };
  }

  function fillAnswer(i) {
    const tk = curTrack(), pid = uiTab;
    if (!tk || !tk.ex || !tk.ex.blanks[i]) return false;
    const b = tk.ex.blanks[i];
    const lines = ed.getValue().split('\n');
    const r = answerRange(tk, i, lines);
    if (r.err) {
      /* **什么都不改**，并说明是哪一头对不上。 */
      statusKind = 'bad';
      setStatus(applyMarkup(esc(t(r.err === 'note' ? STR.exFillNote : STR.exFillTail)), { B: esc(b.id) }), 'bad');
      return false;
    }
    const body = b.body.split('\n');
    Array.prototype.splice.apply(lines, [r.start, r.end - r.start].concat(body));
    /* setValue 会同步触发 onChange：她那条轨道的 `src` 跟着换、存档跟着写、
       上一次判定跟着作废（源码变了，"你在第 76 步分道扬镳"讲的是别的程序）。 */
    ed.setValue(lines.join('\n'));
    renderExPanel();
    /* 填进去的是参考答案，本身不会有语法错 —— 但她**周围**的代码可能正错着，
       那条红字不能被一句绿色的"填好了"盖掉（这一页的"绿盖红"已经犯过三次）。 */
    if (!ed.getError()) {
      statusKind = 'ok';
      setStatus(applyMarkup(esc(t(STR.exFilled)), { B: esc(b.id) }), 'ok');
    }
    return true;
  }

  /* 非活动轨道的「已执行过的行」。`D.visitedLines` 每次都从第 0 步重放整条轨迹
     （200,000 步的轨迹上那是几毫秒），而这里每帧都要——所以**增量**维护：游标
     往前走就补上新走过的行，往回走才重来。 */
  function slotVisited(s, tk) {
    const trace = tk.cur.trace, i = tk.cur.i;
    if (!s.vis || s.visTrace !== trace || s.visI > i) {
      s.vis = []; s.visSeen = Object.create(null); s.visTrace = trace; s.visI = -1;
    }
    for (let k = s.visI + 1; k <= i && k < trace.length; k++) {
      const ln = trace[k].line, key = String(ln);
      if (!s.visSeen[key]) { s.visSeen[key] = 1; s.vis.push(ln); }
    }
    s.visI = Math.min(i, trace.length - 1);
    return s.vis;
  }

  /* ================= 重建（换参数 / 按 Run / 还原） ================= */

  /* 重建是**同步且慢**的（N=8 要跑 156,772 步）。所以先把「正在跑解释器」画出来，
     让浏览器有机会渲染一帧，再在一次 setTimeout 之后真的去跑。40 ms 不是节流，
     是给那一帧留的时间。 */
  let busy = false;
  function withBusy(fn) {
    if (busy) return;
    busy = true;
    document.body.classList.add('busy');
    statusKind = 'busy';
    setStatus(t(STR.busy), 'busy');
    setTimeout(function () {
      try { fn(); }
      finally {
        busy = false;
        document.body.classList.remove('busy');
      }
    }, 40);
  }

  /* 启动时用的同步版：第一道题（queens N=6，9,500 步）必须在第一帧之前建好，
     否则第一帧是空的、取景框也没有盒子可算。 */
  function ensureBuilt(pid) {
    if (S[pid].tracks.length) return;
    buildProblem(pid, true);
    towerTop = 1;
    updateFit();
  }

  /* 换到一道**还没建过**的题目：那一次解释器运行搬进 withBusy。
     tourKnight 的 3×7 是两条各 200,000 步的轨迹（node 实测 457 + 507 ms）——
     留在 draw 里就是换页签的那一刻主线程卡满一秒，什么提示都没有。

     ⚠ **不能写成 setUiTab 里的一次性调用**：`withBusy` 有重入锁，正忙的时候
     那一次会被直接丢掉，而 setUiTab 的 `pid === uiTab` 短路会让它再也不被调用
     ——那道题从此永远建不出来。所以放在每帧的路径上，条件是「不忙且还没建」，
     没建成就下一帧再来一次。 */
  function ensureBuiltAsync(pid) {
    if (busy || !pid || S[pid].tracks.length) return;
    withBusy(function () {
      buildProblem(pid, true);
      towerTop = 1;
      attachEditor();
      updateFit();
    });
  }

  /* 滑杆没有「值变了」的回调（引擎的 buildParams 只往 state 里写），所以在绘制
     循环里盯着 state。拖动中连跨两格时 withBusy 的重入锁会挡掉后来的那次，
     下一帧的轮询会拿到最终值——最后跑的一定是她松手那一格。 */
  function pollParams() {
    if (busy || !uiTab) return;
    const pid = uiTab;
    if (!S[pid].tracks.length) return;          // 还没建过：归 ensureBuiltAsync 管
    if (S[pid].sig === buildSig(pid)) return;
    /* 练习模式那一下要跟换参数分开说：她按的是"练习模式"，一句"参数改成
       N=6 ex=1"答非所问。签名里的 `ex=` 只负责触发重建，措辞归这里。 */
    const wasEx = S[pid].ex === true;
    withBusy(function () {
      const sig = paramSig(pid);
      buildProblem(pid, true);
      towerTop = 1;
      attachEditor();
      updateFit();
      /* 新参数把源码生成搞挂了，就说那件事 —— 别用一句绿色的「参数改成 …」
         把它盖掉（attachEditor 刚刚才把它写上去）。
         ⚠ 判据是**所有轨道**，不是 curTrack()：一个 pid 两条轨道时，非活动那条
         生成失败会被这句绿字原样盖掉，而她要切过去才看得见左边是空的。 */
      const st = S[pid];
      if (st.hookErr || st.tracks.some(function (tk) { return !!tk.err; })) {
        showProblemStatus();
        return;
      }
      statusKind = 'ok';
      if (st.ex !== wasEx) {
        setStatus(exerciseText(pid) + '<br>' + runTextAll(st), 'ok');
        return;
      }
      setStatus(t(STR.paramChanged).replace('%V', esc(sig)) + '<br>' + runTextAll(st), 'ok');
    });
  }

  /* 刚进/刚出练习模式时状态牌上那一句。挖空数从 `blanksOf` 数出来，不写死 ——
     一道题挖几个空是它的源码说了算，页面这一层不该知道。 */
  function exerciseText(pid) {
    if (!exerciseOn()) return applyMarkup(t(STR.exOff));
    const n = blankCount(pid);
    if (!n) return applyMarkup(t(STR.exNone));
    return applyMarkup(t(STR.exOn), { B: String(n) });
  }

  /* Run：改动 → 语法通过 → 重新解释执行、生成新轨迹 → 棋盘与调试器重置到第 0 步
     （规格 §2.8 的「编辑后的流程」）。只重跑**当前轨道**——并排的另一条跑的是
     另一份程序，没有理由被牵连。 */
  btnRun.addEventListener('click', function () {
    const err = ed.getError();
    if (err) { statusKind = 'bad'; setStatus(errText(err), 'bad'); return; }
    const tk = curTrack(), src = ed.getValue();
    if (!tk) return;
    withBusy(function () {
      /* 重跑就是换了一条轨迹：上一次判定说的那两个步号讲的是**上一次那条**。
         参考那块棋盘也一起撤掉——留着它就是屏幕上摆着一块没人解释的盘。 */
      clearJudge(uiTab);
      runTrack(tk, src, true);
      syncEditorSlots();
      dbg.setCursor(tk.cur);
      towerTop = 1;
      updateFit();
      showProblemStatus();
    });
  });

  /* §2.8 的 `Reset to original`：把当前轨道的源码换回生成器的输出。

     ⚠ **它必须把存档一起扔掉。** 练习模式下的存档是按题目键存的，而下一帧
     `pollParams` 之后的任何一次重建都会去读它 —— 不扔的话，「还原为原始版本」
     只在屏幕上停留到下一次重建，然后她刚扔掉的那份答案又回来了。
     扔掉的只有**答案文本**：提示级别与尝试次数是她的进度，不是这份源码的一部分
     （按了还原不等于她没看过提示）。 */
  btnRevert.addEventListener('click', function () {
    const tk = curTrack(), P = curP();
    if (!tk || !P) return;
    withBusy(function () {
      clearJudge(uiTab);            // 源码换了一份，上一次的判定跟它无关（同 Run）
      if (exerciseOn()) {
        dropSrc(uiTab);
        if (S[uiTab]) S[uiTab].restore = null;   // 「已恢复」那句话跟着这份存档一起没
      }
      /* 同一条通道的另一个调用点 —— 也必须能报错。以前这里失败会退回 tk.src，
         按钮于是「按了等于没按」，而且一个字都不说。
         ⚠ 走 `prepareSource` 而不是裸的 `genSource`：练习模式下「还原为原始版本」
         要还原到**占位版**，不是把参考答案倒给她。 */
      const g = prepareSource(P, paramsOf(uiTab), tk.file, tk.role);
      if (!g.err) { tk.ex = g.ex; markGenerated(tk, g); }   // 占位注释重新按当前语言生成
      runTrack(tk, g.err ? tk.src : g.src, true);
      if (g.err) tk.err = g.err;
      syncEditorSlots();                 // 只有这一块的内容变了，另一块原样不动
      dbg.setCursor(tk.cur);
      towerTop = 1;
      updateFit();
      showProblemStatus();
    });
  });

  /* ================= Check：判定与分歧定位（§2.9 阶段 6 第 4 条） =================

     规格里这一段的原话是这个功能存在的理由：

       「错了」是没用的反馈。因为两个版本的完整轨迹都在手上，可以做到更好的事
       —— 找出她的版本与参考版本行为分歧的第一步，把调试器直接跳到那一步，
       两边并排显示。

     所以按下 Check 之后屏幕上多出来的不是一个红叉，是**第二块棋盘**：参考那条
     轨道停在它自己的那一步，她那条停在她自己的那一步，两个步号通常不相等。

     ---- 参考轨道为什么长这样 ----

     它是一条 `role:'reference'` 的轨道，**接在 st.tracks 末尾**（这是不变量，
     dropRefTrack / buildProblem 都靠它）。它跑、有棋盘、有自己的游标，但是：

       · **没有编辑器槽位**（syncEditorSlots 把它当 gone）—— 它装的是参考答案。
         任何把它摆进编辑器的写法都等于把答案发给她。这一条也顺手解决了「槽位
         是按 MAX_TRACKS 一次建齐、而 MAX_TRACKS 是从 sources 数出来的 2」这个
         接缝：不要槽位的轨道不占槽位，声明层与 validateDecl 一个字都不用改。
       · **不能被选中**（setActiveTrack 挡住）—— Run / 单步 / 断点落在参考答案上
         没有任何意义。
       · **不跟她的游标走**（syncTracks 只推 role:'edit' 的）—— 见那里的注释。
       · **随判定生灭**：换参数、动开关、Run、Reset、改一个字，它都消失。 */

  /* 参考轨道永远是最后一条（或者没有）。写成一个函数而不是到处 `tracks.length-1`：
     「它在末尾」这条不变量只有一处知道。 */
  function refIndexOf(pid) {
    const tks = tracksOf(pid);
    return (tks.length && isReference(tks[tks.length - 1])) ? tks.length - 1 : -1;
  }
  function dropRefTrack(pid) {
    if (refIndexOf(pid) < 0) return false;
    S[pid].tracks.pop();
    /* 活动轨道理应从来没落在它上面（setActiveTrack 挡着），但下标悬空这件事
       不值得赌 —— 与 buildProblem 末尾那条守卫同一个判据。 */
    if (!isEdit(tracksOf(pid)[activeTrack])) activeTrack = firstEditable(pid);
    layoutTracks(pid);               // 两块盘退回一块，剩下那块要摆回正中
    return true;
  }
  /* 判定作废：结论与参考轨道一起撤。**判定结论没有"半个"状态** —— 留着结论
     撤掉轨道，读数里那句「调试器已经把两条轨道各自停在那里了」就成了假话。 */
  function clearJudge(pid) {
    const st = pid ? S[pid] : null;
    if (!st) return false;
    const had = !!st.judge || refIndexOf(pid) >= 0;
    st.judge = null;
    if (dropRefTrack(pid) && pid === uiTab) {
      syncEditorSlots();
      towerTop = 1;
      updateFit();
    }
    return had;
  }
  /* 接上（或就地重跑）参考轨道。源码走 `prepareSource(..., wantClean=true)`：
     参考答案就是这份源码本身的挖空体，页面这里不认识任何一道题的答案。 */
  function attachRefTrack(pid, P, tk) {
    const st = S[pid];
    let ref = refIndexOf(pid) >= 0 ? st.tracks[st.tracks.length - 1] : null;
    if (!ref) {
      ref = { index: st.tracks.length, file: tk.file, role: 'reference', src: '',
              pristineSrc: '', lang: null, res: null,
              cur: D.create([]), err: null, bcache: null, ex: null, layout: null };
      st.tracks.push(ref);
    }
    ref.index = st.tracks.length - 1;
    ref.file = tk.file;
    ref.ex = null;
    const g = prepareSource(P, paramsOf(pid), tk.file, 'edit', true);
    markGenerated(ref, g);
    /* runTrack 开头把 err 清成 null，所以生成错误只能盖在它之后（同 buildProblem）。 */
    runTrack(ref, g.err ? '' : g.src, false);
    if (g.err) ref.err = g.err;
    layoutTracks(pid);
    return ref;
  }

  /* 这条轨道上那几个挖空各自在说什么（分级提示的第 1 级，也就是出题者写的
     `hint.{zh,en}`）。`pass` 那一句「这一空说的是 …」用它 —— 走 Exercise.hintAt
     而不是直接读 hint，是因为"第 1 级提示是什么"这件事归 exercise.js 定义。 */
  function blankHints(tk) {
    const bs = (tk && tk.ex && tk.ex.blanks) || [];
    const out = [];
    for (let i = 0; i < bs.length; i++) {
      try { out.push(t(Exercise.hintAt(bs[i], 1))); } catch (e) { /* 提示坏了不该毁掉判定 */ }
    }
    return out;
  }

  function stepText(n) { return n == null ? '—' : fmtInt(n); }
  /* 一条棋盘事件写成人话：`mark c3 → cut · 第 76 步`。**转义的是代入的值**
     （kind / to 来自她那份源码，可以是任何字符串），不是整句。 */
  function opText(op, L) {
    if (!op) return '<span class="dim">' + esc(t(STR.chkOpsEnd)) + '</span>';
    const fr = L ? sqToFR(op.sq, L) : null;
    const q = fr ? squareName(fr) : String(op.sq);
    return '<b>' + esc(op.kind + ' ' + q + (op.to == null ? '' : ' → ' + String(op.to))) + '</b>' +
           ' <span class="dim">· ' + esc(t(STR.chkStep).split('%S').join(fmtInt(op.step))) + '</span>';
  }

  /* 判定结论 → HTML。**存的是数据、渲染在这里**，所以切一次语言这段话就换一种
     语言，一步解释器都不用跑。
       head    状态牌上那几句（也是读数里的开头）
       detail  只在读数区展开的那几行（两边取值并排）
       cls     状态牌的类：pass → ok（绿）、fail → bad（红）、
               unknown → unk（琥珀）。**unknown 绝不用 bad** —— 见 exercise.js
               「null 不许变成布尔值」那一节。 */
  function judgeRender(pid) {
