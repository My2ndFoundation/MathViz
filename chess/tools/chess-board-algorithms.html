    const st = pid ? S[pid] : null;
    const j = st && st.judge;
    if (!j) return null;
    const her = st.tracks[j.herIndex] || null, ref = st.tracks[j.refIndex] || null;
    const herL = her ? her.layout : null, refL = ref ? ref.layout : null;
    const head = [], detail = [];

    if (j.status === 'pass') {
      head.push(applyMarkup(t(STR.chkPass)));
      const hints = blankHints(her);
      if (hints.length) {
        detail.push('<span class="dim">' + esc(t(STR.chkTeaches)) + '</span>');
        hints.forEach(function (h) { detail.push('&nbsp;&nbsp;' + esc(h)); });
      }
      return { cls: 'ok', head: head, detail: detail };
    }
    if (j.status === 'unknown') {
      head.push(applyMarkup(t(STR.chkUnknown)));
      detail.push('<span class="dim">' + applyMarkup(t(STR.chkUnknownWhy)) + '</span>');
      return { cls: 'unk', head: head, detail: detail };
    }

    head.push(applyMarkup(t(STR.chkFail)));
    const d = j.div;
    if (!d) return { cls: 'bad', head: head, detail: detail };   // judge 说 fail 必有 divergence

    if (d.kind === 'boardOps') {
      /* **只有这一种能说「分歧的那一步」。**
         但「谁先没事件了」那一支里，短的那一边没有第 N 件事、步号是 null ——
         那时候不能说「你的第 — 步」，得说「你的版本不再动棋盘了」。 */
      if (d.her == null) {
        head.push(applyMarkup(t(STR.chkOpsHerEnd), { N: fmtInt(d.opIndex), R: stepText(d.refStep) }));
      } else if (d.ref == null) {
        head.push(applyMarkup(t(STR.chkOpsRefEnd), { N: fmtInt(d.opIndex), H: stepText(d.herStep) }));
      } else {
        head.push(applyMarkup(t(STR.chkOps), {
          N: fmtInt(d.opIndex), R: stepText(d.refStep), H: stepText(d.herStep),
        }));
      }
      detail.push('&nbsp;&nbsp;<span class="dim">' + esc(t(STR.chkOpsRef)) + '</span> ' + opText(d.ref, refL));
      detail.push('&nbsp;&nbsp;<span class="dim">' + esc(t(STR.chkOpsHer)) + '</span> ' + opText(d.her, herL));
    } else if (d.kind === 'counters') {
      /* 比的是**末值**。她那边一次都没出现过时 herStep 是 null —— 那不是「值是
         null」，是「根本没有这个名字」，两句话要分开说。 */
      const missing = d.herStep == null;
      head.push(applyMarkup(t(STR.chkCount), {
        C: esc(d.ref.name),
        A: esc(D.fmtVal(d.ref.value)),
        B: missing ? '—' : esc(D.fmtVal(d.her.value)),
      }));
      if (missing) detail.push('<span class="dim">' + esc(t(STR.chkCountNone)) + '</span>');
      detail.push('<span class="dim">' + applyMarkup(t(STR.chkCountAt),
        { R: stepText(d.refStep), H: stepText(d.herStep) }) + '</span>');
    } else if (d.kind === 'result') {
      head.push(applyMarkup(t(STR.chkResult), {
        A: esc(D.fmtVal(d.ref)), B: esc(D.fmtVal(d.her)),
      }));
      /* 两边末步同号 → 换那一句（不然屏幕上是两个一样的数字，读起来像同一步）。
         `!= null` 一并挡住「两边都是 null」被当成「恰好同号」。 */
      const same = d.refStep != null && d.refStep === d.herStep;
      detail.push('<span class="dim">' + applyMarkup(t(same ? STR.chkResultAtSame : STR.chkResultAt),
        { R: stepText(d.refStep), H: stepText(d.herStep) }) + '</span>');
    } else {
      /* ⚠ **认不出来的 kind 不许被措辞成「返回值不同」。** 这一支以前是
         `else { …chkResult… }` —— exercise.js 今天只发三种 kind，可这整段的
         全部要点就是**不替 judge 说话**：多出第四种，屏幕上就会指着它说一句
         judge 从没说过的话，而且没有任何人会发现。认不出来就说认不出来。 */
      console.error('[chess-board-algorithms] judge 报了一种这一页不认识的 divergence.kind：' +
                    JSON.stringify(d.kind) + '（judgeRender 要跟着 exercise.js 一起更新）');
      head.push(applyMarkup(t(STR.chkOther), { K: esc(String(d.kind)) }));
    }
    return { cls: 'bad', head: head, detail: detail };
  }

  /* 按下 Check。**整段在 withBusy 里**：它要跑两遍解释器（她的 + 参考的），
     queens N=8 的参考版一趟就是 156,772 步。withBusy 先画一帧「正在跑解释器…」
     再去跑，所以那个停顿是有解释的。 */
  btnCheck.addEventListener('click', function () {
    if (!exerciseOn()) return;                      // 正常模式下这个按钮是隐藏的
    const err = ed.getError();
    if (err) { statusKind = 'bad'; setStatus(errText(err), 'bad'); return; }
    const P = curP(), pid = uiTab, tk = curTrack(), src = ed.getValue();
    if (!P || !tk || !pid) return;
    withBusy(function () {
      const st = S[pid];
      st.judge = null;
      /* ① 她的版本：**用编辑器里此刻的内容**重跑一遍。不能拿上一次 Run 的轨迹
         —— 她多半是改完直接按 Check 的，那条轨迹属于改之前那份源码。 */
      runTrack(tk, src, true);
      if (tk.err) {                                 // 跑不起来：说那件事，不判
        dropRefTrack(pid);
        syncEditorSlots();
        dbg.setCursor(tk.cur);
        showProblemStatus();
        return;
      }
      // ② 参考版本：同一份源码的挖空体原文（parse().clean），不是编辑器里的东西
      const ref = attachRefTrack(pid, P, tk);
      if (ref.err) {
        /* ⚠ 这四件事**跟下面 judge 抛的那一支一模一样，不能少**：`attachRefTrack`
           已经把轨道 push 进去并 layoutTracks 过了，直接 return 会在屏幕上留下
           第二块空棋盘（而且没有任何一句话解释它是什么）。今天走不到这里
           （参考版跑不起来这一页就整个是坏的），但"走不到"不该由抄漏三行的人
           来验证。 */
        dropRefTrack(pid);
        syncEditorSlots();
        statusKind = 'bad';
        setStatus(esc(t(STR.chkRefFail) + ref.err.message), 'bad');
        towerTop = 1; updateFit();
        return;
      }
      // ③ 判定。check 三个开关来自题目声明，配置写错了要大声说（judge 会抛）
      let v;
      try { v = Exercise.judge(ref.res, tk.res, P.check); }
      catch (e) {
        st.judge = null;
        dropRefTrack(pid);
        syncEditorSlots();
        statusKind = 'bad';
        setStatus(esc(t(STR.chkBad) + ((e && e.message) ? e.message : String(e))), 'bad');
        towerTop = 1; updateFit();
        return;
      }
      st.judge = { status: v.status, div: v.divergence, herSrc: src,
                   herIndex: st.tracks.indexOf(tk), refIndex: st.tracks.indexOf(ref) };
      /* ---- 记一笔：这一次判定算作**每个空**各一次尝试 ----
         判定比的是整个程序的行为，一次 Check 归不到某一个空头上（Task 7 已经
         把这件事写死在探针的 blankId 上）。所以不假装能归属：每个空各记一次。
         `pass` 意味着这道题**所有**空都对了，于是 pass 时给每个空盖一次时间戳，
         `fail`/`unknown` 时不盖 —— unknown 是"不知道"，尤其不许当成判对。
         跑不起来、判定配置炸了那两条路上根本到不了这里，也就不该记：那两次她
         什么都没被判过。 */
      const stamp = v.status === 'pass' ? Date.now() : null;
      ((tk.ex && tk.ex.blanks) || []).forEach(function (b) {
        const rec = progOf(pid, b.id);
        setProg(pid, b.id, { attempts: rec.attempts + 1, solvedAt: stamp || rec.solvedAt });
      });
      /* ④ 分歧定位：**两条轨道各自 goto**，一个游标推两条到此为止。
         `refStep` 与 `herStep` 通常不相等，各是各的（见 STR.chkOps 那一段）。
         某一侧没有对应位置时是 null —— 那一侧就不动，不拿 0 冒充。 */
      const d = v.divergence;
      if (d) {
        if (d.herStep != null) D.goto(tk.cur, d.herStep);
        if (d.refStep != null) D.goto(ref.cur, d.refStep);
      }
      syncEditorSlots();
      dbg.setCursor(tk.cur);           // 游标已经挪到位了才挂上去，只重画一次
      towerTop = 1;
      updateFit();
      showProblemStatus();
    });
  });

  /* ================= 读数 ================= */

  /* 交给每道题的 readout 的那个对象。**给的是数据与几个写法助手，不是模板**：
     每道题要说的话不一样（解的个数 / 走完了没有 / 最短距离几步），硬塞进一张
     公共表格只会让三道题都说不清自己那件事。 */
  function trackView(tk, P) {
    const c = boardAt(tk);
    const mc = markCounts(c);
    let pieceCount = 0;
    for (const k in c.pieces) pieceCount++;
    const res = tk.res;
    return {
      file: tk.file,
      /* 只读对照（练习模式下不跑的那一份）。读数里要说的话跟一条跑着的轨道
         完全不同，所以标出来，让题目自己决定怎么说 —— 别让它的一串 null 与
         0 混在真读数里冒充"跑出来的结果"。 */
      contrast: isContrast(tk),
      /* 判定时接上去的那条参考轨道。readoutApi 靠它把这条挡在题目的读数之外
         （见那里）—— 留在这里是因为 trackView 是"一条轨道长什么样"的唯一出口。 */
      reference: isReference(tk),
      trace: res ? res.trace : [],
      steps: res ? res.trace.length : null,
      truncated: !!(res && res.trace.truncated),
      /* 截断时 result 是 undefined —— 一路传成 null（不可知），绝不变成 0。 */
      result: res && res.result !== undefined ? res.result : null,
      i: tk.cur.i,
      len: tk.cur.trace.length,
      /* **惰性**：`D.output` 从第 0 步重放整条轨迹，而读数区每 120 ms 就重建一次。
         两条 200,000 步的轨迹上急切求值就是每秒扫三百多万条 Step 去数几行 log ——
         而 tourKnight 的读数根本不看它。写成 getter，谁读谁付钱。 */
      get output() { return D.output(tk.cur); },
      stackDepth: c.curDepth,
      marks: c.marks,
      pieces: c.pieces,
      markBright: mc.bright,
      markStale: mc.stale,
      pieceCount: pieceCount,
      /* 整趟跑下来棋盘上发生过的事，按种类计数（try/ok/cut/back/place/clear）。
         tourKnight 的 3×5 那一课就是拿这几个数说的：两边逐项相同，只有步数不同。 */
      ops: trackOps(tk),
      err: tk.err,
    };
  }
  function readoutApi(pid) {
    const P = PROBLEMS[pid], st = S[pid];
    /* `index` 是这条轨道在 `st.tracks` 里的下标 —— 读数里判「哪一条是活动的」
       要拿它跟 `a.active` 比，**不能拿遍历的序号比**：练习模式下题目会先把
       只读对照过滤掉，那之后遍历序号跟 activeTrack 就不是一回事了。 */
    /* ⚠ **参考轨道不进 `a.tracks`。** 每道题的 readout 都是照着「我这几条轨道」
       写的（tourKnight 遍历它们、queens 只读 `main`），判定时多出来的那一条一进去
       就会被当成第三份跑出来的结果印在读数里 —— 而且是**参考答案的解数**。
       判定要说的话由下面 readoutFor 里那一段统一说，与题目无关。
       `index` 仍然是它在 st.tracks 里的真下标（要拿它跟 a.active 比），所以先
       编号再过滤，不能反过来。 */
    const views = st.tracks.map(function (tk, k) {
      const v = trackView(tk, P);
      v.index = k;
      return v;
    }).filter(function (v) { return !v.reference; });
    return {
      tracks: views,
      main: views[0] || null,
      /* 多轨题目要说清「单步落在哪一条上」和「共用的那个游标此刻在第几步」。 */
      active: activeTrack,
      cursor: st.tracks[activeTrack] ? st.tracks[activeTrack].cur.i : 0,
      int: fmtInt, b: bval, esc: esc, t: t,
      dim: dimt,
      rule: function () { return '<span class="rule"></span>'; },
      /* 面板上的是**正文**，不是 markdown——`**…**` 在这里要变成 <b>。 */
      strong: function (s, subs) { return applyMarkup(t(s), subs); },
      note: function (s, subs) { return '<span class="dim">' + applyMarkup(t(s), subs) + '</span>'; },
      colors: { try: C_TRY, ok: C_OK, cut: C_CUT, back: C_BACK, stack: C_STACK, dim: C_DIM },
    };
  }
  /* `%K` 替换，**不碰 `**`**。给的是要塞进 textContent 的纯文本用的。
     从前这种地方一律借 applyMarkup 顺手做替换，于是 `**x**` 被换成了
     `<b>x</b>` 却又被 textContent 原样印出来 —— 今天那几句文案里恰好没有
     `**`，所以看不出来，但那是运气不是设计。要标记就走 innerHTML，要纯文本
     就走这里，别再让一句话同时是两种东西。 */
  function applySubs(s, subs) {
    let out = String(s);
    if (subs) Object.keys(subs).forEach(function (k) {
      out = out.split('%' + k).join(subs[k]);
    });
    return out;
  }
  function applyMarkup(s, subs) {
    return applySubs(String(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'), subs);
  }

  function readoutFor(pid) {
    const st = S[pid], P = PROBLEMS[pid];
    if (!st.tracks.length) return '';
    const a = readoutApi(pid);
    let html = '';
    /* readout() 抛了 → **说出来**。以前它被吞成空字符串：整块读数区凭空消失，
       而面板看起来只是「这道题没什么好说的」。 */
    try { html = P.readout(a, paramsOf(pid)) || ''; }
    catch (e) { hookFail(pid, 'readout', e); html = ''; }
    const extra = [];
    if (st.hookErr) {
      extra.push('<span class="warn">' + esc(st.hookErr) + '</span>');
    }
    /* 每一处「没画出来」都要说话。静默少画一枚后是这一页最容易犯、也最难查的错。 */
    const bad = Object.keys(tally.badPieces);
    if (bad.length) {
      extra.push('<span class="warn">' + applyMarkup(t(STR.roBadPiece),
        { N: String(bad.length), L: esc(bad.join(', ')) }) + '</span>');
    }
    if (tally.offBoard) {
      extra.push('<span class="warn">' + applyMarkup(t(STR.roOffBoard),
        { N: String(tally.offBoard) }) + '</span>');
    }
    const badK = Object.keys(tally.badKinds);
    if (badK.length) {
      extra.push('<span class="warn">mark(): ' + esc(badK.join(', ')) + '</span>');
    }
    /* 练习模式要一直看得见 —— 状态牌上那一句会被下一次 Run 盖掉，而"左边这份
       不是参考实现"是每一眼都该知道的事（否则读数上的解数对不上就成了悬案）。 */
    if (exerciseOn()) {
      extra.push('<span style="color:' + C_STACK + '">' + exerciseText(pid) + '</span>');
    }
    /* 判定结论：**两边取值并排的那几行只在这里展开**（状态牌只放开头那两句，
       它是一张两三行高的牌）。这一段与题目无关 —— 说的全是 judge 交出来的东西，
       所以写在这里而不是塞进每道题的 readout。 */
    const jr = judgeRender(pid);
    if (jr) {
      extra.push(a.rule());
      jr.head.forEach(function (h) { extra.push(h); });
      jr.detail.forEach(function (h) { extra.push(h); });
      /* 「两条轨道各走各的」要说出来：上面那句 trkSameI 刚教过"共用一个游标"，
         判定之后正相反，不说清楚就像是工具坏了。只有真的接上了参考轨道才说。 */
      if (refIndexOf(pid) >= 0) extra.push(a.note(STR.chkSplit));
    }
    extra.push(a.rule());
    extra.push(dimt(STR.roClick) + (jumpNote ? ' <span style="color:' + C_STACK + '">' + jumpNote + '</span>' : ''));
    return html + '<br>' + extra.join('<br>');
  }

  /* ================= §5.4：点棋盘任一格 → 跳到最近一次动它的那一步 ================= */

  /* 先往回找（她多半想看「它是怎么变成现在这样的」），找不到再往前找。
     整趟都没被动过就明说没被动过，不猜、不跳。 */
  function stepTouching(tk, sq) {
    const trace = tk.cur.trace, i = tk.cur.i;
    for (let k = Math.min(i, trace.length - 1); k >= 0; k--) {
      const ops = trace[k].boardOps;
      for (let m = 0; m < ops.length; m++) if (ops[m].sq === sq) return { k: k, op: ops[m] };
    }
    for (let k = i + 1; k < trace.length; k++) {
      const ops = trace[k].boardOps;
      for (let m = 0; m < ops.length; m++) if (ops[m].sq === sq) return { k: k, op: ops[m] };
    }
    return null;
  }
  function squareName(fr) { return BR.fileLabel(fr.f) + (fr.r + 1); }
  function onBoardClick(sx, sy) {
    const st = curS();
    if (!st || !st.tracks.length) return;
    /* 取景变换是屏幕空间的一次 scale+translate，所以反向定位要先把点击点换回
       未变换的坐标，再交给 unproject —— 不换的话点中的永远是另一格。 */
    const x = (sx - fit.tx) / (fit.s || 1), y = (sy - fit.ty) / (fit.s || 1);
    const C = E.makeCam();
    for (let k = 0; k < st.tracks.length; k++) {
      const tk = st.tracks[k], L = tk.layout;
      if (!L) continue;
      const hit = BR.pickSquare(C, E, [x, y], L);
      if (!hit) continue;
      const sq = hit.rank * L.files + hit.file;
      /* ⚠ **参考那块盘不跟着点走。** 它停在 `divergence.refStep` 上，而读数里刚
         写着「参考停在第 76 步」—— 让 §5.4 的反向定位把它挪走，那句话下一秒就
         成了假话。说一句就退出（静默不动跟工具坏了长得一样）。 */
      if (!isEdit(tk)) {
        jumpNote = esc(t(STR.chkRefFixed));
        return;
      }
      /* 点哪块棋盘，单步就落到哪条轨迹上（同一条时是 no-op，不会白重置游标）。 */
      setActiveTrack(k);
      const name = squareName({ f: hit.file, r: hit.rank });
      const found = stepTouching(tk, sq);
      if (!found) {
        jumpNote = esc(name + ' — ' + t(STR.roNoTouch));
        return;
      }
      D.goto(tk.cur, found.k);
      dbg.refresh();
      /* 转义的是**代入的值**（op.kind 来自她那份源码，可以是任何字符串），
         不是整句——整句转义会把文案里的标签一起打成字面量。 */
      jumpNote = applyMarkup(t(STR.roJumped),
        { S: fmtInt(found.k), K: esc(found.op.kind), Q: esc(name) });
      return;
    }
  }

  /* 点击 vs 拖拽：引擎的 bindOrbit 也在这块 canvas 上听指针事件（旋转相机），
     所以这里只认「几乎没动、也没按太久」的那一下，且**不 preventDefault**，
     旋转照常工作。 */
  (function bindBoardClick() {
    let down = null;
    canvas.addEventListener('pointerdown', function (e) {
      down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!down || down.id !== e.pointerId) { down = null; return; }
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      const held = performance.now() - down.t;
      down = null;
      if (moved > 4 || held > 500) return;
      onBoardClick(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointercancel', function () { down = null; });
  })();

  /* ================= 启动 ================= */
  /* `bootErr` 的声明在上面「每道题的运行状态」那一节，不在这里 —— 它有三个
     写在启动之前的读者。 */

  /* ---------------- 题目声明的静态字段：**在这里一次判死** ----------------

     `spanZ` 与 `sideView` 跟 `board()` / `readout()` / `zOf()` 不是一类东西：
     后者吃运行期数据（参数、标记），可以这一档对、那一档错，所以它们的判据
     只能落在每帧路径上（hookFail）；前者是**静态字面量**——要么永远对，要么
     永远错。对这一类，「每帧喊一句」既晚又吵，把整页停住才是诚实的。

     不这样做的后果都实测过、都是**完全静默**的：
       · `spanZ: '0.24'`（写成了字符串）→ spanZOf 安静回到 0.55 → 21 层的塔在
         正视下把包围盒撑到棋盘宽度的 5.71 倍，棋盘缩到看不见，状态牌还是绿的。
       · `sideView: { az: 0 }`（只覆盖一根轴）→ 一帧之后 cam.el / cam.dist 变
         NaN、proj() 全 NaN、画布整块变白，而且连按回「正视」都救不回来。
       · `sideView: { elev: 0.3 }`（键名拼错）→ 什么也不会发生，按钮点了没反应。
     三条都属于阶段 5 约束 6 点名的那一类：少给/给错一个参数要**大声**失败。

     只校验**声明了的**字段：没写就是用默认值，那是正常用法，不是错误。
     部分覆盖是合法的（viewsFor 铺在 VIEWS.side 之上），所以这里不要求写全。 */
  const SIDE_VIEW_KEYS = { az: 1, el: 1, dist: 1, tx: 1, ty: 1, tz: 1 };
  const CHECK_KEYS = { result: 1, boardOps: 1, counters: 1 };
  const EX_ROLES = { edit: 1, contrast: 1 };

  /* ---- 声明层文案的**显示宽度**上限（阶段 7 Task 6 立的第二道门）----

     `--font-*` 是等宽的这件事不成立，所以这里量的不是像素而是「显示宽度」：
     CJK / 全角一个字算 2，其余算 1。这只是一个**便宜的近似**，理由与实测都写在
     下面那道门里 —— 中英两份实测下来每单位 5.6–6.0 px，两种语言落在同一条线上，
     够用来把「长得离谱」和「正常」分开，而这正是这道门唯一要做的事。

     两个上限都是从今天的实测最长值往上留出余量、并且**必须挡得住已经发生过的
     那两次坏版面**定出来的（数字见门里的注释）。 */
  const LEGEND_LABEL_MAX = 72;
  const TRACK_LABEL_MAX = 26;
  function dispWidth(s) {
    let n = 0;
    /* for…of 走的是码点，不是 UTF-16 码元 —— 别把一个表情符号数成两个字。 */
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      n += (c >= 0x1100 && (c <= 0x115f || c === 0x2329 || c === 0x232a ||
        (c >= 0x2e80 && c <= 0xa4cf && c !== 0x303f) ||
        (c >= 0xac00 && c <= 0xd7a3) || (c >= 0xf900 && c <= 0xfaff) ||
        (c >= 0xfe30 && c <= 0xfe6f) || (c >= 0xff00 && c <= 0xff60) ||
        (c >= 0xffe0 && c <= 0xffe6))) ? 2 : 1;
    }
    return n;
  }
  /* 一条 {zh,en}（或者一个裸串）在某种语言下真的会被画出来的那段字。
     **跟 paintLegend 同一条剥标记的正则**：那里画的是 textContent，
     `<i>x</i>` 里的尖括号不会占宽度，量的时候也不该算进去。 */
  function labelTextOf(v, lang) {
    const s = (v && typeof v === 'object') ? v[lang] : v;
    return typeof s === 'string' ? s.replace(/<[^>]+>/g, '') : null;
  }

  /* 这份源码里有没有**挖空**（`// >>> BLANK id=…`）。

     读的是内联进来的模块**文本**（ALGOS），不是解析结果 —— 挖空清单要等
     `P.source(st, M, file, lang)` 生成出源码、再 `Exercise.parse` 一遍才有，而那时候
     参数、模块、轨道都还没建起来，validateDecl 跑在它们全部之前。

     ⚠ 这是一个**保守的近似**，两个方向都想清楚了：
       · 认多了（某份源码里有一条永远走不到的挖空）→ 门更早响一步，不是坏事；
       · 认少了 → 只可能发生在有人把指令写成别的形状，那时 Exercise.parse 会
         在正常模式下就当场抛（它是**正常模式也要跑**的那一步）。
     正则要认 `id=`：`tour-warnsdorff.js` 的维护者注释里就有两处裸的
     `` `// >>> BLANK` 指令 ``，只认前缀会把它们数成挖空。 */
  const BLANK_DIRECTIVE_RE = /\/\/ >>> BLANK\s+id=/;
  function fileHasBlanks(file) {
    if (typeof ALGOS !== 'object' || !ALGOS) return false;
    const src = ALGOS[file];
    return typeof src === 'string' && BLANK_DIRECTIVE_RE.test(src);
  }

  function validateDecl() {
    const has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };
    PIDS.forEach(function (pid) {
      const P = PROBLEMS[pid], at = 'PROBLEMS.' + pid + '.';

      /* ---- check：Check 比哪几样可观测行为（§2.9）----
         `exercise.js` 的 `assertCheck` 会在**按下 Check 的那一刻**把这些错抓出来，
         但那太晚了：一道 check 写错的题目在她按 Check 之前长得完全正常。这三个
         开关是静态字面量，跟 spanZ / sideView 同类 —— 在这里一次判死。 */
      const ck = P.check;
      if (!ck || typeof ck !== 'object' || Array.isArray(ck)) {
        throw new Error(at + 'check 少了或者不是一个对象 —— 每道题都必须写明 Check ' +
          '比哪几样东西 { result, boardOps, counters }，一个都没有默认值。收到 ' +
          (ck === null ? 'null' : typeof ck) + '。');
      }
      Object.keys(ck).forEach(function (k) {
        if (!CHECK_KEYS[k]) {
          throw new Error(at + 'check 里有一个认不出的键 “' + k +
            '” —— 只认 result / boardOps / counters。拼错的键会被静默忽略，' +
            '那一项于是根本没在比。');
        }
      });
      if (typeof ck.result !== 'boolean') {
        throw new Error(at + 'check.result 必须显式写成 true 或 false（不接受「真值」），收到 ' +
          (typeof ck.result) + ' ' + String(ck.result) +
          '。默认开会把不该比的题判错，默认关会把该抓的分歧放过去。');
      }
      if (typeof ck.boardOps !== 'boolean') {
        throw new Error(at + 'check.boardOps 必须显式写成 true 或 false，收到 ' +
          (typeof ck.boardOps) + ' ' + String(ck.boardOps) + '。');
      }
      if (!Array.isArray(ck.counters)) {
        throw new Error(at + 'check.counters 必须是一个数组（不比任何计数器就写 []），收到 ' +
          (typeof ck.counters) + ' ' + String(ck.counters) + '。');
      }
      ck.counters.forEach(function (nm, i) {
        if (typeof nm !== 'string' || nm === '') {
          throw new Error(at + 'check.counters[' + i + '] 不是一个非空的变量名，收到 ' +
            JSON.stringify(nm) + '。');
        }
      });
      if (ck.result === false && ck.boardOps === false && ck.counters.length === 0) {
        throw new Error(at + 'check 三项全关 —— 这样的判定永远判对，等于没判。' +
          '至少要比 result / boardOps / counters 里的一样。');
      }

      /* ---- exerciseSources：练习模式下这道题改用哪几份源码 ---- */
      if (has(P, 'exerciseSources')) {
        const xs = P.exerciseSources;
        if (!Array.isArray(xs) || !xs.length) {
          throw new Error(at + 'exerciseSources 必须是一个非空数组，每项 { file, role }，收到 ' +
            (typeof xs) + ' ' + String(xs) + '。');
        }
        const seen = Object.create(null);
        let editable = 0;
        xs.forEach(function (e, i) {
          const at2 = at + 'exerciseSources[' + i + ']';
          if (!e || typeof e !== 'object' || typeof e.file !== 'string') {
            throw new Error(at2 + ' 必须是 { file, role } 这样的对象，收到 ' + String(e) + '。');
          }
          if (P.sources.indexOf(e.file) === -1) {
            throw new Error(at2 + '.file “' + e.file + '” 不在这道题的 sources 里 —— ' +
              '只有 sources 上的文件在引导时被求值过（loadAlgo），别处来的会在生成源码时' +
              '拿到一个 undefined 模块。');
          }
          if (seen[e.file]) {
            throw new Error(at2 + '.file “' + e.file + '” 出现了两次 —— ' +
              '两块并排的编辑器装同一份源码，改哪一块都说不清。');
          }
          seen[e.file] = 1;
          if (!EX_ROLES[e.role]) {
            throw new Error(at2 + '.role 只认 “edit” 或 “contrast”，收到 ' + JSON.stringify(e.role) +
              '。认不出的角色会变成一条跑得起来却选不中的僵尸轨道 —— 它照常跑、照常占一块棋盘，' +
              '但 isEdit 只认 “edit”，于是单步 / 断点 / Run 一个都落不到它身上，而声明它的人' +
              '想要的多半正是一条可编辑轨道。');
          }
          if (e.role === 'edit') editable++;
        });
        if (!editable) {
          throw new Error(at + 'exerciseSources 里一份 role:"edit" 都没有 —— ' +
            '练习模式下这道题会变成一堆只读文本，Run 与单步都没有落点。');
        }
        /* ⚠ **一道题只能有一份可编辑源码**，这条限制是 localStorage 的键形状
           带来的，写在这里而不是等它在运行期悄悄出错：

             chess.exercise.v1.<problem>.src      一份文本
             chess.exercise.v1.<problem>.<blank>  一个空的进度

           两个键都只按题目名分。两份可编辑源码的话，前者会被两块编辑器轮流
           覆盖（后写的赢，而且不报），后者更糟 —— 挖空 id 只在**一份源码内**
           保证不重复（parse 的 seenIds），两份源码里的同名空会共用一条进度记录。
           真要做两份可编辑源码，得先把键改成按文件分，那时**换 v2 前缀、不做
           迁移**（§2.9）。 */
        if (editable > 1) {
          throw new Error(at + 'exerciseSources 里有 ' + editable + ' 份 role:"edit" —— ' +
            '今天只支持一份。练习模式的存档键（chess.exercise.v1.<题目>.src 与 ' +
            '.<挖空 id>）只按题目名分，两份可编辑源码会互相覆盖，而且挖空 id 只在' +
            '一份源码内保证不重复。要支持两份，先把键改成按文件分并换成 v2 前缀。');
        }
        if (xs.length > P.sources.length) {
          throw new Error(at + 'exerciseSources 比 sources 还长 —— 编辑器槽位是按' +
            '全页最大轨道数（MAX_TRACKS，从 sources 数出来）一次建齐的，多出来的那几条' +
            '不会有槽位显示。');
        }
      }
      if (has(P, 'spanZ')) {
        const v = P.spanZ;
        if (typeof v !== 'number' || !isFinite(v) || v <= 0) {
          throw new Error(at + 'spanZ 必须是一个大于 0 的有限数字，收到 ' +
            (typeof v) + ' ' + String(v) + '。它默默退回 ' + SPAN_Z +
            ' 会让层数多的深度塔在正视下把取景放大好几倍，棋盘缩到看不见而且什么都不报。');
        }
      }
      if (has(P, 'sideView')) {
        const sv = P.sideView;
        if (!sv || typeof sv !== 'object') {
          throw new Error(at + 'sideView 必须是一个 { az, el, dist } 这样的对象，收到 ' +
            (typeof sv) + ' ' + String(sv) + '。');
        }
        Object.keys(sv).forEach(function (k) {
          if (!SIDE_VIEW_KEYS[k]) {
            throw new Error(at + 'sideView 里有一个认不出的键 “' + k +
              '” —— 只认 az / el / dist / tx / ty / tz。拼错的键会被静默忽略，' +
              '那个视角按钮于是点了没反应，也不报错。');
          }
          const v = sv[k];
          if (typeof v !== 'number' || !isFinite(v)) {
            throw new Error(at + 'sideView.' + k + ' 必须是有限数字，收到 ' +
              (typeof v) + ' ' + String(v) + '。非数字会让相机变成 NaN、整块画布变白。');
          }
        });
      }

      /* ---- 并排多块棋盘的题目**必须自己给 `sideView`** ----

         这一条是**两次**从截图里用眼睛救回来的（阶段 5 的 `tourKnight` 一次、
         阶段 7 的 `kingDominate` 一次），而在那两次之间一道门都没有：少写一个
         **可选**字段，validateDecl 放行、check.py 放行、`node --check` 放行，
         页面照常起来、状态牌是绿的 —— 只有按下 `3` 才看得见两块棋盘严丝合缝
         叠成一块，而且叠得太整齐，第一眼像是"这一题只有一块盘"。

         为什么是必然、不是运气不好：默认的 `3` 侧视沿**世界 x 轴**看进去
         （VIEWS.side 的 az），而 layoutTracks 把并排的几块棋盘正是沿 x 轴摆开的
         —— 同一根轴，于是**"并排"这段位移在屏幕上投影为零**。三次独立的对照实验
         （都是把 kingDominate 的 sideView 删掉走默认侧视）量到的都是这一件事：
         两块盘的中心在屏幕上落到同一点，而声明 sideView 之后它们相隔两百来像素。

         **这里不写具体的像素数是有意的。** 三次量到的余数分别是 0.1 / 0.0 与
         一个一两像素的值——差别只来自量法（盘心 vs 所有格心的均值）、窗口大小和
         那一帧相机停在哪里，把其中任何一个写成"实测值"都是**伪精度**：它读起来像
         一个可复现的测量，而它不是。要判的那件事是定性的：**位移没了。**

         **只查"有没有"，不查"摆得对不对"。** 后者是取景问题（盘距、透视、
         窗口大小都掺一脚），声明层量不出来；而这道门要挡的那个失败模式
         ——"根本没想到这回事"——只用"有没有"就挡住了。 */
      if ((P.sources || []).length > 1 && !has(P, 'sideView')) {
        throw new Error(at + 'sources 有 ' + P.sources.length + ' 份（并排 ' +
          P.sources.length + ' 块棋盘），却没有声明 sideView —— 默认的 `3` 侧视' +
          '正好沿着多块棋盘并排的那根世界 x 轴看进去，**并排那段位移在屏幕上投影为零**，' +
          '几块盘的中心落到同一点、完全重合（声明 sideView 之后它们相隔两百来像素），' +
          '而且什么都不报。' +
          '照 tourKnight / kingDominate 写一个，例：sideView: { az: 0, el: -1.25, dist: 15 }。');
      }

      /* ---- 图例文案与轨道标题的**显示宽度上限** ----

         这是阶段 7 的第二个坑，同样是作者看截图才发现的（Task 5 第一版）：

           · 过长的**图例**文案把图例撑到面板底下。`.legend` 是 position:fixed
             且没有 max-width，两条 106 字的英文让它量到 594.6 px、右缘落在
             1383 px，而面板左缘在 1368 px —— 截图里第三行末尾当场被切掉。
           · 过长的**轨道标题**让并排两块盘底下的 caption 撞在一起，读成
             "…best right nowExact: try…"：`Greedy: take the best right now` /
             `Exact: try every arrangement` 量出来是 224 / 202 px，两条的半宽一相加
             就和两块盘盘心之间那点距离同一个量级 —— 而那点距离**不是一个定数**
             （随盘面档位、窗口大小与 `fit.s` 浮动，复现时量到 235–255 px，没有
             任何东西钉住它），所以这里不写余量：撞没撞是截图上看见的，余量不是。

         **这道门是一个便宜的近似，不是那两件事本身。** 那两件事都是运行期几何
         （盘距、面板左缘、窗口宽度、`--code-w` 拖到哪儿都掺一脚），而
         validateDecl 跑在第一帧之前，一个矩形都还没有。真正的运行期判据不能立在
         这里，也不该立在别处：窄窗口下 `.legend` 本来就 display:none（媒体查询
         < 900px），一条"图例右缘要在面板左缘左边"的运行期断言会在**合法**的窄
         窗口上误报。所以这里立的是声明层唯一量得出来的那样东西 —— 字有多长。
         阶段 6 给占位注释立的 `NOTE_MAX` 是同一个形状的先例。

         上限怎么来的（实测，1500×950 窗口，中英各跑一遍五道题）：

           图例：今天最长 57（en/kingDominate，319 px）· 48（zh/kingDominate，287 px）
                 → 每单位 5.6–6.0 px，中英落在同一条线上。上限 72 留 26% 余量，
                   而坏掉的那一版是 106 —— 挡得住。
           标题：今天最长 20（en/tourKnight）· 18（zh/kingDominate）
                 → 上限 26；坏掉的那两条是 31 与 28，两条都挡得住。

         `onMark` / `trackLabel` 抛出来的错**不归这道门**：前者 paintLegend 每次
         重画都会原地炸（响得很），后者 trackTitle 有 hookFail 接着。这里抛了就
         跳过长度检查，只做自己那一件事 —— 一道门只有一个失败模式，才说得清。 */
      (P.kinds || []).forEach(function (k) {
        let info = null;
        try { info = P.onMark(k); } catch (e) { return; }
        if (!info || !info.color) return;
        ['zh', 'en'].forEach(function (lang) {
          const s = labelTextOf(info.label, lang);
          if (s === null) return;
          const w = dispWidth(s);
          if (w > LEGEND_LABEL_MAX) {
            throw new Error(at + 'onMark("' + k + '").label 的 ' + lang +
              ' 那一份太长了：显示宽度 ' + w + '，上限 ' + LEGEND_LABEL_MAX +
              '（CJK 算 2）。图例是 position:fixed、没有 max-width 的，' +
              '这么长的一行会把整块图例撑到右上角面板底下，末尾几个词在屏幕上' +
              '直接看不见（实测 106 宽 → 594.6 px，右缘 1383 px 压过面板左缘 1368 px）。' +
              '把要解释的话搬到 tips 或读数里，图例只留名字。原文：' + JSON.stringify(s));
          }
        });
      });
      if (typeof P.trackLabel === 'function') {
        (P.sources || []).forEach(function (file, k) {
          let v = null;
          try { v = P.trackLabel(file, k); } catch (e) { return; }
          ['zh', 'en'].forEach(function (lang) {
            const s = labelTextOf(v, lang);
            if (s === null) return;
            const w = dispWidth(s);
            if (w > TRACK_LABEL_MAX) {
              throw new Error(at + 'trackLabel("' + file + '") 的 ' + lang +
                ' 那一份太长了：显示宽度 ' + w + '，上限 ' + TRACK_LABEL_MAX +
                '（CJK 算 2）。这行字画在每块棋盘底下、居中于盘心，' +
                '并排两块盘时两条的半宽一相加就会撞在一起，读成一句连起来的乱码' +
                '（实测 31 与 28 宽的两条 → 224 + 202 px，两条的半宽和与两块盘盘心之间' +
                '那点距离同一个量级，而那点距离随盘面与窗口浮动、没有余量可言）。' +
                '标题只写"哪一份"，"它是什么主意"归 tips。原文：' + JSON.stringify(s));
            }
          });
        });
      }

      /* ---- 一道题只能有一份**带挖空的**可编辑源码 ----

         上面 `exerciseSources` 那一段里已经有一条「只支持一份 role:"edit"」，
         但它**写在 `if (has(P,'exerciseSources'))` 里面** —— 于是完全不声明那个
         字段、又有两条可编辑轨道的题目从门旁边整个绕了过去。`kingDominate`
         就是这样一道题：`sourcesFor()` 对没声明的题目是「原样那几份**全都**
         edit」，所以它在练习模式下是**两条** role:"edit"，而那条门一次都没看它一眼。

         今天无害，明天不是：`king-greedy.js` / `king-exact.js` 里一个挖空都没有，
         于是 `restoreSrc` 的 `!g.ex.blanks.length` 当场返回、存进
         `chess.exercise.v1.kingDominate.src` 的东西根本没人读。哪天给这两份
         加上挖空，两块编辑器就会共用那一个键**互相覆盖**（后写的赢，而且不报），
         挖空 id 还只在一份源码内保证不重复。

         所以这道门数的是「**带挖空的**可编辑源码」有几份，不是「可编辑源码」
         有几份：前者才是 localStorage 那两个键真正会打架的条件，也正因如此它
         今天对 kingDominate 是放行的 —— 一道在正确的时刻才响的门，比一道
         今天就把页面停住的门有用。上面那条严格的声明侧检查**原样保留**，
         这一条只补它够不着的那一半。 */
      const effSources = has(P, 'exerciseSources')
        ? P.exerciseSources
        : (P.sources || []).map(function (f) { return { file: f, role: 'edit' }; });
      const blanky = [];
      effSources.forEach(function (e) {
        if (e && e.role === 'edit' && fileHasBlanks(e.file)) blanky.push(e.file);
      });
      if (blanky.length > 1) {
        throw new Error('PROBLEMS.' + pid + '：练习模式下会有 ' + blanky.length +
          ' 份**带挖空的**可编辑源码（' + blanky.join(' 与 ') + '）—— 今天只支持一份。' +
          '存档键 chess.exercise.v1.' + pid + '.src 与 .<挖空 id> 都只按题目名分，' +
          '两份会互相覆盖而且不报，挖空 id 也只在一份源码内保证不重复。' +
          '给这道题声明 exerciseSources，让其中一份变成 role:"contrast"' +
          '（照 tourKnight：一份 edit + 一份只读对照）；' +
          '真要两份都可编辑，先把键改成按文件分并换成 v2 前缀。');
      }
    });
  }

  try { validateDecl(); } catch (e) { bootErrKind = 'decl'; bootErr = e; }
  if (!bootErr) {
    try {
      /* ⚠ **内联进来的模块也要点名验一次。** 一对中间什么都没有的 GENERATED
         标记曾经让整块 ALGOS 悄悄不被填（inline_core.py 的 ALGOS_MARK_RE 那段
         注释记着这笔账），页面于是带着一个 undefined 的模块发布而所有门报绿。
         `Exercise` 现在是**正常模式也要用**的（剥掉 BLANK 指令那一步），
         少了它整页都不该起来。

         ⚠ **四个导出一个都不能漏查。** 从前这里只查了 `parse` 与 `noteLine`
         （引导期就要用的那两个），于是一份缺了 `judge` / `hintAt` 的内联能安然
         过引导，页面看起来完全正常 —— 直到她按下 Check 或点开提示才炸，而那时
         引导期的终局机制（状态牌锁死 / 按钮禁掉 / 帧短路）早就过去了，报出来的
         只是一句运行期 TypeError。要在这里炸，就在这里炸。 */
      if (typeof Exercise !== 'object' || !Exercise ||
          typeof Exercise.parse !== 'function' || typeof Exercise.noteLine !== 'function' ||
          typeof Exercise.judge !== 'function' || typeof Exercise.hintAt !== 'function') {
        throw new Error('Exercise 模块没有内联进来、或者少了导出（GENERATED:EXERCISE 区间是空的？）—— ' +
          '正常模式要靠 parse 把 // >>> BLANK 指令从源码里剥掉，练习模式要靠它生成占位版，' +
          '再靠 judge 做 Check、靠 hintAt 出分级提示。四个导出缺一不可。');
      }
      PIDS.forEach(function (pid) {
        PROBLEMS[pid].sources.forEach(function (file) { loadAlgo(file); });
      });
    } catch (e) { bootErrKind = 'algos'; bootErr = e; }
  }

  if (bootErr) {
    /* 引导失败是**终局**：状态牌锁死、两个按钮都禁掉、绘制循环整帧短路
       （见 frameFor）。三处缺一不可 —— 少任何一处，下一帧就会把这一页
       「治好」成一个空棋盘 + 绿色状态的正常页。 */
    statusKind = 'boot';
    paintBootFail();
    setRunDisabled(true);
    btnRevert.disabled = true;
  }

  E.init({
    canvas: canvas,
    SCENES: SCENES,
    PARAMS: PARAMS,
    TOOL: { id: 'chess-board-algorithms', title: STR.title, h1: STR.h1 },
    VERSION: VERSION,
  });

  /* 取景框的第一次计算必须排在 E.init 之后：引擎的 resize 处理器是在 init 里
     挂上的，它负责刷新 W/H/CX/CY/FOCAL，而 makeCam/proj 读的正是那几个值。 */
  if (!bootErr) {
    /* uiTab 要**先**认下来：ensureBuilt / updateFit 都经由 curS() 读它，顺序反了
       第一次取景就是空的（画面会在第一帧之后跳一下）。setUiTab() 的短路检查因此
       在第一帧上不做事——这里已经把它该做的都做了。 */
    uiTab = PIDS[0];
    activeTrack = 0;
    ensureBuilt(PIDS[0]);
    attachEditor();
    updateFit();
  }

  /* ⚠ resize 上调的是调试器的 **redraw()**，不是 refresh()。两个句柄上都有
     refresh()，语义相反：Editor 的 refresh() 是纯重绘，Debugger 的 refresh() 会把
     「这一步刚变的变量」那圈琥珀色的基线往前推并清掉选中的调用栈帧。照直觉写成
     `ed.refresh(); dbg.refresh();`，窗口一改大小就静默少闪一片，而面板看不出任何
     异常。（chess/core/debugger.js 在 refresh 导出上有一段 ⚠⚠ 注释专门记这件事。） */
  function onResize() {
    /* **窗口变小时必须重夹一次分栏宽度。** 只在拖拽里夹是不够的：存进 `--code-w`
       的是一个像素值，在 1440 的窗口上拖到 1,100 px 之后把窗口缩到 800，#split
       仍然是 1,100 px 宽，availRect() 的 w 被兜成 1，取景框把棋盘缩到看不见——
       与拖到底时一模一样的失败，只是触发方向相反。所以夹的逻辑抽成
       clampCodeWidth()，**两个调用点**：拖拽与 resize。 */
    if (codeW !== null) applyCodeWidth(codeW);
    updateFit();
    ed.refresh();
    dbg.redraw();
  }
  window.addEventListener('resize', onResize);

  /* ---- 分隔条：拖拽调宽（§5.4） ---- */
  const divider = document.getElementById('divider');
  divider.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    divider.classList.add('drag');
    const onMove = function (ev) {
      applyCodeWidth(ev.clientX);
      updateFit();                 // 可见区变了就重算取景框（不是每帧算）
    };
    const onUp = function () {
      divider.classList.remove('drag');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      ed.refresh();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  /* ---- `\` 折叠回全屏棋盘（§1.5 的承诺） ----
     编辑器有焦点时放行：那时 `\` 是一个要打进代码里的字符，不是快捷键。这与
     debugger.js 那五个调试键的取舍是同一条原则的两面——调试键在编辑器里仍然
     生效（它们不是文本），折叠键在编辑器里让位（它是文本）。 */
  window.addEventListener('keydown', function (e) {
    if (e.key !== '\\' || e.ctrlKey || e.metaKey || e.altKey) return;
    /* 焦点在**任何一块**编辑器里就放行——两块并排之后只问活动那一块是不够的
       （她可以先点右边那份、再打字，而那一下 focus 已经把活动轨道切过去了，
       但顺序反过来的窗口期真实存在）。 */
    for (let k = 0; k < slots.length; k++) {
      if (document.activeElement === slots[k].ed.textarea) return;
    }
    e.preventDefault();
    document.body.classList.toggle('folded');
    updateFit();                                    // 排在 toggle 之后：availRect 读的就是这个 class
    /* 展开之后必须让编辑器重刷一次：折叠期间面板是 display:none，编辑器量不到
       字符宽度（getBoundingClientRect 全是 0），波浪线与括号框会被跳过不画。 */
    if (!document.body.classList.contains('folded')) ed.refresh();
  });

  /* ---- 语言切换 ----
     引擎在 init() 里已经把自己的处理器挂在 #btnLang 上（它负责改 LANG、标题、
     lang 属性）。这里**再**挂一个：同一个按钮上两个监听器按注册顺序跑，引擎的
     先跑完、LANG 已经是新值，然后这里重取本页自己的文案。 */
  document.getElementById('btnLang').addEventListener('click', relabel);

  /* 图例跟着题目走：它的行就是这道题声明的那几种 mark。 */
  function paintLegend() {
    const lg = document.getElementById('legend');
    lg.textContent = '';
    const P = curP();
    if (!P) return;
    const rows = [];
    (P.kinds || []).forEach(function (k) {
      const info = P.onMark(k);
      if (info && info.color) rows.push([info.color, info.label]);
    });
    rows.push([C_STACK, STR.legTower]);
    rows.forEach(function (r) {
      const rowEl = document.createElement('div');
      const dot = document.createElement('i');
      dot.style.setProperty('--c', r[0]);
      rowEl.appendChild(dot);
      rowEl.appendChild(document.createTextNode(t(r[1]).replace(/<[^>]+>/g, '')));
      lg.appendChild(rowEl);
    });
  }
  function paintHint() {
    document.getElementById('hint').textContent = t(STR.hint);
  }

  /* ---------------- 切语言：整份源码换成新语言那一份 ----------------

     **不重跑解释器、不重建轨道。** 两种语言变体的可执行代码逐字节相同、行号
     逐行对齐（规格 §1.6，七份生成器各有一道门守着；rook-cover 上还验过更强的
     一条：29 档随机盘上两语的逐步 `Step.line` 序列与 `result` 完全相同）。所以
     手上这份轨迹在新语言下**完全有效**：`Step.line` 指的还是同一行，
     `pristine` / `answerRange` / `judge.herSrc` 的行号一个都不用动。要换的只有
     摆在她眼前的那些字。

     这比它替下来的 `retextNotes()`（逐行查表对换占位注释）**更简单**：那一版只
     换得动挖空的注释行，源码本体的注释与运行日志换不动 —— 而阶段 8 之后整份
     源码都是双语的。

     ⚠ **她改过的源码一个字都不动。** 判据跟 saveSrc 那一带用的是同一个：轨道
     现在的文本若还等于它建起来那一刻生成器吐出来的那一份（`pristineSrc`），
     说明她只是在读，静默换掉；只要不等，就原样留着，并在状态栏说明为什么没换
     （`Reset to original` 是既有的退路）。切语言不许吃掉她写了一半的答案。

     ⚠ **判定那一刻记下的源码要跟着换。** `judge.herSrc` 是拿来跟编辑器内容比
     "她改过了没有"的，不换的话下一次 syncEditorSlots 送来的新文本跟它对不上，
     判定当场作废。实测过（旧版本的浏览器验收里当场撞上）：填对了、绿色的
     「对了」，切一次语言就变回一句灰的「运行完成 · 144 步 · 返回值 0」，而她
     什么都没动。只在**真的换了**那条轨道上换，而且要求它此刻正好等于换之前
     的文本 —— 否则那句结论本来就已经不属于编辑器里这份源码了。

     ⚠ 走遍**所有**题目，不只当前这一道：别的题目的轨道也已经建好了，只是没在
     屏幕上；不换的话，她切过去看到的是上一种语言的源码，而且再也不会被刷新。
     （这一条是 retextNotes 就有的，照旧。）

     ⚠ 参考轨道（`role:'reference'`）也要换，而且要按它自己的生成方式来：
     attachRefTrack 走的是 `prepareSource(…, 'edit', wantClean=true)`（参考答案
     就是挖空体原文）。照 `tk.role` 直传会给它一份**占位版**，也就是把答案换成
     一排空 —— 下一次 Check 拿它当参考。 */
  function retextSources() {
    const lang = curLang();
    let swapped = 0, kept = 0, failed = 0;
    PIDS.forEach(function (pid) {
      const P = PROBLEMS[pid], st = S[pid], pv = paramsOf(pid);
      tracksOf(pid).forEach(function (tk, k) {
        if (tk.lang === lang) return;
        if (tk.src !== tk.pristineSrc) { kept++; return; }   // 她改过：一个字都不动
        const isRef = isReference(tk);
        const g = prepareSource(P, pv, tk.file, isRef ? 'edit' : tk.role, isRef);
        /* 生成失败：**不换、不假装换过**（lang 留在原处，下一次切语言再试一次），
           并把错误盖到这条轨道上 —— 编辑器里那份是上一种语言的，屏幕上必须有
           一句话解释这件事。 */
        if (g.err) { tk.err = g.err; failed++; return; }
        const was = tk.src;
        tk.src = g.src;
        if (tk.ex && g.ex) tk.ex = g.ex;   // 挖空清单、占位原文、注释两份，一起换新语言那一份
        if (st && st.judge && st.judge.herIndex === k && st.judge.herSrc === was) {
          st.judge.herSrc = g.src;
        }
        markGenerated(tk, g);
        swapped++;
      });
    });
    return { swapped: swapped, kept: kept, failed: failed };
  }

  function relabel() {
    btnRun.textContent = t(STR.run);
    btnRevert.textContent = t(STR.reset);
    btnCheck.textContent = t(STR.chk);
    btnCheck.title = t(STR.chkTip);
    syncCheckButton();
    paintHint();
    document.getElementById('busy').textContent = t(STR.busy);
    paintLegend();
    /* 整份源码跟着语言走 —— **不重跑解释器**，见 retextSources。 */
    const rt = retextSources();
    lastRetext = rt;                           // 探针读它（`langSwap`）
    /* 并排那几块源码的标题也是 {zh,en}，切语言要跟着重画。 */
    if (uiTab) syncEditorSlots();
    if (bootErr) paintBootFail();              // 唯一能穿过 statusLocked 的那条
    else if (statusKind === 'bad') {
      /* ⚠ 判据不能只是 curTrack().err：两条轨道时，非活动那条的错误在切语言之后
         会被这一串 if 一条也命中不了，红字于是变成一句「Ready」。编辑器自己的
         语法错优先（那是她刚打出来的），否则交给看全部轨道的那一个。 */
      const e2 = ed.getError();
      if (e2) setStatus(errText(e2), 'bad');
      else showProblemStatus();
    } else if (statusKind === 'ok' || statusKind === 'judge') showProblemStatus();
    else if (statusKind === 'busy') setStatus(t(STR.busy), 'busy');
    else setStatus(t(STR.ready), '');
    /* 「你改过的那一份没换」**接在上面那句话后面，不盖掉它**。
       ⚠ 这一条是硬的：此刻状态牌上很可能正是绿色的「对了」（她填对了一个空、
       按过 Check），而她改过源码正是"填对了"的前提 —— 两件事**必然同时发生**。
       写成 setStatus 就等于用一句旁注把判定结论抹掉，那正是 retextNotes 那个
       旧缺陷的另一种长相。statusLocked（引导失败）时一个字都不加。 */
    if (rt.kept && !statusLocked) {
      statusEl.innerHTML += '<br><span class="note">' + esc(t(STR.keptLang)) + '</span>';
    }
    if (dbg) dbg.relabel();
  }
  relabel();

  /* ================= Task 7 的浏览器验收探针 =================

     `tool` 必须是第一个字段，Task 7 每次读都要先断言它 —— 多个 agent 共用一个
     浏览器会话，本项目已经发生过一次探针落在别人页面上、读数被记到错误的文件名
     下（CLAUDE.md「并行开工纪律」第 3 条）。 */
  window.__algoProbe = function () {
    /* ⚠ 先记下 sync 之前的游标，再对齐，再读。

       为什么要对齐：「一个游标推两条轨迹」是在绘制循环里做的，而浏览器面板没被
       fronted 时 rAF 会被节流到十几秒一帧 —— 那种时候直接读，非活动轨道的 `i`
       还停在上一次绘制的位置，验收会读到一个屏幕上从未出现过的中间态。

       ⚠⚠ 但**只对齐是不行的**：`tracks[k].i` 正是验收要用来断言「一个游标推两条
       轨迹」的字段，而探针自己把那个相等制造了出来 —— 把 frameFor 里的
       syncTracks() 整个删掉，那条断言照样全绿。一条永远为真的断言不是断言。
       所以两个读数都给：`iBeforeSync` 是**绘制循环留下的**状态（要断言的是它），
       `i` 是对齐之后的一致状态（读别的字段时要的是它）；`syncedByProbe` 是这一次
       探针自己搬动了几条轨道 —— 在能正常出帧的环境里它必须是 0，那就是绘制循环
       真的在干活的证据，也是这条断言可以被证伪的地方。 */
    const pid = uiTab, st = pid ? S[pid] : null;
    const tks = st ? st.tracks : [];
    const iBefore = tks.map(function (x) { return x.cur.i; });
    if (!bootErr) syncTracks();
    let syncedByProbe = 0;
    for (let k = 0; k < tks.length; k++) if (tks[k].cur.i !== iBefore[k]) syncedByProbe++;
    const tk = tks[activeTrack] || tks[0] || null;
    const c = tk ? boardAt(tk) : null;
    const cache = dbg ? dbg.state() : null;
    const pv = pid ? paramsOf(pid) : {};
    const marks = Object.create(null), stale = Object.create(null), kinds = Object.create(null);
    if (c) {
      for (const k in c.marks) {
        const m = c.marks[k];
        marks[k] = m.kind;
        if (isStale(m, c)) stale[k] = m.kind;
        kinds[m.kind] = (kinds[m.kind] || 0) + 1;
      }
    }
    const pieces = Object.create(null);
    if (c) for (const k in c.pieces) pieces[k] = c.pieces[k];
    const L = tk && tk.layout ? tk.layout : null;
    return {
      tool: 'chess-board-algorithms',
      problem: pid,
      /* 参数一律给全（`params`），`N` 另外单列一份 —— 计划里的验收断言写的就是
         这个名字，而不是每道题都有 N。没有 N 的题目上它是 null，不是 0。 */
      params: pv,
      N: typeof pv.N === 'number' ? pv.N : null,
      track: activeTrack,
      /* 重建一共搬动过几次活动轨道（累计值，不是每次调用清零）。
         **正常模式下换参数它必须纹丝不动** —— 那正是修复轮 1 那条回归的判据：
         换一次盘面滑杆就把单步从右栏弹回左栏，光看 `track` 只能看到一个 0，
         看不出这个 0 是她自己选的还是被重建改的。 */
      activeMovedByRebuild: activeMovedByRebuild,
      /* 这次调用里探针自己搬动了几条轨道。能正常出帧的环境里必须是 0 ——
         不是 0 就说明绘制循环没在对齐（或者根本没在出帧），而不是「对齐好了」。 */
      syncedByProbe: syncedByProbe,
      /* **每条轨道各自的**步数 / 截断 / 结果 / 棋盘事件计数（Task 7 的 tourKnight
         断言全从这里读）。截断的那条 `result` 是 null —— 不可知，不是 0、不是 false。
         `ops` 是整趟跑下来的棋盘事件按种类计数：3×5 上两条轨道的 ops 应当逐项
         相同而 steps 不同，那正是这一题最锋利的一条断言。 */
      tracks: tks.map(function (x, k) {
        return { file: x.file, label: trackTitle(pid ? PROBLEMS[pid] : null, x, k),
                 /* 'edit' | 'contrast' | 'reference'。判定之后要能一眼看出哪一条
                    是参考轨道 —— 光看 file 看不出来（它跟她那条是同一份文件）。 */
                 role: x.role || 'edit',
                 /* 这条轨道手上那份源码是**哪种语言生成的**，以及她动过没有。
                    「切语言整份换掉」与「她改过的那一份原样留着」两条断言都从
                    这里读 —— 光看 chars 断不出来（两种语言的源码字符数当然不同，
                    但那不等于换的是对的那一份），而 `edited` 正是 retextSources
                    的判据本身。 */
                 lang: x.lang || null,
                 edited: x.src !== x.pristineSrc,
                 steps: x.res ? x.res.trace.length : null,
                 truncated: !!(x.res && x.res.trace.truncated),
                 result: x.res && x.res.result !== undefined ? x.res.result : null,
                 i: x.cur.i, len: x.cur.trace.length,
                 /* 绘制循环留下的原始游标（**没有**被这次探针调整过）。
                    「一个游标推两条轨迹」要断言的是这一个，不是上面那个。 */
                 iBeforeSync: iBefore[k],
                 line: D.currentLine(x.cur),
                 ops: trackOps(x),
                 boards: x.layout ? { files: x.layout.files, ranks: x.layout.ranks } : null,
                 err: x.err ? x.err.message : null };
      }),
      i: tk ? tk.cur.i : null,
      len: tk ? tk.cur.trace.length : null,
      line: cache ? cache.line : null,
      stackDepth: c ? c.curDepth : null,
      truncated: !!(tk && tk.res && tk.res.trace.truncated),
      /* 解数 = 入口程序的返回值。截断时是 null（**不可知**），绝不是 0。 */
      solutions: tk && tk.res && tk.res.result !== undefined ? tk.res.result : null,
      logged: tk ? D.output(tk.cur).length : 0,
      marks: marks,
      markKinds: kinds,
      markStale: stale,
      markBright: c ? markCounts(c).bright : 0,
      pieces: pieces,
      /* 棋子代号换算之后真的能画吗——`place(sq,"wQ")` 认不出会静默一枚都不画，
         所以把换算结果也报出来，验收不必靠眼睛。 */
      pieceCodes: (function () {
        const o = Object.create(null);
        for (const k in pieces) o[k] = pieceCode(pieces[k]);
        return o;
      })(),
      /* `boards` 数的是**真的画出来的棋盘**（有 layout 的轨道），不是轨道数 ——
         练习模式下那份只读对照是一条没有棋盘的轨道，按轨道数报就会说"两块盘"
         而画面上只有一块。 */
      board: L ? { files: L.files, ranks: L.ranks,
                   boards: tks.filter(function (x) { return !!x.layout; }).length,
                   /* 墙（`board()` 交回来的 `blocked`，就是 mask 与 drawWalls 用的
                      那一份）。没有墙的题目是 []，**不是 null** —— null 在这一页
                      是"不知道"，而"这一题没有墙"是知道的。 */
                   blocked: (tk && tk.blocked ? tk.blocked.slice() : []).sort(function (a, b) { return a - b; }),
                   /* 每一格格心此刻在屏幕上的位置（含取景变换 fit）。验收拿它去
                      **采画布像素**：「墙看得见」这件事不能只靠肉眼看截图，也不能
                      只靠"我传了 mask"这种自证。相机走 E.makeCam()，跟绘制循环
                      同一个出口；近裁剪掉的格子是 null。 */
                   px: (function () {
                     const C = E.makeCam(), o = Object.create(null);
                     for (let r = 0; r < L.ranks; r++) {
                       for (let f = 0; f < L.files; f++) {
                         const p = E.proj(C, L.squareCenter(f, r));
                         o[r * L.files + f] = p
                           ? [Math.round(fit.tx + fit.s * p[0]), Math.round(fit.ty + fit.s * p[1])]
                           : null;
                       }
                     }
                     return o;
                   })() } : null,
      towerLevels: towerTop,
      /* 界面语言，以及**最近一次 relabel 换了几份源码 / 留了几份 / 失败几份**。
         两种模式下都在（`exercise.lang` 只在练习模式里有）。启动那一次 relabel
         也算，所以从没切过语言时它是 `{swapped:0,kept:0,failed:0}` 而不是 null。

         ⚠ **名字不能叫 `lang`** —— 这个对象下面已经有一个 `lang`（报的是
         `document.documentElement.lang`，也就是 `'zh-CN'|'en'`）。同名的后一个
         会静默盖掉前一个：写成 `lang` 时探针报的是 `'zh-CN'`，而 `curLang()`
         给的是 `'zh'`，验收当场读到一个这一页从来没用过的值。 */
      langCode: curLang(),
      langSwap: lastRetext,
      spanZ: spanZOf(pid ? PROBLEMS[pid] : null),
      /* 声明式钩子（board / readout / zOf / trackLabel）抛过没有。null = 没抛过。 */
      hookError: st ? st.hookErr : null,
      /* 并排的几块编辑器此刻各自显示到第几行——「一个游标推两条轨迹」这条
         断言在浏览器里就靠它，光看棋盘看不出两边是不是真的同步了。

         ⚠ `active` **只在多轨（tracks.length > 1）时才可能为真**：syncEditorSlots
         打的是 `multi && k === activeTrack`。单轨的题目（queens / knightPath）只有
         一块编辑器，没有「哪一块是活动的」可言，所以那里它恒为 false——**不要在
         单轨上断言它为真**，那是在验收一个根本不存在的状态。要问「单步落在哪一条
         轨迹上」，读探针顶层的 `track`（= activeTrack），它在单轨上老老实实是 0。 */
      slots: slots.map(function (sl, k) {
        return { visible: !sl.wrap.classList.contains('gone'),
                 active: sl.wrap.classList.contains('active'),
                 caption: sl.cap.textContent,
                 /* 只读是靠 textarea 的 readOnly 属性做的（editor.js 一行不改），
                    所以断言也读它本身，不读我们自己记的那个 role。
                    ⚠ **在这里也留一份**（`exercise.readOnly` 之外）：那一份在退出
                    练习模式之后整个变成 null，而"退出之后那块编辑器真的解锁了"
                    恰恰是要在**练习模式之外**断言的一件事。 */
                 readOnly: !!sl.ed.textarea.readOnly,
                 chars: sl.ed.getValue().length };
      }),
      breakpoints: dbg ? Object.keys(dbg.cursor().breakpoints).map(Number).sort(function (a, b) { return a - b; }) : [],
      playing: dbg ? dbg.isPlaying() : false,
      speed: dbg ? dbg.speed() : null,
      toggles: { marks: E.state.marks !== false, stale: E.state.stale !== false,
                 tower: E.state.tower !== false, pieces: E.state.pieces !== false,
                 exercise: exerciseOn() },
      /* ---- 练习模式（§2.9）。Task 7/8/9 的验收从这里读 ----

         **没进练习模式时整段是 `null`** —— 不是 `{}`、不是 `false`：一个 `on:false`
         的对象每个字段都得再给一个"这时候算什么"的答案（blankId 是什么？status
         是什么？），而正确答案是"这时候没有这回事"，那正是 null 说的话。
         开关本身的位置读 `toggles.exercise`，编辑器锁没锁读 `slots[k].readOnly`
         —— 两者在两种模式下都在。

         判定那四个字段（**这是 Task 7 加的**）：
           blankId  她那条轨道的**挖空清单只有一项时**，那一项的 id；否则 null。
                    ⚠ 它**不是**「这次判定归到哪个挖空」，两件事差得远：它在按
                    Check 之前就有值（tourKnight 上实测 `blankId:'degree-fn'` 而
                    `status:null`），而且它跟判定结果没有任何关系。判定的归属
                    归不出来（理由见下面那段），所以这里报的只是"这条轨道上就
                    这么一个空"这件事实。
           status   'pass' | 'fail' | 'unknown'，还没按过 Check 时是 null。
                    ⚠ null（没判过）与 'unknown'（判了，但跑不完）是两回事。
           refStep / herStep  两条轨道各自停在的那一步（`judge` 报的两个步号，
                    通常不相等）。没有分歧、或某一侧没有对应位置时是 null。 */
      exercise: !exerciseOn() ? null : (function () {
        const j = st ? st.judge : null;
        const d = j ? j.div : null;
        const her = j && st.tracks[j.herIndex] ? st.tracks[j.herIndex] : (tks[activeTrack] || null);
        const hb = (her && her.ex && her.ex.blanks) || [];
        return {
          on: true,
          /* ⚠ **挖空多于一个时这里是 null，那不是偷懒，是不编造。** judge 比的是
             整个程序的行为，而占位 `fill` 本身就是一个（故意的）错答案 —— 她填对
             了其中一个空，另一个空照样在制造分歧。把某一处分歧归给某一个空，
             需要"这一行属于哪个挖空"的行号归属，而她可以往答案里加行、删行、
             改动周围。归不出来就说归不出来。
             （Task 8 的分级提示不受这件事影响：那里的归属是"她点的是哪一个空的
             提示按钮"，明确得很，跟这里不是同一个问题。） */
          blankId: hb.length === 1 ? hb[0].id : null,
          status: j ? j.status : null,
          refStep: d ? d.refStep : null,
          herStep: d ? d.herStep : null,
          /* 分歧属于哪一类：只有 'boardOps' 的两个步号是「分歧的那一步」，
             'counters' 是末次赋值处、'result' 是各自末步（见 exercise.js）。
             验收要能把这三种分开，所以报出来。 */
          kind: d ? d.kind : null,
          /* 参考轨道在 st.tracks 里的下标，没接上时是 null。「两条轨道停在不同
             步号」那条断言要拿它和 `tracks[herIndex].i` 去对。 */
          refTrack: pid && refIndexOf(pid) >= 0 ? refIndexOf(pid) : null,
          herTrack: j ? j.herIndex : null,
          lang: curLang(),
          count: pid ? blankCount(pid) : 0,
          tracks: pid ? blanksOf(pid) : [],
          /* 每块编辑器里此刻那几行占位注释的原文。「默认 EN 时那一行是短句、
             完整提示在提示面板里」这条断言光看 chars 是断不出来的，得看见字
             （Task 8 之前英文那一行 292–428 字符，横向滚十屏）。 */
          notes: slots.map(function (sl) {
            return sl.ed.getValue().split('\n').filter(function (ln) {
              return ln.indexOf('/* 在这里写 ——') >= 0 || ln.indexOf('/* Your answer here —') >= 0;
            });
          }),
          readOnly: slots.map(function (sl) { return !!sl.ed.textarea.readOnly; }),
          /* ---- Task 8：分级提示与存档 ----
             `hints` 读的是**内存那一份进度**（渲染用的就是它），`panel` 读的是
             **屏幕上真的画出来的东西**。两个都要：前者能断言"存了什么"，后者能
             断言"她看得见什么" —— 只报前者的话，把 renderExPanel 整个删掉，
             "第 3 级还在"那条断言照样全绿。 */
          hints: (function () {
            const her2 = tks[activeTrack] || null;
            const bs = (her2 && her2.ex && her2.ex.blanks) || [];
            return bs.map(function (b) {
              const rec = progOf(pid, b.id);
              return { id: b.id, level: b.level, hintLevel: rec.hintLevel,
                       attempts: rec.attempts, solvedAt: rec.solvedAt };
            });
          })(),
          panel: {
            visible: exHost.classList.contains('on'),
            rows: Array.prototype.map.call(exHost.querySelectorAll('.ex-row'), function (row) {
              const idEl = row.querySelector('.ex-id'), codeEl = row.querySelector('.ex-body.code');
              return {
                id: idEl ? idEl.textContent : null,
                stage: (function () { const s = row.querySelector('.ex-lead'); return s ? s.textContent : null; })(),
                text: Array.prototype.map.call(row.querySelectorAll('.ex-body'), function (e) {
                  return e.textContent;
                }).join('\n'),
                code: codeEl ? codeEl.textContent : null,
                buttons: Array.prototype.map.call(row.querySelectorAll('button'), function (b2) {
                  return { label: b2.textContent, disabled: !!b2.disabled };
                }),
              };
            }),
            /* 顶上那几句（恢复了 / 参数对不上 / 这个浏览器不让存）。 */
            notes: Array.prototype.map.call(exHost.children, function (el) {
              return el.classList.contains('ex-lead') ? el.textContent : null;
            }).filter(function (x) { return x !== null; }),
          },
          /* 存档层此刻的状态。`store` 是 localStorage 能不能用（隐私模式下是
             false，而功能要照常），`restore` 是这一次重建有没有把答案拿回来。 */
          store: lsAvail(),
          restore: st ? st.restore : null,
        };
      })(),
      view: { az: +E.cam.az.toFixed(4), el: +E.cam.el.toFixed(4), dist: +E.cam.dist.toFixed(3) },
      folded: document.body.classList.contains('folded'),
      busy: document.body.classList.contains('busy'),
      lang: document.documentElement.lang,
      codeWidth: Math.round(document.getElementById('split').getBoundingClientRect().width),
      avail: availRect(),
      /* 深度轴名字这一行：上一帧真的写下的字与它占的横向区间。「有没有被代码面板
         压住」「两块棋盘会不会各写一行」都要能断言，不能只靠看图。null = 没画。 */
      zName: zNameDrawn,
      fit: { s: +fit.s.toFixed(4), tx: Math.round(fit.tx), ty: Math.round(fit.ty) },
      readout: document.getElementById('readout').textContent,
      status: statusEl.textContent,
      /* 状态牌的**颜色**也要能被断言：「红色粘住了」这件事光看文字看不出来。 */
      statusClass: statusEl.className,
      statusLocked: statusLocked,
      runDisabled: !!btnRun.disabled,
      /* Check 有两种"按不了"：语法错（disabled）与正常模式（根本不显示）。
         两个都报，否则一条"按了没反应"的验收分不清是哪一种。 */
      checkDisabled: !!btnCheck.disabled,
      checkVisible: btnCheck.style.display !== 'none',
      revertDisabled: !!btnRevert.disabled,
      bootError: bootErr ? bootErr.message : null,
      version: VERSION,
    };
  };

  /* 与探针配套：手动喂一次 dt（秒），等价于绘制循环里那一次 dbg.tick()。浏览器
     面板的 rAF 会被节流到十几秒一帧，「播放按时间推进、不按帧计数」这条断言在
     那个环境里没有注入点就根本没法做。语义与真实路径完全一致：同一个 tick()、
     同一个累加器。例：__algoTick(1) 在 10 步/秒下恰好前进 10 步。 */
  window.__algoTick = function (dt) {
    /* ⚠ **少传一个参数必须大声失败**（阶段 5 硬约束 6）。这条通道原本是静默的：
       `__algoTick()` → `dbg.tick(undefined)` → `playSteps` 里的 `dt > 0 ? dt : 0`
       → 前进 0 步、不抛、返回 undefined。而 Task 7 的整个时序验收就靠这个导出：
       它安静地不动，读到的就是「按时间推进」这条断言被验证过了的假象。
       `debugger.js` 一行不改（本阶段的硬约束），所以这道门立在这里。 */
    if (arguments.length === 0) {
      throw new TypeError('__algoTick(dt) 少了参数 —— dt 的单位是秒，例：__algoTick(1)。' +
        '省略它只会静默前进 0 步。');
    }
    if (typeof dt !== 'number' || !isFinite(dt) || dt < 0) {
      throw new TypeError('__algoTick(dt) 的 dt 必须是有限的非负数字（秒），收到：' +
        (typeof dt) + ' ' + String(dt));
    }
    if (bootErr) throw new Error('这一页引导失败了，没有可推进的轨迹：' + bootErr.message);
    dbg.tick(dt);
    /* 真实路径里紧跟在 tick 之后的就是这一句（见 frameFor）——注入点也得跟着，
       否则用 __algoTick 推出来的两条轨迹只有活动那条动了。 */
    syncTracks();
  };
})();
</script>
</body>
</html>
