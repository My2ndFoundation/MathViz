\n    '',\n    {\n      zh: [\n        '/* 给每一截编号 —— 这是整道题唯一的抽象跳跃，慢一点看。',\n        '   一行从左往右扫，手里攥着「当前这一截的号」：',\n        '     碰到障碍，就把它扔掉（写成 −1），下一个空格要开一段**新的**；',\n        '     碰到空格，手里没号就领一个新号，然后把这一格记在这个号下面。',\n        '   所以**同一行里被障碍隔开的两截，是两个不同的段** —— 它们的号不一样，',\n        '   因为一辆车管不到障碍那一边去。列也照这个法子，从下往上扫一遍。 */',\n      ],\n      en: [\n        '/* Numbering the segments — the one abstract jump in this puzzle, so take it slowly.',\n        '   Scan a row left to right, holding the number of the segment you are in right now:',\n        '     hit a wall, throw it away (write −1); the next empty square opens a **new** one.',\n        '     On an empty square, take a number if you have none, and log the square under it.',\n        '   So **two stretches of one row split by a wall are two different segments**, with',\n        '   different numbers: a rook cannot reach past a wall. Columns: the same, bottom up. */',\n      ],\n    },\n    {\n      zh: [\n        'const rowSeg = [];    // rowSeg[sq]：这一格属于第几个行段',\n        'const colSeg = [];    // colSeg[sq]：这一格属于第几个列段',\n      ],\n      en: [\n        'const rowSeg = [];    // rowSeg[sq]: which row segment this square belongs to',\n        'const colSeg = [];    // colSeg[sq]: which column segment this square belongs to',\n      ],\n    },\n    'for (let i = 0; i < W * H; i = i + 1) { rowSeg.push(-1); colSeg.push(-1); }',\n    '',\n    {\n      zh: [\n        'const rowCells = [];  // rowCells[r]：第 r 个行段里的所有空格，从左到右',\n        'let nr = 0;           // 一共切出了几个行段',\n      ],\n      en: [\n        'const rowCells = [];  // rowCells[r]: every empty square of row segment r, left to right',\n        'let nr = 0;           // how many row segments the board was cut into',\n      ],\n    },\n    'for (let y = 0; y < H; y = y + 1) {',\n    {\n      zh: [\n        '  let cur = -1;       // −1 = 手里没号（刚起头，或者刚撞上障碍）',\n      ],\n      en: [\n        '  let cur = -1;       // −1 = no number in hand (just started, or just hit a wall)',\n      ],\n    },\n    '  for (let x = 0; x < W; x = x + 1) {',\n    '    const s = y * W + x;',\n    '    if (wall[s] === 1) {',\n    {\n      zh: [\n        '      cur = -1;       // 障碍把这一行截断了：下一个空格要开一段新的',\n      ],\n      en: [\n        '      cur = -1;       // a wall cuts the row here: the next empty square starts a new one',\n      ],\n    },\n    '    } else {',\n    '      if (cur < 0) { cur = nr; nr = nr + 1; rowCells.push([]); }',\n    '      rowSeg[s] = cur;',\n    '      rowCells[cur].push(s);',\n    '    }',\n    '  }',\n    '}',\n    '',\n    {\n      zh: [\n        'let nc = 0;           // 一共切出了几个列段',\n      ],\n      en: [\n        'let nc = 0;           // how many column segments the board was cut into',\n      ],\n    },\n    'for (let x = 0; x < W; x = x + 1) {',\n    '  let cur = -1;',\n    '  for (let y = 0; y < H; y = y + 1) {',\n    '    const s = y * W + x;',\n    '    if (wall[s] === 1) {',\n    '      cur = -1;',\n    '    } else {',\n    '      if (cur < 0) { cur = nc; nc = nc + 1; }',\n    '      colSeg[s] = cur;',\n    '    }',\n    '  }',\n    '}',\n    {\n      zh: [\n        'log(\"这块盘被切成了 \" + nr + \" 个行段、\" + nc + \" 个列段\");',\n      ],\n      en: [\n        'log(\"This board is cut up — row segments: \" + nr + \", column segments: \" + nc + \".\");',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 两张记录表，记「每个列段现在被哪个行段占着」。',\n        '     takenBy[c]  占着第 c 个列段的行段号；−1 = 还空着',\n        '     rookAt[c]   那一对占住之后，车具体站在哪一格',\n        '   只按列段记就够了：一辆车占的是「一个行段 + 一个列段」这么一对，',\n        '   按列段记完，行段那一头也就跟着记住了。 */',\n      ],\n      en: [\n        '/* Two lookup tables recording which row segment currently holds each column segment.',\n        '     takenBy[c]  the row segment holding column segment c; −1 = still free',\n        '     rookAt[c]   once that pair is taken, the exact square the rook stands on',\n        '   Keeping it by column segment alone is enough: a rook takes a pair, one row segment',\n        '   plus one column segment, so recording the column end records the row end as well. */',\n      ],\n    },\n    'const takenBy = [];',\n    'const rookAt = [];',\n    'for (let i = 0; i < nc; i = i + 1) { takenBy.push(-1); rookAt.push(-1); }',\n    '',\n    {\n      zh: [\n        '/* 这一趟里已经问过的列段。给每个新的行段找位子之前都要清零 ——',\n        '   不清零，上一趟问过的列段这一趟就再也不会被问；',\n        '   而在同一趟里问过的绝不能再问第二次，否则会绕圈子绕不出来。 */',\n      ],\n      en: [\n        '/* Column segments already asked on this pass. Cleared before each new row segment goes',\n        '   looking for a seat — without clearing, a column asked last pass would never be asked',\n        '   again; and asking one twice on the same pass sends the search round in circles. */',\n      ],\n    },\n    'const asked = [];',\n    'for (let i = 0; i < nc; i = i + 1) { asked.push(0); }',\n    '',\n    {\n      zh: [\n        '/* 给第 r 个行段找一个列段坐下。坐下了返回 true。',\n        '',\n        '   分两趟看这一段上的每个空格：',\n        '     第一趟 —— 有没有哪一格，它的列段**还空着**？有就直接坐下，谁也不惊动。',\n        '     第二趟 —— 都被占了。那就挑一个，去请占着它的那个行段挪窝：那个行段',\n        '                自己再去找别的列段（这就是递归）。它要是挪成了，这个列段',\n        '                就腾出来了 —— 原来站在这儿的车退下来，我这一辆站上去。',\n        '',\n        '   第二趟这一串「我要这个列段 → 占它的那位挪去别处 → 别处又腾出来……」，',\n        '   在棋盘上看就是一条**横一段、竖一段交替走**的路。它有个名字叫增广路：',\n        '   走通一次，站住的车就正好多一辆（中间那些车只是换了格子，没有多也没有少）。',\n        '   左边调用栈叠了几帧，右边这条路就交替走了几个来回。 */',\n      ],\n      en: [\n        '/* Find a column segment for row segment r to sit on. Returns true once it has sat down.',\n        '',\n        '   Every empty square of this segment gets looked at twice, in two passes:',\n        '     Pass one — any square whose column segment is **still free**? Sit down; nobody moves.',\n        '     Pass two — all taken. Pick one and ask the row segment holding it to move house: it',\n        '                goes off to find a column segment of its own (that is the recursion). If',\n        '                it moves, this column frees up — that rook steps down and mine steps up.',\n        '',\n        '   That pass-two chain (I want this column → its holder moves away → that frees a seat →',\n        '   ...) is, on the board, a path alternating **one row segment, one column segment**. Its',\n        '   name is an augmenting path: walk one and exactly one more rook stands (the ones in',\n        '   between only changed squares). Frames on the left = round trips on the right. */',\n      ],\n    },\n    'function walk(r) {',\n    '  const cells = rowCells[r];',\n    '  for (let i = 0; i < cells.length; i = i + 1) {',\n    '    const s = cells[i];',\n    '    const c = colSeg[s];',\n    {\n      zh: [\n        '    mark(s, \"try\");         // 正在试这一格',\n      ],\n      en: [\n        '    mark(s, \"try\");         // trying this square right now',\n      ],\n    },\n    '    if (takenBy[c] < 0) {',\n    {\n      zh: [\n        '      // 这个列段还空着 —— 一步到位，车就摆在这儿。',\n      ],\n      en: [\n        '      // This column segment is still free — one step and the rook goes right here.',\n      ],\n    },\n    '      takenBy[c] = r;',\n    '      rookAt[c] = s;',\n    '      mark(s, \"ok\");',\n    '      place(s, \"wR\");',\n    '      return true;',\n    '    }',\n    '  }',\n    '  for (let i = 0; i < cells.length; i = i + 1) {',\n    '    const s = cells[i];',\n    '    const c = colSeg[s];',\n    '    mark(s, \"try\");',\n    '    if (asked[c] === 1) {',\n    {\n      zh: [\n        '      mark(s, \"cut\");       // 这个列段这一趟已经问过了，再问只会绕圈',\n      ],\n      en: [\n        '      mark(s, \"cut\");       // this column was already asked this pass; asking again loops',\n      ],\n    },\n    '    } else {',\n    {\n      zh: [\n        '      asked[c] = 1;         // 先记下「问过了」，再去问 —— 顺序反了就会绕圈',\n      ],\n      en: [\n        '      asked[c] = 1;         // mark it asked before asking — the other order loops',\n      ],\n    },\n    '      if (walk(takenBy[c])) {',\n    {\n      zh: [\n        '        /* 占着这个列段的那位挪走了，而且它已经在别处站好了自己那辆车。',\n        '           把原来站在这儿的车请下来，换我这一辆站上去。',\n        '           注意这里**没有谁被撤销**：退下来的那辆车只是换了个格子。 */',\n      ],\n      en: [\n        '        /* The row segment holding this column moved away, and already has its own rook',\n        '           standing somewhere else. So the rook that was here steps down, mine steps up.',\n        '           Note that **nothing is being undone**: that rook only changed squares. */',\n      ],\n    },\n    '        const old = rookAt[c];',\n    '        mark(old, \"back\");',\n    '        clear(old);',\n    '        takenBy[c] = r;',\n    '        rookAt[c] = s;',\n    '        mark(s, \"ok\");',\n    '        place(s, \"wR\");',\n    '        return true;',\n    '      } else {',\n    {\n      zh: [\n        '        mark(s, \"cut\");     // 这条路走不通：那位挪不动。换下一个列段试',\n      ],\n      en: [\n        '        mark(s, \"cut\");     // dead end: that one cannot move. Try the next column segment',\n      ],\n    },\n    '      }',\n    '    }',\n    '  }',\n    {\n      zh: [\n        '  return false;             // 每个列段都试过了 —— 这个行段这一趟没位子',\n      ],\n      en: [\n        '  return false;             // every column tried — no seat for this row segment this pass',\n      ],\n    },\n    '}',\n    '',\n    {\n      zh: [\n        '/* 一个行段一个行段地来，每一趟都从「把问过的记号清零」开始。',\n        '   跑完之后 rooks 里就是答案：既是「最多能摆几辆互相吃不到的车」，',\n        '   也是「盖住所有空格最少要点亮几截」。 */',\n      ],\n      en: [\n        '/* One row segment at a time, each pass starting by clearing the asked marks.',\n        '   When it finishes, rooks holds the answer: it is both \"at most how many rooks can stand',\n        '   without capturing\" and \"how few line segments it takes to cover every empty square\". */',\n      ],\n    },\n    'let rooks = 0;',\n    'for (let r = 0; r < nr; r = r + 1) {',\n    '  for (let i = 0; i < nc; i = i + 1) { asked[i] = 0; }',\n    '  if (walk(r)) {',\n    '    rooks = rooks + 1;',\n    {\n      zh: [\n        '    log(\"第 \" + rooks + \" 辆车站住了（第 \" + r + \" 个行段找到了自己的列段）\");',\n      ],\n      en: [\n        '    log(\"Rook no. \" + rooks + \" stands (row segment \" + r + \" found its column segment)\");',\n      ],\n    },\n    '  }',\n    '}',\n    'return rooks;',\n  ];\n\n  /* source({ W, H, blocked, lang }) → string\n\n     四个参数都不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数已经\n     是本仓库抓到过八次的缺陷类）。一个默默变成 8 的 W 会让界面写着 6、跑的却是\n     8，正是这个工具最不能出的错；而一个默默变成 `[]` 的 blocked 更糟 ——\n     空盘是这道题的**假题**（答案恒等于 min(W, H)，匹配根本没上场），\n     悄悄退化成假题的演示教不了任何东西。`lang` 同理：这个工具**默认英文界面**，\n     一个默默变成 'zh' 的 lang 就是让英文使用者读一份中文源码。\n\n     **自身那三个参数的校验仍在最前，`lang` 由 render() 在最后校验**，而这个\n     顺序**是有门守着的**：`rook-cover.test.js` 的「缺参数当场抛」那一组\n     **一个 lang 都不传**，并且每条都带第三参 pattern（`/少了 W/`、\n     `/少了 blocked/` …）。把 lang 的校验挪到 W 前面来，那一组当场红 ——\n     撞上的会变成「少了 lang」，pattern 对不上。\n\n     校验只管「是不是一块合法的盘、障碍是不是都落在盘上」，**不管盘上还剩不剩\n     空格**：整块盘都是障碍要照常吐出源码（答案 0），那是一条要跑给她看的边界。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.W === undefined || o.W === null) {\n      throw new Error('source({ W, H, blocked }) 少了 W —— 棋盘宽度没有默认值，必须写明');\n    }\n    if (o.H === undefined || o.H === null) {\n      throw new Error('source({ W, H, blocked }) 少了 H —— 棋盘高度没有默认值，必须写明');\n    }\n    if (o.blocked === undefined || o.blocked === null) {\n      throw new Error('source({ W, H, blocked }) 少了 blocked —— 障碍格没有默认值，必须写明；' +\n                      '空盘请显式传 []（那是这道题的假题，要写出来才算数）');\n    }\n    const W = o.W, H = o.H, blocked = o.blocked;\n    if (typeof W !== 'number' || !isFinite(W) || Math.floor(W) !== W || W < 1) {\n      throw new Error('W 必须是 >= 1 的整数，收到：' + W);\n    }\n    if (typeof H !== 'number' || !isFinite(H) || Math.floor(H) !== H || H < 1) {\n      throw new Error('H 必须是 >= 1 的整数，收到：' + H);\n    }\n    if (!Array.isArray(blocked)) {\n      throw new Error('blocked 必须是一个数组（障碍格编号），收到：' + typeof blocked);\n    }\n    for (let i = 0; i < blocked.length; i++) {\n      const s = blocked[i];\n      if (typeof s !== 'number' || !isFinite(s) || Math.floor(s) !== s || s < 0 || s >= W * H) {\n        throw new Error('blocked 里的格子必须是 0 到 ' + (W * H - 1) + ' 之间的整数，收到：' + s);\n      }\n    }\n    return render(HEAD, o.lang)\n      .concat([\n        'const W = ' + W + ';',\n        'const H = ' + H + ';',\n        'const BLOCKED = [' + blocked.join(', ') + '];',\n      ])\n      .concat(render(BODY, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source };\n});\n",
  'king-greedy.js': "/* 带障碍盘上「最少的王支配所有空格」的**贪心**算法源码生成器（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `knight-path.js` / `tour-*.js` / `rook-cover.js` 是同一个形状：\n   这个模块本身不算任何东西 —— 它吐出一段**字符串**。那段字符串同时是喂给\n   `Interp.run` 去真跑的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份源码。\n   一份字符串两个用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- 这一份和 `king-exact.js` 是一对，不是两个工具 ----\n\n   规格 §4⑤ 的落点是「同一个问题、同一块盘、两份可以逐行对比的源码」并排显示：\n   一个 `PROBLEMS` 键、两条轨道，不是两个 tab。两份共用的那一整段\n   （建墙表、列空格、建覆盖表、`seen`/`left`、`put()`）**逐字节相同**，\n   两条横线之间的东西一个字都不许差：\n\n     '/* ===== 从这里到下面那条分水岭为止，两份源码逐字相同 ===== *' + '/'\n     '/* ===== 分水岭：从这里往下两份不一样了 —— 差的就是「挑哪个王」 ===== *' + '/'\n\n   横线本身也是生成源码的一部分，摆在她眼前 —— 并排看的时候，上半截逐行\n   对得上，横线以下才开始分岔。`king.test.js` 有一道门逐字节比这一段。\n\n   **改动共用文本必须同步改 `king-exact.js`。**\n\n   ---- 阶段 5 那道「逐行子序列」的门在这里**不适用**（这一条要写下来）----\n\n   `tour-dfs` / `tour-warnsdorff` 那一对有一道机器门：剥掉注释与空行之后，\n   朴素那份的每一行必须**按原顺序**出现在 Warnsdorff 那份里。那道门成立的\n   前提是两份是**包含关系** —— Warnsdorff 就是朴素回溯多插了一个 `degree()`\n   和一段排序，别的一个字没动。\n\n   这一对不是包含关系，而且**两个方向都不是**：\n     · 贪心有 `bestGain` 那段擂台（谁新照顾到的格子多谁上），精确没有；\n     · 精确有 `take()`（把王收回去）、有 `limit`、有外面那圈迭代加深的\n       while 循环，贪心一个都没有。\n   硬套那道门只会得到一条恒红的断言；要让它绿就得把两份写成一份，\n   那就没有两个算法了。所以这里换成一道**方向正确的**门：共用段逐字节相同，\n   横线以下必须真的分岔（`king.test.js` 里那一节两头都钉着）。\n   两道门守的是同一件事 —— 她把两边一 diff，diff 出来的正好是那个主意本身。\n\n   ---- 这道题的落点：**为什么现实里要用贪心** ----\n\n   前面五个工具都在讲「算法怎么跑」。这一题的第四档讲的是另一件事：\n   7×7 上精确解**跑不完**，而贪心一眨眼给出 8。于是我们并不知道 8 是不是最优 ——\n   **`null` 是「不知道」，绝不许在任何一处变成数字**（工具⑤ 全页的规矩，\n   阶段 6 为这类情形建了整套 `unknown` 通道，照它的既有呈现）。\n\n   顺带一条实测，它订正了规格原写的「差距可见」：**矩形空盘上两份完全相同**\n   （4×4 / 5×5 / 5×6 / 6×6 / 6×7 / 7×7 / 7×8 / 8×8 八种全同，8×8 都是 9）。\n   空盘上王的结构太规整，贪心自然挑中 3×3 块的中心，那恰好最优。\n   **差距只在有墙的时候才出现** —— 所以四档盘里没有一块空盘。\n\n   **但「墙越多贪心越吃亏」是错的**（这一条写下来，因为生成源码里一度就是\n   这么写给读者的，被自己的四档数据证伪：7 堵墙那档差距 2，3 堵墙的\n   `[1,4,24]` 差距 4）。6×6 上按墙数各随机采 40 块，实测平均差距：\n\n     墙数    0     2     3     5     7     9    12\n     平均  0.00  0.78  0.72  0.88  1.05  0.68  0.55\n     最大    0     2     3     2     3     3     2\n\n   差距在「没有墙 → 有墙」之间跳一次，之后**基本持平，墙很多时反而回落**\n   （墙一多，空格连成的块本身就小了，贪心不容易挑错）。\n   决定吃多大亏的是**墙摆在哪儿**，不是摆了几堵。\n\n   顺带一条给下一个挑档的人：`[1,4,24]` 的差距 **4** 比上面 280 块随机盘里\n   的最大值（3）还大 —— 它是**特意挑出来的极端档**，不是典型盘。\n   四档要的是把现象演清楚，不是给出平均值；但别把它当成「6×6 上常见如此」。\n\n   ---- 几处必须写下来的约定 ----\n\n   · **入口函数叫 `cover`，两份同名同义**（对应将来 `PROBLEMS.kingDominate.entry`，\n     一个名字两条轨道共用）：`cover(n)` = 「已经摆了 n 个王，接着往下摆」。\n     它是**递归**那一个，不是外壳 —— `TreeModel.build(trace, 'cover')` 认到的\n     帧要一层套一层，§1.4 的「z 轴 = 入口函数的递归深度」才立得起来。\n     两条轨道上那根轴因此是同一个意思：**已经摆了几个王**。\n     顶层是 `const kings = cover(0); … return kings;`，所以 `run().result`\n     就是贪心用掉的王数。\n\n   · **王的九宫不管墙**：王是跨格照顾的，中间隔着什么都一样 —— 挨着就是挨着。\n     这跟 `rook-cover.js` 里「车撞上障碍就停」正好相反，别把那条搬过来。\n     墙本身**不需要被照顾**（照顾的是空格），王也**站不上**墙。\n\n   · **覆盖表是对称的**：s 照顾得到 t，t 也照顾得到 s（「挨着」是相互的）。\n     精确那一份整个搜索都架在这条上面 —— 能照顾到某一格的王，只可能站在\n     那一格的九宫里，于是候选最多九个。共用段里那句注释就是为它写的。\n\n   · **格子编号 `sq = 行 * W + 列`**，行 0 在棋盘最下面、列 0 在最左边，\n     于是 0 号格是 a1 —— 跟 `queens.js` / `knight-path.js` / `tour-*.js` /\n     `rook-cover.js`、`BoardRender.layout()` 的 `squareCenter(file, rank)`、\n     `chess-core.js` 的 `SQ(file, rank)` 同向。\n     反推是 `列 = sq % W; 行 = (sq - 列) / W`。**盘可以不是正方形**\n     （`W` 与 `H` 分开给），照 `rook-cover.js` 的先例。\n\n   · **宿主桥接**：这一份只用三种 mark，**没有 'back'，而这正是它的性格**：\n       'try'  正在掂量这一格能新照顾到几格\n       'cut'  比不过擂主，出局（老擂主被顶下去时也吃这一记）\n       'ok'   这一格上真的摆一个王 —— 紧跟着 `place(sq, \"wK\")`\n     **贪心从不反悔**，所以一次 `clear` 都不会发生，'back' 一次都不出现。\n     精确那一份反过来：它没有 'cut'（不淘汰任何候选，每一个都真的摆上去试），\n     只有 try / ok / back。少的那一种 mark 本身就是一句话 —— 同一条先例见\n     `knight-path.js` 的文件头（BFS 从不反悔）。`king.test.js` 两头都钉着。\n\n   · **`place(sq, \"wK\")` 是「数字格子 + 字符串棋子」**，跟 `queens.js` 的\n     `\"wQ\"`、`rook-cover.js` 的 `\"wR\"` 同一个约定。`BoardRender.drawPiece`\n     吃的是**数字** code，'wK' → code 的换算归页面做（见 `queens.js` 文件头\n     那一整段，含仓库里 `tools/_debugger-preview.html` 那个两个参数正好相反\n     的反例）。\n\n   · **并列时取编号小的那一格，这是算法的一部分，不是实现细节。**\n     写下来是因为它被验过一次：把扫描序倒过来（同样是「挑最划算的」），\n     6×6 `[6,24,35]` 上贪心从 **6** 变成 **5**，6×6 `[1,4,24]` 上从 **8** 变成\n     **5** —— 换了序就是另一个算法，两档的教学内容（差距 2 与差距 4）也就没了。\n     `king.test.js` 的宿主侧参照因此**不换扫描序**，它的独立性靠\n     「按几何现算 vs 查覆盖表」拿到。\n     （这是对简报「贪心用不同的扫描序」那句话的一处订正。精确那一份反过来：\n     换序不影响答案，所以它的参照**换了**目标格与候选的顺序。）\n\n   · 子集约束（规格 §2.6）：**没有三元运算符**，`a ? b : c` 会抛 unsupported，\n     一律展开成 if/else；数组只有 `push` / `pop` 与下标读写和 `length`\n     （`covers` 是数组的数组，`covers[s].push(t)` 走的是同一条路，合法）。\n\n   ---- 实测（`Interp.STEP_LIMIT` = 200,000）----\n\n   见 `king-exact.js` 文件头那张表 —— 四档的两边数字放在一起才读得懂，\n   所以只在那一份里写一次（**第三档换过一次**，理由也在那里）。\n   这一份要记住的只有一句：**贪心四档全部跑得完**，四档分别 3,983 / 8,154 /\n   9,625 / 13,578 步，最贵的一档只占 200,000 上限的 6.8%。 */\n(function (root, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else root.AlgoKingGreedy = factory();\n})(typeof self !== 'undefined' ? self : this, function () {\n  'use strict';\n\n  /* ================= 双语渲染（规格 §1.6 / §7.5）=================\n\n     ⚠ **这一整段在七份 algos/*.js 里逐字节相同**，check.py 的\n     bilingual_algos_check() 会核对。改这里就得七份一起改。\n     不抽成共用模块，是因为这些文件是被 inline_core.py 当**字符串**逐份\n     内联、再各自求值成 AlgoXxx 全局的 —— 抽出去就凭空多一条求值顺序\n     依赖，而那类缺陷要到浏览器里 ALGOS['queens.js'] 是 undefined 才发作\n     （阶段 5 建页当天撞过一次）。七份重复 + 一道字节级门，是阶段 7\n     king-greedy / king-exact 共用段用过的同一个套路。\n\n     `parts` 的元素只有两种：\n       字符串                 —— 一行，两种语言下逐字相同\n                                 （代码、空行、// >>> BLANK 指令行）\n       { zh: [], en: [] }     —— 一段散文，两边都是**行数组**\n\n     **两边行数必须相等**，不是洁癖：生成的源码是按行索引的 —— 解释器\n     每一步记 line，第 4 级提示靠 pristine 与编辑器逐行对齐划出 answerRange，\n     判定靠 judge.herSrc 比对。行数一差，切一次语言这四样同时指错地方。\n     行数一对齐，轨迹在两种语言下逐字节相同，切语言就只是换掉编辑器里的\n     文本，不重跑解释器。\n\n     BLANK 指令行**不翻译**：它本来就同时带着 hint 与 hintEn，两种语言\n     变体里那一行逐字相同，parse() 一点不用改。所以它是**字符串**片段。 */\n  function render(parts, lang) {\n    if (lang === undefined || lang === null) {\n      throw new Error(\n        'source({ lang }) 少了 lang —— 源码的注释与日志要用哪种语言没有' +\n        '默认值，必须写明 \"zh\" 或 \"en\"（默认成任何一种，都是让同一个缺陷' +\n        '换个地方复活）'\n      );\n    }\n    if (lang !== 'zh' && lang !== 'en') {\n      throw new Error('source({ lang }) 的 lang 只认 \"zh\" 或 \"en\"，收到：' +\n                      JSON.stringify(lang));\n    }\n    const out = [];\n    for (let i = 0; i < parts.length; i = i + 1) {\n      const p = parts[i];\n      if (typeof p === 'string') { out.push(p); continue; }\n      if (!p || !Array.isArray(p.zh) || !Array.isArray(p.en)) {\n        throw new Error('第 ' + i + ' 个片段既不是字符串、也不是 ' +\n                        '{ zh: [], en: [] }');\n      }\n      if (p.zh.length !== p.en.length) {\n        throw new Error(\n          '第 ' + i + ' 个片段两种语言行数不等：zh ' + p.zh.length + ' 行 / en ' +\n          p.en.length + ' 行 —— 生成的源码按行索引，行数一差，切一次语言 ' +\n          'Step.line / pristine / answerRange / judge.herSrc 同时指错地方' +\n          '（规格 §1.6）'\n        );\n      }\n      const lines = p[lang];\n      for (let j = 0; j < lines.length; j = j + 1) out.push(lines[j]);\n    }\n    return out;\n  }\n\n  /* 普通字符串拼，不用模板字面量：这段文本本身会被原样贴进 html，\n     反引号在那个上下文里比在这里更容易出事（照抄 queens.js 的理由）。\n\n     元素两种：字符串（代码 / 空行，两语逐字相同）与 `{ zh: [], en: [] }`\n     （一段散文，两边行数必须相等）—— 见上面 render()。这一份**一个挖空\n     都没有**，所以没有 BLANK 指令行那一类。\n     英文不是逐句直译，是照中文那一版的意思与语气重写的，行数对齐落在\n     「段」上：段内句子怎么重组都行，段的行数必须一样。\n\n     ⚠ **英文里也不许说「贪心那个数是最优的」**（这道题的落点见文件头）：\n     第四档 7×7 上精确解撞上限，贪心给出 8，工具**没有证明**它最优。\n     这一份英文自己那句是 `it does not promise the fewest`，否定式。 */\n\n  /* ==== 以下 HEAD 与 king-exact.js 的 HEAD **行数相同**，\n     只有第 1 行的标题和第 9–10 行讲「这一份 / 另一份」的两行不同 ——\n     **两种语言下都得如此**：`king.test.js` 那道 headDiff 门（只许第 1/9/10\n     行不同）阶段 8 起两种语言各跑一次，英文漏改一份会当场红。 ==== */\n  const HEAD = [\n    {\n      zh: [\n        '/* ============ 王的支配集 · 贪心 ============',\n        '   王走一步能到旁边八个格子里的任何一个。所以一个王站在某一格上，连同它',\n        '   自己站的这一格，一共「照顾」到九格 —— 围着它的一个九宫。',\n        '   （靠边、靠角的时候九宫会缺一块，出界的那几格不算。）',\n        '',\n        '   盘上有些格子是墙：墙上站不了王，也不用照顾墙 —— 要照顾的是所有空格。',\n        '   题目是：**最少要几个王，才能让每一个空格都被照顾到？**',\n        '',\n        '   这一份：**每一步都挑当下最划算的那一格**，挑完就定，绝不反悔（这叫贪心）。',\n        '   另一份：把所有摆法都试一遍，一个不漏，所以它说得出「最少」（那叫精确解）。',\n        '',\n        '   格子编号：sq = 行 * W + 列。第 0 行是棋盘最下面那一行，第 0 列是最左边',\n        '   那一列 —— 于是 0 号格就是国际象棋里的 a1。',\n        '   要反推回去：列 = sq % W，行 = (sq - 列) / W。 */',\n      ],\n      en: [\n        '/* ============ King Domination · Greedy ============',\n        '   A king steps one square to any of the eight around it. So a king standing somewhere',\n        '   \"looks after\" nine squares, its own included — a 3×3 block centred on where it stands.',\n        '   (Along an edge or in a corner that block is clipped: squares off the board do not count.)',\n        '',\n        '   Some squares are walls: no king stands on a wall, and no wall needs looking after —',\n        '   the empty squares do. **How few kings can look after all of them at once?**',\n        '',\n        '   This one: **take the square that pays off most right now**, and never take it back (greed).',\n        '   The other one: try every arrangement, missing none, so it can say \"fewest\" (exact search).',\n        '',\n        '   Squares are numbered sq = row * W + column. Row 0 is the bottom row of the board and',\n        '   column 0 is the leftmost one — so square 0 is a1 in chess.',\n        '   To go the other way: column = sq % W, row = (sq - column) / W. */',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 棋盘的宽和高，以及墙在哪儿 —— 这道题的全部旋钮。',\n        '   把 BLOCKED 清空试试：**空盘上两份给出的数一模一样**（4×4 到 8×8 八种',\n        '   尺寸实测全同）。空盘上王的位置太规整，贪心随手就挑中最优的那几格。',\n        '   差距只在有墙的时候才出现，而且看的是**墙摆在哪儿**，不是摆了几堵 ——',\n        '   同样是 6×6、同样三堵墙，只把墙挪个位置，贪心就从 6 个变成 8 个。 */',\n      ],\n      en: [\n        '/* The width and height of the board, and where the walls are — every knob this puzzle has.',\n        '   Try emptying BLOCKED: **on a bare board the two give exactly the same number** (measured',\n        '   on all eight sizes from 4×4 to 8×8). Kings sit too regularly there, so greed picks the',\n        '   best squares by accident. A gap shows up only with walls, and what counts is not how many',\n        '   there are but **where they sit**: same 6×6, three walls moved, and greed goes 6 to 8. */',\n      ],\n    },\n  ];\n\n  /* ==== 以下 COMMON 与 king-exact.js 的 COMMON **逐字节相同** ====\n     king.test.js 有一道门比这一段（两条横线之间，含横线本身），\n     阶段 8 起**两种语言各比一次** —— 只改一份的英文，那道门当场红。\n     改这里必须同步改那一份，中英两边都是。\n\n     ⚠ 两条横线本身是注释，所以它们跟着语言换文本；`king.test.js` 里的\n     MARKS 表存着两语各自的那两条，对不上就是「找不到横线」当场红。 */\n  const COMMON = [\n    '',\n    {\n      zh: [\n        '/* ===== 从这里到下面那条分水岭为止，两份源码逐字相同 ===== */',\n      ],\n      en: [\n        '/* ===== From here down to the divide below, the two sources read word for word alike ===== */',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 哪些格子是墙。wall[sq] = 1 就是墙 —— 王站不上去，也不用照顾它。 */',\n      ],\n      en: [\n        '/* Which squares are walls. wall[sq] = 1 is a wall: no king on it, and none looks after it. */',\n      ],\n    },\n    'const wall = [];',\n    'for (let i = 0; i < W * H; i = i + 1) { wall.push(0); }',\n    'for (let i = 0; i < BLOCKED.length; i = i + 1) { wall[BLOCKED[i]] = 1; }',\n    '',\n    {\n      zh: [\n        '/* 盘上所有的空格。要照顾到的就是这些格子，一个都不能漏。 */',\n      ],\n      en: [\n        '/* Every empty square on the board. These are the ones to look after; none may be missed. */',\n      ],\n    },\n    'const empty = [];',\n    'for (let s = 0; s < W * H; s = s + 1) {',\n    '  if (wall[s] === 0) { empty.push(s); }',\n    '}',\n    {\n      zh: [\n        'log(\"这块盘上有 \" + empty.length + \" 个空格要照顾\");',\n      ],\n      en: [\n        'log(\"Empty squares on this board to look after: \" + empty.length + \".\");',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 覆盖表：covers[s] 就是「一个王站在 s 上，能照顾到哪些空格」。',\n        '   王往八个方向各走一格，再加上它自己站的这一格 —— 一共九格，围成一个九宫。',\n        '   出界的不算，墙也不算（墙不用照顾）。所以边上、角上的九宫会缺一块。',\n      ],\n      en: [\n        '/* The cover table: covers[s] is \"which empty squares a king standing on s looks after\".',\n        '   Eight steps out plus its own square: nine in all, a 3×3 block. Squares off the board',\n        '   do not count, nor do walls (none needs looking after), so edges and corners are clipped.',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '   **王的九宫不管墙挡不挡**：挨着就是挨着，中间隔着什么都一样。',\n        '   （车不是这样的：车沿直线看出去，撞上墙就停。两道题别搞混。）',\n      ],\n      en: [\n        '   **A king block pays no attention to walls**: next to is next to, whatever lies between.',\n        '   (A rook is not like this: it looks along a line and stops at a wall. Do not mix them up.)',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '   这张表是**对称的**：s 照顾得到 t，t 就一定照顾得到 s —— 因为「挨着」',\n        '   是相互的。这条待会儿有大用：**能照顾到某一格的王，就站在那一格的九宫里**，',\n        '   所以想管住某一格，候选最多只有九个。 */',\n      ],\n      en: [\n        '   This table is **symmetric**: s looks after t exactly when t looks after s — \"next to\"',\n        '   goes both ways. That pays off soon: **a king looking after a square stands inside that',\n        '   square’s own block**, so any one square has at most nine candidates to look after it. */',\n      ],\n    },\n    'const covers = [];',\n    'for (let s = 0; s < W * H; s = s + 1) { covers.push([]); }',\n    'for (let i = 0; i < empty.length; i = i + 1) {',\n    '  const s = empty[i];',\n    '  const x = s % W;',\n    '  const y = (s - x) / W;',\n    '  for (let dy = -1; dy <= 1; dy = dy + 1) {',\n    '    for (let dx = -1; dx <= 1; dx = dx + 1) {',\n    '      const nx = x + dx;',\n    '      const ny = y + dy;',\n    '      if (nx >= 0 && nx < W && ny >= 0 && ny < H) {',\n    '        const t = ny * W + nx;',\n    '        if (wall[t] === 0) { covers[s].push(t); }',\n    '      }',\n    '    }',\n    '  }',\n    '}',\n    '',\n    {\n      zh: [\n        '/* 两个记录：',\n        '     seen[sq]  现在有几个王照顾着这一格',\n        '     left      还有几个空格一个王都没照顾到',\n        '   记「几个」而不是「有没有」，是因为王有可能被收回去（精确那一份会收）——',\n        '   收回去之后这一格还剩几个王照顾着，只有计数说得清。 */',\n      ],\n      en: [\n        '/* Two records:',\n        '     seen[sq]  how many kings are looking after this square right now',\n        '     left      how many empty squares still have nobody looking after them',\n        '   Counting \"how many\" and not \"any at all\" matters because a king can be taken back',\n        '   (the exact one does that) — only a count says how many are still looking after it. */',\n      ],\n    },\n    'const seen = [];',\n    'for (let i = 0; i < W * H; i = i + 1) { seen.push(0); }',\n    'let left = empty.length;',\n    '',\n    {\n      zh: [\n        '/* 在 s 上摆一个王：它九宫里每一格的计数加一，本来没人管的那几格就有人管了。 */',\n      ],\n      en: [\n        '/* Put a king on s: every square of its block gains one, so those with nobody now have one. */',\n      ],\n    },\n    'function put(s) {',\n    '  const c = covers[s];',\n    '  for (let i = 0; i < c.length; i = i + 1) {',\n    '    if (seen[c[i]] === 0) { left = left - 1; }',\n    '    seen[c[i]] = seen[c[i]] + 1;',\n    '  }',\n    '  mark(s, \"ok\");',\n    '  place(s, \"wK\");',\n    '}',\n    '',\n    {\n      zh: [\n        '/* ===== 分水岭：从这里往下两份不一样了 —— 差的就是「挑哪个王」 ===== */',\n      ],\n      en: [\n        '/* ===== The divide: below here the two differ — what differs is which king to pick ===== */',\n      ],\n    },\n  ];\n\n  const TAIL = [\n    '',\n    {\n      zh: [\n        '/* 已经摆了 n 个王了，接着往下摆；摆到每个空格都有人照顾为止，',\n        '   返回一共摆了几个。',\n      ],\n      en: [\n        '/* n kings are already down; keep going until every empty square is looked after, then',\n        '   return how many were put down in all.',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '   这一份的主意只有一句话：**挑当下最划算的那一格** —— 谁能一口气新照顾到',\n        '   最多还没人管的空格，就把王摆在谁那儿。并列的话取编号小的那一格。',\n        '   挑完就定了：这一份从头到尾没有一次 \"back\"，没有哪个王被收回去过。',\n      ],\n      en: [\n        '   The idea here is one sentence: **take the square that pays off most right now** — the',\n        '   one that newly looks after the most unattended squares gets the king; on a tie, the',\n        '   lower number. And once taken it is settled: not one \"back\" here, start to finish.',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '   它快得离谱，但它**不保证最少**。旁边那一份会告诉你差多少 ——',\n        '   有墙的盘上，这两个数经常不一样。 */',\n      ],\n      en: [\n        '   It is absurdly fast, but it **does not promise the fewest**. The one beside it tells',\n        '   you by how much — on a board with walls the two numbers often differ. */',\n      ],\n    },\n    'function cover(n) {',\n    '  if (left === 0) {',\n    {\n      zh: [\n        '    return n;              // 每个空格都有人照顾了 —— 一共摆了 n 个王',\n      ],\n      en: [\n        '    return n;              // every empty square is looked after — n kings in all',\n      ],\n    },\n    '  }',\n    {\n      zh: [\n        '  /* 摆擂台：一格一格地问「你能新照顾到几格」，把最多的那一个留到最后。 */',\n        '  let best = -1;           // 目前的擂主站在哪一格；−1 = 还没有擂主',\n        '  let bestGain = 0;        // 擂主能新照顾到几格',\n      ],\n      en: [\n        '  /* A contest: ask each square \"how many new ones can you look after\"; the biggest stays. */',\n        '  let best = -1;           // where the current champion stands; −1 = no champion yet',\n        '  let bestGain = 0;        // how many new squares the champion looks after',\n      ],\n    },\n    '  for (let i = 0; i < empty.length; i = i + 1) {',\n    '    const s = empty[i];',\n    {\n      zh: [\n        '    mark(s, \"try\");        // 正在掂量这一格',\n      ],\n      en: [\n        '    mark(s, \"try\");        // weighing up this square right now',\n      ],\n    },\n    '    let gain = 0;',\n    '    const c = covers[s];',\n    '    for (let j = 0; j < c.length; j = j + 1) {',\n    '      if (seen[c[j]] === 0) { gain = gain + 1; }',\n    '    }',\n    '    if (gain > bestGain) {',\n    {\n      zh: [\n        '      /* 新擂主。老擂主这时候才出局 —— 它一直亮着，直到被顶下去。',\n        '         这里写的是 `>` 不是 `>=`：并列的时候擂主不换，也就是取编号小的',\n        '         那一格。**这一句是算法的一部分**，不是随手写的：把它改成 `>=`，',\n        '         或者把上面这个循环倒过来扫，答案会变（有一档从 6 变成 5）。 */',\n      ],\n      en: [\n        '      /* A new champion. Only now is the old one out — it stayed lit until unseated.',\n        '         This says `>` and not `>=`: on a tie the champion keeps its place, which is',\n        '         the same as taking the lower number. **That sign is part of the algorithm**,',\n        '         not a detail: make it `>=`, or scan backwards, and an answer changes (6 to 5). */',\n      ],\n    },\n    '      if (best >= 0) { mark(best, \"cut\"); }',\n    '      bestGain = gain;',\n    '      best = s;',\n    '    } else {',\n    {\n      zh: [\n        '      mark(s, \"cut\");      // 比不过擂主，出局',\n      ],\n      en: [\n        '      mark(s, \"cut\");      // no match for the champion; out',\n      ],\n    },\n    '    }',\n    '  }',\n    '  put(best);',\n    {\n      zh: [\n        '  log(\"第 \" + (n + 1) + \" 个王站在 \" + best + \" 号格，新照顾到 \" + bestGain +',\n        '      \" 格，还剩 \" + left + \" 格没人管\");',\n      ],\n      en: [\n        '  log(\"King \" + (n + 1) + \" stands on square \" + best + \"; newly looked after: \" + bestGain +',\n        '      \", still with nobody: \" + left + \".\");',\n      ],\n    },\n    '  return cover(n + 1);',\n    '}',\n    '',\n    'const kings = cover(0);',\n    {\n      zh: [\n        'log(\"贪心用了 \" + kings + \" 个王\");',\n      ],\n      en: [\n        'log(\"Kings used by greed: \" + kings + \".\");',\n      ],\n    },\n    'return kings;',\n  ];\n\n  /* source({ W, H, blocked, lang }) → string\n\n     四个参数都不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数已经\n     是本仓库抓到过八次的缺陷类）。一个默默变成 8 的 W 会让界面写着 6、跑的却是\n     8，正是这个工具最不能出的错；而一个默默变成 `[]` 的 blocked 更糟 ——\n     **空盘是这道题的假题**（两份给出的数一模一样，四档盘因此没有一块空盘），\n     悄悄退化成假题的演示教不了任何东西。\n\n     校验只管「是不是一块合法的盘、墙是不是都落在盘上」，**不管盘上还剩不剩\n     空格、也不管跑不跑得完**：整块盘都是墙要照常吐出源码（答案 0），\n     7×7 那一档明知精确解会撞墙也要照常吐出来 —— 撞墙那一屏正是这道题的落点。\n\n     `lang` 同理，而且它是这个工具最容易悄悄坏掉的那一个：工具**默认英文\n     界面**，一个默默变成 'zh' 的 lang 就是让英文使用者读一份中文源码 ——\n     没人会报这个 bug，她只会以为这工具不是给她做的。\n\n     **自身那三个参数的校验仍在最前，`lang` 由 render() 在最后校验**，而这个\n     顺序**是有门守着的**：`king.test.js` 的「缺参数当场抛」那一组**一个 lang\n     都不传**，并且每条都带第三参 pattern（`/少了 W/`、`/少了 blocked/` …）。\n     把 lang 的校验挪到 W 前面来，那一组当场红 —— 撞上的会变成「少了 lang」，\n     pattern 对不上。\n\n     这个函数与 king-exact.js 的同名函数逐字相同，两边一起改。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.W === undefined || o.W === null) {\n      throw new Error('source({ W, H, blocked }) 少了 W —— 棋盘宽度没有默认值，必须写明');\n    }\n    if (o.H === undefined || o.H === null) {\n      throw new Error('source({ W, H, blocked }) 少了 H —— 棋盘高度没有默认值，必须写明');\n    }\n    if (o.blocked === undefined || o.blocked === null) {\n      throw new Error('source({ W, H, blocked }) 少了 blocked —— 墙没有默认值，必须写明；' +\n                      '空盘请显式传 []（那是这道题的假题：空盘上贪心与精确给出同一个数）');\n    }\n    const W = o.W, H = o.H, blocked = o.blocked;\n    if (typeof W !== 'number' || !isFinite(W) || Math.floor(W) !== W || W < 1) {\n      throw new Error('W 必须是 >= 1 的整数，收到：' + W);\n    }\n    if (typeof H !== 'number' || !isFinite(H) || Math.floor(H) !== H || H < 1) {\n      throw new Error('H 必须是 >= 1 的整数，收到：' + H);\n    }\n    if (!Array.isArray(blocked)) {\n      throw new Error('blocked 必须是一个数组（墙的格子编号），收到：' + typeof blocked);\n    }\n    for (let i = 0; i < blocked.length; i++) {\n      const s = blocked[i];\n      if (typeof s !== 'number' || !isFinite(s) || Math.floor(s) !== s || s < 0 || s >= W * H) {\n        throw new Error('blocked 里的格子必须是 0 到 ' + (W * H - 1) + ' 之间的整数，收到：' + s);\n      }\n    }\n    return render(HEAD, o.lang)\n      .concat([\n        'const W = ' + W + ';',\n        'const H = ' + H + ';',\n        'const BLOCKED = [' + blocked.join(', ') + '];',\n      ])\n      .concat(render(COMMON, o.lang))\n      .concat(render(TAIL, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source };\n});\n",
  'king-exact.js': "/* 带障碍盘上「最少的王支配所有空格」的**精确**算法源码生成器（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `knight-path.js` / `tour-*.js` / `rook-cover.js` 是同一个形状：\n   这个模块本身不算任何东西 —— 它吐出一段**字符串**。那段字符串同时是喂给\n   `Interp.run` 去真跑的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份源码。\n   一份字符串两个用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- 这一份和 `king-greedy.js` 是一对 ----\n\n   共用的那一整段（建墙表、列空格、建覆盖表、`seen`/`left`、`put()`）\n   **逐字节相同**，两条横线之间一个字都不许差。完整的约定、以及「阶段 5 那道\n   逐行子序列的门为什么在这一对上不适用」，写在 `king-greedy.js` 的文件头里，\n   那一份是这一对的主文档。**改动共用文本必须同步改那一份。**\n\n   这一份自己多出来的东西，就是横线以下那些：`take()`（把王收回去）、\n   `limit`、以及外面那圈迭代加深的 while。\n\n   ---- 算法：迭代加深 + 「谁来管这一格」分支 ----\n\n   一句话：先问「1 个王够不够」，不够再问 2 个、3 个…… 第一个答得上「够」的\n   数就是最少的，因为比它小的都已经被否掉了。**从 0 问起**（整块盘都是墙时\n   答案就是 0 —— 少了这一档会答 1，`king.test.js` 有断言钉着）。\n\n   每一轮里怎么搜：挑一个**还没人管**的空格，它总得有人管；而能管它的王\n   只可能站在它自己的九宫里（覆盖表对称，见共用段那条注释）—— 候选最多九个，\n   一个一个真的摆上去试，不成就收回来换下一个。这不是启发式，是穷尽：\n   「这一格总得有人管」这句话本身就把分支因子从「全盘每一格」压到了九。\n\n   **为什么不是「枚举所有 C(n, k) 种摆法」**：那样 6×6 上 k=4 就是 5 万多种，\n   而且每一种都要从头验一遍覆盖。按「谁来管这一格」分支，同样是精确解，\n   实测便宜两个数量级 —— 但仍然指数，见下面那张表的第四档。\n\n   ---- 这道题的落点：**为什么现实里要用贪心** ----\n\n   前面五个工具都在讲「算法怎么跑」。这一题的第四档讲的是另一件事：\n\n     7×7 `[16,24,32]` 上贪心一眨眼给出 8，**精确这一份跑不完**。\n     于是我们**并不知道** 8 是不是最优。\n\n   读数必须说「跑不完，判不了」，**绝不许说「8 是最优」**（宿主侧另算过，\n   那块盘的真最优确实是 8 —— 但工具里那一屏没有算完，它不该假装知道）。\n   `null` 表示「不知道」，永远不许变成数字。阶段 6 为这类情形建了整套\n   `unknown` 通道（`exercise.js` 的 judge：没找到分歧又有一侧截断 → `unknown`，\n   而且 `unknown` 不是 `fail`），Task 5 照它的既有呈现，别新造一套。\n\n   8×8 更绝望：宿主侧量到 **2,700 万次**操作（简报给的是另一种计数口径下的\n   7,256 万）—— **8×8 的精确支配集根本不可能进这个工具**，滑杆上限别往那儿开。\n\n   ---- 实测（`Interp.STEP_LIMIT` = 200,000）----\n\n   四档的两边数字放在一起才读得懂，所以整张表只在这一份里写一次。\n   拿两份生成的源码各跑 `Interp.run(src, { host: {} })`，读 `result` 与\n   `trace.length`；mark 次数由 `king.test.js` 的 `probe()` 量。\n\n     档                          贪心 k / 步数      精确 k / 步数      差距   这一档演什么\n     ① 5×5 [6,12,18]              4 /  3,983        4 /  18,174        0    两边一样：贪心运气好\n     ② 6×6 [6,24,35]              6 /  8,154        4 /  71,742        2    **差距**出现了\n     ③ 6×6 [1,4,24]               8 /  9,625        4 /  41,627        4    同一块盘、同样三堵墙，\n                                                                            只挪了位置：差距翻倍\n     ④ 7×7 [16,24,32]             8 / 13,578      ✗ 撞墙 200,000       ?    **跑不完，判不了**\n\n   四档的教学轴是**差距**：0 → 2 → 4 → 不知道。三件要知道的事：\n\n     ① **贪心四档全部跑得完**，最贵的一档（7×7）13,578 步，占上限的 6.8%。\n        「一眨眼」不是修辞：第④档它至少比精确便宜 14 倍 —— 而 200,000 只是\n        上限，精确那一边的真值我们并不知道有多大。\n     ② **精确的步数不随盘大小平滑长**：18,174 → 71,742 → 41,627 → 撞墙。\n        ③ 比 ② 大一倍的差距，却便宜四成 —— 贵不贵取决于最少王数是几、\n        以及要否掉多少个更小的王数，跟「盘上有几堵墙」没有直接关系。\n     ③ **第③档是换过的**（见下面那一整段）。前三档余量都在 40% 以上，\n        `king.test.js` 有一条余量断言把它们钉在 120,000 之下：将来任何把\n        某一档推过线的改动会**大声失败**，而不是变成一次神秘的截断。\n\n   墙上那一档（④）**必须**撞墙，`king.test.js` 拿 `trace.truncated === true` 和\n   `typeof result === 'undefined'` 两条钉着 —— 那一档要是哪天跑完了，那才是故障。\n\n   ---- 第三档换过一次（实测逼出来的）----\n\n   简报给的第三档是 `6×6 [6,10,25,28,32,34,35]`（贪心 7 / 精确 5），\n   **它的精确解在解释器里跑不完**。简报自己预警过这一条。\n   这不是外推出来的：把 `Interp.run` 的 `opts.limit` 抬到五千万，**实测那一档\n   要 251,668 步**（k=5，未截断）—— 比 200,000 的上限高出 26%。在默认上限下\n   它就是 `truncated === true`、`result === undefined`。留着它，四档里就有\n   两档撞墙，「差距那一课」只剩一档在演。\n\n   ⚠ **「解释器步数 ÷ 算法操作数」有两套口径，千万别混用**（这里一度混过）：\n\n     档                      简报口径 ops   本仓库口径 ops   解释器步数    倍率(简报/本仓库)\n     5×5 [6,12,18]              1,440           542          18,174     12.6× / 33.5×\n     6×6 [6,24,35]              6,952         2,372          71,742     10.3× / 30.2×\n     6×6 七墙（原第三档）       24,779         9,971         251,668     10.2× / 25.2×\n     6×6 [1,4,24]（新第三档）      ——          1,309          41,627       ——  / 31.8×\n\n   两套差 2.5–2.7 倍，因为「一次操作」的定义不同（简报那套数得细）。\n   **拿简报表里的 ops 预估新档步数，要乘 ~10–13，不是 ~30。**\n   本文件表里的四档步数一律是直接量的，不是任何一种乘出来的。\n\n   换成 `6×6 [1, 4, 24]`：**同样是 6×6、同样是三堵墙，只是位置不同** ——\n   贪心从 6 变成 8（整整一倍的王），精确两块都是 4。差距从 2 拉到 4，\n   步数反而降到 41,627。新档的 k 由一份**穷举**（按 k 从小到大枚举所有子集，\n   零剪枝）独立验过：3 个王盖不满，4 个可以（[7,10,25,28]，与第②档同解）。\n\n   顺带一条给页面的提醒：**② 与 ③ 的贪心结果对扫描序极其敏感** ——\n   把「并列取编号小的」换成倒序扫描，② 从 6 变 5、③ 从 8 变 5。\n   扫描序是算法的一部分，不是实现细节（`king-greedy.js` 文件头有整条记录）。\n\n   顺带一条实测，它订正了规格原写的「差距可见」：**矩形空盘上两份完全相同**\n   （4×4 / 5×5 / 5×6 / 6×6 / 6×7 / 7×7 / 7×8 / 8×8 八种全同，8×8 都是 9）。\n   空盘上王的结构太规整，贪心自然挑中 3×3 块的中心，那恰好最优。\n   **差距只在有墙的时候才出现** —— 所以四档盘里没有一块空盘。 */\n(function (root, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else root.AlgoKingExact = factory();\n})(typeof self !== 'undefined' ? self : this, function () {\n  'use strict';\n\n  /* ================= 双语渲染（规格 §1.6 / §7.5）=================\n\n     ⚠ **这一整段在七份 algos/*.js 里逐字节相同**，check.py 的\n     bilingual_algos_check() 会核对。改这里就得七份一起改。\n     不抽成共用模块，是因为这些文件是被 inline_core.py 当**字符串**逐份\n     内联、再各自求值成 AlgoXxx 全局的 —— 抽出去就凭空多一条求值顺序\n     依赖，而那类缺陷要到浏览器里 ALGOS['queens.js'] 是 undefined 才发作\n     （阶段 5 建页当天撞过一次）。七份重复 + 一道字节级门，是阶段 7\n     king-greedy / king-exact 共用段用过的同一个套路。\n\n     `parts` 的元素只有两种：\n       字符串                 —— 一行，两种语言下逐字相同\n                                 （代码、空行、// >>> BLANK 指令行）\n       { zh: [], en: [] }     —— 一段散文，两边都是**行数组**\n\n     **两边行数必须相等**，不是洁癖：生成的源码是按行索引的 —— 解释器\n     每一步记 line，第 4 级提示靠 pristine 与编辑器逐行对齐划出 answerRange，\n     判定靠 judge.herSrc 比对。行数一差，切一次语言这四样同时指错地方。\n     行数一对齐，轨迹在两种语言下逐字节相同，切语言就只是换掉编辑器里的\n     文本，不重跑解释器。\n\n     BLANK 指令行**不翻译**：它本来就同时带着 hint 与 hintEn，两种语言\n     变体里那一行逐字相同，parse() 一点不用改。所以它是**字符串**片段。 */\n  function render(parts, lang) {\n    if (lang === undefined || lang === null) {\n      throw new Error(\n        'source({ lang }) 少了 lang —— 源码的注释与日志要用哪种语言没有' +\n        '默认值，必须写明 \"zh\" 或 \"en\"（默认成任何一种，都是让同一个缺陷' +\n        '换个地方复活）'\n      );\n    }\n    if (lang !== 'zh' && lang !== 'en') {\n      throw new Error('source({ lang }) 的 lang 只认 \"zh\" 或 \"en\"，收到：' +\n                      JSON.stringify(lang));\n    }\n    const out = [];\n    for (let i = 0; i < parts.length; i = i + 1) {\n      const p = parts[i];\n      if (typeof p === 'string') { out.push(p); continue; }\n      if (!p || !Array.isArray(p.zh) || !Array.isArray(p.en)) {\n        throw new Error('第 ' + i + ' 个片段既不是字符串、也不是 ' +\n                        '{ zh: [], en: [] }');\n      }\n      if (p.zh.length !== p.en.length) {\n        throw new Error(\n          '第 ' + i + ' 个片段两种语言行数不等：zh ' + p.zh.length + ' 行 / en ' +\n          p.en.length + ' 行 —— 生成的源码按行索引，行数一差，切一次语言 ' +\n          'Step.line / pristine / answerRange / judge.herSrc 同时指错地方' +\n          '（规格 §1.6）'\n        );\n      }\n      const lines = p[lang];\n      for (let j = 0; j < lines.length; j = j + 1) out.push(lines[j]);\n    }\n    return out;\n  }\n\n  /* 普通字符串拼，不用模板字面量：这段文本本身会被原样贴进 html，\n     反引号在那个上下文里比在这里更容易出事（照抄 queens.js 的理由）。\n\n     元素两种：字符串（代码 / 空行，两语逐字相同）与 `{ zh: [], en: [] }`\n     （一段散文，两边行数必须相等）—— 见上面 render()。这一份**一个挖空\n     都没有**，所以没有 BLANK 指令行那一类。\n     英文不是逐句直译，是照中文那一版的意思与语气重写的，行数对齐落在\n     「段」上：段内句子怎么重组都行，段的行数必须一样。\n\n     ⚠ **这一份英文最要害的一句在文件末尾那段迭代加深的注释里**（这道题的\n     落点见文件头）：第四档 7×7 上这一份撞 200,000 步上限，贪心给出 8，\n     而工具**没有证明** 8 是最优。中文写的是「跑不完的时候它什么都没说 ——\n     不是『答案是贪心那个数』，是『不知道』」，英文必须同样是否定式：\n     `it has said nothing — not \"the answer is the greedy number\", but \"unknown\"`。\n     **不许**写成 `so 8 is optimal` / `the greedy answer is confirmed` 一类。\n\n     ⚠ **这件事只有一半是自动的，另一半是人肉门**（跟 rook-cover 的题面门\n     同一个形状，别把它读成「有断言钉着，可以放心」）：`king.test.js` 那一组\n     `KING_BANNED_OPTIMAL` 是**词表门**，它只查两件字面上的事 ——\n       (a) 英文里没出现表里列着的那几族肯定说法（`is optimal`、\n           `proven optimal`、`best possible`、`confirm(s|ed)`、\n           `greedy … is the answer`、`so 8 is …`）；\n       (b) 英文里出现了 `said nothing` 与 `unknown` 这两个词。\n     换法列不完（\"then the greedy count stands\"、\"no fewer will do\"、\n     \"that settles it\" 都能绕过 (a)），而 (b) 只问那两个词在不在，\n     **不问它们出现在哪句话里、修饰的是不是那件事**。\n     「这段英文说的到底是不是『跑不完、判不了』」要人逐句读。 */\n\n  /* ==== 以下 HEAD 与 king-greedy.js 的 HEAD **行数相同**，\n     只有第 1 行的标题和        · `sideView` 不要：这一题 `sources` 只有一份，只有一块棋盘，默认那条沿
         世界 x 轴看进去的侧视没有东西可以跟它重合（tourKnight 换掉它是因为两块
         盘正是沿 x 轴摆开的）。

     **棋盘固定 8×8、出发格固定 a1，唯一的滑杆是目标格。** 前两题的滑杆调的是
     「问题有多大」，这一题调的是「问那一格」—— 而它必须是唯一的旋钮：把 W 也
     做成滑杆的话，两根滑杆一联动就能拧出一个落在盘外的 target，`source()` 当场
     抛（那是它该做的），页面上却只表现为「拖过头就红」。真正的理由还更简单：
     这一题演的就是**那一副** 8×8 的棋盘上「从这里到那里几步」。

     **`kinds` 只有三种，没有 `'back'`** —— 图例上少的那一行本身就是一句话：
     BFS 一次也不反悔。前两题靠回溯活着，它不需要。 */
  const KP = {

    brand: { zh: '马从 a1 走到某一格，最少要几步？一层一层往外铺，第一次碰到目标的那一层就是答案。',

                  en: 'Dimmed marks are **the layers already laid down that the search has moved past** — whatever layer the tower stands on is the layer that stays lit. At the very last step the whole board dims: the ripple fades and only the row of knights is left.' },
    roNoBack: { zh: '**回溯 %B 次。** 前两道题靠回溯活着，这一题一次都不需要——按远近铺开的搜索没有错路可退。',

  /* 这一题的两个常量：真正那一副棋盘，以及角上的 a1。滑杆只有目标格一根。 */
  const KP_W = 8;
  const KP_START = 0;
  /* 格子编号 → 代数记法。`sq = rank * W + file`（三道题同一个约定），
     文件名字母来自 BoardRender.fileLabel，跟棋盘边上印的坐标同源——
     读数里写 “a1 → h8” 而她在盘上看到的也正是那两格。 */
  function kpSqName(sq) {
    const f = sq % KP_W, r = (sq - f) / KP_W;

  /* ---------------- 车、行段与列段：这一页第一道**盘上有障碍**的题 ----------------

     ⚠ **题面订正 —— 这个键最重要的一条，先读它。**
     计划与规格原先写的是「用最少的车覆盖所有空格，最大匹配 = 最少的车数」。
     **后半句不成立**（Task 2 的执行者发现、审查独立验证）：一辆车是二分图里的
     一条**边**，一次占住一个行段**和**一个列段，所以 k 辆车最多点亮 2k 个点。
     König 给的是「最少的**线**」，不是「最少的**车**」。最小的反例只有 2×2：
     挖掉一格，最大匹配 2，而一辆车就盖满了剩下三格；60 块随机小盘里 49 块的
     最少车数严格更小，反向一次都没有 —— 不是边角失误。
     所以这个键只说两句站得住的话，两句都恰好等于最大匹配：
       ① 最多能摆几辆**互相吃不到**的车？
       ② 要盖住每个空格，最少要点亮几条**线（段）**？
     「算完之后这些车顺手也盖住了每个空格」是真的、也验过 —— 但 **≠ 最少**，
     所以每次说它都带着那个括注。同一份订正也落在 `core/algos/rook-cover.js`
     的 HEAD、规格 §4⑤ 与阶段 7 的计划里，四处一起改。

     ---- 三个可选字段一个都不要，理由跟 knightPath 一样是量出来的 ----
       · `zOf` 不要：`walk` 就是递归那一个，多一层 = 「请人挪窝」多传了一手，
         默认 `zOf = m.depth` 正好是这个数。
         ⚠ **它不等于「增广路有多长」**，别在文案里写成那个。node 扫顶层 walk
         帧实测（四档依次）：

           最深递归      1 / 6 / 4 / 7
           其中最深的失败 0 / 6 / 4 / 7      ← 0 = 空盘上一次失败都没有
           其中最深的成功 1 / 3 / 2 / 2

         所以**后三档**最高的那座塔都属于一次**失败**的搜索，走通的那些浅得多；
         **第一档是例外**，它那 1 层是一次成功（空盘上没有失败可言）——修复轮 1
         的审查抓到过这条：原先写成「四档里每一档都……」，在默认档上当场是假的，
         而同一段 tips 往后两句自己就说第一档「一次让位都没有」。
         失败的那几趟并不白跑——它们问过的段正是 König 那些线的来源，见 rcKonig。
       · `spanZ` 不要：塔最深 7 层（6×7 那一档，实测 `Step.depth` 最大 7），
         7 × 0.55 = 3.85 —— 与 knightPath 的 7 层同一个数，正视下取景放大 1.38 倍。
       · `sideView` 不要：`sources` 只有一份、只有一块棋盘。
         **默认的 `3` 侧视是 `az = −π/2`、沿世界 x 轴看进去的**（`VIEWS.side`），
         不是沿 z ——沿 z 看进去塔会缩成一个点。正因为沿 x 看，世界 z 才摊开在
         屏幕横向：棋盘立成一条竖线、深度轴的 0…6 横着铺开，轮次一眼分得清。
         tourKnight 换掉它是因为两块盘正沿世界 x 轴摆开，沿 x 看过去会严丝合缝
         叠成一块；这一题只有一块盘，没有那回事。

     ---- 一件真实行为，不是 bug ----
     **每个格子会被 `mark(s,"try")` 两次**：`walk` 两趟扫的是同一个 `cells` 列表，
     第一趟（找空列段）没成的话第二趟（请人挪窝）会把同样几格再走一遍。回放时
     看得出顿挫。读数里说了这件事，免得她把算法的真实形状当成工具坏了。 */
  const RC = {
    tab:   { zh: '车与线', en: 'Rooks & Lines' },
    brand: { zh: '障碍把每一行、每一列切成了几截。最多能摆几辆互相吃不到的车？盖住每个空格最少要点亮几截？两个问题同一个答案。',
             en: 'Obstacles cut every rank and file into pieces. How many rooks can stand without attacking each other? How few of those pieces must be lit to cover every empty square? Two questions, one answer.' },
    tips:  { zh: '这是这一页第一道盘上有障碍的题。障碍把一行切成几段，一辆车只管得住它站的那一段——于是每个空格都是一对号码（行段, 列段），摆一辆车就是同时占住这两截。按 3 切侧视：z 轴是「请人挪窝」传了几手，「我要这个列段 → 占它的那位挪去别处 → 别处又腾出来」每传一手塔就多一层。**后三档里最高的那座塔都属于一次失败的搜索**，不是一次成功的增广——而正是那几趟失败问过的段，圈出了 König 的线（第一档的空盘一次失败都没有，见下）。橙色的「让位」跟前两题的「回溯撤销」不是一回事：那辆车没错，它只是把位子让给别人，自己已经在别处站好了。先把滑杆停在第一档的空盘——答案恒等于行数、一次让位都没有、塔只有一层，那正是「这道题必须有障碍」的现场证据。读数底下那张小图画的是 König 的那些线：条数永远等于车数。',
             en: 'This is the first problem on this page with obstacles on the board. They cut each rank into segments, and a rook only ever controls the segment it stands on — so every empty square is a pair of numbers (row segment, column segment), and placing a rook occupies both at once. Press 3 for the side view: the z axis counts how many hands “please move” has been passed through, and every “I want that column segment → whoever holds it moves elsewhere → that frees up in turn” adds a storey. **On the last three boards the tallest tower belongs to a search that fails**, not to a successful augmentation — and it is exactly those failed searches that pin down König’s lines (the empty first board never fails once; see below). Orange “stepped aside” is not the “backtracked” of the first two problems: that rook was not wrong, it merely yielded its square and is already standing somewhere else. Start with the slider on the empty board: the answer is exactly the number of ranks, nothing ever steps aside, the tower is one storey tall — that is the evidence that this problem needs obstacles. The small figure under the readout draws König’s lines; there are always exactly as many of them as there are rooks.' },

    kTry:  { zh: '正在试这一格', en: 'trying this square' },

    kCut:  { zh: '这条路走不通（问过了，或者占着它的那位挪不动）', en: 'dead end (already asked, or the holder cannot move)' },

    roSegs:   { zh: '行段', en: 'row segments' },
    roSegsC:  { zh: '列段', en: 'column segments' },

    roCover:  { zh: 'König 的那些线：**%R 截行段 + %C 截列段 = %K 截**，正好等于车数。条带沿着点亮的那一截走，所以**横条是行段、竖条是列段**；打叉的是障碍。每个空格都被至少一条压着——那就是「盖住」。',

    roCoverNo:{ zh: '**这一刻画不出 König 的线。** 要么这一趟还没跑完，要么这条轨迹跟滑杆上的盘面还没对上（换档的那一瞬间），要么源码被改过之后「线数 = 车数」这个恒等式不再成立。三种情形都是「不知道」——不知道就不画，绝不画一张看着像模像样的假图。',

    roNotFewest: { zh: '**这些车顺手也盖住了每一个空格**（哪个空格的行段和列段上都没车，它自己就还能再摆一辆，与「最多」矛盾）。但**顺手盖住 ≠ 用最少的车盖住**：一辆车一次占两截，第二档那块 5×5 上 **4 辆车就盖满了，而那一档的答案是 7**。这道题回答的是上面那两个问法，不是「最少几辆车」。',
                   en: '**These rooks happen to cover every empty square too** — if some square had a rook on neither its row segment nor its column segment, another rook could stand there, contradicting “the most”. But **covering by accident is not covering with the fewest**: one rook occupies two segments at once, and on the second board — the 5×5 with obstacles — **four rooks already cover everything, while the answer there is seven**. This problem answers the two questions above, not “how few rooks”.' },

                en: 'On replay the same square lights up “trying” twice: `walk` scans the same list of squares twice — first for a column segment that is still free, only then to ask whoever holds one to move. That is the real shape of the algorithm.' },

                en: '**This board is the control, not the puzzle.** On an empty board the answer is always the number of ranks — one rook per rank, anywhere — nothing ever steps aside, the tower is one storey, and matching never gets to do anything. Push the slider on: only once obstacles cut the ranks and files apart is there something to compute.' },
    les55:    { zh: '**8 个行段、8 个列段，却只摆得下 7 辆车。** 少的那一辆是被 König 的 7 条线卡住的：7 截就压住了全部空格，第 8 辆再也找不到一对没人占的号码。这一档让位了 2 次；而塔最高的那 6 层不是一次成功的增广，是**唯一一趟失败的搜索**——那个行段问遍了能问的段，一个空位都没有。真正走通的增广路最深只有 3 层。',
                en: '**Eight row segments, eight column segments — and only seven rooks fit.** The missing one is pinned by König’s seven lines: seven segments already sit on every empty square, so an eighth rook can never find an unclaimed pair. Two rooks step aside here; and the tallest tower, six storeys, is not a successful augmentation but **the one search that fails** — that row segment asks everything it can reach and finds no free seat. The deepest path that actually succeeds is three storeys.' },
    les66:    { zh: '**10 个行段、10 个列段，7 辆车。** 障碍多了，段反而碎了——碎的段更容易被同一条线压住，所以差距拉到 3。只让位了 1 次：大部分车第一趟贪心就坐下了，真正的增广只发生在最后那几个行段上。',
                en: '**Ten row segments, ten column segments, seven rooks.** More obstacles means more, smaller segments — and smaller segments are more easily pinned by the same line, so the gap widens to three. Only one rook steps aside: most of them sit down on the first greedy pass, and real augmentation happens only on the last few row segments.' },
    les67:    { zh: '**塔最高的那一趟，一辆车都没多。** 12 个行段、12 个列段、9 辆车。按 3 切侧视：最高的那座塔有 7 层，「请人挪窝」传下去七手，七手都没腾出空位——这一档最深的搜索是一次**失败**。它并不白跑：正是这几趟失败的搜索问过的那些段，圈定了下面那张图里 König 的 9 条线。真正走通的增广路都很浅，这一档最深只有 2 层。',
                en: '**The tallest tower on this board gains no rook at all.** Twelve row segments, twelve column segments, nine rooks. Press 3 for the side view: the tallest tower is seven storeys — “please move” passed down seven hands, and not one of them frees a seat. That deepest search **fails**. It is not wasted: the segments those failed searches asked about are exactly what pins down König’s nine lines in the figure below. The paths that do succeed are shallow — two storeys at most here.' },
  };

  /* 四档盘。**第一档的空盘是有意的对照**（`blocked: []` 显式写出来 —— rook-cover.js
     的 `source()` 不给默认值，正因为空盘是这道题的假题，要写出来才算数）：
     k = 行数、一次让位都没有、塔只有一层，「为什么这道题必须有障碍」不用讲。
     实测（node 跑 Interp.run 读 trace.length，与 rook-cover.js 文件头、
     rook-cover.test.js 同源）：

       档                              k   步数   最深   try/ok/cut/back
       5×5 空盘                        5    722    1     15/5/0/0
       5×5 [3,14,17,18,21]             7  1,156    6     53/9/17/2
       6×6 [0,6,8,9,14,20,24,26,27]    7  1,411    4     46/8/17/1
       6×7 [4,6,7,8,26,31,33,35,37]    9  2,149    7    121/10/52/1

     离 200,000 的上限差两个数量级：这一题不存在撞墙风险，四档都跑得完。 */
  const RC_BOARDS = [
    { W: 5, H: 5, blocked: [] },
    { W: 5, H: 5, blocked: [3, 14, 17, 18, 21] },
    { W: 6, H: 6, blocked: [0, 6, 8, 9, 14, 20, 24, 26, 27] },
    { W: 6, H: 7, blocked: [4, 6, 7, 8, 26, 31, 33, 35, 37] },
  ];
  const RC_LESSON = [RC.lesEmpty, RC.les55, RC.les66, RC.les67];
  /* 越界当场抛，照 tourBoard 那条（阶段 5 约束 6）：默默夹回第 0 档会让界面写着
     6×7、跑的却是 5×5 空盘 —— 而空盘是这道题的假题，那是最坏的一种错。 */
  function rcBoard(st) {
    const i = Math.round(st.board);
    if (!isFinite(i) || i < 0 || i >= RC_BOARDS.length) {
      throw new Error('盘面滑杆的档位越界：' + st.board + '（只有 0…' + (RC_BOARDS.length - 1) + ' 四档）');
    }
    return RC_BOARDS[i];
  }

  /* 把盘切成行段/列段 —— **与生成源码里那两个双重循环逐字同构**（rook-cover.js
     的 BODY）。显示层要它，是因为轨迹里只有格子号，而 König 说的是「段」。
     重算一遍而不是从算法里读，是刻意的：源码里一句只为显示服务的话都没有加。 */
  function rcSegs(B) {
    const n = B.W * B.H, wall = [], rowSeg = [], colSeg = [];
    for (let i = 0; i < n; i++) { wall.push(0); rowSeg.push(-1); colSeg.push(-1); }
    B.blocked.forEach(function (s) { wall[s] = 1; });
    let nr = 0;
    for (let y = 0; y < B.H; y++) {
      let cur = -1;
      for (let x = 0; x < B.W; x++) {
        const s = y * B.W + x;
        if (wall[s]) cur = -1;
        else { if (cur < 0) { cur = nr; nr++; } rowSeg[s] = cur; }
      }
    }
    let nc = 0;
    for (let x = 0; x < B.W; x++) {
      let cur = -1;
      for (let y = 0; y < B.H; y++) {
        const s = y * B.W + x;
        if (wall[s]) cur = -1;
        else { if (cur < 0) { cur = nc; nc++; } colSeg[s] = cur; }
      }
    }
    return { wall: wall, rowSeg: rowSeg, colSeg: colSeg, nr: nr, nc: nc };
  }

  /* ---- König 的最小点覆盖，**从轨迹里读出来，不往源码里加一行** ----

     那一步本来就在轨迹里：**一次失败的顶层 `walk(r)` 就是「从未匹配行段出发的
     交替搜索」**，而一个行段一旦失败，它的可达集就冻结了（标准引理）。于是扫
     顶层的 `walk` 进出帧，**帧内一次 `place` 都没有的就是失败帧**，把它 `mark`
     过的每一格的行段/列段收起来，得到 Z_row / Z_col，最小点覆盖就是
       （不在 Z_row 里的行段）∪（在 Z_col 里的列段）
     大小恒等于 k。205 块盘（4 块夹具 + 四档 + 200 块随机）上这个式子一块都没差。

     「顶层」判据用的是 **walk 帧自己的嵌套层数**，不是 `Step.depth` —— 两者在
     这份源码上恰好相等（顶层 walk 的 depth 是 1），但前者不依赖解释器怎么数
     调用深度，换一份实现也不会悄悄错位。
     `boardOps` 在 push 之后、pop 之前收：pop 那一步带的正是 `return true` 前
     刷出来的那批 mark/place，漏掉它就会把成功帧误判成失败帧。 */
  function rcKonig(trace, seg) {
    let nest = 0, cur = null;
    const zrow = Object.create(null), zcol = Object.create(null);
    for (let k = 0; k < trace.length; k++) {
      const s = trace[k];
      if (s.frameOp === 'push' && s.frameName === 'walk') {
        if (nest === 0) cur = { sqs: [], placed: false };
        nest++;
      }
      if (cur && nest > 0) {
        const ops = s.boardOps || [];
        for (let m = 0; m < ops.length; m++) {
          if (ops[m].kind === 'mark') cur.sqs.push(ops[m].sq);
          else if (ops[m].kind === 'place') cur.placed = true;
        }
      }
      if (s.frameOp === 'pop' && s.frameName === 'walk') {
        nest--;
        if (nest === 0) {
          if (cur && !cur.placed) {
            for (let m = 0; m < cur.sqs.length; m++) {
              const sq = cur.sqs[m];
              if (seg.rowSeg[sq] >= 0) zrow[seg.rowSeg[sq]] = 1;
              if (seg.colSeg[sq] >= 0) zcol[seg.colSeg[sq]] = 1;
            }
          }
          cur = null;
        }
      }
    }
    const rows = [], cols = [];
    for (let r = 0; r < seg.nr; r++) if (!zrow[r]) rows.push(r);
    for (let c = 0; c < seg.nc; c++) if (zcol[c]) cols.push(c);
    return { rows: rows, cols: cols, size: rows.length + cols.length };
  }

  /* 那张小图：一块 W×H 的格子，点亮的行段画一条横贯的条带、点亮的列段画一条
     竖贯的，障碍打叉。条带同色（C_STACK，"结构线"那个青色，不是四种状态之一
     ——它画的不是搜索状态，是算完之后的一个结论），靠方向分行/列，所以这一页
     的颜色词汇一个都没多。相邻格子的条带首尾相接，于是一整截段看起来就是
     **一条线**，这正是这道题要她看见的东西。 */
  function rcMiniBoard(B, seg, kon) {
    const rowLit = Object.create(null), colLit = Object.create(null);
    kon.rows.forEach(function (r) { rowLit[r] = 1; });
    kon.cols.forEach(function (c) { colLit[c] = 1; });
    const CELL = 15, out = [];
    /* 第 0 行画在最下面 —— 跟棋盘、跟 `sq = 行 * W + 列` 同向。 */
    for (let y = B.H - 1; y >= 0; y--) {
      for (let x = 0; x < B.W; x++) {
        const s = y * B.W + x, st = [];
        if (seg.wall[s]) {
          st.push('background:repeating-linear-gradient(45deg,rgba(159,176,200,.30) 0 1.5px,transparent 1.5px 5px),#0b1220');
        } else {
          const bg = [];
          if (rowLit[seg.rowSeg[s]]) {
            bg.push('linear-gradient(to bottom,transparent 38%,' + C_STACK + ' 38%,' + C_STACK + ' 62%,transparent 62%)');
          }
          if (colLit[seg.colSeg[s]]) {
            bg.push('linear-gradient(to right,transparent 38%,' + C_STACK + ' 38%,' + C_STACK + ' 62%,transparent 62%)');
          }
          bg.push('linear-gradient(' + ((x + y) % 2 === 0 ? 'rgba(30,41,59,.55),rgba(30,41,59,.55)'
                                                         : 'rgba(148,163,184,.16),rgba(148,163,184,.16)') + ')');
          st.push('background:' + bg.join(','));
        }
        st.push('box-shadow:inset 0 0 0 1px rgba(159,176,200,.14)');
        out.push('<span style="' + st.join(';') + '"></span>');
      }
    }
    return '<span style="display:inline-grid;grid-template-columns:repeat(' + B.W + ',' + CELL +
           'px);grid-auto-rows:' + CELL + 'px;margin:6px 0 2px">' + out.join('') + '</span>';
  }

  /* ---------------- 王的支配集：这一页第二道**持有两份源码**的题 ----------------

     ⚠ **这一题的落点不是「算法怎么跑」，是「为什么现实里要用贪心」。**
     前面五个工具讲的都是前者。这一题的第四档讲的是另一件事：7×7 上贪心一眨眼
     给出 8，而精确那一份**跑不完**——于是我们并不知道 8 是不是最优。读数必须写

       ③ 6×6 [1,4,24]            8 /  9,625       4 /  41,627        4

    les2: { zh: '**差距出现了：贪心 6，精确 4。** 贪心每一步都挑「当下能新照顾到最多空格」的那一格，挑完就定。前几步看着都很划算，可它们把剩下的空格切成了彼此够不着的零碎，于是后面要多花两个王去收尾 —— **每一步都最划算，加起来不等于总共最划算**，这就是贪心的全部毛病。代价那一栏也看得见：精确要 71,742 步，是贪心的 8.8 倍。',
           en: '**The gap appears: greedy 6, exact 4.** Greedy takes the square that newly covers the most empty squares and never reconsiders. The early picks all look like bargains, but they scatter what is left into pieces no single king can reach together, so two extra kings are needed to mop up — **locally best at every step does not add up to globally best**, and that is the whole flaw of greedy. The price shows too: the exact search takes 71,742 steps, 8.8× the greedy one.' },
    les3: { zh: '**同样是 6×6、同样三堵墙 —— 只把墙挪了位置，差距就从 2 变成 4。** 贪心要 8 个王，精确仍然只要 4：整整一倍。所以**贪心吃多大亏取决于墙摆在哪儿，不是摆了几堵**。「墙越多越吃亏」是错的：6×6 上按墙数各随机采 40 块，0/2/3/5/7/9/12 堵墙的平均差距是 0.00 / 0.78 / 0.72 / 0.88 / 1.05 / 0.68 / 0.55 —— 从没墙到有墙跳一次，之后基本持平，墙很多时反而回落。也别把这一档当常态：它是特意挑出来的极端例子，那 280 块随机盘里最大的差距只有 3。',
           en: '**Same 6×6, same three walls — only their positions moved, and the gap goes from 2 to 4.** Greedy needs 8 kings where the exact answer is still 4: exactly double. So **how much greedy loses depends on where the walls are, not how many there are**. “More walls, worse greedy” is false: sampling 40 random 6×6 boards per wall count, the mean gap for 0/2/3/5/7/9/12 walls is 0.00 / 0.78 / 0.72 / 0.88 / 1.05 / 0.68 / 0.55 — one jump from none to some, then flat, and it falls again when walls are dense. Do not read this board as typical either: it was picked deliberately as an extreme, and across those 280 random boards the largest gap seen was 3.' },
    les4: { zh: '**这一屏是整个工具的落点。** 贪心 13,578 步给出 8 个王 —— 上限的 6.8%，一眨眼。精确那一份撞上 200,000 步的上限，什么都没说完：它**没有**说「8 是对的」，也**没有**说「8 是错的」，它说的是「不知道」。左边那个 8 是一个**够用**的答案，不是一个**被证明过最少**的答案，而这个工具分辨不了这两件事 —— 正因为如此，它一个字都不会声称。**现实里用贪心不是因为它更好，是因为最优解你等不起**，而这件事在这一屏上是看得见的。',
           en: '**This screen is what the whole tool is for.** Greedy answers 8 kings in 13,578 steps — 6.8% of the ceiling, an eye-blink. The exact search hits the 200,000-step ceiling and finishes nothing: it has **not** said 8 is right, and it has **not** said 8 is wrong. It says it does not know. That 8 on the left is an answer that **suffices**, not an answer **proved to be the fewest**, and this tool cannot tell those two apart — which is exactly why it claims neither. **Greedy is used in the real world not because it is better, but because you cannot wait for the optimum** — and here you can watch that happen.' },
  };

  /* 四档盘。**一块空盘都没有**是题面的一部分（见上面）：`king-*.js` 的 `source()`
     因此对 `blocked` 不给默认值 —— 悄悄退化成空盘就是悄悄换成了这道题的假题。
     顺序是刻意的，差距轴 0 → 2 → 4 → 不知道，推着滑杆走一遍就是四段课。 */
  const KD_BOARDS = [
    { W: 5, H: 5, blocked: [6, 12, 18] },
    { W: 6, H: 6, blocked: [6, 24, 35] },
    { W: 6, H: 6, blocked: [1, 4, 24] },
    { W: 7, H: 7, blocked: [16, 24, 32] },
  ];
  const KD_LESSON = [KD.les1, KD.les2, KD.les3, KD.les4];
  /* 越界当场抛，照 tourBoard / rcBoard 那条（阶段 5 约束 6）。 */
  function kdBoard(st) {
    const i = Math.round(st.board);
    if (!isFinite(i) || i < 0 || i >= KD_BOARDS.length) {
      throw new Error('盘面滑杆的档位越界：' + st.board + '（只有 0…' + (KD_BOARDS.length - 1) + ' 四档）');
    }
    return KD_BOARDS[i];
  }
  /* 文件名 → 给人看的名字。**认不出就原样显示文件名**（照 tourLabel）：并排两块
     棋盘时「哪一块是哪一份」是这一题唯一不能含糊的事。 */
  function kdLabel(file) {
    if (file === 'king-greedy.js') return KD.lblGreedy;
    if (file === 'king-exact.js') return KD.lblExact;
    return { zh: String(file), en: String(file) };
  }
  /* 那一栏的抬头。**两条轨道的 k 不是同一个意思**（见 KD.roKGreedy 上面那条）。 */
  function kdKLabel(file) {
    if (file === 'king-exact.js') return KD.roKExact;
    return KD.roKGreedy;
  }
  /* 一条轨道**跑到结论了没有**。截断、或者 result 不是数字（源码被改坏了、
     或者这一帧轨迹还没建好）→ 一律「不知道」，绝不退回一个数字。 */
  function kdDone(v) { return !!v && !v.truncated && typeof v.result === 'number'; }

  const PROBLEMS = {
    queens: {
      label: Q.tab, brand: Q.brand, tips: Q.tips,
      params: [{ key: 'N', label: Q.paramN, min: 4, max: 8, step: 1, value: 6,
                 fmt: function (v) { const n = Math.round(v); return n + '×' + n; } }],
      sources: ['queens.js'],
      entry: 'solve',
      /* Check 比哪几样可观测行为（§2.9）。三个开关**一个都没有默认值**：默认开
         会把一道根本不产生棋盘事件的题判成永远错，默认关会把该抓的分歧放过去。
         ⚠ **与 `chess/core/exercise-blanks.test.js` 的 `CHECK_QUEENS` 逐字一致，
         两份必须一起改。** 那边重复了一遍是有意的（测试不该 require 一个 html），
         代价就是这条注释：谁先改了谁负责把另一份也改了。 */
      check: { result: true, boardOps: true, counters: ['solutions'] },
      source: function (st, M, file, lang) { return M[file].source({ N: st.N, lang: lang }); },
      board: function (st) { return { files: st.N, ranks: st.N }; },
      zLabel: { zh: '递归深度', en: 'recursion depth' },
      kinds: ['try', 'ok', 'cut', 'back'],
      onMark: function (kind) {
        if (kind === 'try') return { color: C_TRY, label: Q.kTry };
        if (kind === 'ok') return { color: C_OK, label: Q.kOk };
        if (kind === 'cut') return { color: C_CUT, label: Q.kCut };
        if (kind === 'back') return { color: C_BACK, label: Q.kBack };
        return null;
      },
      exportName: function (st) { return 'queens-' + st.N + '.js'; },
      readout: function (a, st) {
        const m = a.main, lines = [];
        if (!m) return '';
        /* 解数：截断时 result 是 undefined —— 画「—」，不画 0。 */
        lines.push(dimt(Q.roSolutions) + ' ' + bval(fmtInt(m.result), C_OK) +
                   ' <span class="dim">·</span> ' + dimt(Q.roSoFar) + ' ' +
                   bval(fmtInt(m.output.length), C_OK));
        lines.push(dimt(STR.roSteps) + ' ' +
                   bval(fmtInt(m.steps), m.truncated ? '#fcd34d' : C_STACK) +
                   (m.truncated ? ' <span class="warn">✂</span>' : ''));
        lines.push(dimt(Q.roQueens) + ' ' + bval(m.pieceCount + ' / ' + st.N, C_OK) +
                   ' <span class="dim">·</span> ' + dimt(Q.roRow) + ' ' +
                   bval(m.stackDepth > 0 ? String(Math.min(m.stackDepth, st.N)) : '—', C_TRY));
        lines.push('<span class="rule"></span>');
        lines.push(dimt(STR.roMarks) + ' ' + bval(String(m.markBright), C_TRY) + ' ' + t(STR.roBright) +
                   ' <span class="dim">·</span> ' + bval(String(m.markStale), C_DIM) + ' ' + t(STR.roStale));
        lines.push(a.note(STR.roStaleWhy));
        if (st.N >= 8) {
          lines.push('<span class="rule"></span>');
          lines.push('<span class="warn">' + a.strong(Q.roN9) + '</span>');
        } else {
          const now = QUEENS_STEPS[st.N], next = QUEENS_STEPS[st.N + 1];
          if (now && next) lines.push(a.note(Q.roGrow, { A: fmtInt(now), B: fmtInt(next) }));
        }
        return lines.join('<br>');
      },
    },

    tourKnight: {
      label: K.tab, brand: K.brand, tips: K.tips,
      params: [{ key: 'board', label: K.paramBoard, min: 0, max: TOUR_BOARDS.length - 1,
                 step: 1, value: 0,
                 fmt: function (v) {
                   const B = TOUR_BOARDS[Math.max(0, Math.min(TOUR_BOARDS.length - 1, Math.round(v)))];
                   return B.W + '×' + B.H;
                 } }],
      /* **唯一一个数组长度不是 1 的 `sources`。** 两份源码 = 两条轨道 = 两块并排的
         棋盘 = 两块并排的编辑器，全部由这一行长出来。 */
      sources: ['tour-dfs.js', 'tour-warnsdorff.js'],
      /* **练习模式下这一题降为「一份可编辑 + 一份只读对照」**（规格 §2.9 阶段 6
         第 1 条）。正常模式的两条轨道装的是「DFS vs Warnsdorff」，而练习要看的是
         「参考 vs 她」——两组对比争同一块屏幕。降级的理由是**形状要少**：阶段 5 的
         教训是多一种形状，就多一类只在那种形状下发作的 bug。

         ⚠ **「每道题只有一条可编辑、会跑、有棋盘的轨道」今天已经不是不变式了。**
         （这里原来是这么写的 —— 阶段 6 那三道题上它为真，阶段 7 之后不再成立。）
         `kingDominate` **不声明** `exerciseSources`，而 `sourcesFor()` 对没声明的
         题目是「原样那几份**全都** edit」，于是它在练习模式下有**两条** edit 轨道：
         两块盘、两个编辑器都活着（截图 `t6-exercise-kingdominate.png` 上看得见）。
         validateDecl 那道门数的是「**带挖空的**可编辑源码」，而两份 `king-*.js` 一个
         挖空都没有，所以门今天放行 —— 那是有意的（见那道门自己的注释）。

         **前向风险，写在这里给下一个动 `algos/` 的人看**：`saveSrc(pid, text)`
         只按 `pid` 存、**没有 blanks 守卫**，两条 edit 轨道今天就都在往同一个
         `chess.exercise.v1.kingDominate.src` 里写（后写的赢，而且不报）。只因
         `restoreSrc` 撞上 `!g.ex.blanks.length` 当场返回，那个键今天没人读，
         存进去的是一坨惰性垃圾。**但只要给两份里的其中一份加上挖空**：那道门
         只数到 1 份带挖空的、不会响，而 `restoreSrc` 会开始读那个键 —— 把今天从
         **另一份**存进去的文本恢复到两条轨道上。
         → 所以给 `king-greedy.js` / `king-exact.js` 加挖空时，**必须同时给
         `kingDominate` 声明 `exerciseSources`**（一份 edit + 一份 contrast），
         照下面这一题的写法。

         留下的那份 DFS **不跑**（4×5 上它是 200,000 步的截断轨迹，跑它只为摆在
         旁边当对照，等于每次进练习模式白付半秒），以只读文本待着——而它本身
         就是提示：挖空点正是 Warnsdorff 比 DFS 多出来的那个 `degree()`。

         顺序即左右：只读对照在左，她要填的那份在右。 */
      exerciseSources: [
        { file: 'tour-dfs.js', role: 'contrast' },
        { file: 'tour-warnsdorff.js', role: 'edit' },
      ],
      entry: 'tour',
      /* 与 exercise-blanks.test.js 的 `CHECK_TOUR` 逐字一致（两份必须一起改）。
         `counters: []` 是**声明**不是遗漏：这一题的返回值就是「找没找到巡游」，
         没有另外需要单独盯的计数器；result 与 boardOps 都开着，不是三项全关。 */
      check: { result: true, boardOps: true, counters: [] },
      /* 三个参数一个都不能省：两份 `source({ W, H, start })` 都没有默认值，缺一个
         当场抛（tour.test.js 有六条断言钉着）。start 固定 0 = a1 角起——四档的
         实测数字全是角起量的，换起点就是另一张表了。 */
      source: function (st, M, file, lang) {
        const B = tourBoard(st);
        return M[file].source({ W: B.W, H: B.H, start: 0, lang: lang });
      },
      board: function (st) { const B = tourBoard(st); return { files: B.W, ranks: B.H }; },
      trackLabel: function (file) { return tourLabel(file); },
      /* 塔最深 21 层（4×5 / 3×7 的 W·H 再加 Warnsdorff 那一层 degree 帧）。
         21 × 0.24 ≈ 5.0 世界单位，与 queens 最深时的 10 × 0.55 = 5.5 同量级——
         正视下的透视放大倍率因此留在 1.6 倍左右，取景框不会把棋盘缩没。 */
      spanZ: 0.24,
      /* ⚠ **换掉默认的侧视。** 默认那一条是 az=−π/2、沿世界 x 轴看进去的，而并排
         两块棋盘正是沿 x 轴摆开的——浏览器里当场看到的后果是两块盘严丝合缝地
         叠成一块、两行 caption 叠成一行、两座塔叠成一座，而且看不出是叠着的。
         换成近乎俯视的 az=0 / el=−1.25：屏幕右 = 世界 x（两块盘照旧分开），
         屏幕上 ≈ 0.95·世界 z（塔照旧立起来），行号方向被压成 0.315 ——
         塌掉一根轴正是「侧视」这个词的意思，只不过塌掉的换成了另一根。 */
      sideView: { az: 0, el: -1.25, dist: 15 },
      zLabel: { zh: '递归深度（马走了几格）', en: 'recursion depth (squares walked)' },
      kinds: ['try', 'ok', 'cut', 'back'],
      onMark: function (kind) {
        if (kind === 'try') return { color: C_TRY, label: K.kTry };
        if (kind === 'ok') return { color: C_OK, label: K.kOk };
        if (kind === 'cut') return { color: C_CUT, label: K.kCut };
        if (kind === 'back') return { color: C_BACK, label: K.kBack };
        return null;
      },
      exportName: function (st) {
        const B = tourBoard(st);
        return 'knights-tour-' + B.W + 'x' + B.H + '.js';
      },
      readout: function (a, st) {
        const lines = [];
        if (!a.tracks.length) return '';
        /* 练习模式下左边那份只读对照**不跑**，它没有步数、没有结论，也没有
           棋盘 —— 一行都不给它写，只在末尾说清楚它摆在那里是干嘛的。 */
        const live = a.tracks.filter(function (v) { return !v.contrast; });
        const hasContrast = live.length !== a.tracks.length;
        live.forEach(function (v, k) {
          if (k) lines.push('<span class="rule"></span>');
          lines.push('<b style="--c:' + (v.index === a.active ? C_STACK : C_DIM) + '">' +
                     esc(t(tourLabel(v.file))) + '</b>' +
                     (v.index === a.active ? ' <span class="dim">◂</span>' : ''));
          /* 截断：步数标黄 + ✂，结论写「不知道」。**绝不写 0，也绝不写 false** ——
             那条轨迹根本没跑到结论，把「不知道」印成一个数字才是工具坏了。 */
          let verdict;
          if (v.truncated) verdict = '<span class="warn">' + esc(t(K.roUnknown)) + '</span>';
          else if (v.result === true) verdict = bval(esc(t(K.roFound)), C_OK);
          else if (v.result === false) verdict = bval(esc(t(K.roNone)), C_CUT);
          else verdict = bval('—', C_DIM);
          lines.push('&nbsp;&nbsp;' + bval(fmtInt(v.steps), v.truncated ? '#fcd34d' : C_STACK) +
                     (v.truncated ? ' <span class="warn">✂</span>' : '') + ' ' + dimt(STR.roSteps) +
                     ' <span class="dim">·</span> ' + verdict);
          lines.push('&nbsp;&nbsp;' + dimt(K.roBack) + ' ' + bval(fmtInt(v.ops.back), C_BACK) +
                     ' <span class="dim">·</span> ' + dimt(K.roWalked) + ' ' +
                     bval(fmtInt(v.pieceCount), C_OK));
          lines.push('&nbsp;&nbsp;' + dimt(STR.roHere) + ' ' +
                     bval(fmtInt(v.i) + ' / ' + fmtInt(Math.max(0, v.len - 1)), C_STACK) +
                     (v.len > 0 && v.i >= v.len - 1 ? ' <span class="dim">' + esc(t(STR.trkDone)) + '</span>' : ''));
          if (v.truncated) lines.push('&nbsp;&nbsp;<span class="warn">' + esc(t(K.roTrunc)) + '</span>');
        });
        lines.push('<span class="rule"></span>');
        /* 「一个游标推两条轨迹」这句话只在真有两条跑着的轨迹时才成立。 */
        if (live.length > 1) {
          lines.push(a.note(STR.trkSameI, { I: fmtInt(a.cursor) }));
          lines.push(a.note(STR.trkPick));
        }
        if (hasContrast) lines.push(a.note(STR.exContrast));
        lines.push('<span class="rule"></span>');
        /* 练习模式（`hasContrast` ⇔ 左边那份只读对照在场）下换成 lesYours ——
           四段课讲的都是「两边如何如何」，而这时候只有一边在跑。 */
        lines.push(a.strong(hasContrast ? K.lesYours
                                        : (TOUR_LESSON[Math.round(st.board)] || TOUR_LESSON[0])));
        return lines.join('<br>');
      },
    },

    knightPath: {
      label: KP.tab, brand: KP.brand, tips: KP.tips,
      /* 目标格滑杆从 1 起，不从 0 起：0 是 a1 本身，「从 a1 到 a1 是 0 步」是真的，
         但它是一档什么都不搜索的空演示。源码那边照样处理得了这个情形
         （knight-path.test.js 有一条钉着），只是不摆到滑杆上占一格。 */
      params: [{ key: 'target', label: KP.paramTarget, min: 1, max: KP_W * KP_W - 1,
                 step: 1, value: KP_W * KP_W - 1,
                 fmt: function (v) { return kpSqName(Math.round(v)); } }],
      sources: ['knight-path.js'],
      /* 入口是**递归**那一个：`expand(frontier, d)` 铺第 d 层。于是调用深度 =
         BFS 层号 = 最短距离，第三根轴不需要任何额外声明就是对的（见上面）。 */
      entry: 'expand',
      /* 三个参数一个都不能省：`source({ W, start, target })` 没有默认值，缺一个
         当场抛（knight-path.test.js 有八条断言钉着）。 */
      source: function (st, M, file, lang) {
        return M[file].source({ W: KP_W, start: KP_START, target: st.target, lang: lang });
      },
      /* 与 exercise-blanks.test.js 的 `CHECK_KP` 逐字一致（两份必须一起改）。
         返回值就是最短距离，没有需要单独盯的计数器 —— `counters: []` 是声明。 */
      check: { result: true, boardOps: true, counters: [] },
      board: function () { return { files: KP_W, ranks: KP_W }; },
      zLabel: { zh: 'BFS 层号（= 走几步）', en: 'BFS layer (= moves)' },
      /* 三种，没有 'back'。少的那一行就是这一题的一半内容。 */
      kinds: ['try', 'ok', 'cut'],
      onMark: function (kind) {
        if (kind === 'try') return { color: C_TRY, label: KP.kTry };
        if (kind === 'ok') return { color: C_OK, label: KP.kOk };
        if (kind === 'cut') return { color: C_CUT, label: KP.kCut };
        return null;
      },
      exportName: function (st) { return 'knight-path-a1-' + kpSqName(st.target) + '.js'; },
      readout: function (a, st) {
        const m = a.main, lines = [];
        if (!m) return '';
        /* 三种结局三种写法，**没有一种是把「不知道」印成一个数字**：

  /* ================= ② 由声明生成：页签、滑杆、开关、视角 =================
     以下到「画」那一节之前，没有一处认识任何一道题的名字。 */

  const PIDS = Object.keys(PROBLEMS);

  /* 滑杆的 state 键带题目前缀：两道题都叫 `N` 时它们仍是两根互不相干的滑杆。
     引擎的 state 是一个平坦的对象（buildParams 写 state[p.key]），不加前缀就是
     两道题共用一个值——而 knightPath 的 W 与 queens 的 N 恰好都是「棋盘边长」，
     这种碰撞不是假想的。 */
  function pkey(pid, key) { return pid + '.' + key; }

  const PARAMS = [];
  PIDS.forEach(function (pid) {
    (PROBLEMS[pid].params || []).forEach(function (p) {
      PARAMS.push({
        key: pkey(pid, p.key), label: p.label, min: p.min, max: p.max, step: p.step,
        value: p.value,
        /* fmt 是引擎无条件调用的（buildParams 里 `p.fmt(...)`），省略会当场抛。 */
        fmt: p.fmt || function (v) { return String(v); },
        map: p.map,
      });
    });
  });

  /* 一道题此刻的参数值。整数步长的滑杆四舍五入成整数——`source({ N })` 拿到
     6.000000000000001 会当场抛（queens.js 校验 Math.floor(N) === N）。 */
  function paramsOf(pid) {
    const st = Object.create(null);
    (PROBLEMS[pid].params || []).forEach(function (p) {
      let v = E.state[pkey(pid, p.key)];
      if (v == null) v = p.value;
      if (typeof p.step === 'number' && p.step >= 1 && Math.floor(p.step) === p.step) v = Math.round(v);
      st[p.key] = v;
    });
    return st;
  }
  /* 滑杆此刻的读数，**给人看的**（状态牌上那句「参数改成 …」用它）。 */
  function paramSig(pid) {
    const st = paramsOf(pid);
    return Object.keys(st).map(function (k) { return k + '=' + st[k]; }).join(' ');
  }
  /* 「这组轨道是按什么建出来的」，**给机器比的**。
     **练习模式是它的一部分**：练习模式换掉的是整份源码（占位版 vs 参考版），
     跟换一个滑杆值一样必须触发重建，而重建的唯一入口 pollParams 只认这个签名。
     漏了它的后果不是报错，是"开关按下去，界面上什么都不变"。它也顺手解决了
     另一件事：在一道题上打开练习模式再切到另一道题，那一道的签名也已经变了，
     pollParams 下一帧就会在 withBusy 里把它重建掉。

     ⚠ **两个签名分开，是因为它们的读者不同。** 合成一个的后果实测过：状态牌上
     写出来的是「参数改成 board=2 ex=1」——她按的是盘面滑杆，`ex=1` 是这一页
     自己的记账，出现在那句话里只会让人以为自己不小心动了别的东西。 */
  function buildSig(pid) {
    return paramSig(pid) + ' ex=' + (exerciseOn() ? 1 : 0);
  }

  /* ---------------- 练习模式（§2.9）：挖空、占位、只读对照 ----------------

     开关由下面的 TOGGLES 生成，值落在 `E.state.exercise` 上。判据写成 `=== true`：
     E.init 跑之前 state 里还没有这个键，`undefined` 要算"关"。 */
  function exerciseOn() { return E.state.exercise === true; }

  /* 此刻是哪种语言。引擎没有导出 LANG，但导出了 `t()` —— 拿一个
     `{zh:'zh', en:'en'}` 去问它自己，答案必定与界面上其余文案同源，
     不会各说各话（也不必再解析一次 localStorage / ?lang=）。 */
  function curLang() { return t({ zh: 'zh', en: 'en' }); }

  /* 这道题此刻要哪几份源码、每份什么角色：
       'edit'      可编辑、跑、有棋盘（正常模式下每一份都是这个角色）
       'contrast'  只读对照，**不跑**、没有棋盘（§2.9 阶段 6 第 1 条）
     没声明 `exerciseSources` 的题目，练习模式下就是原样那几份全都可编辑。

     ⚠ **第三种角色 `'reference'` 不在这里，也不许出现在 `exerciseSources` 里。**
     它是按下 Check 那一刻由页面自己接上去的一条轨道（见 attachRefTrack），
     声明层不认识它，理由有两条，都是硬的：
       ① 它装的是**参考答案**。任何能让它落进编辑器槽位的写法都等于把答案摆在
          她眼前，练习当场失效 —— 所以它**没有槽位**（syncEditorSlots 把它当
          `gone`），也因此不占 MAX_TRACKS（那个数是从 sources 数出来的槽位数）。
       ② 它是判定的产物，随判定生灭：换参数 / 开关 / Run / 改一个字都让它消失。
          写进声明就成了"这道题永远有三条轨道"，那是另一回事。 */
  function sourcesFor(P) {
    if (exerciseOn() && P.exerciseSources) return P.exerciseSources;
    return P.sources.map(function (f) { return { file: f, role: 'edit' }; });
  }

  /* 一条练习轨道随身带的东西：挖空清单，加上占位注释那几行的**中英两份原文**。

     `notes` 两份都留着，今天有两个读者，都跟"她手上那份可能是另一种语言写的"
     有关：① `restoreSrc` —— 存档是上一种语言下存的，把注释那几行换成当前语言的；
     ② `noteIndexOf`（第 4 级「填进编辑器」）—— 两份都认，所以切过语言之后也
     定得住她那段答案。**它不再是切语言的机制**：整份源码换新语言那一份是
     `retextSources` 干的，见那里。

     `pristine` 是**这条轨道刚生成出来时的占位版原文**。第 4 级的「填进编辑器」
     靠它划出「她写的是哪几行」：拿她此刻的文本跟这一份对齐，挖空之外的部分
     一模一样时，中间剩下的那几行就是她的答案（见 answerRange）。没有它就只能
     猜「注释行下面那一行是她的答案」—— 而她的答案可以是三行，猜错就是吃掉她
     写的东西。

     ⚠ **这里不再记语言。** 从前有一个 `lang: curLang()`，而 `tk.lang`（见
     markGenerated）记的是同一件事 —— 一条轨道的文本是哪种语言生成的。两份
     记账迟早分岔，而分岔的后果是切语言时换一半留一半。留 `tk.lang` 那一份：
     正常模式下根本没有 `ex`，它是唯一两种模式都在的那个。 */
  function exStateOf(parsed) {
    return {
      blanks: parsed.blanks,
      pristine: parsed.placeholder,
      notes: {
        zh: parsed.blanks.map(function (b) { return Exercise.noteLine(b, 'zh'); }),
        en: parsed.blanks.map(function (b) { return Exercise.noteLine(b, 'en'); }),
      },
    };
  }

  /* ================= localStorage：**这一页唯一碰它的一段** =================
     （§2.9 阶段 6 第 5 条；全局硬约束：`chess/core/exercise.js` 里一次都不许出现）

     ---- 键是两个，不是一个 ----

       chess.exercise.v1.<problem>.src      { text, paramSig, lang }
       chess.exercise.v1.<problem>.<blank>  { attempts, hintLevel, solvedAt }

     **文本一题一份**，不是一空一份：queens 与 knightPath 各有两个挖空，而可编辑
     的单元是**整份源码**（阶段 6 第 2 条「整份源码照旧可编辑」）—— 一份文本没法
     拆给两个键，硬拆就是把同一个字符串存两遍，然后等它们分岔。
     `attempts` / `hintLevel` / `solvedAt` 反过来**确实是按挖空的**：§2.9 要这份
     数据是为了将来做「哪些概念她反复卡住」的回顾，那要的正是这三个，不是文本。

     `paramSig` 不是锦上添花：改一个 N，源码就是另一份了，把 N=6 写的答案倒进
     N=8 的编辑器只会得到一段对不上号的代码。对不上就**不恢复并说清楚**
     （见 STR.exStale），不猜。

     一份键的形状要是变了：**换 `v1` 前缀，不做迁移**（§2.9 原文）。

     ---- 读不出来一律当作没有，绝不抛 ----

     这是这一页唯一一处「静默降级」是对的地方 —— 她的浏览器存储坏了，不该让
     整个工具打不开。但每一条降级都在控制台留一句 `console.warn`：静默的是界面，
     不是日志。localStorage 整个不可用（隐私模式 / 关了存储）时退到一份内存副本：
     功能照常，只是刷新一次就没了（页面会明说，见 STR.exNoStore）。

     ---- 只在练习模式下写 ----

     `saveSrc` / `saveBlank` 开头都有 `exerciseOn()` 那道闸。正常模式下这一页一个
     字节都不往存储里写。 */
  const LS_PREFIX = 'chess.exercise.v1.';
  const memStore = Object.create(null);      // localStorage 不可用时的替身（只活一次会话）
  let lsOk = null;                           // null = 还没试过；true/false = 试过了
  let lsWarned = false;

  /* 能不能用？**要真写一次才算数** —— Safari 隐私模式下 `localStorage` 这个对象
     是在的，`setItem` 才抛。只探一次，结果记下来。 */
  function lsAvail() {
    if (lsOk !== null) return lsOk;
    try {
      const probe = LS_PREFIX + '__probe';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      lsOk = true;
    } catch (e) {
      lsOk = false;
      console.warn('[chess-board-algorithms] localStorage 用不了，练习进度只在本次会话里记着：' +
                   ((e && e.message) ? e.message : String(e)));
    }
    return lsOk;
  }
  function storeGet(key) {
    const full = LS_PREFIX + key;
    let raw = null;
    if (lsAvail()) {
      try { raw = window.localStorage.getItem(full); }
      catch (e) {
        console.warn('[chess-board-algorithms] 读不出 ' + full + '，当作没有：' +
                     ((e && e.message) ? e.message : String(e)));
        return null;
      }
    } else {
      raw = Object.prototype.hasOwnProperty.call(memStore, full) ? memStore[full] : null;
    }
    if (raw == null) return null;
    let v;
    /* ⚠ 坏掉的存档**不删**：删掉就等于替她扔东西，而且下一次打开会安安静静
       什么都不说。留着 + 每次开页面 warn 一次，才是"这里有一份读不了的存档"
       这件事唯一说得出口的形式。 */
    try { v = JSON.parse(raw); }
    catch (e) {
      console.warn('[chess-board-algorithms] 存档 ' + full + ' 不是合法 JSON，当作没有（原文留着没动）：' +
                   ((e && e.message) ? e.message : String(e)));
      return null;
    }
    if (!v || typeof v !== 'object' || Array.isArray(v)) {
      console.warn('[chess-board-algorithms] 存档 ' + full + ' 不是一个对象，当作没有：' + raw.slice(0, 80));
      return null;
    }
    return v;
  }
  function storeSet(key, val) {
    const full = LS_PREFIX + key;
    let raw;
    try { raw = JSON.stringify(val); }
    catch (e) { console.warn('[chess-board-algorithms] ' + full + ' 序列化失败，没存：' + e.message); return false; }
    if (!lsAvail()) { memStore[full] = raw; return true; }
    try { window.localStorage.setItem(full, raw); return true; }
    catch (e) {
      /* 配额满 / 存储被禁：说一次就够，别每次敲键盘都刷一条。 */
      if (!lsWarned) {
        lsWarned = true;
        console.warn('[chess-board-algorithms] 写不进 ' + full + '（多半是配额满了），进度这一次记不下来：' +
                     ((e && e.message) ? e.message : String(e)));
      }
      return false;
    }
  }
  function storeDel(key) {
    const full = LS_PREFIX + key;
    if (!lsAvail()) { delete memStore[full]; return; }
    try { window.localStorage.removeItem(full); }
    catch (e) { console.warn('[chess-board-algorithms] 删不掉 ' + full + '：' + ((e && e.message) ? e.message : String(e))); }
  }

  /* ---- 两个键各自的读写。**校验在这里做完**：上面那层只管"是不是一个对象"，
