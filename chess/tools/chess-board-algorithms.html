     得 NaN、查表落空、函数**直接 return**——一个后都不画，也不报任何错。
     所以换算在这里做一次，认不出的代号会被读数区点名（见 unknownPieces），
     绝不安静地少画一枚子。 */
  const PIECE_CODE = { wP: 1, wN: 2, wB: 3, wR: 4, wQ: 5, wK: 6,
                       bP: -1, bN: -2, bB: -3, bR: -4, bQ: -5, bK: -6 };
  function pieceCode(v) {
    if (typeof v === 'number' && isFinite(v) && Math.abs(Math.round(v)) >= 1 && Math.abs(Math.round(v)) <= 6) {
      return Math.round(v);
    }
    const c = PIECE_CODE[v];
    return typeof c === 'number' ? c : null;
  }

  /* ---------------- 文案：一律 {zh, en}，默认英文（§1.6） ---------------- */
  const STR = {
    title: { zh: '棋盘上的经典算法', en: 'Classic Problems on the Board' },
    h1:    { zh: '棋盘算法', en: 'Board Algorithms' },

    run:   { zh: '运行', en: 'Run' },
    reset: { zh: '还原为原始版本', en: 'Reset to original' },
    hint:  { zh: '\\ 折叠代码面板 · 拖分隔条调宽 · F10 步过 · F11 步入 · Shift+F11 步出 · F9 断点 · F5 跑到断点 · 点棋盘任一格跳到最近一次动它的那步 · T 换页签 · 1–3 视角 · 拖拽旋转',
             en: '\\ folds the code panel · drag the divider · F10 step over · F11 step in · Shift+F11 step out · F9 breakpoint · F5 run to breakpoint · click any square to jump to the step that last touched it · T tabs · 1–3 views · drag to rotate' },

    ready:  { zh: '改一改代码，Run 会重新解释执行并把棋盘重置到第 0 步。',
              en: 'Edit the code; Run re-interprets it and resets the board to step 0.' },
    busy:   { zh: '正在跑解释器…', en: 'Running the interpreter…' },
    ranOk:  { zh: '运行完成', en: 'Ran' },
    steps:  { zh: '步', en: 'steps' },
    result: { zh: '返回值', en: 'returned' },
    truncMsg: { zh: '超出 200,000 步上限，没有跑完 —— 这不是工具坏了，这就是这一课',
                en: 'over the 200,000-step ceiling; it did not finish — that is the lesson, not a malfunction' },
    paramChanged: { zh: '参数改成 %V：源码按新参数重新生成了，自己改过的内容会被覆盖。',
                    en: 'Parameter is now %V: the source was regenerated, so any edits you had made are gone.' },
    syntax:  { zh: '语法错误', en: 'Syntax error' },
    runtime: { zh: '运行时错误', en: 'Runtime error' },
    internal:{ zh: '编辑器内部出错（不是你的代码的问题）', en: 'Internal editor error (not your code)' },
    atLine:  { zh: '第 %L 行', en: 'line %L' },
    bootFail:{ zh: '算法源码生成器没能启动，这一页跑不起来：',
               en: 'The algorithm source generator failed to start; this page cannot run: ' },

    /* ---- 显示开关（四条都是"画不画"，不是"算什么"） ---- */
    tgMarks:  { zh: '四种状态', en: 'The four states' },
    tgStale:  { zh: '过期的标记', en: 'Stale marks' },
    tgTower:  { zh: '深度塔', en: 'Depth tower' },
    tgPieces: { zh: '棋子', en: 'Pieces' },

    vFront: { zh: '正视', en: 'Front' },
    vTable: { zh: '桌面 45°', en: 'Table 45°' },
    vSide:  { zh: '侧视', en: 'Side' },

    /* ---- 读数区的通用词（每道题自己的句子写在它自己的键里） ---- */
    roSteps:   { zh: '解释器步数', en: 'Interpreter steps' },
    roHere:    { zh: '游标处', en: 'At the cursor' },
    roStack:   { zh: '栈深', en: 'stack' },
    roMarks:   { zh: '棋盘上的标记', en: 'Marks on the board' },
    roBright:  { zh: '此刻有效', en: 'current' },
    roStale:   { zh: '过期（压暗）', en: 'stale (dimmed)' },
    roStaleWhy:{ zh: '压暗的那些是**回溯之后没有被擦掉的**旧标记：算法只还原它的三张表和那一格的棋子，标记层不跟着缩回去。工具按「写下它时的调用深度」判断它还算不算数——这是显示层免费做到的，源码里每次都擦一遍要多花 19–23% 的步数。',
                 en: 'The dimmed ones are old marks left behind by backtracking: the algorithm restores its three tables and that square’s piece, but not the mark layer. The tool decides whether a mark still counts from the call depth it was written at — free here, whereas erasing them in the source costs 19–23% more steps.' },
    roClick:   { zh: '点棋盘上任一格 → 代码跳到最近一次动它的那一步（§5.4）。',
                 en: 'Click any square and the code jumps to the step that last touched it (§5.4).' },
    roJumped:  { zh: '第 %S 步：%K %Q', en: 'step %S: %K %Q' },
    roNoTouch: { zh: '这一格整趟跑下来没有被动过。', en: 'nothing ever touched that square in this run.' },
    roBadPiece:{ zh: '有 %N 枚棋子的代号认不出（%L），所以没画出来 —— place() 的第二个参数要是 "wQ" 这样的两位代号。',
                 en: '%N piece code(s) not recognised (%L), so they are not drawn — place() wants a two-letter code such as "wQ".' },
    roOffBoard:{ zh: '有 %N 个格子编号落在棋盘之外，没画。', en: '%N square number(s) fall outside the board and are not drawn.' },

    legTower:  { zh: '调用栈（每层最新的那一格）', en: 'call stack (newest square per level)' },
  };
  const t = function (s) { return E.t(s); };

  /* ================= 通用小工具（读数区与画布共用） ================= */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  /* 整数格式化。**非数字一律画「—」，绝不画 "NaN"，也绝不把「不知道」写成 0。**
     §2.8 明确邀请她改这份源码，`solutions` 里最后装的是什么，这一层管不着；
     而截断的轨迹上「一共几个解」是真的不可知。 */
  function fmtInt(n) {
    if (n == null || typeof n !== 'number' || !isFinite(n)) return '—';
    const s = Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (n < 0 ? '−' : '') + s;                 // U+2212，不是 ASCII 连字符
  }
  function bval(text, color) { return '<b style="--c:' + color + '">' + text + '</b>'; }
  function dimt(s) { return '<span class="dim">' + t(s) + '</span>'; }

  /* ================= ① PROBLEMS —— 这一页的全部题目声明 =================

     §4⑤ 的明文架构要求：**新增一道题 = 加一个键 + 一个 `core/algos/*.js` +
     在上面 `GENERATED:ALGOS` 标记行上加一个名字**。tab、滑杆、图例、读数、
     棋盘尺寸、相机全部由这里生成，下面的渲染与 tab 机制里不许出现任何一道题
     的名字（`grep -c "queens" 渲染段` 必须是 0）。

     一个键要提供的东西：

       label     {zh,en}      页签名
       brand     {zh,en}      代码面板标题下那一行
       tips      {zh,en}      面板底部的提示（讲清一个顿悟，指向一个具体视角/开关）
       params    []           滑杆声明；UI 自动生成，值写进 E.state['键.参数名']
       sources   []           要哪几份 algos/*.js（**数组**：tourKnight 一个键持有两份）
       entry     string       入口函数名（§1.4：z 轴 = 这个函数的递归深度）
       source(st, M, file)    → 一份源码字符串。M 是 file → 模块对象
       board(st)             → { files, ranks }
       kinds     []           这道题会用到的 mark 种类，决定图例的行与顺序
       onMark(kind)          → { color, label } 或 null（认不出的种类不画）
       zOf(m, api)           → 这个标记该抬到第几层（省略 = 它的调用深度）
       zLabel    {zh,en}      z 轴叫什么（queens 是递归深度，knightPath 会是 BFS 层）
       readout(a, st)        → 读数区的 HTML（a 是下面 readoutApi() 给的那个对象）
       exportName(st)        （可选）将来导出 .js 时的文件名 */

  const Q = {
    tab:   { zh: 'N 皇后', en: 'N-Queens' },
    brand: { zh: '在 N×N 的棋盘上摆 N 个后，让它们谁也吃不到谁。',
             en: 'Place N queens on an N×N board so that none of them attacks another.' },
    tips:  { zh: '每一行只放一个后，所以要查的只剩列和两条斜线。按 F11 一步步走进去：左边调用栈长多深，右边棋盘上的深度塔就叠多高——它们是同一件事的两种画法。按 3 切「侧视」，那座塔才看得见（正视是顺着它看进去的，什么也读不到）。压暗的绿格是回溯之后没擦掉的旧标记，不是此刻的判断。把 N 拉到 8：十五万步跑得完；再往上一格就跑不完了。',
             en: 'One queen per row, so only the columns and the two diagonals are left to check. Press F11 to walk in: the call stack on the left and the depth tower on the right grow together — one thing drawn two ways. Press 3 for the side view, which is the only one where the tower is visible (the front view looks straight down it). Dimmed green squares are stale marks left by backtracking, not a judgement about right now. Slide N to 8: 156,772 steps still finish; one more and it does not.' },

    roSolutions: { zh: '解的个数', en: 'Solutions' },
    roSoFar:     { zh: '截至游标', en: 'so far' },
    roQueens:    { zh: '盘上的后', en: 'Queens placed' },
    roRow:       { zh: '正在摆第几行', en: 'Row being filled' },
    roN9: { zh: '**再往上一格就跑不完了。** N=9 要 705,359 步，而解释器的上限是 200,000 —— 那不是「慢一点」，是「做不到」。所以滑杆到 8 为止，N=8 已经用掉上限的 78%。',
            en: 'One more and it does not finish. N=9 needs 705,359 steps against the interpreter’s 200,000 ceiling — not slower, undoable. That is why the slider stops at 8: N=8 already uses 78% of the budget.' },
    roGrow: { zh: '每往上加一格，工作量大约乘以 4.5：%A → %B 步。',
              en: 'Each extra rank multiplies the work by about 4.5: %A → %B steps.' },
    paramN: { zh: '棋盘边长 <i>N</i>', en: 'Board size <i>N</i>' },
    kTry:  { zh: '正在尝试', en: 'trying' },
    kOk:   { zh: '已确认', en: 'confirmed' },
    kCut:  { zh: '被剪枝（这一格已被攻击）', en: 'pruned (already attacked)' },
    kBack: { zh: '回溯撤销', en: 'backtracked' },
  };

  /* 每个 N 跑出来多少步——**只用来讲「乘以 4.5」那一句**，不参与任何判断。
     实测值（`Interp.run(src, { host: {} })` 读 trace.length，与 core/algos/queens.js
     文件头、规格 §4⑤ 的表逐位一致）。 */
  const QUEENS_STEPS = { 4: 770, 5: 2621, 6: 9500, 7: 37049, 8: 156772, 9: 705359 };

  const PROBLEMS = {
    queens: {
      label: Q.tab, brand: Q.brand, tips: Q.tips,
      params: [{ key: 'N', label: Q.paramN, min: 4, max: 8, step: 1, value: 6,
                 fmt: function (v) { const n = Math.round(v); return n + '×' + n; } }],
      sources: ['queens.js'],
      entry: 'solve',
      source: function (st, M, file) { return M[file].source({ N: st.N }); },
      board: function (st) { return { files: st.N, ranks: st.N }; },
      zLabel: { zh: '递归深度', en: 'recursion depth' },
      kinds: ['try', 'ok', 'cut', 'back'],
      onMark: function (kind) {
        if (kind === 'try') return { color: C_TRY, label: Q.kTry };
        if (kind === 'ok') return { color: C_OK, label: Q.kOk };
        if (kind === 'cut') return { color: C_CUT, label: Q.kCut };
        if (kind === 'back') return { color: C_BACK, label: Q.kBack };
        return null;
      },
      exportName: function (st) { return 'queens-' + st.N + '.js'; },
      readout: function (a, st) {
        const m = a.main, lines = [];
        if (!m) return '';
        /* 解数：截断时 result 是 undefined —— 画「—」，不画 0。 */
        lines.push(dimt(Q.roSolutions) + ' ' + bval(fmtInt(m.result), C_OK) +
                   ' <span class="dim">·</span> ' + dimt(Q.roSoFar) + ' ' +
                   bval(fmtInt(m.output.length), C_OK));
        lines.push(dimt(STR.roSteps) + ' ' +
                   bval(fmtInt(m.steps), m.truncated ? '#fcd34d' : C_STACK) +
                   (m.truncated ? ' <span class="warn">✂</span>' : ''));
        lines.push(dimt(Q.roQueens) + ' ' + bval(m.pieceCount + ' / ' + st.N, C_OK) +
                   ' <span class="dim">·</span> ' + dimt(Q.roRow) + ' ' +
                   bval(m.stackDepth > 0 ? String(Math.min(m.stackDepth, st.N)) : '—', C_TRY));
        lines.push('<span class="rule"></span>');
        lines.push(dimt(STR.roMarks) + ' ' + bval(String(m.markBright), C_TRY) + ' ' + t(STR.roBright) +
                   ' <span class="dim">·</span> ' + bval(String(m.markStale), C_DIM) + ' ' + t(STR.roStale));
        lines.push(a.note(STR.roStaleWhy));
        if (st.N >= 8) {
          lines.push('<span class="rule"></span>');
          lines.push('<span class="warn">' + a.strong(Q.roN9) + '</span>');
        } else {
          const now = QUEENS_STEPS[st.N], next = QUEENS_STEPS[st.N + 1];
          if (now && next) lines.push(a.note(Q.roGrow, { A: fmtInt(now), B: fmtInt(next) }));
        }
        return lines.join('<br>');
      },
    },
  };

  /* ================= ② 由声明生成：页签、滑杆、开关、视角 =================
     以下到「画」那一节之前，没有一处认识任何一道题的名字。 */

  const PIDS = Object.keys(PROBLEMS);

  /* 滑杆的 state 键带题目前缀：两道题都叫 `N` 时它们仍是两根互不相干的滑杆。
     引擎的 state 是一个平坦的对象（buildParams 写 state[p.key]），不加前缀就是
     两道题共用一个值——而 knightPath 的 W 与 queens 的 N 恰好都是「棋盘边长」，
     这种碰撞不是假想的。 */
  function pkey(pid, key) { return pid + '.' + key; }

  const PARAMS = [];
  PIDS.forEach(function (pid) {
    (PROBLEMS[pid].params || []).forEach(function (p) {
      PARAMS.push({
        key: pkey(pid, p.key), label: p.label, min: p.min, max: p.max, step: p.step,
        value: p.value,
        /* fmt 是引擎无条件调用的（buildParams 里 `p.fmt(...)`），省略会当场抛。 */
        fmt: p.fmt || function (v) { return String(v); },
        map: p.map,
      });
    });
  });

  /* 一道题此刻的参数值。整数步长的滑杆四舍五入成整数——`source({ N })` 拿到
     6.000000000000001 会当场抛（queens.js 校验 Math.floor(N) === N）。 */
  function paramsOf(pid) {
    const st = Object.create(null);
    (PROBLEMS[pid].params || []).forEach(function (p) {
      let v = E.state[pkey(pid, p.key)];
      if (v == null) v = p.value;
      if (typeof p.step === 'number' && p.step >= 1 && Math.floor(p.step) === p.step) v = Math.round(v);
      st[p.key] = v;
    });
    return st;
  }
  function paramSig(pid) {
    const st = paramsOf(pid);
    return Object.keys(st).map(function (k) { return k + '=' + st[k]; }).join(' ');
  }

  /* ---------------- 视角：§5.3 的常规条（工具⑤ 的主体**就是**一块棋盘） ----------------

     `1` 正视：沿棋盘法线（z 轴）正对看进去，行列直读。它同时是引擎的初始相机、
     双击回正的家、以及取景框（updateFit）的计算基准——三处必须是同一份数字，
     所以从 HOME_VIEW 展开，不另写一遍。

     `2` 桌面 45°：**仰角是负的，这不是笔误。** `makeCam()` 的 `eye.y = dist·sin(el)`，
     而 board-render 把 rank 0 放在 y 的负侧；`el > 0` 会把人放到黑方那一侧。
     用引擎自己的 makeCam/proj 量过（N=6）：el=−π/4 时 rank 0 落在屏幕 y=+148、
     rank N 落在 y=−111 —— 白方在近处，正是坐在桌前看一副摆好的棋盘的样子。

     `3` 侧视：§5.3 要求「凡是把第三根轴立起来的 tab，必须提供一个沿那根轴的侧视」。
     这一页的第三根轴是深度塔（queens 是递归深度）。同一份实测：
       正视   az=0      el=0      深度塔七层的屏幕坐标全是 (0,0) —— **一层都看不见**
                                  （量的是过原点那一列；离中心越远的格子，透视会
                                  让它的塔顶沿径向外移一点，那是景深，不是层次）
       桌面   az=0      el=−π/4   七层的屏幕 y = 0 −24 −49 −76 −104 −134 −166
       侧视   az=−π/2   el=0      七层的屏幕 x = 0 +33 +66 +99 +132 +165 +198
     侧视把视线摆成垂直于 z 轴，于是深度铺开在屏幕横向、行号仍然是纵向，
     代价是那一列格子压成一条线——那正是「侧视」这个词的意思。
     **az 取 −π/2 而不是 +π/2**：两者都是合法的侧视，但 +π/2 时 z 映射到屏幕的
     −x，深度轴的刻度从右往左数（浏览器里当场看到 “5 4 3 2 …”）；−π/2 让深度
     往右长，与读数方向一致，也与左边调用栈从上往下长同向。 */
  const HOME_VIEW = { az: 0, el: 0, dist: 14, tx: 0, ty: 0, tz: 0 };
  const VIEWS = {
    front: Object.assign({ label: STR.vFront }, HOME_VIEW),
    table: { label: STR.vTable, az: 0, el: -Math.PI / 4, dist: 15, tx: 0, ty: 0, tz: 0 },
    side:  { label: STR.vSide,  az: -Math.PI / 2, el: 0, dist: 15, tx: 0, ty: 0, tz: 0 },
  };

  /* 开关是**显示**开关，与题目无关，所以四条共用一份声明（颜色顺序照旧
     rose → violet → emerald → orange 钉死）。引擎会给每个 tab 各建一组同名
     复选框并互相同步，切 tab 不会丢状态。 */
  const TOGGLES = [
    { key: 'marks',  label: STR.tgMarks,  color: C_TRY,   checked: true },
    { key: 'stale',  label: STR.tgStale,  color: C_OK,    checked: true },
    { key: 'tower',  label: STR.tgTower,  color: C_CUT,   checked: true },
    { key: 'pieces', label: STR.tgPieces, color: C_BACK,  checked: true },
  ];

  const SCENES = Object.create(null);
  PIDS.forEach(function (pid) {
    const P = PROBLEMS[pid];
    SCENES[pid] = {
      label: P.label, brand: P.brand, tips: P.tips,
      views: VIEWS, toggles: TOGGLES,
      /* 这个 tab 显示哪几根滑杆（引擎按 key 显隐）——就是这道题声明的那几根。 */
      params: (P.params || []).map(function (p) { return pkey(pid, p.key); }),
      draw: frameFor(pid),
      readout: function () { return readoutFor(pid); },
    };
  });

  /* ================= ③ 每道题的运行状态 =================
     一道题 = 一份或多份轨迹（`sources` 是数组：tourKnight 一个键持有两份源码，
     两块棋盘并排、同一个游标推两条轨迹）。所以状态一律按**轨道**（track）存，
     哪怕今天只有一条——单条特判会让 Task 5 把这一段重写一遍。 */
  const S = Object.create(null);
  PIDS.forEach(function (pid) { S[pid] = { tracks: [], sig: null, err: null }; });

  let uiTab = null;             // 此刻显示的是哪道题
  let activeTrack = 0;          // 编辑器/调试器挂在这道题的第几条轨道上
  let statusKind = 'idle';      // idle | ok | bad | busy —— 切语言时按它重画
  let jumpNote = null;          // 点棋盘反向定位之后那一句话

  function curP() { return uiTab ? PROBLEMS[uiTab] : null; }
  function curS() { return uiTab ? S[uiTab] : null; }
  function curTrack() {
    const st = curS();
    return st && st.tracks[activeTrack] ? st.tracks[activeTrack] : null;
  }

  /* 跑一条轨道。**同步且慢**：N=8 要跑 156,772 步（node 实测 ~203 ms）。
     调用方负责先把「正在跑」画出来。 */
  function runTrack(tk, src, keepBreakpoints) {
    tk.src = src;
    tk.err = null;
    let res;
    try {
      res = I.run(src, { host: {} });
    } catch (e) {
      tk.err = { category: e.category || 'runtime', line: e.line == null ? null : e.line, message: e.message };
      res = { result: undefined, trace: [] };
    }
    tk.res = res;
    const next = D.create(res.trace);
    if (keepBreakpoints && tk.cur) next.breakpoints = tk.cur.breakpoints;
    tk.cur = next;
    tk.bcache = null;
    return tk;
  }

  /* 按当前参数把一道题整个重建。参数没变就什么也不做（每帧都会问一次）。 */
  function buildProblem(pid, force) {
    const P = PROBLEMS[pid], st = S[pid], sig = paramSig(pid);
    if (!force && st.sig === sig && st.tracks.length) return false;
    const pv = paramsOf(pid);
    st.err = null;
    const files = P.sources;
    st.tracks = files.map(function (file, k) {
      const old = st.tracks[k];
      const tk = old || { index: k, file: file, src: '', res: null, cur: D.create([]), err: null, bcache: null };
      tk.file = file;
      let src = '';
      try {
        src = P.source(pv, MODS, file);
      } catch (e) {
        st.err = e;
        src = '';
      }
      return runTrack(tk, src, true);
    });
    st.sig = sig;
    layoutTracks(pid);
    return true;
  }

  /* ---------------- 棋盘布局：一道题的每条轨道各一块，横向并排 ----------------
     `BoardRender.layout()` 把棋盘钉在原点上，没有 origin 参数，所以并排靠一层
     只加一个 dx 的包装：squareCenter / squareCorners 两个出口都平移，drawBoard、
     drawCoordLabels、pickSquare 读的都是这两个出口，于是三处一起跟着走。
     一条轨道时 dx = 0，与不包装逐像素相同。 */
  function shiftLayout(L, dx) {
    if (!dx) return L;
    return {
      files: L.files, ranks: L.ranks, cell: L.cell, z: L.z, w: L.w, h: L.h,
      squareCenter: function (f, r) { const p = L.squareCenter(f, r); return [p[0] + dx, p[1], p[2]]; },
      squareCorners: function (f, r) {
        return L.squareCorners(f, r).map(function (p) { return [p[0] + dx, p[1], p[2]]; });
      },
    };
  }
  const BOARD_GAP = 1.6;        // 并排两块棋盘之间留几格宽
  function layoutTracks(pid) {
    const P = PROBLEMS[pid], st = S[pid], pv = paramsOf(pid);
    let spec;
    try { spec = P.board(pv) || {}; } catch (e) { spec = {}; }
    const files = Math.max(1, Math.round(spec.files || 8));
    const ranks = Math.max(1, Math.round(spec.ranks || 8));
    const n = Math.max(1, st.tracks.length);
    const pitch = files + BOARD_GAP;
    st.tracks.forEach(function (tk, k) {
      const base = BR.layout({ files: files, ranks: ranks, cell: 1, z: 0 });
      tk.layout = shiftLayout(base, (k - (n - 1) / 2) * pitch);
    });
  }

  /* ================= 棋盘状态：标记 + 棋子 + **写下它时的深度** =================

     `Debugger.boardState(cur)` 已经给了 marks / pieces，但它不带深度，而这一页
     恰恰需要深度：`'cut'` 标记**故意**不在回溯时擦掉（源码里每个节点擦一整行要
     多花 18.7% 的步数，N=8 会顶到 186,000、只剩 7% 余量；`mark` 之后立刻 `clear`
     要多花 8.7%，而且「这一整行都被攻击」的画面只闪一步就没了）。裁定是**留给
     显示层解决**：interp.js 给每条 Step 都记了 `depth`，把每个标记记成「它是在
     哪个深度写下的」，再把深度大于当前 Step.depth 的压暗即可 —— 零步数成本、
     通用、别的题照用。

     这里比那条规则**多判一件事**，理由是量出来的：光看深度，「上一个同深度的
     兄弟帧留下的标记」会被当成此刻有效的。N=6 全程平均下来，只按深度判有 18.26
     个标记是亮的，而真正属于当前这条调用链的只有 10.95 个；最坏的一步有 19 个
     标记在冒充「此刻」。所以再记一个「写下它时是第几步」，跟**当前那一层帧是
     从第几步进来的**（frameOp === 'push' 的那一步）比一比：比帧还早的，是上一个
     兄弟留下的，同样压暗。两条判据都只用 interp.js 记下的通用字段，仍然不需要
     知道算法在做什么。

     实现是**增量**的：游标往前走就接着往下叠（播放的常态），往回走才从 0 重建。
     N=8 的轨迹有 156,772 步，每帧从头重放一遍是 4 ms 预算里放不下的。 */
  function boardAt(tk) {
    const cur = tk.cur, trace = cur.trace, i = cur.i;
    let c = tk.bcache;
    if (!c || c.trace !== trace || c.i > i) {
      c = tk.bcache = { trace: trace, i: -1, marks: Object.create(null),
                        pieces: Object.create(null), entry: [], curDepth: 0 };
    }
    for (let k = c.i + 1; k <= i && k < trace.length; k++) {
      const s = trace[k];
      /* 入帧步的 depth 就是**新的**深度（interp.js 的 stepBoundary 在
         env.callDepth.n 递增之后打包），所以 entry[depth] 直接这么记。 */
      if (s.frameOp === 'push') c.entry[s.depth] = k;
      const ops = s.boardOps;
      for (let m = 0; m < ops.length; m++) {
        const op = ops[m];
        if (op.kind === 'mark') c.marks[op.sq] = { kind: op.to, depth: s.depth, step: k };
        else if (op.kind === 'place') c.pieces[op.sq] = op.to;
        else if (op.kind === 'clear') { delete c.marks[op.sq]; delete c.pieces[op.sq]; }
      }
      c.i = k;
    }
    const cs = trace[Math.min(i, trace.length - 1)];
    c.curDepth = cs ? cs.depth : 0;
    return c;
  }
  function isStale(m, c) {
    if (m.depth > c.curDepth) return true;
    const e = c.entry[m.depth];
    return e != null && m.step < e;
  }
  function markCounts(c) {
    let bright = 0, stale = 0;
    for (const key in c.marks) { if (isStale(c.marks[key], c)) stale++; else bright++; }
    return { bright: bright, stale: stale, total: bright + stale };
  }

  /* 格子编号 → (file, rank)。约定是 `sq = rank * files + file`（core/algos/queens.js
     的文件头写死了它，并且与 BoardRender.squareCenter(file, rank)、chess-core 的
     SQ(file, rank) 同向：rank 0 在最下面一行）。落在盘外的编号返回 null——
     由调用方计数并在读数里点名，不静默丢弃。 */
  function sqToFR(sq, L) {
    if (typeof sq !== 'number' && typeof sq !== 'string') return null;
    const n = Number(sq);
    if (!isFinite(n) || Math.floor(n) !== n || n < 0) return null;
    const f = n % L.files, r = (n - f) / L.files;
    if (r < 0 || r >= L.ranks) return null;
    return { f: f, r: r };
  }

  /* ================= 取景框（照抄 3b / 阶段 4 验收过的那一套） =================

     canvas 是全屏的，但真正看得见的只有「整窗减去左边代码面板、再减去右边参数
     面板」那一块。只平移不缩放等于假设剩下那块地方永远够大，而分隔条的存在本身
     就在推翻这个假设。所以做一个完整的取景变换 p → s·p + t：s 让场景的投影包围盒
     装进可见区，t 让它居中。包围盒按**回正视角**算、且只在可见区/棋盘尺寸变化时
     重算（不是每帧、也不跟活相机）：按活相机每帧重算会让旋转变成「棋盘被自动
     追着摆正」。 */
  const FIT_MARGIN = 0.9;
  let fit = { s: 1, tx: 0, ty: 0 };

  /* ---- 分栏宽度：夹在一处，两个调用点（拖拽与 resize） ----
     上限有两条：别超过窗口的 78%，且右边还压着一块参数面板，要给画布留
     CANVAS_MIN。下限 300 优先——窄窗口上两个上限都可能比它小。
     codeW === null 表示**还没有人拖过**，宽度归 CSS 的 `46vw` 管（相对单位，
     本来就跟着窗口走）；一旦拖过就变成像素值，从此每次 resize 都要重夹一遍。 */
  const CANVAS_MIN = 380;
  let codeW = null;

  function panelIsRight() {
    return document.getElementById('panel').getBoundingClientRect().left > window.innerWidth * 0.5;
  }
  function rightEdge() {
    const pr = document.getElementById('panel').getBoundingClientRect();
    return panelIsRight() ? pr.left - 10 : window.innerWidth;
  }
  function bottomEdge() {
    const pr = document.getElementById('panel').getBoundingClientRect();
    return panelIsRight() ? window.innerHeight - 26 : Math.max(1, pr.top - 10);
  }
  function clampCodeWidth(px2) {
    const cap = Math.min(window.innerWidth * 0.78, rightEdge() - CANVAS_MIN);
    return Math.max(300, Math.min(cap, px2));
  }
  function applyCodeWidth(px2) {
    codeW = clampCodeWidth(px2);
    document.documentElement.style.setProperty('--code-w', codeW + 'px');
  }
  function availRect() {
    const folded = document.body.classList.contains('folded');
    const x0 = folded ? 0 : document.getElementById('split').getBoundingClientRect().width;
    const x1 = rightEdge();
    return { x0: x0, y0: 46, w: Math.max(1, x1 - x0), h: Math.max(1, bottomEdge() - 46) };
  }

  /* 借引擎的 makeCam 算回正视角的相机：临时换、算完换回。不自己再抄一遍
     球坐标→基向量的公式（本仓库反复吃过「同一段数学两处各写一份」的亏）。 */
  function homeCam() {
    const live = E.cam, saved = {};
    for (const k in HOME_VIEW) { saved[k] = live[k]; live[k] = HOME_VIEW[k]; }
    const C = E.makeCam();
    for (const k in saved) live[k] = saved[k];
    return C;
  }
  /* 场景包围盒：每块棋盘的四角（外扩到坐标标签的锚点带）在 z=0 与塔顶两层。
     棋子以格心为底座往上长，最远一排的后冠会探出棋盘上沿，所以再按像素补一笔。 */
  function sceneBox(C) {
    const st = curS();
    if (!st || !st.tracks.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, ok = false;
    const zTop = towerTopZ();
    for (let k = 0; k < st.tracks.length; k++) {
      const L = st.tracks[k].layout;
      if (!L) continue;
      const o = L.squareCorners(0, 0)[0];
      const pad = BR.COORD_LABEL_OFFSET * L.cell;
      const xs = [o[0] - pad, o[0] + L.w + pad], ys = [o[1] - pad, o[1] + L.h + pad];
      for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let z = 0; z < 2; z++) {
        const p = E.proj(C, [xs[a], ys[b], z ? zTop : L.z]);
        if (!p) return null;              // 近裁剪掉了：这一帧算不出，沿用上一次
        ok = true;
        x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]);
        y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]);
      }
      const lab = BR.coordLabelSize(C, E, L);
      let tall = 0;
      for (let f = 0; f < L.files; f++) {
        tall = Math.max(tall, BR.pieceAutoScale(C, E, L.squareCenter(f, L.ranks - 1), L.cell) || 0);
      }
      y0 -= tall; x0 -= lab; x1 += lab; y1 += lab * 0.9;
    }
    return ok ? { x0: x0, y0: y0, x1: x1, y1: y1 } : null;
  }
  function updateFit() {
    const box = sceneBox(homeCam());
    if (!box) return;                     // 算不出就不动，绝不退化成 1:1 把画面跳一下
    const bw = Math.max(1, box.x1 - box.x0), bh = Math.max(1, box.y1 - box.y0);
    const r = availRect();
    const s = Math.min((r.w * FIT_MARGIN) / bw, (r.h * FIT_MARGIN) / bh);
    fit = {
      s: s,
      tx: r.x0 + r.w / 2 - s * (box.x0 + box.x1) / 2,
      ty: r.y0 + r.h / 2 - s * (box.y0 + box.y1) / 2,
    };
  }

  /* ================= 画 ================= */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  /* px(v)：「我要屏幕上的 v 像素」。所有绘制都在 `ctx.scale(fit.s, fit.s)` 之内，
     写下的每个长度都会再乘一次 fit.s。对几何那是对的（取景缩小时整幅画一起缩）；
     **对文字不对**——字号有一条与取景缩放无关的绝对可读下限。工具④ 实测过
     fit.s 低到 0.24，写死的 11px 会渲染成 2.6 像素。 */
  function px(v) { return v / (fit.s > 0 ? fit.s : 1); }

  /* 塔顶在 z 的哪儿：取当前题目所有轨道里最高的一层，至少一层，好让取景框
     在还没跑起来的时候也有个确定的盒子。 */
  let towerTop = 1;
  function towerTopZ() { return Math.max(1, towerTop) * SPAN_Z; }

  function fillSquare(C, L, f, r, color, alpha, outline) {
    const cs = L.squareCorners(f, r), pts = [];
    for (let k = 0; k < 4; k++) {
      const p = E.proj(C, cs[k]);
      if (!p) return;
      pts.push(p);
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let k = 1; k < 4; k++) ctx.lineTo(pts[k][0], pts[k][1]);
    ctx.closePath();
    ctx.fill();
    if (outline) {
      ctx.globalAlpha = Math.min(1, alpha + 0.4);
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.1, px(1));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 标记：先画压暗的一批、再画有效的一批，重叠时有效的那个盖在上面。 */
  function drawMarks(C, P, L, c, tally) {
    for (let pass = 0; pass < 2; pass++) {
      for (const key in c.marks) {
        const m = c.marks[key];
        const stale = isStale(m, c);
        if (stale !== (pass === 0)) continue;
        if (stale && !E.state.stale) continue;
        const info = P.onMark(m.kind);
        if (!info || !info.color) { tally.badKinds[m.kind] = 1; continue; }
        const fr = sqToFR(+key, L);
        if (!fr) { tally.offBoard++; continue; }
        fillSquare(C, L, fr.f, fr.r, info.color, stale ? 0.12 : 0.38, !stale);
      }
    }
  }

  function drawPieces(C, L, c, tally) {
    for (const key in c.pieces) {
      const code = pieceCode(c.pieces[key]);
      if (code === null) { tally.badPieces[String(c.pieces[key])] = 1; continue; }
      const fr = sqToFR(+key, L);
      if (!fr) { tally.offBoard++; continue; }
      BR.drawPiece(ctx, C, E, { center: L.squareCenter(fr.f, fr.r), code: code, cell: L.cell });
    }
  }

  /* 深度塔：每一层取**此刻有效的、最新写下的那一个**标记，抬到 z = 层数·SPAN_Z，
     竖一根虚线柱、点一个按状态着色的点，层与层之间连成一条线——那条线就是左边
     调用栈面板里的那一摞帧（§1.4：z 轴就是调用栈深度）。
     层号由题目声明的 zOf 给（省略 = 标记的调用深度）：queens 是递归深度，
     knightPath 会是 BFS 的层数，这一段不需要知道是哪一种。 */
  function towerPoints(P, tk, c) {
    const zf = P.zOf || function (m) { return m.depth; };
    const best = Object.create(null);
    for (const key in c.marks) {
      const m = c.marks[key];
      if (isStale(m, c)) continue;
      let lv;
      try { lv = zf(m, { sq: +key, track: tk, cur: tk.cur, D: D }); } catch (e) { lv = null; }
      if (typeof lv !== 'number' || !isFinite(lv) || lv < 0) continue;
      const prev = best[lv];
      if (!prev || prev.step < m.step) best[lv] = { sq: +key, step: m.step, kind: m.kind, level: lv };
    }
    return Object.keys(best).map(function (k) { return best[k]; })
      .sort(function (a, b) { return a.level - b.level; });
  }

  function drawTower(C, P, L, pts) {
    if (!pts.length) return;
    const tops = [];
    ctx.save();
    ctx.setLineDash([px(3), px(3)]);
    ctx.lineWidth = Math.max(1, px(0.9));
    ctx.strokeStyle = 'rgba(148,163,184,0.45)';
    ctx.beginPath();
    for (let k = 0; k < pts.length; k++) {
      const fr = sqToFR(pts[k].sq, L);
      if (!fr) continue;
      const cc = L.squareCenter(fr.f, fr.r);
      const a = E.proj(C, cc), b = E.proj(C, [cc[0], cc[1], pts[k].level * SPAN_Z]);
      if (!a || !b) continue;
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      tops.push({ p: b, kind: pts[k].kind });
    }
    ctx.stroke();
    ctx.restore();
    if (tops.length > 1) {
      ctx.save();
      ctx.strokeStyle = C_STACK;
      ctx.lineWidth = Math.max(1.8, px(1.4));
      ctx.shadowColor = C_STACK;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(tops[0].p[0], tops[0].p[1]);
      for (let k = 1; k < tops.length; k++) ctx.lineTo(tops[k].p[0], tops[k].p[1]);
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    for (let k = 0; k < tops.length; k++) {
      const info = P.onMark(tops[k].kind);
      ctx.fillStyle = (info && info.color) || C_STACK;
      ctx.beginPath();
      ctx.arc(tops[k].p[0], tops[k].p[1], Math.max(2.6, px(2.2)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* z 轴的刻度：贴在棋盘左下角外侧竖着数上去。正视下这一列刻度会叠在同一个点上
     ——那恰恰是「必须提供一个沿这根轴的侧视」的现场证据（§5.3），不是画错了。 */
  function drawZAxis(C, P, L, levels) {
    const o = L.squareCorners(0, 0)[0];
    const x = o[0] - 0.55 * L.cell, y = o[1] - 0.1 * L.cell;
    ctx.save();
    ctx.fillStyle = 'rgba(159,176,200,0.62)';
    ctx.font = px(10.5) + 'px ' + FONT_MONO;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let d = 0; d <= levels; d++) {
      const p = E.proj(C, [x, y, d * SPAN_Z]);
      if (!p) continue;
      ctx.fillText(d === 0 ? (t(P.zLabel) + ' 0') : String(d), p[0], p[1]);
    }
    ctx.restore();
  }

  /* 并排多块棋盘时，每块底下写它是哪份源码（一条轨道时不写：没有第二块要区分）。 */
  function drawTrackCaption(C, L, text) {
    const o = L.squareCorners(0, 0)[0];
    const p = E.proj(C, [o[0] + L.w / 2, o[1] - 1.15 * L.cell, 0]);
    if (!p) return;
    ctx.save();
    ctx.fillStyle = 'rgba(159,176,200,0.8)';
    ctx.font = px(12) + 'px ' + FONT_MONO;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(text, p[0], p[1]);
    ctx.restore();
  }

  /* 上一帧画的时候有多少东西没画成——读数区据此说话，绝不静默少画。
     （`place(sq, "wQ")` 那一类：认不出就一个后都不画、也不报错，是最难查的一种。） */
  let tally = { badPieces: {}, badKinds: {}, offBoard: 0 };

  function drawProblem(C, pid) {
    const P = PROBLEMS[pid], st = S[pid];
    if (!st.tracks.length) return;
    const fresh = { badPieces: {}, badKinds: {}, offBoard: 0 };
    let top = 1;
    st.tracks.forEach(function (tk) {
      const L = tk.layout;
      if (!L) return;
      BR.drawBoard(ctx, C, E, { layout: L });
      const c = boardAt(tk);
      const pts = towerPoints(P, tk, c);
      for (let k = 0; k < pts.length; k++) if (pts[k].level > top) top = pts[k].level;
      if (E.state.marks !== false) drawMarks(C, P, L, c, fresh);
      if (E.state.pieces !== false) drawPieces(C, L, c, fresh);
      if (E.state.tower !== false) { drawTower(C, P, L, pts); drawZAxis(C, P, L, Math.max(1, top)); }
      if (st.tracks.length > 1) drawTrackCaption(C, L, tk.file);
    });
    tally = fresh;
    /* 塔顶只允许长、不允许在同一次运行里缩回去——否则取景框会随着游标每走一步
       抖一下。换题目/换参数时由 rebuild 重置。 */
    if (top > towerTop) { towerTop = top; updateFit(); }
  }

  /* ---------------- 换页签时要办的事 ----------------
     引擎没有给出 tab 变更的回调，所以在每个场景的 draw 开头认一次——每帧一次，
     变了才做事（工具④ 的同一手法）。 */
  function setUiTab(pid) {
    if (pid === uiTab) return;
    uiTab = pid;
    activeTrack = 0;
    towerTop = 1;
    jumpNote = null;
    ensureBuilt(pid);
    attachEditor();
    paintLegend();
    updateFit();
  }

  /* 每一帧：先把调试器的时钟推一格，再在取景变换里把棋盘画出来。 */
  function frameFor(pid) {
    return function (C) {
      setUiTab(pid);
      pollParams();
      /* 播放的时钟出口就是引擎的 state.dt（已 clamp 到 [0, 0.05]）。绝不自己用
         performance.now() 再算一遍帧时长，更不按帧计数——开发者的外接屏是
         30 Hz，按帧计数在那台机器上会慢一半。 */
      if (dbg) dbg.tick(E.state.dt);
      ctx.save();
      ctx.translate(fit.tx, fit.ty);
      ctx.scale(fit.s, fit.s);
      try { drawProblem(C, pid); } finally { ctx.restore(); }
    };
  }

  /* ================= 编辑器 + 调试器 ================= */
  const statusEl = document.getElementById('status');
  const btnRun = document.getElementById('btnRun');
  const btnRevert = document.getElementById('btnRevert');

  function setStatus(html, cls) {
    statusEl.className = 'sp-status' + (cls ? ' ' + cls : '');
    statusEl.innerHTML = html;
  }
  function errText(err) {
    if (err.category === 'internal' || err.line == null) {
      return esc(t(STR.internal) + ': ' + err.message);
    }
    /* unsupported 一类**不加前缀**：interp.js 的 message 本身已经以
       "Unsupported syntax: …" 开头，再套一层就是同一句话说两遍。 */
    const head = err.category === 'unsupported' ? ''
               : (err.category === 'runtime' ? t(STR.runtime) : t(STR.syntax)) + ' · ';
    return esc(head + t(STR.atLine).replace('%L', err.line) + ': ' + err.message);
  }
  function runText(tk) {
    if (!tk || !tk.res) return t(STR.ready);
    const n = tk.res.trace.length;
    const r = tk.res.result;
    const rTxt = r === undefined ? '—' : (typeof r === 'number' ? fmtInt(r) : esc(D.fmtVal(r)));
    let s = t(STR.ranOk) + ' · <b>' + fmtInt(n) + '</b> ' + t(STR.steps) +
            ' · ' + t(STR.result) + ' <b>' + rTxt + '</b>';
    if (tk.res.trace.truncated) s += '<br>' + esc(t(STR.truncMsg));
    return s;
  }
  function showTrackStatus(tk) {
    if (tk && tk.err) { statusKind = 'bad'; setStatus(errText(tk.err), 'bad'); }
    else { statusKind = 'ok'; setStatus(runText(tk), 'ok'); }
  }

  const ed = Ed.mount(document.getElementById('editorHost'), {
    value: '',
    onChange: function (value, err) {
      const tk = curTrack();
      if (tk) tk.src = value;
      btnRun.disabled = !!err;                 // 规格 §2.8：有语法错时 Run 禁用
      if (err) { statusKind = 'bad'; setStatus(errText(err), 'bad'); }
      else if (statusKind === 'bad') { statusKind = 'idle'; setStatus(t(STR.ready), ''); }
    },
  });

  const dbg = D.mount(document.getElementById('dbgHost'), D.create([]), {
    editor: ed,
    t: t,
  });

  /* 把编辑器与调试器挂到当前题目的当前轨道上。换题目 = 换一份程序：编辑器内容、
     调试器游标一起换，每条轨道自己的断点跟着自己的 cur 走。 */
  function attachEditor() {
    const tk = curTrack();
    if (!tk) { ed.setValue(''); dbg.setCursor(D.create([])); return; }
    ed.setValue(tk.src);                     // 会同步触发一次 onChange（写回 tk.src，等值）
    dbg.setCursor(tk.cur);
    showTrackStatus(tk);
  }

  /* ================= 重建（换参数 / 按 Run / 还原） ================= */

  /* 重建是**同步且慢**的（N=8 要跑 156,772 步）。所以先把「正在跑解释器」画出来，
     让浏览器有机会渲染一帧，再在一次 setTimeout 之后真的去跑。40 ms 不是节流，
     是给那一帧留的时间。 */
  let busy = false;
  function withBusy(fn) {
    if (busy) return;
    busy = true;
    document.body.classList.add('busy');
    statusKind = 'busy';
    setStatus(t(STR.busy), 'busy');
    setTimeout(function () {
      try { fn(); }
      finally {
        busy = false;
        document.body.classList.remove('busy');
      }
    }, 40);
  }

  function ensureBuilt(pid) {
    if (S[pid].tracks.length) return;
    buildProblem(pid, true);
    towerTop = 1;
    updateFit();
  }

  /* 滑杆没有「值变了」的回调（引擎的 buildParams 只往 state 里写），所以在绘制
     循环里盯着 state。拖动中连跨两格时 withBusy 的重入锁会挡掉后来的那次，
     下一帧的轮询会拿到最终值——最后跑的一定是她松手那一格。 */
  function pollParams() {
    if (busy || !uiTab) return;
    const pid = uiTab;
    if (S[pid].sig === paramSig(pid)) return;
    withBusy(function () {
      const sig = paramSig(pid);
      buildProblem(pid, true);
      towerTop = 1;
      attachEditor();
      updateFit();
      statusKind = 'ok';
      setStatus(t(STR.paramChanged).replace('%V', esc(sig)) + '<br>' + runText(curTrack()), 'ok');
    });
  }

  /* Run：改动 → 语法通过 → 重新解释执行、生成新轨迹 → 棋盘与调试器重置到第 0 步
     （规格 §2.8 的「编辑后的流程」）。只重跑**当前轨道**——并排的另一条跑的是
     另一份程序，没有理由被牵连。 */
  btnRun.addEventListener('click', function () {
    const err = ed.getError();
    if (err) { statusKind = 'bad'; setStatus(errText(err), 'bad'); return; }
    const tk = curTrack(), src = ed.getValue();
    if (!tk) return;
    withBusy(function () {
      runTrack(tk, src, true);
      dbg.setCursor(tk.cur);
      towerTop = 1;
      updateFit();
      showTrackStatus(tk);
    });
  });

  /* §2.8 的 `Reset to original`：把当前轨道的源码换回生成器的输出。本页还没有做
     §2.8 的 localStorage 持久化（按题目键存需要连参数一起存，改 N 之后旧存档
     就不再是同一份源码了），所以「还原为原始版本」与「按当前参数重新生成」
     是同一个动作。 */
  btnRevert.addEventListener('click', function () {
    const tk = curTrack(), P = curP();
    if (!tk || !P) return;
    withBusy(function () {
      let src = '';
      try { src = P.source(paramsOf(uiTab), MODS, tk.file); } catch (e) { src = tk.src; }
      runTrack(tk, src, true);
      ed.setValue(tk.src);
      dbg.setCursor(tk.cur);
      towerTop = 1;
      updateFit();
      showTrackStatus(tk);
    });
  });

  /* ================= 读数 ================= */

  /* 交给每道题的 readout 的那个对象。**给的是数据与几个写法助手，不是模板**：
     每道题要说的话不一样（解的个数 / 走完了没有 / 最短距离几步），硬塞进一张
     公共表格只会让三道题都说不清自己那件事。 */
  function trackView(tk, P) {
    const c = boardAt(tk);
    const mc = markCounts(c);
    let pieceCount = 0;
    for (const k in c.pieces) pieceCount++;
    const res = tk.res;
    return {
      file: tk.file,
      trace: res ? res.trace : [],
      steps: res ? res.trace.length : null,
      truncated: !!(res && res.trace.truncated),
      /* 截断时 result 是 undefined —— 一路传成 null（不可知），绝不变成 0。 */
      result: res && res.result !== undefined ? res.result : null,
      i: tk.cur.i,
      len: tk.cur.trace.length,
      output: D.output(tk.cur),
      stackDepth: c.curDepth,
      marks: c.marks,
      pieces: c.pieces,
      markBright: mc.bright,
      markStale: mc.stale,
      pieceCount: pieceCount,
      err: tk.err,
    };
  }
  function readoutApi(pid) {
    const P = PROBLEMS[pid], st = S[pid];
    const views = st.tracks.map(function (tk) { return trackView(tk, P); });
    return {
      tracks: views,
      main: views[0] || null,
      int: fmtInt, b: bval, esc: esc, t: t,
      dim: dimt,
      rule: function () { return '<span class="rule"></span>'; },
      /* 面板上的是**正文**，不是 markdown——`**…**` 在这里要变成 <b>。 */
      strong: function (s, subs) { return applyMarkup(t(s), subs); },
      note: function (s, subs) { return '<span class="dim">' + applyMarkup(t(s), subs) + '</span>'; },
      colors: { try: C_TRY, ok: C_OK, cut: C_CUT, back: C_BACK, stack: C_STACK, dim: C_DIM },
    };
  }
  function applyMarkup(s, subs) {
    let out = String(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (subs) Object.keys(subs).forEach(function (k) {
      out = out.split('%' + k).join(subs[k]);
    });
    return out;
  }

  function readoutFor(pid) {
    const st = S[pid], P = PROBLEMS[pid];
    if (!st.tracks.length) return '';
    const a = readoutApi(pid);
    let html = '';
    try { html = P.readout(a, paramsOf(pid)) || ''; } catch (e) { html = ''; }
    const extra = [];
    /* 每一处「没画出来」都要说话。静默少画一枚后是这一页最容易犯、也最难查的错。 */
    const bad = Object.keys(tally.badPieces);
    if (bad.length) {
      extra.push('<span class="warn">' + applyMarkup(t(STR.roBadPiece),
        { N: String(bad.length), L: esc(bad.join(', ')) }) + '</span>');
    }
    if (tally.offBoard) {
      extra.push('<span class="warn">' + applyMarkup(t(STR.roOffBoard),
        { N: String(tally.offBoard) }) + '</span>');
    }
    const badK = Object.keys(tally.badKinds);
    if (badK.length) {
      extra.push('<span class="warn">mark(): ' + esc(badK.join(', ')) + '</span>');
    }
    extra.push(a.rule());
    extra.push(dimt(STR.roClick) + (jumpNote ? ' <span style="color:' + C_STACK + '">' + jumpNote + '</span>' : ''));
    return html + '<br>' + extra.join('<br>');
  }

  /* ================= §5.4：点棋盘任一格 → 跳到最近一次动它的那一步 ================= */

  /* 先往回找（她多半想看「它是怎么变成现在这样的」），找不到再往前找。
     整趟都没被动过就明说没被动过，不猜、不跳。 */
  function stepTouching(tk, sq) {
    const trace = tk.cur.trace, i = tk.cur.i;
    for (let k = Math.min(i, trace.length - 1); k >= 0; k--) {
      const ops = trace[k].boardOps;
      for (let m = 0; m < ops.length; m++) if (ops[m].sq === sq) return { k: k, op: ops[m] };
    }
    for (let k = i + 1; k < trace.length; k++) {
      const ops = trace[k].boardOps;
      for (let m = 0; m < ops.length; m++) if (ops[m].sq === sq) return { k: k, op: ops[m] };
    }
    return null;
  }
  function squareName(fr) { return BR.fileLabel(fr.f) + (fr.r + 1); }
  function onBoardClick(sx, sy) {
    const st = curS();
    if (!st || !st.tracks.length) return;
    /* 取景变换是屏幕空间的一次 scale+translate，所以反向定位要先把点击点换回
       未变换的坐标，再交给 unproject —— 不换的话点中的永远是另一格。 */
    const x = (sx - fit.tx) / (fit.s || 1), y = (sy - fit.ty) / (fit.s || 1);
    const C = E.makeCam();
    for (let k = 0; k < st.tracks.length; k++) {
      const tk = st.tracks[k], L = tk.layout;
      if (!L) continue;
      const hit = BR.pickSquare(C, E, [x, y], L);
      if (!hit) continue;
      const sq = hit.rank * L.files + hit.file;
      activeTrack = k;
      attachEditor();
      const name = squareName({ f: hit.file, r: hit.rank });
      const found = stepTouching(tk, sq);
      if (!found) {
        jumpNote = esc(name + ' — ' + t(STR.roNoTouch));
        return;
      }
      D.goto(tk.cur, found.k);
      dbg.refresh();
      /* 转义的是**代入的值**（op.kind 来自她那份源码，可以是任何字符串），
         不是整句——整句转义会把文案里的标签一起打成字面量。 */
      jumpNote = applyMarkup(t(STR.roJumped),
        { S: fmtInt(found.k), K: esc(found.op.kind), Q: esc(name) });
      return;
    }
  }

  /* 点击 vs 拖拽：引擎的 bindOrbit 也在这块 canvas 上听指针事件（旋转相机），
     所以这里只认「几乎没动、也没按太久」的那一下，且**不 preventDefault**，
     旋转照常工作。 */
  (function bindBoardClick() {
    let down = null;
    canvas.addEventListener('pointerdown', function (e) {
      down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
    });
    canvas.addEventListener('pointerup', function (e) {
      if (!down || down.id !== e.pointerId) { down = null; return; }
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
      const held = performance.now() - down.t;
      down = null;
      if (moved > 4 || held > 500) return;
      onBoardClick(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointercancel', function () { down = null; });
  })();

  /* ================= 启动 ================= */
  let bootErr = null;
  try {
    PIDS.forEach(function (pid) {
      PROBLEMS[pid].sources.forEach(function (file) { loadAlgo(file); });
    });
  } catch (e) { bootErr = e; }

  if (bootErr) {
    setStatus(esc(t(STR.bootFail) + bootErr.message), 'bad');
    btnRun.disabled = true;
  }

  E.init({
    canvas: canvas,
    SCENES: SCENES,
    PARAMS: PARAMS,
    TOOL: { id: 'chess-board-algorithms', title: STR.title, h1: STR.h1 },
    VERSION: VERSION,
  });

  /* 取景框的第一次计算必须排在 E.init 之后：引擎的 resize 处理器是在 init 里
     挂上的，它负责刷新 W/H/CX/CY/FOCAL，而 makeCam/proj 读的正是那几个值。 */
  if (!bootErr) {
    /* uiTab 要**先**认下来：ensureBuilt / updateFit 都经由 curS() 读它，顺序反了
       第一次取景就是空的（画面会在第一帧之后跳一下）。setUiTab() 的短路检查因此
       在第一帧上不做事——这里已经把它该做的都做了。 */
    uiTab = PIDS[0];
    activeTrack = 0;
    ensureBuilt(PIDS[0]);
    attachEditor();
    updateFit();
  }

  /* ⚠ resize 上调的是调试器的 **redraw()**，不是 refresh()。两个句柄上都有
     refresh()，语义相反：Editor 的 refresh() 是纯重绘，Debugger 的 refresh() 会把
     「这一步刚变的变量」那圈琥珀色的基线往前推并清掉选中的调用栈帧。照直觉写成
     `ed.refresh(); dbg.refresh();`，窗口一改大小就静默少闪一片，而面板看不出任何
     异常。（chess/core/debugger.js 在 refresh 导出上有一段 ⚠⚠ 注释专门记这件事。） */
  function onResize() {
    /* **窗口变小时必须重夹一次分栏宽度。** 只在拖拽里夹是不够的：存进 `--code-w`
       的是一个像素值，在 1440 的窗口上拖到 1,100 px 之后把窗口缩到 800，#split
       仍然是 1,100 px 宽，availRect() 的 w 被兜成 1，取景框把棋盘缩到看不见——
       与拖到底时一模一样的失败，只是触发方向相反。所以夹的逻辑抽成
       clampCodeWidth()，**两个调用点**：拖拽与 resize。 */
    if (codeW !== null) applyCodeWidth(codeW);
    updateFit();
    ed.refresh();
    dbg.redraw();
  }
  window.addEventListener('resize', onResize);

  /* ---- 分隔条：拖拽调宽（§5.4） ---- */
  const divider = document.getElementById('divider');
  divider.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    divider.classList.add('drag');
    const onMove = function (ev) {
      applyCodeWidth(ev.clientX);
      updateFit();                 // 可见区变了就重算取景框（不是每帧算）
    };
    const onUp = function () {
      divider.classList.remove('drag');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      ed.refresh();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  /* ---- `\` 折叠回全屏棋盘（§1.5 的承诺） ----
     编辑器有焦点时放行：那时 `\` 是一个要打进代码里的字符，不是快捷键。这与
     debugger.js 那五个调试键的取舍是同一条原则的两面——调试键在编辑器里仍然
     生效（它们不是文本），折叠键在编辑器里让位（它是文本）。 */
  window.addEventListener('keydown', function (e) {
    if (e.key !== '\\' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.activeElement === ed.textarea) return;
    e.preventDefault();
    document.body.classList.toggle('folded');
    updateFit();                                    // 排在 toggle 之后：availRect 读的就是这个 class
    /* 展开之后必须让编辑器重刷一次：折叠期间面板是 display:none，编辑器量不到
       字符宽度（getBoundingClientRect 全是 0），波浪线与括号框会被跳过不画。 */
    if (!document.body.classList.contains('folded')) ed.refresh();
  });

  /* ---- 语言切换 ----
     引擎在 init() 里已经把自己的处理器挂在 #btnLang 上（它负责改 LANG、标题、
     lang 属性）。这里**再**挂一个：同一个按钮上两个监听器按注册顺序跑，引擎的
     先跑完、LANG 已经是新值，然后这里重取本页自己的文案。 */
  document.getElementById('btnLang').addEventListener('click', relabel);

  /* 图例跟着题目走：它的行就是这道题声明的那几种 mark。 */
  function paintLegend() {
    const lg = document.getElementById('legend');
    lg.textContent = '';
    const P = curP();
    if (!P) return;
    const rows = [];
    (P.kinds || []).forEach(function (k) {
      const info = P.onMark(k);
      if (info && info.color) rows.push([info.color, info.label]);
    });
    rows.push([C_STACK, STR.legTower]);
    rows.forEach(function (r) {
      const rowEl = document.createElement('div');
      const dot = document.createElement('i');
      dot.style.setProperty('--c', r[0]);
      rowEl.appendChild(dot);
      rowEl.appendChild(document.createTextNode(t(r[1]).replace(/<[^>]+>/g, '')));
      lg.appendChild(rowEl);
    });
  }
  function paintHint() {
    document.getElementById('hint').textContent = t(STR.hint);
  }

  function relabel() {
    btnRun.textContent = t(STR.run);
    btnRevert.textContent = t(STR.reset);
    paintHint();
    document.getElementById('busy').textContent = t(STR.busy);
    paintLegend();
    if (statusKind === 'bad') {
      const e2 = ed.getError() || (curTrack() && curTrack().err);
      if (e2) setStatus(errText(e2), 'bad');
    } else if (statusKind === 'ok') setStatus(runText(curTrack()), 'ok');
    else if (statusKind === 'busy') setStatus(t(STR.busy), 'busy');
    else if (!bootErr) setStatus(t(STR.ready), '');
    if (dbg) dbg.relabel();
  }
  relabel();

  /* ================= Task 7 的浏览器验收探针 =================

     `tool` 必须是第一个字段，Task 7 每次读都要先断言它 —— 多个 agent 共用一个
     浏览器会话，本项目已经发生过一次探针落在别人页面上、读数被记到错误的文件名
     下（CLAUDE.md「并行开工纪律」第 3 条）。 */
  window.__algoProbe = function () {
    const pid = uiTab, st = pid ? S[pid] : null;
    const tks = st ? st.tracks : [];
    const tk = tks[activeTrack] || tks[0] || null;
    const c = tk ? boardAt(tk) : null;
    const cache = dbg ? dbg.state() : null;
    const pv = pid ? paramsOf(pid) : {};
    const marks = Object.create(null), stale = Object.create(null), kinds = Object.create(null);
    if (c) {
      for (const k in c.marks) {
        const m = c.marks[k];
        marks[k] = m.kind;
        if (isStale(m, c)) stale[k] = m.kind;
        kinds[m.kind] = (kinds[m.kind] || 0) + 1;
      }
    }
    const pieces = Object.create(null);
    if (c) for (const k in c.pieces) pieces[k] = c.pieces[k];
    const L = tk && tk.layout ? tk.layout : null;
    return {
      tool: 'chess-board-algorithms',
      problem: pid,
      /* 参数一律给全（`params`），`N` 另外单列一份 —— 计划里的验收断言写的就是
         这个名字，而不是每道题都有 N。没有 N 的题目上它是 null，不是 0。 */
      params: pv,
      N: typeof pv.N === 'number' ? pv.N : null,
      track: activeTrack,
      tracks: tks.map(function (x) {
        return { file: x.file, steps: x.res ? x.res.trace.length : null,
                 truncated: !!(x.res && x.res.trace.truncated),
                 result: x.res && x.res.result !== undefined ? x.res.result : null,
                 i: x.cur.i, len: x.cur.trace.length,
                 err: x.err ? x.err.message : null };
      }),
      i: tk ? tk.cur.i : null,
      len: tk ? tk.cur.trace.length : null,
      line: cache ? cache.line : null,
      stackDepth: c ? c.curDepth : null,
      truncated: !!(tk && tk.res && tk.res.trace.truncated),
      /* 解数 = 入口程序的返回值。截断时是 null（**不可知**），绝不是 0。 */
      solutions: tk && tk.res && tk.res.result !== undefined ? tk.res.result : null,
      logged: tk ? D.output(tk.cur).length : 0,
      marks: marks,
      markKinds: kinds,
      markStale: stale,
      markBright: c ? markCounts(c).bright : 0,
      pieces: pieces,
      /* 棋子代号换算之后真的能画吗——`place(sq,"wQ")` 认不出会静默一枚都不画，
         所以把换算结果也报出来，验收不必靠眼睛。 */
      pieceCodes: (function () {
        const o = Object.create(null);
        for (const k in pieces) o[k] = pieceCode(pieces[k]);
        return o;
      })(),
      board: L ? { files: L.files, ranks: L.ranks, boards: tks.length } : null,
      towerLevels: towerTop,
      breakpoints: dbg ? Object.keys(dbg.cursor().breakpoints).map(Number).sort(function (a, b) { return a - b; }) : [],
      playing: dbg ? dbg.isPlaying() : false,
      speed: dbg ? dbg.speed() : null,
      toggles: { marks: E.state.marks !== false, stale: E.state.stale !== false,
                 tower: E.state.tower !== false, pieces: E.state.pieces !== false },
      view: { az: +E.cam.az.toFixed(4), el: +E.cam.el.toFixed(4), dist: +E.cam.dist.toFixed(3) },
      folded: document.body.classList.contains('folded'),
      busy: document.body.classList.contains('busy'),
      lang: document.documentElement.lang,
      codeWidth: Math.round(document.getElementById('split').getBoundingClientRect().width),
      avail: availRect(),
      fit: { s: +fit.s.toFixed(4), tx: Math.round(fit.tx), ty: Math.round(fit.ty) },
      readout: document.getElementById('readout').textContent,
      status: statusEl.textContent,
      runDisabled: !!btnRun.disabled,
      bootError: bootErr ? bootErr.message : null,
      version: VERSION,
    };
  };

  /* 与探针配套：手动喂一次 dt（秒），等价于绘制循环里那一次 dbg.tick()。浏览器
     面板的 rAF 会被节流到十几秒一帧，「播放按时间推进、不按帧计数」这条断言在
     那个环境里没有注入点就根本没法做。语义与真实路径完全一致：同一个 tick()、
     同一个累加器。例：__algoTick(1) 在 10 步/秒下恰好前进 10 步。 */
  window.__algoTick = function (dt) { dbg.tick(dt); };
})();
</script>
