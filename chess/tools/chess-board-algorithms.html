mn is constant',\n        '     diagUp[r - c + N]    diagonals running up-right: row - column is constant',\n        '                          (row - column can go negative and indices cannot, so add N)',\n        '   You could do without them: compare each new queen with every queen already',\n        '   placed. But that is up to N checks against three lookups: pruning must be cheap.',\n        '   N columns and 2N-1 diagonals — give all three 2N slots and track just one length. */',\n      ],\n    },\n    'const cols = [];',\n    'const diagDown = [];',\n    'const diagUp = [];',\n    'for (let i = 0; i < N + N; i = i + 1) { cols.push(0); diagDown.push(0); diagUp.push(0); }',\n    '',\n    {\n      zh: ['// 到现在为止数出来的完整解个数 —— 这就是最后要回答的那个数。'],\n      en: ['// How many complete solutions we have counted so far — the final answer.'],\n    },\n    'let solutions = 0;',\n    '',\n    {\n      zh: [\n        '/* 第 r 行第 c 列这一格，安全吗？三条线上都没有后才算安全。',\n        '   这一行就是整道题的全部规则，别的都是围着它转的脚手架。',\n        '   想确认它真的在起作用：把 diagUp 那一段删掉再跑，解数立刻就不对了。 */',\n      ],\n      en: [\n        '/* Is the square in row r, column c safe? Only if all three lines are clear.',\n        '   This one line is the entire rule of the puzzle; everything else is scaffolding.',\n        '   To see it working, delete the diagUp test and rerun: the count goes wrong. */',\n      ],\n    },\n    'function safe(r, c) {',\n    '  // >>> BLANK id=safe-return level=1 fill=\"return false;\" hint=\"三条线都空着才算安全：cols[c] 是这一列，diagDown[r + c] 和 diagUp[r - c + N] 是那两条斜线。表里是 1 就说明那条线上已经有后了 —— 三张表一张都不能少查。\" hintEn=\"A square is safe only when all three lines are clear: cols[c] for the column, diagDown[r + c] and diagUp[r - c + N] for the two diagonals. A 1 in any of the three tables means that line already has a queen on it.\"',\n    '  return !cols[c] && !diagDown[r + c] && !diagUp[r - c + N];',\n    '  // <<< BLANK',\n    '}',\n    '',\n    {\n      zh: [\n        '/* 把第 r 行到最上面一行全部摆好。',\n        '   r 一路往上走，走到 N 就说明每一行都摆上了一个后 —— 那就是一个完整解，',\n        '   数它一个，这一支到此为止。 */',\n      ],\n      en: [\n        '/* Fill in every row from row r up to the top of the board.',\n        '   r climbs upward, and reaching N means every row has a queen on it — that is',\n        '   a complete solution: count it, and this branch ends here. */',\n      ],\n    },\n    'function solve(r) {',\n    '  if (r === N) {',\n    {\n      zh: [\n        '    /* 走到这里：N 行都摆满了，而且一路上每一步都通过了 safe ——',\n        '       此刻棋盘上就是一个完整解，N 个后谁也吃不到谁。',\n        '       这是这道题唯一值得停下来看一眼的时刻，所以喊一声。 */',\n      ],\n      en: [\n        '    /* We got here: all N rows are filled and every step along the way passed',\n        '       safe. What is on the board right now is a complete solution — N queens,',\n        '       none able to capture another. The one moment in this puzzle worth a shout. */',\n      ],\n    },\n    '    solutions = solutions + 1;',\n    {\n      zh: ['    log(\"第 \" + solutions + \" 个解：\" + N + \" 个后都站稳了\");'],\n      en: ['    log(\"Solution \" + solutions + \": all \" + N + \" queens are safe\");'],\n    },\n    '    return;',\n    '  }',\n    '  for (let c = 0; c < N; c = c + 1) {',\n    '    const sq = r * N + c;',\n    {\n      zh: ['    mark(sq, \"try\");      // 正在尝试：先点亮这一格，再问它安不安全'],\n      en: ['    mark(sq, \"try\");      // Trying: light the square up first, then ask if it is safe'],\n    },\n    '    if (safe(r, c)) {',\n    {\n      zh: ['      // 已确认：三条线一起登记成「占了」，再把真正的后摆上去。'],\n      en: ['      // Confirmed: register all three lines as taken, then place the real queen.'],\n    },\n    '      cols[c] = 1; diagDown[r + c] = 1; diagUp[r - c + N] = 1;',\n    '      mark(sq, \"ok\");',\n    '      place(sq, \"wQ\");',\n    {\n      zh: ['      solve(r + 1);       // 接着摆上面那一行 —— 递归就发生在这一行'],\n      en: ['      solve(r + 1);       // now fill the row above — this line is the recursion'],\n    },\n    {\n      zh: [\n        '      /* 回溯撤销：不管上面那一行找没找到解，都要把这一格原样还回去。',\n        '         不还的话，接下来试第 c+1 列时会看到一个早就不该存在的后，',\n        '         再往后数出来的每一个「解」都是假的。 */',\n      ],\n      en: [\n        '      /* Backtracking undo: no matter what the row above found, this square',\n        '         has to go back exactly as it was. Otherwise the next column, c+1,',\n        '         sees a queen that should be long gone, and every \"solution\" after is fake. */',\n      ],\n    },\n    '      // >>> BLANK id=undo level=2 fill=\"cols[c] = 0;\" hint=\"摆上去的时候三张表一起登记成了 1，撤销就要把这三张表一起还回 0。少还一张，那条线在这一支之后就一直被占着 —— 后面每一步读到的都是一张早就不该是这样的表。\" hintEn=\"Placing the queen set all three tables to 1, so undoing has to clear all three back to 0. Miss one and that line stays blocked for the rest of the search, and every later step reads a table that should have been cleared long ago.\"',\n    '      cols[c] = 0; diagDown[r + c] = 0; diagUp[r - c + N] = 0;',\n    '      // <<< BLANK',\n    '      mark(sq, \"back\");',\n    '      clear(sq);',\n    '    } else {',\n    {\n      zh: ['      mark(sq, \"cut\");    // 被剪枝：这一格已经被某个已放好的后攻击了'],\n      en: ['      mark(sq, \"cut\");    // Pruned: a queen already on the board attacks this square'],\n    },\n    '    }',\n    '  }',\n    '}',\n    '',\n    {\n      zh: ['// 从最下面一行开始摆。跑完之后 solutions 里就是答案。'],\n      en: ['// Start from the bottom row. When it finishes, solutions holds the answer.'],\n    },\n    'solve(0);',\n    'return solutions;',\n  ];\n\n  /* source({ N, lang }) → string\n\n     N 不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数已经是\n     本仓库抓到过三次的缺陷类）。一个默默变成 8 的 N 会让界面写着 6、\n     跑的却是 8，正是这个工具最不能出的错。\n\n     校验只管「是不是一个 ≥ 1 的整数」，**不管 N_MIN / N_MAX** —— 见文件\n     头：那两个是滑杆边界，而 N=9 撞墙恰恰是要生成出来跑给她看的。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.N === undefined || o.N === null) {\n      throw new Error('source({ N }) 少了 N —— 棋盘边长没有默认值，必须写明');\n    }\n    const N = o.N;\n    if (typeof N !== 'number' || !isFinite(N) || Math.floor(N) !== N || N < 1) {\n      throw new Error('N 必须是 >= 1 的整数，收到：' + N);\n    }\n    return render(HEAD, o.lang)\n      .concat(['const N = ' + N + ';'])\n      .concat(render(BODY, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source, N_MIN: N_MIN, N_MAX: N_MAX };\n});\n",
  'tour-dfs.js': "/* 骑士巡游（朴素回溯）的**算法源码生成器**（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `minimax.js` 是同一个形状：这个模块本身不搜索任何\n   东西 —— 它吐出一段**字符串**。那段字符串同时是喂给 `Interp.run` 去真跑\n   的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份源码。一份字符串两个\n   用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- 这一份和 `tour-warnsdorff.js` 是一对，不是两个工具 ----\n\n   规格 §4⑤ 的落点是「同一个问题、同一块盘、两份可以逐行对比的源码」：\n   它们是**一个** `PROBLEMS` 键、**并排**显示，不是两个 tab。于是有一条\n   硬约束：**除了「下一步先试哪一个」那一段，两份生成源码逐字相同** ——\n   棋盘常量、`DX/DY`、`onBoard`、`mark`/`place` 的编舞、连注释都一样。\n   她把两边一 diff，diff 出来的就该正好是那个主意本身。\n\n   连文件头的行数都是对齐的（两边 HEAD 都是同样多行，只有讲「先试哪一个」\n   的那两三行措辞不同），这样并排看的时候上半截是逐行对得上的。\n   **改动这份里的任何共用文本，必须同步改另一份。** 两边的差异行数是\n   tour.test.js 之外的一道人肉门，今天量到（3×4 / start 0）是：\n\n     `diff` 出来 44 行不同（本文件独有 5 行、另一份独有 39 行），\n     其余 85 行逐字相同。44 行里 8 行是措辞（4 对：标题、讲「先试哪一个」\n     的两行、常量注释里举例时提到的是哪一份），另外 36 行就是那个主意本身\n     （本文件的 1 行注释 ↔ 另一份的 `degree()` 17 行 + 包着它的两行 BLANK\n     指令 + 排序 16 行）。\n\n   多出来的差异就是漂移。\n\n   （这三个数在阶段 8 之前腐坏过一轮：这里写着 42 / 5 / 37、\n   `tour-warnsdorff.js` 写着 44 / 5 / 39，而对的是后者 —— 阶段 6 加进去的\n   那两行 BLANK 指令这一侧没跟上。**同一个数字抄在两个文件头里，就是两处\n   会各自腐坏的地方。** 阶段 8 两侧各重量了一次，中文与英文**都是 44 / 5 /\n   39**：这个形状在两种语言下是构造性相同的，所以下面不再为英文另记一份。）\n\n   ---- 几处必须写下来的约定 ----\n\n   · **入口函数叫 `tour`**，两份签名相同：`tour(sq, n)` = 「马现在站在 sq\n     上，这已经是路线上的第 n 格」。它是**递归**那一个，不是外壳 ——\n     `TreeModel.build(trace, 'tour')` 认到的帧要一层套一层，z 轴才是递归\n     深度。顶层是 `const found = tour(START, 1); ... return found;`，\n     所以 `run().result` 是 true / false。\n\n   · **格子编号 `sq = 行 * W + 列`**，行 0 在棋盘最下面、列 0 在最左边，\n     于是 0 号格是 a1 —— 跟 `queens.js`、`BoardRender.layout()` 的\n     `squareCenter(file, rank)`、`chess-core.js` 的 `SQ(file, rank)` 同向。\n     反推是 `列 = sq % W; 行 = (sq - 列) / W`。\n     **棋盘不是正方形**：这一题的 W（宽）跟 H（高）分开，`files !== ranks`\n     是常态（3×4 / 3×5 / 4×5 / 3×7 四块盘都要用到），所以编号里除的是 W 而不是某个\n     「边长」—— 别照 queens.js 的 `sq = r * N + c` 想当然。\n\n   · **宿主桥接**：`mark(sq, kind)` 画规格 §2.7 的四种状态，四个 kind 逐字是\n       'try'（正在尝试）· 'ok'（已确认）· 'cut'（被剪枝）· 'back'（回溯撤销），\n     `place(sq, 'wN')` 摆马，`clear(sq)` 收回去。\n\n     **`place` 的两个参数是「数字 sq + 字符串 piece」**，跟 `queens.js`\n     的 `place(sq, \"wQ\")` 同一个约定。仓库里另有一个**反例**：\n     `tools/_debugger-preview.html` 内嵌的那份 N 皇后示例（约 165 行）写的是\n     `place(sq(col, row), 5)` —— 代数记法字符串的格子 + 数字 code 的棋子，\n     两个参数**正好相反**。本阶段一律跟 `queens.js` 走，'wN' → code 的换算\n     归页面（Task 4/5）做一次，别照那份旧的抄。\n\n   · **`place` / `clear` 就发生在搜索途中，跟 `queens.js` 完全一样** ——\n     走进一格就 `place(sq, \"wN\")`，回溯时 `mark(sq,'back')` 紧跟 `clear(sq)`。\n     马是一步一步走的，盘上任何一刻显示的都是**当前这条路线**。\n     跑通了，最后那 W*H 匹马留在盘上不收 —— 那一盘马就是答案本身；\n     走不通，全部退回去，盘上跟出发前一模一样。\n\n     这条写下来是因为它一度被写反过。tour.test.js 早先的判分方式是「把所有\n     `place` 事件按顺序收起来当路线」，那就逼着算法**攒到找到答案之后再一次性\n     落子**（否则被放弃的分支会被当成重复格）—— 实测的后果是：4×5 / 3×7 / 3×5\n     三块盘上 `place` 一次都不发生（盘全程空着），3×4 上则是 898 步什么都没有、\n     然后 12 匹马同时出现。一个主题是「马在走」的工具，马一步都不走。\n     **判分方式不该反过来规定算法长什么样。** 现在测试改成回放 `place`/`clear`\n     维护占位表（跟棋盘自己做的一样），被放弃的分支自己消失，那条最强的断言\n     （每格恰好一次 + 每步都是合法马步）原样保住，马也走回来了。\n     测试里另有一条断言专门钉这件事：**落子必须铺满整段搜索，不许挤在结尾**。\n\n   · **`'cut'` 标记不会被擦掉**（跟 queens.js 同一条裁定，不要重新决定）。\n     回溯只还原 `visited` 和这一格的马，标记层不随之收缩，于是别的分支里试过\n     的 'cut' 会留在盘上。**显示层的做法（零步数成本）**：`interp.js` 的\n     `stepBoundary` 给每条 Step 记了 `depth`，按 `Debugger.boardState` 累积\n     棋盘状态时顺手记下每个 mark 是在哪个 depth 写下的，再把 depth 大于\n     当前 Step.depth 的标记压暗或不画。通用，三道题共用。\n\n   · 子集约束（规格 §2.6）：**没有三元运算符**，`a ? b : c` 会抛 unsupported，\n     一律展开成 if/else；数组只有 `push` / `pop` 和 `length` 与下标读写。\n\n   · **不导出滑杆上下限**（queens.js 有 `N_MIN`/`N_MAX`，这里故意没有）。\n     理由见下面的实测表：两份算法能跑的棋盘范围差着数量级 —— 朴素这份\n     4×5 就撞墙，Warnsdorff 那份 4×5 从容、3×7 又撞墙。一个对两边都\n     「安全」的边界会小到把这一课本身删掉（这一课就是「它撞墙」）。\n     滑杆边界因此是页面（Task 4/5）的展示决定，不是本模块的校验边界：\n     `source()` 对任何 W ≥ 1、H ≥ 1 都照常吐源码，撞墙要生成出来跑给她看。\n\n   ---- 实测步数与棋盘事件（`Interp.STEP_LIMIT` = 200,000，角起 start = 0）----\n\n   拿两份源码各自生成的程序跑 `Interp.run(src, { host: {} })`，读 `trace.length`\n   与 mark/place/clear 的次数。**四块盘都是 tour.test.js 里钉着的滑杆位置**，\n   每一块演的是不同的东西：\n\n     棋盘   本文件（朴素）        tour-warnsdorff.js      这一块盘演什么\n     3×4      898 步 ✓ true       3,092 步 ✓ true    小盘上启发式的开销收不回来\n     3×5   34,988 步 ✓ false    120,650 步 ✓ false   查遍了，这块盘上没有巡游\n     4×5  200,000 步 ✗撞墙        7,283 步 ✓ true    大一点，启发式赢得压倒性\n     3×7  200,000 步 ✗撞墙      200,000 步 ✗撞墙     启发式也会失败 —— 它不是保证\n\n   棋盘事件（try / ok / cut / back，以及 place / clear —— place 恒等于 ok、\n   clear 恒等于 back，因为进一格就落子、退一格就收子）：\n\n     棋盘  算法        try    ok   cut   back=clear   注意\n     3×4  朴素         14    12     2       **0**   一次都不回溯，'back' 演不出来\n     3×4  Warnsdorff   19    12     7       **0**   同上\n     3×5  朴素       1,019   395   624       395    ← 'back' 唯一演得完的一块盘\n     3×5  Warnsdorff 1,019   395   624       395    ← 两份在这块盘上事件数完全相同\n     4×5  朴素       6,934 2,171 4,763     2,158    撞墙前已经退了两千多次\n     4×5  Warnsdorff    49    20    29       **0**  一条道走到底，一次没退过\n     3×7  朴素       6,370 2,218 4,152     2,201\n     3×7  Warnsdorff 1,723   591 1,132       577\n\n   **三件 Task 4/5 必须知道的事**：\n     ① 3×4 上两份算法都不回溯，所以 §2.7 的 'back' 状态和「按 `Step.depth`\n        压暗旧 'cut'」那套显示逻辑在默认盘上一次都不触发 —— 要演它得换盘。\n     ② **3×5 是唯一一块「两边都回溯得很凶、而且都诚实地跑到结论」的盘**\n        （各退 395 次，都返回 false，都不撞墙）。它是第四个滑杆位置的全部理由。\n     ③ **4×5 是并排对比最锋利的一块**：朴素退了 2,158 次还是撞墙，Warnsdorff\n        一次没退、20 步走完。这一对数字比步数本身更能说明「启发式在做什么」。\n\n   四行都在 tour.test.js 里钉着。3×4 和 3×7 是这一课诚实的那一半：\n   启发式**有代价**，而且**不保证**。别为了让表好看去调棋盘。\n\n   顺手量的、给 Task 4/5 挑滑杆上限用（本文件在这些盘上一律撞墙，\n   Warnsdorff 一次不退地走完）：\n     Warnsdorff  5×5 10,188 步 · 6×6 17,117 步 · 8×8 36,111 步。\n   也就是说「棋盘越大启发式越省」不是修辞：8×8 上朴素回溯连百分之一都跑不到，\n   Warnsdorff 只用掉上限的 18%。 */\n(function (root, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else root.AlgoTourDFS = factory();\n})(typeof self !== 'undefined' ? self : this, function () {\n  'use strict';\n\n  /* ================= 双语渲染（规格 §1.6 / §7.5）=================\n\n     ⚠ **这一整段在七份 algos/*.js 里逐字节相同**，check.py 的\n     bilingual_algos_check() 会核对。改这里就得七份一起改。\n     不抽成共用模块，是因为这些文件是被 inline_core.py 当**字符串**逐份\n     内联、再各自求值成 AlgoXxx 全局的 —— 抽出去就凭空多一条求值顺序\n     依赖，而那类缺陷要到浏览器里 ALGOS['queens.js'] 是 undefined 才发作\n     （阶段 5 建页当天撞过一次）。七份重复 + 一道字节级门，是阶段 7\n     king-greedy / king-exact 共用段用过的同一个套路。\n\n     `parts` 的元素只有两种：\n       字符串                 —— 一行，两种语言下逐字相同\n                                 （代码、空行、// >>> BLANK 指令行）\n       { zh: [], en: [] }     —— 一段散文，两边都是**行数组**\n\n     **两边行数必须相等**，不是洁癖：生成的源码是按行索引的 —— 解释器\n     每一步记 line，第 4 级提示靠 pristine 与编辑器逐行对齐划出 answerRange，\n     判定靠 judge.herSrc 比对。行数一差，切一次语言这四样同时指错地方。\n     行数一对齐，轨迹在两种语言下逐字节相同，切语言就只是换掉编辑器里的\n     文本，不重跑解释器。\n\n     BLANK 指令行**不翻译**：它本来就同时带着 hint 与 hintEn，两种语言\n     变体里那一行逐字相同，parse() 一点不用改。所以它是**字符串**片段。 */\n  function render(parts, lang) {\n    if (lang === undefined || lang === null) {\n      throw new Error(\n        'source({ lang }) 少了 lang —— 源码的注释与日志要用哪种语言没有' +\n        '默认值，必须写明 \"zh\" 或 \"en\"（默认成任何一种，都是让同一个缺陷' +\n        '换个地方复活）'\n      );\n    }\n    if (lang !== 'zh' && lang !== 'en') {\n      throw new Error('source({ lang }) 的 lang 只认 \"zh\" 或 \"en\"，收到：' +\n                      JSON.stringify(lang));\n    }\n    const out = [];\n    for (let i = 0; i < parts.length; i = i + 1) {\n      const p = parts[i];\n      if (typeof p === 'string') { out.push(p); continue; }\n      if (!p || !Array.isArray(p.zh) || !Array.isArray(p.en)) {\n        throw new Error('第 ' + i + ' 个片段既不是字符串、也不是 ' +\n                        '{ zh: [], en: [] }');\n      }\n      if (p.zh.length !== p.en.length) {\n        throw new Error(\n          '第 ' + i + ' 个片段两种语言行数不等：zh ' + p.zh.length + ' 行 / en ' +\n          p.en.length + ' 行 —— 生成的源码按行索引，行数一差，切一次语言 ' +\n          'Step.line / pristine / answerRange / judge.herSrc 同时指错地方' +\n          '（规格 §1.6）'\n        );\n      }\n      const lines = p[lang];\n      for (let j = 0; j < lines.length; j = j + 1) out.push(lines[j]);\n    }\n    return out;\n  }\n\n  /* 普通字符串拼，不用模板字面量：这段文本本身会被原样贴进 html，\n     反引号在那个上下文里比在这里更容易出事（照抄 queens.js 的理由）。\n\n     元素两种：字符串（代码 / 空行 / BLANK 指令行，两语逐字相同）与\n     `{ zh: [], en: [] }`（一段散文，两边行数必须相等）—— 见上面 render()。\n     英文不是逐句直译，是照中文那一版的意思与语气重写的，行数对齐落在\n     「段」上：段内句子怎么重组都行，段的行数必须一样。\n\n     ⚠ **两份共用的每一段英文也必须逐字相同**（跟中文那一侧同一条纪律）：\n     并排 diff 这件教学事在英文界面下同样要成立，而这个工具默认英文。\n\n     ⚠ **但这条纪律只有一半有机器门守着，另一半是人肉门** —— 别把它读成\n     全都有人管。tour.test.js 的子序列门阶段 8 起两种语言各跑一次，可它的\n     codeLines() 只留代码行，**整行 `//` 注释与整段块注释都被丢掉**。于是：\n\n       · 行尾 `//` 注释里的共用英文（`mark(sq, \"ok\");  // …` 那一族）\n         —— **机器门**。实测：只改 warnsdorff 一侧那一句，`[en]` 当场红。\n       · 独占整行的散文段（HEAD 两段、各处块注释）\n         —— **人肉门**。只改一侧，两种语言照样 82 passed / 0 failed。\n         改这类共用散文，必须自己记得两份一起改。 */\n\n  /* ==== 以下 HEAD 与 tour-warnsdorff.js 的 HEAD **行数相同**，\n     只有第 1 行的标题和第 12–13 行讲「先试哪一个」的两行不同。 ==== */\n  const HEAD = [\n    {\n      zh: [\n        '/* ============ 骑士巡游 · 朴素回溯 ============',\n        '   马走「日」字：横一竖二，或者横二竖一 —— 绕着它站的那一格一共八个方向。',\n        '   题目是：让马从某一格出发，把整块棋盘每一格都恰好踩一次。',\n        '',\n        '   格子编号：sq = 行 * W + 列。W 是棋盘的宽（每行几格），H 是高。',\n        '   第 0 行是棋盘最下面那一行，第 0 列是最左边那一列 —— 于是 0 号格',\n        '   就是国际象棋里的 a1。要反推回去：列 = sq % W，行 = (sq - 列) / W。',\n        '   棋盘不必是正方形，3×4 和 4×5 都是正常的棋盘。',\n        '',\n        '   办法是「试错 + 反悔」：挑一个方向走过去，走不通就退回来换一个。',\n        '   旁边那份源码跟这份只差一件事 —— 下一步先试哪一个。',\n        '   这一份：按固定的方向顺序挨个试，谁也不比谁优先。',\n        '   最朴素，也最诚实 —— 它不知道哪条路更有希望，只能一条条走。 */',\n      ],\n      en: [\n        '/* ============ Knight\\'s Tour · plain backtracking ============',\n        '   A knight moves in an L: one across and two along, or two across and one — eight',\n        '   directions in all. The task: from one square, step on every square exactly once.',\n        '',\n        '   Squares are numbered sq = row * W + column, where W is the width (squares per',\n        '   row) and H the height. Row 0 is the bottom row and column 0 the leftmost, so',\n        '   square 0 is a1 in chess. To reverse: column = sq % W, row = (sq - column) / W.',\n        '   The board need not be square — 3×4 and 4×5 are perfectly normal boards.',\n        '',\n        '   The method is \"try, then take it back\": walk one way, and when it leads nowhere,',\n        '   back up and take another. The source beside this differs in one thing only —',\n        '   which square to try first. This one: the fixed direction order, one after',\n        '   another, no favourites — plainest, honest, and blind to which road is best. */',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 棋盘的宽、高，以及马从哪一格出发。',\n        '   能拧的旋钮是两个而不是一个，而工作量随格子数指数增长：',\n        '   3×4 和 4×5 之间只差 8 格，这一份就从「一千步」变成「跑不完」。 */',\n      ],\n      en: [\n        '/* The board\\'s width and height, and which square the knight starts from.',\n        '   Two knobs to turn here, not one, and the work grows exponentially with squares:',\n        '   3×4 takes a thousand steps; 8 more for 4×5 and this one never finishes. */',\n      ],\n    },\n  ];\n\n  const BODY = [\n    '',\n    {\n      zh: [\n        '/* 马的八个方向。DX 与 DY 一一对应：第 k 个方向是「横走 DX[k]、竖走 DY[k]」。',\n        '   横一竖二四个、横二竖一四个，绕着起点转一圈 —— 这就是「日」字。 */',\n      ],\n      en: [\n        '/* The eight knight directions. DX and DY pair up: direction k is \"go DX[k] across',\n        '   and DY[k] along\" — four one-and-two, four two-and-one, a full ring around it. */',\n      ],\n    },\n    'const DX = [1, 2, 2, 1, -1, -2, -2, -1];',\n    'const DY = [2, 1, -1, -2, -2, -1, 1, 2];',\n    '',\n    {\n      zh: [\n        '/* 备忘表：visited[sq] = 1 表示这一格已经踩过了。',\n        '   一格只能踩一次 —— 这是整道题唯一的规则，别的都是围着它转的脚手架。 */',\n      ],\n      en: [\n        '/* Lookup table: visited[sq] = 1 means this square has been stepped on already.',\n        '   A square is stepped on once only — the one rule here; the rest is scaffolding. */',\n      ],\n    },\n    'const visited = [];',\n    'for (let i = 0; i < W * H; i = i + 1) { visited.push(0); }',\n    '',\n    {\n      zh: ['// (x, y) 还在棋盘上吗？出界的方向连试都不用试。'],\n      en: ['// Is (x, y) still on the board? A direction that leaves it is not worth trying.'],\n    },\n    'function onBoard(x, y) {',\n    '  return x >= 0 && x < W && y >= 0 && y < H;',\n    '}',\n    '',\n    {\n      zh: [\n        '/* 马站在 sq 上，这已经是路线上的第 n 格 —— 接着往下走。',\n        '   走得通就返回 true，八个方向都走不通就返回 false 让上一层去换。',\n        '   n 等于总格数时，每一格都踩过了，这一支就是答案。 */',\n      ],\n      en: [\n        '/* The knight stands on sq, and this is already square n of the route — carry on.',\n        '   Return true if a way through is found, false when all eight directions fail, so',\n        '   the level above switches. When n equals the square count, every square is done. */',\n      ],\n    },\n    'function tour(sq, n) {',\n    '  const x = sq % W;',\n    '  const y = (sq - x) / W;',\n    '  visited[sq] = 1;',\n    {\n      zh: ['  mark(sq, \"ok\");        // 已确认：这一格进了当前这条路线'],\n      en: ['  mark(sq, \"ok\");        // Confirmed: this square joins the route being built'],\n    },\n    {\n      zh: ['  place(sq, \"wN\");       // 马真的走到这一格 —— 盘上立刻看得见'],\n      en: ['  place(sq, \"wN\");       // The knight really steps here — the board shows it at once'],\n    },\n    '  if (n === W * H) {',\n    '    return true;',\n    '  }',\n    {\n      zh: ['  /* 从这一格出发，八个方向里哪几个还落在棋盘上 —— 先收成一张候选表。 */'],\n      en: ['  /* Which of the eight directions out of here stay on the board: a candidate list. */'],\n    },\n    '  const cand = [];',\n    '  for (let k = 0; k < 8; k = k + 1) {',\n    '    const nx = x + DX[k];',\n    '    const ny = y + DY[k];',\n    '    if (onBoard(nx, ny)) {',\n    '      cand.push(ny * W + nx);',\n    '    }',\n    '  }',\n    /* ↓↓↓ 这一格就是两份源码唯一不同的地方（tour-warnsdorff.js 在这里\n       多一段按 degree 排序的代码）。上下都必须逐字相同，**两种语言各自\n       逐字相同**。⚠ 上下那些**独占整行的**注释段是**人肉门**：子序列门的\n       codeLines() 把它们整段丢掉，只改一侧两语照样全绿（见文件头）。 ↓↓↓ */\n    {\n      zh: ['  // 就按 DX/DY 写下来的顺序挨个试 —— 这一份不挑，也不知道该挑谁。'],\n      en: ['  // Tried in the order DX/DY were written in — no picking, and no idea whom to pick.'],\n    },\n    /* ↑↑↑ 差异结束 ↑↑↑ */\n    '  for (let i = 0; i < cand.length; i = i + 1) {',\n    '    const nsq = cand[i];',\n    {\n      zh: ['    mark(nsq, \"try\");    // 正在尝试：先点亮这一格，再看它能不能走'],\n      en: ['    mark(nsq, \"try\");    // Trying: light the square up first, then see if it works'],\n    },\n    '    if (visited[nsq]) {',\n    {\n      zh: ['      mark(nsq, \"cut\");  // 被剪枝：踩过的格子不能再踩'],\n      en: ['      mark(nsq, \"cut\");  // Pruned: a square stepped on cannot be stepped on again'],\n    },\n    '    } else {',\n    '      if (tour(nsq, n + 1)) {',\n    {\n      zh: ['        return true;     // 下游走通了 —— 一路把 true 传回去，别的方向不用再试'],\n      en: ['        return true;     // Downstream worked — pass true all the way up, no more tries'],\n    },\n    '      }',\n    '    }',\n    '  }',\n    {\n      zh: [\n        '  /* 回溯撤销：八个方向都试遍了还是走不通，把这一格原样退还 ——',\n        '     备忘表擦掉，马也从这一格撤走。不退的话，接下来别的分支会看到一格',\n        '     根本没人站过的「踩过」，从此每一条路线都是假的。',\n        '     mark 与 clear 是分开的两步：先看到这一格被判「撤销」，下一步马才消失。 */',\n      ],\n      en: [\n        '  /* Taking it back: all eight tried and none worked, so hand this square back the',\n        '     way it came — wipe the table, walk the knight off. Skip that and a later branch',\n        '     meets a \"stepped on\" square nobody stood on, making every route after it a lie.',\n        '     mark and clear are two steps: marked \"taken back\" first, knight gone next. */',\n      ],\n    },\n    '  visited[sq] = 0;',\n    '  mark(sq, \"back\");',\n    '  clear(sq);',\n    '  return false;',\n    '}',\n    '',\n    {\n      zh: ['// 出发。第一格也要先亮一下，跟后面每一格的待遇一样。'],\n      en: ['// Off we go. The first square lights up too, treated like every square after it.'],\n    },\n    'mark(START, \"try\");',\n    'const found = tour(START, 1);',\n    'if (found) {',\n    {\n      zh: [\n        '  /* 盘上留着的那一整盘马就是答案本身。它们不收 —— 收了就没有答案可看了。',\n        '     想看清顺序：把单步倒着回放一遍，马是按什么次序落上去的一目了然。 */',\n      ],\n      en: [\n        '  /* The knights left standing are the answer itself. They stay — take them off and',\n        '     there is nothing left to look at. For the order, step backwards through the run. */',\n      ],\n    },\n    {\n      zh: ['  log(\"找到了：一条踩遍 \" + (W * H) + \" 格的路线\");'],\n      en: ['  log(\"Found it: a route stepping on every square, \" + (W * H) + \" in all\");'],\n    },\n    '} else {',\n    {\n      zh: ['  /* 所有分支都退过了，盘上一匹马都不剩，跟出发前一模一样。 */'],\n      en: ['  /* Every branch was taken back: no knight left, exactly as before the start. */'],\n    },\n    {\n      zh: ['  log(\"走不通：从这一格出发，没有能踩遍全盘的路线\");'],\n      en: ['  log(\"No way through: from this square, no route covers the whole board\");'],\n    },\n    '}',\n    'return found;',\n  ];\n\n  /* source({ W, H, start, lang }) → string\n\n     四个参数都不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数\n     已经是本仓库抓到过三次的缺陷类）。一个默默变成 8 的 W 会让界面写着\n     5、跑的却是 8，正是这个工具最不能出的错；`lang` 默认成任何一种，都是\n     让同一个缺陷换个地方复活（它由 render() 校验，见上面）。\n\n     ⚠ **W / H / start 的校验留在最前，`lang` 的校验在最后**（render() 里）。\n     tour.test.js 那一组「缺参数当场抛」故意一个 lang 都不传、每条都带\n     pattern，钉的正是这个顺序：只给了 H / start 的调用撞上的必须仍旧是\n     「少了 W」。\n\n     校验只管「是不是合法的棋盘和格子」，**不管好不好跑** —— 见文件头：\n     4×5 撞墙恰恰是要生成出来跑给她看的。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.W === undefined || o.W === null) {\n      throw new Error('source({ W, H, start }) 少了 W —— 棋盘宽度没有默认值，必须写明');\n    }\n    if (o.H === undefined || o.H === null) {\n      throw new Error('source({ W, H, start }) 少了 H —— 棋盘高度没有默认值，必须写明');\n    }\n    if (o.start === undefined || o.start === null) {\n      throw new Error('source({ W, H, start }) 少了 start —— 出发格没有默认值，必须写明');\n    }\n    const W = o.W, H = o.H, start = o.start;\n    if (typeof W !== 'number' || !isFinite(W) || Math.floor(W) !== W || W < 1) {\n      throw new Error('W 必须是 >= 1 的整数，收到：' + W);\n    }\n    if (typeof H !== 'number' || !isFinite(H) || Math.floor(H) !== H || H < 1) {\n      throw new Error('H 必须是 >= 1 的整数，收到：' + H);\n    }\n    if (typeof start !== 'number' || !isFinite(start) || Math.floor(start) !== start ||\n        start < 0 || start >= W * H) {\n      throw new Error('start 必须是 0 到 ' + (W * H - 1) + ' 之间的整数，收到：' + start);\n    }\n    return render(HEAD, o.lang)\n      .concat([\n        'const W = ' + W + ';',\n        'const H = ' + H + ';',\n        'const START = ' + start + ';',\n      ])\n      .concat(render(BODY, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source };\n});\n",
  'tour-warnsdorff.js': "/* 骑士巡游（Warnsdorff 启发式）的**算法源码生成器**（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `minimax.js` 是同一个形状：这个模块本身不搜索任何\n   东西 —— 它吐出一段**字符串**。那段字符串同时是喂给 `Interp.run` 去真跑\n   的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份源码。一份字符串两个\n   用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- 这一份和 `tour-dfs.js` 是一对，不是两个工具 ----\n\n   规格 §4⑤ 的落点是「同一个问题、同一块盘、两份可以逐行对比的源码」：\n   它们是**一个** `PROBLEMS` 键、**并排**显示，不是两个 tab。于是有一条\n   硬约束：**除了「下一步先试哪一个」那一段，两份生成源码逐字相同** ——\n   棋盘常量、`DX/DY`、`onBoard`、`mark`/`place` 的编舞、连注释都一样。\n   她把两边一 diff，diff 出来的就该正好是那个主意本身。\n\n   这一份多出来的**全部**东西就两处，都在下面标了「差异」：\n     ① 一个 `degree(sq)` 函数（从某一格还能去几个没踩过的格子）；\n     ② `tour()` 里那段把候选按 degree 从小到大排序的代码。\n   **改动共用文本必须同步改 `tour-dfs.js`。** 两边差异行数是 tour.test.js\n   之外的一道人肉门，今天量到（3×4 / start 0）是：\n\n     `diff` 出来 44 行不同（tour-dfs.js 独有 5 行、本文件独有 39 行），\n     其余 85 行逐字相同。44 行里 8 行是措辞（4 对：标题、讲「先试哪一个」\n     的两行、常量注释里举例时提到的是哪一份），另外 36 行就是 ①② 本身\n     （对面的 1 行注释 ↔ 本文件的 `degree()` 17 行 + 包着它的两行 BLANK\n     指令 + 排序 16 行）。\n\n   多出来的差异就是漂移。（阶段 6 之前这里是 42 / 37 / 34 —— 多出来的两行\n   正是 §2.9 的挖空指令，见下面「这一份上的挖空」那一条。**挖空只落在\n   Warnsdorff 独有的这一段里**，所以这道人肉门量的还是同一件事：diff 出来\n   的仍然只有「那个主意」，加上把它挖成练习的那两行注释。）\n\n   ---- Warnsdorff 到底是什么，以及它**不是**什么 ----\n\n   规则一句话：下一步走「出路最少」的那一格。直觉是出路快没了的格子再不去\n   就再也去不了了。\n\n   **它仍然是回溯搜索，不是贪心一条道走到黑** —— 这一点关系到整张实测表\n   能不能成立，写在这里免得被「优化」掉：纯贪心版本走进死胡同就直接失败\n   返回，3×7 上会在几百步内干净利落地报「找不到」，于是规格 §4⑤ 的第三段\n   弧线（「连启发式也撞墙」）根本不会发生 —— 它会变成「启发式很快说了不知道」，\n   完全是另一句话。这里的写法是**用 degree 给候选排序的 DFS**：排序只改\n   尝试顺序，走不通照样回溯。于是三段弧线才都是同一种东西的三种命运。\n\n   ---- 几处必须写下来的约定（与 tour-dfs.js 逐条相同）----\n\n   · **入口函数叫 `tour`**，两份签名相同：`tour(sq, n)` = 「马现在站在 sq\n     上，这已经是路线上的第 n 格」。它是**递归**那一个，不是外壳 ——\n     `TreeModel.build(trace, 'tour')` 认到的帧要一层套一层，z 轴才是递归\n     深度。顶层是 `const found = tour(START, 1); ... return found;`，\n     所以 `run().result` 是 true / false。\n\n   · **格子编号 `sq = 行 * W + 列`**，行 0 在棋盘最下面、列 0 在最左边，\n     于是 0 号格是 a1 —— 跟 `queens.js`、`BoardRender.layout()` 的\n     `squareCenter(file, rank)`、`chess-core.js` 的 `SQ(file, rank)` 同向。\n     反推是 `列 = sq % W; 行 = (sq - 列) / W`。\n     **棋盘不是正方形**：W（宽）跟 H（高）分开，`files !== ranks` 是常态\n     （3×4 / 3×5 / 4×5 / 3×7 四块盘都要用到），所以编号里除的是 W 而不是某个「边长」——\n     别照 queens.js 的 `sq = r * N + c` 想当然。\n\n   · **宿主桥接**：`mark(sq, kind)` 画规格 §2.7 的四种状态，四个 kind 逐字是\n       'try'（正在尝试）· 'ok'（已确认）· 'cut'（被剪枝）· 'back'（回溯撤销），\n     `place(sq, 'wN')` 摆马，`clear(sq)` 收回去。\n\n     **`place` 的两个参数是「数字 sq + 字符串 piece」**，跟 `queens.js`\n     的 `place(sq, \"wQ\")` 同一个约定。仓库里另有一个**反例**：\n     `tools/_debugger-preview.html` 内嵌的那份 N 皇后示例（约 165 行）写的是\n     `place(sq(col, row), 5)` —— 代数记法字符串的格子 + 数字 code 的棋子，\n     两个参数**正好相反**。本阶段一律跟 `queens.js` 走，'wN' → code 的换算\n     归页面（Task 4/5）做一次，别照那份旧的抄。\n\n   · **`place` / `clear` 就发生在搜索途中，跟 `queens.js` 完全一样** ——\n     走进一格就 `place(sq, \"wN\")`，回溯时 `mark(sq,'back')` 紧跟 `clear(sq)`。\n     马是一步一步走的，盘上任何一刻显示的都是**当前这条路线**。\n     跑通了，最后那 W*H 匹马留在盘上不收 —— 那一盘马就是答案本身；\n     走不通，全部退回去，盘上跟出发前一模一样。\n\n     这条写下来是因为它一度被写反过。tour.test.js 早先的判分方式是「把所有\n     `place` 事件按顺序收起来当路线」，那就逼着算法**攒到找到答案之后再一次性\n     落子**（否则被放弃的分支会被当成重复格）—— 实测的后果是：4×5 / 3×7 / 3×5\n     三块盘上 `place` 一次都不发生（盘全程空着），3×4 上则是 898 步什么都没有、\n     然后 12 匹马同时出现。一个主题是「马在走」的工具，马一步都不走。\n     **判分方式不该反过来规定算法长什么样。** 现在测试改成回放 `place`/`clear`\n     维护占位表（跟棋盘自己做的一样），被放弃的分支自己消失，那条最强的断言\n     （每格恰好一次 + 每步都是合法马步）原样保住，马也走回来了。\n     测试里另有一条断言专门钉这件事：**落子必须铺满整段搜索，不许挤在结尾**。\n\n   · **`'cut'` 标记不会被擦掉**（跟 queens.js 同一条裁定，不要重新决定）。\n     回溯只还原 `visited` 和这一格的马，标记层不随之收缩，于是别的分支里试过\n     的 'cut' 会留在盘上。**显示层的做法（零步数成本）**：`interp.js` 的\n     `stepBoundary` 给每条 Step 记了 `depth`，按 `Debugger.boardState` 累积\n     棋盘状态时顺手记下每个 mark 是在哪个 depth 写下的，再把 depth 大于\n     当前 Step.depth 的标记压暗或不画。通用，三道题共用。\n\n   · 子集约束（规格 §2.6）：**没有三元运算符**，`a ? b : c` 会抛 unsupported，\n     一律展开成 if/else；数组只有 `push` / `pop` 和 `length` 与下标读写 ——\n     所以下面那段排序是手写的选择排序，不是 `cand.sort(...)`。\n\n   · **候选表里不先滤掉踩过的格子**（degree 照样给它们算一个数、排序照样带着\n     它们）。看着像浪费，是故意的：滤一遍会让这份的候选循环跟 `tour-dfs.js`\n     的那一段不再逐字相同，而踩过的格子无论排在哪儿，进循环后都会被同一句\n     `if (visited[nsq])` 拦下并标成 'cut' —— 排序质量一点不受影响，只多一次\n     'try'/'cut' 的显示。用一点步数换「两边可以逐行对比」，这是本阶段的主线。\n\n   · **不导出滑杆上下限**（queens.js 有 `N_MIN`/`N_MAX`，这里故意没有）。\n     两份算法能跑的棋盘范围差着数量级，一个对两边都「安全」的边界会小到把\n     这一课本身删掉。滑杆边界是页面（Task 4/5）的展示决定，不是本模块的\n     校验边界：`source()` 对任何 W ≥ 1、H ≥ 1 都照常吐源码。\n\n   ---- 这一份上的挖空（§2.9）：**一个，不是两个** ----\n\n   下面的 `BODY` 里有**一组** `// >>> BLANK` 指令，`id=degree-fn`、level=3，\n   挖的是整个 `degree()` 函数，由 `core/exercise.js` 的 `parse()` 消费。\n   `tour-dfs.js` 一个挖空都没有 —— 它在练习模式下是只读对照（§2.9 阶段 6\n   第 1 条），`exercise-blanks.test.js` 四块盘各钉了一条。\n\n   **计划和规格 §2.9 给这一题排的是两个挖空**（另一个是 level=1 的\n   `degree-count`，挖 `degree()` 里那一句 `if (!visited[…]) { d = d + 1; }`）。\n   **这两个不可能同时存在**：后者的挖空体被前者整个包在里面，而 `parse()`\n   见到嵌套的 `>>> BLANK` 会当场抛。这一条是硬的（规格 §2.9 那张表本身要求\n   把一个挖空嵌进另一个里，是规格的缺陷，不是这里的实现选择）。\n\n   而**换个位置是能办到的，只是没有好落点** —— 别把它读成「不可能」：\n\n     · 挖空只能落在 Warnsdorff 独有的两段里，否则 `tour-dfs.js` 与本文件的\n       并排 diff 就多出噪声，而那份 diff 是这一课本身。\n     · 排序那一段规格明令不挖（§7.4「判定过严」的教科书案例）。\n     · 剩下的落点是量出路数那一行 `degs.push(degree(cand[i]));`。它**做得到**：\n       只要占位不是常数，而是把静态出路数**内联**算一遍，四块盘实测\n       2,583 / 101,052 / 5,848 / 撞墙 —— 参考跑得完的三块它都跑得完。\n       不采用是因为那个占位很糟：它比挖空体长十倍，而且要把这道题正在问的\n       那段循环**原样抄进提示里**（等于把答案写在占位上），教的还是跟\n       `degree-fn` 同一课。（常数占位 `degs.push(0);` 则四块盘里 4×5 撞墙 ——\n       候选全并列、排序一次不交换，这一份就退化成朴素回溯。）\n\n   所以这里留了 3 级那一个：3 级在整个阶段 6 只出现这一次，而 1 级另有三个；\n   填整个函数本来也要求她把那一句计数写出来。完整的取舍与实测数据在\n   `exercise-blanks.test.js` 里那段长注释和 task-5 报告里。\n\n   **`fill` 跟计划给的不一样，是实测逼出来的。** 计划给的是「返回常数 0 的\n   同签名函数」。degree 一返回常数，候选就全部并列，那段选择排序一次也不\n   交换，**这一份就逐字退化成 `tour-dfs.js`** —— 实测钉过：`return 0;` 的\n   占位版在 3×4 与 3×5 上的棋盘事件流与 tour-dfs 的逐条相同（40 条 / 3,223\n   条）。后果是 4×5 上撞 200,000 上限、`result` 变成 `undefined`，而参考在\n   那块盘上 7,283 步就走完了 —— 违反「占位版必须仍能跑」（Task 4 在 queens\n   的 `fill=\"return true;\"` 上踩的是同一条线）。\n\n   但「近乎完整的天真实现」与「4×5 撞墙」**不是仅有的两条路**（修复轮 1 之前\n   这里就是这么写的，那个二分是假的）。现在用的 `fill` 是第三条：**按边界猜的\n   角落偏好启发式** —— 从 8 开始，靠一条边就减 2。它\n\n     · **不泄露** `DX/DY` 的八方向循环、不泄露 `onBoard` 调用、不泄露计数，\n       于是这道 3 级题留下的是货真价实的 3 级工作量（先前那版只差一个\n       `!visited` 子句，而中文提示又把那个子句点了名，等于把答案写了两遍\n       —— 那样这一阶段唯一的 3 级挖空实际是 1 级）；\n     · 仍然是**错的**，而且错得正是这道题要教的那件事：出路数必须随着马走过的\n       路变小，靠边界猜出来的数从头到尾不变；\n     · 四块盘实测 3×4 9,115 · 3×5 62,715 · **4×5 131,559** · 3×7 撞墙\n       （参考在 3×7 上也撞墙），参考跑得完的三块它都跑得完。\n\n   **4×5 那 131,559 步是这个选择的代价**：参考的 18 倍、占 200,000 上限的 66%，\n   离上限还剩约 68,000 步。绝对量级上它跟 queens 的 N=8（156,772 步、78%，\n   本来就是出厂默认体验）是同一档，浏览器里跑得动。`exercise-blanks.test.js`\n   有一条**余量断言**把它钉在 150,000 之下：将来任何把它推过线的改动会**大声\n   失败**，而不是变成一次神秘的截断。\n\n   指令是注释，**一步都不产生**：插入前后四块盘的步数、结果与整条棋盘事件流\n   逐条相同（见下表），把两行指令剥回去再跑也一致。\n\n   ---- 实测步数与棋盘事件（`Interp.STEP_LIMIT` = 200,000，角起 start = 0）----\n\n   拿两份源码各自生成的程序跑 `Interp.run(src, { host: {} })`，读 `trace.length`\n   与 mark/place/clear 的次数。**四块盘都是 tour.test.js 里钉着的滑杆位置**，\n   每一块演的是不同的东西：\n\n     棋盘   tour-dfs.js（朴素）   本文件（Warnsdorff）      这一块盘演什么\n     3×4      898 步 ✓ true       3,092 步 ✓ true    小盘上启发式的开销收不回来\n     3×5   34,988 步 ✓ false    120,650 步 ✓ false   查遍了，这块盘上没有巡游\n     4×5  200,000 步 ✗撞墙        7,283 步 ✓ true    大一点，启发式赢得压倒性\n     3×7  200,000 步 ✗撞墙      200,000 步 ✗撞墙     启发式也会失败 —— 它不是保证\n\n   棋盘事件（try / ok / cut / back，以及 place / clear —— place 恒等于 ok、\n   clear 恒等于 back，因为进一格就落子、退一格就收子）：\n\n     棋盘  算法        try    ok   cut   back=clear   注意\n     3×4  朴素         14    12     2       **0**   一次都不回溯，'back' 演不出来\n     3×4  Warnsdorff   19    12     7       **0**   同上\n     3×5  朴素       1,019   395   624       395    ← 'back' 唯一演得完的一块盘\n     3×5  Warnsdorff 1,019   395   624       395    ← 两份在这块盘上事件数完全相同\n     4×5  朴素       6,934 2,171 4,763     2,158    撞墙前已经退了两千多次\n     4×5  Warnsdorff    49    20    29       **0**  一条道走到底，一次没退过\n     3×7  朴素       6,370 2,218 4,152     2,201\n     3×7  Warnsdorff 1,723   591 1,132       577\n\n   **三件 Task 4/5 必须知道的事**：\n     ① 3×4 上两份算法都不回溯，所以 §2.7 的 'back' 状态和「按 `Step.depth`\n        压暗旧 'cut'」那套显示逻辑在默认盘上一次都不触发 —— 要演它得换盘。\n     ② **3×5 是唯一一块「两边都回溯得很凶、而且都诚实地跑到结论」的盘**\n        （各退 395 次，都返回 false，都不撞墙）。它是第四个滑杆位置的全部理由。\n     ③ **4×5 是并排对比最锋利的一块**：朴素退了 2,158 次还是撞墙，Warnsdorff\n        一次没退、20 步走完。这一对数字比步数本身更能说明「启发式在做什么」。\n\n   四行都在 tour.test.js 里钉着。3×4 和 3×7 是这一课诚实的那一半：\n   启发式**有代价**，而且**不保证**。别为了让表好看去调棋盘。\n\n   顺手量的、给 Task 4/5 挑滑杆上限用（tour-dfs.js 在这些盘上一律撞墙，\n   本文件一次不退地走完）：\n     本文件  5×5 10,188 步 · 6×6 17,117 步 · 8×8 36,111 步。\n   也就是说「棋盘越大启发式越省」不是修辞：8×8 上朴素回溯连百分之一都跑不到，\n   本文件只用掉上限的 18%。 */\n(function (root, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else root.AlgoTourWarnsdorff = factory();\n})(typeof self !== 'undefined' ? self : this, function () {\n  'use strict';\n\n  /* ================= 双语渲染（规格 §1.6 / §7.5）=================\n\n     ⚠ **这一整段在七份 algos/*.js 里逐字节相同**，check.py 的\n     bilingual_algos_check() 会核对。改这里就得七份一起改。\n     不抽成共用模块，是因为这些文件是被 inline_core.py 当**字符串**逐份\n     内联、再各自求值成 AlgoXxx 全局的 —— 抽出去就凭空多一条求值顺序\n     依赖，而那类缺陷要到浏览器里 ALGOS['queens.js'] 是 undefined 才发作\n     （阶段 5 建页当天撞过一次）。七份重复 + 一道字节级门，是阶段 7\n     king-greedy / king-exact 共用段用过的同一个套路。\n\n     `parts` 的元素只有两种：\n       字符串                 —— 一行，两种语言下逐字相同\n                                 （代码、空行、// >>> BLANK 指令行）\n       { zh: [], en: [] }     —— 一段散文，两边都是**行数组**\n\n     **两边行数必须相等**，不是洁癖：生成的源码是按行索引的 —— 解释器\n     每一步记 line，第 4 级提示靠 pristine 与编辑器逐行对齐划出 answerRange，\n     判定靠 judge.herSrc 比对。行数一差，切一次语言这四样同时指错地方。\n     行数一对齐，轨迹在两种语言下逐字节相同，切语言就只是换掉编辑器里的\n     文本，不重跑解释器。\n\n     BLANK 指令行**不翻译**：它本来就同时带着 hint 与 hintEn，两种语言\n     变体里那一行逐字相同，parse() 一点不用改。所以它是**字符串**片段。 */\n  function render(parts, lang) {\n    if (lang === undefined || lang === null) {\n      throw new Error(\n        'source({ lang }) 少了 lang —— 源码的注释与日志要用哪种语言没有' +\n        '默认值，必须写明 \"zh\" 或 \"en\"（默认成任何一种，都是让同一个缺陷' +\n        '换个地方复活）'\n      );\n    }\n    if (lang !== 'zh' && lang !== 'en') {\n      throw new Error('source({ lang }) 的 lang 只认 \"zh\" 或 \"en\"，收到：' +\n                      JSON.stringify(lang));\n    }\n    const out = [];\n    for (let i = 0; i < parts.length; i = i + 1) {\n      const p = parts[i];\n      if (typeof p === 'string') { out.push(p); continue; }\n      if (!p || !Array.isArray(p.zh) || !Array.isArray(p.en)) {\n        throw new Error('第 ' + i + ' 个片段既不是字符串、也不是 ' +\n                        '{ zh: [], en: [] }');\n      }\n      if (p.zh.length !== p.en.length) {\n        throw new Error(\n          '第 ' + i + ' 个片段两种语言行数不等：zh ' + p.zh.length + ' 行 / en ' +\n          p.en.length + ' 行 —— 生成的源码按行索引，行数一差，切一次语言 ' +\n          'Step.line / pristine / answerRange / judge.herSrc 同时指错地方' +\n          '（规格 §1.6）'\n        );\n      }\n      const lines = p[lang];\n      for (let j = 0; j < lines.length; j = j + 1) out.push(lines[j]);\n    }\n    return out;\n  }\n\n  /* 普通字符串拼，不用模板字面量：这段文本本身会被原样贴进 html，\n     反引号在那个上下文里比在这里更容易出事（照抄 queens.js 的理由）。\n\n     元素两种：字符串（代码 / 空行 / BLANK 指令行，两语逐字相同）与\n     `{ zh: [], en: [] }`（一段散文，两边行数必须相等）—— 见上面 render()。\n     英文不是逐句直译，是照中文那一版的意思与语气重写的，行数对齐落在\n     「段」上：段内句子怎么重组都行，段的行数必须一样。\n\n     ⚠ **与 tour-dfs.js 共用的每一段英文也必须逐字相同**（跟中文那一侧同一条\n     纪律）：并排 diff 这件教学事在英文界面下同样要成立，而这个工具默认英文。\n     改写共用段的顺手做法是**先改 tour-dfs.js，再把那一段整块复制过来**。\n\n     ⚠ **但这条纪律只有一半有机器门守着，另一半是人肉门** —— 别把它读成\n     全都有人管。tour.test.js 的子序列门阶段 8 起两种语言各跑一次，可它的\n     codeLines() 只留代码行，**整行 `//` 注释与整段块注释都被丢掉**。于是：\n\n       · 行尾 `//` 注释里的共用英文（`mark(sq, \"ok\");  // …` 那一族）\n         —— **机器门**。实测：只改本文件一侧那一句，`[en]` 当场红。\n       · 独占整行的散文段（HEAD 两段、各处块注释）\n         —— **人肉门**。只改一侧，两种语言照样 82 passed / 0 failed。\n         改这类共用散文，必须自己记得两份一起改。 */\n\n  /* ==== 以下 HEAD 与 tour-dfs.js 的 HEAD **行数相同**，\n     只有第 1 行的标题和第 12–13 行讲「先试哪一个」的两行不同。 ==== */\n  const HEAD = [\n    {\n      zh: [\n        '/* ============ 骑士巡游 · Warnsdorff 启发式 ============',\n        '   马走「日」字：横一竖二，或者横二竖一 —— 绕着它站的那一格一共八个方向。',\n        '   题目是：让马从某一格出发，把整块棋盘每一格都恰好踩一次。',\n        '',\n        '   格子编号：sq = 行 * W + 列。W 是棋盘的宽（每行几格），H 是高。',\n        '   第 0 行是棋盘最下面那一行，第 0 列是最左边那一列 —— 于是 0 号格',\n        '   就是国际象棋里的 a1。要反推回去：列 = sq % W，行 = (sq - 列) / W。',\n        '   棋盘不必是正方形，3×4 和 4×5 都是正常的棋盘。',\n        '',\n        '   办法是「试错 + 反悔」：挑一个方向走过去，走不通就退回来换一个。',\n        '   旁边那份源码跟这份只差一件事 —— 下一步先试哪一个。',\n        '   这一份：先试「出路最少」的那一格（这叫 Warnsdorff 规则）。',\n        '   直觉是 —— 出路快没了的格子，再不去就再也去不了了。 */',\n      ],\n      en: [\n        '/* ============ Knight\\'s Tour · Warnsdorff\\'s heuristic ============',\n        '   A knight moves in an L: one across and two along, or two across and one — eight',\n        '   directions in all. The task: from one square, step on every square exactly once.',\n        '',\n        '   Squares are numbered sq = row * W + column, where W is the width (squares per',\n        '   row) and H the height. Row 0 is the bottom row and column 0 the leftmost, so',\n        '   square 0 is a1 in chess. To reverse: column = sq % W, row = (sq - column) / W.',\n        '   The board need not be square — 3×4 and 4×5 are perfectly normal boards.',\n        '',\n        '   The method is \"try, then take it back\": walk one way, and when it leads nowhere,',\n        '   back up and take another. The source beside this differs in one thing only —',\n        '   which square to try first. This one goes to the square with the fewest exits',\n        '   left (that is Warnsdorff\\'s rule). The hunch: go now, or never get there at all. */',\n      ],\n    },\n    '',\n    {\n      zh: [\n        '/* 棋盘的宽、高，以及马从哪一格出发。',\n        '   能拧的旋钮是两个而不是一个，而工作量随格子数指数增长：',\n        '   3×4 和 4×5 之间只差 8 格，朴素那一份就从「一千步」变成「跑不完」。 */',\n      ],\n      en: [\n        '/* The board\\'s width and height, and which square the knight starts from.',\n        '   Two knobs to turn here, not one, and the work grows exponentially with squares:',\n        '   3×4 takes a thousand steps; 8 more for 4×5 and the plain one never finishes. */',\n      ],\n    },\n  ];\n\n  const BODY = [\n    '',\n    {\n      zh: [\n        '/* 马的八个方向。DX 与 DY 一一对应：第 k 个方向是「横走 DX[k]、竖走 DY[k]」。',\n        '   横一竖二四个、横二竖一四个，绕着起点转一圈 —— 这就是「日」字。 */',\n      ],\n      en: [\n        '/* The eight knight directions. DX and DY pair up: direction k is \"go DX[k] across',\n        '   and DY[k] along\" — four one-and-two, four two-and-one, a full ring around it. */',\n      ],\n    },\n    'const DX = [1, 2, 2, 1, -1, -2, -2, -1];',\n    'const DY = [2, 1, -1, -2, -2, -1, 1, 2];',\n    '',\n    {\n      zh: [\n        '/* 备忘表：visited[sq] = 1 表示这一格已经踩过了。',\n        '   一格只能踩一次 —— 这是整道题唯一的规则，别的都是围着它转的脚手架。 */',\n      ],\n      en: [\n        '/* Lookup table: visited[sq] = 1 means this square has been stepped on already.',\n        '   A square is stepped on once only — the one rule here; the rest is scaffolding. */',\n      ],\n    },\n    'const visited = [];',\n    'for (let i = 0; i < W * H; i = i + 1) { visited.push(0); }',\n    '',\n    {\n      zh: ['// (x, y) 还在棋盘上吗？出界的方向连试都不用试。'],\n      en: ['// Is (x, y) still on the board? A direction that leaves it is not worth trying.'],\n    },\n    'function onBoard(x, y) {',\n    '  return x >= 0 && x < W && y >= 0 && y < H;',\n    '}',\n    /* ↓↓↓ 差异①：tour-dfs.js 里没有这个函数。 ↓↓↓ */\n    '',\n    {\n      zh: [\n        '/* 站在 sq 上，还有几个「没踩过」的格子可以去？这个数就叫它的出路数。',\n        '   整个 Warnsdorff 就靠这一个数：出路数越小的格子越急，越要先去。',\n        '   想确认它真的在起作用：把下面排序那一段删掉，这份就退回成朴素回溯了。 */',\n      ],\n      en: [\n        '/* Standing on sq, how many squares not yet stepped on can it still reach? Call that',\n        '   its exits. All of Warnsdorff rests on this one number: fewer exits, more urgent,',\n        '   go there first. To check it works: delete the sort below and this turns plain. */',\n      ],\n    },\n    '// >>> BLANK id=degree-fn level=3 fill=\"function degree(sq) { const x = sq % W; const y = (sq - x) / W; let d = 8; if (x === 0) { d = d - 2; } if (x === W - 1) { d = d - 2; } if (y === 0) { d = d - 2; } if (y === H - 1) { d = d - 2; } return d; }\" hint=\"整个 Warnsdorff 就靠这一个数：马此刻站在 sq 上，接下来到底还能去几个格子 —— 数的是真能落脚的那几个，踩过的一概不算。占位那一版一个方向都没看过，它只按 sq 靠不靠边猜了一个数，于是马已经走到哪儿它根本不管，给出的数从头到尾都一样。\" hintEn=\"All of Warnsdorff rests on this one number: with the knight standing on sq right now, how many squares can it actually move to next. Count the ones it can really land on — a square already stepped on does not count at all. The placeholder never looks at a single direction; it just guesses from how close sq sits to an edge, so the number it hands back never budges as the knight\\'s tour goes on.\"',\n    'function degree(sq) {',\n    '  const x = sq % W;',\n    '  const y = (sq - x) / W;',\n    '  let d = 0;',\n    '  for (let k = 0; k < 8; k = k + 1) {',\n    '    const nx = x + DX[k];',\n    '    const ny = y + DY[k];',\n    '    if (onBoard(nx, ny)) {',\n    '      if (!visited[ny * W + nx]) { d = d + 1; }',\n    '    }',\n    '  }',\n    '  return d;',\n    '}',\n    '// <<< BLANK',\n    /* ↑↑↑ 差异① 结束 ↑↑↑ */\n    '',\n    {\n      zh: [\n        '/* 马站在 sq 上，这已经是路线上的第 n 格 —— 接着往下走。',\n        '   走得通就返回 true，八个方向都走不通就返回 false 让上一层去换。',\n        '   n 等于总格数时，每一格都踩过了，这一支就是答案。 */',\n      ],\n      en: [\n        '/* The knight stands on sq, and this is already square n of the route — carry on.',\n        '   Return true if a way through is found, false when all eight directions fail, so',\n        '   the level above switches. When n equals the square count, every square is done. */',\n      ],\n    },\n    'function tour(sq, n) {',\n    '  const x = sq % W;',\n    '  const y = (sq - x) / W;',\n    '  visited[sq] = 1;',\n    {\n      zh: ['  mark(sq, \"ok\");        // 已确认：这一格进了当前这条路线'],\n      en: ['  mark(sq, \"ok\");        // Confirmed: this square joins the route being built'],\n    },\n    {\n      zh: ['  place(sq, \"wN\");       // 马真的走到这一格 —— 盘上立刻看得见'],\n      en: ['  place(sq, \"wN\");       // The knight really steps here — the board shows it at once'],\n    },\n    '  if (n === W * H) {',\n    '    return true;',\n    '  }',\n    {\n      zh: ['  /* 从这一格出发，八个方向里哪几个还落在棋盘上 —— 先收成一张候选表。 */'],\n      en: ['  /* Which of the eight directions out of here stay on the board: a candidate list. */'],\n    },\n    '  const cand = [];',\n    '  for (let k = 0; k < 8; k = k + 1) {',\n    '    const nx = x + DX[k];',\n    '    const ny = y + DY[k];',\n    '    if (onBoard(nx, ny)) {',\n    '      cand.push(ny * W + nx);',\n    '    }',\n    '  }',\n    /* ↓↓↓ 差异②：tour-dfs.js 在这里只有一行注释。上下都逐字相同，\n       **两种语言各自逐字相同**。⚠ 上下那些**独占整行的**注释段是**人肉门**：\n       子序列门的 codeLines() 把它们整段丢掉，只改一侧两语照样全绿\n       （见文件头）。 ↓↓↓ */\n    {\n      zh: [\n        '  /* Warnsdorff 就是这一段：先量出每个候选的出路数，再把候选表按这个数',\n        '     从小到大排一遍 —— 于是下面那个循环第一个试的，就是最急的那一格。',\n        '     子集里数组没有 sort，所以这里是手写的选择排序：每一轮从剩下的里面',\n        '     挑出最小的一个，跟当前位置对调。候选最多八个，多排几趟也不心疼。 */',\n      ],\n      en: [\n        '  /* Warnsdorff is this passage: measure the exits of every candidate, then sort the',\n        '     list by that number, smallest first — so the loop below tries the most urgent',\n        '     square first. Arrays here have no sort, so this is a hand-written selection sort:',\n        '     each round takes the smallest left and swaps it in. At most eight, so it is cheap. */',\n      ],\n    },\n    '  const degs = [];',\n    '  for (let i = 0; i < cand.length; i = i + 1) {',\n    '    degs.push(degree(cand[i]));',\n    '  }',\n    '  for (let i = 0; i < cand.length; i = i + 1) {',\n    '    let best = i;',\n    '    for (let j = i + 1; j < cand.length; j = j + 1) {',\n    '      if (degs[j] < degs[best]) { best = j; }',\n    '    }',\n    '    const tsq = cand[i]; cand[i] = cand[best]; cand[best] = tsq;',\n    '    const td = degs[i]; degs[i] = degs[best]; degs[best] = td;',\n    '  }',\n    /* ↑↑↑ 差异② 结束 ↑↑↑ */\n    '  for (let i = 0; i < cand.length; i = i + 1) {',\n    '    const nsq = cand[i];',\n    {\n      zh: ['    mark(nsq, \"try\");    // 正在尝试：先点亮这一格，再看它能不能走'],\n      en: ['    mark(nsq, \"try\");    // Trying: light the square up first, then see if it works'],\n    },\n    '    if (visited[nsq]) {',\n    {\n      zh: ['      mark(nsq, \"cut\");  // 被剪枝：踩过的格子不能再踩'],\n      en: ['      mark(nsq, \"cut\");  // Pruned: a square stepped on cannot be stepped on again'],\n    },\n    '    } else {',\n    '      if (tour(nsq, n + 1)) {',\n    {\n      zh: ['        return true;     // 下游走通了 —— 一路把 true 传回去，别的方向不用再试'],\n      en: ['        return true;     // Downstream worked — pass true all the way up, no more tries'],\n    },\n    '      }',\n    '    }',\n    '  }',\n    {\n      zh: [\n        '  /* 回溯撤销：八个方向都试遍了还是走不通，把这一格原样退还 ——',\n        '     备忘表擦掉，马也从这一格撤走。不退的话，接下来别的分支会看到一格',\n        '     根本没人站过的「踩过」，从此每一条路线都是假的。',\n        '     mark 与 clear 是分开的两步：先看到这一格被判「撤销」，下一步马才消失。 */',\n      ],\n      en: [\n        '  /* Taking it back: all eight tried and none worked, so hand this square back the',\n        '     way it came — wipe the table, walk the knight off. Skip that and a later branch',\n        '     meets a \"stepped on\" square nobody stood on, making every route after it a lie.',\n        '     mark and clear are two steps: marked \"taken back\" first, knight gone next. */',\n      ],\n    },\n    '  visited[sq] = 0;',\n    '  mark(sq, \"back\");',\n    '  clear(sq);',\n    '  return false;',\n    '}',\n    '',\n    {\n      zh: ['// 出发。第一格也要先亮一下，跟后面每一格的待遇一样。'],\n      en: ['// Off we go. The first square lights up too, treated like every square after it.'],\n    },\n    'mark(START, \"try\");',\n    'const found = tour(START, 1);',\n    'if (found) {',\n    {\n      zh: [\n        '  /* 盘上留着的那一整盘马就是答案本身。它们不收 —— 收了就没有答案可看了。',\n        '     想看清顺序：把单步倒着回放一遍，马是按什么次序落上去的一目了然。 */',\n      ],\n      en: [\n        '  /* The knights left standing are the answer itself. They stay — take them off and',\n        '     there is nothing left to look at. For the order, step backwards through the run. */',\n      ],\n    },\n    {\n      zh: ['  log(\"找到了：一条踩遍 \" + (W * H) + \" 格的路线\");'],\n      en: ['  log(\"Found it: a route stepping on every square, \" + (W * H) + \" in all\");'],\n    },\n    '} else {',\n    {\n      zh: ['  /* 所有分支都退过了，盘上一匹马都不剩，跟出发前一模一样。 */'],\n      en: ['  /* Every branch was taken back: no knight left, exactly as before the start. */'],\n    },\n    {\n      zh: ['  log(\"走不通：从这一格出发，没有能踩遍全盘的路线\");'],\n      en: ['  log(\"No way through: from this square, no route covers the whole board\");'],\n    },\n    '}',\n    'return found;',\n  ];\n\n  /* source({ W, H, start, lang }) → string\n\n     四个参数都不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数\n     已经是本仓库抓到过三次的缺陷类）。一个默默变成 8 的 W 会让界面写着\n     5、跑的却是 8，正是这个工具最不能出的错；`lang` 默认成任何一种，都是\n     让同一个缺陷换个地方复活（它由 render() 校验，见上面）。\n\n     ⚠ **W / H / start 的校验留在最前，`lang` 的校验在最后**（render() 里）。\n     tour.test.js 那一组「缺参数当场抛」故意一个 lang 都不传、每条都带\n     pattern，钉的正是这个顺序：只给了 H / start 的调用撞上的必须仍旧是\n     「少了 W」。\n\n     校验只管「是不是合法的棋盘和格子」，**不管好不好跑** —— 见文件头：\n     3×7 撞墙恰恰是要生成出来跑给她看的。\n\n     这个函数与 tour-dfs.js 的同名函数逐字相同（除了报错文案里没有算法名），\n     两边一起改。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.W === undefined || o.W === null) {\n      throw new Error('source({ W, H, start }) 少了 W —— 棋盘宽度没有默认值，必须写明');\n    }\n    if (o.H === undefined || o.H === null) {\n      throw new Error('source({ W, H, start }) 少了 H —— 棋盘高度没有默认值，必须写明');\n    }\n    if (o.start === undefined || o.start === null) {\n      throw new Error('source({ W, H, start }) 少了 start —— 出发格没有默认值，必须写明');\n    }\n    const W = o.W, H = o.H, start = o.start;\n    if (typeof W !== 'number' || !isFinite(W) || Math.floor(W) !== W || W < 1) {\n      throw new Error('W 必须是 >= 1 的整数，收到：' + W);\n    }\n    if (typeof H !== 'number' || !isFinite(H) || Math.floor(H) !== H || H < 1) {\n      throw new Error('H 必须是 >= 1 的整数，收到：' + H);\n    }\n    if (typeof start !== 'number' || !isFinite(start) || Math.floor(start) !== start ||\n        start < 0 || start >= W * H) {\n      throw new Error('start 必须是 0 到 ' + (W * H - 1) + ' 之间的整数，收到：' + start);\n    }\n    return render(HEAD, o.lang)\n      .concat([\n        'const W = ' + W + ';',\n        'const H = ' + H + ';',\n        'const START = ' + start + ';',\n      ])\n      .concat(render(BODY, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source };\n});\n",
  'knight-path.js': "/* 骑士最短路（广度优先搜索）的**算法源码生成器**（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `tour-dfs.js` / `tour-warnsdorff.js` / `minimax.js` 是同一个\n   形状：这个模块本身不搜索任何东西 —— 它吐出一段**字符串**。那段字符串同时是\n   喂给 `Interp.run` 去真跑的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份\n   源码。一份字符串两个用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- 为什么是**递归铺层**，不是一条队列 ----\n\n   教科书上的 BFS 是「一条队列 + 一个 while」。这里写成了另一种同样标准的\n   形态：**逐层同步（level-synchronous）BFS** —— `expand(frontier, d)` 拿着\n   「正好 d 步能到的那一整层格子」，把它们的邻居收成下一层，再对下一层调用\n   自己。两种写法访问顺序完全一样、距离完全一样（knight-path.test.js 拿一份\n   队列式的宿主侧 BFS 逐组对拍），但这一种多给了两件工具⑤ 非要不可的东西：\n\n     ① **递归深度就是 BFS 层号**，而层号就是最短距离。于是这一页的第三根轴\n        （深度塔，§1.4「z 轴 = 入口函数的递归深度」）不需要任何额外声明就正好\n        是「第几层」；左边调用栈面板里叠着的帧数，就是右边棋盘上波纹的圈数。\n        队列式写法的调用深度恒等于 1，那根轴会整个塌掉，得靠页面自己再算一遍\n        距离才能立起来 —— 而页面一旦自己算距离，§2.8 请她改这份源码之后，\n        塔就不再跟着她的改动变了。**这正是本仓库最忌讳的那种漂移**：\n        看到的和跑的分了家。\n     ② 「一层铺完再铺下一层」在源码结构上是**看得见**的，而不是藏在一条队列的\n        先进先出里。BFS 唯一的秘密就是这个顺序。\n\n   代价写清楚：`frontier` / `next` 两张表比一条队列多占内存，而且这一段递归\n   最深只到「最短距离」那么深（8×8 上最多 6 层），不是每格一层 —— 不会像\n   骑士巡游那样把栈叠到 20 层。\n\n   ---- 几处必须写下来的约定 ----\n\n   · **入口函数叫 `expand`**，对应 `PROBLEMS.knightPath.entry`。它是**递归**\n     那一个（`expand(frontier, d)` 铺第 d 层），不是只调用一次的外壳 ——\n     `TreeModel.build(trace, 'expand')` 认到的帧必须一层套一层。顶层是\n     `steps = expand([START], 0); … return steps;`，所以 `run().result`\n     就是最短步数。\n\n   · **格子编号 `sq = 行 * W + 列`**，行 0 在棋盘最下面、列 0 在最左边，\n     于是 0 号格是 a1 —— 跟 `queens.js`、`tour-*.js`、`BoardRender.layout()`\n     的 `squareCenter(file, rank)`、`chess-core.js` 的 `SQ(file, rank)` 同向。\n     反推是 `列 = sq % W; 行 = (sq - 列) / W`。**这一题的棋盘是正方形**\n     （W×W），因为它演的是真正那一副 8×8 的棋盘上「马从这里到那里几步」。\n\n   · **返回值：最短步数；到不了是 −1。**「到不了」绝不能变成 0 —— 0 的意思是\n     「已经站在目标格上了」，把这两件事混成同一个数字是这一题最不能出的错\n     （工具⑤ 全页的规矩：`null`/未知不许变成数字，这里是它在算法侧的对应物）。\n     宿主侧那份对拍用的队列式 BFS 也是 −1，两边同源。\n\n   · **宿主桥接**：`mark(sq, kind)` 画规格 §2.7 的状态，**这一题只用三种**：\n       'try'（正在看这个邻居）· 'ok'（第一次到达，这就是它的最短步数）·\n       'cut'（早就到过了，从这边过去只会更长）。\n     **`'back'` 一次都不会出现，而这正是这一题的一半内容**：BFS 从不反悔。\n     N 皇后和骑士巡游都要回溯，它不要 —— 因为它是按距离从近到远铺开的，\n     第一次碰到一格时那就已经是最短的了，没有什么可反悔的。\n     `PROBLEMS.knightPath.kinds` 因此只有三行图例，少的那一行本身就是一句话。\n\n   · **`place` 发生在最后，而且这是对的**（跟 `tour-*.js` 的「边搜边走」相反，\n     不要照抄那条裁定）。骑士巡游里马真的在一步步走，所以落子必须铺满整段\n     搜索；BFS 里**没有任何一匹马在走** —— 它是一圈一圈的水波，同时向所有\n     方向铺开。搜索途中盘上该有的是波纹（`mark`），不是棋子。等到碰着目标，\n     顺着 `prev` 把路线倒着串回来，一次摆出那 d+1 匹马 —— 那串马就是答案。\n     搜索途中盘面并不空：波纹一直在长，只是长的不是棋子。\n\n   · **`place(sq, \"wN\")` 是「数字格子 + 字符串棋子」**，跟 `queens.js` 的\n     `place(sq, \"wQ\")` 同一个约定。仓库里另有一个反例\n     （`tools/_debugger-preview.html` 内嵌的那份 N 皇后示例写的是\n     `place(sq(col, row), 5)`，两个参数正好相反），别照那份抄。\n\n   · 子集约束（规格 §2.6）：**没有三元运算符**，`a ? b : c` 会抛 unsupported，\n     一律展开成 if/else；数组只有 `push` / `pop` 和 `length` 与下标读写。\n\n   · **两组 `// >>> BLANK` 指令现在就写在下面的 `BODY` 里**（§2.9），由\n     `core/exercise.js` 的 `parse()` 消费。两个都是 level=1「填一个表达式」：\n       ① `id=on-board` —— `onBoard(x, y)` 那一行返回式，跟 `queens.js` 的\n          `safe(r, c)` 同一道缝。\n       ② `id=seen-test` —— `expand()` 里那一句 `if (dist[nb] >= 0) {`：\n          「这一格碰过没有」。它就是整个 BFS 的开关，写错了程序照常跑完、\n          照常返回一个数，只是那个数不对 —— 正是挖空练习要的那种「跑得完\n          但答错」，判定靠比行为而不是比文本。\n\n     指令是注释，**一步都不产生**：插入前后 a1→h8 是 5,086 步 / 距离 6、\n     a1→d4 是 347 步 / 距离 2，与上面那张实测表逐格相同；把四行指令剥回去\n     再跑，步数、结果与整条棋盘事件流逐条一致。\n\n     **两个 `fill` 都跟计划给的相反，各挡一种事故**（实测，滑杆全程 1..63）：\n     恒真的 `onBoard`（计划给的 `fill=\"return true;\"`）会让 `nb` 算出 −15、\n     68 这种**棋盘上不存在的格子号**，滑杆全程 10,561 条棋盘事件落在盘外，\n     而且 63 个目标格里有 38 个答案照样对；`fill=\"if (false) {\"` 更甚 ——\n     它 63 个目标格**全部答对**（逐层同步的 BFS 即使把「碰过没有」整个关掉，\n     第一次生成目标格的那一层仍然正好是最短距离）。一个按 Run 就给出正确\n     读数的占位版会让 Check 看起来像在刁难人。现在用的是 `return false;`\n     与 `if (true) {`：一律往**过紧**的方向倒，结果恒为 −1，滑杆全程最多\n     288 步、盘外事件 0 条。三关六条断言在 `core/exercise-blanks.test.js`。\n\n   ---- 实测步数与结果（`Interp.STEP_LIMIT` = 200,000）----\n\n   拿本文件生成的源码跑 `Interp.run(src, { host: {} })`，读 `trace.length`\n   与 `result`（全部 start = 0 = a1，与 knight-path.test.js 同源）：\n\n     目标（start = a1）      步数     距离   确认的格子（ok）\n     h8 (63)               5,086      6      64   ← 整块盘全铺遍了，最贵的一档\n     h1 ( 7)               4,121      5      63\n     a8 (56)               3,575      5      61\n     g8 (62)               3,298      5      56\n     b2 ( 9)               1,791      4      47   ← **这一题的顿悟**：紧挨着的斜角要 4 步\n     a2 ( 8)                 934      3      28\n     b1 ( 1)                 837      3      26\n     d4 (27)                 347      2       5   ← 两层就碰上了，波纹只铺了一小圈\n     6×6 → (35)            1,360      4      30\n     5×5 → (24)            1,247      4      24\n     2×2 → ( 3)              100     −1       1   ← 到不了：马在 2×2 上一步都走不出去\n\n   `back` 一栏不列，因为它恒等于 0 —— 见上面「BFS 从不反悔」那一条。\n\n   简报给的两个数（8×8 a1→h8 **3,588** 步、a1→d4 **469** 步）是对着另一份实现\n   量的：本文件量出来是 **5,086** 与 **347**，而距离 6 与 2 两边一致。注意这不是\n   一个常数倍数 —— 一头比它高、另一头比它低，所以那份实现不是「多写/少写了一行」，\n   而是结构不同（多半是教科书那种一条队列的写法：没有 frontier/next 两张表的\n   开销，但也没有早停在层内的那一下）。**没有为了对齐那两个数字改代码** ——\n   距离才是这道题的答案，步数是实现形态的后果。测出来是多少就报多少。\n\n   离 200,000 的上限还差两个数量级：这一题**永远不会撞墙**，而这本身就是\n   跟前两题的对照 —— 回溯是指数的，BFS 是线性的（每格最多被确认一次）。\n   规格 §4⑤ 的三段弧线里，它是「做得到」的那一段。\n\n   滑杆边界（W 与 target 的范围）是页面的展示决定，不是本模块的校验边界：\n   `source()` 对任何 W ≥ 1、以及任何落在盘上的 start / target 都照常吐源码，\n   包括到不了的那些 —— 「到不了」要生成出来跑给她看。 */\n(function (root, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else root.AlgoKnightPath = factory();\n})(typeof self !== 'undefined' ? self : this, function () {\n  'use strict';\n\n  /* ================= 双语渲染（规格 §1.6 / §7.5）=================\n\n     ⚠ **这一整段在七份 algos/*.js 里逐字节相同**，check.py 的\n     bilingual_algos_check() 会核对。改这里就得七份一起改。\n     不抽成共用模块，是因为这些文件是被 inline_core.py 当**字符串**逐份\n     内联、再各自求值成 AlgoXxx 全局的 —— 抽出去就凭空多一条求值顺序\n     依赖，而那类缺陷要到浏览器里 ALGOS['queens.js'] 是 undefined 才发作\n     （阶段 5 建页当天撞过一次）。七份重复 + 一道字节级门，是阶段 7\n     king-greedy / king-exact 共用段用过的同一个套路。\n\n     `parts` 的元素只有两种：\n       字符串                 —— 一行，两种语言下逐字相同\n                                 （代码、空行、// >>> BLANK 指令行）\n       { zh: [], en: [] }     —— 一段散文，两边都是**行数组**\n\n     **两边行数必须相等**，不是洁癖：生成的源码是按行索引的 —— 解释器\n     每一步记 line，第 4 级提示靠 pristine 与编辑器逐行对齐划出 answerRange，\n     判定靠 judge.herSrc 比对。行数一差，切一次语言这四样同时指错地方。\n     行数一对齐，轨迹在两种语言下逐字节相同，切语言就只是换掉编辑器里的\n     文本，不重跑解释器。\n\n     BLANK 指令行**不翻译**：它本来就同时带着 hint 与 hintEn，两种语言\n     变体里那一行逐字相同，parse() 一点不用改。所以它是**字符串**片段。 */\n  function render(parts, lang) {\n    if (lang === undefined || lang === null) {\n      throw new Error(\n        'source({ lang }) 少了 lang —— 源码的注释与日志要用哪种语言没有' +\n        '默认值，必须写明 \"zh\" 或 \"en\"（默认成任何一种，都是让同一个缺陷' +\n        '换个地方复活）'\n      );\n    }\n    if (lang !== 'zh' && lang !== 'en') {\n      throw new Error('source({ lang }) 的 lang 只认 \"zh\" 或 \"en\"，收到：' +\n                      JSON.stringify(lang));\n    }\n    const out = [];\n    for (let i = 0; i < parts.length; i = i + 1) {\n      const p = parts[i];\n      if (typeof p === 'string') { out.push(p); continue; }\n      if (!p || !Array.isArray(p.zh) || !Array.isArray(p.en)) {\n        throw new Error('第 ' + i + ' 个片段既不是字符串、也不是 ' +\n                        '{ zh: [], en: [] }');\n      }\n      if (p.zh.length !== p.en.length) {\n        throw new Error(\n          '第 ' + i + ' 个片段两种语言行数不等：zh ' + p.zh.length + ' 行 / en ' +\n          p.en.length + ' 行 —— 生成的源码按行索引，行数一差，切一次语言 ' +\n          'Step.line / pristine / answerRange / judge.herSrc 同时指错地方' +\n          '（规格 §1.6）'\n        );\n      }\n      const lines = p[lang];\n      for (let j = 0; j < lines.length; j = j + 1) out.push(lines[j]);\n    }\n    return out;\n  }\n\n  /* 普通字符串拼，不用模板字面量：这段文本本身会被原样贴进 html，\n     反引号在那个上下文里比在这里更容易出事（照抄 queens.js 的理由）。\n\n     元素两种：字符串（代码 / 空行 / BLANK 指令行，两语逐字相同）与\n     `{ zh: [], en: [] }`（一段散文，两边行数必须相等）—— 见上面 render()。\n     英文不是逐句直译，是照中文那一版的意思与语气重写的，行数对齐落在\n     「段」上：段内句子怎么重组都行，段的行数必须一样。 */\n  const HEAD = [\n    {\n      zh: [\n        '/* ============ 骑士的最短路 · 广度优先搜索 ============',\n        '   马走「日」字：横一竖二，或者横二竖一 —— 绕着它站的那一格一共八个方向。',\n        '   题目是：从一格走到另一格，最少要几步？',\n        '',\n        '   格子编号：sq = 行 * W + 列。第 0 行是棋盘最下面那一行，第 0 列是最左边',\n        '   那一列 —— 于是 0 号格就是国际象棋里的 a1。',\n        '   要反推回去：列 = sq % W，行 = (sq - 列) / W。',\n        '',\n        '   办法叫「广度优先」：先把一步能到的格子全找出来，再把两步能到的全找出来，',\n        '   一层一层往外铺，像往水里丢一颗石子荡开的波纹。',\n        '   第一次碰到目标的那一层，层号就是最短步数 —— 因为更近的每一层都已经',\n        '   找遍了，目标不在那里面。',\n        '',\n        '   跟前两道题最大的不同：**它一次也不反悔**。回溯搜索要退回来重走，是因为',\n        '   它可能先冲进一条错路；而这一份是按远近铺开的，第一次碰到一格时，那就',\n        '   已经是最短的走法了，没有什么可反悔的。 */',\n      ],\n      en: [\n        '/* ============ The Knight’s Shortest Path · Breadth-First Search ============',\n        '   A knight moves in an L: one square across and two along, or two and one — eight',\n        '   directions around the square it stands on. From one square to another, how few moves?',\n        '',\n        '   Squares are numbered sq = row * W + column. Row 0 is the bottom row of the board',\n        '   and column 0 is the leftmost one — so square 0 is a1 in chess.',\n        '   To go the other way: column = sq % W, row = (sq - column) / W.',\n        '',\n        '   The method is called breadth-first: find every square one move away, then every',\n        '   square two moves away, spreading outward a layer at a time, like ripples from a',\n        '   stone dropped in water. The layer where the target first appears is the fewest',\n        '   moves — every nearer layer was already searched, and the target was not there.',\n        '',\n        '   The big difference from the previous two puzzles: **it never takes a move back**.',\n        '   Backtracking retreats and retries because it can charge into a wrong path; this one',\n        '   spreads by distance, so the first arrival at a square is already the shortest way. */',\n      ],\n    },\n    '',\n    {\n      zh: ['/* 棋盘边长、出发格、目标格。真正的棋盘就是 W = 8。 */'],\n      en: ['/* The side of the board, the starting square, the target. A real board is W = 8. */'],\n    },\n  ];\n\n  const BODY = [\n    '',\n    {\n      zh: [\n        '/* 马的八个方向。DX 与 DY 一一对应：第 k 个方向是「横走 DX[k]、竖走 DY[k]」。',\n        '   横一竖二四个、横二竖一四个，绕着起点转一圈 —— 这就是「日」字。 */',\n      ],\n      en: [\n        '/* The eight knight directions. DX and DY pair up: direction k is \"go DX[k] across',\n        '   and DY[k] along\" — four one-and-two, four two-and-one, a full ring around it. */',\n      ],\n    },\n    'const DX = [1, 2, 2, 1, -1, -2, -2, -1];',\n    'const DY = [2, 1, -1, -2, -2, -1, 1, 2];',\n    '',\n    {\n      zh: [\n        '/* 两张备忘表：',\n        '     dist[sq]  从出发格走到这一格最少几步；−1 表示还没碰到过它。',\n        '     prev[sq]  第一次到达它时，是从哪一格过来的 —— 最后要靠它把路线串回来。',\n        '   一格只会被确认一次 —— 这是整道题唯一的规则，别的都是围着它转的脚手架。 */',\n      ],\n      en: [\n        '/* Two lookup tables:',\n        '     dist[sq]  fewest moves from the start to this square; −1 means not yet touched.',\n        '     prev[sq]  which square we came from the first time; the route is rebuilt from it.',\n        '   A square is confirmed exactly once — the one rule here; the rest is scaffolding. */',\n      ],\n    },\n    'const dist = [];',\n    'const prev = [];',\n    'for (let i = 0; i < W * W; i = i + 1) { dist.push(-1); prev.push(-1); }',\n    '',\n    {\n      zh: ['// (x, y) 还在棋盘上吗？出界的方向连看都不用看。'],\n      en: ['// Is (x, y) still on the board? A direction that leaves it is not worth a look.'],\n    },\n    'function onBoard(x, y) {',\n    '  // >>> BLANK id=on-board level=1 fill=\"return false;\" hint=\"四条边都要查：x 要落在 0 到 W−1 之间，y 也一样。少查一条边，波纹就会漫到棋盘外面去 —— 那外面的格子号码根本不存在。\" hintEn=\"All four edges have to be checked: x must land between 0 and W−1, and so must y. Miss one edge and the wave spills off the board, into square numbers that do not exist.\"',\n    '  return x >= 0 && x < W && y >= 0 && y < W;',\n    '  // <<< BLANK',\n    '}',\n    '',\n    {\n      zh: [\n        '/* frontier 是「正好 d 步能到的那一整层格子」。',\n        '   这个函数把这一层每一格的八个方向都看一遍：凡是还没碰过的，都属于第 d+1',\n        '   层 —— 收齐之后，再对下一层调用自己。递归的每一层，就是棋盘上的一圈波纹，',\n        '   所以左边调用栈叠了几帧，右边的波纹就荡开了几圈。',\n        '   返回最短步数；这一层之后再也铺不出新格子，就返回 −1（到不了）。 */',\n      ],\n      en: [\n        '/* frontier is \"the whole layer of squares reachable in exactly d moves\".',\n        '   This function checks all eight directions out of every square in that layer; any',\n        '   square not yet touched belongs to layer d+1. Collect them, then call itself on that',\n        '   layer — each level of recursion is one ripple, so the frames stacked on the left are',\n        '   the rings on the right. Returns the fewest moves; −1 if no new square, so no route. */',\n      ],\n    },\n    'function expand(frontier, d) {',\n    '  const next = [];',\n    '  for (let i = 0; i < frontier.length; i = i + 1) {',\n    '    const cur = frontier[i];',\n    '    const x = cur % W;',\n    '    const y = (cur - x) / W;',\n    '    for (let k = 0; k < 8; k = k + 1) {',\n    '      const nx = x + DX[k];',\n    '      const ny = y + DY[k];',\n    '      if (onBoard(nx, ny)) {',\n    '        const nb = ny * W + nx;',\n    {\n      zh: ['        mark(nb, \"try\");     // 正在看这个邻居：先点亮，再问它是不是第一次碰到'],\n      en: ['        mark(nb, \"try\");     // This neighbour: light it up first, then ask if it is new'],\n    },\n    '        // >>> BLANK id=seen-test level=1 fill=\"if (true) {\" hint=\"dist[nb] 记的是「走到这一格最少几步」，−1 的意思是还没碰过它。碰过的就不必再看了。留神出发格记的是 0 —— 它也是碰过的。\" hintEn=\"dist[nb] holds the fewest moves needed to reach that square, and −1 means it has not been touched yet. A square that has been touched needs no second look. Watch out for the starting square: it holds 0, and 0 counts as touched.\"',\n    '        if (dist[nb] >= 0) {',\n    '        // <<< BLANK',\n    {\n      zh: [\n        '          /* 早就到过它了。而且更早到达它的那一层比现在这一层近，',\n        '             所以从这边再走过去只会更长 —— 看都不用再看。 */',\n      ],\n      en: [\n        '          /* Reached long ago, and the layer that reached it was nearer than',\n        '             this one, so going there from here is only longer. Skip it. */',\n      ],\n    },\n    '          mark(nb, \"cut\");',\n    '        } else {',\n    {\n      zh: [\n        '          /* 第一次碰到它。它比这一层正好远一步，而这就是它的最短步数：',\n        '             更近的每一层刚才都铺过了，如果有更短的走法，早就碰上了。 */',\n      ],\n      en: [\n        '          /* First time here, exactly one move further than this layer — that is',\n        '             its shortest: nearer layers are done, so a shorter way would have shown. */',\n      ],\n    },\n    '          dist[nb] = d + 1;',\n    '          prev[nb] = cur;',\n    '          mark(nb, \"ok\");',\n    '          if (nb === TARGET) {',\n    {\n      zh: ['            return d + 1;    // 碰上目标了 —— 当场就是答案，剩下的层不用再铺'],\n      en: ['            return d + 1;    // Target found — that is the answer; no more layers needed'],\n    },\n    '          }',\n    '          next.push(nb);',\n    '        }',\n    '      }',\n    '    }',\n    '  }',\n    '  if (next.length === 0) {',\n    {\n      zh: ['    /* 这一层之后再没有新格子了：能到的都到过了，目标不在其中。 */'],\n      en: ['    /* Nothing new after this layer: everything reachable is done, none is the target. */'],\n    },\n    '    return -1;',\n    '  }',\n    {\n      zh: ['  return expand(next, d + 1);   // 铺下一层 —— 递归就发生在这一行'],\n      en: ['  return expand(next, d + 1);   // lay out the next layer — this line is the recursion'],\n    },\n    '}',\n    '',\n    {\n      zh: ['/* 出发。第 0 层只有出发格自己，它到自己是 0 步。 */'],\n      en: ['/* Off we go. Layer 0 holds only the starting square: 0 moves to reach itself. */'],\n    },\n    'dist[START] = 0;',\n    'mark(START, \"ok\");',\n    'let steps = 0;',\n    'if (START !== TARGET) {',\n    '  steps = expand([START], 0);',\n    '}',\n    'if (steps < 0) {',\n    {\n      zh: [\n        '  /* 盘上一匹马都不摆：没有路线可摆。−1 不是 0 —— 0 的意思是「已经站在',\n        '     目标格上了」，那是完全不同的一件事。 */',\n      ],\n      en: [\n        '  /* Not one knight goes on the board: there is no route to lay out. And −1 is',\n        '     not 0 — 0 would mean \"already on the target\", a completely different thing. */',\n      ],\n    },\n    {\n      zh: ['  log(\"到不了：马从这一格出发，永远走不到目标格\");'],\n      en: ['  log(\"Cannot be reached: from this square the knight can never get to the target\");'],\n    },\n    '} else {',\n    {\n      zh: [\n        '  /* 把路线倒着串回来：从目标格顺着 prev 一路退回出发格，每退一格就摆一匹马。',\n        '     摆完，盘上那一串马就是一条最短路线本身。',\n        '     整趟搜索里盘上一直有东西在长 —— 长的是波纹（mark），不是棋子：',\n        '     BFS 里没有任何一匹马在走路，它是同时向所有方向铺开的。 */',\n      ],\n      en: [\n        '  /* Rebuild the route backwards: follow prev from the target square back to the',\n        '     start, dropping a knight on every square passed. That string of knights is one',\n        '     shortest route. Something grew on the board all through the search — ripples',\n        '     (mark), not pieces: no knight walks in BFS, it spreads every way at once. */',\n      ],\n    },\n    '  let at = TARGET;',\n    '  for (let i = 0; i <= steps; i = i + 1) {',\n    '    place(at, \"wN\");',\n    '    at = prev[at];',\n    '  }',\n    {\n      zh: ['  log(\"最短 \" + steps + \" 步（盘上那串马就是其中一条走法）\");'],\n      en: ['  log(\"Fewest moves: \" + steps + \" (the knights on the board are one such route)\");'],\n    },\n    '}',\n    'return steps;',\n  ];\n\n  /* source({ W, start, target, lang }) → string\n\n     四个参数都不给默认值，缺了直接抛（阶段 5 约束 6：公开导出的省略参数已经\n     是本仓库抓到过五次的缺陷类）。一个默默变成 8 的 W 会让界面写着 6、跑的却是\n     8，正是这个工具最不能出的错。\n\n     **自身那三个参数的校验仍在最前，`lang` 由 render() 在最后校验**，而这个\n     顺序**是有门守着的**：`knight-path.test.js` 的「缺参数当场抛」那一组\n     **一个 lang 都不传**，并且每条都带第三参 pattern（`/少了 W/`、\n     `/start 必须是/` …）。把 lang 的校验挪到 W 前面来，那一组当场红 ——\n     撞上的会变成「少了 lang」，pattern 对不上。\n\n     ⚠ 这一段先前写的是「既有的 `T.throws(…, /少了 W/)` 一类调用点一行都不用\n     动」，那句话**两处都是假的**：本次改动恰恰改了那三行；而且当时那三条\n     `throws` 的第三参是空的，`/少了 W/` 这个调用点在本仓根本不存在，退化成\n     「抛了就算过」。审查的突变 M10（把 lang 校验提到最前）因此 77 + 175 条\n     断言全绿。补上第三参、并把 lang 从那一组里撤掉之后，M10 才真的会红。\n\n     校验只管「是不是合法的棋盘和格子」，**不管到不到得了** —— 见文件头：\n     2×2 上到不了恰恰是要生成出来跑给她看的。 */\n  function source(opts) {\n    const o = opts || {};\n    if (o.W === undefined || o.W === null) {\n      throw new Error('source({ W, start, target }) 少了 W —— 棋盘边长没有默认值，必须写明');\n    }\n    if (o.start === undefined || o.start === null) {\n      throw new Error('source({ W, start, target }) 少了 start —— 出发格没有默认值，必须写明');\n    }\n    if (o.target === undefined || o.target === null) {\n      throw new Error('source({ W, start, target }) 少了 target —— 目标格没有默认值，必须写明');\n    }\n    const W = o.W, start = o.start, target = o.target;\n    if (typeof W !== 'number' || !isFinite(W) || Math.floor(W) !== W || W < 1) {\n      throw new Error('W 必须是 >= 1 的整数，收到：' + W);\n    }\n    if (typeof start !== 'number' || !isFinite(start) || Math.floor(start) !== start ||\n        start < 0 || start >= W * W) {\n      throw new Error('start 必须是 0 到 ' + (W * W - 1) + ' 之间的整数，收到：' + start);\n    }\n    if (typeof target !== 'number' || !isFinite(target) || Math.floor(target) !== target ||\n        target < 0 || target >= W * W) {\n      throw new Error('target 必须是 0 到 ' + (W * W - 1) + ' 之间的整数，收到：' + target);\n    }\n    return render(HEAD, o.lang)\n      .concat([\n        'const W = ' + W + ';',\n        'const START = ' + start + ';',\n        'const TARGET = ' + target + ';',\n      ])\n      .concat(render(BODY, o.lang))\n      .join('\\n');\n  }\n\n  return { source: source };\n});\n",
  'rook-cover.js': "/* 带障碍盘上的**二分图最大匹配**（行段 × 列段）的算法源码生成器（规格 §2.1）。\n   零依赖；node 与浏览器双用。编辑源，运行时被内联进 tools/*.html。\n\n   跟 `queens.js` / `knight-path.js` / `tour-*.js` / `minimax.js` 是同一个形状：\n   这个模块本身不算任何东西 —— 它吐出一段**字符串**。那段字符串同时是喂给\n   `Interp.run` 去真跑的程序、和喂给 `Editor.mount` 摆在使用者眼前的那份源码。\n   一份字符串两个用途，所以「看到的」和「跑的」不可能漂移。\n\n   **生成出来的那段源码里的注释和命名，是写给一个没学过棋的 16 岁读者的**。\n   本文件自己的注释（就是你正在读的这些）是给维护者的，两套读者，两种口吻。\n\n   ---- ⚠ 题面订正：这一段是本文件最重要的一条 ----\n\n   任务简报（`.superpowers/sdd/2026-08-05-chess-phase7-cover-dominate/task-2-brief.md`）\n   给的题面是「**用最少的车覆盖所有空格**，最大匹配 = 最少的车数」。\n   **后半句不成立**，而且不是边角情形 —— 四档盘里有三档都是反例：\n\n     5×5 `[3,14,17,18,21]`   最大匹配 7，**4 辆车就盖满了**（0, 9, 11, 24）\n     6×6 `[0,6,8,9,14,...]`  最大匹配 7，**5 辆车就盖满了**（1, 4, 12, 15, 35）\n     6×7 `[4,6,7,8,26,...]`  最大匹配 9，**5 辆车就盖满了**（3, 17, 22, 24, 38）\n\n   （四组落子都用「沿行/列走射线、撞障碍就停」独立验过，一个空格都不漏。\n   审查另写了一份与匹配无关的求解器复核过，并在 60 块随机小盘上量到\n   **49 块的最少车数严格更小、反向一次都没有** —— 不是边角失误，是几乎\n   每块有障碍的盘上都对不上。）\n\n   漏在哪里：一辆车站的是一个**格子**，而格子是二分图里的一条**边** —— 它一次\n   占住两个点（一个行段 + 一个列段）。所以 k 辆车能点亮的点数最多是 2k，\n   「最少的车数」是 min over 点覆盖 V 的 (|V| − V 内部的最大匹配)，不是 |V| 本身。\n   最小的反例只有 2×2：障碍放在 (0,1)，最大匹配 2，而 1 号格上摆一辆车就盖满了\n   剩下三格。（König 给的是「最少的**线**」，不是「最少的**车**」；带障碍的车支配\n   问题本身是另一路难题，不是匹配能解的。）\n\n   **本文件按「最大匹配」实现**，因为简报的四档盘、判据 `k < min(行段数, 列段数)`、\n   增广路的画法、四个 `mark` 种类，全都是围着最大匹配设计的，而且四档的\n   **5 / 6 / 7 / 9 与简报表逐格对上**（rook-cover.test.js 拿一份独立的匈牙利实现对拍）。\n   改掉的只有**说法**。生成源码的 HEAD 里只写两句站得住的话，两句都恰好等于最大匹配：\n\n     ① 最多能摆几辆**互相吃不到**的车？（这是它在棋盘上的原生说法）\n     ② 要盖住每一个空格，最少要点亮几条**线**（行段或列段）？（König 的另一半）\n\n   算完之后盘上那些车**顺手也盖住了每一个空格**（最大匹配一定是极大匹配，\n   于是任一空格的行段或列段上必有一辆车），这一条是真的、也验了 ——\n   只是「顺手盖住」不等于「最少」。Task 3 的页面文案与规格 §4 的题面都要照这个改，\n   否则工具会在**它自己的第二档盘上**教一件错事。\n\n   ---- 几处必须写下来的约定 ----\n\n   · **入口函数叫 `walk`**（对应将来 `PROBLEMS.rookCover.entry`）。它是**递归**\n     那一个：`walk(r)` = 给第 r 个行段找一个列段坐下，找不到就去请占着位子的\n     行段挪窝 —— 那一串「请人挪窝」就是增广路，**递归深度 = 增广路的长度**。\n     顶层是 `for (r) { if (walk(r)) rooks++ } return rooks;`，\n     所以 `run().result` 就是最大匹配数。`TreeModel.build(trace, 'walk')`\n     认到的帧因此一层套一层，深度塔（§1.4「z 轴 = 入口函数的递归深度」）\n     正好是「这条增广路走了几个来回」。\n\n   · **`walk` 是两趟扫描，不是一趟**（先贪心找空位，再递归请人挪窝）。这不是\n     优化，是**第一档盘的整个教学点**：空盘上每个行段第一趟就找到空列段，\n     `back` 一次都不出现、增广路最深只有 1 层 —— 「匹配根本没上场，这就是\n     为什么这道题必须有障碍」看一眼就知道。一趟版的 Kuhn 算法在 5×5 空盘上\n     会让车互相挪窝（实测第一档就出现 back），那个对照就没了。\n     两趟版仍是精确的匈牙利算法：第一趟找长度 1 的增广路，第二趟找其余的，\n     `asked` 访问集照旧。（第二趟里 `takenBy[c] < 0` 的分支不必再写：\n     第一趟没返回就说明这一段上每个列段都被占着，而列段一旦被占就再没空过。）\n\n   · **格子编号 `sq = 行 * W + 列`**，行 0 在棋盘最下面、列 0 在最左边，\n     于是 0 号格是 a1 —— 跟 `queens.js` / `knight-path.js` / `tour-*.js`、\n     `BoardRender.layout()` 的 `squareCenter(file, rank)`、`chess-core.js` 的\n     `SQ(file, rank)` 同向。反推是 `列 = sq % W; 行 = (sq - 列) / W`。\n     **这一题的盘可以不是正方形**（`W` 与 `H` 分开给），因为四档里有一档是 6×7。\n\n   · **宿主桥接**：`mark(sq, kind)` 四种全用上，而且四种在这一题里各有各的实义：\n       'try'  正在试这一格\n       'ok'   这一格进了匹配 —— 紧跟着 `place(sq, \"wR\")`，盘上真站一辆车\n       'cut'  这条路走不通（列段这一趟问过了，或者占着它的那位挪不动）\n       'back' 一辆车被请下来挪窝 —— 紧跟着 `clear(sq)`，跟 `queens.js` 同一个\n              两步节奏：先看到「它退下来了」，下一步它整个消失。\n     **`'back'` 在这一题里的意思跟 N 皇后不一样**：N 皇后是「这条支路错了，\n     撤销」；这里是「这辆车没错，只是把位子让给别人，它自己已经在别处站好了」。\n     `back` 的那一格在**上一步**才刚刚被 `ok` 过 —— 增广路推进的样子就是这个。\n     实测 `ok − back = 最后站住的车数`（测试里有这条断言）。\n\n   · **`place(sq, \"wR\")` 是「数字格子 + 字符串棋子」**，跟 `queens.js` 的 `\"wQ\"`、\n     `knight-path.js` 的 `\"wN\"` 同一个约定。`BoardRender.drawPiece` 吃的是**数字**\n     code，'wR' → 4 的换算归页面做（见 `queens.js` 文件头那一整段，含仓库里\n     `tools/_debugger-preview.html` 那个两个参数正好相反的反例）。\n\n   · **最小点覆盖（König 的那些条带）由显示层从轨迹里推**，源码只负责 `mark` ——\n     算法里一句显示层的话都没有，**而且不需要为它加一句**。\n\n     怎么推（这条是实测结论，写在这里免得下一个人再去推一遍）：\n     **一次失败的顶层 `walk(r)` 本身就是 König 要的那趟交替搜索**。它问过的\n     列段（源码里的 `asked`）正是可达集 Z_col；一旦某个行段失败，它的可达集\n     就冻结了（标准引理）。于是：\n       Z_col = 所有**失败的**顶层 `walk` 问过的列段之并\n       Z_row = 那些帧里碰过的行段之并（含失败的根自己）\n       最小点覆盖 = （不在 Z_row 里的行段）∪（在 Z_col 里的列段），大小恰好 = k\n     从解释器轨迹这一侧读也一样：扫 `depth === 1` 的 `walk` 进出帧，**帧内没有\n     `place` 的就是失败帧**，取它 `mark` 过的每一格的 `rowSe
