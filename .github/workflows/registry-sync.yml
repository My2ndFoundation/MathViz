name: registry sync

# 兜底：即使有人没执行 `git config core.hooksPath .githooks`，
# 注册表镜像不同步也进不了 main。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 这道门扫的是 git ls-files 的**全部** html，所以「新加了一页但忘了铺 favicon」
      # 会在这里被抓住——而不是等到有人在浏览器里看见一个空白标签页图标。
      #
      # 它**不装 pillow/numpy、也不重新派生**。第一版装了、也派生了，结果 CI 上 107 个
      # 页面全部报不同步而本机全绿：比的是 PNG 的压缩字节，而那取决于 pillow/zlib 的
      # 版本，不是像素的函数。现在只比字符串——页面 vs docs/brand-assets.json——外加
      # 一条 docs/logo.png 的 sha256，用来抓「换了源图却没重新生成」。
      # 哈希输入，比较已提交的输出。
      - name: 品牌资产与 docs/brand-assets.json 同步
        run: python3 scripts/apply_branding.py --check

      # 与品牌资产那道门同样的分工：钩子只在脚本被改时重铺，而这里扫的是
      # git ls-files 的**全部** html——所以「新加了一页但忘了铺版权署名」会在
      # 这里被抓住，而不是等到有人在页面底部发现少了一行。零依赖，不装任何包。
      - name: 版权署名与 apply_footer.py 同步
        run: python3 scripts/apply_footer.py --check

      - name: tools.json 是合法 JSON
        run: python3 -c "import json; json.load(open('tools.json')); print('tools.json OK')"

      - name: 注册表镜像与 tools.json 同步
        run: python3 scripts/sync_registry.py --check

      # 抽出的内联脚本要写进带 .js 后缀的真实文件再交给 node：
      # 直接 `node --check /dev/stdin` 在较新的 Node 上会因为无法从无后缀的管道
      # 推断模块类型而整体失败（本地 v25 能过、CI 全挂就是这么来的）。
      # 也不要吞掉 stderr，否则真正的报错会被藏起来。
      # python/ 的三类页面也在这个循环里：chess / cryptography 的页面由它们各自的
      # check.py 自带语法门，python 的 check.py 同样有——但根目录这一道扫的是**页面
      # 清单**而不是子项目内部，把 python 的两个导航页与工具页加进来，等于多一层
      # 与子项目脚本无关的兜底。加的是三个 glob，不是「python 的全部 html」：
      # python/ 下将来还会有别的东西，写死这三类才不会在某天悄悄少扫一页。
      - name: 内联脚本语法门（app.html / index.html / 全部工具 / python 导航页与工具页）
        run: |
          fail=0
          tmp="$(mktemp -d)"
          for f in app.html index.html outputs/*.html \
                   python/app.html python/index.html python/tools/*.html; do
            out="$tmp/$(echo "$f" | tr '/' '_').js"
            awk '/<script>/{f=1;next}/<\/script>/{f=0}f' "$f" > "$out"
            if ! node --check "$out"; then
              echo "::error file=$f::内联脚本语法检查未通过"
              fail=1
            fi
          done
          rm -rf "$tmp"
          if [ "$fail" -eq 0 ]; then
            echo "语法门通过：$(ls outputs/*.html | wc -l | tr -d ' ') 个工具 + app.html + index.html" \
                 "+ python 导航页 2 个 + python 工具页 $(ls python/tools/*.html | wc -l | tr -d ' ') 个"
          fi
          exit $fail

      - name: chess subproject gates
        run: |
          python3 chess/scripts/check.py

      # ⚠ GitHub Actions 跑的是**被测分支自己的** workflow 文件。这一步是随
      # cryptography 子项目一起加进来的，所以只有在它之后切出的分支才会跑到
      # 它——比这次改动更早切出的分支不会。本仓记过同类的事（一道防漂移的门
      # 合进来之后，下一个 PR 因为分支早于它而完全没跑）。
      - name: cryptography subproject gates
        run: |
          python3 cryptography/scripts/check.py

      # 同上那条警告：这一步随 python 子项目一起加进来，比它更早切出的分支不会跑到。
      - name: python subproject gates
        run: |
          python3 python/scripts/check.py

      # 导航契约（C1 / C3 / C4 / C5 / C6 / C7 / C8）。六个导航页之间没有一行共享
      # 代码——三个壳各自独立，所以「同一个行为落在全部子项目上」只能靠跨页比对。
      # 契约文档 docs/superpowers/subproject-nav-contract.md 里 C4–C8 五条曾经整整
      # 一份文档都写着「无机械门」，这一步就是那笔债。
      - name: 导航契约（六个导航页）
        run: |
          python3 scripts/check_nav_contract.py
