name: registry sync

# 兜底：即使有人没执行 `git config core.hooksPath .githooks`，
# 注册表镜像不同步也进不了 main。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # apply_branding.py --check 要用 pillow / numpy 从 docs/logo.png 重新派生标记，
      # 再跟每一页里内联的 base64 逐字节比。装依赖只为这一道门，够便宜。
      - name: 品牌派生的依赖
        run: python3 -m pip install --quiet pillow numpy

      # 这道门扫的是 git ls-files 的**全部** html，所以「新加了一页但忘了铺 favicon」
      # 会在这里被抓住——而不是等到有人在浏览器里看见一个空白标签页图标。
      - name: 品牌资产与 docs/logo.png 同步
        run: python3 scripts/apply_branding.py --check

      - name: tools.json 是合法 JSON
        run: python3 -c "import json; json.load(open('tools.json')); print('tools.json OK')"

      - name: 注册表镜像与 tools.json 同步
        run: python3 scripts/sync_registry.py --check

      # 抽出的内联脚本要写进带 .js 后缀的真实文件再交给 node：
      # 直接 `node --check /dev/stdin` 在较新的 Node 上会因为无法从无后缀的管道
      # 推断模块类型而整体失败（本地 v25 能过、CI 全挂就是这么来的）。
      # 也不要吞掉 stderr，否则真正的报错会被藏起来。
      - name: 内联脚本语法门（app.html / index.html / 全部工具）
        run: |
          fail=0
          tmp="$(mktemp -d)"
          for f in app.html index.html outputs/*.html; do
            out="$tmp/$(echo "$f" | tr '/' '_').js"
            awk '/<script>/{f=1;next}/<\/script>/{f=0}f' "$f" > "$out"
            if ! node --check "$out"; then
              echo "::error file=$f::内联脚本语法检查未通过"
              fail=1
            fi
          done
          rm -rf "$tmp"
          if [ "$fail" -eq 0 ]; then
            echo "语法门通过：$(ls outputs/*.html | wc -l | tr -d ' ') 个工具 + app.html + index.html"
          fi
          exit $fail

      - name: chess subproject gates
        run: |
          python3 chess/scripts/check.py

      # ⚠ GitHub Actions 跑的是**被测分支自己的** workflow 文件。这一步是随
      # cryptography 子项目一起加进来的，所以只有在它之后切出的分支才会跑到
      # 它——比这次改动更早切出的分支不会。本仓记过同类的事（一道防漂移的门
      # 合进来之后，下一个 PR 因为分支早于它而完全没跑）。
      - name: cryptography subproject gates
        run: |
          python3 cryptography/scripts/check.py
